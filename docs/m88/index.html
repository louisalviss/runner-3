<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>M88 Live Odds</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d10;--card:#12151a;--line:#252a32;--muted:#8c96a5;--text:#f2f5f8;--good:#55d187;--accent:#ffb14a;--chip:#1b2027}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    .wrap{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 12px calc(28px + env(safe-area-inset-bottom))}
    header{position:sticky;top:0;z-index:5;background:rgba(11,13,16,.92);backdrop-filter:blur(16px);padding:14px 2px 10px;border-bottom:1px solid rgba(255,255,255,.04)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:21px;font-weight:780;letter-spacing:-.02em}.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#666}.dot.ok{background:var(--good);box-shadow:0 0 0 4px rgba(85,209,135,.09)}
    .sub{font-size:12px;color:var(--muted);margin-top:4px}.controls{display:flex;gap:8px;margin-top:12px}.controls input{min-width:0;flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:15px;padding:10px 12px;outline:none}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 13px;font-weight:650;font-size:14px}
    .summary{display:flex;gap:8px;margin:12px 0;overflow:auto}.pill{white-space:nowrap;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;color:#c7ced8}.pill b{color:#fff}
    .league{margin:18px 2px 8px;color:#aeb7c4;font-size:12px;font-weight:720;text-transform:uppercase;letter-spacing:.045em}
    .match{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px}.matchhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.teams{font-size:15px;font-weight:700;line-height:1.35}.live{white-space:nowrap;font-size:11px;font-weight:760;color:var(--good);background:rgba(85,209,135,.09);padding:5px 7px;border-radius:8px}.score{font-size:12px;color:var(--muted);margin-top:4px}
    .markets{display:grid;grid-template-columns:1fr;gap:8px;margin-top:11px}.market{background:#0e1115;border:1px solid #20252c;border-radius:12px;padding:9px}.markettitle{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:7px}.line{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:5px}.line.two{grid-template-columns:1fr 1fr}.odd{background:var(--chip);border-radius:8px;padding:7px 6px;text-align:center;font-size:12px}.odd .sel{display:block;color:var(--muted);font-size:10px;margin-bottom:2px}.odd b{font-size:14px;color:#fff}.handicap{font-size:11px;color:var(--accent);margin-bottom:2px}
    .empty,.error{padding:32px 14px;text-align:center;color:var(--muted);line-height:1.5}.error{color:#ff8f8f}.foot{text-align:center;color:#687281;font-size:11px;margin-top:22px}.hidden{display:none!important}
    @media(min-width:620px){.markets{grid-template-columns:1fr 1fr}.match{padding:15px}}
  </style>
</head>
<body><div class="wrap">
<header>
  <div class="top"><div class="title">M88 Live Odds</div><div class="status"><span id="dot" class="dot"></span><span id="state">Loading</span></div></div>
  <div class="sub" id="updated">Waiting for first snapshot…</div>
  <div class="controls"><input id="search" type="search" placeholder="Search team / league" autocomplete="off"/><button class="btn" id="refresh">Refresh</button></div>
</header>
<div class="summary"><span class="pill"><b id="count">0</b> real live matches</span><span class="pill">Auto-check <b>30s</b></span><span class="pill">Feed refresh ~<b>5m</b></span></div>
<main id="app"><div class="empty">Loading latest M88 snapshot…</div></main>
<div class="foot">Public guest odds snapshot · Virtual / PES / eSoccer hidden by default</div>
</div>
<script>
const DATA='https://raw.githack.com/louisalviss/runner-3/m88-live-data/data.json';
const $=s=>document.querySelector(s); let all=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtTime(iso){try{return new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit'}).format(new Date(iso))+' VN'}catch{return iso}}
function isVirtual(m){const s=((m.league||'')+' '+(m.home||'')+' '+(m.away||'')).toLowerCase();return /virtual|esoccer|e-soccer|pes\s?\d|simulated|cyber/.test(s)}
function price(o){return o&&o.value!=null?Number(o.value).toFixed(2):'—'}
function marketBlock(title, lines, type){if(!lines?.length)return'';return `<div class="market"><div class="markettitle">${title}</div>${lines.slice(0,3).map(l=>{const ps=l.prices||[];const h=l.handicap??l.line??l.points??l.selection_line??'';const cls=ps.length===2?'line two':'line';return `<div>${h!==''?`<div class="handicap">Line ${esc(h)}</div>`:''}<div class="${cls}">${ps.map(p=>`<div class="odd"><span class="sel">${esc(p.selection)}</span><b>${price(p)}</b></div>`).join('')}</div></div>`}).join('')}</div>`}
function card(m){const mk=m.markets||{};const score=(m.home_score||m.away_score)?`${esc(m.home_score||'0')} : ${esc(m.away_score||'0')}`:'';return `<article class="match"><div class="matchhead"><div><div class="teams">${esc(m.home)} <span style="color:#596372">vs</span> ${esc(m.away)}</div><div class="score">${score}${score?' · ':''}${esc(m.live_timer||'Live')}</div></div><div class="live">LIVE ${esc(m.live_timer||'')}</div></div><div class="markets">${marketBlock('FT Asian Handicap',mk.ft_asian_handicap,'ah')}${marketBlock('FT Over / Under',mk.ft_over_under,'ou')}${marketBlock('FT 1X2',mk.ft_1x2,'1x2')}${marketBlock('1H Asian Handicap',mk.fh_asian_handicap,'ah')}</div></article>`}
function render(){const q=$('#search').value.trim().toLowerCase();const rows=all.filter(m=>!isVirtual(m)).filter(m=>!q||((m.league||'')+' '+m.home+' '+m.away).toLowerCase().includes(q));$('#count').textContent=rows.length;if(!rows.length){$('#app').innerHTML='<div class="empty">No matching real live games in this snapshot.</div>';return}let html='',last='';for(const m of rows){if(m.league!==last){last=m.league;html+=`<div class="league">${esc(last||'Other')}</div>`}html+=card(m)}$('#app').innerHTML=html}
async function load(){try{$('#state').textContent='Updating';$('#dot').className='dot';const r=await fetch(DATA+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();all=(d.matches||[]).filter(m=>m.scope==='live'&&(String(m.is_live)==='1'||m.live_timer));$('#updated').textContent='Snapshot: '+fmtTime(d.generated_at||d.published_at);$('#state').textContent='Live';$('#dot').className='dot ok';render()}catch(e){$('#state').textContent='Feed unavailable';$('#dot').className='dot';if(!all.length)$('#app').innerHTML='<div class="error">Latest snapshot is not published yet. Tap Refresh in a moment.</div>';console.error(e)}}
$('#search').addEventListener('input',render);$('#refresh').addEventListener('click',load);load();setInterval(load,30000);
</script></body></html>
