services:
  - type: web
    name: runner3-wordpress
    runtime: docker
    plan: free
    region: singapore
    rootDir: wordpress-site
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /wp-login.php
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: runner3-wordpress-db
          property: connectionString

databases:
  - name: runner3-wordpress-db
    plan: free
    region: singapore
    postgresMajorVersion: "14"
    databaseName: runner3wp
    user: runner3wp
