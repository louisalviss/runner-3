name: WR Close Confirm Core Diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - 'wave-rider-verify/wr_close_confirm_core_diag.py'
      - 'wave-rider-verify/wr_close_confirm_compare.py'
      - '.github/workflows/wr-close-confirm-core-diag.yml'
permissions:
  contents: read
  actions: read
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - run: curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
      - name: Run 10m close-confirm shard
        env:
          TF_MIN: 10
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
          BASE_DIR: /tmp/base
          OUT_DIR: /tmp/out
        run: python3 wave-rider-verify/wr_close_confirm_core_diag.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-close-confirm-shard-${{ matrix.shard }}
          path: /tmp/out
          retention-days: 7
  compare:
    needs: shard
    if: always() && needs.shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wr-close-confirm-shard-*
          path: /tmp/all
          merge-multiple: true
      - name: Download frozen baseline 10m artifact
        uses: actions/download-artifact@v4
        with:
          name: wr2515-phase1-10m-final
          path: /tmp/base10
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32237685245
      - name: Compare baseline vs close-confirm and portfolio-normalize
        run: python3 wave-rider-verify/wr_close_confirm_compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr-close-confirm-core-diag-final
          path: /tmp/final
          retention-days: 14
