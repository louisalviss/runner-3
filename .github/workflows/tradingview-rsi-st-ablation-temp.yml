name: TradingView RSI ST Ablation Temp
# optimized representative Monte Carlo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tradingview-rsi-st-ablation-temp.yml']
permissions:
  contents: write
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run component ablation and cross-equity validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pandas numpy websocket-client requests
          git clone -q --depth 1 https://github.com/rongardF/tvDatafeed.git /tmp/tvDatafeed
          OUT='evidence/rsi-supertrend-ablation'
          rm -rf "$OUT" && mkdir -p "$OUT"
          PYTHONPATH=/tmp/tvDatafeed OUT="$OUT" python3 - <<'PY'
          import os,json,numpy as np,pandas as pd
          from pathlib import Path
          from tvDatafeed import TvDatafeed,Interval
          OUT=Path(os.environ['OUT']); tv=TvDatafeed(); RNG=np.random.default_rng(20260825)
          def rma(s,n):
            a=np.asarray(s,float); y=np.full(len(a),np.nan); vals=[]; start=None
            for i,v in enumerate(a):
              if np.isfinite(v): vals.append(v)
              if len(vals)==n: start=i; y[i]=np.mean([a[j] for j in vals[-n:]]); break
            if start is None:return pd.Series(y)
            for i in range(start+1,len(a)): y[i]=((n-1)*y[i-1]+a[i])/n if np.isfinite(a[i]) else y[i-1]
            return pd.Series(y)
          def feat(d):
            c=d.close; ch=c.diff(); up=rma(np.maximum(ch,0),10); dn=rma(np.maximum(-ch,0),10); r=pd.Series(np.where(dn==0,100,np.where(up==0,0,100-100/(1+up/dn))))
            ma=r.rolling(10,min_periods=10).mean(); cross=((r>ma)&(r.shift(1)<=ma.shift(1))).fillna(False).to_numpy(bool); first=np.zeros(len(d),bool); second=np.zeros(len(d),bool);cnt=0
            for i in range(len(d)):
              if np.isfinite(r.iloc[i]) and r.iloc[i]>50:cnt=0
              if cross[i] and r.iloc[i]<50:
                cnt+=1
                if cnt==1:first[i]=True
                if cnt==2:second[i]=True;cnt=0
            pc=c.shift(1); tr=pd.concat([(d.high-d.low).abs(),(d.high-pc).abs(),(d.low-pc).abs()],axis=1).max(axis=1); atr=rma(tr,10); hl2=(d.high+d.low)/2; bu=hl2+2.5*atr; bl=hl2-2.5*atr
            ub=np.full(len(d),np.nan);lb=np.full(len(d),np.nan);st=np.full(len(d),np.nan);di=np.full(len(d),np.nan)
            for i in range(len(d)):
              if not np.isfinite(atr.iloc[i]):continue
              if i==0 or not np.isfinite(ub[i-1]):ub[i]=bu.iloc[i];lb[i]=bl.iloc[i];di[i]=1;st[i]=ub[i];continue
              ub[i]=bu.iloc[i] if bu.iloc[i]<ub[i-1] or c.iloc[i-1]>ub[i-1] else ub[i-1]; lb[i]=bl.iloc[i] if bl.iloc[i]>lb[i-1] or c.iloc[i-1]<lb[i-1] else lb[i-1]
              di[i]=(-1 if c.iloc[i]>ub[i] else 1) if np.isclose(st[i-1],ub[i-1]) else (1 if c.iloc[i]<lb[i] else -1); st[i]=lb[i] if di[i]<0 else ub[i]
            return {'rsi':r.to_numpy(),'first':first,'second':second,'st_bear':np.r_[False,np.diff(di)>0],'st_bull':np.r_[False,np.diff(di)<0],'rsi50':(r>50).fillna(False).to_numpy(bool)}
          def bt(d,buy,kind,f,bps=10,hold=20):
            o=d.open.to_numpy(float);cl=d.close.to_numpy(float);cost=bps/10000.;eq=10000.;qty=0.;entry=0.;basis=0.;ei=-1;pending=0;pnls=[];rets=[];curve=[];expo=0
            for i in range(len(d)):
              if pending==-1 and qty>0:
                px=o[i]*(1-cost);pro=qty*px;pnls.append(pro-basis);rets.append(px/entry-1);eq=pro;qty=0.;ei=-1
              elif pending==1 and qty==0:
                px=o[i]*(1+cost);basis=eq;qty=eq/px;entry=px;ei=i
              pending=0
              if qty>0:
                x=(f['st_bear'][i] if kind=='st' else f['rsi50'][i] if kind=='rsi50' else (i-ei)>=hold)
                if x:pending=-1
              elif buy[i]:pending=1
              curve.append(eq if qty==0 else qty*cl[i]);expo+=qty>0
            if qty>0:
              px=cl[-1]*(1-cost);pro=qty*px;pnls.append(pro-basis);rets.append(px/entry-1);eq=pro;curve[-1]=eq
            wins=[x for x in pnls if x>0];loss=[x for x in pnls if x<0];gp=sum(wins);gl=-sum(loss);arr=np.asarray(curve);pk=np.maximum.accumulate(arr);dd=arr/pk-1
            return {'trades':len(pnls),'win_rate':100*len(wins)/len(pnls) if pnls else 0,'pf':gp/gl if gl else (999. if gp else 0.),'return_pct':100*(eq/10000-1),'max_dd_pct':100*dd.min(),'exposure_pct':100*expo/len(d),'avg_trade_pct':100*np.mean(rets) if rets else 0}
          def randdist(d,f,n,eligible,reps=60):
            cand=np.flatnonzero(eligible & np.isfinite(f['rsi']));n=min(n,len(cand));vals=[]
            if n<5:return None
            for _ in range(reps):
              b=np.zeros(len(d),bool);b[RNG.choice(cand,size=n,replace=False)]=True;vals.append(bt(d,b,'st',f))
            return {'reps':reps,'signals':n,'return_med':float(np.median([x['return_pct'] for x in vals])),'return_p95':float(np.percentile([x['return_pct'] for x in vals],95)),'pf_med':float(np.median([x['pf'] for x in vals])),'pf_p95':float(np.percentile([x['pf'] for x in vals],95))}
          specs=[('XU100','BIST_DLY'),('THYAO','BIST'),('GARAN','BIST'),('ASELS','BIST'),('BIMAS','BIST'),('TUPRS','BIST'),('SPY','AMEX'),('QQQ','NASDAQ'),('AAPL','NASDAQ'),('MSFT','NASDAQ'),('NVDA','NASDAQ'),('AMZN','NASDAQ'),('TSLA','NASDAQ')]
          ints=[('4h',Interval.in_4_hour),('1h',Interval.in_1_hour)]; reps={'XU100','THYAO','SPY','AAPL'};rows=[];random=[];meta=[]
          for sym,ex in specs:
            for inn,iv in ints:
              try:d=tv.get_hist(sym,ex,iv,n_bars=5000,extended_session=False)
              except Exception as e:meta.append({'symbol':sym,'exchange':ex,'interval':inn,'error':repr(e)});continue
              if d is None or len(d)<500:meta.append({'symbol':sym,'exchange':ex,'interval':inn,'rows':0 if d is None else len(d)});continue
              d=d.reset_index();d['datetime']=pd.to_datetime(d.datetime);f=feat(d);meta.append({'symbol':sym,'exchange':ex,'interval':inn,'rows':len(d),'start':str(d.datetime.iloc[0]),'end':str(d.datetime.iloc[-1]),'second_signals':int(f['second'].sum())})
              for name,buy,kind,h in [('E2_ST',f['second'],'st',20),('E1_ST',f['first'],'st',20),('ST_ONLY',f['st_bull'],'st',20),('E2_TIME20',f['second'],'time',20),('E2_RSI50',f['second'],'rsi50',20)]:rows.append({'symbol':sym,'exchange':ex,'interval':inn,'variant':name,'bps_side':10,**bt(d,buy,kind,f,10,h)})
              if sym in reps:
                allok=np.ones(len(d),bool);lt50=np.isfinite(f['rsi'])&(f['rsi']<50)
                for bn,elig in [('RAND_ALL_ST',allok),('RAND_RSI_LT50_ST',lt50)]:
                  z=randdist(d,f,int(f['second'].sum()),elig,60)
                  if z:random.append({'symbol':sym,'exchange':ex,'interval':inn,'baseline':bn,**z})
          R=pd.DataFrame(rows);Z=pd.DataFrame(random);R.to_csv(OUT/'ablation.csv',index=False);Z.to_csv(OUT/'random_baselines.csv',index=False)
          summary=[]
          for inn in ['4h','1h']:
            q=R[(R.interval==inn)&(R.variant=='E2_ST')];summary.append({'interval':inn,'assets':len(q),'pf_gt_1':int((q.pf>1).sum()),'pf_gt_1_25':int((q.pf>1.25).sum()),'median_pf':float(q.pf.median()) if len(q) else None,'median_return':float(q.return_pct.median()) if len(q) else None})
          (OUT/'results.json').write_text(json.dumps({'meta':meta,'ablation':rows,'random':random,'summary':summary},indent=2),encoding='utf-8');(OUT/'decision_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(pd.DataFrame(summary).to_string(index=False));print(R[R.variant.isin(['E2_ST','E1_ST','ST_ONLY'])][['symbol','exchange','interval','variant','trades','win_rate','pf','return_pct','max_dd_pct']].round(2).to_string(index=False));print(Z.round(2).to_string(index=False))
          PY
      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/rsi-supertrend-ablation || true
          git commit -m 'Publish RSI SuperTrend component ablation [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main || true
