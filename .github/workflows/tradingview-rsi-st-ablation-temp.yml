name: TradingView RSI ST Ablation Temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tradingview-rsi-st-ablation-temp.yml']
permissions:
  contents: write
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run component ablation and cross-equity validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pandas numpy websocket-client requests
          git clone -q --depth 1 https://github.com/rongardF/tvDatafeed.git /tmp/tvDatafeed
          OUT='evidence/rsi-supertrend-ablation'
          rm -rf "$OUT" && mkdir -p "$OUT"
          PYTHONPATH=/tmp/tvDatafeed OUT="$OUT" python3 - <<'PY'
          import os, json, math
          from pathlib import Path
          import numpy as np, pandas as pd
          from tvDatafeed import TvDatafeed, Interval

          OUT=Path(os.environ['OUT']); tv=TvDatafeed(); RNG=np.random.default_rng(20260825)

          def rma(s,n):
              a=np.asarray(s,float); y=np.full(len(a),np.nan); valid=[]; start=None
              for i,v in enumerate(a):
                  if np.isfinite(v): valid.append(v)
                  if len(valid)==n:
                      start=i; y[i]=np.mean([a[j] for j in valid[-n:]]); break
              if start is None: return pd.Series(y)
              for i in range(start+1,len(a)):
                  v=a[i]; y[i]=((n-1)*y[i-1]+v)/n if np.isfinite(v) else y[i-1]
              return pd.Series(y)

          def features(d):
              ch=d.close.diff(); up=rma(np.maximum(ch,0),10); dn=rma(np.maximum(-ch,0),10)
              r=pd.Series(np.where(dn==0,100,np.where(up==0,0,100-100/(1+up/dn))))
              ma=r.rolling(10,min_periods=10).mean(); cross=((r>ma)&(r.shift(1)<=ma.shift(1))).fillna(False).to_numpy(bool)
              first=np.zeros(len(d),bool); second=np.zeros(len(d),bool); count=0
              for i in range(len(d)):
                  if np.isfinite(r.iloc[i]) and r.iloc[i]>50: count=0
                  if cross[i] and r.iloc[i]<50:
                      count += 1
                      if count==1: first[i]=True
                      if count==2: second[i]=True; count=0
              pc=d.close.shift(1); tr=pd.concat([(d.high-d.low).abs(),(d.high-pc).abs(),(d.low-pc).abs()],axis=1).max(axis=1)
              atr=rma(tr,10); hl2=(d.high+d.low)/2; bu=hl2+2.5*atr; bl=hl2-2.5*atr
              ub=np.full(len(d),np.nan); lb=np.full(len(d),np.nan); st=np.full(len(d),np.nan); di=np.full(len(d),np.nan)
              for i in range(len(d)):
                  if not np.isfinite(atr.iloc[i]): continue
                  if i==0 or not np.isfinite(ub[i-1]): ub[i]=bu.iloc[i]; lb[i]=bl.iloc[i]; di[i]=1; st[i]=ub[i]; continue
                  ub[i]=bu.iloc[i] if bu.iloc[i]<ub[i-1] or d.close.iloc[i-1]>ub[i-1] else ub[i-1]
                  lb[i]=bl.iloc[i] if bl.iloc[i]>lb[i-1] or d.close.iloc[i-1]<lb[i-1] else lb[i-1]
                  if np.isclose(st[i-1],ub[i-1]): di[i]=-1 if d.close.iloc[i]>ub[i] else 1
                  else: di[i]=1 if d.close.iloc[i]<lb[i] else -1
                  st[i]=lb[i] if di[i]<0 else ub[i]
              st_bear=np.r_[False,np.diff(di)>0]
              st_bull=np.r_[False,np.diff(di)<0]
              rsi50=(r>50).fillna(False).to_numpy(bool)
              return {'rsi':r.to_numpy(), 'ma':ma.to_numpy(), 'first':first, 'second':second, 'st_bear':st_bear, 'st_bull':st_bull, 'rsi50':rsi50}

          def bt(d,buy,exit_kind='st',f=None,bps=10,hold_bars=20):
              cost=bps/10000.; eq=10000.; qty=0.; entry=0.; basis=0.; entry_i=None; pending=None; trades=[]; curve=[]; exposure=0
              for i,row in d.iterrows():
                  # fill prior close signal at next open
                  if pending=='exit' and qty>0:
                      px=float(row.open)*(1-cost); pro=qty*px; pnl=pro-basis; eq=pro
                      trades[-1].update(exit_i=i,exit=px,pnl=pnl,ret=px/entry-1); qty=0.; entry_i=None
                  elif pending=='entry' and qty==0:
                      px=float(row.open)*(1+cost); basis=eq; qty=eq/px; entry=px; entry_i=i; trades.append({'entry_i':i,'entry':px})
                  pending=None
                  if qty>0:
                      exit_sig=False
                      if exit_kind=='st': exit_sig=bool(f['st_bear'][i])
                      elif exit_kind=='rsi50': exit_sig=bool(f['rsi50'][i])
                      elif exit_kind=='time': exit_sig=(i-entry_i)>=hold_bars
                      if exit_sig: pending='exit'
                  elif buy[i]: pending='entry'
                  curve.append(eq if qty==0 else qty*float(row.close)); exposure += int(qty>0)
              if qty>0:
                  px=float(d.iloc[-1].close)*(1-cost); pro=qty*px; pnl=pro-basis; eq=pro; trades[-1].update(exit_i=len(d)-1,exit=px,pnl=pnl,ret=px/entry-1,forced=True); curve[-1]=eq
              closed=[x for x in trades if 'pnl' in x]; wins=[x for x in closed if x['pnl']>0]; losses=[x for x in closed if x['pnl']<0]
              gp=sum(x['pnl'] for x in wins); gl=-sum(x['pnl'] for x in losses); pf=gp/gl if gl>0 else (999. if gp>0 else 0.)
              arr=np.asarray(curve,float); peak=np.maximum.accumulate(arr); dd=(arr/peak)-1
              return {'trades':len(closed),'win_rate':100*len(wins)/len(closed) if closed else 0.,'pf':pf,'return_pct':100*(eq/10000-1),'max_dd_pct':100*dd.min(),'exposure_pct':100*exposure/len(d),'avg_trade_pct':100*np.mean([x['ret'] for x in closed]) if closed else 0.}

          def st_only_bt(d,f,bps=10): return bt(d,f['st_bull'],'st',f,bps)

          def random_entry_dist(d,f,n_signals,bps=10,eligible=None,reps=300):
              if eligible is None: eligible=np.ones(len(d),bool)
              cand=np.flatnonzero(eligible & np.isfinite(f['rsi']))
              if len(cand)<max(5,n_signals): return None
              vals=[]
              n=min(n_signals,len(cand))
              for _ in range(reps):
                  b=np.zeros(len(d),bool); b[RNG.choice(cand,size=n,replace=False)]=True
                  vals.append(bt(d,b,'st',f,bps))
              def q(k,p): return float(np.percentile([x[k] for x in vals],p))
              return {'reps':reps,'signals':n,'return_med':q('return_pct',50),'return_p95':q('return_pct',95),'pf_med':q('pf',50),'pf_p95':q('pf',95),'wr_med':q('win_rate',50)}

          specs=[
            ('XU100','BIST_DLY'),('THYAO','BIST'),('GARAN','BIST'),('ASELS','BIST'),('BIMAS','BIST'),('TUPRS','BIST'),
            ('SPY','AMEX'),('QQQ','NASDAQ'),('AAPL','NASDAQ'),('MSFT','NASDAQ'),('NVDA','NASDAQ'),('AMZN','NASDAQ'),('TSLA','NASDAQ')
          ]
          intervals=[('4h',Interval.in_4_hour),('1h',Interval.in_1_hour)]
          rows=[]; randrows=[]; meta=[]
          for sym,ex in specs:
              for int_name,iv in intervals:
                  try: d=tv.get_hist(sym,ex,iv,n_bars=5000,extended_session=False)
                  except Exception as e: meta.append({'symbol':sym,'exchange':ex,'interval':int_name,'error':repr(e)}); continue
                  if d is None or len(d)<500: meta.append({'symbol':sym,'exchange':ex,'interval':int_name,'rows':0 if d is None else len(d)}); continue
                  d=d.reset_index(); d['datetime']=pd.to_datetime(d['datetime']);
                  for c in ['open','high','low','close']: d[c]=pd.to_numeric(d[c],errors='coerce')
                  d=d.dropna(subset=['open','high','low','close']).reset_index(drop=True); f=features(d)
                  meta.append({'symbol':sym,'exchange':ex,'interval':int_name,'rows':len(d),'start':str(d.datetime.iloc[0]),'end':str(d.datetime.iloc[-1]),'second_signals':int(f['second'].sum())})
                  variants=[
                    ('E2_ST',f['second'],'st',20),('E2_TIME10',f['second'],'time',10),('E2_TIME20',f['second'],'time',20),('E2_TIME40',f['second'],'time',40),('E2_RSI50',f['second'],'rsi50',20),('E1_ST',f['first'],'st',20),('ST_ONLY',f['st_bull'],'st',20)
                  ]
                  for name,buy,exit_kind,h in variants:
                      r=bt(d,buy,exit_kind,f,10,h); rows.append({'symbol':sym,'exchange':ex,'interval':int_name,'variant':name,'bps_side':10,**r})
                  rr=random_entry_dist(d,f,int(f['second'].sum()),10,None,300)
                  if rr: randrows.append({'symbol':sym,'exchange':ex,'interval':int_name,'baseline':'RAND_ALL_ST',**rr})
                  elig=np.isfinite(f['rsi']) & (f['rsi']<50)
                  rr=random_entry_dist(d,f,int(f['second'].sum()),10,elig,300)
                  if rr: randrows.append({'symbol':sym,'exchange':ex,'interval':int_name,'baseline':'RAND_RSI_LT50_ST',**rr})
          pd.DataFrame(rows).to_csv(OUT/'ablation.csv',index=False); pd.DataFrame(randrows).to_csv(OUT/'random_baselines.csv',index=False)
          (OUT/'results.json').write_text(json.dumps({'meta':meta,'ablation':rows,'random':randrows},indent=2),encoding='utf-8')
          # compact decision summary
          R=pd.DataFrame(rows); Z=pd.DataFrame(randrows)
          summary=[]
          if len(R):
              for interval in ['4h','1h']:
                  q=R[(R.interval==interval)&(R.variant=='E2_ST')]
                  summary.append({'interval':interval,'assets':len(q),'positive_pf_assets':int((q.pf>1).sum()),'pf_gt_1_25_assets':int((q.pf>1.25).sum()),'median_pf':float(q.pf.median()) if len(q) else None,'median_return':float(q.return_pct.median()) if len(q) else None})
          (OUT/'decision_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(pd.DataFrame(summary).to_string(index=False)); print(R[R.variant.isin(['E2_ST','E1_ST','ST_ONLY'])][['symbol','exchange','interval','variant','trades','win_rate','pf','return_pct','max_dd_pct']].round(2).to_string(index=False))
          PY
      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/rsi-supertrend-ablation || true
          git commit -m 'Publish RSI SuperTrend component ablation [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main || true
