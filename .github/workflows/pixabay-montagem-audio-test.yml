name: Pixabay Montagem Audio Test
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/pixabay-montagem-audio-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl openvpn iproute2 iptables ffmpeg
          python -m pip install -q -U yt-dlp
      - name: Fetch PHONK MONTAGEM via VN relay
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL --max-time 40 'https://www.vpngate.net/api/iphone/' -o vpngate.csv
          python <<'PY'
          import csv,base64
          rows=[]
          with open('vpngate.csv',encoding='utf-8-sig',errors='replace',newline='') as f:
              for r in csv.reader(f):
                  if not r or r[0].startswith(('*','#')) or len(r)<15: continue
                  cc=r[6].strip().upper()
                  if cc not in {'VN','SG','JP','KR','TW'}: continue
                  try: rows.append((['VN','SG','JP','KR','TW'].index(cc),-int(r[2] or 0),cc,r[1],base64.b64decode(r[14]).decode('utf-8','replace')))
                  except: pass
          rows.sort(); _,_,cc,ip,cfg=rows[0]
          open('profile.ovpn','w').write(cfg.rstrip()+'\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 8\n')
          print('PROFILE',cc,ip)
          PY
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf
          sudo ip netns add vpnns
          sudo ip link add veth-host type veth peer name veth-vpn
          sudo ip link set veth-vpn netns vpnns
          sudo ip addr add 10.203.0.1/24 dev veth-host
          sudo ip link set veth-host up
          sudo ip netns exec vpnns ip addr add 10.203.0.2/24 dev veth-vpn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set veth-vpn up
          sudo ip netns exec vpnns ip route add default via 10.203.0.1
          sudo sysctl -w net.ipv4.ip_forward=1
          WAN_IF=$(ip route show default | awk '/default/ {print $5; exit}')
          sudo iptables -t nat -A POSTROUTING -s 10.203.0.0/24 -o "$WAN_IF" -j MASQUERADE
          sudo iptables -A FORWARD -i veth-host -o "$WAN_IF" -j ACCEPT
          sudo iptables -A FORWARD -i "$WAN_IF" -o veth-host -m state --state RELATED,ESTABLISHED -j ACCEPT
          sudo ip netns exec vpnns openvpn --config "$GITHUB_WORKSPACE/profile.ovpn" --daemon --writepid /tmp/vpn.pid --log /tmp/vpn.log
          for n in $(seq 1 18); do sudo ip netns exec vpnns ip link show tun0 >/dev/null 2>&1 && break; sleep 1; done
          echo "VPN_EGRESS=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 12 https://api.ipify.org)"
          PAGE='https://pixabay.com/music/upbeat-phonk-montagem-411215/'
          sudo ip netns exec vpnns curl -L --fail --retry 2 -A 'Mozilla/5.0' -o "$GITHUB_WORKSPACE/pixabay.html" "$PAGE"
          python <<'PY'
          import re,html
          s=html.unescape(open('pixabay.html',encoding='utf-8',errors='replace').read()).replace('\\/','/').replace('\\u002F','/')
          us=[]
          for p in [r'https://cdn\.pixabay\.com/[^"\'<> ]+?\.mp3[^"\'<> ]*',r'https://[^"\'<> ]+?\.mp3[^"\'<> ]*']:
              for m in re.finditer(p,s):
                  u=html.unescape(m.group(0)).replace('\\u0026','&')
                  if u not in us: us.append(u)
          print('MP3_URLS',us[:10])
          if us: open('audio_url.txt','w').write(us[0])
          PY
          if [ -s audio_url.txt ]; then
            sudo ip netns exec vpnns curl -L --fail --retry 2 -A 'Mozilla/5.0' -H 'Referer: https://pixabay.com/' -o "$GITHUB_WORKSPACE/montagem.mp3" "$(cat audio_url.txt)"
          else
            YTDLP=$(command -v yt-dlp)
            timeout 90s sudo ip netns exec vpnns env PATH="$PATH" HOME="$HOME" "$YTDLP" -f 'bestaudio/best' -o "$GITHUB_WORKSPACE/montagem.%(ext)s" "$PAGE" || true
            f=$(find . -maxdepth 1 -type f -name 'montagem.*' ! -name '*.mp3' | head -n1)
            [ -z "${f:-}" ] || ffmpeg -hide_banner -loglevel error -y -i "$f" -vn -c:a libmp3lame -b:a 192k montagem.mp3
          fi
          [ -s montagem.mp3 ]
          ffprobe -v error -show_entries format=duration,size,format_name -of default=nw=1 montagem.mp3
      - name: Upload debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixabay-montagem-audio-debug
          path: |
            montagem.mp3
            audio_url.txt
            pixabay.html
          retention-days: 1
