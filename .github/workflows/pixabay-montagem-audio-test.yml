name: Pixabay Montagem Audio Test
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/pixabay-montagem-audio-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl openvpn iproute2 iptables ffmpeg
          python -m pip install -q -U yt-dlp
      - name: Fetch PHONK MONTAGEM through verified relay
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 40 'https://www.vpngate.net/api/iphone/' -o vpngate.csv
          mkdir -p vpn_profiles
          python <<'PY'
          import csv,base64
          rows=[]
          with open('vpngate.csv',encoding='utf-8-sig',errors='replace',newline='') as f:
              for r in csv.reader(f):
                  if not r or r[0].startswith(('*','#')) or len(r)<15: continue
                  cc=r[6].strip().upper()
                  if cc not in {'VN','SG','JP','KR','TW'}: continue
                  try: score=int(r[2] or 0); cfg=base64.b64decode(r[14]).decode('utf-8','replace')
                  except: continue
                  rows.append((cc,score,r[1],cfg))
          selected=[]
          for cc in ['VN','SG','JP','KR','TW']:
              selected += sorted((x for x in rows if x[0]==cc),key=lambda x:x[1],reverse=True)[:3]
          if not selected: raise SystemExit('no profiles')
          with open('vpn_profiles/meta.tsv','w') as m:
              for i,(cc,score,ip,cfg) in enumerate(selected):
                  p=f'vpn_profiles/p{i:02d}_{cc}.ovpn'
                  open(p,'w').write(cfg.rstrip()+'\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 8\n')
                  m.write(f'{p}\t{cc}\t{score}\t{ip}\n')
          print(open('vpn_profiles/meta.tsv').read())
          PY
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          sudo ip netns add vpnns
          sudo ip link add veth-host type veth peer name veth-vpn
          sudo ip link set veth-vpn netns vpnns
          sudo ip addr add 10.203.0.1/24 dev veth-host
          sudo ip link set veth-host up
          sudo ip netns exec vpnns ip addr add 10.203.0.2/24 dev veth-vpn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set veth-vpn up
          sudo ip netns exec vpnns ip route add default via 10.203.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          WAN_IF=$(ip route show default | awk '/default/ {print $5; exit}')
          sudo iptables -t nat -A POSTROUTING -s 10.203.0.0/24 -o "$WAN_IF" -j MASQUERADE
          sudo iptables -A FORWARD -i veth-host -o "$WAN_IF" -j ACCEPT
          sudo iptables -A FORWARD -i "$WAN_IF" -o veth-host -m state --state RELATED,ESTABLISHED -j ACCEPT
          BASE=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 12 https://api.ipify.org)
          echo "BASE_EGRESS=$BASE"

          PAGE='https://pixabay.com/music/upbeat-phonk-montagem-411215/'
          got=0
          while IFS=$'\t' read -r profile cc score relay_ip; do
            echo "=== TRY $cc relay=$relay_ip score=$score ==="
            if [ -f /tmp/vpn.pid ]; then sudo kill "$(cat /tmp/vpn.pid)" 2>/dev/null || true; sleep 2; fi
            rm -f /tmp/vpn.pid /tmp/vpn.log pixabay.html audio_url.txt montagem.mp3
            sudo ip netns exec vpnns openvpn --config "$GITHUB_WORKSPACE/$profile" --daemon --writepid /tmp/vpn.pid --log /tmp/vpn.log || true
            ok=0
            for n in $(seq 1 18); do
              if sudo ip netns exec vpnns ip link show tun0 >/dev/null 2>&1; then ok=1; break; fi
              sleep 1
            done
            if [ "$ok" != 1 ]; then echo 'NO_TUN0'; tail -n 8 /tmp/vpn.log || true; continue; fi
            EGRESS=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 12 https://api.ipify.org || true)
            echo "VERIFIED_EGRESS=$EGRESS country=$cc"
            if [ -z "$EGRESS" ] || [ "$EGRESS" = "$BASE" ]; then echo 'EGRESS_NOT_CHANGED'; continue; fi

            code=$(sudo ip netns exec vpnns curl -L -sS --max-time 30 -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1' -H 'Accept-Language: en-US,en;q=0.9' -o "$GITHUB_WORKSPACE/pixabay.html" -w '%{http_code}' "$PAGE" || true)
            echo "PIXABAY_HTTP=$code bytes=$(wc -c < pixabay.html 2>/dev/null || echo 0)"
            [ "$code" = 200 ] || continue
            python <<'PY'
          import re,html
          s=html.unescape(open('pixabay.html',encoding='utf-8',errors='replace').read()).replace('\\/','/').replace('\\u002F','/')
          urls=[]
          for p in [r'https://cdn\.pixabay\.com/[^"\'<> ]+?\.mp3[^"\'<> ]*',r'https://[^"\'<> ]+?\.mp3[^"\'<> ]*']:
              for m in re.finditer(p,s):
                  u=html.unescape(m.group(0)).replace('\\u0026','&')
                  if u not in urls: urls.append(u)
          print('MP3_URLS',urls[:10])
          if urls: open('audio_url.txt','w').write(urls[0])
          PY
            if [ -s audio_url.txt ]; then
              u=$(cat audio_url.txt)
              acode=$(sudo ip netns exec vpnns curl -L -sS --max-time 45 -A 'Mozilla/5.0' -H 'Referer: https://pixabay.com/' -o "$GITHUB_WORKSPACE/montagem.mp3" -w '%{http_code}' "$u" || true)
              echo "AUDIO_HTTP=$acode"
            else
              YTDLP=$(command -v yt-dlp)
              timeout 90s sudo ip netns exec vpnns env PATH="$PATH" HOME="$HOME" "$YTDLP" --no-playlist -f 'bestaudio/best' -o "$GITHUB_WORKSPACE/montagem.%(ext)s" "$PAGE" || true
              f=$(find . -maxdepth 1 -type f -name 'montagem.*' ! -name '*.mp3' | head -n1)
              if [ -n "${f:-}" ]; then ffmpeg -hide_banner -loglevel error -y -i "$f" -vn -c:a libmp3lame -b:a 192k montagem.mp3; fi
            fi
            if [ -s montagem.mp3 ] && ffprobe -v error montagem.mp3 >/dev/null 2>&1; then
              dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 montagem.mp3)
              echo "MONTAGEM_OK duration=$dur egress=$EGRESS country=$cc"
              echo "$EGRESS $cc" > relay_used.txt
              got=1
              break
            fi
          done < vpn_profiles/meta.tsv
          [ "$got" = 1 ] || { echo 'NO_RELAY_COULD_FETCH_MONTAGEM'; exit 31; }
          ffprobe -v error -show_entries format=duration,size,format_name -of default=nw=1 montagem.mp3
      - name: Upload audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixabay-montagem-audio-debug
          path: |
            montagem.mp3
            audio_url.txt
            relay_used.txt
          retention-days: 1
