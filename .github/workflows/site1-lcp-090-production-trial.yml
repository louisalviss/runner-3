name: Site1 LCP 0.90 Production Trial

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runner3wp-production-lcp090-trial
  cancel-in-progress: false

env:
  PROD_DOMAIN: https://runner3wp.pntr.dev
  PROD_WORKER_URL: https://wordpress-edge-proxy.ducduy2411.workers.dev
  ROLLBACK_SHA: 9124f5957e176ffc9aa64444c980f3c5d6642a0d

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare candidate and browser
        run: |
          set -euo pipefail
          echo REJECT > /tmp/verdict
          python3 - <<'PY'
          from pathlib import Path
          p=Path('edge/wordpress-edge-proxy/src/entry.js')
          s=p.read_text()
          old="headers.append('Link', `<${R2_ORIGIN}>; rel=preconnect; crossorigin`);"
          new="const heroPreload = new URL('/__runner3/r2-image/offset-demo-01-w640.webp', request.url).href; headers.append('Link', `<${heroPreload}>; rel=preload; as=image; type=image/webp; fetchpriority=high`);"
          assert old in s
          s=s.replace(old,new,1)
          old2="new HTMLRewriter().on('head', new HeadResourceHints()).on('img[src]', new StaticResponsiveImageRewriter()).on('link[rel=\"preload\"][as=\"image\"]', new StaticImagePreloadRewriter())"
          new2="new HTMLRewriter().on('img[src]', new StaticResponsiveImageRewriter()).on('link[rel=\"preload\"][as=\"image\"]', new StaticImagePreloadRewriter())"
          assert old2 in s
          p.write_text(s.replace(old2,new2,1))
          PY
          node --check edge/wordpress-edge-proxy/src/entry.js
          node --check edge/wordpress-edge-proxy/src/responsive-images.js
          node scripts/build-wordpress-edge-snapshot.mjs
          python3 - <<'PY'
          import json
          src='edge/wordpress-edge-proxy/wrangler.v2.jsonc';dst='edge/wordpress-edge-proxy/wrangler.prod-lcp090.jsonc'
          d=json.load(open(src));d['name']='wordpress-edge-proxy';open(dst,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          npm install --no-save playwright-core@1.61.0 >/dev/null
          C="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"; test -n "$C"; echo "CHROME_PATH=$C" >> "$GITHUB_ENV"
          mkdir -p scripts
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/runner3wp-v2-fcp-test/scripts/pagespeed-ui-mobile-audit.mjs' -o scripts/pagespeed-ui-mobile-audit.mjs

      - name: Deploy candidate to Site1
        id: deploy
        continue-on-error: true
        run: |
          set -euo pipefail
          npx --yes wrangler@4.124.0 deploy --config edge/wordpress-edge-proxy/wrangler.prod-lcp090.jsonc >/tmp/deploy.log 2>&1
          sleep 4

      - name: Production functional guard
        id: guard
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            B="__lcp090=$(date +%s%N)-$attempt"
            if curl -fsS -H 'Cache-Control: no-cache' -D /tmp/h -o /tmp/home "$PROD_DOMAIN/?$B" \
              && grep -Eiq '^x-edge-snapshot:[[:space:]]*HIT' /tmp/h \
              && grep -Eiq '^x-edge-cache-policy:[[:space:]]*snapshot-direct' /tmp/h \
              && grep -Eiq '^link:.*__runner3/r2-image/offset-demo-01-w640\.webp.*rel=preload' /tmp/h; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          python3 - <<'PY'
          import re
          h=open('/tmp/home',errors='ignore').read()
          imgs=re.findall(r'<img\b[^>]*offset-demo-01[^>]*>',h,re.I)
          assert len(imgs)>=2
          assert re.search(r'decoding=["\']sync["\']',imgs[0],re.I)
          assert re.search(r'fetchpriority=["\']high["\']',imgs[0],re.I)
          assert re.search(r'loading=["\']lazy["\']',imgs[1],re.I)
          assert re.search(r'fetchpriority=["\']low["\']',imgs[1],re.I)
          print('hero_priority_guard=PASS')
          PY
          curl -fsS -H 'Cache-Control: no-cache' -D /tmp/ih -o /tmp/i "$PROD_DOMAIN/__runner3/r2-image/offset-demo-01-w640.webp?$B"
          grep -Eiq '^x-runner3-lcp:[[:space:]]*r2-binding-same-origin' /tmp/ih
          grep -Eiq '^content-type:[[:space:]]*image/webp' /tmp/ih
          curl -sS -D /tmp/admin -o /dev/null "$PROD_DOMAIN/wp-admin/"
          grep -Eiq '^HTTP/[^ ]+[[:space:]]+307' /tmp/admin
          grep -Eiq '^location:[[:space:]]*https://runner3-factory-smoke-2\.wasmer\.app' /tmp/admin
          curl -fsS -H 'Cookie: wordpress_logged_in_probe=1' -D /tmp/auth -o /tmp/authbody "$PROD_DOMAIN/"
          grep -Eiq '^x-edge-mode:[[:space:]]*bypass' /tmp/auth

      - name: Official PageSpeed target gate
        id: psi
        if: steps.guard.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            PSI_URL="$PROD_DOMAIN/" PSI_UI_OUT="/tmp/psi-$i.json" timeout 330s node scripts/pagespeed-ui-mobile-audit.mjs
          done
          python3 - <<'PY'
          import json,re,statistics
          def sec(v):
            m=re.match(r'^([0-9.]+)\s*(ms|s)?$',str(v or '').strip());
            if not m:return None
            x=float(m.group(1));return x/1000 if m.group(2)=='ms' else x
          rows=[]
          for i in range(1,4):
            d=json.load(open(f'/tmp/psi-{i}.json'))
            r={'run':i,'performance':d.get('performance'),'fcp':sec(d.get('fcp')),'lcp':sec(d.get('lcp')),'tbt':d.get('tbt'),'cls':d.get('cls'),'url':d.get('resultUrl')}
            rows.append(r);print('PSI',json.dumps(r))
          med=statistics.median([r['lcp'] for r in rows])
          passed=all(r['performance']==100 for r in rows) and med<=0.9
          print('MEDIAN_LCP',med);print('TARGET_PASS',str(passed).lower())
          open('/tmp/verdict','w').write('PASS' if passed else 'REJECT')
          PY

      - name: Roll back unless target passed
        id: rollback
        if: always()
        run: |
          set -euo pipefail
          verdict="$(cat /tmp/verdict 2>/dev/null || echo REJECT)"
          if [ "$verdict" = PASS ]; then echo 'KEEP candidate'; exit 0; fi
          git reset --hard
          git clean -fd
          git checkout --detach "$ROLLBACK_SHA"
          node scripts/build-wordpress-edge-snapshot.mjs
          python3 - <<'PY'
          import json
          src='edge/wordpress-edge-proxy/wrangler.v2.jsonc';dst='edge/wordpress-edge-proxy/wrangler.prod-rollback.jsonc'
          d=json.load(open(src));d['name']='wordpress-edge-proxy';open(dst,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          npx --yes wrangler@4.124.0 deploy --config edge/wordpress-edge-proxy/wrangler.prod-rollback.jsonc >/tmp/rollback.log 2>&1
          sleep 4
          B="__rollback=$(date +%s%N)"
          curl -fsS -H 'Cache-Control: no-cache' -D /tmp/rh -o /tmp/rhome "$PROD_DOMAIN/?$B"
          grep -Eiq '^x-edge-snapshot:[[:space:]]*HIT' /tmp/rh
          grep -Eiq '^x-edge-cache-policy:[[:space:]]*snapshot-direct' /tmp/rh
          curl -fsS -D /tmp/rih -o /tmp/ri "$PROD_DOMAIN/__runner3/r2-image/offset-demo-01-w640.webp?$B"
          grep -Eiq '^x-runner3-lcp:[[:space:]]*r2-binding-same-origin' /tmp/rih
          echo 'ROLLBACK_VERIFIED'

      - name: Final verdict
        if: always()
        run: |
          echo "FINAL_VERDICT=$(cat /tmp/verdict 2>/dev/null || echo REJECT)"
          echo "DEPLOY=${{ steps.deploy.outcome }} GUARD=${{ steps.guard.outcome }} PSI=${{ steps.psi.outcome }} ROLLBACK=${{ steps.rollback.outcome }}"
