name: Reader v45 Direct Restore Patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_reader_v45_direct_restore.py'
      - '.github/workflows/reader-v45-direct-restore-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply direct restore UX patch
        run: |
          set -euo pipefail
          python3 scripts/patch_reader_v45_direct_restore.py
          node --check cloudflare/runner3-core/artifact-library-reader-v27-boot-cfi-restore-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v28-prime-base-position-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          grep -q 'data-r3-direct-restore-v45="1"' cloudflare/runner3-core/artifact-library-reader-v27-boot-cfi-restore-entry.js
          grep -q 'data-r3-direct-restore-v45="1"' cloudflare/runner3-core/artifact-library-reader-v28-prime-base-position-entry.js
          grep -q 'if(window.__R3_READER_RESTORE_PENDING)return false;' cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          ! grep -q 'for(let n=0;n<36;n++)' cloudflare/runner3-core/artifact-library-reader-v27-boot-cfi-restore-entry.js
      - name: Commit v45 source patch
        run: |
          set -euo pipefail
          rm -f .github/workflows/reader-v45-direct-restore-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/runner3-core/artifact-library-reader-v27-boot-cfi-restore-entry.js \
                  cloudflare/runner3-core/artifact-library-reader-v28-prime-base-position-entry.js \
                  cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js \
                  .github/workflows/reader-v45-direct-restore-patch.yml
          git commit -m 'fix(reader): direct hidden restore UX v45'
          git push origin HEAD:main
