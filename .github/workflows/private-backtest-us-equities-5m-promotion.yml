name: Private Backtest US Equities 5m Promotion

on:
  push:
    branches: [main]
    paths:
      - 'jobs/private-backtest-us-equities-5m-promotion.json'
      - 'tools/private_backtest_us5_probe.py'
      - '.github/workflows/private-backtest-us-equities-5m-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-backtest-us-equities-5m-promotion
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: &env
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/private_backtest_us5_probe.py stage --config jobs/private-backtest-us-equities-5m-promotion.json

  shard:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1]
    env: *env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'dukascopy-python==4.0.1' 'numpy>=2,<3' 'pandas>=2,<3'
      - run: python tools/private_backtest_us5_probe.py shard --config jobs/private-backtest-us-equities-5m-promotion.json --shard ${{ matrix.shard }}

  evaluate:
    if: ${{ always() && needs.stage.result == 'success' }}
    needs: [stage, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: *env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/private_backtest_us5_probe.py evaluate --config jobs/private-backtest-us-equities-5m-promotion.json
