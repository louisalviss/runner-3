name: Cloudflare D1 39 DDL Isolated Local Replay (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-39-local-replay-readonly
  cancel-in-progress: false

jobs:
  source-pinned-local-replay:
    if: ${{ github.repository == 'louisalviss/runner-3' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify offline contracts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare_d1_39_local_replay_readonly.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_39_local_replay_readonly.py' -v
      - name: Exact source-account guard and isolated local replay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "${CLOUDFLARE_ACCOUNT_ID}" = "7415a87f6bce7884e73ad7cfed5782df"
          python3 scripts/cloudflare_d1_39_local_replay_readonly.py
      - name: Save sanitized local replay counts only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-39-isolated-local-sqlite-replay-readonly
          path: migration-out/cloudflare-d1-39-offline-ddl-replay.json
          if-no-files-found: error
          retention-days: 3
