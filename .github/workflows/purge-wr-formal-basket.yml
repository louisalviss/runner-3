name: Purge WR Formal Basket

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-wr-formal-basket.yml'

permissions:
  actions: write
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete transient formal research
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in 9272930128 9272929870 9272929125 9272928365 9272927656 9272925731 9272924758 9272923097 9272919904 9272914319 9272910055 9272909817 9272908967 9272907953 9272907151; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}" || true
          done
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/31982789931" || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/wr-formal-basket-temp" || true
