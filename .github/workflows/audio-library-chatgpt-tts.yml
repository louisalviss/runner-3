name: Audio Library ChatGPT TTS

on:
  push:
    branches: [main]
    paths:
      - 'ops/audio-library/chatgpt-outbox/*.json'
      - 'ops/audio-library/chatgpt-outbox-chunks/**'
      - '.github/workflows/audio-library-chatgpt-tts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops/audio-library/tts-trigger/**'
      - 'ops/audio-library/chatgpt-outbox-chunks/**'

permissions:
  contents: read

jobs:
  tts:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUDIO_LIBRARY_BUCKET: runner3-wp-media
      AUDIO_LIBRARY_VOICE: vi-VN-NamMinhNeural
      AUDIO_LIBRARY_VOICE_RATE: +3%
      AUDIO_LIBRARY_CURRENT_ITEM: 9fe80de0-6caa-5143-aaaa-f81b7a366f77
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q requests edge-tts 'cryptography>=45,<47'
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
      - name: Reassemble encrypted outbox when chunked
        shell: bash
        run: |
          set -euo pipefail
          chunk_dir="ops/audio-library/chatgpt-outbox-chunks/${AUDIO_LIBRARY_CURRENT_ITEM}"
          if [ -s "$chunk_dir/manifest.json" ]; then
            python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          item=os.environ['AUDIO_LIBRARY_CURRENT_ITEM']
          root=Path('ops/audio-library/chatgpt-outbox-chunks')/item
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          if str(m.get('id')) != item: raise SystemExit('manifest id mismatch')
          n=int(m['chunkCount'])
          cipher=''.join((root/f'{i:03d}.txt').read_text(encoding='utf-8').strip() for i in range(n))
          if len(cipher) != int(m['ciphertextChars']): raise SystemExit('ciphertext length mismatch')
          if hashlib.sha256(cipher.encode()).hexdigest() != m['ciphertextSha256']: raise SystemExit('ciphertext hash mismatch')
          env={'v':m.get('v',1),'id':item,'ephemeralPublicKey':m['ephemeralPublicKey'],'nonce':m['nonce'],'ciphertext':cipher}
          Path('/tmp/chunked-outbox.json').write_text(json.dumps(env,separators=(',',':')),encoding='utf-8')
          PY
          fi
      - name: Decrypt and synthesize
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/chunked-outbox.json ]; then
            files="/tmp/chunked-outbox.json"
          else
            files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'ops/audio-library/chatgpt-outbox/*.json')"
            if [ -z "$files" ]; then files="ops/audio-library/chatgpt-outbox/${AUDIO_LIBRARY_CURRENT_ITEM}.json"; fi
          fi
          test -s "$files"
          mkdir -p /tmp/chatgpt-payloads
          python - $files <<'PY'
          import base64,hashlib,json,os,sys
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey,X25519PublicKey
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305
          seed=hashlib.sha256(b'runner3-audio-library-chatgpt-bridge-v1\0'+os.environ['CLOUDFLARE_API_TOKEN'].encode()).digest()
          private=X25519PrivateKey.from_private_bytes(seed)
          for name in sys.argv[1:]:
              env=json.loads(Path(name).read_text(encoding='utf-8'))
              item_id=str(env['id'])
              eph=X25519PublicKey.from_public_bytes(base64.b64decode(env['ephemeralPublicKey']))
              shared=private.exchange(eph)
              key=HKDF(algorithm=hashes.SHA256(),length=32,salt=None,info=b'runner3-audio-library-chatgpt-v1').derive(shared)
              plain=ChaCha20Poly1305(key).decrypt(base64.b64decode(env['nonce']),base64.b64decode(env['ciphertext']),item_id.encode())
              payload=json.loads(plain)
              if str(payload.get('id')) != item_id: raise SystemExit('payload id mismatch')
              Path('/tmp/chatgpt-payloads/'+item_id+'.json').write_text(json.dumps(payload,ensure_ascii=False),encoding='utf-8')
          PY
          for f in /tmp/chatgpt-payloads/*.json; do python scripts/audio_library_tts_from_chatgpt.py "$f"; done

# 2026-08-20: retrigger current ChatGPT-authored item after outbox creation
