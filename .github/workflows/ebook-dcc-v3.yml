name: Ebook DCC VI-v3 Canonical QA

on:
  workflow_dispatch:
    inputs:
      book:
        description: "Book number 1-8, or all (Book 1 gates fan-out)"
        required: true
        default: "all"
  push:
    paths:
      - ".runner-dcc-v3-trigger"
      - ".github/workflows/ebook-dcc-v3.yml"

permissions:
  contents: read

concurrency:
  group: ebook-dcc-v3-ghhosted-${{ github.event.inputs.book || 'all' }}
  cancel-in-progress: false

jobs:
  canonical-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EBOOK_R2_BUCKET: ${{ vars.EBOOK_R2_BUCKET || 'runner3-artifacts' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      RUNNER3_CORE_URL: ${{ secrets.RUNNER3_CORE_URL || vars.RUNNER3_CORE_URL || secrets.CORE_API_URL }}
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN || secrets.CORE_API_TOKEN }}
      DCC_BOOK_1_SOURCE_KEY: ${{ vars.DCC_BOOK_1_SOURCE_KEY }}
      DCC_BOOK_2_SOURCE_KEY: ${{ vars.DCC_BOOK_2_SOURCE_KEY }}
      DCC_BOOK_3_SOURCE_KEY: ${{ vars.DCC_BOOK_3_SOURCE_KEY }}
      DCC_BOOK_4_SOURCE_KEY: ${{ vars.DCC_BOOK_4_SOURCE_KEY }}
      DCC_BOOK_5_SOURCE_KEY: ${{ vars.DCC_BOOK_5_SOURCE_KEY }}
      DCC_BOOK_6_SOURCE_KEY: ${{ vars.DCC_BOOK_6_SOURCE_KEY }}
      DCC_BOOK_7_SOURCE_KEY: ${{ vars.DCC_BOOK_7_SOURCE_KEY }}
      DCC_BOOK_8_SOURCE_KEY: ${{ vars.DCC_BOOK_8_SOURCE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Cloudflare R2 API token
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 2; }
          [[ -n "${R2_ACCOUNT_ID:-}" ]] || { echo 'CLOUDFLARE_ACCOUNT_ID_MISSING'; exit 2; }
          url="https://api.cloudflare.com/client/v4/accounts/${R2_ACCOUNT_ID}/r2/buckets/${EBOOK_R2_BUCKET}/objects"
          code="$(curl -sS -o /tmp/r2-probe.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            "$url")"
          python - "$code" /tmp/r2-probe.json <<'PY'
          import json,sys
          code,path=sys.argv[1:]
          try:
              data=json.load(open(path,encoding='utf-8'))
          except Exception as exc:
              print(f'R2_API_PROBE_INVALID_JSON http={code} error={exc}')
              raise SystemExit(3)
          if code != '200' or data.get('success') is not True:
              errs=data.get('errors') or []
              safe=[{'code':e.get('code'),'message':e.get('message')} for e in errs[:5] if isinstance(e,dict)]
              print('R2_API_PROBE_FAIL http='+code+' errors='+json.dumps(safe,ensure_ascii=False))
              raise SystemExit(4)
          result=data.get('result') or []
          print(f'R2_API_PROBE_PASS bucket={__import__("os").environ.get("EBOOK_R2_BUCKET")} visible_objects={len(result)}')
          PY
      - name: Python dependencies
        run: python -m pip install -q boto3
      - name: Validate worker syntax
        run: |
          python -m py_compile story_pipeline/dcc_v3_finalize.py
          python -m py_compile story_pipeline/r2_cloudflare_rest.py
          python -m py_compile story_pipeline/dcc_v3_finalize_cf.py
          python -m json.tool story_pipeline/books/dcc-v3.json >/dev/null
      - name: Book 1 proof gate
        if: ${{ github.event.inputs.book == 'all' || github.event.inputs.book == '' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/dcc-v3
          python story_pipeline/dcc_v3_finalize_cf.py --book 1 --result artifacts/dcc-v3/book-01.json
      - name: Remaining books after Book 1 PASS
        if: ${{ github.event.inputs.book == 'all' || github.event.inputs.book == '' }}
        run: |
          set -euo pipefail
          for book in 2 3 4 5 6 7 8; do
            printf '\n=== DCC Book %s ===\n' "$book"
            python story_pipeline/dcc_v3_finalize_cf.py --book "$book" --result "artifacts/dcc-v3/book-$(printf '%02d' "$book").json"
          done
      - name: Single book
        if: ${{ github.event.inputs.book != 'all' && github.event.inputs.book != '' }}
        run: |
          set -euo pipefail
          book='${{ github.event.inputs.book }}'
          [[ "$book" =~ ^[1-8]$ ]] || { echo "Invalid book selector: $book" >&2; exit 2; }
          mkdir -p artifacts/dcc-v3
          python story_pipeline/dcc_v3_finalize_cf.py --book "$book" --result "artifacts/dcc-v3/book-$(printf '%02d' "$book").json"
      - name: Upload machine proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcc-v3-proof-${{ github.run_id }}
          path: artifacts/dcc-v3/
          if-no-files-found: warn
          retention-days: 30
