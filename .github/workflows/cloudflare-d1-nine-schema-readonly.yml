name: Cloudflare TARGET D1 nine-schema encrypted audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-target-d1-nine-schema
  cancel-in-progress: false

jobs:
  target-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_TARGET_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install required crypto dependency
        run: python3 -m pip install --quiet cryptography
      - name: Validate read-only D1 collector and encryption offline
        run: |
          python3 -m py_compile scripts/cloudflare_d1_nine_schema_readonly.py
          python3 scripts/cloudflare_d1_nine_schema_readonly.py --self-test
      - name: Collect target D1 schema and PK metadata and encrypt receipt
        run: python3 scripts/cloudflare_d1_nine_schema_readonly.py --role target
      - name: Upload encrypted envelope only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-d1-target-nine-schema-encrypted
          path: courier-out/d1-target-nine-schema-envelope.json
          if-no-files-found: error
          retention-days: 1
