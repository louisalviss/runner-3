name: Opportunity Radar Market Session Integrity Tests

on:
  pull_request:
    paths:
      - scripts/opportunity_radar_market_v2.py
      - scripts/opportunity_radar_market_checkpoint.py
      - tests/test_market_session_integrity.py
      - .github/workflows/opportunity-radar-market-session-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/opportunity_radar_market_v2.py
      - scripts/opportunity_radar_market_checkpoint.py
      - tests/test_market_session_integrity.py
      - .github/workflows/opportunity-radar-market-session-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2.2,<3' 'requests>=2.32,<3' 'yfinance>=0.2.65,<0.3' 'pandas-market-calendars>=4.4,<6'
      - run: python -m unittest discover -s tests -p test_market_session_integrity.py -v
      - name: Probe Yahoo fresh raw and adjusted daily bars (diagnostic, no persistence)
        shell: bash
        run: |
          python - <<'PY'
          import collections
          import datetime
          import pandas as pd
          import yfinance as yf

          symbols = ['AAPL','MSFT','NVDA','JPM','XOM','LMT','SPY','TSLA','HD','WMT','AMZN','AMD','META','GOOG','RTX','BA','CAT','INTC','NOC','GFS']
          def inspect(batch):
              frame = yf.download(batch, period='1mo', interval='1d', group_by='ticker',
                                  auto_adjust=False, actions=False, progress=False,
                                  threads=True, timeout=30)
              report = {}
              for ticker in batch:
                  if isinstance(frame.columns, pd.MultiIndex) and ticker in frame.columns.get_level_values(0):
                      f=frame[ticker].copy()
                  else:
                      report[ticker]={'error':'missing_ticker_column'}
                      continue
                  c=pd.to_numeric(f.get('Close'), errors='coerce')
                  a=pd.to_numeric(f.get('Adj Close'), errors='coerce')
                  x=pd.concat({'c':c,'a':a},axis=1).dropna()
                  d=lambda s: s.dropna().index[-1].date().isoformat() if s.notna().any() else None
                  report[ticker]=dict(raw=d(c),adj=d(a),aligned=(x.index[-1].date().isoformat() if len(x) else None),
                                      last_row= f.tail(1).index[-1].date().isoformat(),
                                      last_raw_valid=bool(c.notna().iloc[-1]),
                                      last_adj_valid=bool(a.notna().iloc[-1]))
              return report
          for group in [symbols, ['AAPL','MSFT','LMT','SPY','JPM']]:
              try:
                  print('YAHOO_DIAG',len(group),inspect(group),flush=True)
              except Exception as e:
                  print('YAHOO_DIAG_FAILED',len(group),type(e).__name__,str(e)[:120],flush=True)
          PY
