name: Opportunity Radar Market Session Integrity Tests

on:
  pull_request:
    paths:
      - scripts/opportunity_radar_market_v2.py
      - scripts/opportunity_radar_market_recall_shadow.py
      - tests/test_market_recall_shadow.py
      - scripts/opportunity_radar_market_checkpoint.py
      - tests/test_market_session_integrity.py
      - .github/workflows/opportunity-radar-market-session-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/opportunity_radar_market_v2.py
      - scripts/opportunity_radar_market_recall_shadow.py
      - tests/test_market_recall_shadow.py
      - scripts/opportunity_radar_market_checkpoint.py
      - tests/test_market_session_integrity.py
      - .github/workflows/opportunity-radar-market-session-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2.2,<3' 'requests>=2.32,<3' 'yfinance>=0.2.65,<0.3' 'pandas-market-calendars>=4.4,<6'
      - run: python -m unittest discover -s tests -p test_market_session_integrity.py -v
      - run: python -m unittest discover -s tests -p test_market_recall_shadow.py -v
      - run: python scripts/opportunity_radar_market_recall_shadow.py
      - run: python -c 'import json; from pathlib import Path; p=json.loads(Path("data/opportunity-radar/market-recall-shadow.json").read_text()); assert p["status"] == "SHADOW_AUDIT_ONLY"; print("Shadow session",p["source_session_date"],"audited",len(p["records"]),"recall",p["counts"]["qualified_price_moves"])'
