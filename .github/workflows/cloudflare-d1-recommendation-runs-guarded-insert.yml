name: Cloudflare D1 Target Recommendation Runs ADDITIVE WRITE (Approval Gated)

on:
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: 'Type APPROVE_TARGET_ONLY_RECOMMENDATION_RUNS_12_INSERTS (writes exactly 12 rows to one target D1)'
        required: true
        type: string
      target_writers_quiesced:
        description: 'Have target D1 writers been explicitly identified and quiesced?'
        required: true
        type: choice
        options: ['NO', 'YES']
        default: 'NO'
      row_safe_recovery:
        description: 'Is a separately tested row-safe recovery plan and preserved pre-apply bookmark ready?'
        required: true
        type: choice
        options: ['NO', 'YES']
        default: 'NO'

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-target-d1-recommendation-runs-write
  cancel-in-progress: false

jobs:
  additive-write:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.approval_phrase == 'APPROVE_TARGET_ONLY_RECOMMENDATION_RUNS_12_INSERTS' && inputs.target_writers_quiesced == 'YES' && inputs.row_safe_recovery == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: cloudflare-target-d1-writes
    env:
      GH_ENV_POLICY_READ_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TARGET_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN }}
      CLOUDFLARE_TARGET_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_TARGET_D1_WRITE_TOKEN }}
      CLOUDFLARE_TARGET_PREAPPLY_BOOKMARK: ${{ secrets.CLOUDFLARE_TARGET_PREAPPLY_BOOKMARK }}
      D1_APPLY_APPROVAL: ${{ inputs.approval_phrase }}
      D1_TARGET_WRITERS_QUIESCED_ACK: ${{ inputs.target_writers_quiesced }}
      D1_ROW_SAFE_RECOVERY_ACK: ${{ inputs.row_safe_recovery }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fail-closed contracts without issuing any remote call
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare_d1_recommendation_runs_guarded_insert.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_recommendation_runs_guarded_insert.py' -v
      - name: Reject unprotected environment or non-main dispatch before accessing D1
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import os,sys;sys.path.insert(0,"scripts");from cloudflare_d1_recommendation_runs_guarded_insert import require_protected_environment;require_protected_environment(os.environ.get("GH_ENV_POLICY_READ_TOKEN", ""),os.environ.get("GITHUB_REPOSITORY", ""),os.environ.get("GITHUB_EVENT_NAME", ""),os.environ.get("GITHUB_REF", ""));print("GITHUB_ENV_INDEPENDENT_REVIEW_PROTECTION_PASS")'
      - name: Apply exactly twelve missing rows only after full gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudflare_d1_recommendation_runs_guarded_insert.py --apply
      - name: Upload SANITIZED result ONLY on complete verified success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-recommendation-runs-additive-write-sanitized
          path: migration-out/d1-recommendation-runs-apply-sanitized.json
          if-no-files-found: error
          retention-days: 2
