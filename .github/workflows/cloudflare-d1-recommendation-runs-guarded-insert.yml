name: Cloudflare D1 Target Recommendation Runs ADDITIVE WRITE (Solo Two-Step Approval)

on:
  workflow_dispatch:
    inputs:
      dryrun_run_id:
        description: 'Run ID of your separate successful Additive Dry-Run on the SAME main commit, completed in the last 30 minutes'
        required: true
        type: string
      approval_phrase:
        description: 'Type APPROVE_TARGET_ONLY_RECOMMENDATION_RUNS_12_INSERTS; this is a real database write'
        required: true
        type: string
      target_writers_quiesced:
        description: 'Have you independently identified and paused target writers?'
        required: true
        type: choice
        options: ['NO', 'YES']
        default: 'NO'
      row_safe_recovery:
        description: 'Have you securely preserved the pre-apply bookmark AND tested safe row-level recovery?'
        required: true
        type: choice
        options: ['NO', 'YES']
        default: 'NO'

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-target-d1-recommendation-runs-write
  cancel-in-progress: false

jobs:
  # FIRST: no Cloudflare credentials. Verify separate recent manual read-only
  # Dry-Run was launched by the SAME GitHub actor from the SAME main commit.
  recent-dryrun-gate:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.approval_phrase == 'APPROVE_TARGET_ONLY_RECOMMENDATION_RUNS_12_INSERTS' && inputs.target_writers_quiesced == 'YES' && inputs.row_safe_recovery == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GITHUB_TOKEN: ${{ github.token }}
      D1_SOLO_DRYRUN_RUN_ID: ${{ inputs.dryrun_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate recent same-user successful separate read-only Dry-Run
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare_d1_solo_dryrun_proof.py
          python3 scripts/cloudflare_d1_solo_dryrun_proof.py

  additive-write:
    needs: recent-dryrun-gate
    if: ${{ needs.recent-dryrun-gate.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Intentionally NO GitHub environment / required reviewer. This is a
    # solo-operator repo; a separate manual Dry-Run plus strict same-user,
    # same-SHA, recent run proof replaces the independent reviewer.
    env:
      GITHUB_TOKEN: ${{ github.token }}
      D1_SOLO_DRYRUN_RUN_ID: ${{ inputs.dryrun_run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TARGET_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN }}
      CLOUDFLARE_TARGET_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_TARGET_D1_WRITE_TOKEN }}
      CLOUDFLARE_TARGET_PREAPPLY_BOOKMARK: ${{ secrets.CLOUDFLARE_TARGET_PREAPPLY_BOOKMARK }}
      D1_APPLY_APPROVAL: ${{ inputs.approval_phrase }}
      D1_TARGET_WRITERS_QUIESCED_ACK: ${{ inputs.target_writers_quiesced }}
      D1_ROW_SAFE_RECOVERY_ACK: ${{ inputs.row_safe_recovery }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify safe contracts offline before reading production data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare_d1_recommendation_runs_guarded_insert.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_solo_dryrun_proof.py' -v
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_recommendation_runs_guarded_insert.py' -v
      - name: Verify recent Dry-Run again; apply exact missing rows if all other safety gates pass
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudflare_d1_recommendation_runs_guarded_insert.py --apply
      - name: Preserve sanitized result if a strict typed parity HOLD follows INSERT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-recommendation-runs-solo-additive-write-sanitized
          path: migration-out/d1-recommendation-runs-apply-sanitized.json
          if-no-files-found: warn
          retention-days: 2
