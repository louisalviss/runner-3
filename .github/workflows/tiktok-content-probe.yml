name: TikTok Content Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tiktok-content-probe.yml'
      - '.runner/tiktok-url.txt'
  pull_request:
    branches: [main]
    paths:
      - '.runner/tiktok-url.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe tools
        run: python -m pip install -q -U yt-dlp 'playwright>=1.46,<2'

      - name: Probe and extract content
        shell: bash
        run: |
          set -u
          mkdir -p evidence/frames
          URL="$(head -n1 .runner/tiktok-url.txt | tr -d '\r')"
          printf '%s\n' "$URL" > evidence/request_url.txt

          set +e
          yt-dlp --no-warnings --dump-single-json "$URL" > evidence/metadata.json 2> evidence/metadata.err
          META_RC=$?
          echo "$META_RC" > evidence/metadata_rc.txt

          yt-dlp --no-warnings \
            --write-info-json --write-thumbnail \
            --write-subs --write-auto-subs --sub-langs 'all,-live_chat' \
            --max-filesize 80M \
            -f 'best[height<=720]/best' \
            -o 'evidence/video.%(ext)s' "$URL" \
            > evidence/download.out 2> evidence/download.err
          DL_RC=$?
          echo "$DL_RC" > evidence/download_rc.txt
          set -e

          VIDEO="$(find evidence -maxdepth 1 -type f \( -name 'video.mp4' -o -name 'video.webm' -o -name 'video.mkv' \) | head -n1 || true)"
          if [ -n "$VIDEO" ]; then
            ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_type,codec_name,width,height -of json "$VIDEO" > evidence/ffprobe.json || true
            ffmpeg -hide_banner -loglevel error -i "$VIDEO" -vf 'fps=1/2,scale=640:-2' -frames:v 10 -q:v 4 evidence/frames/frame-%02d.jpg || true
          fi

          python3 - <<'PY'
          import json, pathlib
          from playwright.sync_api import sync_playwright
          url=pathlib.Path('.runner/tiktok-url.txt').read_text().splitlines()[0].strip()
          out={'requested_url':url}
          try:
              with sync_playwright() as p:
                  b=p.chromium.launch(channel='chrome', headless=True, args=['--no-sandbox','--disable-dev-shm-usage'])
                  c=b.new_context(viewport={'width':1280,'height':900}, user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36')
                  page=c.new_page()
                  resp=page.goto(url, wait_until='domcontentloaded', timeout=30000)
                  page.wait_for_timeout(5000)
                  out['status']=resp.status if resp else None
                  out['final_url']=page.url
                  out['title']=page.title()
                  try: out['body_text']=page.locator('body').inner_text(timeout=5000)[:12000]
                  except Exception as e: out['body_error']=str(e)
                  page.screenshot(path='evidence/page.png', full_page=False)
                  c.close(); b.close()
          except Exception as e:
              out['browser_error']=f'{type(e).__name__}: {e}'
          pathlib.Path('evidence/browser.json').write_text(json.dumps(out, ensure_ascii=False, indent=2))
          print(json.dumps(out, ensure_ascii=False))
          PY

          find evidence -maxdepth 2 -type f -printf '%p %s bytes\n' | sort | tee evidence/files.txt

      - name: Publish lightweight evidence to repo
        if: github.event_name == 'push'
        shell: bash
        run: |
          rm -f evidence/video.mp4 evidence/video.webm evidence/video.mkv
          rm -rf results/tiktok/latest
          mkdir -p results/tiktok/latest
          cp -R evidence/. results/tiktok/latest/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/tiktok/latest
          if ! git diff --cached --quiet; then
            git commit -m 'runner: publish TikTok probe evidence'
            git push
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-content-probe-${{ github.run_id }}
          path: evidence/
          retention-days: 3
