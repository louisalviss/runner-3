name: SPMO HF NPORT

on:
  push:
    branches: [main]
    paths:
      - 'spmo-hf/**'
      - '.github/workflows/spmo-hf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spmo-hf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB
        run: python -m pip install duckdb pandas
      - name: Query Hugging Face N-PORT mirror
        run: python -u spmo-hf/smoke.py
