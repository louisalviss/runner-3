name: SPMO HF NPORT

on:
  push:
    branches: [main]
    paths:
      - 'spmo-hf/**'
      - '.github/workflows/spmo-hf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spmo-hf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB
        run: python -m pip install duckdb pandas
      - name: Extract SPMO from Hugging Face N-PORT mirror
        run: python -u spmo-hf/extract_spmo.py
      - name: Upload extracted SPMO data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spmo-hf-${{ github.run_id }}
          path: spmo-hf/output/
          if-no-files-found: error
          retention-days: 7
