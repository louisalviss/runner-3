name: moxing-vi-finalize

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moxing-vi-finalize.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: moxing-vi-finalize-v1
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '32349331596'
  SOURCE_SHA256: '47234d96931c4249ae778d63f396fbee93c9d6f01b319426bdc3133859f1e3d2'
  MODEL_ID: 'DanVP/MoxhiMT-60'
  MODEL_REVISION: '3ae60c790cf21deebeab8e1a82f4024fbdc1fc87'
  TAG: 'moxing-vi-translation-v1-2026-08-17'
  ASSET: 'moxing-vi-translation-v1-2026-08-17.zip'
  STATUS_FILE: 'ops/moxing-vi-status.json'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download successful translation artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw-shards raw-input shards input
          gh run download "$SOURCE_RUN_ID" --pattern 'moxing-vi-shard-*' --dir raw-shards
          gh run download "$SOURCE_RUN_ID" --name 'moxing-translation-input' --dir raw-input
          find raw-shards -type f -name 'translation-*.jsonl' -exec cp {} shards/ \;
          find raw-input -type f -name 'moxing-translation-input.jsonl' -exec cp {} input/ \;
          test "$(find shards -maxdepth 1 -name 'translation-*.jsonl' | wc -l)" -eq 16
          test -f input/moxing-translation-input.jsonl

      - name: Merge and strict QA
        shell: bash
        run: |
          set -euo pipefail
          cat shards/translation-*.jsonl > translations.unsorted.jsonl
          python - <<'PY'
          import json,pathlib,hashlib,re,os,statistics
          inp={}
          for line in open('input/moxing-translation-input.jsonl',encoding='utf-8'):
              x=json.loads(line); inp[x['passage_id']]=x
          out=[]; ids=set(); empty=bad_sha=bad_model=empty_evidence=0
          zh_chars=chars=zh_heavy=length_outlier=0; ratios=[]; chunked=0
          ZH=re.compile(r'[\u3400-\u9fff]')
          for line in open('translations.unsorted.jsonl',encoding='utf-8'):
              x=json.loads(line); pid=x['passage_id']
              assert pid not in ids,pid; ids.add(pid)
              empty_evidence += not bool(x.get('evidence_id'))
              src=inp[pid]['text_zh']; expected=hashlib.sha256(src.encode()).hexdigest()
              assert x['evidence_id']==inp[pid]['evidence_id'],pid
              bad_sha += x['text_zh_sha256']!=expected
              bad_model += x.get('model_id')!=os.environ['MODEL_ID'] or x.get('model_revision')!=os.environ['MODEL_REVISION'] or x.get('runtime')!='CTranslate2 INT8'
              t=x['text_vi'].strip(); empty+=not bool(t); c=len(t); z=len(ZH.findall(t))
              chars+=c; zh_chars+=z; zh_heavy += bool(c and z/c>.25); length_outlier += c>1200
              chunked += int(x.get('translation_chunks',1)>1)
              if len(src): ratios.append(c/len(src))
              out.append(x)
          assert len(inp)==9538 and len(out)==9538,(len(inp),len(out))
          assert ids==set(inp),len(set(inp)-ids)
          assert empty==0,empty
          assert empty_evidence==0,empty_evidence
          assert bad_sha==0,bad_sha
          assert bad_model==0,bad_model
          ratio=zh_chars/max(chars,1)
          assert ratio < .08,ratio
          assert zh_heavy < 200,zh_heavy
          assert length_outlier < 20,length_outlier
          median_ratio=statistics.median(ratios)
          assert median_ratio < 4.5,median_ratio
          # Chunk count is an input-shape sanity signal, not a translation-quality metric.
          # The successful shards produced 197 long/chunked passages; require a broad floor only.
          assert chunked >= 150,chunked
          out.sort(key=lambda x:x['passage_id'])
          root=pathlib.Path('moxing_vi_translation'); root.mkdir()
          with open(root/'translations.jsonl','w',encoding='utf-8') as f:
              for x in out:f.write(json.dumps(x,ensure_ascii=False)+'\n')
          quality={
            'rows':len(out),'empty':empty,'empty_evidence_id':empty_evidence,
            'sha_mismatch':bad_sha,'model_mismatch':bad_model,
            'zh_char_ratio':round(ratio,6),'zh_heavy_rows':zh_heavy,
            'length_outlier_rows':length_outlier,
            'median_vi_zh_length_ratio':round(median_ratio,4),'chunked_rows':chunked
          }
          manifest={
            'schema':'moxing-vi-translation-v1.3',
            'source_run_id':int(os.environ['SOURCE_RUN_ID']),
            'source_sha256':os.environ['SOURCE_SHA256'],
            'model_id':os.environ['MODEL_ID'],'model_revision':os.environ['MODEL_REVISION'],
            'model_license':'Apache-2.0','runtime':'CTranslate2 INT8',
            'quality':quality,'shards':16,
            'policy':'Vietnamese is the default retrieval/display layer; original Chinese remains canonical provenance for nuance checks.'
          }
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Package and publish release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile,pathlib,hashlib,json,os
          asset=pathlib.Path(os.environ['ASSET']); root=pathlib.Path('moxing_vi_translation')
          with zipfile.ZipFile(asset,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.as_posix())
          m=json.load(open(root/'manifest.json',encoding='utf-8'))
          m['package']={'name':asset.name,'size_bytes':asset.stat().st_size,'sha256':hashlib.sha256(asset.read_bytes()).hexdigest()}
          (root/'release_manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(m['package'],indent=2))
          PY
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'Moxing Writing Vietnamese Translation v1 — 2026-08-17' --notes 'Vietnamese translation layer for all 9,538 retained Moxing writing passages. Original Chinese remains canonical provenance.'
          fi
          gh release edit "$TAG" --notes '9,538 retained Moxing writing passages translated to Vietnamese with DanVP/MoxhiMT-60 @ 3ae60c790cf21deebeab8e1a82f4024fbdc1fc87, CTranslate2 INT8. Finalized from run 32349331596 after all 16 translation shards passed shard QA. Chinese originals remain canonical provenance.'
          gh release upload "$TAG" "$ASSET" --clobber

      - name: Persist final success status
        shell: bash
        run: |
          set -euo pipefail
          size=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name==env.ASSET) | .size' | head -n1)
          test -n "$size" && test "$size" -gt 0
          mkdir -p ops
          export ASSET_SIZE="$size"
          python - <<'PY'
          import json,os,pathlib,datetime
          data={
            'schema':'moxing-vi-status-v3',
            'workflow':'moxing-vi-finalize.yml',
            'source_run_id':int(os.environ['SOURCE_RUN_ID']),
            'status':'completed','conclusion':'success',
            'release_tag':os.environ['TAG'],'release_asset':os.environ['ASSET'],
            'release_ok':True,'asset_size_bytes':int(os.environ['ASSET_SIZE']),
            'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'contract':'VN-first translation layer complete: 9,538/9,538 Moxing passages passed final QA and durable release exists.'
          }
          pathlib.Path(os.environ['STATUS_FILE']).write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATUS_FILE"
          git commit -m 'Mark Moxing VN translation complete [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i*2))
          done
          exit 1
