name: WR 2.5.15 Rebuild 5m
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/wr-2515-rebuild-5m.yml']
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify v2.5.15 Python oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wr
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
          cat >/tmp/oracle.py <<'PY'
          import json, math, sys, types
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          src=Path('/tmp/reference_verify.py').read_text()
          src=src.replace('sra<=SIGNAL_RANGE_MAX','sra<SIGNAL_RANGE_MAX')
          old="""        if v[c]==ext:\n            if sum(x==ext for x in w)==1: base[conf]=v[c]\n            else: ties+=1\n"""
          new="""        if v[c]==ext:\n            # Pine parity: older/left equal extreme allowed; newer/right equal extreme rejects.\n            if all(x!=ext for x in v[c+1:c+right+1]): base[conf]=v[c]\n            else: ties+=1\n"""
          if src.count(old)!=1: raise RuntimeError('pivot patch anchor missing')
          src=src.replace(old,new,1)
          mod=types.ModuleType('wrref'); mod.__file__='reference_verify.py'; sys.modules['wrref']=mod
          exec(compile(src,'reference_verify.py','exec'),mod.__dict__); ns=mod.__dict__
          VN=timezone(timedelta(hours=7))
          def ms(s): return int(datetime.fromisoformat(s).replace(tzinfo=VN).timestamp()*1000)
          STATE=ms('2026-07-28'); RUN_END=ms('2026-08-18')
          windows=[('W1',ms('2026-08-05'),ms('2026-08-10')),('W2',ms('2026-08-10'),ms('2026-08-16'))]
          expected={('BNBUSDT','W1'):(5,3.420895522388),('TRXUSDT','W1'):(4,2.6),('BNBUSDT','W2'):(3,6.9),('TRXUSDT','W2'):(2,-2.0)}
          def run(symbol,rs,re):
              ns['SYMBOL']=symbol; ns['START']='2026-07-27'; ns['END']='2026-08-18'; ns['WARMUP_DAYS']=0
              one,tick,missing=ns['fetch_1m']()
              bars=[x for x in ns['agg'](one,5) if x.ot>=STATE and x.ot<RUN_END]
              if not bars or bars[0].ot!=STATE: raise RuntimeError(f'{symbol}: anchor missing')
              ind,_,_=ns['calc_ind'](bars); Plan=ns['Plan']; next_bracket=ns['next_bracket']; session_flags=ns['session_flags']
              TP_R=ns['TP_R']; RISK_PCT=ns['RISK_PCT']; INIT=ns['INIT']
              eq=INIT; pending=active=None; entry_t=None; out=[]
              def close(i,reason,px):
                  nonlocal active,entry_t,eq
                  p=active
                  both=bars[i].h>=max(p.s,p.t) and bars[i].l<=min(p.s,p.t) and reason in ('TP','SL')
                  if both: reason='AMBIG->SL'
                  cr=TP_R if reason=='TP' else (-1.0 if reason in ('SL','AMBIG->SL') else ((px-p.e)*(1 if p.d==1 else -1)*p.qty/p.risk))
                  eq += cr*p.risk
                  if rs<=p.sig_t<re: out.append(cr)
                  active=None; entry_t=None
                  return True
              for i,x in enumerate(bars):
                  closed=False
                  if active is not None:
                      r,px=next_bracket(active,x,None)
                      if r: closed=close(i,r,px)
                  if active is None and pending is not None and i==pending.sig_i+1 and not closed:
                      fill=(pending.d==1 and round(x.h/tick)>=round(pending.e/tick)) or (pending.d==-1 and round(x.l/tick)<=round(pending.e/tick))
                      if fill:
                          gap=(pending.d==1 and round(x.o/tick)>=round(pending.e/tick)) or (pending.d==-1 and round(x.o/tick)<=round(pending.e/tick))
                          active=pending; pending=None; entry_t=x.ot
                          r,px=next_bracket(active,x,None if gap else active.e)
                          if r: closed=close(i,r,px)
                  allowed,sexit=session_flags(x.ct+1,5*60000)
                  if active is not None and not closed:
                      z=ind[i]; le=active.d==1 and x.c<z['ema'] and not z['ha'] and not z['ema_up']; se=active.d==-1 and x.c>z['ema'] and not z['hb'] and bool(z['ema_up'])
                      if sexit: closed=close(i,'SESSION',x.c)
                      elif le or se: closed=close(i,'EMA',x.c)
                  if pending is not None and i>=pending.sig_i+1 and active is None: pending=None
                  if active is None and pending is None and not closed:
                      z=ind[i]; lr=z['ha'] and x.c>z['ema'] and z['ag'] and z['chop_ok'] and z['res'] is not None; sr=z['hb'] and x.c<z['ema'] and z['ar'] and z['chop_ok'] and z['sup'] is not None
                      nl=allowed and z['sra_ok'] and x.c>x.o and lr and x.c>z['res'] and x.l<=z['res']; sh=allowed and z['sra_ok'] and x.c<x.o and sr and x.c<z['sup'] and x.h>=z['sup']
                      if nl or sh:
                          if nl: d=1; e=x.h+tick; s=x.l-tick; t=e+TP_R*(e-s)
                          else: d=-1; e=x.l-tick; s=x.h+tick; t=e-TP_R*(s-e)
                          raw=(eq*RISK_PCT/100)/abs(e-s); q=math.floor(raw); risk=abs(e-s)*q
                          if q>0 and risk>0: pending=Plan(d,e,s,t,risk,q,i,x.ct,x.h,x.l)
              return len(out),sum(out)
          rows=[]
          for sym in ('BNBUSDT','TRXUSDT'):
              for label,rs,re in windows:
                  got=run(sym,rs,re); exp=expected[(sym,label)]; ok=got[0]==exp[0] and abs(got[1]-exp[1])<=0.02
                  rows.append(dict(symbol=sym,window=label,trades=got[0],total_r=got[1],expected_trades=exp[0],expected_r=exp[1],pass_=ok))
                  print(sym,label,got,'PASS' if ok else 'FAIL')
                  if not ok: raise SystemExit(7)
          Path('/tmp/wr/oracle.json').write_text(json.dumps(rows,indent=2))
          print('PARITY_4_WINDOWS=PASS')
          PY
          python3 /tmp/oracle.py | tee /tmp/wr/oracle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr2515-oracle
          path: /tmp/wr
          retention-days: 3

  baseline:
    needs: oracle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - name: Run 5m raw baseline shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
        run: |
          set -euo pipefail
          mkdir -p /tmp/wr
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
          cat >/tmp/full5.py <<'PY'
          import csv, io, json, math, os, sys, time, types, zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          import requests
          src=Path('/tmp/reference_verify.py').read_text().replace('sra<=SIGNAL_RANGE_MAX','sra<SIGNAL_RANGE_MAX')
          old="""        if v[c]==ext:\n            if sum(x==ext for x in w)==1: base[conf]=v[c]\n            else: ties+=1\n"""; new="""        if v[c]==ext:\n            if all(x!=ext for x in v[c+1:c+right+1]): base[conf]=v[c]\n            else: ties+=1\n"""
          if src.count(old)!=1: raise RuntimeError('pivot patch anchor missing')
          src=src.replace(old,new,1)
          mod=types.ModuleType('wrref'); mod.__file__='reference_verify.py'; sys.modules['wrref']=mod; exec(compile(src,'reference_verify.py','exec'),mod.__dict__); ns=mod.__dict__
          Bar=ns['Bar']; Plan=ns['Plan']; calc_ind=ns['calc_ind']; next_bracket=ns['next_bracket']; session_flags=ns['session_flags']; TP_R=ns['TP_R']; RISK_PCT=ns['RISK_PCT']; INIT=ns['INIT']
          SHARD=int(os.environ['SHARD']); SHARDS=int(os.environ['SHARDS']); sess=requests.Session(); sess.headers['User-Agent']='runner3-wr2515-rebuild/1.0'
          ex=sess.get('https://fapi.binance.com/fapi/v1/exchangeInfo',timeout=30).json()
          metas=[]
          for s in ex['symbols']:
              if s.get('contractType')!='PERPETUAL' or s.get('quoteAsset')!='USDT' or s.get('status')!='TRADING': continue
              tick=float(next(f['tickSize'] for f in s['filters'] if f['filterType']=='PRICE_FILTER'))
              lot=next(f for f in s['filters'] if f['filterType']=='LOT_SIZE'); step=float(lot['stepSize'])
              metas.append((s['symbol'],tick,step))
          metas=sorted(metas)
          metas=[m for i,m in enumerate(metas) if i%SHARDS==SHARD]
          STATE=int(datetime(2024,12,1,tzinfo=timezone.utc).timestamp()*1000); START=int(datetime(2025,1,1,tzinfo=timezone.utc).timestamp()*1000); END=int(datetime(2026,8,15,tzinfo=timezone.utc).timestamp()*1000); RUN_END=int(datetime(2026,8,18,tzinfo=timezone.utc).timestamp()*1000)
          months=[(2024,12)]+[(2025,m) for m in range(1,13)]+[(2026,m) for m in range(1,8)]
          def getzip(url):
              for k in range(3):
                  try:
                      r=sess.get(url,timeout=30)
                      if r.status_code==404:return None
                      r.raise_for_status(); return r.content
                  except Exception:
                      if k==2: raise
                      time.sleep(0.5*(k+1))
          def readzip(data):
              out=[]
              if not data:return out
              with zipfile.ZipFile(io.BytesIO(data)) as z: text=z.read(z.namelist()[0]).decode()
              for row in csv.reader(io.StringIO(text)):
                  if not row or not row[0].isdigit():continue
                  out.append(Bar(int(row[0]),int(row[6]),*map(float,row[1:5])))
              return out
          def bars_for(sym):
              b=[]
              for y,m in months:
                  fn=f'{sym}-5m-{y:04d}-{m:02d}.zip'; u=f'https://data.binance.vision/data/futures/um/monthly/klines/{sym}/5m/{fn}'
                  try:b.extend(readzip(getzip(u)))
                  except Exception:pass
              for d in range(1,19):
                  fn=f'{sym}-5m-2026-08-{d:02d}.zip'; u=f'https://data.binance.vision/data/futures/um/daily/klines/{sym}/5m/{fn}'
                  try:b.extend(readzip(getzip(u)))
                  except Exception:pass
              ded={x.ot:x for x in b}; return [ded[k] for k in sorted(ded) if STATE<=k<RUN_END]
          def bt(sym,tick,step,bars):
              if len(bars)<1000:return None,[]
              ind,_,_=calc_ind(bars); eq=INIT; pending=active=None; trades=[]
              def close(i,reason,px):
                  nonlocal active,eq
                  p=active; both=bars[i].h>=max(p.s,p.t) and bars[i].l<=min(p.s,p.t) and reason in ('TP','SL')
                  if both:reason='AMBIG->SL'
                  cr=TP_R if reason=='TP' else (-1.0 if reason in ('SL','AMBIG->SL') else ((px-p.e)*(1 if p.d==1 else -1)*p.qty/p.risk))
                  eq += cr*p.risk
                  if START<=p.sig_t<END:
                      stop_pct=abs(p.e-p.s)/p.e*100; reqx=(1.0/stop_pct if stop_pct>0 else None)
                      trades.append(dict(symbol=sym,tf=5,signal_time=p.sig_t,side='LONG' if p.d==1 else 'SHORT',entry=p.e,stop=p.s,target=p.t,exit_time=bars[i].ct,exit_reason=reason,R=cr,stop_pct=stop_pct,required_x=reqx))
                  active=None; return True
              for i,x in enumerate(bars):
                  closed=False
                  if active is not None:
                      r,px=next_bracket(active,x,None)
                      if r:closed=close(i,r,px)
                  if active is None and pending is not None and i==pending.sig_i+1 and not closed:
                      fill=(pending.d==1 and round(x.h/tick)>=round(pending.e/tick)) or (pending.d==-1 and round(x.l/tick)<=round(pending.e/tick))
                      if fill:
                          gap=(pending.d==1 and round(x.o/tick)>=round(pending.e/tick)) or (pending.d==-1 and round(x.o/tick)<=round(pending.e/tick)); active=pending; pending=None
                          r,px=next_bracket(active,x,None if gap else active.e)
                          if r:closed=close(i,r,px)
                  allowed,sexit=session_flags(x.ct+1,5*60000)
                  if active is not None and not closed:
                      z=ind[i]; le=active.d==1 and x.c<z['ema'] and not z['ha'] and not z['ema_up']; se=active.d==-1 and x.c>z['ema'] and not z['hb'] and bool(z['ema_up'])
                      if sexit:closed=close(i,'SESSION',x.c)
                      elif le or se:closed=close(i,'EMA',x.c)
                  if pending is not None and i>=pending.sig_i+1 and active is None:pending=None
                  if x.ot<STATE or x.ct>=RUN_END:continue
                  if active is None and pending is None and not closed:
                      z=ind[i]; lr=z['ha'] and x.c>z['ema'] and z['ag'] and z['chop_ok'] and z['res'] is not None; sr=z['hb'] and x.c<z['ema'] and z['ar'] and z['chop_ok'] and z['sup'] is not None
                      nl=allowed and z['sra_ok'] and x.c>x.o and lr and x.c>z['res'] and x.l<=z['res']; sh=allowed and z['sra_ok'] and x.c<x.o and sr and x.c<z['sup'] and x.h>=z['sup']
                      if nl or sh:
                          if nl:d=1;e=x.h+tick;s=x.l-tick;t=e+TP_R*(e-s)
                          else:d=-1;e=x.l-tick;s=x.h+tick;t=e-TP_R*(s-e)
                          raw=(eq*RISK_PCT/100)/abs(e-s); q=math.floor(raw/step)*step; risk=abs(e-s)*q
                          if q>0 and risk>0:pending=Plan(d,e,s,t,risk,q,i,x.ct,x.h,x.l)
              rs=[t['R'] for t in trades]; n=len(rs); gp=sum(max(r,0) for r in rs); gl=sum(max(-r,0) for r in rs)
              row=dict(symbol=sym,tf=5,n=n,total_r=sum(rs),avg_r=(sum(rs)/n if n else None),win_rate=(100*sum(r>0 for r in rs)/n if n else None),pf=(gp/gl if gl else None))
              for bps in (4,6,8,10): row[f'net_r_{bps}bps']=sum(t['R']-(t['entry']/abs(t['entry']-t['stop']))*bps/10000 for t in trades)
              return row,trades
          summaries=[]; alltr=[]; errors=[]
          for j,(sym,tick,step) in enumerate(metas,1):
              try:
                  bars=bars_for(sym); row,tr=bt(sym,tick,step,bars)
                  if row:summaries.append(row); alltr.extend(tr)
                  print(f'[{SHARD}] {j}/{len(metas)} {sym} bars={len(bars)} trades={0 if row is None else row["n"]}',flush=True)
              except Exception as e:
                  errors.append(dict(symbol=sym,error=repr(e))); print('ERROR',sym,repr(e),flush=True)
          Path(f'/tmp/wr/summary-{SHARD}.json').write_text(json.dumps(summaries))
          with open(f'/tmp/wr/trades-{SHARD}.jsonl','w') as f:
              for x in alltr:f.write(json.dumps(x)+'\n')
          Path(f'/tmp/wr/errors-{SHARD}.json').write_text(json.dumps(errors,indent=2))
          Path(f'/tmp/wr/meta-{SHARD}.json').write_text(json.dumps(dict(shard=SHARD,symbols=len(metas),summaries=len(summaries),trades=len(alltr),errors=len(errors)),indent=2))
          PY
          python3 /tmp/full5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr2515-5m-shard-${{ matrix.shard }}
          path: /tmp/wr
          retention-days: 3

  merge:
    needs: baseline
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wr2515-5m-shard-*
          path: /tmp/all
          merge-multiple: true
      - name: Merge baseline
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,json,glob,os
          S=[]; E=[]
          for p in glob.glob('/tmp/all/summary-*.json'):S+=json.load(open(p))
          for p in glob.glob('/tmp/all/errors-*.json'):E+=json.load(open(p))
          S.sort(key=lambda x:(-(x['net_r_6bps'] if x.get('net_r_6bps') is not None else -1e99),x['symbol']))
          os.makedirs('/tmp/final',exist_ok=True)
          json.dump(S,open('/tmp/final/summary.json','w'),indent=2); json.dump(E,open('/tmp/final/errors.json','w'),indent=2)
          fields=['symbol','tf','n','total_r','avg_r','win_rate','pf','net_r_4bps','net_r_6bps','net_r_8bps','net_r_10bps']
          with open('/tmp/final/summary.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows({k:r.get(k) for k in fields} for r in S)
          for out in glob.glob('/tmp/all/trades-*.jsonl'):
              with open('/tmp/final/trades.jsonl','a') as dst,open(out) as src:dst.write(src.read())
          elig=[x for x in S if x['n']>=100]; gross=sum(x['avg_r']>0 for x in elig); net=sum(x['net_r_6bps']>0 for x in elig)
          report={'symbols_completed':len(S),'errors':len(E),'cells_n_ge_100':len(elig),'gross_positive_n_ge_100':gross,'net6_positive_n_ge_100':net,'top20_net6':S[:20]}
          json.dump(report,open('/tmp/final/report.json','w'),indent=2)
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wr2515-5m-baseline-final
          path: /tmp/final
          retention-days: 7
