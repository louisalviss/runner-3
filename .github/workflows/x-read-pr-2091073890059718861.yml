name: X read PR 2091073890059718861

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/x-read-pr/**'

permissions:
  contents: read

jobs:
  read-x:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Fetch exact X status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          url='https://api.fxtwitter.com/bkdgiffug/status/2091073890059718861'
          req=urllib.request.Request(url,headers={'User-Agent':'runner-3-x-fast/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r:
              d=json.loads(r.read().decode())
          t=d.get('tweet') or d.get('status') or {}
          out={
            'code': d.get('code'),
            'url': t.get('url'),
            'author': (t.get('author') or {}).get('screen_name'),
            'text': t.get('text') or (t.get('raw_text') or {}).get('text'),
            'created_at': t.get('created_at'),
            'likes': t.get('likes'),
            'retweets': t.get('retweets'),
            'replies': t.get('replies'),
            'views': t.get('views'),
            'quote': t.get('quote'),
          }
          print('X_RESULT_START')
          print(json.dumps(out,ensure_ascii=False))
          print('X_RESULT_END')
          if int(d.get('code',0)) != 200 or not out['text']:
              raise SystemExit('No usable tweet')
          PY
