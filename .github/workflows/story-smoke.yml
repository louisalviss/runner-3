name: Story Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'jobs/2026-08-15-metruyenchu-story-smoke-v2.json'

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python crawler.py jobs/2026-08-15-metruyenchu-story-smoke-v2.json --output crawl_output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-smoke-${{ github.run_id }}
          path: crawl_output/
          if-no-files-found: warn
          retention-days: 1
