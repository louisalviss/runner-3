name: R2 Download Pages Deploy
on:
  push:
    branches: [main]
    paths:
      - 'apps/r2-download-pages/**'
      - '.github/workflows/r2-download-pages-deploy.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r2-download-pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: runner3-download-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create project if needed and deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main >/tmp/create.log 2>&1 || true
          npx --yes wrangler@4 pages deploy apps/r2-download-pages --project-name "$PROJECT" --branch main --commit-dirty=true 2>&1 | tee /tmp/deploy.log
      - name: Smoke direct download
        shell: bash
        run: |
          set -euo pipefail
          url="https://${PROJECT}.pages.dev/%40LinkFilesBot.apk"
          ok=false
          code=''
          disp=''
          ctype=''
          size=0
          sha=''
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -L -D /tmp/h -o /tmp/file -w '%{http_code}' "$url" || true)
            if [ "$code" = 200 ] && [ -s /tmp/file ]; then
              size=$(stat -c '%s' /tmp/file)
              sha=$(sha256sum /tmp/file | awk '{print $1}')
              disp=$(grep -i '^content-disposition:' /tmp/h | tail -1 | tr -d '\r' | sed 's/^[^:]*: *//I')
              ctype=$(grep -i '^content-type:' /tmp/h | tail -1 | tr -d '\r' | sed 's/^[^:]*: *//I')
              if [ "$size" = 13951503 ] && [ "$sha" = 9e72a0ab7e8ae1f31b8c1086efdffa6b4842aff114e8ea1fc7162501571fb537 ] && echo "$disp" | grep -qi '^attachment'; then ok=true; break; fi
            fi
            sleep 3
          done
          mkdir -p ops/r2-download-pages
          export url code disp ctype size sha ok
          python - <<'PY'
          import os,json,datetime
          out={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'project':os.environ['PROJECT'],'url':os.environ['url'],'httpCode':os.environ['code'],'contentDisposition':os.environ['disp'],'contentType':os.environ['ctype'],'size':int(os.environ['size']),'sha256':os.environ['sha'],'verified':os.environ['ok']=='true'}
          open('ops/r2-download-pages/latest.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          test "$ok" = true
      - name: Persist result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/r2-download-pages/latest.json || exit 0
          cp ops/r2-download-pages/latest.json /tmp/pages-result.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for n in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/r2-download-pages
            cp /tmp/pages-result.json ops/r2-download-pages/latest.json
            git add ops/r2-download-pages/latest.json
            git diff --cached --quiet && exit 0
            git commit -m 'Publish R2 Pages download status [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 3
