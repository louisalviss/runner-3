name: X Lens Reverse Search

on:
  push:
    paths:
      - x-lens-job.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-lens
  cancel-in-progress: false

jobs:
  lens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Chromium runner
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Reverse search with rendered Google Lens
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote, urlparse
          from playwright.sync_api import sync_playwright

          job = json.loads(Path('x-lens-job.json').read_text(encoding='utf-8'))
          image_url = job['image_url']
          tweet_id = str(job.get('tweet_id') or 'unknown')
          outdir = Path('x-lens-results') / tweet_id
          outdir.mkdir(parents=True, exist_ok=True)
          target = 'https://lens.google.com/uploadbyurl?hl=en&gl=US&url=' + quote(image_url, safe='')
          result = {'image_url': image_url, 'ok': False, 'links': []}

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True, args=['--no-sandbox'])
                  page = browser.new_page(
                      viewport={'width': 1440, 'height': 1200},
                      user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
                      locale='en-US',
                  )
                  page.goto(target, wait_until='domcontentloaded', timeout=90000)
                  page.wait_for_timeout(10000)
                  result['final_url'] = page.url
                  result['page_title'] = page.title()
                  result['visible_text'] = page.locator('body').inner_text(timeout=30000)[:70000]
                  page.screenshot(path=str(outdir / 'lens-page.png'), full_page=True)

                  seen = set()
                  links = []
                  for a in page.locator('a').all():
                      try:
                          href = a.get_attribute('href') or ''
                          text = (a.inner_text(timeout=1000) or '').strip()
                      except Exception:
                          continue
                      if href.startswith('/'):
                          href = 'https://www.google.com' + href
                      if not href.startswith('http'):
                          continue
                      host = urlparse(href).netloc.lower()
                      if host.endswith('google.com') or host.endswith('googleusercontent.com') or host.endswith('gstatic.com'):
                          continue
                      key = (href, text)
                      if key in seen:
                          continue
                      seen.add(key)
                      links.append({'text': text[:500], 'url': href})
                  result['links'] = links[:200]
                  result['ok'] = True
                  browser.close()
          except Exception as exc:
              result['error'] = repr(exc)

          (outdir / 'lens.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'ok': result.get('ok'), 'title': result.get('page_title'), 'links': len(result.get('links') or []), 'error': result.get('error')}, ensure_ascii=False))
          PY

      - name: Publish Lens result
        if: always()
        run: |
          if [ ! -d x-lens-results ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-lens-results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "x lens result ${{ github.run_id }}"
          git pull --rebase origin main
          git push origin HEAD:main
