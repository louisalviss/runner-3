name: Wave Rider Forward Count [PARITY GATED]

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-rider-forward-count
  cancel-in-progress: false

jobs:
  count-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Require TradingView parity PASS
        run: python wave-rider-verify/assert_parity_gate.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Count frozen forward trades only
        run: python formal-tests/wave_rider_forward_count.py
