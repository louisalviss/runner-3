name: WR BNB Pivot Diagnostics
on:
  push:
    branches: [main]
    paths:
      - formal-tests/wr_bnb_pivot_diagnostics.py
      - .github/workflows/wr-bnb-pivot-diagnostics.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python formal-tests/wr_bnb_pivot_diagnostics.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr-bnb-pivot-diagnostics
          path: wr_bnb_pivot_diagnostics.json
          retention-days: 7
