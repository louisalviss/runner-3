name: AutoContent Engine Real MVP

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Editorial focus
        required: false
        default: EV technology, charging, battery economics and real-world ownership
        type: string
      publish_status:
        description: WordPress status
        required: true
        default: draft
        type: choice
        options:
          - draft
          - publish
  push:
    branches:
      - main
      - autocontent-real-mvp
    paths:
      - '.github/workflows/autocontent-engine.yml'

permissions:
  contents: write
  models: read

concurrency:
  group: runner3-autocontent-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WP_SITE_SLUG: runner3-factory-smoke-2
      AUTOCONTENT_MODEL: openai/gpt-4.1
      AUTOCONTENT_FOCUS: ${{ github.event_name == 'workflow_dispatch' && inputs.focus || 'EV technology, charging, battery economics and real-world ownership' }}
      AUTOCONTENT_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_status || 'draft' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.ref_name }}

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Generate grounded automotive package
        run: |
          set -euo pipefail
          python scripts/autocontent_engine.py \
            --focus "$AUTOCONTENT_FOCUS" \
            --status "$AUTOCONTENT_STATUS" \
            --model "$AUTOCONTENT_MODEL"

      - name: Decrypt existing WordPress credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { echo "Automation key unavailable"; exit 3; }
          echo '::add-mask::'"$AUTOMATION_KEY"
          encrypted="ops/wp-control/${WP_SITE_SLUG}.credential.aes"
          test -f "$encrypted" || { echo "Credential not found for ${WP_SITE_SLUG}"; exit 4; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in "$encrypted" \
            -out /tmp/wp-control.json
          chmod 600 /tmp/wp-control.json

      - name: Create WordPress post
        id: wordpress
        shell: bash
        env:
          WP_CONTROL_REQUEST: data/autocontent/wp-request.json
        run: |
          set +e
          node scripts/wordpress-control.mjs 2>&1 | tee /tmp/autocontent-wordpress.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Merge safe WordPress result
        if: always()
        shell: bash
        env:
          WP_RC: ${{ steps.wordpress.outputs.rc }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          latest_path = Path("data/autocontent/latest.json")
          if not latest_path.exists():
              raise SystemExit(0)

          data = json.loads(latest_path.read_text(encoding="utf-8"))
          slug = os.environ.get("WP_SITE_SLUG", "runner3-factory-smoke-2")
          result_path = Path(f"/tmp/wp-control-result-{slug}.json")
          rc = int(os.environ.get("WP_RC") or 99)

          safe = None
          if result_path.exists():
              safe = json.loads(result_path.read_text(encoding="utf-8"))

          wp = data.setdefault("wordpress", {})
          wp["runner_rc"] = rc
          wp["result"] = safe
          if rc == 0 and safe and safe.get("status") == "ok":
              data["status"] = "wordpress_created"
              result = safe.get("result") or {}
              wp["post"] = {
                  "id": result.get("id"),
                  "status": result.get("status"),
                  "slug": result.get("slug"),
                  "link": result.get("link"),
              }
          else:
              data["status"] = "wordpress_failed"

          latest_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Clean decrypted credential
        if: always()
        run: rm -f /tmp/wp-control.json

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autocontent-${{ github.run_id }}
          path: |
            data/autocontent/latest.json
            /tmp/autocontent-wordpress.log
          if-no-files-found: warn
          retention-days: 14

      - name: Persist safe run report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f data/autocontent/wp-request.json
          test -f data/autocontent/latest.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/autocontent/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist AutoContent run report"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 3
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 5

      - name: Enforce WordPress success
        if: always()
        shell: bash
        env:
          WP_RC: ${{ steps.wordpress.outputs.rc }}
        run: |
          rc="${WP_RC:-99}"
          test "$rc" = "0" || { echo "WordPress create failed with rc=$rc"; exit "$rc"; }
