name: tmp Core mailbox guard deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-core-mailbox-guard-deploy-20260901.yml'

permissions:
  contents: write

concurrency:
  group: runner3-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose canonical Core and deploy strict guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('cloudflare/runner3-core')
          wrapper=root/'artifact-library-reader-v7-github-audio-entry.js'
          text=wrapper.read_text(encoding='utf-8')
          text,count=re.subn(r'import app from "\\./artifact-library-reader-v\\d+[^\"]*-entry\\.js";','import app from "./artifact-library-reader-v35-continuity-single-owner-entry.js";',text,count=1)
          if count != 1: raise SystemExit('reader wrapper import marker missing')
          wrapper.write_text(text,encoding='utf-8')
          mailbox=root/'mailbox-entry.js'
          text=mailbox.read_text(encoding='utf-8')
          old='import app from "./audio-entry.js";'; new='import app from "./artifact-library-reader-v7-github-audio-entry.js";'
          if old not in text and new not in text: raise SystemExit('mailbox import marker missing')
          if old in text: text=text.replace(old,new,1)
          if 'const NEW_REQUEST_ID_RE = /^m_[0-9a-f]{32}$/;' not in text: raise SystemExit('strict request-id guard missing')
          if 'if (!NEW_REQUEST_ID_RE.test(requestId))' not in text: raise SystemExit('submit boundary guard missing')
          mailbox.write_text(text,encoding='utf-8')
          cfg=root/'wrangler.jsonc'; data=json.loads(cfg.read_text(encoding='utf-8')); data['main']='mailbox-entry.js'; cfg.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/mailbox-entry.js
          cd cloudflare/runner3-core
          npx --yes wrangler@4 deploy
          echo 'CORE_STRICT_GUARD_DEPLOY=PASS'
      - name: Self-clean workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/tmp-core-mailbox-guard-deploy-20260901.yml
          git add .github/workflows/tmp-core-mailbox-guard-deploy-20260901.yml
          git commit -m 'cleanup: remove Core mailbox guard deploy workflow' || exit 0
          git push origin HEAD:main
