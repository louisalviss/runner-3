name: Runner3WP V2 R2 Critical Size Measure
on:
  push:
    branches: [main]
    paths: ['.github/workflows/runner3wp-v2-r2-measure.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: runner3wp-v2-r2-measure
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: wordpress-edge-proxy-v2
      CF_WORKER_CONFIG: edge/wordpress-edge-proxy/wrangler.v2.jsonc
      CF_EDGE_URL: https://wordpress-edge-proxy-v2.ducduy2411.workers.dev
      CF_EDGE_OUT: /tmp/runner3wp-v2-edge.json
      CF_SNAPSHOT_OUT: /tmp/runner3wp-v2-snapshot.json
      V2_URL: https://wordpress-edge-proxy-v2.ducduy2411.workers.dev/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9b46dd3ee0458bc5c1e34f50b4e012cf4e19858e
          fetch-depth: 0
      - name: Apply and deploy measurement candidate
        env:
          RUNNER3_FCP_V2: '1'
        run: |
          set -euo pipefail
          node --check scripts/apply-runner3wp-critical-shell-r2.mjs
          node scripts/apply-runner3wp-critical-shell-r2.mjs
          node --check scripts/build-wordpress-edge-snapshot.mjs
          node scripts/deploy-wordpress-workers-cache.mjs
      - name: Measure live V2
        if: always()
        run: |
          mkdir -p /tmp/r2m
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=await fetch(process.env.V2_URL,{headers:{'user-agent':'Runner3WP-R2-Measure/1.0'}});const h=await r.text();const head=(h.match(/<head\b[^>]*>([\s\S]*?)<\/head>/i)||[])[1]||'';const m=head.match(/<style\b[^>]*data-runner3-v2-critical="r2"[^>]*>([\s\S]*?)<\/style>/i);const out={status:'ready',http:r.status,snapshot:r.headers.get('x-edge-snapshot'),noindex:r.headers.get('x-robots-tag'),headBytes:Buffer.byteLength(head),criticalCssBytes:m?Buffer.byteLength(m[1]):null,marker:!!m,template:h.includes('id="runner3-v2-deferred-css"'),loader:h.includes('data-runner3-v2-css-loader="r2"'),checkedAt:new Date().toISOString()};fs.writeFileSync('/tmp/r2m/result.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));
          NODE
      - name: Always restore baseline V2
        if: always()
        env:
          RUNNER3_FCP_V2: '0'
        run: |
          set -euo pipefail
          node scripts/deploy-wordpress-workers-cache.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';const r=await fetch(process.env.V2_URL);const h=await r.text();const out={ok:r.status===200&&String(r.headers.get('x-edge-snapshot')||'').toUpperCase()==='HIT'&&/noindex/i.test(r.headers.get('x-robots-tag')||'')&&!h.includes('data-runner3-v2-critical="r2"'),http:r.status,snapshot:r.headers.get('x-edge-snapshot'),noindex:r.headers.get('x-robots-tag'),marker:h.includes('data-runner3-v2-critical="r2"'),checkedAt:new Date().toISOString()};fs.writeFileSync('/tmp/r2m/final.json',JSON.stringify(out,null,2));if(!out.ok)process.exit(12);
          NODE
      - name: Persist measurement
        if: always()
        run: |
          set -euo pipefail
          git reset --hard; git fetch origin runner3wp-v2-fcp-test; git checkout -B runner3wp-v2-fcp-test origin/runner3wp-v2-fcp-test; mkdir -p ops/perf/ab; cp /tmp/r2m/result.json ops/perf/ab/runner3wp-v2-r2-measure.latest.json 2>/dev/null || echo '{"status":"failed"}' > ops/perf/ab/runner3wp-v2-r2-measure.latest.json; cp /tmp/r2m/final.json ops/perf/ab/runner3wp-v2-r2-measure-final.latest.json 2>/dev/null || true; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add ops/perf/ab/runner3wp-v2-r2-measure*.json; git commit -m 'diag: persist Runner3WP R2 critical size measurement' || exit 0; git push origin HEAD:runner3wp-v2-fcp-test
