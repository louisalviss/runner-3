name: Zero Touch Hosting Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zero-touch-hosting-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create disposable Mail.tm inbox
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, secrets, urllib.request
          def req(url, data=None):
              headers={'Content-Type':'application/json'}
              r=urllib.request.Request(url, data=(json.dumps(data).encode() if data else None), headers=headers, method='POST' if data else 'GET')
              with urllib.request.urlopen(r, timeout=30) as x: return json.loads(x.read().decode())
          d=req('https://api.mail.tm/domains')
          domains=d.get('hydra:member') or d.get('member') or []
          domain=next(x['domain'] for x in domains if x.get('isActive', True))
          user='runner3wp'+secrets.token_hex(5)
          password=secrets.token_urlsafe(24)
          address=f'{user}@{domain}'
          req('https://api.mail.tm/accounts', {'address':address,'password':password})
          tok=req('https://api.mail.tm/token', {'address':address,'password':password})['token']
          open('/tmp/mailtm.json','w').write(json.dumps({'address':address,'password':password,'token':tok}))
          print('MAILTM_CREATED=true')
          print('MAILTM_DOMAIN='+domain)
          PY

      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.58.2

      - name: Inspect Wasmer Hobby signup
        shell: bash
        run: |
          set -euo pipefail
          cat > probe-wasmer.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const mail=JSON.parse(fs.readFileSync('/tmp/mailtm.json','utf8'));
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();
          async function report(label){
            await page.waitForTimeout(1800);
            const body=(await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim();
            const html=(await page.content().catch(()=>'' )).toLowerCase();
            const fields=await page.locator('input,select,textarea').evaluateAll(els=>els.map((e,i)=>({
              i,tag:e.tagName,type:e.type||'',name:e.name||'',id:e.id||'',placeholder:e.placeholder||'',required:!!e.required,
              label:(e.labels&&e.labels.length?[...e.labels].map(x=>x.innerText.trim()).join(' | '):'')
            })).filter(x=>x.type!=='hidden')).catch(()=>[]);
            const controls=await page.locator('a,button,input[type=submit]').evaluateAll(els=>els.map((e,i)=>({
              i,tag:e.tagName,text:(e.innerText||e.value||'').replace(/\s+/g,' ').trim().slice(0,120),href:e.href||'',type:e.type||''
            })).filter(x=>x.text||x.href).slice(0,120)).catch(()=>[]);
            const markers=['recaptcha','hcaptcha','turnstile','captcha','verify you are human','cf-chl-','security verification'].filter(x=>html.includes(x)||body.toLowerCase().includes(x));
            console.log('--- '+label+' ---');
            console.log('URL='+page.url());
            console.log('CAPTCHA_MARKERS='+markers.join(','));
            console.log('FIELDS='+JSON.stringify(fields));
            console.log('CONTROLS='+JSON.stringify(controls));
            console.log('BODY_SAMPLE='+body.slice(0,2600));
          }
          try {
            await page.goto('https://wasmer.io/signup',{waitUntil:'domcontentloaded',timeout:60000});
            await report('SIGNUP_ENTRY');
            const hobby=page.getByText(/personal projects|hobby/i).first();
            if(await hobby.count()) await hobby.click({timeout:8000}).catch(()=>{});
            const cont=page.getByRole('button',{name:/continue/i}).first();
            if(await cont.count()) await cont.click({timeout:8000}).catch(()=>{});
            await report('AFTER_HOBBY');
            const email=page.locator('input[type=email],input[name*=mail i],input[autocomplete=email]').first();
            if(await email.count()) {
              await email.fill(mail.address);
              console.log('TEMP_EMAIL_CAN_FILL=true');
            }
          } finally { await browser.close(); }
          JS
          node probe-wasmer.mjs
