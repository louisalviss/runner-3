name: Zero Touch Hosting Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zero-touch-hosting-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Create disposable Mail.tm inbox
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, secrets, urllib.request
          def req(url, data=None):
              headers={'Content-Type':'application/json'}
              r=urllib.request.Request(url, data=(json.dumps(data).encode() if data else None), headers=headers, method='POST' if data else 'GET')
              with urllib.request.urlopen(r, timeout=30) as x: return json.loads(x.read().decode())
          d=req('https://api.mail.tm/domains')
          domains=d.get('hydra:member') or d.get('member') or []
          domain=next(x['domain'] for x in domains if x.get('isActive', True))
          user='runner3wp'+secrets.token_hex(5)
          password=secrets.token_urlsafe(24)
          address=f'{user}@{domain}'
          req('https://api.mail.tm/accounts', {'address':address,'password':password})
          tok=req('https://api.mail.tm/token', {'address':address,'password':password})['token']
          open('/tmp/mailtm.json','w').write(json.dumps({'address':address,'password':password,'token':tok}))
          print('MAILTM_CREATED=true')
          PY

      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.58.2

      - name: Advance FreeWHA to signup form
        shell: bash
        run: |
          set -euo pipefail
          cat > inspect-freewha.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          import crypto from 'crypto';
          const mail=JSON.parse(fs.readFileSync('/tmp/mailtm.json','utf8'));
          const slug='runner3wp'+crypto.randomBytes(4).toString('hex');
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();
          async function report(label){
            await page.waitForTimeout(1800);
            const fields=await page.locator('input,select,textarea').evaluateAll(els=>els.map((e,i)=>({i,tag:e.tagName,type:e.type||'',name:e.name||'',id:e.id||'',placeholder:e.placeholder||'',required:!!e.required,value:e.type==='hidden'?'[hidden]':(e.value||'').slice(0,100)})).filter(x=>x.type!=='hidden'));
            const forms=await page.locator('form').evaluateAll(els=>els.map((e,i)=>({i,action:e.action,method:e.method})));
            const html=(await page.content()).toLowerCase();
            const body=(await page.locator('body').innerText()).replace(/\s+/g,' ').trim();
            const markers=['recaptcha','hcaptcha','turnstile','captcha','verify you are human','cf-chl-','security code'].filter(x=>html.includes(x)||body.toLowerCase().includes(x));
            console.log('--- '+label+' ---');
            console.log('URL='+page.url());
            console.log('CAPTCHA_MARKERS='+markers.join(','));
            console.log('FORMS='+JSON.stringify(forms));
            console.log('FIELDS='+JSON.stringify(fields));
            console.log('BODY_SAMPLE='+body.slice(0,2200));
          }
          try {
            await page.goto('https://freewha.com/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('input[name="thirdLevelDomain"]').fill(slug);
            const select=page.locator('select[name="domain"]');
            const options=await select.locator('option').allTextContents();
            console.log('FREEWHA_DOMAINS='+JSON.stringify(options));
            await select.selectOption({index:1});
            await page.locator('form').first().locator('input[type=submit]').click();
            await report('NEXT_STEP');
            const email=page.locator('input[type=email],input[name*=mail i]').first();
            if(await email.count()){ await email.fill(mail.address); console.log('TEMP_EMAIL_CAN_FILL=true'); }
            console.log('PROPOSED_SLUG='+slug);
          } finally { await browser.close(); }
          JS
          node inspect-freewha.mjs
