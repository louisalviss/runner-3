name: Zero Touch Hosting Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zero-touch-hosting-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Create disposable Mail.tm inbox
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, secrets, urllib.request
          def req(url, data=None):
              headers={'Content-Type':'application/json'}
              r=urllib.request.Request(url, data=(json.dumps(data).encode() if data else None), headers=headers, method='POST' if data else 'GET')
              with urllib.request.urlopen(r, timeout=30) as x: return json.loads(x.read().decode())
          d=req('https://api.mail.tm/domains')
          domains=d.get('hydra:member') or d.get('member') or []
          domain=next(x['domain'] for x in domains if x.get('isActive', True))
          user='runner3wp'+secrets.token_hex(5)
          password=secrets.token_urlsafe(24)
          address=f'{user}@{domain}'
          req('https://api.mail.tm/accounts', {'address':address,'password':password})
          tok=req('https://api.mail.tm/token', {'address':address,'password':password})['token']
          open('/tmp/mailtm.json','w').write(json.dumps({'address':address,'password':password,'token':tok}))
          print('MAILTM_CREATED=true')
          PY

      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.58.2

      - name: Check FPS.ms anti-bot state
        shell: bash
        run: |
          set -euo pipefail
          cat > inspect-fps.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();
          try {
            await page.goto('https://panel.fps.ms/auth/register',{waitUntil:'domcontentloaded',timeout:60000});
            for (const ms of [2500,5000,10000,15000]) {
              await page.waitForTimeout(ms===2500?2500:ms-(ms===5000?2500:ms===10000?5000:10000));
              const vals=await page.locator('input[name="cf-turnstile-response"],textarea[name="g-recaptcha-response"],textarea[name="h-captcha-response"]').evaluateAll(els=>els.map(e=>({name:e.getAttribute('name'),len:(e.value||'').length}))).catch(()=>[]);
              console.log(`ANTIBOT_${ms}MS=`+JSON.stringify(vals));
              console.log(`ANY_TOKEN_${ms}MS=`+vals.some(x=>x.len>20));
            }
            const frames=await page.locator('iframe').evaluateAll(els=>els.map(e=>e.src).filter(Boolean)).catch(()=>[]);
            console.log('IFRAMES='+JSON.stringify(frames.slice(0,20)));
          } finally { await browser.close(); }
          JS
          node inspect-fps.mjs
