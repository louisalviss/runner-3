name: TradingView Interactive Login

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-interactive-login.yml'
      - 'scripts/tradingview-interactive-browser.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  interactive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore encrypted TradingView profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tv-profile
          if [ -f ops/tradingview/profile.tar.gz.aes ]; then
            test -n "${AUTOMATION_KEY:-}" || { echo 'Encryption secret unavailable'; exit 2; }
            echo "::add-mask::$AUTOMATION_KEY"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -pass env:AUTOMATION_KEY \
              -in ops/tradingview/profile.tar.gz.aes \
              -out /tmp/tv-profile.tar.gz
            rm -rf /tmp/tv-profile
            tar -xzf /tmp/tv-profile.tar.gz -C /tmp
            rm -f /tmp/tv-profile.tar.gz
            echo 'TV_PROFILE_RESTORED=true'
          else
            echo 'TV_PROFILE_RESTORED=false'
          fi

      - name: Install remote browser stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb x11vnc openbox novnc websockify nginx apache2-utils >/dev/null
          npm install --no-save playwright-core@1.58.2 >/dev/null
          curl -fsSL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod 700 /tmp/cloudflared

      - name: Start protected TradingView browser
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -base64 24 | tr -d '\n' | tr '/+' '_-')"
          printf '%s' "$PASS" >/tmp/tv-remote-pass
          chmod 600 /tmp/tv-remote-pass
          htpasswd -nbB tv "$PASS" | sudo tee /tmp/tv.htpasswd >/dev/null
          sudo chown root:www-data /tmp/tv.htpasswd
          sudo chmod 640 /tmp/tv.htpasswd

          sudo tee /etc/nginx/sites-available/tv-remote >/dev/null <<'NGINX'
          server {
            listen 127.0.0.1:8080;
            server_name _;
            auth_basic "TradingView one-time session";
            auth_basic_user_file /tmp/tv.htpasswd;
            location / {
              proxy_pass http://127.0.0.1:6080;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_read_timeout 3600s;
            }
          }
          NGINX
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sf /etc/nginx/sites-available/tv-remote /etc/nginx/sites-enabled/tv-remote
          sudo nginx -t
          sudo systemctl restart nginx

          nohup Xvfb :99 -screen 0 1440x900x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          sleep 1
          nohup openbox-session >/tmp/openbox.log 2>&1 &
          nohup x11vnc -display :99 -localhost -nopw -forever -shared -rfbport 5900 >/tmp/x11vnc.log 2>&1 &
          nohup websockify --web=/usr/share/novnc 6080 127.0.0.1:5900 >/tmp/novnc.log 2>&1 &
          nohup node scripts/tradingview-interactive-browser.mjs >/tmp/tv-browser.log 2>&1 &

          for i in $(seq 1 45); do
            grep -q 'TV_INTERACTIVE_BROWSER_READY' /tmp/tv-browser.log && break
            sleep 1
          done
          grep -q 'TV_INTERACTIVE_BROWSER_READY' /tmp/tv-browser.log || {
            echo 'TradingView browser failed to start'
            tail -50 /tmp/tv-browser.log
            exit 4
          }

          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 >/tmp/cloudflared.log 2>&1 &
          for i in $(seq 1 45); do
            URL="$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            [ -n "$URL" ] && break
            sleep 1
          done
          [ -n "${URL:-}" ] || {
            echo 'Cloudflare quick tunnel failed'
            tail -50 /tmp/cloudflared.log
            exit 5
          }
          printf '%s' "$URL" >/tmp/tv-remote-base-url
          chmod 600 /tmp/tv-remote-base-url
          echo 'TV_REMOTE_READY=true'
          echo 'TV_REMOTE_CREDENTIALS_NOT_WRITTEN_TO_LOGS=true'

      - name: Publish encrypted connection bundle
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat /tmp/tv-remote-base-url)"
          PASS="$(cat /tmp/tv-remote-pass)"
          mkdir -p ops/tradingview
          cat >/tmp/tv-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAoWGA2Gw+Lj0o9vYS3m0V
          g/tNw0AZj43JqKrrFDGM6vxb7zWmTbu/nCBUiHBJ9wL0nN83aA6QBTOGCAUiU+O3
          D/fT6u3GZ8rctXLhxK8Crfa6303o0N2EvNnI2zDKjI0Ia4ziBIWB8mEZcKFd/TNX
          daYlmhYHuobTMnCOevLD7r2YLGWicbmnvl9YnK+s1tOm6c8YnSHW0glTgFLRpTUx
          jQjjVRq4C4kyx42CDZyNfY9UMZGyDB6GtURzc5OxFfEoszZOuUuVsFyseK7amdcg
          GeundN0aA5swcehyqOdlWPsEZR+YHHjUgLyb6yKqG4D5Zg2yEyjL863NUaHZ+28h
          3QIDAQAB
          -----END PUBLIC KEY-----
          PEM
          printf 'URL=%s/vnc.html?autoconnect=true&resize=remote\nUSER=tv\nPASSWORD=%s\n' "$URL" "$PASS" >/tmp/tv-connection.txt
          openssl pkeyutl -encrypt -pubin -inkey /tmp/tv-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/tv-connection.txt \
            | base64 -w0 > ops/tradingview/connection.enc.b64
          printf '\n' >> ops/tradingview/connection.enc.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/tradingview/connection.enc.b64
          git commit -m 'publish encrypted TradingView connection' >/dev/null
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main >/dev/null
          rm -f /tmp/tv-connection.txt /tmp/tv-public.pem
          echo 'TV_CONNECTION_BUNDLE_PUBLISHED=true'

      - name: Wait for user login confirmation
        shell: bash
        run: |
          set -euo pipefail
          echo 'After login, click the green SAVE LOGIN button inside TradingView.'
          for i in $(seq 1 1200); do
            [ -f /tmp/tv-session-confirmed ] && break
            sleep 2
          done
          [ -f /tmp/tv-session-confirmed ] || { echo 'TV_LOGIN_CONFIRMATION_TIMEOUT'; exit 6; }
          for i in $(seq 1 30); do
            grep -q 'TV_INTERACTIVE_PROFILE_CLOSED' /tmp/tv-browser.log && break
            sleep 1
          done
          grep -q 'TV_INTERACTIVE_PROFILE_CLOSED' /tmp/tv-browser.log || { echo 'Profile did not close cleanly'; exit 7; }
          echo 'TV_LOGIN_CONFIRMED=true'

      - name: Encrypt and persist TradingView profile
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { echo 'Encryption secret unavailable'; exit 2; }
          echo "::add-mask::$AUTOMATION_KEY"
          rm -rf /tmp/tv-profile/Default/Cache /tmp/tv-profile/Default/Code\ Cache \
            /tmp/tv-profile/Default/GPUCache /tmp/tv-profile/ShaderCache \
            /tmp/tv-profile/GrShaderCache /tmp/tv-profile/GraphiteDawnCache 2>/dev/null || true
          tar -czf /tmp/tv-profile.tar.gz -C /tmp tv-profile
          mkdir -p ops/tradingview
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in /tmp/tv-profile.tar.gz \
            -out ops/tradingview/profile.tar.gz.aes
          rm -f ops/tradingview/connection.enc.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ops/tradingview
          git commit -m 'persist encrypted TradingView browser profile' >/dev/null
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main >/dev/null
          echo 'TV_PROFILE_PERSISTED=true'

      - name: Cleanup sensitive runtime files
        if: always()
        shell: bash
        run: |
          pkill -f tradingview-interactive-browser.mjs || true
          pkill -f cloudflared || true
          pkill -f websockify || true
          pkill -f x11vnc || true
          rm -f /tmp/tv-remote-pass /tmp/tv-remote-base-url /tmp/tv.htpasswd \
            /tmp/tv-session-confirmed /tmp/tv-profile.tar.gz /tmp/tv-connection.txt /tmp/tv-public.pem
