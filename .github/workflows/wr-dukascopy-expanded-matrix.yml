name: WR Dukascopy Expanded Matrix
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wr-dukascopy-expanded-matrix.yml'
      - 'wave-rider-verify/wr_dukascopy_expanded_matrix.py'
      - 'wave-rider-verify/wr_tv_parity.py'
permissions:
  contents: read
  actions: read
jobs:
  core3:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        symbol: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, USDCHF, NZDUSD, EURJPY, GBPJPY, EURGBP, XAUUSD, XAGUSD, US500, NAS100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas websocket-client requests dukascopy-python
      - name: Fetch frozen WR 2.5.13 reference
        run: curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
      - name: Run 3m core robustness
        env:
          SYMBOL: ${{ matrix.symbol }}
          WR_OUT: /tmp/wr-expanded
        run: python3 wave-rider-verify/wr_dukascopy_expanded_matrix.py core3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-expanded-core3-${{ matrix.symbol }}
          path: /tmp/wr-expanded
          retention-days: 14
  stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        symbol: [AAPL, AMZN, GOOGL, META, MSFT, NVDA, TSLA, NFLX, ORCL, IBM, NOW, AMD, AMAT, ARM, ASML, AVGO, CRWV, INTC, LITE, MRVL, MU, QCOM, TSM, WDC, SNDK, COIN, MSTR, HOOD, CRCL, PLTR, BX, COST, DKNG, EBAY, GME, BABA, ZM, LLY, HIMS, RIVN, RKLB, UBER, DIS, HD, WMT, NVO, JPM, BAC, GS, V, MA, PYPL, SHOP, RBLX, SNAP, XOM, CVX, BA, CAT, PFE, JNJ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas websocket-client requests dukascopy-python
      - name: Fetch frozen WR 2.5.13 reference
        run: curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
      - name: Run stock 3m 5m 10m bundle
        env:
          SYMBOL: ${{ matrix.symbol }}
          WR_OUT: /tmp/wr-expanded
        run: python3 wave-rider-verify/wr_dukascopy_expanded_matrix.py stockbundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-expanded-stock-${{ matrix.symbol }}
          path: /tmp/wr-expanded
          retention-days: 14
  merge:
    needs: [core3, stocks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wr-expanded-*
          path: /tmp/all
          merge-multiple: false
      - name: Merge all summaries without interim verdict
        run: |
          python3 - <<'PY'
          import json, pathlib, collections
          root=pathlib.Path('/tmp/all'); out=pathlib.Path('/tmp/final'); out.mkdir(parents=True,exist_ok=True)
          rows=[]
          for p in root.rglob('summary-*.json'):
              try: rows.append(json.loads(p.read_text()))
              except Exception: pass
          rows.sort(key=lambda x:(x.get('group',''),x.get('symbol',''),x.get('tf','')))
          status=collections.Counter(x.get('status','UNKNOWN') for x in rows)
          report={'purpose':'WR 2.5.13 expanded robustness: core 3m + broad tradable stocks 3m/5m/10m','no_tuning':True,'results_count':len(rows),'status_counts':dict(status),'results':rows}
          (out/'expanded-matrix.json').write_text(json.dumps(report,indent=2))
          print('MERGED',len(rows),dict(status))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wr-expanded-matrix-final
          path: /tmp/final
          retention-days: 30
