name: Ebook Audio Parallel Chunk Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ebook-audio-parallel-chunks-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch canonical VPS consumer
        run: python3 scripts/patch_ebook_audio_parallel_chunks.py

      - name: Validate patched source
        run: |
          python3 -m py_compile scripts/ebook_reader_audio_tts_vps.py
          grep -Fq 'EBOOK_AUDIO_TTS_CHUNK_CONCURRENCY' scripts/ebook_reader_audio_tts_vps.py
          grep -Fq 'asyncio.Semaphore(TTS_CHUNK_CONCURRENCY)' scripts/ebook_reader_audio_tts_vps.py
          grep -Fq 'asyncio.gather' scripts/ebook_reader_audio_tts_vps.py
          grep -Fq 'synthesize_parallel(script, work)' scripts/ebook_reader_audio_tts_vps.py

      - name: Commit patched source
        run: |
          git config user.name ebook-audio-speed-bot
          git config user.email ebook-audio-speed-bot@users.noreply.github.com
          git add scripts/ebook_reader_audio_tts_vps.py
          git diff --cached --check
          git commit -m 'perf(ebook-audio): synthesize chapter chunks concurrently'
          git push origin HEAD:main
