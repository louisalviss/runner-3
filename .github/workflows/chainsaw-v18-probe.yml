name: Chainsaw V18 Probe
on:
  push:
    paths: ['.github/workflows/chainsaw-v18-probe.yml']
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate target run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import json, os, urllib.request
          sha='c79b463d88ee6c79f530da372d56d4e98c8ef9f8'
          req=urllib.request.Request('https://api.github.com/repos/louisalviss/runner-3/actions/runs?head_sha='+sha+'&per_page=20',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          data=json.load(urllib.request.urlopen(req))
          runs=[r for r in data.get('workflow_runs',[]) if r.get('path')=='.github/workflows/chainsaw-v18-official-pool.yml']
          r=runs[0] if runs else {}
          os.makedirs('audit/chainsaw-v18',exist_ok=True)
          open('audit/chainsaw-v18/status.txt','w').write(f"run_id={r.get('id','')}\nstatus={r.get('status','')}\nconclusion={r.get('conclusion','')}\n")
          print(r)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add audit/chainsaw-v18/status.txt
          git commit -m 'Persist Chainsaw V18 source status' || exit 0
          git pull --rebase origin main || true
          git push || true
