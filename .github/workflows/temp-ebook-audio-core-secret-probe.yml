name: Temp Ebook Audio Core Secret Probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-ebook-audio-core-secret-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CORE: https://runner3-core.ducduy2411.workers.dev
      TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
    steps:
      - name: Probe auth without claiming queue
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TOKEN:-}"
          code="$(curl -sS --max-time 20 -o /tmp/body -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" "$CORE/api/internal/ebook-reader-audio/job")"
          python3 - "$code" <<'PY'
          import json,sys
          code=int(sys.argv[1]); data=json.load(open('/tmp/body',encoding='utf-8'))
          print('CANONICAL_SECRET_AUTH_HTTP='+str(code))
          if code!=405 or data.get('error')!='METHOD_NOT_ALLOWED': raise SystemExit(1)
          print('CANONICAL_SECRET_AUTH=PASS')
          PY
