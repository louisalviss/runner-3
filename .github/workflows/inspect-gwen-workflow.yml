name: Inspect Gwen-TTS Workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-gwen-workflow.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect latest Gwen deploy run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/workflows/modal-gwen-tts-deploy.yml/runs?per_page=5" \
            -o /tmp/runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/runs.json'))
          rows=[]
          for r in d.get('workflow_runs',[]):
              rows.append({k:r.get(k) for k in ['id','name','event','status','conclusion','created_at','updated_at','html_url','head_sha','run_attempt']})
          Path('gwen-workflow-status.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          cat gwen-workflow-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gwen-workflow-status.json
          git diff --cached --quiet || git commit -m 'test: record Gwen-TTS workflow status'
          git push
