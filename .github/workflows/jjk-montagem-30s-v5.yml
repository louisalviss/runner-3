name: JJK Montagem 30s V5
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/jjk-montagem-30s-v5.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl openvpn iproute2 iptables
          python -m pip install -q -U yt-dlp numpy
      - name: Get JJK sources through isolated VPN
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 40 https://www.vpngate.net/api/iphone/ -o vpn.csv
          python <<'PY'
          import csv,base64
          a=[]
          for r in csv.reader(open('vpn.csv',encoding='utf-8-sig',errors='replace')):
              if len(r)<15 or not r or r[0].startswith(('*','#')): continue
              cc=r[6].strip().upper()
              if cc not in {'VN','JP','KR','SG','TW'}: continue
              try: a.append((['VN','SG','JP','KR','TW'].index(cc),-int(r[2] or 0),cc,r[1],base64.b64decode(r[14]).decode('utf8','replace')))
              except: pass
          a.sort(); a=a[:8]
          with open('vpns.tsv','w') as m:
              for i,(_,score,cc,ip,cfg) in enumerate(a):
                  p=f'v{i}.ovpn'; open(p,'w').write(cfg+'\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 8\n'); m.write(f'{p}\t{cc}\t{ip}\n')
          PY
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vv
          sudo ip link set vv netns vpnns
          sudo ip addr add 10.203.0.1/24 dev vh; sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.203.0.2/24 dev vv
          sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set vv up
          sudo ip netns exec vpnns ip route add default via 10.203.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          W=$(ip route show default | awk '/default/{print $5;exit}')
          sudo iptables -t nat -A POSTROUTING -s 10.203.0.0/24 -o "$W" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$W" -j ACCEPT
          sudo iptables -A FORWARD -i "$W" -o vh -m state --state RELATED,ESTABLISHED -j ACCEPT
          Y=$(command -v yt-dlp); ok=0
          while IFS=$'\t' read -r p cc ip; do
            [ -f /tmp/v.pid ] && sudo kill "$(cat /tmp/v.pid)" 2>/dev/null || true
            sudo rm -f /tmp/v.pid /tmp/v.log; sleep 1
            sudo ip netns exec vpnns openvpn --config "$GITHUB_WORKSPACE/$p" --daemon --writepid /tmp/v.pid --log /tmp/v.log || true
            tun=0; for n in $(seq 1 15); do sudo ip netns exec vpnns ip link show tun0 >/dev/null 2>&1 && { tun=1; break; }; sleep 1; done
            [ "$tun" = 1 ] || continue
            eg=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 10 https://api.ipify.org || true); [ -n "$eg" ] || continue
            echo "VPN_EGRESS=$eg $cc"
            rm -f jjk2026.* jjk2025.*
            if timeout 140s sudo ip netns exec vpnns env PATH="$PATH" HOME="$HOME" "$Y" --no-playlist --retries 1 --socket-timeout 18 --js-runtimes node --remote-components ejs:github -f 'bv*[height<=1080]+ba/b[height<=1080]' --merge-output-format mp4 -o "$GITHUB_WORKSPACE/jjk2026.%(ext)s" 'https://www.youtube.com/watch?v=DKNM-3LpfZE'; then
              f=$(find . -maxdepth 1 -name 'jjk2026*.mp4' | head -1); [ -z "$f" ] || { [ "$f" = './jjk2026.mp4' ] || mv "$f" jjk2026.mp4; ok=1; }
              timeout 160s sudo ip netns exec vpnns env PATH="$PATH" HOME="$HOME" "$Y" --no-playlist --retries 1 --socket-timeout 18 --js-runtimes node --remote-components ejs:github -f 'bv*[height<=1080]+ba/b[height<=1080]' --merge-output-format mp4 -o "$GITHUB_WORKSPACE/jjk2025.%(ext)s" 'https://www.youtube.com/watch?v=VEjVqXiiUNY' || true
              f2=$(find . -maxdepth 1 -name 'jjk2025*.mp4' | head -1); [ -z "$f2" ] || { [ "$f2" = './jjk2025.mp4' ] || mv "$f2" jjk2025.mp4; }
              break
            fi
          done < vpns.tsv
          [ "$ok" = 1 ] || exit 22
          [ -f /tmp/v.pid ] && sudo kill "$(cat /tmp/v.pid)" 2>/dev/null || true
          ls -lh jjk20*.mp4
      - name: Get Montagem music
        run: |
          set -euxo pipefail
          yt-dlp --no-playlist -f 'bestaudio/best' -o 'm.%(ext)s' 'https://maxjoannes.bandcamp.com/track/montagem-lala-fawela'
          f=$(find . -maxdepth 1 -name 'm.*' | head -1)
          ffmpeg -hide_banner -loglevel error -y -i "$f" -vn -c:a libmp3lame -b:a 256k montagem.mp3
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 montagem.mp3
      - name: Auto edit 30 seconds
        shell: bash
        run: |
          set -euxo pipefail
          python <<'PY'
          import glob,json,subprocess,numpy as np,os
          # beat estimate
          sr=8000; hop=256
          b=subprocess.check_output(['ffmpeg','-loglevel','error','-ss','4','-t','40','-i','montagem.mp3','-ac','1','-ar',str(sr),'-f','f32le','-'])
          x=np.frombuffer(b,np.float32); x=x[:len(x)//hop*hop].reshape(-1,hop)
          e=np.maximum(0,np.diff(np.sqrt(np.mean(x*x,axis=1)+1e-9),prepend=0)); e-=e.mean()
          vals=[(np.dot(e[:-l],e[l:]),l) for l in range(int(.28*sr/hop),int(.62*sr/hop)+1)]
          beat=max(.32,min(.54,max(vals)[1]*hop/sr)); print('BEAT',beat)
          # motion/detail scoring
          cand=[]; w,h,fps=224,126,6; sz=w*h
          for src in glob.glob('jjk20*.mp4'):
            dur=float(json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',src]))['format']['duration'])
            p=subprocess.Popen(['ffmpeg','-loglevel','error','-i',src,'-vf',f'scale={w}:{h},fps={fps}','-pix_fmt','gray','-f','rawvideo','-'],stdout=subprocess.PIPE)
            prev=None;i=0
            while 1:
              q=p.stdout.read(sz)
              if len(q)<sz: break
              cur=np.frombuffer(q,np.uint8).reshape(h,w)
              if prev is not None:
                d=np.abs(cur.astype(np.int16)-prev.astype(np.int16)); t=i/fps; lum=cur.mean(); detail=cur.std()
                score=d.mean()*.58+np.percentile(d,90)*.36+min(detail,70)*.12-(20 if lum<22 or lum>234 else 0)-max(0,25-detail)
                if 1<t<dur-1: cand.append((float(score),src,t))
              prev=cur;i+=1
            p.wait()
          pick=[]
          for z in sorted(cand,reverse=True):
            if all(not(z[1]==q[1] and abs(z[2]-q[2])<.55) for q in pick): pick.append(z)
            if len(pick)>=100: break
          if len(pick)<55: raise SystemExit('too few moments '+str(len(pick)))
          by={}
          for z in pick: by.setdefault(z[1],[]).append(z)
          for k in by: by[k].sort(reverse=True)
          order=[]; names=sorted(by)
          while any(by.values()):
            for k in names:
              if by[k]: order.append(by[k].pop(0))
          pat=[1,1,.5,1,1.5,.5,1,1]; clips=[]; total=0;i=0
          while total<30-.001:
            s,src,t=order[i%len(order)]; d=beat*pat[i%len(pat)]; i+=1
            d=min(d,30-total); clips.append((src,max(0,t-.08),d)); total+=d
          os.makedirs('clips',exist_ok=True)
          for i,(src,t,d) in enumerate(clips):
            flash="drawbox=x=0:y=0:w=iw:h=ih:color=white@.12:t=fill:enable='lt(t,.03)'," if i%7==0 else ''
            fc='[0:v]split=2[b][f];[b]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=34,eq=brightness=-.24:saturation=.7[b2];[f]scale=1040:585:force_original_aspect_ratio=decrease,pad=1040:585:(ow-iw)/2:(oh-ih)/2:black,eq=contrast=1.08:saturation=1.13,unsharp=5:5:.35:5:5:0[f2];[b2][f2]overlay=(W-w)/2:(H-h)/2,'+flash+'fps=30,format=yuv420p[v]'
            subprocess.check_call(['ffmpeg','-loglevel','error','-y','-ss',f'{t:.3f}','-i',src,'-t',f'{d:.3f}','-filter_complex',fc,'-map','[v]','-an','-c:v','libx264','-preset','medium','-crf','18','-profile:v','high','-level','4.1','-pix_fmt','yuv420p',f'clips/{i:03}.mp4'])
          open('list.txt','w').write(''.join(f"file 'clips/{i:03}.mp4'\n" for i in range(len(clips))))
          print('CLIPS',len(clips),'TOTAL',total,'SOURCES',names)
          PY
          ffmpeg -loglevel error -y -f concat -safe 0 -i list.txt -c copy visual.mp4
          ffmpeg -loglevel error -y -i visual.mp4 -ss 4 -i montagem.mp3 -t 30 -map 0:v -map 1:a -c:v copy -af 'volume=.98,bass=g=3.5:f=90,alimiter=limit=.95' -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart jjk_montagem_30s_v5.mp4
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,sample_rate,channels -show_entries format=duration,size,bit_rate -of default=nw=1 jjk_montagem_30s_v5.mp4
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: jjk-montagem-30s-v5
          path: jjk_montagem_30s_v5.mp4
          retention-days: 3
