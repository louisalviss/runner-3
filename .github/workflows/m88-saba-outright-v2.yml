name: M88 SABA Outright V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-saba-outright-v2.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install browser and VPN tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          rm -rf m88-evidence /tmp/m88-relays
          mkdir -p m88-evidence /tmp/m88-relays

      - name: Select Asia relay accepted by M88
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          meta=[]
          for country in ['TH','SG','MY','PH','ID','JP','KR','TW','VN']:
              rs=[r for r in rows if (r.get('CountryShort') or '').upper()==country and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
              rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
              for r in rs[:(10 if country=='TH' else 3)]:
                  cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
                  cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
                  p=pathlib.Path(f'/tmp/m88-relays/{len(meta):02d}-{country}.ovpn')
                  p.write_text(cfg)
                  meta.append(f'{p}\t{country}\t{r.get("IP","")}')
          if not meta: raise SystemExit('No VPN Gate relays')
          pathlib.Path('/tmp/m88-relays.tsv').write_text('\n'.join(meta)+'\n')
          print('RELAYS',len(meta))
          PY

          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.246.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.246.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.246.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.246.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null

          selected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo "TRY $country $relay"
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/openvpn.log /tmp/m88-top.json
            sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            ok=0
            for i in {1..12}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null && { ok=1; break; }
              grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|fatal error|Connection refused' /tmp/openvpn.log 2>/dev/null && break || true
            done
            [ "$ok" = 1 ] || continue
            if sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 18 \
              'https://msports.m88.com/api/v1/sport/top?currency=VND' \
              -H 'Authorization: Bearer GUEST' -o /tmp/m88-top.json; then
              if python3 - <<'PY'
          import json
          try: d=json.load(open('/tmp/m88-top.json'))
          except Exception: raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then
                sudo ip netns exec vpnns curl -fsS --max-time 10 'https://www.cloudflare.com/cdn-cgi/trace' | grep -E '^(ip|loc|warp)=' | tee m88-evidence/egress.txt || true
                printf '%s %s\n' "$country" "$relay" | tee m88-evidence/relay.txt
                selected=1
                break
              fi
            fi
          done < /tmp/m88-relays.tsv
          test "$selected" = 1

      - name: Open SABA iframe and collect EPL outrights
        shell: bash
        run: |
          set -euo pipefail
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          OUT=Path(os.environ['WORKSPACE'])/'m88-evidence'
          targets={
            'winner': re.compile(r'ENGLISH\s+PREMIER\s+LEAGUE.*?(?:2026\s*/\s*2027|2026-2027).*?WINNER',re.I|re.S),
            'top4': re.compile(r'ENGLISH\s+PREMIER\s+LEAGUE.*?(?:2026\s*/\s*2027|2026-2027).*?TOP\s*4',re.I|re.S),
            'relegation': re.compile(r'ENGLISH\s+PREMIER\s+LEAGUE.*?(?:2026\s*/\s*2027|2026-2027).*?(?:RELEGAT|TO\s+BE\s+RELEGATED)',re.I|re.S),
            'goalscorer': re.compile(r'ENGLISH\s+PREMIER\s+LEAGUE.*?(?:2026\s*/\s*2027|2026-2027).*?(?:TOP\s*GOAL|GOALSCORER)',re.I|re.S),
          }
          result={'markets':{},'notes':[],'frames':[],'controls':[]}
          network=[]; payloads=[]

          def body_text(frame,limit=500000):
              try: return frame.locator('body').inner_text(timeout=6000)[:limit]
              except Exception: return ''

          def provider_score(f):
              t=body_text(f,50000); u=f.url.lower(); s=0
              if 'sgq9d7h8.com' in u: s+=100
              if re.search(r'\bSABA\b',t,re.I): s+=30
              if re.search(r'\bLive\b',t,re.I): s+=10
              if re.search(r'\bSports\b',t,re.I): s+=10
              return s,t

          def first_visible(loc,limit=80):
              for i in range(min(loc.count(),limit)):
                  try:
                      if loc.nth(i).is_visible(): return loc.nth(i)
                  except Exception: pass
              return None

          def find_outright(f):
              for rx in [re.compile(r'^\s*Outright\s*$',re.I),re.compile(r'^\s*Outright\b.*$',re.I)]:
                  try:
                      el=first_visible(f.get_by_text(rx),120)
                      if el is not None: return el
                  except Exception: pass
              return None

          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              context=browser.new_context(viewport={'width':390,'height':844},screen={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True,locale='en-US',timezone_id='Asia/Bangkok',user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1')
              page=context.new_page()

              def onreq(r):
                  if r.resource_type in ('document','xhr','fetch'):
                      network.append({'kind':'request','type':r.resource_type,'method':r.method,'url':r.url,'post':(r.post_data or '')[:12000]})
              def onresp(r):
                  if r.request.resource_type not in ('document','xhr','fetch'): return
                  network.append({'kind':'response','type':r.request.resource_type,'status':r.status,'url':r.url})
                  try:
                      body=r.text()
                      if len(body)>6_000_000: return
                      if re.search(r'outright|2026.?2027|relegat|goal.?scorer|top.?4',body,re.I):
                          payloads.append({'url':r.url,'status':r.status,'body':body[:2_000_000]})
                  except Exception: pass
              page.on('request',onreq); page.on('response',onresp)

              resp=page.goto('https://www.m88.com/sports/Saba%20Sports?Language=en-US',wait_until='domcontentloaded',timeout=45000)
              result['m88_status']=resp.status if resp else None
              page.wait_for_timeout(18000)
              result['m88_url']=page.url
              page.screenshot(path=str(OUT/'01-saba-board.png'),full_page=False)
              for f in page.frames:
                  result['frames'].append({'name':f.name,'url':f.url,'text':body_text(f,30000)})

              ranked=[]
              for f in page.frames:
                  s,t=provider_score(f); ranked.append((s,len(t),f,t))
              ranked.sort(key=lambda x:(x[0],x[1]),reverse=True)
              provider=ranked[0][2] if ranked and ranked[0][0]>=100 else None
              if provider is None:
                  result['notes'].append('SABA provider iframe not found')
              else:
                  result['provider_url']=provider.url
                  result['provider_before']=body_text(provider,120000)

                  try:
                      controls=provider.locator('button,a,[role="button"],[onclick]')
                      for i in range(min(controls.count(),500)):
                          el=controls.nth(i)
                          try:
                              if not el.is_visible(): continue
                              d=el.evaluate("e=>({tag:e.tagName,text:(e.innerText||e.textContent||'').trim().replace(/\\s+/g,' ').slice(0,300),aria:e.getAttribute('aria-label')||'',title:e.getAttribute('title')||'',cls:String(e.className||'').slice(0,300),href:e.href||'',box:(()=>{let r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height}})()})")
                              if d['box']['y']<220 or re.search(r'out|menu|sport|live|more',json.dumps(d),re.I): result['controls'].append(d)
                          except Exception: pass
                  except Exception: pass

                  outright=find_outright(provider)
                  if outright is None:
                      menu=None
                      try:
                          candidates=provider.locator('button,a,[role="button"],[onclick]')
                          for i in range(min(candidates.count(),300)):
                              el=candidates.nth(i)
                              try:
                                  if not el.is_visible(): continue
                                  d=el.evaluate("e=>({txt:(e.innerText||e.textContent||'').trim(),aria:e.getAttribute('aria-label')||'',title:e.getAttribute('title')||'',cls:String(e.className||''),r:(()=>{let r=e.getBoundingClientRect();return [r.x,r.y,r.width,r.height]})()})")
                                  label=' '.join([d['txt'],d['aria'],d['title'],d['cls']]); x,y,w,h=d['r']
                                  if re.search(r'menu|hamburger|drawer|nav',label,re.I) or (x<80 and y<100 and 8<w<100 and 8<h<100):
                                      menu=el; break
                              except Exception: pass
                      except Exception: pass
                      if menu is not None:
                          try: menu.click(timeout=5000); result['menu_click']='element'
                          except Exception as e: result['menu_element_error']=type(e).__name__
                      else:
                          try:
                              provider.locator('body').click(position={'x':20,'y':24},timeout=5000)
                              result['menu_click']='coordinate'
                          except Exception as e: result['menu_coordinate_error']=type(e).__name__
                      page.wait_for_timeout(1800)
                      page.screenshot(path=str(OUT/'02-saba-menu.png'),full_page=False)
                      result['provider_after_menu']=body_text(provider,180000)
                      outright=find_outright(provider)

                  if outright is None:
                      result['notes'].append('Outright control not found after opening SABA menu')
                      result['outright_clicked']=False
                  else:
                      try: result['outright_label']=outright.inner_text()[:300]
                      except Exception: result['outright_label']='Outright'
                      try:
                          outright.click(timeout=7000); result['outright_clicked']=True
                      except Exception as e:
                          result['outright_clicked']=False; result['notes'].append('Outright click failed: '+type(e).__name__)
                      page.wait_for_timeout(8000)
                      page.screenshot(path=str(OUT/'03-outright.png'),full_page=False)

                      ranked=[]
                      for f in page.frames:
                          s,t=provider_score(f); ranked.append((s,len(t),f,t))
                      ranked.sort(key=lambda x:(x[0],x[1]),reverse=True)
                      if ranked and ranked[0][0]>=100: provider=ranked[0][2]

                      corpus=''
                      for step in range(36):
                          now=body_text(provider,600000)
                          if now and now not in corpus: corpus += '\n'+now
                          if all(rx.search(corpus) for rx in targets.values()): break
                          try: provider.locator('body').evaluate('(e)=>window.scrollBy(0,700)')
                          except Exception: pass
                          page.wait_for_timeout(350)
                      result['outright_text']=corpus[:1_000_000]

                      for key,rx in targets.items():
                          rec={'found':False,'source':None,'window':''}
                          m=rx.search(corpus)
                          if m:
                              rec['found']=True; rec['source']='dom'; rec['window']=corpus[max(0,m.start()-800):min(len(corpus),m.start()+30000)]
                          if not rec['found']:
                              for payload in payloads:
                                  m=rx.search(payload['body'])
                                  if m:
                                      rec['found']=True; rec['source']='network'; rec['url']=payload['url']; rec['window']=payload['body'][max(0,m.start()-1500):min(len(payload['body']),m.start()+50000)]
                                      break
                          result['markets'][key]=rec

              context.close(); browser.close()

          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          (OUT/'network.json').write_text(json.dumps(network,ensure_ascii=False,indent=2))
          (OUT/'payloads.json').write_text(json.dumps(payloads,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2)[:120000])
          PY

      - name: Verify Outright result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('m88-evidence/result.json'))
          print('PROVIDER',d.get('provider_url'))
          print('MENU',d.get('menu_click'))
          print('OUTRIGHT',d.get('outright_clicked'),d.get('outright_label'))
          for k,v in d.get('markets',{}).items():
              print(k,'FOUND=',v.get('found'),'SOURCE=',v.get('source'))
              print(v.get('window','')[:12000])
          if not d.get('provider_url'): raise SystemExit('SABA iframe missing')
          if not d.get('outright_clicked'): raise SystemExit('Outright was not opened')
          found=sum(bool(v.get('found')) for v in d.get('markets',{}).values())
          if found==0: raise SystemExit('No requested EPL outright market found')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-saba-outright-v2-${{ github.run_id }}
          path: m88-evidence/
          retention-days: 3
