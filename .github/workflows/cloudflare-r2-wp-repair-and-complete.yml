name: Cloudflare WP R2 Repair and Complete

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preflight only (default), or ONE guarded metadata repair followed by missing WP objects copy"
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - repair-and-complete

permissions:
  contents: read

concurrency:
  group: cloudflare-target-r2-native-canary
  cancel-in-progress: false

jobs:
  wp-repair-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_TARGET_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_TARGET_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_TARGET_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_TARGET_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce global R2 Class A billing HOLD before any R2 request
        run: python3 scripts/cloudflare_r2_migration_gate.py
      - name: Install S3 SDK and validate safety scripts
        run: |
          python3 -m pip install --quiet boto3
          python3 -m py_compile scripts/cloudflare_r2_native_canary.py scripts/cloudflare_r2_native_batch.py scripts/cloudflare_r2_native_large.py scripts/cloudflare_r2_wp_complete.py scripts/cloudflare_r2_wp_repair_metadata.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_native_batch.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_native_large.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_wp_complete.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_wp_repair_metadata.py
      - name: Check exact object SHA and conditional metadata readiness
        if: ${{ inputs.mode == 'preflight' }}
        run: python3 scripts/cloudflare_r2_wp_repair_metadata.py --mode preflight
      - name: Repair one SHA-verified 14-byte object's metadata
        if: ${{ inputs.mode == 'repair-and-complete' }}
        run: python3 scripts/cloudflare_r2_wp_repair_metadata.py --mode repair
      - name: Copy remaining WP Media and recheck ALL object hashes
        if: ${{ inputs.mode == 'repair-and-complete' && success() }}
        run: python3 scripts/cloudflare_r2_wp_complete.py
      - name: Preserve sanitized receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-wp-repair-complete-receipts
          path: |
            migration-out/wp-metadata-repair.json
            migration-out/wp-complete-progress.json
            migration-out/receipt.json
          if-no-files-found: warn
          retention-days: 7
