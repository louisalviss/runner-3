name: M88 VN Retry
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m88-vn-retry.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup TH browser route
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence
          curl -fsSL --max-time 30 https://www.vpngate.net/api/iphone/ -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          s=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rs=list(csv.DictReader(io.StringIO('\n'.join(x for x in s.splitlines() if x and not x.startswith('*')))))
          rs=[r for r in rs if (r.get('CountryShort') or '').upper()=='TH' and r.get('OpenVPN_ConfigData_Base64')]
          rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          for i,r in enumerate(rs[:20]):
            c=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
            c='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in c.splitlines())+'\n'
            pathlib.Path(f'/tmp/vpn{i}.ovpn').write_text(c)
          print('RELAYS',min(len(rs),20))
          PY
          IFACE=$(ip route show default|awk '{print $5;exit}')
          sudo ip netns add vpnns; sudo ip link add vh type veth peer name vn; sudo ip link set vn netns vpnns
          sudo ip addr add 10.242.0.1/24 dev vh; sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.242.0.2/24 dev vn; sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.242.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.242.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns; printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          connected=0
          for cfg in /tmp/vpn*.ovpn; do
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null||true; sleep 1
            sudo rm -f /tmp/o.log; sudo touch /tmp/o.log; sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log || true
            ok=0; for i in {1..10}; do sleep 1; grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null && { ok=1; break; }; grep -Eq 'AUTH_FAILED|TLS Error|Connection refused|fatal error' /tmp/o.log 2>/dev/null && break || true; done
            if [ "$ok" = 1 ]; then
              t=$(sudo ip netns exec vpnns curl -fsS --max-time 8 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null|grep -E '^(ip|loc)='||true)
              if echo "$t"|grep -q '^loc=TH$'; then echo "$t"|tee evidence/egress.txt; connected=1; break; fi
            fi
          done
          test "$connected" = 1
      - name: Capture Vietnamese mobile sports
        shell: bash
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path(os.environ['WORKSPACE'])/'evidence'; R={}
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox'])
            c=b.new_context(viewport={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True,user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1')
            q=c.new_page(); q.goto('https://www.m88.com/',wait_until='domcontentloaded',timeout=45000); q.wait_for_timeout(8000)
            ss=q.locator("a:has-text('SPORTS')")
            for i in range(ss.count()):
              if ss.nth(i).is_visible(): ss.nth(i).click(); R['sports_clicked']=True; break
            q.wait_for_timeout(8000); R['sports_url']=q.url; q.screenshot(path=str(out/'sports_mobile_en.png'))
            bs=q.locator("button[data-qa-context='language-selector']"); R['buttons']=bs.count(); opts=[]
            for i in range(bs.count()):
              try:
                bs.nth(i).evaluate('(e)=>e.click()'); q.wait_for_timeout(1000)
                menu=q.locator("[role='menuitem'],.mat-mdc-menu-item")
                vals=[]
                for j in range(menu.count()):
                  t=' '.join(menu.nth(j).inner_text(timeout=300).split())
                  if t: vals.append(t)
                if vals: opts=vals; R['opened_button']=i; break
              except: pass
            R['language_options']=opts; q.screenshot(path=str(out/'language_menu.png'))
            chosen=False
            for label in ['Tiếng Việt','Vietnamese']:
              x=q.get_by_text(label,exact=True)
              for i in range(x.count()):
                try:
                  if x.nth(i).is_visible(): x.nth(i).click(); R['chosen']=label; chosen=True; break
                except: pass
              if chosen: break
            if chosen: q.wait_for_timeout(10000)
            else:
              R['no_vietnamese_option']=True
              vn=q.locator("a[href*='m88no1vn.com']")
              if vn.count():
                u=vn.first.get_attribute('href'); R['vn_url']=u; q.goto(u,wait_until='domcontentloaded',timeout=45000); q.wait_for_timeout(10000); R['country_site']=True
            txt=q.locator('body').inner_text(timeout=5000); R['final_url']=q.url; R['title']=q.title(); R['vi_detected']=bool(re.search(r'Thể thao|THỂ THAO|Đăng nhập|ĐĂNG NHẬP|Khuyến mãi|KHUYẾN MÃI|Cược',txt)); R['text']=txt[:2500]
            q.screenshot(path=str(out/'sports_mobile_vi.png')); c.close(); b.close()
          (out/'result.json').write_text(json.dumps(R,indent=2,ensure_ascii=False)); print(json.dumps(R,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-vn-retry-${{ github.run_id }}
          path: evidence/
          retention-days: 3
