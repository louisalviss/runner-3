name: TV WR Python Deterministic Parity
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch archived reference engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
          test -s /tmp/reference_verify.py
      - name: Run deterministic 5m parity
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/run_det.py <<'PY'
          import json, math
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          src=Path('/tmp/reference_verify.py').read_text()
          src=src.replace('sra<=SIGNAL_RANGE_MAX','sra<SIGNAL_RANGE_MAX')
          ns={'__name__':'wrref'}
          exec(compile(src,'reference_verify.py','exec'),ns)
          VN=timezone(timedelta(hours=7))
          def local_ms(s): return int(datetime.fromisoformat(s).replace(tzinfo=VN).timestamp()*1000)
          STATE=local_ms('2026-07-28')
          REPORT_START=local_ms('2026-08-05')
          REPORT_END=local_ms('2026-08-10')
          RUN_END=local_ms('2026-08-12')
          OUT=Path('/tmp/wrpy'); OUT.mkdir(exist_ok=True)

          def run_symbol(symbol):
              ns['SYMBOL']=symbol; ns['START']='2026-07-27'; ns['END']='2026-08-11'; ns['WARMUP_DAYS']=0
              one,tick,missing=ns['fetch_1m']()
              if missing: raise RuntimeError(f'{symbol}: missing daily files {missing}')
              bars=[x for x in ns['agg'](one,5) if x.ot>=STATE and x.ot<RUN_END]
              if not bars or bars[0].ot!=STATE:
                  raise RuntimeError(f'{symbol}: deterministic anchor missing; first={bars[0].ot if bars else None} expected={STATE}')
              ind,pht,plt=ns['calc_ind'](bars)
              Plan=ns['Plan']; Trade=ns['Trade']; next_bracket=ns['next_bracket']; session_flags=ns['session_flags']; iso=ns['iso']
              TP_R=ns['TP_R']; RISK_PCT=ns['RISK_PCT']; INIT=ns['INIT']
              eq=INIT; pending=active=None; entry_t=None; trades=[]
              w_eq=w_peak=None; w_dd=0.0; w_gp=w_gl=0.0; w_ls=w_max_ls=0
              all_closed=0; all_signals=0
              def close_trade(i,reason,px):
                  nonlocal active,entry_t,eq,w_eq,w_peak,w_dd,w_gp,w_gl,w_ls,w_max_ls,all_closed
                  plan=active
                  both=(bars[i].h>=max(plan.s,plan.t) and bars[i].l<=min(plan.s,plan.t) and reason in ('TP','SL'))
                  if both: reason='AMBIG->SL'
                  cr=TP_R if reason=='TP' else (-1.0 if reason in ('SL','AMBIG->SL') else ((px-plan.e)*(1 if plan.d==1 else -1)*plan.qty/plan.risk))
                  cash=cr*plan.risk; eq_before=eq; eq+=cash; all_closed+=1
                  eligible=REPORT_START<=plan.sig_t<REPORT_END
                  if eligible:
                      if w_eq is None: w_eq=eq_before; w_peak=eq_before
                      w_eq+=cash
                      if cash>0: w_gp+=cash; w_ls=0
                      elif cash<0: w_gl+=-cash; w_ls+=1; w_max_ls=max(w_max_ls,w_ls)
                      else: w_ls=0
                      w_peak=max(w_peak,w_eq); w_dd=max(w_dd,100*(w_peak-w_eq)/w_peak if w_peak>0 else 0)
                      trades.append(Trade(5,'LONG' if plan.d==1 else 'SHORT',iso(plan.sig_t),iso(entry_t),iso(bars[i].ct),plan.sig_h,plan.sig_l,plan.e,plan.s,plan.t,px,reason,cr,plan.risk,plan.qty,both))
                  active=None; entry_t=None
                  return True
              for i,x in enumerate(bars):
                  if x.ot>=RUN_END: break
                  closed=False
                  if active is not None:
                      r,px=next_bracket(active,x,None)
                      if r: closed=close_trade(i,r,px)
                  if active is None and pending is not None and i==pending.sig_i+1 and not closed:
                      fill=(pending.d==1 and x.h>=pending.e) or (pending.d==-1 and x.l<=pending.e)
                      if fill:
                          gap=(pending.d==1 and x.o>=pending.e) or (pending.d==-1 and x.o<=pending.e)
                          active=pending; pending=None; entry_t=x.ot
                          r,px=next_bracket(active,x,None if gap else active.e)
                          if r: closed=close_trade(i,r,px)
                  allowed,sexit=session_flags(x.ct,5*60000)
                  if active is not None and not closed:
                      z=ind[i]
                      le=active.d==1 and x.c<z['ema'] and not z['ha'] and not z['ema_up']
                      se=active.d==-1 and x.c>z['ema'] and not z['hb'] and bool(z['ema_up'])
                      if sexit: closed=close_trade(i,'SESSION',x.c)
                      elif le or se: closed=close_trade(i,'EMA',x.c)
                  if pending is not None and i>=pending.sig_i+1 and active is None:
                      pending=None
                  if active is None and pending is None and not closed:
                      z=ind[i]
                      lr=z['ha'] and x.c>z['ema'] and z['ag'] and z['chop_ok'] and z['res'] is not None
                      sr=z['hb'] and x.c<z['ema'] and z['ar'] and z['chop_ok'] and z['sup'] is not None
                      nl=allowed and z['sra_ok'] and x.c>x.o and lr and x.c>z['res'] and x.l<=z['res']
                      sh=allowed and z['sra_ok'] and x.c<x.o and sr and x.c<z['sup'] and x.h>=z['sup']
                      if nl or sh:
                          if nl: d=1; e=x.h+tick; s=x.l-tick; t=e+TP_R*(e-s)
                          else: d=-1; e=x.l-tick; s=x.h+tick; t=e-TP_R*(s-e)
                          raw=(eq*RISK_PCT/100)/abs(e-s); q=math.floor(raw); risk=abs(e-s)*q
                          if q>0 and risk>0:
                              pending=Plan(d,e,s,t,risk,q,i,x.ct,x.h,x.l); all_signals+=1
              if active is not None and REPORT_START<=active.sig_t<REPORT_END:
                  raise RuntimeError(f'{symbol}: report-eligible position still open at RUN_END')
              wins=sum(t.canon_r>0 for t in trades); losses=sum(t.canon_r<0 for t in trades); total=sum(t.canon_r for t in trades)
              out=dict(symbol=symbol,tf=5,state_start='2026-07-28 00:00 VN',report_start='2026-08-05 00:00 VN',report_end_exclusive='2026-08-10 00:00 VN',trades=len(trades),wins=wins,losses=losses,total_r=total,win_rate=(100*wins/len(trades) if trades else None),avg_r=(total/len(trades) if trades else None),profit_factor=(w_gp/w_gl if w_gl else None),max_dd_pct=w_dd,max_losing_streak=w_max_ls,all_signals=all_signals,all_closed=all_closed,tick=tick,pivot_high_ties=pht,pivot_low_ties=plt)
              Path(f'/tmp/wrpy/{symbol}.json').write_text(json.dumps(out,indent=2))
              Path(f'/tmp/wrpy/{symbol}_trades.json').write_text(json.dumps([ns['asdict'](t) for t in trades],indent=2))
              return out
          results=[run_symbol('BNBUSDT'),run_symbol('TRXUSDT')]
          print(json.dumps(results,indent=2))
          # Hard parity gate against the deterministic Pine dashboard from the authenticated TV run.
          exp={'BNBUSDT':(5,3.42),'TRXUSDT':(4,2.60)}
          for r in results:
              n,rr=exp[r['symbol']]
              if r['trades']!=n or abs(r['total_r']-rr)>0.02:
                  raise SystemExit(f"PARITY_FAIL {r['symbol']}: got {r['trades']} / {r['total_r']:.6f}R expected {n} / {rr:.2f}R")
          print('PY_DET_PARITY=PASS')
          PY
          python3 /tmp/run_det.py | tee /tmp/wrpy/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-python-deterministic-parity
          path: /tmp/wrpy
          retention-days: 1
