name: Form4 PIT Audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pandas numpy
      - name: Apply transport and dtype compatibility patches
        working-directory: research/ema200w_20260823
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('form4_sec_backtest.py')
          s=p.read_text()
          s=s.replace("UA = 'Louis-Alviss-research-backtest/1.0'", "UA = 'research backtest contact example@example.com'\nSEC_PAGE = 'https://www.sec.gov/data-research/sec-markets-data/insider-transactions-data-sets'")
          s=s.replace("    sess = requests.Session()\n    all_events = []", "    sess = requests.Session()\n    sess.headers.update({'User-Agent': UA, 'Accept':'text/html,application/xhtml+xml,application/zip,*/*;q=0.8', 'Accept-Language':'en-US,en;q=0.9', 'Referer':SEC_PAGE})\n    warm = sess.get(SEC_PAGE, timeout=30)\n    warm.raise_for_status()\n    all_events = []")
          s=s.replace('            time.sleep(0.12)', '            time.sleep(0.5)')
          s=s.replace("    sub['filing_date'] = pd.to_datetime(sub['FILING_DATE'], format='%d-%b-%Y', errors='coerce')", "    sub['filing_date'] = pd.to_datetime(sub['FILING_DATE'], format='%d-%b-%Y', errors='coerce').astype('datetime64[ns]')")
          p.write_text(s)
          PY
      - name: Run preregistered official SEC Form4 validation
        working-directory: research/ema200w_20260823
        run: python form4_sec_backtest.py