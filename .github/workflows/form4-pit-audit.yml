name: Form4 PIT Audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Smoke historical SEC transport only
        run: |
          python - <<'PY'
          import requests, time
          page='https://www.sec.gov/data-research/sec-markets-data/insider-transactions-data-sets'
          url='https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/2010q1_form345.zip'
          uas=[
            'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36; research contact https://github.com/louisalviss/runner-3',
            'louisalviss/runner-3 research contact https://github.com/louisalviss/runner-3',
            'research backtest contact example@example.com',
          ]
          for ua in uas:
            s=requests.Session(); s.headers.update({'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/zip,*/*;q=0.8','Accept-Language':'en-US,en;q=0.9','Referer':page})
            try:
              p=s.get(page,timeout=30)
              time.sleep(1.0)
              r=s.get(url,timeout=60)
              print('UA',ua,'PAGE',p.status_code,'ZIP',r.status_code,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'))
            except Exception as e:
              print('UA',ua,'ERROR',repr(e))
            time.sleep(2.0)
          print('DONE')
          PY