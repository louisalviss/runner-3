name: Form4 PIT Audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install 'gdown>=6.1.0' pandas
      - name: Download and audit compiled SEC tables
        run: |
          mkdir -p /tmp/sec
          gdown 1oh3kJd9wZvazyrmTYiGMCFg68mjJAtJ- -O /tmp/sec/SUBMISSION.csv --quiet
          gdown 1S_rz4tKUR9u4cL41GRKQiDDcelv2uI_R -O /tmp/sec/REPORTINGOWNER.csv --quiet
          gdown 1vBPyZy5qlqBzutmTiuxkxoiywpKgsgNe -O /tmp/sec/NONDERIV_TRANS.csv --quiet
          ls -lh /tmp/sec
          python - <<'PY'
          import pandas as pd, os, json
          base='/tmp/sec'
          for name in ['SUBMISSION.csv','REPORTINGOWNER.csv','NONDERIV_TRANS.csv']:
              p=f'{base}/{name}'
              head=pd.read_csv(p,nrows=3,dtype=str,low_memory=False)
              print('FILE',name,'BYTES',os.path.getsize(p),'COLS',json.dumps(list(head.columns)))
              print(head.head(2).to_json(orient='records')[:6000])
          sub=pd.read_csv(f'{base}/SUBMISSION.csv',usecols=['FILING_DATE','DOCUMENT_TYPE','ISSUERTRADINGSYMBOL'],dtype=str,low_memory=False)
          d=pd.to_datetime(sub['FILING_DATE'],format='%d-%b-%Y',errors='coerce')
          print('SUB_ROWS',len(sub),'DATE_MIN',d.min(),'DATE_MAX',d.max(),'FORM4_ROWS',int(sub['DOCUMENT_TYPE'].astype(str).str.strip().eq('4').sum()),'TICKERS',sub['ISSUERTRADINGSYMBOL'].nunique())
          print('DONE')
          PY