name: Ebook Reader Browser Runtime Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ebook_reader_browser_runtime_smoke.mjs'
      - '.github/workflows/ebook-reader-browser-runtime-smoke.yml'

permissions:
  contents: read

jobs:
  browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      EBOOK_BROWSER_SMOKE_BOOK_KEY: core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub
      EBOOK_BROWSER_SMOKE_AUDIO_ID: ebook-5c3258ea79a8ffb76bff5fd299ac4619
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live Reader runtime behavior
        run: node scripts/ebook_reader_browser_runtime_smoke.mjs
