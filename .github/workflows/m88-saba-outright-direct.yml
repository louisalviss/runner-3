name: M88 SABA Outright Direct
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/m88-saba-outright-direct.yml']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence /tmp/relays
      - name: VPN
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://www.vpngate.net/api/iphone/ -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n'); meta=[]
          for c in ['TH','JP','SG','MY','ID','KR','TW','VN']:
            rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and r.get('OpenVPN_ConfigData_Base64')]
            rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
            for r in rs[:(10 if c=='TH' else 3)]:
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              p=pathlib.Path(f'/tmp/relays/{len(meta):02d}-{c}.ovpn');p.write_text(cfg);meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/relays.tsv').write_text('\n'.join(meta)+'\n')
          PY
          IFACE=$(ip route show default|awk '{print $5;exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn; sudo ip link set vn netns vpnns
          sudo ip addr add 10.247.0.1/24 dev vh; sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.247.0.2/24 dev vn; sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.247.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.247.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns; printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          selected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo TRY $country $relay
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null||true;sleep 1
            sudo rm -f /tmp/o.log /tmp/top.json;sudo touch /tmp/o.log;sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log||true
            ok=0;for i in {1..12};do sleep 1;grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null&&{ ok=1;break; };done
            [ "$ok" = 1 ]||continue
            if sudo ip netns exec vpnns curl -fsS --max-time 15 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/top.json;then
              if python3 - <<'PY'
          import json
          try:d=json.load(open('/tmp/top.json'))
          except:raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then
                echo "$country $relay"|tee evidence/relay.txt
                selected=1;break
              fi
            fi
          done </tmp/relays.tsv
          test "$selected" = 1
      - name: Click real Outright chip and dump API
        shell: bash
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          OUT=Path(os.environ['WORKSPACE'])/'evidence'
          result={'notes':[]}; reqs=[]; responses=[]
          def txt(f,limit=500000):
            try:return f.locator('body').inner_text(timeout=8000)[:limit]
            except:return ''
          def pf(page):
            xs=[f for f in page.frames if urlparse(f.url).netloc.startswith('i1x9gr.')]
            return xs[-1] if xs else None
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            c=b.new_context(viewport={'width':390,'height':844},screen={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True,locale='en-US',timezone_id='Asia/Bangkok',user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1')
            page=c.new_page()
            def onreq(r):
              if r.resource_type in ('xhr','fetch','document'):
                reqs.append({'method':r.method,'type':r.resource_type,'url':r.url,'post':(r.post_data or '')[:15000]})
            def onresp(r):
              if r.request.resource_type not in ('xhr','fetch'):return
              try:
                ct=(r.headers.get('content-type') or '').lower()
                if 'json' not in ct:return
                body=r.text()
                if len(body)<=12000000 and ('BFOdds' in r.url or re.search(r'premier|outright|goalscorer|relegat|top.?4',body,re.I)):
                  responses.append({'url':r.url,'status':r.status,'body':body[:10000000]})
              except:pass
            page.on('request',onreq);page.on('response',onresp)
            page.goto('https://www.m88.com/sports/Saba%20Sports?Language=en-US',wait_until='domcontentloaded',timeout=45000)
            page.wait_for_timeout(22000)
            f=pf(page)
            if not f: result['notes'].append('no provider frame')
            else:
              # go Sports first
              sp=f.get_by_text('Sports',exact=True)
              for i in range(min(sp.count(),20)):
                try:
                  if sp.nth(i).is_visible():sp.nth(i).click(timeout=5000);break
                except:pass
              page.wait_for_timeout(9000); f=pf(page) or f
              result['sports_url']=f.url
              out=f.get_by_text(re.compile(r'^\s*Outright(?:\s+\d+)?\s*$',re.I))
              result['out_count']=out.count()
              if out.count()==0:result['notes'].append('no outright span')
              else:
                el=out.nth(0)
                result['out_html']=el.evaluate("e=>({self:e.outerHTML, p:e.parentElement&&e.parentElement.outerHTML.slice(0,4000), gp:e.parentElement&&e.parentElement.parentElement&&e.parentElement.parentElement.outerHTML.slice(0,7000), rect:e.getBoundingClientRect().toJSON()})")
                # scroll horizontally to make actual chip visible, then click actionable ancestor
                el.evaluate("e=>e.scrollIntoView({block:'nearest',inline:'center'})")
                page.wait_for_timeout(1000)
                result['visible_after_scroll']=el.is_visible()
                try:
                  el.evaluate("e=>{let a=e.closest('a,button,[role=button],li,.feature-bar__item,.feature-bar__date-item');(a||e).click()}")
                  result['clicked']=True
                except Exception as e:result['click_error']=type(e).__name__
                page.wait_for_timeout(12000); f=pf(page) or f
                result['after_url']=f.url
                result['after_text']=txt(f,200000)
                page.screenshot(path=str(OUT/'after-outright.png'),full_page=False)
                # capture any exact EPL market strings visible after real click
                for term in ['PREMIER LEAGUE','WINNER','TOP 4','RELEGAT','GOALSCORER']:
                  m=re.search(term,result['after_text'],re.I)
                  if m:result['term_'+term]=result['after_text'][max(0,m.start()-1000):m.start()+20000]
            c.close();b.close()
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          (OUT/'requests.json').write_text(json.dumps(reqs,ensure_ascii=False,indent=2))
          (OUT/'responses.json').write_text(json.dumps(responses,ensure_ascii=False,indent=2))
          print('SPORTS_URL',result.get('sports_url'))
          print('OUT_HTML',json.dumps(result.get('out_html'),ensure_ascii=False)[:12000])
          print('CLICKED',result.get('clicked'),'AFTER',result.get('after_url'))
          print('NOTES',result.get('notes'))
          print('AFTER_TEXT',result.get('after_text','')[:30000])
          print('\nREQUESTS')
          for x in reqs:
            if 'BFOdds' in x['url'] or 'Outright' in x['url']:print(json.dumps(x,ensure_ascii=False))
          print('\nRESPONSES')
          for x in responses:print(x['url'],'len',len(x['body']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-saba-outright-direct-${{ github.run_id }}
          path: evidence/
          retention-days: 3
