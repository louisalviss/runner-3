name: SPMO PXD Raw Dukascopy
on:
  push:
    branches: [main]
    paths:
      - 'spmo-modern2/dukascopy_raw_pxd.py'
      - '.github/workflows/spmo-pxd-raw.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -u spmo-modern2/dukascopy_raw_pxd.py
