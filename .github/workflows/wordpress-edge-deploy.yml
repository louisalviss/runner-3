name: WordPress Edge Deploy

on:
  push:
    branches: [main]
    paths:
      - 'edge/wordpress-edge-proxy/**'
      - 'scripts/deploy-wordpress-cloudflare-edge.mjs'
      - '.github/workflows/wordpress-edge-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-edge-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy and verify edge snapshot
        run: node scripts/deploy-wordpress-cloudflare-edge.mjs
      - name: Show deploy result
        if: always()
        run: |
          test -f /tmp/cloudflare-wordpress-edge.json && cat /tmp/cloudflare-wordpress-edge.json || true
