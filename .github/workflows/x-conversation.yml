name: X Conversation Extract

on:
  push:
    paths:
      - x-conversation-job.json

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract conversation
        run: |
          ID="$(python -c 'import json; print(json.load(open("x-conversation-job.json"))["tweet_id"])')"
          python x_extract_conversation.py "x-results/$ID/result.json" "x-results/$ID/conversation.json"
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "x conversation result ${{ github.run_id }}"
          git pull --rebase origin main
          git push origin HEAD:main
