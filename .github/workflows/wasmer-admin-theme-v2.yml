name: Wasmer Admin Theme Handoff v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wasmer-admin-theme-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Package theme
        run: |
          cd wordpress-site/wp-content/themes
          zip -qr "$GITHUB_WORKSPACE/runner3-starter.zip" runner3-starter
      - name: Generate ephemeral key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/session-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/session-private.pem -pubout -out session-public.pem >/dev/null 2>&1
          chmod 600 /tmp/session-private.pem
      - name: Upload public key
        uses: actions/upload-artifact@v4
        with:
          name: wasmer-handoff-key-${{ github.run_id }}
          path: session-public.pem
          retention-days: 1
      - name: Receive encrypted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/wasmer-session/${GITHUB_RUN_ID}.b64?ref=main"
          for i in $(seq 1 150); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.raw+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API" -o /tmp/session.b64 2>/dev/null; then break; fi
            sleep 2
          done
          test -s /tmp/session.b64
          base64 -d /tmp/session.b64 > /tmp/session.enc
          openssl pkeyutl -decrypt -inkey /tmp/session-private.pem -in /tmp/session.enc -out /tmp/session.json -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python - <<'PY'
          import json
          x=json.load(open('/tmp/session.json'))
          for k in ['wasmer_user','wasmer_password','app_name']:
              assert x.get(k), k
          for v in x.values(): print('::add-mask::'+v)
          print('HANDOFF_DECRYPTED=true')
          PY
      - name: Install Playwright
        run: npm install --no-save playwright-core@1.58.2
      - name: Magic login and activate theme
        run: |
          cat > admin.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          import path from 'path';
          const id=JSON.parse(fs.readFileSync('/tmp/session.json','utf8'));
          const site='https://'+id.app_name+'.wasmer.app';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();
          async function b(p=page){return (await p.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim()}
          async function click(loc){if(await loc.count()){await loc.first().click({timeout:10000}).catch(()=>{});return true}return false}
          try{
            await page.goto('https://wasmer.io/login',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(800);
            const u=page.locator('input[name="username"],input[name="email"],input[autocomplete="username"],input[type="text"]').first();
            if(!await u.count()) throw Error('username field missing');
            await u.fill(id.wasmer_user);
            await click(page.getByRole('button',{name:/continue|log in|login|next/i}));
            await page.waitForTimeout(900);
            let p=page.locator('input[type="password"]').first();
            if(!await p.count()){await page.keyboard.press('Enter');await page.waitForTimeout(700);p=page.locator('input[type="password"]').first()}
            if(!await p.count()) throw Error('password field missing');
            await p.fill(id.wasmer_password);
            if(!await click(page.getByRole('button',{name:/log in|login|continue|sign in/i}))) await page.keyboard.press('Enter');
            await page.waitForTimeout(1800);
            if(/\/login/i.test(page.url())) throw Error('Wasmer login failed');
            console.log('WASMER_LOGIN=true');

            await page.goto(`https://wasmer.io/apps/${id.wasmer_user}/${id.app_name}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(1400);
            let admin=page.getByRole('link',{name:/wordpress admin/i}).first();
            if(!await admin.count()) admin=page.getByRole('button',{name:/wordpress admin/i}).first();
            if(!await admin.count()) admin=page.getByText(/wordpress admin/i).first();
            if(!await admin.count()) {console.log((await b()).slice(0,1200));throw Error('WordPress Admin control missing')}
            const before=page.context().pages().length;
            await admin.click();
            await page.waitForTimeout(2500);
            const pages=page.context().pages();
            let wp=pages.find(x=>/wp-admin/i.test(x.url()));
            if(!wp && /wp-admin/i.test(page.url())) wp=page;
            if(!wp) throw Error('Magic login did not reach wp-admin');
            console.log('WP_MAGIC_LOGIN=true');

            await wp.goto(site+'/wp-admin/theme-install.php',{waitUntil:'domcontentloaded',timeout:90000});
            await wp.waitForTimeout(1000);
            await click(wp.getByRole('button',{name:/upload theme/i}));
            const file=wp.locator('input[type="file"]').first();
            if(!await file.count()) throw Error('theme upload missing');
            await file.setInputFiles(path.resolve('runner3-starter.zip'));
            const install=wp.getByRole('button',{name:/install now/i}).first();
            if(!await install.count()) throw Error('install button missing');
            await install.click(); await wp.waitForTimeout(4500);
            const activate=wp.getByRole('link',{name:/activate/i}).first();
            if(await activate.count()){await activate.click();await wp.waitForTimeout(2200)}
            await wp.goto(site,{waitUntil:'domcontentloaded',timeout:90000}); await wp.waitForTimeout(1000);
            const txt=await b(wp);
            console.log('RUNNER3_THEME_MARKER='+/Built as a practical starter|Ready to edit|Runner3 Site/i.test(txt));
            console.log('LIVE_SITE_URL='+site);
            console.log('LIVE_SITE_SAMPLE='+txt.slice(0,900));
            console.log('ADMIN_THEME_COMPLETE=true');
          } finally {await browser.close()}
          JS
          node admin.mjs
      - name: Destroy secrets
        if: always()
        run: |
          shred -u /tmp/session-private.pem /tmp/session.json /tmp/session.enc /tmp/session.b64 2>/dev/null || true
          rm -f session-public.pem admin.mjs
