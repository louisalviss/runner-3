name: moxing-dom-debug
on:
  push:
    branches: [main]
    paths:
      - 'scripts/moxing_dom_debug.py'
      - '.github/workflows/moxing-dom-debug.yml'
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests beautifulsoup4 lxml
      - run: python scripts/moxing_dom_debug.py | tee moxing_debug.json
      - uses: actions/upload-artifact@v4
        with:
          name: moxing-dom-debug
          path: |
            moxing_debug.json
            moxing_kaitou_debug.html
          retention-days: 3
