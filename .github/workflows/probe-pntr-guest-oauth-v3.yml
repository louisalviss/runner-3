name: PNTR Guest OAuth V3 Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-pntr-guest-oauth-v3.yml'
      - 'scripts/probe-pntr-guest-oauth-v3.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore PNTR state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || exit 2
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/pntr/browser-state.aes -out /tmp/pntr-browser-state.json
          chmod 600 /tmp/pntr-browser-state.json
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.58.2 >/dev/null
      - name: Probe guest ownership and OAuth callback safely
        run: node scripts/probe-pntr-guest-oauth-v3.mjs
      - name: Cleanup
        if: always()
        run: rm -f /tmp/pntr-browser-state.json
