name: Zaid Reference Extract

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'RUN_ZAID_REFERENCE_EXTRACT'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download reference and extract frames
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence/zaid-reference
          mkdir -p evidence/zaid-reference/frames
          URL='https://video.twimg.com/amplify_video/2088913945902075904/vid/avc1/1280x720/HqsM-7lohCT0vzRB.mp4?tag=14'
          curl -L --fail --retry 4 --retry-delay 2 -A 'Mozilla/5.0' "$URL" -o /tmp/zaid-reference.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,r_frame_rate -of json /tmp/zaid-reference.mp4 | tee evidence/zaid-reference/meta.json
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/zaid-reference.mp4)
          python3 - "$DURATION" <<'PY'
          import sys, subprocess
          d=float(sys.argv[1])
          for i, frac in enumerate([.05,.16,.27,.38,.49,.60,.71,.82,.93],1):
              t=max(0,d*frac)
              subprocess.run(['ffmpeg','-loglevel','error','-y','-ss',f'{t:.3f}','-i','/tmp/zaid-reference.mp4','-frames:v','1','-q:v','2',f'evidence/zaid-reference/frames/frame-{i:02d}.jpg'],check=True)
          PY
          ffmpeg -loglevel error -y -i /tmp/zaid-reference.mp4 -vf "fps=1/2,scale=640:-1,tile=3x3" -frames:v 1 evidence/zaid-reference/contact-sheet.jpg || true
          ls -lh evidence/zaid-reference evidence/zaid-reference/frames
      - name: Commit extracted evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/zaid-reference
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: add Zaid reference frames'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: zaid-reference
          path: evidence/zaid-reference/
          retention-days: 2
