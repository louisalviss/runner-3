name: Cloudflare GitHub Secret Names Audit (One-Time GET Only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-gh-secret-name-census.yml'
      - 'scripts/cloudflare_gh_secret_name_census.py'
      - 'scripts/tests/test_cloudflare_gh_secret_name_census.py'

permissions:
  contents: read

concurrency:
  group: cloudflare-gh-secret-name-census
  cancel-in-progress: false

jobs:
  inspect-names:
    if: ${{ github.repository == 'louisalviss/runner-3' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce in-memory no-disclosure contracts (NO Cloudflare secrets in this step)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare_gh_secret_name_census.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_gh_secret_name_census.py' -v
      - name: Inspect only Cloudflare Secret names and GET-only D1 metadata
        shell: bash
        env:
          GH_ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          python3 scripts/cloudflare_gh_secret_name_census.py
      - name: Preserve token-NAME-only sanitized audit for 2 days
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-gh-secret-name-census
          path: migration-out/cloudflare-secret-name-census.json
          if-no-files-found: error
          retention-days: 2
