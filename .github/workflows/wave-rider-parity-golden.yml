name: Wave Rider TradingView Golden Parity
on:
  push:
    branches: [main]
    paths:
      - 'wave-rider-verify/reference_verify.py'
      - 'wave-rider-verify/reference_verify_parity.py'
      - 'wave-rider-verify/golden/tv_5m_entries_2026-07-27_2026-08-16.json'
      - 'wave-rider-verify/golden/tv_5m_accounting_2026-07-27_2026-08-16.json'
      - 'wave-rider-verify/golden/tv_5m_native_execution_2026-07-27_2026-08-16.json'
      - '.github/workflows/wave-rider-parity-golden.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  golden:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BNBUSDT, TRXUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WR_SYMBOL: ${{ matrix.symbol }}
      WR_START: 2026-07-27
      WR_END: 2026-08-16
    steps:
      - uses: actions/checkout@v4
      - name: Run full golden execution dataset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wave-rider-verify/output
          python3 wave-rider-verify/reference_verify_parity.py >/tmp/parity-run.txt
          cp "wave-rider-verify/output/${WR_SYMBOL}_5m_trades.csv" /tmp/full-trades.csv
          cp "wave-rider-verify/output/${WR_SYMBOL}_5m_summary.json" /tmp/full-summary.json
      - name: Assert TradingView native execution and accounting golden
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,json,os,sys
          sym=os.environ['WR_SYMBOL']
          entries=json.load(open('wave-rider-verify/golden/tv_5m_entries_2026-07-27_2026-08-16.json'))['symbols'][sym]
          acct=json.load(open('wave-rider-verify/golden/tv_5m_accounting_2026-07-27_2026-08-16.json'))['symbols'][sym]
          native=json.load(open('wave-rider-verify/golden/tv_5m_native_execution_2026-07-27_2026-08-16.json'))['symbols'][sym]
          rows=list(csv.DictReader(open('/tmp/full-trades.csv',newline=''))); s=json.load(open('/tmp/full-summary.json'))
          qty=[float(r['qty']) for r in rows]; risk=[float(r['risk_cash']) for r in rows]; rr=[float(r['canon_r']) for r in rows]
          final_eq=100000+sum(float(r['canon_r'])*float(r['risk_cash']) for r in rows)
          native_ok=len(rows)==len(native) and all(r['side']==g['side'] and r['entry_time']==g['entry_time'] and r['exit_time']==g['exit_time'] and abs(float(r['entry'])-float(g['entry']))<=1e-12 and abs(float(r['exit_price'])-float(g['exit_price']))<=1e-12 for r,g in zip(rows,native))
          checks={
            'count':len(rows)==len(entries)==len(acct['quantities'])==len(native),
            'native_execution':native_ok,
            'entries':[r['entry_time'] for r in rows]==entries,
            'qty':all(abs(a-b)<=1e-9 for a,b in zip(qty,acct['quantities'])),
            'risk':all(abs(a-b)<=1e-6 for a,b in zip(risk,acct['risk_cash'])),
            'r':all(abs(a-b)<=1e-12 for a,b in zip(rr,acct['canon_r'])),
            'exit':[r['exit_reason'] for r in rows]==acct['exit_reason'],
            'total_r':abs(float(s['total_r'])-float(acct['total_r_exact']))<=1e-12,
            'equity':abs(final_eq-float(acct['final_canonical_equity']))<=1e-6,
            'meta':s.get('contract_meta_verified') is True,
          }
          print(json.dumps({'symbol':sym,'phase':'full','checks':checks},indent=2))
          if not all(checks.values()):sys.exit(7)
          PY
      - name: Run narrower report over same production dataset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wave-rider-verify/output
          WR_START=2026-08-05 WR_END=2026-08-10 WR_DATA_START=2026-07-27 WR_DATA_END=2026-08-16 python3 wave-rider-verify/reference_verify_parity.py >/tmp/window-run.txt
      - name: Assert report-only semantics
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,json,os,sys
          from datetime import datetime,timezone
          sym=os.environ['WR_SYMBOL']; full=list(csv.DictReader(open('/tmp/full-trades.csv',newline=''))); win=list(csv.DictReader(open(f'wave-rider-verify/output/{sym}_5m_trades.csv',newline='')))
          sf=json.load(open('/tmp/full-summary.json')); sw=json.load(open(f'wave-rider-verify/output/{sym}_5m_summary.json'))
          lo=datetime(2026,8,5,tzinfo=timezone.utc); hi=datetime(2026,8,11,tzinfo=timezone.utc); dt=lambda s:datetime.fromisoformat(s.replace('Z','+00:00'))
          exp=[r for r in full if lo<=dt(r['signal_time'])<hi]
          fields=['side','signal_time','entry_time','exit_time','entry','stop','target','exit_price','exit_reason','canon_r','risk_cash','qty','ambiguous']
          exact=len(win)==len(exp) and all(all(a[k]==b[k] for k in fields) for a,b in zip(win,exp)); er=sum(float(r['canon_r']) for r in exp)
          checks={'slice':exact,'total_r':abs(float(sw['total_r'])-er)<=1e-12,'production_equity':abs(float(sw['production_final_equity'])-float(sf['production_final_equity']))<=1e-6,'data':sw.get('data_start')=='2026-07-27' and sw.get('data_end')=='2026-08-16'}
          print(json.dumps({'symbol':sym,'phase':'report_only','expected':len(exp),'actual':len(win),'checks':checks},indent=2))
          if not all(checks.values()):sys.exit(8)
          PY
