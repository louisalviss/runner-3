name: Private Backtest Scope Repairs

on:
  push:
    branches: [main]
    paths:
      - 'jobs/private-backtest-scope-repairs.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair paper META alias
        run: python tools/private_backtest_paper_meta_repair.py
      - name: Repair crypto perp SHIB alias
        run: python tools/private_backtest_crypto_perp_shib_repair.py
