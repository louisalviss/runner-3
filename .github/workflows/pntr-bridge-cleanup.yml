name: PNTR Bridge Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pntr-bridge-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore Wasmer session
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || exit 2
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-account.json
          if [ -f ops/wasmer/browser-state.aes ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/browser-state.aes -out /tmp/wasmer-browser-state.json
          fi
          chmod 600 /tmp/wasmer-account.json
          [ ! -f /tmp/wasmer-browser-state.json ] || chmod 600 /tmp/wasmer-browser-state.json
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.58.2 >/dev/null
      - name: Remove Runner3 PNTR bridge plugins
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright-core');
          const fs=require('fs');
          const account=JSON.parse(fs.readFileSync('/tmp/wasmer-account.json','utf8'));
          const APP='runner3-wp-a94b8fd2';
          const owner=account.username;
          const dashboard=`https://wasmer.io/apps/${encodeURIComponent(owner)}/${APP}`;
          const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
          const body=async p=>clean(await p.locator('body').innerText().catch(()=>''));
          async function login(p){
            await p.goto('https://wasmer.io/login',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(700);
            const ident=p.locator('input[name=username],input[placeholder*=Username i],input[type=text]').first();
            if(!(await ident.count())) return false;
            await ident.fill(account.username||account.email);
            let b=p.locator('button').filter({hasText:/continue|next|log in|sign in/i}).first();
            if(await b.count()) await b.click().catch(()=>{}); else await ident.press('Enter');
            const pass=p.locator('input[type=password]').first();
            if(!(await pass.waitFor({state:'visible',timeout:12000}).then(()=>true).catch(()=>false))) return false;
            await pass.fill(account.password);
            b=p.locator('button,input[type=submit]').filter({hasText:/log in|sign in|continue/i}).first();
            if(await b.count()) await b.click().catch(()=>{}); else await pass.press('Enter');
            await p.waitForTimeout(3000);
            return !/\/login(?:[/?#]|$)/i.test(p.url());
          }
          async function wpAdmin(ctx,p){
            await p.goto(dashboard,{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(1000);
            if(/\/login(?:[/?#]|$)/i.test(p.url()) || /log in|sign in/i.test((await body(p)).slice(0,500))){
              if(!(await login(p))) throw new Error('Wasmer login failed');
              await p.goto(dashboard,{waitUntil:'domcontentloaded',timeout:60000});
              await p.waitForTimeout(1000);
            }
            const a=p.getByText(/WordPress Admin/i).first();
            if(!(await a.count())) throw new Error('WordPress Admin control missing');
            const href=await a.getAttribute('href').catch(()=>null);
            if(href){
              const q=await ctx.newPage();
              await q.goto(new URL(href,'https://wasmer.io').href,{waitUntil:'domcontentloaded',timeout:60000});
              await q.waitForTimeout(2200);
              if(/\/wp-admin/i.test(q.url())) return q;
              await q.close().catch(()=>{});
            }
            const pp=ctx.waitForEvent('page',{timeout:10000}).catch(()=>null);
            await a.click().catch(()=>{});
            const pop=await pp;
            await p.waitForTimeout(2500);
            for(const q of [pop,...ctx.pages()].filter(Boolean)) if(/\/wp-admin/i.test(q.url())) return q;
            throw new Error('WordPress magic admin failed');
          }
          (async()=>{
            const state=fs.existsSync('/tmp/wasmer-browser-state.json')?'/tmp/wasmer-browser-state.json':undefined;
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const c=await b.newContext({storageState:state,ignoreHTTPSErrors:true});
            const p=await c.newPage();
            try{
              const wp=await wpAdmin(c,p);
              const origin=new URL(wp.url()).origin;
              const plugins=`${origin}/wp-admin/plugins.php`;
              await wp.goto(plugins,{waitUntil:'domcontentloaded',timeout:60000});
              await wp.waitForTimeout(800);
              if(/wp-login\.php/i.test(wp.url())) throw new Error('WordPress session lost');
              let removed=0;
              for(let iter=0;iter<20;iter++){
                await wp.goto(plugins,{waitUntil:'domcontentloaded',timeout:60000});
                await wp.waitForTimeout(500);
                const rows=wp.locator('tr').filter({hasText:/Runner3 PNTR Cookie Bridge/i});
                const n=await rows.count();
                if(!n) break;
                const row=rows.first();
                const txt=await row.innerText().catch(()=> '');
                let link=row.locator('a').filter({hasText:/^Deactivate$/i}).first();
                if(await link.count()){
                  const href=await link.getAttribute('href');
                  if(href) await wp.goto(new URL(href,wp.url()).href,{waitUntil:'domcontentloaded',timeout:60000});
                  else await link.click();
                  await wp.waitForTimeout(700);
                  continue;
                }
                link=row.locator('a').filter({hasText:/^Delete$/i}).first();
                if(!(await link.count())) link=row.locator('a[href*="action=delete"]').first();
                if(!(await link.count())) throw new Error('Delete link missing for bridge plugin: '+txt.slice(0,120));
                wp.once('dialog',d=>d.accept().catch(()=>{}));
                const href=await link.getAttribute('href').catch(()=>null);
                if(href) await wp.goto(new URL(href,wp.url()).href,{waitUntil:'domcontentloaded',timeout:60000});
                else await link.click();
                await wp.waitForTimeout(700);
                const confirm=wp.locator('input[type=submit],button').filter({hasText:/Yes, delete|Delete these files|Delete Plugin/i}).first();
                if(await confirm.count()){
                  await confirm.click().catch(()=>{});
                  await wp.waitForTimeout(900);
                }
                removed++;
              }
              await wp.goto(plugins,{waitUntil:'domcontentloaded',timeout:60000});
              await wp.waitForTimeout(500);
              const left=await wp.locator('tr').filter({hasText:/Runner3 PNTR Cookie Bridge/i}).count();
              console.log('BRIDGE_PLUGIN_ROWS_LEFT='+left);
              console.log('BRIDGE_DELETE_ACTIONS='+removed);
              if(left!==0) throw new Error('Bridge plugins still present');
              for(const route of ['/pntr-bridge-status','/pntr-bridge-v5-status']){
                const r=await c.request.get('https://runner3wp.pntr.dev'+route,{failOnStatusCode:false,timeout:20000});
                const t=await r.text().catch(()=> '');
                console.log(`ROUTE_${route.includes('v5')?'V5':'OLD'}_HTTP=${r.status()} READY=${/RUNNER3_PNTR_BRIDGE_READY/.test(t)}`);
                if(/RUNNER3_PNTR_BRIDGE_READY/.test(t)) throw new Error('Bridge route remains active');
              }
              console.log('PNTR_BRIDGE_CLEANUP_OK=true');
            } finally { await b.close().catch(()=>{}); }
          })().catch(e=>{console.error('SAFE_ERROR='+String(e).replace(/[A-Za-z0-9_-]{28,}/g,'REDACTED').slice(0,250));process.exit(1)});
          NODE
      - name: Cleanup decrypted state
        if: always()
        run: rm -f /tmp/wasmer-account.json /tmp/wasmer-browser-state.json
