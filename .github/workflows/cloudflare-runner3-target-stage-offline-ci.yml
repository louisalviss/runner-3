name: Cloudflare Runner3 Target Stage Offline CI

on:
  pull_request:
    paths:
      - 'scripts/cloudflare_runner3_target_stage_plan.py'
      - 'scripts/tests/test_cloudflare_runner3_target_stage_plan.py'
      - 'ops/cloudflare-account-rehome/staging/runner3-core-target-stage-plan.json'
      - 'scripts/cloudflare_d1_core_additive_schema.py'
      - 'scripts/tests/test_cloudflare_d1_core_additive_schema.py'
      - 'ops/cloudflare-account-rehome/staging/runner3-core-additive-proven-16.sql'
      - 'ops/cloudflare-account-rehome/staging/runner3-core-additive-proven-18.sql'
      - 'scripts/cloudflare_d1_final_39_private_bundle.py'
      - 'scripts/tests/test_cloudflare_d1_final_39_private_bundle.py'
      - 'scripts/cloudflare_d1_final_six_source_ddl.py'
      - 'scripts/tests/test_cloudflare_d1_final_six_source_ddl.py'
      - '.github/workflows/cloudflare-d1-final-six-source-ddl-readonly.yml'
      - 'scripts/cloudflare_d1_ci_source_matched_schema.py'
      - 'scripts/tests/test_cloudflare_d1_ci_source_matched_schema.py'
      - 'ops/cloudflare-account-rehome/staging/content-intelligence-additive-proven-15.sql'
      - 'cloudflare/runner3-core/content-intelligence-schema.sql'
      - 'cloudflare/runner3-core/migrations/0002_state_checkpoints.sql'
      - 'cloudflare/runner3-core/migrations/0009_content_event_dedupe.sql'
      - 'cloudflare/runner3-core/migrations/0015_personal_score_stage.sql'
      - 'cloudflare/runner3-core/migrations/0017_user_content_event_idempotency.sql'
      - 'cloudflare/runner3-core/artifact-library-reader-v82-stable-shell-entry.js'
      - '.github/workflows/cloudflare-runner3-target-stage-offline-ci.yml'

permissions:
  contents: read

jobs:
  target-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject stale bindings and unsafe production dependencies
        run: |
          python3 -m py_compile scripts/cloudflare_runner3_target_stage_plan.py
          python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_runner3_target_stage_plan.py' -v
          python3 scripts/cloudflare_runner3_target_stage_plan.py --check
          python3 -m py_compile scripts/cloudflare_d1_core_additive_schema.py
          python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_core_additive_schema.py' -v
          python3 scripts/cloudflare_d1_core_additive_schema.py --check
          python3 -m py_compile scripts/cloudflare_d1_ci_source_matched_schema.py
          python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_ci_source_matched_schema.py' -v
          python3 scripts/cloudflare_d1_ci_source_matched_schema.py --check
          python3 -m py_compile scripts/cloudflare_d1_final_six_source_ddl.py
          python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_final_six_source_ddl.py' -v
          python3 -m py_compile scripts/cloudflare_d1_final_39_private_bundle.py
          python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_final_39_private_bundle.py' -v
