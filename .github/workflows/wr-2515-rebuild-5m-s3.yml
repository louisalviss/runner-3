name: WR 2.5.15 Rebuild 5m S3
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/wr-2515-rebuild-5m-s3.yml']
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify four v2.5.15 oracle windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wr
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
          cat >/tmp/oracle.py <<'PY'
          import json,math,sys,types
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          src=Path('/tmp/reference_verify.py').read_text().replace('sra<=SIGNAL_RANGE_MAX','sra<SIGNAL_RANGE_MAX')
          old="""        if v[c]==ext:\n            if sum(x==ext for x in w)==1: base[conf]=v[c]\n            else: ties+=1\n"""
          new="""        if v[c]==ext:\n            if all(x!=ext for x in v[c+1:c+right+1]): base[conf]=v[c]\n            else: ties+=1\n"""
          if src.count(old)!=1: raise RuntimeError('pivot patch anchor missing')
          src=src.replace(old,new,1)
          mod=types.ModuleType('wrref');mod.__file__='reference_verify.py';sys.modules['wrref']=mod;exec(compile(src,'reference_verify.py','exec'),mod.__dict__);ns=mod.__dict__
          VN=timezone(timedelta(hours=7)); ms=lambda s:int(datetime.fromisoformat(s).replace(tzinfo=VN).timestamp()*1000)
          STATE=ms('2026-07-28');RUN_END=ms('2026-08-18');windows=[('W1',ms('2026-08-05'),ms('2026-08-10')),('W2',ms('2026-08-10'),ms('2026-08-16'))]
          exp={('BNBUSDT','W1'):(5,3.420895522388),('TRXUSDT','W1'):(4,2.6),('BNBUSDT','W2'):(3,6.9),('TRXUSDT','W2'):(2,-2.0)}
          def run(symbol,rs,re):
            ns['SYMBOL']=symbol;ns['START']='2026-07-27';ns['END']='2026-08-18';ns['WARMUP_DAYS']=0
            one,tick,missing=ns['fetch_1m']();bars=[x for x in ns['agg'](one,5) if STATE<=x.ot<RUN_END]
            if not bars or bars[0].ot!=STATE: raise RuntimeError(f'{symbol}: anchor missing')
            ind,_,_=ns['calc_ind'](bars);Plan=ns['Plan'];nextb=ns['next_bracket'];sf=ns['session_flags'];TP=ns['TP_R'];RP=ns['RISK_PCT'];eq=ns['INIT'];pending=active=None;out=[]
            def close(i,reason,px):
              nonlocal active,eq
              p=active;both=bars[i].h>=max(p.s,p.t) and bars[i].l<=min(p.s,p.t) and reason in ('TP','SL')
              if both:reason='AMBIG->SL'
              cr=TP if reason=='TP' else (-1.0 if reason in ('SL','AMBIG->SL') else ((px-p.e)*(1 if p.d==1 else -1)*p.qty/p.risk));eq+=cr*p.risk
              if rs<=p.sig_t<re:out.append(cr)
              active=None;return True
            for i,x in enumerate(bars):
              closed=False
              if active is not None:
                r,px=nextb(active,x,None)
                if r:closed=close(i,r,px)
              if active is None and pending is not None and i==pending.sig_i+1 and not closed:
                fill=(pending.d==1 and round(x.h/tick)>=round(pending.e/tick)) or (pending.d==-1 and round(x.l/tick)<=round(pending.e/tick))
                if fill:
                  gap=(pending.d==1 and round(x.o/tick)>=round(pending.e/tick)) or (pending.d==-1 and round(x.o/tick)<=round(pending.e/tick));active=pending;pending=None;r,px=nextb(active,x,None if gap else active.e)
                  if r:closed=close(i,r,px)
              allowed,sexit=sf(x.ct+1,300000)
              if active is not None and not closed:
                z=ind[i];le=active.d==1 and x.c<z['ema'] and not z['ha'] and not z['ema_up'];se=active.d==-1 and x.c>z['ema'] and not z['hb'] and bool(z['ema_up'])
                if sexit:closed=close(i,'SESSION',x.c)
                elif le or se:closed=close(i,'EMA',x.c)
              if pending is not None and i>=pending.sig_i+1 and active is None:pending=None
              if active is None and pending is None and not closed:
                z=ind[i];lr=z['ha'] and x.c>z['ema'] and z['ag'] and z['chop_ok'] and z['res'] is not None;sr=z['hb'] and x.c<z['ema'] and z['ar'] and z['chop_ok'] and z['sup'] is not None
                nl=allowed and z['sra_ok'] and x.c>x.o and lr and x.c>z['res'] and x.l<=z['res'];sh=allowed and z['sra_ok'] and x.c<x.o and sr and x.c<z['sup'] and x.h>=z['sup']
                if nl or sh:
                  if nl:d=1;e=x.h+tick;s=x.l-tick;t=e+TP*(e-s)
                  else:d=-1;e=x.l-tick;s=x.h+tick;t=e-TP*(s-e)
                  q=math.floor((eq*RP/100)/abs(e-s));risk=abs(e-s)*q
                  if q>0 and risk>0:pending=Plan(d,e,s,t,risk,q,i,x.ct,x.h,x.l)
            return len(out),sum(out)
          rows=[]
          for sym in ('BNBUSDT','TRXUSDT'):
            for label,rs,re in windows:
              got=run(sym,rs,re);want=exp[(sym,label)];ok=got[0]==want[0] and abs(got[1]-want[1])<=.02;rows.append({'symbol':sym,'window':label,'trades':got[0],'R':got[1],'pass':ok});print(sym,label,got,'PASS' if ok else 'FAIL')
              if not ok:raise SystemExit(7)
          Path('/tmp/wr/oracle.json').write_text(json.dumps(rows,indent=2));print('PARITY_4_WINDOWS=PASS')
          PY
          python3 /tmp/oracle.py | tee /tmp/wr/oracle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr2515-s3-oracle
          path: /tmp/wr
          retention-days: 3

  baseline:
    needs: oracle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - name: Rebuild raw 5m archive shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
        run: |
          set -euo pipefail
          mkdir -p /tmp/wr
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
          cat >/tmp/full5.py <<'PY'
          import csv,io,json,math,os,sys,time,types,zipfile,xml.etree.ElementTree as ET
          from datetime import datetime,timezone
          from pathlib import Path
          import requests
          src=Path('/tmp/reference_verify.py').read_text().replace('sra<=SIGNAL_RANGE_MAX','sra<SIGNAL_RANGE_MAX')
          old="""        if v[c]==ext:\n            if sum(x==ext for x in w)==1: base[conf]=v[c]\n            else: ties+=1\n""";new="""        if v[c]==ext:\n            if all(x!=ext for x in v[c+1:c+right+1]): base[conf]=v[c]\n            else: ties+=1\n"""
          if src.count(old)!=1:raise RuntimeError('pivot patch anchor missing')
          src=src.replace(old,new,1);mod=types.ModuleType('wrref');mod.__file__='reference_verify.py';sys.modules['wrref']=mod;exec(compile(src,'reference_verify.py','exec'),mod.__dict__);ns=mod.__dict__
          Bar=ns['Bar'];Plan=ns['Plan'];calc=ns['calc_ind'];nextb=ns['next_bracket'];sf=ns['session_flags'];infer=ns['infer_tick'];TP=ns['TP_R'];RP=ns['RISK_PCT'];INIT=ns['INIT']
          SHARD=int(os.environ['SHARD']);SHARDS=int(os.environ['SHARDS']);sess=requests.Session();sess.headers['User-Agent']='runner3-wr2515-s3/1.0'
          endpoint='https://s3-ap-northeast-1.amazonaws.com/data.binance.vision';prefix='data/futures/um/monthly/klines/'
          params={'list-type':'2','delimiter':'/','prefix':prefix,'max-keys':'1000'};symbols=[]
          while True:
            r=sess.get(endpoint,params=params,timeout=60);r.raise_for_status();root=ET.fromstring(r.content);nsx={'s':'http://s3.amazonaws.com/doc/2006-03-01/'}
            for p in root.findall('s:CommonPrefixes/s:Prefix',nsx):
              x=p.text
              if x and x.startswith(prefix):
                sym=x[len(prefix):].strip('/')
                if sym.endswith('USDT'):symbols.append(sym)
            trunc=(root.findtext('s:IsTruncated',default='false',namespaces=nsx)=='true');token=root.findtext('s:NextContinuationToken',default='',namespaces=nsx)
            if not trunc or not token:break
            params['continuation-token']=token
          symbols=sorted(set(symbols));symbols=[s for i,s in enumerate(symbols) if i%SHARDS==SHARD]
          print('UNIVERSE_SHARD',SHARD,len(symbols),flush=True)
          STATE=int(datetime(2024,12,1,tzinfo=timezone.utc).timestamp()*1000);START=int(datetime(2025,1,1,tzinfo=timezone.utc).timestamp()*1000);END=int(datetime(2026,8,15,tzinfo=timezone.utc).timestamp()*1000);RUN_END=int(datetime(2026,8,18,tzinfo=timezone.utc).timestamp()*1000)
          months=[(2024,12)]+[(2025,m) for m in range(1,13)]+[(2026,m) for m in range(1,8)]
          def getzip(url):
            for k in range(3):
              try:
                q=sess.get(url,timeout=45)
                if q.status_code==404:return None
                q.raise_for_status();return q.content
              except Exception:
                if k==2:raise
                time.sleep(.5*(k+1))
          def readzip(data):
            bars=[];prices=[]
            if not data:return bars,prices
            with zipfile.ZipFile(io.BytesIO(data)) as z:text=z.read(z.namelist()[0]).decode()
            for row in csv.reader(io.StringIO(text)):
              if not row or not row[0].isdigit():continue
              bars.append(Bar(int(row[0]),int(row[6]),*map(float,row[1:5])));prices.extend(row[1:5])
            return bars,prices
          def load(sym):
            b=[];px=[]
            for y,m in months:
              fn=f'{sym}-5m-{y:04d}-{m:02d}.zip';u=f'https://data.binance.vision/data/futures/um/monthly/klines/{sym}/5m/{fn}'
              try:x,p=readzip(getzip(u));b.extend(x);px.extend(p[:2000] if len(px)<8000 else [])
              except Exception:pass
            for d in range(1,19):
              fn=f'{sym}-5m-2026-08-{d:02d}.zip';u=f'https://data.binance.vision/data/futures/um/daily/klines/{sym}/5m/{fn}'
              try:x,p=readzip(getzip(u));b.extend(x);px.extend(p[:1000] if len(px)<8000 else [])
              except Exception:pass
            ded={x.ot:x for x in b};bars=[ded[k] for k in sorted(ded) if STATE<=k<RUN_END];tick=infer(px) if px else None;return bars,tick
          def bt(sym,tick,bars):
            if len(bars)<1000 or not tick:return None,[]
            ind,_,_=calc(bars);eq=INIT;pending=active=None;tr=[]
            def close(i,reason,px):
              nonlocal active,eq
              p=active;both=bars[i].h>=max(p.s,p.t) and bars[i].l<=min(p.s,p.t) and reason in ('TP','SL')
              if both:reason='AMBIG->SL'
              cr=TP if reason=='TP' else (-1.0 if reason in ('SL','AMBIG->SL') else ((px-p.e)*(1 if p.d==1 else -1)*p.qty/p.risk));eq+=cr*p.risk
              if START<=p.sig_t<END:
                sp=abs(p.e-p.s)/p.e*100;tr.append({'symbol':sym,'tf':5,'signal_time':p.sig_t,'side':'LONG' if p.d==1 else 'SHORT','entry':p.e,'stop':p.s,'target':p.t,'exit_time':bars[i].ct,'exit_reason':reason,'R':cr,'stop_pct':sp,'required_x':1/sp if sp>0 else None})
              active=None;return True
            for i,x in enumerate(bars):
              closed=False
              if active is not None:
                r,px=nextb(active,x,None)
                if r:closed=close(i,r,px)
              if active is None and pending is not None and i==pending.sig_i+1 and not closed:
                fill=(pending.d==1 and round(x.h/tick)>=round(pending.e/tick)) or (pending.d==-1 and round(x.l/tick)<=round(pending.e/tick))
                if fill:
                  gap=(pending.d==1 and round(x.o/tick)>=round(pending.e/tick)) or (pending.d==-1 and round(x.o/tick)<=round(pending.e/tick));active=pending;pending=None;r,px=nextb(active,x,None if gap else active.e)
                  if r:closed=close(i,r,px)
              allowed,sexit=sf(x.ct+1,300000)
              if active is not None and not closed:
                z=ind[i];le=active.d==1 and x.c<z['ema'] and not z['ha'] and not z['ema_up'];se=active.d==-1 and x.c>z['ema'] and not z['hb'] and bool(z['ema_up'])
                if sexit:closed=close(i,'SESSION',x.c)
                elif le or se:closed=close(i,'EMA',x.c)
              if pending is not None and i>=pending.sig_i+1 and active is None:pending=None
              if active is None and pending is None and not closed:
                z=ind[i];lr=z['ha'] and x.c>z['ema'] and z['ag'] and z['chop_ok'] and z['res'] is not None;sr=z['hb'] and x.c<z['ema'] and z['ar'] and z['chop_ok'] and z['sup'] is not None
                nl=allowed and z['sra_ok'] and x.c>x.o and lr and x.c>z['res'] and x.l<=z['res'];sh=allowed and z['sra_ok'] and x.c<x.o and sr and x.c<z['sup'] and x.h>=z['sup']
                if nl or sh:
                  if nl:d=1;e=x.h+tick;s=x.l-tick;t=e+TP*(e-s)
                  else:d=-1;e=x.l-tick;s=x.h+tick;t=e-TP*(s-e)
                  q=math.floor((eq*RP/100)/abs(e-s));risk=abs(e-s)*q
                  if q>0 and risk>0:pending=Plan(d,e,s,t,risk,q,i,x.ct,x.h,x.l)
            rs=[a['R'] for a in tr];n=len(rs);gp=sum(max(r,0) for r in rs);gl=sum(max(-r,0) for r in rs);row={'symbol':sym,'tf':5,'bars':len(bars),'tick':tick,'n':n,'total_r':sum(rs),'avg_r':sum(rs)/n if n else None,'win_rate':100*sum(r>0 for r in rs)/n if n else None,'pf':gp/gl if gl else None}
            for bps in (4,6,8,10):row[f'net_r_{bps}bps']=sum(a['R']-(a['entry']/abs(a['entry']-a['stop']))*bps/10000 for a in tr)
            return row,tr
          sums=[];trs=[];errs=[]
          for j,sym in enumerate(symbols,1):
            try:
              bars,tick=load(sym);row,t=bt(sym,tick,bars)
              if row:sums.append(row);trs.extend(t)
              print(f'[{SHARD}] {j}/{len(symbols)} {sym} bars={len(bars)} tick={tick} trades={0 if row is None else row["n"]}',flush=True)
            except Exception as e:errs.append({'symbol':sym,'error':repr(e)});print('ERROR',sym,repr(e),flush=True)
          Path(f'/tmp/wr/summary-{SHARD}.json').write_text(json.dumps(sums));Path(f'/tmp/wr/errors-{SHARD}.json').write_text(json.dumps(errs,indent=2));Path(f'/tmp/wr/meta-{SHARD}.json').write_text(json.dumps({'shard':SHARD,'symbols':len(symbols),'completed':len(sums),'trades':len(trs),'errors':len(errs)},indent=2))
          with open(f'/tmp/wr/trades-{SHARD}.jsonl','w') as f:
            for a in trs:f.write(json.dumps(a)+'\n')
          PY
          python3 /tmp/full5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr2515-s3-shard-${{ matrix.shard }}
          path: /tmp/wr
          retention-days: 3

  merge:
    needs: baseline
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wr2515-s3-shard-*
          path: /tmp/all
          merge-multiple: true
      - name: Merge results
        run: |
          python3 - <<'PY'
          import csv,glob,json,os
          S=[];E=[]
          for p in glob.glob('/tmp/all/summary-*.json'):S+=json.load(open(p))
          for p in glob.glob('/tmp/all/errors-*.json'):E+=json.load(open(p))
          os.makedirs('/tmp/final',exist_ok=True);S.sort(key=lambda x:(-(x.get('net_r_6bps') if x.get('net_r_6bps') is not None else -1e99),x['symbol']))
          json.dump(S,open('/tmp/final/summary.json','w'),indent=2);json.dump(E,open('/tmp/final/errors.json','w'),indent=2)
          fields=['symbol','tf','bars','tick','n','total_r','avg_r','win_rate','pf','net_r_4bps','net_r_6bps','net_r_8bps','net_r_10bps']
          with open('/tmp/final/summary.csv','w',newline='') as f:w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows({k:r.get(k) for k in fields} for r in S)
          with open('/tmp/final/trades.jsonl','w') as dst:
            for p in glob.glob('/tmp/all/trades-*.jsonl'):
              with open(p) as src:dst.write(src.read())
          elig=[x for x in S if x['n']>=100];report={'symbols_completed':len(S),'errors':len(E),'cells_n_ge_100':len(elig),'gross_positive_n_ge_100':sum(x['avg_r']>0 for x in elig),'net6_positive_n_ge_100':sum(x['net_r_6bps']>0 for x in elig),'top20_net6':S[:20]};json.dump(report,open('/tmp/final/report.json','w'),indent=2);print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wr2515-5m-baseline-final
          path: /tmp/final
          retention-days: 7
