name: VBook Android E2E Benchmark
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated source indices"
        required: false
        default: "5,7,8,10,11,12,15,16,17,18"
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install host dependencies
        run: |
          python -m pip install requests
          npm install --no-save cheerio@1.0.0
          python tools/vbook-audit/download_vbook_apk.py vbook.apk
          sha256sum vbook.apk | tee vbook.apk.sha256
      - name: Enable KVM
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true
      - name: Run VBook on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VBOOK_IDS: ${{ inputs.ids }}
        with:
          api-level: 25
          target: default
          arch: x86_64
          profile: Nexus 5
          ram-size: 2048M
          heap-size: 384M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/vbook-audit/run_benchmark.sh
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vbook-android-benchmark-${{ github.run_id }}
          path: |
            out/
            vbook.apk.sha256
          if-no-files-found: warn
          retention-days: 3
