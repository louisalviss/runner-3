name: SPMO Leto sequence hypothesis

on:
  push:
    paths:
      - '.github/workflows/spmo-leto-sequence-hypothesis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test candidate swaps with Yahoo adjusted close
        run: |
          mkdir -p spmo-backtest/leto-source
          python - <<'PY'
          import json, urllib.request, datetime as dt
          from pathlib import Path
          def ts(d): return int(dt.datetime.strptime(d,'%Y-%m-%d').replace(tzinfo=dt.timezone.utc).timestamp())
          def adj(ticker, start, end):
              url=f'https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?period1={ts(start)-432000}&period2={ts(end)+432000}&interval=1d&events=div%2Csplits&includeAdjustedClose=true'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              data=json.load(urllib.request.urlopen(req,timeout=30))['chart']['result'][0]
              mp={dt.datetime.fromtimestamp(t,dt.timezone.utc).strftime('%Y-%m-%d'):v for t,v in zip(data['timestamp'],data['indicators']['adjclose'][0]['adjclose']) if v is not None}
              return mp[start],mp[end],mp[end]/mp[start]-1
          results={}
          for s,e,tickers in [('2021-03-19','2021-09-17',['AMZN','MSFT']),('2024-09-20','2025-03-21',['AMZN','AAPL'])]:
              results[s]={t:dict(zip(['start_adj','end_adj','return'],adj(t,s,e))) for t in tickers}
          base_multiple=17.756268183083446
          years=10.406784533563318
          factor=(1+results['2021-03-19']['MSFT']['return'])/(1+results['2021-03-19']['AMZN']['return'])
          factor*= (1+results['2024-09-20']['AAPL']['return'])/(1+results['2024-09-20']['AMZN']['return'])
          alt=base_multiple*factor
          cagr=alt**(1/years)-1
          out={'results':results,'base_multiple':base_multiple,'swap_factor':factor,'alt_multiple':alt,'alt_cagr':cagr,'leto_claim_multiple':21.7,'leto_claim_cagr':0.3456}
          print(json.dumps(out,indent=2))
          Path('spmo-backtest/leto-source/sequence_hypothesis.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          lines=['# Leto Top-1 sequence mismatch hypothesis','', 'Hypothesis from Leto count statement:', '- 2021-03: AMZN -> MSFT','- 2024-09: AMZN -> AAPL','',f"2021-03 AMZN return: {results['2021-03-19']['AMZN']['return']:.8%}",f"2021-03 MSFT return: {results['2021-03-19']['MSFT']['return']:.8%}",f"2024-09 AMZN return: {results['2024-09-20']['AMZN']['return']:.8%}",f"2024-09 AAPL return: {results['2024-09-20']['AAPL']['return']:.8%}",'',f'Base multiple: {base_multiple:.6f}x',f'Swap factor: {factor:.8f}',f'Alt multiple: {alt:.6f}x',f'Alt CAGR: {cagr:.8%}','Leto claim: 21.7x / 34.56%']
          Path('spmo-backtest/leto-source/sequence_hypothesis.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spmo-backtest/leto-source/sequence_hypothesis.*
          git commit -m 'Test Leto Top-1 sequence mismatch' || exit 0
          git push
