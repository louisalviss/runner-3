# PR observability probe
name: Wasmer access probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wasmer-access-probe.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wasmer-access-probe.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
    steps:
      - name: Check secret format without revealing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WASMER_TOKEN:-}" ]]; then
            echo "token_present=no"
            exit 2
          fi
          echo "token_present=yes"
          echo "token_length=${#WASMER_TOKEN}"
          if [[ "$WASMER_TOKEN" == wap_* ]]; then echo "token_prefix_wap=yes"; else echo "token_prefix_wap=no"; fi
          if [[ "$WASMER_TOKEN" =~ [[:space:]] ]]; then echo "token_has_whitespace=yes"; else echo "token_has_whitespace=no"; fi

      - name: Network diagnostics
        shell: bash
        run: |
          set +e
          echo "wasmer.io HTTP:"
          curl -4 -sS -o /dev/null -w '%{http_code} %{time_total}\n' --connect-timeout 8 --max-time 15 https://wasmer.io/
          echo "registry GraphQL HTTP:"
          curl -4 -sS -o /dev/null -w '%{http_code} %{time_total}\n' --connect-timeout 8 --max-time 15 https://registry.wasmer.io/graphql
          exit 0

      - name: Install Wasmer CLI
        shell: bash
        run: |
          set -euo pipefail
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"

      - name: Login non-interactively with Actions secret
        shell: bash
        run: |
          set -euo pipefail
          wasmer login --no-browser

      - name: Verify Wasmer account and list apps
        shell: bash
        run: |
          set -euo pipefail
          wasmer --version
          wasmer whoami
          wasmer app list
