name: Wasmer access probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wasmer-access-probe.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAW_WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
    steps:
      - name: Normalize Wasmer token
        shell: bash
        run: |
          set -euo pipefail
          token="${RAW_WASMER_TOKEN:-}"
          if [[ -z "$token" ]]; then
            echo "WASMER_TOKEN is missing or empty"
            exit 2
          fi
          token="$(printf '%s' "$token" | tr -d '\r\n')"
          if [[ "$token" != wap_* ]]; then
            token="wap_${token}"
          fi
          echo "WASMER_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Install Wasmer CLI
        shell: bash
        run: |
          set -euo pipefail
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"

      - name: Login non-interactively
        shell: bash
        run: |
          set -euo pipefail
          wasmer login --no-browser

      - name: Verify Wasmer account and list apps
        shell: bash
        run: |
          set -euo pipefail
          wasmer --version
          wasmer whoami
          wasmer app list
