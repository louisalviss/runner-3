# PR observability probe
name: Wasmer access probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wasmer-access-probe.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wasmer-access-probe.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAW_WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
    steps:
      - name: Normalize token format safely
        shell: bash
        run: |
          set -euo pipefail
          token="${RAW_WASMER_TOKEN:-}"
          if [[ -z "$token" ]]; then
            echo "token_present=no"
            exit 2
          fi
          token="$(printf '%s' "$token" | tr -d '\r\n')"
          if [[ "$token" != wap_* ]]; then
            token="wap_${token}"
          fi
          echo "WASMER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "token_present=yes"
          echo "normalized_length=${#token}"
          if [[ "$token" == wap_* ]]; then echo "normalized_prefix_wap=yes"; fi

      - name: Network diagnostics
        shell: bash
        run: |
          set +e
          echo "wasmer.io HTTP:"
          curl -4 -sS -o /dev/null -w '%{http_code} %{time_total}\n' --connect-timeout 8 --max-time 15 https://wasmer.io/
          echo "registry GraphQL HTTP:"
          curl -4 -sS -o /dev/null -w '%{http_code} %{time_total}\n' --connect-timeout 8 --max-time 15 https://registry.wasmer.io/graphql
          exit 0

      - name: Install Wasmer CLI
        shell: bash
        run: |
          set -euo pipefail
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"

      - name: Login non-interactively with normalized token
        shell: bash
        run: |
          set -euo pipefail
          wasmer login --no-browser

      - name: Verify Wasmer account and list apps
        shell: bash
        run: |
          set -euo pipefail
          wasmer --version
          wasmer whoami
          wasmer app list
