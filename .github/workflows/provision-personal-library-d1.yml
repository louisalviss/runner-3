name: Provision Personal Library D1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-personal-library-d1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate credentials and schema
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$RUNNER3_CORE_TOKEN"
          test -s cloudflare/runner3-core/migrations-personal-library/0001_library_file_index_v1.sql

      - name: Find or create personal-library D1
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}`;
          async function cf(path, options={}) {
            const response = await fetch(base + path, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(options.headers || {}) },
            });
            const body = await response.json();
            if (!response.ok || body.success !== true) throw new Error(`cloudflare_${response.status}:${JSON.stringify(body.errors || body)}`);
            return body.result;
          }
          (async () => {
            const name = 'personal-library';
            const list = await cf(`/d1/database?name=${encodeURIComponent(name)}&per_page=10`);
            let db = Array.isArray(list) ? list.find(x => x.name === name) : null;
            if (!db) db = await cf('/d1/database', { method: 'POST', body: JSON.stringify({ name }) });
            const id = db.uuid || db.id;
            if (!id) throw new Error('personal_library_db_id_missing');
            fs.appendFileSync(process.env.GITHUB_ENV, `PERSONAL_LIBRARY_DB_ID=${id}\n`);
            console.log('PERSONAL_LIBRARY_D1_READY');
          })().catch(err => { console.error(String(err.message || err)); process.exit(1); });
          NODE

      - name: Apply Personal Library schema through D1 API
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const db = process.env.PERSONAL_LIBRARY_DB_ID;
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}`;
          async function query(sql) {
            const response = await fetch(base + '/query', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ sql }),
            });
            const body = await response.json();
            if (!response.ok || body.success !== true) throw new Error(`d1_query_${response.status}:${JSON.stringify(body.errors || body)}`);
            return body.result;
          }
          (async () => {
            const sql = fs.readFileSync('cloudflare/runner3-core/migrations-personal-library/0001_library_file_index_v1.sql','utf8');
            const statements = sql.split(';').map(x => x.trim()).filter(Boolean);
            for (const statement of statements) await query(statement);
            await query("SELECT COUNT(*) AS n FROM library_file_index_v1");
            console.log(`PERSONAL_LIBRARY_SCHEMA_OK statements=${statements.length}`);
          })().catch(err => { console.error(String(err.message || err)); process.exit(1); });
          NODE

      - name: Bind LIBRARY_DB in Runner3 Core
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p='cloudflare/runner3-core/wrangler.jsonc';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          d.d1_databases ||= [];
          const binding={binding:'LIBRARY_DB',database_name:'personal-library',database_id:process.env.PERSONAL_LIBRARY_DB_ID,migrations_dir:'migrations-personal-library'};
          const i=d.d1_databases.findIndex(x=>x.binding==='LIBRARY_DB');
          if(i>=0) d.d1_databases[i]=binding; else d.d1_databases.push(binding);
          fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          const verify=JSON.parse(fs.readFileSync(p,'utf8')).d1_databases.find(x=>x.binding==='LIBRARY_DB');
          if(!verify || verify.database_name!=='personal-library' || !verify.database_id) process.exit(2);
          NODE

      - name: Persist binding to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cloudflare/runner3-core/wrangler.jsonc; then
            echo "LIBRARY_DB_BINDING_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/runner3-core/wrangler.jsonc
          git commit -m 'Bind dedicated personal-library D1'
          git push origin HEAD:main

      - name: Verify D1 data and live Worker authority
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const cfToken=process.env.CLOUDFLARE_API_TOKEN;
          const db=process.env.PERSONAL_LIBRARY_DB_ID;
          const coreToken=process.env.RUNNER3_CORE_TOKEN;
          async function d1(sql){
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`,{
              method:'POST',headers:{Authorization:`Bearer ${cfToken}`,'Content-Type':'application/json'},body:JSON.stringify({sql})
            });
            const b=await r.json();
            if(!r.ok||b.success!==true) throw new Error(`d1_verify_${r.status}`);
            const result=Array.isArray(b.result)?b.result[0]:b.result;
            return result?.results||[];
          }
          (async()=>{
            const countRows=await d1('SELECT COUNT(*) AS n FROM library_file_index_v1');
            const categoryRows=await d1('SELECT category,COUNT(*) AS n FROM library_file_index_v1 GROUP BY category ORDER BY category');
            const count=Number(countRows[0]?.n||0);
            const cats=Object.fromEntries(categoryRows.map(x=>[x.category,Number(x.n||0)]));
            if(count!==1655||cats.ebook!==1618||cats.comic!==37) throw new Error(`personal_library_parity_failed count=${count} cats=${JSON.stringify(cats)}`);
            const r=await fetch('https://runner3-core.ducduy2411.workers.dev/library-index/meta',{
              headers:{Authorization:`Bearer ${coreToken}`,'User-Agent':'personal-library-cutover-verify/1.0'}
            });
            const meta=await r.json();
            if(!r.ok||meta.ok!==true||meta.authority!=='personal-library'||Number(meta.count)!==1655) throw new Error(`core_authority_failed status=${r.status} authority=${meta.authority} count=${meta.count}`);
            console.log(JSON.stringify({ok:true,database:'personal-library',count,categories:cats,worker_authority:meta.authority}));
          })().catch(err=>{console.error(String(err.message||err));process.exit(1)});
          NODE
