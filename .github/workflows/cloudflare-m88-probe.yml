name: Cloudflare M88 Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-m88-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN=MISSING'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID=MISSING'; exit 2; }
          echo 'CLOUDFLARE_API_TOKEN=PRESENT'
          echo 'CLOUDFLARE_ACCOUNT_ID=PRESENT'

      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://api.cloudflare.com/client/v4/user/tokens/verify' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/token.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/token.json'))
          status=(d.get('result') or {}).get('status')
          print('TOKEN_STATUS=' + str(status))
          if not d.get('success') or status != 'active':
              raise SystemExit(3)
          PY

      - name: Probe Jina reader through Cloudflare Browser Run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess
          from html import unescape

          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/browser-rendering/content'
          targets=[
              ('jina_https','https://r.jina.ai/https://www.footballant.com/matches/2814994/odds'),
              ('jina_http','https://r.jina.ai/http://www.footballant.com/matches/2814994/odds'),
              ('jina_https_2','https://r.jina.ai/https://www.footballant.com/matches/2910222/odds'),
          ]

          for label,url in targets:
              body=json.dumps({'url':url,'gotoOptions':{'waitUntil':'networkidle2','timeout':30000}})
              out=f'/tmp/{label}.out'
              p=subprocess.run([
                  'curl','-sS','-X','POST',endpoint,
                  '-H','Content-Type: application/json',
                  '-H',f'Authorization: Bearer {token}',
                  '--data',body,'-o',out,'-w','%{http_code}'
              ],capture_output=True,text=True,check=True)
              raw=open(out,'rb').read()
              text=raw.decode('utf-8','replace')
              html=text
              api_success=False
              try:
                  d=json.loads(text)
                  api_success=bool(d.get('success'))
                  r=d.get('result')
                  if isinstance(r,str): html=r
                  elif isinstance(r,dict): html=str(r.get('content') or r.get('html') or r)
              except Exception:
                  pass
              visible=re.sub(r'<script\b[^>]*>.*?</script>',' ',html,flags=re.I|re.S)
              visible=re.sub(r'<style\b[^>]*>.*?</style>',' ',visible,flags=re.I|re.S)
              visible=re.sub(r'<[^>]+>',' ',visible)
              visible=unescape(re.sub(r'\s+',' ',visible)).strip()
              low=visible.lower()
              print(f'[{label}] HTTP={p.stdout.strip()} API_SUCCESS={str(api_success).lower()} CHARS={len(visible)}')
              print(f'[{label}] ACCESS_DENIED={str("access denied" in low or "access is denied" in low).lower()} CHALLENGE={str("just a moment" in low or "verify you are human" in low).lower()} M88={str("m88" in low).lower()}')
              nums=re.findall(r'(?<!\d)(?:[1-9]\d?\.\d{2})(?!\d)',visible)
              print(f'[{label}] ODDS_LIKE_COUNT={len(nums)} SAMPLE={",".join(nums[:16])}')
              idx=low.find('m88')
              if idx >= 0:
                  ctx=visible[max(0,idx-180):idx+520]
                  print(f'[{label}] M88_CONTEXT=' + ctx.replace('\n',' ')[:700])
          PY
