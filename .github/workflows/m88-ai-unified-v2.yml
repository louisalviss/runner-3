name: M88 Unified AI Database v2

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-ai-unified-v2.yml'
      - 'build_m88_ai_database.py'

permissions:
  contents: write

concurrency:
  group: m88-ai-unified-v2
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact M88 Match Odds and full Outrights
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input out
          stamp=$(date +%s)
          curl -LfsS --retry 3 --max-time 30 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/m88-live-data/data.json?v=${stamp}" -o input/match-odds.json
          gh release download m88-outrights-all --repo "$GITHUB_REPOSITORY" --pattern 'm88-outrights-all.json' --dir input --clobber
          test -s input/match-odds.json
          test -s input/m88-outrights-all.json

      - name: Build unified AI database
        run: |
          set -euo pipefail
          python3 build_m88_ai_database.py \
            --matches input/match-odds.json \
            --outrights input/m88-outrights-all.json \
            --output out/ai-odds.json \
            --health out/health.json
          test -s out/ai-odds.json

      - name: Publish dedicated stable data branch
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER=$(git config --local --get http.https://github.com/.extraheader || true)
          rm -rf /tmp/m88-ai-pub
          git init -q /tmp/m88-ai-pub
          git -C /tmp/m88-ai-pub config user.name 'github-actions[bot]'
          git -C /tmp/m88-ai-pub config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/m88-ai-pub remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          [ -z "$AUTH_HEADER" ] || git -C /tmp/m88-ai-pub config http.https://github.com/.extraheader "$AUTH_HEADER"
          git -C /tmp/m88-ai-pub checkout --orphan m88-ai-data >/dev/null 2>&1
          cp out/ai-odds.json out/health.json /tmp/m88-ai-pub/
          printf '%s\n' '# M88 AI Odds Database' 'Auto-generated. ai-odds.json is the canonical one-file database.' > /tmp/m88-ai-pub/README.md
          git -C /tmp/m88-ai-pub add .
          git -C /tmp/m88-ai-pub commit -q -m "M88 AI database $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git -C /tmp/m88-ai-pub push -q --force origin HEAD:m88-ai-data

      - name: Publish stable release endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view m88-ai-current --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create m88-ai-current --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'M88 AI Current Database' --notes 'One-file current M88 odds database for AI consumption.'
          fi
          gh release upload m88-ai-current --repo "$GITHUB_REPOSITORY" out/ai-odds.json out/health.json --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-ai-unified-v2-${{ github.run_id }}
          path: out/
          retention-days: 2
