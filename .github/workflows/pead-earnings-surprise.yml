name: PEAD Earnings Surprise

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'research/ema200w_20260823/pead_earnings_surprise.py'
      - '.github/workflows/pead-earnings-surprise.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pandas numpy requests pyarrow
      - name: Normalize public parquet schema
        working-directory: research/ema200w_20260823
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pead_earnings_surprise.py')
          s = p.read_text()
          s = s.replace(", 'market_cap'", "")
          p.write_text(s)
          PY
      - name: Run PEAD earnings-surprise decomposition
        working-directory: research/ema200w_20260823
        run: python pead_earnings_surprise.py
