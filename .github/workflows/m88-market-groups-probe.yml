name: M88 Market Groups Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/m88-market-groups-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
      - name: Connect Asia relay
        run: |
          set -euo pipefail
          mkdir -p /tmp/rs evidence
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          pref=['TH','SG','MY','PH','ID','JP','KR','TW','VN']
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n');out=[]
          for c in pref:
            rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and r.get('OpenVPN_ConfigData_Base64')]
            rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
            for r in rs[:3]:
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              p=pathlib.Path(f'/tmp/rs/{len(out):02d}-{c}.ovpn');p.write_text(cfg);out.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/rs.tsv').write_text('\n'.join(out)+'\n')
          PY
          IFACE=$(ip route show default | awk '{print $5;exit}')
          sudo ip netns add vpnns; sudo ip link add vh type veth peer name vn; sudo ip link set vn netns vpnns
          sudo ip addr add 10.238.0.1/24 dev vh; sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.238.0.2/24 dev vn; sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set vn up; sudo ip netns exec vpnns ip route add default via 10.238.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null; sudo iptables -t nat -A POSTROUTING -s 10.238.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo mkdir -p /etc/netns/vpnns; printf 'nameserver 1.1.1.1\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          found=0
          while IFS=$'\t' read -r cfg c ip; do
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true; sleep 1; sudo rm -f /tmp/o.log /tmp/p.json;sudo touch /tmp/o.log;sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log || true
            for i in {1..12};do sleep 1;grep -q 'Initialization Sequence Completed' /tmp/o.log&&break||true;done
            if sudo ip netns exec vpnns curl -fsS --max-time 15 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/p.json;then
              if python3 - <<'PY'
          import json
          try:d=json.load(open('/tmp/p.json'));raise SystemExit(0 if d.get('status')==1 else 1)
          except:raise SystemExit(1)
          PY
              then echo "SELECTED=$c/$ip";found=1;break;fi
            fi
          done </tmp/rs.tsv
          test "$found" = 1
      - name: Probe Special 21 22 23
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          base={'sport_id':'10','lang_id':'en','view_type':'0','leagues':'999','odds_type':'3','odds_group':'3','view_date':'0','time_filter':'0','category':'0','branch_code':'','currency':'VND','is_full':'true','prev_params':'','version':'','top_x':0,'is_stream':'false','is_live_center':'false','currentMenu':'spesificSport','prevMenu':'','method':'LoadOddsData'}
          for slot in '123':
            p=dict(base);p['currentTimeSlot']=slot;p['display_type']='2'+slot
            if slot=='3':p['view_date']='1'
            pathlib.Path('/tmp/s'+slot+'.req').write_text(json.dumps(p,separators=(',',':')))
          PY
          for slot in 1 2 3;do sudo ip netns exec vpnns curl -fsS --max-time 40 -X POST 'https://msports.m88.com/api/v1/m88/data/main' -H 'Content-Type: application/json' -H 'Authorization: Bearer GUEST' --data-binary @/tmp/s${slot}.req -o evidence/s${slot}.json||true;done
          python3 - <<'PY'
          import json,pathlib,collections
          meta={'row_num','no_event','event_name','no_partai','match_date','club_home','club_away','home_score','away_score','live_timer','is_live','is_neutral','ev_round','event_round'}
          for slot in '123':
            p=pathlib.Path('evidence/s'+slot+'.json')
            if not p.exists():print('SLOT',slot,'MISSING');continue
            d=json.loads(p.read_text());rows=[]
            for b in d.get('data') or []:
              if isinstance(b,dict):rows += [r for r in b.get('data') or [] if isinstance(r,dict)]
            keys=collections.Counter()
            for r in rows:
              for k,v in r.items():
                if k not in meta and str(v or '').strip() not in ('','|'):keys[k]+=1
            print('SLOT',slot,'status',d.get('status'),'rows',len(rows),'bytes',p.stat().st_size)
            print('NONEMPTY_KEYS',keys.most_common(80))
            for r in rows[:3]:
              print('MATCH',r.get('club_home'),'vs',r.get('club_away'))
              print({k:v for k,v in r.items() if k not in meta and str(v or '').strip() not in ('','|')})
          PY
