name: M88 Market Groups Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-market-groups-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install VPN tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
      - name: Build Asia relay pool
        run: |
          set -euo pipefail
          mkdir -p /tmp/m88-relays evidence
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          pref=['TH','SG','MY','PH','ID','JP','KR','TW','VN']
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          picked=[]
          for c in pref:
              rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
              rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
              picked.extend((c,r) for r in rs[:3])
          if not picked: raise SystemExit('no Asia relay')
          meta=[]
          for i,(c,r) in enumerate(picked):
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              p=pathlib.Path(f'/tmp/m88-relays/{i:02d}-{c}.ovpn'); p.write_text(cfg)
              meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/m88-relays.tsv').write_text('\n'.join(meta)+'\n')
          print('RELAYS',len(meta))
          PY
      - name: Connect accepted relay
        run: |
          set -euo pipefail
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.237.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.237.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.237.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.237.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          okall=0
          while IFS=$'\t' read -r cfg country relay; do
            echo "TRY $country $relay"
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/openvpn.log /tmp/probe.json
            sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            ok=0
            for i in {1..12}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null && { ok=1; break; }
              grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|Connection refused|fatal error' /tmp/openvpn.log 2>/dev/null && break || true
            done
            [ "$ok" = 1 ] || continue
            if sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 15 \
              'https://msports.m88.com/api/v1/sport/top?currency=VND' \
              -H 'Authorization: Bearer GUEST' -o /tmp/probe.json; then
              if python3 - <<'PY'
          import json
          d=json.load(open('/tmp/probe.json'))
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then
                sudo ip netns exec vpnns curl -fsS --max-time 10 'https://www.cloudflare.com/cdn-cgi/trace' | grep -E '^(ip|loc|warp)=' | tee evidence/egress.txt
                echo "SELECTED $country $relay"
                okall=1
                break
              fi
            fi
          done < /tmp/m88-relays.tsv
          test "$okall" = 1
      - name: Probe display types
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          common={'sport_id':'10','lang_id':'en','view_type':'0','leagues':'999','odds_type':'3','odds_group':'3','view_date':'0','time_filter':'0','category':'0','branch_code':'','currency':'VND','is_full':'true','prev_params':'','version':'','top_x':0,'is_stream':'false','is_live_center':'false','currentMenu':'spesificSport','prevMenu':'','method':'LoadOddsData','currentTimeSlot':'1'}
          for group in [1,2,3,4,5,6,7,8]:
              p=dict(common); p['display_type']=f'{group}1'
              pathlib.Path(f'/tmp/g{group}.json').write_text(json.dumps(p,separators=(',',':')))
          PY
          for group in 1 2 3 4 5 6 7 8; do
            echo "FETCH_GROUP=$group"
            sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 40 --retry 1 --retry-all-errors \
              -X POST 'https://msports.m88.com/api/v1/m88/data/main' \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Content-Type: application/json' \
              -H 'Authorization: Bearer GUEST' \
              --data-binary @"/tmp/g${group}.json" -o "evidence/g${group}.json" || true
          done
          python3 - <<'PY'
          import json,pathlib,re,collections
          for group in range(1,9):
              p=pathlib.Path(f'evidence/g{group}.json')
              if not p.exists():
                  print(f'GROUP {group}: MISSING'); continue
              try: d=json.loads(p.read_text())
              except Exception as e: print(f'GROUP {group}: BAD_JSON {e}'); continue
              rows=[]
              for b in d.get('data') or []:
                  if isinstance(b,dict): rows += [r for r in (b.get('data') or []) if isinstance(r,dict)]
              suff={}
              for s in 'abcdefghijklmno':
                  non=0; odds=0
                  for r in rows:
                      if str(r.get('game_type_'+s) or '').strip(): non+=1
                      odds += sum(1 for k,v in r.items() if k.startswith('odds_') and k.endswith('_'+s) and str(v or '').strip())
                  if non or odds: suff[s]=(non,odds)
              print(f'GROUP {group}: status={d.get("status")} bytes={p.stat().st_size} rows={len(rows)} nonempty={suff}')
              for s in 'ijklmno':
                  for r in rows:
                      vals=[(k,v) for k,v in r.items() if k.startswith('odds_') and k.endswith('_'+s) and str(v or '').strip()]
                      if vals:
                          print(f'  SAMPLE {s}: {r.get("club_home")} vs {r.get("club_away")} gt={r.get("game_type_"+s)} sub={r.get("sub_partai_"+s)} odds={vals[:8]}')
                          break
          PY
