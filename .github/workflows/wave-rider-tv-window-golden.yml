name: Wave Rider TradingView Window Golden

on:
  push:
    branches: [main]
    paths:
      - 'wave-rider-verify/reference_verify.py'
      - 'wave-rider-verify/reference_verify_parity.py'
      - 'wave-rider-verify/verify_tv_window_report_golden.py'
      - 'wave-rider-verify/golden/tv_5m_window_report_2026-07-27T17_2026-08-15T17.json'
      - '.github/workflows/wave-rider-tv-window-golden.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify TradingView canonical dashboard parity
        shell: bash
        run: |
          set -euo pipefail
          python3 wave-rider-verify/verify_tv_window_report_golden.py
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-tv-window-golden-${{ github.run_id }}
          path: /tmp/wr-tv-window-golden-result.json
          if-no-files-found: warn
          retention-days: 7
