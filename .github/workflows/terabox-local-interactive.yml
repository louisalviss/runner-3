name: TeraBox Local Interactive Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terabox-local-interactive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright client
        run: |
          python -m pip install 'playwright>=1.58,<2'
          which google-chrome || which chromium || true
      - name: Inventory TeraBox share recursively
        shell: bash
        run: |
          cat > /tmp/terabox_inventory.py <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlparse, parse_qsl, urlencode, urlunparse
          from collections import deque, defaultdict
          import json, re, shutil, time

          target='https://www.1024tera.com/vietnamese/sharing/link?surl=ZEQeI5EJydtP4xp4Bx4Lww'
          root_path='/Truyen'
          first_list_url={'value':None}

          def human(n):
              units=['B','KiB','MiB','GiB','TiB']
              x=float(n)
              for u in units:
                  if x < 1024 or u == units[-1]:
                      return f'{x:.2f} {u}'
                  x/=1024

          with sync_playwright() as p:
              chrome=(shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser'))
              if not chrome:
                  raise SystemExit('NO_SYSTEM_CHROME')
              browser=p.chromium.launch(headless=True, executable_path=chrome)
              context=browser.new_context(user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36')
              page=context.new_page()

              def on_response(r):
                  if first_list_url['value'] is None and '/share/list?' in r.url and r.status == 200:
                      first_list_url['value']=r.url

              page.on('response', on_response)
              resp=page.goto(target,wait_until='domcontentloaded',timeout=90000)
              page.wait_for_timeout(10000)
              print('HTTP='+str(resp.status if resp else None))
              print('TITLE='+page.title())
              if not first_list_url['value']:
                  raise SystemExit('NO_SHARE_LIST_URL')

              parsed=urlparse(first_list_url['value'])
              base_q=dict(parse_qsl(parsed.query,keep_blank_values=True))
              base_q.pop('root',None)
              base_q['num']='100'
              base_q['by']='time'
              base_q['order']='desc'

              def make_url(path,pageno):
                  q=dict(base_q)
                  q['dir']=path
                  q['page']=str(pageno)
                  return urlunparse((parsed.scheme,parsed.netloc,parsed.path,parsed.params,urlencode(q),parsed.fragment))

              def fetch_dir(path):
                  items=[]
                  for pageno in range(1,1001):
                      u=make_url(path,pageno)
                      raw=page.evaluate("""async (u) => {
                        const r=await fetch(u,{credentials:'include'});
                        return await r.text();
                      }""",u)
                      try:
                          data=json.loads(raw)
                      except Exception:
                          print('BAD_JSON_DIR='+path)
                          break
                      if data.get('errno') != 0:
                          print('API_ERR_DIR='+path+' errno='+str(data.get('errno')))
                          break
                      batch=data.get('list') or []
                      if not batch:
                          break
                      items.extend(batch)
                      if len(batch) < 100:
                          # Most folders finish in one page; verify next page only when full.
                          break
                      time.sleep(0.03)
                  return items

              q=deque([root_path])
              seen_dirs=set()
              seen_files=set()
              total_files=0
              total_bytes=0
              branch=defaultdict(lambda:{'files':0,'dirs':0,'bytes':0})
              ext=defaultdict(int)
              failures=0

              while q:
                  d=q.popleft()
                  if d in seen_dirs:
                      continue
                  seen_dirs.add(d)
                  try:
                      items=fetch_dir(d)
                  except Exception as e:
                      failures+=1
                      print('FETCH_FAIL='+d+' '+type(e).__name__)
                      continue
                  for it in items:
                      path=str(it.get('path') or '')
                      rel=path[len(root_path):].lstrip('/') if path.startswith(root_path) else path.lstrip('/')
                      top=rel.split('/',1)[0] if rel else '(root)'
                      isdir=str(it.get('isdir','0'))=='1' or it.get('isdir')==1
                      if isdir:
                          if path and path not in seen_dirs:
                              q.append(path)
                          branch[top]['dirs']+=1
                      else:
                          fid=str(it.get('fs_id') or path)
                          if fid in seen_files:
                              continue
                          seen_files.add(fid)
                          size=int(it.get('size') or 0)
                          total_files+=1
                          total_bytes+=size
                          branch[top]['files']+=1
                          branch[top]['bytes']+=size
                          name=str(it.get('server_filename') or '')
                          m=re.search(r'(\.[A-Za-z0-9]{1,10})$',name)
                          ext[(m.group(1).lower() if m else '(noext)')]+=1
                  if len(seen_dirs) % 100 == 0:
                      print(f'PROGRESS_DIRS={len(seen_dirs)} FILES={total_files} BYTES={total_bytes}')
                  if len(seen_dirs) > 20000:
                      print('DIR_LIMIT_REACHED=true')
                      break

              print('RESULT_DIRS='+str(len(seen_dirs)))
              print('RESULT_FILES='+str(total_files))
              print('RESULT_BYTES='+str(total_bytes))
              print('RESULT_SIZE='+human(total_bytes))
              print('RESULT_FAILURES='+str(failures))
              for k,v in sorted(branch.items()):
                  print('BRANCH='+json.dumps({'name':k,**v,'size':human(v['bytes'])},ensure_ascii=False))
              top_ext=sorted(ext.items(),key=lambda x:x[1],reverse=True)[:20]
              print('EXTENSIONS='+json.dumps(top_ext,ensure_ascii=False))
              browser.close()
          PY
          python /tmp/terabox_inventory.py
