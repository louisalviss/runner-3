name: TeraBox Local Interactive Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terabox-local-interactive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install 'playwright>=1.58,<2'
          python -m playwright install --with-deps chromium
      - name: Inspect TeraBox interactively
        shell: bash
        run: |
          cat > /tmp/terabox_probe.py <<'PY'
          from playwright.sync_api import sync_playwright
          import re

          target='https://www.1024tera.com/vietnamese/sharing/link?surl=ZEQeI5EJydtP4xp4Bx4Lww'
          seen=[]

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36')
              page=context.new_page()

              def on_response(r):
                  try:
                      if r.request.resource_type not in ('xhr','fetch'):
                          return
                      u=r.url
                      if '/share/list?' not in u:
                          return
                      seen.append(u)
                      print('SHARE_LIST_URL='+u)
                      print('SHARE_LIST_STATUS='+str(r.status))
                      try:
                          t=r.text()
                          print('SHARE_LIST_BODY='+re.sub(r'\s+',' ',t[:100000]))
                      except Exception as e:
                          print('SHARE_LIST_BODY_ERROR='+type(e).__name__)
                  except Exception as e:
                      print('HANDLER_ERROR='+type(e).__name__)

              page.on('response', on_response)
              resp=page.goto(target,wait_until='domcontentloaded',timeout=90000)
              page.wait_for_timeout(10000)
              print('HTTP='+str(resp.status if resp else None))
              print('TITLE='+page.title())

              rows=page.locator('.file-item-listmode')
              print('ROOT_ROW_COUNT='+str(rows.count()))
              for i in range(min(rows.count(),20)):
                  print(f'ROOT_ROW_{i}='+re.sub(r'\s+',' ',rows.nth(i).inner_text()).strip())

              # Desktop share UI uses a double click to enter a directory.
              candidates=[
                  page.locator('.file-item-listmode .file-name').first,
                  page.locator('.file-item-listmode [class*="name"]').first,
                  page.get_by_text('Truyen', exact=True).last,
                  page.locator('.file-item-listmode').first,
              ]
              opened=False
              for idx,loc in enumerate(candidates):
                  try:
                      if loc.count():
                          print(f'DBLCLICK_CANDIDATE_{idx}=1')
                          loc.dblclick(timeout=12000)
                          page.wait_for_timeout(7000)
                          if len(seen)>=2 or page.locator('.file-item-listmode').count()!=1:
                              opened=True
                              print(f'DBLCLICK_USED={idx}')
                              break
                  except Exception as e:
                      print(f'DBLCLICK_ERR_{idx}='+type(e).__name__)

              print('OPENED='+str(opened).lower())
              print('URL1='+page.url)
              rows2=page.locator('.file-item-listmode')
              print('INNER_ROW_COUNT='+str(rows2.count()))
              for i in range(min(rows2.count(),300)):
                  print(f'INNER_ROW_{i}='+re.sub(r'\s+',' ',rows2.nth(i).inner_text()).strip())
              body=re.sub(r'\s+',' ',page.locator('body').inner_text()).strip()
              print('BODY_AFTER='+body[:30000])
              print('SHARE_LIST_COUNT='+str(len(seen)))
              page.wait_for_timeout(2000)
              browser.close()
          PY
          python /tmp/terabox_probe.py
