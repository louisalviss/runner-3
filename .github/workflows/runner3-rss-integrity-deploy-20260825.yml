name: Runner3 RSS Integrity Deploy 2026-08-25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-rss-integrity-deploy-20260825.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-rss-integrity-deploy-20260825
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      BASE_URL: https://runner3-core.ducduy2411.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migrations and deploy Core
        working-directory: cloudflare/runner3-core
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$RUNNER3_CORE_TOKEN"
          for migration in migrations/*.sql; do
            npx --yes wrangler@4 d1 execute runner3-core --remote --file="$migration" >/dev/null
          done
          npx --yes wrangler@4 deploy
      - name: Prove restricted sources cannot masquerade as full articles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os,time,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          base=os.environ['BASE_URL'].rstrip('/')
          token=os.environ['RUNNER3_CORE_TOKEN'].strip()
          headers={'Accept':'application/json','Authorization':'Bearer '+token,'Cache-Control':'no-cache','User-Agent':'runner3-rss-integrity-proof/1.0'}
          def call(path,method='GET'):
              req=urllib.request.Request(base+path,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=40) as r:
                      raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw) if raw else {}
                  except Exception: body={}
                  return e.code,body
          for _ in range(8):
              try:
                  req=urllib.request.Request(base+'/health',headers={'User-Agent':'runner3-rss-integrity-proof/1.0'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      if r.status==200: break
              except Exception: time.sleep(2)
          ids=['projectsyndicate-url-26a9686e21ebe4fa865d','projectsyndicate-url-db223b141f372578df3c']
          checks={}
          for article_id in ids:
              q=urllib.parse.quote(article_id,safe='')
              fhttp,fbody=call('/api/rss/articles/'+q+'/fetch','POST')
              dhttp,dbody=call('/api/rss/articles/'+q)
              a=dbody.get('article',{}) if isinstance(dbody,dict) else {}
              checks[article_id]={
                  'fetchHttp':fhttp,
                  'fetchError':fbody.get('error') if isinstance(fbody,dict) else None,
                  'detailHttp':dhttp,
                  'fetchStatus':a.get('fetch_status'),
                  'translationStatus':a.get('translation_status'),
                  'sourceChecksum':a.get('source_checksum'),
                  'qaState':a.get('qa_state'),
                  'lastError':a.get('last_error'),
              }
              if fhttp!=409 or checks[article_id]['fetchStatus']!='blocked' or checks[article_id]['sourceChecksum'] is not None:
                  raise SystemExit('restricted_source_integrity_failed:'+article_id+':'+json.dumps(checks[article_id]))
          proof={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'runId':os.environ.get('GITHUB_RUN_ID'),'baseUrl':base,'ok':True,'checks':checks}
          Path('/tmp/rss-integrity-proof.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'ok':True,'articles':len(checks)}))
          PY
      - name: Persist integrity proof
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/rss-integrity-proof.json ops/rss-library/integrity-proof-20260825.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/rss-library/integrity-proof-20260825.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist RSS restricted-source integrity proof [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main
