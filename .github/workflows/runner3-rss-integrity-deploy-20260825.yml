name: Runner3 RSS Integrity Deploy 2026-08-25 (Legacy, No Deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

# Historical one-off RSS integrity rollout. It previously deployed the shared
# runner3-core Worker and therefore violated single production ownership.
# Keep only an archive marker; current Core changes are promoted by the
# canonical runner3-core production workflow.
jobs:
  legacy-no-deploy:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'LEGACY_RSS_INTEGRITY_CORE_DEPLOY_DISABLED=PASS'
          echo 'Production deploy owner: runner3-core-public-hosted-reader-deploy.yml'
