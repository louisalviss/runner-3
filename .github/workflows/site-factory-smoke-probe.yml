name: Probe Site Factory Smoke 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-factory-smoke-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare smoke app state
        shell: bash
        run: |
          set -euo pipefail
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-result.json
          python - <<'PY'
          import json
          p='/tmp/wasmer-result.json'
          s=json.load(open(p))
          s['appName']='runner3-factory-smoke-2'
          s['siteUrl']='https://runner3-factory-smoke-2.wasmer.app/'
          open(p,'w').write(json.dumps(s))
          PY
      - run: npm install --no-save playwright-core@1.58.2
      - name: Inspect app
        run: node scripts/wasmer-app-inspect.mjs
      - name: Persist safe probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/wasmer-inspect-status.json || echo '{"status":"probe_missing"}' > /tmp/wasmer-inspect-status.json
          cat /tmp/wasmer-inspect-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p ops/site-factory
          cp /tmp/wasmer-inspect-status.json ops/site-factory/smoke-site-2-probe.json
          git add ops/site-factory/smoke-site-2-probe.json
          git diff --cached --quiet || (git commit -m 'Persist smoke site 2 probe' && git push origin HEAD:main)
