name: WR Strict 10m Audit PR
on:
  pull_request:
    branches: [main]
    paths:
      - 'wave-rider-verify/wr2515_strict_10m.py'
      - 'wave-rider-verify/wr2515_strict_10m_merge.py'
      - '.github/workflows/wr-strict-10m-audit-pr.yml'
permissions:
  contents: read
  actions: read
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Download old 10m baseline
        uses: actions/download-artifact@v4
        with:
          name: wr2515-phase1-10m-final
          path: /tmp/old10
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32237685245
      - name: Download canonical 5m TradingView tick map
        uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base5
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - name: Pin canonical verifier
        run: curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
      - name: Rebuild strict 10m shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
          TV_DIR: /tmp/base5
          UNIVERSE_FILE: /tmp/old10/universe.json
          OUT_DIR: /tmp/out
        run: python3 wave-rider-verify/wr2515_strict_10m.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-strict-10m-shard-${{ matrix.shard }}
          path: /tmp/out
          retention-days: 14

  merge:
    needs: shard
    if: always() && needs.shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wr-strict-10m-shard-*
          path: /tmp/all
          merge-multiple: true
      - name: Download old 10m baseline
        uses: actions/download-artifact@v4
        with:
          name: wr2515-phase1-10m-final
          path: /tmp/old10
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32237685245
      - name: Merge and compare strict ledger
        env:
          IN_DIR: /tmp/all
          OLD_DIR: /tmp/old10
          OUT_DIR: /tmp/final
        run: python3 wave-rider-verify/wr2515_strict_10m_merge.py
      - name: Recompute Candidate3 x session x T on strict ledger
        env:
          TF_MIN: 10
          BASE_DIR: /tmp/final
          UNIVERSE_FILE: /tmp/final/universe.json
          OUT_DIR: /tmp/matrix
        run: python3 wave-rider-verify/wr_tf_session_t_matrix.py
      - name: Download old matrix headline
        uses: actions/download-artifact@v4
        with:
          name: wr-tf-session-t-matrix-final
          path: /tmp/oldmatrix
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32309276349
      - name: Compare C3 Zone C T-ON headline
        run: |
          python3 - <<'PY'
          import json, pathlib
          final=pathlib.Path('/tmp/final')
          oldall=json.load(open('/tmp/oldmatrix/wr_tf_session_t_matrix.json'))
          old=oldall['timeframes']['10']['matrix']['ZONE_C|T_ON']['candidate3']
          newrep=json.load(open('/tmp/matrix/tf10_session_t_matrix.json'))
          new=newrep['matrix']['ZONE_C|T_ON']['candidate3']
          cmp={
            'headline':'Candidate3 | 10m | Zone C | T-ON',
            'old':old,
            'strict':new,
            'delta_net6':new['net6']-old['net6'],
            'delta_trades':new['n']-old['n'],
            'strict_rebuild':json.load(open(final/'strict_comparison.json'))
          }
          json.dump(cmp,open(final/'headline_c3_comparison.json','w'),indent=2)
          (final/'strict_tf10_session_t_matrix.json').write_text(json.dumps(newrep,indent=2))
          print(json.dumps({'old_n':old['n'],'old_net6':old['net6'],'new_n':new['n'],'new_net6':new['net6'],'delta_net6':cmp['delta_net6']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wr2515-strict-10m-audit-final
          path: /tmp/final
          retention-days: 14
