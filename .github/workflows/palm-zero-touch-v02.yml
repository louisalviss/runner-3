name: Palm zero-touch documentary v0.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/palm-zero-touch-v02.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install render stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet edge-tts

      - name: Download free moving footage
        run: |
          mkdir -p work out
          curl -fL --retry 4 --retry-delay 2 \
            'https://upload.wikimedia.org/wikipedia/commons/0/08/Dubai%2C_UAE.webm' \
            -o work/dubai-timelapse.webm
          curl -fL --retry 4 --retry-delay 2 \
            'https://upload.wikimedia.org/wikipedia/commons/7/70/Dubai_skyline_2013.webm' \
            -o work/dubai-skyline.webm
          curl -fL --retry 4 --retry-delay 2 \
            'https://upload.wikimedia.org/wikipedia/commons/8/89/Dubai_landing_2025.webm' \
            -o work/dubai-landing.webm
          ls -lh work

      - name: Generate Vietnamese narration
        shell: bash
        run: |
          SCRIPT='Dubai từng thiếu một thứ mà tiền cũng khó mua: thêm bờ biển. Năm 2001, họ bắt đầu bơm cát từ đáy biển để tạo ra Palm Jumeirah. Từng năm một, những dải cát biến thành đường sá, biệt thự và khách sạn. Nhìn từ trên cao, cả hòn đảo giống một cây cọ khổng lồ. Nhưng công trình này không bao giờ thật sự hoàn thành: sóng, dòng chảy và xói mòn vẫn buộc con người phải tiếp tục bảo vệ phần đất đã lấy từ biển.'
          edge-tts \
            --voice vi-VN-NamMinhNeural \
            --rate=+7% \
            --text "$SCRIPT" \
            --write-media work/narration.mp3 \
            --write-subtitles work/narration.srt
          ffprobe -v error -show_entries format=duration -of default=nw=1 work/narration.mp3

      - name: Build moving documentary shots
        run: |
          ffmpeg -y -ss 13.5 -t 5.2 -i work/dubai-timelapse.webm \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=24,eq=contrast=1.05:saturation=1.08" \
            -an -c:v libx264 -preset fast -crf 19 -pix_fmt yuv420p work/s1.mp4

          ffmpeg -y -ss 17.0 -t 5.2 -i work/dubai-timelapse.webm \
            -vf "scale=2560:1440:force_original_aspect_ratio=increase,crop=1920:1080:320:180,fps=24,eq=contrast=1.06:saturation=1.10" \
            -an -c:v libx264 -preset fast -crf 19 -pix_fmt yuv420p work/s2.mp4

          ffmpeg -y -ss 2.0 -t 4.2 -i work/dubai-skyline.webm \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=24,eq=contrast=1.06:saturation=1.04" \
            -an -c:v libx264 -preset fast -crf 19 -pix_fmt yuv420p work/s3.mp4

          ffmpeg -y -ss 7.0 -t 4.2 -i work/dubai-landing.webm \
            -filter_complex "[0:v]split=2[bg][fg];[bg]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,boxblur=24:2,eq=brightness=-0.10[bg2];[fg]scale=-2:1080[fg2];[bg2][fg2]overlay=(W-w)/2:0,fps=24,eq=contrast=1.04:saturation=1.06[v]" \
            -map '[v]' -an -c:v libx264 -preset fast -crf 19 -pix_fmt yuv420p work/s4.mp4

          ffmpeg -y -ss 27.0 -t 5.8 -i work/dubai-timelapse.webm \
            -vf "scale=2200:1238:force_original_aspect_ratio=increase,crop=1920:1080:(in_w-1920)/2:(in_h-1080)/2,fps=24,eq=contrast=1.05:saturation=1.06" \
            -an -c:v libx264 -preset fast -crf 19 -pix_fmt yuv420p work/s5.mp4

      - name: Assemble, subtitle and sound design
        run: |
          cat > work/list.txt <<'EOF'
          file 's1.mp4'
          file 's2.mp4'
          file 's3.mp4'
          file 's4.mp4'
          file 's5.mp4'
          EOF

          ffmpeg -y -f concat -safe 0 -i work/list.txt -c copy work/picture.mp4

          ffmpeg -y -f lavfi -i "anoisesrc=color=pink:amplitude=0.010:duration=25" \
            -f lavfi -i "sine=frequency=58:sample_rate=48000:duration=25" \
            -filter_complex "[0:a]lowpass=f=1600,highpass=f=75[a0];[1:a]volume=0.012[a1];[a0][a1]amix=inputs=2:weights='1 0.7':normalize=0,afade=t=in:st=0:d=0.7,afade=t=out:st=23.8:d=1.2[bed]" \
            -map '[bed]' -c:a aac -b:a 128k work/bed.m4a

          ffmpeg -y -i work/picture.mp4 -i work/narration.mp3 -i work/bed.m4a \
            -filter_complex "[1:a]adelay=250|250,volume=1.0[vox];[2:a]volume=0.75[bed];[vox][bed]amix=inputs=2:duration=longest:dropout_transition=1[a]" \
            -map 0:v -map '[a]' \
            -vf "subtitles=work/narration.srt:force_style='FontName=DejaVu Sans,FontSize=22,PrimaryColour=&H00FFFFFF,OutlineColour=&H70000000,BorderStyle=3,Outline=1,Shadow=0,MarginV=42,Alignment=2',eq=contrast=1.015:saturation=1.015,vignette=PI/7" \
            -t 24.6 -r 24 -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -movflags +faststart work/main.mp4

          ffmpeg -y -f lavfi -i "color=c=0x090B0D:s=1920x1080:d=2.4:r=24" \
            -f lavfi -i "anullsrc=r=48000:cl=stereo" \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='FOOTAGE CREDITS':fontcolor=white:fontsize=28:x=(w-text_w)/2:y=430,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Google Earth — CC BY 3.0   •   Shyamal — CC0   •   Pradana Aumars — CC BY-SA 4.0':fontcolor=0xBFC5CC:fontsize=20:x=(w-text_w)/2:y=500,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Demo derivative — CC BY-SA 4.0':fontcolor=0x818892:fontsize=16:x=(w-text_w)/2:y=548" \
            -t 2.4 -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p -c:a aac -b:a 128k work/credits.mp4

          printf "file 'main.mp4'\nfile 'credits.mp4'\n" > work/final-list.txt
          ffmpeg -y -f concat -safe 0 -i work/final-list.txt \
            -t 27.0 -r 24 -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -movflags +faststart out/palm-zero-touch-v02.mp4

      - name: Write provenance
        run: |
          cat > out/CREDITS.md <<'EOF'
          # Palm zero-touch documentary v0.2 — media provenance

          - Google Earth, `Dubai, UAE.webm` — CC BY 3.0. Source: Wikimedia Commons. Note: Commons currently marks the historic YouTube license review as pending.
          - Shyamal, `Dubai landing 2025.webm` — CC0 1.0. Source: Wikimedia Commons.
          - Pradana Aumars, `Dubai skyline 2013.webm` — CC BY-SA 4.0. Source: Wikimedia Commons.
          - Vietnamese narration: Microsoft Edge TTS `vi-VN-NamMinhNeural` generated during workflow execution.

          This demo incorporates CC BY-SA footage and is therefore marked CC BY-SA 4.0 for distribution of this derivative demo.
          EOF
          ffprobe -v error -show_entries format=duration,size -of json out/palm-zero-touch-v02.mp4
          ls -lh out

      - name: Upload zero-touch video
        uses: actions/upload-artifact@v4
        with:
          name: palm-zero-touch-v02
          path: out/
          retention-days: 7
          if-no-files-found: error
