name: RSS Tail Diagnostic 2026-08-25

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rss-tail-diagnostic-20260825.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      ARTICLE_ID: nghiencuuquocte-url-6cd04807aefc80d9be93
    steps:
      - name: Inspect tail structure without printing article text
        run: |
          set -euo pipefail
          # Structural diagnostics only: never print article prose.
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          base=os.environ['BASE_URL'].rstrip('/')
          aid=os.environ['ARTICLE_ID']
          token=os.environ['RUNNER3_CORE_TOKEN'].strip()
          q=urllib.parse.quote(aid,safe='')
          req=urllib.request.Request(base+f'/api/rss/articles/{q}/vi',headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'rss-tail-diagnostic/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
            data=json.load(r)
          body=str((data.get('artifact') or {}).get('body') or '').replace('\r','')
          n=len(body)
          tail_start=int(n*0.50)
          print(json.dumps({'articleId':aid,'chars':n,'lines':body.count(chr(10))+1,'tailStart':tail_start},ensure_ascii=False))
          lower=body.lower()
          markers={
            'tai_lieu_tham_khao':['tài liệu tham khảo','tai lieu tham khao'],
            'tham_khao':['\ntham khảo','\ntham khao'],
            'nguon_tham_khao':['nguồn tham khảo','nguon tham khao'],
            'nguon':['\nnguồn','\nnguon'],
            'chu_thich':['\nchú thích','\nchu thich'],
            'ghi_chu':['\nghi chú','\nghi chu'],
            'references':['references','reference list'],
            'bibliography':['bibliography'],
            'footnotes':['footnotes','endnotes'],
            'related':['bài viết liên quan','bài liên quan','tin liên quan','related articles','related posts'],
            'share':['\nchia sẻ','\nshare'],
          }
          found={}
          for label,needles in markers.items():
            hits=[]
            for needle in needles:
              pos=lower.find(needle,tail_start)
              if pos>=0: hits.append(pos)
            if hits: found[label]=min(hits)
          tail=body[tail_start:]
          patterns={
            'url':r'https?://|www\.',
            'doi':r'doi\.org/|\bdoi\s*:',
            'numbered_line':r'(?m)^\s*(?:\[?\d{1,3}\]?\s*[.)-])\s+',
            'bracket_citation':r'\[\d{1,3}\]',
            'year_paren':r'\((?:19|20)\d{2}[a-z]?\)',
          }
          stats={k:len(re.findall(p,tail,re.I)) for k,p in patterns.items()}
          dense=None
          start=max(tail_start,int(n*0.55))
          for pos in range(start,n,500):
            w=body[pos:min(n,pos+3000)]
            score=(len(re.findall(patterns['url'],w,re.I))*3 + len(re.findall(patterns['doi'],w,re.I))*4 + len(re.findall(patterns['numbered_line'],w,re.I))*2 + len(re.findall(patterns['bracket_citation'],w,re.I)))
            if score>=10:
              dense={'pos':pos,'ratio':round(pos/n,4),'score':score}
              break
          print(json.dumps({'markerPositions':found,'tailPatternCounts':stats,'denseCitationWindow':dense},ensure_ascii=False))
          PY
