name: WR cross-asset Dukascopy probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wr-cross-asset-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.4
      - name: Probe Dukascopy public tick archive
        run: |
          python - <<'PY'
          import requests,lzma,struct,json
          # Dukascopy archive month is zero-based: Aug = 07.
          syms=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','XAUUSD','XAGUSD','USA500IDXUSD','USATECHIDXUSD','US30IDXUSD']
          out=[]
          for s in syms:
              u=f'https://datafeed.dukascopy.com/datafeed/{s}/2026/07/14/12h_ticks.bi5'
              try:
                  r=requests.get(u,timeout=20)
                  row={'symbol':s,'status':r.status_code,'bytes':len(r.content)}
                  if r.status_code==200 and r.content:
                      try:
                          raw=lzma.decompress(r.content)
                          row['decompressed_bytes']=len(raw)
                          row['records_20b']=len(raw)//20
                      except Exception as e: row['lzma_error']=repr(e)
                  out.append(row)
              except Exception as e: out.append({'symbol':s,'error':repr(e)})
          print(json.dumps(out,indent=2))
          PY
