name: PNTR Post Login Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pntr-post-login-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted guest state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || exit 2
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in ops/pntr/browser-state.aes \
            -out /tmp/pntr-state.json
          chmod 600 /tmp/pntr-state.json
      - name: Verify old guest ownership and live domain
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const st = JSON.parse(fs.readFileSync('/tmp/pntr-state.json','utf8'));
            const c = (st.cookies || []).find(x => x.name === 'anon_user_id' && /pntr\.dev$/.test(x.domain || ''));
            if (!c?.value) throw new Error('anon_user_id missing');
            const r = await fetch('https://api.pntr.dev/api/subdomains', {
              headers: {Accept:'application/json', Cookie:`anon_user_id=${c.value}`}
            });
            const t = await r.text();
            console.log('GUEST_API_HTTP='+r.status);
            console.log('OLD_GUEST_STILL_OWNS_TARGET='+(t.toLowerCase().includes('runner3wp.pntr.dev')?'true':'false'));

            const live = await fetch('https://runner3wp.pntr.dev/', {redirect:'follow'});
            const body = await live.text();
            console.log('DOMAIN_HTTPS_HTTP='+live.status);
            console.log('DOMAIN_LIVE='+(live.ok?'true':'false'));
            console.log('DOMAIN_HAS_WORDPRESS='+(/wp-content|wordpress/i.test(body)?'true':'false'));
          })().catch(e => {
            console.error('SAFE_ERROR='+String(e).replace(/[A-Za-z0-9_-]{28,}/g,'REDACTED').slice(0,220));
            process.exit(1);
          });
          NODE
      - name: Cleanup
        if: always()
        run: rm -f /tmp/pntr-state.json
