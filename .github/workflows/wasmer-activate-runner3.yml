name: Wasmer Activate Runner3 Theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasmer-activate-runner3.yml'
      - 'scripts/wasmer-activate-runner3.mjs'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted Wasmer state
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-result.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/browser-state.aes -out /tmp/wasmer-browser-state.json
      - run: npm install --no-save playwright-core@1.58.2
      - name: Activate Runner3 theme and verify frontend
        run: node scripts/wasmer-activate-runner3.mjs
      - name: Persist safe activation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/wasmer-activate-runner3.json || echo '{"status":"runner_error"}' >/tmp/wasmer-activate-runner3.json
          cat /tmp/wasmer-activate-runner3.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main && git reset --hard origin/main
          cp /tmp/wasmer-activate-runner3.json ops/wasmer/activate-runner3.json
          git add ops/wasmer/activate-runner3.json
          if ! git diff --cached --quiet; then git commit -m 'Persist Runner3 activation status'; git push origin HEAD:main; fi
