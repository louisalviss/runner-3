name: PNTR Recover Guest Session

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pntr-recover-guest-session.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check encryption secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { echo 'Encryption secret unavailable'; exit 2; }
          echo "::add-mask::$AUTOMATION_KEY"

      - name: Install browser automation
        run: npm install --no-save playwright-core@1.58.2

      - name: Probe historical encrypted PNTR sessions
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            e0c6b9b074e9788b6e52939fdb1de4c7f8f694d3
            cf81054bac8912f04ac2732a5df99c080276faa9
            7ae1c102af4cc5f423e1e8d20d8016e0df7a5a32
            04b2273a65c2e028c55e125b7e8b0e1d0c264df1
          )
          for sha in "${candidates[@]}"; do
            echo "CANDIDATE=${sha:0:12}"
            git fetch --quiet --depth=1 origin "$sha" || { echo 'FETCH_FAILED'; continue; }
            if ! git show "$sha:ops/pntr/browser-state.aes" > /tmp/pntr-candidate.aes 2>/dev/null; then
              echo 'STATE_MISSING'
              continue
            fi
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -pass env:AUTOMATION_KEY \
              -in /tmp/pntr-candidate.aes \
              -out /tmp/pntr-browser-state.json 2>/dev/null; then
              echo 'DECRYPT_FAILED'
              rm -f /tmp/pntr-candidate.aes /tmp/pntr-browser-state.json
              continue
            fi
            chmod 600 /tmp/pntr-browser-state.json
            node scripts/pntr-bind-probe.mjs >/dev/null 2>&1 || true
            python - <<'PY'
          import json
          p='/tmp/pntr-bind-probe.json'
          try:
              d=json.load(open(p))
              print('STATUS='+str(d.get('status')))
              print('DOMAIN_VISIBLE='+str(bool(d.get('guestDomainVisible'))).lower())
              print('PAGE_PATH='+str((d.get('pageUrl') or {}).get('pathname')))
              print('AUTH_CONTROLS='+','.join(str(x.get('text','')) for x in (d.get('authControls') or [])))
          except Exception as e:
              print('PROBE_RESULT_MISSING')
          PY
            rm -f /tmp/pntr-candidate.aes /tmp/pntr-browser-state.json /tmp/pntr-bind-probe.json
          done

      - name: Cleanup
        if: always()
        run: rm -f /tmp/pntr-candidate.aes /tmp/pntr-browser-state.json /tmp/pntr-bind-probe.json
