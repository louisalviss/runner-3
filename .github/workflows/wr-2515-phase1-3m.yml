name: WR 2.5.15 Phase1 3m
on:
  push:
    branches: [wr-2515-phase1-3m]
    paths:
      - '.github/workflows/wr-2515-phase1-3m.yml'
      - 'wave-rider-verify/wr2515_tf_phase1.py'
permissions:
  contents: read
  actions: read
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Download canonical TV-tick-clean 5m baseline
        uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - name: Fetch frozen WR v2.5.15 verifier
        run: curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
      - name: Run 3m shard
        env:
          TF_MIN: 3
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
          BASE_DIR: /tmp/base
          OUT_DIR: /tmp/out
        run: python3 wave-rider-verify/wr2515_tf_phase1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr2515-phase1-3m-shard-${{ matrix.shard }}
          path: /tmp/out
          retention-days: 7

  merge:
    needs: shard
    if: always() && needs.shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wr2515-phase1-3m-shard-*
          path: /tmp/all
          merge-multiple: true
      - name: Download canonical 5m baseline
        uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - name: Merge and compare 3m vs canonical 5m
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,glob,json,math,os,statistics
          from collections import defaultdict
          from datetime import datetime,timezone
          from pathlib import Path
          out=Path('/tmp/final');out.mkdir(exist_ok=True)
          S=[];E=[]
          for p in glob.glob('/tmp/all/summary-*.json'):S+=json.load(open(p))
          for p in glob.glob('/tmp/all/errors-*.json'):E+=json.load(open(p))
          S.sort(key=lambda x:x['symbol'])
          tv=json.load(open('/tmp/base/tv_tick_map.json'));b5=json.load(open('/tmp/base/summary.json'))
          tradfi={'BZUSDT','CLUSDT','DRAMUSDT','EWYUSDT','INTCUSDT','KORUUSDT','MRVLUSDT','MSTRUSDT','MUUSDT','SAMSUNGUSDT','SKHYNIXUSDT','SKHYUSDT','SNDKUSDT','SNXXUSDT','SOXLUSDT','SOXSUSDT','SPCXUSDT','XAGUSDT'}
          base_syms={x['symbol'] for x in b5};U=sorted((base_syms&set(tv))-tradfi)
          assert len(U)==654
          Uset=set(U);b5=[x for x in b5 if x['symbol'] in Uset]
          T3=[]
          with open(out/'trades.jsonl','w') as dst:
            for p in glob.glob('/tmp/all/trades-*.jsonl'):
              for line in open(p):
                if line.strip():
                  a=json.loads(line);T3.append(a);dst.write(json.dumps(a,separators=(',',':'))+'\n')
          def costs(trades):
            z={'n':len(trades),'gross_r':sum(x['R'] for x in trades)}
            for bps in (4,6,8,10):z[f'net_r_{bps}bps']=sum(x['R']-(x['entry']/abs(x['entry']-x['stop']))*bps/10000 for x in trades)
            z['avg_gross_r']=z['gross_r']/z['n'] if z['n'] else None
            z['avg_net6_r']=z['net_r_6bps']/z['n'] if z['n'] else None
            z['pf_gross']=(sum(max(x['R'],0) for x in trades)/sum(max(-x['R'],0) for x in trades)) if trades and sum(max(-x['R'],0) for x in trades)>0 else None
            stops=sorted(x['stop_pct'] for x in trades if x.get('stop_pct') is not None)
            if stops:
              z['median_stop_pct']=statistics.median(stops);z['p10_stop_pct']=stops[max(0,int(.10*(len(stops)-1)))];z['p90_stop_pct']=stops[int(.90*(len(stops)-1))]
            return z
          def summary5(rows):
            z={'n':sum(x['n'] for x in rows),'gross_r':sum(x['total_r'] for x in rows)}
            for bps in (4,6,8,10):z[f'net_r_{bps}bps']=sum(x[f'net_r_{bps}bps'] for x in rows)
            z['avg_gross_r']=z['gross_r']/z['n'];z['avg_net6_r']=z['net_r_6bps']/z['n'];return z
          def period_key(ms,kind):
            d=datetime.fromtimestamp(ms/1000,tz=timezone.utc)
            return str(d.year) if kind=='year' else f'{d.year}Q{(d.month-1)//3+1}'
          def grouped(trades,kind):
            g=defaultdict(list)
            for x in trades:g[period_key(x['signal_time'],kind)].append(x)
            return {k:costs(v) for k,v in sorted(g.items())}
          side={k:costs([x for x in T3 if x['side']==k]) for k in ('LONG','SHORT')}
          r3=costs(T3);r5=summary5(b5)
          r3['symbols_completed']=len(S);r3['symbols_with_trades']=sum(x['n']>0 for x in S);r3['symbols_n_ge_100']=sum(x['n']>=100 for x in S);r3['symbols_net6_positive_n_ge_100']=sum(x['n']>=100 and x['net_r_6bps']>0 for x in S)
          r5['symbols']=len(b5);r5['symbols_n_ge_100']=sum(x['n']>=100 for x in b5);r5['symbols_net6_positive_n_ge_100']=sum(x['n']>=100 and x['net_r_6bps']>0 for x in b5)
          report={'status':'PHASE1_3M_COMPLETE','engine':'WR v2.5.15 deterministic','scope':'same 654 current-TV crypto symbols; no Zone/Day changes','coverage_signal':'2025-01-01 through 2026-08-14 UTC','tf_3m':r3,'canonical_5m_same_universe':r5,'delta_3m_minus_5m':{k:r3[k]-r5[k] for k in ('n','gross_r','net_r_4bps','net_r_6bps','net_r_8bps','net_r_10bps')},'three_m_by_year':grouped(T3,'year'),'three_m_by_quarter':grouped(T3,'quarter'),'three_m_by_side':side,'errors':E}
          json.dump(report,open(out/'phase1_report.json','w'),indent=2)
          json.dump(S,open(out/'summary.json','w'),indent=2);json.dump(E,open(out/'errors.json','w'),indent=2);json.dump(U,open(out/'universe.json','w'),indent=2)
          fields=['symbol','tf','bars','tick','n','total_r','avg_r','win_rate','pf','net_r_4bps','net_r_6bps','net_r_8bps','net_r_10bps']
          with open(out/'summary.csv','w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows({k:r.get(k) for k in fields} for r in S)
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wr2515-phase1-3m-final
          path: /tmp/final
          retention-days: 14
