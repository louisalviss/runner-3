name: Reader Audio Core v34 Live Boot E2E

on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudflare/runner3-core/reader-audio-core/**'
      - 'cloudflare/runner3-core/artifact-library-reader-v33-audio-core-entry.js'
      - 'cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js'
      - 'scripts/reader_audio_core_v34_live_boot_e2e.mjs'
      - '.github/workflows/reader-audio-core-live-e2e.yml'

permissions:
  contents: read

concurrency:
  group: reader-audio-core-v34-live-boot-e2e
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      EBOOK_BROWSER_SMOKE_BOOK_KEY: core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Prove v34 live boot ownership without production mutation
        run: node scripts/reader_audio_core_v34_live_boot_e2e.mjs
