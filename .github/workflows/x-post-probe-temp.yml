name: temp-x-post-probe
on:
  push:
    paths:
      - '.github/workflows/x-post-probe-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch X post through public mirrors/APIs
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, urllib.request
          out=[]
          urls = [
            'https://api.fxtwitter.com/status/2089933094010704232',
            'https://api.vxtwitter.com/Twitter/status/2089933094010704232',
            'https://x.com/kood520/status/2089933094010704232',
          ]
          for u in urls:
              item={'url':u}
              try:
                  req=urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data=r.read(300000)
                      item['status']=r.status
                      item['content_type']=r.headers.get('content-type')
                      item['body']=data.decode('utf-8','replace')[:200000]
              except Exception as e:
                  item['error']=repr(e)
              out.append(item)
          with open('artifacts/x-post-2089933094010704232.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/x-post-2089933094010704232.json
          git commit -m 'artifact: X post 2089933094010704232' || exit 0
          git push
