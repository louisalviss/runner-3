name: temp-x-post-probe
on:
  push:
    paths:
      - '.github/workflows/x-post-probe-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch target post with x_runner
        shell: bash
        run: |
          printf '%s\n' '{"x_url":"https://x.com/kood520/status/2089933094010704232?s=12"}' > /tmp/x-job.json
          python x_runner.py /tmp/x-job.json --output-root x-results
      - name: Publish result
        if: always()
        shell: bash
        run: |
          test -d x-results/2089933094010704232 || exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add x-results/2089933094010704232
          git diff --cached --quiet && exit 0
          git commit -m 'x fetch result 2089933094010704232'
          git pull --rebase origin main
          git push origin HEAD:main
