name: Solo Beru Xonada V11 Timeline
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/solo-beru-xonada-v11-timeline.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl openvpn iproute2 iptables
          python -m pip install -q -U yt-dlp
      - name: Acquire 720p source and audio
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 35 https://www.vpngate.net/api/iphone/ -o vpn.csv
          python <<'PY'
          import csv,base64
          a=[]
          for r in csv.reader(open('vpn.csv',encoding='utf-8-sig',errors='replace')):
            if len(r)<15 or not r or r[0].startswith(('*','#')):continue
            cc=r[6].strip().upper()
            if cc not in {'VN','JP','KR'}:continue
            try:a.append((0 if cc=='VN' else 1,-int(r[2] or 0),cc,r[1],base64.b64decode(r[14]).decode('utf8','replace')))
            except:pass
          a.sort();a=a[:8]
          with open('vpns.tsv','w') as m:
            for i,(_,_,cc,ip,cfg) in enumerate(a):
              p=f'v{i}.ovpn';open(p,'w').write(cfg+'\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 7\n');m.write(f'{p}\t{cc}\t{ip}\n')
          PY
          sudo mkdir -p /etc/netns/vpnns;printf 'nameserver 1.1.1.1\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          sudo ip netns add vpnns;sudo ip link add vh type veth peer name vv;sudo ip link set vv netns vpnns
          sudo ip addr add 10.203.0.1/24 dev vh;sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.203.0.2/24 dev vv;sudo ip netns exec vpnns ip link set lo up;sudo ip netns exec vpnns ip link set vv up;sudo ip netns exec vpnns ip route add default via 10.203.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null;W=$(ip route show default|awk '/default/{print $5;exit}')
          sudo iptables -t nat -A POSTROUTING -s 10.203.0.0/24 -o "$W" -j MASQUERADE;sudo iptables -A FORWARD -i vh -o "$W" -j ACCEPT;sudo iptables -A FORWARD -i "$W" -o vh -m state --state RELATED,ESTABLISHED -j ACCEPT
          Y=$(command -v yt-dlp);got=0
          while IFS=$'\t' read -r p cc ip;do
            [ -f /tmp/v.pid ]&&sudo kill "$(cat /tmp/v.pid)" 2>/dev/null||true;sudo rm -f /tmp/v.pid /tmp/v.log;sleep 1
            sudo ip netns exec vpnns openvpn --config "$GITHUB_WORKSPACE/$p" --daemon --writepid /tmp/v.pid --log /tmp/v.log||true
            tun=0;for n in $(seq 1 12);do sudo ip netns exec vpnns ip link show tun0 >/dev/null 2>&1&&{ tun=1;break;};sleep 1;done;[ "$tun" = 1 ]||continue
            eg=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 8 https://api.ipify.org||true);[ -n "$eg" ]||continue;echo "EGRESS=$eg $cc"
            rm -f source.*
            if timeout 360s sudo ip netns exec vpnns env PATH="$PATH" HOME="$HOME" "$Y" --no-playlist --retries 1 --fragment-retries 1 --socket-timeout 20 --js-runtimes node --remote-components ejs:github -f 'bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720]' --merge-output-format mp4 -o "$GITHUB_WORKSPACE/source.%(ext)s" 'https://www.youtube.com/watch?v=IrHTT2IEKpE';then
              f=$(find . -maxdepth 1 -name 'source.*' -type f|head -1);[ -n "$f" ]&&{ [ "$f" = './source.mp4' ]||mv "$f" source.mp4;got=1;break;}
            fi
          done<vpns.tsv
          [ "$got" = 1 ]||exit 22
          ffprobe -v error -show_entries format=start_time,duration -show_entries stream=index,codec_type,codec_name,start_time -of default=nw=1 source.mp4
      - name: Get XONADA preview
        run: |
          curl -fsSL --max-time 30 'https://itunes.apple.com/search?term=MONTAGEM%20XONADA%20MXZI%20Dj%20Samir%20DJ%20Javi26&entity=song&limit=50&country=US' -o i.json
          python <<'PY'
          import json
          for x in json.load(open('i.json')).get('results',[]):
            if (x.get('trackName') or '').lower().strip()=='montagem xonada' and x.get('previewUrl') and 'mxzi' in (x.get('artistName') or '').lower():
              open('u','w').write(x['previewUrl']);break
          else:raise SystemExit('NO_XONADA')
          PY
          curl -fL --max-time 45 -A 'Mozilla/5.0' "$(cat u)" -o xonada.m4a
      - name: Exact timeline render
        run: |
          set -euo pipefail
          python <<'PY'
          segs=[(470,474,1.0),(484,490,1.5),(492,497,1.6666667),(510,514,1.0),(520,526,1.5),(528,542,2.0),(548,552,1.0)]
          n=len(segs)
          f=[]
          f.append('[0:v]setpts=PTS-STARTPTS,split='+str(n)+''.join(f'[vi{i}]' for i in range(n)))
          f.append('[0:a]asetpts=PTS-STARTPTS,asplit='+str(n)+''.join(f'[ai{i}]' for i in range(n)))
          for i,(st,en,sp) in enumerate(segs):
            fg='1056:594' if i==5 else '1024:576'
            f.append(f'[vi{i}]trim=start={st}:end={en},setpts=(PTS-STARTPTS)/{sp},split=2[b{i}][f{i}]')
            f.append(f'[b{i}]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=30,eq=brightness=-0.22:saturation=0.74[b2{i}]')
            f.append(f'[f{i}]scale={fg},eq=contrast=1.04:saturation=1.06,unsharp=5:5:0.18:5:5:0[f2{i}]')
            f.append(f'[b2{i}][f2{i}]overlay=(W-w)/2:(H-h)/2,fps=30,format=yuv420p[v{i}]')
            f.append(f'[ai{i}]atrim=start={st}:end={en},asetpts=PTS-STARTPTS,atempo={sp},aresample=48000[a{i}]')
          chain=''.join(f'[v{i}][a{i}]' for i in range(n))
          f.append(chain+f'concat=n={n}:v=1:a=1[vout][aout]')
          open('filter.txt','w').write(';'.join(f))
          open('story_map.txt','w').write('\n'.join(f'{i}: {st}-{en}s speed={sp}' for i,(st,en,sp) in enumerate(segs)))
          PY
          ffmpeg -hide_banner -loglevel error -y -i source.mp4 -filter_complex_script filter.txt -map '[vout]' -map '[aout]' -c:v libx264 -preset medium -crf 18 -profile:v high -level 4.1 -pix_fmt yuv420p -c:a aac -b:a 160k -ar 48000 -ac 2 story.mp4
          ffmpeg -hide_banner -loglevel error -y -i story.mp4 -i xonada.m4a -t 30 -filter_complex "[0:a]volume='if(lt(t,11),0.72,0.48)':eval=frame[sfx];[1:a]volume='if(lt(t,11),0.66,0.94)':eval=frame,bass=g=2.2:f=90[music];[sfx][music]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95[a]" -map 0:v -map '[a]' -c:v copy -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart solo_beru_xonada_v11.mp4
          mkdir -p qa
          for t in 2 6 9 13 17 21 25 27 28 29;do ffmpeg -hide_banner -loglevel error -y -ss $t -i solo_beru_xonada_v11.mp4 -frames:v 1 qa/q_$t.jpg;done
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,r_frame_rate,sample_rate,channels -show_entries format=duration,size,bit_rate -of default=nw=1 solo_beru_xonada_v11.mp4
      - name: Upload
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: solo-beru-xonada-v11
          path: |
            solo_beru_xonada_v11.mp4
            story_map.txt
            qa/*.jpg
          retention-days: 3
      - name: Commit manifest
        run: |
          mkdir -p audit/solo-beru-v11
          printf 'run_id=%s\nartifact_id=%s\n' '${{ github.run_id }}' '${{ steps.upload.outputs.artifact-id }}' > audit/solo-beru-v11/manifest.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add audit/solo-beru-v11/manifest.txt
          git commit -m 'Add Solo Beru V11 manifest' || exit 0
          git pull --rebase origin main || true
          git push
