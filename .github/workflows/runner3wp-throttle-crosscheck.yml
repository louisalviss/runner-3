name: Runner3WP Throttling Crosscheck
on:
  push:
    branches: [diag-runner3wp-bottleneck-20260820]
    paths: ['.github/workflows/runner3wp-throttle-crosscheck.yml']
permissions: {contents: write}
concurrency: {group: runner3wp-throttle-crosscheck, cancel-in-progress: true}
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag-runner3wp-bottleneck-20260820
          fetch-depth: 0
      - run: npm install --no-save lighthouse@12.8.2 >/dev/null 2>&1
      - name: Run 3x simulated and 3x provided
        run: |
          set -euo pipefail
          mkdir -p /tmp/x
          URL=https://runner3wp.pntr.dev/
          for mode in simulate provided; do
            for i in 1 2 3; do
              npx lighthouse "$URL" --output=json --output-path="/tmp/x/${mode}-${i}.json" \
                --only-categories=performance --form-factor=mobile --throttling-method="$mode" \
                --screenEmulation.mobile=true --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
            done
          done
      - name: Extract
        run: |
          set -euo pipefail
          mkdir -p ops/perf/diag
          python - <<'PY'
          import json,statistics,pathlib,datetime
          root=pathlib.Path('/tmp/x')
          out={'status':'ready','checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'url':'https://runner3wp.pntr.dev/','modes':{}}
          for mode in ['simulate','provided']:
            rows=[]
            for i in [1,2,3]:
              d=json.loads((root/f'{mode}-{i}.json').read_text()); a=d['audits']; s=d['configSettings']
              rows.append({'fcpMs':a['first-contentful-paint']['numericValue'],'lcpMs':a['largest-contentful-paint']['numericValue'],'tbtMs':a['total-blocking-time']['numericValue'],'speedIndexMs':a['speed-index']['numericValue'],'serverResponseMs':a['server-response-time']['numericValue'],'mainThreadMs':a['mainthread-work-breakdown']['numericValue'],'throttlingMethod':s.get('throttlingMethod'),'throttling':s.get('throttling'),'benchmarkIndex':(a.get('benchmark-index') or {}).get('numericValue')})
            out['modes'][mode]={'runs':rows,'median':{k:statistics.median([r[k] for r in rows]) for k in ['fcpMs','lcpMs','tbtMs','speedIndexMs','serverResponseMs','mainThreadMs']}}
          pathlib.Path('ops/perf/diag/runner3wp-throttle-crosscheck.latest.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/perf/diag/runner3wp-throttle-crosscheck.latest.json
          git commit -m 'diag: persist Runner3WP throttling crosscheck' || exit 0
          git push origin HEAD:diag-runner3wp-bottleneck-20260820
