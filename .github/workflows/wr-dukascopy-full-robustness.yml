name: WR Dukascopy Full Robustness
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wr-dukascopy-full-robustness.yml'
      - 'wave-rider-verify/wr_dukascopy_full_robustness.py'
      - 'wave-rider-verify/wr_tv_parity.py'
permissions:
  contents: read
  actions: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {symbol: EURUSD, tf: 10}
          - {symbol: GBPUSD, tf: 10}
          - {symbol: USDJPY, tf: 10}
          - {symbol: AUDUSD, tf: 10}
          - {symbol: USDCAD, tf: 10}
          - {symbol: USDCHF, tf: 10}
          - {symbol: NZDUSD, tf: 10}
          - {symbol: EURJPY, tf: 10}
          - {symbol: GBPJPY, tf: 10}
          - {symbol: EURGBP, tf: 10}
          - {symbol: XAUUSD, tf: 5}
          - {symbol: XAUUSD, tf: 10}
          - {symbol: XAGUSD, tf: 5}
          - {symbol: XAGUSD, tf: 10}
          - {symbol: US500, tf: 5}
          - {symbol: US500, tf: 10}
          - {symbol: NAS100, tf: 5}
          - {symbol: NAS100, tf: 10}
          - {symbol: AAPL, tf: 5}
          - {symbol: AAPL, tf: 10}
          - {symbol: MSFT, tf: 5}
          - {symbol: MSFT, tf: 10}
          - {symbol: NVDA, tf: 5}
          - {symbol: NVDA, tf: 10}
          - {symbol: AMZN, tf: 5}
          - {symbol: AMZN, tf: 10}
          - {symbol: META, tf: 5}
          - {symbol: META, tf: 10}
          - {symbol: TSLA, tf: 5}
          - {symbol: TSLA, tf: 10}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas websocket-client requests dukascopy-python
      - name: Fetch frozen WR 2.5.13 reference
        run: curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
      - name: Run full independent robustness case
        env:
          SYMBOL: ${{ matrix.symbol }}
          TF_MIN: ${{ matrix.tf }}
          WR_OUT: /tmp/wr-duka-full
        run: python3 wave-rider-verify/wr_dukascopy_full_robustness.py symbol
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-duka-full-${{ matrix.symbol }}-${{ matrix.tf }}m
          path: /tmp/wr-duka-full
          retention-days: 14
  merge:
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: wr-duka-full-*
          path: /tmp/all
          merge-multiple: false
      - name: Merge full matrix without verdict
        run: python3 wave-rider-verify/wr_dukascopy_full_robustness.py merge --root /tmp/all --final /tmp/final
      - uses: actions/upload-artifact@v4
        with:
          name: wr-duka-full-final
          path: /tmp/final
          retention-days: 30
