name: iPhone Anime Fit V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/iphone-anime-fit-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          python -m pip install -q -U yt-dlp curl_cffi numpy

      - name: Download official Jujutsu Kaisen footage
        shell: bash
        run: |
          set -euo pipefail
          download_source() {
            url="$1"
            label="$2"
            rm -f ytsrc.* anime_source.mp4
            echo "Trying $label: $url"
            if timeout 150s yt-dlp \
              --no-playlist --retries 2 --fragment-retries 2 --socket-timeout 20 \
              --impersonate chrome \
              --js-runtimes node --remote-components ejs:github \
              -f 'bv*[height<=1080]+ba/b[height<=1080]' \
              --merge-output-format mp4 -o 'ytsrc.%(ext)s' "$url"; then
                f=$(find . -maxdepth 1 -type f -name 'ytsrc*.mp4' | head -n1)
                if [ -n "${f:-}" ]; then
                  mv "$f" anime_source.mp4
                  echo "SOURCE_KIND=$label" >> "$GITHUB_ENV"
                  return 0
                fi
            fi
            return 1
          }

          # Official anime site embeds these TOHO animation videos.
          if download_source 'https://www.youtube.com/watch?v=VEjVqXiiUNY' 'JJK_EXECUTION_2025_OFFICIAL'; then
            :
          elif download_source 'https://www.youtube.com/watch?v=O6qVieflwqs' 'JJK_S2_PV2_2023_OFFICIAL'; then
            :
          else
            echo 'Both official Jujutsu Kaisen sources failed; refusing to silently substitute unrelated footage.' >&2
            exit 21
          fi

          ffprobe -v error \
            -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=nw=1 anime_source.mp4

      - name: Download phonk track
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            'https://archive.org/download/jamendo-621715/01-2294083-Waveloom-TikTok%20Phonk.mp3' \
            -o phonk.mp3
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 phonk.mp3

      - name: Auto-select fight and high-motion moments
        shell: bash
        run: |
          set -euxo pipefail
          python <<'PY'
          import json, subprocess, numpy as np
          src='anime_source.mp4'
          meta=json.loads(subprocess.check_output([
              'ffprobe','-v','error','-select_streams','v:0',
              '-show_entries','stream=width,height','-show_entries','format=duration',
              '-of','json',src
          ]))
          dur=float(meta['format']['duration'])
          lw,lh,fps=256,144,6
          p=subprocess.Popen([
              'ffmpeg','-hide_banner','-loglevel','error','-i',src,
              '-vf',f'scale={lw}:{lh},fps={fps}',
              '-pix_fmt','gray','-f','rawvideo','-'
          ], stdout=subprocess.PIPE)
          frame_bytes=lw*lh
          prev=None; scores=[]; i=0
          while True:
              b=p.stdout.read(frame_bytes)
              if len(b)<frame_bytes: break
              cur=np.frombuffer(b,dtype=np.uint8).reshape(lh,lw)
              if prev is not None:
                  diff=np.abs(cur.astype(np.int16)-prev.astype(np.int16)).astype(np.float32)
                  motion=float(diff.mean())
                  # Reward strong local action and avoid almost-black transition frames.
                  local=float(np.percentile(diff,90))
                  luminance=float(cur.mean())
                  score=motion*0.72 + local*0.28
                  t=i/fps
                  if 1.5 < t < dur-1.5 and luminance>18:
                      scores.append((score,t,motion,local))
              prev=cur; i+=1
          p.wait()

          picked=[]
          for item in sorted(scores, reverse=True):
              if all(abs(item[1]-x[1])>1.05 for x in picked):
                  picked.append(item)
              if len(picked)>=18: break
          if len(picked)<10:
              raise SystemExit(f'not enough motion moments: {len(picked)}')

          # Alternate strongest moments from different temporal regions for AMV pacing.
          by_time=sorted(picked,key=lambda x:x[1])
          order=[]; lo=0; hi=len(by_time)-1
          while lo<=hi:
              order.append(by_time[lo]); lo+=1
              if lo<=hi:
                  order.append(by_time[hi]); hi-=1
          out=[]
          for idx,item in enumerate(order[:18]):
              score,t,motion,local=item
              out.append({'i':idx,'t':max(0.0,t-0.20),'score':round(score,3),'motion':round(motion,3)})
          json.dump(out,open('moments.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          PY

      - name: Build iPhone full-frame phonk edit
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p clips
          python <<'PY'
          import json, subprocess
          moments=json.load(open('moments.json'))
          durs=[0.38,0.46,0.54,0.46]
          for m in moments:
              i=m['i']; d=durs[i%4]
              # Preserve the complete anime composition in a 1024x576 foreground.
              # A blurred/darkened copy fills 1080x1920; no aggressive portrait crop.
              flash="drawbox=x=0:y=0:w=iw:h=ih:color=white@0.16:t=fill:enable='lt(t,0.035)'," if i%3==0 else ''
              fc=(
                '[0:v]split=2[bg][fg];'
                '[bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,'
                'gblur=sigma=34,eq=brightness=-0.22:saturation=0.72[bg2];'
                '[fg]scale=1024:576:force_original_aspect_ratio=decrease,'
                'pad=1024:576:(ow-iw)/2:(oh-ih)/2:black,'
                'eq=contrast=1.06:saturation=1.10,unsharp=5:5:0.35:5:5:0.0[fg2];'
                '[bg2][fg2]overlay=(W-w)/2:(H-h)/2,' + flash +
                'fps=30,format=yuv420p[v]'
              )
              out=f'clips/c{i:02d}.mp4'
              cmd=[
                'ffmpeg','-hide_banner','-loglevel','error','-y',
                '-ss',f"{m['t']:.3f}",'-i','anime_source.mp4','-t',str(d),
                '-filter_complex',fc,'-map','[v]','-map','0:a?',
                '-c:v','libx264','-preset','slow','-crf','18','-profile:v','high','-level','4.1',
                '-pix_fmt','yuv420p','-color_primaries','bt709','-color_trc','bt709','-colorspace','bt709',
                '-c:a','aac','-b:a','128k','-ar','48000','-ac','2',out
              ]
              subprocess.check_call(cmd)
          with open('concat.txt','w') as f:
              for i in range(len(moments)):
                  f.write(f"file 'clips/c{i:02d}.mp4'\n")
          PY

          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i concat.txt -c copy visual.mp4

          if ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 visual.mp4 | grep -q .; then
            ffmpeg -hide_banner -loglevel error -y \
              -i visual.mp4 -ss 8 -i phonk.mp3 \
              -filter_complex '[0:a]volume=0.22[sfx];[1:a]volume=0.94,bass=g=3:f=90[beat];[sfx][beat]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95[a]' \
              -map 0:v:0 -map '[a]' -shortest \
              -c:v copy -c:a aac -b:a 192k -ar 48000 -ac 2 \
              -movflags +faststart jjk_phonk_iphone_v2.mp4
          else
            ffmpeg -hide_banner -loglevel error -y \
              -i visual.mp4 -ss 8 -i phonk.mp3 \
              -filter:a 'volume=0.94,bass=g=3:f=90,alimiter=limit=0.95' \
              -map 0:v:0 -map 1:a:0 -shortest \
              -c:v copy -c:a aac -b:a 192k -ar 48000 -ac 2 \
              -movflags +faststart jjk_phonk_iphone_v2.mp4
          fi

          echo "SOURCE_KIND=${SOURCE_KIND:-unknown}"
          ffprobe -v error \
            -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,sample_rate,channels \
            -show_entries format=duration,size,bit_rate \
            -of default=nw=1 jjk_phonk_iphone_v2.mp4
          ls -lh jjk_phonk_iphone_v2.mp4

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: jjk-phonk-iphone-v2
          path: jjk_phonk_iphone_v2.mp4
          retention-days: 3
