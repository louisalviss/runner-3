name: Site2 Hero Preload A/B

on:
  pull_request:
    branches: [main]
    paths:
      - 'candidates/site2-hero-preload/**'
      - 'scripts/site2-candidate-toggle.mjs'
      - 'scripts/site2-visual-snapshot.mjs'
      - 'scripts/site2-visual-compare.mjs'
      - '.github/workflows/site2-hero-preload-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner3-site2-optimization
  cancel-in-progress: false

env:
  SITE2_URL: https://runner3-wp-a94b8fd2.wasmer.app
  SITE_ID: site2
  FIXTURE_ID: astra-woo-v1
  BASELINE_RUN_ID: site2-baseline-32801765874-1
  CANDIDATE_ID: site2-hero-preload-v1
  CANDIDATE_PLUGIN_SLUG: runner3-site2-hero-preload
  MIN_LCP_IMPROVEMENT_MS: '100'
  WP_OPTIMIZER_D1_DB: runner3-wp-optimizer
  WP_OPTIMIZER_WRANGLER_VERSION: '4.124.0'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  ab:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard fixture and load comparable D1 baseline
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT s.status,json_extract(s.metadata_json,'$.fixture') AS fixture FROM sites s WHERE s.site_id='${SITE_ID}'; SELECT sample_no,performance,fcp_ms,lcp_ms,tbt_ms,cls FROM measurements WHERE run_id='${BASELINE_RUN_ID}' AND valid=1 ORDER BY sample_no;"
          npx --yes wrangler@4.124.0 d1 execute "$WP_OPTIMIZER_D1_DB" --remote --yes --json --command "$SQL" > /tmp/site2-ab-baseline.json
          FIXTURE_ID="$FIXTURE_ID" BASELINE_RUN_ID="$BASELINE_RUN_ID" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const payload=JSON.parse(fs.readFileSync('/tmp/site2-ab-baseline.json','utf8'));
          const sets=payload.filter(x=>x.success).map(x=>x.results||[]);
          const site=sets.find(rows=>rows.some(r=>'fixture' in r))?.[0];
          const rows=sets.find(rows=>rows.some(r=>'sample_no' in r))||[];
          if(!site||site.status!=='realistic-fixture'||site.fixture!==process.env.FIXTURE_ID) throw new Error(`fixture mismatch ${JSON.stringify(site)}`);
          if(rows.length!==5) throw new Error(`expected 5 baseline samples, got ${rows.length}`);
          const med=(xs)=>[...xs].sort((a,b)=>a-b)[Math.floor(xs.length/2)];
          const summary={
            run_id:process.env.BASELINE_RUN_ID,
            samples:rows.length,
            p100_count:rows.filter(r=>Number(r.performance)===100).length,
            median_performance:med(rows.map(r=>Number(r.performance))),
            median_fcp_ms:med(rows.map(r=>Number(r.fcp_ms))),
            median_lcp_ms:med(rows.map(r=>Number(r.lcp_ms))),
            median_tbt_ms:med(rows.map(r=>Number(r.tbt_ms))),
            median_cls:med(rows.map(r=>Number(r.cls))),
          };
          if(!Number.isFinite(summary.median_lcp_ms)) throw new Error('invalid baseline LCP');
          fs.writeFileSync('/tmp/baseline-summary.json',JSON.stringify(summary));
          fs.appendFileSync(process.env.GITHUB_ENV,`BASELINE_MEDIAN_LCP_MS=${summary.median_lcp_ms}\nBASELINE_MEDIAN_FCP_MS=${summary.median_fcp_ms}\nBASELINE_MEDIAN_TBT_MS=${summary.median_tbt_ms}\nBASELINE_MEDIAN_CLS=${summary.median_cls}\nBASELINE_P100_COUNT=${summary.p100_count}\n`);
          console.log('SITE2_AB_BASELINE_OK',JSON.stringify(summary));
          NODE

      - name: Install test dependencies and build candidate zip
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WASMER_TOKEN:-}"
          npm install --no-save playwright-core@1.61.0 pixelmatch@7.1.0 pngjs@7.0.0 >/dev/null
          C="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$C"
          echo "CHROME_PATH=$C" >> "$GITHUB_ENV"
          ROOT="/tmp/site2-candidate/$CANDIDATE_PLUGIN_SLUG"
          mkdir -p "$ROOT"
          cp candidates/site2-hero-preload/runner3-site2-hero-preload.php "$ROOT/runner3-site2-hero-preload.php"
          cd /tmp/site2-candidate
          zip -qr "/tmp/$CANDIDATE_PLUGIN_SLUG.zip" "$CANDIDATE_PLUGIN_SLUG"
          test -s "/tmp/$CANDIDATE_PLUGIN_SLUG.zip"

      - name: Force candidate OFF and capture visual baseline
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_ACTION=deactivate CANDIDATE_OUT=/tmp/site2-candidate-off.json \
            node scripts/site2-candidate-toggle.mjs
          VISUAL_SCREENSHOT_OUT=/tmp/site2-baseline.png VISUAL_JSON_OUT=/tmp/site2-baseline-visual.json \
            node scripts/site2-visual-snapshot.mjs

      - name: Register candidate and open D1 candidate run
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="site2-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "OPTIMIZER_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          cat >/tmp/candidate.json <<JSON
          {
            "type":"candidate.upsert",
            "candidate_id":"$CANDIDATE_ID",
            "site_id":"$SITE_ID",
            "kind":"lcp-resource-priority",
            "parameters":{"fixture":"$FIXTURE_ID","strategy":"preload existing CSS background hero","fetchpriority":"high","baseline_run_id":"$BASELINE_RUN_ID"},
            "commit_sha":"$SOURCE_SHA",
            "status":"testing"
          }
          JSON
          cat >/tmp/run-start.json <<JSON
          {
            "type":"run.start",
            "run_id":"$RUN_ID",
            "site_id":"$SITE_ID",
            "phase":"candidate",
            "baseline_run_id":"$BASELINE_RUN_ID",
            "candidate_id":"$CANDIDATE_ID",
            "workflow_name":"$GITHUB_WORKFLOW",
            "workflow_run_id":"$GITHUB_RUN_ID",
            "status":"running",
            "commit_sha":"$SOURCE_SHA",
            "metadata":{"fixture":"$FIXTURE_ID","target":"$SITE2_URL","candidate":"hero preload/fetchpriority"}
          }
          JSON
          node scripts/wp-optimizer-state.mjs --event-file /tmp/candidate.json
          node scripts/wp-optimizer-state.mjs --event-file /tmp/run-start.json

      - name: Activate candidate and functional guard
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_ACTION=activate CANDIDATE_ZIP="/tmp/$CANDIDATE_PLUGIN_SLUG.zip" CANDIDATE_OUT=/tmp/site2-candidate-on.json \
            node scripts/site2-candidate-toggle.mjs
          RUN_ID="$OPTIMIZER_RUN_ID" node -e '
            const fs=require("fs");
            const d=require("/tmp/site2-candidate-on.json");
            if(d.status!=="ready"||d.frontend?.preloadCount!==1) throw new Error("candidate functional guard failed");
            fs.writeFileSync("/tmp/functional-gate.json",JSON.stringify({type:"gate.upsert",run_id:process.env.RUN_ID,gate_name:"functional",status:"PASS",details:d.frontend}));
          '
          node scripts/wp-optimizer-state.mjs --event-file /tmp/functional-gate.json

      - name: Verify earlier hero discovery
        shell: bash
        run: |
          set -euo pipefail
          SITE2_DIAG_OUT=/tmp/site2-candidate-diagnose.json node scripts/site2-performance-diagnose.mjs
          RUN_ID="$OPTIMIZER_RUN_ID" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('/tmp/site2-candidate-diagnose.json','utf8'));
          const resource=d.hero?.resource;
          const responseEnd=d.navigation?.responseEndMs;
          const delta=Number(resource?.startTime)-Number(responseEnd);
          const pass=d.status==='ready' && resource?.initiatorType==='link' && Number.isFinite(delta) && delta<=150;
          const details={
            hero:d.hero,
            lcp:d.lcp,
            navigation:d.navigation,
            discoveryDeltaAfterHtmlResponseMs:delta,
            expectedInitiator:'link',
            maxDiscoveryDeltaMs:150,
          };
          fs.writeFileSync('/tmp/resource-priority-gate.json',JSON.stringify({type:'gate.upsert',run_id:process.env.RUN_ID,gate_name:'resource_priority',status:pass?'PASS':'FAIL',details}));
          console.log('SITE2_RESOURCE_PRIORITY',JSON.stringify({pass,initiator:resource?.initiatorType,delta}));
          if(!pass) process.exitCode=1;
          NODE
          node scripts/wp-optimizer-state.mjs --event-file /tmp/resource-priority-gate.json

      - name: Candidate visual and responsive guard
        shell: bash
        run: |
          set -euo pipefail
          VISUAL_SCREENSHOT_OUT=/tmp/site2-candidate.png VISUAL_JSON_OUT=/tmp/site2-candidate-visual.json \
            node scripts/site2-visual-snapshot.mjs
          BASELINE_SCREENSHOT=/tmp/site2-baseline.png CANDIDATE_SCREENSHOT=/tmp/site2-candidate.png \
            VISUAL_COMPARE_OUT=/tmp/site2-visual-diff.json MAX_VISUAL_DIFF_RATIO=0.002 \
            node scripts/site2-visual-compare.mjs
          RUN_ID="$OPTIMIZER_RUN_ID" node -e '
            const fs=require("fs");
            const d=require("/tmp/site2-visual-diff.json");
            const candidate=require("/tmp/site2-candidate-visual.json");
            if(d.status!=="PASS") throw new Error("visual diff failed");
            fs.writeFileSync("/tmp/visual-gate.json",JSON.stringify({type:"gate.upsert",run_id:process.env.RUN_ID,gate_name:"visual_responsive",status:"PASS",details:{diff:d,candidate}}));
          '
          node scripts/wp-optimizer-state.mjs --event-file /tmp/visual-gate.json

      - name: Collect 5 valid official PageSpeed candidate samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/site2-candidate-psi
          PSI_URL="$SITE2_URL/"
          export PSI_URL
          for i in 1 2 3 4 5; do
            valid=0
            for attempt in 1 2 3 4; do
              echo "=== SITE2 CANDIDATE PSI sample=$i attempt=$attempt ==="
              OUT="/tmp/site2-candidate-psi/sample-$i.json"
              rm -f "$OUT"
              if PSI_UI_OUT="$OUT" timeout 330s node scripts/pagespeed-ui-mobile-audit.mjs; then
                if node -e '
                  const fs=require("fs");
                  const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                  process.exit(d.status==="ready"&&Number.isFinite(d.performance)&&d.fcp&&d.lcp?0:1);
                ' "$OUT"; then valid=1; break; fi
              fi
              echo "SITE2_CANDIDATE_PSI_RETRY sample=$i attempt=$attempt"
              sleep 5
            done
            if [ "$valid" != 1 ]; then
              echo "SITE2_CANDIDATE_PSI_FAILED sample=$i"
              exit 12
            fi
          done

      - name: Persist samples and decide KEEP or ROLLBACK
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          function ms(value){const m=String(value??'').trim().match(/^([0-9.]+)\s*(ms|s)?$/i);if(!m)return null;const n=Number(m[1]);return Number.isFinite(n)?(String(m[2]||'').toLowerCase()==='s'?n*1000:n):null;}
          function num(value){const m=String(value??'').trim().match(/^([0-9.]+)/);return m?Number(m[1]):null;}
          const rows=[];
          for(let i=1;i<=5;i++){
            const d=JSON.parse(fs.readFileSync(`/tmp/site2-candidate-psi/sample-${i}.json`,'utf8'));
            const row={sample_no:i,performance:d.performance,fcp_ms:ms(d.fcp),lcp_ms:ms(d.lcp),tbt_ms:ms(d.tbt),cls:num(d.cls),result_url:d.resultUrl,measured_at:d.checkedAt};
            if(![row.performance,row.fcp_ms,row.lcp_ms].every(Number.isFinite)) throw new Error(`invalid sample ${i}`);
            rows.push(row);
            fs.writeFileSync(`/tmp/site2-candidate-psi/event-${i}.json`,JSON.stringify({type:'measurement.upsert',run_id:process.env.OPTIMIZER_RUN_ID,phase:'candidate',sample_no:i,valid:true,performance:row.performance,fcp_ms:row.fcp_ms,lcp_ms:row.lcp_ms,tbt_ms:row.tbt_ms,cls:row.cls,collector:'pagespeed-web-ui-mobile',result_url:row.result_url,measured_at:row.measured_at,raw:d}));
            console.log('SITE2_CANDIDATE_SAMPLE',JSON.stringify(row));
          }
          const med=(xs)=>[...xs].sort((a,b)=>a-b)[Math.floor(xs.length/2)];
          const summary={samples:5,valid_samples:5,p100_count:rows.filter(r=>r.performance===100).length,median_performance:med(rows.map(r=>r.performance)),median_fcp_ms:med(rows.map(r=>r.fcp_ms)),median_lcp_ms:med(rows.map(r=>r.lcp_ms)),median_tbt_ms:med(rows.map(r=>r.tbt_ms).filter(Number.isFinite)),median_cls:med(rows.map(r=>r.cls).filter(Number.isFinite))};
          const baseline={p100_count:Number(process.env.BASELINE_P100_COUNT),median_fcp_ms:Number(process.env.BASELINE_MEDIAN_FCP_MS),median_lcp_ms:Number(process.env.BASELINE_MEDIAN_LCP_MS),median_tbt_ms:Number(process.env.BASELINE_MEDIAN_TBT_MS),median_cls:Number(process.env.BASELINE_MEDIAN_CLS)};
          const minImprovement=Number(process.env.MIN_LCP_IMPROVEMENT_MS);
          const checks={fiveValid:summary.valid_samples===5,p100:summary.p100_count>=baseline.p100_count,lcpImproves:summary.median_lcp_ms<=baseline.median_lcp_ms-minImprovement,fcpNonRegression:summary.median_fcp_ms<=baseline.median_fcp_ms+100,tbtNonRegression:summary.median_tbt_ms<=baseline.median_tbt_ms+50,clsNonRegression:summary.median_cls<=baseline.median_cls+0.01};
          const keep=Object.values(checks).every(Boolean);
          const verdict=keep?'KEEP_CANDIDATE':'ROLLBACK';
          const reason=keep?`candidate improves median LCP by at least ${minImprovement}ms with all guards green`:`candidate did not meet promotion checks: ${JSON.stringify(checks)}`;
          fs.writeFileSync('/tmp/candidate-summary.json',JSON.stringify({baseline,candidate:summary,checks,verdict,reason}));
          fs.writeFileSync('/tmp/performance-gate.json',JSON.stringify({type:'gate.upsert',run_id:process.env.OPTIMIZER_RUN_ID,gate_name:'performance_non_regression',status:keep?'PASS':'FAIL',details:{baseline,candidate:summary,checks,minImprovement}}));
          fs.writeFileSync('/tmp/decision.json',JSON.stringify({type:'decision.upsert',run_id:process.env.OPTIMIZER_RUN_ID,verdict,baseline_median_lcp_ms:baseline.median_lcp_ms,candidate_median_lcp_ms:summary.median_lcp_ms,tolerance_ms:minImprovement,reason,details:{baseline,candidate:summary,checks}}));
          fs.writeFileSync('/tmp/candidate-status.json',JSON.stringify({type:'candidate.upsert',candidate_id:process.env.CANDIDATE_ID,site_id:process.env.SITE_ID,kind:'lcp-resource-priority',parameters:{fixture:process.env.FIXTURE_ID,strategy:'preload existing CSS background hero',result:summary},commit_sha:process.env.SOURCE_SHA,status:keep?'kept':'rejected'}));
          fs.appendFileSync(process.env.GITHUB_ENV,`KEEP_CANDIDATE=${keep?'true':'false'}\nFINAL_VERDICT=${verdict}\nCANDIDATE_MEDIAN_LCP_MS=${summary.median_lcp_ms}\n`);
          console.log('SITE2_CANDIDATE_SUMMARY',JSON.stringify({baseline,candidate:summary,checks,verdict}));
          NODE
          for i in 1 2 3 4 5; do node scripts/wp-optimizer-state.mjs --event-file "/tmp/site2-candidate-psi/event-$i.json"; done
          node scripts/wp-optimizer-state.mjs --event-file /tmp/performance-gate.json
          node scripts/wp-optimizer-state.mjs --event-file /tmp/decision.json
          node scripts/wp-optimizer-state.mjs --event-file /tmp/candidate-status.json

      - name: Roll back rejected or incomplete candidate
        if: ${{ always() && env.KEEP_CANDIDATE != 'true' }}
        shell: bash
        run: |
          set +e
          CANDIDATE_ACTION=deactivate CANDIDATE_OUT=/tmp/site2-candidate-rollback.json \
            node scripts/site2-candidate-toggle.mjs
          STATUS=$?
          if [ -n "${OPTIMIZER_RUN_ID:-}" ]; then
            RUN_ID="$OPTIMIZER_RUN_ID" STATUS="$STATUS" node -e '
              const fs=require("fs");
              const ok=process.env.STATUS==="0";
              fs.writeFileSync("/tmp/rollback-gate.json",JSON.stringify({type:"gate.upsert",run_id:process.env.RUN_ID,gate_name:"rollback",status:ok?"PASS":"FAIL",details:{candidate_active_after_rollback:false}}));
            '
            node scripts/wp-optimizer-state.mjs --event-file /tmp/rollback-gate.json || true
          fi
          exit "$STATUS"

      - name: Final live-state guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_ACTION=deactivate
          if [ "${KEEP_CANDIDATE:-false}" = "true" ]; then EXPECTED_ACTION=activate; fi
          CANDIDATE_ACTION="$EXPECTED_ACTION" CANDIDATE_ZIP="/tmp/$CANDIDATE_PLUGIN_SLUG.zip" CANDIDATE_OUT=/tmp/site2-candidate-final.json \
            node scripts/site2-candidate-toggle.mjs
          echo "FINAL_VERDICT=${FINAL_VERDICT:-INCOMPLETE}"
          echo "BASELINE_MEDIAN_LCP_MS=${BASELINE_MEDIAN_LCP_MS:-unknown}"
          echo "CANDIDATE_MEDIAN_LCP_MS=${CANDIDATE_MEDIAN_LCP_MS:-unknown}"

      - name: Mark interrupted candidate run failed
        if: ${{ failure() && env.OPTIMIZER_RUN_ID != '' && env.FINAL_VERDICT == '' }}
        shell: bash
        run: |
          set +e
          RUN_ID="$OPTIMIZER_RUN_ID" node -e '
            const fs=require("fs");
            fs.writeFileSync("/tmp/run-failed.json",JSON.stringify({type:"run.finish",run_id:process.env.RUN_ID,status:"failed",verdict:"INCONCLUSIVE",metadata:{reason:"Site2 candidate workflow failed before decision; rollback attempted"}}));
          '
          node scripts/wp-optimizer-state.mjs --event-file /tmp/run-failed.json

      - name: Evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Site2 Hero Preload A/B'
            echo
            echo "- baseline: \`$BASELINE_RUN_ID\`"
            echo "- candidate: \`$CANDIDATE_ID\`"
            echo "- D1 run: \`${OPTIMIZER_RUN_ID:-not-opened}\`"
            echo "- verdict: **${FINAL_VERDICT:-INCOMPLETE}**"
            if [ -f /tmp/candidate-summary.json ]; then
              echo '```json'
              cat /tmp/candidate-summary.json
              echo
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
