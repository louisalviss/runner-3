name: Analyst Revision Source Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/analyst-revision-source-audit/**'
      - '.github/workflows/analyst-revision-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pandas pyarrow numpy
      - name: Audit public PIT analyst-revision sources
        run: python research/analyst-revision-source-audit/audit_sources.py
      - name: Audit schema and temporal behavior
        run: python research/analyst-revision-source-audit/schema_temporal_audit.py
