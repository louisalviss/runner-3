name: SPMO Legacy Jina Smoke
on:
  push:
    branches: [main]
    paths:
      - 'spmo-legacy/jina_smoke.py'
      - '.github/workflows/spmo-jina-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -u spmo-legacy/jina_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spmo-jina-smoke-${{ github.run_id }}
          path: spmo-legacy-jina.txt
          if-no-files-found: warn
          retention-days: 3
