name: VPS Mailbox Ciphertext Readback

on:
  push:
    branches: [main]
    paths:
      - 'mailbox/inbox.json'
      - 'mailbox/requests/**'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vps-mailbox-readback
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Drain ready Core results and persist ciphertext only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mailbox/outbox
          core='https://runner3-core.ducduy2411.workers.dev'

          mapfile -t pending < <(python3 - <<'PY'
          import json, pathlib
          d=json.load(open('mailbox/inbox.json',encoding='utf-8'))
          vals=[str(x).strip() for x in d.get('requests',[]) if str(x).strip()]
          seen=set()
          for rid in reversed(vals):
              if rid in seen:
                  continue
              seen.add(rid)
              if not pathlib.Path(f'mailbox/outbox/{rid}.json').exists():
                  print(rid)
          PY
          )

          if [ "${#pending[@]}" -eq 0 ]; then
            echo 'No pending mailbox requests'
            exit 0
          fi

          # Push/manual runs briefly wait for freshly-submitted work. Scheduled
          # runs only probe once; the 5-minute schedule guarantees eventual
          # readback for jobs that finish after this workflow exits.
          attempts=1
          if [ "${GITHUB_EVENT_NAME}" != 'schedule' ]; then attempts=20; fi

          relayed=0
          for rid in "${pending[@]}"; do
            out="mailbox/outbox/${rid}.json"
            ready=0
            for attempt in $(seq 1 "$attempts"); do
              tmp="$(mktemp)"
              code="$(curl -sS --max-time 8 -o "$tmp" -w '%{http_code}' \
                "${core}/state/vps-mailbox-result-${rid}?relay=${GITHUB_RUN_ID}-${attempt}" || true)"
              if [ "$code" = 200 ]; then
                if python3 - "$tmp" "$out" <<'PY'
          import json,sys,os
          src,out=sys.argv[1:]
          try: d=json.load(open(src,encoding='utf-8'))
          except Exception: raise SystemExit(1)
          state=d.get('state') if isinstance(d,dict) else None
          if not isinstance(state,dict) or state.get('status') not in {'done','failed'}:
              raise SystemExit(1)
          detail=state.get('detail')
          if not isinstance(detail,dict):
              raise SystemExit(1)
          required={'version','alg','request_id','encrypted_key','nonce','ciphertext'}
          if not required.issubset(detail) or str(detail.get('request_id')) != os.path.basename(out)[:-5]:
              raise SystemExit(2)
          with open(out,'w',encoding='utf-8') as f:
              json.dump(detail,f,ensure_ascii=False,separators=(',',':')); f.write('\n')
          print(f"relayed {detail['request_id']} status={state.get('status')}")
          PY
                then
                  ready=1
                  relayed=$((relayed + 1))
                  rm -f "$tmp"
                  break
                fi
              fi
              rm -f "$tmp"
              if [ "$attempt" -lt "$attempts" ]; then sleep 2; fi
            done
            if [ "$ready" != 1 ]; then
              echo "Result not ready: ${rid}"
            fi
          done

          if [ "$relayed" -eq 0 ]; then
            echo 'No ready mailbox results'
            exit 0
          fi

          git config user.name 'vps-mailbox-relay[bot]'
          git config user.email 'vps-mailbox-relay[bot]@users.noreply.github.com'
          git add mailbox/outbox/*.json
          git commit -m "Relay encrypted VPS mailbox results [skip ci]"
          git pull --rebase origin main
          git push
