name: webnovel-writing-brain-vnfirst-control

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/webnovel-writing-brain-vnfirst-control.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: webnovel-writing-brain-vnfirst-control
  cancel-in-progress: false

env:
  TARGET_WORKFLOW: webnovel-writing-brain-vnfirst.yml
  TAG: webnovel-writing-brain-vnfirst-v1-2026-08-20
  ASSET: webnovel-writing-brain-vnfirst-v1-2026-08-20.zip
  STATUS_FILE: ops/webnovel-writing-brain-vnfirst-status.json

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve and watch latest target run
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow "$TARGET_WORKFLOW" --limit 10 --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[0].databaseId')
          test -n "$run_id"
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
          set +e
          gh run watch "$run_id" --exit-status
          echo "WATCH_RC=$?" >> "$GITHUB_ENV"
          set -e
      - name: Record exact result
        shell: bash
        run: |
          set -euo pipefail
          status=$(gh run view "$RUN_ID" --json status --jq '.status')
          conclusion=$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion // "unknown"')
          head_sha=$(gh run view "$RUN_ID" --json headSha --jq '.headSha')
          failed_jobs=$(gh run view "$RUN_ID" --json jobs --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(", ")')
          release_ok=false; size=0
          if release_json=$(gh release view "$TAG" --json assets 2>/dev/null); then
            size=$(printf '%s' "$release_json" | jq -r --arg n "$ASSET" '.assets[]? | select(.name==$n) | .size // 0' | head -n1)
            [ -n "$size" ] || size=0
            if [ "$size" -gt 0 ] 2>/dev/null; then release_ok=true; fi
          fi
          export STATUS="$status" CONCLUSION="$conclusion" HEAD_SHA="$head_sha" FAILED_JOBS="$failed_jobs" RELEASE_OK="$release_ok" ASSET_SIZE="$size"
          mkdir -p ops
          python - <<'PY'
          import json,os,pathlib,datetime
          data={
            'schema':'webnovel-writing-brain-vnfirst-status-v1',
            'workflow':'webnovel-writing-brain-vnfirst.yml',
            'run_id':int(os.environ['RUN_ID']),'head_sha':os.environ['HEAD_SHA'],
            'status':os.environ['STATUS'],'conclusion':os.environ['CONCLUSION'],
            'release_tag':os.environ['TAG'],'release_asset':os.environ['ASSET'],
            'release_ok':os.environ['RELEASE_OK'].lower()=='true','asset_size_bytes':int(os.environ['ASSET_SIZE'] or 0),
            'failed_jobs':[x.strip() for x in os.environ.get('FAILED_JOBS','').split(',') if x.strip()],
            'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'contract':'VN-first Writing Brain complete only when conclusion=success and release_ok=true.'
          }
          pathlib.Path(os.environ['STATUS_FILE']).write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATUS_FILE"
          git commit -m 'Record VN-first Writing Brain build status [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i*2))
          done
          exit 1
