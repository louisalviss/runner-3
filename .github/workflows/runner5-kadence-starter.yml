name: Runner5 Kadence Starter Site

on:
  push:
    branches: [main]
    paths:
      - 'scripts/runner5-kadence-starter-import.mjs'
      - '.github/workflows/runner5-kadence-starter.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner5-kadence-starter
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOMATION_KEY: ${{ secrets.WASMER_AUTOMATION_KEY || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Initialize status
        run: printf '{"status":"RUNNING","stage":"checkout"}\n' > /tmp/runner5-kadence-starter.json

      - name: Decrypt Wasmer account state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { printf '{"status":"RUNNER_ERROR","stage":"decrypt","detail":"missing_automation_key"}\n' > /tmp/runner5-kadence-starter.json; exit 3; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in ops/wasmer/state.automation.aes \
            -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json

      - name: Prepare browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            npm install --no-save playwright@1.58.2
            npx playwright install --with-deps chromium
            CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          fi
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Import official Kadence starter site
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/runner5-kadence-starter-import.mjs
          node scripts/runner5-kadence-starter-import.mjs

      - name: Upload Kadence visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner5-kadence-starter-qa
          path: |
            /tmp/runner5-kadence-starter.json
            /tmp/runner5-kadence-home.png
          if-no-files-found: warn

      - name: Persist Kadence status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=/tmp/runner5-kadence-starter.json
          test -s "$status" || printf '{"status":"RUNNER_ERROR","stage":"unknown","detail":"status_missing"}\n' > "$status"
          cp "$status" /tmp/runner5-kadence-starter-safe.json
          rm -f /tmp/wasmer-account.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/wordpress-access
            cp /tmp/runner5-kadence-starter-safe.json ops/wordpress-access/runner5-kadence-starter.json
            git add ops/wordpress-access/runner5-kadence-starter.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Runner5 Kadence starter status'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 3
