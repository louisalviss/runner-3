name: VPS Recovery Secret Presence Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-recovery-secret-presence-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
    steps:
      - name: Check secret presence without disclosure
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RUNNER3_CORE_TOKEN:-}" ]; then
            echo 'RUNNER3_CORE_TOKEN_PRESENT=true'
          else
            echo 'RUNNER3_CORE_TOKEN_PRESENT=false'
            exit 3
          fi
