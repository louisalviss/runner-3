name: YouTube probe UwnylaM15So POT
on:
  push:
    paths:
      - '.github/workflows/youtube_probe_uwnyla_pot.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp and POT provider
        run: |
          python -m pip install -U 'yt-dlp[default,curl-cffi]' bgutil-ytdlp-pot-provider
          yt-dlp --version
      - name: Start BgUtils POT provider
        run: |
          docker run -d --name bgutil-provider -p 4416:4416 --init brainicism/bgutil-ytdlp-pot-provider:latest
          sleep 5
          docker logs bgutil-provider || true
      - name: Probe video with mweb plus POT
        shell: bash
        run: |
          set +e
          mkdir -p ytpot
          URL='https://www.youtube.com/watch?v=UwnylaM15So'
          yt-dlp -v --extractor-args 'youtube:player_client=mweb' --dump-single-json --skip-download "$URL" > ytpot/metadata.json 2> ytpot/debug.log
          echo $? > ytpot/metadata_rc.txt
          yt-dlp -v --extractor-args 'youtube:player_client=mweb' --write-auto-subs --write-subs --sub-langs 'en.*' --sub-format vtt --skip-download -o 'ytpot/%(id)s.%(ext)s' "$URL" > ytpot/sub_stdout.log 2> ytpot/sub_debug.log
          echo $? > ytpot/sub_rc.txt
          yt-dlp -v --extractor-args 'youtube:player_client=mweb' -f 'worstaudio/worst' -o 'ytpot/video.%(ext)s' "$URL" > ytpot/dl_stdout.log 2> ytpot/dl_debug.log
          echo $? > ytpot/dl_rc.txt
          ls -lah ytpot > ytpot/listing.txt
          cat ytpot/metadata_rc.txt ytpot/sub_rc.txt ytpot/dl_rc.txt
          cat ytpot/debug.log
          cat ytpot/sub_debug.log
          cat ytpot/dl_debug.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-uwnyla-pot
          path: ytpot/
          if-no-files-found: warn
