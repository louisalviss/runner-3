name: Reader v40 Canonical Position Sentence Layout Patch

on:
  push:
    paths:
      - '.github/workflows/reader-v40-canonical-position-sentence-layout-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch canonical reader position, sentence highlight and fixed player reserve
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              p.write_text(s.replace(old,new,1))

          # v27: base Reader position owns navigation; legacy audio CFI is fallback only.
          p='cloudflare/runner3-core/artifact-library-reader-v27-boot-cfi-restore-entry.js'
          old="""  let saved=null;\n  try{saved=JSON.parse(localStorage.getItem('r3-reader-audio-state-v11:'+bookKey)||'null');}catch{}\n  const target=String(saved&&saved.cfi||'');\n  if(!target)return;"""
          new="""  const baseKey='r3-reader-position:'+bookKey;\n  let target='';\n  try{target=String(localStorage.getItem(baseKey)||'');}catch{}\n  if(!target){\n    let saved=null;\n    try{saved=JSON.parse(localStorage.getItem('r3-reader-audio-state-v11:'+bookKey)||'null');}catch{}\n    target=String(saved&&saved.cfi||'');\n  }\n  if(!target)return;"""
          replace_once(p,old,new,'v27 canonical position')

          # v28: never overwrite an existing Reader position from stale audio state.
          p='cloudflare/runner3-core/artifact-library-reader-v28-prime-base-position-entry.js'
          old="""  let saved=null;\n  try{saved=JSON.parse(localStorage.getItem('r3-reader-audio-state-v11:'+bookKey)||'null');}catch{}\n  const cfi=String(saved&&saved.cfi||'');\n  if(!cfi)return;\n  const baseKey='r3-reader-position:'+bookKey;\n  let previous='';\n  try{previous=String(localStorage.getItem(baseKey)||'');localStorage.setItem(baseKey,cfi);}catch{}\n  window.__r3AudioPrimeBasePositionV28Debug={phase:'primed',baseKey,previous,cfi};"""
          new="""  const baseKey='r3-reader-position:'+bookKey;\n  let previous='';\n  try{previous=String(localStorage.getItem(baseKey)||'');}catch{}\n  if(previous){\n    window.__r3AudioPrimeBasePositionV28Debug={phase:'kept-reader-position',baseKey,previous};\n    return;\n  }\n  let saved=null;\n  try{saved=JSON.parse(localStorage.getItem('r3-reader-audio-state-v11:'+bookKey)||'null');}catch{}\n  const cfi=String(saved&&saved.cfi||'');\n  if(!cfi)return;\n  try{localStorage.setItem(baseKey,cfi);}catch{}\n  window.__r3AudioPrimeBasePositionV28Debug={phase:'primed-audio-fallback',baseKey,previous,cfi};"""
          replace_once(p,old,new,'v28 no stale overwrite')

          # Audio core: Reader position is canonical; stale audio chapter must not move Reader.
          p='cloudflare/runner3-core/reader-audio-core/browser-production-integration.js'
          old="""  const STATE_KEY = `r3-reader-audio-core-v1:${bookKey}`;\n  const LEGACY_KEY = `r3-reader-audio-state-v11:${bookKey}`;"""
          new="""  const STATE_KEY = `r3-reader-audio-core-v1:${bookKey}`;\n  const LEGACY_KEY = `r3-reader-audio-state-v11:${bookKey}`;\n  const READER_POSITION_KEY = `r3-reader-position:${bookKey}`;"""
          replace_once(p,old,new,'audio core reader position key')

          old="""      if (saved.cfi && bridge()?.display) {\n        try { await bridge().display(saved.cfi); } catch {}\n      }\n      if (saved.mediaId) {\n        let ready = false;\n        for (let n = 0; n < 120; n++) {\n          const loc = bridge()?.current?.();\n          const payload = framePayload();\n          const locationReady = Boolean(loc?.start?.cfi || loc?.start?.href);\n          const chapterReady = Boolean(payload && (!saved.chapter || payload.chapter === saved.chapter));\n          if (locationReady && chapterReady) {\n            ready = true;\n            break;\n          }\n          await sleep(100);\n        }\n        if (!ready) throw new Error('READER_CHAPTER_NOT_READY');\n        await prepareCurrent({ autoplay: false, allowSaved: true });\n      } else syncUi(saved);"""
          new="""      let readerCfi = '';\n      try { readerCfi = String(localStorage.getItem(READER_POSITION_KEY) || ''); } catch {}\n      const restoreCfi = readerCfi || saved.cfi || '';\n      if (restoreCfi && bridge()?.display) {\n        try { await bridge().display(restoreCfi); } catch {}\n      }\n      if (saved.mediaId) {\n        let payload = null;\n        let locationReady = false;\n        for (let n = 0; n < 120; n++) {\n          const loc = bridge()?.current?.();\n          payload = framePayload();\n          locationReady = Boolean(loc?.start?.cfi || loc?.start?.href);\n          if (locationReady && payload) break;\n          await sleep(100);\n        }\n        if (!locationReady || !payload) throw new Error('READER_CHAPTER_NOT_READY');\n        const sameAudioChapter = Boolean(!saved.chapter || payload.chapter === saved.chapter);\n        if (sameAudioChapter) await prepareCurrent({ autoplay: false, allowSaved: true });\n        else syncUi({ ...saved, chapter: payload.chapter, mediaId: '', time: 0, cfi: restoreCfi, playingIntent: false });\n      } else syncUi({ ...saved, cfi: restoreCfi });"""
          replace_once(p,old,new,'audio core canonical initial restore')

          # v34: sentence-level highlight, but page-follow stays anchored to the current word.
          p='cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js'
          old="""  function phraseRange(index){\n    const center=nearestMappedIndex(index);\n    if(center<0)return null;\n    const phraseSpan=12;\n    const bucket=Math.floor(center/phraseSpan)*phraseSpan;\n    let first=-1,last=-1;\n    for(let i=bucket;i<Math.min(mappedWords.length,bucket+phraseSpan);i++)if(mappedWords[i]){if(first<0)first=i;last=i;}\n    if(first<0){first=center;last=center;}\n    try{\n      const start=mappedWords[first],end=mappedWords[last];\n      if(!start||!end||start.startContainer.ownerDocument!==end.endContainer.ownerDocument)return mappedWords[center];\n      const range=start.startContainer.ownerDocument.createRange();\n      range.setStart(start.startContainer,start.startOffset);\n      range.setEnd(end.endContainer,end.endOffset);\n      return range;\n    }catch{return mappedWords[center]||null;}\n  }"""
          new="""  function phraseRange(index){\n    const center=nearestMappedIndex(index);\n    if(center<0)return null;\n    const wordRange=mappedWords[center];\n    if(!wordRange)return null;\n    try{\n      const doc=wordRange.startContainer.ownerDocument;\n      const startNode=wordRange.startContainer.nodeType===1?wordRange.startContainer:wordRange.startContainer.parentElement;\n      const block=startNode&&startNode.closest?startNode.closest('p,li,h1,h2,h3,h4,h5,h6,blockquote'):null;\n      if(!block)return wordRange;\n      const text=String(block.textContent||'');\n      if(!text.trim())return wordRange;\n      let centerOffset=0,foundCenter=false;\n      const walker=doc.createTreeWalker(block,NodeFilter.SHOW_TEXT);\n      let node;\n      while((node=walker.nextNode())){\n        if(node===wordRange.startContainer){centerOffset+=wordRange.startOffset;foundCenter=true;break;}\n        centerOffset+=String(node.nodeValue||'').length;\n      }\n      if(!foundCenter){const fallback=doc.createRange();fallback.selectNodeContents(block);return fallback;}\n      let sentenceStart=0,sentenceEnd=text.length;\n      if(typeof Intl!=='undefined'&&typeof Intl.Segmenter==='function'){\n        const segmenter=new Intl.Segmenter('vi',{granularity:'sentence'});\n        for(const part of segmenter.segment(text)){\n          const from=Number(part.index)||0;\n          const to=from+String(part.segment||'').length;\n          if(centerOffset>=from&&centerOffset<=to){sentenceStart=from;sentenceEnd=to;break;}\n        }\n      }else{\n        const left=text.slice(0,centerOffset);\n        const right=text.slice(centerOffset);\n        const leftMatch=left.match(/[.!?…][\\s\\"'”’»)]*[^.!?…]*$/);\n        if(leftMatch)sentenceStart=Math.max(0,left.length-leftMatch[0].length+1);\n        const rightMatch=right.match(/[.!?…][\\"'”’»)]*(?:\\s|$)/);\n        if(rightMatch)sentenceEnd=Math.min(text.length,centerOffset+rightMatch.index+rightMatch[0].length);\n      }\n      while(sentenceStart<sentenceEnd&&/\\s/.test(text[sentenceStart]||''))sentenceStart++;\n      while(sentenceEnd>sentenceStart&&/\\s/.test(text[sentenceEnd-1]||''))sentenceEnd--;\n      let cursor=0,startNodeFound=null,startOffset=0,endNodeFound=null,endOffset=0;\n      const walker2=doc.createTreeWalker(block,NodeFilter.SHOW_TEXT);\n      while((node=walker2.nextNode())){\n        const len=String(node.nodeValue||'').length;\n        if(!startNodeFound&&sentenceStart<=cursor+len){startNodeFound=node;startOffset=Math.max(0,sentenceStart-cursor);}\n        if(sentenceEnd<=cursor+len){endNodeFound=node;endOffset=Math.max(0,sentenceEnd-cursor);break;}\n        cursor+=len;\n      }\n      if(!startNodeFound||!endNodeFound){const fallback=doc.createRange();fallback.selectNodeContents(block);return fallback;}\n      const range=doc.createRange();\n      range.setStart(startNodeFound,startOffset);\n      range.setEnd(endNodeFound,endOffset);\n      return range;\n    }catch{return wordRange;}\n  }"""
          replace_once(p,old,new,'sentence highlight')

          old="""    const range=phraseRange(index);\n    if(!range)return false;\n    applyExactHighlight(range);\n    if(!force&&rangeVisible(range))return true;"""
          new="""    const center=nearestMappedIndex(index);\n    const followRange=center>=0?mappedWords[center]:null;\n    const range=phraseRange(index);\n    if(!range||!followRange)return false;\n    applyExactHighlight(range);\n    if(!force&&rangeVisible(followRange))return true;"""
          replace_once(p,old,new,'follow current word visibility')
          old="""    try{cfi=String(b.cfiFromRange(range)||'');}catch{}"""
          new="""    try{cfi=String(b.cfiFromRange(followRange)||'');}catch{}"""
          replace_once(p,old,new,'follow current word cfi')

          # v35: base Reader CFI first, plus fixed viewport reserve present before EPUB boot.
          p='cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js'
          old="""  function savedCfi(){\n    if(!bookKey)return '';\n    const keys=['r3-reader-audio-state-v11:'+bookKey,'r3-reader-audio-core-v1:'+bookKey];"""
          new="""  function savedCfi(){\n    if(!bookKey)return '';\n    try{const reader=String(localStorage.getItem('r3-reader-position:'+bookKey)||'');if(reader)return reader;}catch{}\n    const keys=['r3-reader-audio-state-v11:'+bookKey,'r3-reader-audio-core-v1:'+bookKey];"""
          replace_once(p,old,new,'v35 canonical saved cfi')

          old="""const V35_PLAYER_CHAPTERS = `<style data-r3-player-chapters-v38=\"1\">"""
          new="""const V35_EARLY_AUDIO_RESERVE = `<style data-r3-reader-audio-reserve-v40=\"1\">\n#viewer{bottom:calc(210px + env(safe-area-inset-bottom,0px))!important}\n</style>`;\n\nconst V35_PLAYER_CHAPTERS = `<style data-r3-player-chapters-v38=\"1\">"""
          replace_once(p,old,new,'v35 early reserve constant')

          old="""body.r3-audio-ui.r3-audio-expanded #viewer{bottom:calc(66px + env(safe-area-inset-bottom,0px))!important}\nbody.r3-audio-ui.r3-audio-expanded .bottom-status{bottom:calc(72px + env(safe-area-inset-bottom,0px))!important}"""
          new="""body.r3-audio-ui #viewer,body.r3-audio-ui.r3-audio-expanded #viewer{bottom:calc(210px + env(safe-area-inset-bottom,0px))!important}\nbody.r3-audio-ui .bottom-status,body.r3-audio-ui.r3-audio-expanded .bottom-status{bottom:calc(216px + env(safe-area-inset-bottom,0px))!important}"""
          replace_once(p,old,new,'v35 stable fixed reserve')

          old="""  if (!out.includes('</body>')) throw new Error('READER_V35_BODY_MARKER_MISSING');\n  out = out.replace('</body>', V35_FLAG + V35_LAYOUT_STABILIZER + V35_PLAYER_CHAPTERS + '</body>');"""
          new="""  if (!out.includes('</head>')) throw new Error('READER_V35_HEAD_MARKER_MISSING');\n  out = out.replace('</head>', V35_EARLY_AUDIO_RESERVE + '</head>');\n  if (!out.includes('</body>')) throw new Error('READER_V35_BODY_MARKER_MISSING');\n  out = out.replace('</body>', V35_FLAG + V35_LAYOUT_STABILIZER + V35_PLAYER_CHAPTERS + '</body>');"""
          replace_once(p,old,new,'v35 early reserve injection')

          # Permanent static regression smoke.
          test=Path('cloudflare/runner3-core/reader-audio-core/reader-v40-static-smoke.mjs')
          test.write_text("""import fs from 'node:fs';\nimport assert from 'node:assert/strict';\nconst read=p=>fs.readFileSync(p,'utf8');\nconst root='cloudflare/runner3-core/';\nconst v27=read(root+'artifact-library-reader-v27-boot-cfi-restore-entry.js');\nconst v28=read(root+'artifact-library-reader-v28-prime-base-position-entry.js');\nconst v34=read(root+'artifact-library-reader-v34-continuous-range-sync-entry.js');\nconst v35=read(root+'artifact-library-reader-v35-continuity-single-owner-entry.js');\nconst core=read(root+'reader-audio-core/browser-production-integration.js');\nassert.match(v27,/baseKey='r3-reader-position:'\+bookKey/);\nassert.match(v28,/phase:'kept-reader-position'/);\nassert.ok(v28.indexOf("if(previous)") < v28.indexOf("localStorage.setItem(baseKey,cfi)"));\nassert.match(v34,/Intl\.Segmenter\('vi',\{granularity:'sentence'\}\)/);\nassert.match(v34,/cfiFromRange\(followRange\)/);\nassert.match(v35,/data-r3-reader-audio-reserve-v40/);\nassert.match(v35,/#viewer\{bottom:calc\(210px/);\nassert.match(v35,/localStorage\.getItem\('r3-reader-position:'\+bookKey\)/);\nassert.match(core,/READER_POSITION_KEY/);\nassert.match(core,/const restoreCfi = readerCfi \|\| saved\.cfi/);\nconsole.log('reader-v40-static-smoke: PASS');\n""")
          PY
      - name: Regression checks
        run: |
          node --check cloudflare/runner3-core/artifact-library-reader-v27-boot-cfi-restore-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v28-prime-base-position-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          node cloudflare/runner3-core/reader-audio-core/reader-v40-static-smoke.mjs
          node cloudflare/runner3-core/reader-audio-core/core-smoke.mjs
          node cloudflare/runner3-core/reader-audio-core/adapter-smoke.mjs
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'louisalviss'
          git config user.email 'ducduy2411@gmail.com'
          rm .github/workflows/reader-v40-canonical-position-sentence-layout-patch.yml
          git add cloudflare/runner3-core/artifact-library-reader-v27-boot-cfi-restore-entry.js \
                  cloudflare/runner3-core/artifact-library-reader-v28-prime-base-position-entry.js \
                  cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js \
                  cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js \
                  cloudflare/runner3-core/reader-audio-core/browser-production-integration.js \
                  cloudflare/runner3-core/reader-audio-core/reader-v40-static-smoke.mjs \
                  .github/workflows/reader-v40-canonical-position-sentence-layout-patch.yml
          git commit -m 'fix(reader): canonical position sentence highlight stable player reserve'
          git push
