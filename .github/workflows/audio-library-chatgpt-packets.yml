name: Audio Library ChatGPT Source Packets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audio_media_core.py'
      - 'scripts/audio_library_extract_packets_for_chatgpt.py'
      - '.github/workflows/audio-library-chatgpt-packets.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: runner3-audio-chatgpt-packets
  cancel-in-progress: true

jobs:
  packetize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: github-audio-chatgpt-packets
      CHATGPT_INBOX_PUBLIC_KEY: sYGZHQp2jOgHK7mnuF+Yij8rZOxYbgxKNOP4okx0k3E=
      AUDIO_LIBRARY_MAX_RAW_CHARS: '120000'
      AUDIO_LIBRARY_PACKET_CHARS: '3500'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: python -m pip install -q -U requests beautifulsoup4 pypdf yt-dlp 'cryptography>=45,<47'
      - name: Validate scoped Audio Library packetizer
        run: |
          set -euo pipefail
          test -n "${RUNNER3_CORE_TOKEN:-}"
          python -m py_compile scripts/audio_media_core.py scripts/audio_library_extract_packets_for_chatgpt.py
      - name: Build encrypted source packets
        run: python scripts/audio_library_extract_packets_for_chatgpt.py | tee /tmp/packet-result.json
      - name: Publish packets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/audio-library
          cp /tmp/packet-result.json ops/audio-library/chatgpt-packets-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/audio-library/chatgpt-inbox-records/ ops/audio-library/chatgpt-packets-status.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Publish ChatGPT encrypted source packets [skip ci]'
          git pull --rebase origin main || true
          git push origin HEAD:main
