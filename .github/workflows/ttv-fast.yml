name: TTV Fast Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttv-fast.yml'
      - 'jobs/2026-08-15-metruyenchu-story-smoke-v2.json'

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python crawler.py jobs/2026-08-15-metruyenchu-story-smoke-v2.json --output crawl_output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttv-fast-${{ github.run_id }}
          path: crawl_output/
          if-no-files-found: warn
          retention-days: 1
