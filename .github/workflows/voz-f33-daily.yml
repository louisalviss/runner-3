name: Tin VN · F33 Daily

on:
  push:
    branches: [main]
    paths:
      - 'voz_f33_daily.py'
      - 'crawler.py'
      - 'forum_signal_v2.py'
      - '.github/workflows/voz-f33-daily.yml'
  schedule:
    # 20:15 Asia/Ho_Chi_Minh, before the 21:00 Vietnam news radar.
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional intended Vietnam date (YYYY-MM-DD), used by delayed/late-close dispatches'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: voz-f33-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish run-start pointer
        uses: actions/github-script@v7
        env:
          REQUESTED_TARGET_DATE: ${{ inputs.target_date || '' }}
        with:
          script: |
            const path = 'voz_f33_latest.json';
            const pointer = {
              workflow: 'VOZ F33 Daily Full Crawl',
              run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
              artifact_id: 0,
              artifact_name: `voz-f33-daily-${context.runId}`,
              commit_sha: context.sha,
              generated_at: new Date().toISOString(),
              requested_target_date: process.env.REQUESTED_TARGET_DATE || '',
              status: 'RUNNING'
            };
            let sha;
            let currentPointer = null;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: process.env.GITHUB_REF_NAME
              });
              sha = current.data.sha;
              currentPointer = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            } catch (e) {
              if (e.status !== 404 && !(e instanceof SyntaxError)) throw e;
            }
            if (currentPointer?.run_id && Number(currentPointer.run_id) > Number(context.runId)) {
              core.warning(`Skip stale start-pointer write from run ${context.runId}; newer run ${currentPointer.run_id} already owns pointer`);
              return;
            }
            const args = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `chore: mark VOZ F33 run ${context.runId} started [skip ci]`,
              content: Buffer.from(JSON.stringify(pointer, null, 2) + '\n').toString('base64'),
              branch: process.env.GITHUB_REF_NAME
            };
            if (sha) args.sha = sha;
            await github.rest.repos.createOrUpdateFileContents(args);
            core.info(JSON.stringify(pointer));

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Compile check
        run: python -m py_compile voz_f33_daily.py crawler.py forum_signal_v2.py

      - name: Crawl every page of every normal F33 page-1 thread
        id: crawl
        run: python voz_f33_daily.py --output voz_f33_output --request-delay-ms 220 --max-pages 250

      - name: Upload full F33 artifact
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voz-f33-daily-${{ github.run_id }}
          path: voz_f33_output/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final latest and dated pointers
        if: always()
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          REQUESTED_TARGET_DATE: ${{ inputs.target_date || '' }}
        with:
          script: |
            const fs = require('fs');
            let manifest = {};
            try {
              manifest = JSON.parse(fs.readFileSync('voz_f33_output/manifest.json', 'utf8'));
            } catch (e) {
              manifest = {status: 'FAILED', manifest_error: String(e)};
            }

            function vnParts(d) {
              const parts = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Ho_Chi_Minh',
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
              }).formatToParts(d);
              return Object.fromEntries(parts.map(p => [p.type, p.value]));
            }
            function vnDateKey(d) {
              const p = vnParts(d);
              return `${p.year}-${p.month}-${p.day}`;
            }
            function previousVnDateKey(d) {
              return vnDateKey(new Date(d.getTime() - 24 * 60 * 60 * 1000));
            }

            const now = new Date();
            const requested = (process.env.REQUESTED_TARGET_DATE || '').trim();
            let dateKey;
            let targetDateSource;
            if (/^\d{4}-\d{2}-\d{2}$/.test(requested)) {
              dateKey = requested;
              targetDateSource = 'workflow_dispatch_input';
            } else if (context.eventName === 'schedule') {
              // The canonical schedule is 20:15 VN. GitHub may start a scheduled
              // run hours late; if it starts after midnight but before 20:15,
              // the intended occurrence belongs to the previous Vietnam date.
              const p = vnParts(now);
              const minutes = Number(p.hour) * 60 + Number(p.minute);
              const scheduledMinutes = 20 * 60 + 15;
              dateKey = minutes < scheduledMinutes ? previousVnDateKey(now) : vnDateKey(now);
              targetDateSource = 'scheduled_occurrence_20_15_vn';
            } else {
              dateKey = vnDateKey(now);
              targetDateSource = 'completion_local_date';
            }

            const pointer = {
              workflow: 'VOZ F33 Daily Full Crawl',
              run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
              artifact_id: Number(process.env.ARTIFACT_ID || 0),
              artifact_name: `voz-f33-daily-${context.runId}`,
              artifact_url: process.env.ARTIFACT_URL || '',
              commit_sha: context.sha,
              generated_at: now.toISOString(),
              vietnam_date: dateKey,
              target_date_source: targetDateSource,
              status: manifest.status || 'UNKNOWN',
              threads_discovered: manifest.threads_discovered ?? null,
              threads_healthy: manifest.threads_healthy ?? null,
              threads_degraded: manifest.threads_degraded ?? null,
              threads_failed: manifest.threads_failed ?? null,
              expected_pages_total: manifest.expected_pages_total ?? null,
              fetched_pages_total: manifest.fetched_pages_total ?? null,
              missing_pages_total: manifest.missing_pages_total ?? null,
              posts_total: manifest.posts_total ?? null
            };

            async function writePointer(path, message) {
              let sha;
              let existing = null;
              try {
                const current = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: process.env.GITHUB_REF_NAME
                });
                sha = current.data.sha;
                existing = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
              } catch (e) {
                if (e.status !== 404 && !(e instanceof SyntaxError)) throw e;
              }
              if (existing?.run_id && Number(existing.run_id) > Number(context.runId)) {
                core.warning(`Skip stale pointer write to ${path} from run ${context.runId}; newer run ${existing.run_id} exists`);
                return;
              }
              const args = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                message,
                content: Buffer.from(JSON.stringify(pointer, null, 2) + '\n').toString('base64'),
                branch: process.env.GITHUB_REF_NAME
              };
              if (sha) args.sha = sha;
              await github.rest.repos.createOrUpdateFileContents(args);
            }

            await writePointer('voz_f33_latest.json', 'chore: update VOZ F33 latest pointer [skip ci]');
            await writePointer(`voz_f33_history/${dateKey}.json`, `chore: index VOZ F33 ${dateKey} artifact [skip ci]`);
            core.info(JSON.stringify(pointer));

      - name: Enforce complete-page health gate
        if: always() && steps.crawl.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path('voz_f33_output/manifest.json')
          if not p.exists():
              print('manifest missing')
              sys.exit(1)
          m = json.loads(p.read_text(encoding='utf-8'))
          print('VOZ F33 health:', m.get('status'))
          print('threads:', m.get('threads_discovered'))
          print('pages:', m.get('fetched_pages_total'), '/', m.get('expected_pages_total'))
          print('posts:', m.get('posts_total'))
          if m.get('status') != 'HEALTHY':
              sys.exit(1)
          PY

