name: VBTH Bench Smoke
on:
  push:
    paths:
      - '.github/workflows/vbth-bench-smoke.yml'
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p vbth_bench
          printf 'RUNNER_OK\n' > vbth_bench/runner-status.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vbth_bench/runner-status.txt
          git commit -m "VBTH benchmark runner smoke [skip ci]"
          git push
