# trigger-2
name: TV Pump Short Verify 20260906

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tv-pump-short-verify-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore TradingView session
        shell: bash
        run: |
          set -euo pipefail
          test -s ops/tradingview/session-state.json.aes
          test -n "${AUTOMATION_KEY:-}"
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in ops/tradingview/session-state.json.aes \
            -out /tmp/tv-storage-state.json
      - name: Run TradingView strategy verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          cat > /tmp/tv_verify.js <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright-core');
          const pine=`//@version=6
          strategy("Extreme Pump Short Verify", overlay=true, pyramiding=0, initial_capital=100000, commission_type=strategy.commission.percent, commission_value=0.05, process_orders_on_close=true)
          pumpPct = input.float(50.0, "24h pump %", step=5.0)
          rolloverBars = input.int(6, "Rollover window bars", minval=1)
          stopPct = input.float(20.0, "Stop %", step=1.0) / 100.0
          holdBars = input.int(24, "Hold bars", minval=1)
          cooldownBars = input.int(336, "Cooldown bars", minval=1)
          startT = timestamp("UTC", 2026, 3, 10, 0, 0)
          endT = timestamp("UTC", 2026, 9, 6, 23, 59)
          inRange = time >= startT and time <= endT
          ret24 = bar_index >= 24 ? (close / close[24] - 1.0) * 100.0 : na
          pumpCross = inRange and ret24 >= pumpPct and (na(ret24[1]) or ret24[1] < pumpPct)
          var int sigBar = na
          var int lastTradeBar = na
          if pumpCross
              sigBar := bar_index
          canEnter = not na(sigBar) and bar_index > sigBar and bar_index <= sigBar + rolloverBars and close < open and strategy.position_size == 0 and (na(lastTradeBar) or bar_index - lastTradeBar >= cooldownBars)
          if canEnter
              strategy.entry("S", strategy.short)
              lastTradeBar := bar_index
              sigBar := na
          if not na(sigBar) and bar_index > sigBar + rolloverBars
              sigBar := na
          if strategy.position_size < 0
              strategy.exit("STOP", "S", stop=strategy.position_avg_price * (1.0 + stopPct))
              if strategy.opentrades > 0 and bar_index - strategy.opentrades.entry_bar_index(0) >= holdBars
                  strategy.close("S", comment="TIME")
          if time > endT and strategy.position_size != 0
              strategy.close_all(comment="END")`;

          function out(k,v){ console.log(k+'='+String(v).replace(/\n/g,'\\n')); }
          async function body(page){ return await page.locator('body').innerText().catch(()=> ''); }
          async function clickText(page, regexes){
            for(const rx of regexes){
              const candidates=[page.getByRole('button',{name:rx}),page.getByText(rx,{exact:true})];
              for(const loc of candidates){
                const n=Math.min(await loc.count().catch(()=>0),6);
                for(let i=0;i<n;i++){ const x=loc.nth(i); if(await x.isVisible().catch(()=>false)){ await x.click({timeout:8000}).catch(()=>{}); await page.waitForTimeout(900); return true; } }
              }
            }
            return false;
          }
          async function collect(page,symbol){
            await page.waitForTimeout(5000);
            await clickText(page,[/^Strategy Tester$/i,/^Strategy tester$/i]);
            await page.waitForTimeout(3500);
            const t=await body(page);
            const keys=['Total P&L','Net profit','Max equity drawdown','Max drawdown','Total trades','Profitable trades','Percent profitable','Profit factor','Avg trade'];
            const lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);
            const picked=[];
            for(let i=0;i<lines.length;i++) if(keys.some(k=>lines[i].toLowerCase().includes(k.toLowerCase()))) picked.push(lines.slice(i,i+4).join(' | '));
            out('TV_RESULT_'+symbol.replace(/[^A-Z0-9]/gi,'_'), JSON.stringify({url:page.url(),metrics:picked.slice(0,20),tail:lines.slice(-80)}));
          }
          (async()=>{
            const exes=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'];
            const executablePath=exes.find(p=>fs.existsSync(p));
            if(!executablePath) throw new Error('Chrome/Chromium missing');
            const storageState=JSON.parse(fs.readFileSync('/tmp/tv-storage-state.json','utf8'));
            const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({storageState,viewport:{width:1800,height:1100}});
            const page=await context.newPage();
            const first='OKX:RAVEUSDT.P';
            await page.goto('https://www.tradingview.com/chart/?symbol='+encodeURIComponent(first)+'&interval=60',{waitUntil:'domcontentloaded',timeout=90000});
            await page.waitForTimeout(12000);
            const cookies=await context.cookies();
            const authCookie=cookies.some(c=>/(^|\.)tradingview\.com$/i.test(c.domain.replace(/^\./,'')) && /session/i.test(c.name) && c.value);
            const b0=await body(page);
            out('TV_AUTH',authCookie && !/\bSign in\b/i.test(b0) ? 'PASS':'FAIL');
            out('TV_INITIAL_TAIL',b0.split(/\n/).slice(-80).join(' | '));
            if(!authCookie) throw new Error('TradingView auth session missing');

            let opened=await clickText(page,[/^Pine Editor$/i,/Pine Editor/i]);
            out('TV_PINE_TAB',opened?'CLICKED':'NOT_FOUND');
            await page.waitForTimeout(2200);
            const ta=page.locator('textarea.inputarea').first();
            let edited=false;
            if(await ta.count().catch(()=>0)){
              await ta.click({force:true}).catch(()=>{});
              await page.keyboard.press('Control+A');
              await page.keyboard.insertText(pine);
              edited=true;
            } else {
              const editors=page.locator('textarea');
              const n=await editors.count().catch(()=>0);
              for(let i=0;i<n;i++){
                const x=editors.nth(i);
                if(await x.isVisible().catch(()=>false)){
                  await x.click(); await page.keyboard.press('Control+A'); await page.keyboard.insertText(pine); edited=true; break;
                }
              }
            }
            out('TV_EDITOR_WRITE',edited?'PASS':'FAIL');
            if(!edited){ out('TV_AFTER_PINE', (await body(page)).slice(-12000)); throw new Error('Pine editor textarea not found'); }
            await page.waitForTimeout(1000);
            let added=await clickText(page,[/^Add to chart$/i,/Add to chart/i,/^Update on chart$/i]);
            if(!added){ await page.keyboard.press('Control+Enter').catch(()=>{}); await page.waitForTimeout(1200); }
            out('TV_ADD_TO_CHART',added?'CLICKED':'CTRL_ENTER_FALLBACK');
            await page.waitForTimeout(8000);
            const after=await body(page);
            out('TV_COMPILE_TAIL',after.split(/\n/).slice(-120).join(' | '));
            await collect(page,first);

            for(const sym of ['OKX:ORDIUSDT.P','OKX:ENJUSDT.P']){
              await page.goto('https://www.tradingview.com/chart/?symbol='+encodeURIComponent(sym)+'&interval=60',{waitUntil:'domcontentloaded',timeout=90000});
              await page.waitForTimeout(10000);
              await collect(page,sym);
            }
            await page.screenshot({path:'/tmp/tv-final.png',fullPage:false}).catch(()=>{});
            await browser.close();
          })().catch(e=>{console.error('TV_VERIFY_ERROR='+e.stack);process.exit(7)});
          NODE
          node /tmp/tv_verify.js | tee /tmp/tv-verify.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-pump-short-verify-20260906
          path: |
            /tmp/tv-verify.log
            /tmp/tv-final.png
          if-no-files-found: ignore
          retention-days: 1
      - name: Cleanup decrypted session
        if: always()
        shell: bash
        run: rm -f /tmp/tv-storage-state.json
