name: Diagnose Tinhte DOM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tinhte-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Verify current Tinhte parser over plain HTTP
        shell: bash
        run: |
          python - <<'PY'
          import requests
          import forum_signal_delta as parser

          urls = [
            'https://tinhte.vn/thread/anh-em-cho-hoi-sao-tinhte-la-trang-cong-nghe-to-cung-co-the-noi-la-nhat-vn-ma-tai-sao-web-lan-app.4011664/',
            'https://tinhte.vn/thread/tesla-ra-mat-xe-tao-dien-theo-thoi-gian-thuc-ban-doggy.4091069/',
          ]
          h={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}
          total=0
          timestamped=0
          for u in urls:
            r=requests.get(u,headers=h,timeout=30)
            r.raise_for_status()
            title, rows = parser.enhanced_extract_posts(r.text, u, 100)
            structured=[x for x in rows if x.get('extraction') == 'structured_post']
            with_ts=[x for x in structured if x.get('timestamp')]
            total += len(structured)
            timestamped += len(with_ts)
            print({'url':u,'title':title[:100],'structured':len(structured),'timestamped':len(with_ts),'sample':structured[:2]})
          if total < 5:
            raise SystemExit(f'Tinhte parser regression: only {total} structured rows')
          if timestamped < 3:
            raise SystemExit(f'Tinhte timestamp regression: only {timestamped} timestamped rows')
          print({'tinhte_parser':'PASS','structured_total':total,'timestamped_total':timestamped,'browser_required':False})
          PY
