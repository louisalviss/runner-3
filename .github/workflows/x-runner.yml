name: X Runner

on:
  push:
    paths:
      - x-job.json
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      x_url:
        description: Public X/Twitter status URL
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: x-runner
  cancel-in-progress: true

jobs:
  inspect-x:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[x-runner]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare job
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_URL: ${{ github.event.inputs.x_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            python - <<'PY'
          import json, os, re
          from pathlib import Path
          body = os.environ.get("ISSUE_BODY", "")
          match = re.search(r"https://(?:www\.)?(?:x\.com|twitter\.com)/[^\s]+/status/\d+(?:\?[^\s]*)?", body)
          if not match:
              raise SystemExit("issue body does not contain a valid X status URL")
          Path("x-job.runtime.json").write_text(
              json.dumps({"x_url": match.group(0)}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
            echo "JOB_FILE=x-job.runtime.json" >> "$GITHUB_ENV"
          elif [ -n "$DISPATCH_URL" ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          Path("x-job.runtime.json").write_text(
              json.dumps({"x_url": os.environ["DISPATCH_URL"]}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
            echo "JOB_FILE=x-job.runtime.json" >> "$GITHUB_ENV"
          else
            test -f x-job.json
            echo "JOB_FILE=x-job.json" >> "$GITHUB_ENV"
          fi

      - name: Read job options
        id: opts
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          job = json.loads(Path(os.environ['JOB_FILE']).read_text(encoding='utf-8'))
          identify = job.get('identify_anime', True)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('identify_anime=' + ('true' if identify else 'false') + '\n')
          PY

      - name: Ensure ffmpeg
        if: steps.opts.outputs.identify_anime == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            python -m pip install --quiet imageio-ffmpeg
            FFMPEG_BIN="$(python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )"
            sudo ln -sf "$FFMPEG_BIN" /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Inspect tweet
        run: python x_runner.py "$JOB_FILE" --output-root x-results

      - name: Identify anime scene across all frames
        if: steps.opts.outputs.identify_anime == 'true'
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          for outdir in [p for p in Path('x-results').glob('*') if p.is_dir()]:
              frames = sorted(outdir.glob('preview.jpg')) + sorted(outdir.glob('frame_*.jpg'))
              probes = []
              best = None
              for frame in frames:
                  target = outdir / f"trace-{frame.stem}.json"
                  cmd = [
                      'curl', '-sS', '--fail', '--max-time', '45',
                      '-F', f'image=@{frame}',
                      'https://api.trace.moe/search?anilistInfo',
                      '-o', str(target),
                  ]
                  proc = subprocess.run(cmd)
                  if proc.returncode != 0:
                      probes.append({'frame': frame.name, 'error': 'trace.moe lookup failed'})
                      continue
                  try:
                      data = json.loads(target.read_text(encoding='utf-8'))
                  except Exception as exc:
                      probes.append({'frame': frame.name, 'error': f'invalid trace response: {exc}'})
                      continue
                  results = data.get('result') or []
                  top = results[0] if results else None
                  probe = {'frame': frame.name, 'top': top}
                  probes.append(probe)
                  if top is not None:
                      score = float(top.get('similarity') or 0)
                      if best is None or score > best['similarity']:
                          best = {'frame': frame.name, 'similarity': score, 'match': top}

              summary = {
                  'best': best,
                  'probes': probes,
                  'confidence': (
                      'high' if best and best['similarity'] >= 0.90 else
                      'medium' if best and best['similarity'] >= 0.82 else
                      'low'
                  ),
              }
              (outdir / 'trace.json').write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
              )
          PY

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-runner-${{ github.run_id }}
          path: x-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish compact result to repository
        if: always()
        run: |
          if [ ! -d x-results ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-results
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "x runner result $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Shadow telemetry to Runner3 Core
        id: runner3_telemetry
        if: always()
        continue-on-error: true
        shell: bash
        env:
          EVENT_URL: https://runner3-core.ducduy2411.workers.dev/events
          EVENT_LATEST_URL: https://runner3-core.ducduy2411.workers.dev/events/latest
          EVENT_STATUS: ${{ job.status }}
          EVENT_WORKFLOW: ${{ github.workflow }}
          EVENT_RUN_ID: ${{ github.run_id }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          source = "x-runner"
          headers = {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0 Runner3Telemetry/1.0",
          }
          payload = {
              "source": source,
              "event_type": "workflow_status",
              "payload": {
                  "workflow": os.environ["EVENT_WORKFLOW"],
                  "run_id": os.environ["EVENT_RUN_ID"],
                  "run_attempt": os.environ["EVENT_RUN_ATTEMPT"],
                  "status": os.environ["EVENT_STATUS"],
                  "sha": os.environ["EVENT_SHA"],
                  "ref": os.environ["EVENT_REF"],
              },
          }
          req = urllib.request.Request(
              os.environ["EVENT_URL"],
              data=json.dumps(payload).encode(),
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=10) as r:
              print("POST", r.status, r.read().decode())

          latest_req = urllib.request.Request(
              os.environ["EVENT_LATEST_URL"],
              headers={"Accept": "application/json", "User-Agent": headers["User-Agent"]},
          )
          with urllib.request.urlopen(latest_req, timeout=10) as r:
              latest = json.load(r)

          run_id = os.environ["EVENT_RUN_ID"]
          match = None
          for event in latest if isinstance(latest, list) else []:
              if event.get("source") != source or event.get("event_type") != "workflow_status":
                  continue
              try:
                  body = json.loads(event.get("payload") or "{}")
              except Exception:
                  continue
              if str(body.get("run_id")) == str(run_id):
                  match = event
                  break

          print("D1_READBACK", json.dumps(match))
          if not match:
              raise SystemExit("workflow_status_not_visible_in_d1")
          PY

      - name: Persist Runner3 Core telemetry status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TELEMETRY_OUTCOME: ${{ steps.runner3_telemetry.outcome }}
          EVENT_STATUS: ${{ job.status }}
          EVENT_WORKFLOW: ${{ github.workflow }}
          EVENT_RUN_ID: ${{ github.run_id }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref_name }}
        run: |
          mkdir -p ops/runner3-core
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path

          outcome = os.environ.get("TELEMETRY_OUTCOME", "unknown")
          data = {
              "ok": outcome == "success",
              "source": "x-runner",
              "event_type": "workflow_status",
              "telemetry_outcome": outcome,
              "workflow": os.environ.get("EVENT_WORKFLOW"),
              "run_id": os.environ.get("EVENT_RUN_ID"),
              "run_attempt": os.environ.get("EVENT_RUN_ATTEMPT"),
              "job_status_at_tail": os.environ.get("EVENT_STATUS"),
              "sha": os.environ.get("EVENT_SHA"),
              "ref": os.environ.get("EVENT_REF"),
              "checked_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          Path("ops/runner3-core/x-runner-telemetry.json").write_text(
              json.dumps(data, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(data, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/runner3-core/x-runner-telemetry.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist X runner telemetry status: $GITHUB_RUN_ID [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
