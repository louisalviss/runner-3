name: Private Compute Encrypted Readback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-compute-encrypted-readback.yml'

permissions:
  contents: read

jobs:
  encrypted_readback:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: echo ENCRYPTED_READBACK_PROBE=PASS
