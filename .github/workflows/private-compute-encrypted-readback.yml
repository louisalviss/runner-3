name: Private Compute Encrypted Readback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-compute-encrypted-readback.yml'

permissions:
  contents: read

jobs:
  encrypted_readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch and encrypt
        shell: bash
        env:
          RUNNER3_CORE_URL: ${{ secrets.RUNNER3_CORE_URL }}
          RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
          CERT_B64: 
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${RUNNER3_CORE_TOKEN:-}"
          work="${RUNNER_TEMP}/encrypted-readback"
          mkdir -p "$work"
          scope="$(tr -d '\r\n[:space:]' < jobs/private-compute-trigger.txt)"
          base="${RUNNER3_CORE_URL:-https://runner3-core.ducduy2411.workers.dev}"
          curl --fail --silent --show-error -H "Authorization: Bearer ${RUNNER3_CORE_TOKEN}" -H 'Cache-Control: no-cache' "${base%/}/artifacts/private-compute/${scope}/result.tar.gz" -o "$work/result.tar.gz"
          printf '%s' "$CERT_B64" | base64 -d > "$work/cert.pem"
          openssl cms -encrypt -binary -aes-256-cbc -in "$work/result.tar.gz" -out "$work/result.cms.der" -outform DER "$work/cert.pem"
          rm -f "$work/result.tar.gz" "$work/cert.pem"
          echo ENCRYPTED_READBACK=PASS

      - name: Upload ciphertext
        uses: actions/upload-artifact@v4
        with:
          name: private-compute-encrypted-readback
          path: ${{ runner.temp }}/encrypted-readback/result.cms.der
          if-no-files-found: error
          retention-days: 1
