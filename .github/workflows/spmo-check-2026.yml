name: SPMO Check 2026
on:
  push:
    branches: [main]
    paths:
      - 'spmo-hf/check_2026.py'
      - '.github/workflows/spmo-check-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb pandas
      - run: python -u spmo-hf/check_2026.py
