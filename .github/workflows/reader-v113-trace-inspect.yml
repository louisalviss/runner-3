name: Reader v113 Physical Trace Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect latest physical Reader traces
        shell: bash
        working-directory: cloudflare/runner3-core
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          query="SELECT trace_id,seq,created_at,scope,mode,event,payload FROM ebook_reader_trace_v113 WHERE event <> 'deploy.smoke' ORDER BY created_at DESC, seq DESC LIMIT 120;"
          npx --yes wrangler@4 d1 execute runner3-core --remote --command "$query" --json
