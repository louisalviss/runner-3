name: Solo Beru Xonada V10 Final
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/solo-beru-xonada-v10-final.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl openvpn iproute2 iptables
          python -m pip install -q -U yt-dlp
      - name: Acquire 720p source with original audio
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 35 https://www.vpngate.net/api/iphone/ -o vpn.csv
          python <<'PY'
          import csv,base64
          a=[]
          for r in csv.reader(open('vpn.csv',encoding='utf-8-sig',errors='replace')):
            if len(r)<15 or not r or r[0].startswith(('*','#')):continue
            cc=r[6].strip().upper()
            if cc not in {'VN','JP','KR'}:continue
            try:a.append((0 if cc=='VN' else 1,-int(r[2] or 0),cc,r[1],base64.b64decode(r[14]).decode('utf8','replace')))
            except:pass
          a.sort();a=a[:8]
          with open('vpns.tsv','w') as m:
            for i,(_,_,cc,ip,cfg) in enumerate(a):
              p=f'v{i}.ovpn';open(p,'w').write(cfg+'\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 7\n');m.write(f'{p}\t{cc}\t{ip}\n')
          PY
          sudo mkdir -p /etc/netns/vpnns; printf 'nameserver 1.1.1.1\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          sudo ip netns add vpnns; sudo ip link add vh type veth peer name vv; sudo ip link set vv netns vpnns
          sudo ip addr add 10.203.0.1/24 dev vh; sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.203.0.2/24 dev vv; sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set vv up; sudo ip netns exec vpnns ip route add default via 10.203.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null; W=$(ip route show default|awk '/default/{print $5;exit}')
          sudo iptables -t nat -A POSTROUTING -s 10.203.0.0/24 -o "$W" -j MASQUERADE; sudo iptables -A FORWARD -i vh -o "$W" -j ACCEPT; sudo iptables -A FORWARD -i "$W" -o vh -m state --state RELATED,ESTABLISHED -j ACCEPT
          Y=$(command -v yt-dlp);got=0
          while IFS=$'\t' read -r p cc ip;do
            [ -f /tmp/v.pid ]&&sudo kill "$(cat /tmp/v.pid)" 2>/dev/null||true;sudo rm -f /tmp/v.pid /tmp/v.log;sleep 1
            sudo ip netns exec vpnns openvpn --config "$GITHUB_WORKSPACE/$p" --daemon --writepid /tmp/v.pid --log /tmp/v.log||true
            tun=0;for n in $(seq 1 12);do sudo ip netns exec vpnns ip link show tun0 >/dev/null 2>&1&&{ tun=1;break;};sleep 1;done;[ "$tun" = 1 ]||continue
            eg=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 8 https://api.ipify.org||true);[ -n "$eg" ]||continue;echo "EGRESS=$eg $cc"
            rm -f source.*
            if timeout 360s sudo ip netns exec vpnns env PATH="$PATH" HOME="$HOME" "$Y" --no-playlist --retries 1 --fragment-retries 1 --socket-timeout 20 --js-runtimes node --remote-components ejs:github -f 'bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720]' --merge-output-format mp4 -o "$GITHUB_WORKSPACE/source.%(ext)s" 'https://www.youtube.com/watch?v=IrHTT2IEKpE';then
              f=$(find . -maxdepth 1 -name 'source.*' -type f|head -1);[ -n "$f" ]&&{ [ "$f" = './source.mp4' ]||mv "$f" source.mp4;got=1;break;}
            fi
          done<vpns.tsv
          [ "$got" = 1 ]||exit 22
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 source.mp4 | grep -q .
      - name: Get MONTAGEM XONADA preview
        run: |
          curl -fsSL --max-time 30 'https://itunes.apple.com/search?term=MONTAGEM%20XONADA%20MXZI%20Dj%20Samir%20DJ%20Javi26&entity=song&limit=50&country=US' -o itunes.json
          python <<'PY'
          import json
          d=json.load(open('itunes.json'))
          for x in d.get('results',[]):
            if (x.get('trackName') or '').strip().lower()=='montagem xonada' and x.get('previewUrl') and ('mxzi' in (x.get('artistName') or '').lower()):
              open('preview_url.txt','w').write(x['previewUrl']);print('TRACK',x.get('trackName'),x.get('artistName'));break
          else:raise SystemExit('NO_XONADA')
          PY
          curl -fL --max-time 45 -A 'Mozilla/5.0' "$(cat preview_url.txt)" -o xonada.m4a
      - name: Render story-first edit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clips qa
          python <<'PY'
          import subprocess
          segs=[(470,4,1.0),(484,6,1.5),(492,5,1.6666667),(510,4,1.0),(520,6,1.5),(528,14,2.0),(548,4,1.0)]
          with open('story_map.txt','w') as m:
            for i,(st,dur,sp) in enumerate(segs):m.write(f'{i}: {st:.1f}-{st+dur:.1f}s speed={sp:.4f} out={dur/sp:.3f}s\n')
          for i,(st,dur,sp) in enumerate(segs):
            fg='1056:594' if i==5 else '1024:576'
            fc=(f"[0:v]setpts=PTS/{sp},split=2[b][f];[b]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=30,eq=brightness=-0.22:saturation=0.74[b2];[f]scale={fg},eq=contrast=1.04:saturation=1.06,unsharp=5:5:0.18:5:5:0[f2];[b2][f2]overlay=(W-w)/2:(H-h)/2,fps=30,format=yuv420p[v];[0:a]atempo={sp},aresample=48000[a]")
            subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(st),'-i','source.mp4','-t',str(dur),'-filter_complex',fc,'-map','[v]','-map','[a]','-c:v','libx264','-preset','medium','-crf','18','-profile:v','high','-level','4.1','-pix_fmt','yuv420p','-c:a','aac','-b:a','160k','-ar','48000','-ac','2',f'clips/{i}.mp4'])
          open('list.txt','w').write(''.join(f"file 'clips/{i}.mp4'\n" for i in range(len(segs))))
          PY
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i list.txt -c copy story.mp4
          ffmpeg -hide_banner -loglevel error -y -i story.mp4 -i xonada.m4a -t 30 -filter_complex "[0:a]volume='if(lt(t,11),0.72,0.48)':eval=frame[sfx];[1:a]volume='if(lt(t,11),0.66,0.94)':eval=frame,bass=g=2.2:f=90[music];[sfx][music]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95[a]" -map 0:v -map '[a]' -c:v copy -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart solo_beru_xonada_v10.mp4
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,sample_rate,channels -show_entries format=duration,size,bit_rate -of default=nw=1 solo_beru_xonada_v10.mp4
          for t in 2 6 9 13 17 21 25 28;do ffmpeg -hide_banner -loglevel error -y -ss $t -i solo_beru_xonada_v10.mp4 -frames:v 1 qa/q_$t.jpg;done
      - name: Upload final
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: solo-beru-xonada-v10
          path: |
            solo_beru_xonada_v10.mp4
            story_map.txt
            qa/*.jpg
          retention-days: 3
      - name: Commit final manifest
        run: |
          mkdir -p audit/solo-beru-v10-final
          printf 'run_id=%s\nartifact_id=%s\n' '${{ github.run_id }}' '${{ steps.upload.outputs.artifact-id }}' > audit/solo-beru-v10-final/manifest.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add audit/solo-beru-v10-final/manifest.txt
          git commit -m 'Add Solo Beru V10 final manifest' || exit 0
          git pull --rebase origin main || true
          git push
