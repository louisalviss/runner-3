name: Wasmer Dashboard Theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasmer-dashboard-theme.yml'
      - 'scripts/wasmer-dashboard-theme.mjs'
      - 'wordpress-site/wp-content/themes/runner3-starter/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore account state
        shell: bash
        run: |
          set -euo pipefail
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-result.json
      - name: Package theme
        shell: bash
        run: cd wordpress-site/wp-content/themes && zip -qr /tmp/runner3-starter.zip runner3-starter
      - run: npm install --no-save playwright-core@1.58.2
      - name: Use WordPress Admin and apply theme
        run: node scripts/wasmer-dashboard-theme.mjs
      - name: Persist safe result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/wasmer-dashboard-theme.json || echo '{"status":"runner_error"}' > /tmp/wasmer-dashboard-theme.json
          cat /tmp/wasmer-dashboard-theme.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main && git reset --hard origin/main
          mkdir -p ops/wasmer
          cp /tmp/wasmer-dashboard-theme.json ops/wasmer/theme-status.json
          git add ops/wasmer/theme-status.json
          if ! git diff --cached --quiet; then git commit -m 'Persist Wasmer WordPress theme status'; git push origin HEAD:main; fi
