name: WR Cross Asset Public

on:
  pull_request:
    branches: [main]
    paths:
      - 'wave-rider-verify/wr_crossasset_backtest.py'
      - '.github/workflows/wr-crossasset-public.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  backtest:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        symbol: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, USDCHF, NZDUSD, EURJPY, GBPJPY, EURGBP, XAUUSD, US500, NAS100, AAPL, MSFT, NVDA, AMZN, META, TSLA]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install --disable-pip-version-check dukascopy-python pandas
      - name: Pin canonical v2.5.15 verifier
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
          python -m py_compile wave-rider-verify/wr_crossasset_backtest.py /tmp/reference_verify.py
      - name: Backtest ${{ matrix.symbol }}
        run: python wave-rider-verify/wr_crossasset_backtest.py --symbol '${{ matrix.symbol }}' --out /tmp/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-crossasset-${{ matrix.symbol }}
          path: /tmp/out
          retention-days: 14
          if-no-files-found: warn

  merge:
    if: always()
    needs: backtest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wr-crossasset-*
          path: /tmp/all
          merge-multiple: true
      - name: Merge
        run: python wave-rider-verify/wr_crossasset_backtest.py --merge-dir /tmp/all --out /tmp/final
      - uses: actions/upload-artifact@v4
        with:
          name: wr-crossasset-final
          path: /tmp/final
          retention-days: 14
