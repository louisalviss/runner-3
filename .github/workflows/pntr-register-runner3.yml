name: PNTR Register Runner3 Domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pntr-register-runner3.yml'
      - 'scripts/pntr-register-runner3.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pntr-runner3-domain
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check encryption secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || exit 2
          echo "::add-mask::$AUTOMATION_KEY"
      - run: npm install --no-save playwright-core@1.58.2
      - name: Register PNTR domain and CNAME
        run: node scripts/pntr-register-runner3.mjs
      - name: Persist encrypted PNTR session and safe status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/pntr-status.json || echo '{"status":"runner_error"}' >/tmp/pntr-status.json
          echo 'SAFE_PNTR_STATUS:'
          cat /tmp/pntr-status.json
          if test -f /tmp/pntr-browser-state.json; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
              -in /tmp/pntr-browser-state.json -out /tmp/pntr-browser-state.aes
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/pntr
            cp /tmp/pntr-status.json ops/pntr/domain-status.json
            if test -f /tmp/pntr-browser-state.aes; then cp /tmp/pntr-browser-state.aes ops/pntr/browser-state.aes; fi
            git add ops/pntr/domain-status.json
            test ! -f ops/pntr/browser-state.aes || git add ops/pntr/browser-state.aes
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m 'Persist PNTR domain provisioning state'
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep 2
          done
          test "$pushed" = true || exit 5
