name: WR Candidate3 Full Universe Transfer
on:
  pull_request:
    branches: [main]
    paths:
      - 'wave-rider-verify/wr_candidate3_full_universe.py'
      - '.github/workflows/wr-candidate3-full-universe.yml'
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ github.token }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - name: Run frozen Candidate3 across full WR 5m universe
        run: python3 wave-rider-verify/wr_candidate3_full_universe.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr-candidate3-full-universe-final
          path: /tmp/final
          retention-days: 14
