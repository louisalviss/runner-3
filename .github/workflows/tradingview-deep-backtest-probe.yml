name: TradingView Deep Backtesting Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-deep-backtest-probe.yml'
      - 'scripts/tradingview-deep-probe-snippet.js.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_SHA256: 9156e8c49b9a5e36007620f3e17fcab26c06714a3e32a252be52437ae23d6026
    steps:
      - uses: actions/checkout@v4
      - name: Restore session and canonical source
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
            -in ops/tradingview/session-state.json.aes -out /tmp/tv-state.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
            -in ops/tradingview/wave-rider-v2.5.13-window-report.pine.aes -out /tmp/wr2513.pine
          SHA="$(sha256sum /tmp/wr2513.pine | awk '{print $1}')"
          echo "TV_DEEP_SOURCE_SHA256=$SHA"
          test "$SHA" = "$EXPECTED_SHA256"
      - name: Build deep probe variant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/tradingview-wave-rider-e2e.mjs').read_text()
          marker="  let tradesButton=page.locator('[title=\"Trades\"]').first();"
          if marker not in s:
              raise SystemExit('patch marker missing')
          insert=Path('scripts/tradingview-deep-probe-snippet.js.txt').read_text()
          s=s.replace(marker,insert+'\n'+marker,1)
          Path('scripts/.tv-deep-probe-temp.mjs').write_text(s)
          PY
      - name: Compile canonical and probe deep backtesting
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node scripts/.tv-deep-probe-temp.mjs
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-deep-probe-${{ github.run_id }}
          path: |
            /tmp/tv-deep-probe.json
            /tmp/tv-deep-after-click.json
            /tmp/wr2513-e2e-report.txt
            /tmp/wr2513-trades-panel.png
          if-no-files-found: warn
          retention-days: 1
      - name: Cleanup plaintext
        if: always()
        run: rm -f /tmp/tv-state.json /tmp/wr2513.pine scripts/.tv-deep-probe-temp.mjs
