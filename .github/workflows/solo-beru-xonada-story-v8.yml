name: Solo Beru Xonada Story V8
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/solo-beru-xonada-story-v8.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl openvpn iproute2 iptables
          python -m pip install -q -U yt-dlp

      - name: Acquire Solo Leveling source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 35 https://www.vpngate.net/api/iphone/ -o vpn.csv
          python <<'PY'
          import csv,base64
          a=[]
          for r in csv.reader(open('vpn.csv',encoding='utf-8-sig',errors='replace')):
            if len(r)<15 or not r or r[0].startswith(('*','#')): continue
            cc=r[6].strip().upper()
            if cc not in {'VN','JP','KR'}: continue
            try:a.append((0 if cc=='VN' else 1,-int(r[2] or 0),cc,r[1],base64.b64decode(r[14]).decode('utf8','replace')))
            except:pass
          a.sort();a=a[:8]
          with open('vpns.tsv','w') as m:
            for i,(_,_,cc,ip,cfg) in enumerate(a):
              p=f'v{i}.ovpn';open(p,'w').write(cfg+'\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 7\n');m.write(f'{p}\t{cc}\t{ip}\n')
          PY
          sudo mkdir -p /etc/netns/vpnns;printf 'nameserver 1.1.1.1\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          sudo ip netns add vpnns;sudo ip link add vh type veth peer name vv;sudo ip link set vv netns vpnns
          sudo ip addr add 10.203.0.1/24 dev vh;sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.203.0.2/24 dev vv;sudo ip netns exec vpnns ip link set lo up;sudo ip netns exec vpnns ip link set vv up;sudo ip netns exec vpnns ip route add default via 10.203.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null;W=$(ip route show default|awk '/default/{print $5;exit}')
          sudo iptables -t nat -A POSTROUTING -s 10.203.0.0/24 -o "$W" -j MASQUERADE;sudo iptables -A FORWARD -i vh -o "$W" -j ACCEPT;sudo iptables -A FORWARD -i "$W" -o vh -m state --state RELATED,ESTABLISHED -j ACCEPT
          Y=$(command -v yt-dlp);got=0
          while IFS=$'\t' read -r p cc ip;do
            [ -f /tmp/v.pid ]&&sudo kill "$(cat /tmp/v.pid)" 2>/dev/null||true;sudo rm -f /tmp/v.pid /tmp/v.log;sleep 1
            sudo ip netns exec vpnns openvpn --config "$GITHUB_WORKSPACE/$p" --daemon --writepid /tmp/v.pid --log /tmp/v.log||true
            tun=0;for n in $(seq 1 12);do sudo ip netns exec vpnns ip link show tun0 >/dev/null 2>&1&&{ tun=1;break;};sleep 1;done;[ "$tun" = 1 ]||continue
            eg=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 8 https://api.ipify.org||true);[ -n "$eg" ]||continue;echo "EGRESS=$eg $cc"
            rm -f source.*
            if timeout 300s sudo ip netns exec vpnns env PATH="$PATH" HOME="$HOME" "$Y" --no-playlist --retries 1 --fragment-retries 1 --socket-timeout 20 --js-runtimes node --remote-components ejs:github -f 'bv*[height<=720][ext=mp4]/bv*[height<=720]' -o "$GITHUB_WORKSPACE/source.%(ext)s" 'https://www.youtube.com/watch?v=IrHTT2IEKpE';then
              f=$(find . -maxdepth 1 -name 'source.*' -type f|head -1);[ -n "$f" ]&&{ [ "$f" = './source.mp4' ]||mv "$f" source.mp4;got=1;break;}
            fi
          done<vpns.tsv
          [ "$got" = 1 ]||exit 22
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=nw=1 source.mp4

      - name: Get official MONTAGEM XONADA preview
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://itunes.apple.com/search?term=MONTAGEM%20XONADA%20MXZI%20Dj%20Samir%20DJ%20Javi26&entity=song&limit=50&country=US' -o itunes.json
          python <<'PY'
          import json
          d=json.load(open('itunes.json'));m=[]
          for x in d.get('results',[]):
            n=(x.get('trackName') or '').strip().lower();a=(x.get('artistName') or '').lower();u=x.get('previewUrl')
            if n=='montagem xonada' and u and ('mxzi' in a or 'samir' in a or 'javi26' in a):m.append(x)
          if not m:raise SystemExit('NO_XONADA_PREVIEW')
          print('TRACK',m[0].get('trackName'),'ARTIST',m[0].get('artistName'));open('preview_url.txt','w').write(m[0]['previewUrl'])
          PY
          curl -fL --max-time 45 -A 'Mozilla/5.0' "$(cat preview_url.txt)" -o xonada.m4a

      - name: Story-first render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clips
          python <<'PY'
          import subprocess,os
          # Four chronological macro-sequences: setup, clash, turning point, payoff.
          segs=[(112.0,7.0),(258.0,9.0),(338.0,7.0),(497.0,7.0)]
          for i,(st,dur) in enumerate(segs):
            flash="drawbox=x=0:y=0:w=iw:h=ih:color=white@0.07:t=fill:enable='lt(t,0.025)'," if i>0 else ''
            fc="[0:v]split=2[b][f];[b]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=32,eq=brightness=-0.23:saturation=0.72[b2];[f]scale=1024:576,eq=contrast=1.06:saturation=1.09,unsharp=5:5:0.28:5:5:0[f2];[b2][f2]overlay=(W-w)/2:(H-h)/2,"+flash+"fps=30,format=yuv420p[v]"
            subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(st),'-i','source.mp4','-t',str(dur),'-filter_complex',fc,'-map','[v]','-an','-c:v','libx264','-preset','medium','-crf','18','-profile:v','high','-level','4.1','-pix_fmt','yuv420p',f'clips/{i}.mp4'])
          open('list.txt','w').write(''.join(f"file 'clips/{i}.mp4'\n" for i in range(len(segs))))
          PY
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i list.txt -c copy visual.mp4
          ffmpeg -hide_banner -loglevel error -y -i visual.mp4 -i xonada.m4a -t 30 -map 0:v -map 1:a -c:v copy -af 'volume=.98,bass=g=3:f=90,alimiter=limit=.95' -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart solo_beru_xonada_story_v8.mp4
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,sample_rate,channels -show_entries format=duration,size,bit_rate -of default=nw=1 solo_beru_xonada_story_v8.mp4
          for t in 3 10 19 26;do ffmpeg -hide_banner -loglevel error -y -ss $t -i solo_beru_xonada_story_v8.mp4 -frames:v 1 qa_$t.jpg;done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: solo-beru-xonada-story-v8
          path: |
            solo_beru_xonada_story_v8.mp4
            qa_*.jpg
          retention-days: 3
