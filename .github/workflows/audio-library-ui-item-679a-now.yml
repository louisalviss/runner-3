name: Audio Library UI Item 679a Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-library-ui-item-679a-now.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ITEM_ID: 679a0c83-4d20-4d83-bc50-6413923f0175
  SOURCE_URL: https://www.reddit.com/r/askanything/comments/1vnhhuw/whats_a_subreddit_you_cant_believe_exists/
  CHATGPT_INBOX_PUBLIC_KEY: sYGZHQp2jOgHK7mnuF+Yij8rZOxYbgxKNOP4okx0k3E=

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: python -m pip install -q -U requests beautifulsoup4 lxml pypdf yt-dlp 'cryptography>=45,<47'
      - name: Extract raw and create encrypted inbox
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime,json,os,tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          import audio_library_extract_for_chatgpt as ex
          item=os.environ['ITEM_ID']; url=os.environ['SOURCE_URL']; recipient=os.environ['CHATGPT_INBOX_PUBLIC_KEY']
          with tempfile.TemporaryDirectory() as td:
              title,raw,label,canonical=ex.extract_source(url,Path(td))
          raw=ex.clean_text(raw)
          raw,truncated=ex.trim_raw(raw)
          if len(raw)<400: raise SystemExit('raw too short')
          payload={'id':item,'sourceUrl':url,'canonicalUrl':canonical,'sourceLabel':label,'title':title,'rawText':raw,'rawTruncated':truncated,'extractedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'editorPolicy':'RAW_SOURCE_ONLY_NO_TRANSLATION_NO_SUMMARY_NO_LLM'}
          env=ex.encrypt_payload(payload,recipient)
          inbox=Path('ops/audio-library/chatgpt-inbox'); inbox.mkdir(parents=True,exist_ok=True)
          (inbox/f'{item}.json').write_text(json.dumps(env,separators=(',',':'))+'\n')
          Path('/tmp/source.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          safe={'status':'ready','itemId':item,'title':title,'sourceLabel':label,'canonicalUrl':canonical,'chars':len(raw),'rawTruncated':truncated,'updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          Path('ops/audio-library/ui-item-679a-extract-status.json').write_text(json.dumps(safe,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audio-ui-679a-raw
          path: /tmp/source.json
          retention-days: 1
          if-no-files-found: error
      - name: Publish encrypted inbox and pointer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('ops/audio-library/ui-item-679a-extract-status.json')
          d=json.loads(p.read_text())
          d['runId']=int(os.environ['GITHUB_RUN_ID']); d['artifactName']='audio-ui-679a-raw'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "ops/audio-library/chatgpt-inbox/${ITEM_ID}.json" ops/audio-library/ui-item-679a-extract-status.json
          git commit -m 'Stage UI Reddit 679a for ChatGPT [skip ci]' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
