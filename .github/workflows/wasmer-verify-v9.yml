name: Wasmer Account Verify v9
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wasmer-verify-v9.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Generate ephemeral X25519 receiver key
        run: |
          openssl genpkey -algorithm X25519 -out /tmp/receiver-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/receiver-private.pem -pubout -out receiver-public.pem >/dev/null 2>&1
      - name: Upload public handoff key
        uses: actions/upload-artifact@v4
        with:
          name: wasmer-x25519-key-${{ github.run_id }}
          path: receiver-public.pem
          retention-days: 1
      - name: Receive encrypted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/wasmer-session/${GITHUB_RUN_ID}"
          for i in $(seq 1 180); do
            ok=1
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.raw+json" "${BASE}.sender.pem?ref=main" -o /tmp/sender-public.pem 2>/dev/null || ok=0
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.raw+json" "${BASE}.enc.b64?ref=main" -o /tmp/session.enc.b64 2>/dev/null || ok=0
            [ "$ok" = 1 ] && break
            sleep 2
          done
          test -s /tmp/sender-public.pem && test -s /tmp/session.enc.b64
          openssl pkeyutl -derive -inkey /tmp/receiver-private.pem -peerkey /tmp/sender-public.pem -out /tmp/shared.bin
          base64 -d /tmp/session.enc.b64 > /tmp/session.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -in /tmp/session.enc -out /tmp/session.json -pass file:/tmp/shared.bin
          python - <<'PY'
          import json
          x=json.load(open('/tmp/session.json'))
          for k in ['wasmer_user','wasmer_password','app_name']:
              assert x.get(k), k
          for v in x.values(): print('::add-mask::'+v)
          print('HANDOFF_DECRYPTED=true')
          PY
      - name: Install Playwright
        run: npm install --no-save playwright-core@1.58.2
      - name: Inspect verification and complete only safe zero-input step
        run: |
          cat > verify-v9.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const id=JSON.parse(fs.readFileSync('/tmp/session.json','utf8'));
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();
          const mask=s=>(s||'').replaceAll(id.wasmer_user,'[MASKED_USER]').replaceAll(id.wasmer_password,'[MASKED_PASSWORD]');
          async function body(){return (await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim()}
          async function report(label){
            const c=await page.locator('input,select,textarea,button,a').evaluateAll(els=>els.map(e=>({tag:e.tagName,type:e.type||'',name:e.name||'',placeholder:e.placeholder||'',required:!!e.required,text:(e.innerText||e.value||'').replace(/\s+/g,' ').trim().slice(0,120),href:e.href||''})).filter(x=>x.text||x.placeholder||x.name).slice(0,150)).catch(()=>[]);
            console.log(label+'_URL='+page.url().replace(/([?&](?:token|secret|challenge|code)=)[^&]+/ig,'$1[MASKED]'));
            console.log(label+'_BODY='+mask((await body()).slice(0,3000)));
            console.log(label+'_CONTROLS='+mask(JSON.stringify(c)));
          }
          async function login(){
            await page.goto('https://wasmer.io/login',{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(700);
            const u=page.locator('input[name="username"]').first();await u.fill(id.wasmer_user);
            let f=page.locator('form').first();if(await f.count())await f.evaluate(x=>x.requestSubmit());else await u.press('Enter');
            await page.waitForTimeout(1600);
            const p=page.locator('input[type="password"]').first();if(!await p.count())throw Error('password field missing');await p.fill(id.wasmer_password);
            f=page.locator('form').first();if(await f.count())await f.evaluate(x=>x.requestSubmit());else await p.press('Enter');await page.waitForTimeout(1800);
          }
          try{
            await login();
            await page.goto('https://wasmer.io/verify',{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(1200);
            await report('VERIFY_PAGE');
            const txt=(await body()).toLowerCase();
            const sensitive=/credit card|payment method|card number|phone number|sms|identity|government|passport|kyc|billing|address|company registration|tax id/i.test(txt);
            console.log('VERIFY_REQUIRES_SENSITIVE='+sensitive);
            const inputs=await page.locator('input:visible,select:visible,textarea:visible').count();
            console.log('VERIFY_VISIBLE_INPUTS='+inputs);
            if(!sensitive && inputs===0){
              const btn=page.getByRole('button',{name:/verify|continue|confirm|claim|complete/i}).first();
              if(await btn.count()){
                await btn.click();await page.waitForTimeout(1800);await report('VERIFY_AFTER_ACTION');console.log('VERIFY_AUTO_ACTION=true');
              }
            }
            await page.goto(`https://wasmer.io/apps/${id.wasmer_user}/${id.app_name}`,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(800);
            const dash=await body();
            console.log('APP_STILL_LIMITED='+/verify your account|expire in|expiring/i.test(dash.toLowerCase()));
            console.log('APP_DASH_SAMPLE='+mask(dash.slice(0,1500)));
          }finally{await browser.close()}
          JS
          node verify-v9.mjs
      - name: Destroy secrets
        if: always()
        run: |
          shred -u /tmp/receiver-private.pem /tmp/shared.bin /tmp/session.json /tmp/session.enc /tmp/session.enc.b64 /tmp/sender-public.pem 2>/dev/null || true
          rm -f receiver-public.pem verify-v9.mjs
