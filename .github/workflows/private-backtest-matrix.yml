name: Private Backtest Matrix

on:
  push:
    branches: [main]
    paths:
      - 'jobs/private-backtest-v3.enc.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-backtest-${{ github.sha }}
  cancel-in-progress: false

jobs:
  stage:
    name: encrypted-stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stage crypto
        run: python -m pip install --disable-pip-version-check -q 'cryptography>=45,<47'
      - name: Decrypt compressed request and stage private package
        run: python tools/private_backtest_stage_v3.py --request jobs/private-backtest-v3.enc.json

  shard:
    name: shard-${{ matrix.shard }}
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frozen backtest runtime
        run: python -m pip install --disable-pip-version-check -q 'dukascopy-python==4.0.1' 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Run private shard with strict summary validation
        run: python tools/private_backtest_shard_strict.py --request jobs/private-backtest-v3.enc.json --shard '${{ matrix.shard }}'

  evaluate:
    name: merge-and-evaluate
    if: always() && needs.stage.result == 'success'
    needs: [stage, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frozen evaluator runtime
        run: python -m pip install --disable-pip-version-check -q 'dukascopy-python==4.0.1' 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Merge private shards and evaluate
        run: python tools/private_backtest_worker_v2.py evaluate --request jobs/private-backtest-v3.enc.json
