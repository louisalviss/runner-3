name: Private Backtest Matrix

on:
  push:
    branches: [main]
    paths:
      - 'jobs/private-backtest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-backtest-matrix
  cancel-in-progress: false

jobs:
  shard:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frozen backtest runtime
        run: python -m pip install --disable-pip-version-check -q 'dukascopy-python==4.0.1' 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Run private shard
        run: python tools/private_backtest_worker.py shard --request jobs/private-backtest.json --shard '${{ matrix.shard }}'

  evaluate:
    name: merge-and-evaluate
    if: always()
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frozen evaluator runtime
        run: python -m pip install --disable-pip-version-check -q 'dukascopy-python==4.0.1' 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Merge private shards and evaluate
        run: python tools/private_backtest_worker.py evaluate --request jobs/private-backtest.json
