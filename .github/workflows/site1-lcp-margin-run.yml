name: Site1 LCP Margin Run

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/site1-lcp-margin-run.yml'

permissions:
  contents: read

concurrency:
  group: runner3wp-site1-lcp-margin-run
  cancel-in-progress: true

env:
  PROD_DOMAIN: https://runner3wp.pntr.dev
  CANONICAL_REF: perf/site1-lcp090-canonical-20260824
  ROLLBACK_SHA: 9124f5957e176ffc9aa64444c980f3c5d6642a0d

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout canonical source and prepare
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CANONICAL_REF"
          git checkout --detach "origin/$CANONICAL_REF"
          npm install --no-save sharp@0.34.3 playwright-core@1.61.0 >/dev/null
          C="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$C"
          echo "CHROME_PATH=$C" >> "$GITHUB_ENV"

      - name: Compare three inline hero payloads
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/results.tsv

          run_candidate() {
            local label="$1" width="$2" quality="$3"
            echo "=== $label width=$width quality=$quality ==="
            git checkout -- edge/wordpress-edge-proxy/src/snapshot.generated.js
            node scripts/build-wordpress-edge-snapshot.mjs >/tmp/${label}-snapshot.log
            SITE1_INLINE_HERO_MARKER="$label" \
              SITE1_INLINE_HERO_WIDTH="$width" \
              SITE1_INLINE_HERO_QUALITY="$quality" \
              node scripts/build-site1-mobile-inline-hero.mjs | tee /tmp/${label}-hero.log

            npx --yes wrangler@4.124.0 deploy --config edge/wordpress-edge-proxy/wrangler.jsonc >/tmp/${label}-deploy.log 2>&1
            sleep 5

            ok=0
            for attempt in 1 2 3 4 5 6; do
              B="__margin=${label}-$(date +%s%N)-$attempt"
              if curl -fsS -H 'Cache-Control: no-cache' -D /tmp/${label}.h -o /tmp/${label}.html "$PROD_DOMAIN/?$B" \
                && grep -q "data-runner3-mobile-inline-lcp=\"$label\"" /tmp/${label}.html \
                && grep -Eiq '^x-edge-snapshot:[[:space:]]*HIT' /tmp/${label}.h \
                && grep -Eiq '^x-edge-cache-policy:[[:space:]]*snapshot-direct' /tmp/${label}.h; then
                ok=1
                break
              fi
              sleep 4
            done
            test "$ok" = 1
            ! grep -Eiq '^link:.*r2\.dev.*preconnect' /tmp/${label}.h

            for i in 1 2 3; do
              PSI_URL="$PROD_DOMAIN/" PSI_UI_OUT="/tmp/${label}-psi-$i.json" timeout 330s node scripts/pagespeed-ui-mobile-audit.mjs
            done

            LABEL="$label" WIDTH="$width" QUALITY="$quality" node --input-type=module - <<'NODE'
            import fs from 'node:fs';
            const label=process.env.LABEL;
            function sec(v){const m=String(v??'').trim().match(/^([0-9.]+)\s*(ms|s)?$/);if(!m)return null;const n=Number(m[1]);return m[2]==='ms'?n/1000:n;}
            const rows=[];
            for(let i=1;i<=3;i++){
              const d=JSON.parse(fs.readFileSync(`/tmp/${label}-psi-${i}.json`,'utf8'));
              rows.push({performance:d.performance,fcp:sec(d.fcp),lcp:sec(d.lcp),url:d.resultUrl});
            }
            const lcp=rows.map(r=>r.lcp).sort((a,b)=>a-b);
            const fcp=rows.map(r=>r.fcp).sort((a,b)=>a-b);
            const s={label,width:Number(process.env.WIDTH),quality:Number(process.env.QUALITY),medianLcp:lcp[1],medianFcp:fcp[1],p100:rows.filter(r=>r.performance===100).length,rows};
            console.log('CANDIDATE_RESULT',JSON.stringify(s));
            fs.appendFileSync('/tmp/results.tsv',`${label}\t${s.width}\t${s.quality}\t${s.medianLcp}\t${s.medianFcp}\t${s.p100}\n`);
NODE
          }

          run_candidate w320q58 320 58
          run_candidate w280q66 280 66
          run_candidate w240q74 240 74
          echo '=== SUMMARY ==='
          cat /tmp/results.tsv

      - name: Restore known-safe production
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fd
          git checkout --detach "$ROLLBACK_SHA"
          node scripts/build-wordpress-edge-snapshot.mjs
          npx --yes wrangler@4.124.0 deploy --config edge/wordpress-edge-proxy/wrangler.jsonc >/tmp/rollback.log 2>&1
          sleep 5
          B="__rollback=$(date +%s%N)"
          curl -fsS -H 'Cache-Control: no-cache' -D /tmp/rh -o /tmp/rhome "$PROD_DOMAIN/?$B"
          grep -Eiq '^x-edge-snapshot:[[:space:]]*HIT' /tmp/rh
          grep -Eiq '^x-edge-cache-policy:[[:space:]]*snapshot-direct' /tmp/rh
          echo ROLLBACK_VERIFIED
