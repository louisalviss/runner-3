name: Runner3 Core Deploy Trigger 2 (Legacy, No Deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

# Retired duplicate deploy trigger. Production runner3-core deployment is
# owned exclusively by runner3-core-public-hosted-reader-deploy.yml.
jobs:
  legacy-no-deploy:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'LEGACY_RUNNER3_CORE_TRIGGER_2_DISABLED=PASS'
          echo 'Production deploy owner: runner3-core-public-hosted-reader-deploy.yml'
