name: SPMO Invesco Historical Probe
on:
  push:
    branches: [main]
    paths:
      - 'spmo-backtest/probe_invesco_historical_holdings.py'
      - '.github/workflows/spmo-probe-invesco-historical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python spmo-backtest/probe_invesco_historical_holdings.py
