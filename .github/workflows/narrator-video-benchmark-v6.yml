name: Narrator Video Benchmark v6

on:
  pull_request:
    paths:
      - '.runner-narrator-v6-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl fonts-noto-core espeak-ng
          python -m pip install -q -U edge-tts gTTS
      - name: Render benchmark
        run: bash scripts/narrator_benchmark_v5.sh
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner3-narrator-benchmark-v6
          path: artifacts/runner3-narrator-v5
          if-no-files-found: warn
          retention-days: 3
