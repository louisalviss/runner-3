name: Ebook Reader v30 Dark Highlight Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ebook-reader-v29-state-guard-smoke.yml'
      - 'cloudflare/runner3-core/artifact-library-reader-v30-dark-highlight-entry.js'
      - 'cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js'

permissions:
  contents: read

jobs:
  deploy-v30:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PINNED_SOURCE: 0254139359d5999deee9e04dc0cca9d8773cc538
    steps:
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "MISSING:$name" >&2; exit 2; }
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PINNED_SOURCE }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose canonical mailbox with Reader v30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('cloudflare/runner3-core')
          mailbox=root/'mailbox-entry.js'
          text=mailbox.read_text(encoding='utf-8')
          old='import app from "./audio-entry.js";'
          new='import app from "./artifact-library-reader-v7-github-audio-entry.js";'
          if old not in text: raise SystemExit('canonical mailbox import marker missing')
          mailbox.write_text(text.replace(old,new,1),encoding='utf-8')
          cfg_path=root/'wrangler.jsonc'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['main']='mailbox-entry.js'
          cfg_path.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/mailbox-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v30-dark-highlight-entry.js
          grep -q 'artifact-library-reader-v30-dark-highlight-entry.js' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
      - name: Deploy Reader v30 Core
        working-directory: cloudflare/runner3-core
        shell: bash
        run: |
          set -euo pipefail
          export NO_COLOR=1
          npx --yes wrangler@4 deploy
      - name: Verify v30 live
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -sS -D /tmp/h -o /tmp/reader -w '%{http_code}' "$core/artifact-library/read?key=$encoded")"
            tr -d '\r' </tmp/h >/tmp/h.clean
            if [ "$code" = 200 ] && grep -qi '^x-r3-reader-runtime: v30-dark-highlight$' /tmp/h.clean && grep -q 'window.__r3AudioDarkHighlightV30=true' /tmp/reader; then ok=1; break; fi
            echo "WAIT_V30 attempt=$attempt http=$code runtime=$(grep -i '^x-r3-reader-runtime:' /tmp/h.clean || true)"
            sleep 1
          done
          test "$ok" = 1
          echo 'READER_V30_LIVE=PASS'

  browser-proof:
    needs: deploy-v30
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      EBOOK_BROWSER_SMOKE_BOOK_KEY: core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Adapt viewport proof to dark highlight v30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p='scripts/ebook_reader_viewport_word_smoke.mjs'
          s=open(p,encoding='utf-8').read()
          s=s.replace("const TEST_ID = 'seek-smoke-v16';","const TEST_ID = 'seek-smoke-v30';")
          s=s.replace("runtime.includes('v16')","runtime.includes('v30')")
          s=s.replace('live Reader is not v16:','live Reader is not v30:')
          old='window.__r3AudioViewportWordV15 === true && window.__r3AudioOuterGeometryV16 === true'
          new='window.__r3AudioViewportWordV15 === true && window.__r3AudioDarkHighlightV30 === true'
          if old not in s: raise SystemExit('runtime marker missing')
          s=s.replace(old,new,1)
          anchor="  await page.locator('#r3AudioMain').click();"
          inject="  await page.evaluate(() => { document.body.dataset.theme='dark'; try{localStorage.setItem('r3-reader-theme','dark');}catch{} });\n  await page.waitForTimeout(650);\n"+anchor
          if anchor not in s: raise SystemExit('play anchor missing')
          s=s.replace(anchor,inject,1)
          oldassert="  if (!started.active) throw new Error('bold active paragraph missing after viewport-word start');"
          lines=[
            "  if (!started.active) throw new Error('active paragraph missing after viewport-word start');",
            "  const darkHighlight = await page.evaluate(() => {",
            "    for (const frame of document.querySelectorAll('#viewer iframe')) {",
            "      try {",
            "        const doc=frame.contentDocument;",
            "        const el=doc?.querySelector('[data-r3-audio-reading-v11=\\\"1\\\"]');",
            "        if(!el)continue;",
            "        const cs=doc.defaultView.getComputedStyle(el);",
            "        return { backgroundColor:cs.backgroundColor, boxShadow:cs.boxShadow, fontWeight:cs.fontWeight, theme:doc.documentElement.dataset.r3OuterTheme||'', stylePresent:Boolean(doc.getElementById('r3AudioDarkHighlightV30Style')) };",
            "      } catch {}",
            "    }",
            "    return null;",
            "  });",
            "  console.log(JSON.stringify({phase:'dark-highlight-v30', darkHighlight}));",
            "  if (!darkHighlight?.stylePresent) throw new Error('v30 iframe highlight style missing');",
            "  if (darkHighlight.theme !== 'dark') throw new Error('v30 iframe dark theme not synced: '+JSON.stringify(darkHighlight));",
            "  if (!darkHighlight.backgroundColor || darkHighlight.backgroundColor === 'rgba(0, 0, 0, 0)' || darkHighlight.backgroundColor === 'transparent') throw new Error('dark active background is transparent: '+JSON.stringify(darkHighlight));",
            "  if (!darkHighlight.boxShadow || darkHighlight.boxShadow === 'none') throw new Error('dark active passage has no contrast bar: '+JSON.stringify(darkHighlight));",
          ]
          newassert='\n'.join(lines)
          if oldassert not in s: raise SystemExit('active assertion missing')
          s=s.replace(oldassert,newassert,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Install browser runtime dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Prove active passage is visible in dark mode
        run: node scripts/ebook_reader_viewport_word_smoke.mjs
