name: Cloudflare D1 Account-Wide Schema Diff (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-accountwide-schema-diff-readonly
  cancel-in-progress: false

jobs:
  schema-parity:
    if: ${{ github.repository == 'louisalviss/runner-3' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed synthetic tests without secrets
        run: |
          python3 -m py_compile scripts/cloudflare_d1_cross_account_schema_live_readonly.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_cross_account_schema_live_readonly.py' -v
      - name: Compare source and target D1 schema metadata without writing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TARGET_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/cloudflare_d1_cross_account_schema_live_readonly.py
      - name: Upload counts only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-d1-accountwide-schema-parity-readonly
          path: migration-out/d1-cross-account-schema-parity-readonly.json
          if-no-files-found: error
          retention-days: 3
