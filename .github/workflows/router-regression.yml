name: Public Retrieval Router Regression

on:
  push:
    branches: [main]
    paths:
      - 'jobs/router-regression/*.json'
      - 'jobs/router-regression/**/*.json'
  workflow_dispatch:
    inputs:
      job_file:
        description: 'Path to router regression job JSON'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: router-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve job
        id: job
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB_FILE='${{ inputs.job_file }}'
          else
            JOB_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'jobs/router-regression/*.json' 'jobs/router-regression/**/*.json' | tail -n 1 || true)"
          fi
          test -n "$JOB_FILE" && test -f "$JOB_FILE"
          echo "job_file=$JOB_FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validate
        run: python crawler_aiua.py '${{ steps.job.outputs.job_file }}' --validate-only

      - name: Run router HTTP + AI-UA + browser
        id: crawl
        continue-on-error: true
        run: python crawler_aiua.py '${{ steps.job.outputs.job_file }}' --output router_output

      - name: Persist regression result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f router_output/manifest.json || exit 1
          JOB_FILE='${{ steps.job.outputs.job_file }}'
          SLUG="$(basename "$JOB_FILE" .json)"
          DEST="results/router-regression/$SLUG"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a router_output/. "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git diff --cached --quiet && exit 0
          git commit -m "Store router regression result: $SLUG [skip ci]"
          for n in 1 2 3; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep "$n"
          done
          exit 1

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-regression-${{ github.run_id }}
          path: router_output/
          if-no-files-found: warn
          retention-days: 3

      - name: Fail if crawl failed
        if: steps.crawl.outcome != 'success'
        run: exit 1
