name: Audio Library Wrap Ciphertext

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audio_library_wrap_ciphertext.py'
      - '.github/workflows/audio-library-wrap-ciphertext.yml'

permissions:
  contents: write

jobs:
  wrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wrap encrypted inbox ciphertext
        run: python scripts/audio_library_wrap_ciphertext.py | tee /tmp/wrap-result.json
      - name: Publish wrapped ciphertext
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/wrap-result.json ops/audio-library/chatgpt-wrap-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/audio-library/chatgpt-inbox-wrapped/ ops/audio-library/chatgpt-wrap-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish wrapped ChatGPT inbox ciphertext [skip ci]'
          git pull --rebase origin main || true
          git push origin HEAD:main
