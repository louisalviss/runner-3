name: Pet Aftercare Data Validation

on:
  push:
    paths:
      - '.github/workflows/pet-aftercare-data-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - name: Crawl provider sample
        run: python scripts/pet_aftercare_validate.py
      - name: Persist validation result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pet-aftercare-validation/
          git commit -m 'Save pet aftercare validation sample' || exit 0
          git push
