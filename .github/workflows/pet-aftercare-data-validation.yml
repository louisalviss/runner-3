name: Pet Aftercare Data Validation

on:
  push:
    paths:
      - '.github/workflows/pet-aftercare-data-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - name: Crawl provider sample
        run: |
          cat > /tmp/validate_pet_aftercare.py <<'PY'
          import csv, json, re, time, random
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          UA = 'Mozilla/5.0 (compatible; PetAftercareValidation/1.0; research validation)'
          S = requests.Session(); S.headers.update({'User-Agent': UA, 'Accept-Language':'en-US,en;q=0.9'})
          base = 'https://findpetcremations.com'
          states = ['texas','california','florida','ohio','arizona']
          exclude_domains = {
              'findpetcremations.com','facebook.com','instagram.com','youtube.com','youtu.be','google.com','maps.google.com',
              'twitter.com','x.com','linkedin.com','tiktok.com','yelp.com','bbb.org','apple.com'
          }

          def get(url, timeout=15):
              try:
                  r=S.get(url,timeout=timeout,allow_redirects=True)
                  if r.status_code==200 and 'text/html' in r.headers.get('content-type',''):
                      return r
              except Exception:
                  return None
              return None

          def clean_text(html):
              s=BeautifulSoup(html,'lxml')
              for x in s(['script','style','noscript','svg']): x.decompose()
              return ' '.join(s.stripped_strings)

          # Seed profiles from public state directory pages.
          profiles=[]
          for st in states:
              for page in range(1,7):
                  u=f'{base}/directory/{st}' + ('' if page==1 else f'?page={page}')
                  r=get(u)
                  if not r: continue
                  soup=BeautifulSoup(r.text,'lxml')
                  before=len(profiles)
                  for a in soup.select('a[href]'):
                      h=a.get('href','')
                      if '/directory/provider/' in h:
                          full=urljoin(base,h).split('#')[0]
                          if full not in profiles: profiles.append(full)
                  if len(profiles)==before and page>=3:
                      break
                  time.sleep(0.15)

          # deterministic broad sample
          profiles=profiles[:180]

          def external_site(profile_url, html):
              soup=BeautifulSoup(html,'lxml')
              candidates=[]
              for a in soup.select('a[href]'):
                  h=a.get('href','').strip()
                  if not h.startswith('http'): continue
                  host=urlparse(h).netloc.lower().replace('www.','')
                  if not host or any(host==d or host.endswith('.'+d) for d in exclude_domains): continue
                  candidates.append(h)
              # prefer link text indicating site, otherwise first unique external
              for a in soup.select('a[href]'):
                  h=a.get('href','').strip(); txt=' '.join(a.stripped_strings).lower()
                  if not h.startswith('http'): continue
                  host=urlparse(h).netloc.lower().replace('www.','')
                  if any(host==d or host.endswith('.'+d) for d in exclude_domains): continue
                  if 'website' in txt or 'visit' in txt or host in clean_text(html).lower(): return h
              return candidates[0] if candidates else None

          def score_pages(site):
              r=get(site)
              if not r: return {'site_ok':False}
              root=r.url
              pages=[(root,r.text)]
              soup=BeautifulSoup(r.text,'lxml')
              links=[]
              keys=('price','pricing','crem','aftercare','service','aquam','memorial','pet-loss','end-of-life')
              root_host=urlparse(root).netloc.lower().replace('www.','')
              for a in soup.select('a[href]'):
                  h=urljoin(root,a.get('href','')).split('#')[0]
                  p=urlparse(h)
                  host=p.netloc.lower().replace('www.','')
                  label=(' '.join(a.stripped_strings)+' '+p.path).lower()
                  if host==root_host and any(k in label for k in keys):
                      if h not in links and h!=root: links.append(h)
              for h in links[:5]:
                  rr=get(h)
                  if rr: pages.append((rr.url,rr.text))
                  time.sleep(0.08)
              text=' '.join(clean_text(h) for _,h in pages)
              low=text.lower()
              dollar_vals=re.findall(r'\$\s?([0-9]{2,4}(?:\.\d{1,2})?)', text)
              # conservative: pricing signal requires money + cremation/aftercare context
              pet_context=any(k in low for k in ['pet crem','dog crem','cat crem','aquamation','pet aftercare','animal crem'])
              has_prices=pet_context and len(dollar_vals)>=2
              weight_hits=re.findall(r'(?:\d{1,3}\s*(?:-|to)\s*\d{1,3}|under\s+\d{1,3}|over\s+\d{1,3}|\d{1,3}\+?)\s*(?:lb|lbs|pounds)', low)
              turnaround=bool(re.search(r'(?:return|ready|ashes|remains).{0,80}\b(?:\d+\s*(?:business\s*)?(?:day|days|hour|hours)|same[- ]day|next[- ]day)\b', low))
              pickup=any(k in low for k in ['home pickup','at-home pickup','pick up your pet','pickup service','transportation service','pet pickup'])
              private=('private cremation' in low or 'individual cremation' in low)
              communal=('communal cremation' in low or 'group cremation' in low)
              aqua=('aquamation' in low or 'alkaline hydrolysis' in low or 'water cremation' in low)
              emergency=any(k in low for k in ['24/7','24-hour','24 hour','after hours','emergency pickup'])
              inclusions=any(k in low for k in ['urn included','includes urn','paw print included','clay paw','ink paw','keepsake included'])
              return {
                  'site_ok': True,
                  'final_url': root,
                  'pages_crawled': len(pages),
                  'price_values_found': len(dollar_vals),
                  'has_exact_price_signal': has_prices,
                  'has_weight_tiers': len(weight_hits)>=2 and has_prices,
                  'has_pickup': pickup,
                  'has_turnaround': turnaround,
                  'has_private': private,
                  'has_communal': communal,
                  'has_aquamation': aqua,
                  'has_24_7': emergency,
                  'has_inclusions': inclusions,
                  'sample_prices': dollar_vals[:8],
                  'source_pages': [u for u,_ in pages[:6]],
              }

          rows=[]
          for i,purl in enumerate(profiles,1):
              pr=get(purl)
              if not pr:
                  rows.append({'profile_url':purl,'profile_ok':False}); continue
              txt=clean_text(pr.text)
              soup=BeautifulSoup(pr.text,'lxml')
              name=(soup.find('h1').get_text(' ',strip=True) if soup.find('h1') else '')
              site=external_site(purl,pr.text)
              rec={'profile_url':purl,'profile_ok':True,'name':name,'provider_site':site,
                   'fpc_pricing_verified': 'Pricing has not yet been verified' not in txt and ('$' in txt or 'from $' in txt.lower())}
              if site: rec.update(score_pages(site))
              else: rec['site_ok']=False
              rows.append(rec)
              if i%20==0: print('processed',i,'of',len(profiles),flush=True)
              time.sleep(0.12)

          def rate(key, denom=None):
              vals=[r for r in rows if (denom(r) if denom else True)]
              if not vals: return {'n':0,'count':0,'pct':0}
              c=sum(bool(r.get(key)) for r in vals)
              return {'n':len(vals),'count':c,'pct':round(100*c/len(vals),1)}

          accessible=[r for r in rows if r.get('site_ok')]
          summary={
              'captured_at_utc': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'seed_states':states,
              'profiles_sampled':len(rows),
              'provider_sites_found':sum(bool(r.get('provider_site')) for r in rows),
              'provider_sites_accessible':len(accessible),
              'rates_all_profiles': {
                  'fpc_pricing_verified':rate('fpc_pricing_verified'),
                  'provider_site_found':rate('provider_site'),
              },
              'rates_accessible_sites': {
                  k:rate(k,lambda r:r.get('site_ok')) for k in [
                      'has_exact_price_signal','has_weight_tiers','has_pickup','has_turnaround','has_private','has_communal','has_aquamation','has_24_7','has_inclusions'
                  ]
              },
              'notes':'Automated validation; price detection is conservative heuristic and should be manually spot-checked.'
          }
          Path('pet-aftercare-validation').mkdir(exist_ok=True)
          Path('pet-aftercare-validation/summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          Path('pet-aftercare-validation/sample.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          fields=sorted(set().union(*(r.keys() for r in rows)))
          with open('pet-aftercare-validation/sample.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          print(json.dumps(summary,indent=2))
          PY
          python /tmp/validate_pet_aftercare.py
      - name: Persist validation result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pet-aftercare-validation/
          git commit -m 'Save pet aftercare validation sample' || exit 0
          git push
