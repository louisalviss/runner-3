name: VBTH R2 Seed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vbth-r2-seed.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: vbth-r2-seed
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: runner3-artifacts

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discover exact legacy VBTH files in live Actions artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vbth-seed/found /tmp/vbth-seed/zips
          python - <<'PY'
          import hashlib, io, json, os, re, urllib.request, zipfile
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GITHUB_TOKEN']
          api='https://api.github.com'
          targets={
            'master': {
              'filename':'Vuong_Bai_Tien_Hoa_Quyen_Tho_FULL_clean.epub',
              'sha256':'f09a40ed0dc3dc54593a1e8be3700607575056fb3cb8ad620add9d138bc72685',
              'r2_key':'ebooks/vbth/source/Vuong_Bai_Tien_Hoa_Quyen_Tho_FULL_clean.epub',
              'required':True,
            },
            'v3': {
              'filename':'Vuong_Bai_Tien_Hoa_FULL_Bien_Tap_V3.epub',
              'sha256':'71bf17e92e7bf75ed67cf5a528b92f9b65193cc9278da0c10ee6b59fbfc6c41f',
              'r2_key':'ebooks/vbth/legacy/Vuong_Bai_Tien_Hoa_FULL_Bien_Tap_V3.epub',
              'required':False,
            },
            'gold': {
              'filename':'Vuong_Bai_Tien_Hoa_Gold_3_Chuong.epub',
              'sha256':'48ee9ad003eef5678fb398192f80195e86b0cb9c4c86a356ff30b812eb005235',
              'r2_key':'ebooks/vbth/config/gold/Vuong_Bai_Tien_Hoa_Gold_3_Chuong.epub',
              'required':True,
            },
            'source_index': {
              'filename':'SOURCE_INDEX.json',
              'sha256':'444ad94638de8571322df95157ca427ee3344cc60e8c1e083608ab1903c324da',
              'r2_key':'ebooks/vbth/source/SOURCE_INDEX.json',
              'required':True,
            },
            'editorial_sample': {
              'filename':'vuong_bai_tien_hoa_mau_bien_tap_2_chuong.txt',
              'sha256':'e15d5eb43b55233f376b918d74a3ab1473fbae253e7aaebd4fd5c916df893cd1',
              'r2_key':'ebooks/vbth/config/vuong_bai_tien_hoa_mau_bien_tap_2_chuong.txt',
              'required':True,
            },
          }
          by_hash={v['sha256']: k for k,v in targets.items()}

          def req(url):
            r=urllib.request.Request(url,headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'runner3-vbth-r2-seed/1.0',
            })
            return urllib.request.urlopen(r,timeout=90)

          artifacts=[]
          page=1
          while True:
            with req(f'{api}/repos/{repo}/actions/artifacts?per_page=100&page={page}') as resp:
              body=json.load(resp)
            rows=body.get('artifacts') or []
            artifacts.extend(rows)
            if len(rows)<100: break
            page+=1
          live=[a for a in artifacts if not a.get('expired')]
          # Keep discovery bounded to likely VBTH/story artifacts. Exact file hashes remain the authority.
          pat=re.compile(r'(vbth|vuong|vương|tienvuc|tiênvuc|metruyen|mêtruyện|ebook|story)',re.I)
          candidates=[a for a in live if pat.search(str(a.get('name') or ''))]
          candidates.sort(key=lambda a:str(a.get('created_at') or ''),reverse=True)
          found={}
          scanned=[]
          for art in candidates:
            aid=int(art['id'])
            try:
              with req(f'{api}/repos/{repo}/actions/artifacts/{aid}/zip') as resp:
                raw=resp.read()
              z=zipfile.ZipFile(io.BytesIO(raw))
            except Exception as exc:
              scanned.append({'artifact_id':aid,'artifact_name':art.get('name'),'download_error':f'{type(exc).__name__}: {exc}'})
              continue
            hit_names=[]
            members=[]
            for info in z.infolist():
              if info.is_dir(): continue
              members.append({'name':info.filename,'bytes':info.file_size})
              data=z.read(info)
              digest=hashlib.sha256(data).hexdigest()
              key=by_hash.get(digest)
              if key:
                hit_names.append(key)
                if key in found:
                  if found[key]['sha256']!=digest:
                    raise SystemExit(f'conflicting exact target: {key}')
                  continue
                out=Path('/tmp/vbth-seed/found')/targets[key]['filename']
                out.write_bytes(data)
                found[key]={
                  'sha256':digest,
                  'bytes':len(data),
                  'artifact_id':aid,
                  'artifact_name':art.get('name'),
                  'artifact_created_at':art.get('created_at'),
                  'member':info.filename,
                  'r2_key':targets[key]['r2_key'],
                }
            scanned.append({
              'artifact_id':aid,
              'artifact_name':art.get('name'),
              'created_at':art.get('created_at'),
              'size_in_bytes':art.get('size_in_bytes'),
              'hits':hit_names,
              'members':members[:100],
            })
            if len(found)==len(targets): break

          missing=[k for k in targets if k not in found]
          required_missing=[k for k,v in targets.items() if v['required'] and k not in found]
          report={
            'schema':'vbth-r2-seed-discovery-v1',
            'repo':repo,
            'run_id':os.environ['GITHUB_RUN_ID'],
            'targets':targets,
            'live_artifact_count':len(live),
            'candidate_artifact_count':len(candidates),
            'found':found,
            'missing':missing,
            'required_missing':required_missing,
            'scanned':scanned,
          }
          Path('/tmp/vbth-seed/discovery.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:report[k] for k in ('live_artifact_count','candidate_artifact_count','found','missing','required_missing')},ensure_ascii=False,indent=2))
          PY

      - name: Upload every exact hash match to R2 and verify readback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/vbth-seed/upload.tsv
          import json
          d=json.load(open('/tmp/vbth-seed/discovery.json'))
          for key,row in d['found'].items():
            print('\t'.join([key,d['targets'][key]['filename'],row['r2_key'],row['sha256']]))
          PY
          : > /tmp/vbth-seed/r2-proof.jsonl
          while IFS=$'\t' read -r logical filename r2key expected; do
            [ -n "$logical" ] || continue
            src="/tmp/vbth-seed/found/${filename}"
            readback="/tmp/vbth-seed/readback-${logical}"
            npx --yes wrangler@4 r2 object put "${R2_BUCKET}/${r2key}" \
              --file="$src" --remote --config=cloudflare/runner3-core/wrangler.jsonc
            npx --yes wrangler@4 r2 object get "${R2_BUCKET}/${r2key}" \
              --file="$readback" --remote --config=cloudflare/runner3-core/wrangler.jsonc
            actual="$(sha256sum "$readback" | awk '{print $1}')"
            test "$actual" = "$expected"
            printf '{"logical":"%s","r2_key":"%s","sha256":"%s","verified":true}\n' "$logical" "$r2key" "$actual" >> /tmp/vbth-seed/r2-proof.jsonl
          done < /tmp/vbth-seed/upload.tsv

      - name: Publish D1 migration checkpoint after R2 verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,str(Path('.github/scripts').resolve()))
          from runner3_core import get_checkpoint, save_checkpoint, report_status
          discovery=json.load(open('/tmp/vbth-seed/discovery.json'))
          proofs=[]
          p=Path('/tmp/vbth-seed/r2-proof.jsonl')
          if p.exists():
            for line in p.read_text(encoding='utf-8').splitlines():
              if line.strip(): proofs.append(json.loads(line))
          verified={x['logical']:x for x in proofs if x.get('verified')}
          required={'master','gold','source_index','editorial_sample'}
          required_missing=sorted(required-set(verified))
          status='success' if not required_missing else 'running'
          position={
            'schema_version':2,
            'phase':'seed-complete' if status=='success' else 'seed-partial',
            'book_id':'vbth',
            'artifact_store':'r2',
            'artifact_bucket':os.environ['R2_BUCKET'],
            'verified':verified,
            'missing':discovery['missing'],
            'required_missing':required_missing,
            'source':'github-actions-artifact-discovery',
            'run_id':os.environ['GITHUB_RUN_ID'],
          }
          saved=save_checkpoint('ebook-editorial','ebook-editorial/vbth',scope='book:vbth:seed',status=status,position=position,dropbox_path=None,last_error=None if status=='success' else 'legacy artifacts still missing')
          durable=get_checkpoint('ebook-editorial','book:vbth:seed')
          if (durable or {}).get('status')!=status:
            raise SystemExit(f'D1 migration checkpoint mismatch: {durable!r}')
          report_status('ebook-editorial/vbth',status,run_id=os.environ['GITHUB_RUN_ID'],detail={'scope':'book:vbth:seed','position':position})
          final={**discovery,'r2_proofs':proofs,'d1_status':status,'d1_checkpoint':durable}
          out=Path('ops/ebook/vbth-r2-seed-proof.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(final,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':status,'verified':sorted(verified),'required_missing':required_missing},ensure_ascii=False,indent=2))
          PY

      - name: Persist migration proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s ops/ebook/vbth-r2-seed-proof.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/ebook/vbth-r2-seed-proof.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist VBTH R2 seed proof: ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 3
