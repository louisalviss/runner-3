name: Ebook Reader Audio R2 E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ebook_reader_audio_r2_e2e.py'
      - '.github/workflows/ebook-reader-audio-r2-e2e.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EBOOK_SOURCE_BUCKET: runner3-artifacts
      EBOOK_AUDIO_BUCKET: runner3-wp-media
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install smoke dependencies
        run: python -m pip install -q requests

      - name: Run real R2 Ebook audio E2E
        run: python scripts/ebook_reader_audio_r2_e2e.py
