name: Ebook Reader Audio R2 E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ebook_reader_audio_r2_e2e.py'
      - 'scripts/ebook_reader_audio_r2_e2e_v2.py'
      - 'scripts/ebook_reader_audio_tts.py'
      - 'scripts/ebook_reader_audio_tts_v2.py'
      - '.github/workflows/ebook-reader-audio-r2-e2e.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EBOOK_SOURCE_BUCKET: runner3-artifacts
      EBOOK_AUDIO_BUCKET: runner3-wp-media
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      EBOOK_AUDIO_VOICE: vi-VN-NamMinhNeural
      EBOOK_AUDIO_VOICE_RATE: +3%
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install E2E dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q requests edge-tts
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Run real R2 Ebook audio E2E with worker
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/ebook-r2-e2e.log
          python scripts/ebook_reader_audio_r2_e2e_v2.py >"$log" 2>&1 &
          smoke_pid=$!
          cleanup(){ cat "$log" || true; }
          trap cleanup EXIT

          queued=0
          for _ in $(seq 1 45); do
            if grep -q '"phase": "queued"' "$log" || grep -q '"phase":"queued"' "$log"; then
              queued=1
              break
            fi
            if ! kill -0 "$smoke_pid" 2>/dev/null; then
              wait "$smoke_pid"
            fi
            sleep 1
          done
          test "$queued" = 1

          python scripts/ebook_reader_audio_tts_v2.py
          wait "$smoke_pid"
          trap - EXIT
          cat "$log"
