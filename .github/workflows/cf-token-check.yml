name: CF Usage Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cf-token-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Measure Cloudflare free-tier usage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, urllib.error, urllib.request

          token = os.environ['CF_TOKEN']
          account = os.environ['CF_ACCOUNT']
          base = 'https://api.cloudflare.com/client/v4'
          headers = {
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json',
              'Accept': 'application/json',
          }

          now = datetime.datetime.now(datetime.timezone.utc)
          start = now.replace(hour=0, minute=0, second=0, microsecond=0)
          today = now.date().isoformat()

          def request_json(url, method='GET', payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode()
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  try:
                      data = json.loads(e.read().decode())
                  except Exception:
                      data = {}
                  return e.code, data
              except Exception as e:
                  return 0, {'error': str(e)[:500]}

          def list_result(path, name_keys=('name','title','id','uuid')):
              code, data = request_json(base + path)
              out = []
              if 200 <= code < 300 and isinstance(data.get('result'), list):
                  for item in data['result']:
                      if isinstance(item, dict):
                          value = next((item.get(k) for k in name_keys if item.get(k)), None)
                      else:
                          value = item
                      if value is not None:
                          out.append(str(value))
              return code, out

          sc, scripts = list_result(f'/accounts/{account}/workers/scripts', ('id','name'))
          pc, pages = list_result(f'/accounts/{account}/pages/projects', ('name','id'))
          kc, kv_namespaces = list_result(f'/accounts/{account}/storage/kv/namespaces?page=1&per_page=1000', ('title','id'))
          dc, d1_databases = list_result(f'/accounts/{account}/d1/database?page=1&per_page=1000', ('name','uuid'))

          query = '''
          query Usage($accountTag: string, $datetimeStart: string, $datetimeEnd: string, $dateStart: Date, $dateEnd: Date) {
            viewer {
              accounts(filter: {accountTag: $accountTag}) {
                workersInvocationsAdaptive(
                  limit: 10000,
                  filter: {datetime_geq: $datetimeStart, datetime_leq: $datetimeEnd}
                ) {
                  dimensions { scriptName status }
                  sum { requests errors subrequests }
                }
                kvOperationsAdaptiveGroups(
                  limit: 10000,
                  filter: {date_geq: $dateStart, date_leq: $dateEnd}
                ) {
                  dimensions { actionType }
                  sum { requests }
                }
                d1AnalyticsAdaptiveGroups(
                  limit: 10000,
                  filter: {date_geq: $dateStart, date_leq: $dateEnd}
                ) {
                  dimensions { databaseId }
                  sum { readQueries writeQueries rowsRead rowsWritten }
                }
              }
            }
          }
          '''
          variables = {
              'accountTag': account,
              'datetimeStart': start.isoformat().replace('+00:00','Z'),
              'datetimeEnd': now.isoformat().replace('+00:00','Z'),
              'dateStart': today,
              'dateEnd': today,
          }
          gc, gd = request_json(base + '/graphql', 'POST', {'query': query, 'variables': variables})
          gql_errors = gd.get('errors') or [] if isinstance(gd, dict) else []
          account_data = {}
          try:
              account_data = gd['data']['viewer']['accounts'][0] or {}
          except Exception:
              account_data = {}

          worker_rows = account_data.get('workersInvocationsAdaptive') or []
          per_script = {}
          total_requests = total_errors = total_subrequests = 0
          for row in worker_rows:
              dims = row.get('dimensions') or {}
              sums = row.get('sum') or {}
              name = str(dims.get('scriptName') or '(unknown)')
              reqs = int(sums.get('requests') or 0)
              errs = int(sums.get('errors') or 0)
              subs = int(sums.get('subrequests') or 0)
              state = per_script.setdefault(name, {'requests':0,'errors':0,'subrequests':0})
              state['requests'] += reqs
              state['errors'] += errs
              state['subrequests'] += subs
              total_requests += reqs
              total_errors += errs
              total_subrequests += subs
          worker_ranked = [
              {'script': name, **vals}
              for name, vals in sorted(per_script.items(), key=lambda kv: kv[1]['requests'], reverse=True)
          ]

          kv_totals = {'read':0,'write':0,'delete':0,'list':0,'other':0}
          for row in account_data.get('kvOperationsAdaptiveGroups') or []:
              action = str((row.get('dimensions') or {}).get('actionType') or 'other').lower()
              reqs = int((row.get('sum') or {}).get('requests') or 0)
              if action in kv_totals:
                  kv_totals[action] += reqs
              else:
                  kv_totals['other'] += reqs

          d1_totals = {'readQueries':0,'writeQueries':0,'rowsRead':0,'rowsWritten':0}
          d1_by_db = {}
          for row in account_data.get('d1AnalyticsAdaptiveGroups') or []:
              dims = row.get('dimensions') or {}
              sums = row.get('sum') or {}
              dbid = str(dims.get('databaseId') or '(unknown)')
              state = d1_by_db.setdefault(dbid, {'readQueries':0,'writeQueries':0,'rowsRead':0,'rowsWritten':0})
              for key in d1_totals:
                  value = int(sums.get(key) or 0)
                  state[key] += value
                  d1_totals[key] += value

          limits = {
              'workersRequestsPerDay': 100000,
              'kvReadsPerDay': 100000,
              'kvWritesPerDay': 1000,
              'kvDeletesPerDay': 1000,
              'kvListsPerDay': 1000,
              'd1RowsReadPerDay': 5000000,
              'd1RowsWrittenPerDay': 100000,
          }

          def pct(value, limit):
              return round(value / limit * 100, 2) if limit else None

          out = {
              'checkedAt': now.isoformat().replace('+00:00','Z'),
              'window': {'startUtc': variables['datetimeStart'], 'endUtc': variables['datetimeEnd'], 'dateUtc': today},
              'freeTierLimits': limits,
              'inventory': {
                  'workersHttp': sc, 'workers': scripts,
                  'pagesHttp': pc, 'pagesProjects': pages,
                  'kvHttp': kc, 'kvNamespaces': kv_namespaces,
                  'd1Http': dc, 'd1Databases': d1_databases,
              },
              'graphql': {
                  'http': gc,
                  'errors': [str(e.get('message') if isinstance(e, dict) else e)[:500] for e in gql_errors[:10]],
              },
              'workers': {
                  'requestsToday': total_requests,
                  'requestLimitPct': pct(total_requests, limits['workersRequestsPerDay']),
                  'errorsToday': total_errors,
                  'subrequestsToday': total_subrequests,
                  'byScript': worker_ranked,
              },
              'kv': {
                  'operationsToday': kv_totals,
                  'limitPct': {
                      'read': pct(kv_totals['read'], limits['kvReadsPerDay']),
                      'write': pct(kv_totals['write'], limits['kvWritesPerDay']),
                      'delete': pct(kv_totals['delete'], limits['kvDeletesPerDay']),
                      'list': pct(kv_totals['list'], limits['kvListsPerDay']),
                  },
              },
              'd1': {
                  'totalsToday': d1_totals,
                  'limitPct': {
                      'rowsRead': pct(d1_totals['rowsRead'], limits['d1RowsReadPerDay']),
                      'rowsWritten': pct(d1_totals['rowsWritten'], limits['d1RowsWrittenPerDay']),
                  },
                  'byDatabaseId': d1_by_db,
              },
          }

          os.makedirs('/tmp/cf-usage', exist_ok=True)
          with open('/tmp/cf-usage/latest.json', 'w') as f:
              json.dump(out, f, indent=2)
              f.write('\n')
          print(json.dumps(out, indent=2))
          PY

      - name: Persist safe usage result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/cf-usage/latest.json || printf '{"status":"failed","detail":"usage_result_missing"}\n' >/tmp/cf-usage/latest.json
          cp /tmp/cf-usage/latest.json /tmp/cf-usage-safe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/cloudflare-capability
            cp /tmp/cf-usage-safe.json ops/cloudflare-capability/usage.json
            git add ops/cloudflare-capability/usage.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Persist CF usage diagnostic: ${GITHUB_RUN_ID} [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 3
