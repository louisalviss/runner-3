name: WordPress Custom Domain Noindex

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordpress-custom-domain-noindex.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wordpress-custom-domain-noindex
  cancel-in-progress: false

jobs:
  noindex:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WP_SITE_SLUG: runner3wp-custom-domain
      WP_SITE_URL: https://runner3wp.pntr.dev
      WP_DASHBOARD_URL: https://wasmer.io/apps/runner3wp0b90f6b4ab/runner3-wp-a94b8fd2
      WP_ADMIN_BASE: https://runner3-wp-a94b8fd2.wasmer.app
      WP_VERIFY_PATH: /
      OUT: /tmp/wp-noindex-result.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Decrypt Wasmer account state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { echo 'Automation encryption key unavailable'; exit 3; }
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in ops/wasmer/state.automation.aes \
            -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json

      - name: Install browser automation
        run: npm install --no-save playwright-core@1.58.2

      - name: Enable WordPress search-engine visibility noindex
        shell: bash
        run: |
          set -euo pipefail
          node scripts/set-wordpress-noindex.mjs

      - name: Persist verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT" || echo '{"status":"failed","detail":"verification_missing"}' > "$OUT"
          cp "$OUT" /tmp/runner3wp-noindex-safe.json
          rm -f /tmp/wasmer-account.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/custom-domain/noindex
            cp /tmp/runner3wp-noindex-safe.json ops/custom-domain/noindex/runner3wp.noindex.latest.json
            git add ops/custom-domain/noindex/runner3wp.noindex.latest.json
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m "Persist runner3wp WordPress noindex verification: ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep 2
          done
          test "$pushed" = true

      - name: Require public noindex
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          p=json.load(open(os.environ['OUT']))
          assert p.get('status') == 'ok', p
          assert p.get('frontendHttp') == 200, p
          assert p.get('hasNoindex') is True, p
          print(json.dumps({
            'status': p.get('status'),
            'siteUrl': p.get('siteUrl'),
            'adminOriginUsed': p.get('adminOriginUsed'),
            'settingChanged': p.get('settingChanged'),
            'saved': p.get('saved'),
            'frontendHttp': p.get('frontendHttp'),
            'metaRobots': p.get('metaRobots'),
            'hasNoindex': p.get('hasNoindex'),
          }, indent=2))
          PY
