name: WR Trade Liquidity Funding OI Breadth
on:
  pull_request:
    branches: [main]
    paths:
      - 'wave-rider-verify/wr_trade_liq_funding_oi_breadth.py'
      - '.github/workflows/wr-trade-liq-funding-oi-breadth.yml'
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wr2024-frozen-rolling-oos-final
          path: /tmp/a24
          github-token: ${{ github.token }}
          repository: louisalviss/runner-3
          run-id: 32253319968
      - uses: actions/download-artifact@v4
        with:
          name: wr2515-phase2-zonec10-final
          path: /tmp/a25
          github-token: ${{ github.token }}
          repository: louisalviss/runner-3
          run-id: 32233507091
      - name: Run trade-level liquidity funding OI breadth diagnostic
        run: python3 wave-rider-verify/wr_trade_liq_funding_oi_breadth.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr-trade-liq-funding-oi-breadth-final
          path: /tmp/final7
          retention-days: 14
