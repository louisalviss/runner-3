name: SABA EPL Futures Remaining
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dafabet-saba-epl-futures-remaining.yml'
      - 'saba_remaining_extract.py'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl python3-venv
          python3 -m venv /tmp/pwvenv
          /tmp/pwvenv/bin/pip install -q playwright
          mkdir -p evidence /tmp/relays
      - name: Build Asia relay pool
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          pref=['JP','KR','TW','SG','TH','MY','PH','ID']
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n'); meta=[]
          for c in pref:
            rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
            rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
            limit=10 if c=='JP' else 2
            for r in rs[:limit]:
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              p=pathlib.Path(f'/tmp/relays/{len(meta):02d}-{c}.ovpn'); p.write_text(cfg); meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/relays.tsv').write_text('\n'.join(meta)+'\n')
          print('RELAYS='+str(len(meta)))
          PY
      - name: Create isolated VPN namespace
        run: |
          set -euo pipefail
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.239.0.1/24 dev vh && sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.239.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up && sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.239.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.239.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
      - name: Connect allowed relay
        shell: bash
        run: |
          set -euo pipefail
          selected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo "TRY $country $relay"
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true; sleep 1
            sudo rm -f /tmp/openvpn.log; sudo touch /tmp/openvpn.log; sudo chmod 644 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            ok=0; for i in {1..12}; do sleep 1; grep -q 'Initialization Sequence Completed' /tmp/openvpn.log && { ok=1; break; }; done
            [ "$ok" = 1 ] || continue
            trace=$(sudo ip netns exec vpnns curl -fsS --max-time 12 'https://www.cloudflare.com/cdn-cgi/trace' | grep -E '^(ip|loc|warp)=' || true); echo "$trace"
            if sudo ip netns exec vpnns env HOME=/home/runner USER=runner /tmp/pwvenv/bin/python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox']); c=b.new_context(locale='en-US'); pg=c.new_page()
            try:
              r=pg.goto('https://www.dafabet.com/en/sports',wait_until='domcontentloaded',timeout=40000); pg.wait_for_timeout(6000); t=pg.locator('body').inner_text(timeout=8000)
              ok=bool(r and r.status==200 and not re.search(r'COUNTRY RESTRICTION|restricted country|captcha|verify you are human|access denied|just a moment',t,re.I))
            except: ok=False
            b.close()
          raise SystemExit(0 if ok else 3)
          PY
            then
              printf '%s\n' "$country" > evidence/selected-country.txt; printf '%s\n' "$trace" > evidence/egress.txt; selected=1; break
            fi
          done < /tmp/relays.tsv
          test "$selected" = 1
      - name: Extract remaining markets
        run: sudo ip netns exec vpnns env HOME=/home/runner USER=runner /tmp/pwvenv/bin/python "$GITHUB_WORKSPACE/saba_remaining_extract.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saba-epl-remaining-${{ github.run_id }}
          path: evidence/
          retention-days: 3
