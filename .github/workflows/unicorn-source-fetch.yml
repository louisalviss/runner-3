name: Fetch Unicorn Indicator Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unicorn-source-fetch.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch Pastebin raw
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/unicorn
          python - <<'PY'
          import urllib.request, pathlib, json, datetime
          urls=[
            'https://pastebin.com/raw/DR9g2MFE',
            'https://pastebin.com/DR9g2MFE'
          ]
          out={'captured_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'attempts': []}
          text=None
          for u in urls:
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read(1000000).decode('utf-8','replace')
                      out['attempts'].append({'url':u,'status':r.status,'chars':len(body)})
                      if r.status==200 and len(body.strip())>20:
                          text=body
                          out['winner']=u
                          break
              except Exception as e:
                  out['attempts'].append({'url':u,'error':repr(e)})
          pathlib.Path('ops/unicorn/fetch.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if text is not None:
              pathlib.Path('ops/unicorn/unicorn-indicator.txt').write_text(text,encoding='utf-8')
          PY
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/unicorn/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store Unicorn Indicator source [skip ci]'
          git pull --rebase origin main || true
          git push origin HEAD:main
