name: Capture Wasmer Session Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasmer-capture-session-verify.yml'
      - 'scripts/wasmer-capture-session-verify.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted Wasmer state
        shell: bash
        run: |
          set -euo pipefail
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-result.json
      - run: npm install --no-save playwright-core@1.58.2
      - name: Login, capture session, inspect verification
        run: node scripts/wasmer-capture-session-verify.mjs
      - name: Persist encrypted session and safe verification result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/wasmer-session-verify.json || echo '{"status":"runner_error"}' > /tmp/wasmer-session-verify.json
          echo 'SAFE_VERIFY_STATUS:'
          cat /tmp/wasmer-session-verify.json
          if test -f /tmp/wasmer-browser-state.json; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in /tmp/wasmer-browser-state.json -out /tmp/wasmer-browser-state.aes
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/wasmer
            cp /tmp/wasmer-session-verify.json ops/wasmer/session-verify.json
            if test -f /tmp/wasmer-browser-state.aes; then cp /tmp/wasmer-browser-state.aes ops/wasmer/browser-state.aes; fi
            git add ops/wasmer/session-verify.json
            test ! -f ops/wasmer/browser-state.aes || git add ops/wasmer/browser-state.aes
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m 'Persist encrypted Wasmer browser session and verification state'
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep 2
          done
          test "$pushed" = true || exit 5
