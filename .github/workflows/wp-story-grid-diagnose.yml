name: WordPress Story Grid Diagnose

on:
  push:
    branches: [main]
    paths:
      - 'ops/wp-layout-audit/story-requests/*.json'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.58.2
      - run: node scripts/diagnose-story-grid.mjs
      - name: Persist diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/wp-layout-audit/results/story-grid.json
          git diff --cached --quiet && exit 0
          git commit -m 'Persist WordPress story grid diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
