name: VBTH D1 Checkpoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'story_pipeline/state.json'
      - 'story_pipeline/config/**'
      - 'story_pipeline/edited/**'
      - 'story_pipeline/merged/**'
      - 'story_pipeline/sync_checkpoint.py'

permissions:
  contents: read

concurrency:
  group: runner3-vbth-d1-checkpoint
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Sync and verify durable checkpoint
        run: python story_pipeline/sync_checkpoint.py
