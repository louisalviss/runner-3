name: Solo Beru Xonada V14B TikTok
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/solo-beru-xonada-v14b-tiktok.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl openvpn iproute2 iptables
          python -m pip install -q -U yt-dlp numpy
      - name: Acquire proven 720p video-only source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 35 https://www.vpngate.net/api/iphone/ -o vpn.csv
          python <<'PY'
          import csv,base64
          a=[]
          pri={'VN':0,'JP':1,'KR':2,'TW':3,'SG':4}
          for r in csv.reader(open('vpn.csv',encoding='utf-8-sig',errors='replace')):
            if len(r)<15 or not r or r[0].startswith(('*','#')):continue
            cc=r[6].strip().upper()
            if cc not in pri:continue
            try:a.append((pri[cc],-int(r[2] or 0),cc,r[1],base64.b64decode(r[14]).decode('utf8','replace')))
            except:pass
          a.sort();a=a[:20]
          with open('vpns.tsv','w') as m:
            for i,(_,_,cc,ip,cfg) in enumerate(a):
              p=f'v{i}.ovpn';open(p,'w').write(cfg+'\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 7\n');m.write(f'{p}\t{cc}\t{ip}\n')
          PY
          sudo mkdir -p /etc/netns/vpnns;printf 'nameserver 1.1.1.1\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          sudo ip netns add vpnns;sudo ip link add vh type veth peer name vv;sudo ip link set vv netns vpnns
          sudo ip addr add 10.203.0.1/24 dev vh;sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.203.0.2/24 dev vv;sudo ip netns exec vpnns ip link set lo up;sudo ip netns exec vpnns ip link set vv up;sudo ip netns exec vpnns ip route add default via 10.203.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null;W=$(ip route show default|awk '/default/{print $5;exit}')
          sudo iptables -t nat -A POSTROUTING -s 10.203.0.0/24 -o "$W" -j MASQUERADE;sudo iptables -A FORWARD -i vh -o "$W" -j ACCEPT;sudo iptables -A FORWARD -i "$W" -o vh -m state --state RELATED,ESTABLISHED -j ACCEPT
          Y=$(command -v yt-dlp);got=0
          while IFS=$'\t' read -r p cc ip;do
            [ -f /tmp/v.pid ]&&sudo kill "$(cat /tmp/v.pid)" 2>/dev/null||true;sudo rm -f /tmp/v.pid /tmp/v.log;sleep 1
            sudo ip netns exec vpnns openvpn --config "$GITHUB_WORKSPACE/$p" --daemon --writepid /tmp/v.pid --log /tmp/v.log||true
            tun=0;for n in $(seq 1 12);do sudo ip netns exec vpnns ip link show tun0 >/dev/null 2>&1&&{ tun=1;break;};sleep 1;done;[ "$tun" = 1 ]||continue
            eg=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 8 https://api.ipify.org||true);[ -n "$eg" ]||continue;echo "EGRESS=$eg $cc"
            rm -f source.*
            if timeout 300s sudo ip netns exec vpnns env PATH="$PATH" HOME="$HOME" "$Y" --no-playlist --retries 1 --fragment-retries 1 --socket-timeout 20 --js-runtimes node --remote-components ejs:github -f 'bv*[height<=720][ext=mp4]/bv*[height<=720]' -o "$GITHUB_WORKSPACE/source.%(ext)s" 'https://www.youtube.com/watch?v=IrHTT2IEKpE';then
              f=$(find . -maxdepth 1 -name 'source.*' -type f|head -1);[ -n "$f" ]&&{ [ "$f" = './source.mp4' ]||mv "$f" source.mp4;got=1;break;}
            fi
          done<vpns.tsv
          [ "$got" = 1 ]||exit 22
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=nw=1 source.mp4
      - name: Get XONADA and choose energetic 48-beat window
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://itunes.apple.com/search?term=MONTAGEM%20XONADA%20MXZI%20Dj%20Samir%20DJ%20Javi26&entity=song&limit=50&country=US' -o i.json
          python <<'PY'
          import json
          for x in json.load(open('i.json')).get('results',[]):
            if (x.get('trackName') or '').strip().lower()=='montagem xonada' and x.get('previewUrl') and 'mxzi' in (x.get('artistName') or '').lower():
              open('u','w').write(x['previewUrl']);print('TRACK',x.get('trackName'),x.get('artistName'));break
          else:raise SystemExit('NO_XONADA')
          PY
          curl -fL --max-time 45 -A 'Mozilla/5.0' "$(cat u)" -o xonada.m4a
          ffmpeg -hide_banner -loglevel error -y -i xonada.m4a -ac 1 -ar 22050 -f s16le x.raw
          python <<'PY'
          import numpy as np
          sr=22050;beat=60/172;total=48*beat
          x=np.fromfile('x.raw',dtype=np.int16).astype(np.float32)/32768
          hop=220;win=1024
          e=np.array([np.sqrt(np.mean(x[i:i+win]**2)+1e-9) for i in range(0,len(x)-win,hop)])
          le=np.log(e+1e-6);on=np.maximum(0,np.diff(le,prepend=le[0]));tt=np.arange(len(e))*hop/sr
          maxst=max(0,len(x)/sr-total-.05);best=(-1,0)
          for idx in np.argsort(on)[-min(600,len(on)):]:
            st=tt[idx]
            if st>maxst:continue
            ids=np.searchsorted(tt,st+np.arange(48)*beat);ids=np.clip(ids,0,len(on)-1)
            mask=(tt>=st)&(tt<st+total)
            score=float(on[ids].sum()+8*np.percentile(e[mask],70)+.6*on[idx])
            if score>best[0]:best=(score,st)
          open('music_start.txt','w').write(f'{best[1]:.3f}')
          open('beat_meta.txt','w').write(f'bpm=172\nbeat={beat:.6f}\nbeats=48\nduration={total:.6f}\nmusic_start={best[1]:.3f}\n')
          print(open('beat_meta.txt').read())
          PY
      - name: Render 26-cut vertical velocity edit
        run: |
          set -euo pipefail
          python <<'PY'
          clips=[
          (512,512.35,1,438,1.12,0,0),(494,494.60,1,438,1.18,1,1),(530,530.25,1,438,1.22,1,0),(510,510.50,1,438,1.10,0,1),
          (470,471.20,2,430,1.08,0,0),(484,484.80,2,700,1.12,0,0),(486,487.20,2,120,1.10,0,1),(492,492.50,2,438,1.18,0,0),(504,505.20,2,438,1.12,1,0),(512,512.55,2,438,1.15,0,1),
          (520,521.40,2,650,1.12,1,0),(524,524.45,2,438,1.22,0,1),(528,529.40,2,438,1.10,1,1),(530,530.50,2,438,1.24,0,0),(532,533.40,2,438,1.10,1,0),(534,534.50,2,438,1.20,1,1),(536,537.40,2,438,1.12,1,0),(538,539.40,2,438,1.14,1,1),(540,540.45,2,438,1.20,0,1),(542,543.40,2,438,1.12,1,0),(544,545.40,2,438,1.14,1,1),(536.40,536.90,2,438,1.22,1,0),
          (548,549.20,2,438,1.10,0,0),(550,550.50,2,438,1.16,0,0),(552,553.20,2,438,1.10,0,1),(512,512.55,2,438,1.14,0,0)]
          beat=60/172;n=len(clips);f=['[0:v]setpts=PTS-STARTPTS,split='+str(n)+''.join(f'[i{k}]' for k in range(n))]
          t=0;lines=[]
          for k,(st,en,b,cx,z,shake,flash) in enumerate(clips):
            out=b*beat;src=en-st;sw=int(round(1080*z/2)*2);sh=int(round(1920*z/2)*2)
            sx=f'(iw-ow)/2+{12 if shake else 0}*sin(2*PI*t*18)';sy=f'(ih-oh)/2+{8 if shake else 0}*sin(2*PI*t*23)'
            fl=",drawbox=x=0:y=0:w=iw:h=ih:color=white@0.20:t=fill:enable='lt(t,0.035)'" if flash else ''
            f.append(f'[i{k}]trim=start={st}:end={en},setpts=(PTS-STARTPTS)*{out/src:.8f},crop=405:720:{cx}:0,scale={sw}:{sh},crop=1080:1920:x={sx}:y={sy},eq=contrast=1.10:saturation=1.16:gamma=0.97,unsharp=5:5:0.30:5:5:0{fl},fps=30,format=yuv420p[v{k}]')
            lines.append(f'{k+1:02d} out={t:.3f}-{t+out:.3f} src={st:.2f}-{en:.2f} beats={b} speed={src/out:.2f}x cropx={cx} zoom={z} shake={shake} flash={flash}');t+=out
          f.append(''.join(f'[v{k}]' for k in range(n))+f'concat=n={n}:v=1:a=0[vout]')
          open('filter.txt','w').write(';'.join(f));open('edit_map.txt','w').write('\n'.join(lines)+f'\nTOTAL={t:.6f}\n')
          PY
          ffmpeg -hide_banner -loglevel error -y -i source.mp4 -filter_complex_script filter.txt -map '[vout]' -an -c:v libx264 -preset medium -crf 17 -profile:v high -level 4.1 -pix_fmt yuv420p visual.mp4
          DUR=$(python - <<'PY'
          print(f'{48*(60/172):.6f}')
          PY
          );MS=$(cat music_start.txt)
          ffmpeg -hide_banner -loglevel error -y -i visual.mp4 -ss "$MS" -i xonada.m4a -t "$DUR" -map 0:v -map 1:a -c:v copy -af 'volume=1.0,bass=g=3:f=90,alimiter=limit=.94' -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart solo_beru_xonada_v14b_tiktok.mp4
          mkdir -p qa
          for t in 0.2 0.8 1.4 2.5 4.2 5.8 7.2 8.6 10.0 11.4 12.8 14.2 15.4 16.3;do ffmpeg -hide_banner -loglevel error -y -ss $t -i solo_beru_xonada_v14b_tiktok.mp4 -frames:v 1 "qa/q_${t}.jpg";done
          ffmpeg -hide_banner -loglevel error -y -i solo_beru_xonada_v14b_tiktok.mp4 -vf 'fps=1/1.2,scale=180:-2,tile=7x2:padding=3:margin=3' -frames:v 1 qa_contact.jpg
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,sample_rate,channels -show_entries format=duration,size,bit_rate -of default=nw=1 solo_beru_xonada_v14b_tiktok.mp4 | tee specs.txt
      - name: Upload
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: solo-beru-xonada-v14b-tiktok
          path: |
            solo_beru_xonada_v14b_tiktok.mp4
            qa_contact.jpg
            qa/*.jpg
            beat_meta.txt
            edit_map.txt
            specs.txt
          retention-days: 3
      - name: Persist manifest
        run: |
          mkdir -p audit/solo-beru-v14b
          printf 'run_id=%s\nartifact_id=%s\ncommit=%s\n' '${{ github.run_id }}' '${{ steps.upload.outputs.artifact-id }}' '${{ github.sha }}' > audit/solo-beru-v14b/manifest.txt
          git config user.name github-actions;git config user.email github-actions@github.com
          git add audit/solo-beru-v14b/manifest.txt;git commit -m 'Add Solo Beru V14B manifest' || exit 0
          for n in 1 2 3 4 5;do git pull --rebase origin main || true;git push&&exit 0;sleep 2;done;exit 0
