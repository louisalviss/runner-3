name: Maintenance - Exhaustive Workflow Audit v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-workflow-audit-v3.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: maintenance-workflow-audit-v3
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan all active workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          def cron_interval(expr):
              parts = expr.split()
              if len(parts) < 5:
                  return None
              minute, hour = parts[0], parts[1]
              m = re.fullmatch(r"\*/(\d+)", minute)
              if m and hour == "*":
                  return int(m.group(1))
              if minute == "*" and hour == "*":
                  return 1
              if hour == "*" and minute.isdigit():
                  return 60
              if hour == "*" and re.fullmatch(r"[0-9,]+", minute):
                  return max(1, 60 // len(set(minute.split(","))))
              h = re.fullmatch(r"\*/(\d+)", hour)
              if h and minute.isdigit():
                  return int(h.group(1)) * 60
              if re.fullmatch(r"[0-9,]+", hour) and minute.isdigit():
                  hs = sorted(set(map(int, hour.split(","))))
                  if len(hs) == 1:
                      return 1440
                  gaps = [(hs[(i + 1) % len(hs)] - hs[i]) % 24 for i in range(len(hs))]
                  gaps = [g for g in gaps if g]
                  return min(gaps) * 60 if gaps else 1440
              return None

          rows = []
          files = sorted(list(Path('.github/workflows').glob('*.yml')) + list(Path('.github/workflows').glob('*.yaml')))
          for path in files:
              text = path.read_text(encoding='utf-8', errors='replace')
              crons = re.findall(r"cron:\s*['\"]([^'\"]+)['\"]", text)
              intervals = [x for x in (cron_interval(c) for c in crons) if x is not None]
              interval = min(intervals) if intervals else None
              nm = re.search(r"(?m)^name:\s*(.+)$", text)
              name = nm.group(1).strip().strip("\"").strip("'") if nm else path.stem
              triggers = []
              for key in ('schedule','push','workflow_dispatch','workflow_run','pull_request','pull_request_target','repository_dispatch'):
                  if re.search(r"(?m)^\s{2,}" + re.escape(key) + r"\s*:", text):
                      triggers.append(key)
              low = text.lower()
              heavy = sorted({k for k in ('playwright','chromium','google-chrome','selenium','ffmpeg','remotion','lighthouse','docker build') if k in low})
              concurrency = 'concurrency:' in text
              cancel = bool(re.search(r"cancel-in-progress:\s*true", text, re.I))
              git_push = bool(re.search(r"(?m)\bgit\s+push\b", text))
              git_commit = bool(re.search(r"(?m)\bgit\s+commit\b", text))
              path_filter = bool(re.search(r"(?m)^\s+paths(?:-ignore)?:\s*$", text))
              timeouts = [int(x) for x in re.findall(r"timeout-minutes:\s*(\d+)", text)]
              risk = 'low'
              reasons = []
              if interval is not None and interval < 15:
                  risk = 'critical'; reasons.append(f'cron~{interval}m')
              elif interval is not None and interval < 60:
                  risk = 'high'; reasons.append(f'cron~{interval}m')
              elif interval is not None and interval < 180:
                  risk = 'medium'; reasons.append(f'cron~{interval}m')
              if crons and heavy and (interval is None or interval <= 60):
                  if risk != 'critical': risk = 'high'
                  reasons.append('scheduled-heavy')
              if crons and not concurrency and interval is not None and interval < 180:
                  if risk == 'low': risk = 'medium'
                  reasons.append('scheduled-no-concurrency')
              if git_push and 'push' in triggers and not path_filter:
                  if risk != 'critical': risk = 'high'
                  reasons.append('git-push+broad-push-trigger')
              if 'workflow_run' in triggers:
                  reasons.append('workflow-run-chain')
              rows.append({
                  'file': path.name,
                  'name': name,
                  'triggers': triggers,
                  'crons': crons,
                  'min_interval_minutes': interval,
                  'concurrency': concurrency,
                  'cancel_in_progress': cancel,
                  'timeouts_minutes': timeouts,
                  'heavy': heavy,
                  'git_commit': git_commit,
                  'git_push': git_push,
                  'push_path_filter': path_filter,
                  'risk': risk,
                  'reasons': reasons,
              })

          rank = {'critical':0,'high':1,'medium':2,'low':3}
          rows.sort(key=lambda r: (rank[r['risk']], r['min_interval_minutes'] if r['min_interval_minutes'] is not None else 10**9, r['file']))
          summary = {
              'active_workflows': len(rows),
              'scheduled': sum(bool(r['crons']) for r in rows),
              'cron_under_15m': sum(r['min_interval_minutes'] is not None and r['min_interval_minutes'] < 15 for r in rows),
              'cron_under_60m': sum(r['min_interval_minutes'] is not None and r['min_interval_minutes'] < 60 for r in rows),
              'critical': sum(r['risk'] == 'critical' for r in rows),
              'high': sum(r['risk'] == 'high' for r in rows),
              'medium': sum(r['risk'] == 'medium' for r in rows),
              'scheduled_without_concurrency': sum(bool(r['crons']) and not r['concurrency'] for r in rows),
              'git_push_workflows': sum(r['git_push'] for r in rows),
          }
          Path('/tmp/workflow-audit.json').write_text(json.dumps({'summary':summary,'workflows':rows}, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY

      - name: Publish audit report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          path='ops/workflow-audit.json'
          content="$(base64 -w0 /tmp/workflow-audit.json)"
          sha="$(gh api "repos/$repo/contents/$path" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/$repo/contents/$path" -f message='Publish exhaustive workflow audit [skip ci]' -f content="$content" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$repo/contents/$path" -f message='Publish exhaustive workflow audit [skip ci]' -f content="$content" >/dev/null
          fi
