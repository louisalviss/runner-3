name: Maintenance - Workflow Security Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-workflow-audit-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-workflow-security-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Audit all active workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('.github/workflows')
          files = sorted(list(root.glob('*.yml')) + list(root.glob('*.yaml')))
          trigger_keys = (
              'schedule','push','workflow_dispatch','workflow_run','pull_request',
              'pull_request_target','repository_dispatch'
          )
          auto_trigger_keys = {'schedule','push','workflow_run','repository_dispatch'}
          write_permissions = (
              'actions','checks','contents','deployments','discussions','id-token',
              'issues','packages','pages','pull-requests','repository-projects',
              'security-events','statuses'
          )
          broad_patterns = [
              r'^CLOUDFLARE_(?:API_TOKEN|API_KEY|GLOBAL_API_KEY)$',
              r'^CF_(?:API_TOKEN|API_KEY)$',
              r'^(?:GH|GITHUB)_(?:PAT|PERSONAL_ACCESS_TOKEN)$',
              r'(?:SSH|SFTP).*PRIVATE.*KEY', r'PRIVATE_KEY',
              r'(?:^|_)(?:PASSWORD|PASSWD|PASS)$',
              r'^WASMER_.*TOKEN$', r'^VERCEL_.*TOKEN$', r'^DROPBOX_.*TOKEN$',
              r'^AWS_.*(?:SECRET|KEY)$', r'^R2_.*(?:SECRET|KEY)$',
              r'^(?:WP|WORDPRESS)_.*(?:PASSWORD|TOKEN)$',
              r'^MODAL_(?:TOKEN|SECRET)'
          ]

          def refs(text):
              out = set(re.findall(r'secrets\.([A-Za-z0-9_]+)', text))
              out.update(re.findall(r"secrets\[['\"]([A-Za-z0-9_]+)['\"]\]", text))
              return sorted(out)

          def broad(name):
              return any(re.search(p, name, re.I) for p in broad_patterns)

          rows = []
          for path in files:
              text = path.read_text(encoding='utf-8', errors='replace')
              secret_refs = refs(text)
              broad_refs = sorted(s for s in secret_refs if broad(s))
              triggers = [
                  k for k in trigger_keys
                  if re.search(r'(?m)^\s{2,}' + re.escape(k) + r'\s*:', text)
              ]
              auto_triggers = sorted(set(triggers) & auto_trigger_keys)
              writes = sorted({
                  p for p in write_permissions
                  if re.search(r'(?mi)^\s*' + re.escape(p) + r'\s*:\s*write\s*(?:#.*)?$', text)
              })
              git_push = bool(re.search(r'(?m)\bgit\s+push\b', text))
              self_hosted = bool(re.search(r'runs-on\s*:.*self-hosted|\[\s*self-hosted', text, re.I))
              core_write = bool(re.search(r"/(?:events(?:['\"?]|$)|state/|checkpoints/)", text))
              core_token = 'RUNNER3_CORE_TOKEN' in secret_refs

              if broad_refs:
                  category = 'move_private'
              elif secret_refs or writes or git_push or 'workflow_run' in triggers or (core_write and not core_token):
                  category = 'harden_only'
              else:
                  category = 'keep_public'

              rows.append({
                  'file': path.name,
                  'category': category,
                  'triggers': triggers,
                  'auto_triggers': auto_triggers,
                  'secret_refs': secret_refs,
                  'broad_secret_refs': broad_refs,
                  'write_permissions': writes,
                  'git_push': git_push,
                  'self_hosted': self_hosted,
                  'core_write': core_write,
                  'core_token': core_token,
              })

          summary = {
              'active_workflows': len(rows),
              'with_secret_refs': sum(bool(r['secret_refs']) for r in rows),
              'with_broad_secret_refs': sum(bool(r['broad_secret_refs']) for r in rows),
              'with_write_permissions': sum(bool(r['write_permissions']) for r in rows),
              'with_git_push': sum(r['git_push'] for r in rows),
              'self_hosted': sum(r['self_hosted'] for r in rows),
              'pull_request_target': sum('pull_request_target' in r['triggers'] for r in rows),
              'runner3_core_write_callers': sum(r['core_write'] for r in rows),
              'runner3_core_write_missing_token': sum(r['core_write'] and not r['core_token'] for r in rows),
              'runner3_core_token_consumers': sum('RUNNER3_CORE_TOKEN' in r['secret_refs'] for r in rows),
              'cloudflare_api_token_consumers': sum('CLOUDFLARE_API_TOKEN' in r['secret_refs'] for r in rows),
              'move_private': sum(r['category'] == 'move_private' for r in rows),
              'harden_only': sum(r['category'] == 'harden_only' for r in rows),
              'keep_public': sum(r['category'] == 'keep_public' for r in rows),
          }
          focus = {
              'summary': summary,
              'core_write_callers': [
                  {'file':r['file'], 'token':r['core_token'], 'triggers':r['triggers']}
                  for r in rows if r['core_write']
              ],
              'broad_secret_auto_triggered': [
                  {'file':r['file'], 'secrets':r['broad_secret_refs'], 'triggers':r['auto_triggers']}
                  for r in rows if r['broad_secret_refs'] and r['auto_triggers']
              ],
              'self_hosted_with_secrets': [
                  {'file':r['file'], 'secrets':r['secret_refs']}
                  for r in rows if r['self_hosted'] and r['secret_refs']
              ],
              'pull_request_target_sensitive': [
                  {'file':r['file'], 'secrets':r['secret_refs'], 'write_permissions':r['write_permissions']}
                  for r in rows if 'pull_request_target' in r['triggers'] and (r['secret_refs'] or r['write_permissions'])
              ],
          }
          print('SECURITY_AUDIT_JSON_BEGIN')
          print(json.dumps(focus, ensure_ascii=False, indent=2))
          print('SECURITY_AUDIT_JSON_END')
          PY
