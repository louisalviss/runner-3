name: Private Backtest Factor Beta

on:
  push:
    branches: [main]
    paths:
      - 'jobs/private-backtest-factor-beta.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-backtest-factor-beta
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression dependency
        run: python -m pip install --disable-pip-version-check 'numpy>=2.0,<3'
      - name: Analyze factor and beta decomposition
        shell: bash
        run: |
          SCOPE="$(python -c 'import json; print(json.load(open("jobs/private-backtest-factor-beta.json"))["scope"])')"
          python tools/private_backtest_factor_beta.py --scope "$SCOPE"
