name: Deploy Gwen-TTS on Modal
run-name: Gwen stable voice clone UI — UI-FIX

on:
  push:
    branches: [main]
    paths:
      - 'modal_gwen_tts_fixed.py'
      - '.github/workflows/modal-gwen-tts-deploy.yml'
  workflow_dispatch:

concurrency:
  group: modal-gwen-tts-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      NO_COLOR: '1'
      CI_MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      CI_MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal SDK
        run: python -m pip install --upgrade 'modal==1.5.3'

      - name: Load Modal credentials from GitHub Secrets when present
        if: ${{ env.CI_MODAL_TOKEN_ID != '' && env.CI_MODAL_TOKEN_SECRET != '' }}
        shell: bash
        run: |
          echo "MODAL_TOKEN_ID=$CI_MODAL_TOKEN_ID" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$CI_MODAL_TOKEN_SECRET" >> "$GITHUB_ENV"

      - name: Authenticate Modal interactively when secrets are absent
        if: ${{ env.CI_MODAL_TOKEN_ID == '' || env.CI_MODAL_TOKEN_SECRET == '' }}
        shell: bash
        run: |
          echo 'TARGET_RUN=Gwen stable voice clone UI UI-FIX'
          python -m modal token new --verify

      - name: Verify Modal authentication
        run: python -m modal token info

      - name: Deploy Gwen-TTS service
        shell: bash
        run: |
          set -euo pipefail
          python -m modal deploy modal_gwen_tts_fixed.py 2>&1 | tee /tmp/modal-deploy.log
          sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/modal-deploy.log > /tmp/modal-deploy-clean.log
          URL="$(grep -Eo 'https://[^[:space:]]+\.modal\.run' /tmp/modal-deploy-clean.log | tail -n1)"
          test -n "$URL"
          echo "GWEN_ENDPOINT=$URL" | tee -a "$GITHUB_ENV" "$GITHUB_STEP_SUMMARY"

      - name: Verify health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 180 "$GWEN_ENDPOINT/health" -o /tmp/gwen-health.json
          cat /tmp/gwen-health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/gwen-health.json'))
          assert d['ok'] is True
          assert 'L4' in d['gpu']
          assert d['dtype'] == 'bfloat16'
          assert d['attention'] == 'sdpa'
          assert d['ui'] == 'voice-clone-stable'
          assert d['version'] == '0.6'
          PY

      - name: Verify UI renders
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 180 "$GWEN_ENDPOINT/" -o /tmp/gwen-ui.html
          grep -F 'id="cloneForm"' /tmp/gwen-ui.html
          grep -F 'id="refAudio"' /tmp/gwen-ui.html
          grep -F "fetch('/tts-upload'" /tmp/gwen-ui.html
          grep -F 'Tạo giọng của tôi' /tmp/gwen-ui.html
          echo 'UI_SMOKE_OK'

      - name: Run Vietnamese synthesis demo
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --max-time 900 "$GWEN_ENDPOINT/demo" -o /tmp/gwen-demo.wav
          test -s /tmp/gwen-demo.wav
          python - <<'PY'
          import wave, os
          p='/tmp/gwen-demo.wav'
          with wave.open(p,'rb') as w:
              frames=w.getnframes(); rate=w.getframerate(); channels=w.getnchannels()
              duration=frames/rate
          print(f'WAV_OK rate={rate} channels={channels} duration={duration:.2f}s bytes={os.path.getsize(p)}')
          assert rate > 10000
          assert channels in (1,2)
          assert duration > 1.0
          PY

      - name: Publish result to repo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, wave
          from datetime import datetime, timezone
          from pathlib import Path
          wav=Path('/tmp/gwen-demo.wav')
          with wave.open(str(wav),'rb') as w:
              duration=w.getnframes()/w.getframerate(); rate=w.getframerate(); channels=w.getnchannels()
          health=json.load(open('/tmp/gwen-health.json'))
          result={
              'ok': True,
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'endpoint': os.environ['GWEN_ENDPOINT'],
              'model': 'g-group-ai-lab/gwen-tts-0.6B',
              'gpu': health['gpu'],
              'dtype': 'bfloat16',
              'attention': 'sdpa',
              'ui': health['ui'],
              'version': health['version'],
              'demo': {
                  'bytes': wav.stat().st_size,
                  'duration_seconds': round(duration,3),
                  'sample_rate': rate,
                  'channels': channels,
                  'sha256': hashlib.sha256(wav.read_bytes()).hexdigest(),
              },
          }
          Path('modal-gwen-tts-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modal-gwen-tts-result.json
          git diff --cached --quiet || git commit -m 'test: record Gwen-TTS Modal result'
          git pull --rebase origin main || true
          git push
