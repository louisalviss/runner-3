name: Runner3 RSS Selected Analysis Fetch

on:
  push:
    branches: [main]
    paths:
      - "data/rss-reader/analysis-request.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-rss-selected-analysis
  cancel-in-progress: false

jobs:
  fetch-selected:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check -q "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"

      - name: Fetch selected canonical articles in one parallel batch
        id: fetch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf /tmp/rss-analysis-fetch
          python scripts/rss_selected_fetch.py \
            --request data/rss-reader/analysis-request.json \
            --run-id "${{ github.run_id }}" | tee /tmp/rss-analysis-fetch.log
          rc=${PIPESTATUS[0]}
          if [[ -s /tmp/rss-analysis-fetch/payload.json ]]; then
            echo "has_payload=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_payload=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Read request id
        id: request
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p='data/rss-reader/analysis-request.json'
          try:
              obj=json.load(open(p, encoding='utf-8'))
              rid=str(obj.get('requestId') or 'unknown').replace('\n','-').replace('\r','-')
          except Exception:
              rid='unknown'
          print('id='+rid)
          PY

      - name: Upload selected article payload
        if: always() && steps.fetch.outputs.has_payload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rss-analysis-${{ steps.request.outputs.id }}-${{ github.run_id }}
          path: /tmp/rss-analysis-fetch/payload.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Persist analysis cache pointer index
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/rss-reader/analysis-cache-index.json ]]; then
            echo "No analysis cache index generated"
            exit 0
          fi
          git config user.name "runner3-rss-bot"
          git config user.email "runner3-rss-bot@users.noreply.github.com"
          git add data/rss-reader/analysis-cache-index.json
          if git diff --cached --quiet; then
            echo "No analysis cache pointer changes"
            exit 0
          fi
          git commit -m "Update RSS analysis cache pointers [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report extraction outcome
        if: always()
        shell: bash
        run: |
          echo "fetch=${{ steps.fetch.outcome }}"
          # Partial batch failures are allowed because successful items remain usable.
          # The cache index records per-item errors; ChatGPT must surface them explicitly.
          exit 0
