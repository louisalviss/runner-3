name: MMO Opportunity Aggregate Recovery

on:
  push:
    branches: [main]
    paths:
      - 'mmo-opportunity-recovery-trigger/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Download completed extraction shards from source run
        uses: actions/download-artifact@v4
        with:
          pattern: mmo-opportunity-*-31869561648
          path: mmo_opportunity_shards
          merge-multiple: true
          repository: louisalviss/runner-3
          run-id: 31869561648
      - name: Aggregate opportunity evidence
        run: python scripts/mmo_opportunity_extract.py aggregate mmo_opportunity_shards --output mmo_opportunity_aggregate
      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: mmo-opportunity-aggregate-recovery-${{ github.run_id }}
          path: mmo_opportunity_aggregate/
          if-no-files-found: error
          retention-days: 7
