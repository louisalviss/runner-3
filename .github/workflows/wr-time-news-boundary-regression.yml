name: WR Time News Boundary Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wr-time-news-boundary-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wr-parity-repair
      - name: Run deterministic Pine boundary tests
        run: |
          python -m pip install -q requests
          python wave-rider-verify/test_time_news_semantics.py
