name: Site1 Edge Production

on:
  pull_request:
    branches: [main]
    paths:
      - 'edge/wordpress-edge-proxy/**'
      - 'scripts/build-wordpress-edge-snapshot.mjs'
      - 'scripts/build-site1-mobile-inline-hero.mjs'
      - 'scripts/pagespeed-ui-mobile-audit.mjs'
      - '.github/workflows/site1-edge-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner3wp-site1-edge-production
  cancel-in-progress: true

env:
  PROD_DOMAIN: https://runner3wp.pntr.dev
  ROLLBACK_SHA: 9124f5957e176ffc9aa64444c980f3c5d6642a0d

jobs:
  deploy_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build canonical Site1 candidate
        id: prep
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo REJECT > /tmp/verdict
          npm install --no-save sharp@0.34.3 playwright-core@1.61.0 >/dev/null

          node --check edge/wordpress-edge-proxy/src/entry.js
          node --check edge/wordpress-edge-proxy/src/responsive-images.js
          node --check scripts/build-site1-mobile-inline-hero.mjs
          node --check scripts/pagespeed-ui-mobile-audit.mjs

          node scripts/build-wordpress-edge-snapshot.mjs
          node scripts/build-site1-mobile-inline-hero.mjs

          C="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$C"
          echo "CHROME_PATH=$C" >> "$GITHUB_ENV"

      - name: Deploy canonical candidate
        id: deploy
        if: steps.prep.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.124.0 deploy \
            --config edge/wordpress-edge-proxy/wrangler.jsonc \
            >/tmp/deploy.log 2>&1
          touch /tmp/deployed
          sleep 5

      - name: Functional and responsive guard
        id: guard
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            B="__site1canonical=$(date +%s%N)-$attempt"
            if curl -fsS -H 'Cache-Control: no-cache' -D /tmp/h -o /tmp/home "$PROD_DOMAIN/?$B" \
              && grep -Eiq '^x-edge-snapshot:[[:space:]]*HIT' /tmp/h \
              && grep -Eiq '^x-edge-cache-policy:[[:space:]]*snapshot-direct' /tmp/h \
              && grep -q 'data-runner3-mobile-inline-lcp="v1"' /tmp/home; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" = 1

          if grep -Eiq '^link:.*r2\.dev.*preconnect' /tmp/h; then
            echo HEADER_PRECONNECT_PRESENT
            exit 8
          fi
          if grep -Eiq '<link[^>]+(preconnect|dns-prefetch)[^>]+r2\.dev' /tmp/home; then
            echo HTML_PRECONNECT_PRESENT
            exit 9
          fi

          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.CHROME_PATH,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });

          async function probe(width, height) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto(
              `${process.env.PROD_DOMAIN}/?__guard=${Date.now()}`,
              { waitUntil: 'networkidle', timeout: 60000 },
            );
            const result = await page.evaluate(() => {
              const picture = document.querySelector('[data-runner3-mobile-inline-lcp="v1"]');
              const img = picture?.querySelector('img');
              const r2pre = [...document.querySelectorAll(
                'link[rel="preconnect"],link[rel="dns-prefetch"]',
              )].some((item) => /r2\.dev/.test(item.href));
              return {
                picture: Boolean(picture),
                currentSrc: img?.currentSrc || '',
                naturalWidth: img?.naturalWidth || 0,
                r2pre,
              };
            });
            await page.close();
            return result;
          }

          const mobile = await probe(390, 844);
          const desktop = await probe(1440, 1200);
          console.log('RESPONSIVE_GUARD', JSON.stringify({ mobile, desktop }));

          if (!mobile.picture
            || !mobile.currentSrc.startsWith('data:image/webp;base64,')
            || mobile.naturalWidth !== 320
            || mobile.r2pre) {
            throw new Error('mobile guard failed');
          }
          if (!desktop.picture
            || desktop.currentSrc.startsWith('data:image/')
            || !desktop.currentSrc.includes('/__runner3/r2-image/offset-demo-01-')
            || desktop.naturalWidth < 500
            || desktop.r2pre) {
            throw new Error('desktop guard failed');
          }
          await browser.close();
          NODE

          curl -sS -D /tmp/admin -o /dev/null "$PROD_DOMAIN/wp-admin/"
          grep -Eiq '^HTTP/[^ ]+[[:space:]]+307' /tmp/admin
          grep -Eiq '^location:[[:space:]]*https://runner3-factory-smoke-2\.wasmer\.app' /tmp/admin

          curl -fsS \
            -H 'Cookie: wordpress_logged_in_probe=1' \
            -D /tmp/auth \
            -o /tmp/authbody \
            "$PROD_DOMAIN/"
          grep -Eiq '^x-edge-mode:[[:space:]]*bypass' /tmp/auth

      - name: Official PageSpeed 5x target gate
        id: psi
        if: steps.guard.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            PSI_URL="$PROD_DOMAIN/" \
              PSI_UI_OUT="/tmp/psi-$i.json" \
              timeout 330s \
              node scripts/pagespeed-ui-mobile-audit.mjs
          done

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          function seconds(value) {
            const match = String(value ?? '').trim().match(/^([0-9.]+)\s*(ms|s)?$/);
            if (!match) return null;
            const number = Number(match[1]);
            return match[2] === 'ms' ? number / 1000 : number;
          }

          const rows = [];
          for (let i = 1; i <= 5; i += 1) {
            const data = JSON.parse(fs.readFileSync(`/tmp/psi-${i}.json`, 'utf8'));
            const row = {
              run: i,
              performance: data.performance,
              fcp: seconds(data.fcp),
              lcp: seconds(data.lcp),
              tbt: data.tbt,
              cls: data.cls,
              url: data.resultUrl,
            };
            rows.push(row);
            console.log('PSI', JSON.stringify(row));
          }

          const values = rows
            .map((row) => row.lcp)
            .filter(Number.isFinite)
            .sort((a, b) => a - b);
          const median = values.length === 5 ? values[2] : 99;
          const p100 = rows.filter((row) => row.performance === 100).length;
          const pass = values.length === 5 && p100 === 5 && median <= 0.9;

          console.log('MEDIAN_LCP', median);
          console.log('P100_COUNT', p100);
          console.log('TARGET_PASS', pass);
          fs.writeFileSync('/tmp/verdict', pass ? 'PASS' : 'REJECT');
          NODE

      - name: Roll back unless target passed
        id: rollback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          verdict="$(cat /tmp/verdict 2>/dev/null || echo REJECT)"
          if [ "$verdict" = PASS ]; then
            echo KEEP_CANDIDATE
            exit 0
          fi
          if [ ! -f /tmp/deployed ]; then
            echo NO_DEPLOY_TO_ROLLBACK
            exit 0
          fi

          git reset --hard
          git clean -fd
          git checkout --detach "$ROLLBACK_SHA"
          node scripts/build-wordpress-edge-snapshot.mjs
          npx --yes wrangler@4.124.0 deploy \
            --config edge/wordpress-edge-proxy/wrangler.jsonc \
            >/tmp/rollback.log 2>&1
          sleep 5

          B="__rollback=$(date +%s%N)"
          curl -fsS -H 'Cache-Control: no-cache' -D /tmp/rh -o /tmp/rhome "$PROD_DOMAIN/?$B"
          grep -Eiq '^x-edge-snapshot:[[:space:]]*HIT' /tmp/rh
          grep -Eiq '^x-edge-cache-policy:[[:space:]]*snapshot-direct' /tmp/rh
          echo ROLLBACK_VERIFIED

      - name: Final verdict
        if: always()
        run: |
          echo "FINAL_VERDICT=$(cat /tmp/verdict 2>/dev/null || echo REJECT)"
          echo "PREP=${{ steps.prep.outcome }} DEPLOY=${{ steps.deploy.outcome }} GUARD=${{ steps.guard.outcome }} PSI=${{ steps.psi.outcome }} ROLLBACK=${{ steps.rollback.outcome }}"
