name: UWU4D Public SABA Lobby Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uwu4d-saba-lobby-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip install --user -q playwright
          mkdir -p evidence
      - name: Follow visible SABA card and Outright
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('evidence')
          kw=re.compile(r'saba|outright|future|top\s*4|top\s*6|relegat|goal.?scorer|golden boot|winner|champion',re.I)
          block=re.compile(r'captcha|verify you are human|security verification|access denied|just a moment',re.I)
          net=[]; hits=[]; result={}

          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True)
            c=b.new_context(locale='en-US',viewport={'width':1440,'height':900})
            def rq(r):
              if r.resource_type in ('document','xhr','fetch'):
                net.append({'kind':'request','method':r.method,'type':r.resource_type,'url':r.url,'post':(r.post_data or '')[:16000]})
            def rs(r):
              if r.request.resource_type not in ('document','xhr','fetch'): return
              net.append({'kind':'response','status':r.status,'type':r.request.resource_type,'url':r.url})
              try:
                if 'json' in (r.headers.get('content-type') or '').lower():
                  t=r.text()
                  if len(t)<3000000 and kw.search(t):
                    for m in list(kw.finditer(t))[:15]:
                      hits.append({'source':'json','url':r.url,'status':r.status,'snippet':t[max(0,m.start()-700):min(len(t),m.end()+4000)]})
              except Exception: pass
            c.on('request',rq); c.on('response',rs)
            pg=c.new_page()
            r=pg.goto('https://uwu4d.com/',wait_until='domcontentloaded',timeout=35000)
            pg.wait_for_timeout(7000)
            result['home']={'status':r.status if r else None,'url':pg.url,'title':pg.title()}

            # Dismiss ordinary promotional overlays using normal UI semantics only.
            pg.keyboard.press('Escape')
            pg.wait_for_timeout(1500)
            # Try visible close buttons on centered promos/chat; ignore if absent.
            for selector in ['button[aria-label="Close"]','.modal button.close','.modal .btn-close','[data-bs-dismiss="modal"]']:
              try:
                loc=pg.locator(selector)
                for i in range(min(loc.count(),10)):
                  if loc.nth(i).is_visible(): loc.nth(i).click(timeout=2000)
              except Exception: pass
            pg.keyboard.press('Escape'); pg.wait_for_timeout(1000)

            label=pg.locator('.game-name').filter(has_text=re.compile(r'^\s*SABA\s+Sports\s*$',re.I)).first
            result['label_count']=pg.locator('.game-name').filter(has_text=re.compile(r'^\s*SABA\s+Sports\s*$',re.I)).count()
            if label.count() and label.is_visible():
              # Inspect ancestors and pick the nearest naturally clickable/card container.
              chain=label.evaluate('''e => { let a=[], n=e; for(let i=0;i<8 && n;i++,n=n.parentElement){a.push({tag:n.tagName,cls:n.className||'',href:n.href||'',onclick:n.getAttribute&&n.getAttribute('onclick')||'',role:n.getAttribute&&n.getAttribute('role')||'',html:n.outerHTML.slice(0,6000)})}; return a }''')
              result['ancestor_chain']=chain
              card=label
              for up in range(1,8):
                parent=label.locator('xpath=' + '/..'*up)
                try:
                  if not parent.count(): break
                  meta=parent.evaluate('e=>({tag:e.tagName,href:e.href||e.closest("a")?.href||"",onclick:e.getAttribute("onclick")||"",role:e.getAttribute("role")||"",cls:e.className||"",cursor:getComputedStyle(e).cursor})')
                  if meta['tag']=='A' or meta['href'] or meta['onclick'] or meta['role']=='button' or meta['cursor']=='pointer' or re.search(r'game|card|item',meta['cls'],re.I):
                    card=parent; result['chosen_card']=meta; break
                except Exception: pass

              before=set(c.pages); before_url=pg.url
              try:
                card.scroll_into_view_if_needed(); pg.wait_for_timeout(500)
                card.click(timeout=8000)
                pg.wait_for_timeout(10000)
                result['clicked']=True
              except Exception as e:
                result['click_error']=repr(e)

              new=[x for x in c.pages if x not in before]
              target=new[-1] if new else pg
              try: target.wait_for_load_state('domcontentloaded',timeout=15000)
              except Exception: pass
              target.wait_for_timeout(5000)
              try: text=target.locator('body').inner_text(timeout=8000)
              except Exception as e: text=''; result['body_error']=repr(e)
              result['launch']={'before':before_url,'after':target.url,'title':target.title(),'text':text[:100000],'frames':[{'name':f.name,'url':f.url} for f in target.frames]}
              target.screenshot(path=str(out/'saba-launch.png'),full_page=False)

              if text and not block.search(text[:10000]):
                # If ordinary visible login is required, stop without authenticating.
                if re.search(r'\b(Login|Log In|Username|Password|Sign In)\b',text[:15000],re.I) and not re.search(r'\bOutright',text,re.I):
                  result['login_gate']=True
                else:
                  cand=target.locator('a,button,[role=button],div,span').filter(has_text=re.compile(r'^\s*(Outright|Outrights|Futures?)\s*$',re.I))
                  result['outright_count']=cand.count()
                  for i in range(min(cand.count(),60)):
                    el=cand.nth(i)
                    try:
                      if not el.is_visible(): continue
                      result['outright_control']={'tag':el.evaluate('e=>e.tagName'),'text':el.inner_text()[:300],'html':el.evaluate('e=>e.outerHTML')[:6000]}
                      el.click(timeout=6000); target.wait_for_timeout(10000)
                      ot=target.locator('body').inner_text(timeout=8000)
                      result['outright']={'url':target.url,'text':ot[:150000]}
                      target.screenshot(path=str(out/'outright.png'),full_page=False)
                      for line in ot.splitlines():
                        if kw.search(line): hits.append({'source':'visible','url':target.url,'snippet':line[:2200]})
                      break
                    except Exception as e: result.setdefault('outright_errors',[]).append(repr(e)[:600])
            else:
              result['error']='Visible SABA Sports card not found'
            pg.screenshot(path=str(out/'home-after-dismiss.png'),full_page=False)
            b.close()

          out.joinpath('result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          out.joinpath('network.json').write_text(json.dumps(net,ensure_ascii=False,indent=2))
          out.joinpath('hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2))
          print('RESULT',json.dumps(result,ensure_ascii=False)[:70000])
          print('HITS',len(hits))
          for h in hits[:80]: print('HIT',json.dumps(h,ensure_ascii=False)[:5000])
          print('NETWORK_HINTS')
          seen=set()
          for x in net:
            u=x.get('url','')
            if u in seen: continue
            seen.add(u)
            if re.search(r'saba|sport|odds|market|event|launch|api|game',u,re.I): print(x.get('kind'),x.get('status',''),x.get('method',''),u)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uwu4d-saba-${{ github.run_id }}
          path: evidence/
          retention-days: 7
