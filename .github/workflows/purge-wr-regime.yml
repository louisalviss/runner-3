name: Purge WR Regime Research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-wr-regime.yml'

permissions:
  actions: write
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete transient WR research
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in 9270528967 9270519189 9270508422; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}" || true
          done
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/31973577737" || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/wr-regime-temp" || true
