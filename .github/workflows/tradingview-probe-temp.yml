name: TradingView Probe Temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tradingview-probe-temp.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture report detail tabs
        shell: bash
        run: |
          set -euo pipefail
          OUT='evidence/tradingview-5he8tYVr-report'
          rm -rf "$OUT" && mkdir -p "$OUT"
          npm install --no-save playwright-core@1.58.2 >/dev/null
          OUT="$OUT" node <<'NODE'
          const fs=require('fs'),path=require('path'),{chromium}=require('playwright-core');const OUT=process.env.OUT;
          const URL='https://www.tradingview.com/script/5he8tYVr-ProBorsa-RSI-SuperTrend-%C3%96zel-Dip-Stratejisi/';
          const put=(f,s)=>fs.writeFileSync(path.join(OUT,f),s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);const b=await chromium.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const c=await b.newContext({viewport:{width:1920,height:1600},locale:'en-US'});const p=await c.newPage();await p.goto(URL,{waitUntil:'domcontentloaded',timeout:90000});await sleep(10000);await p.locator('button#strategy').click({force:true});await sleep(8000);
          for(const id of ['Properties','List of Trades','Performance','Trades Analysis','Ratios']){const tab=p.locator(`button[id="${id}"]`);put(id.replaceAll(' ','-').toLowerCase()+'-count.txt',String(await tab.count()));if(await tab.count()){await tab.click({force:true});await sleep(4000);put(id.replaceAll(' ','-').toLowerCase()+'.txt',await p.locator('body').innerText());put(id.replaceAll(' ','-').toLowerCase()+'.html',await p.content());}}
          await b.close();})().catch(e=>{put('error.txt',e.stack+'\n');console.error(e.stack);process.exit(7)});
          NODE
      - name: Persist
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/tradingview-5he8tYVr-report || true
          git commit -m 'Publish TradingView report details [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main || true
