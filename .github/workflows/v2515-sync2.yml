name: WR v2.5.15 Sync2
on:
  push:
    branches: [v2515-live-sync]
    paths: ['.github/workflows/v2515-sync2.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VERIFIER_URL: "https://ucb480388fb386abd86d818efafc.dl.dropboxusercontent.com/cd/0/get/DGY0faBYOW60EDORGSC_nK9mzbii7L4Zem68ib0iQPjpjVPiQHsGAjBlXytnH51q1gmMJRZMtRaujaOhlvxzDccr7PeRrmNEvfGB0FERNy52rkkUJ_cO6yVVp-JEigGAhxkHseVvx5u-UObWF0OwSRajQ5LS3ORWAmaVXsV0TZo1ow/file?c_luid=3c63ed66"
    steps:
      - uses: actions/checkout@v4
      - name: Restore inputs
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          git fetch --no-tags --depth=1 origin d2b7b8febb4735b06c45638447df1eb70cfd3bf3
          git show d2b7b8febb4735b06c45638447df1eb70cfd3bf3:ops/tradingview/wr-window-report.pine.aes >/tmp/wr.aes
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in /tmp/wr.aes -out /tmp/wr2513.pine
          test "$(sha256sum /tmp/wr2513.pine|awk '{print $1}')" = 9156e8c49b9a5e36007620f3e17fcab26c06714a3e32a252be52437ae23d6026
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/session-state.json.aes -out /tmp/tv-state.json
          curl -fL "$VERIFIER_URL" -o /tmp/reference_verify.py
          echo RESTORE=PASS
      - name: Build
        run: |
          python3 ops/tradingview/v2515_builder.py | tee /tmp/build.log
          python3 -m py_compile /tmp/reference_verify_v2.5.15.py
      - name: Python windows
        run: |
          set -euo pipefail
          mkdir -p /tmp/pyproof
          case1(){ sym="$1"; s="$2"; e="$3"; tag="$4"; rm -rf wave-rider-verify/output; WR_SYMBOL="$sym" WR_TF=5 WR_QTY_STEP=1 WR_STATE_START='2026-07-28T00:00:00+07:00' WR_REPORT_START="$s" WR_REPORT_END="$e" python3 /tmp/reference_verify_v2.5.15.py >"/tmp/pyproof/${tag}_${sym}.json"; }
          case1 BNBUSDT 2026-08-05T00:00:00+07:00 2026-08-10T00:00:00+07:00 W1
          case1 TRXUSDT 2026-08-05T00:00:00+07:00 2026-08-10T00:00:00+07:00 W1
          case1 BNBUSDT 2026-08-10T00:00:00+07:00 2026-08-16T00:00:00+07:00 W2
          case1 TRXUSDT 2026-08-10T00:00:00+07:00 2026-08-16T00:00:00+07:00 W2
          python3 - <<'PY' | tee /tmp/python-summary.txt
          import glob,json,os
          for f in sorted(glob.glob('/tmp/pyproof/*.json')):
              d=json.load(open(f)); q=d['summary'][0]
              print(os.path.basename(f),f"TRADES={q['trades']}",f"TOTAL_R={q['total_r']}",f"WR={q['win_rate']}")
          PY
      - name: TradingView live
        run: |
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node ops/tradingview/v2515_tv.js | tee /tmp/tv.log
      - name: Package
        if: always()
        run: |
          mkdir -p /tmp/pkg
          cp '/tmp/Wave Rider Strategy v2.5.15 WINDOW DETERMINISTIC.md' /tmp/reference_verify_v2.5.15.py /tmp/build.log /tmp/python-summary.txt /tmp/tv.log /tmp/pyproof/*.json /tmp/*.png /tmp/pkg/ 2>/dev/null || true
          sha256sum /tmp/wr2515.pine /tmp/reference_verify_v2.5.15.py >/tmp/pkg/SHA256SUMS.txt 2>/dev/null || true
          echo RUN_ID=${{ github.run_id }} >/tmp/pkg/RUN.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-v2515-sync2
          path: /tmp/pkg
          retention-days: 1
      - name: Persist pointer
        if: always()
        run: |
          { echo WR_V2515_SYNC2; echo RUN_ID=${{ github.run_id }}; grep -E 'WR2515_SHA256|VER2515_SHA256' /tmp/build.log 2>/dev/null || true; cat /tmp/python-summary.txt 2>/dev/null || true; cat /tmp/tv.log 2>/dev/null || true; } > ops/tradingview/v2515-sync2-result.txt
          git config user.name github-actions; git config user.email actions@github.com
          git add ops/tradingview/v2515-sync2-result.txt; git commit -m 'chore: save v2515 sync2 [skip ci]' || true; git push origin HEAD:v2515-live-sync
      - if: always()
        run: rm -rf /tmp/wr*.pine /tmp/reference_verify*.py '/tmp/Wave Rider Strategy v2.5.15 WINDOW DETERMINISTIC.md' /tmp/tv-state.json /tmp/pkg /tmp/pyproof
