name: Audio Library ChatGPT Pending Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: runner3-audio-chatgpt-pending
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CHATGPT_PENDING_PUBLIC_KEY: cxh/7AgKKtFtgELK+Tx3GuDFY6OECaiyHSQ23ClX1lk=
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests 'cryptography>=45,<47'
      - name: Fetch and encrypt pending queue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,secrets
          from pathlib import Path
          import requests
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey,X25519PublicKey
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305

          status=json.loads(Path('ops/audio-library/chatgpt-bridge-status.json').read_text(encoding='utf-8'))
          bridge=status['url'].rstrip('/')
          qtoken=hashlib.sha256(b'runner3-chatgpt-queue-v2\0'+os.environ['CLOUDFLARE_API_TOKEN'].encode()).hexdigest()
          r=requests.get(bridge+'/pending',params={'token':qtoken},timeout=30)
          r.raise_for_status()
          payload=r.json()
          plain=json.dumps(payload,ensure_ascii=False,separators=(',',':')).encode()
          recipient=X25519PublicKey.from_public_bytes(base64.b64decode(os.environ['CHATGPT_PENDING_PUBLIC_KEY']))
          eph=X25519PrivateKey.generate()
          shared=eph.exchange(recipient)
          key=HKDF(algorithm=hashes.SHA256(),length=32,salt=None,info=b'runner3-audio-library-pending-v1').derive(shared)
          nonce=secrets.token_bytes(12)
          cipher=ChaCha20Poly1305(key).encrypt(nonce,plain,b'runner3-audio-library-pending-v1')
          env={
            'v':1,
            'ephemeralPublicKey':base64.b64encode(eph.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)).decode(),
            'nonce':base64.b64encode(nonce).decode(),
            'ciphertext':base64.b64encode(cipher).decode(),
          }
          Path('ops/audio-library/chatgpt-pending.enc.json').write_text(json.dumps(env,separators=(',',':'))+'\n',encoding='utf-8')
          PY
      - name: Publish encrypted snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/audio-library/chatgpt-pending.enc.json
          git commit -m 'Update encrypted ChatGPT audio queue [skip ci]' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
