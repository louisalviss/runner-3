name: Runner5 AI1WM REST Probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/runner5-ai1wm-rest-probe.yml'
      - 'scripts/probe-ai1wm-rest-routes.mjs'

permissions:
  contents: write

concurrency:
  group: runner5-ai1wm-rest-probe-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decrypt Wasmer account state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || exit 3
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in ops/wasmer/state.automation.aes \
            -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json

      - name: Install browser automation
        run: npm install --no-save playwright-core@1.58.2

      - name: Probe REST route schemas
        run: node scripts/probe-ai1wm-rest-routes.mjs

      - name: Persist route schemas separately
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/runner5-restore-lab-backup.json
          test -s "$src" || printf '{"status":"RUNNER_ERROR","detail":"route_probe_status_missing"}\n' > "$src"
          rm -f /tmp/wasmer-account.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/restore-lab
            cp "$src" ops/restore-lab/runner5-restore-lab-1.ai1wm-routes.json
            git add ops/restore-lab/runner5-restore-lab-1.ai1wm-routes.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Runner5 AI1WM REST route schemas'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 5
