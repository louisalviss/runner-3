name: Tin VN · Trends Live

on:
  push:
    branches: [main]
    paths:
      - 'trends_vn_live.py'
      - '.github/workflows/trends-vn-live.yml'
  schedule:
    # Every 3 hours at :45 Asia/Ho_Chi_Minh so Radar requests stay fresh all day.
    - cron: '45 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trends-vn-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Capture exact current Top 10
        run: python trends_vn_live.py

      - name: Persist latest snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'trends_vn_latest.json';
            const content = fs.readFileSync(path);
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: process.env.GITHUB_REF_NAME
              });
              sha = current.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const args = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `chore: update live Google Trends VN snapshot [skip ci]`,
              content: content.toString('base64'),
              branch: process.env.GITHUB_REF_NAME
            };
            if (sha) args.sha = sha;
            await github.rest.repos.createOrUpdateFileContents(args);
