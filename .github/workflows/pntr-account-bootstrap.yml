name: PNTR Account Token Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pntr-account-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pntr-account-token-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Start PNTR account device flow
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { echo 'AUTOMATION_KEY missing'; exit 2; }
          echo "::add-mask::$AUTOMATION_KEY"
          node <<'NODE'
          const fs=require('fs');
          (async()=>{
            const r=await fetch('https://api.pntr.dev/device/code',{
              method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'}
            });
            const j=await r.json().catch(()=>({}));
            if(!r.ok||!j.device_code||!j.user_code||!j.verification_uri) throw new Error(`device code failed ${r.status}`);
            fs.writeFileSync('/tmp/pntr-device.json',JSON.stringify(j),{mode:0o600});
            fs.writeFileSync('/tmp/pntr-device-user.txt',[
              `OPEN_THIS=${j.verification_uri}`,
              `ENTER_CODE=${j.user_code}`,
              `EXPIRES_IN_SECONDS=${j.expires_in||900}`,
              ''
            ].join('\n'),{mode:0o600});
            console.log('PNTR_DEVICE_FLOW_READY=true');
          })().catch(e=>{console.error('SAFE_ERROR='+String(e).slice(0,180));process.exit(1)});
          NODE

      - name: Publish one-time authorization code
        uses: actions/upload-artifact@v4
        with:
          name: pntr-account-bootstrap-code
          path: /tmp/pntr-device-user.txt
          retention-days: 1
          if-no-files-found: error

      - name: Wait for PNTR authorization
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          (async()=>{
            const d=JSON.parse(fs.readFileSync('/tmp/pntr-device.json','utf8'));
            let interval=Math.max(5,Number(d.interval||5));
            const deadline=Date.now()+Math.min(1050,Number(d.expires_in||900))*1000;
            let auth=null;
            await new Promise(r=>setTimeout(r,interval*1000));
            while(Date.now()<deadline){
              const r=await fetch('https://api.pntr.dev/device/token',{
                method:'POST',
                headers:{Accept:'application/json','Content-Type':'application/json'},
                body:JSON.stringify({device_code:d.device_code,grant_type:'urn:ietf:params:oauth:grant-type:device_code'})
              });
              const j=await r.json().catch(()=>({}));
              if(j.access_token){auth=j;break;}
              if(j.error==='slow_down') interval+=5;
              else if(j.error&&j.error!=='authorization_pending') throw new Error('device auth failed: '+j.error);
              await new Promise(r=>setTimeout(r,interval*1000));
            }
            if(!auth?.access_token) throw new Error('device authorization timed out');
            const expiresAt=auth.expires_in?new Date(Date.now()+Number(auth.expires_in)*1000).toISOString():null;
            const ar=await fetch('https://api.pntr.dev/api/subdomains',{
              headers:{Accept:'application/json',Authorization:`Bearer ${auth.access_token}`}
            });
            const subs=await ar.json().catch(()=>null);
            if(!ar.ok||!Array.isArray(subs)) throw new Error(`account verification failed ${ar.status}`);
            const owns=subs.some(s=>String(s?.full_domain||'').toLowerCase()==='runner3wp.pntr.dev');
            if(!owns) throw new Error('authorized PNTR account does not own runner3wp.pntr.dev');
            fs.writeFileSync('/tmp/pntr-account.json',JSON.stringify({access_token:auth.access_token,expires_at:expiresAt}),{mode:0o600});
            fs.writeFileSync('/tmp/pntr-account-status.json',JSON.stringify({
              status:'ready',runner3wpOwned:true,subdomainCount:subs.length,expiresAt,updatedAt:new Date().toISOString()
            },null,2));
            console.log('PNTR_ACCOUNT_AUTH_OK=true');
            console.log('RUNNER3WP_OWNED=true');
            console.log('SUBDOMAIN_COUNT='+subs.length);
            console.log('TOKEN_HAS_EXPIRY='+(expiresAt?'true':'false'));
          })().catch(e=>{console.error('SAFE_ERROR='+String(e).replace(/[A-Za-z0-9_-]{28,}/g,'[REDACTED]').slice(0,200));process.exit(1)});
          NODE

      - name: Persist encrypted PNTR account token
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/pntr-account.json || exit 3
          test -f /tmp/pntr-account-status.json || exit 4
          echo 'SAFE_PNTR_ACCOUNT_STATUS:'
          cat /tmp/pntr-account-status.json
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
            -in /tmp/pntr-account.json -out /tmp/account-token.aes

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/pntr
            cp /tmp/account-token.aes ops/pntr/account-token.aes
            cp /tmp/pntr-account-status.json ops/pntr/account-auth-status.json
            git add ops/pntr/account-token.aes ops/pntr/account-auth-status.json
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m 'Persist encrypted PNTR account token'
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt*2))
          done
          test "$pushed" = true || exit 5

      - name: Cleanup
        if: always()
        run: rm -f /tmp/pntr-device.json /tmp/pntr-device-user.txt /tmp/pntr-account.json /tmp/pntr-account-status.json /tmp/account-token.aes
