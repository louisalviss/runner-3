name: Wasmer WordPress Provision

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasmer-wordpress-provision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create protected temporary identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, secrets, urllib.request

          def req(url, data=None, token=None):
              headers={'Content-Type':'application/json'}
              if token:
                  headers['Authorization']='Bearer '+token
              r=urllib.request.Request(
                  url,
                  data=(json.dumps(data).encode() if data is not None else None),
                  headers=headers,
                  method='POST' if data is not None else 'GET'
              )
              with urllib.request.urlopen(r, timeout=30) as x:
                  return json.loads(x.read().decode())

          domains=req('https://api.mail.tm/domains')
          domains=domains.get('hydra:member') or domains.get('member') or []
          domain=next(x['domain'] for x in domains if x.get('isActive', True))

          mail_user='runner3wp'+secrets.token_hex(5)
          mail_password=secrets.token_urlsafe(24)
          mail_address=f'{mail_user}@{domain}'
          req('https://api.mail.tm/accounts', {'address':mail_address,'password':mail_password})
          mail_token=req('https://api.mail.tm/token', {'address':mail_address,'password':mail_password})['token']

          wasmer_user='runner3wp'+secrets.token_hex(4)
          wasmer_password='R3!'+secrets.token_urlsafe(24)

          identity={
              'mail_address': mail_address,
              'mail_password': mail_password,
              'mail_token': mail_token,
              'wasmer_user': wasmer_user,
              'wasmer_password': wasmer_password,
          }
          open('/tmp/identity.json','w').write(json.dumps(identity))

          for value in identity.values():
              print('::add-mask::'+value)
          print('IDENTITY_READY=true')
          PY

      - name: Install browser automation
        run: npm install --no-save playwright-core@1.58.2

      - name: Create Wasmer Hobby account and verify email
        shell: bash
        run: |
          set -euo pipefail
          cat > signup-wasmer.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';

          const id=JSON.parse(fs.readFileSync('/tmp/identity.json','utf8'));

          async function main(){
            const browser=await chromium.launch({
              headless:true,
              executablePath:'/usr/bin/google-chrome',
              args:['--no-sandbox']
            });
            const page=await browser.newPage();

            async function pageSummary(label){
              const body=(await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim();
              console.log(label+'_URL='+page.url().replace(/([?&](?:token|code|key|secret)=)[^&]+/ig,'$1[MASKED]'));
              console.log(label+'_BODY='+body.slice(0,900).replaceAll(id.mail_address,'[MASKED_EMAIL]').replaceAll(id.wasmer_user,'[MASKED_USER]'));
              return body;
            }

            async function mailtm(path){
              const r=await fetch('https://api.mail.tm'+path,{headers:{Authorization:'Bearer '+id.mail_token}});
              if(!r.ok) throw new Error('Mail.tm HTTP '+r.status);
              return await r.json();
            }

            try {
              await page.goto('https://wasmer.io/signup',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(1000);

              const personal=page.getByRole('button',{name:/personal/i}).first();
              if(await personal.count()) await personal.click();
              else {
                const personalText=page.getByText(/personal projects/i).first();
                if(await personalText.count()) await personalText.click();
              }
              await page.getByRole('button',{name:/continue/i}).first().click();
              await page.waitForTimeout(1200);

              await page.locator('input[name="username"]').fill(id.wasmer_user);
              await page.locator('input[name="email"]').fill(id.mail_address);
              await page.locator('input[name="password"]').fill(id.wasmer_password);

              let terms=page.getByRole('checkbox').first();
              if(await terms.count()) {
                const checked=await terms.getAttribute('aria-checked');
                if(checked!=='true') await terms.click();
              } else {
                terms=page.locator('button[role="checkbox"]').first();
                if(await terms.count()) await terms.click();
              }

              await page.getByRole('button',{name:/sign up/i}).first().click();
              await page.waitForTimeout(2500);
              let body=await pageSummary('POST_SIGNUP');

              if(/already exists|already taken|invalid email|disposable|temporary email|not allowed/i.test(body)) {
                console.log('WASMER_ACCOUNT_CREATED=false');
                throw new Error('Wasmer rejected signup input');
              }

              console.log('WASMER_SIGNUP_SUBMITTED=true');

              let verifyUrl=null;
              for(let attempt=0; attempt<24 && !verifyUrl; attempt++){
                await page.waitForTimeout(attempt===0?1000:2500);
                const listing=await mailtm('/messages');
                const msgs=listing['hydra:member'] || listing.member || [];
                for(const m of msgs){
                  const from=((m.from||{}).address||'').toLowerCase();
                  const subject=(m.subject||'').toLowerCase();
                  if(!from.includes('wasmer') && !subject.includes('wasmer') && !subject.includes('verify') && !subject.includes('confirm')) continue;
                  const full=await mailtm('/messages/'+m.id);
                  const html=Array.isArray(full.html)?full.html.join('\n'):(full.html||'');
                  const text=(full.text||'')+'\n'+html;
                  const urls=[...text.matchAll(/https?:\/\/[^\s"'<>]+/g)].map(x=>x[0].replace(/&amp;/g,'&'));
                  verifyUrl=urls.find(u=>/wasmer\.io/i.test(u) && /verify|confirm|activation|token|email/i.test(u))
                         || urls.find(u=>/wasmer\.io/i.test(u));
                  if(verifyUrl) break;
                }
              }

              if(verifyUrl){
                console.log('WASMER_VERIFICATION_MAIL=true');
                await page.goto(verifyUrl,{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForTimeout(2500);
                body=await pageSummary('POST_VERIFY');
                console.log('WASMER_EMAIL_VERIFIED='+(!/invalid|expired|error/i.test(body.toLowerCase())));
              } else {
                console.log('WASMER_VERIFICATION_MAIL=false');
              }

              if(!/wasmer\.io/i.test(page.url())) {
                console.log('WASMER_ACCOUNT_CREATED=false');
                throw new Error('Unexpected post-signup destination');
              }
              console.log('WASMER_ACCOUNT_CREATED=true');
            } finally {
              await browser.close();
            }
          }

          await main();
          JS
          node signup-wasmer.mjs

      - name: Encrypt recovery credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/recovery-public.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAowctxsQUZOcIHabYEUt/
          TNUEP+IXuI4ZDHYvupLpVgzvAXXLw5k1vD+Wp4YlZp3jttxBB1doCw28OJSKcRCT
          +l2j5kF0062jpXZtgepesiSrg/fjSCWCXCgPHa0CnP841uOXNsBlf02nFmchFpNP
          0o6lYz54vA75CsweplL6qhbq/ZbWdt5Utn+kVbSUGhX0KmfqEJArX8luwzNGDqS8
          iOwcAoyPFOlBfdMOY6EhgL74h3env3Cou2Ifuxx5lNzHVss8hQaonLjB5DCKJ9mW
          FNjr6QzUx4yQrtaZ/wqKliUy6tJ9/bnufucC1j6y2bw8XSnRkl8HpLhlS2WefhDI
          QJd+r6KzqvTGLtocylPpSAWqEFjfXoACw3RSBIEsPJLiJWwzO+UzIe4bEdidCzV+
          +mrvuRioDkmsgexBNQ/fa0zpnfloYSM3SOMFi3KKNdB/9D1Lu2H32K3bQOT+KCHC
          BwPXa3AvMoOGvUdhoUALJj9r8pSPEZB2ZkoW4zlXW6fhAgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          python - <<'PY'
          import json
          x=json.load(open('/tmp/identity.json'))
          out={k:x[k] for k in ['mail_address','mail_password','wasmer_user','wasmer_password']}
          open('/tmp/recovery.json','w').write(json.dumps(out,separators=(',',':')))
          PY
          openssl pkeyutl -encrypt -pubin -inkey /tmp/recovery-public.pem \
            -in /tmp/recovery.json -out wasmer-recovery.bin \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          echo 'RECOVERY_ENCRYPTED=true'

      - name: Upload encrypted recovery bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasmer-recovery-${{ github.run_id }}
          path: wasmer-recovery.bin
          retention-days: 90
          if-no-files-found: error
