name: Wasmer WordPress Provision

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasmer-wordpress-provision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Create protected temporary identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, secrets, urllib.request
          def req(url, data=None):
              headers={'Content-Type':'application/json'}
              r=urllib.request.Request(url, data=(json.dumps(data).encode() if data is not None else None), headers=headers, method='POST' if data is not None else 'GET')
              with urllib.request.urlopen(r, timeout=30) as x: return json.loads(x.read().decode())
          domains=req('https://api.mail.tm/domains')
          domains=domains.get('hydra:member') or domains.get('member') or []
          domain=next(x['domain'] for x in domains if x.get('isActive', True))
          mail_user='runner3wp'+secrets.token_hex(5)
          mail_password=secrets.token_urlsafe(24)
          mail_address=f'{mail_user}@{domain}'
          req('https://api.mail.tm/accounts', {'address':mail_address,'password':mail_password})
          mail_token=req('https://api.mail.tm/token', {'address':mail_address,'password':mail_password})['token']
          identity={
              'mail_address': mail_address,
              'mail_password': mail_password,
              'mail_token': mail_token,
              'wasmer_user': 'runner3wp'+secrets.token_hex(4),
              'wasmer_password': 'R3!'+secrets.token_urlsafe(24),
              'app_name': 'runner3-site-'+secrets.token_hex(3),
              'wp_user': 'r3admin'+secrets.token_hex(2),
              'wp_password': 'WP!'+secrets.token_urlsafe(24),
          }
          open('/tmp/identity.json','w').write(json.dumps(identity))
          for value in identity.values(): print('::add-mask::'+value)
          print('IDENTITY_READY=true')
          PY

      - name: Package Runner3 theme
        shell: bash
        run: |
          set -euo pipefail
          cd wordpress-site/wp-content/themes
          zip -qr "$GITHUB_WORKSPACE/runner3-starter.zip" runner3-starter
          test -s "$GITHUB_WORKSPACE/runner3-starter.zip"

      - name: Install browser automation
        run: npm install --no-save playwright-core@1.58.2

      - name: Create account, deploy WordPress, and apply Runner3 theme
        shell: bash
        run: |
          set -euo pipefail
          cat > provision-wasmer.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          import path from 'path';
          const id=JSON.parse(fs.readFileSync('/tmp/identity.json','utf8'));
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();

          const safe = s => (s||'').replaceAll(id.mail_address,'[MASKED_EMAIL]').replaceAll(id.wasmer_user,'[MASKED_USER]').replaceAll(id.wp_user,'[MASKED_WP_USER]');
          async function body(){ return (await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim(); }
          async function summary(label){
            console.log(label+'_URL='+page.url().replace(/([?&](?:token|code|key|secret|challenge)=)[^&]+/ig,'$1[MASKED]'));
            console.log(label+'_BODY='+safe((await body()).slice(0,1400)));
          }
          async function mailtm(p){
            const r=await fetch('https://api.mail.tm'+p,{headers:{Authorization:'Bearer '+id.mail_token}});
            if(!r.ok) throw new Error('Mail.tm HTTP '+r.status);
            return await r.json();
          }
          async function clickIf(locator){ if(await locator.count()){ await locator.first().click({timeout:10000}).catch(()=>{}); return true; } return false; }

          async function signupAndVerify(){
            await page.goto('https://wasmer.io/signup',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(900);
            if(!await clickIf(page.getByRole('button',{name:/personal/i}))) await clickIf(page.getByText(/personal projects/i));
            await page.getByRole('button',{name:/continue/i}).first().click();
            await page.waitForTimeout(900);
            await page.locator('input[name="username"]').fill(id.wasmer_user);
            await page.locator('input[name="email"]').fill(id.mail_address);
            await page.locator('input[name="password"]').fill(id.wasmer_password);
            const checkbox=page.getByRole('checkbox').first();
            if(await checkbox.count()) await checkbox.click();
            else await clickIf(page.locator('button[role="checkbox"]'));
            await page.getByRole('button',{name:/sign up/i}).first().click();
            await page.waitForTimeout(2200);
            const post=await body();
            if(/invalid email|disposable|temporary email|not allowed|already taken/i.test(post)) throw new Error('Wasmer rejected account input');
            console.log('WASMER_SIGNUP_SUBMITTED=true');

            let verifyUrl=null;
            for(let attempt=0; attempt<24 && !verifyUrl; attempt++){
              await page.waitForTimeout(attempt===0?800:2200);
              const listing=await mailtm('/messages');
              const msgs=listing['hydra:member'] || listing.member || [];
              for(const m of msgs){
                const from=((m.from||{}).address||'').toLowerCase();
                const subject=(m.subject||'').toLowerCase();
                if(!from.includes('wasmer') && !subject.includes('wasmer') && !subject.includes('verify') && !subject.includes('confirm')) continue;
                const full=await mailtm('/messages/'+m.id);
                const html=Array.isArray(full.html)?full.html.join('\n'):(full.html||'');
                const text=(full.text||'')+'\n'+html;
                const urls=[...text.matchAll(/https?:\/\/[^\s"'<>]+/g)].map(x=>x[0].replace(/&amp;/g,'&'));
                verifyUrl=urls.find(u=>/wasmer\.io/i.test(u) && /verify|confirm|challenge|activation|email/i.test(u)) || urls.find(u=>/wasmer\.io/i.test(u));
                if(verifyUrl) break;
              }
            }
            if(!verifyUrl) throw new Error('Wasmer verification email not found');
            await page.goto(verifyUrl,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(1400);
            await clickIf(page.getByRole('button',{name:/i.?ve confirmed my email/i}));
            await page.waitForTimeout(1800);
            console.log('WASMER_EMAIL_VERIFIED=true');
          }

          async function deployWordPress(){
            await page.goto('https://wasmer.io/apps/create?template=wordpress-starter',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(2200);
            await summary('CREATE_APP');
            let nameInput=page.getByLabel(/app name/i).first();
            if(!await nameInput.count()) nameInput=page.locator('input').filter({hasNot: page.locator('[type="hidden"]')}).first();
            if(!await nameInput.count()) throw new Error('Wasmer app-name input not found');
            await nameInput.fill(id.app_name);
            const deploy=page.getByRole('button',{name:/deploy now|deploy/i}).last();
            if(!await deploy.count()) throw new Error('Wasmer Deploy button not found');
            await deploy.click();
            console.log('WASMER_DEPLOY_SUBMITTED=true');

            let siteUrl=null;
            for(let i=0;i<60 && !siteUrl;i++){
              await page.waitForTimeout(2500);
              const hrefs=await page.locator('a').evaluateAll(els=>els.map(e=>e.href).filter(Boolean)).catch(()=>[]);
              siteUrl=hrefs.find(h=>/^https:\/\/[^/]+\.wasmer\.app\/?$/i.test(h)) || null;
              if(!siteUrl){
                const txt=await body();
                const m=txt.match(/https:\/\/[^\s]+\.wasmer\.app/i);
                if(m) siteUrl=m[0];
              }
              if(!siteUrl && /deployment failed|build failed|error deploying/i.test((await body()).toLowerCase())) break;
            }
            await summary('POST_DEPLOY');
            if(!siteUrl) throw new Error('No public wasmer.app URL found after deployment');
            siteUrl=siteUrl.replace(/\/$/,'');
            console.log('SITE_URL='+siteUrl);
            fs.writeFileSync('/tmp/site-url.txt',siteUrl);
            return siteUrl;
          }

          async function initializeWordPress(siteUrl){
            await page.goto(siteUrl,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2500);
            let txt=await body();
            console.log('WORDPRESS_REACHABLE=true');

            if(/information needed|site title|install wordpress/i.test(txt)){
              const title=page.getByLabel(/site title/i).first(); if(await title.count()) await title.fill('Runner3 Site');
              const user=page.getByLabel(/^username/i).first(); if(await user.count()) await user.fill(id.wp_user);
              const pass=page.getByLabel(/^password/i).first(); if(await pass.count()) { await pass.fill(id.wp_password); await pass.dispatchEvent('input'); }
              const email=page.getByLabel(/your email|email/i).first(); if(await email.count()) await email.fill(id.mail_address);
              const install=page.getByRole('button',{name:/install wordpress/i}).first();
              if(await install.count()) { await install.click(); await page.waitForTimeout(4500); }
            }

            await page.goto(siteUrl+'/wp-login.php',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(1200);
            const loginUser=page.locator('#user_login');
            if(await loginUser.count()){
              await loginUser.fill(id.wp_user);
              await page.locator('#user_pass').fill(id.wp_password);
              await page.locator('#wp-submit').click();
              await page.waitForTimeout(2500);
            }

            if(!/wp-admin/i.test(page.url())){
              console.log('WP_ADMIN_LOGIN=false');
              return;
            }
            console.log('WP_ADMIN_LOGIN=true');

            await page.goto(siteUrl+'/wp-admin/theme-install.php',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(1300);
            await clickIf(page.getByRole('button',{name:/upload theme/i}));
            const file=page.locator('input[type="file"]').first();
            if(await file.count()){
              await file.setInputFiles(path.resolve('runner3-starter.zip'));
              const install=page.getByRole('button',{name:/install now/i}).first();
              if(await install.count()) { await install.click(); await page.waitForTimeout(5000); }
              const activate=page.getByRole('link',{name:/activate/i}).first();
              if(await activate.count()) { await activate.click(); await page.waitForTimeout(2200); console.log('RUNNER3_THEME_ACTIVE=true'); }
            }
            await page.goto(siteUrl,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(1200);
            await summary('LIVE_SITE');
          }

          try {
            await signupAndVerify();
            const siteUrl=await deployWordPress();
            await initializeWordPress(siteUrl);
            console.log('PROVISION_COMPLETE=true');
          } finally {
            await browser.close();
          }
          JS
          node provision-wasmer.mjs

      - name: Encrypt recovery credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/recovery-public.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAowctxsQUZOcIHabYEUt/
          TNUEP+IXuI4ZDHYvupLpVgzvAXXLw5k1vD+Wp4YlZp3jttxBB1doCw28OJSKcRCT
          +l2j5kF0062jpXZtgepesiSrg/fjSCWCXCgPHa0CnP841uOXNsBlf02nFmchFpNP
          0o6lYz54vA75CsweplL6qhbq/ZbWdt5Utn+kVbSUGhX0KmfqEJArX8luwzNGDqS8
          iOwcAoyPFOlBfdMOY6EhgL74h3env3Cou2Ifuxx5lNzHVss8hQaonLjB5DCKJ9mW
          FNjr6QzUx4yQrtaZ/wqKliUy6tJ9/bnufucC1j6y2bw8XSnRkl8HpLhlS2WefhDI
          QJd+r6KzqvTGLtocylPpSAWqEFjfXoACw3RSBIEsPJLiJWwzO+UzIe4bEdidCzV+
          +mrvuRioDkmsgexBNQ/fa0zpnfloYSM3SOMFi3KKNdB/9D1Lu2H32K3bQOT+KCHC
          BwPXa3AvMoOGvUdhoUALJj9r8pSPEZB2ZkoW4zlXW6fhAgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          python - <<'PY'
          import json
          x=json.load(open('/tmp/identity.json'))
          out={k:x[k] for k in ['mail_address','mail_password','wasmer_user','wasmer_password','app_name','wp_user','wp_password']}
          open('/tmp/recovery.json','w').write(json.dumps(out,separators=(',',':')))
          PY
          openssl pkeyutl -encrypt -pubin -inkey /tmp/recovery-public.pem -in /tmp/recovery.json -out wasmer-recovery.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          echo 'RECOVERY_ENCRYPTED=true'

      - name: Upload encrypted recovery bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasmer-recovery-${{ github.run_id }}
          path: wasmer-recovery.bin
          retention-days: 90
          if-no-files-found: error
