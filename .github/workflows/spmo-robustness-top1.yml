name: SPMO Top1 Robustness

on:
  push:
    branches: [main]
    paths:
      - 'spmo-backtest/robustness_top1.py'
      - 'spmo-backtest/validated/leto_live_period_checks.csv'
      - '.github/workflows/spmo-robustness-top1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas numpy yfinance
      - run: python spmo-backtest/robustness_top1.py
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spmo-backtest/robustness/
          git diff --cached --quiet || git commit -m "Update SPMO Top-1 robustness results"
          git push
