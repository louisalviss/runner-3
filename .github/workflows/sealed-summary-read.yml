name: Sealed Summary Read

on:
  push:
    branches: [main]
    paths:
      - 'jobs/sealed-summary-trigger.txt'

permissions:
  contents: read

jobs:
  sealed_read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read and encrypt private mini-summary
        shell: bash
        env:
          RUNNER3_CORE_URL: ${{ secrets.RUNNER3_CORE_URL }}
          RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          ulimit -c 0 || true
          scope="$(tr -d '\r\n[:space:]' < jobs/sealed-summary-trigger.txt)"
          base="${RUNNER3_CORE_URL:-https://runner3-core.ducduy2411.workers.dev}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --silent --show-error \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -H "Authorization: Bearer ${RUNNER3_CORE_TOKEN}" \
            "${base%/}/artifacts/private-compute/${scope}/result.tar.gz" \
            -o "$tmp/result.tar.gz"
          mkdir -p "$tmp/x"
          tar -xzf "$tmp/result.tar.gz" -C "$tmp/x"
          python3 - "$tmp/x/results/out/result.json" "$tmp/mini.json" <<'PY'
          import json, pathlib, sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          def row(k):
              x=(d.get('results') or {}).get(k) or {}
              return [x.get('trades'),x.get('win_rate_pct'),x.get('avg_return_pct'),x.get('profit_factor_return')]
          out={'q':d.get('universe_requested'),'u':d.get('universe_usable'),'b':row('base'),'v':row('vcp'),'f':row('first_leg_vcp')}
          s=json.dumps(out,separators=(',',':'))
          if len(s.encode())>250: raise SystemExit('mini summary too large')
          pathlib.Path(sys.argv[2]).write_text(s,encoding='utf-8')
          PY
          printf '%s' '' | base64 -d > "$tmp/recipient.crt"
          openssl x509 -pubkey -noout -in "$tmp/recipient.crt" > "$tmp/pub.pem"
          openssl pkeyutl -encrypt -pubin -inkey "$tmp/pub.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$tmp/mini.json" -out "$tmp/mini.bin"
          printf 'SEALED_MINI_B64='
          base64 -w0 "$tmp/mini.bin"
          printf '\n'
