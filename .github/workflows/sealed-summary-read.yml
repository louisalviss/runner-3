name: Sealed Summary Read

on:
  push:
    branches: [main]
    paths:
      - 'jobs/sealed-summary-trigger.txt'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read and encrypt private summary
        shell: bash
        env:
          RUNNER3_CORE_URL: ${{ secrets.RUNNER3_CORE_URL }}
          RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          ulimit -c 0 || true
          scope="$(tr -d '\r\n[:space:]' < jobs/sealed-summary-trigger.txt)"
          base="${RUNNER3_CORE_URL:-https://runner3-core.ducduy2411.workers.dev}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --silent --show-error \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -H "Authorization: Bearer ${RUNNER3_CORE_TOKEN}" \
            "${base%/}/artifacts/private-compute/${scope}/result.tar.gz" \
            -o "$tmp/result.tar.gz"
          mkdir -p "$tmp/x"
          tar -xzf "$tmp/result.tar.gz" -C "$tmp/x"
          python3 - "$tmp/x/results/out/result.json" "$tmp/summary.json" <<'PY'
          import json, pathlib, sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          out={
            'generated_at':d.get('generated_at'),
            'period':d.get('period'),
            'universe_requested':d.get('universe_requested'),
            'universe_usable':d.get('universe_usable'),
            'results':d.get('results'),
            'first_leg_yearly':d.get('first_leg_yearly'),
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(out,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          cat > "$tmp/recipient.crt" <<'CRT'
-----BEGIN CERTIFICATE-----
MIIEFTCCAn2gAwIBAgIUdkozzzrYLDSi97u2zq9CBjYVWu4wDQYJKoZIhvcNAQEL
