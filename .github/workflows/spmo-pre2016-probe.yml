name: SPMO Pre-2016 Data Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spmo-pre2016-probe.yml'
      - 'spmo-backtest/pre2016_data_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas yfinance requests
      - run: python spmo-backtest/pre2016_data_probe.py
