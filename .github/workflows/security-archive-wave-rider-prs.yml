name: Security Archive Wave Rider PRs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-archive-wave-rider-prs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive Wave Rider pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          known='28 33 34 37 38 40 41 42 43 45 49 52 53 54 55 56 57 59 60 61 62 63 64 65 66 67 68 70 77 78 80 81 82 83 86 89 90 93 95 96 97 117 125'
          printf '%s\n' $known > /tmp/known.txt
          gh api --paginate "repos/$repo/pulls?state=all&per_page=100" \
            --jq '.[] | select((.head.ref|startswith("wr-")) or (.title|test("Wave Rider|(^| )WR( |$)|v2\\.5\\.15"))) | .number' \
            > /tmp/dynamic.txt
          cat /tmp/known.txt /tmp/dynamic.txt | sort -nu > /tmp/targets.txt
          archived=0
          already=0
          failed=0
          : > /tmp/results.tsv
          while read -r n; do
            [ -z "$n" ] && continue
            node=$(gh api "repos/$repo/pulls/$n" --jq '.node_id')
            state=$(gh api graphql \
              -f query='query($id:ID!){node(id:$id){... on PullRequest{isArchived}}}' \
              -F id="$node" --jq '.data.node.isArchived' 2>/dev/null || echo unknown)
            if [ "$state" = "true" ]; then
              echo -e "$n\tALREADY_ARCHIVED" | tee -a /tmp/results.tsv
              already=$((already+1))
              continue
            fi
            if out=$(gh api graphql \
              -f query='mutation($id:ID!){archivePullRequest(input:{pullRequestId:$id}){pullRequest{number}}}' \
              -F id="$node" 2>&1); then
              echo -e "$n\tARCHIVED" | tee -a /tmp/results.tsv
              archived=$((archived+1))
            else
              clean=$(printf '%s' "$out" | tr '\n' ' ' | sed 's/"/\\"/g')
              echo -e "$n\tFAILED\t$clean" | tee -a /tmp/results.tsv
              failed=$((failed+1))
            fi
          done < /tmp/targets.txt
          total=$(wc -l < /tmp/targets.txt | tr -d ' ')
          mkdir -p security
          python - <<'PY'
          import json, os
          rows=[]
          for line in open('/tmp/results.tsv', errors='replace'):
              p=line.rstrip('\n').split('\t',2)
              rows.append({'pr':int(p[0]),'status':p[1],**({'error':p[2]} if len(p)>2 else {})})
          payload={
              'status':'ARCHIVE_COMPLETE' if all(r['status']!='FAILED' for r in rows) else 'ARCHIVE_PARTIAL',
              'target_count':len(rows),
              'archived_count':sum(r['status']=='ARCHIVED' for r in rows),
              'already_archived_count':sum(r['status']=='ALREADY_ARCHIVED' for r in rows),
              'failed_count':sum(r['status']=='FAILED' for r in rows),
              'results':rows,
              'note':'Archive hides PRs from public visitors. Direct historical commit SHAs may still require history rewrite/GitHub cleanup.'
          }
          open('security/wave-rider-pr-archive-status.json','w').write(json.dumps(payload,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- security/wave-rider-pr-archive-status.json
          git commit -m 'security: record Wave Rider PR archive status' || true
          git pull --rebase origin main
          git push origin HEAD:main
          echo "targets=$total archived=$archived already=$already failed=$failed"
          test "$failed" -eq 0
