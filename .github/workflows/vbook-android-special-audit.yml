name: VBook Android Special Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  special:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install host dependencies
        run: |
          python -m pip install requests
          npm install --no-save cheerio@1.0.0
          python tools/vbook-audit/download_vbook_apk.py vbook.apk
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true
      - name: Run special extensions on VBook Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          target: default
          arch: x86_64
          profile: Nexus 5
          ram-size: 2048M
          heap-size: 384M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/vbook-audit/run_special.sh
      - name: Upload special audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vbook-special-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 7
