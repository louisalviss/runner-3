name: TradingView Log Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-log-cleanup.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete leaked-source workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target=32023716480
          code="$(curl -sS -o /tmp/delete.out -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${target}")"
          echo "DELETE_HTTP=$code"
          if [ "$code" != "204" ] && [ "$code" != "404" ]; then cat /tmp/delete.out; exit 1; fi
          echo 'TV_LEAKED_RUN_DELETED=PASS'
