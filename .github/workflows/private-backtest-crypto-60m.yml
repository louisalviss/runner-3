name: Private Backtest Crypto 60m Probe

on:
  push:
    branches: [main]
    paths:
      - 'jobs/private-backtest-crypto-60m.json'
      - 'tools/private_backtest_crypto_60m.py'
      - '.github/workflows/private-backtest-crypto-60m.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-backtest-crypto-60m-probe
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        venue: [spot, perp]
    env: &env
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/private_backtest_crypto_60m.py stage --config jobs/private-backtest-crypto-60m.json --venue ${{ matrix.venue }}

  shard:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        venue: [spot, perp]
        shard: [0,1,2,3]
    env: *env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2,<3'
      - run: python tools/private_backtest_crypto_60m.py shard --config jobs/private-backtest-crypto-60m.json --venue ${{ matrix.venue }} --shard ${{ matrix.shard }}

  evaluate:
    if: ${{ always() && needs.stage.result == 'success' }}
    needs: [stage, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        venue: [spot, perp]
    env: *env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/private_backtest_crypto_60m.py evaluate --config jobs/private-backtest-crypto-60m.json --venue ${{ matrix.venue }}
