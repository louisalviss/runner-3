name: Cancel stale Gwen deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-gwen-run.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/32282952278/cancel" || true
          echo "cancel requested for 32282952278"
