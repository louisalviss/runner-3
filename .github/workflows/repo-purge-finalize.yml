name: Repository purge finalizer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  purge:
    if: github.repository == 'louisalviss/runner-3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete Wave Rider branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/git/matching-refs/heads/" --jq '.[].ref' > /tmp/refs.txt
          while IFS= read -r ref; do
            name="${ref#refs/heads/}"
            lower="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"
            if [[ "$lower" =~ (^|/)(tv-wr-|wr-|wave-rider|wave_rider) ]]; then
              echo "Deleting branch ref: $name"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$name"
            fi
          done < /tmp/refs.txt

      - name: Delete Wave Rider tag refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/git/matching-refs/tags/" --jq '.[].ref' > /tmp/tags.txt
          while IFS= read -r ref; do
            name="${ref#refs/tags/}"
            lower="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"
            if [[ "$lower" =~ (^|/)(tv-wr-|wr-|wave-rider|wave_rider) ]]; then
              echo "Deleting tag ref: $name"
              gh api -X DELETE "repos/$REPO/git/refs/tags/$name"
            fi
          done < /tmp/tags.txt

      - name: Delete Wave Rider Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | [.id, (.name // ""), (.path // ""), (.head_branch // ""), (.display_title // "")] | @tsv' > /tmp/runs.tsv
          while IFS=$'\t' read -r id name path branch title; do
            hay="$(printf '%s %s %s %s' "$name" "$path" "$branch" "$title" | tr '[:upper:]' '[:lower:]')"
            if [[ "$hay" =~ wave-rider|wave_rider|tv-wr-|wr-day|wr-parity|reference_verify|tradingview-bnb|window-report ]]; then
              echo "Deleting Actions run: $id :: $name :: $branch"
              gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
            fi
          done < /tmp/runs.tsv

      - name: Delete Wave Rider Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, (.name // "")] | @tsv' > /tmp/artifacts.tsv
          while IFS=$'\t' read -r id name; do
            lower="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"
            if [[ "$lower" =~ wave-rider|wave_rider|tv-wr-|wr-day|wr-parity|reference_verify|tradingview-bnb|window-report ]]; then
              echo "Deleting artifact: $id :: $name"
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || true
            fi
          done < /tmp/artifacts.tsv

      - name: Remove purge workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repo-purge-finalize.yml
          git commit -m "Remove purge finalizer"
          git push origin HEAD:main
