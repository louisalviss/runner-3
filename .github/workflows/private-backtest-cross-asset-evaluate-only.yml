name: Private Backtest Cross Asset Evaluate Only

on:
  push:
    branches: [main]
    paths:
      - 'jobs/private-backtest-cross-asset-evaluate-only.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-backtest-cross-asset-evaluate-only
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family: [forex, metals, indices]
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate existing expanded 30m artifacts with current symbol gates
        run: python tools/private_backtest_cross_asset.py evaluate --config jobs/private-backtest-cross-asset-30m-expanded.json --family ${{ matrix.family }}
