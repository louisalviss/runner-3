name: WordPress DB A/B Benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordpress-db-ab-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wordpress-db-ab-benchmark
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://runner3-factory-smoke-2.wasmer.app
      TIDB_CLOUD_PUBLIC_KEY: ${{ secrets.TIDB_CLOUD_PUBLIC_KEY }}
      TIDB_CLOUD_PRIVATE_KEY: ${{ secrets.TIDB_CLOUD_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Benchmark current Wasmer WordPress baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/benchmarks
          python3 - <<'PY'
          import json, os, statistics, subprocess, tempfile, time, urllib.parse
          base=os.environ['BASE_URL'].rstrip('/')

          def one(url):
              with tempfile.NamedTemporaryFile() as h:
                  fmt='%{http_code}\t%{time_starttransfer}\t%{time_total}'
                  p=subprocess.run(['curl','-L','--max-time','30','-sS','-D',h.name,'-o','/dev/null','-w',fmt,url],text=True,capture_output=True)
                  if p.returncode:
                      return {'ok':False,'error':p.stderr.strip()[:160]}
                  parts=p.stdout.strip().split('\t')
                  headers={}
                  try:
                      raw=open(h.name,'r',errors='ignore').read().splitlines()
                      for line in raw:
                          if ':' in line:
                              k,v=line.split(':',1); headers[k.strip().lower()]=v.strip()
                  except Exception: pass
                  return {'ok':True,'code':int(parts[0]),'ttfb_ms':round(float(parts[1])*1000,2),'total_ms':round(float(parts[2])*1000,2),
                          'cache':headers.get('cf-cache-status') or headers.get('x-cache') or headers.get('cache-status') or headers.get('x-wasmer-cache')}

          def pct(vals,p):
              if not vals: return None
              vals=sorted(vals); i=max(0,min(len(vals)-1,int((len(vals)-1)*p)))
              return round(vals[i],2)
          def run_group(name, maker, n=30, warm=0):
              for i in range(warm): one(maker(-100-i))
              rows=[]
              for i in range(n):
                  rows.append(one(maker(i)))
                  time.sleep(.12)
              good=[r for r in rows if r.get('ok')]
              t=[r['ttfb_ms'] for r in good]
              tot=[r['total_ms'] for r in good]
              codes={str(c):sum(1 for r in good if r.get('code')==c) for c in sorted(set(r.get('code') for r in good))}
              caches={str(c):sum(1 for r in good if r.get('cache')==c) for c in sorted(set(r.get('cache') for r in good),key=lambda x:str(x))}
              return {'name':name,'samples':n,'success':len(good),'codes':codes,'cache_headers':caches,
                      'ttfb_ms':{'p50':pct(t,.5),'p95':pct(t,.95),'min':min(t) if t else None,'max':max(t) if t else None},
                      'total_ms':{'p50':pct(tot,.5),'p95':pct(tot,.95)},
                      'errors':[r.get('error') for r in rows if not r.get('ok')][:3]}

          stamp=str(int(time.time()*1000))
          results=[]
          results.append(run_group('home_same_url_warm',lambda i: base+'/',30,warm=3))
          results.append(run_group('home_cache_busted',lambda i: base+'/?runner3_dbbench='+stamp+'-'+str(i),30))
          results.append(run_group('rest_posts_cache_busted',lambda i: base+'/wp-json/wp/v2/posts?per_page=1&_fields=id&runner3_dbbench='+stamp+'-'+str(i),30))
          results.append(run_group('wp_login',lambda i: base+'/wp-login.php?runner3_dbbench='+stamp+'-'+str(i),20))
          auth=bool(os.environ.get('TIDB_CLOUD_PUBLIC_KEY')) and bool(os.environ.get('TIDB_CLOUD_PRIVATE_KEY'))
          out={'status':'READY_FOR_TIDB_PROVISION' if auth else 'BASELINE_COMPLETE_TIDB_AUTH_MISSING',
               'safe':True,'production_db_changed':False,'site':base+'/', 'measured_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
               'tidb_cloud_api_auth_present':auth,'groups':results,
               'note':'HTTP baseline only; direct SQL timing requires database/runtime access. No production mutation performed.'}
          open('ops/benchmarks/wordpress-db-ab-latest.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Persist safe benchmark result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/benchmarks/wordpress-db-ab-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record WordPress DB A/B baseline benchmark'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
            git pull --rebase origin main
          done
          exit 5
