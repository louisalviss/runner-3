name: Runner3 Core RSS 1102 Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-core-rss1102-deploy-once.yml'

permissions:
  contents: read

concurrency:
  group: runner3-core-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'louisalviss/runner-3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "MISSING:$name" >&2; exit 2; }
            echo "PRESENT:$name"
          done

      - name: Checkout exact isolated hotfix
        uses: actions/checkout@v4
        with:
          ref: 67b13eb38a0a1402ef526754536f3156d4466e24
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Reader Audio Core browser bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save esbuild
          node scripts/build_reader_audio_core_browser_bundle.mjs
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-bundle.generated.js

      - name: Validate isolated RSS fast path
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/runner3-core/rss-article-fast-entry.js
          node --check cloudflare/runner3-core/opportunity-router-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          python3 - <<'PY'
          import json
          p='cloudflare/runner3-core/wrangler.jsonc'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('name') == 'runner3-core', d.get('name')
          assert d.get('main') == 'rss-article-fast-entry.js', d.get('main')
          assert any(x.get('binding') == 'OPPORTUNITY_DB' for x in d.get('d1_databases',[]))
          assert any(x.get('binding') == 'RSS_FASTLANE' for x in d.get('services',[]))
          print('RSS_FASTPATH_CONFIG=PASS')
          PY
          grep -q 'import app from "./opportunity-router-entry.js";' cloudflare/runner3-core/rss-article-fast-entry.js
          grep -q 'rss-article-fast-v1' cloudflare/runner3-core/rss-article-fast-entry.js
          grep -q 'artifact-library-reader-v36-home-screen-safe-area-entry.js' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js

      - name: Deploy RSS 1102 hotfix
        shell: bash
        working-directory: cloudflare/runner3-core
        run: |
          set -euo pipefail
          export NO_COLOR=1
          npx --yes wrangler@4 deploy

      - name: Verify RSS fast path and stable Core surfaces
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          article='/rss/article/fulcrum-url-a87e54dbda2e37fe40a7'
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -sS -D /tmp/rss.h -o /tmp/rss.html -w '%{http_code}' "$core$article" || true)"
            tr -d '\r' </tmp/rss.h >/tmp/rss.h.clean || true
            fast="$(grep -i '^x-r3-rss-fastpath:' /tmp/rss.h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            echo "RSS_CHECK attempt=$attempt http=$code fastpath=$fast"
            if [ "$code" = 200 ] && [ "$fast" = 'rss-article-fast-v1' ] && grep -qi '^content-type: text/html' /tmp/rss.h.clean && test -s /tmp/rss.html; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo 'RSS_FASTPATH=FAIL'
            cat /tmp/rss.h.clean || true
            head -c 1200 /tmp/rss.html || true
            exit 1
          fi
          echo 'RSS_FASTPATH=PASS'

          hcode="$(curl -sS -o /tmp/health -w '%{http_code}' "$core/healthz")"
          echo "HEALTHZ http=$hcode body=$(head -c 300 /tmp/health | tr '\n' ' ')"
          test "$hcode" = 200

          ocode="$(curl -sS -o /tmp/opportunity.json -w '%{http_code}' "$core/opportunity-radar/regime/current/global")"
          echo "OPPORTUNITY_RADAR http=$ocode body=$(head -c 300 /tmp/opportunity.json | tr '\n' ' ')"
          test "$ocode" = 200

          acode="$(curl -sS -o /tmp/audio.json -w '%{http_code}' "$core/artifact-library/audio")"
          echo "AUDIO_SURFACE http=$acode body=$(head -c 180 /tmp/audio.json | tr '\n' ' ')"
          test "$acode" = 400

          echo 'RUNNER3_CORE_RSS_1102_HOTFIX=PASS'
