name: WR TradingView Reference History Probe
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wr-tv-reference-probe.yml'
      - 'wave-rider-verify/wr_tv_reference_probe.py'
      - 'wave-rider-verify/wr_tv_parity.py'
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client requests
      - name: Probe OANDA EURUSD at historical reference timestamps
        run: python3 wave-rider-verify/wr_tv_reference_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-tv-reference-history-probe
          path: /tmp/wr-tv-ref-probe
          retention-days: 7
