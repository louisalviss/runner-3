name: SPMO Index Mirror Cache

on:
  push:
    branches: [main]
    paths:
      - 'spmo-index/**'
      - '.github/workflows/spmo-index-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gdown
        run: python -m pip install gdown
      - name: Download Notre Dame master-index mirror
        run: gdown 'https://drive.google.com/uc?id=1yfQxR45DZ_vM5pkFvgyexc10NNqbxpFN' -O MasterIndex_20260318.zip
      - name: Build filtered SPMO CIK cache
        run: python -u spmo-index/build_cache.py
      - name: Upload filtered cache
        uses: actions/upload-artifact@v4
        with:
          name: spmo-index-cache-${{ github.run_id }}
          path: spmo-index/output/
          if-no-files-found: error
          retention-days: 7
