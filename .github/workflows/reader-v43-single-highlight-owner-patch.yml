name: Reader v43 Single Highlight Owner Patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_reader_v43_single_highlight_owner.py'
      - '.github/workflows/reader-v43-single-highlight-owner-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v43 single highlight owner patch
        run: |
          set -euo pipefail
          python3 scripts/patch_reader_v43_single_highlight_owner.py
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          node --check cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          grep -q '__R3_READER_SENTENCE_HIGHLIGHT_OWNER' cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          grep -q 'data-r3-sentence-highlight-owner-v43' cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          grep -q 'READER_V43_PATCH_MISSING:v30-dark-highlight' cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
      - name: Commit v43 source patch
        run: |
          set -euo pipefail
          rm -f .github/workflows/reader-v43-single-highlight-owner-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/runner3-core/reader-audio-core/browser-production-integration.js cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js .github/workflows/reader-v43-single-highlight-owner-patch.yml
          git commit -m 'fix(reader): enforce single sentence highlight owner v43'
          git push origin HEAD:main
