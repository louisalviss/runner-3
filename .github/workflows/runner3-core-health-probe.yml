name: Runner3 Reader Guarded Rollback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-core-health-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner3-core-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEALTHY_READER_VERSION: 4fc0bb37-4ffa-49e6-8722-e3631428c6ac
    steps:
      - name: Validate deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "MISSING:$name" >&2; exit 2; }
            echo "PRESENT:$name"
          done

      - name: Probe Reader repeatedly before any rollback
        id: reader_guard
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"

          # /health is informational only. It MUST NOT decide Reader rollback.
          hcode="$(curl --connect-timeout 8 --max-time 15 -sS -o /tmp/generic-health -w '%{http_code}' "$core/health" || true)"
          echo "GENERIC_HEALTH_INFORMATIONAL_ONLY http=$hcode"

          reader_probe() {
            local lcode rcode runtime proof acode mcode
            lcode="$(curl --connect-timeout 8 --max-time 20 -sS -o /tmp/library -w '%{http_code}' "$core/artifact-library" || true)"
            rcode="$(curl --connect-timeout 8 --max-time 20 -sS -D /tmp/rh -o /tmp/reader -w '%{http_code}' "$core/artifact-library/read?key=$encoded" || true)"
            runtime="$(tr -d '\r' </tmp/rh | grep -i '^x-r3-reader-runtime:' | sed 's/^[^:]*:[[:space:]]*//' || true)"
            proof="$(tr -d '\r' </tmp/rh | grep -i '^x-r3-reader-patch-proof:' | sed 's/^[^:]*:[[:space:]]*//' || true)"
            acode="$(curl --connect-timeout 8 --max-time 20 -sS -o /tmp/audio -w '%{http_code}' "$core/artifact-library/audio" || true)"
            mcode="$(curl --connect-timeout 8 --max-time 20 -sS -o /tmp/audio-media -w '%{http_code}' "$core/audio-media?prefix=audio-library%2Febook-reader-queue%2F&limit=1" || true)"
            echo "READER_PROBE library=$lcode reader=$rcode runtime=$runtime proof=$proof audio=$acode audio_media=$mcode"
            [ "$lcode" = 200 ] && \
            [ "$rcode" = 200 ] && \
            [ "$runtime" = 'v35-continuity-single-owner' ] && \
            [ "$proof" = 'v34+v35:ahead-prefetch+range-follow+single-audio-owner' ] && \
            grep -q 'data-r3-audio-continuity-v35="1"' /tmp/reader && \
            grep -q '__r3SafariBootGeometryV61' /tmp/reader && \
            grep -q '__r3PaginatedVerticalClampV62' /tmp/reader && \
            [ "$acode" = 400 ] && \
            [ "$mcode" = 401 ] && grep -q 'UNAUTHORIZED' /tmp/audio-media
          }

          failed=0
          for attempt in 1 2 3; do
            if reader_probe; then
              echo "READER_GUARD=HEALTHY attempt=$attempt"
              echo "rollback_required=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            failed=$((failed+1))
            echo "READER_GUARD=FAILED attempt=$attempt"
            sleep 3
          done
          test "$failed" = 3
          echo "rollback_required=true" >> "$GITHUB_OUTPUT"
          echo 'READER_GUARD=ROLLBACK_REQUIRED'

      - name: Confirm v64 Reader version is rollback-eligible
        if: steps.reader_guard.outputs.rollback_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions list --name runner3-core --json >/tmp/versions.json
          python3 - <<'PY'
          import json, os
          versions=json.load(open('/tmp/versions.json',encoding='utf-8'))
          target=os.environ['HEALTHY_READER_VERSION']
          ids={str(v.get('id') or v.get('version_id') or '') for v in versions}
          print('V64_TARGET_VERSION_PRESENT=%s' % (target in ids))
          if target not in ids:
              raise SystemExit('v64 canonical Cloudflare version is no longer rollback-eligible')
          PY

      - name: Roll back exact v64 Reader version
        if: steps.reader_guard.outputs.rollback_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 rollback "$HEALTHY_READER_VERSION" --name runner3-core --message "Reader-specific guarded rollback to canonical v64"

      - name: Verify Reader after guarded rollback
        if: steps.reader_guard.outputs.rollback_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -sS -D /tmp/rh -o /tmp/reader -w '%{http_code}' "$core/artifact-library/read?key=$encoded" || true)"
            runtime="$(tr -d '\r' </tmp/rh | grep -i '^x-r3-reader-runtime:' | sed 's/^[^:]*:[[:space:]]*//' || true)"
            proof="$(tr -d '\r' </tmp/rh | grep -i '^x-r3-reader-patch-proof:' | sed 's/^[^:]*:[[:space:]]*//' || true)"
            echo "POST_ROLLBACK_READER attempt=$attempt http=$code runtime=$runtime proof=$proof"
            if [ "$code" = 200 ] && [ "$runtime" = 'v35-continuity-single-owner' ] && [ "$proof" = 'v34+v35:ahead-prefetch+range-follow+single-audio-owner' ]; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          echo 'RUNNER3_READER_GUARDED_ROLLBACK=PASS'
