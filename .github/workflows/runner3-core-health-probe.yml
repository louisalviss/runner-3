name: Runner3 Core Health Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-core-health-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
    steps:
      - name: Probe public Core health and local secret presence
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          if [[ -n "${RUNNER3_CORE_TOKEN:-}" ]]; then repo_secret_present=true; else repo_secret_present=false; fi
          code="$(curl --connect-timeout 10 --max-time 20 -sS -D /tmp/core-health.headers -o /tmp/core-health.body -w '%{http_code}' "$core/health")"
          echo "CORE_HEALTH_HTTP=$code"
          echo "REPO_RUNNER3_CORE_TOKEN_PRESENT=$repo_secret_present"
          echo '--- SAFE RESPONSE HEADERS ---'
          tr -d '\r' </tmp/core-health.headers | grep -Ei '^(HTTP/|content-type:|server:|cf-ray:|cf-error-type:|cf-error-origin:|retry-after:)' || true
          echo '--- BODY PREFIX ---'
          head -c 800 /tmp/core-health.body | tr '\n' ' '; echo
          if [[ "$code" = 200 ]]; then
            python3 - <<'PY'
          import json
          data=json.load(open('/tmp/core-health.body',encoding='utf-8'))
          print('CORE_HEALTH_OK=%s' % data.get('ok'))
          print('CORE_HEALTH_D1=%s' % data.get('d1'))
          print('CORE_HEALTH_WRITE_AUTH=%s' % data.get('write_auth'))
          print('CORE_HEALTH_ARTIFACT_AUTH=%s' % data.get('artifact_auth'))
          PY
          fi
          test "$code" = 200

# one-shot probe trigger: edge diagnostics
