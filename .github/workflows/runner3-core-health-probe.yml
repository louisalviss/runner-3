name: Runner3 Core Exact Version Rollback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-core-health-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner3-core-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEALTHY_VERSION: bc768574-b7ed-4e49-b017-cac5044476a3
    steps:
      - name: Validate deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "MISSING:$name" >&2; exit 2; }
            echo "PRESENT:$name"
          done

      - name: Confirm healthy version is still rollback-eligible
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions list --name runner3-core --json >/tmp/versions.json
          python3 - <<'PY'
          import json, os
          versions=json.load(open('/tmp/versions.json',encoding='utf-8'))
          target=os.environ['HEALTHY_VERSION']
          ids={str(v.get('id') or v.get('version_id') or '') for v in versions}
          print('TARGET_VERSION_PRESENT=%s' % (target in ids))
          if target not in ids:
              raise SystemExit('known healthy Cloudflare version is no longer rollback-eligible')
          PY

      - name: Roll back exact Cloudflare version
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 rollback "$HEALTHY_VERSION" --name runner3-core --message "Emergency rollback: restore last-known-good Core version after persistent 1102"

      - name: Verify health stability and critical surfaces
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          consecutive=0
          for attempt in $(seq 1 30); do
            code="$(curl --connect-timeout 10 --max-time 20 -sS -D /tmp/h -o /tmp/health -w '%{http_code}' "$core/health" || true)"
            err="$(tr -d '\r' </tmp/h | grep -i '^cf-error-type:' | sed 's/^[^:]*:[[:space:]]*//' || true)"
            echo "HEALTH attempt=$attempt http=$code cf_error_type=$err"
            if [ "$code" = 200 ] && python3 -c 'import json; d=json.load(open("/tmp/health")); assert d.get("ok") is True'; then
              consecutive=$((consecutive+1))
              [ "$consecutive" -ge 5 ] && break
            else
              consecutive=0
            fi
            sleep 1
          done
          test "$consecutive" -ge 5

          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          code="$(curl -sS -D /tmp/rh -o /tmp/reader -w '%{http_code}' "$core/artifact-library/read?key=$encoded")"
          runtime="$(tr -d '\r' </tmp/rh | grep -i '^x-r3-reader-runtime:' | sed 's/^[^:]*:[[:space:]]*//' || true)"
          proof="$(tr -d '\r' </tmp/rh | grep -i '^x-r3-reader-patch-proof:' | sed 's/^[^:]*:[[:space:]]*//' || true)"
          echo "READER http=$code runtime=$runtime proof=$proof"
          test "$code" = 200
          test "$runtime" = 'v35-continuity-single-owner'
          test "$proof" = 'v34+v35:ahead-prefetch+range-follow+single-audio-owner'

          ocode="$(curl -sS -o /tmp/opportunity.json -w '%{http_code}' "$core/opportunity-radar/regime/current/global")"
          mcode="$(curl -sS -o /tmp/mailbox.csv -w '%{http_code}' "$core/mailbox/results/smoke-reader-v31.csv")"
          echo "OPPORTUNITY http=$ocode MAILBOX http=$mcode"
          test "$ocode" = 200
          test "$mcode" = 200
          grep -q 'pending' /tmp/mailbox.csv
          echo 'RUNNER3_CORE_EXACT_VERSION_ROLLBACK=PASS'
