name: TradingView Download Range Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-download-range-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore session and source
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/session-state.json.aes -out /tmp/tv-state.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/wave-rider-v2.5.13-window-report.pine.aes -out /tmp/wr.pine
      - name: Probe download and range
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright-core');
          (async()=>{
            const exes=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'];
            const executablePath=exes.find(p=>fs.existsSync(p));
            const state=JSON.parse(fs.readFileSync('/tmp/tv-state.json','utf8'));
            const source=fs.readFileSync('/tmp/wr.pine','utf8');
            const b=await chromium.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const c=await b.newContext({storageState:state,viewport:{width:1920,height:1080},permissions:['clipboard-read','clipboard-write'],acceptDownloads:true});
            const p=await c.newPage(); p.setDefaultTimeout(15000);
            await p.goto('https://www.tradingview.com/chart/?symbol=BINANCE%3ABNBUSDT.P&interval=5',{waitUntil:'domcontentloaded',timeout:90000});
            await p.waitForTimeout(9000);
            const pine=p.locator('[data-name="pine-dialog-button"]').first(); await pine.click(); await p.waitForTimeout(3000);
            const dlg=p.locator('[data-name="pine-dialog"]'); const ta=dlg.locator('.monaco-editor textarea').last();
            await ta.focus(); await p.keyboard.press('Control+A'); await p.evaluate(async s=>navigator.clipboard.writeText(s),source); await p.keyboard.press('Control+V'); await p.waitForTimeout(2000);
            await dlg.getByRole('button',{name:'Add to chart',exact:true}).first().click(); await p.waitForTimeout(25000);
            await pine.click().catch(()=>{}); await p.waitForTimeout(2500);
            const got=p.getByRole('button',{name:'Got it',exact:true}); if(await got.isVisible().catch(()=>false)) await got.click().catch(()=>{});
            await p.waitForTimeout(1000);

            const dl=p.locator('[title="Download .csv"]').first();
            console.log('TV_DOWNLOAD_VISIBLE='+(await dl.isVisible().catch(()=>false)?'YES':'NO'));
            if(await dl.count()){
              console.log('TV_DOWNLOAD_TAG='+await dl.evaluate(e=>e.tagName));
              console.log('TV_DOWNLOAD_OUTER='+JSON.stringify((await dl.evaluate(e=>e.outerHTML)).slice(0,1800)));
              console.log('TV_DOWNLOAD_PARENT='+JSON.stringify((await dl.evaluate(e=>(e.closest('button')||e.parentElement)?.outerHTML||'')).slice(0,2200)));
            }
            let downloaded=false, dlfn='', dlerr='';
            if(await dl.count()){
              try{
                const prom=p.waitForEvent('download',{timeout:6000});
                await dl.evaluate(e=>(e.closest('button')||e).click());
                const d=await prom; downloaded=true; dlfn=d.suggestedFilename(); await d.saveAs('/tmp/'+dlfn);
              }catch(e){dlerr=String(e.message||e)}
            }
            console.log('TV_CSV_DOWNLOADED='+(downloaded?'YES':'NO'));
            console.log('TV_CSV_FILENAME='+dlfn);
            console.log('TV_DOWNLOAD_ERROR='+JSON.stringify(dlerr.slice(0,800)));
            await p.waitForTimeout(1500);
            const body=await p.locator('body').innerText();
            const gateLines=body.split('\n').map(s=>s.trim()).filter(s=>/upgrade|full access|strategy report|download/i.test(s)).slice(0,80);
            for(const x of gateLines) console.log('TV_GATE_LINE='+JSON.stringify(x));
            console.log('TV_UPGRADE_GATE='+(body.includes('Upgrade to get full access to Strategy report data')?'PRESENT':'ABSENT'));

            const dateControls=await p.locator('button,[role="button"],[title],[aria-label]').evaluateAll(els=>els.map((e,i)=>({i,text:(e.innerText||e.textContent||'').trim().replace(/\s+/g,' ').slice(0,180),title:e.getAttribute('title')||'',aria:e.getAttribute('aria-label')||'',dataName:e.getAttribute('data-name')||''})).filter(x=>/2026|date range|calendar|jul|aug/i.test([x.text,x.title,x.aria,x.dataName].join(' '))).slice(0,100));
            for(const x of dateControls) console.log('TV_DATE_CTRL='+JSON.stringify(x));
            fs.writeFileSync('/tmp/date-controls.json',JSON.stringify(dateControls,null,2));
            fs.writeFileSync('/tmp/gate-lines.txt',gateLines.join('\n'));
            await p.screenshot({path:'/tmp/download-range.png',fullPage:true});
            await b.close();
          })().catch(e=>{console.error('TV_DOWNLOAD_RANGE_ERROR='+e.stack);process.exit(8)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tradingview-download-range-probe-${{ github.run_id }}
          path: |
            /tmp/date-controls.json
            /tmp/gate-lines.txt
            /tmp/download-range.png
            /tmp/*.csv
          retention-days: 1
          if-no-files-found: warn
      - if: always()
        run: rm -f /tmp/tv-state.json /tmp/wr.pine
