name: TradingView Backtest Temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tradingview-backtest-temp.yml']
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Correct window tests and benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pandas numpy requests
          python3 - <<'PY'
          import json
          from pathlib import Path
          import numpy as np, pandas as pd
          import sys
          sys.path.insert(0,'.')
          from research.rsi_supertrend_external_test import indicators

          p=Path('evidence/tradingview-5he8tYVr-backtest')
          df=pd.read_csv(p/'xu100_4h.csv')
          df['time']=pd.to_datetime(df['time'])
          df['dt']=df['time']
          rsi,sig,buy,sell,direction=indicators(df,rsi_len=10,sig_len=10,atr_len=10,factor=2.5)

          def run_window(start=None,end=None,cost_bps_side=0):
              mask=np.ones(len(df),dtype=bool)
              if start: mask &= df.time.to_numpy() >= np.datetime64(start)
              if end: mask &= df.time.to_numpy() <= np.datetime64(end)
              ids=np.flatnonzero(mask)
              if len(ids)<2:return None
              lo,hi=int(ids[0]),int(ids[-1]); eq=10000.0;qty=0.0;entry=0.0;entry_equity=0.0;pending=None;tr=[];curve=[];inbars=0;cost=cost_bps_side/10000
              for i in range(lo,hi+1):
                  row=df.iloc[i]
                  if pending=='exit' and qty>0:
                      fill=float(row.open)*(1-cost); proceeds=qty*fill; pnl=proceeds-entry_equity; eq=proceeds
                      tr[-1].update(exit_time=str(row.time),exit=fill,pnl=pnl,ret_pct=(fill/entry-1)*100);qty=0.0
                  elif pending=='entry' and qty==0:
                      fill=float(row.open)*(1+cost);entry=fill;entry_equity=eq;qty=eq/fill;tr.append({'entry_time':str(row.time),'entry':fill,'equity_in':eq})
                  pending=None
                  if sell[i] and qty>0: pending='exit'
                  elif buy[i] and qty==0: pending='entry'
                  mark=eq if qty==0 else qty*float(row.close);curve.append(mark);inbars+=int(qty>0)
              if qty>0:
                  fill=float(df.iloc[hi].close)*(1-cost); proceeds=qty*fill; pnl=proceeds-entry_equity;eq=proceeds
                  tr[-1].update(exit_time=str(df.iloc[hi].time),exit=fill,pnl=pnl,ret_pct=(fill/entry-1)*100,forced_end=True);curve[-1]=eq
              tr=[x for x in tr if 'pnl'in x]; wins=[x for x in tr if x['pnl']>0];loss=[x for x in tr if x['pnl']<0]
              gp=sum(x['pnl'] for x in wins);gl=-sum(x['pnl'] for x in loss);arr=np.asarray(curve);peak=np.maximum.accumulate(arr);dd=(peak-arr)/peak
              bh=100*(float(df.iloc[hi].close)/float(df.iloc[lo].open)-1)
              return {'start':str(df.iloc[lo].time),'end':str(df.iloc[hi].time),'bars':hi-lo+1,'trades':len(tr),'wins':len(wins),'win_rate':100*len(wins)/len(tr) if tr else None,'profit_factor':gp/gl if gl>0 else None,'return_pct':100*(eq/10000-1),'max_dd_pct':100*dd.max(),'buy_hold_pct':bh,'edge_vs_bh_pp':100*(eq/10000-1)-bh,'exposure_pct':100*inbars/(hi-lo+1),'avg_trade_pct':float(np.mean([x['ret_pct'] for x in tr])) if tr else None}

          windows={'full':(None,None),'2019_2022':('2019-01-01','2022-12-31 23:59:59'),'2023_2024':('2023-01-01','2024-12-31 23:59:59'),'2025_2026':('2025-01-01',None)}
          out={'zero_cost':{},'10bps_side':{}}
          for k,(s,e) in windows.items():
              out['zero_cost'][k]=run_window(s,e,0);out['10bps_side'][k]=run_window(s,e,10)
          (p/'periods_corrected.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/tradingview-5he8tYVr-backtest/periods_corrected.json
          git commit -m 'Publish corrected RSI SuperTrend walk-forward [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main || true
