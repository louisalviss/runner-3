name: M88 UI Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-ui-refresh.yml'
      - 'render_m88_live.py'

permissions:
  contents: write

concurrency:
  group: m88-ui-refresh
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Download latest published M88 snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          curl -fsSL --retry 3 --max-time 30 \
            'https://raw.githubusercontent.com/louisalviss/runner-3/m88-live-data/data.json' \
            -o publish/data.json
          python3 - <<'PY'
          import json
          d=json.load(open('publish/data.json'))
          assert d.get('matches')
          print('SNAPSHOT_MATCHES='+str(len(d['matches'])))
          PY

      - name: Render one-page MSports interface
        shell: bash
        run: |
          set -euo pipefail
          python3 render_m88_live.py --input publish/data.json --output publish/index.html
          grep -q 'Asian View' publish/index.html
          grep -q 'scope-today' publish/index.html
          grep -q 'BET SLIP' publish/index.html
          test -s publish/index.html

      - name: Publish UI without changing snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp publish/data.json /tmp/m88-data.json
          cp publish/index.html /tmp/m88-index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan m88-live-data
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/m88-data.json data.json
          cp /tmp/m88-index.html index.html
          printf '%s\n' 'M88 direct guest feed generated by GitHub Actions.' > README.md
          touch .nojekyll
          git add data.json index.html README.md .nojekyll
          git commit -m "Refresh M88 MSports-style UI $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin HEAD:m88-live-data
