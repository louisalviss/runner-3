name: Security Redact Retired Research PR Metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-redact-retired-research-prs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  redact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Redact metadata and lock retired research PRs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          targets='28 33 34 37 38 40 41 42 43 45 49 52 53 54 55 56 57 59 60 61 62 63 64 65 66 67 68 70 77 78 80 81 82 83 86 89 90 93 95 96 97 117 125'
          ok=0; fail=0; : > /tmp/results.tsv
          for n in $targets; do
            title="Retired research #$n"
            body='Historical research reference retired. The working branch has been removed from public refs. This pull request remains closed and is not an active implementation.'
            if gh api -X PATCH "repos/$repo/pulls/$n" -f title="$title" -f body="$body" -f state=closed >/dev/null 2>/tmp/e; then
              # Best-effort lock; metadata redaction is the required part.
              gh api -X PUT "repos/$repo/issues/$n/lock" -f lock_reason=resolved >/dev/null 2>&1 || true
              echo -e "$n\tREDACTED" >> /tmp/results.tsv; ok=$((ok+1))
            else
              err=$(tr '\n' ' ' </tmp/e | sed 's/"/\\"/g')
              echo -e "$n\tFAILED\t$err" >> /tmp/results.tsv; fail=$((fail+1))
            fi
          done
          mkdir -p security
          python - <<'PY'
          import json
          rows=[]
          for line in open('/tmp/results.tsv', errors='replace'):
              p=line.rstrip('\n').split('\t',2)
              rows.append({'pr':int(p[0]),'status':p[1],**({'error':p[2]} if len(p)>2 else {})})
          out={'status':'COMPLETE' if all(r['status']=='REDACTED' for r in rows) else 'PARTIAL',
               'target_count':len(rows),'redacted_count':sum(r['status']=='REDACTED' for r in rows),
               'failed_count':sum(r['status']=='FAILED' for r in rows),'results':rows}
          open('security/pr-redaction-status.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- security/pr-redaction-status.json
          git commit -m 'security: record retired research PR redaction' || true
          git pull --rebase origin main
          git push origin HEAD:main
          test "$fail" -eq 0
