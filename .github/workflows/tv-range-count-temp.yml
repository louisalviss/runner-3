name: TV range count temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tv-range-count-temp.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install websocket-client==1.8.0
      - name: Test ranged create_series with positive count
        run: |
          cat > /tmp/test.py <<'PY'
          import json,random,re,string,time,websocket
          from datetime import datetime
          from zoneinfo import ZoneInfo
          TV='wss://data.tradingview.com/socket.io/websocket?from=chart%2F';RX=re.compile(r'~m~(\d+)~m~');NY=ZoneInfo('America/New_York')
          def frame(s):return f'~m~{len(s)}~m~{s}'
          def cmd(m,p):return frame(json.dumps({'m':m,'p':p},separators=(',',':')))
          def payloads(raw):
              pos=0
              while pos<len(raw):
                  m=RX.match(raw,pos)
                  if not m:break
                  n=int(m.group(1));a=m.end();b=a+n
                  if b>len(raw):break
                  yield raw[a:b];pos=b
          def ep(s):return int(datetime.fromisoformat(s).replace(tzinfo=NY).timestamp())
          def fetch(a,b,count):
              cs='cs_'+''.join(random.choice(string.ascii_lowercase) for _ in range(12));rows={};events=[]
              ws=websocket.create_connection(TV,timeout=15,origin='https://www.tradingview.com',header=['User-Agent: Mozilla/5.0'])
              try:
                  ws.send(cmd('set_auth_token',['unauthorized_user_token']));ws.send(cmd('chart_create_session',[cs,'']))
                  spec={'symbol':'NASDAQ:CME','adjustment':'splits','session':'regular'}
                  ws.send(cmd('resolve_symbol',[cs,'sym_0','='+json.dumps(spec,separators=(',',':'))]))
                  ws.send(cmd('create_series',[cs,'ser_0','ser_0','sym_0','3',count,f'r,{ep(a)}:{ep(b)}']))
                  end=time.monotonic()+15
                  while time.monotonic()<end:
                      try:raw=ws.recv()
                      except:break
                      if not isinstance(raw,str):continue
                      for p in payloads(raw):
                          if p.startswith('~h~'):ws.send(frame(p));continue
                          try:m=json.loads(p)
                          except:continue
                          if m.get('m') in ('series_error','protocol_error','series_completed','series_timeframe'):events.append({'m':m.get('m'),'p':m.get('p')})
                          if m.get('m')=='timescale_update':
                              u=m.get('p',[None,{}])[1];s=u.get('ser_0') if isinstance(u,dict) else None
                              if isinstance(s,dict):
                                  for x in s.get('s',[]):
                                      v=x.get('v',[])
                                      if len(v)>=6:
                                          try:rows[int(float(v[0]))]=tuple(map(float,v[:6]))
                                          except:pass
                          if m.get('m')=='series_completed':
                              vals=[rows[k] for k in sorted(rows)];return vals,events
                  return [rows[k] for k in sorted(rows)],events
              finally:ws.close()
          out={}
          for name,a,b in [('aug','2026-08-14T09:30:00','2026-08-14T16:00:00'),('jan','2026-01-05T09:30:00','2026-01-10T00:00:00')]:
              vals,ev=fetch(a,b,5000)
              out[name]={'bars':len(vals),'from':datetime.fromtimestamp(vals[0][0],NY).isoformat() if vals else None,'to':datetime.fromtimestamp(vals[-1][0],NY).isoformat() if vals else None,'events':ev[-5:]}
          open('tv_range_count_test.json','w').write(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2))
          PY
          python /tmp/test.py
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv_range_count_test.json;git commit -m 'temp: range count result [skip ci]';git push
