name: Runner5 Restore Lab Seed

on:
  push:
    branches: [main]
    paths:
      - 'restore-lab/requests/seed-runner5-restore-lab-1.json'
      - '.github/workflows/runner5-restore-lab-seed.yml'
      - 'scripts/seed-runner5-restore-lab-v4.mjs'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'restore-lab/requests/seed-runner5-restore-lab-1.json'
      - '.github/workflows/runner5-restore-lab-seed.yml'
      - 'scripts/seed-runner5-restore-lab-v4.mjs'

permissions:
  contents: write

concurrency:
  group: runner5-restore-lab-seed-runner5-restore-lab-1
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decrypt Wasmer account state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { echo 'Automation encryption key unavailable'; exit 3; }
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in ops/wasmer/state.automation.aes \
            -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json

      - name: Install browser automation
        run: npm install --no-save playwright-core@1.58.2

      - name: Seed demo site through REST API
        run: node scripts/seed-runner5-restore-lab-v4.mjs

      - name: Persist safe seed status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=/tmp/runner5-restore-lab-seed.json
          if [ ! -s "$status" ]; then
            printf '{"status":"RUNNER_ERROR","siteSlug":"runner5-restore-lab-1","detail":"seed_status_missing"}\n' > "$status"
          fi
          rm -f /tmp/wasmer-account.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/restore-lab
            cp "$status" ops/restore-lab/runner5-restore-lab-1.seed.json
            git add ops/restore-lab/runner5-restore-lab-1.seed.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Runner5 restore lab seed status'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 5
