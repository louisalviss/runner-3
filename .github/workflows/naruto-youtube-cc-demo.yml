name: Naruto YouTube CC Demo

on:
  push:
    paths:
      - '.github/workflows/naruto-youtube-cc-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          python -m pip install -q -U yt-dlp

      - name: Download Naruto video from YouTube
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://www.youtube.com/watch?v=T2mqnUrQCzA'
          timeout 180 yt-dlp --no-playlist --retries 2 --fragment-retries 2 \
            --extractor-args 'youtube:player_client=android_vr,web' \
            -f 'bv*[height<=1080]+ba/b[height<=1080]' \
            --merge-output-format mp4 -o 'naruto_source.%(ext)s' "$URL"
          test -s naruto_source.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 naruto_source.mp4
          echo 'DOWNLOAD_ROUTE=YOUTUBE_DIRECT_YTDLP' >> "$GITHUB_ENV"

      - name: Download phonk
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            'https://archive.org/download/jamendo-621715/01-2294083-Waveloom-TikTok%20Phonk.mp3' \
            -o phonk.mp3
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 phonk.mp3

      - name: Build Naruto fight phonk edit
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p clips
          python - <<'PY'
          import subprocess, math
          # Trailer is action-heavy; these offsets sample across the trailer to maximize fight/action coverage.
          starts=[11.2,18.8,27.4,34.6,43.1,50.7,58.5,66.4,74.3,82.0,91.1,99.4,106.8,114.0]
          lengths=[0.34,0.42,0.28,0.36,0.46,0.30,0.38,0.26,0.44,0.32,0.40,0.28,0.36,0.46]
          for i,(s,d) in enumerate(zip(starts,lengths)):
              # Alternate punch-in/punch-out and add fast shake/flash for TikTok AMV feel.
              zoom = 1.08 + (i%3)*0.035
              vf=(
                f"scale=ceil(iw*{zoom}/2)*2:ceil(ih*{zoom}/2)*2,"
                "scale=1200:2134:force_original_aspect_ratio=increase,"
                "crop=1080:1920:x='(iw-ow)/2+12*sin(52*t)':y='(ih-oh)/2+8*sin(61*t)',"
                "eq=contrast=1.20:saturation=1.24:brightness='if(lt(t,0.045),0.22,0)':eval=frame,"
                "unsharp=5:5:0.7:5:5:0.0,fps=30,format=yuv420p"
              )
              out=f"clips/c{i:02d}.mp4"
              subprocess.check_call([
                'ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(s),'-i','naruto_source.mp4',
                '-t',str(d),'-an','-vf',vf,'-c:v','libx264','-preset','veryfast','-crf','19',out
              ])
          with open('concat.txt','w') as f:
              for i in range(len(starts)):
                  f.write(f"file 'clips/c{i:02d}.mp4'\n")
          PY
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i concat.txt -c copy visual.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -i visual.mp4 -ss 8 -i phonk.mp3 \
            -filter:a 'volume=1.08,bass=g=5:f=85,alimiter=limit=0.95' \
            -map 0:v:0 -map 1:a:0 -shortest \
            -c:v copy -c:a aac -b:a 192k -movflags +faststart naruto_phonk_youtube_test.mp4
          echo "DOWNLOAD_ROUTE=${DOWNLOAD_ROUTE:-unknown}"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of default=nw=1 naruto_phonk_youtube_test.mp4
          ls -lh naruto_phonk_youtube_test.mp4

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: naruto-phonk-youtube-test
          path: naruto_phonk_youtube_test.mp4
          retention-days: 3
