name: Harden WordPress Site Factory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-factory-source-cleanup.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source-level fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/create-wordpress-site.mjs')
          s=p.read_text()
          s=s.replace("timeout: 30000, failOnStatusCode: false", "timeout: 5000, failOnStatusCode: false")
          old="""async function appDashboardExists(page, app) {
            await page.goto(dashboard(app), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
            const body = await text(page);
            if (/page not found|404|does not exist|could not be found/i.test(body) && !/wordpress admin/i.test(body)) return false;
            return /wordpress admin|settings|deployments|domains|ready/i.test(body) && page.url().includes(`/apps/${owner}/`);
          }"""
          new="""async function appDashboardExists(page, app) {
            await page.goto(dashboard(app), { waitUntil: 'domcontentloaded', timeout: 60000 });
            for (let i = 0; i < 6; i++) {
              await page.waitForTimeout(i === 0 ? 1000 : 700);
              const body = await text(page);
              const onExpectedRoute = page.url().includes(`/apps/${owner}/${app}`);
              if (onExpectedRoute && /wordpress admin|settings|deployments|domains|ready|wordpress/i.test(body)) return true;
              if (/page not found|404|does not exist|could not be found/i.test(body) && !/wordpress/i.test(body)) return false;
            }
            return false;
          }"""
          if old not in s:
              raise SystemExit('appDashboardExists source block not found')
          s=s.replace(old,new)
          p.write_text(s)

          w=Path('.github/workflows/create-wordpress-site.yml')
          y=w.read_text()
          block="""      - name: Bound pre-DNS HTTP probes
                shell: bash
                run: |
                  set -euo pipefail
                  sed -i 's/timeout: 30000/timeout: 5000/g' scripts/create-wordpress-site.mjs

          """
          if block not in y:
              raise SystemExit('runtime hotfix block not found')
          y=y.replace(block,'')
          w.write_text(y)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/create-wordpress-site.mjs .github/workflows/create-wordpress-site.yml
          git commit -m 'Harden WordPress Site Factory idempotency'
          git push origin HEAD:main
