name: Runner3WP V2 Same-Origin R2 Hero
on:
  push:
    branches: [main]
    paths: ['.github/workflows/runner3wp-v2-lcp-r2binding.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: runner3wp-v2-lcp-r2binding, cancel-in-progress: false}
env:
  CANDIDATE_BRANCH: runner3wp-v2-lcp-r2binding-20260820
  BASELINE_SHA: bfaca6aca4cfb8173ebd91f330376e64120332db
  V2_URL: https://wordpress-edge-proxy-v2.ducduy2411.workers.dev/
  CF_WORKER_CONFIG: edge/wordpress-edge-proxy/wrangler.v2.jsonc
  CF_EDGE_URL: https://wordpress-edge-proxy-v2.ducduy2411.workers.dev
  CF_EDGE_OUT: /tmp/runner3wp-v2-edge.json
  CF_SNAPSHOT_OUT: /tmp/runner3wp-v2-snapshot.json
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: runner3wp-v2-lcp-r2binding-20260820, fetch-depth: 0}
      - name: Prepare baseline
        run: |
          set -euo pipefail
          C="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)";test -n "$C";echo "CHROME_PATH=$C" >> "$GITHUB_ENV"
          npm install --no-save lighthouse@12.8.2 >/dev/null 2>&1
          node --input-type=module - <<'NODE'
          const r=await fetch(process.env.V2_URL);const h=await r.text();const ok=r.status===200&&String(r.headers.get('x-edge-snapshot')||'').toUpperCase()==='HIT'&&!h.includes('/__runner3/r2-image/offset-demo-01-w640.webp');if(!ok)process.exit(7);
          NODE
      - name: Baseline Lighthouse 3x
        run: |
          set -euo pipefail;mkdir -p /tmp/lh
          for i in 1 2 3;do npx lighthouse "$V2_URL" --output=json --output-path="/tmp/lh/b$i.json" --only-categories=performance --form-factor=mobile --throttling-method=simulate --screenEmulation.mobile=true --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet;done
      - name: Validate candidate and build snapshot
        run: |
          set -euo pipefail
          node --check edge/wordpress-edge-proxy/src/entry.js
          node --check edge/wordpress-edge-proxy/src/responsive-images.js
          grep -q 'MEDIA_BUCKET' edge/wordpress-edge-proxy/wrangler.v2.jsonc
          grep -q '/__runner3/r2-image/' edge/wordpress-edge-proxy/src/responsive-images.js
          node scripts/build-wordpress-edge-snapshot.mjs
      - name: Direct deploy candidate V2
        id: deploy
        continue-on-error: true
        run: npx --yes wrangler@4.124.0 deploy --config "$CF_WORKER_CONFIG"
      - name: Candidate guard and warm hero
        id: guard
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          sleep 3
          node --input-type=module - <<'NODE'
          import fs from'node:fs';const r=await fetch(process.env.V2_URL,{headers:{'cache-control':'no-cache'}});const h=await r.text();const u=new URL('/__runner3/r2-image/offset-demo-01-w640.webp',process.env.V2_URL);const img=await fetch(u,{headers:{'cache-control':'no-cache'}});const data=await img.arrayBuffer();const o={ok:r.status===200&&String(r.headers.get('x-edge-snapshot')||'').toUpperCase()==='HIT'&&h.includes('/__runner3/r2-image/offset-demo-01-w640.webp')&&img.status===200&&img.headers.get('x-runner3-lcp')==='r2-binding-same-origin'&&data.byteLength>0,homeHttp:r.status,snapshot:r.headers.get('x-edge-snapshot'),marker:h.includes('/__runner3/r2-image/offset-demo-01-w640.webp'),imageHttp:img.status,imageBytes:data.byteLength,imageMarker:img.headers.get('x-runner3-lcp'),etag:img.headers.get('etag')};fs.writeFileSync('/tmp/guard.json',JSON.stringify(o,null,2));console.log(JSON.stringify(o,null,2));if(!o.ok)process.exit(8);
          NODE
      - name: Candidate Lighthouse 3x
        if: steps.deploy.outcome == 'success' && steps.guard.outcome == 'success'
        run: |
          set -euo pipefail
          for i in 1 2 3;do npx lighthouse "$V2_URL" --output=json --output-path="/tmp/lh/c$i.json" --only-categories=performance --form-factor=mobile --throttling-method=simulate --screenEmulation.mobile=true --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet;done
      - name: Judge
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,statistics,datetime
          def read(p):
            p=pathlib.Path(p)
            if not p.exists():return None
            d=json.loads(p.read_text());a=d['audits'];g=lambda k:(a.get(k)or{}).get('numericValue');return {'fcp':g('first-contentful-paint'),'lcp':g('largest-contentful-paint'),'tbt':g('total-blocking-time'),'cls':g('cumulative-layout-shift'),'perf':d['categories']['performance']['score']}
          b=[x for i in(1,2,3) if(x:=read(f'/tmp/lh/b{i}.json'))];c=[x for i in(1,2,3) if(x:=read(f'/tmp/lh/c{i}.json'))];m=lambda a,k:statistics.median([x[k] for x in a]) if len(a)==3 else None;complete=len(b)==len(c)==3
          bl,cl=m(b,'lcp'),m(c,'lcp');bf,cf=m(b,'fcp'),m(c,'fcp');bc,cc=m(b,'cls'),m(c,'cls');bt,ct=m(b,'tbt'),m(c,'tbt');gain=bl-cl if complete else None;keep=bool(complete and gain>=300 and cf<=bf+75 and cc<=bc+0.01 and ct<=max(50,bt+50))
          def load(p):
            try:return json.load(open(p))
            except:return None
          o={'status':'ready'if complete else'incomplete','experiment':'same-origin-r2-binding-hero','verdict':'KEEP_V2'if keep else('ROLLBACK_NO_GAIN'if complete else'ROLLBACK_INCONCLUSIVE'),'keepV2':keep,'guard':load('/tmp/guard.json'),'baseline':{'runs':b,'medianFcpMs':bf,'medianLcpMs':bl,'medianCls':bc,'medianTbtMs':bt},'candidate':{'runs':c,'medianFcpMs':cf,'medianLcpMs':cl,'medianCls':cc,'medianTbtMs':ct},'lcpImprovementMs':gain,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'policy':'keep V2 only for >=300ms median LCP gain with no material FCP/CLS/TBT regression'};pathlib.Path('/tmp/result.json').write_text(json.dumps(o,indent=2));print(json.dumps(o,indent=2))
          PY
      - name: Enforce decision
        if: always()
        run: |
          set -euo pipefail;KEEP=$(python -c "import json;print('1' if json.load(open('/tmp/result.json')).get('keepV2') else '0')" 2>/dev/null||echo 0)
          if [ "$KEEP" != 1 ];then git reset --hard;git checkout --detach "$BASELINE_SHA";node scripts/deploy-wordpress-workers-cache.mjs;fi
          export KEEP;node --input-type=module - <<'NODE'
          import fs from'node:fs';const k=process.env.KEEP==='1';const r=await fetch(process.env.V2_URL,{headers:{'cache-control':'no-cache'}});const h=await r.text();const marker=h.includes('/__runner3/r2-image/offset-demo-01-w640.webp');const probe=await fetch(new URL('/__runner3/r2-image/offset-demo-01-w640.webp',process.env.V2_URL));const o={ok:r.status===200&&String(r.headers.get('x-edge-snapshot')||'').toUpperCase()==='HIT'&&marker===k&&(k?probe.status===200:probe.status===404),kept:k,http:r.status,snapshot:r.headers.get('x-edge-snapshot'),marker,probeHttp:probe.status,probeMarker:probe.headers.get('x-runner3-lcp'),checkedAt:new Date().toISOString()};fs.writeFileSync('/tmp/runtime.json',JSON.stringify(o,null,2));console.log(JSON.stringify(o,null,2));if(!o.ok)process.exit(12);
          NODE
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail;test -s /tmp/result.json||echo '{"status":"failed","verdict":"ROLLBACK_INCONCLUSIVE","keepV2":false}' >/tmp/result.json;git fetch origin "$CANDIDATE_BRANCH";git checkout -B "$CANDIDATE_BRANCH" "origin/$CANDIDATE_BRANCH";mkdir -p ops/perf/ab;cp /tmp/result.json ops/perf/ab/runner3wp-v2-lcp-r2binding.latest.json;cp /tmp/runtime.json ops/perf/ab/runner3wp-v2-lcp-r2binding.runtime.latest.json 2>/dev/null||true;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add ops/perf/ab/runner3wp-v2-lcp-r2binding*;git commit -m 'perf: persist same-origin R2 hero result'||exit 0;git push origin HEAD:"$CANDIDATE_BRANCH"
