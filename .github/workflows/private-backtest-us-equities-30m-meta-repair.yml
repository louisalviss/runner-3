name: Private Backtest US Equities 30m META Repair

on:
  push:
    branches: [main]
    paths:
      - 'tools/private_backtest_us30_meta_repair.py'
      - '.github/workflows/private-backtest-us-equities-30m-meta-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-backtest-us-equities-30m-meta-repair
  cancel-in-progress: false

jobs:
  transport_repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: &env
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/private_backtest_us30_meta_repair.py

  shard5:
    needs: transport_repair
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: *env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'dukascopy-python==4.0.1' 'numpy>=2,<3' 'pandas>=2,<3'
      - run: python tools/private_backtest_us_timeframe_probe.py shard --config jobs/private-backtest-us-equities-30m-probe.json --shard 5

  evaluate:
    needs: [transport_repair, shard5]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: *env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/private_backtest_us_timeframe_probe.py evaluate --config jobs/private-backtest-us-equities-30m-probe.json
