name: WordPress Custom Domain Baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordpress-custom-domain-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wordpress-custom-domain-baseline
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: https://runner3wp.pntr.dev/
      PSI_URL: https://runner3wp.pntr.dev/
      PSI_UI_OUT: /tmp/pagespeed-domain-ui.json
      PSI_UI_SCREENSHOT: /tmp/pagespeed-domain-ui-mobile.png
      PROBE_OUT: /tmp/domain-probe.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Probe custom domain before routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, statistics, subprocess, urllib.request
          from datetime import datetime, timezone
          url=os.environ['TARGET_URL']
          rows=[]
          for _ in range(12):
              p=subprocess.run(['curl','-sS','-L','-o','/tmp/domain-body','-D','/tmp/domain-headers','-w','%{http_code} %{time_starttransfer} %{time_total} %{url_effective}',url],capture_output=True,text=True,check=True)
              parts=p.stdout.strip().split(maxsplit=3)
              code,ttfb,total,effective=parts
              raw=open('/tmp/domain-headers',encoding='latin1').read()
              headers={}
              for line in raw.splitlines():
                  if ':' in line:
                      k,v=line.split(':',1); headers[k.strip().lower()]=v.strip()
              rows.append({'status':int(code),'ttfb_ms':round(float(ttfb)*1000,2),'total_ms':round(float(total)*1000,2),'effective_url':effective,'server':headers.get('server'),'cf_ray':headers.get('cf-ray'),'cf_cache_status':headers.get('cf-cache-status'),'x_edge_snapshot':headers.get('x-edge-snapshot'),'x_edge_mode':headers.get('x-edge-mode'),'x_robots_tag':headers.get('x-robots-tag'),'cache_control':headers.get('cache-control')})
          body=open('/tmp/domain-body','rb').read().decode('utf-8','replace')
          t=[r['ttfb_ms'] for r in rows]
          out={'checkedAt':datetime.now(timezone.utc).isoformat(),'target':url,'requests':len(rows),'statusOk':all(r['status']==200 for r in rows),'medianTtfbMs':round(statistics.median(t),2),'p95TtfbMs':round(sorted(t)[max(0,int(len(t)*0.95)-1)],2),'medianTotalMs':round(statistics.median(r['total_ms'] for r in rows),2),'edgeSnapshotHits':sum(str(r.get('x_edge_snapshot')).upper()=='HIT' for r in rows),'sample':rows[-1],'htmlBytes':len(body.encode()),'usesResponsiveV2':'/responsive-v2/' in body,'hasR2Preconnect':'r2.dev' in body and 'preconnect' in body.lower(),'hasNoindexMeta':'noindex' in body.lower()}
          open(os.environ['PROBE_OUT'],'w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Install PageSpeed browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.61.0
          npx playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Run Google PageSpeed on custom domain
        continue-on-error: true
        run: node scripts/pagespeed-ui-audit.mjs

      - name: Persist baseline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PROBE_OUT" || echo '{"status":"failed","detail":"probe_missing"}' > "$PROBE_OUT"
          test -s "$PSI_UI_OUT" || printf '{"status":"failed","target":"%s","detail":"pagespeed_missing"}\n' "$PSI_URL" > "$PSI_UI_OUT"
          cp "$PROBE_OUT" /tmp/domain-probe-safe.json
          cp "$PSI_UI_OUT" /tmp/domain-psi-safe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/custom-domain/baseline/runs
            cp /tmp/domain-probe-safe.json ops/custom-domain/baseline/runner3wp.probe.latest.json
            cp /tmp/domain-psi-safe.json ops/custom-domain/baseline/runner3wp.pagespeed.latest.json
            cp /tmp/domain-probe-safe.json "ops/custom-domain/baseline/runs/runner3wp.probe.${GITHUB_RUN_ID}.json"
            cp /tmp/domain-psi-safe.json "ops/custom-domain/baseline/runs/runner3wp.pagespeed.${GITHUB_RUN_ID}.json"
            git add ops/custom-domain/baseline
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m "Persist runner3wp baseline: ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep 2
          done
          test "$pushed" = true

      - name: Require baseline probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          p=json.load(open(os.environ['PROBE_OUT']))
          assert p.get('statusOk') is True, json.dumps(p,indent=2)
          d=json.load(open(os.environ['PSI_UI_OUT']))
          print(json.dumps({'probe':p,'pagespeedStatus':d.get('status'),'pagespeedResultUrl':d.get('resultUrl'),'mobile':(d.get('mobile') or {}).get('scores'),'mobileMetrics':(d.get('mobile') or {}).get('metrics')},indent=2))
          PY
