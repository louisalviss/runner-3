name: TV Save WR 2.5.14 Deterministic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build v2.5.14 deterministic source
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/session-state.json.aes -out /tmp/tv-state.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/wr-window-report.pine.aes -out /tmp/wr.pine
          test "$(sha256sum /tmp/wr.pine | awk '{print $1}')" = "9156e8c49b9a5e36007620f3e17fcab26c06714a3e32a252be52437ae23d6026"
          python3 - <<'PY'
          p=open('/tmp/wr.pine').read()
          def rep(old,new,n=1):
              global p
              if p.count(old)<n: raise SystemExit('PATCH_MISSING: '+old[:120])
              p=p.replace(old,new,n)
          rep('strategy("Wave Rider Strategy v2.5.13 WINDOW REPORT", shorttitle="WR 2.5.13 WIN"','strategy("Wave Rider Strategy v2.5.14 DETERMINISTIC", shorttitle="WR 2.5.14 DET"')
          rep('groupWindow="10. Window Report"\nstartTime=input.time(1785171600000,"Start (VN)",group=groupWindow)\nendTime=input.time(1786813200000,"End (VN, exclusive)",group=groupWindow)\nvalidWindow=endTime>startTime\nsignalInReportWindow=validWindow and time_close>=startTime and time_close<endTime', '''groupWindow="10. Deterministic Window"\nstateStartTime=input.time(1785171600000,"State Start (VN, exact bar required)",group=groupWindow)\nstartTime=input.time(1785862800000,"Start (VN)",group=groupWindow)\nendTime=input.time(1786294800000,"End (VN, exclusive)",group=groupWindow)\nvar bool stateAnchorSeen=false\nif time==stateStartTime\n    stateAnchorSeen:=true\nstateActive=stateAnchorSeen\nvalidWindow=endTime>startTime\nsignalInReportWindow=stateActive and validWindow and time_close>=startTime and time_close<endTime\ndetClose=stateActive?close:na\ndetHigh=stateActive?high:na\ndetLow=stateActive?low:na\ndetTR=stateActive?(na(detClose[1])?high-low:math.max(high-low,math.abs(high-detClose[1]),math.abs(low-detClose[1]))):na''')
          rep('showAuditPanel=input.bool(false,"Show Engine Audit (debug)",group=groupStats)','showAuditPanel=input.bool(true,"Show Engine Audit (debug)",group=groupStats)')
          rep('ema21=ta.ema(close,emaLength)','ema21=ta.ema(detClose,emaLength)')
          rep('ph=ta.pivothigh(high,leftBars,rightBars)[1]','ph=ta.pivothigh(detHigh,leftBars,rightBars)[1]')
          rep('pl=ta.pivotlow(low,leftBars,rightBars)[1]','pl=ta.pivotlow(detLow,leftBars,rightBars)[1]')
          rep('belowCount:=close<ema21?nz(belowCount[1])+1:0','belowCount:=stateActive and not na(ema21) and close<ema21?nz(belowCount[1])+1:0')
          rep('aboveCount:=close>ema21?nz(aboveCount[1])+1:0','aboveCount:=stateActive and not na(ema21) and close>ema21?nz(aboveCount[1])+1:0')
          rep('atrAngle=ta.atr(atrPeriod)','atrAngle=ta.rma(detTR,atrPeriod)')
          rep('trSum=math.sum(ta.atr(1),chopLength)','trSum=math.sum(detTR,chopLength)')
          rep('priceRange=ta.highest(high,chopLength)-ta.lowest(low,chopLength)','priceRange=ta.highest(detHigh,chopLength)-ta.lowest(detLow,chopLength)')
          rep('signalATR=ta.atr(signalAtrLength)','signalATR=ta.rma(detTR,signalAtrLength)')
          rep('bool engineOK=canonOutcomeOK and canonExitOK and skippedNativeToCanon==0 and tpLockOK','bool engineOK=stateAnchorSeen and canonOutcomeOK and canonExitOK and skippedNativeToCanon==0 and tpLockOK')
          rep('string engineText=engineOK?"✓ CLEAN":"! CHECK"','string engineText=not stateAnchorSeen?"! ANCHOR":engineOK?"✓ CLEAN":"! CHECK"')
          open('/tmp/wr2514.pine','w').write(p)
          import hashlib
          print('WR2514_SHA256='+hashlib.sha256(p.encode()).hexdigest())
          PY
      - name: Save and server-side verify
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright-core'); const NAME='Wave Rider Strategy v2.5.14 DETERMINISTIC';
          (async()=>{
            const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
            const state=JSON.parse(fs.readFileSync('/tmp/tv-state.json','utf8'));
            const browser=await chromium.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({storageState:state,viewport:{width:1920,height:1080},permissions:['clipboard-read','clipboard-write']});
            const page=await context.newPage(); await page.goto('https://www.tradingview.com/chart/?symbol=BINANCE%3ABNBUSDT.P&interval=5',{waitUntil:'domcontentloaded',timeout:90000}); await page.waitForTimeout(12000);
            let body=await page.locator('body').innerText().catch(()=> ''); console.log('AUTH='+(!/\bSign in\b/i.test(body)?'PASS':'FAIL'));
            const pine=page.locator('[data-name="pine-dialog-button"],button[aria-label="Pine"]'); await pine.first().click({force:true}); await page.waitForTimeout(5500);
            const ta=page.locator('.monaco-editor textarea').last(); const source=fs.readFileSync('/tmp/wr2514.pine','utf8');
            await page.evaluate(s=>navigator.clipboard.writeText(s),source); await ta.click({force:true}); await page.keyboard.press('Control+A'); await page.keyboard.press('Control+V'); await page.waitForTimeout(1800);
            const untitled=page.getByText('Untitled script',{exact:true}); let titleEl=null; for(let i=0;i<await untitled.count();i++){let e=untitled.nth(i);if(await e.isVisible().catch(()=>false)){titleEl=e;break;}}
            if(!titleEl) throw new Error('not Untitled; refusing overwrite'); const tb=await titleEl.boundingBox();
            const saves=page.getByText('Save',{exact:true}); let editorSave=null; for(let i=0;i<await saves.count();i++){let e=saves.nth(i);if(!await e.isVisible().catch(()=>false))continue;let b=await e.boundingBox().catch(()=>null);if(b&&Math.abs(b.y-tb.y)<120){editorSave=e;break;}}
            if(!editorSave) throw new Error('editor Save missing'); await editorSave.click({force:true});
            const label=page.getByText('New script name',{exact:true}); await label.waitFor({state:'visible',timeout:8000}); console.log('SAVE_POPUP=PASS');
            const popup=label.locator('xpath=ancestor::*[.//button[normalize-space(.)="Save"] and .//button[normalize-space(.)="Cancel"]][1]'); if(await popup.count()!=1) throw new Error('save popup not unique');
            const input=popup.locator('input').first(); if(!(await input.count())) throw new Error('name input missing'); if((await input.inputValue())!==NAME) await input.fill(NAME); console.log('SAVE_NAME='+await input.inputValue());
            const pSave=popup.getByRole('button',{name:'Save',exact:true}); if(await pSave.count()!=1) throw new Error('popup Save not unique'); await pSave.click({force:true});
            await label.waitFor({state:'hidden',timeout:10000}).catch(()=>{}); await page.waitForTimeout(4500);
            console.log('SAVE_POPUP_CLOSED='+(!(await label.isVisible().catch(()=>false))?'PASS':'FAIL'));
            body=await page.locator('body').innerText().catch(()=> ''); console.log('POST_SAVE_HITS='+body.split('\n').filter(x=>/Wave Rider|2\.5\.14|save|exist|error|limit/i.test(x)).slice(0,50).join(' | '));
            await page.screenshot({path:'/tmp/post-save.png',fullPage:false});
            if(await label.isVisible().catch(()=>false)) throw new Error('save popup remained open');
            // Compile/add saved source.
            const add=page.getByRole('button',{name:/Add to chart/i}); if(await add.count()) await add.first().click({force:true}); else {await ta.click({force:true});await page.keyboard.press('Control+Enter');}
            await page.waitForTimeout(22000); body=await page.locator('body').innerText().catch(()=> ''); const compile=/Compilation error|Syntax error|Error at/i.test(body)?'FAIL':'PASS'; console.log('COMPILE='+compile); if(compile==='FAIL') throw new Error('compile failed');
            console.log('CHART_WR2514='+(body.includes('WR 2.5.14 DET')?'PASS':'CHECK')); await page.screenshot({path:'/tmp/after-add.png',fullPage:false});
            // Fresh page: open Pine script chooser and verify the server-side saved name.
            const verify=await context.newPage(); await verify.goto('https://www.tradingview.com/chart/?symbol=BINANCE%3ABNBUSDT.P&interval=5',{waitUntil:'domcontentloaded',timeout:90000}); await verify.waitForTimeout(10000);
            const pine2=verify.locator('[data-name="pine-dialog-button"],button[aria-label="Pine"]'); await pine2.first().click({force:true}); await verify.waitForTimeout(4500);
            const unt2=verify.getByText('Untitled script',{exact:true}); let t2=null; for(let i=0;i<await unt2.count();i++){let e=unt2.nth(i);if(await e.isVisible().catch(()=>false)){t2=e;break;}} if(t2) await t2.click({force:true}); await verify.waitForTimeout(1800);
            const open=verify.getByText('Open script…',{exact:true}); if(await open.count()) await open.last().click({force:true}); await verify.waitForTimeout(4500);
            const vbody=await verify.locator('body').innerText().catch(()=> ''); console.log('SERVER_SIDE_NAME='+(vbody.includes(NAME)?'PASS':'FAIL')); console.log('VERIFY_HITS='+vbody.split('\n').filter(x=>/Wave Rider|2\.5\.14|2\.5\.13/i.test(x)).slice(0,80).join(' | ')); await verify.screenshot({path:'/tmp/server-verify.png',fullPage:false});
            if(!vbody.includes(NAME)) throw new Error('server-side saved script not found');
            await browser.close();
          })().catch(e=>{console.error('SAVE2514_ERROR='+e.stack);process.exit(7)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-wr-2514-save-proof
          path: |
            /tmp/post-save.png
            /tmp/after-add.png
            /tmp/server-verify.png
          retention-days: 1
      - if: always()
        run: rm -f /tmp/tv-state.json /tmp/wr*.pine /tmp/wr2514.pine
