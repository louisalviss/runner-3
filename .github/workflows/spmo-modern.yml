name: SPMO Modern Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'spmo-modern/**'
      - '.github/workflows/spmo-modern.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spmo-modern-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modern:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests yfinance beautifulsoup4 lxml python-dateutil html5lib gdown
      - name: Download Notre Dame master-index mirror
        run: gdown 'https://drive.google.com/uc?id=1yfQxR45DZ_vM5pkFvgyexc10NNqbxpFN' -O MasterIndex_20260318.zip
      - name: Run mirror-backed modern SPMO diagnostic
        run: python -u spmo-modern/modern_mirror.py
      - name: Upload modern results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spmo-modern-${{ github.run_id }}
          path: spmo-backtest/output/
          if-no-files-found: warn
          retention-days: 7
