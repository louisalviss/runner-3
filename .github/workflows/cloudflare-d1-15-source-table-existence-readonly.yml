name: Cloudflare D1 15 Missing Source Tables Nonempty (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-15-source-tables-existence-readonly
  cancel-in-progress: false

jobs:
  source-table-existence:
    if: ${{ github.repository == 'louisalviss/runner-3' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded synthetic contract tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare_d1_15_source_table_nonempty_readonly.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_15_source_table_nonempty_readonly.py' -v
      - name: Source account guard; 15 SELECT constant LIMIT 1 probes only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "${CLOUDFLARE_ACCOUNT_ID}" = "7415a87f6bce7884e73ad7cfed5782df"
          python3 scripts/cloudflare_d1_15_source_table_nonempty_readonly.py
      - name: Preserve sanitized boolean-only evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-15-source-table-existence-readonly
          path: migration-out/d1-15-source-table-existence-readonly.json
          if-no-files-found: error
          retention-days: 3
