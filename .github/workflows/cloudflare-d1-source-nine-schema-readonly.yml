name: Cloudflare D1 Source Nine-Schema Encrypted Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-source-nine-schema-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install audited offline dependencies
        run: python3 -m pip install --quiet cryptography
      - name: Check source-only schema and encryption contracts (offline)
        run: |
          python3 -m py_compile scripts/cloudflare_d1_nine_schema_encrypted.py
          python3 scripts/tests/test_cloudflare_d1_nine_schema_encrypted.py
      - name: Read source D1 schema and PK metadata for 9 databases only
        run: python3 scripts/cloudflare_d1_nine_schema_encrypted.py
      - name: Upload encrypted receipt only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-d1-source-nine-schema-encrypted
          path: courier-out/d1-nine-schema-source-envelope.json
          if-no-files-found: error
          retention-days: 1
