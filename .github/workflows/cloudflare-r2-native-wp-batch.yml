name: Cloudflare R2 Native WP Media Bounded Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Diagnose exact Cache-Control drift object SHA-256, read-only by default
        required: true
        default: verify-sha
        options:
          - verify-sha
          - verify-metadata
          - audit
          - auto-small
          - medium-one
          - large-one
          - auto-complete
          - batch

permissions:
  contents: read

concurrency:
  group: cloudflare-target-r2-native-canary
  cancel-in-progress: false

jobs:
  migrate-wp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_TARGET_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_TARGET_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_TARGET_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_TARGET_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce global R2 Class A billing HOLD before any R2 request
        run: python3 scripts/cloudflare_r2_migration_gate.py
      - name: Install R2 S3 SDK
        run: python3 -m pip install --quiet boto3
      - name: Validate Python and bounded migration contracts
        run: |
          python3 -m py_compile scripts/cloudflare_r2_native_canary.py scripts/cloudflare_r2_native_batch.py scripts/cloudflare_r2_wp_autopilot.py scripts/cloudflare_r2_native_large.py scripts/cloudflare_r2_wp_complete.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_native_batch.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_wp_autopilot.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_native_large.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_wp_complete.py
          python3 -m py_compile scripts/cloudflare_r2_wp_metadata_drift.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_wp_metadata_drift.py
          python3 -m py_compile scripts/cloudflare_r2_wp_targeted_sha.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_wp_targeted_sha.py
      - name: Audit, one batch, or one bounded auto-resume session
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "verify-sha" ]]; then
            python3 scripts/cloudflare_r2_wp_targeted_sha.py
          elif [[ "${{ inputs.mode }}" == "verify-metadata" ]]; then
            python3 scripts/cloudflare_r2_wp_metadata_drift.py
          elif [[ "${{ inputs.mode }}" == "auto-small" ]]; then
            python3 scripts/cloudflare_r2_wp_autopilot.py
          elif [[ "${{ inputs.mode }}" == "auto-complete" ]]; then
            python3 scripts/cloudflare_r2_wp_complete.py
          else
            python3 scripts/cloudflare_r2_native_batch.py --mode "${{ inputs.mode }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-r2-native-wp-batch-receipt
          path: |
            migration-out/receipt.json
            migration-out/wp-auto-progress.json
            migration-out/wp-complete-progress.json
            migration-out/wp-metadata-drift.json
            migration-out/wp-targeted-sha.json
          if-no-files-found: error
          retention-days: 3
