name: Wasmer App URL Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasmer-app-url-probe.yml'
      - 'ops/wasmer-url-probe/request.json'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_KEY: ${{ secrets.WASMER_AUTOMATION_KEY || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt Wasmer account state
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in ops/wasmer/state.automation.aes \
            -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json
      - name: Install Playwright
        run: npm install --no-save playwright-core@1.58.2
      - name: Probe canonical app URLs
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const account = JSON.parse(fs.readFileSync('/tmp/wasmer-account.json','utf8'));
          const app = 'runner5-restore-lab-1';
          const owner = account.username;
          const dashboard = `https://wasmer.io/apps/${encodeURIComponent(owner)}/${encodeURIComponent(app)}`;
          const out = '/tmp/wasmer-url-probe.json';
          const browser = await chromium.launch({headless:true, executablePath:'/usr/bin/google-chrome', args:['--no-sandbox']});
          const ctx = await browser.newContext({ignoreHTTPSErrors:true});
          const p = await ctx.newPage();
          async function login(){
            await p.goto('https://wasmer.io/login',{waitUntil:'domcontentloaded',timeout:60000});
            const ident=p.locator('input[name=username],input[placeholder*=Username i],input[autocomplete=username],input[type=email],input[type=text]').first();
            await ident.waitFor({state:'visible',timeout:15000});
            await ident.fill(account.username||account.email);
            const next=p.locator('button,input[type=submit]').filter({hasText:/continue|next|log in|sign in/i}).first();
            if(await next.count()&&await next.isVisible().catch(()=>false)) await next.click({noWaitAfter:true}).catch(()=>{}); else await ident.press('Enter');
            const pass=p.locator('input[type=password]').first();
            await pass.waitFor({state:'visible',timeout:15000});
            await pass.fill(account.password);
            const submit=p.locator('button,input[type=submit]').filter({hasText:/continue|log in|sign in/i}).first();
            if(await submit.count()&&await submit.isVisible().catch(()=>false)) await submit.click({noWaitAfter:true}).catch(()=>{}); else await pass.press('Enter');
            await p.waitForTimeout(3500);
          }
          try{
            await login();
            await p.goto(dashboard,{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(3000);
            const links=[...new Set(await p.locator('a[href]').evaluateAll(as=>as.map(a=>a.href).filter(Boolean)))];
            const wasmerLinks=links.filter(x=>/\.wasmer\.app(?:\/|$)/i.test(x)||/\.id\.wasmer\.app(?:\/|$)/i.test(x));
            const body=(await p.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim();
            const urls=[...new Set(wasmerLinks.map(x=>x.replace(/\/$/,'')+'/'))];
            const checks=[];
            for(const u of urls){
              try{const r=await ctx.request.get(u,{timeout:20000,failOnStatusCode:false}); checks.push({url:u,status:r.status(),finalUrl:r.url()});}catch(e){checks.push({url:u,status:0,error:String(e.message||e)});}
            }
            fs.writeFileSync(out,JSON.stringify({status:'OK',app,owner,dashboard,urls,checks,bodyHint:body.slice(0,1200),updatedAt:new Date().toISOString()},null,2));
          }catch(e){fs.writeFileSync(out,JSON.stringify({status:'FAILED',app,detail:String(e.message||e),updatedAt:new Date().toISOString()},null,2));process.exitCode=1;}finally{await browser.close().catch(()=>{});}
          NODE
      - name: Persist URL probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/wasmer-account.json
          mkdir -p ops/wasmer-url-probe
          cp /tmp/wasmer-url-probe.json ops/wasmer-url-probe/runner5-restore-lab-1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/wasmer-url-probe/runner5-restore-lab-1.json
          git diff --cached --quiet && exit 0
          git commit -m 'Persist Wasmer app URL probe'
          git pull --rebase origin main
          git push origin HEAD:main
