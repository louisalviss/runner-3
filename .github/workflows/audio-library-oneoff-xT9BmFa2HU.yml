name: Audio Library One-off xT9BmFa2HU

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-library-oneoff-xT9BmFa2HU.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUDIO_LIBRARY_BUCKET: runner3-wp-media
      AUDIO_LIBRARY_RETENTION_DAYS: '30'
      CHATGPT_INBOX_PUBLIC_KEY: sYGZHQp2jOgHK7mnuF+Yij8rZOxYbgxKNOP4okx0k3E=
      AUDIO_LIBRARY_EXTRACT_MAX_ITEMS: '3'
      AUDIO_LIBRARY_MAX_RAW_CHARS: '120000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install -q -U requests beautifulsoup4 lxml pypdf yt-dlp 'cryptography>=45,<47'
      - name: Enqueue and extract
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/request.json <<'JSON'
          {"url":"https://www.reddit.com/r/AskReddit/s/xT9BmFa2HU","source":"chat"}
          JSON
          python scripts/audio_library_chat_intake.py /tmp/request.json | tee /tmp/enqueue-raw.log
          python - <<'PY'
          import json
          from pathlib import Path
          lines=Path('/tmp/enqueue-raw.log').read_text(errors='replace').splitlines()
          obj=None
          for line in reversed(lines):
              try:
                  x=json.loads(line)
              except Exception:
                  continue
              if isinstance(x,dict) and isinstance(x.get('results'),list):
                  obj=x; break
          if obj is None: raise SystemExit('enqueue JSON not found')
          Path('/tmp/enqueue.json').write_text(json.dumps(obj,ensure_ascii=False))
          PY
          python scripts/audio_library_extract_direct.py /tmp/enqueue.json | tee /tmp/extract-raw.log
          python - <<'PY'
          import json,datetime
          from pathlib import Path
          def last_obj(path):
              obj=None
              if not Path(path).exists(): return None
              for line in reversed(Path(path).read_text(errors='replace').splitlines()):
                  try: x=json.loads(line)
                  except Exception: continue
                  if isinstance(x,dict): obj=x; break
              return obj
          out={'status':'ready','url':'https://www.reddit.com/r/AskReddit/s/xT9BmFa2HU','enqueue':last_obj('/tmp/enqueue.json'),'extract':last_obj('/tmp/extract-raw.log'),'updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          Path('ops/audio-library/oneoff-xT9BmFa2HU-status.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Persist encrypted inbox and status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/audio-library/oneoff-xT9BmFa2HU-status.json
          git add ops/audio-library/chatgpt-inbox/*.json 2>/dev/null || true
          git commit -m 'Publish xT9BmFa2HU encrypted source [skip ci]' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
