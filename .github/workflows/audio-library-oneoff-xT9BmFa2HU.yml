name: Audio Library One-off xT9BmFa2HU
# trigger-v4 resolve-first rerun

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-library-oneoff-xT9BmFa2HU.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUDIO_LIBRARY_BUCKET: runner3-wp-media
      AUDIO_LIBRARY_RETENTION_DAYS: '30'
      CHATGPT_INBOX_PUBLIC_KEY: sYGZHQp2jOgHK7mnuF+Yij8rZOxYbgxKNOP4okx0k3E=
      AUDIO_LIBRARY_EXTRACT_MAX_ITEMS: '3'
      AUDIO_LIBRARY_MAX_RAW_CHARS: '120000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install -q -U requests beautifulsoup4 lxml pypdf yt-dlp 'cryptography>=45,<47'
      - name: Resolve and extract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          import audio_library_resolve_reddit_via_rxddit as rx
          import audio_library_resolve_reddit_via_curlx_next as base
          item_id='b48c7298-bb9f-52ed-bd5d-efd2a53c1745'
          src='https://www.reddit.com/r/AskReddit/s/xT9BmFa2HU'
          item=base.wrangler_get(f'{base.ITEM_PREFIX}{item_id}.json')
          if not item:
              raise SystemExit('R2 item missing')
          current=str(item.get('sourceUrl') or src)
          canonical=current if '/comments/' in current else None
          mode='already-canonical' if canonical else None
          if not canonical:
              canonical,mode=rx.try_rxddit(current)
          if not canonical:
              for fn in (base.try_reddit_lynx, base.try_microlink, base.try_domainee, base.try_curlx, base.try_reddit_headers):
                  canonical,mode=fn(current)
                  if canonical: break
          if not canonical:
              raise SystemExit('canonical unresolved: '+str(mode))
          base.update(item_id,current,canonical)
          Path('/tmp/enqueue.json').write_text(json.dumps({'ok':True,'results':[{'id':item_id,'url':canonical,'status':'resolved'}]},ensure_ascii=False))
          Path('/tmp/resolve.json').write_text(json.dumps({'id':item_id,'canonical':canonical,'mode':mode},ensure_ascii=False))
          print(json.dumps({'id':item_id,'canonical':canonical,'mode':mode},ensure_ascii=False))
          PY
          python scripts/audio_library_extract_direct.py /tmp/enqueue.json | tee /tmp/extract-raw.log
          python - <<'PY'
          import json,datetime
          from pathlib import Path
          def last_obj(path):
              obj=None
              if not Path(path).exists(): return None
              for line in reversed(Path(path).read_text(errors='replace').splitlines()):
                  try: x=json.loads(line)
                  except Exception: continue
                  if isinstance(x,dict): obj=x; break
              return obj
          out={'status':'ready','url':'https://www.reddit.com/r/AskReddit/s/xT9BmFa2HU','resolve':last_obj('/tmp/resolve.json'),'extract':last_obj('/tmp/extract-raw.log'),'updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          Path('ops/audio-library/oneoff-xT9BmFa2HU-status.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Persist encrypted inbox and status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/audio-library/oneoff-xT9BmFa2HU-status.json
          git add ops/audio-library/chatgpt-inbox/*.json 2>/dev/null || true
          git commit -m 'Publish xT9BmFa2HU resolved encrypted source [skip ci]' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
