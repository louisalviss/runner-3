name: moxing-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/moxing_probe.py'
      - '.github/workflows/moxing-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - run: python scripts/moxing_probe.py moxing_probe
      - uses: actions/upload-artifact@v4
        with:
          name: moxing-probe
          path: moxing_probe
          retention-days: 7
