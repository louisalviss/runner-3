name: M88 AI Odds Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-ai-odds-publish.yml'
      - 'collect_m88_outrights.py'
      - 'collect_m88_outrights_v2.py'

permissions:
  contents: write

concurrency:
  group: m88-ai-odds-publisher-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Install only missing M88 collector dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v openvpn >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openvpn
          fi
          command -v ip >/dev/null
          command -v iptables >/dev/null
          command -v curl >/dev/null
          command -v jq >/dev/null
          python3 - <<'PY' || python3 -m pip install -q 'playwright>=1.46,<2'
          import playwright
          print('playwright already available')
          PY
          mkdir -p evidence /tmp/relays

      - name: Select M88-compatible Asia relay
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://www.vpngate.net/api/iphone/ -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          meta=[]
          for c in ['TH','JP','SG','MY','ID','KR','TW','VN']:
              rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and r.get('OpenVPN_ConfigData_Base64')]
              rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
              for r in rs[:(8 if c=='TH' else 3)]:
                  cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
                  cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
                  p=pathlib.Path(f'/tmp/relays/{len(meta):02d}-{c}.ovpn');p.write_text(cfg)
                  meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/relays.tsv').write_text('\n'.join(meta)+'\n')
          if not meta: raise SystemExit('No Asia VPN Gate relay')
          PY

          IFACE=$(ip route show default|awk '{print $5;exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.249.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.249.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.249.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.249.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          selected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo "TRY $country $relay"
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/o.log /tmp/top.json
            sudo touch /tmp/o.log; sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log || true
            ok=0
            for i in {1..12}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null && { ok=1; break; }
              grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|Connection refused|fatal error' /tmp/o.log 2>/dev/null && break || true
            done
            [ "$ok" = 1 ] || continue
            if sudo ip netns exec vpnns curl -fsS --max-time 15 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/top.json; then
              if python3 - <<'PY'
          import json
          try:d=json.load(open('/tmp/top.json'))
          except Exception:raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then
                echo "$country $relay" | tee evidence/relay.txt
                selected=1; break
              fi
            fi
          done </tmp/relays.tsv
          test "$selected" = 1

      - name: Capture complete M88 SABA Outright board
        shell: bash
        run: |
          set -euo pipefail
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner python3 "$GITHUB_WORKSPACE/collect_m88_outrights_v2.py" \
            --output "$GITHUB_WORKSPACE/evidence/m88-outrights-all.json" \
            --health "$GITHUB_WORKSPACE/evidence/m88-outrights-health.json" \
            --screenshot "$GITHUB_WORKSPACE/evidence/outrights-final.png" \
            --min-publish-ratio 0.90 2>&1 | tee evidence/collector.log

      - name: Publish last-good Outright release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s evidence/m88-outrights-all.json
          if ! gh release view m88-outrights-all --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create m88-outrights-all --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'M88 All Outrights' --notes 'Exact M88/SABA full-board Outright snapshot. Auto-refreshed.'
          fi
          gh release upload m88-outrights-all --repo "$GITHUB_REPOSITORY" evidence/m88-outrights-all.json evidence/m88-outrights-health.json --clobber

      - name: Publish collector diagnostic status
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,datetime
          health={}
          p=pathlib.Path('evidence/m88-outrights-health.json')
          if p.exists():
              try:health=json.loads(p.read_text())
              except Exception:health={}
          log=''
          lp=pathlib.Path('evidence/collector.log')
          if lp.exists():log=lp.read_text(errors='replace')[-30000:]
          status={
            'run_id':os.getenv('RUN_ID'),
            'job_status':os.getenv('JOB_STATUS'),
            'updated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'health':health,
            'has_output':pathlib.Path('evidence/m88-outrights-all.json').exists(),
            'log_tail':log,
          }
          pathlib.Path('/tmp/status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2))
          PY
          AUTH_HEADER=$(git config --local --get http.https://github.com/.extraheader || true)
          rm -rf /tmp/m88-status
          git init -q /tmp/m88-status
          git -C /tmp/m88-status config user.name 'github-actions[bot]'
          git -C /tmp/m88-status config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/m88-status remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          [ -z "$AUTH_HEADER" ] || git -C /tmp/m88-status config http.https://github.com/.extraheader "$AUTH_HEADER"
          git -C /tmp/m88-status checkout --orphan m88-outrights-status >/dev/null 2>&1
          cp /tmp/status.json /tmp/m88-status/status.json
          [ ! -f evidence/collector.log ] || cp evidence/collector.log /tmp/m88-status/collector.log
          [ ! -f evidence/m88-outrights-health.json ] || cp evidence/m88-outrights-health.json /tmp/m88-status/health.json
          [ ! -f evidence/m88-outrights-all.json ] || cp evidence/m88-outrights-all.json /tmp/m88-status/debug-outrights.json
          git -C /tmp/m88-status add .
          git -C /tmp/m88-status commit -q -m "M88 Outright status run ${RUN_ID}"
          git -C /tmp/m88-status push -q --force origin HEAD:m88-outrights-status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-outrights-all-${{ github.run_id }}
          path: evidence/
          retention-days: 3
