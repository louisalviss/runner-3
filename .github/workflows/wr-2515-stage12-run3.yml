name: WR 2.5.15 Stage1 Stage2 5m Run3
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/wr-2515-stage12-run3.yml']
permissions:
  contents: read
  actions: read
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - name: Run Stage1 and setup reconstruction shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
          BASE_DIR: /tmp/base
          OUT_DIR: /tmp/stage12
          REFERENCE_VERIFY: /tmp/reference_verify.py
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
          python3 wave-rider-verify/wr2515_stage12_5m.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr2515-stage12-run3-shard-${{ matrix.shard }}
          path: /tmp/stage12
          retention-days: 7
  merge:
    needs: shard
    if: always() && needs.shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wr2515-stage12-run3-shard-*
          path: /tmp/all
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - name: Apply frozen Stage1 and Stage2 selector
        shell: bash
        env:
          BASE_DIR: /tmp/base
          IN_DIR: /tmp/all
          OUT_DIR: /tmp/final
        run: |
          set -euo pipefail
          python3 wave-rider-verify/wr2515_stage12_merge_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr2515-stage12-run3-final
          path: /tmp/final
          retention-days: 14
