name: Wasmer WordPress Settings Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasmer-wordpress-settings-inspect.yml'
      - 'scripts/wasmer-wordpress-settings-inspect.mjs'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted Wasmer state
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-result.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/browser-state.aes -out /tmp/wasmer-browser-state.json
      - run: npm install --no-save playwright-core@1.58.2
      - name: Inspect WordPress settings
        run: node scripts/wasmer-wordpress-settings-inspect.mjs
      - name: Persist safe inspection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/wasmer-wp-settings-inspect.json || echo '{"status":"runner_error"}' >/tmp/wasmer-wp-settings-inspect.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main && git reset --hard origin/main
          cp /tmp/wasmer-wp-settings-inspect.json ops/wasmer/wp-settings-inspect.json
          git add ops/wasmer/wp-settings-inspect.json
          if ! git diff --cached --quiet; then git commit -m 'Persist safe Wasmer WordPress settings inspection'; git push origin HEAD:main; fi
