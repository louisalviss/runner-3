name: WR Modular Trend Sweep
on:
  pull_request:
    branches: [main]
    paths:
      - 'wave-rider-verify/wr_modular_trend_sweep.py'
      - 'wave-rider-verify/wr_modular_trend_merge.py'
      - '.github/workflows/wr-modular-trend-sweep.yml'
permissions:
  contents: read
  actions: read
jobs:
  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ github.token }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - run: curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
      - name: Run modular trend group
        env:
          GROUP: ${{ matrix.group }}
          GROUPS: 6
          BASE_DIR: /tmp/base
          OUT_DIR: /tmp/out
        run: python3 wave-rider-verify/wr_modular_trend_sweep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-modular-trend-group-${{ matrix.group }}
          path: /tmp/out
          retention-days: 14
  merge:
    needs: shard
    if: always() && needs.shard.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wr-modular-trend-group-*
          path: /tmp/all
          merge-multiple: false
      - run: python3 wave-rider-verify/wr_modular_trend_merge.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr-modular-trend-final
          path: /tmp/final
          retention-days: 14
