name: webnovel-writing-brain-semantic-v2-1-promote-live
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/webnovel-writing-brain-semantic-v2-1-promote-live.yml']
permissions:
  contents: write
  actions: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: webnovel-writing-brain-semantic-v2-1-promote.yml
      STATUS_FILE: ops/webnovel-writing-brain-semantic-v2-1-promote-live.json
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Snapshot
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow "$TARGET_WORKFLOW" --branch main --limit 10 --json databaseId,createdAt --jq 'sort_by(.createdAt)|reverse|.[0].databaseId')
          test -n "$run_id" && test "$run_id" != null
          export RUN_ID="$run_id"
          export STATUS=$(gh run view "$run_id" --json status --jq .status)
          export CONCLUSION=$(gh run view "$run_id" --json conclusion --jq '.conclusion // ""')
          export HEAD_SHA=$(gh run view "$run_id" --json headSha --jq .headSha)
          python - <<'PY'
          import datetime,json,os,pathlib
          d={'schema':'webnovel-writing-brain-semantic-v2.1-promote-live','run_id':int(os.environ['RUN_ID']),'status':os.environ['STATUS'],'conclusion':os.environ['CONCLUSION'] or None,'head_sha':os.environ['HEAD_SHA'],'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path(os.environ['STATUS_FILE']).parent.mkdir(parents=True,exist_ok=True)
          pathlib.Path(os.environ['STATUS_FILE']).write_text(json.dumps(d,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(d))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATUS_FILE"
          git commit -m 'Snapshot Semantic V2.1 promotion [skip ci]' || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((i*2))
          done
          exit 1
