name: WR Stock10 CCI Frozen A-B
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'research/stock10_cci_ab.py'
      - 'research/stock10_cci_merge.py'
      - '.github/workflows/wr-stock10-cci-ab.yml'
permissions:
  contents: read
concurrency:
  group: wr-stock10-cci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  symbol:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        symbol: [AAPL,ADBE,ADI,ADP,ADSK,AEP,ALNY,AMAT,AMD,AMGN,AMZN,AVGO,BKR,CDNS,CMCSA,COST,CPRT,CSCO,CSGP,CSX,CTSH,DXCM,EA,EXC,FANG,FTNT,GILD,GOOG,GOOGL,HON,IDXX,INTC,INTU,ISRG,KHC,LRCX,MAR,MCHP,MDLZ,META,MPWR,MRVL,MSFT,MU,NFLX,NVDA,ODFL,ORLY,PANW,PAYX,PCAR,PEP,PLTR,PYPL,QCOM,REGN,ROST,SBUX,SNPS,TMUS,TSLA,TTWO,TXN,VRTX,WDAY,WDC,WMT,ZS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests websocket-client dukascopy-python
      - name: Fetch frozen WR lineage and patch filter callback direction
        run: |
          set -euo pipefail
          mkdir -p /tmp/wrbase /tmp/wrstruct /tmp/wrcci
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/wr-canonical-clean2-20260821/wave-rider-verify/wr_tv_parity.py' -o /tmp/wrbase/wr_tv_parity.py
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/wr-canonical-clean2-20260821/wave-rider-verify/wr_dukascopy_expanded_matrix.py' -o /tmp/wrbase/wr_dukascopy_expanded_matrix.py
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/27797cf9c4ea0a91b1bc8d62059d052c2c843eb5/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/a4afdebff87cb0f5ddd100c12a27872116a5c12e/apps/wave-rider-structural/close_confirm.py' -o /tmp/wrcci/close_confirm.py
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/a4afdebff87cb0f5ddd100c12a27872116a5c12e/apps/wave-rider-structural/stock10_close_ab.py' -o /tmp/wrstruct/stock10_close_ab.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/wrcci/close_confirm.py'); s=p.read_text()
          old="if eligible_signal is not None and not bool(eligible_signal(int(b.ct))):"
          new="signal_dir=1 if nl else -1\n                if eligible_signal is not None and not bool(eligible_signal(int(b.ct),signal_dir)):"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          python -m py_compile /tmp/wrbase/*.py /tmp/reference_verify.py /tmp/wrcci/close_confirm.py /tmp/wrstruct/stock10_close_ab.py research/stock10_cci_ab.py
      - name: Run stock 10m CCI A-B
        env:
          WR_BASE_DIR: /tmp/wrbase
          WR_STRUCT_DIR: /tmp/wrstruct
          WR_PATCH_DIR: /tmp/wrcci
          WR_OUT: /tmp/wr-stock10-cci
          SYMBOL: ${{ matrix.symbol }}
        run: python research/stock10_cci_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-stock10-cci-${{ matrix.symbol }}
          path: /tmp/wr-stock10-cci/
          retention-days: 7
          if-no-files-found: warn
  merge:
    needs: symbol
    if: always() && needs.symbol.result != 'cancelled'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wr-stock10-cci-*
          path: /tmp/all
      - name: Merge results
        env:
          MERGE_ROOT: /tmp/all
          FINAL_OUT: /tmp/final
        run: python research/stock10_cci_merge.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr-stock10-cci-final
          path: /tmp/final/
          retention-days: 14
          if-no-files-found: error
