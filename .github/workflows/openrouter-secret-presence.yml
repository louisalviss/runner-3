name: OpenRouter Secret Presence

on:
  push:
    paths:
      - '.github/workflows/openrouter-secret-presence.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check secret presence without printing it
        shell: bash
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_SECRET_PRESENT"
          else
            echo "OPENROUTER_SECRET_MISSING"
            exit 1
          fi

# smoke-trigger-2
