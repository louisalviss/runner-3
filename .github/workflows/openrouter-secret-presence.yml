name: OpenRouter Secret Presence

on:
  push:
    paths:
      - '.github/workflows/openrouter-secret-presence.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Record secret presence only
        shell: bash
        run: |
          mkdir -p .github
          if [ -n "$OPENROUTER_API_KEY" ]; then
            printf 'PRESENT\n' > .github/openrouter-secret-status.txt
          else
            printf 'MISSING\n' > .github/openrouter-secret-status.txt
          fi

      - name: Commit status marker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/openrouter-secret-status.txt
          git diff --cached --quiet && exit 0
          git commit -m "record OpenRouter secret presence"
          git push
