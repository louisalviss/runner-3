name: WR 2024 Frozen Rolling OOS Exact

on:
  push:
    branches: [wr-2024-frozen-oos]
    paths:
      - '.github/workflows/wr-2024-frozen-oos-exact.yml'
      - 'wr_2024_exact_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - name: Fetch frozen WR engine
        shell: bash
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8ae05d04764d28cd0705277951973376b04a7f53/wave-rider-verify/wr2515_tf_phase1.py' -o /tmp/zonec2024.py
      - name: Patch dates + exact Zone C only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/zonec2024.py'); s=p.read_text()
          repl={
            "STATE=int(datetime(2024,12,1,tzinfo=timezone.utc).timestamp()*1000)":"STATE=int(datetime(2023,9,1,tzinfo=timezone.utc).timestamp()*1000)",
            "START=int(datetime(2025,1,1,tzinfo=timezone.utc).timestamp()*1000)":"START=int(datetime(2023,10,1,tzinfo=timezone.utc).timestamp()*1000)",
            "END=int(datetime(2026,8,15,tzinfo=timezone.utc).timestamp()*1000)":"END=int(datetime(2025,1,1,tzinfo=timezone.utc).timestamp()*1000)",
            "RUN_END=int(datetime(2026,8,18,tzinfo=timezone.utc).timestamp()*1000)":"RUN_END=int(datetime(2025,1,1,tzinfo=timezone.utc).timestamp()*1000)",
            "months=[(2024,12)]+[(2025,m) for m in range(1,13)]+[(2026,m) for m in range(1,8)]":"months=[(2023,m) for m in range(9,13)]+[(2024,m) for m in range(1,13)]",
          }
          for a,b in repl.items():
            if s.count(a)!=1: raise SystemExit(f'date patch anchor missing: {a}')
            s=s.replace(a,b,1)
          # Remove 2026 daily tail loop entirely; monthly data covers through 2024-12.
          old="""    for d in range(1,19):\n        fn=f'{sym}-{source_tf}m-2026-08-{d:02d}.zip'\n        u=f'https://data.binance.vision/data/futures/um/daily/klines/{sym}/{source_tf}m/{fn}'\n        try:b.extend(readzip(getzip(u)))\n        except Exception as e:print('FETCH_ERR',sym,fn,repr(e),flush=True)\n"""
          if s.count(old)!=1: raise SystemExit('daily-tail patch anchor missing')
          s=s.replace(old,'',1)
          # Exact Zone C entry filter, identical to successful run 32233507091.
          old='        allowed,sexit=sf(x.ct+1,chart_ms)\n'
          new="        allowed,sexit=sf(x.ct+1,chart_ms)\n        vn_hour=((x.ct+1)//3600000+7)%24\n        if vn_hour not in (23,0): allowed=False\n"
          if s.count(old)!=1: raise SystemExit('zone patch anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Run exact 10m Zone C 2023-10 through 2024-12
        env:
          TF_MIN: 10
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
          BASE_DIR: /tmp/base
          OUT_DIR: /tmp/out
        run: python3 /tmp/zonec2024.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr2024-zonec10-shard-${{ matrix.shard }}
          path: /tmp/out
          retention-days: 7

  merge:
    needs: shard
    if: always() && needs.shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wr2024-zonec10-shard-*
          path: /tmp/all
          merge-multiple: true
      - name: Merge + frozen 3M selector
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json,os,statistics,random,math
          from collections import defaultdict
          from datetime import datetime,timezone
          os.makedirs('/tmp/final',exist_ok=True)
          S=[]; E=[]; T=[]
          for p in glob.glob('/tmp/all/summary-*.json'): S+=json.load(open(p))
          for p in glob.glob('/tmp/all/errors-*.json'): E+=json.load(open(p))
          for p in glob.glob('/tmp/all/trades-*.jsonl'):
            for line in open(p):
              if line.strip(): T.append(json.loads(line))
          T.sort(key=lambda a:(a['signal_time'],a['symbol']))
          def dt(a): return datetime.fromtimestamp(a['signal_time']/1000,tz=timezone.utc)
          def net(a,bps): return a['R']-(a['entry']/abs(a['entry']-a['stop']))*bps/10000
          def stat(xs):
            z={'n':len(xs),'gross_r':sum(a['R'] for a in xs)}
            for b in (4,6,8,10,12,15,20): z[f'net_r_{b}bps']=sum(net(a,b) for a in xs)
            z['avg_net6_r']=z['net_r_6bps']/z['n'] if z['n'] else None
            return z
          by_month=defaultdict(list)
          for a in T: by_month[(dt(a).year,dt(a).month)].append(a)
          selected=[]; monthly={}; selector_symbols={}
          for m in range(1,13):
            y=2024
            # previous 3 calendar months, no lookahead
            train_months=[]
            yy,mm=y,m
            for _ in range(3):
              mm-=1
              if mm==0: yy-=1; mm=12
              train_months.append((yy,mm))
            train=[]
            for k in train_months: train.extend(by_month.get(k,[]))
            sy=defaultdict(list)
            for a in train: sy[a['symbol']].append(a)
            keep={s for s,xs in sy.items() if len(xs)>=5 and sum(net(a,6) for a in xs)>0}
            test=[a for a in by_month.get((y,m),[]) if a['symbol'] in keep]
            selected.extend(test)
            selector_symbols[f'{y}-{m:02d}']={'n_symbols':len(keep),'symbols':sorted(keep),'train_months':[f'{a}-{b:02d}' for a,b in reversed(train_months)]}
            monthly[f'{y}-{m:02d}']=stat(test)
          # drawdown on cumulative net6
          eq=peak=0.0; maxdd=0.0
          for a in selected:
            eq+=net(a,6); peak=max(peak,eq); maxdd=min(maxdd,eq-peak)
          # leave-one-month-out totals
          loo={}
          for k in monthly:
            xs=[a for a in selected if f'{dt(a).year}-{dt(a).month:02d}'!=k]
            loo[k]=stat(xs)['net_r_6bps']
          # iid bootstrap mean net6, fixed seed, diagnostic only
          vals=[net(a,6) for a in selected]
          random.seed(2515)
          boots=[]
          if vals:
            n=len(vals)
            for _ in range(10000): boots.append(sum(vals[random.randrange(n)] for __ in range(n))/n)
            boots.sort(); ci=[boots[int(.025*len(boots))],boots[int(.975*len(boots))-1]]
          else: ci=[None,None]
          report={
            'status':'WR_2024_FROZEN_ROLLING_OOS_COMPLETE',
            'engine':'WR v2.5.15 deterministic exact Zone C 10m; frozen source commits',
            'rule':'Previous 3 calendar months; include symbol iff train n>=5 and train net6>0; frozen before 2024 test',
            'test_period':'2024-01-01 through 2024-12-31',
            'train_seed_period':'2023-10-01 through 2023-12-31',
            'warmup_from':'2023-09-01',
            'total':stat(selected),
            'monthly':monthly,
            'positive_months_net6':sum(v['net_r_6bps']>0 for v in monthly.values()),
            'months_with_trades':sum(v['n']>0 for v in monthly.values()),
            'max_drawdown_net6_r':maxdd,
            'leave_one_month_out_net6':loo,
            'bootstrap_iid_mean_net6_95ci':ci,
            'selector':selector_symbols,
            'all_zonec_trades_period':stat([a for a in T if dt(a).year==2024]),
            'seed_trades_2023q4':stat([a for a in T if dt(a).year==2023 and dt(a).month>=10]),
            'symbols_completed':len(S),
            'errors':E,
          }
          json.dump(report,open('/tmp/final/report.json','w'),indent=2)
          with open('/tmp/final/selected_trades.jsonl','w') as f:
            for a in selected:f.write(json.dumps(a,separators=(',',':'))+'\n')
          with open('/tmp/final/all_trades.jsonl','w') as f:
            for a in T:f.write(json.dumps(a,separators=(',',':'))+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wr2024-frozen-rolling-oos-final
          path: /tmp/final
          retention-days: 14
