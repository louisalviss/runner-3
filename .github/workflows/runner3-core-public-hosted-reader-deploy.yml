name: Runner3 Core Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-core-public-hosted-reader-deploy.yml'
      - 'cloudflare/runner3-core/**'
      - '!cloudflare/runner3-core/reader-audio-core/**'
      - 'ops/reader-core-deploy.trigger'
      - 'scripts/verify_runner3_d1_quota_guards.mjs'
      - 'scripts/verify_interest_profile_promotion.mjs'
      - 'scripts/verify_interest_ontology.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner3-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
    steps:
      - name: Validate Cloudflare deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RUNNER3_CORE_TOKEN; do
            test -n "${!name:-}" || { echo "MISSING:$name" >&2; exit 2; }
            echo "PRESENT:$name"
          done

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Reader Audio Core browser bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save esbuild
          node scripts/build_reader_audio_core_browser_bundle.mjs
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-bundle.generated.js

      - name: Compose latest Core with Reader v82 stable shell, mailbox, and Opportunity Radar router
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('cloudflare/runner3-core')

          wrapper=root/'artifact-library-reader-v7-github-audio-entry.js'
          text=wrapper.read_text(encoding='utf-8')
          text,count=re.subn(
            r'import app from "\./artifact-library-reader-v\d+[^\"]*-entry\.js";',
            'import app from "./artifact-library-reader-v82-stable-shell-entry.js";',
            text,
            count=1,
          )
          if count != 1: raise SystemExit('reader wrapper import marker missing')
          wrapper.write_text(text,encoding='utf-8')

          mailbox=root/'mailbox-entry.js'
          text=mailbox.read_text(encoding='utf-8')
          canonical='import app from "./audio-entry.js";'
          direct='import app from "./artifact-library-reader-v7-github-audio-entry.js";'
          if canonical not in text and direct not in text: raise SystemExit('canonical mailbox import marker missing')
          if direct in text: text=text.replace(direct,canonical,1)
          mailbox.write_text(text,encoding='utf-8')

          audio_entry=root/'audio-entry.js'
          audio_text=audio_entry.read_text(encoding='utf-8')
          if 'import { handleAudioMedia } from "./src/audio-media.js";' not in audio_text:
              raise SystemExit('audio-media fast path import missing')
          if 'import("./artifact-library-reader-v7-github-audio-entry.js")' not in audio_text:
              raise SystemExit('lazy canonical reader import missing')

          opportunity_entry=root/'opportunity-router-entry.js'
          opportunity_text=opportunity_entry.read_text(encoding='utf-8')
          if 'handleOpportunityRegime' not in opportunity_text or 'guardOpportunityRegimeWrite' not in opportunity_text:
              raise SystemExit('opportunity router missing')

          cfg_path=root/'wrangler.jsonc'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['main']='rss-reader-read-fast-entry.js'
          bindings={x.get('binding'):x for x in cfg.get('d1_databases',[])}
          opportunity=bindings.get('OPPORTUNITY_DB')
          if not opportunity or opportunity.get('database_name') != 'runner3-opportunity-radar':
              raise SystemExit('OPPORTUNITY_DB dedicated binding missing')
          cfg_path.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/rss-reader-read-fast-entry.js
          node --check cloudflare/runner3-core/src/delivery.js
          node --check cloudflare/runner3-core/opportunity-router-entry.js
          node --check cloudflare/runner3-core/mailbox-entry.js
          node --check cloudflare/runner3-core/mailbox-fast-entry.js
          node --check cloudflare/runner3-core/audio-entry.js
          node --check cloudflare/runner3-core/src/opportunity-regime.js
          node --check cloudflare/runner3-core/src/opportunity-regime-write-guard.js
          node --check cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v33-audio-core-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v36-home-screen-safe-area-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v82-patch.js
          node --check cloudflare/runner3-core/artifact-library-reader-v82-stable-shell-entry.js
          grep -q 'import app from "./artifact-library-reader-v82-stable-shell-entry.js";' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          node scripts/reader_v82_outer_composition_smoke.mjs
          node scripts/reader_v83_fastpath_v82_smoke.mjs
          node --check cloudflare/runner3-core/reader-audio-core/audio-controller.js
          node --check cloudflare/runner3-core/reader-audio-core/playback-queue.js
          node --check cloudflare/runner3-core/reader-audio-core/reader-audio-adapter.js
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          grep -q 'rss-reader-read-fast-v3-isolated-stream' cloudflare/runner3-core/rss-reader-read-fast-entry.js
          grep -q 'routeDelivery' cloudflare/runner3-core/rss-reader-read-fast-entry.js
          grep -q 'delivery-permalinks' cloudflare/runner3-core/src/delivery.js
          test -f cloudflare/runner3-core/migrations/0012_delivery_permalinks.sql
          grep -q 'import app from "./audio-entry.js";' cloudflare/runner3-core/mailbox-entry.js
          grep -q 'handleOpportunityRegime' cloudflare/runner3-core/opportunity-router-entry.js
          grep -q 'guardOpportunityRegimeWrite' cloudflare/runner3-core/opportunity-router-entry.js
          grep -q 'return env.OPPORTUNITY_DB || null' cloudflare/runner3-core/src/opportunity-regime.js
          grep -q '"binding": "OPPORTUNITY_DB"' cloudflare/runner3-core/wrangler.jsonc
          grep -q '"database_name": "runner3-opportunity-radar"' cloudflare/runner3-core/wrangler.jsonc
          grep -q 'import("./artifact-library-reader-v7-github-audio-entry.js")' cloudflare/runner3-core/audio-entry.js
          grep -q 'handleAudioMedia' cloudflare/runner3-core/audio-entry.js
          grep -q 'artifact-library-reader-v36-home-screen-safe-area-entry.js' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          grep -q 'data-r3-home-screen-safe-area-v36' cloudflare/runner3-core/artifact-library-reader-v36-home-screen-safe-area-entry.js
          grep -q 'data-r3-audio-continuity-v35' cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          grep -q 'singleAudioListenerOwner:true' cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          grep -q 'v34+v35:ahead-prefetch+range-follow+single-audio-owner' cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          grep -q 'data-r3-audio-continuity-v34' cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          grep -q 'window.__R3_READER_AUDIO_CORE_OWNER=true' cloudflare/runner3-core/artifact-library-reader-v33-audio-core-entry.js
          grep -q '__r3AudioLegacyV11Suppressed=true' cloudflare/runner3-core/artifact-library-reader-v33-audio-core-entry.js
          grep -q '__r3AudioLegacyV31ClockSuppressed=true' cloudflare/runner3-core/artifact-library-reader-v33-audio-core-entry.js
          grep -q 'VPS_MAILBOX_KEY_FINGERPRINT' cloudflare/runner3-core/mailbox-fast-entry.js
          node scripts/verify_runner3_d1_quota_guards.mjs
          node scripts/verify_interest_profile_promotion.mjs
          node scripts/verify_interest_ontology.mjs

      - name: Apply Core D1 migrations
        shell: bash
        working-directory: cloudflare/runner3-core
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply runner3-core --remote

      - name: Deploy latest Core with dedicated Opportunity Radar D1 router
        shell: bash
        working-directory: cloudflare/runner3-core
        run: |
          set -euo pipefail
          export NO_COLOR=1
          npx --yes wrangler@4 deploy

      - name: Verify live Reader, Home Screen safe area, Opportunity Radar D1, audio-media, and stable Core surfaces
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          owner_cookie="$(python3 - <<'PYCOOKIE'
          import hashlib,os
          token=os.environ['RUNNER3_CORE_TOKEN'].strip()
          print(hashlib.sha256(('runner3-artifact-library-v1:'+token).encode()).hexdigest())
          PYCOOKIE
          )"
          cookie="r3_artifact_library=$owner_cookie"
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -sS -H "Cookie: $cookie" -D /tmp/h -o /tmp/reader -w '%{http_code}' "$core/artifact-library/read?key=$encoded")"
            tr -d '\r' </tmp/h >/tmp/h.clean
            runtime="$(grep -i '^x-r3-reader-runtime:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            proof="$(grep -i '^x-r3-reader-patch-proof:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            home_safe="$(grep -i '^x-r3-reader-home-screen-safe-area:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            home_layout="$(grep -i '^x-r3-reader-home-screen-layout:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            startup_viewport="$(grep -i '^x-r3-reader-ios-startup-viewport:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            dock_audio="$(grep -i '^x-r3-reader-dock-audio:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            stable_shell="$(grep -i '^x-r3-reader-stable-shell:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            pagination_owner="$(grep -i '^x-r3-reader-pagination-owner:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            reader_fastpath="$(grep -i '^x-r3-reader-fastpath:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            echo "READER_CHECK attempt=$attempt http=$code runtime=$runtime proof=$proof home_safe=$home_safe home_layout=$home_layout startup=$startup_viewport dock_audio=$dock_audio stable_shell=$stable_shell pagination_owner=$pagination_owner reader_fastpath=$reader_fastpath"
            if [ "$code" = 200 ] && [ "$runtime" = 'v35-continuity-single-owner' ] && [ "$proof" = 'v34+v35:ahead-prefetch+range-follow+single-audio-owner' ] && [ "$home_safe" = 'v36' ] && [ "$home_layout" = 'stable-v79' ] && [ "$startup_viewport" = 'stable-opaque-v79' ] && [ "$dock_audio" = 'stable-v80' ] && [ "$stable_shell" = 'v82' ] && [ "$pagination_owner" = 'v82' ] && [ "$reader_fastpath" = 'v83-v82' ] && grep -q 'body.r3-audio-ui.r3-audio-expanded #viewer{bottom:calc(210px' /tmp/reader && grep -q 'reader-audio-v80-warm-current-foreground' /tmp/reader && grep -q 'data-r3-home-screen-safe-area-v36="1"' /tmp/reader && grep -q "owner:'home-screen-stable-v79'" /tmp/reader && grep -q 'data-r3-audio-continuity-v35="1"' /tmp/reader && grep -q 'data-r3-audio-continuity-v34="1"' /tmp/reader && grep -q 'data-r3-audio-core-owner-v33="1"' /tmp/reader && grep -q 'data-r3-audio-core-runtime-v33="1"' /tmp/reader && grep -q '__r3AudioLegacyV11Suppressed=true' /tmp/reader && grep -q '__r3AudioLegacyV31ClockSuppressed=true' /tmp/reader && grep -q 'data-r3-stable-shell-early-v82="1"' /tmp/reader && grep -q 'data-r3-stable-shell-runtime-v82="1"' /tmp/reader && grep -q 'html.r3-v82-restoring body::after' /tmp/reader && grep -q 'body.r3-audio-ui.r3-audio-expanded #viewer{bottom:calc(76px' /tmp/reader; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then cat /tmp/h.clean; head -c 1200 /tmp/reader; exit 1; fi

          # Ebook Library v72 live contract: deployed runtime, rich metadata on both
          # rebuild and fast-index paths, and a real enrich handler behind auth.
          vcode="$(curl -sS -D /tmp/client-version.h -o /tmp/client-version.json -w '%{http_code}' "$core/artifact-library/api/client-version")"
          tr -d '\r' </tmp/client-version.h >/tmp/client-version.h.clean
          vheader="$(grep -i '^x-r3-reader-client-version:' /tmp/client-version.h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
          echo "EBOOK_V72_VERSION http=$vcode header=$vheader body=$(cat /tmp/client-version.json)"
          test "$vcode" = 200
          test "$vheader" = v72
          grep -q '"reader_client_version":"v72"' /tmp/client-version.json

          # Owner boundary must be real. Retry briefly because Workers edge propagation can lag deploy completion.
          owner_ok=0
          for attempt in $(seq 1 20); do
            ulist="$(curl -sS -o /tmp/library-unauth.json -w '%{http_code}' "$core/artifact-library/api/list")"
            ureader="$(curl -sS -D /tmp/reader-unauth.h -o /tmp/reader-unauth.html -w '%{http_code}' "$core/artifact-library/read?key=$encoded")"
            tr -d '\r' </tmp/reader-unauth.h >/tmp/reader-unauth.h.clean
            uboundary="$(grep -i '^x-r3-session-bound-sync:' /tmp/reader-unauth.h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            echo "EBOOK_V75_OWNER_BOUNDARY attempt=$attempt list=$ulist reader=$ureader boundary=$uboundary"
            if [ "$ulist" = 401 ] && [ "$ureader" = 303 ] && [ "$uboundary" = 'v75-login-required' ] && grep -q 'UNAUTHORIZED' /tmp/library-unauth.json; then
              owner_ok=1
              break
            fi
            sleep 1
          done
          test "$owner_ok" = 1

          # Auth form routing must reach the real handler, never 303-loop/Worker-1101.
          # Empty form is mutation-free and must be handled as a validation error.
          scode="$(curl -sS -X POST -H 'content-type: application/x-www-form-urlencoded' --data '' -D /tmp/setup-pin-canary.h -o /tmp/setup-pin-canary.html -w '%{http_code}' "$core/artifact-library/setup-pin")"
          tr -d '\r' </tmp/setup-pin-canary.h >/tmp/setup-pin-canary.h.clean
          pform="$(grep -i '^x-r3-pin-form:' /tmp/setup-pin-canary.h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
          echo "EBOOK_V77_SETUP_PIN_ROUTE http=$scode form=$pform"
          test "$pform" = v77
          if [ "$scode" = 400 ]; then
            grep -q 'PIN must contain exactly 6 digits' /tmp/setup-pin-canary.html
          elif [ "$scode" = 409 ]; then
            grep -q 'A Library PIN already exists' /tmp/setup-pin-canary.html
          else
            echo "Unexpected setup-pin status: $scode"; head -c 600 /tmp/setup-pin-canary.html; exit 1
          fi

          rcode="$(curl -sS -H "Cookie: $cookie" -o /tmp/library-refresh.json -w '%{http_code}' "$core/artifact-library/api/list?refresh=1")"
          icode="$(curl -sS -H "Cookie: $cookie" -o /tmp/library-index.json -w '%{http_code}' "$core/artifact-library/api/list")"
          test "$rcode" = 200
          test "$icode" = 200
          python3 - <<'PY'
          import json
          refresh=json.load(open('/tmp/library-refresh.json',encoding='utf-8'))
          index=json.load(open('/tmp/library-index.json',encoding='utf-8'))
          assert refresh.get('ok') is True and index.get('ok') is True
          a=refresh.get('objects') or []; b=index.get('objects') or []
          assert len(a)==len(b) and len(a)>0, (len(a),len(b))
          def norm(rows):
              return {x['scope']:(x.get('key'),x.get('title'),x.get('creator'),x.get('cover_key')) for x in rows}
          assert norm(a)==norm(b), 'refresh/index metadata mismatch'
          assert all(str(x.get('title') or '').strip() for x in a), 'missing title'
          assert all(str(x.get('creator') or '').strip() for x in a), 'missing creator'
          print('EBOOK_V72_LIST=PASS books=%d covers=%d source=%s' % (len(a),sum(bool(x.get('cover_key')) for x in a),index.get('source')))
          PY

          ecode="$(curl -sS -X POST -H 'x-runner3-library: 1' -o /tmp/enrich-auth.json -w '%{http_code}' "$core/artifact-library/api/enrich-upload")"
          echo "EBOOK_V72_ENRICH_HANDLER http=$ecode body=$(head -c 160 /tmp/enrich-auth.json | tr '\n' ' ')"
          test "$ecode" = 401
          grep -q 'UNAUTHORIZED' /tmp/enrich-auth.json

          fcode="$(curl -sS -D /tmp/fast.h -o /tmp/fast.json -w '%{http_code}' "$core/reader/rss/categories")"
          tr -d '\r' </tmp/fast.h >/tmp/fast.h.clean
          fastpath="$(grep -i '^x-r3-rss-read-fastpath:' /tmp/fast.h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
          echo "RSS_FASTPATH http=$fcode version=$fastpath"
          test "$fcode" = 401
          test "$fastpath" = 'rss-reader-read-fast-v3-isolated-stream'
          ! grep -q 'error code: 1102' /tmp/fast.json

          lcode="$(curl -sS -o /tmp/rss-library.html -w '%{http_code}' "$core/rss/library")"
          echo "RSS_LIBRARY http=$lcode bytes=$(wc -c </tmp/rss-library.html)"
          test "$lcode" = 200
          ! grep -q 'error code: 1102' /tmp/rss-library.html

          pcode="$(curl -sS -X POST -o /tmp/permalink.json -w '%{http_code}' "$core/delivery-permalinks")"
          echo "DELIVERY_PERMALINK_AUTH http=$pcode body=$(head -c 180 /tmp/permalink.json | tr '\n' ' ')"
          test "$pcode" = 401
          grep -q 'UNAUTHORIZED' /tmp/permalink.json

          dcode="$(curl -sS -o /tmp/permanent.json -w '%{http_code}' "$core/delivery-permanent/invalid")"
          echo "DELIVERY_PERMANENT_INVALID http=$dcode body=$(head -c 180 /tmp/permanent.json | tr '\n' ' ')"
          test "$dcode" = 404
          grep -q 'PERMALINK_NOT_FOUND' /tmp/permanent.json

          ocode="$(curl -sS -o /tmp/opportunity.json -w '%{http_code}' "$core/opportunity-radar/regime/current/global")"
          echo "OPPORTUNITY_RADAR_D1 http=$ocode body=$(head -c 300 /tmp/opportunity.json | tr '\n' ' ')"
          test "$ocode" = 200
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/opportunity.json',encoding='utf-8'))
          assert data.get('ok') is True, data
          current=data.get('current')
          assert isinstance(current,dict), data
          assert current.get('regime_key') == 'global', data
          print('OPPORTUNITY_RADAR_D1=PASS version=%s' % current.get('version'))
          PY

          acode="$(curl -sS -o /tmp/audio.json -w '%{http_code}' "$core/artifact-library/audio")"
          echo "AUDIO_SURFACE http=$acode body=$(head -c 180 /tmp/audio.json | tr '\n' ' ')"
          test "$acode" = 400

          qcode="$(curl -sS -o /tmp/audio-media.json -w '%{http_code}' "$core/audio-media?prefix=audio-library%2Febook-reader-queue%2F&limit=1")"
          echo "AUDIO_MEDIA_FAST_PATH http=$qcode body=$(head -c 180 /tmp/audio-media.json | tr '\n' ' ')"
          test "$qcode" = 401
          grep -q 'UNAUTHORIZED' /tmp/audio-media.json

          mhcode="$(curl -sS -o /tmp/mailbox-health.json -w '%{http_code}' "$core/mailbox/health")"
          echo "MAILBOX_HEALTH http=$mhcode body=$(head -c 180 /tmp/mailbox-health.json | tr '\n' ' ')"
          test "$mhcode" = 200
          grep -q 'mailbox-fast-v1' /tmp/mailbox-health.json

          mcode="$(curl -sS -o /tmp/mailbox.csv -w '%{http_code}' "$core/mailbox/results/smoke-reader-v31.csv")"
          echo "MAILBOX_SURFACE http=$mcode body=$(head -c 180 /tmp/mailbox.csv | tr '\n' ' ')"
          test "$mcode" = 200
          grep -q 'pending' /tmp/mailbox.csv

          echo 'RUNNER3_CORE_PRODUCTION_OPPORTUNITY_D1=PASS'
