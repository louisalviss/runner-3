name: Runner3 Core Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-core-public-hosted-reader-deploy.yml'
      - 'cloudflare/runner3-core/**'
      - '!cloudflare/runner3-core/reader-audio-core/**'
      - 'ops/reader-core-deploy.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner3-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "MISSING:$name" >&2; exit 2; }
            echo "PRESENT:$name"
          done

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Reader Audio Core browser bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save esbuild
          node scripts/build_reader_audio_core_browser_bundle.mjs
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-bundle.generated.js

      - name: Compose latest Core with canonical Reader v35 and audio-media fast path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('cloudflare/runner3-core')

          wrapper=root/'artifact-library-reader-v7-github-audio-entry.js'
          text=wrapper.read_text(encoding='utf-8')
          text,count=re.subn(
            r'import app from "\./artifact-library-reader-v\d+[^\"]*-entry\.js";',
            'import app from "./artifact-library-reader-v35-continuity-single-owner-entry.js";',
            text,
            count=1,
          )
          if count != 1: raise SystemExit('reader wrapper import marker missing')
          wrapper.write_text(text,encoding='utf-8')

          mailbox=root/'mailbox-entry.js'
          text=mailbox.read_text(encoding='utf-8')
          canonical='import app from "./audio-entry.js";'
          direct='import app from "./artifact-library-reader-v7-github-audio-entry.js";'
          if canonical not in text and direct not in text: raise SystemExit('canonical mailbox import marker missing')
          if direct in text: text=text.replace(direct,canonical,1)
          mailbox.write_text(text,encoding='utf-8')

          audio_entry=root/'audio-entry.js'
          audio_text=audio_entry.read_text(encoding='utf-8')
          if 'import { handleAudioMedia } from "./src/audio-media.js";' not in audio_text:
              raise SystemExit('audio-media fast path import missing')
          if 'import("./artifact-library-reader-v7-github-audio-entry.js")' not in audio_text:
              raise SystemExit('lazy canonical reader import missing')

          cfg_path=root/'wrangler.jsonc'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['main']='mailbox-entry.js'
          cfg_path.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/mailbox-entry.js
          node --check cloudflare/runner3-core/audio-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v33-audio-core-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          node --check cloudflare/runner3-core/reader-audio-core/audio-controller.js
          node --check cloudflare/runner3-core/reader-audio-core/playback-queue.js
          node --check cloudflare/runner3-core/reader-audio-core/reader-audio-adapter.js
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          grep -q 'import app from "./audio-entry.js";' cloudflare/runner3-core/mailbox-entry.js
          grep -q 'import("./artifact-library-reader-v7-github-audio-entry.js")' cloudflare/runner3-core/audio-entry.js
          grep -q 'handleAudioMedia' cloudflare/runner3-core/audio-entry.js
          grep -q 'artifact-library-reader-v35-continuity-single-owner-entry.js' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          grep -q 'data-r3-audio-continuity-v35' cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          grep -q 'singleAudioListenerOwner:true' cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          grep -q 'v34+v35:ahead-prefetch+range-follow+single-audio-owner' cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          grep -q 'data-r3-audio-continuity-v34' cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          grep -q 'window.__R3_READER_AUDIO_CORE_OWNER=true' cloudflare/runner3-core/artifact-library-reader-v33-audio-core-entry.js
          grep -q '__r3AudioLegacyV11Suppressed=true' cloudflare/runner3-core/artifact-library-reader-v33-audio-core-entry.js
          grep -q '__r3AudioLegacyV31ClockSuppressed=true' cloudflare/runner3-core/artifact-library-reader-v33-audio-core-entry.js
          grep -q 'VPS_MAILBOX_KEY_FINGERPRINT' cloudflare/runner3-core/mailbox-entry.js

      - name: Apply Core D1 migrations
        shell: bash
        working-directory: cloudflare/runner3-core
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply runner3-core --remote

      - name: Deploy latest Core with Reader v35 single-owner continuity runtime
        shell: bash
        working-directory: cloudflare/runner3-core
        run: |
          set -euo pipefail
          export NO_COLOR=1
          npx --yes wrangler@4 deploy

      - name: Verify live Reader v35, fast audio-media, and stable Core surfaces
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -sS -D /tmp/h -o /tmp/reader -w '%{http_code}' "$core/artifact-library/read?key=$encoded")"
            tr -d '\r' </tmp/h >/tmp/h.clean
            runtime="$(grep -i '^x-r3-reader-runtime:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            proof="$(grep -i '^x-r3-reader-patch-proof:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            echo "READER_CHECK attempt=$attempt http=$code runtime=$runtime proof=$proof"
            if [ "$code" = 200 ] && [ "$runtime" = 'v35-continuity-single-owner' ] && [ "$proof" = 'v34+v35:ahead-prefetch+range-follow+single-audio-owner' ] && grep -q 'data-r3-audio-continuity-v35="1"' /tmp/reader && grep -q 'data-r3-audio-continuity-v34="1"' /tmp/reader && grep -q 'data-r3-audio-core-owner-v33="1"' /tmp/reader && grep -q 'data-r3-audio-core-runtime-v33="1"' /tmp/reader && grep -q '__r3AudioLegacyV11Suppressed=true' /tmp/reader && grep -q '__r3AudioLegacyV31ClockSuppressed=true' /tmp/reader; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then cat /tmp/h.clean; head -c 1200 /tmp/reader; exit 1; fi

          acode="$(curl -sS -o /tmp/audio.json -w '%{http_code}' "$core/artifact-library/audio")"
          echo "AUDIO_SURFACE http=$acode body=$(head -c 180 /tmp/audio.json | tr '\n' ' ')"
          test "$acode" = 400

          qcode="$(curl -sS -o /tmp/audio-media.json -w '%{http_code}' "$core/audio-media?prefix=audio-library%2Febook-reader-queue%2F&limit=1")"
          echo "AUDIO_MEDIA_FAST_PATH http=$qcode body=$(head -c 180 /tmp/audio-media.json | tr '\n' ' ')"
          test "$qcode" = 401
          grep -q 'UNAUTHORIZED' /tmp/audio-media.json

          mcode="$(curl -sS -o /tmp/mailbox.csv -w '%{http_code}' "$core/mailbox/results/smoke-reader-v31.csv")"
          echo "MAILBOX_SURFACE http=$mcode body=$(head -c 180 /tmp/mailbox.csv | tr '\n' ' ')"
          test "$mcode" = 200
          grep -q 'pending' /tmp/mailbox.csv

          echo 'RUNNER3_CORE_PRODUCTION_V35_AUDIO_FAST_PATH=PASS'

  sync_ebook_audio_token:
    needs: deploy
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[sync-ebook-audio-token]')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CORE_URL: https://runner3-core.ducduy2411.workers.dev
    steps:
      - name: Checkout canonical Core source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Rotate one shared Core token and sync VPS atomically
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          token="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )"
          test -n "$token"
          echo "::add-mask::$token"
          printf '%s' "$token" | npx --yes wrangler@4 secret put RUNNER3_CORE_TOKEN --config cloudflare/runner3-core/wrangler.jsonc
          sudo -n env R3_TOKEN="$token" CORE_URL="$CORE_URL" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('/etc/chatgpt-vps-bridge.env')
          lines=p.read_text(encoding='utf-8').splitlines() if p.exists() else []
          updates={'RUNNER3_CORE_TOKEN':os.environ['R3_TOKEN'],'RUNNER3_CORE_URL':os.environ['CORE_URL']}
          out=[]; seen=set()
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  key=line.split('=',1)[0].strip()
                  if key in updates:
                      out.append(f'{key}={updates[key]}'); seen.add(key); continue
              out.append(line)
          for key,value in updates.items():
              if key not in seen: out.append(f'{key}={value}')
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          p.chmod(0o600)
          PY
          sudo -n systemctl restart ebook-reader-audio-consumer.service
          sync
          ok=0
          for attempt in $(seq 1 30); do
            code="$(curl -sS -I -o /tmp/ebook-auth-head -w '%{http_code}' -H "Authorization: Bearer $token" "$CORE_URL/api/internal/ebook-reader-audio/job" || true)"
            echo "INTERNAL_AUTH_HEAD attempt=$attempt http=$code"
            if [ "$code" = 405 ]; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          sleep 3
          test "$(systemctl is-active ebook-reader-audio-consumer.service)" = active
          if sudo journalctl -u ebook-reader-audio-consumer.service --since '-10 sec' --no-pager -o cat | grep -q 'UNAUTHORIZED'; then
            echo 'CONSUMER_INTERNAL_AUTH_STILL_UNAUTHORIZED' >&2
            exit 1
          fi
          echo 'EBOOK_AUDIO_TOKEN_SYNC=PASS'

  ebook_audio_live_smoke:
    needs: sync_ebook_audio_token
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      job_id: ${{ steps.smoke.outputs.job_id }}
      pending_to_ready_seconds: ${{ steps.smoke.outputs.pending_to_ready_seconds }}
    steps:
      - name: Create unique production audio job and wait for ready
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.parse,urllib.request,uuid,os
          base='https://runner3-core.ducduy2411.workers.dev'
          stamp=uuid.uuid4().hex[:12]
          book_key='core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub'
          text=('Đây là kiểm tra production cho consumer âm thanh Ebook Reader trên VPS. '
                'Yêu cầu mới phải được lấy khỏi hàng đợi gần như ngay lập tức, tổng hợp bằng giọng Nam Minh, '
                'tạo timing theo từ và chuyển sang trạng thái sẵn sàng. Mã '+stamp+'.')
          payload={'bookKey':book_key,'text':text,'chapterTitle':'VPS owned smoke '+stamp,'chapterHref':'Text/vps-owned-smoke-'+stamp+'.xhtml','bookTitle':'VPS owned smoke','clientVersion':'vps-owned-smoke-v1'}
          req=urllib.request.Request(base+'/artifact-library/audio',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'Mozilla/5.0','Origin':base,'Referer':base+'/'},method='POST')
          start=time.monotonic()
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  http=response.status; state=json.load(response)
          except urllib.error.HTTPError as exc:
              body=exc.read().decode('utf-8','replace')[:1000]
              raise SystemExit(f'CREATE_HTTP_{exc.code}:{body}')
          job_id=state.get('id')
          if http not in (200,202) or not job_id: raise SystemExit('CREATE_INVALID:'+json.dumps(state,ensure_ascii=False))
          while time.monotonic()-start < 120:
              if state.get('status')=='ready': break
              if state.get('status')=='error': raise SystemExit('AUDIO_ERROR:'+json.dumps(state,ensure_ascii=False))
              time.sleep(.75)
              q=urllib.parse.urlencode({'id':job_id,'bookKey':book_key})
              with urllib.request.urlopen(base+'/artifact-library/audio?'+q,timeout=30) as response: state=json.load(response)
          elapsed=round(time.monotonic()-start,3)
          if state.get('status')!='ready': raise SystemExit('AUDIO_READY_TIMEOUT:'+json.dumps({'id':job_id,'last':state},ensure_ascii=False))
          out=os.environ['GITHUB_OUTPUT']
          with open(out,'a',encoding='utf-8') as f:
              f.write('job_id='+job_id+'\n')
              f.write('pending_to_ready_seconds='+str(elapsed)+'\n')
          print(json.dumps({'ok':True,'jobId':job_id,'pendingToReadySeconds':elapsed,'durationSeconds':state.get('durationSeconds'),'timingAvailable':state.get('timingAvailable')},ensure_ascii=False))
          print('EBOOK_AUDIO_LIVE_PENDING_TO_READY=PASS')
          PY

  verify_ebook_audio_vps_owner:
    needs: ebook_audio_live_smoke
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Prove exact smoke job was rendered by persistent VPS consumer
        shell: bash
        env:
          JOB_ID: ${{ needs.ebook_audio_live_smoke.outputs.job_id }}
          READY_SECONDS: ${{ needs.ebook_audio_live_smoke.outputs.pending_to_ready_seconds }}
        run: |
          set -euo pipefail
          test -n "$JOB_ID"
          test "$(systemctl is-active ebook-reader-audio-consumer.service)" = active
          test "$(systemctl is-enabled ebook-reader-audio-consumer.service)" = enabled
          test "$(systemctl is-active ebook-reader-audio-tts.service 2>/dev/null || true)" != active
          ok=0
          for attempt in $(seq 1 30); do
            if sudo journalctl -u ebook-reader-audio-consumer.service --since '-5 min' --no-pager -o cat | grep -F '"jobId": "'"$JOB_ID"'"' | grep -q '"event": "job-ready"'; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1
          echo "EBOOK_AUDIO_VPS_OWNED_JOB_READY=$JOB_ID"
          echo "EBOOK_AUDIO_PENDING_TO_READY_SECONDS=$READY_SECONDS"
          echo 'EBOOK_AUDIO_VPS_RUNTIME_CUTOVER=PASS'
