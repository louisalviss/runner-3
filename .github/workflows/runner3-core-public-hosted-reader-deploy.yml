name: Runner3 Core Public Hosted Reader Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-core-public-hosted-reader-deploy.yml'
      - 'ops/reader-core-deploy.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner3-core-public-hosted-reader-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PINNED_SOURCE: 01d254a9d908d7fa584f0e974a989e330dee86c3
    steps:
      - name: Validate Cloudflare deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "MISSING:$name" >&2; exit 2; }
            echo "PRESENT:$name"
          done
      - name: Checkout exact Reader v22 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PINNED_SOURCE }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose canonical mailbox with Reader v22 fall-through
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('cloudflare/runner3-core')
          mailbox=root/'mailbox-entry.js'
          text=mailbox.read_text(encoding='utf-8')
          old='import app from "./audio-entry.js";'
          new='import app from "./artifact-library-reader-v7-github-audio-entry.js";'
          if old not in text: raise SystemExit('canonical mailbox import marker missing')
          mailbox.write_text(text.replace(old,new,1),encoding='utf-8')
          cfg_path=root/'wrangler.jsonc'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['main']='mailbox-entry.js'
          cfg_path.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/mailbox-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v22-word-index-follow-entry.js
          grep -q 'artifact-library-reader-v22-word-index-follow-entry.js' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          grep -q 'window.__r3AudioWordIndexFollowV22=true' cloudflare/runner3-core/artifact-library-reader-v22-word-index-follow-entry.js
          grep -q 'VPS_MAILBOX_KEY_FINGERPRINT' cloudflare/runner3-core/mailbox-entry.js
      - name: Deploy pinned Reader v22 Core
        shell: bash
        working-directory: cloudflare/runner3-core
        run: |
          set -euo pipefail
          export NO_COLOR=1
          npx --yes wrangler@4 deploy
      - name: Verify live Reader v22 and preserved mailbox surface
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          code="$(curl -sS -D /tmp/h -o /tmp/reader -w '%{http_code}' "$core/artifact-library/read?key=$encoded")"
          tr -d '\r' </tmp/h >/tmp/h.clean
          if [ "$code" != 200 ]; then cat /tmp/h.clean; head -c 700 /tmp/reader; exit 1; fi
          grep -qi '^x-r3-reader-runtime: v22-word-index-page-follow$' /tmp/h.clean
          grep -qi '^x-r3-reader-patch-proof: v21+v22:visible-word-direction+page-step$' /tmp/h.clean
          grep -q 'window.__r3AudioWordIndexFollowV22=true' /tmp/reader
          acode="$(curl -sS -o /tmp/audio.json -w '%{http_code}' "$core/artifact-library/audio")"
          test "$acode" = 400
          mcode="$(curl -sS -o /tmp/mailbox.csv -w '%{http_code}' "$core/mailbox/results/smoke-reader-v22.csv")"
          test "$mcode" = 200
          grep -q 'pending' /tmp/mailbox.csv
          echo 'PUBLIC_HOSTED_READER_V22_DEPLOY=PASS'
