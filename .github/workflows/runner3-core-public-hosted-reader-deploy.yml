name: Runner3 Core Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-core-public-hosted-reader-deploy.yml'
      - 'cloudflare/runner3-core/**'
      - '!cloudflare/runner3-core/reader-audio-core/**'
      - 'ops/reader-core-deploy.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner3-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "MISSING:$name" >&2; exit 2; }
            echo "PRESENT:$name"
          done

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Reader Audio Core browser bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save esbuild
          node scripts/build_reader_audio_core_browser_bundle.mjs
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-bundle.generated.js

      - name: Compose latest Core with Reader v36 Home Screen safe area, mailbox, and Opportunity Radar router
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('cloudflare/runner3-core')

          wrapper=root/'artifact-library-reader-v7-github-audio-entry.js'
          text=wrapper.read_text(encoding='utf-8')
          text,count=re.subn(
            r'import app from "\./artifact-library-reader-v\d+[^\"]*-entry\.js";',
            'import app from "./artifact-library-reader-v36-home-screen-safe-area-entry.js";',
            text,
            count=1,
          )
          if count != 1: raise SystemExit('reader wrapper import marker missing')
          wrapper.write_text(text,encoding='utf-8')

          mailbox=root/'mailbox-entry.js'
          text=mailbox.read_text(encoding='utf-8')
          canonical='import app from "./audio-entry.js";'
          direct='import app from "./artifact-library-reader-v7-github-audio-entry.js";'
          if canonical not in text and direct not in text: raise SystemExit('canonical mailbox import marker missing')
          if direct in text: text=text.replace(direct,canonical,1)
          mailbox.write_text(text,encoding='utf-8')

          audio_entry=root/'audio-entry.js'
          audio_text=audio_entry.read_text(encoding='utf-8')
          if 'import { handleAudioMedia } from "./src/audio-media.js";' not in audio_text:
              raise SystemExit('audio-media fast path import missing')
          if 'import("./artifact-library-reader-v7-github-audio-entry.js")' not in audio_text:
              raise SystemExit('lazy canonical reader import missing')

          opportunity_entry=root/'opportunity-router-entry.js'
          opportunity_text=opportunity_entry.read_text(encoding='utf-8')
          if 'handleOpportunityRegime' not in opportunity_text or 'guardOpportunityRegimeWrite' not in opportunity_text:
              raise SystemExit('opportunity router missing')

          cfg_path=root/'wrangler.jsonc'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['main']='opportunity-router-entry.js'
          bindings={x.get('binding'):x for x in cfg.get('d1_databases',[])}
          opportunity=bindings.get('OPPORTUNITY_DB')
          if not opportunity or opportunity.get('database_name') != 'runner3-opportunity-radar':
              raise SystemExit('OPPORTUNITY_DB dedicated binding missing')
          cfg_path.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/opportunity-router-entry.js
          node --check cloudflare/runner3-core/mailbox-entry.js
          node --check cloudflare/runner3-core/mailbox-fast-entry.js
          node --check cloudflare/runner3-core/audio-entry.js
          node --check cloudflare/runner3-core/src/opportunity-regime.js
          node --check cloudflare/runner3-core/src/opportunity-regime-write-guard.js
          node --check cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v33-audio-core-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v36-home-screen-safe-area-entry.js
          node --check cloudflare/runner3-core/reader-audio-core/audio-controller.js
          node --check cloudflare/runner3-core/reader-audio-core/playback-queue.js
          node --check cloudflare/runner3-core/reader-audio-core/reader-audio-adapter.js
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          grep -q 'import app from "./audio-entry.js";' cloudflare/runner3-core/mailbox-entry.js
          grep -q 'handleOpportunityRegime' cloudflare/runner3-core/opportunity-router-entry.js
          grep -q 'guardOpportunityRegimeWrite' cloudflare/runner3-core/opportunity-router-entry.js
          grep -q 'return env.OPPORTUNITY_DB || null' cloudflare/runner3-core/src/opportunity-regime.js
          grep -q '"binding": "OPPORTUNITY_DB"' cloudflare/runner3-core/wrangler.jsonc
          grep -q '"database_name": "runner3-opportunity-radar"' cloudflare/runner3-core/wrangler.jsonc
          grep -q 'import("./artifact-library-reader-v7-github-audio-entry.js")' cloudflare/runner3-core/audio-entry.js
          grep -q 'handleAudioMedia' cloudflare/runner3-core/audio-entry.js
          grep -q 'artifact-library-reader-v36-home-screen-safe-area-entry.js' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          grep -q 'data-r3-home-screen-safe-area-v36' cloudflare/runner3-core/artifact-library-reader-v36-home-screen-safe-area-entry.js
          grep -q 'data-r3-audio-continuity-v35' cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          grep -q 'singleAudioListenerOwner:true' cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          grep -q 'v34+v35:ahead-prefetch+range-follow+single-audio-owner' cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          grep -q 'data-r3-audio-continuity-v34' cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          grep -q 'window.__R3_READER_AUDIO_CORE_OWNER=true' cloudflare/runner3-core/artifact-library-reader-v33-audio-core-entry.js
          grep -q '__r3AudioLegacyV11Suppressed=true' cloudflare/runner3-core/artifact-library-reader-v33-audio-core-entry.js
          grep -q '__r3AudioLegacyV31ClockSuppressed=true' cloudflare/runner3-core/artifact-library-reader-v33-audio-core-entry.js
          grep -q 'VPS_MAILBOX_KEY_FINGERPRINT' cloudflare/runner3-core/mailbox-fast-entry.js

      - name: Apply Core D1 migrations
        shell: bash
        working-directory: cloudflare/runner3-core
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply runner3-core --remote

      - name: Deploy latest Core with dedicated Opportunity Radar D1 router
        shell: bash
        working-directory: cloudflare/runner3-core
        run: |
          set -euo pipefail
          export NO_COLOR=1
          npx --yes wrangler@4 deploy

      - name: Verify live Reader, Home Screen safe area, Opportunity Radar D1, audio-media, and stable Core surfaces
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -sS -D /tmp/h -o /tmp/reader -w '%{http_code}' "$core/artifact-library/read?key=$encoded")"
            tr -d '\r' </tmp/h >/tmp/h.clean
            runtime="$(grep -i '^x-r3-reader-runtime:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            proof="$(grep -i '^x-r3-reader-patch-proof:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            home_safe="$(grep -i '^x-r3-reader-home-screen-safe-area:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            echo "READER_CHECK attempt=$attempt http=$code runtime=$runtime proof=$proof home_safe=$home_safe"
            if [ "$code" = 200 ] && [ "$runtime" = 'v35-continuity-single-owner' ] && [ "$proof" = 'v34+v35:ahead-prefetch+range-follow+single-audio-owner' ] && [ "$home_safe" = 'v36' ] && grep -q 'data-r3-home-screen-safe-area-v36="1"' /tmp/reader && grep -q 'data-r3-audio-continuity-v35="1"' /tmp/reader && grep -q 'data-r3-audio-continuity-v34="1"' /tmp/reader && grep -q 'data-r3-audio-core-owner-v33="1"' /tmp/reader && grep -q 'data-r3-audio-core-runtime-v33="1"' /tmp/reader && grep -q '__r3AudioLegacyV11Suppressed=true' /tmp/reader && grep -q '__r3AudioLegacyV31ClockSuppressed=true' /tmp/reader; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then cat /tmp/h.clean; head -c 1200 /tmp/reader; exit 1; fi

          ocode="$(curl -sS -o /tmp/opportunity.json -w '%{http_code}' "$core/opportunity-radar/regime/current/global")"
          echo "OPPORTUNITY_RADAR_D1 http=$ocode body=$(head -c 300 /tmp/opportunity.json | tr '\n' ' ')"
          test "$ocode" = 200
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/opportunity.json',encoding='utf-8'))
          assert data.get('ok') is True, data
          current=data.get('current')
          assert isinstance(current,dict), data
          assert current.get('regime_key') == 'global', data
          print('OPPORTUNITY_RADAR_D1=PASS version=%s' % current.get('version'))
          PY

          acode="$(curl -sS -o /tmp/audio.json -w '%{http_code}' "$core/artifact-library/audio")"
          echo "AUDIO_SURFACE http=$acode body=$(head -c 180 /tmp/audio.json | tr '\n' ' ')"
          test "$acode" = 400

          qcode="$(curl -sS -o /tmp/audio-media.json -w '%{http_code}' "$core/audio-media?prefix=audio-library%2Febook-reader-queue%2F&limit=1")"
          echo "AUDIO_MEDIA_FAST_PATH http=$qcode body=$(head -c 180 /tmp/audio-media.json | tr '\n' ' ')"
          test "$qcode" = 401
          grep -q 'UNAUTHORIZED' /tmp/audio-media.json

          mhcode="$(curl -sS -o /tmp/mailbox-health.json -w '%{http_code}' "$core/mailbox/health")"
          echo "MAILBOX_HEALTH http=$mhcode body=$(head -c 180 /tmp/mailbox-health.json | tr '\n' ' ')"
          test "$mhcode" = 200
          grep -q 'mailbox-fast-v1' /tmp/mailbox-health.json

          mcode="$(curl -sS -o /tmp/mailbox.csv -w '%{http_code}' "$core/mailbox/results/smoke-reader-v31.csv")"
          echo "MAILBOX_SURFACE http=$mcode body=$(head -c 180 /tmp/mailbox.csv | tr '\n' ' ')"
          test "$mcode" = 200
          grep -q 'pending' /tmp/mailbox.csv

          echo 'RUNNER3_CORE_PRODUCTION_OPPORTUNITY_D1=PASS'
