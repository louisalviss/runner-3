name: Runner3 Core Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-core-public-hosted-reader-deploy.yml'
      - 'cloudflare/runner3-core/**'
      - 'ops/reader-core-deploy.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner3-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "MISSING:$name" >&2; exit 2; }
            echo "PRESENT:$name"
          done

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compose latest Core with canonical Reader v31 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('cloudflare/runner3-core')

          wrapper=root/'artifact-library-reader-v7-github-audio-entry.js'
          text=wrapper.read_text(encoding='utf-8')
          text,count=re.subn(
            r'import app from "\./artifact-library-reader-v\d+[^\"]*-entry\.js";',
            'import app from "./artifact-library-reader-v31-high-speed-serialized-follow-entry.js";',
            text,
            count=1,
          )
          if count != 1: raise SystemExit('reader wrapper import marker missing')
          wrapper.write_text(text,encoding='utf-8')

          mailbox=root/'mailbox-entry.js'
          text=mailbox.read_text(encoding='utf-8')
          old='import app from "./audio-entry.js";'
          new='import app from "./artifact-library-reader-v7-github-audio-entry.js";'
          if old not in text and new not in text: raise SystemExit('canonical mailbox import marker missing')
          if old in text: text=text.replace(old,new,1)
          mailbox.write_text(text,encoding='utf-8')

          cfg_path=root/'wrangler.jsonc'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['main']='mailbox-entry.js'
          cfg_path.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/mailbox-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v31-high-speed-serialized-follow-entry.js
          grep -q 'artifact-library-reader-v31-high-speed-serialized-follow-entry.js' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          grep -q 'window.__r3AudioHighSpeedFollowV31=true' cloudflare/runner3-core/artifact-library-reader-v31-high-speed-serialized-follow-entry.js
          grep -q 'VPS_MAILBOX_KEY_FINGERPRINT' cloudflare/runner3-core/mailbox-entry.js

      - name: Apply Core D1 migrations
        shell: bash
        working-directory: cloudflare/runner3-core
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply runner3-core --remote

      - name: Deploy latest Core with Reader v31 baseline
        shell: bash
        working-directory: cloudflare/runner3-core
        run: |
          set -euo pipefail
          export NO_COLOR=1
          npx --yes wrangler@4 deploy

      - name: Verify live Reader v31 and preserved Core surfaces
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -sS -D /tmp/h -o /tmp/reader -w '%{http_code}' "$core/artifact-library/read?key=$encoded")"
            tr -d '\r' </tmp/h >/tmp/h.clean
            if [ "$code" = 200 ] && grep -qi '^x-r3-reader-runtime: v31-high-speed-serialized-follow$' /tmp/h.clean && grep -qi '^x-r3-reader-patch-proof: v30+v31:75ms-high-speed-clock+single-flight-follow$' /tmp/h.clean && grep -q 'window.__r3AudioHighSpeedFollowV31=true' /tmp/reader; then
              ok=1
              break
            fi
            echo "WAIT_V31 attempt=$attempt http=$code runtime=$(grep -i '^x-r3-reader-runtime:' /tmp/h.clean || true) error=$(grep -i '^x-r3-reader-patch-error:' /tmp/h.clean || true)"
            sleep 1
          done
          if [ "$ok" != 1 ]; then cat /tmp/h.clean; head -c 700 /tmp/reader; exit 1; fi
          hcode="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$core/health")"
          test "$hcode" = 200
          acode="$(curl -sS -o /tmp/audio.json -w '%{http_code}' "$core/artifact-library/audio")"
          test "$acode" = 400
          mcode="$(curl -sS -o /tmp/mailbox.csv -w '%{http_code}' "$core/mailbox/results/smoke-reader-v31.csv")"
          test "$mcode" = 200
          grep -q 'pending' /tmp/mailbox.csv
          echo 'RUNNER3_CORE_PRODUCTION_V31=PASS'
