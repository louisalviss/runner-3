name: Felipe Breakout Public Pilot

on:
  push:
    branches: [main]
    paths:
      - 'ops/felipe-breakout-public.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: felipe-breakout-public-pilot
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run public S&P 500 pilot
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q 'pandas>=2.2,<3' 'numpy>=1.26,<3'
          python3 scripts/felipe_breakout_public_pilot.py
          echo '---RESULT-BEGIN---'
          cat results/felipe-breakout-public-pilot.json
          echo '---RESULT-END---'
          echo '---ROBUSTNESS-BEGIN---'
          python3 scripts/felipe_breakout_public_robustness.py
          echo '---ROBUSTNESS-END---'
