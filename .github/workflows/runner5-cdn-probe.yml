name: Runner5 CDN Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner5-cdn-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      URL: https://runner5-restore-lab-1.wasmer.app/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Probe public HTML reuse
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,time,http.client,ssl,urllib.parse,json,statistics
          url=urllib.parse.urlparse(os.environ['URL']); runs=[]
          for i in range(10):
              t=time.perf_counter(); conn=http.client.HTTPSConnection(url.hostname,443,timeout=40,context=ssl.create_default_context())
              try:
                  conn.request('GET',url.path or '/',headers={'User-Agent':'Mozilla/5.0 Chrome/151','Accept':'text/html'})
                  r=conn.getresponse(); ttfb=(time.perf_counter()-t)*1000; body=r.read(); h={k.lower():v for k,v in r.getheaders()}
                  runs.append({'status':r.status,'ttfbMs':round(ttfb,1),'bytes':len(body),'cacheControl':h.get('cache-control'),'contentLength':h.get('content-length'),'age':h.get('age'),'stamp':h.get('x-runner5-origin-stamp'),'requestId':h.get('x-wasmer-request-id'),'edgeRegion':h.get('x-edge-region')})
              except Exception as e: runs.append({'error':str(e)[:200]})
              finally: conn.close()
              time.sleep(1)
          good=[x for x in runs if x.get('status')==200]; stamps=[x.get('stamp') for x in good if x.get('stamp')]; repeated=len(stamps)!=len(set(stamps)); times=[x['ttfbMs'] for x in good if isinstance(x.get('ttfbMs'),(int,float))]
          out={'status':'READY' if len(good)>=7 else 'FAILED','url':os.environ['URL'],'runs':runs,'repeatedOriginStamp':repeated,'medianTtfbMs':round(statistics.median(times),1) if times else None,'minTtfbMs':min(times) if times else None,'maxTtfbMs':max(times) if times else None,'ageSeen':any(x.get('age') for x in good),'cacheEligible':all(bool(x.get('cacheControl')) and bool(x.get('contentLength')) for x in good),'updatedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          open('/tmp/runner5-cdn-probe.json','w').write(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2))
          PY
      - name: Persist probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/runner5-cdn-probe.json /tmp/probe-safe.json
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3;do
            git fetch origin main;git reset --hard origin/main;mkdir -p ops/wasmer-edge-speed;cp /tmp/probe-safe.json ops/wasmer-edge-speed/runner5-direct-probe.json;git add ops/wasmer-edge-speed/runner5-direct-probe.json
            if git diff --cached --quiet;then exit 0;fi
            git commit -m "Persist Runner5 direct CDN probe: ${GITHUB_RUN_ID}"
            if git push origin HEAD:main;then exit 0;fi
            sleep 2
          done
          exit 2
