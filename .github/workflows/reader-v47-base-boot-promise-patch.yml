name: Reader v47 Base Boot Promise Patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_reader_v47_base_boot_done.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply v47 base boot patch
        run: |
          set -euo pipefail
          python3 scripts/patch_reader_v47_base_boot_done.py
          node --check cloudflare/runner3-core/artifact-library-reader-v2-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v5-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v27-boot-cfi-restore-entry.js
          node cloudflare/runner3-core/reader-audio-core/reader-v47-base-boot-smoke.mjs
      - name: Commit v47 source
        run: |
          set -euo pipefail
          rm -f .github/workflows/reader-v47-base-boot-promise-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/runner3-core scripts/patch_reader_v47_base_boot_done.py .github/workflows/reader-v47-base-boot-promise-patch.yml
          if git diff --cached --quiet; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git commit -m 'fix(reader): wait for base display promise v47'
          git push origin HEAD:main
