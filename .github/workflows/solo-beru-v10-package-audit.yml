name: Solo Beru V10 Package Audit
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/solo-beru-v10-package-audit.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sheets
        run: ls -lh audit/solo-beru-v10/sheet_*.jpg
      - name: Upload sheets
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: solo-beru-v10-audit-existing
          path: audit/solo-beru-v10/sheet_*.jpg
          retention-days: 3
      - name: Commit manifest
        run: |
          printf 'run_id=%s\nartifact_id=%s\n' '${{ github.run_id }}' '${{ steps.upload.outputs.artifact-id }}' > audit/solo-beru-v10/package_manifest.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add audit/solo-beru-v10/package_manifest.txt
          git commit -m 'Add Solo Beru V10 package manifest' || exit 0
          git pull --rebase origin main || true
          git push
