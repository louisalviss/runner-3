name: WR Frozen Candidate3 Robustness
on:
  pull_request:
    branches: [main]
    paths:
      - 'wave-rider-verify/wr_candidate3_robustness.py'
      - '.github/workflows/wr-candidate3-robustness.yml'
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wr2024-frozen-rolling-oos-final
          path: /tmp/a24
          github-token: ${{ github.token }}
          repository: louisalviss/runner-3
          run-id: 32253319968
      - uses: actions/download-artifact@v4
        with:
          name: wr2515-phase2-zonec10-final
          path: /tmp/a25
          github-token: ${{ github.token }}
          repository: louisalviss/runner-3
          run-id: 32233507091
      - name: Run frozen candidate3 robustness
        run: python3 wave-rider-verify/wr_candidate3_robustness.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr-frozen-candidate3-robustness-final
          path: /tmp/final8
          retention-days: 14
