name: Cloudflare R2 Encrypted Courier Canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_ACCOUNT: '7415a87f6bce7884e73ad7cfed5782df'
      BUCKET: 'runner3-wp-media'
    steps:
      - uses: actions/checkout@v4
      - name: Install encryption library
        run: python3 -m pip install --quiet cryptography
      - name: Fetch bounded source canary, encrypt for VPS ephemeral key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,base64,hashlib,datetime,pathlib,urllib.request,urllib.error,urllib.parse,secrets
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          account=os.environ.get('CF_ACCOUNT','')
          token=os.environ.get('CF_TOKEN','')
          if not token or account!=os.environ['EXPECTED_ACCOUNT']:raise SystemExit('BAD_SOURCE_ACCOUNT_OR_TOKEN')
          bucket=os.environ['BUCKET']
          base='https://api.cloudflare.com/client/v4/accounts/'+account+'/r2/buckets/'+bucket+'/objects'
          def req(url):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'*/*'})
              with urllib.request.urlopen(request,timeout=35) as r:return r.status,dict(r.headers),r.read()
          status,_,body=req(base+'?per_page=1000')
          j=json.loads(body)
          if status!=200 or not j.get('success'):raise SystemExit('SOURCE_LIST_ERROR')
          arr=j.get('result') or []
          if isinstance(arr,dict):arr=arr.get('objects') or []
          eligible=[x for x in arr if isinstance(x,dict) and x.get('key') and 0<int(x.get('size') or 0)<=512_000]
          if not eligible:raise SystemExit('NO_CANARY_UNDER_512KB_IN_FIRST_1000')
          chosen=min(eligible,key=lambda x:int(x.get('size') or 0))
          key=chosen['key']
          status,headers,data=req(base+'/'+urllib.parse.quote(key,safe='/'))
          if status!=200 or len(data)!=int(chosen['size']):raise SystemExit('SOURCE_SIZE_MISMATCH')
          blob={
              'bucket':bucket,'key':key,'size':len(data),'source_sha256':hashlib.sha256(data).hexdigest(),
              'content_type':(chosen.get('http_metadata') or {}).get('contentType') or headers.get('Content-Type') or 'application/octet-stream',
              'blob_b64':base64.b64encode(data).decode('ascii'),
              'observed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          pub=serialization.load_pem_public_key(pathlib.Path('ops/cloudflare-account-rehome/courier-public-20261008.pem').read_bytes())
          aes=secrets.token_bytes(32); nonce=secrets.token_bytes(12)
          aad=b'cf-r2-rehome-canary-v1'
          enc=AESGCM(aes).encrypt(nonce,json.dumps(blob,separators=(',',':')).encode(),aad)
          wrapped=pub.encrypt(aes,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          envelope={
              'version':1,'scheme':'RSA-OAEP-SHA256+A256GCM','aad':base64.b64encode(aad).decode(),
              'nonce':base64.b64encode(nonce).decode(),'wrapped_key':base64.b64encode(wrapped).decode(),
              'ciphertext':base64.b64encode(enc).decode(),
          }
          p=pathlib.Path('courier-out');p.mkdir(exist_ok=True)
          (p/'envelope.json').write_text(json.dumps(envelope,separators=(',',':'))+'\n')
          print('ENCRYPTED_CANARY_PASS bytes='+str(len(data))+' encrypted_only=true')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cf-r2-encrypted-canary
          path: courier-out/envelope.json
          if-no-files-found: error
          retention-days: 1
