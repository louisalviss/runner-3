name: Cloudflare R2 Encrypted Courier

on:
  workflow_dispatch:
    inputs:
      bucket:
        type: choice
        description: Source R2 bucket
        required: true
        default: runner3-wp-media
        options:
          - runner3-wp-media
          - runner3-artifacts
          - runner3-rss-fastlane-artifacts
          - ai-vps-common-access
          - clm-copilot-data
          - runner-vps-dr
          - runner3-reddit-opportunity-raw
          - runner3-telegram-bobvolman-raw
          - runner3-telegram-raw
      start_index:
        type: string
        description: Start index in sorted source manifest
        required: true
        default: '0'
      limit_objects:
        type: string
        description: Number of objects in batch (1-30; total <=25MB)
        required: true
        default: '10'

permissions:
  contents: read

concurrency:
  group: cloudflare-r2-encrypted-courier-${{ inputs.bucket }}
  cancel-in-progress: false

jobs:
  source-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: ${{ inputs.bucket }}
      START_INDEX: ${{ inputs.start_index }}
      LIMIT_OBJECTS: ${{ inputs.limit_objects }}
    steps:
      - uses: actions/checkout@v4
      - name: Install encryption library
        run: python3 -m pip install --quiet cryptography
      - name: Package encrypted, bounded R2 source objects
        run: python3 scripts/cloudflare_r2_encrypted_courier.py
      - uses: actions/upload-artifact@v4
        with:
          name: cf-r2-encrypted-bundle
          path: courier-out/envelope.json
          if-no-files-found: error
          retention-days: 1
