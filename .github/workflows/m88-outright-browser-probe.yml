name: M88 Saba Outright Guest Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-outright-browser-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install VPN and browser tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install --user -q playwright
          google-chrome --version || true

      - name: Build bounded Asia relay pool
        run: |
          set -euo pipefail
          mkdir -p /tmp/m88-relays evidence
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          pref=['TH','SG','MY','PH','ID','JP','KR','TW','VN']
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          picked=[]
          for c in pref:
              rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
              rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
              picked.extend((c,r) for r in rs[:3])
          if not picked: raise SystemExit('No Asia VPN Gate relay')
          meta=[]
          for i,(c,r) in enumerate(picked):
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              p=pathlib.Path(f'/tmp/m88-relays/{i:02d}-{c}.ovpn'); p.write_text(cfg)
              meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/m88-relays.tsv').write_text('\n'.join(meta)+'\n')
          print('RELAYS='+str(len(meta)))
          PY

      - name: Connect first relay accepted by public M88 guest API
        run: |
          set -euo pipefail
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.239.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.239.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.239.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.239.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null

          connected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo "TRY $country $relay"
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/openvpn.log /tmp/m88-probe.json
            sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            ok=0
            for i in {1..12}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null && { ok=1; break; }
              grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|Connection refused|fatal error' /tmp/openvpn.log 2>/dev/null && break || true
            done
            [ "$ok" = 1 ] || continue
            if sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 15 \
              'https://msports.m88.com/api/v1/sport/top?currency=VND' \
              -H 'Authorization: Bearer GUEST' -o /tmp/m88-probe.json; then
              if python3 - <<'PY'
          import json
          d=json.load(open('/tmp/m88-probe.json'))
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then
                sudo ip netns exec vpnns curl -fsS --max-time 10 'https://www.cloudflare.com/cdn-cgi/trace' | grep -E '^(ip|loc|warp)=' | tee evidence/egress.txt
                echo "$country $relay" > evidence/relay.txt
                connected=1
                break
              fi
            fi
          done < /tmp/m88-relays.tsv
          test "$connected" = 1

      - name: Inspect known public guest bootstrap for outright hints
        run: |
          set -euo pipefail
          sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 25 \
            'https://msports.m88.com/api/v1/m88/initconfig' \
            -H 'Authorization: Bearer GUEST' -o evidence/initconfig.json || true
          cp /tmp/m88-probe.json evidence/sport-top.json
          python3 - <<'PY'
          import json,pathlib,re
          pat=re.compile(r'outright|future|top\s*4|relegat|goal.?scorer|winner|champion',re.I)
          hits=[]
          for name in ('initconfig.json','sport-top.json'):
              p=pathlib.Path('evidence')/name
              if not p.exists(): continue
              try: obj=json.loads(p.read_text())
              except Exception: continue
              def walk(x,path=''):
                  if isinstance(x,dict):
                      for k,v in x.items(): walk(v,f'{path}.{k}')
                  elif isinstance(x,list):
                      for i,v in enumerate(x): walk(v,f'{path}[{i}]')
                  else:
                      s=str(x)
                      if pat.search(s): hits.append({'file':name,'path':path,'value':s[:500]})
              walk(obj)
          pathlib.Path('evidence/bootstrap-hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2))
          print('BOOTSTRAP_HITS='+str(len(hits)))
          for h in hits[:30]: print(h)
          PY

      - name: Browse public M88 and capture visible Outright Saba flow
        run: |
          set -euo pipefail
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner GITHUB_WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,re,time,pathlib
          from playwright.sync_api import sync_playwright

          out=pathlib.Path('evidence')
          terms=re.compile(r'outright|futures?|top\s*4|relegat|goal.?scorer|winner|champion|saba',re.I)
          network=[]; hits=[]; pages=[]

          def safe_body(resp):
              try:
                  ct=(resp.headers.get('content-type') or '').lower()
                  if 'json' not in ct: return None
                  txt=resp.text()
                  if len(txt)>2_000_000: return None
                  return txt
              except Exception:
                  return None

          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True)
              ctx=browser.new_context(locale='en-US')
              page=ctx.new_page()

              def on_request(req):
                  if req.resource_type not in ('xhr','fetch','document'): return
                  u=req.url
                  if not re.search(r'm88|saba|sport',u,re.I): return
                  network.append({'kind':'request','method':req.method,'url':u,'post_data':(req.post_data or '')[:12000]})

              def on_response(resp):
                  req=resp.request
                  if req.resource_type not in ('xhr','fetch','document'): return
                  u=resp.url
                  if not re.search(r'm88|saba|sport',u,re.I): return
                  rec={'kind':'response','status':resp.status,'url':u}
                  network.append(rec)
                  txt=safe_body(resp)
                  if txt and terms.search(txt):
                      m=terms.search(txt)
                      a=max(0,m.start()-500); b=min(len(txt),m.end()+2500)
                      hits.append({'source':'response','url':u,'status':resp.status,'snippet':txt[a:b]})

              page.on('request',on_request); page.on('response',on_response)

              targets=[
                  'https://www.m88.com/sportsbook',
                  'https://msports.m88.com/app/v2/',
                  'https://msports.m88.com/app/v2/sports.html',
              ]
              for n,url in enumerate(targets,1):
                  rec={'start_url':url}
                  try:
                      r=page.goto(url,wait_until='domcontentloaded',timeout=30000)
                      page.wait_for_timeout(5000)
                      rec.update({'status':r.status if r else None,'final_url':page.url,'title':page.title()})
                      text=page.locator('body').inner_text(timeout=5000)
                      rec['body_excerpt']=text[:15000]
                      if terms.search(text):
                          for line in text.splitlines():
                              if terms.search(line): hits.append({'source':'visible_text','url':page.url,'snippet':line[:1000]})
                      # Record visible/link targets mentioning Saba or Outright/Futures.
                      links=page.locator('a,button,[role=button]').evaluate_all("els => els.map(e => ({text:(e.innerText||e.textContent||'').trim(), href:e.href||''})).filter(x => x.text || x.href)")
                      rec['interesting_controls']=[x for x in links if terms.search((x.get('text') or '')+' '+(x.get('href') or ''))][:100]

                      # Ordinary guest UI click only. No challenge handling or anti-detection.
                      candidates=page.locator('a,button,[role=button]').filter(has_text=re.compile(r'Outright|Futures?',re.I))
                      clicked=False
                      for i in range(min(candidates.count(),10)):
                          el=candidates.nth(i)
                          try:
                              if el.is_visible():
                                  before=page.url
                                  el.click(timeout=5000)
                                  page.wait_for_timeout(6000)
                                  rec['clicked_out-right']={'before':before,'after':page.url,'text':el.inner_text()[:300]}
                                  clicked=True
                                  break
                          except Exception as e:
                              rec.setdefault('click_errors',[]).append(str(e)[:500])
                      if clicked:
                          text2=page.locator('body').inner_text(timeout=5000)
                          rec['after_click_excerpt']=text2[:20000]
                          for line in text2.splitlines():
                              if terms.search(line): hits.append({'source':'after_click_text','url':page.url,'snippet':line[:1000]})
                      page.screenshot(path=str(out/f'page-{n}.png'),full_page=False)
                  except Exception as e:
                      rec['error']=repr(e)
                  pages.append(rec)

              # Also enumerate final frames; provider launch is often in an iframe.
              frames=[]
              for f in page.frames:
                  frames.append({'name':f.name,'url':f.url})
              pathlib.Path(out/'frames.json').write_text(json.dumps(frames,ensure_ascii=False,indent=2))
              browser.close()

          pathlib.Path(out/'pages.json').write_text(json.dumps(pages,ensure_ascii=False,indent=2))
          pathlib.Path(out/'network.json').write_text(json.dumps(network,ensure_ascii=False,indent=2))
          pathlib.Path(out/'hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2))
          print('PAGES='+str(len(pages)))
          print('NETWORK='+str(len(network)))
          print('HITS='+str(len(hits)))
          for h in hits[:40]: print(json.dumps(h,ensure_ascii=False)[:3000])
          PY

      - name: Summarize evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          for f in ['relay.txt','egress.txt','bootstrap-hits.json','frames.json','pages.json','hits.json']:
              p=pathlib.Path('evidence')/f
              print('\n===',f,'===')
              if p.exists(): print(p.read_text(errors='replace')[:20000])
              else: print('MISSING')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-outright-guest-${{ github.run_id }}
          path: evidence/
          retention-days: 7
