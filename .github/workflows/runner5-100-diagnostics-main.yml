name: Runner5 100 Diagnostics Main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner5-100-diagnostics-main.yml'
      - 'ops/triggers/runner5-100-diag-main.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner5-100-diagnostics-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run Lighthouse raw diagnostics
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          export CHROME_PATH="$CHROME"
          npx --yes lighthouse@13.4.1 https://runner5-restore-gateway.pages.dev/ \
            --output=json --output-path=/tmp/lh.json \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          python - <<'PY'
          import json, pathlib, datetime
          d=json.load(open('/tmp/lh.json')); audits=d.get('audits',{})
          keys=['button-name','color-contrast','heading-order','meta-description','cumulative-layout-shift','largest-contentful-paint','first-contentful-paint','render-blocking-insight','cache-insight','legacy-javascript-insight','unused-css-rules','cls-culprits-insight','font-display-insight']
          chosen={}
          for k in keys:
            if k in audits:
              v=audits[k]
              chosen[k]={'score':v.get('score'),'displayValue':v.get('displayValue'),'title':v.get('title'),'details':v.get('details')}
          for k,v in audits.items():
            if v.get('score') not in (1,None) and any(x in k.lower() for x in ('button','contrast','heading','layout','shift','render','cache','legacy','unused','font','meta-description')):
              chosen.setdefault(k,{'score':v.get('score'),'displayValue':v.get('displayValue'),'title':v.get('title'),'details':v.get('details')})
          out={'status':'ready','url':d.get('finalUrl') or d.get('requestedUrl'),'categories':{k:v.get('score') for k,v in d.get('categories',{}).items()},'audits':chosen,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')}
          pathlib.Path('/tmp/diag.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({'categories':out['categories'],'audits':{k:{'score':v.get('score'),'items':len((v.get('details') or {}).get('items') or [])} for k,v in chosen.items()}},indent=2))
          PY
      - name: Persist diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/diag.json ]; then printf '{"status":"failed","detail":"raw_lighthouse_missing"}\n' >/tmp/diag.json; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp /tmp/diag.json /tmp/diag-safe.json
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main; mkdir -p ops/pagespeed; cp /tmp/diag-safe.json ops/pagespeed/runner5-100-diagnostics.json; git add ops/pagespeed/runner5-100-diagnostics.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'diag: persist Runner5 100 Lighthouse details'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 2
