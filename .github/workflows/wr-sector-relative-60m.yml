name: WR Sector Relative 60m

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wr-sector-relative-60m.yml'
      - 'research/wr_sector_relative_60m_20260825/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: wr-sector-relative-60m-20260825
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas requests dukascopy-python
      - name: Fetch frozen Dukascopy helper
        run: |
          mkdir -p /tmp/wrsector
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/3f11639856334ecb1636d26f26ae61e5fa600c9a/wave-rider-verify/wr_dukascopy_expanded_matrix.py' -o /tmp/wrsector/exp.py
      - name: Probe V3 exact benchmark availability
        run: |
          mkdir -p /tmp/probe
          python3 - <<'PY'
          import json,sys,pandas as pd
          sys.path.insert(0,'/tmp/wrsector')
          import exp
          ordinary='SPY XLK XLY XLP XLE XLF XLV XLI XLU'.split()
          resolved={s:exp.resolve_symbol(s) for s in ordinary}
          bid=exp.pick_const(('OFFER_SIDE_BID','PRICE_TYPE_BID','BID'))
          direct={}
          a=pd.Timestamp('2026-07-01T13:30:00Z');b=pd.Timestamp('2026-07-02T20:00:00Z')
          for s in ('XLC','XLRE'):
            inst=f'{s}.US/USD'
            try:
              df=exp.fetch_side(inst,bid,a,b,5)
              direct[s]={'instrument':inst,'rows':int(len(df)),'ok':bool(len(df))}
            except Exception as e:
              direct[s]={'instrument':inst,'rows':0,'ok':False,'error':repr(e)}
          ok=all(resolved.values()) and all(x['ok'] for x in direct.values())
          out={'ok':ok,'version':'V3','resolved':resolved,'direct':direct}
          open('/tmp/probe/benchmark-probe.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if not ok: raise SystemExit('V3 exact benchmark fetch failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-sector-benchmark-probe
          path: /tmp/probe
          retention-days: 30

  validate:
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas numpy requests dukascopy-python
      - name: Download frozen WR 60m executable parent
        uses: actions/download-artifact@v4
        with:
          name: wr-stock60-actual-final
          path: /tmp/parent
          github-token: ${{ github.token }}
          repository: louisalviss/runner-3
          run-id: 32677300335
      - name: Fetch frozen Dukascopy helper
        run: |
          mkdir -p /tmp/wrsector
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/3f11639856334ecb1636d26f26ae61e5fa600c9a/wave-rider-verify/wr_dukascopy_expanded_matrix.py' -o /tmp/wrsector/exp.py
      - name: Score frozen WR trades with V3 sector-relative context
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: '8'
          WR_SECTOR_HELPER_DIR: /tmp/wrsector
          WR_SECTOR_OUT: /tmp/wr-sector
        run: |
          python3 -m py_compile research/wr_sector_relative_60m_20260825/score_shard.py
          python3 research/wr_sector_relative_60m_20260825/score_shard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-sector-relative-shard-${{ matrix.shard }}
          path: /tmp/wr-sector
          retention-days: 30
          if-no-files-found: warn

  merge:
    needs: [probe, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: wr-sector-relative-shard-*
          path: /tmp/all
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: wr-sector-benchmark-probe
          path: /tmp/all/probe
      - name: Evaluate frozen V3 gates
        run: |
          mkdir -p /tmp/final
          python3 research/wr_sector_relative_60m_20260825/evaluate.py --input /tmp/all --out /tmp/final
          cat /tmp/final/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wr-sector-relative-60m-final
          path: /tmp/final
          retention-days: 30
