name: WR Sector Relative 60m

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wr-sector-relative-60m.yml'
      - 'research/wr_sector_relative_60m_20260825/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: wr-sector-relative-60m-20260825
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        sector: [TECH, COMM, DISC, STAPLES, ENERGY, HEALTH, INDUSTRIALS, UTILITIES]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas numpy requests dukascopy-python
      - name: Download frozen WR 60m executable parent
        uses: actions/download-artifact@v4
        with:
          name: wr-stock60-actual-final
          path: /tmp/parent
          github-token: ${{ github.token }}
          repository: louisalviss/runner-3
          run-id: 32677300335
      - name: Fetch frozen Dukascopy helper
        run: |
          mkdir -p /tmp/wrsector
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/3f11639856334ecb1636d26f26ae61e5fa600c9a/wave-rider-verify/wr_dukascopy_expanded_matrix.py' -o /tmp/wrsector/exp.py
      - name: Score V4 synthetic sector context
        env:
          SECTOR_KEY: ${{ matrix.sector }}
          WR_SECTOR_HELPER_DIR: /tmp/wrsector
          WR_SECTOR_OUT: /tmp/wr-sector
        run: |
          python3 -m py_compile research/wr_sector_relative_60m_20260825/score_shard.py
          python3 research/wr_sector_relative_60m_20260825/score_shard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-sector-relative-${{ matrix.sector }}
          path: /tmp/wr-sector
          retention-days: 30
          if-no-files-found: warn

  merge:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: wr-sector-relative-*
          path: /tmp/all
          merge-multiple: false
      - name: Download frozen parent for expected coverage denominator
        uses: actions/download-artifact@v4
        with:
          name: wr-stock60-actual-final
          path: /tmp/parent
          github-token: ${{ github.token }}
          repository: louisalviss/runner-3
          run-id: 32677300335
      - name: Evaluate frozen V4 gates
        run: |
          mkdir -p /tmp/final
          python3 research/wr_sector_relative_60m_20260825/evaluate.py --input /tmp/all --parent /tmp/parent --out /tmp/final
          cat /tmp/final/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wr-sector-relative-60m-final
          path: /tmp/final
          retention-days: 30
