name: SPMO legacy section diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/spmo-legacy-section-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: 2016-mar
            url: 'https://www.sec.gov/Archives/edgar/data/1378872/000119312516644489/d176916dncsrs.htm'
          - key: 2016-sep
            url: 'https://www.sec.gov/Archives/edgar/data/1378872/000119312517002614/d269293dncsr.htm'
          - key: 2017-sep
            url: 'https://www.sec.gov/Archives/edgar/data/1378872/000119312518002695/d473179dncsr.htm'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 lxml
      - name: Inspect SPMO occurrences
        env:
          URL: ${{ matrix.url }}
        run: |
          python - <<'PY'
          import os,re,requests
          from bs4 import BeautifulSoup,NavigableString
          r=requests.get(os.environ['URL'],headers={'User-Agent':'SPMO independent research contact@example.com'},timeout=180)
          print('FETCH',r.status_code,len(r.content))
          soup=BeautifulSoup(r.text,'lxml')
          for tr in list(soup.find_all('tr')):
              cells=[' '.join(c.stripped_strings) for c in tr.find_all(['td','th'],recursive=False)]
              if cells: tr.replace_with(NavigableString('\n'+'\t'.join(cells)+'\n'))
          t=soup.get_text('\n')
          pat=r'(?:PowerShares|Invesco)\s+S&P\s+500(?:®)?\s+Momentum\s+(?:Portfolio|ETF)(?:\s*\(SPMO\))?'
          occ=list(re.finditer(pat,t,re.I))
          print('OCC_COUNT',len(occ))
          keys=['Microsoft','Apple','Amazon','JPMorgan','Johnson & Johnson','Berkshire Hathaway','Facebook','Alphabet','Visa','Home Depot']
          for i,m in enumerate(occ):
              a=max(0,m.start()-5000); b=min(len(t),m.start()+90000)
              z=t[a:b]
              scores={k:len(re.findall(re.escape(k),z,re.I)) for k in keys}
              tabs=sum(1 for ln in z.splitlines() if '\t' in ln)
              sched=len(re.findall('Schedule of Investments',z,re.I))
              print('\nOCC',i,'POS',m.start(),'MATCH',repr(m.group(0)),'TABS',tabs,'SCHED',sched,'KEYS',scores)
              print('PRE',repr(t[max(0,m.start()-800):m.start()+300].replace('\n',' ')[:1100]))
              hit=[]
              for k in keys:
                  p=z.lower().find(k.lower())
                  if p>=0: hit.append((p,k,repr(z[max(0,p-180):p+300].replace('\n',' '))))
              print('FIRST_KEY_HITS',sorted(hit)[:4])
          PY
