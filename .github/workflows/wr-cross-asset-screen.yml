name: WR cross-asset screen
# timeframe-isolated TradingView sessions v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wr-cross-asset-screen.yml']
permissions:
  contents: read
jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        group: [stock_us, forex, metal, index]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WR_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client==1.8.0
      - name: Run frozen cross-asset screen
        run: python formal-tests/wr_cross_asset_group.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr-cross-asset-${{ matrix.group }}
          path: wr_cross_asset_${{ matrix.group }}.json
          retention-days: 30
