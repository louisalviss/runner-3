name: Montagem Bandcamp Audio Test
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/montagem-bandcamp-audio-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download permitted private-use Montagem
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install -q -U yt-dlp
          command -v ffprobe || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          yt-dlp --no-playlist -f 'bestaudio/best' \
            -o 'montagem.%(ext)s' \
            'https://maxjoannes.bandcamp.com/track/montagem-lala-fawela'
          f=$(find . -maxdepth 1 -type f -name 'montagem.*' | head -n1)
          ffmpeg -hide_banner -loglevel error -y -i "$f" -vn -c:a libmp3lame -b:a 256k montagem.mp3
          ffprobe -v error -show_entries format=duration,size,format_name -of default=nw=1 montagem.mp3
      - name: Upload audio
        uses: actions/upload-artifact@v4
        with:
          name: montagem-private-test-audio
          path: montagem.mp3
          retention-days: 1
