name: X Runner Slim Once

on:
  push:
    paths:
      - .github/workflows/x-runner-slim-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-x:
    runs-on: ubuntu-slim
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run X inspection
        run: python x_runner.py x-job.json --output-root x-results
      - name: Publish result
        if: always()
        run: |
          if [ ! -d x-results ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-results/2091122420652593659
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "x runner slim result 2091122420652593659 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
