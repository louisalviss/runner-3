name: Runner5 Neve Official Demo

on:
  push:
    branches: [main]
    paths:
      - 'scripts/runner5-neve-default-official-import.mjs'
      - '.github/workflows/runner5-neve-official-demo.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: runner5-neve-official-demo
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_KEY: ${{ secrets.WASMER_AUTOMATION_KEY || secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decrypt Wasmer account state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { echo 'Missing automation key' >&2; exit 3; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in ops/wasmer/state.automation.aes \
            -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json

      - name: Prepare browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            npm install --no-save playwright@1.58.2
            npx playwright install --with-deps chromium
            CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          fi
          test -x "$CHROME_PATH" || { echo "Chrome executable unavailable: $CHROME_PATH" >&2; exit 4; }
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Patch final Neve confirmation click
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/runner5-neve-default-official-import.mjs')
          s = p.read_text()
          old = """else if (/Start Import\\?/i.test(text) || /This will override theme settings and add content/i.test(text)) {\n      if (await clickAny(wp, [/^Start Import$/i], 700)) started = true;\n    }"""
          new = """else if (/Start Import\\?/i.test(text) || /This will override theme settings and add content/i.test(text)) {\n      const confirm = wp.getByRole('button', { name: /^Start Import$/i }).last();\n      if (await confirm.isVisible({ timeout: 1200 }).catch(() => false)) {\n        try { await confirm.click({ force: true, timeout: 3000 }); }\n        catch { await confirm.evaluate((el) => el.click()); }\n        started = true;\n        await wp.waitForTimeout(1500);\n      }\n    }"""
          if old not in s:
              raise SystemExit('confirmation patch target missing')
          p.write_text(s.replace(old, new))
          PY

      - name: Import official free Neve Default starter site
        run: node scripts/runner5-neve-default-official-import.mjs

      - name: Persist safe import status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=/tmp/runner5-neve-official-demo.json
          test -s "$status" || printf '{"status":"RUNNER_ERROR","detail":"status_missing"}\n' > "$status"
          cp "$status" /tmp/runner5-neve-official-demo-safe.json
          rm -f /tmp/wasmer-account.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/wordpress-access
            cp /tmp/runner5-neve-official-demo-safe.json ops/wordpress-access/runner5-neve-official-demo.json
            git add ops/wordpress-access/runner5-neve-official-demo.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'Persist Runner5 Neve official demo status'
            if git push origin HEAD:main; then break; fi
            sleep 2
          done

      - name: Refresh optimized proxy and PageSpeed
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-runner5-restore-proxy.yml --ref main
          gh workflow run runner5-restore-pagespeed.yml --ref main
