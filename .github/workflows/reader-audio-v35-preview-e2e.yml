name: Reader Audio v35 Preview E2E

on:
  workflow_dispatch:
  push:
    branches:
      - fix/reader-audio-v34-continuous-sync
    paths:
      - 'cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js'
      - 'scripts/reader_audio_v35_preview_e2e.mjs'
      - '.github/workflows/reader-audio-v35-preview-e2e.yml'

permissions:
  contents: read

concurrency:
  group: reader-audio-v35-preview
  cancel-in-progress: true

env:
  PREVIEW_NAME: runner3-core-reader-v35-preview
  PREVIEW_URL: https://runner3-core-reader-v35-preview.ducduy2411.workers.dev
  PRODUCTION_URL: https://runner3-core.ducduy2411.workers.dev
  EBOOK_BROWSER_SMOKE_BOOK_KEY: core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate preview credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Install build and browser dependencies
        run: |
          npm install --no-save esbuild playwright
          npx playwright install --with-deps chromium

      - name: Build Reader Audio Core browser bundle
        run: node scripts/build_reader_audio_core_browser_bundle.mjs

      - name: Compose isolated v35 preview Worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, os
          root=pathlib.Path('cloudflare/runner3-core')
          wrapper=root/'artifact-library-reader-v7-github-audio-entry.js'
          text=wrapper.read_text(encoding='utf-8')
          text,count=re.subn(
            r'import app from ["\']\./artifact-library-reader-v\d+[^"\']*-entry\.js["\'];',
            'import app from "./artifact-library-reader-v35-continuity-single-owner-entry.js";',
            text,
            count=1,
          )
          if count != 1: raise SystemExit('reader wrapper import marker missing')
          wrapper.write_text(text,encoding='utf-8')

          mailbox=root/'mailbox-entry.js'
          text=mailbox.read_text(encoding='utf-8')
          old='import app from "./audio-entry.js";'
          new='import app from "./artifact-library-reader-v7-github-audio-entry.js";'
          if old in text: text=text.replace(old,new,1)
          elif new not in text: raise SystemExit('canonical mailbox import marker missing')
          mailbox.write_text(text,encoding='utf-8')

          cfg_path=root/'wrangler.jsonc'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['name']=os.environ['PREVIEW_NAME']
          cfg['main']='mailbox-entry.js'
          cfg.pop('triggers',None)
          cfg_path.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-bundle.generated.js
          grep -q 'artifact-library-reader-v35-continuity-single-owner-entry.js' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          ! grep -q '"triggers"' cloudflare/runner3-core/wrangler.jsonc

      - name: Deploy isolated v35 preview Worker
        working-directory: cloudflare/runner3-core
        run: npx --yes wrangler@4 deploy

      - name: Verify v35 preview headers
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -sS -D /tmp/h -o /tmp/body -w '%{http_code}' "$PREVIEW_URL/artifact-library/read?key=$encoded")"
            tr -d '\r' </tmp/h >/tmp/h.clean
            runtime="$(grep -i '^x-r3-reader-runtime:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            proof="$(grep -i '^x-r3-reader-patch-proof:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            echo "V35_PREVIEW attempt=$attempt http=$code runtime=$runtime proof=$proof"
            if [ "$code" = 200 ] && [ "$runtime" = 'v35-continuity-single-owner' ] && [ "$proof" = 'v34+v35:ahead-prefetch+range-follow+single-audio-owner' ] && grep -q 'data-r3-audio-continuity-v35="1"' /tmp/body; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

      - name: Run v35 browser E2E
        run: node scripts/reader_audio_v35_preview_e2e.mjs
