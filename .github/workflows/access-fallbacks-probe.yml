name: Access Fallbacks Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/access-fallbacks-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warp:
    name: WARP residual blockers
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install WARP and browser tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp curl
          python3 -m pip install -q 'playwright>=1.46,<2'
      - name: Connect WARP
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|warp)=' | tee evidence/warp_before.txt || true
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode warp+doh
          warp-cli --accept-tos connect
          ok=0
          for i in {1..20}; do
            sleep 1
            t=$(curl -sS --max-time 5 https://www.cloudflare.com/cdn-cgi/trace || true)
            if printf '%s' "$t" | grep -q '^warp=on'; then
              printf '%s\n' "$t" | grep -E '^(ip|loc|warp)=' | tee evidence/warp_after.txt
              ok=1; break
            fi
          done
          test "$ok" = 1
      - name: Probe WARP with curl and Chrome
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess,pathlib
          from playwright.sync_api import sync_playwright
          targets=[('reddit','https://www.reddit.com/'),('reddit_old','https://old.reddit.com/'),('voz','https://voz.vn/'),('medium','https://medium.com/'),('quora','https://www.quora.com/'),('douyin','https://www.douyin.com/')]
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          out=[]
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            c=b.new_context(viewport={'width':1280,'height':720})
            for name,url in targets:
              body=f'/tmp/warp-{name}.body'
              cp=subprocess.run(['curl','-L','-sS','--compressed','--max-time','15','-A',ua,'-o',body,'-w','%{http_code}\t%{url_effective}\t%{size_download}',url],capture_output=True,text=True)
              parts=(cp.stdout.strip().split('\t')+['','',''])[:3]
              r={'name':name,'route':'warp','curl_code':parts[0] or '000','curl_final':parts[1],'curl_bytes':parts[2] or '0','curl_rc':cp.returncode}
              page=c.new_page()
              try:
                resp=page.goto(url,wait_until='domcontentloaded',timeout=18000); page.wait_for_timeout(2200)
                try:text=page.locator('body').inner_text(timeout=3000)
                except:text=''
                title=page.title(); low=(title+' '+text).lower()
                r.update(browser_status=resp.status if resp else None,browser_final=page.url,title=title,text_prefix=text[:220],challenge=any(x in low for x in ['prove your humanity','verify you are human','captcha','security verification','blocked by network security','just a moment','验证码','security check','access denied']))
              except Exception as e:r.update(browser_error=f'{type(e).__name__}: {e}',browser_final=page.url)
              page.close(); out.append(r)
            c.close(); b.close()
          pathlib.Path('evidence/warp_results.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          for x in out: print('RESULT',json.dumps(x,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-fallback-warp-${{ github.run_id }}
          path: evidence/
          retention-days: 3

  vpn:
    name: VPN ${{ matrix.country }} residual blockers
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        country: [TH, SG, JP]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence
      - name: Select exact-country relay
        shell: bash
        env:
          COUNTRY: ${{ matrix.country }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,json,os,pathlib
          cc=os.environ['COUNTRY']
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          cand=[r for r in rows if (r.get('CountryShort') or '').upper()==cc and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
          if not cand: raise SystemExit(f'No relay for {cc}')
          cand.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True); chosen=cand[0]
          cfg=base64.b64decode(chosen['OpenVPN_ConfigData_Base64']).decode(errors='replace')
          pathlib.Path('/tmp/vpngate.auth').write_text('vpn\nvpn\n')
          pathlib.Path('/tmp/vpngate.ovpn').write_text('\n'.join('auth-user-pass /tmp/vpngate.auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n')
          info={k:chosen.get(k) for k in ['CountryShort','CountryLong','IP','Ping','Speed','NumVpnSessions']}
          pathlib.Path('evidence/relay.json').write_text(json.dumps(info,indent=2)); print('RELAY',json.dumps(info))
          PY
      - name: Connect isolated VPN namespace
        shell: bash
        run: |
          set -euo pipefail
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add veth-host type veth peer name veth-ns
          sudo ip link set veth-ns netns vpnns
          sudo ip addr add 10.235.0.1/24 dev veth-host; sudo ip link set veth-host up
          sudo ip netns exec vpnns ip addr add 10.235.0.2/24 dev veth-ns
          sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set veth-ns up
          sudo ip netns exec vpnns ip route add default via 10.235.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.235.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i veth-host -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o veth-host -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns; printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          sudo touch /tmp/openvpn.log; sudo chmod 644 /tmp/openvpn.log
          sudo ip netns exec vpnns openvpn --config /tmp/vpngate.ovpn --daemon --log /tmp/openvpn.log
          ok=0; for i in {1..40}; do sleep 1; grep -q 'Initialization Sequence Completed' /tmp/openvpn.log && { ok=1; break; }; done
          test "$ok" = 1
          sudo ip netns exec vpnns curl -fsS --max-time 12 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|warp)=' | tee evidence/egress.txt
      - name: Probe exact-country VPN with curl and Chrome
        shell: bash
        env:
          COUNTRY: ${{ matrix.country }}
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner COUNTRY="$COUNTRY" python3 - <<'PY'
          import json,subprocess,pathlib,os
          from playwright.sync_api import sync_playwright
          targets=[('reddit','https://www.reddit.com/'),('reddit_old','https://old.reddit.com/'),('voz','https://voz.vn/'),('medium','https://medium.com/'),('quora','https://www.quora.com/'),('douyin','https://www.douyin.com/')]
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'; route='vpn-'+os.environ['COUNTRY']
          out=[]
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage']); c=b.new_context(viewport={'width':1280,'height':720})
            for name,url in targets:
              body=f'/tmp/{route}-{name}.body'; cp=subprocess.run(['curl','-L','-sS','--compressed','--max-time','15','-A',ua,'-o',body,'-w','%{http_code}\t%{url_effective}\t%{size_download}',url],capture_output=True,text=True); parts=(cp.stdout.strip().split('\t')+['','',''])[:3]
              r={'name':name,'route':route,'curl_code':parts[0] or '000','curl_final':parts[1],'curl_bytes':parts[2] or '0','curl_rc':cp.returncode}; page=c.new_page()
              try:
                resp=page.goto(url,wait_until='domcontentloaded',timeout=18000); page.wait_for_timeout(2200)
                try:text=page.locator('body').inner_text(timeout=3000)
                except:text=''
                title=page.title(); low=(title+' '+text).lower(); r.update(browser_status=resp.status if resp else None,browser_final=page.url,title=title,text_prefix=text[:220],challenge=any(x in low for x in ['prove your humanity','verify you are human','captcha','security verification','blocked by network security','just a moment','验证码','security check','access denied']))
              except Exception as e:r.update(browser_error=f'{type(e).__name__}: {e}',browser_final=page.url)
              page.close(); out.append(r)
            c.close(); b.close()
          pathlib.Path('evidence/results.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)); [print('RESULT',json.dumps(x,ensure_ascii=False)) for x in out]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-fallback-${{ matrix.country }}-${{ github.run_id }}
          path: evidence/
          retention-days: 3
