name: Cloudflare D1 List

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-d1-list.yml'

permissions:
  contents: write

concurrency:
  group: cloudflare-d1-list
  cancel-in-progress: true

jobs:
  list-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: List D1 databases via Cloudflare API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib, urllib.error, urllib.parse, urllib.request

          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          out_path = pathlib.Path('/tmp/cloudflare-d1-list.json')

          out = {
              'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'http': 0,
              'ok': False,
              'databases': [],
              'errors': [],
          }

          if not token or not account:
              out['errors'] = ['cloudflare_credentials_missing']
              out_path.write_text(json.dumps(out, indent=2) + '\n')
              raise SystemExit('cloudflare_credentials_missing')

          url = f'https://api.cloudflare.com/client/v4/accounts/{urllib.parse.quote(account)}/d1/database?page=1&per_page=100'
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/json',
          })

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  out['http'] = r.status
                  data = json.loads(r.read().decode() or '{}')
          except urllib.error.HTTPError as e:
              out['http'] = e.code
              try:
                  data = json.loads(e.read().decode() or '{}')
              except Exception:
                  data = {}
          except Exception as e:
              data = {}
              out['errors'] = [str(e)[:500]]

          api_errors = data.get('errors') or [] if isinstance(data, dict) else []
          if api_errors:
              out['errors'] = [
                  {
                      'code': item.get('code'),
                      'message': item.get('message'),
                  }
                  for item in api_errors[:10]
                  if isinstance(item, dict)
              ]

          result = data.get('result') if isinstance(data, dict) else []
          if isinstance(result, list):
              for item in result:
                  if not isinstance(item, dict):
                      continue
                  out['databases'].append({
                      'name': item.get('name'),
                      'uuid': item.get('uuid') or item.get('id'),
                      'createdAt': item.get('created_at') or item.get('createdAt'),
                  })

          out['ok'] = 200 <= out['http'] < 300 and bool(data.get('success', True))
          out_path.write_text(json.dumps(out, indent=2) + '\n')
          print(json.dumps(out, indent=2))
          if not out['ok']:
              raise SystemExit(f"cloudflare_d1_list_failed_http_{out['http']}")
          PY

      - name: Persist safe D1 inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/cloudflare-d1-list.json || printf '{"ok":false,"errors":["d1_list_result_missing"]}\n' >/tmp/cloudflare-d1-list.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/cloudflare-capability
            cp /tmp/cloudflare-d1-list.json ops/cloudflare-capability/d1-list.json
            git add ops/cloudflare-capability/d1-list.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Persist Cloudflare D1 inventory: ${GITHUB_RUN_ID} [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 3
