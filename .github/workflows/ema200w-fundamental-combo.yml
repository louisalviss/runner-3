name: EMA200W fundamental combo backtest

on:
  push:
    paths:
      - 'research/ema200w_20260823/fundamental_combo.py'
      - '.github/workflows/ema200w-fundamental-combo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests

      - name: Run PIT fundamental combo backtest
        env:
          FUND_OUT: /tmp/ema200w-fundamental
          BACKTEST_CACHE: /tmp/ema200w-cache
        run: |
          cd research/ema200w_20260823
          python fundamental_combo.py

      - name: Persist compact results
        run: |
          mkdir -p research/ema200w_20260823/fundamental_results
          cp /tmp/ema200w-fundamental/fundamental_combo_report.md research/ema200w_20260823/fundamental_results/
          cp /tmp/ema200w-fundamental/fundamental_combo_summary.csv research/ema200w_20260823/fundamental_results/
          cp /tmp/ema200w-fundamental/fundamental_combo_eras.csv research/ema200w_20260823/fundamental_results/
          cp /tmp/ema200w-fundamental/meta.json research/ema200w_20260823/fundamental_results/
          cp /tmp/ema200w-fundamental/fundamental_failures.csv research/ema200w_20260823/fundamental_results/

      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/ema200w_20260823/fundamental_results
          if git diff --cached --quiet; then
            echo 'No result changes'
            exit 0
          fi
          git commit -m 'Store EMA200W fundamental combo results [skip ci]'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
