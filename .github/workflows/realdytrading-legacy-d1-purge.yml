name: Purge Legacy RealDayTrading D1 Rows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realdaytrading-legacy-d1-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: runner3-artifacts
      R2_KEY: reddit/RealDayTrading/corpus/snapshots/20261007T203155Z/realdytrading-corpus-20261007T203155Z.tar.gz
      R2_SHA256: f724b5237f5c4f185f0abded0518b2748cc3b235768d98753083ca604a47df97
      SAFE_STOP_ROWS: '60000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify canonical R2 archive
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 r2 object get "${R2_BUCKET}/${R2_KEY}"             --file=/tmp/rdt-canonical.tar.gz --remote --config=cloudflare/runner3-core/wrangler.jsonc
          test "$(sha256sum /tmp/rdt-canonical.tar.gz | awk '{print $1}')" = "$R2_SHA256"
          echo "RDT_R2_CANONICAL_VERIFY_PASS"

      - name: Verify D1 writer is retired
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'REALDAYTRADING_D1_RUNTIME_RETIRED' cloudflare/runner3-core/reddit-entry.js
          python3 - <<'PY'
          import json
          d=json.load(open('ops/flow-control/registry.json'))
          row=next(x for x in d['flows'] if x['flow_id']=='reddit-deep-sweep')
          assert row['d1']['mode']=='none'
          assert row['r2']['role']=='canonical'
          print('RDT_NO_D1_CONTRACT_PASS')
          PY

      - name: Drop retired RealDayTrading legacy tables
        shell: bash
        run: |
          set -euo pipefail
          W='npx --yes wrangler@4'

          $W d1 execute runner3-core --remote --json --command "
            SELECT COUNT(*) AS n
            FROM sqlite_schema
            WHERE type='table' AND name IN (
              'reddit_scan_runs','reddit_posts','reddit_comments','reddit_post_tags'
            );
          " > /tmp/exists.json
          exists="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/exists.json')); rows=[]
          def walk(x):
              if isinstance(x,dict):
                  if isinstance(x.get('results'),list): rows.extend(x['results'])
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d)
          print(int((rows[0] if rows else {}).get('n',0)))
          PY
          )"
          if [ "$exists" -eq 0 ]; then
            echo "RDT_LEGACY_D1_ALREADY_PURGED"
            exit 0
          fi

          $W d1 execute runner3-core --remote --json --command "
            SELECT COUNT(*) AS bad
            FROM reddit_scan_runs
            WHERE lower(subreddit)<>'realdaytrading';
          " > /tmp/scope.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/scope.json')); rows=[]
          def walk(x):
              if isinstance(x,dict):
                  if isinstance(x.get('results'),list): rows.extend(x['results'])
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d)
          bad=int((rows[0] if rows else {}).get('bad',-1))
          if bad != 0:
              raise SystemExit(f'RDT_SCOPE_FAIL bad={bad}')
          print('RDT_SCOPE_PASS')
          PY

          $W d1 execute runner3-core --remote --json --command "
            DROP TABLE IF EXISTS reddit_comments;
            DROP TABLE IF EXISTS reddit_post_tags;
            DROP TABLE IF EXISTS reddit_posts;
            DROP TABLE IF EXISTS reddit_scan_runs;
          " > /tmp/drop.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/drop.json')); metas=[]
          def walk(x):
              if isinstance(x,dict):
                  if isinstance(x.get('meta'),dict): metas.append(x['meta'])
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d)
          print('RDT_DROP_META', {
              'rows_read':sum(int(m.get('rows_read') or 0) for m in metas),
              'rows_written':sum(int(m.get('rows_written') or 0) for m in metas),
              'changes':sum(int(m.get('changes') or 0) for m in metas),
          })
          PY

          $W d1 execute runner3-core --remote --json --command "
            SELECT name
            FROM sqlite_schema
            WHERE type='table' AND name IN (
              'reddit_scan_runs','reddit_posts','reddit_comments','reddit_post_tags'
            )
            ORDER BY name;
          " > /tmp/verify.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/verify.json')); rows=[]
          def walk(x):
              if isinstance(x,dict):
                  if isinstance(x.get('results'),list): rows.extend(x['results'])
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d)
          if rows:
              raise SystemExit(f'RDT_LEGACY_TABLES_STILL_PRESENT:{rows}')
          print('RDT_LEGACY_D1_PURGE_COMPLETE')
          PY
