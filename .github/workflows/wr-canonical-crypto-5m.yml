name: WR Canonical Crypto 5m
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wr-canonical-crypto-5m.yml'
      - 'wave-rider-verify/wr_canonical_crypto_5m.py'
      - 'wave-rider-verify/wr_tv_parity.py'
permissions:
  contents: read
  actions: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests websocket-client
      - name: Fetch frozen WR 2.5.13 reference
        run: curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
      - name: Assert four Binance TradingView oracle windows
        run: python3 wave-rider-verify/wr_canonical_crypto_5m.py oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-canonical-crypto5-oracle
          path: /tmp/wr
          retention-days: 14

  baseline:
    needs: oracle
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests websocket-client
      - name: Fetch frozen WR 2.5.13 reference
        run: curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
      - name: Run full-universe canonical 5m shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
          WR_OUT: /tmp/wr
        run: python3 wave-rider-verify/wr_canonical_crypto_5m.py shard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-canonical-crypto5-shard-${{ matrix.shard }}
          path: /tmp/wr
          retention-days: 14

  merge:
    needs: baseline
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wr-canonical-crypto5-shard-*
          path: /tmp/all
          merge-multiple: false
      - name: Merge canonical results
        env:
          MERGE_ROOT: /tmp/all
          FINAL_OUT: /tmp/final
        run: python3 wave-rider-verify/wr_canonical_crypto_5m.py merge
      - uses: actions/upload-artifact@v4
        with:
          name: wr-canonical-crypto5-final
          path: /tmp/final
          retention-days: 30
