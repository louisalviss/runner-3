name: Verify NEW Cloudflare Target Audit Token (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-target-audit-new-readonly-check
  cancel-in-progress: false

jobs:
  verify-new-target-audit:
    if: ${{ github.repository == 'louisalviss/runner-3' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_TARGET_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW }}
    steps:
      - uses: actions/checkout@v4
      - name: Offline test (no Cloudflare requests)
        run: |
          python3 -m py_compile scripts/cloudflare_target_readonly_inventory.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_target_readonly_inventory.py
      - name: Inventory target D1 and Workers via NEW scoped audit token
        run: python3 scripts/cloudflare_target_readonly_inventory.py
      - name: Upload sanitized inventory (counts, HTTP only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-target-audit-new-readonly-diagnostic
          path: migration-out/target-d1-workers-inventory.json
          retention-days: 2
          if-no-files-found: error
