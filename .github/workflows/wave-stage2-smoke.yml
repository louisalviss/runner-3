name: Wave Stage2 Smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wave-stage2-smoke.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install websocket-client==1.8.0
      - run: python jobs/wave_stage2_smoke.py | tee /tmp/result.txt
      - name: Persist smoke result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/wave_stage2_smoke.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: Wave Stage2 smoke [skip ci]'
            git push
          fi
