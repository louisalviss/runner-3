name: Cancel Stale Site Factory Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-site-factory.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale run 31995429740
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/31995429740/cancel
