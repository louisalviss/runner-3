name: Google PageSpeed UI Audit

on:
  push:
    branches: [main]
    paths:
      - 'ops/pagespeed/ui-requests/*.json'
      - 'scripts/pagespeed-ui-audit.mjs'
      - '.github/workflows/pagespeed-ui-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-pagespeed-ui
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright runtime
        run: npm install --no-save playwright-core@1.58.2
      - name: Run direct Google PageSpeed web UI
        env:
          PSI_URL: https://runner3-factory-smoke-2.wasmer.app/
          PSI_UI_OUT: ops/pagespeed/ui-latest.json
          PSI_UI_SCREENSHOT: ops/pagespeed/ui-latest.png
        run: node scripts/pagespeed-ui-audit.mjs
      - name: Persist direct PageSpeed result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/pagespeed/ui-latest.json || exit 2
          cp ops/pagespeed/ui-latest.json /tmp/pagespeed-ui-latest.json
          test ! -f ops/pagespeed/ui-latest.png || cp ops/pagespeed/ui-latest.png /tmp/pagespeed-ui-latest.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/pagespeed
            cp /tmp/pagespeed-ui-latest.json ops/pagespeed/ui-latest.json
            test ! -f /tmp/pagespeed-ui-latest.png || cp /tmp/pagespeed-ui-latest.png ops/pagespeed/ui-latest.png
            git add ops/pagespeed/ui-latest.json ops/pagespeed/ui-latest.png 2>/dev/null || git add ops/pagespeed/ui-latest.json
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m 'Persist direct Google PageSpeed UI audit'
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep 2
          done
          test "$pushed" = true
