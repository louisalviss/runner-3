name: Runner3WP V2 Force Baseline Restore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3wp-v2-force-baseline-restore.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3wp-v2-force-baseline-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: wordpress-edge-proxy-v2
      CF_WORKER_CONFIG: edge/wordpress-edge-proxy/wrangler.v2.jsonc
      CF_EDGE_URL: https://wordpress-edge-proxy-v2.ducduy2411.workers.dev
      CF_EDGE_OUT: /tmp/runner3wp-v2-edge.json
      CF_SNAPSHOT_OUT: /tmp/runner3wp-v2-snapshot.json
      RUNNER3_FCP_V2: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runner3wp-v2-fcp-test
          fetch-depth: 1
      - name: Force baseline deploy
        run: |
          set -euo pipefail
          node scripts/deploy-wordpress-workers-cache.mjs
      - name: Verify and persist proof
        run: |
          set -euo pipefail
          mkdir -p ops/perf/ab
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=await fetch(process.env.CF_EDGE_URL,{headers:{'user-agent':'Runner3WP-Force-Restore/1.0'}});const h=await r.text();
          const marker=h.includes('data-runner3-v2-critical="r1"')||h.includes('runner3-v2-critical-css');
          const out={status:'ready',ok:r.status===200&&String(r.headers.get('x-edge-snapshot')||'').toUpperCase()==='HIT'&&/noindex/i.test(r.headers.get('x-robots-tag')||'')&&!marker,http:r.status,edgeMode:r.headers.get('x-edge-mode'),snapshot:r.headers.get('x-edge-snapshot'),noindex:r.headers.get('x-robots-tag'),experimentMarker:marker,checkedAt:new Date().toISOString()};
          fs.writeFileSync('ops/perf/ab/runner3wp-v2-force-restore.latest.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));if(!out.ok)process.exit(12);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/perf/ab/runner3wp-v2-force-restore.latest.json
          git commit -m 'ops: verify Runner3WP V2 baseline restored' || true
          git push origin HEAD:runner3wp-v2-fcp-test
