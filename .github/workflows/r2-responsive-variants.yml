name: R2 Responsive Image Variants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r2-responsive-variants.yml'
      - 'ops/r2-responsive/requests/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-r2-responsive-variants
  cancel-in-progress: true

jobs:
  build-upload-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: runner3-wp-media
      R2_PUBLIC_HOST: pub-f6e5190178814cd5be8f1eb531f1a164.r2.dev
      SITE_SLUG: runner3-factory-smoke-2
      VARIANT_DIR: responsive-v2
      WEBP_QUALITY: '74'
      RESULT_PATH: /tmp/r2-responsive-result.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install image runtime
        run: python -m pip install --quiet 'Pillow==11.3.0'

      - name: Build, upload, GET and decode every static variant
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Cloudflare Account ID unavailable'; exit 2; }
          python - <<'PY'
          import io, json, os, subprocess, urllib.request
          from pathlib import Path
          from PIL import Image

          account_id=os.environ['CLOUDFLARE_ACCOUNT_ID']
          bucket_name=os.environ['R2_BUCKET_NAME']
          public_host=os.environ['R2_PUBLIC_HOST']
          slug=os.environ['SITE_SLUG']
          variant_dir=os.environ['VARIANT_DIR']
          quality=int(os.environ['WEBP_QUALITY'])
          result_path=os.environ['RESULT_PATH']
          widths=(360,480,640)
          source_dir=Path('media')/slug
          out_dir=Path('/tmp/r2-responsive')
          out_dir.mkdir(parents=True,exist_ok=True)
          entries={}
          uploaded=[]

          for src in sorted(source_dir.glob('offset-demo-*.webp')):
              original_url=f'https://{public_host}/sites/{slug}/{src.name}'
              variants=[]
              with Image.open(src) as im:
                  im.load(); ow,oh=im.size
                  for width in widths:
                      height=max(1,round(oh*width/ow))
                      resized=im.resize((width,height),Image.Resampling.LANCZOS)
                      local=out_dir/f'{src.stem}-w{width}.webp'
                      resized.save(local,'WEBP',quality=quality,method=6)
                      key=f'sites/{slug}/{variant_dir}/{src.stem}-w{width}.webp'
                      cmd=['npx','--yes','wrangler@4.123.0','r2','object','put',f'{bucket_name}/{key}','--file',str(local),'--remote','--content-type','image/webp','--cache-control','public, max-age=31536000, immutable']
                      p=subprocess.run(cmd,env=os.environ,capture_output=True,text=True,timeout=120)
                      if p.returncode!=0:
                          Path(result_path).write_text(json.dumps({'status':'failed','stage':'upload','bucketName':bucket_name,'key':key,'detail':(p.stderr or p.stdout)[-1200:]},indent=2))
                          raise RuntimeError(f'upload_failed:{key}')
                      url=f'https://{public_host}/{key}'
                      get=urllib.request.Request(url,headers={'User-Agent':'Runner3StaticResponsiveVerify/2.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(get,timeout=30) as r:
                          data=r.read(); status=r.status; ctype=r.headers.get('content-type','')
                      if status!=200 or not data: raise RuntimeError(f'get_failed:{url}:{status}:{len(data)}')
                      with Image.open(io.BytesIO(data)) as check:
                          check.load(); vw,vh=check.size; fmt=check.format
                      if vw!=width or vh!=height or fmt!='WEBP': raise RuntimeError(f'decode_mismatch:{url}:{vw}x{vh}:{fmt}')
                      item={'width':width,'height':height,'bytes':len(data),'url':url,'key':key,'contentType':ctype}
                      variants.append(item); uploaded.append(item)
              entries[original_url]={'originalWidth':ow,'originalHeight':oh,'variants':variants}

          result={'status':'pass','siteSlug':slug,'accountId':account_id,'bucketName':bucket_name,'publicHost':public_host,'variantDir':variant_dir,'quality':quality,'originals':len(entries),'variants':len(uploaded),'totalVariantBytes':sum(v['bytes'] for v in uploaded),'entries':entries}
          Path(result_path).write_text(json.dumps(result,indent=2))
          print(json.dumps({'status':'pass','bucketName':bucket_name,'variantDir':variant_dir,'quality':quality,'originals':len(entries),'variants':len(uploaded),'totalVariantBytes':result['totalVariantBytes']},indent=2))
          PY

      - name: Persist verified manifest result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RESULT_PATH" || echo '{"status":"failed","detail":"variant_result_missing"}' > "$RESULT_PATH"
          cp "$RESULT_PATH" /tmp/r2-responsive-safe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/r2-responsive/results/runs
            cp /tmp/r2-responsive-safe.json ops/r2-responsive/results/latest.json
            cp /tmp/r2-responsive-safe.json "ops/r2-responsive/results/runs/${GITHUB_RUN_ID}.json"
            git add ops/r2-responsive/results
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m "Persist R2 responsive variants result: ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep 2
          done
          test "$pushed" = true

      - name: Require all variants verified
        if: always()
        run: |
          python - <<'PY'
          import json, os
          d=json.load(open(os.environ['RESULT_PATH']))
          assert d.get('status')=='pass', json.dumps(d,indent=2)
          assert d.get('variantDir')=='responsive-v2', json.dumps(d,indent=2)
          assert d.get('quality')==74, json.dumps(d,indent=2)
          assert d.get('originals')==8 and d.get('variants')==24, json.dumps(d,indent=2)
          for original,entry in d['entries'].items():
              assert [v['width'] for v in entry['variants']]==[360,480,640], original
              assert all(v['bytes']>0 for v in entry['variants']), original
          print(json.dumps({'status':'pass','bucketName':d['bucketName'],'variantDir':d['variantDir'],'quality':d['quality'],'variants':d['variants'],'totalVariantBytes':d['totalVariantBytes']},indent=2))
          PY
