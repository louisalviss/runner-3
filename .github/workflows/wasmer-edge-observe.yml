name: Wasmer Edge Observe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'ops/wasmer-edge-speed/requests/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-edge-observe
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WASMER_APP_OWNER: runner3wp0b90f6b4ab
      WASMER_APP_SLUG: runner3-factory-smoke-2
      WP_SITE_SLUG: runner3-factory-smoke-2
      WP_SITE_URL: https://runner3-factory-smoke-2.wasmer.app/
      EDGE_SPEED_OUT: /tmp/wasmer-edge-observe.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore Wasmer browser session
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/browser-state.aes -out /tmp/wasmer-browser-state.json

      - name: Install browser automation
        run: npm install --no-save playwright-core@1.58.2

      - name: Observe live CDN eligibility and reuse
        id: edge
        continue-on-error: true
        run: node scripts/wasmer-edge-speed.mjs

      - name: Persist immutable observation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/wasmer-edge-observe.json || exit 2
          safe=/tmp/edge-observe-safe.json
          cp /tmp/wasmer-edge-observe.json "$safe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/wasmer-edge-speed/observations
            cp "$safe" "ops/wasmer-edge-speed/observations/${WP_SITE_SLUG}.${GITHUB_RUN_ID}.json"
            git add "ops/wasmer-edge-speed/observations/${WP_SITE_SLUG}.${GITHUB_RUN_ID}.json"
            git commit -m "Persist live edge observation: ${WP_SITE_SLUG} run ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 3

      - name: Require verified cache reuse
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='/tmp/wasmer-edge-observe.json'
          d=json.load(open(p))
          print(json.dumps({'status':d.get('status'),'cacheVerification':d.get('cacheVerification'),'functionalSmoke':d.get('functionalSmoke')}, indent=2))
          raise SystemExit(0 if d.get('status') == 'completed' else 1)
          PY
