name: WR 2.5.15 Phase1 3m PR
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wr-2515-phase1-3m-pr.yml'
      - 'wave-rider-verify/wr2515_tf_phase1.py'
      - 'wave-rider-verify/wr2515_tf_merge.py'
permissions:
  contents: read
  actions: read
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - run: curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
      - name: Run 3m shard
        env:
          TF_MIN: 3
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
          BASE_DIR: /tmp/base
          OUT_DIR: /tmp/out
        run: python3 wave-rider-verify/wr2515_tf_phase1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr2515-phase1-3m-pr-shard-${{ matrix.shard }}
          path: /tmp/out
          retention-days: 7
  merge:
    needs: shard
    if: always() && needs.shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wr2515-phase1-3m-pr-shard-*
          path: /tmp/all
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - name: Merge 3m and compare with 5m
        env:
          TF_MIN: 3
          BASE_DIR: /tmp/base
          IN_DIR: /tmp/all
          OUT_DIR: /tmp/final
        run: python3 wave-rider-verify/wr2515_tf_merge.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr2515-phase1-3m-final
          path: /tmp/final
          retention-days: 14
