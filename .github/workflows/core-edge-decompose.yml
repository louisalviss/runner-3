# Ephemeral PR trigger for PIT quality validation; no result files are persisted.
name: Core Edge Decompose

on:
  push:
    paths:
      - 'research/ema200w_20260823/core_edge_decompose.py'
      - '.github/workflows/core-edge-decompose.yml'
  pull_request:
    paths:
      - 'research/ema200w_20260823/core_edge_decompose.py'
      - '.github/workflows/core-edge-decompose.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  run:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pandas numpy requests pyarrow

      - name: Run decomposition
        working-directory: research/ema200w_20260823
        run: python core_edge_decompose.py
