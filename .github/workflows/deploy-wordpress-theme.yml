name: Deploy WordPress Theme

on:
  push:
    branches: [main]
    paths:
      - 'ops/wp-theme-deploy/requests/*.json'
  workflow_dispatch:
    inputs:
      site_slug:
        description: Site factory slug
        required: true
        default: runner3-factory-smoke-2
        type: string

permissions:
  contents: write

concurrency:
  group: runner3-wordpress-theme-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve site slug
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SITE_SLUG: ${{ inputs.site_slug }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            slug="$INPUT_SITE_SLUG"
          else
            request="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ops/wp-theme-deploy/requests/.*\.json$' | tail -1 || true)"
            test -n "$request" || { echo 'Theme deployment request missing'; exit 2; }
            slug="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["site_slug"])' "$request")"
          fi
          echo "WP_SITE_SLUG=$slug" >> "$GITHUB_ENV"

      - name: Decrypt Wasmer account state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { echo 'Automation encryption key unavailable'; exit 3; }
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in ops/wasmer/state.automation.aes \
            -out /tmp/wasmer-account.json

      - name: Build theme package
        shell: bash
        run: |
          set -euo pipefail
          cd wordpress-site/wp-content/themes
          zip -qr /tmp/runner3-starter.zip runner3-starter
          test -s /tmp/runner3-starter.zip

      - name: Install browser automation
        run: npm install --no-save playwright-core@1.58.2

      - name: Deploy theme to live WordPress
        run: node scripts/deploy-wordpress-theme.mjs

      - name: Persist safe deployment status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          slug="${WP_SITE_SLUG}"
          status="/tmp/wp-theme-deploy-${slug}.json"
          if [ ! -f "$status" ]; then
            printf '{"status":"runner_error","siteSlug":"%s","detail":"theme_status_missing"}\n' "$slug" > "$status"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/wp-theme-deploy/results
            cp "$status" "ops/wp-theme-deploy/results/${slug}.latest.json"
            git add "ops/wp-theme-deploy/results/${slug}.latest.json"
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m "Persist WordPress theme deployment status: ${slug}"
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep 3
          done
          test "$pushed" = true || exit 5
