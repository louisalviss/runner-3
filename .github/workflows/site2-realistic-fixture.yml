name: Site2 Official Astra Demo Fixture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner3-site2-official-demo
  cancel-in-progress: true

env:
  SITE2_URL: https://runner3-wp-a94b8fd2.wasmer.app
  WP_OPTIMIZER_D1_DB: runner3-wp-optimizer
  WP_OPTIMIZER_WRANGLER_VERSION: '4.124.0'
  STARTER_TEMPLATE_NAME: Organic Store
  STARTER_FIXTURE_ID: astra-starter-organic-store-gutenberg
  LEGACY_FIXTURE_PLUGIN_SLUG: runner3-site2-fixture-v2

jobs:
  setup_fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight exact Site2 identity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 \
            "$SITE2_URL/?rest_route=/wasmer/v1/liveconfig&__preflight=$(date +%s)" \
            -o /tmp/site2-before.json
          SITE2_URL="$SITE2_URL" node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("/tmp/site2-before.json","utf8"));
            const expected=new URL(process.env.SITE2_URL).host;
            const actual=new URL(d?.wordpress?.url||"").host;
            if(actual!==expected) throw new Error(`Site2 identity mismatch: ${actual}`);
            console.log("SITE2_PREFLIGHT_OK", JSON.stringify({url:d.wordpress.url,posts:d.wordpress.posts,pages:d.wordpress.pages}));
          '

      - name: Import official Astra complete-site demo
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WASMER_TOKEN:-}"
          npm install --no-save playwright-core@1.61.0 >/dev/null
          C="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$C"
          CHROME_PATH="$C" SETUP_OUT=/tmp/site2-realistic-setup.json node scripts/site2-realistic-setup.mjs

      - name: Persist official fixture identity in D1
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${GITHUB_SHA}"
          SOURCE_SHA="$SOURCE_SHA" node -e '
            const fs=require("fs");
            const setup=JSON.parse(fs.readFileSync("/tmp/site2-realistic-setup.json","utf8"));
            if(setup.status!=="ready") throw new Error("setup output is not ready");
            fs.writeFileSync("/tmp/site2-upsert.json", JSON.stringify({
              type:"site.upsert", site_id:"site2", name:"Site 2",
              public_url:process.env.SITE2_URL+"/", origin_url:process.env.SITE2_URL+"/",
              status:"official-demo-fixture",
              metadata:{
                fixture:"astra-starter-organic-store-gutenberg",
                fixture_source:"official Astra Starter Templates complete-site demo",
                template:"Organic Store",
                theme:"astra", commerce:"woocommerce",
                fixture_source_sha:process.env.SOURCE_SHA,
                prior_custom_fixture:"astra-woo-v1 / historical / non-comparable",
                setup_completed_at:setup.completed_at,
                frontend:setup.frontend
              }
            }));
            for (const run_id of ["site2-baseline-32792586937-1","site2-baseline-32801765874-1"]) {
              fs.writeFileSync(`/tmp/${run_id}.json`, JSON.stringify({
                type:"gate.upsert", run_id, gate_name:"fixture_scope", status:"HISTORICAL",
                details:{reason:"Baseline predates official Astra Organic Store complete-site fixture and is non-comparable.",replaced_by_scope:"astra-starter-organic-store-gutenberg"}
              }));
            }
          '
          node scripts/wp-optimizer-state.mjs --event-file /tmp/site2-upsert.json
          node scripts/wp-optimizer-state.mjs --event-file /tmp/site2-baseline-32792586937-1.json
          node scripts/wp-optimizer-state.mjs --event-file /tmp/site2-baseline-32801765874-1.json

      - name: Verify D1 and live WordPress shape
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 \
            "$SITE2_URL/?rest_route=/wasmer/v1/liveconfig&__verify=$(date +%s)" \
            -o /tmp/site2-after.json
          node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("/tmp/site2-after.json","utf8"));
            const themes=d?.wordpress?.themes||[];
            const plugins=d?.wordpress?.plugins||[];
            const activeTheme=themes.find(x=>x.status==="active")?.name;
            const woo=plugins.find(x=>x.name==="woocommerce");
            const pages=typeof d.wordpress.pages==="object" ? Number(d.wordpress.pages.count||0) : Number(d.wordpress.pages||0);
            if(activeTheme!=="astra") throw new Error(`Astra not active: ${activeTheme}`);
            if(!woo || !["active","active-network"].includes(woo.status)) throw new Error("WooCommerce not active");
            if(pages<3) throw new Error("Official demo page count too small");
            console.log("SITE2_OFFICIAL_DEMO_OK", JSON.stringify({theme:activeTheme,woocommerce:woo.version,posts:d.wordpress.posts,pages:d.wordpress.pages}));
          '
          SQL="SELECT site_id,status,json_extract(metadata_json,'$.fixture') AS fixture FROM sites WHERE site_id='site2';"
          npx --yes wrangler@4.124.0 d1 execute "$WP_OPTIMIZER_D1_DB" --remote --yes --json --command "$SQL" | tee /tmp/site2-d1.json
          node -e '
            const fs=require("fs"); const p=JSON.parse(fs.readFileSync("/tmp/site2-d1.json","utf8"));
            const r=p.flatMap(x=>x.results||[])[0];
            if(!r || r.status!=="official-demo-fixture" || r.fixture!=="astra-starter-organic-store-gutenberg") throw new Error("D1 fixture mismatch");
          '

      - name: Evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Site2 official Astra demo'
            echo '- target: `https://runner3-wp-a94b8fd2.wasmer.app/`'
            echo '- source: official Astra Starter Templates complete-site import'
            echo '- template: `Organic Store` (free, Block Editor library)'
            echo '- no hand-written pages, products, CSS or benchmark content are created by Runner3'
            if [ -f /tmp/site2-realistic-setup.json ]; then
              echo '```json'; cat /tmp/site2-realistic-setup.json; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
