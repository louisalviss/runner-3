name: X Leto SPMO table fast

on:
  push:
    paths:
      - '.github/workflows/x-leto-table-fast.yml'

permissions:
  contents: read

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr
      - name: OCR one frame every 3 seconds
        run: |
          mkdir -p /tmp/f
          curl -L --max-time 90 'https://video.twimg.com/amplify_video/2088233794197495808/vid/avc1/1280x720/jcmuE2GNfJo_3SFB.mp4?tag=29' -o /tmp/v.mp4
          ffmpeg -y -loglevel error -ss 428 -to 500 -i /tmp/v.mp4 -vf 'fps=1/3' /tmp/f/%03d.png
          i=0
          for f in /tmp/f/*.png; do
            sec=$((428 + i*3)); echo "===== SEC $sec =====";
            tesseract "$f" stdout -l eng --psm 6 2>/dev/null || true
            i=$((i+1))
          done
