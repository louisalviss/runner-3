name: SPMO Independent Backtest

on:
  push:
    branches: [main]
    paths:
      - 'spmo-backtest/**'
      - '.github/workflows/spmo-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spmo-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests yfinance beautifulsoup4 lxml python-dateutil html5lib

      - name: Run SPMO backtest
        run: python spmo-backtest/backtest_efts.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spmo-backtest-${{ github.run_id }}
          path: spmo-backtest/output/
          if-no-files-found: warn
          retention-days: 7
