name: Verify promint Robinhood wallets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x-promint-onchain-slim-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Query Robinhood Chain Blockscout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-output/promint-onchain
          base='https://robinhoodchain.blockscout.com/api/v2'
          for a in \
            0x41a21AC1cB40888Ce81B72c3970C1778Dd04eccd \
            0xFeE28e33182b276a2e4c24b19E56711e27328680 \
            0x94B4e33571c2124c404fe349bd754f3e66Df94Cf; do
            curl -fsSL --max-time 20 "$base/addresses/$a" -o "runner-output/promint-onchain/$a-address.json"
            curl -fsSL --max-time 20 "$base/addresses/$a/transactions" -o "runner-output/promint-onchain/$a-transactions.json"
            curl -fsSL --max-time 20 "$base/addresses/$a/token-transfers" -o "runner-output/promint-onchain/$a-token-transfers.json" || true
            curl -fsSL --max-time 20 "$base/addresses/$a/tokens" -o "runner-output/promint-onchain/$a-tokens.json" || true
          done
          python3 - <<'PY'
          import json, glob, os
          out={}
          for p in glob.glob('runner-output/promint-onchain/*-address.json'):
              a=os.path.basename(p).split('-address.json')[0]
              d=json.load(open(p,encoding='utf-8'))
              out[a]={k:d.get(k) for k in ['hash','coin_balance','is_contract','name','exchange_rate','implementation_name','creation_tx_hash']}
          for p in glob.glob('runner-output/promint-onchain/*-transactions.json'):
              a=os.path.basename(p).split('-transactions.json')[0]
              d=json.load(open(p,encoding='utf-8'))
              items=d.get('items',[])[:50]
              out.setdefault(a,{})['txs']=[{
                  'hash':x.get('hash'),'timestamp':x.get('timestamp'),'from':(x.get('from') or {}).get('hash'),'to':(x.get('to') or {}).get('hash'),
                  'value':x.get('value'),'method':x.get('method'),'status':x.get('status'),'created_contract':(x.get('created_contract') or {}).get('hash') if isinstance(x.get('created_contract'),dict) else x.get('created_contract')
              } for x in items]
          open('runner-output/promint-onchain/summary.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runner-output/promint-onchain
          git diff --cached --quiet && exit 0
          git commit -m 'Store promint onchain verification [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep "$n"
          done
          exit 1
