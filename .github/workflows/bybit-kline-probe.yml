name: Bybit Kline Probe

on:
  push:
    branches: [main]
    paths:
      - 'jobs/bybit-kline-probe/**'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe Bybit public 3m kline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/trinity-atr-supertrend
          URL='https://api.bybit.com/v5/market/kline?category=linear&symbol=SOLUSDT&interval=3&limit=2'
          code=$(curl -sS -L -o /tmp/bybit.json -w '%{http_code}' --max-time 20 "$URL" || true)
          printf 'http=%s\n' "$code" > reports/trinity-atr-supertrend/bybit-probe.txt
          head -c 2000 /tmp/bybit.json >> reports/trinity-atr-supertrend/bybit-probe.txt || true
          git config user.name 'runner-3-bot'
          git config user.email 'runner-3-bot@users.noreply.github.com'
          git add reports/trinity-atr-supertrend/bybit-probe.txt
          git commit -m 'Probe Bybit public kline access' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
