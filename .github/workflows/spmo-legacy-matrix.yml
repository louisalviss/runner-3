name: SPMO Legacy Matrix 2016-2019
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spmo-legacy-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  period:
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: 2016-mar
            rb: '2016-03-18'
            snap: '2016-04-30'
            exit: '2016-09-16'
            acc: '0001193125-16-644489'
          - key: 2016-sep
            rb: '2016-09-16'
            snap: '2016-10-31'
            exit: '2017-03-17'
            acc: '0001193125-17-002614'
          - key: 2017-mar
            rb: '2017-03-17'
            snap: '2017-04-30'
            exit: '2017-09-15'
            acc: '0001193125-17-221822'
          - key: 2017-sep
            rb: '2017-09-15'
            snap: '2017-10-31'
            exit: '2018-03-16'
            acc: '0001193125-18-002695'
          - key: 2018-mar
            rb: '2018-03-16'
            snap: '2018-04-30'
            exit: '2018-09-21'
            acc: '0001193125-18-214392'
          - key: 2018-sep
            rb: '2018-09-21'
            snap: '2018-10-31'
            exit: '2019-03-15'
            acc: '0001193125-18-321151'
          - key: 2019-mar
            rb: '2019-03-15'
            snap: '2019-04-30'
            exit: '2019-09-20'
            acc: '0001193125-19-138363'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pandas yfinance beautifulsoup4 lxml
      - name: Build one-period runner
        env:
          RB: ${{ matrix.rb }}
          SNAP: ${{ matrix.snap }}
          EXIT: ${{ matrix.exit }}
          ACC: ${{ matrix.acc }}
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('spmo-backtest/run_legacy_batch.py')
          s=p.read_text()
          one="PERIODS=[\n ('%s','%s','%s','%s'),\n]"%(os.environ['RB'],os.environ['SNAP'],os.environ['EXIT'],os.environ['ACC'])
          s=re.sub(r'PERIODS=\[.*?\]\n\nALIASES=',one+'\n\nALIASES=',s,flags=re.S)
          Path('/tmp/run_one.py').write_text(s)
          PY
      - name: Reconstruct period
        run: python -u /tmp/run_one.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-${{ matrix.key }}-${{ github.run_id }}
          path: spmo-backtest/output/legacy_batch_results.csv
          if-no-files-found: warn
          retention-days: 7
