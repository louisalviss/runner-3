name: Chainsaw V18C PR Trigger
on:
  pull_request:
    paths: ['trigger-chainsaw-v18c.txt']
permissions:
  actions: read
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Locate latest V18C run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/louisalviss/runner-3/actions/workflows/chainsaw-v18c-direct.yml/runs?event=workflow_dispatch&per_page=5' \
            --jq '.workflow_runs[] | [.id,.status,.conclusion,.head_sha,.created_at] | @tsv'
