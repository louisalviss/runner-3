name: SPMO Modern HF Fast

on:
  push:
    branches: [main]
    paths:
      - 'spmo-modern2/fast_run.py'
      - '.github/workflows/spmo-modern-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install duckdb pandas numpy requests yfinance
      - name: Run modern SPMO parallel reconstruction
        run: python -u spmo-modern2/fast_run.py
      - name: Upload backtest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spmo-modern-fast-${{ github.run_id }}
          path: spmo-modern2/output/
          if-no-files-found: error
          retention-days: 7
