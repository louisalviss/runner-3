name: D1 Domain Isolation Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d1-domain-isolation-fix
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo MISSING:CLOUDFLARE_API_TOKEN; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo MISSING:CLOUDFLARE_ACCOUNT_ID; exit 2; }

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Migrate and verify domain D1s
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/d1_domain_isolation_fix.sh

      - name: Persist verified bindings and authority manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/runner3-core/wrangler.jsonc ops/cloudflare-capability/d1-domain-isolation.json
          git diff --cached --quiet && { echo NO_CONFIG_CHANGES; exit 0; }
          git commit -m 'feat(d1): cut over domain-isolated databases [skip ci]'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 3
