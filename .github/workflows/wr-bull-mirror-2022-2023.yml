name: WR Bull Mirror 2022 2023

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wr-bull-mirror-2022-2023.yml'
      - 'wave-rider-verify/wr_bull_mirror_hist_driver.py'
      - 'wave-rider-verify/wr_bull_mirror_hist_analyze.py'

permissions:
  contents: read
  actions: read

jobs:
  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen common-universe base
        uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ github.token }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - name: Fetch frozen exact WR engine sources
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8ae05d04764d28cd0705277951973376b04a7f53/wave-rider-verify/wr2515_tf_phase1.py' -o /tmp/zonec_hist.py
      - name: Scan exact Zone C 10m 2022-2023
        env:
          TF_MIN: 10
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
          BASE_DIR: /tmp/base
          OUT_DIR: /tmp/out
        run: python3 wave-rider-verify/wr_bull_mirror_hist_driver.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-bull-hist-shard-${{ matrix.shard }}
          path: /tmp/out
          retention-days: 7

  analyze:
    needs: shard
    if: always() && needs.shard.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wr-bull-hist-shard-*
          path: /tmp/all
          merge-multiple: true
      - name: Analyze frozen bull mirror and all 8 bull states
        run: python3 wave-rider-verify/wr_bull_mirror_hist_analyze.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr-bull-mirror-2022-2023-final
          path: /tmp/final
          retention-days: 14
