name: JJK Phonk VPN V3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/jjk-phonk-vpn-v3.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install media and network tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl openvpn iproute2 iptables
          python -m pip install -q -U yt-dlp numpy

      - name: Build isolated VPN namespace and profiles
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL --connect-timeout 15 --max-time 40 'https://www.vpngate.net/api/iphone/' -o vpngate.csv
          mkdir -p vpn_profiles
          python <<'PY'
          import csv,base64
          rows=[]
          with open('vpngate.csv',encoding='utf-8-sig',errors='replace',newline='') as f:
              for r in csv.reader(f):
                  if not r or r[0].startswith(('*','#')) or len(r)<15: continue
                  cc=r[6].strip().upper()
                  if cc not in {'VN','SG','JP','KR','TW'}: continue
                  try: score=int(r[2] or 0); cfg=base64.b64decode(r[14]).decode('utf-8','replace')
                  except Exception: continue
                  rows.append((cc,score,r[1],cfg))
          selected=[]
          for cc in ['VN','SG','JP','KR','TW']:
              selected += sorted((x for x in rows if x[0]==cc),key=lambda x:x[1],reverse=True)[:2]
          if not selected: raise SystemExit('No usable VPN Gate profile')
          with open('vpn_profiles/meta.tsv','w') as m:
              for i,(cc,score,ip,cfg) in enumerate(selected):
                  p=f'vpn_profiles/p{i:02d}_{cc}.ovpn'
                  open(p,'w').write(cfg.rstrip()+'\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 8\n')
                  m.write(f'{p}\t{cc}\t{score}\t{ip}\n')
          print(open('vpn_profiles/meta.tsv').read())
          PY

          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf
          sudo ip netns add vpnns
          sudo ip link add veth-host type veth peer name veth-vpn
          sudo ip link set veth-vpn netns vpnns
          sudo ip addr add 10.203.0.1/24 dev veth-host
          sudo ip link set veth-host up
          sudo ip netns exec vpnns ip addr add 10.203.0.2/24 dev veth-vpn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set veth-vpn up
          sudo ip netns exec vpnns ip route add default via 10.203.0.1
          sudo sysctl -w net.ipv4.ip_forward=1
          WAN_IF=$(ip route show default | awk '/default/ {print $5; exit}')
          sudo iptables -t nat -A POSTROUTING -s 10.203.0.0/24 -o "$WAN_IF" -j MASQUERADE
          sudo iptables -A FORWARD -i veth-host -o "$WAN_IF" -j ACCEPT
          sudo iptables -A FORWARD -i "$WAN_IF" -o veth-host -m state --state RELATED,ESTABLISHED -j ACCEPT
          echo "BASE_NS_EGRESS=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 12 https://api.ipify.org)"

      - name: Retrieve official JJK promotional footage
        shell: bash
        run: |
          set -euo pipefail
          YTDLP=$(command -v yt-dlp)
          SOURCES=(
            'https://www.youtube.com/watch?v=DKNM-3LpfZE|JJK_SENDAI_2026_OFFICIAL'
            'https://www.youtube.com/watch?v=VEjVqXiiUNY|JJK_EXECUTION_2025_OFFICIAL'
            'https://www.youtube.com/watch?v=O6qVieflwqs|JJK_S2_PV2_2023_OFFICIAL'
          )
          success=0
          while IFS=$'\t' read -r profile cc score ip; do
            [ -n "$profile" ] || continue
            echo "=== relay $cc score=$score ip=$ip ==="
            if [ -f /tmp/vpnns.pid ]; then sudo kill "$(cat /tmp/vpnns.pid)" 2>/dev/null || true; sleep 2; fi
            rm -f /tmp/vpnns.pid /tmp/vpnns.log
            sudo ip netns exec vpnns openvpn --config "$GITHUB_WORKSPACE/$profile" --daemon --writepid /tmp/vpnns.pid --log /tmp/vpnns.log || true
            ok=0
            for n in $(seq 1 18); do
              sudo ip netns exec vpnns ip link show tun0 >/dev/null 2>&1 && { ok=1; break; }
              sleep 1
            done
            if [ "$ok" != 1 ]; then tail -n 20 /tmp/vpnns.log || true; continue; fi
            egress=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 12 https://api.ipify.org || true)
            echo "VPN_EGRESS=$egress country=$cc"
            [ -n "$egress" ] || continue
            for entry in "${SOURCES[@]}"; do
              url=${entry%%|*}; label=${entry#*|}
              rm -f ytsrc.* anime_source.mp4
              echo "Trying $label"
              if timeout 120s sudo ip netns exec vpnns env PATH="$PATH" HOME="$HOME" \
                "$YTDLP" --no-playlist --retries 1 --fragment-retries 1 --socket-timeout 18 \
                --js-runtimes node --remote-components ejs:github \
                -f 'bv*[height<=1080]+ba/b[height<=1080]' --merge-output-format mp4 --remux-video mp4 \
                -o "$GITHUB_WORKSPACE/ytsrc.%(ext)s" "$url"; then
                f=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'ytsrc*.mp4' | head -n1)
                if [ -n "${f:-}" ] && [ -s "$f" ]; then
                  mv "$f" anime_source.mp4
                  echo "SOURCE_KIND=$label" >> "$GITHUB_ENV"
                  echo "SOURCE_VPN_COUNTRY=$cc" >> "$GITHUB_ENV"
                  echo "SOURCE_EGRESS=$egress" >> "$GITHUB_ENV"
                  success=1; break 2
                fi
              fi
            done
          done < vpn_profiles/meta.tsv
          [ "$success" = 1 ] || { echo 'No official JJK source could be retrieved'; exit 21; }
          [ -f /tmp/vpnns.pid ] && sudo kill "$(cat /tmp/vpnns.pid)" 2>/dev/null || true
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=nw=1 anime_source.mp4

      - name: Download phonk and estimate beat
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://archive.org/download/jamendo-621715/01-2294083-Waveloom-TikTok%20Phonk.mp3' -o phonk.mp3
          python <<'PY'
          import subprocess,numpy as np,json
          sr=8000
          b=subprocess.check_output(['ffmpeg','-hide_banner','-loglevel','error','-ss','8','-t','22','-i','phonk.mp3','-ac','1','-ar',str(sr),'-f','f32le','-'])
          x=np.frombuffer(b,dtype=np.float32)
          hop=256
          n=(len(x)//hop)*hop
          frames=x[:n].reshape(-1,hop)
          rms=np.sqrt(np.mean(frames*frames,axis=1)+1e-12)
          onset=np.maximum(0,np.diff(rms,prepend=rms[0])); onset-=onset.mean()
          lo=int(0.33*sr/hop); hi=int(0.67*sr/hop)
          vals=[]
          for lag in range(lo,hi+1): vals.append((float(np.dot(onset[:-lag],onset[lag:])),lag))
          _,lag=max(vals)
          beat=float(lag*hop/sr)
          beat=max(0.36,min(0.56,beat))
          json.dump({'beat_seconds':beat},open('beat.json','w'))
          print('BEAT_SECONDS',beat)
          PY

      - name: Select action moments and render V3
        shell: bash
        run: |
          set -euxo pipefail
          python <<'PY'
          import json,subprocess,numpy as np
          src='anime_source.mp4'; fps=6; w,h=256,144
          dur=float(json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',src]))['format']['duration'])
          p=subprocess.Popen(['ffmpeg','-hide_banner','-loglevel','error','-i',src,'-vf',f'scale={w}:{h},fps={fps}','-pix_fmt','gray','-f','rawvideo','-'],stdout=subprocess.PIPE)
          prev=None; scores=[]; i=0; n=w*h
          while True:
              b=p.stdout.read(n)
              if len(b)<n: break
              cur=np.frombuffer(b,np.uint8).reshape(h,w)
              if prev is not None:
                  d=np.abs(cur.astype(np.int16)-prev.astype(np.int16)).astype(np.float32)
                  t=i/fps; lum=float(cur.mean())
                  score=float(d.mean())*.60+float(np.percentile(d,90))*.40
                  if 1.4<t<dur-1.4 and 18<lum<238: scores.append((score,t))
              prev=cur; i+=1
          p.wait()
          picked=[]
          for score,t in sorted(scores,reverse=True):
              if all(abs(t-q[1])>0.9 for q in picked): picked.append((score,t))
              if len(picked)>=18: break
          if len(picked)<12: raise SystemExit(f'Only {len(picked)} action moments')
          # Offset after hard cuts so each clip opens inside the action shot.
          moments=[max(0,t+0.08) for _,t in picked[:18]]
          beat=json.load(open('beat.json'))['beat_seconds']
          json.dump({'moments':moments,'beat':beat},open('edit.json','w'),indent=2)
          print(open('edit.json').read())
          PY

          mkdir -p clips
          python <<'PY'
          import json,subprocess
          e=json.load(open('edit.json')); beat=float(e['beat'])
          for i,t in enumerate(e['moments']):
              d=beat
              flash="drawbox=x=0:y=0:w=iw:h=ih:color=white@0.14:t=fill:enable='lt(t,0.035)'," if i%4==0 else ''
              fc=(
                '[0:v]split=2[bg][fg];'
                '[bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=36,eq=brightness=-0.24:saturation=.72[bg2];'
                '[fg]scale=1024:576:force_original_aspect_ratio=decrease,pad=1024:576:(ow-iw)/2:(oh-ih)/2:black,eq=contrast=1.07:saturation=1.12,unsharp=5:5:.35:5:5:0[fg2];'
                '[bg2][fg2]overlay=(W-w)/2:(H-h)/2,'+flash+'fps=30,format=yuv420p[v]'
              )
              subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',f'{t:.3f}','-i','anime_source.mp4','-t',f'{d:.3f}','-filter_complex',fc,'-map','[v]','-an','-c:v','libx264','-preset','medium','-crf','18','-profile:v','high','-level','4.1','-pix_fmt','yuv420p',f'clips/c{i:02d}.mp4'])
          with open('concat.txt','w') as f:
              for i in range(len(e['moments'])): f.write(f"file 'clips/c{i:02d}.mp4'\n")
          PY
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i concat.txt -c copy visual.mp4
          ffmpeg -hide_banner -loglevel error -y -i visual.mp4 -ss 8 -i phonk.mp3 \
            -map 0:v:0 -map 1:a:0 -shortest -c:v copy \
            -af 'volume=.96,bass=g=3:f=90,alimiter=limit=.95' -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -movflags +faststart jjk_phonk_iphone_v3.mp4
          echo "SOURCE_KIND=${SOURCE_KIND:-unknown}"
          echo "SOURCE_VPN_COUNTRY=${SOURCE_VPN_COUNTRY:-unknown}"
          echo "SOURCE_EGRESS=${SOURCE_EGRESS:-unknown}"
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,sample_rate,channels -show_entries format=duration,size,bit_rate -of default=nw=1 jjk_phonk_iphone_v3.mp4

      - name: Upload V3
        uses: actions/upload-artifact@v4
        with:
          name: jjk-phonk-iphone-v3
          path: jjk_phonk_iphone_v3.mp4
          retention-days: 3
