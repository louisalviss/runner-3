name: SPMO 2025 Sanity Check
on:
  push:
    branches: [main]
    paths:
      - 'spmo-backtest/check_period.py'
      - 'spmo-backtest/data/2025-05-31_top_candidates.csv'
      - '.github/workflows/spmo-2025-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas yfinance
      - name: Reconstruct March 2025 top weight and returns
        run: python -u spmo-backtest/check_period.py --csv spmo-backtest/data/2025-05-31_top_candidates.csv --rebalance 2025-03-21 --snapshot 2025-05-31 --exit 2025-09-19 --output spmo-backtest/output/check_2025_results.csv
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spmo-2025-check-${{ github.run_id }}
          path: spmo-backtest/output/check_2025_results.csv
          if-no-files-found: warn
          retention-days: 7
