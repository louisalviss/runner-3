name: Narrator Video Benchmark v3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/narrator-video-benchmark-v3.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl fonts-noto-core
          python -m pip install -q -U edge-tts

      - name: Download source assets
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://download.blender.org/durian/trailer/sintel_trailer-720p.mp4' -o source.mp4
          curl -L --fail --retry 3 'https://archive.org/download/jamendo-621715/01-2294083-Waveloom-TikTok%20Phonk.mp3' -o bgm.mp3
          curl -L --fail --retry 3 'https://opengraph.githubassets.com/1/NarratorAI-Studio/narrator-ai-cli' -o repo-card.png || true

      - name: Generate neural voice and render
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/voice work/scenes artifacts
          python - <<'PY'
          import json, subprocess, os, textwrap

          lines = [
            "Bản trước tệ vì nó chỉ là slide ghép bằng FFmpeg.",
            "Trên runner ba, tôi có thể dùng footage thật, neural voice, nhạc nền và dựng dọc có chuyển động.",
            "Đây vẫn chưa phải backend Narrator AI, vì tài khoản hiện không có API key của dịch vụ đó.",
            "Nhưng khác biệt quan trọng là execution: runner có Internet và môi trường Linux đầy đủ để kéo asset và chạy pipeline video thật.",
            "Nếu footage và voice đầu vào tốt, chất lượng có thể tăng rất mạnh. Runner không phải phép màu, nhưng nó bỏ được giới hạn của bản dựng local trước."
          ]

          def sh(cmd):
              print('+', ' '.join(map(str,cmd)))
              subprocess.check_call(cmd)

          meta=[]
          for i,text in enumerate(lines,1):
              out=f'work/voice/v{i}.mp3'
              sh(['edge-tts','--voice','vi-VN-HoaiMyNeural','--rate=+14%','--text',text,'--write-media',out])
              dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',out],text=True).strip())
              meta.append({'i':i,'text':text,'duration':dur})

          starts=[8.0,18.0,30.0,42.0,54.0]
          for m,start in zip(meta,starts):
              i=m['i']; dur=m['duration']+0.12
              vf=(
                "scale=-2:1920,"
                "crop=1080:1920:x='(iw-ow)/2+22*sin(0.45*t)':y=0,"
                "eq=contrast=1.12:saturation=1.10:brightness=-0.02,"
                "unsharp=5:5:0.50:5:5:0.0,"
                "vignette=PI/5,fps=30,format=yuv420p"
              )
              out=f'work/scenes/s{i}.mp4'
              sh(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(start),'-i','source.mp4','-t',str(dur),'-an','-vf',vf,'-c:v','libx264','-preset','veryfast','-crf','20',out])

          # Repo card overlay on scene 3 so the video contains a real product visual, not only film footage.
          if os.path.exists('repo-card.png') and os.path.getsize('repo-card.png') > 1000:
              dur=meta[2]['duration']+0.12
              sh(['ffmpeg','-hide_banner','-loglevel','error','-y','-i','work/scenes/s3.mp4','-loop','1','-i','repo-card.png','-t',str(dur),
                  '-filter_complex',"[1:v]scale=900:-2,format=rgba,colorchannelmixer=aa=0.96[card];[0:v][card]overlay=(W-w)/2:(H-h)/2-90",
                  '-an','-c:v','libx264','-preset','veryfast','-crf','20','-pix_fmt','yuv420p','work/scenes/s3x.mp4'])
              os.replace('work/scenes/s3x.mp4','work/scenes/s3.mp4')

          with open('work/video.txt','w') as f:
              for i in range(1,6): f.write(f"file 'scenes/s{i}.mp4'\n")
          with open('work/audio.txt','w') as f:
              for i in range(1,6): f.write(f"file 'voice/v{i}.mp3'\n")

          def stamp(x):
              h=int(x//3600); x-=h*3600
              mm=int(x//60); x-=mm*60
              s=int(x); ms=int(round((x-s)*1000))
              if ms==1000: s+=1; ms=0
              return f'{h:02}:{mm:02}:{s:02},{ms:03}'
          t=0.0
          with open('work/subs.srt','w',encoding='utf-8') as f:
              for idx,m in enumerate(meta,1):
                  f.write(f"{idx}\n{stamp(t)} --> {stamp(t+m['duration'])}\n{m['text']}\n\n")
                  t += m['duration']+0.12
          json.dump(meta,open('work/meta.json','w'),ensure_ascii=False,indent=2)
          PY

          (cd work && ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i video.txt -c copy visual.mp4)
          (cd work && ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i audio.txt -c:a aac -b:a 192k narration.m4a)
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/visual.mp4)

          ffmpeg -hide_banner -loglevel error -y \
            -i work/visual.mp4 -i work/narration.m4a -ss 8 -stream_loop -1 -i bgm.mp3 \
            -filter_complex "[0:v]drawbox=x=0:y=0:w=iw:h=160:color=black@0.20:t=fill,drawtext=font='Noto Sans':text='RUNNER-3 VIDEO TEST':fontcolor=white:fontsize=42:x=58:y=54,subtitles=work/subs.srt:force_style='FontName=Noto Sans,FontSize=18,PrimaryColour=&H00FFFFFF,OutlineColour=&H90000000,BorderStyle=3,BackColour=&H78000000,Outline=1,Shadow=0,MarginV=145,Alignment=2'[v];[1:a]volume=1.0[voice];[2:a]volume=0.085,highpass=f=60,lowpass=f=12000[bg];[voice][bg]amix=inputs=2:duration=first:dropout_transition=2,alimiter=limit=0.94[a]" \
            -map '[v]' -map '[a]' -t "$DUR" \
            -c:v libx264 -preset medium -crf 22 -c:a aac -b:a 192k -movflags +faststart \
            artifacts/runner3_narrator_benchmark_v3.mp4

          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of default=nw=1 artifacts/runner3_narrator_benchmark_v3.mp4 | tee artifacts/runner3_narrator_benchmark_v3.txt
          ls -lh artifacts/runner3_narrator_benchmark_v3.mp4

      - name: Commit rendered artifact
        run: |
          set -euxo pipefail
          git config user.name 'runner-3-bot'
          git config user.email 'runner-3-bot@users.noreply.github.com'
          git add artifacts/runner3_narrator_benchmark_v3.mp4 artifacts/runner3_narrator_benchmark_v3.txt
          git commit -m 'Add runner-3 Narrator benchmark v3 output' || exit 0
          git push
