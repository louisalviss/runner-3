name: Runner3 Opportunity Radar Market V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/opportunity_radar_market_v2.py
      - .github/workflows/opportunity-radar-market-v2.yml
  schedule:
    # 21:02 UTC Mon-Fri = 04:02 Asia/Ho_Chi_Minh next day Tue-Sat.
    # In US DST this is ~62m after regular close; in standard time it is ~2m after close.
    # The NYSE-calendar + SPY preflight below waits for the latest completed session
    # to become visible before running the full universe scan, including holiday handling.
    - cron: '2 21 * * 1-5'

# Bootstrap trigger after the workflow exists on main.
concurrency:
  group: runner3-opportunity-radar-market-v2
  cancel-in-progress: false

jobs:
  scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install market scanner dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'requests>=2.32,<3' 'yfinance>=0.2.65,<0.3' 'curl-cffi>=0.7,<1' 'pandas-market-calendars>=4.4,<6'

      - name: Wait for latest completed NYSE session
        shell: bash
        run: |
          python - <<'PY'
          import time
          from datetime import datetime, timedelta, timezone

          import pandas_market_calendars as mcal
          import pandas as pd
          import yfinance as yf

          now = datetime.now(timezone.utc)
          cal = mcal.get_calendar('NYSE')
          start = (now - timedelta(days=14)).date().isoformat()
          end = (now + timedelta(days=1)).date().isoformat()
          schedule = cal.schedule(start_date=start, end_date=end)
          completed = schedule[schedule['market_close'] <= pd.Timestamp(now)]
          if completed.empty:
              raise SystemExit('No completed NYSE session found in lookback window')
          expected = completed.index[-1].date().isoformat()
          print(f'Expected latest completed NYSE session: {expected}')

          deadline = time.time() + 20 * 60
          last_seen = None
          while time.time() < deadline:
              df = yf.download(
                  'SPY', period='10d', interval='1d', auto_adjust=False,
                  actions=False, progress=False, threads=False, timeout=30,
              )
              if df is not None and not df.empty:
                  idx = df.index[-1]
                  last_seen = idx.date().isoformat() if hasattr(idx, 'date') else str(idx)[:10]
                  print(f'SPY latest session: {last_seen}')
                  if last_seen >= expected:
                      break
              time.sleep(60)
          else:
              raise SystemExit(
                  f'Market data not fresh before timeout: expected {expected}, last_seen {last_seen}'
              )
          PY

      - name: Run Opportunity Radar V2 market scanner
        run: python scripts/opportunity_radar_market_v2.py

      - name: Stage market outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opportunity-radar-market-v2
          path: |
            data/opportunity-radar/market-signals.json
            data/opportunity-radar/market-health.json
          if-no-files-found: error
          retention-days: 1

  persist:
    needs: scan
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Restore market outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opportunity-radar-market-v2
          path: data/opportunity-radar

      - name: Commit current market packet
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/opportunity-radar/market-signals.json data/opportunity-radar/market-health.json
          if git diff --cached --quiet; then
            echo 'No market output changes.'
            exit 0
          fi
          git commit -m 'Update Opportunity Radar V2 market signals [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          exit 1
