name: Cloudflare TARGET D1 Historical Write Metrics (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cf-target-d1-recent-write-metrics
  cancel-in-progress: false
jobs:
  recent-write-metrics:
    if: ${{ github.repository == 'louisalviss/runner-3' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test offline read-only contracts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare_target_d1_recent_write_metrics_readonly.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_target_d1_recent_write_metrics_readonly.py' -v
      - name: Read ONLY Cloudflare GraphQL D1 analytics
        env:
          CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/cloudflare_target_d1_recent_write_metrics_readonly.py
      - name: Keep sanitized counts only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-target-recent-write-metrics-readonly
          path: migration-out/target-d1-recent-write-metrics-readonly.json
          if-no-files-found: error
          retention-days: 2
