name: TradingView Trade Size DOM Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-trade-size-dom-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore session and source
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/session-state.json.aes -out /tmp/tv-state.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/wave-rider-v2.5.13-window-report.pine.aes -out /tmp/wr.pine
      - name: Inspect size nodes
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright-core');
          (async()=>{
            const exes=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium']; const executablePath=exes.find(p=>fs.existsSync(p));
            const state=JSON.parse(fs.readFileSync('/tmp/tv-state.json','utf8')), source=fs.readFileSync('/tmp/wr.pine','utf8');
            const b=await chromium.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']}); const c=await b.newContext({storageState:state,viewport:{width:1920,height:1080},permissions:['clipboard-read','clipboard-write']}); const out={};
            for(const [sym,needle] of [['BNBUSDT.P','3.23K'],['TRXUSDT.P','5.88M']]){
              const p=await c.newPage(); p.setDefaultTimeout(15000); await p.goto('https://www.tradingview.com/chart/?symbol=BINANCE%3A'+encodeURIComponent(sym)+'&interval=5',{waitUntil:'domcontentloaded',timeout:90000}); await p.waitForTimeout(9000);
              const pine=p.locator('[data-name="pine-dialog-button"]').first(); await pine.click(); await p.waitForTimeout(2500); const dlg=p.locator('[data-name="pine-dialog"]'),ta=dlg.locator('.monaco-editor textarea').last(); await ta.focus(); await p.keyboard.press('Control+A'); await p.evaluate(async s=>navigator.clipboard.writeText(s),source); await p.keyboard.press('Control+V'); await p.waitForTimeout(1500); await dlg.getByRole('button',{name:'Add to chart',exact:true}).first().click(); await p.waitForTimeout(25000);
              const trades=p.locator('[title="Trades"]').first(); if(await trades.count()) await trades.evaluate(e=>(e.closest('button')||e).click()); await p.waitForTimeout(3500);
              const nodes=await p.locator('body *').evaluateAll((els,needle)=>els.filter(e=>e.children.length===0 && (e.textContent||'').trim()===needle).slice(0,10).map((e,i)=>{let chain=[],x=e; for(let k=0;k<7 && x;k++,x=x.parentElement) chain.push({tag:x.tagName,text:(x.innerText||x.textContent||'').trim().replace(/\s+/g,' ').slice(0,500),title:x.getAttribute('title')||'',aria:x.getAttribute('aria-label')||'',data:[...x.attributes].filter(a=>a.name.startsWith('data-')).reduce((o,a)=>(o[a.name]=a.value,o),{}),cls:String(x.className||''),html:x.outerHTML.slice(0,5000)}); return {i,chain}}),needle);
              console.log('SIZE_DOM_'+sym+'='+JSON.stringify(nodes)); out[sym]=nodes; await p.close();
            }
            fs.writeFileSync('/tmp/size-dom.json',JSON.stringify(out,null,2)); await b.close();
          })().catch(e=>{console.error('TV_SIZE_DOM_ERROR='+e.stack);process.exit(8)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tradingview-size-dom-${{ github.run_id }}
          path: /tmp/size-dom.json
          retention-days: 2
      - if: always()
        run: rm -f /tmp/tv-state.json /tmp/wr.pine
