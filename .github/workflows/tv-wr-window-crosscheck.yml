name: TV WR Deterministic Anchor Crosscheck
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic WR test source
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/session-state.json.aes -out /tmp/tv-state.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/wr-window-report.pine.aes -out /tmp/wr.pine
          test "$(sha256sum /tmp/wr.pine | awk '{print $1}')" = "9156e8c49b9a5e36007620f3e17fcab26c06714a3e32a252be52437ae23d6026"
          python3 - <<'PY'
          p=open('/tmp/wr.pine').read()
          def rep(old,new,n=1):
              global p
              if p.count(old)<n: raise SystemExit('PATCH_MISSING: '+old[:120])
              p=p.replace(old,new,n)
          rep('strategy("Wave Rider Strategy v2.5.13 WINDOW REPORT", shorttitle="WR 2.5.13 WIN"','strategy("Wave Rider Strategy v2.5.13 DETERMINISTIC TEST", shorttitle="WR 2.5.13 DET"')
          rep('groupWindow="10. Window Report"\nstartTime=input.time(1785171600000,"Start (VN)",group=groupWindow)\nendTime=input.time(1786813200000,"End (VN, exclusive)",group=groupWindow)\nvalidWindow=endTime>startTime\nsignalInReportWindow=validWindow and time_close>=startTime and time_close<endTime', '''groupWindow="10. Deterministic Window"\nstateStartTime=input.time(1785171600000,"State Start (VN, deterministic)",group=groupWindow)\nstartTime=input.time(1786294800000,"Start (VN)",group=groupWindow)\nendTime=input.time(1786813200000,"End (VN, exclusive)",group=groupWindow)\nvar int firstDatasetTime=na\nif barstate.isfirst\n    firstDatasetTime:=time\nstateAnchorLoaded=not na(firstDatasetTime) and firstDatasetTime<=stateStartTime\nstateActive=stateAnchorLoaded and time>=stateStartTime\nvalidWindow=endTime>startTime\nsignalInReportWindow=stateActive and validWindow and time_close>=startTime and time_close<endTime\ndetClose=stateActive?close:na\ndetHigh=stateActive?high:na\ndetLow=stateActive?low:na\ndetTR=stateActive?(na(detClose[1])?high-low:math.max(high-low,math.abs(high-detClose[1]),math.abs(low-detClose[1]))):na''')
          rep('showAuditPanel=input.bool(false,"Show Engine Audit (debug)",group=groupStats)','showAuditPanel=input.bool(true,"Show Engine Audit (debug)",group=groupStats)')
          rep('ema21=ta.ema(close,emaLength)','ema21=ta.ema(detClose,emaLength)')
          rep('ph=ta.pivothigh(high,leftBars,rightBars)[1]','ph=ta.pivothigh(detHigh,leftBars,rightBars)[1]')
          rep('pl=ta.pivotlow(low,leftBars,rightBars)[1]','pl=ta.pivotlow(detLow,leftBars,rightBars)[1]')
          rep('belowCount:=close<ema21?nz(belowCount[1])+1:0','belowCount:=stateActive and not na(ema21) and close<ema21?nz(belowCount[1])+1:0')
          rep('aboveCount:=close>ema21?nz(aboveCount[1])+1:0','aboveCount:=stateActive and not na(ema21) and close>ema21?nz(aboveCount[1])+1:0')
          rep('atrAngle=ta.atr(atrPeriod)','atrAngle=ta.rma(detTR,atrPeriod)')
          rep('trSum=math.sum(ta.atr(1),chopLength)','trSum=math.sum(detTR,chopLength)')
          rep('priceRange=ta.highest(high,chopLength)-ta.lowest(low,chopLength)','priceRange=ta.highest(detHigh,chopLength)-ta.lowest(detLow,chopLength)')
          rep('signalATR=ta.atr(signalAtrLength)','signalATR=ta.rma(detTR,signalAtrLength)')
          rep('bool engineOK=canonOutcomeOK and canonExitOK and skippedNativeToCanon==0 and tpLockOK','bool engineOK=stateAnchorLoaded and canonOutcomeOK and canonExitOK and skippedNativeToCanon==0 and tpLockOK')
          rep('string engineText=engineOK?"✓ CLEAN":"! CHECK"','string engineText=not stateAnchorLoaded?"! ANCHOR":engineOK?"✓ CLEAN":"! CHECK"')
          open('/tmp/wr-det.pine','w').write(p)
          print('DET_SOURCE_SHA256='+__import__('hashlib').sha256(p.encode()).hexdigest())
          PY
      - name: Run exact 5m symbols
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright-core'); const out=[]; const log=x=>{out.push(x);console.log(x)};
          (async()=>{
            const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
            const state=JSON.parse(fs.readFileSync('/tmp/tv-state.json','utf8'));
            const browser=await chromium.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({storageState:state,viewport:{width:1920,height:1080},permissions:['clipboard-read','clipboard-write']});
            async function run(symbol,label,file){
              const page=await context.newPage(); await page.goto('https://www.tradingview.com/chart/?symbol='+encodeURIComponent('BINANCE:'+symbol)+'&interval=5',{waitUntil:'domcontentloaded',timeout:90000}); await page.waitForTimeout(12000);
              let body=await page.locator('body').innerText().catch(()=> ''); log(label+'_AUTH='+(!/\\bSign in\\b/i.test(body)?'PASS':'FAIL'));
              const pine=page.locator('[data-name="pine-dialog-button"],button[aria-label="Pine"]'); await pine.first().click({force:true}); await page.waitForTimeout(6500);
              const ta=page.locator('.monaco-editor textarea').last(); const source=fs.readFileSync('/tmp/wr-det.pine','utf8'); await page.evaluate(s=>navigator.clipboard.writeText(s),source); await ta.click({force:true}); await page.keyboard.press('Control+A'); await page.keyboard.press('Control+V'); await page.waitForTimeout(1800);
              const add=page.getByRole('button',{name:/Add to chart/i}); if(await add.count()) await add.first().click({force:true}); else {await ta.click({force:true});await page.keyboard.press('Control+Enter');}
              await page.waitForTimeout(24000); body=await page.locator('body').innerText().catch(()=> ''); log(label+'_COMPILE='+(/Compilation error|Syntax error|Error at/i.test(body)?'FAIL':'PASS'));
              const closes=page.locator('button[aria-label="Close"]'); for(let i=0;i<await closes.count();i++){const el=closes.nth(i);if(!await el.isVisible().catch(()=>false)) continue; const b=await el.boundingBox().catch(()=>null);if(b&&b.x>1500&&b.y<100){await el.click({force:true});break;}}
              await page.waitForTimeout(6000); await page.screenshot({path:file,fullPage:false}); await page.close();
            }
            await run('BNBUSDT.P','BNB','/tmp/bnb.png'); await run('TRXUSDT.P','TRX','/tmp/trx.png'); fs.writeFileSync('/tmp/result.txt',out.join('\\n')+'\\n'); await browser.close();
          })().catch(e=>{log('ERROR='+e.stack);fs.writeFileSync('/tmp/result.txt',out.join('\\n')+'\\n');process.exit(7)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-wr-deterministic-second-window
          path: |
            /tmp/bnb.png
            /tmp/trx.png
            /tmp/result.txt
          retention-days: 1
      - if: always()
        run: rm -f /tmp/tv-state.json /tmp/wr*.pine
