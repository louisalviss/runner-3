name: SPMO Archive Backtest
on:
  push:
    branches: [main]
    paths:
      - 'spmo-backtest/backtest_archive.py'
      - 'spmo-backtest/backtest_browse.py'
      - '.github/workflows/spmo-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spmo-archive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests yfinance beautifulsoup4 lxml html5lib
      - name: Run archive backtest
        run: python spmo-backtest/backtest_browse.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spmo-archive-${{ github.run_id }}
          path: spmo-backtest/output-archive/
          if-no-files-found: warn
          retention-days: 7
