name: SPMO reproduce Leto exact

on:
  push:
    paths:
      - '.github/workflows/spmo-reproduce-leto-exact.yml'

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce Leto table with Yahoo Adjusted Close
        run: |
          mkdir -p spmo-backtest/leto-source
          python - <<'PY'
          import json, urllib.request, datetime as dt, math
          from pathlib import Path
          seq=[
            ('2016-03-21','MSFT'),('2016-09-19','JNJ'),('2017-03-20','JPM'),('2017-09-18','MSFT'),
            ('2018-03-19','MSFT'),('2018-09-24','MSFT'),('2019-03-18','AMZN'),('2019-09-23','MSFT'),
            ('2020-03-23','AAPL'),('2020-09-21','MSFT'),('2021-03-22','AAPL'),('2021-09-20','GOOGL'),
            ('2022-03-21','GOOGL'),('2022-09-19','XOM'),('2023-03-20','XOM'),('2023-09-18','META'),
            ('2024-03-18','NVDA'),('2024-09-23','AMZN'),('2025-03-24','NVDA'),('2025-09-22','AVGO'),
            ('2026-03-23','NVDA')]
          end='2026-08-12'
          def ts(d): return int(dt.datetime.strptime(d,'%Y-%m-%d').replace(tzinfo=dt.timezone.utc).timestamp())
          cache={}
          def get(ticker):
            if ticker in cache:return cache[ticker]
            url=f'https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?period1={ts("2016-03-15")}&period2={ts("2026-08-15")}&interval=1d&events=div%2Csplits&includeAdjustedClose=true'
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            d=json.load(urllib.request.urlopen(req,timeout=30))['chart']['result'][0]
            mp={dt.datetime.fromtimestamp(t,dt.timezone.utc).strftime('%Y-%m-%d'):v for t,v in zip(d['timestamp'],d['indicators']['adjclose'][0]['adjclose']) if v is not None}
            cache[ticker]=mp;return mp
          rows=[]; multiple=1.0
          for i,(s,tkr) in enumerate(seq):
            e=seq[i+1][0] if i+1<len(seq) else end
            mp=get(tkr); a=mp[s]; b=mp[e]; r=b/a-1
            multiple*=1+r
            rows.append({'start':s,'end':e,'ticker':tkr,'start_adj':a,'end_adj':b,'return':r,'wealth':multiple})
          days=(dt.datetime.strptime(end,'%Y-%m-%d')-dt.datetime.strptime(seq[0][0],'%Y-%m-%d')).days
          years=days/365.2425
          cagr=multiple**(1/years)-1
          out={'sequence':rows,'start':seq[0][0],'end':end,'days':days,'years':years,'multiple':multiple,'total_return':multiple-1,'cagr':cagr,'leto_claim_multiple':21.7,'leto_claim_cagr':0.3456,'multiple_gap':multiple-21.7,'cagr_gap_pp':(cagr-.3456)*100,'price':'Yahoo Adjusted Close'}
          print('LETO_EXACT_BEGIN')
          print(json.dumps(out,indent=2))
          print('LETO_EXACT_END')
          Path('spmo-backtest/leto-source/leto_exact_reproduction.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          lines=['# Leto exact Top-1 reproduction','',f'- Window: {seq[0][0]} -> {end}',f'- Multiple: {multiple:.9f}x',f'- CAGR: {cagr:.9%}',f'- Claim: 21.7x / 34.56%',f'- Multiple gap: {multiple-21.7:.9f}x',f'- CAGR gap: {(cagr-.3456)*100:.6f} pp','', '| Start | End | Ticker | Return |','|---|---|---:|---:|']
          lines += [f"| {r['start']} | {r['end']} | {r['ticker']} | {r['return']:.6%} |" for r in rows]
          Path('spmo-backtest/leto-source/leto_exact_reproduction.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit result safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spmo-backtest/leto-source/leto_exact_reproduction.*
          git commit -m 'Add exact Leto Top-1 reproduction' || exit 0
          git pull --rebase origin main
          git push
