name: TradingView Temp Saved Canonical Ledger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-temp-saved-canonical-ledger.yml'
      - 'scripts/tradingview-temp-save-ledger-probe.js.txt'
      - 'scripts/tradingview-canonical-ledger-log-snippet.js.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BNBUSDT, TRXUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TV_SYMBOL: ${{ matrix.symbol }}
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BASE_SHA256: 9156e8c49b9a5e36007620f3e17fcab26c06714a3e32a252be52437ae23d6026
    steps:
      - uses: actions/checkout@v4

      - name: Restore canonical session and source
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/session-state.json.aes -out /tmp/tv-state.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/wave-rider-v2.5.13-window-report.pine.aes -out /tmp/wr2513.pine
          test "$(sha256sum /tmp/wr2513.pine | awk '{print $1}')" = "$BASE_SHA256"

      - name: Inject short report-only canonical log records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/wr2513.pine')
          s=p.read_text()
          anchor='            float canonicalCash=canonicalR*riskCash\n'
          if s.count(anchor)!=1:
              raise SystemExit(f'canonical cash anchor count={s.count(anchor)}')
          audit='            // PARITY PROBE ONLY: report/debug logging. Never read by execution.\n'
          audit+='            log.info("WRP1|n="+str.tostring(i+1)+"|em="+str.tostring(strategy.closedtrades.entry_time(i))+"|xm="+str.tostring(strategy.closedtrades.exit_time(i))+"|q="+str.tostring(tradeQty)+"|risk="+str.tostring(riskCash)+"|eq="+str.tostring(canonicalEquity))\n'
          audit+='            log.info("WRP2|n="+str.tostring(i+1)+"|pe="+str.tostring(planEntry)+"|ps="+str.tostring(planStop)+"|pt="+str.tostring(planTarget)+"|ae="+str.tostring(actualEntry)+"|ax="+str.tostring(actualExit))\n'
          audit+='            log.info("WRP3|n="+str.tostring(i+1)+"|r="+str.tostring(canonicalR)+"|x="+canonicalExit+"|rep="+(reportEligible?"1":"0")+"|mc="+str.tostring(syminfo.mincontract)+"|pv="+str.tostring(syminfo.pointvalue)+"|mt="+str.tostring(syminfo.mintick))\n'
          p.write_text(s.replace(anchor,audit+anchor,1))
          PY
          echo "EXPECTED_SHA256=$(sha256sum /tmp/wr2513.pine | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build compile-save-log browser probe
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/tradingview-wave-rider-e2e.mjs scripts/.tv-temp-save-ledger.mjs
          sed -i "s#BINANCE%3ABNBUSDT.P#BINANCE%3A${TV_SYMBOL}.P#" scripts/.tv-temp-save-ledger.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/.tv-temp-save-ledger.mjs')
          s=p.read_text()
          compile_anchor="  log('TV_E2E_UPDATE_ON_CHART',upd?'PRESENT':'ABSENT');log('TV_E2E_USER_TRANSLATE_200',tr?'PASS':'FAIL');log('TV_E2E_COMPILE_ERROR',cerr?'PRESENT':'ABSENT');\n  if(!upd||!tr||cerr)throw new Error('Compile/add failed');"
          if compile_anchor not in s:
              raise SystemExit('compile insertion anchor missing')
          save_probe=Path('scripts/tradingview-temp-save-ledger-probe.js.txt').read_text()
          log_probe=Path('scripts/tradingview-canonical-ledger-log-snippet.js.txt').read_text()
          s=s.replace(compile_anchor,compile_anchor+'\n'+save_probe+'\n'+log_probe+'\n',1)
          p.write_text(s)
          PY
          grep -q "BINANCE%3A${TV_SYMBOL}.P" scripts/.tv-temp-save-ledger.mjs

      - name: Run compiled temporary saved Pine ledger probe
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node scripts/.tv-temp-save-ledger.mjs

      - name: Require canonical Pine records
        shell: bash
        run: |
          set -euo pipefail
          F="/tmp/tv-canonical-ledger-${TV_SYMBOL}.txt"
          test -s "$F"
          LINES="$(grep -Ec 'WRP[123]\|' "$F" || true)"
          TRADES="$(grep -Eo 'WRP1\|n=[0-9]+' "$F" | sed 's/.*n=//' | sort -nu | wc -l)"
          echo "PINE_CANON_RECORDS=$LINES"
          echo "PINE_CANON_UNIQUE_TRADES=$TRADES"
          test "$TRADES" -ge 14

      - name: Upload exact canonical ledger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-temp-saved-ledger-${{ matrix.symbol }}-${{ github.run_id }}
          path: |
            /tmp/tv-canonical-ledger-${{ matrix.symbol }}.txt
            /tmp/tv-pine-log-body-${{ matrix.symbol }}.txt
            /tmp/tv-pine-log-scrollables-${{ matrix.symbol }}.json
            /tmp/tv-pine-editor-controls-${{ matrix.symbol }}.json
            /tmp/tv-pine-more-menu-${{ matrix.symbol }}.json
            /tmp/tv-pine-logs-${{ matrix.symbol }}.png
            /tmp/tv-save-dialog-body-${{ matrix.symbol }}.txt
            /tmp/tv-temp-script-name-${{ matrix.symbol }}.txt
            /tmp/wr2513-e2e-report.txt
          if-no-files-found: warn
          retention-days: 2

      - name: Cleanup local plaintext
        if: always()
        run: rm -f /tmp/tv-state.json /tmp/wr2513.pine scripts/.tv-temp-save-ledger.mjs
