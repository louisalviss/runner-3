name: TradingView Temp Saved Canonical Ledger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-temp-saved-canonical-ledger.yml'
      - 'scripts/tradingview-temp-save-ledger-probe.js.txt'
      - 'scripts/tradingview-canonical-ledger-log-snippet.js.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bnb-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TV_SYMBOL: BNBUSDT
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BASE_SHA256: 9156e8c49b9a5e36007620f3e17fcab26c06714a3e32a252be52437ae23d6026
    steps:
      - uses: actions/checkout@v4

      - name: Restore canonical session and source
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/session-state.json.aes -out /tmp/tv-state.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/wave-rider-v2.5.13-window-report.pine.aes -out /tmp/wr2513.pine
          test "$(sha256sum /tmp/wr2513.pine | awk '{print $1}')" = "$BASE_SHA256"

      - name: Inject report-only exact canonical logs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/wr2513.pine')
          s=p.read_text()
          anchor='            float canonicalCash=canonicalR*riskCash\n'
          if s.count(anchor)!=1:
              raise SystemExit(f'canonical cash anchor count={s.count(anchor)}')
          audit='            // PARITY PROBE ONLY: report/debug logging. Never read by execution.\n'
          audit+='            log.info("WRPARITY|n="+str.tostring(i+1)+"|entry_ms="+str.tostring(strategy.closedtrades.entry_time(i))+"|exit_ms="+str.tostring(strategy.closedtrades.exit_time(i))+"|qty="+str.tostring(tradeQty)+"|risk="+str.tostring(riskCash)+"|planE="+str.tostring(planEntry)+"|planS="+str.tostring(planStop)+"|planT="+str.tostring(planTarget)+"|actualE="+str.tostring(actualEntry)+"|actualX="+str.tostring(actualExit)+"|canonR="+str.tostring(canonicalR)+"|exit="+canonicalExit+"|report="+(reportEligible?"1":"0")+"|eqBefore="+str.tostring(canonicalEquity)+"|mincontract="+str.tostring(syminfo.mincontract)+"|pointvalue="+str.tostring(syminfo.pointvalue)+"|mintick="+str.tostring(syminfo.mintick)+"|nativePnl="+str.tostring(tradeProfitNative))\n'
          p.write_text(s.replace(anchor,audit+anchor,1))
          PY
          echo "EXPECTED_SHA256=$(sha256sum /tmp/wr2513.pine | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build temporary-save browser probe
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/tradingview-wave-rider-e2e.mjs scripts/.tv-temp-save-ledger.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/.tv-temp-save-ledger.mjs')
          s=p.read_text()
          save_anchor="  if(hash!==want)throw new Error('Editor hash mismatch');\n"
          if save_anchor not in s:
              raise SystemExit('save insertion anchor missing')
          save_probe=Path('scripts/tradingview-temp-save-ledger-probe.js.txt').read_text()
          s=s.replace(save_anchor,save_anchor+'\n'+save_probe+'\n',1)
          compile_anchor="  log('TV_E2E_UPDATE_ON_CHART',upd?'PRESENT':'ABSENT');log('TV_E2E_USER_TRANSLATE_200',tr?'PASS':'FAIL');log('TV_E2E_COMPILE_ERROR',cerr?'PRESENT':'ABSENT');\n  if(!upd||!tr||cerr)throw new Error('Compile/add failed');"
          if compile_anchor not in s:
              raise SystemExit('compile insertion anchor missing')
          log_probe=Path('scripts/tradingview-canonical-ledger-log-snippet.js.txt').read_text()
          s=s.replace(compile_anchor,compile_anchor+'\n'+log_probe+'\n',1)
          p.write_text(s)
          PY

      - name: Run temporary saved Pine ledger probe
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node scripts/.tv-temp-save-ledger.mjs

      - name: Require exact Pine ledger lines
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/tv-canonical-ledger-BNBUSDT.txt
          LINES="$(grep -c 'WRPARITY|' /tmp/tv-canonical-ledger-BNBUSDT.txt || true)"
          echo "PINE_CANON_LINES=$LINES"
          test "$LINES" -gt 0

      - name: Upload exact canonical ledger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-temp-saved-ledger-BNBUSDT-${{ github.run_id }}
          path: |
            /tmp/tv-canonical-ledger-BNBUSDT.txt
            /tmp/tv-pine-log-body-BNBUSDT.txt
            /tmp/tv-pine-editor-controls-BNBUSDT.json
            /tmp/tv-pine-more-menu-BNBUSDT.json
            /tmp/tv-pine-logs-BNBUSDT.png
            /tmp/tv-save-dialog-body-BNBUSDT.txt
            /tmp/tv-temp-script-name-BNBUSDT.txt
            /tmp/wr2513-e2e-report.txt
          if-no-files-found: warn
          retention-days: 2

      - name: Cleanup local plaintext
        if: always()
        run: rm -f /tmp/tv-state.json /tmp/wr2513.pine scripts/.tv-temp-save-ledger.mjs
