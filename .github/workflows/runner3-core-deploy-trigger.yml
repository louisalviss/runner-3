name: Trigger Runner3 Core Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/runner3-core/**'
      - '.github/workflows/runner3-core-deploy-trigger.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Deploy Runner3 Core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd workers/runner3-core
          wrangler deploy
