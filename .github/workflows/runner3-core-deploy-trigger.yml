name: Runner3 Core Deploy Trigger (Legacy, No Deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

# Retired legacy deploy path. The old workers/runner3-core tree no longer
# exists on main, and this workflow must never receive production credentials.
jobs:
  legacy-no-deploy:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'LEGACY_RUNNER3_CORE_TRIGGER_DISABLED=PASS'
          echo 'Production deploy owner: runner3-core-public-hosted-reader-deploy.yml'
