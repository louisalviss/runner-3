name: Cloudflare Capability Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare API capabilities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request

          token=os.environ['CLOUDFLARE_API_TOKEN']
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']

          def cf(path):
              req=urllib.request.Request(
                  'https://api.cloudflare.com/client/v4'+path,
                  headers={'Authorization': 'Bearer '+token}
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status
              except Exception as e:
                  return getattr(e, 'code', 0)

          result={
              'status':'ok',
              'services':{
                  'workers':cf(f'/accounts/{account}/workers/scripts'),
                  'pages':cf(f'/accounts/{account}/pages/projects'),
                  'kv':cf(f'/accounts/{account}/storage/kv/namespaces'),
                  'r2':cf(f'/accounts/{account}/r2/buckets'),
                  'd1':cf(f'/accounts/{account}/d1/database')
              }
          }

          print(json.dumps(result, indent=2))
          PY
