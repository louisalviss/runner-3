name: Reader v46 Single Boot Owner Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reader-v46-single-boot-owner-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch single boot owner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('cloudflare/runner3-core')
          v27 = root / 'artifact-library-reader-v27-boot-cfi-restore-entry.js'
          v35 = root / 'artifact-library-reader-v35-continuity-single-owner-entry.js'
          browser = root / 'reader-audio-core/browser-production-integration.js'
          adapter = root / 'reader-audio-core/reader-audio-adapter.js'

          def replace_region(source, start, end, replacement, label):
              a = source.find(start)
              if a < 0:
                  raise SystemExit(f'{label}: start marker missing')
              b = source.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f'{label}: end marker missing')
              return source[:a] + replacement + source[b:]

          s27 = v27.read_text(encoding='utf-8')
          boot = r'''const BOOT_SCRIPT = `<script data-r3-audio-boot-cfi-v27="1" data-r3-direct-restore-v45="1" data-r3-single-boot-owner-v46="1">
          (()=>{
            if(window.__r3AudioBootCfiRestoreV27)return;
            window.__r3AudioBootCfiRestoreV27=true;
            const params=new URLSearchParams(location.search);
            const bookKey=params.get('key')||'';
            if(!bookKey)return;
            const baseKey='r3-reader-position:'+bookKey;
            const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            const debug=window.__r3ReaderDirectRestoreV45||{phase:'boot',bookKey,startedAt:Date.now(),target:'',after:'',error:''};
            window.__r3ReaderDirectRestoreV45=debug;

            function currentCfi(){
              try{
                const b=window.r3ReaderBridge;
                const loc=b&&typeof b.current==='function'?b.current():null;
                return String(loc&&loc.start&&loc.start.cfi||'');
              }catch{return '';}
            }
            function savedReaderCfi(){
              try{return String(localStorage.getItem(baseKey)||'');}catch{return '';}
            }
            async function waitReaderStable(){
              let last='';
              let stable=0;
              for(let n=0;n<70;n++){
                const cfi=currentCfi();
                if(cfi){
                  stable=cfi===last?stable+1:0;
                  if(stable>=3)return cfi;
                  last=cfi;
                }else stable=0;
                await delay(80);
              }
              return currentCfi();
            }
            async function waitLayoutStable(){
              for(let n=0;n<45;n++){
                const state=window.__r3ReaderLayoutStabilizeV35;
                if(state&&state.phase==='stable')return true;
                await delay(80);
              }
              return false;
            }
            function finish(phase){
              debug.phase=phase;
              debug.after=currentCfi();
              debug.finishedAt=Date.now();
              window.__R3_READER_RESTORE_PENDING=false;
              document.documentElement.classList.remove('r3-restore-pending-v45');
              try{window.dispatchEvent(new CustomEvent('r3-reader-restore-ready-v45',{detail:{phase,cfi:debug.after,target:debug.target||''}}));}catch{}
            }

            (async()=>{
              debug.phase='observe-base-reader';
              debug.target=String(window.__r3ReaderRestoreTargetV45||savedReaderCfi()||'');
              const initial=currentCfi();
              const stable=await waitReaderStable();
              if(!stable){
                window.__r3AudioBootCfiV27Debug={phase:'timeout',target:debug.target||'',initial,current:'',reason:'base-reader'};
                finish('base-reader-timeout');
                return;
              }
              debug.after=stable;
              await waitLayoutStable();
              await delay(80);
              const after=currentCfi()||stable;
              debug.after=after;
              window.__r3AudioBootCfiV27Debug={phase:'restored',attempt:0,target:debug.target||'',initial,before:initial,after,stable:after,direct:false,owner:'base-reader-v46'};
              finish('ready');
            })().catch(error=>{
              debug.error=String(error&&error.message||error||'restore observe failed').slice(0,180);
              window.__r3AudioBootCfiV27Debug={phase:'timeout',target:debug.target||'',current:currentCfi(),reason:'observer',error:debug.error};
              finish('fallback-current-page');
            });
          })();
          </script>`;'''
          s27 = replace_region(s27, 'const BOOT_SCRIPT = `', '\n\nfunction patchBootCfiRestore', boot, 'v27')
          v27.write_text(s27, encoding='utf-8')

          s35 = v35.read_text(encoding='utf-8')
          stabilizer = r'''const V35_LAYOUT_STABILIZER = `<script data-r3-reader-layout-stabilize-v35="1" data-r3-observe-only-v46="1">
          (()=>{
            if(window.__r3ReaderLayoutStabilizeV35)return;
            const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            const vv=window.visualViewport||null;
            const debug=window.__r3ReaderLayoutStabilizeV35={phase:'boot',reason:'',repairs:0,lastGeometry:null,lastCfi:'',lastError:'',owner:'observe-only-v46'};
            let activeUntil=Date.now()+4500;
            let timer=0;
            let running=false;
            let pendingReason='';

            function bridge(){return window.r3ReaderBridge||null;}
            function currentCfi(){
              try{
                const b=bridge();
                const loc=b&&typeof b.current==='function'?b.current():null;
                return String(loc&&loc.start&&loc.start.cfi||'');
              }catch{return '';}
            }
            function geometry(){
              const viewer=document.getElementById('viewer');
              return {
                vw:Math.round(Number(vv&&vv.width||window.innerWidth||0)),
                vh:Math.round(Number(vv&&vv.height||window.innerHeight||0)),
                w:Math.round(Number(viewer&&viewer.clientWidth||0)),
                h:Math.round(Number(viewer&&viewer.clientHeight||0)),
              };
            }
            function sameGeometry(a,b){
              return Boolean(a&&b&&Math.abs(a.vw-b.vw)<=1&&Math.abs(a.vh-b.vh)<=1&&Math.abs(a.w-b.w)<=1&&Math.abs(a.h-b.h)<=1);
            }
            async function waitBridge(){
              for(let n=0;n<45;n++){
                if(document.hidden)return null;
                const b=bridge();
                if(b&&currentCfi())return b;
                await delay(80);
              }
              return bridge();
            }
            async function waitStableGeometry(){
              let last=null;
              let stable=0;
              for(let n=0;n<30;n++){
                if(document.hidden)return null;
                const next=geometry();
                if(next.w>100&&next.h>100&&next.vw>100&&next.vh>100){
                  stable=sameGeometry(last,next)?stable+1:0;
                  if(stable>=3)return next;
                }else stable=0;
                last=next;
                await delay(80);
              }
              return last;
            }
            async function waitStableCfi(){
              let last='';
              let stable=0;
              for(let n=0;n<24;n++){
                const cfi=currentCfi();
                if(cfi){
                  stable=cfi===last?stable+1:0;
                  if(stable>=2)return cfi;
                  last=cfi;
                }else stable=0;
                await delay(90);
              }
              return currentCfi();
            }
            async function repair(reason){
              if(running){pendingReason=reason;return;}
              running=true;
              try{
                debug.phase='waiting';debug.reason=reason;
                if(document.hidden)return;
                const fontReady=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
                await Promise.race([Promise.resolve(fontReady).catch(()=>{}),delay(900)]);
                const b=await waitBridge();
                if(!b)return;
                const stableGeometry=await waitStableGeometry();
                if(!stableGeometry)return;
                debug.phase='settling';
                const cfi=await waitStableCfi();
                if(!cfi)return;
                debug.lastGeometry=stableGeometry;
                debug.lastCfi=cfi;
                debug.repairs++;
                debug.phase='stable';
              }finally{
                running=false;
                if(pendingReason){const next=pendingReason;pendingReason='';schedule(next,120);}
              }
            }
            function schedule(reason,ms=160){
              if(document.hidden)return;
              clearTimeout(timer);
              timer=setTimeout(()=>repair(reason),ms);
            }
            function activate(reason){
              activeUntil=Date.now()+4500;
              schedule(reason,180);
            }

            if(vv)vv.addEventListener('resize',()=>{if(Date.now()<=activeUntil)schedule('visual-viewport',180);},{passive:true});
            window.addEventListener('pageshow',event=>activate(event.persisted?'pageshow-bfcache':'pageshow'));
            document.addEventListener('visibilitychange',()=>{if(!document.hidden)activate('visible');});
            activate('boot');
          })();
          </script>`;'''
          s35 = replace_region(s35, 'const V35_LAYOUT_STABILIZER = `', '\n\nconst V35_EARLY_AUDIO_RESERVE', stabilizer, 'v35')
          v35.write_text(s35, encoding='utf-8')

          sb = browser.read_text(encoding='utf-8')
          old_sig = '  async function prepareCurrent({ autoplay = false, allowSaved = true } = {}) {'
          new_sig = '  async function prepareCurrent({ autoplay = false, allowSaved = true, followOnMount = autoplay } = {}) {'
          if old_sig not in sb:
              raise SystemExit('browser prepareCurrent signature missing')
          sb = sb.replace(old_sig, new_sig, 1)
          prepare_start = sb.find(new_sig)
          prepare_end = sb.find('\n  window.__r3AudioCorePrepareCurrent = prepareCurrent;', prepare_start)
          if prepare_start < 0 or prepare_end < 0:
              raise SystemExit('browser prepareCurrent region missing')
          region = sb[prepare_start:prepare_end]
          marker = '        autoplay: false,\n'
          if marker not in region:
              raise SystemExit('browser prepareCurrent context marker missing')
          region = region.replace(marker, marker + '        followOnMount: Boolean(followOnMount),\n', 1)
          sb = sb[:prepare_start] + region + sb[prepare_end:]

          initial = r'''  async function initialRestore() {
            try {
              const saved = loadState();
              for (let n = 0; n < 140; n++) {
                const loc = bridge()?.current?.();
                const ready = Boolean(loc?.start?.cfi || loc?.start?.href);
                if (ready && !window.__R3_READER_RESTORE_PENDING) break;
                await sleep(80);
              }
              const loc = bridge()?.current?.();
              const liveCfi = String(loc?.start?.cfi || '');
              let readerCfi = '';
              try { readerCfi = String(localStorage.getItem(READER_POSITION_KEY) || ''); } catch {}
              const restoreCfi = liveCfi || readerCfi || saved.cfi || '';
              if (saved.mediaId) {
                let payload = null;
                let locationReady = false;
                for (let n = 0; n < 80; n++) {
                  const currentLoc = bridge()?.current?.();
                  payload = framePayload();
                  locationReady = Boolean(currentLoc?.start?.cfi || currentLoc?.start?.href);
                  if (locationReady && payload) break;
                  await sleep(80);
                }
                if (!locationReady || !payload) throw new Error('READER_CHAPTER_NOT_READY');
                const sameAudioChapter = Boolean(!saved.chapter || payload.chapter === saved.chapter);
                if (sameAudioChapter) await prepareCurrent({ autoplay: false, allowSaved: true, followOnMount: false });
                else syncUi({ ...saved, chapter: payload.chapter, mediaId: '', time: 0, cfi: restoreCfi, playingIntent: false });
              } else syncUi({ ...saved, cfi: restoreCfi, playingIntent: false });
            } catch (error) {
              debug.lastError = String(error?.message || error || 'restore failed').slice(0, 240);
            }
          }'''
          sb = replace_region(sb, '  async function initialRestore() {', '\n\n  initialRestore();', initial, 'browser initialRestore')
          browser.write_text(sb, encoding='utf-8')

          sa = adapter.read_text(encoding='utf-8')
          old_follow = '    await this.#syncMappedTarget(this.controller.snapshot(), { force: true });'
          new_follow = '    if (context.followOnMount !== false) await this.#syncMappedTarget(this.controller.snapshot(), { force: true });'
          if old_follow not in sa:
              raise SystemExit('adapter mount follow marker missing')
          sa = sa.replace(old_follow, new_follow, 1)
          adapter.write_text(sa, encoding='utf-8')

          smoke = root / 'reader-audio-core/reader-v46-single-boot-owner-smoke.mjs'
          smoke.write_text(r'''import fs from 'node:fs';
          import path from 'node:path';
          const root=path.resolve('cloudflare/runner3-core');
          const read=p=>fs.readFileSync(path.join(root,p),'utf8');
          const v27=read('artifact-library-reader-v27-boot-cfi-restore-entry.js');
          const v35=read('artifact-library-reader-v35-continuity-single-owner-entry.js');
          const browser=read('reader-audio-core/browser-production-integration.js');
          const adapter=read('reader-audio-core/reader-audio-adapter.js');
          const between=(src,a,b)=>src.slice(src.indexOf(a),src.indexOf(b,src.indexOf(a)));
          const boot=between(v27,'const BOOT_SCRIPT = `','function patchBootCfiRestore');
          if(!boot.includes('data-r3-single-boot-owner-v46="1"')) throw new Error('v27 v46 marker missing');
          if(/\.display\s*\(/.test(boot)||/\.next\s*\(/.test(boot)||/\.prev\s*\(/.test(boot)) throw new Error('v27 boot still moves reader');
          const stab=between(v35,'const V35_LAYOUT_STABILIZER = `','const V35_EARLY_AUDIO_RESERVE');
          if(!stab.includes('data-r3-observe-only-v46="1"')) throw new Error('v35 observe marker missing');
          if(/dispatchEvent\(new Event\(['"]resize/.test(stab)||/\.display\s*\(/.test(stab)) throw new Error('v35 stabilizer still repositions');
          const init=between(browser,'  async function initialRestore() {','  initialRestore();');
          if(/\.display\s*\(/.test(init)) throw new Error('audio initialRestore still displays CFI');
          if(!init.includes('followOnMount: false')) throw new Error('audio boot mount still follows');
          if(!adapter.includes('context.followOnMount !== false')) throw new Error('adapter mount follow guard missing');
          console.log('READER_V46_SINGLE_BOOT_OWNER=PASS');
          ''',encoding='utf-8')
          print('READER_V46_PATCH=PASS')
          PY

      - name: Regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/runner3-core/artifact-library-reader-v27-boot-cfi-restore-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          node --check cloudflare/runner3-core/reader-audio-core/reader-audio-adapter.js
          node cloudflare/runner3-core/reader-audio-core/reader-v46-single-boot-owner-smoke.mjs
          node cloudflare/runner3-core/reader-audio-core/core-smoke.mjs
          node cloudflare/runner3-core/reader-audio-core/adapter-smoke.mjs

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'reader-patch-bot'
          git config user.email 'reader-patch-bot@users.noreply.github.com'
          rm .github/workflows/reader-v46-single-boot-owner-patch.yml
          git add -A
          git commit -m 'fix(reader): single boot position owner v46'
          git push origin HEAD:main
