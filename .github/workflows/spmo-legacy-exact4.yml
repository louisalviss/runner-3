name: SPMO legacy exact-section audit 4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spmo-legacy-exact4.yml'
      - 'spmo-backtest/audit_legacy_exact_section.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: 2016-mar
            rb: '2016-03-18'
            snapshot: '2016-04-30'
            exit: '2016-09-16'
            accession: '0001193125-16-644489'
            url: 'https://www.sec.gov/Archives/edgar/data/1378872/000119312516644489/d176916dncsrs.htm'
          - key: 2016-sep
            rb: '2016-09-16'
            snapshot: '2016-10-31'
            exit: '2017-03-17'
            accession: '0001193125-17-002614'
            url: 'https://www.sec.gov/Archives/edgar/data/1378872/000119312517002614/d269293dncsr.htm'
          - key: 2017-mar
            rb: '2017-03-17'
            snapshot: '2017-04-30'
            exit: '2017-09-15'
            accession: '0001193125-17-221822'
            url: 'https://www.sec.gov/Archives/edgar/data/1378872/000119312517221822/0001193125-17-221822.txt'
          - key: 2017-sep
            rb: '2017-09-15'
            snapshot: '2017-10-31'
            exit: '2018-03-16'
            accession: '0001193125-18-002695'
            url: 'https://www.sec.gov/Archives/edgar/data/1378872/000119312518002695/d473179dncsr.htm'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pandas yfinance beautifulsoup4 lxml
      - name: Audit exact SPMO section
        run: >-
          python -u spmo-backtest/audit_legacy_exact_section.py
          --rb '${{ matrix.rb }}'
          --snapshot '${{ matrix.snapshot }}'
          --exit '${{ matrix.exit }}'
          --accession '${{ matrix.accession }}'
          --url '${{ matrix.url }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spmo-legacy-exact-${{ matrix.key }}-${{ github.run_id }}
          path: spmo-backtest/output/legacy_exact_${{ matrix.rb }}.csv
          if-no-files-found: warn
          retention-days: 14
