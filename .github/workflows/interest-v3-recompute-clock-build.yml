name: Interest v3 Recompute Clock Build

on:
  push:
    branches: [interest-v3-recompute-clock-20260908]
    paths:
      - ".github/workflows/interest-v3-recompute-clock-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interest-v3-recompute-clock-20260908
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch_interest_v3_recompute_clock.py
          node --check cloudflare/runner3-core/src/content-personalization.js
          python -m py_compile scripts/content_intelligence_client.py
          node scripts/verify_runner3_d1_quota_guards.mjs
          grep -q 'PROFILE_RECOMPUTE_CLOCK_KEY' cloudflare/runner3-core/src/content-personalization.js
          grep -q "NOT EXISTS(SELECT 1 FROM content_scores WHERE score_type='personal_relevance' AND model_version=?)" cloudflare/runner3-core/src/content-personalization.js
          grep -q 'materialization' scripts/content_intelligence_client.py
          ! grep -q "status='dirty' AND updated_at <= datetime('now',?)" cloudflare/runner3-core/src/content-personalization.js
          echo RECOMPUTE_CLOCK_VALIDATION_PASS
      - name: Commit product source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "runner3-ci-bot"
          git config user.email "runner3-ci-bot@users.noreply.github.com"
          git add cloudflare/runner3-core/src/content-personalization.js scripts/content_intelligence_client.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: decouple personalization recompute clock from dirty timestamp"
          git push origin HEAD:interest-v3-recompute-clock-20260908
