name: Runner3 Speed Clean Room WordPress

on:
  push:
    branches: [runner3-speed-cleanroom-20260820]
    paths:
      - '.github/workflows/runner3-speed-clean-room.yml'
      - 'scripts/runner3-speed-clean-room-astra.mjs'
      - 'scripts/runner3-speed-clean-room-preaudit.mjs'
      - 'scripts/provision-wordpress-site-v15.mjs'
      - 'scripts/runner5-astra-sample-import.mjs'
      - 'scripts/runner3-speed-ab-benchmark.mjs'
      - 'scripts/runner3-speed-safety-matrix.mjs'
      - 'wordpress/runner3-speed/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  WP_SITE_SLUG: runner3-speed-clean-lab-1
  WP_APP_NAME: runner3-speed-clean-lab-1

concurrency:
  group: runner3-speed-clean-room-lab
  cancel-in-progress: true

jobs:
  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static checks and package plugin
        run: |
          set -euo pipefail
          php -l wordpress/runner3-speed/runner3-speed.php
          php -l wordpress/runner3-speed/dropins/advanced-cache.php
          php -l wordpress/runner3-speed/uninstall.php
          node --check scripts/runner3-speed-clean-room-astra.mjs
          node --check scripts/runner3-speed-clean-room-preaudit.mjs
          node --check scripts/provision-wordpress-site-v15.mjs
          node --check scripts/runner5-astra-sample-import.mjs
          node --check scripts/runner3-speed-ab-benchmark.mjs
          node --check scripts/runner3-speed-safety-matrix.mjs
          (cd wordpress && zip -qr /tmp/runner3-speed.zip runner3-speed)
          test -s /tmp/runner3-speed.zip

      - name: Decrypt Wasmer state
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}"
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json

      - name: Install benchmark tooling
        run: npm install --no-save playwright-core@1.58.2 lighthouse@13.0.1

      - name: Provision or verify isolated WordPress app
        run: |
          set -euo pipefail
          cat >/tmp/clean.request.json <<'JSON'
          {"site_name":"Runner3 Speed Clean Lab 1","site_slug":"runner3-speed-clean-lab-1","app_name":"runner3-speed-clean-lab-1","domain_mode":"wasmer"}
          JSON
          SITE_FACTORY_REQUEST=/tmp/clean.request.json node scripts/provision-wordpress-site-v15.mjs
          cp /tmp/site-factory-v15-runner3-speed-clean-lab-1.json ops/site-factory/runner3-speed-clean-lab-1.json
          python - <<'PY'
          import json
          r=json.load(open('ops/site-factory/runner3-speed-clean-lab-1.json'))
          assert r['status']=='COMPLETE' and r['wpAdminReachable'] and r['wpApiReachable'], r
          assert r['httpCode'] and r['httpCode'] < 500, r
          print(json.dumps({'status':'PASS','site':r['siteUrl'],'reusedExistingApp':r['reusedExistingApp']},indent=2))
          PY

      - name: Install and activate Astra
        run: |
          set -euo pipefail
          node scripts/runner3-speed-clean-room-astra.mjs
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-clean-room-astra.json'))
          assert r['status']=='READY' and r['theme']=='astra', r
          print(json.dumps(r,indent=2))
          PY

      - name: Seed realistic Astra demo data
        run: |
          set -euo pipefail
          cp ops/site-factory/runner5-restore-lab-1.json /tmp/runner5-record.original.json
          cp ops/site-factory/runner3-speed-clean-lab-1.json ops/site-factory/runner5-restore-lab-1.json
          node scripts/runner5-astra-sample-import.mjs
          cp /tmp/runner5-record.original.json ops/site-factory/runner5-restore-lab-1.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner5-astra-sample.json'))
          assert r['status']=='READY' and r['theme']=='astra', r
          assert len(r['pages']) >= 5 and len(r['posts']) >= 8, r
          print(json.dumps({'status':'PASS','pages':len(r['pages']),'posts':len(r['posts']),'upstreamDemo':r['demoFetch']},indent=2))
          PY

      - name: State A - plugin absent
        run: |
          set -euo pipefail
          node scripts/runner3-speed-clean-room-preaudit.mjs
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-clean-room-a.json'))
          assert r['status']=='ready' and r['pluginAbsent'] is True and r['cloudflare'] is False, r
          print(json.dumps({'status':'PASS','curlTtfb':r['curl']['medianTtfbMs'],'browserTtfb':r['browser']['medianTtfbMs'],'browserLcp':r['browser']['medianLcpMs'],'lighthouse':r['lighthouse']['medianScore'],'lhLcp':r['lighthouse']['medianLcpMs']},indent=2))
          PY

      - name: States B and C - activated OFF vs Performance ON
        env:
          RUNNER3_PLUGIN_ZIP: /tmp/runner3-speed.zip
        run: |
          set -euo pipefail
          node scripts/runner3-speed-ab-benchmark.mjs
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-ab.json')); b=r['baseline']; c=r['optimized']; s=r['safety']
          assert r['status']=='ready' and r['cloudflare'] is False, r
          assert all(x.get('speed')=='HIT' and x.get('speedVersion')==r['pluginVersion'] for x in c['curl']['runs']), r
          assert all(x.get('speed')=='HIT' and x.get('speedVersion')==r['pluginVersion'] for x in c['browser']['runs']), r
          assert c['browser']['medianTtfbMs'] < b['browser']['medianTtfbMs'], r
          assert c['lighthouse']['medianScore'] >= b['lighthouse']['medianScore'], r
          assert c['lighthouse']['medianLcpMs'] <= b['lighthouse']['medianLcpMs'] + 100, r
          for k in ['installed','active','hit','queryBypass','apiBypass','adminBypass','off','productionUnchanged']: assert s[k], (k,r)
          print(json.dumps({'status':'PASS','version':r['pluginVersion'],'B_OFF':{'ttfb':b['browser']['medianTtfbMs'],'lcp':b['browser']['medianLcpMs'],'lh':b['lighthouse']['medianScore']},'C_ON':{'ttfb':c['browser']['medianTtfbMs'],'lcp':c['browser']['medianLcpMs'],'lh':c['lighthouse']['medianScore']},'delta':r['delta']},indent=2))
          PY

      - name: Extended safety matrix
        run: |
          set -euo pipefail
          node scripts/runner3-speed-safety-matrix.mjs
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-safety-matrix.json'))
          assert r['status']=='ready', r
          for k in ['currentHit','headHit','headEmptyBody','authCookieBypass','wooCartCookieBypass','wooSessionCookieBypass','cartPathBypass','checkoutPathBypass','accountPathBypass','wcApiPathBypass','deactivated','deactivateNoHit','reactivatedOff','finalNoHit']: assert r[k], (k,r)
          print(json.dumps({'status':'PASS','version':r['pluginVersion']},indent=2))
          PY

      - name: Aggregate A/B/C gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,datetime
          a=json.load(open('/tmp/runner3-speed-clean-room-a.json')); bc=json.load(open('/tmp/runner3-speed-ab.json')); sx=json.load(open('/tmp/runner3-speed-safety-matrix.json')); demo=json.load(open('/tmp/runner5-astra-sample.json')); site=json.load(open('ops/site-factory/runner3-speed-clean-lab-1.json'))
          b=bc['baseline']; c=bc['optimized']
          report={'status':'PASS','site':site,'theme':'astra','demo':{'pages':len(demo['pages']),'posts':len(demo['posts']),'upstreamFetch':demo['demoFetch']},'pluginVersion':bc['pluginVersion'],'states':{'A_no_plugin':{'curlTtfbMs':a['curl']['medianTtfbMs'],'browserTtfbMs':a['browser']['medianTtfbMs'],'browserFcpMs':a['browser']['medianFcpMs'],'browserLcpMs':a['browser']['medianLcpMs'],'lighthouseScore':a['lighthouse']['medianScore'],'lighthouseLcpMs':a['lighthouse']['medianLcpMs'],'cls':a['lighthouse']['medianCls']},'B_active_off':{'curlTtfbMs':b['curl']['medianTtfbMs'],'browserTtfbMs':b['browser']['medianTtfbMs'],'browserFcpMs':b['browser']['medianFcpMs'],'browserLcpMs':b['browser']['medianLcpMs'],'lighthouseScore':b['lighthouse']['medianScore'],'lighthouseLcpMs':b['lighthouse']['medianLcpMs'],'cls':b['lighthouse']['medianCls']},'C_performance_on':{'curlTtfbMs':c['curl']['medianTtfbMs'],'browserTtfbMs':c['browser']['medianTtfbMs'],'browserFcpMs':c['browser']['medianFcpMs'],'browserLcpMs':c['browser']['medianLcpMs'],'lighthouseScore':c['lighthouse']['medianScore'],'lighthouseLcpMs':c['lighthouse']['medianLcpMs'],'cls':c['lighthouse']['medianCls']}},'bcDelta':bc['delta'],'safety':sx,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          assert b['lighthouse']['medianScore'] >= a['lighthouse']['medianScore']-2, report
          assert b['lighthouse']['medianLcpMs'] <= a['lighthouse']['medianLcpMs']+200, report
          assert b['browser']['medianTtfbMs'] <= a['browser']['medianTtfbMs']*1.20, report
          json.dump(report,open('/tmp/runner3-speed-clean-room-report.json','w'),indent=2)
          print(json.dumps(report,indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner3-speed-clean-room-evidence
          path: |
            /tmp/site-factory-v15-runner3-speed-clean-lab-1.json
            /tmp/runner3-speed-clean-room-astra.json
            /tmp/runner5-astra-sample.json
            /tmp/runner3-speed-clean-room-a.json
            /tmp/runner3-speed-ab.json
            /tmp/runner3-speed-safety-matrix.json
            /tmp/runner3-speed-clean-room-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Persist checkpoint to branch
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,datetime
          def load(p):
            if not os.path.exists(p): return None
            try:return json.load(open(p))
            except Exception as e:return {'status':'unreadable','error':str(e)}
          site=load('/tmp/site-factory-v15-runner3-speed-clean-lab-1.json'); astra=load('/tmp/runner3-speed-clean-room-astra.json'); demo=load('/tmp/runner5-astra-sample.json'); a=load('/tmp/runner3-speed-clean-room-a.json'); bc=load('/tmp/runner3-speed-ab.json'); sx=load('/tmp/runner3-speed-safety-matrix.json'); final=load('/tmp/runner3-speed-clean-room-report.json')
          checkpoint={'status':'PASS' if final and final.get('status')=='PASS' else 'PARTIAL_OR_FAILED','site':site,'astra':astra,'demo':demo,'stateA':a,'ab':bc,'safety':sx,'final':final,'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          os.makedirs('ops/site-factory',exist_ok=True);json.dump(checkpoint,open('ops/site-factory/runner3-speed-clean-lab-1.clean-room.latest.json','w'),indent=2)
          if site:json.dump(site,open('ops/site-factory/runner3-speed-clean-lab-1.json','w'),indent=2)
          PY
          git config user.name 'runner3-speed-clean-room-bot'
          git config user.email 'runner3-speed-clean-room-bot@users.noreply.github.com'
          git add -- ops/site-factory/runner3-speed-clean-lab-1.clean-room.latest.json ops/site-factory/runner3-speed-clean-lab-1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: record Runner3 Speed clean-room evidence'
          git push origin HEAD:runner3-speed-cleanroom-20260820

      - name: Cleanup transient secrets
        if: always()
        run: rm -f /tmp/wasmer-account.json /tmp/runner3-speed.zip
