name: Runner3 Speed Clean Room WordPress

on:
  push:
    branches:
      - runner3-speed-cleanroom-20260820
    paths:
      - '.github/workflows/runner3-speed-clean-room.yml'
      - 'scripts/runner3-speed-clean-room-preaudit.mjs'
      - 'scripts/provision-wordpress-site-v15.mjs'
      - 'scripts/runner5-wordpress-retheme-v3.mjs'
      - 'scripts/runner5-astra-sample-import.mjs'
      - 'scripts/runner3-speed-ab-benchmark.mjs'
      - 'scripts/runner3-speed-safety-matrix.mjs'
      - 'wordpress/runner3-speed/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  WP_SITE_SLUG: runner3-speed-clean-lab-1
  WP_APP_NAME: runner3-speed-clean-lab-1

concurrency:
  group: runner3-speed-clean-room-lab
  cancel-in-progress: false

jobs:
  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static checks and package plugin
        run: |
          set -euo pipefail
          php -l wordpress/runner3-speed/runner3-speed.php
          php -l wordpress/runner3-speed/dropins/advanced-cache.php
          php -l wordpress/runner3-speed/uninstall.php
          node --check scripts/runner3-speed-clean-room-preaudit.mjs
          node --check scripts/provision-wordpress-site-v15.mjs
          node --check scripts/runner5-wordpress-retheme-v3.mjs
          node --check scripts/runner5-astra-sample-import.mjs
          node --check scripts/runner3-speed-ab-benchmark.mjs
          node --check scripts/runner3-speed-safety-matrix.mjs
          (cd wordpress && zip -qr /tmp/runner3-speed.zip runner3-speed)
          test -s /tmp/runner3-speed.zip

      - name: Decrypt Wasmer account state
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}"
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json

      - name: Install browser benchmark tooling
        run: npm install --no-save playwright-core@1.58.2 lighthouse@13.0.1

      - name: Provision brand-new WordPress site
        run: |
          set -euo pipefail
          cat >/tmp/runner3-speed-clean-lab-1.request.json <<'JSON'
          {
            "site_name": "Runner3 Speed Clean Lab 1",
            "site_slug": "runner3-speed-clean-lab-1",
            "app_name": "runner3-speed-clean-lab-1",
            "domain_mode": "wasmer"
          }
          JSON
          SITE_FACTORY_REQUEST=/tmp/runner3-speed-clean-lab-1.request.json node scripts/provision-wordpress-site-v15.mjs
          test -s /tmp/site-factory-v15-runner3-speed-clean-lab-1.json
          cp /tmp/site-factory-v15-runner3-speed-clean-lab-1.json ops/site-factory/runner3-speed-clean-lab-1.json
          python - <<'PY'
          import json
          p='ops/site-factory/runner3-speed-clean-lab-1.json'
          r=json.load(open(p))
          assert r['status']=='COMPLETE', r
          assert r['wpAdminReachable'] and r['wpApiReachable'], r
          assert r['httpCode'] and r['httpCode'] < 500, r
          print(json.dumps({'status':'PASS','siteUrl':r['siteUrl'],'reusedExistingApp':r['reusedExistingApp']},indent=2))
          PY

      - name: Install Astra and seed realistic demo content
        run: |
          set -euo pipefail
          cp ops/site-factory/runner5-restore-lab-1.json /tmp/runner5-record.original.json
          cp ops/site-factory/runner3-speed-clean-lab-1.json ops/site-factory/runner5-restore-lab-1.json

          set +e
          node scripts/runner5-wordpress-retheme-v3.mjs
          RETHEME_RC=$?
          set -e
          echo "official_starter_import_exit=$RETHEME_RC"

          node scripts/runner5-astra-sample-import.mjs
          test -s /tmp/runner5-astra-sample.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner5-astra-sample.json'))
          assert r['status']=='READY', r
          assert r['theme']=='astra', r
          assert len(r['pages']) >= 5, r
          assert len(r['posts']) >= 8, r
          print(json.dumps({'status':'PASS','theme':r['theme'],'pages':len(r['pages']),'posts':len(r['posts']),'demoFetch':r['demoFetch']},indent=2))
          PY
          cp /tmp/runner5-record.original.json ops/site-factory/runner5-restore-lab-1.json

      - name: State A - no Runner3 Speed installed
        env:
          WP_SITE_SLUG: runner3-speed-clean-lab-1
        run: |
          set -euo pipefail
          node scripts/runner3-speed-clean-room-preaudit.mjs
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-clean-room-a.json'))
          assert r['status']=='ready', r
          assert r['pluginAbsent'] is True, r
          assert r['cloudflare'] is False, r
          print(json.dumps({'status':'PASS','state':'A_NO_PLUGIN','curlTtfb':r['curl']['medianTtfbMs'],'browserTtfb':r['browser']['medianTtfbMs'],'lighthouse':r['lighthouse']['medianScore'],'lcp':r['lighthouse']['medianLcpMs']},indent=2))
          PY

      - name: States B/C - installed OFF vs Performance ON
        env:
          WP_SITE_SLUG: runner3-speed-clean-lab-1
          RUNNER3_PLUGIN_ZIP: /tmp/runner3-speed.zip
        run: |
          set -euo pipefail
          node scripts/runner3-speed-ab-benchmark.mjs
          test -s /tmp/runner3-speed-ab.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-ab.json'))
          assert r['status']=='ready', r
          assert r['cloudflare'] is False, r
          b=r['baseline']; o=r['optimized']; s=r['safety']
          assert all(x.get('speed')=='HIT' and x.get('speedVersion')==r['pluginVersion'] for x in o['curl']['runs']), r
          assert all(x.get('speed')=='HIT' and x.get('speedVersion')==r['pluginVersion'] for x in o['browser']['runs']), r
          assert o['browser']['medianTtfbMs'] < b['browser']['medianTtfbMs'], r
          assert o['lighthouse']['medianScore'] >= b['lighthouse']['medianScore'], r
          assert o['lighthouse']['medianLcpMs'] <= b['lighthouse']['medianLcpMs'] + 100, r
          for k in ['installed','active','hit','queryBypass','apiBypass','adminBypass','off','productionUnchanged']:
              assert s[k], (k,r)
          print(json.dumps({'status':'PASS','version':r['pluginVersion'],'B_OFF':{'ttfb':b['browser']['medianTtfbMs'],'lh':b['lighthouse']['medianScore'],'lcp':b['lighthouse']['medianLcpMs']},'C_ON':{'ttfb':o['browser']['medianTtfbMs'],'lh':o['lighthouse']['medianScore'],'lcp':o['lighthouse']['medianLcpMs']},'delta':r['delta']},indent=2))
          PY

      - name: Extended dynamic/private safety matrix
        env:
          WP_SITE_SLUG: runner3-speed-clean-lab-1
        run: |
          set -euo pipefail
          node scripts/runner3-speed-safety-matrix.mjs
          test -s /tmp/runner3-speed-safety-matrix.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-safety-matrix.json'))
          assert r['status']=='ready', r
          for k in ['currentHit','headHit','headEmptyBody','authCookieBypass','wooCartCookieBypass','wooSessionCookieBypass','cartPathBypass','checkoutPathBypass','accountPathBypass','wcApiPathBypass','deactivated','deactivateNoHit','reactivatedOff','finalNoHit']:
              assert r[k], (k,r)
          print(json.dumps({'status':'PASS','extendedSafety':r},indent=2))
          PY

      - name: Aggregate clean-room A/B/C result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, datetime
          a=json.load(open('/tmp/runner3-speed-clean-room-a.json'))
          bc=json.load(open('/tmp/runner3-speed-ab.json'))
          sx=json.load(open('/tmp/runner3-speed-safety-matrix.json'))
          site=json.load(open('ops/site-factory/runner3-speed-clean-lab-1.json'))
          b=bc['baseline']; c=bc['optimized']
          report={
            'status':'PASS',
            'site':site,
            'theme':'astra',
            'pluginVersion':bc['pluginVersion'],
            'states':{
              'A_no_plugin':{'curlTtfbMs':a['curl']['medianTtfbMs'],'browserTtfbMs':a['browser']['medianTtfbMs'],'browserFcpMs':a['browser']['medianFcpMs'],'browserLcpMs':a['browser']['medianLcpMs'],'lighthouseScore':a['lighthouse']['medianScore'],'lighthouseLcpMs':a['lighthouse']['medianLcpMs'],'cls':a['lighthouse']['medianCls']},
              'B_active_off':{'curlTtfbMs':b['curl']['medianTtfbMs'],'browserTtfbMs':b['browser']['medianTtfbMs'],'browserFcpMs':b['browser']['medianFcpMs'],'browserLcpMs':b['browser']['medianLcpMs'],'lighthouseScore':b['lighthouse']['medianScore'],'lighthouseLcpMs':b['lighthouse']['medianLcpMs'],'cls':b['lighthouse']['medianCls']},
              'C_performance_on':{'curlTtfbMs':c['curl']['medianTtfbMs'],'browserTtfbMs':c['browser']['medianTtfbMs'],'browserFcpMs':c['browser']['medianFcpMs'],'browserLcpMs':c['browser']['medianLcpMs'],'lighthouseScore':c['lighthouse']['medianScore'],'lighthouseLcpMs':c['lighthouse']['medianLcpMs'],'cls':c['lighthouse']['medianCls']},
            },
            'bcDelta':bc['delta'],
            'safety':sx,
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          # OFF must behave close to no-plugin baseline; allow normal hosting/Lighthouse noise, but reject material regressions.
          assert b['lighthouse']['medianScore'] >= a['lighthouse']['medianScore'] - 2, report
          assert b['lighthouse']['medianLcpMs'] <= a['lighthouse']['medianLcpMs'] + 200, report
          assert b['browser']['medianTtfbMs'] <= a['browser']['medianTtfbMs'] * 1.20, report
          json.dump(report,open('/tmp/runner3-speed-clean-room-report.json','w'),indent=2)
          print(json.dumps(report,indent=2))
          PY

      - name: Upload clean-room evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner3-speed-clean-room-evidence
          path: |
            /tmp/site-factory-v15-runner3-speed-clean-lab-1.json
            /tmp/runner5-wordpress-retheme.json
            /tmp/runner5-astra-sample.json
            /tmp/runner3-speed-clean-room-a.json
            /tmp/runner3-speed-ab.json
            /tmp/runner3-speed-safety-matrix.json
            /tmp/runner3-speed-clean-room-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove transient secrets and plugin ZIP
        if: always()
        run: rm -f /tmp/wasmer-account.json /tmp/runner3-speed.zip
