name: SEC discover SPMO legacy reports v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sec-discover-spmo-legacy-2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: List relevant Trust II filings
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://data.sec.gov/submissions/CIK0001378872-submissions-002.json'
          req=urllib.request.Request(url,headers={'User-Agent':'SPMO research'})
          with urllib.request.urlopen(req,timeout=30) as f: d=json.load(f)
          for acc,form,fd,rd,pd in zip(d['accessionNumber'],d['form'],d['filingDate'],d['reportDate'],d['primaryDocument']):
              if '2018-01-01' <= fd <= '2019-12-31':
                  if form in ('N-Q','N-CSR','N-CSRS') or form.startswith('NPORT') or ('2018-08-01' <= (rd or '') <= '2019-06-30'):
                      print(acc, form, 'filed',fd,'report',rd,'doc',pd)
          PY
