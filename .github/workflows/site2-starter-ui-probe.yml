name: Site2 Rejected Candidate Cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/site2-starter-ui-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner3-site2-optimization
  cancel-in-progress: false

env:
  SITE2_URL: https://runner3-wp-a94b8fd2.wasmer.app
  SITE_ID: site2
  FIXTURE_ID: astra-starter-organic-store-gutenberg
  CANDIDATE_ID: site2-organic-store-hero-preload-v1
  CANDIDATE_PLUGIN_SLUG: runner3-site2-hero-preload
  CANDIDATE_PRELOAD_ID: runner3-site2-hero-preload
  WP_OPTIMIZER_D1_DB: runner3-wp-optimizer
  WP_OPTIMIZER_WRANGLER_VERSION: '4.124.0'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Force rejected candidate OFF and verify
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.61.0 >/dev/null
          C="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$C"
          CHROME_PATH="$C" CANDIDATE_ACTION=deactivate CANDIDATE_OUT=/tmp/site2-rejected-cleanup.json node scripts/site2-candidate-toggle.mjs
          node -e '
            const d=require("/tmp/site2-rejected-cleanup.json");
            if(d.status!=="ready" || d.plugin?.active!==false || d.frontend?.preloadCount!==0 || d.frontend?.storeApiProducts<30 || d.frontend?.homeProductCards<8) throw new Error(`cleanup verification failed: ${JSON.stringify(d)}`);
            console.log("SITE2_REJECTED_CANDIDATE_OFF", JSON.stringify({plugin:d.plugin,frontend:d.frontend}));
          '
      - name: Restore canonical rejected status in D1
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/candidate-rejected.json <<JSON
          {"type":"candidate.upsert","candidate_id":"$CANDIDATE_ID","site_id":"$SITE_ID","kind":"lcp-resource-priority","parameters":{"fixture":"$FIXTURE_ID","strategy":"preload diagnosed CSS background LCP","canonical_status":"rejected","reason":"automatic PR rerun was confounded by bimodal origin warm/cold behavior; prior comparable A/B rollback remains canonical","confounded_workflow_run_id":"32925531916","canonical_rollback_workflow_run_id":"32923566960"},"commit_sha":"$SOURCE_SHA","status":"rejected"}
          JSON
          node scripts/wp-optimizer-state.mjs --event-file /tmp/candidate-rejected.json
          echo "SITE2_REJECTED_CANDIDATE_CLEANUP_OK"
