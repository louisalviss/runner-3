name: Audio Library Chat Intake

on:
  push:
    branches: [main]
    paths:
      - 'ops/audio-library/chat-intake/**/*.json'
      - 'ops/audio-library/chat-intake/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-audio-library-chat-intake
  cancel-in-progress: false

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUDIO_LIBRARY_BUCKET: runner3-wp-media
      AUDIO_LIBRARY_RETENTION_DAYS: '30'
      CHATGPT_INBOX_PUBLIC_KEY: sYGZHQp2jOgHK7mnuF+Yij8rZOxYbgxKNOP4okx0k3E=
      AUDIO_LIBRARY_EXTRACT_MAX_ITEMS: '3'
      AUDIO_LIBRARY_MAX_RAW_CHARS: '120000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source extraction dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -U requests beautifulsoup4 lxml pypdf yt-dlp 'cryptography>=45,<47'

      - name: Find new chat intake requests
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git show --pretty='' --name-only "$GITHUB_SHA" \
            | grep -E '^ops/audio-library/chat-intake/.*\.json$' \
            | sort -u > /tmp/audio-chat-intake-files.txt || true
          echo "count=$(wc -l < /tmp/audio-chat-intake-files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat /tmp/audio-chat-intake-files.txt

      - name: Enqueue URLs into shared Audio Library queue
        id: enqueue
        if: steps.changed.outputs.count != '0'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < /tmp/audio-chat-intake-files.txt
          python scripts/audio_library_chat_intake.py "${files[@]}" | tee /tmp/audio-chat-intake-result.json

      - name: Extract raw source and encrypt for ChatGPT
        id: extract
        if: steps.enqueue.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audio_library_extract_direct.py /tmp/audio-chat-intake-result.json | tee /tmp/audio-chatgpt-inbox-result.json

      - name: Publish checkpoint and encrypted inbox
        if: always() && steps.changed.outputs.count != '0'
        env:
          ENQUEUE_OUTCOME: ${{ steps.enqueue.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          result_path = Path('/tmp/audio-chat-intake-result.json')
          results = []
          if result_path.exists():
              try:
                  results = json.loads(result_path.read_text(encoding='utf-8')).get('results', [])
              except Exception:
                  results = []
          counts = {}
          ids = []
          for row in results:
              status = str(row.get('status') or 'unknown')
              counts[status] = counts.get(status, 0) + 1
              if row.get('id'):
                  ids.append(row['id'])
          extract_results = []
          extract_path = Path('/tmp/audio-chatgpt-inbox-result.json')
          if extract_path.exists():
              try:
                  extract_results = json.loads(extract_path.read_text(encoding='utf-8')).get('results', [])
              except Exception:
                  extract_results = []
          out = {
              'status': 'ready' if os.environ.get('ENQUEUE_OUTCOME') == 'success' else 'error',
              'workflowOutcome': os.environ.get('ENQUEUE_OUTCOME', 'unknown'),
              'extractOutcome': os.environ.get('EXTRACT_OUTCOME', 'skipped'),
              'sourceCommit': os.environ.get('GITHUB_SHA', ''),
              'processed': len(results),
              'counts': counts,
              'itemIds': ids[:20],
              'extractResults': extract_results[:10],
              'updatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          Path('ops/audio-library/chat-intake-status.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/audio-library/chat-intake-status.json
          git add ops/audio-library/chatgpt-inbox/*.json 2>/dev/null || true
          git commit -m 'Publish Audio Library chat intake and encrypted source' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Fail when enqueue or extract failed
        if: steps.enqueue.outcome == 'failure' || steps.extract.outcome == 'failure'
        run: exit 1
