name: PNTR Discover Claim Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pntr-discover-claim.yml'
      - 'scripts/pntr-cookie-precedence-test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted PNTR guest session
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || exit 2
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/pntr/browser-state.aes -out /tmp/pntr-browser-state.json
          chmod 600 /tmp/pntr-browser-state.json
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.58.2 >/dev/null
      - name: Test duplicate anon-cookie precedence
        run: node scripts/pntr-cookie-precedence-test.mjs
      - name: Cleanup
        if: always()
        run: rm -f /tmp/pntr-browser-state.json
