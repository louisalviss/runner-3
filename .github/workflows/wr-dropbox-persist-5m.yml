name: Persist WR 2.5.15 5m to Dropbox
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/wr-dropbox-persist-5m.yml']
permissions:
  contents: read
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download canonical GitHub artifact ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/louisalviss/runner-3/actions/artifacts/9332939735/zip" \
            -o /tmp/wr2515-5m-tv-tick-final.zip
          sha256sum /tmp/wr2515-5m-tv-tick-final.zip
      - name: Upload ZIP to Dropbox File Request
        shell: bash
        env:
          DROPBOX_REQUEST_URL: "https://www.dropbox.com/request/reg99ov2pvvpgyysjrl8"
          UPLOADER_EMAIL: "louisalviss3@gmail.com"
        run: |
          set -euo pipefail
          python3 -m pip install -q selenium
          cat > /tmp/upload.py <<'PY'
          import os,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.chrome.options import Options

          url=os.environ['DROPBOX_REQUEST_URL']
          f='/tmp/wr2515-5m-tv-tick-final.zip'
          email=os.environ['UPLOADER_EMAIL']
          filename=os.path.basename(f)
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=1440,1200')
          d=webdriver.Chrome(options=o)
          try:
              d.get(url)
              WebDriverWait(d,40).until(lambda x: x.execute_script('return document.readyState')=='complete')
              time.sleep(4)
              print('TITLE',d.title)

              # Activate Dropbox's normal Add files -> Files from computer flow first.
              add=WebDriverWait(d,20).until(lambda x: next((b for b in x.find_elements(By.XPATH,"//button|//*[@role='button']") if b.is_displayed() and 'add files' in (b.text or '').strip().lower()),None))
              d.execute_script('arguments[0].click()',add)
              time.sleep(1)
              comp=WebDriverWait(d,20).until(lambda x: next((b for b in x.find_elements(By.XPATH,"//button|//*[@role='button']|//*[@role='menuitem']") if b.is_displayed() and 'files from computer' in (b.text or '').strip().lower()),None))
              d.execute_script('arguments[0].click()',comp)
              time.sleep(1)

              # IMPORTANT: use the file input, never uploader-folder-field.
              inp=WebDriverWait(d,20).until(lambda x: x.find_element(By.ID,'uploader-file-field'))
              print('FILE_INPUT',inp.get_attribute('outerHTML'))
              inp.send_keys(f)
              time.sleep(3)
              cnt=d.execute_script('return arguments[0].files.length',inp)
              names=d.execute_script('return Array.from(arguments[0].files).map(x=>x.name)',inp)
              print('FILELIST',cnt,names)
              if cnt!=1 or filename not in names: raise RuntimeError('Correct file input did not retain ZIP')

              # Wait until Dropbox UI has acknowledged the selected filename.
              acknowledged=False
              for _ in range(30):
                  body=d.find_element(By.TAG_NAME,'body').text
                  if filename in body:
                      acknowledged=True;break
                  time.sleep(1)
              print('ACK_FILENAME',acknowledged)
              print('BODY_AFTER_SELECT',d.find_element(By.TAG_NAME,'body').text[-3000:])
              if not acknowledged: raise RuntimeError('Dropbox did not render selected filename')

              # Fill anonymous uploader identity if Dropbox asks for it.
              for el in d.find_elements(By.CSS_SELECTOR,'input'):
                  try:
                      if not el.is_displayed() or el.get_attribute('type')=='file': continue
                      typ=(el.get_attribute('type') or '').lower()
                      desc=((el.get_attribute('name') or '')+' '+(el.get_attribute('placeholder') or '')+' '+(el.get_attribute('aria-label') or '')).lower()
                      if typ=='email' or 'email' in desc:
                          if not el.get_attribute('value'): el.send_keys(email)
                      elif typ in ('text','') and any(k in desc for k in ['name','your name','full name']):
                          if not el.get_attribute('value'): el.send_keys('alviss louis')
                  except Exception as e: print('IDENTITY_ERR',repr(e))

              # Dropbox may label the final action Upload, Submit, or Upload 1 file.
              clicked=False
              for _ in range(30):
                  buttons=[]
                  for b in d.find_elements(By.XPATH,"//button|//*[@role='button']"):
                      try:
                          if b.is_displayed(): buttons.append(((b.text or '').strip(),b.is_enabled(),b))
                      except Exception: pass
                  print('BUTTONS',[(t,en) for t,en,_ in buttons])
                  for txt,en,b in buttons:
                      low=txt.lower()
                      if en and (low in {'upload','submit','send'} or low.startswith('upload ') or low.startswith('submit ')):
                          print('CLICK_FINAL',repr(txt))
                          d.execute_script('arguments[0].click()',b)
                          clicked=True;break
                  if clicked:break
                  time.sleep(1)
              if not clicked: raise RuntimeError('No enabled final upload control')

              ok=False
              for _ in range(120):
                  body=d.find_element(By.TAG_NAME,'body').text.lower()
                  if any(x in body for x in ['upload complete','uploaded successfully','files uploaded','thanks for uploading','finished uploading','successfully uploaded','upload another file']):
                      ok=True;print('SUCCESS_TEXT');break
                  time.sleep(2)
              print('FINAL_BODY',d.find_element(By.TAG_NAME,'body').text[-3000:])
              if not ok: raise RuntimeError('Upload submit did not reach success state')
          finally:
              d.quit()
          PY
          python3 /tmp/upload.py
