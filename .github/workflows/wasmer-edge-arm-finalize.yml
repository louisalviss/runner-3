name: Wasmer Edge ARM Finalize

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'ops/wasmer-edge-speed/requests/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-edge-arm-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WP_SITE_SLUG: runner3-factory-smoke-2
      WP_SITE_URL: https://runner3-factory-smoke-2.wasmer.app/
      SITE_URL: https://runner3-factory-smoke-2.wasmer.app/
      EDGE_HTTP_OUT: /tmp/edge-http-probe.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore Wasmer account
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-account.json

      - name: Build latest theme
        shell: bash
        run: |
          set -euo pipefail
          cd wordpress-site/wp-content/themes
          zip -qr /tmp/runner3-starter.zip runner3-starter
          test -s /tmp/runner3-starter.zip

      - name: Install ARM64 browser automation
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.61.0
          npx playwright install --with-deps chromium

      - name: Deploy latest main theme
        run: node scripts/deploy-wordpress-theme-v2.mjs

      - name: Verify live edge cache
        id: probe
        continue-on-error: true
        run: python scripts/probe-wordpress-edge.py

      - name: Persist immutable ARM finalize result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          deploy="/tmp/wp-theme-deploy-${WP_SITE_SLUG}.json"
          test -s "$deploy" || exit 2
          cp "$deploy" /tmp/deploy-safe.json
          probe_ok=false
          if [ -s /tmp/edge-http-probe.json ]; then cp /tmp/edge-http-probe.json /tmp/probe-safe.json; probe_ok=true; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/wp-theme-deploy/results/runs ops/wasmer-edge-speed/http-probes
            cp /tmp/deploy-safe.json "ops/wp-theme-deploy/results/runs/${WP_SITE_SLUG}.arm-${GITHUB_RUN_ID}.json"
            if [ "$probe_ok" = true ]; then cp /tmp/probe-safe.json "ops/wasmer-edge-speed/http-probes/${WP_SITE_SLUG}.arm-${GITHUB_RUN_ID}.json"; fi
            git add ops/wp-theme-deploy/results/runs ops/wasmer-edge-speed/http-probes
            git commit -m "Persist ARM edge finalize: ${WP_SITE_SLUG} run ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 3

      - name: Require verified edge reuse
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/edge-http-probe.json'))
          assert d.get('status') == 'passed', json.dumps(d,indent=2)
          print(json.dumps({'status':d['status'],'eligible':d['eligible'],'edgeReuseVerified':d['edgeReuseVerified'],'proof':d['proof'],'firstTtfbMs':d['persistent']['firstTtfbMs'],'warmMedianTtfbMs':d['persistent']['warmMedianTtfbMs'],'loginSafe':d['loginSafe'],'restSafe':d['restSafe']},indent=2))
          PY
