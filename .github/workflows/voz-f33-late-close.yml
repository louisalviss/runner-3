name: Tin VN · F33 Late Close Trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voz-f33-late-close.yml'
  schedule:
    # 22:45 Asia/Ho_Chi_Minh. Backup close snapshot for deterministic historical Radar.
    - cron: '45 15 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical F33 full crawl with intended date
        uses: actions/github-script@v7
        with:
          script: |
            function vnParts(d) {
              const parts = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Ho_Chi_Minh',
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
              }).formatToParts(d);
              return Object.fromEntries(parts.map(p => [p.type, p.value]));
            }
            function vnDateKey(d) {
              const p = vnParts(d);
              return `${p.year}-${p.month}-${p.day}`;
            }

            const now = new Date();
            const p = vnParts(now);
            const minutes = Number(p.hour) * 60 + Number(p.minute);
            const scheduledMinutes = 22 * 60 + 45;
            // If GitHub starts this scheduled trigger after midnight but before
            // the next 22:45 occurrence, it still belongs to yesterday's close.
            const targetDate = minutes < scheduledMinutes
              ? vnDateKey(new Date(now.getTime() - 24 * 60 * 60 * 1000))
              : vnDateKey(now);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'voz-f33-daily.yml',
              ref: context.ref.replace('refs/heads/', '') || 'main',
              inputs: {target_date: targetDate}
            });
            core.info(`Dispatched voz-f33-daily.yml late-close backup for ${targetDate}`);
