name: Tin VN · F33 Late Close Trigger

on:
  schedule:
    # 22:45 Asia/Ho_Chi_Minh. Backup close snapshot for deterministic historical Radar.
    - cron: '45 15 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical F33 full crawl with intended date
        uses: actions/github-script@v7
        with:
          script: |
            function vnParts(d) {
              const parts = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Ho_Chi_Minh',
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
              }).formatToParts(d);
              return Object.fromEntries(parts.map(p => [p.type, p.value]));
            }
            function vnDateKey(d) {
              const p = vnParts(d);
              return `${p.year}-${p.month}-${p.day}`;
            }

            const now = new Date();
            const p = vnParts(now);
            const hour = Number(p.hour);
            const currentDate = vnDateKey(now);
            const previousDate = vnDateKey(new Date(now.getTime() - 24 * 60 * 60 * 1000));

            // Only a genuinely delayed scheduled occurrence may claim yesterday,
            // and only inside the bounded 00:00-02:59 VN grace window.
            const targetDate = context.eventName === 'schedule' && hour < 3
              ? previousDate
              : currentDate;

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'voz-f33-daily.yml',
              ref: context.ref.replace('refs/heads/', '') || 'main',
              inputs: {target_date: targetDate}
            });
            core.info(`Dispatched voz-f33-daily.yml late-close backup for ${targetDate}`);
