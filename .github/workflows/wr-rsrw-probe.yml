name: WR RS Standalone Full Universe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wr-rsrw-probe.yml"
      - "apps/wave-rider-rsrw/rs_standalone_universe.py"

permissions:
  contents: read

concurrency:
  group: wr-rs-standalone-20260822
  cancel-in-progress: true

jobs:
  oracle:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wr-rsrw-research-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests websocket-client
      - name: Fetch frozen canonical crypto engine
        run: |
          set -euo pipefail
          mkdir -p /tmp/wr-canonical
          BASE="https://raw.githubusercontent.com/louisalviss/runner-3/d1e7e6e5dcfdc3423860fdce7f1ad84f652fe1eb/wave-rider-verify"
          curl -fsSL "$BASE/wr_canonical_crypto_5m.py" -o /tmp/wr-canonical/wr_canonical_crypto_5m.py
          curl -fsSL "$BASE/wr_tv_parity.py" -o /tmp/wr-canonical/wr_tv_parity.py
          curl -fsSL "https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py" -o /tmp/reference_verify.py
          python -m py_compile /tmp/wr-canonical/wr_canonical_crypto_5m.py /tmp/wr-canonical/wr_tv_parity.py /tmp/reference_verify.py
      - name: Assert canonical four-window oracle
        env:
          WR_OUT: /tmp/wr-oracle
        run: python /tmp/wr-canonical/wr_canonical_crypto_5m.py oracle

  shard:
    needs: oracle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wr-rsrw-research-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests websocket-client
      - name: Fetch frozen canonical crypto engine
        run: |
          set -euo pipefail
          mkdir -p /tmp/wr-canonical
          BASE="https://raw.githubusercontent.com/louisalviss/runner-3/d1e7e6e5dcfdc3423860fdce7f1ad84f652fe1eb/wave-rider-verify"
          curl -fsSL "$BASE/wr_canonical_crypto_5m.py" -o /tmp/wr-canonical/wr_canonical_crypto_5m.py
          curl -fsSL "$BASE/wr_tv_parity.py" -o /tmp/wr-canonical/wr_tv_parity.py
          curl -fsSL "https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py" -o /tmp/reference_verify.py
      - name: Run RS standalone full-universe shard
        env:
          WR_CANON_DIR: /tmp/wr-canonical
          WR_RS_STANDALONE_OUT: /tmp/wr-rs-standalone
          WR_RS_LENGTHS: 10,21,50
          WR_RS_SHARD: ${{ matrix.shard }}
          WR_RS_SHARDS: "8"
        run: python apps/wave-rider-rsrw/rs_standalone_universe.py shard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-rs-standalone-shard-${{ matrix.shard }}
          path: /tmp/wr-rs-standalone/
          retention-days: 14
          if-no-files-found: error

  merge:
    needs: shard
    if: always() && needs.shard.result != 'cancelled'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wr-rsrw-research-20260822
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: wr-rs-standalone-shard-*
          path: /tmp/all
          merge-multiple: false
      - name: Merge RS standalone results
        env:
          WR_RS_MERGE_ROOT: /tmp/all
          WR_RS_FINAL_OUT: /tmp/final
          WR_RS_LENGTHS: 10,21,50
          WR_RS_SHARDS: "8"
        run: python apps/wave-rider-rsrw/rs_standalone_universe.py merge
      - uses: actions/upload-artifact@v4
        with:
          name: wr-rs-standalone-final-${{ github.run_id }}
          path: /tmp/final/
          retention-days: 30
          if-no-files-found: error
