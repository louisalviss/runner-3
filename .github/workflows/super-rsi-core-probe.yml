name: Private Backtest Crypto Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/super-rsi-core-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q 'cryptography>=45,<47'
      - name: Derive public key only
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          seed=hashlib.sha256(b'runner3-audio-library-chatgpt-bridge-v1\0'+os.environ['CLOUDFLARE_API_TOKEN'].encode()).digest()
          pub=X25519PrivateKey.from_private_bytes(seed).public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          print('DERIVED_PUBLIC_KEY='+base64.b64encode(pub).decode())
          PY
