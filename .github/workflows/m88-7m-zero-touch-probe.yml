name: M88 7M zero-touch probe

on:
  push:
    paths:
      - '.github/workflows/m88-7m-zero-touch-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Chromium
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install --with-deps chromium

      - name: Capture rendered public 7M data
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio, json, re, time
          from playwright.async_api import async_playwright

          DETAIL='https://live.7msport.com/odds/en/odds.shtml?id=5024390'
          LIVE=[
            'https://live.7msport.com/default_odds_en.aspx?view=all&line=no',
            'https://live.7msport.com/default_en2.aspx?line=no&view=livebetting',
            'https://live.7msport.com/lbpk_live_en.aspx?line=no',
            'https://live.7msport.com/'
          ]
          out={'timestamp_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'detail':{},'live_pages':[],'responses':[],'response_hits':[]}
          seen=set()

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              ctx=await browser.new_context()
              page=await ctx.new_page()

              async def inspect_response(resp):
                url=resp.url
                low=url.lower()
                if '7m' not in low or url in seen: return
                if not any(k in low for k in ['odds','live','score','data','ajax','fixture','result','.js']): return
                seen.add(url)
                rec={'url':url,'status':resp.status,'type':resp.request.resource_type}
                try:
                  ct=(await resp.all_headers()).get('content-type','')
                  rec['content_type']=ct
                except: pass
                out['responses'].append(rec)
                if len(out['response_hits'])>=30: return
                try:
                  body=await resp.text()
                  if len(body)>2000000: return
                  ids=sorted(set(re.findall(r'(?:id=|matchid["\']?\s*[:=]\s*["\']?)(\d{5,10})',body,re.I)))[:30]
                  m=re.search(r'\bMansion88\b|\bM88\b',body,re.I)
                  if m or ids:
                    hit={'url':url,'status':resp.status,'ids':ids,'m88':bool(m)}
                    if m: hit['snippet']=re.sub(r'\s+',' ',body[max(0,m.start()-300):m.start()+900])
                    out['response_hits'].append(hit)
                except: pass

              page.on('response', lambda r: asyncio.create_task(inspect_response(r)))

              r=await page.goto(DETAIL,wait_until='domcontentloaded',timeout=45000)
              await page.wait_for_timeout(9000)
              body=await page.locator('body').inner_text()
              i=body.lower().find('mansion88')
              out['detail']={'status':r.status if r else None,'title':await page.title(),'mansion88':i>=0,'snippet':re.sub(r'\s+',' ',body[max(0,i-250):i+650]) if i>=0 else '', 'body_chars':len(body)}

              for u in LIVE:
                try:
                  rr=await page.goto(u,wait_until='domcontentloaded',timeout=45000)
                  await page.wait_for_timeout(7000)
                  body=await page.locator('body').inner_text()
                  html=await page.content()
                  hrefs=await page.locator('a').evaluate_all("els => els.map(e => e.href).filter(Boolean)")
                  ids=set()
                  for s in hrefs+[html]:
                    ids.update(re.findall(r'(?:[?&]id=|/)(\d{6,10})(?:\D|$)',s,re.I))
                  odds_links=[h for h in hrefs if '/odds/' in h.lower() or 'odds.shtml?id=' in h.lower()]
                  out['live_pages'].append({'url':u,'status':rr.status if rr else None,'body_chars':len(body),'match_ids':sorted(ids)[:100],'odds_links':list(dict.fromkeys(odds_links))[:100],'body_sample':re.sub(r'\s+',' ',body[:1800])})
                except Exception as e:
                  out['live_pages'].append({'url':u,'error':repr(e)})

              await page.wait_for_timeout(3000)
              await browser.close()

          asyncio.run(main())
          print(json.dumps(out,ensure_ascii=False,indent=2))
          open('/tmp/m88-7m.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          python3 /tmp/probe.py | tee /tmp/m88-7m.log

      - uses: actions/upload-artifact@v4
        with:
          name: m88-7m-${{ github.run_id }}
          path: |
            /tmp/m88-7m.json
            /tmp/m88-7m.log
          retention-days: 3
