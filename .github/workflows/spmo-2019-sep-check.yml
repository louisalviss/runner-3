name: SPMO Sep 2019 Check
on:
  push:
    branches: [main]
    paths:
      - 'spmo-backtest/run_single_nport.py'
      - '.github/workflows/spmo-2019-sep-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pandas yfinance
      - name: Reconstruct September 2019 top weight and returns
        run: python -u spmo-backtest/run_single_nport.py --accession 0001752724-20-015634 --rebalance 2019-09-20 --snapshot 2019-11-30 --exit 2020-03-20 --output spmo-backtest/output/check_2019_sep.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spmo-2019-sep-${{ github.run_id }}
          path: spmo-backtest/output/check_2019_sep.csv
          if-no-files-found: warn
          retention-days: 7
