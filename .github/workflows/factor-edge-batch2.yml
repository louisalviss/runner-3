name: Factor Edge Batch2 Low Risk

on:
  push:
    branches: [main]
    paths:
      - 'research/factor_edge_search_20260824/batch2_price.py'
      - '.github/workflows/factor-edge-batch2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/factor_edge_search_20260824/batch2_price.py'
      - '.github/workflows/factor-edge-batch2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FACTOR_OUT: artifacts/factor_edge_batch2_20260824
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy pandas requests
      - name: Run frozen follow-up
        run: python research/factor_edge_search_20260824/batch2_price.py
      - uses: actions/upload-artifact@v4
        with:
          name: factor-edge-batch2-20260824
          path: artifacts/factor_edge_batch2_20260824/
          if-no-files-found: error
      - name: Commit result
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/factor_edge_batch2_20260824/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record low-risk factor follow-up"
          git push
