name: Site1 LCP 0.90 Production V3

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runner3wp-production-lcp090-v3
  cancel-in-progress: true

env:
  PROD_DOMAIN: https://runner3wp.pntr.dev
  ROLLBACK_SHA: 9124f5957e176ffc9aa64444c980f3c5d6642a0d

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare q74 inline-mobile candidate
        id: prep
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo REJECT > /tmp/verdict
          curl -fsS -D /tmp/base-hero.h -o /tmp/hero.webp "$PROD_DOMAIN/__runner3/r2-image/offset-demo-01-w640.webp?capture=$(date +%s%N)"
          grep -Eiq '^content-type:[[:space:]]*image/webp' /tmp/base-hero.h
          npm install --no-save sharp@0.34.3 playwright-core@1.61.0 >/dev/null

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import sharp from 'sharp';
          const out='/tmp/mobile-hero.webp';
          await sharp('/tmp/hero.webp').resize({width:320,withoutEnlargement:true}).webp({quality:74,effort:6,smartSubsample:true}).toFile(out);
          const m=await sharp(out).metadata();
          const pick={q:74,size:fs.statSync(out).size,width:m.width,height:m.height};
          console.log('HERO_PICK',JSON.stringify(pick));
          if(pick.size>12000 || pick.width!==320 || pick.height<200) throw new Error('q74 hero invariant failed');
          NODE

          python3 - <<'PY'
          from pathlib import Path
          p=Path('edge/wordpress-edge-proxy/src/entry.js')
          s=p.read_text()
          head='element.prepend(`<link rel="dns-prefetch" href="//${R2_HOST}"><link rel="preconnect" href="${R2_ORIGIN}" crossorigin>`, { html: true });'
          header="headers.append('Link', `<${R2_ORIGIN}>; rel=preconnect; crossorigin`);"
          assert head in s
          assert header in s
          s=s.replace(head,'// R2 external preconnect removed from critical path.',1)
          s=s.replace(header,'// R2 external Link preconnect removed from critical path.',1)
          p.write_text(s)
          PY
          node --check edge/wordpress-edge-proxy/src/entry.js
          node scripts/build-wordpress-edge-snapshot.mjs

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const path='edge/wordpress-edge-proxy/src/snapshot.generated.js';
          const source=fs.readFileSync(path,'utf8');
          const m=source.match(/export const SNAPSHOT_BUILT_AT = ([^;]+);\nexport const SNAPSHOTS = Object\.freeze\(([\s\S]+)\);\n?$/);
          if(!m) throw new Error('snapshot parse failed');
          const builtAt=JSON.parse(m[1]);
          const snapshots=JSON.parse(m[2]);
          let html=snapshots['/'];
          const data=fs.readFileSync('/tmp/mobile-hero.webp').toString('base64');
          let replaced=false;
          html=html.replace(/<img\b[^>]*offset-demo-01[^>]*>/gi,(tag)=>{
            if(replaced) return tag;
            replaced=true;
            return `<picture data-runner3-mobile-inline-lcp="v3"><source media="(max-width: 767px)" srcset="data:image/webp;base64,${data}">${tag}</picture>`;
          });
          if(!replaced) throw new Error('hero not found');
          html=html.replace(/<link\b[^>]*rel=["']preload["'][^>]*as=["']image["'][^>]*offset-demo-01[^>]*>/gi,'');
          snapshots['/']=html;
          const serialized=JSON.stringify(snapshots).replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
          fs.writeFileSync(path,[
            '// Generated immediately before Cloudflare deployment. Do not hand-edit.',
            `export const SNAPSHOT_BUILT_AT = ${JSON.stringify(builtAt)};`,
            `export const SNAPSHOTS = Object.freeze(${serialized});`,
            '',
          ].join('\n'));
          console.log('HOME_BYTES',Buffer.byteLength(html));
          NODE

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('edge/wordpress-edge-proxy/wrangler.v2.jsonc','utf8'));
          d.name='wordpress-edge-proxy';
          fs.writeFileSync('edge/wordpress-edge-proxy/wrangler.prod-lcp090-v3.jsonc',JSON.stringify(d,null,2)+'\n');
          NODE
          C="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$C"
          echo "CHROME_PATH=$C" >> "$GITHUB_ENV"
          mkdir -p scripts
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/runner3wp-v2-fcp-test/scripts/pagespeed-ui-mobile-audit.mjs' -o scripts/pagespeed-ui-mobile-audit.mjs

      - name: Deploy candidate
        id: deploy
        if: steps.prep.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.124.0 deploy --config edge/wordpress-edge-proxy/wrangler.prod-lcp090-v3.jsonc >/tmp/deploy.log 2>&1
          touch /tmp/deployed
          sleep 5

      - name: Functional and responsive guard
        id: guard
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            B="__lcp090v3=$(date +%s%N)-$attempt"
            if curl -fsS -H 'Cache-Control: no-cache' -D /tmp/h -o /tmp/home "$PROD_DOMAIN/?$B" \
              && grep -Eiq '^x-edge-snapshot:[[:space:]]*HIT' /tmp/h \
              && grep -Eiq '^x-edge-cache-policy:[[:space:]]*snapshot-direct' /tmp/h \
              && grep -q 'data-runner3-mobile-inline-lcp="v3"' /tmp/home; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" = 1
          if grep -Eiq '^link:.*r2\.dev.*preconnect' /tmp/h; then exit 8; fi

          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
          async function probe(width,height){
            const page=await browser.newPage({viewport:{width,height}});
            await page.goto(process.env.PROD_DOMAIN+'/?__guard='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            const x=await page.evaluate(()=>{
              const p=document.querySelector('[data-runner3-mobile-inline-lcp="v3"]');
              const img=p?.querySelector('img');
              const r2pre=[...document.querySelectorAll('link[rel="preconnect"]')].some(x=>/r2\.dev/.test(x.href));
              return {picture:!!p,currentSrc:img?.currentSrc||'',naturalWidth:img?.naturalWidth||0,r2pre};
            });
            await page.close();
            return x;
          }
          const mobile=await probe(390,844);
          const desktop=await probe(1440,1200);
          console.log('RESPONSIVE_GUARD',JSON.stringify({mobile,desktop}));
          if(!mobile.picture || !mobile.currentSrc.startsWith('data:image/webp;base64,') || mobile.naturalWidth!==320 || mobile.r2pre) throw new Error('mobile guard failed');
          if(!desktop.picture || desktop.currentSrc.startsWith('data:image/') || desktop.naturalWidth<500 || desktop.r2pre) throw new Error('desktop guard failed');
          await browser.close();
          NODE

          curl -sS -D /tmp/admin -o /dev/null "$PROD_DOMAIN/wp-admin/"
          grep -Eiq '^HTTP/[^ ]+[[:space:]]+307' /tmp/admin
          grep -Eiq '^location:[[:space:]]*https://runner3-factory-smoke-2\.wasmer\.app' /tmp/admin
          curl -fsS -H 'Cookie: wordpress_logged_in_probe=1' -D /tmp/auth -o /tmp/authbody "$PROD_DOMAIN/"
          grep -Eiq '^x-edge-mode:[[:space:]]*bypass' /tmp/auth

      - name: Official PageSpeed 5x
        id: psi
        if: steps.guard.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            PSI_URL="$PROD_DOMAIN/" PSI_UI_OUT="/tmp/psi-$i.json" timeout 330s node scripts/pagespeed-ui-mobile-audit.mjs
          done
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          function sec(v){const m=String(v??'').trim().match(/^([0-9.]+)\s*(ms|s)?$/);if(!m)return null;const x=Number(m[1]);return m[2]==='ms'?x/1000:x;}
          const rows=[];
          for(let i=1;i<=5;i++){
            const d=JSON.parse(fs.readFileSync(`/tmp/psi-${i}.json`,'utf8'));
            const r={run:i,performance:d.performance,fcp:sec(d.fcp),lcp:sec(d.lcp),tbt:d.tbt,cls:d.cls,url:d.resultUrl};
            rows.push(r);
            console.log('PSI',JSON.stringify(r));
          }
          const vals=rows.map(r=>r.lcp).filter(Number.isFinite).sort((a,b)=>a-b);
          const median=vals.length===5?vals[2]:99;
          const p100=rows.filter(r=>r.performance===100).length;
          const pass=vals.length===5 && p100===5 && median<=0.9;
          console.log('MEDIAN_LCP',median);
          console.log('P100_COUNT',p100);
          console.log('TARGET_PASS',pass);
          fs.writeFileSync('/tmp/verdict',pass?'PASS':'REJECT');
          NODE

      - name: Roll back unless target passed
        id: rollback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          verdict="$(cat /tmp/verdict 2>/dev/null || echo REJECT)"
          if [ "$verdict" = PASS ]; then
            echo KEEP_CANDIDATE
            exit 0
          fi
          if [ ! -f /tmp/deployed ]; then
            echo NO_DEPLOY_TO_ROLLBACK
            exit 0
          fi
          git reset --hard
          git clean -fd
          git checkout --detach "$ROLLBACK_SHA"
          node scripts/build-wordpress-edge-snapshot.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('edge/wordpress-edge-proxy/wrangler.v2.jsonc','utf8'));
          d.name='wordpress-edge-proxy';
          fs.writeFileSync('edge/wordpress-edge-proxy/wrangler.prod-rollback.jsonc',JSON.stringify(d,null,2)+'\n');
          NODE
          npx --yes wrangler@4.124.0 deploy --config edge/wordpress-edge-proxy/wrangler.prod-rollback.jsonc >/tmp/rollback.log 2>&1
          sleep 5
          B="__rollback=$(date +%s%N)"
          curl -fsS -H 'Cache-Control: no-cache' -D /tmp/rh -o /tmp/rhome "$PROD_DOMAIN/?$B"
          grep -Eiq '^x-edge-snapshot:[[:space:]]*HIT' /tmp/rh
          grep -Eiq '^x-edge-cache-policy:[[:space:]]*snapshot-direct' /tmp/rh
          echo ROLLBACK_VERIFIED

      - name: Final verdict
        if: always()
        run: |
          echo "FINAL_VERDICT=$(cat /tmp/verdict 2>/dev/null || echo REJECT)"
          echo "PREP=${{ steps.prep.outcome }} DEPLOY=${{ steps.deploy.outcome }} GUARD=${{ steps.guard.outcome }} PSI=${{ steps.psi.outcome }} ROLLBACK=${{ steps.rollback.outcome }}"
