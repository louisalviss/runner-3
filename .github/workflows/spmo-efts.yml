name: SPMO EFTS Backtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spmo-efts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests yfinance beautifulsoup4 lxml html5lib
      - name: Run
        run: python spmo-backtest/backtest_efts.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spmo-efts-${{ github.run_id }}
          path: spmo-backtest/output/
          if-no-files-found: warn
          retention-days: 7
