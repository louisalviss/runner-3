name: M88 SABA Sports Outright
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/m88-saba-sports-outright.yml']
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence /tmp/relays
      - name: Connect relay accepted by M88
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://www.vpngate.net/api/iphone/ -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n'); meta=[]
          for c in ['TH','JP','SG','MY','ID','KR','TW','VN']:
            rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and r.get('OpenVPN_ConfigData_Base64')]
            rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
            for r in rs[:(10 if c=='TH' else 3)]:
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              p=pathlib.Path(f'/tmp/relays/{len(meta):02d}-{c}.ovpn');p.write_text(cfg);meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/relays.tsv').write_text('\n'.join(meta)+'\n')
          PY
          IFACE=$(ip route show default|awk '{print $5;exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn; sudo ip link set vn netns vpnns
          sudo ip addr add 10.246.0.1/24 dev vh; sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.246.0.2/24 dev vn; sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.246.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.246.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns; printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          selected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo TRY $country $relay
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null||true;sleep 1
            sudo rm -f /tmp/o.log /tmp/top.json;sudo touch /tmp/o.log;sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log||true
            ok=0;for i in {1..12};do sleep 1;grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null&&{ ok=1;break; };done
            [ "$ok" = 1 ]||continue
            if sudo ip netns exec vpnns curl -fsS --max-time 15 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/top.json;then
              if python3 - <<'PY'
          import json
          try:d=json.load(open('/tmp/top.json'))
          except:raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then
                echo "$country $relay"|tee evidence/relay.txt
                sudo ip netns exec vpnns curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace|grep -E '^(ip|loc|warp)='|tee evidence/egress.txt||true
                selected=1;break
              fi
            fi
          done </tmp/relays.tsv
          test "$selected" = 1
      - name: Navigate M88 SABA to Sports Outright
        shell: bash
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          OUT=Path(os.environ['WORKSPACE'])/'evidence'
          result={'markets':{},'notes':[],'sports_candidates':[],'outright_candidates':[]}; net=[]; bodies=[]
          pats={
            'winner':re.compile(r'(?:ENGLISH\s+)?PREMIER\s+LEAGUE.*?WINNER',re.I),
            'top4':re.compile(r'(?:ENGLISH\s+)?PREMIER\s+LEAGUE.*?TOP\s*4',re.I),
            'relegation':re.compile(r'(?:ENGLISH\s+)?PREMIER\s+LEAGUE.*?RELEGAT',re.I),
            'goalscorer':re.compile(r'(?:ENGLISH\s+)?PREMIER\s+LEAGUE.*?TOP\s*GOALSCORER',re.I),
          }
          def text(f,limit=900000):
            try:return f.locator('body').inner_text(timeout=8000)[:limit]
            except:return ''
          def provider_frame(page):
            cand=[]
            for f in page.frames:
              h=urlparse(f.url).netloc
              if h.startswith('i1x9gr.'):
                cand.append(f)
            return cand[-1] if cand else None
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            c=b.new_context(viewport={'width':390,'height':844},screen={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True,locale='en-US',timezone_id='Asia/Bangkok',user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1')
            page=c.new_page()
            def req(r):
              if r.resource_type in ('document','xhr','fetch'):net.append({'kind':'request','method':r.method,'type':r.resource_type,'url':r.url,'post':(r.post_data or '')[:12000]})
            def resp(r):
              if r.request.resource_type not in ('xhr','fetch'):return
              try:
                ct=(r.headers.get('content-type') or '').lower()
                if 'json' not in ct:return
                body=r.text()
                if len(body)>9000000:return
                if re.search(r'outright|premier.?league|goal.?scorer|relegat|top.?4',body,re.I):bodies.append({'url':r.url,'status':r.status,'body':body[:5000000]})
              except:pass
            page.on('request',req);page.on('response',resp)
            page.goto('https://www.m88.com/sports/Saba%20Sports?Language=en-US',wait_until='domcontentloaded',timeout=45000)
            page.wait_for_timeout(22000)
            pf=provider_frame(page)
            if pf is None:
              result['notes'].append('No i1x9gr M88 SABA frame')
            else:
              result['provider_before_url']=pf.url;result['provider_before_text']=text(pf,80000)
              # Enumerate exact Sports nodes. First visible exact node is top navigation in current promotion layout.
              sports=pf.get_by_text('Sports',exact=True)
              for i in range(min(sports.count(),30)):
                try:
                  el=sports.nth(i)
                  result['sports_candidates'].append({'i':i,'visible':el.is_visible(),'outer':el.evaluate('(e)=>e.outerHTML.slice(0,1800)')})
                except:pass
              clicked=False
              for i in range(min(sports.count(),30)):
                try:
                  if sports.nth(i).is_visible():sports.nth(i).click(timeout=7000);clicked=True;result['sports_clicked_index']=i;break
                except:pass
              result['sports_clicked']=clicked
              page.wait_for_timeout(12000)
              pf=provider_frame(page) or pf
              result['provider_sports_url']=pf.url;result['sports_text']=text(pf,160000)
              page.screenshot(path=str(OUT/'01-sports.png'),full_page=False)
              # Find Outright tab; M88 screenshot shows label like Outright 70.
              out=pf.get_by_text(re.compile(r'^\s*Outright(?:\s+\d+)?\s*$',re.I))
              for i in range(min(out.count(),30)):
                try:
                  el=out.nth(i);result['outright_candidates'].append({'i':i,'visible':el.is_visible(),'text':el.inner_text(),'outer':el.evaluate('(e)=>e.outerHTML.slice(0,1800)')})
                except:pass
              oclick=False
              for i in range(min(out.count(),30)):
                try:
                  if out.nth(i).is_visible():out.nth(i).click(timeout=7000);oclick=True;result['outright_clicked_index']=i;break
                except:pass
              result['outright_clicked']=oclick
              page.wait_for_timeout(12000)
              pf=provider_frame(page) or pf
              result['provider_outright_url']=pf.url
              page.screenshot(path=str(OUT/'02-outright.png'),full_page=False)
              corpus=text(pf)
              # Scroll main document and common scroll containers to hydrate outright list.
              for step in range(80):
                if all(rx.search(corpus) for rx in pats.values()):break
                try:pf.evaluate('window.scrollBy(0,700)')
                except:pass
                try:page.mouse.wheel(0,800)
                except:pass
                try:
                  pf.locator("div").evaluate_all("els=>els.filter(e=>e.scrollHeight>e.clientHeight+300).slice(0,8).forEach(e=>e.scrollTop+=700)")
                except:pass
                page.wait_for_timeout(300)
                now=text(pf)
                if now and now not in corpus:corpus+='\n'+now
              result['corpus']=corpus[:1600000]
              # Find/click requested headers; broad match handles operator wording variations.
              for key,rx in pats.items():
                rec={'found':bool(rx.search(corpus))}; loc=pf.get_by_text(rx); chosen=None
                for i in range(min(loc.count(),100)):
                  try:
                    if loc.nth(i).is_visible():chosen=loc.nth(i);break
                  except:pass
                if chosen:
                  try:rec['title']=chosen.inner_text()[:1000]
                  except:rec['title']=''
                  try:chosen.scroll_into_view_if_needed(timeout=3000);chosen.click(timeout=7000);page.wait_for_timeout(2500);rec['clicked']=True
                  except Exception as e:rec['clicked']=False;rec['error']=type(e).__name__
                  t=text(pf);m=rx.search(t);rec['window']=t[max(0,m.start()-700):m.start()+50000] if m else t[:50000]
                else:
                  m=rx.search(corpus);rec['window']=corpus[max(0,m.start()-700):m.start()+50000] if m else ''
                result['markets'][key]=rec
            c.close();b.close()
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          (OUT/'network.json').write_text(json.dumps(net,ensure_ascii=False,indent=2))
          (OUT/'json-bodies.json').write_text(json.dumps(bodies,ensure_ascii=False,indent=2))
          print('SPORTS_CLICKED',result.get('sports_clicked'),'URL',result.get('provider_sports_url'))
          print('OUTRIGHT_CLICKED',result.get('outright_clicked'),'URL',result.get('provider_outright_url'))
          print('NOTES',result.get('notes'))
          print('SPORTS_CANDIDATES',json.dumps(result.get('sports_candidates'),ensure_ascii=False)[:12000])
          print('OUTRIGHT_CANDIDATES',json.dumps(result.get('outright_candidates'),ensure_ascii=False)[:12000])
          for k,v in result.get('markets',{}).items():
            print('\n###',k,'FOUND',v.get('found'),'CLICKED',v.get('clicked'))
            print(v.get('window','')[:35000])
          print('\nSABA JSON URLS')
          for x in bodies:print(x['url'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-saba-sports-outright-${{ github.run_id }}
          path: evidence/
          retention-days: 3
