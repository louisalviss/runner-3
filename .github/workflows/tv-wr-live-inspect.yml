name: TV WR Live Inspect

on:
  push:
    branches: [tv-wr-live-20260818]
    paths:
      - '.github/workflows/tv-wr-live-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact authenticated session and canonical Pine
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/session-state.json.aes -out /tmp/tv-storage-state.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/wr-window-report.pine.aes -out /tmp/wr-window-report.pine
          test "$(sha256sum /tmp/wr-window-report.pine | awk '{print $1}')" = "9156e8c49b9a5e36007620f3e17fcab26c06714a3e32a252be52437ae23d6026"
          python3 - <<'PY'
          p=open('/tmp/wr-window-report.pine').read()
          assert 'Wave Rider Strategy v2.5.13 WINDOW REPORT' in p
          assert '1785171600000' in p and '1786813200000' in p
          p=p.replace('1785171600000','1735689600000',1).replace('1786813200000','1786752000000',1)
          open('/tmp/wr-live.pine','w').write(p)
          PY
      - name: Run BNB and TRX on Entire history
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const {chromium}=require('playwright-core');
          const out=[]; const log=x=>{out.push(x);console.log(x)}; const norm=s=>s.replace(/\r\n/g,'\n').trimEnd();
          (async()=>{
            log('RUN_ID='+process.env.GITHUB_RUN_ID);
            log('BASE_SHA=9156e8c49b9a5e36007620f3e17fcab26c06714a3e32a252be52437ae23d6026');
            log('WINDOW=2025-01-01T00:00:00Z..2026-08-15T00:00:00Z_EXCLUSIVE');
            const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
            const state=JSON.parse(fs.readFileSync('/tmp/tv-storage-state.json','utf8'));
            const source=fs.readFileSync('/tmp/wr-live.pine','utf8');
            log('PATCHED_SHA='+crypto.createHash('sha256').update(source).digest('hex'));
            const browser=await chromium.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({storageState:state,viewport:{width:1920,height:1080},permissions:['clipboard-read','clipboard-write']});

            async function closePine(page){
              const closes=page.locator('button[aria-label="Close"]');
              for(let i=0;i<await closes.count();i++){
                const el=closes.nth(i); if(!await el.isVisible().catch(()=>false)) continue;
                const b=await el.boundingBox().catch(()=>null); if(b&&b.x>1500&&b.y<100){await el.click({force:true});return true;}
              }
              return false;
            }
            async function chooseEntireHistory(page,label){
              await page.waitForTimeout(4000);
              const controls=page.locator('button,[role="button"]'); let range=null;
              for(let i=0;i<Math.min(1000,await controls.count());i++){
                const el=controls.nth(i); if(!await el.isVisible().catch(()=>false)) continue;
                const txt=await el.evaluate(e=>(e.textContent||'').replace(/\s+/g,' ').trim());
                if(/20\d{2}.*[—-].*20\d{2}/.test(txt)){range=el;log(label+'_RANGE_BEFORE='+txt);break;}
              }
              if(!range) throw new Error(label+' testing period control missing');
              await range.click({force:true}); await page.waitForTimeout(1200);
              const entire=page.getByText('Entire history',{exact:true});
              log(label+'_ENTIRE_OPTION_COUNT='+await entire.count());
              if(!await entire.count()) throw new Error(label+' Entire history option missing');
              await entire.first().click({force:true});
              log(label+'_ENTIRE_CLICK=YES');
              await page.waitForTimeout(60000);
              const body=await page.locator('body').innerText().catch(()=> '');
              log(label+'_UPGRADE_BLOCK='+( /upgrade.*plan|upgrade now|deep backtesting.*available/i.test(body)?'YES':'NO'));
              const lines=body.split('\n').map(s=>s.trim()).filter(Boolean);
              for(const x of lines.filter(x=>/20\d{2}.*[—-].*20\d{2}|Entire history|List of trades|Performance|WR 2\.5\.13/i.test(x)).slice(0,100)) log(label+'_BODY='+x);
            }
            async function runSymbol(symbol,label,file){
              const page=await context.newPage();
              await page.goto('https://www.tradingview.com/chart/?symbol='+encodeURIComponent('BINANCE:'+symbol)+'&interval=5',{waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForTimeout(12000);
              let body=await page.locator('body').innerText().catch(()=> '');
              const cookies=await context.cookies();
              log(label+'_AUTH='+(cookies.some(c=>/tradingview\.com$/i.test(c.domain.replace(/^\./,''))&&/session/i.test(c.name)&&c.value)&&!/\bSign in\b/i.test(body)?'PASS':'FAIL'));
              log(label+'_SYMBOL='+(body.includes(symbol)?'PASS':'FAIL'));
              const pine=page.locator('[data-name="pine-dialog-button"],button[aria-label="Pine"]');
              if(!await pine.count()) throw new Error(label+' Pine button missing');
              await pine.first().click({force:true}); await page.waitForTimeout(7000);
              const ta=page.locator('.monaco-editor textarea').last(); if(!await ta.count()) throw new Error(label+' Monaco missing');
              await page.evaluate(s=>navigator.clipboard.writeText(s),source);
              await ta.click({force:true}); await page.keyboard.press('Control+A'); await page.keyboard.press('Control+V'); await page.waitForTimeout(2200);
              await page.keyboard.press('Control+A'); await page.keyboard.press('Control+C'); await page.waitForTimeout(400);
              const copied=await page.evaluate(()=>navigator.clipboard.readText()).catch(()=> '');
              log(label+'_EDITOR_MATCH='+(norm(copied)===norm(source)?'YES':'NO'));
              const add=page.getByRole('button',{name:/Add to chart/i});
              if(await add.count()) await add.first().click({force:true}); else {await ta.click({force:true});await page.keyboard.press('Control+Enter');}
              await page.waitForTimeout(22000);
              body=await page.locator('body').innerText().catch(()=> '');
              log(label+'_COMPILE_ERROR='+( /Compilation error|Syntax error|Error at/i.test(body)?'YES':'NO'));
              log(label+'_REPORT_CONTROL='+(body.includes('WR 2.5.13 WIN')?'YES':'NO'));
              log(label+'_PINE_CLOSED='+(await closePine(page)?'YES':'NO'));
              await chooseEntireHistory(page,label);
              await page.screenshot({path:file,fullPage:false});
              await page.close();
            }

            await runSymbol('BNBUSDT.P','BNB','/tmp/bnb-entire.png');
            await runSymbol('TRXUSDT.P','TRX','/tmp/trx-entire.png');
            fs.writeFileSync('/tmp/result.txt',out.join('\n')+'\n');
            await browser.close();
          })().catch(e=>{log('ERROR='+e.stack);fs.writeFileSync('/tmp/result.txt',out.join('\n')+'\n');process.exit(7)});
          NODE
      - name: Persist result
        if: always()
        shell: bash
        run: |
          { echo "RUN_ID=$GITHUB_RUN_ID"; cat /tmp/result.txt 2>/dev/null || true; } > ops/tradingview/entire-history-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/tradingview/entire-history-result.txt
          git commit -m 'chore: save WR entire-history result' || true
          git push origin HEAD:tv-wr-live-20260818
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-wr-entire-history
          path: |
            /tmp/bnb-entire.png
            /tmp/trx-entire.png
            /tmp/result.txt
          retention-days: 1
      - name: Cleanup
        if: always()
        run: rm -f /tmp/tv-storage-state.json /tmp/wr-window-report.pine /tmp/wr-live.pine
