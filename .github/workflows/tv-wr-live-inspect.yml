name: TV WR Live Inspect

on:
  push:
    branches: [tv-wr-live-20260818]
    paths:
      - '.github/workflows/tv-wr-live-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact session and Pine
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/session-state.json.aes -out /tmp/tv-storage-state.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/wr-window-report.pine.aes -out /tmp/wr-window-report.pine
          test "$(sha256sum /tmp/wr-window-report.pine | awk '{print $1}')" = "9156e8c49b9a5e36007620f3e17fcab26c06714a3e32a252be52437ae23d6026"
          python3 - <<'PY'
          p=open('/tmp/wr-window-report.pine').read()
          p=p.replace('1785171600000','1735689600000',1).replace('1786813200000','1786752000000',1)
          open('/tmp/wr-live.pine','w').write(p)
          PY
      - name: Inspect BNB strategy report date range
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const {chromium}=require('playwright-core');
          const out=[]; const log=x=>{out.push(x);console.log(x)}; const norm=s=>s.replace(/\r\n/g,'\n').trimEnd();
          (async()=>{
            log('RUN_ID='+process.env.GITHUB_RUN_ID);
            const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
            const state=JSON.parse(fs.readFileSync('/tmp/tv-storage-state.json','utf8'));
            const source=fs.readFileSync('/tmp/wr-live.pine','utf8');
            log('PATCHED_SHA='+crypto.createHash('sha256').update(source).digest('hex'));
            const browser=await chromium.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({storageState:state,viewport:{width:1920,height:1080},permissions:['clipboard-read','clipboard-write']});
            const page=await context.newPage();
            await page.goto('https://www.tradingview.com/chart/?symbol=BINANCE%3ABNBUSDT.P&interval=5',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(12000);
            const pine=page.locator('[data-name="pine-dialog-button"],button[aria-label="Pine"]');
            await pine.first().click({force:true}); await page.waitForTimeout(7000);
            const ta=page.locator('.monaco-editor textarea').last();
            await page.evaluate(s=>navigator.clipboard.writeText(s),source); await ta.click({force:true}); await page.keyboard.press('Control+A'); await page.keyboard.press('Control+V'); await page.waitForTimeout(2200);
            await page.keyboard.press('Control+A'); await page.keyboard.press('Control+C'); await page.waitForTimeout(400);
            const copied=await page.evaluate(()=>navigator.clipboard.readText()).catch(()=> '');
            log('EDITOR_MATCH='+(norm(copied)===norm(source)?'YES':'NO'));
            const add=page.getByRole('button',{name:/Add to chart/i}); if(await add.count()) await add.first().click({force:true}); else {await ta.click({force:true});await page.keyboard.press('Control+Enter');}
            await page.waitForTimeout(22000);
            let body=await page.locator('body').innerText().catch(()=> '');
            log('REPORT_OPEN_CONTROL='+(body.includes('WR 2.5.13 WIN')?'YES':'NO'));
            const closes=page.locator('button[aria-label="Close"]');
            for(let i=0;i<await closes.count();i++){
              const el=closes.nth(i); if(!await el.isVisible().catch(()=>false)) continue; const b=await el.boundingBox().catch(()=>null); if(b&&b.x>1500&&b.y<100){await el.click({force:true});log('PINE_CLOSE=YES');break;}
            }
            await page.waitForTimeout(5000);
            body=await page.locator('body').innerText().catch(()=> '');
            const lines=body.split('\n').map(s=>s.trim()).filter(Boolean);
            for(const x of lines.filter(x=>/20\d{2}.*[—-].*20\d{2}|List of trades|Performance|Overview|WR 2\.5\.13/i.test(x)).slice(0,120)) log('BODY='+x);
            const controls=page.locator('button,[role="button"]');
            let rangeEl=null;
            for(let i=0;i<Math.min(900,await controls.count());i++){
              const el=controls.nth(i); if(!await el.isVisible().catch(()=>false)) continue;
              const txt=await el.evaluate(e=>(e.textContent||'').replace(/\s+/g,' ').trim());
              if(/20\d{2}.*[—-].*20\d{2}/.test(txt)){ const b=await el.boundingBox().catch(()=>null); log('DATE_CTRL='+JSON.stringify({txt,box:b})); if(!rangeEl) rangeEl=el; }
            }
            if(rangeEl){await rangeEl.click({force:true}); log('DATE_CLICK=YES'); await page.waitForTimeout(2500);} else log('DATE_CLICK=NO');
            const dialogs=page.locator('[role="dialog"]'); log('DIALOGS='+await dialogs.count());
            for(let i=0;i<await dialogs.count();i++) if(await dialogs.nth(i).isVisible().catch(()=>false)) log('DIALOG_TEXT='+(await dialogs.nth(i).innerText().catch(()=> '')).replace(/\n/g,' | ').slice(0,1800));
            const inputs=page.locator('input');
            for(let i=0;i<await inputs.count();i++){
              const el=inputs.nth(i); if(!await el.isVisible().catch(()=>false)) continue;
              log('INPUT='+JSON.stringify(await el.evaluate(e=>({type:e.type,placeholder:e.placeholder,aria:e.getAttribute('aria-label'),value:e.value,name:e.name}))));
            }
            const visBtns=page.locator('button');
            for(let i=0;i<Math.min(900,await visBtns.count());i++){
              const el=visBtns.nth(i); if(!await el.isVisible().catch(()=>false)) continue;
              const t=await el.evaluate(e=>[e.getAttribute('aria-label'),e.getAttribute('title'),(e.textContent||'').replace(/\s+/g,' ').trim()].filter(Boolean).join(' | '));
              if(/apply|cancel|date|range|calendar|start|end/i.test(t)) log('BTN='+t.slice(0,220));
            }
            await page.screenshot({path:'/tmp/date-popup.png',fullPage:false});
            fs.writeFileSync('/tmp/result.txt',out.join('\n')+'\n'); await browser.close();
          })().catch(e=>{log('ERROR='+e.stack);fs.writeFileSync('/tmp/result.txt',out.join('\n')+'\n');process.exit(7)});
          NODE
      - name: Persist result
        if: always()
        shell: bash
        run: |
          { echo "RUN_ID=$GITHUB_RUN_ID"; cat /tmp/result.txt 2>/dev/null || true; } > ops/tradingview/date-range-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/tradingview/date-range-result.txt
          git commit -m 'chore: save TradingView date range inspector' || true
          git push origin HEAD:tv-wr-live-20260818
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-wr-date-range
          path: |
            /tmp/date-popup.png
            /tmp/result.txt
          retention-days: 1
      - name: Cleanup
        if: always()
        run: rm -f /tmp/tv-storage-state.json /tmp/wr-window-report.pine /tmp/wr-live.pine
