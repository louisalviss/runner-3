name: WR Dukascopy META Retry
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wr-dukascopy-meta-retry.yml'
      - 'wave-rider-verify/wr_dukascopy_meta_retry.py'
permissions:
  contents: read
  actions: read
jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        tf: [5, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas websocket-client requests dukascopy-python
      - name: Fetch frozen WR 2.5.13 reference
        run: curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
      - name: Run META retry using Dukascopy FB.US/USD
        env:
          TF_MIN: ${{ matrix.tf }}
          WR_OUT: /tmp/wr-duka-meta
        run: python3 wave-rider-verify/wr_dukascopy_meta_retry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-duka-full-META-${{ matrix.tf }}m-retry
          path: /tmp/wr-duka-meta
          retention-days: 30
