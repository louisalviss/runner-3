name: palm30_tts2
on:
  push:
    paths:
      - .github/workflows/palm30-tts2.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q edge-tts
      - shell: bash
        run: |
          mkdir -p evidence/palm30
          edge-tts --voice vi-VN-NamMinhNeural --rate=+6% --text 'Dubai từng thiếu một thứ tưởng như không thể mua: bờ biển. Năm 2001, họ quyết định tự tạo ra nó. Chín mươi bốn triệu mét khối cát biển được bơm lên, tạo thành Palm Jumeirah, một hòn đảo hình cây cọ nhìn rõ từ trên cao. Nhưng thành công này có giá: dòng chảy bị thay đổi, bờ biển phải liên tục gia cố, và đại dương vẫn đang cố lấy lại phần đất con người đã giành được.' --write-media evidence/palm30/narration.mp3 --write-subtitles evidence/palm30/narration.srt
      - shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add evidence/palm30
          git commit -m 'Add palm30 neural narration'
          git push
