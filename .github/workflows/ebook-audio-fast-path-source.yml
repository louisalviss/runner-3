name: Ebook Audio Fast Path Source

on:
  pull_request:
    paths:
      - 'cloudflare/runner3-core/audio-entry.js'
      - 'cloudflare/runner3-core/src/ebook-reader-audio.js'
      - 'scripts/ebook_reader_audio_tts_vps.py'
      - 'scripts/verify_ebook_audio_fast_path.mjs'
      - '.github/workflows/ebook-audio-fast-path-source.yml'
  push:
    branches:
      - fix/ebook-audio-fast-internal-vps
    paths:
      - 'cloudflare/runner3-core/audio-entry.js'
      - 'cloudflare/runner3-core/src/ebook-reader-audio.js'
      - 'scripts/ebook_reader_audio_tts_vps.py'
      - 'scripts/verify_ebook_audio_fast_path.mjs'
      - '.github/workflows/ebook-audio-fast-path-source.yml'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cloudflare/runner3-core/audio-entry.js
      - run: node --check cloudflare/runner3-core/src/ebook-reader-audio.js
      - run: node scripts/verify_ebook_audio_fast_path.mjs
      - run: python3 -m py_compile scripts/ebook_reader_audio_tts_vps.py
      - name: Verify heartbeat is opt-in
        run: |
          python3 - <<'PY'
          import ast
          p='scripts/ebook_reader_audio_tts_vps.py'
          text=open(p,encoding='utf-8').read()
          assert 'EBOOK_AUDIO_VPS_HEARTBEAT_ENABLED' in text
          assert 'HEARTBEAT_ENABLED' in text
          assert 'if not HEARTBEAT_ENABLED:' in text
          ast.parse(text)
          print('EBOOK_AUDIO_VPS_HEARTBEAT_OPT_IN=PASS')
          PY
