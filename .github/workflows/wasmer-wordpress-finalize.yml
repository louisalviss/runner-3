name: Finalize Live Wasmer WordPress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasmer-wordpress-finalize.yml'
      - 'scripts/wasmer-wordpress-finalize.mjs'
      - 'wordpress-site/wp-content/themes/runner3-starter/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wasmer-wordpress-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt existing Wasmer state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || exit 2
          echo '::add-mask::'"$AUTOMATION_KEY"
          test -f ops/wasmer/state.automation.aes || { echo 'Encrypted state missing'; exit 3; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-result.json
          python - <<'PY'
          import json
          s=json.load(open('/tmp/wasmer-result.json'))
          assert s.get('siteUrl'), 'siteUrl missing'
          print('SITE_STATE_READY=true')
          PY

      - name: Build Runner3 theme package
        shell: bash
        run: |
          set -euo pipefail
          test -d wordpress-site/wp-content/themes/runner3-starter
          cd wordpress-site/wp-content/themes
          zip -qr /tmp/runner3-starter.zip runner3-starter
          test -s /tmp/runner3-starter.zip

      - name: Install browser automation
        run: npm install --no-save playwright-core@1.58.2

      - name: Finalize WordPress and activate theme
        run: node scripts/wasmer-wordpress-finalize.mjs

      - name: Persist encrypted WordPress state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/wasmer-result.json || { echo 'Wasmer state missing after finalize'; exit 4; }
          test -f /tmp/wp-finalize-status.json || echo '{"status":"runner_error","detail":"finalize_status_missing"}' > /tmp/wp-finalize-status.json
          echo 'SAFE_FINALIZE_STATUS:'
          cat /tmp/wp-finalize-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/wasmer
            cp /tmp/wp-finalize-status.json ops/wasmer/site-check.json
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in /tmp/wasmer-result.json -out ops/wasmer/state.automation.aes
            git add ops/wasmer/site-check.json ops/wasmer/state.automation.aes
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m 'Persist live WordPress finalize state'
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep 2
          done
          test "$pushed" = true || exit 5
