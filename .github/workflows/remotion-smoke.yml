name: Remotion smoke render

on:
  workflow_dispatch:
  push:
    paths:
      - 'video/**'
      - '.github/workflows/remotion-smoke.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: video
        run: npm install

      - name: Render MP4
        working-directory: video
        run: npm run render

      - name: Verify output
        run: |
          ffprobe -v error -show_entries format=duration,size -of json video/out/remotion-smoke.mp4
          ls -lh video/out/remotion-smoke.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-smoke-video
          path: video/out/remotion-smoke.mp4
          if-no-files-found: error
          retention-days: 7
