name: WR Market State Forward Daily
on:
  schedule:
    - cron: '30 22 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'wave-rider-verify/frozen-market-state/market_state_hgb_q70_manifest.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wr-market-state-forward-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        symbol: [AAPL,ADBE,ADI,ADP,ADSK,AEP,ALNY,AMAT,AMD,AMGN,AMZN,AVGO,BKR,CDNS,CMCSA,COST,CPRT,CSCO,CSGP,CSX,CTSH,DXCM,EA,EXC,FANG,FTNT,GILD,GOOG,GOOGL,HON,IDXX,INTC,INTU,ISRG,KHC,LRCX,MAR,MCHP,MDLZ,META,MPWR,MRVL,MSFT,MU,NFLX,NVDA,ODFL,ORLY,PANW,PAYX,PCAR,PEP,PLTR,PYPL,QCOM,REGN,ROST,SBUX,SNPS,TMUS,TSLA,TTWO,TXN,VRTX,WDAY,WDC,WMT,ZS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas numpy requests websocket-client dukascopy-python
      - name: Recompute holdout trades with pinned pre-holdout code
        run: python3 wave-rider-verify/wr_market_state_forward_collect.py --symbol '${{ matrix.symbol }}' --output '/tmp/forward-${{ matrix.symbol }}'
      - uses: actions/upload-artifact@v4
        with:
          name: wr-market-state-forward-${{ matrix.symbol }}
          path: /tmp/forward-${{ matrix.symbol }}
          retention-days: 14
  finalize:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wr-market-state-forward-*
          path: /tmp/all
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas numpy scikit-learn joblib
      - name: Append only to frozen forward ledger
        run: |
          test -f wave-rider-verify/frozen-market-state/market_state_hgb_q70_manifest.json
          test -f wave-rider-verify/frozen-market-state/market_state_hgb_q70.joblib.b64
          python3 wave-rider-verify/wr_market_state_forward_finalize.py \
            --input /tmp/all \
            --manifest wave-rider-verify/frozen-market-state/market_state_hgb_q70_manifest.json \
            --model wave-rider-verify/frozen-market-state/market_state_hgb_q70.joblib.b64 \
            --ledger wave-rider-verify/forward-market-state/ledger.json \
            --status wave-rider-verify/forward-market-state/status.json
      - name: Persist append-only holdout state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wave-rider-verify/forward-market-state/
          if git diff --cached --quiet; then
            echo 'No forward-state change.'
          else
            git commit -m 'research: update market-state forward holdout ledger'
            git pull --rebase origin main
            git push
          fi
