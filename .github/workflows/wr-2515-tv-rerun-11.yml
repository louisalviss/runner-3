name: WR 2.5.15 Stage1 Stage2 5m
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/wr-2515-tv-rerun-11.yml']
permissions:
  contents: read
  actions: read
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - name: Download TV-tick-clean 5m baseline
        uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - name: Fetch Stage1 Stage2 harness and exact parity reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/code
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/wr-2515-stage12-5m/wave-rider-verify/wr2515_stage12_5m.py' -o /tmp/code/stage12.py
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/code/stage12.py');s=p.read_text()
          old='        if x.ct<START_MS or x.ct>=END_MS:continue';new='        if x.ct>=END_MS:continue'
          if s.count(old)!=1:raise SystemExit('state gate patch anchor missing')
          s=s.replace(old,new,1)
          old2="                    if stop_pct and stop_pct>0:\n                        setups.append({'symbol':sym,'signal_time':x.ct,'stop_pct':stop_pct,'required_x':1.0/stop_pct})"
          new2="                    if stop_pct and stop_pct>0 and x.ct>=START_MS-S2_LOOKBACK_MS:\n                        setups.append({'symbol':sym,'signal_time':x.ct,'stop_pct':stop_pct,'required_x':1.0/stop_pct})"
          if s.count(old2)!=1:raise SystemExit('setup lookback patch anchor missing')
          s=s.replace(old2,new2,1)
          fast=r'''
def stage1_passes_fast(rows,sym):
    ots=[r[0] for r in rows];cts=[r[6] for r in rows]
    pref=[0.0]
    for r in rows:pref.append(pref[-1]+r[7])
    full={}
    for r in rows:
        k=datetime.fromtimestamp(r[0]/1000,tz=timezone.utc).date().isoformat();x=full.get(k)
        if x is None:full[k]=[r[1],r[2],r[3],r[4],r[5]]
        else:x[1]=max(x[1],r[2]);x[2]=min(x[2],r[3]);x[3]=r[4];x[4]+=r[5]
    dkeys=sorted(full);passes=[]
    for cp,session_date,label in CHECKPOINTS:
        j=bisect_left(cts,cp)
        if j<=0:continue
        a=bisect_left(cts,cp-86400_000);qv24=pref[j]-pref[a]
        cur=datetime.fromtimestamp(cp/1000,tz=timezone.utc).date();curkey=cur.isoformat();di=bisect_left(dkeys,curkey)
        prev=[full[k] for k in dkeys[max(0,di-14):di]]
        day0=int(datetime(cur.year,cur.month,cur.day,tzinfo=timezone.utc).timestamp()*1000);q=bisect_left(ots,day0);rr=rows[q:j]
        if rr:
            part=[rr[0][1],max(x[2] for x in rr),min(x[3] for x in rr),rr[-1][4],sum(x[5] for x in rr)];ds=(prev+[part])[-14:]
        else:ds=prev[-14:]
        if len(ds)<14:continue
        last10=ds[-10:];last7=ds[-7:];last14=ds[-14:]
        avg10=sum(x[3]*x[4] for x in last10)/10.0
        if any(x[2]==0 for x in last7):continue
        vol7=sum((x[1]-x[2])/abs(x[2]) for x in last7)/7.0;curclose=last14[-1][3]
        if not curclose:continue
        adr14=((sum(x[1] for x in last14)/14.0)-(sum(x[2] for x in last14)/14.0))/abs(curclose)
        if qv24>=S1_QV24 and avg10>=S1_AVG10 and vol7>S1_VOL7 and adr14>=S1_ADR14:
            passes.append({'symbol':sym,'checkpoint':cp,'session_date':session_date,'mode':label,'qv24':qv24,'avg10':avg10,'vol7':vol7,'adr14':adr14})
    return passes
'''
          marker='def run_symbol(sym,tick,rows):'
          if s.count(marker)!=1:raise SystemExit('run marker missing')
          s=s.replace(marker,fast+'\n'+marker,1)
          a=s.index('    passes=[]\n    for cp,session_date,label in CHECKPOINTS:',s.index(marker))
          ret="    return setups,passes,{'symbol':sym,'bars':len(rows),'setups':len(setups),'passes':len(passes)}";b=s.index(ret,a)+len(ret)
          s=s[:a]+"    passes=stage1_passes_fast(rows,sym)\n"+ret+s[b:];p.write_text(s)
          PY
      - name: Run shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
          BASE_DIR: /tmp/base
          OUT_DIR: /tmp/stage12
          REFERENCE_VERIFY: /tmp/reference_verify.py
        run: |
          set -euo pipefail
          python3 /tmp/code/stage12.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr2515-stage12-shard-${{ matrix.shard }}
          path: /tmp/stage12
          retention-days: 7
  merge:
    needs: shard
    if: always() && needs.shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wr2515-stage12-shard-*
          path: /tmp/all
          merge-multiple: true
      - name: Download TV-tick-clean 5m baseline
        uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - name: Merge frozen selectors
        shell: bash
        env:
          BASE_DIR: /tmp/base
          IN_DIR: /tmp/all
          OUT_DIR: /tmp/final
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/wr-2515-stage12-5m/wave-rider-verify/wr2515_stage12_merge.py' -o /tmp/merge.py
          python3 /tmp/merge.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr2515-stage12-5m-final
          path: /tmp/final
          retention-days: 14
