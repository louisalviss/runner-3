name: WR Merge Repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wr-merge-repair.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download completed stock final artifact
        uses: actions/download-artifact@v4
        with:
          name: wr-stock10-close-final
          path: /tmp/stock-old
          repository: louisalviss/runner-3
          run-id: 32614479461
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair stock baseline label and regenerate report
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/louisalviss/runner-3/a4afdebff87cb0f5ddd100c12a27872116a5c12e/apps/wave-rider-structural/stock10_close_merge.py" -o /tmp/stock_merge.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/stock_merge.py')
          s=p.read_text()
          old="xs=[t for t in tr if t['variant']==v]"
          new="xs=[t for t in tr if t['variant']==('canonical' if v=='baseline' else v)]"
          if old not in s: raise SystemExit('stock merge patch target missing')
          p.write_text(s.replace(old,new,1))
          PY
          mkdir -p /tmp/stock-input/artifact /tmp/stock-final
          cp /tmp/stock-old/symbol-summaries.json /tmp/stock-input/artifact/all-symbols.json
          cp /tmp/stock-old/trades.jsonl /tmp/stock-input/artifact/all-trades.jsonl
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('/tmp/stock-input/artifact')
          xs=json.load(open('/tmp/stock-old/symbol-summaries.json'))
          for i,x in enumerate(xs): (root/f'symbol-{i:03d}.json').write_text(json.dumps(x))
          PY
          MERGE_ROOT=/tmp/stock-input FINAL_OUT=/tmp/stock-final python /tmp/stock_merge.py
      - name: Upload corrected stock aggregate
        uses: actions/upload-artifact@v4
        with:
          name: wr-stock10-close-final-corrected
          path: /tmp/stock-final/
          retention-days: 30
      - name: Download all successful crypto shards
        uses: actions/download-artifact@v4
        with:
          pattern: wr-crypto-stage1-close-shard-*
          path: /tmp/crypto-all
          repository: louisalviss/runner-3
          run-id: 32614479458
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate dependency-free crypto final aggregate
        run: |
          set -euo pipefail
          mkdir -p /tmp/crypto-final
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import defaultdict
          from datetime import datetime, timezone
          root=Path('/tmp/crypto-all'); out=Path('/tmp/crypto-final')
          summaries=[]; trades=[]
          for p in root.rglob('summary-*.json'):
              x=json.loads(p.read_text()); summaries.extend(x.get('results',[]))
          for p in root.rglob('trades-*.jsonl'):
              for ln in p.read_text().splitlines():
                  if ln.strip(): trades.append(json.loads(ln))
          def cost_r(t,bps):
              d=abs(float(t['e'])-float(t['s']))
              return 0.0 if d<=0 else (float(t['e'])/d)*(bps/10000.0)
          def val(t,bps): return float(t['R'])-cost_r(t,bps)
          def met(xs,bps):
              a=[val(t,bps) for t in xs]; n=len(a); gp=sum(max(x,0) for x in a); gl=sum(max(-x,0) for x in a)
              eq=peak=0.0; dd=0.0
              for x in a: eq+=x; peak=max(peak,eq); dd=min(dd,eq-peak)
              return {'n':n,'R':sum(a),'avg_R':sum(a)/n if n else None,'PF':gp/gl if gl else None,'max_DD_R':dd}
          def norm(xs,bps):
              by=defaultdict(list); byd=defaultdict(list)
              for t in xs:
                  x=val(t,bps); by[int(t['signal'])].append(x)
                  d=datetime.fromtimestamp(int(t['signal'])/1000,tz=timezone.utc).date().isoformat(); byd[d].append(x)
              eps=[sum(v)/len(v) for v in by.values()]; days=[sum(v)/len(v) for v in byd.values()]
              return {'episode_count':len(eps),'episode_normalized_R':sum(eps),'daily_count':len(days),'daily_normalized_R':sum(days),'peak_same_signal':max((len(v) for v in by.values()),default=0)}
          report={'status':'COMPLETE','research_question':'On causally reconstructed historical Crypto Stage1 membership, does next-bar close confirmation improve WR 5m versus canonical intrabar stop-entry?','symbols_scanned':len(summaries),'symbols_stage1_ok':sum(x.get('status')=='OK' for x in summaries),'symbols_error':sum(x.get('status')=='ERROR' for x in summaries),'raw_trade_variants':{},'variants':{}}
          for k in sorted({t['variant'] for t in trades}): report['raw_trade_variants'][k]=sum(t['variant']==k for t in trades)
          for label,raw in [('baseline','canonical'),('close_confirmed','close_confirmed')]:
              xs=[t for t in trades if t['variant']==raw]; r={}
              for bps in (4,6,8):
                  r[f'net_{bps}bps']=met(xs,bps)
                  r[f'long_{bps}bps']=met([t for t in xs if t['side']=='L'],bps)
                  r[f'short_{bps}bps']=met([t for t in xs if t['side']=='S'],bps)
                  r[f'normalized_{bps}bps']=norm(xs,bps)
                  r[f'by_year_{bps}bps']={str(y):met([t for t in xs if datetime.fromtimestamp(int(t['signal'])/1000,tz=timezone.utc).year==y],bps) for y in (2025,2026)}
              report['variants'][label]=r
          for bps in (4,6,8):
              a=report['variants']['baseline'][f'net_{bps}bps']; b=report['variants']['close_confirmed'][f'net_{bps}bps']
              report[f'delta_close_minus_baseline_{bps}bps']={'R':b['R']-a['R'],'n':b['n']-a['n'],'avg_R':b['avg_R']-a['avg_R'] if a['avg_R'] is not None and b['avg_R'] is not None else None}
          report['guardrails']=['Stage1 thresholds frozen from operating methodology','Close-confirm is the only WR entry-structure change','4/6/8bps are modeled sensitivities, not true executable replay','Episode/day-normalized R reported because simultaneous altcoin trades are correlated']
          (out/'report.json').write_text(json.dumps(report,indent=2))
          (out/'symbol-summaries.json').write_text(json.dumps(summaries,indent=2,default=str))
          with (out/'trades.jsonl').open('w') as f:
              for t in trades: f.write(json.dumps(t,separators=(',',':'))+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Upload corrected crypto aggregate
        uses: actions/upload-artifact@v4
        with:
          name: wr-crypto-stage1-close-final-corrected
          path: /tmp/crypto-final/
          retention-days: 30
