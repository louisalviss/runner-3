name: YouTube content analysis olifZrb263k
on:
  push:
    paths:
      - '.github/workflows/youtube-content-olifZrb263k.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install WARP and yt-dlp
        shell: bash
        run: |
          set -e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp jq
          python -m pip install -q -U yt-dlp
      - name: Extract metadata and captions
        shell: bash
        run: |
          set -euo pipefail
          OUT='evidence/youtube_olifZrb263k'
          mkdir -p "$OUT"
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp+doh
          warp-cli --accept-tos connect
          for i in {1..15}; do
            sleep 1
            curl -s --max-time 5 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on' && break
          done
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|warp)=' > "$OUT/warp.txt"
          URL='https://youtu.be/olifZrb263k?si=812lEQiMA0kD8ULu'
          yt-dlp --no-playlist --skip-download --write-info-json --write-auto-subs --write-subs \
            --sub-langs 'ru.*,en.*' --sub-format vtt \
            -o "$OUT/video.%(ext)s" "$URL" > "$OUT/yt-dlp.log" 2>&1 || true
          yt-dlp --no-playlist --skip-download --list-subs "$URL" > "$OUT/subs-list.txt" 2>&1 || true
          python - <<'PY'
          import pathlib, re, json
          out=pathlib.Path('evidence/youtube_olifZrb263k')
          # metadata summary
          infos=list(out.glob('video.info.json'))
          if infos:
              d=json.load(open(infos[0],encoding='utf-8'))
              keep={k:d.get(k) for k in ['id','title','fulltitle','description','duration','uploader','channel','upload_date','view_count','like_count','comment_count','categories','tags','chapters']}
              (out/'metadata-summary.json').write_text(json.dumps(keep,ensure_ascii=False,indent=2),encoding='utf-8')
          # flatten all VTT caption files into readable transcripts
          for vtt in out.glob('*.vtt'):
              lines=[]
              for raw in vtt.read_text(encoding='utf-8',errors='ignore').splitlines():
                  s=raw.strip()
                  if not s or s=='WEBVTT' or '-->' in s or s.startswith(('Kind:','Language:','NOTE')):
                      continue
                  s=re.sub(r'<[^>]+>','',s)
                  s=re.sub(r'&nbsp;',' ',s)
                  s=re.sub(r'&amp;','&',s)
                  if s and (not lines or s!=lines[-1]): lines.append(s)
              (out/(vtt.stem+'.txt')).write_text('\n'.join(lines),encoding='utf-8')
          PY
          ls -lah "$OUT" > "$OUT/files.txt"
      - name: Commit evidence text
        shell: bash
        run: |
          set -e
          git config user.name 'runner-3-bot'
          git config user.email 'runner-3-bot@users.noreply.github.com'
          git add evidence/youtube_olifZrb263k
          git commit -m 'Add YouTube content evidence for olifZrb263k' || exit 0
          git push
