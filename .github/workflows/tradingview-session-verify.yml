name: TradingView Session Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-session-verify.yml'
      - 'ops/tradingview/session-state.json.aes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore TradingView session
        shell: bash
        run: |
          set -euo pipefail
          test -s ops/tradingview/session-state.json.aes
          test -n "${AUTOMATION_KEY:-}"
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in ops/tradingview/session-state.json.aes \
            -out /tmp/tv-storage-state.json
          python3 - <<'PY'
          import json
          state=json.load(open('/tmp/tv-storage-state.json'))
          assert state.get('cookies'), 'TradingView storage state has no cookies'
          print('TV_SESSION_DECRYPT=PASS')
          PY

      - name: Verify authenticated TradingView session
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright-core');
          (async()=>{
            const exes=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'];
            const executablePath=exes.find(p=>fs.existsSync(p));
            if(!executablePath) throw new Error('Chrome/Chromium missing');
            const storageState=JSON.parse(fs.readFileSync('/tmp/tv-storage-state.json','utf8'));
            const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({storageState,viewport:{width:1600,height:1000}});
            const page=await context.newPage();
            await page.goto('https://www.tradingview.com/chart/?symbol=BINANCE%3ABTCUSDT&interval=5',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(12000);
            const body=await page.locator('body').innerText().catch(()=> '');
            const cookies=await context.cookies();
            const authCookie=cookies.some(c=>/(^|\.)tradingview\.com$/i.test(c.domain.replace(/^\./,'')) && /session/i.test(c.name) && c.value);
            const signedOut=/\bSign in\b/i.test(body);
            console.log('TV_AUTH_SESSION_COOKIE='+(authCookie?'PASS':'FAIL'));
            console.log('TV_SIGNIN_UI='+(signedOut?'PRESENT':'ABSENT'));
            console.log('TV_CHART_LOADED='+(body.includes('BTCUSDT')?'PASS':'CHECK'));
            await browser.close();
            if(!authCookie || signedOut) process.exit(7);
          })().catch(e=>{console.error('TV_SESSION_VERIFY_ERROR='+e.stack);process.exit(7)});
          NODE

      - name: Cleanup decrypted session
        if: always()
        shell: bash
        run: rm -f /tmp/tv-storage-state.json
