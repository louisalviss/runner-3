name: JJK Montagem 30s V4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/jjk-montagem-30s-v4.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl openvpn iproute2 iptables
          python -m pip install -q -U yt-dlp numpy

      - name: Prepare isolated VN VPN namespace
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL --connect-timeout 15 --max-time 40 'https://www.vpngate.net/api/iphone/' -o vpngate.csv
          mkdir -p vpn_profiles
          python <<'PY'
          import csv,base64
          rows=[]
          with open('vpngate.csv',encoding='utf-8-sig',errors='replace',newline='') as f:
              for r in csv.reader(f):
                  if not r or r[0].startswith(('*','#')) or len(r)<15: continue
                  cc=r[6].strip().upper()
                  if cc not in {'VN','SG','JP','KR','TW'}: continue
                  try: score=int(r[2] or 0); cfg=base64.b64decode(r[14]).decode('utf-8','replace')
                  except Exception: continue
                  rows.append((cc,score,r[1],cfg))
          selected=[]
          for cc in ['VN','SG','JP','KR','TW']:
              selected += sorted((x for x in rows if x[0]==cc),key=lambda x:x[1],reverse=True)[:2]
          if not selected: raise SystemExit('No usable VPN Gate profile')
          with open('vpn_profiles/meta.tsv','w') as m:
              for i,(cc,score,ip,cfg) in enumerate(selected):
                  p=f'vpn_profiles/p{i:02d}_{cc}.ovpn'
                  open(p,'w').write(cfg.rstrip()+'\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 8\n')
                  m.write(f'{p}\t{cc}\t{score}\t{ip}\n')
          print(open('vpn_profiles/meta.tsv').read())
          PY
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf
          sudo ip netns add vpnns
          sudo ip link add veth-host type veth peer name veth-vpn
          sudo ip link set veth-vpn netns vpnns
          sudo ip addr add 10.203.0.1/24 dev veth-host
          sudo ip link set veth-host up
          sudo ip netns exec vpnns ip addr add 10.203.0.2/24 dev veth-vpn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set veth-vpn up
          sudo ip netns exec vpnns ip route add default via 10.203.0.1
          sudo sysctl -w net.ipv4.ip_forward=1
          WAN_IF=$(ip route show default | awk '/default/ {print $5; exit}')
          sudo iptables -t nat -A POSTROUTING -s 10.203.0.0/24 -o "$WAN_IF" -j MASQUERADE
          sudo iptables -A FORWARD -i veth-host -o "$WAN_IF" -j ACCEPT
          sudo iptables -A FORWARD -i "$WAN_IF" -o veth-host -m state --state RELATED,ESTABLISHED -j ACCEPT
          echo "BASE_NS_EGRESS=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 12 https://api.ipify.org)"

      - name: Download three official JJK PV sources
        shell: bash
        run: |
          set -euo pipefail
          YTDLP=$(command -v yt-dlp)
          SOURCES=(
            'DKNM-3LpfZE|jjk2026|JJK_SENDAI_2026_OFFICIAL'
            'VEjVqXiiUNY|jjk2025|JJK_EXECUTION_2025_OFFICIAL'
            'O6qVieflwqs|jjk2023|JJK_S2_PV2_2023_OFFICIAL'
          )
          connected=0
          while IFS=$'\t' read -r profile cc score ip; do
            [ -n "$profile" ] || continue
            echo "=== relay $cc score=$score ip=$ip ==="
            if [ -f /tmp/vpnns.pid ]; then sudo kill "$(cat /tmp/vpnns.pid)" 2>/dev/null || true; sleep 2; fi
            rm -f /tmp/vpnns.pid /tmp/vpnns.log
            sudo ip netns exec vpnns openvpn --config "$GITHUB_WORKSPACE/$profile" --daemon --writepid /tmp/vpnns.pid --log /tmp/vpnns.log || true
            ok=0
            for n in $(seq 1 18); do
              sudo ip netns exec vpnns ip link show tun0 >/dev/null 2>&1 && { ok=1; break; }
              sleep 1
            done
            [ "$ok" = 1 ] || continue
            egress=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 12 https://api.ipify.org || true)
            echo "VPN_EGRESS=$egress country=$cc"
            [ -n "$egress" ] || continue
            connected=1
            count=0
            for entry in "${SOURCES[@]}"; do
              IFS='|' read -r vid stem label <<< "$entry"
              rm -f "$stem".*
              echo "Downloading $label"
              if timeout 150s sudo ip netns exec vpnns env PATH="$PATH" HOME="$HOME" \
                "$YTDLP" --no-playlist --retries 1 --fragment-retries 1 --socket-timeout 18 \
                --js-runtimes node --remote-components ejs:github \
                -f 'bv*[height<=1080]+ba/b[height<=1080]' --merge-output-format mp4 --remux-video mp4 \
                -o "$GITHUB_WORKSPACE/$stem.%(ext)s" "https://www.youtube.com/watch?v=$vid"; then
                  f=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "$stem*.mp4" | head -n1)
                  if [ -n "${f:-}" ] && [ -s "$f" ]; then
                    [ "$f" = "$GITHUB_WORKSPACE/$stem.mp4" ] || mv "$f" "$GITHUB_WORKSPACE/$stem.mp4"
                    count=$((count+1))
                  fi
              fi
            done
            if [ "$count" -ge 2 ]; then
              echo "SOURCE_VPN_COUNTRY=$cc" >> "$GITHUB_ENV"
              echo "SOURCE_EGRESS=$egress" >> "$GITHUB_ENV"
              echo "SOURCE_COUNT=$count" >> "$GITHUB_ENV"
              break
            fi
          done < vpn_profiles/meta.tsv
          [ "$connected" = 1 ] || { echo 'No VPN relay connected'; exit 21; }
          count=$(find . -maxdepth 1 -name 'jjk20*.mp4' -type f | wc -l)
          [ "$count" -ge 2 ] || { echo "Only $count JJK sources downloaded"; exit 22; }
          [ -f /tmp/vpnns.pid ] && sudo kill "$(cat /tmp/vpnns.pid)" 2>/dev/null || true
          for f in jjk20*.mp4; do echo "--- $f ---"; ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=nw=1 "$f"; done

      - name: Download Pixabay PHONK MONTAGEM
        shell: bash
        run: |
          set -euxo pipefail
          PAGE='https://pixabay.com/music/upbeat-phonk-montagem-411215/'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' "$PAGE" -o pixabay.html
          python <<'PY'
          import re,html,urllib.request,sys
          raw=open('pixabay.html','r',encoding='utf-8',errors='replace').read()
          txt=html.unescape(raw).replace('\\u002F','/').replace('\\/','/')
          pats=[
            r'https://cdn\.pixabay\.com/download/audio/[^"\'<> ]+?\.mp3[^"\'<> ]*',
            r'"audio_url"\s*:\s*"(https:[^"]+?\.mp3[^"]*)"',
            r'"download_url"\s*:\s*"(https:[^"]+?\.mp3[^"]*)"'
          ]
          url=None
          for p in pats:
              m=re.search(p,txt)
              if m:
                  url=m.group(1) if m.lastindex else m.group(0)
                  break
          if not url:
              print('NO_DIRECT_AUDIO_URL')
              sys.exit(3)
          url=html.unescape(url).replace('\\u0026','&')
          print('PIXABAY_AUDIO_URL',url)
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://pixabay.com/'})
          with urllib.request.urlopen(req,timeout=40) as r, open('montagem.mp3','wb') as o:
              o.write(r.read())
          PY
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 montagem.mp3

      - name: Analyze beat and action moments
        shell: bash
        run: |
          set -euxo pipefail
          python <<'PY'
          import subprocess,numpy as np,json,glob,os
          sr=8000
          b=subprocess.check_output(['ffmpeg','-hide_banner','-loglevel','error','-ss','4','-t','45','-i','montagem.mp3','-ac','1','-ar',str(sr),'-f','f32le','-'])
          x=np.frombuffer(b,dtype=np.float32)
          hop=256; n=(len(x)//hop)*hop
          frames=x[:n].reshape(-1,hop)
          rms=np.sqrt(np.mean(frames*frames,axis=1)+1e-12)
          onset=np.maximum(0,np.diff(rms,prepend=rms[0])); onset-=onset.mean()
          lo=int(0.28*sr/hop); hi=int(0.62*sr/hop)
          vals=[]
          for lag in range(lo,hi+1): vals.append((float(np.dot(onset[:-lag],onset[lag:])),lag))
          _,lag=max(vals); beat=float(lag*hop/sr)
          beat=max(0.32,min(0.54,beat))
          print('BEAT_SECONDS',beat)

          candidates=[]
          for src in sorted(glob.glob('jjk20*.mp4')):
              meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',src]))
              dur=float(meta['format']['duration'])
              w,h,fps=256,144,6
              p=subprocess.Popen(['ffmpeg','-hide_banner','-loglevel','error','-i',src,'-vf',f'scale={w}:{h},fps={fps}','-pix_fmt','gray','-f','rawvideo','-'],stdout=subprocess.PIPE)
              prev=None; i=0; size=w*h
              while True:
                  bb=p.stdout.read(size)
                  if len(bb)<size: break
                  cur=np.frombuffer(bb,np.uint8).reshape(h,w)
                  if prev is not None:
                      d=np.abs(cur.astype(np.int16)-prev.astype(np.int16)).astype(np.float32)
                      t=i/fps; lum=float(cur.mean()); std=float(cur.std())
                      motion=float(d.mean()); p90=float(np.percentile(d,90))
                      # penalize near-black/near-white/title-like flat frames; reward detailed moving anime frames
                      flat_pen=max(0.0,28.0-std)*1.1
                      lum_pen=18.0 if lum<24 or lum>232 else 0.0
                      score=motion*.56+p90*.38+min(std,70)*.12-flat_pen-lum_pen
                      if 1.0<t<dur-1.0:
                          candidates.append((score,src,t,motion,std,lum))
                  prev=cur; i+=1
              p.wait()

          # Diverse high-action pool: enforce spacing within each source first.
          picked=[]
          for item in sorted(candidates,reverse=True):
              score,src,t,*_=item
              if all(not (src==q[1] and abs(t-q[2])<0.62) for q in picked):
                  picked.append(item)
              if len(picked)>=90: break
          if len(picked)<55: raise SystemExit(f'Only {len(picked)} usable moments')
          # round-robin by source for variety, while keeping strongest first within each source
          by={}
          for it in picked: by.setdefault(it[1],[]).append(it)
          for k in by: by[k].sort(reverse=True)
          order=[]
          names=sorted(by)
          while any(by.values()):
              for n in names:
                  if by[n]: order.append(by[n].pop(0))
          clips=[]; total=0.0; idx=0
          # Mix half-beat / one-beat / 1.5-beat cuts to feel less machine-gun repetitive.
          pattern=[1.0,1.0,0.5,1.0,1.5,0.5,1.0,1.0]
          while total < 30.0-1e-6:
              it=order[idx%len(order)]; idx+=1
              mult=pattern[(idx-1)%len(pattern)]
              d=beat*mult
              if total+d>30.0: d=30.0-total
              if d<0.12: break
              score,src,t,motion,std,lum=it
              start=max(0.0,t-0.10)
              clips.append({'src':src,'t':round(start,3),'d':round(d,3),'score':round(score,2)})
              total+=d
          json.dump({'beat':beat,'total':round(total,3),'clips':clips},open('edit.json','w'),indent=2)
          print('CLIPS',len(clips),'TOTAL',total,'SOURCES',names)
          print(json.dumps(clips[:12],indent=2))
          PY

      - name: Render 30 second iPhone montage
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p clips
          python <<'PY'
          import json,subprocess
          e=json.load(open('edit.json'))
          for i,c in enumerate(e['clips']):
              flash="drawbox=x=0:y=0:w=iw:h=ih:color=white@0.12:t=fill:enable='lt(t,0.03)'," if i%6==0 else ''
              # preserve original composition in centered 16:9 foreground; blurred background fills 9:16.
              fc=(
                '[0:v]split=2[bg][fg];'
                '[bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=36,eq=brightness=-0.24:saturation=.72[bg2];'
                '[fg]scale=1040:585:force_original_aspect_ratio=decrease,pad=1040:585:(ow-iw)/2:(oh-ih)/2:black,'
                "eq=contrast=1.08:saturation=1.13,unsharp=5:5:.38:5:5:0[fg2];"
                '[bg2][fg2]overlay=(W-w)/2:(H-h)/2,'+flash+
                "scale='1080+10*sin(18*t)':'1920+18*sin(18*t)',crop=1080:1920:(iw-ow)/2:(ih-oh)/2,"
                'fps=30,format=yuv420p[v]'
              )
              out=f'clips/c{i:03d}.mp4'
              subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(c['t']),'-i',c['src'],'-t',str(c['d']),'-filter_complex',fc,'-map','[v]','-an','-c:v','libx264','-preset','medium','-crf','18','-profile:v','high','-level','4.1','-pix_fmt','yuv420p',out])
          with open('concat.txt','w') as f:
              for i in range(len(e['clips'])): f.write(f"file 'clips/c{i:03d}.mp4'\n")
          PY
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i concat.txt -c copy visual.mp4
          # Start near the track's first energetic section and hard-cap to 30.0s.
          ffmpeg -hide_banner -loglevel error -y -i visual.mp4 -ss 4 -i montagem.mp3 -t 30 \
            -map 0:v:0 -map 1:a:0 -c:v copy \
            -af 'volume=.98,bass=g=3.5:f=90,alimiter=limit=.95' -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -movflags +faststart jjk_montagem_30s_v4.mp4
          echo "SOURCE_VPN_COUNTRY=${SOURCE_VPN_COUNTRY:-unknown} SOURCE_EGRESS=${SOURCE_EGRESS:-unknown} SOURCE_COUNT=${SOURCE_COUNT:-unknown}"
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,sample_rate,channels -show_entries format=duration,size,bit_rate -of default=nw=1 jjk_montagem_30s_v4.mp4

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: jjk-montagem-30s-v4
          path: jjk_montagem_30s_v4.mp4
          retention-days: 3
