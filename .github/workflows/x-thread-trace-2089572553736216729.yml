name: X Thread Trace 2089572553736216729

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x-thread-trace-2089572553736216729.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and reconstruct X conversation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence x-trace
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, pathlib
          ID='2089572553736216729'; HANDLE='mtrainier2020'
          UA='runner-3-x-thread-trace/1.1 (+https://github.com/louisalviss/runner-3)'

          def fetch(url):
            try:
              q=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,*/*'})
              with urllib.request.urlopen(q,timeout=30) as r:
                return {'ok':True,'status':r.status,'url':r.geturl(),'body':r.read().decode('utf-8','replace')}
            except Exception as e:
              return {'ok':False,'url':url,'error':f'{type(e).__name__}: {e}'}

          endpoints={
            'conversation':f'https://api.fxtwitter.com/2/conversation/{ID}',
            'legacy':f'https://api.fxtwitter.com/{HANDLE}/status/{ID}',
            'vx':f'https://api.vxtwitter.com/{HANDLE}/status/{ID}',
            'syndication':f'https://cdn.syndication.twimg.com/tweet-result?id={ID}&lang=en'
          }
          raw={k:fetch(v) for k,v in endpoints.items()}
          for k,v in raw.items():
            pathlib.Path(f'evidence/{k}.json').write_text(v.get('body') or json.dumps(v,indent=2),encoding='utf-8')
            print('FETCH',k,v.get('ok'),v.get('status'),v.get('error',''),len(v.get('body','')))

          def js(name):
            try:return json.loads(raw[name].get('body') or '')
            except:return None
          conv=js('conversation')

          def c(t):
            if not isinstance(t,dict): return None
            a=t.get('author') or {}; media=t.get('media') or {}
            return {
              'id':str(t.get('id') or ''), 'created_at':t.get('created_at'),
              'author':a.get('screen_name') or a.get('username') or a.get('name'),
              'text':t.get('text'), 'url':t.get('url'), 'replying_to':t.get('replying_to'),
              'likes':t.get('likes'),'reposts':t.get('reposts'),'quotes':t.get('quotes'),'replies':t.get('replies'),'views':t.get('views'),
              'quote':c(t.get('quote')) if isinstance(t.get('quote'),dict) and t.get('quote',{}).get('id') else t.get('quote'),
              'photos':[x.get('url') for x in (media.get('photos') or []) if isinstance(x,dict)],
              'videos':[x.get('url') for x in (media.get('videos') or []) if isinstance(x,dict)]
            }

          report={'target_id':ID,'target_handle':HANDLE,
                  'sources':{k:{z:v.get(z) for z in ('ok','status','url','error')} for k,v in raw.items()}}
          if isinstance(conv,dict):
            report['code']=conv.get('code'); report['status']=c(conv.get('status')); report['author']=conv.get('author')
            report['thread']=[c(x) for x in (conv.get('thread') or []) if isinstance(x,dict)]
            report['replies']=[c(x) for x in (conv.get('replies') or []) if isinstance(x,dict)]
            report['cursor']=conv.get('cursor')
            allx=[conv.get('status')]+list(conv.get('thread') or [])+list(conv.get('replies') or [])
            same=[]; seen=set()
            for x in allx:
              if not isinstance(x,dict):continue
              a=x.get('author') or {}; h=(a.get('screen_name') or a.get('username') or '').lower()
              if h==HANDLE.lower() and str(x.get('id') or '') not in seen:
                seen.add(str(x.get('id') or '')); same.append(c(x))
            report['same_author_candidates']=same
            cur=conv.get('cursor') or {}; bottom=cur.get('bottom') if isinstance(cur,dict) else None
            if bottom:
              p2=fetch(f'https://api.fxtwitter.com/2/conversation/{ID}?cursor='+urllib.parse.quote(bottom,safe=''))
              report['page2_source']={z:p2.get(z) for z in ('ok','status','url','error')}
              pathlib.Path('evidence/conversation-page2.json').write_text(p2.get('body') or json.dumps(p2,indent=2),encoding='utf-8')
              try:
                j=json.loads(p2.get('body') or ''); report['page2_replies']=[c(x) for x in (j.get('replies') or []) if isinstance(x,dict)]
              except: pass
          for k in ('legacy','vx','syndication'):
            j=js(k)
            if j is not None: report[k]=j
          out=json.dumps(report,indent=2,ensure_ascii=False)
          pathlib.Path('evidence/report.json').write_text(out,encoding='utf-8')
          pathlib.Path(f'x-trace/{ID}.json').write_text(out,encoding='utf-8')
          print('===REPORT==='); print(json.dumps(report,ensure_ascii=False)); print('===END===')
          PY
      - name: Publish result to repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add x-trace/2089572553736216729.json
          if ! git diff --cached --quiet; then
            git commit -m 'store X thread trace 2089572553736216729'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x-thread-trace-2089572553736216729-${{ github.run_id }}
          path: evidence/
          retention-days: 3
