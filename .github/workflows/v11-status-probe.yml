name: V11 Status Probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/v11-status-probe.yml']
permissions:
  actions: read
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query V11 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit/solo-beru-v11
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=8a8740939574a53c2920f6a362966ffb27543574&per_page=10" -o runs.json
          python <<'PY'
          import json
          d=json.load(open('runs.json')); rs=d.get('workflow_runs',[])
          r=next((x for x in rs if x.get('path')=='.github/workflows/solo-beru-xonada-v11-timeline.yml'), rs[0] if rs else None)
          if not r: open('audit/solo-beru-v11/status.txt','w').write('NO_RUN\n')
          else:
            keys=['id','status','conclusion','created_at','updated_at','html_url','path']
            open('audit/solo-beru-v11/status.txt','w').write('\n'.join(f'{k}={r.get(k)}' for k in keys)+'\n')
          PY
      - name: Commit probe result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add audit/solo-beru-v11/status.txt
          git commit -m 'Record Solo Beru V11 run status' || exit 0
          git pull --rebase origin main || true
          git push
