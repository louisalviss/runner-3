name: SEC Archive Test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sec-archive-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          import urllib.request
          H={'User-Agent':'Louis research contact@example.com'}
          urls=[
            'https://www.sec.gov/Archives/edgar/data/1378872/000175272425180531/0001752724-25-180531.txt',
            'https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=1378872&type=NPORT-P&dateb=&owner=exclude&count=100&output=atom',
            'https://www.sec.gov/Archives/edgar/full-index/2025/QTR2/master.idx'
          ]
          for u in urls:
              try:
                  req=urllib.request.Request(u,headers=H)
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=r.read(300000)
                      print('OK',r.status,len(data),u,'HEAD',data[:80])
              except Exception as e:
                  print('ERROR',repr(e),u)
          PY
