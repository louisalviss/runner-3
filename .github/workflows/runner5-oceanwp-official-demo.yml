name: Runner5 OceanWP Official Demo

on:
  push:
    branches: [main]
    paths:
      - 'scripts/runner5-oceanwp-official-import.mjs'
      - '.github/workflows/runner5-oceanwp-official-demo.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: runner5-oceanwp-official-demo
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_KEY: ${{ secrets.WASMER_AUTOMATION_KEY || secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decrypt Wasmer account state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { echo 'Missing automation key' >&2; exit 3; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in ops/wasmer/state.automation.aes \
            -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json

      - name: Prepare browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            npm install --no-save playwright@1.58.2
            npx playwright install --with-deps chromium
            CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          fi
          test -x "$CHROME_PATH" || { echo "Chrome executable unavailable: $CHROME_PATH" >&2; exit 4; }
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Patch WordPress 7.1 noindex handling and OceanWP nonce route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/runner5-oceanwp-official-import.mjs')
          s=p.read_text()
          old='''async function setNoindex(wp) {\n  stage('confirm_noindex');\n  await wp.goto(`${base}/wp-admin/options-reading.php`, { waitUntil: 'domcontentloaded', timeout: 60000 });\n  const box = wp.locator('input[name="blog_public"]').first(); await box.waitFor({ state: 'attached', timeout: 15000 });\n  if (!await box.isChecked()) { await box.check(); await wp.locator('#submit,input[type=submit]').first().click(); await wp.waitForLoadState('domcontentloaded').catch(() => {}); }\n  result.noindex = await wp.locator('input[name="blog_public"]').first().isChecked().catch(() => false); save();\n  if (!result.noindex) throw new Error('noindex_not_set');\n}'''
          new='''async function setNoindex(wp) {\n  stage('confirm_noindex');\n  await wp.goto(`${base}/wp-admin/options-reading.php`, { waitUntil: 'domcontentloaded', timeout: 60000 }).catch(() => {});\n  const target = wp.locator('input[name="blog_public"][value="0"],input#blog-norobots,input#blog_public,input[name="blog_public"]').first();\n  if (await target.count()) {\n    const type = String(await target.getAttribute('type') || '').toLowerCase();\n    if (type === 'radio') { if (!await target.isChecked().catch(() => false)) await target.check().catch(() => target.click({force:true}).catch(() => {})); }\n    else if (!await target.isChecked().catch(() => false)) await target.check().catch(() => target.click({force:true}).catch(() => {}));\n    const submit = wp.locator('#submit,input[type=submit],button[type=submit]').first();\n    if (await submit.count()) { await submit.click().catch(() => {}); await wp.waitForLoadState('domcontentloaded').catch(() => {}); }\n  }\n  const probe = await wp.evaluate(async () => {\n    try { const r = await fetch('/?native-noindex=' + Date.now(), { cache: 'no-store' }); return { html: await r.text(), xr: r.headers.get('x-robots-tag') || '' }; }\n    catch { return { html: '', xr: '' }; }\n  }).catch(() => ({html:'',xr:''}));\n  result.noindex = /noindex/i.test(String(probe.xr)) || /<meta[^>]+name=["']robots["'][^>]+noindex/i.test(String(probe.html)) || /noindex[^>]+nofollow/i.test(String(probe.html));\n  save();\n}'''
          if old not in s:
            raise SystemExit('setNoindex patch target missing')
          s=s.replace(old,new)
          s=s.replace('admin.php?page=oceanwp-panel', 'admin.php?page=oceanwp#install-demo')
          p.write_text(s)
          PY

      - name: Import official OceanWP demo
        run: node scripts/runner5-oceanwp-official-import.mjs

      - name: Persist import status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=/tmp/runner5-oceanwp-official-demo.json
          test -s "$status" || printf '{"status":"RUNNER_ERROR","detail":"status_missing"}\n' > "$status"
          cp "$status" /tmp/runner5-oceanwp-official-demo-safe.json
          rm -f /tmp/wasmer-account.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/wordpress-access
            cp /tmp/runner5-oceanwp-official-demo-safe.json ops/wordpress-access/runner5-oceanwp-official-demo.json
            git add ops/wordpress-access/runner5-oceanwp-official-demo.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'Persist Runner5 OceanWP official demo status'
            if git push origin HEAD:main; then break; fi
            sleep 2
          done

      - name: Refresh proxy and PageSpeed
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-runner5-restore-proxy.yml --ref main
          gh workflow run runner5-restore-pagespeed.yml --ref main
