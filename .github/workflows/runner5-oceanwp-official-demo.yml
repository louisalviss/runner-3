name: Runner5 Demo Build Forwarder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner5-oceanwp-official-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: runner5-demo-build-forwarder
  cancel-in-progress: true

jobs:
  dispatch-kadence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch official Kadence starter import
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run runner5-kadence-starter.yml --ref main
          echo 'Dispatched Runner5 Kadence Starter Site'
