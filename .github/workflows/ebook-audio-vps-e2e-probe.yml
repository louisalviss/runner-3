name: Ebook Audio VPS Live E2E Probe

on:
  push:
    branches:
      - ops/ebook-audio-vps-e2e-20260901
    paths:
      - .github/workflows/ebook-audio-vps-e2e-probe.yml

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe fresh production audio job
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://runner3-core.ducduy2411.workers.dev'
          BOOK_KEY='core/ebook/ops-vps-e2e/final/probe-tokenfile-auth-v2.epub'
          TEXT='Đây là bài kiểm tra production mới sau khi khôi phục consumer âm thanh trên VPS. Job này phải được consumer Linveo nhận từ hàng đợi, tạo audio giọng Nam Minh, xuất timing và chuyển trạng thái sang ready mà không phụ thuộc vào job kiểm tra cũ.'
          PAYLOAD="$(jq -nc --arg bookKey "$BOOK_KEY" --arg text "$TEXT" '{bookKey:$bookKey,text:$text,chapterTitle:"Fresh VPS auth recovery probe",chapterHref:"ops-vps-auth-recovery-v2",bookTitle:"Ebook Audio Fresh Production E2E"}')"
          CREATE="$(curl --fail-with-body --silent --show-error --max-time 20 -H 'content-type: application/json' -d "$PAYLOAD" "$BASE/artifact-library/audio")"
          ID="$(jq -r '.id // empty' <<<"$CREATE")"
          test -n "$ID"
          echo "created_id=$ID"
          ENCODED_BOOK="$(printf '%s' "$BOOK_KEY" | jq -sRr @uri)"

          STATE="$CREATE"
          for i in $(seq 1 60); do
            STATE="$(curl --fail-with-body --silent --show-error --max-time 15 "$BASE/artifact-library/audio?bookKey=$ENCODED_BOOK&id=$ID")"
            STATUS="$(jq -r '.status // empty' <<<"$STATE")"
            echo "poll=$i status=$STATUS"
            [ "$STATUS" = 'ready' ] && break
            [ "$STATUS" = 'error' ] && break
            sleep 1
          done

          jq '{id,status,bookKey,durationSeconds,timingAvailable,voice,voiceRate,updatedAt,error,mediaPresent:(.mediaUrl!=null),timingUrlPresent:(.timingUrl!=null)}' <<<"$STATE" | tee probe-result.json

          test "$(jq -r '.status' <<<"$STATE")" = 'ready'
          test "$(jq -r '.mediaUrl != null' <<<"$STATE")" = 'true'
          test "$(jq -r '.timingUrl != null' <<<"$STATE")" = 'true'
          test "$(jq -r '.timingAvailable == true' <<<"$STATE")" = 'true'
          jq -e '(.durationSeconds // 0) > 0' <<<"$STATE" >/dev/null
          test "$(jq -r '.error == null' <<<"$STATE")" = 'true'
          echo 'FRESH_PRODUCTION_E2E=PASS'

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebook-audio-vps-probe-result-auth-recovery-v2
          path: probe-result.json
          if-no-files-found: error
