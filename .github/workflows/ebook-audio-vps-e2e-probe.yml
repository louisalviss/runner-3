name: Ebook Audio VPS Live E2E Probe

on:
  push:
    branches:
      - ops/ebook-audio-vps-e2e-20260901
    paths:
      - .github/workflows/ebook-audio-vps-e2e-probe.yml

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe real audio job
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://runner3-core.ducduy2411.workers.dev'
          BOOK_KEY='core/ebook/ops-vps-e2e/final/probe.epub'
          TEXT='Đây là bài kiểm tra trực tiếp cho hệ thống đọc sách bằng giọng nói trên VPS. Mục tiêu là xác nhận hàng đợi được nhận, âm thanh được tạo, dữ liệu thời gian được xuất bản và trạng thái cuối cùng chuyển sang sẵn sàng.'
          PAYLOAD="$(jq -nc --arg bookKey "$BOOK_KEY" --arg text "$TEXT" '{bookKey:$bookKey,text:$text,chapterTitle:"VPS E2E probe",chapterHref:"ops-vps-e2e",bookTitle:"Ebook Audio VPS E2E"}')"
          CREATE="$(curl --fail-with-body --silent --show-error --max-time 20 -H 'content-type: application/json' -d "$PAYLOAD" "$BASE/artifact-library/audio")"
          ID="$(jq -r '.id // empty' <<<"$CREATE")"
          test -n "$ID"
          ENCODED_BOOK="$(printf '%s' "$BOOK_KEY" | jq -sRr @uri)"

          STATE="$CREATE"
          for i in $(seq 1 15); do
            STATE="$(curl --fail-with-body --silent --show-error --max-time 15 "$BASE/artifact-library/audio?bookKey=$ENCODED_BOOK&id=$ID")"
            STATUS="$(jq -r '.status // empty' <<<"$STATE")"
            echo "poll=$i status=$STATUS"
            [ "$STATUS" = 'ready' ] && break
            [ "$STATUS" = 'error' ] && break
            sleep 1
          done

          jq '{id,status,bookKey,durationSeconds,timingAvailable,voice,voiceRate,updatedAt,error,mediaPresent:(.mediaUrl!=null),timingUrlPresent:(.timingUrl!=null)}' <<<"$STATE" > probe-result.json
          cat probe-result.json

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebook-audio-vps-probe-result
          path: probe-result.json
          if-no-files-found: error
