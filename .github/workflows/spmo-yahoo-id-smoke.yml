name: SPMO Yahoo ID Smoke
on:
  push:
    branches: [main]
    paths:
      - 'spmo-modern2/yahoo_id_smoke.py'
      - '.github/workflows/spmo-yahoo-id-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -u spmo-modern2/yahoo_id_smoke.py
