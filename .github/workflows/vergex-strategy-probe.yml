name: VergeX Strategy Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/vergex-probe-request.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python3 -m pip install -q 'playwright>=1.46,<2' requests
          python3 -m playwright install chromium >/tmp/pw-install.log 2>&1 || true
          mkdir -p evidence

      - name: Capture original X media
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, requests, urllib.parse
          from playwright.sync_api import sync_playwright
          URL='https://x.com/coseryaya/status/2089241591173288209?s=12'
          out={'url':URL,'articles':[],'media':[]}
          media=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              c=b.new_context(viewport={'width':1440,'height':1200},locale='en-US')
              page=c.new_page()
              r=page.goto(URL,wait_until='domcontentloaded',timeout=30000)
              page.wait_for_timeout(6000)
              out['status']=r.status if r else None
              out['title']=page.title()
              out['body']=page.locator('body').inner_text()[:20000]
              arts=page.locator('article')
              for i in range(min(arts.count(),12)):
                  a=arts.nth(i)
                  try: text=a.inner_text()[:8000]
                  except: text=''
                  try:
                      imgs=a.locator('img').evaluate_all("els=>els.map(x=>({src:x.src,alt:x.alt,srcset:x.srcset}))")
                  except: imgs=[]
                  rec={'index':i,'text':text,'images':imgs}
                  out['articles'].append(rec)
                  for im in imgs:
                      s=im.get('src') or ''
                      if 'pbs.twimg.com/media/' in s and s not in media:
                          media.append(s)
              # Carousel may lazily swap the second/third image.
              for _ in range(4):
                  try:
                      nxt=page.locator('button[aria-label="Next"]').first
                      if not nxt.count() or not nxt.is_visible(): break
                      nxt.click(timeout=2000)
                      page.wait_for_timeout(1200)
                      for s in page.locator('article').first.locator('img').evaluate_all("els=>els.map(x=>x.src)"):
                          if 'pbs.twimg.com/media/' in s and s not in media: media.append(s)
                  except: break
              page.screenshot(path='evidence/x-post-full.png',full_page=True)
              c.close(); b.close()

          headers={'User-Agent':'Mozilla/5.0'}
          for i,s in enumerate(media):
              u=urllib.parse.urlsplit(s)
              q=urllib.parse.parse_qs(u.query)
              fmt=(q.get('format') or ['jpg'])[0]
              base=urllib.parse.urlunsplit((u.scheme,u.netloc,u.path,'',''))
              orig=f'{base}?format={fmt}&name=orig'
              rec={'index':i,'src':s,'orig':orig}
              try:
                  rr=requests.get(orig,headers=headers,timeout=25)
                  rec['status']=rr.status_code; rec['bytes']=len(rr.content); rec['content_type']=rr.headers.get('content-type','')
                  if rr.ok and rr.content:
                      ext='png' if 'png' in rec['content_type'] else 'jpg'
                      path=f'evidence/media-{i}.{ext}'
                      pathlib.Path(path).write_bytes(rr.content)
                      rec['path']=path
              except Exception as e: rec['error']=str(e)
              out['media'].append(rec)
          pathlib.Path('evidence/x-media.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print('STATUS',out.get('status'),out.get('title'))
          print('MEDIA_COUNT',len(out['media']))
          for x in out['media']: print('MEDIA',json.dumps(x,ensure_ascii=False))
          print('=== ARTICLES ===')
          for a in out['articles']:
              print('ARTICLE',a['index'],a['text'][:3500].replace('\n',' | '))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vergex-strategy-media-${{ github.run_id }}
          path: evidence/
          retention-days: 3
