name: Wave Rider Pivot Tie Direction Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wave-rider-parity-pivot-direction-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pivot-direction:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BNBUSDT, TRXUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WR_SYMBOL: ${{ matrix.symbol }}
      WR_START: 2026-07-27
      WR_END: 2026-08-16
      FROZEN_REFERENCE_BLOB: 2ba5f66d33e2e483a4c669c95f3b97778c80fcd0
    steps:
      - uses: actions/checkout@v4

      - name: Validate and build pivot variants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object wave-rider-verify/reference_verify.py)" = "$FROZEN_REFERENCE_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          src=Path('wave-rider-verify/reference_verify.py').read_text()
          old="""        if v[c]==ext:\n            if sum(x==ext for x in w)==1: base[conf]=v[c]\n            else: ties+=1\n"""
          assert src.count(old)==1
          rightmost="""        if v[c]==ext:\n            # Tie semantics candidate A: center must be the most-recent extreme.\n            # Equal extremes to the left are allowed; equal extremes to the right disqualify.\n            if all(x!=ext for x in v[c+1:c+right+1]): base[conf]=v[c]\n            else: ties+=1\n"""
          leftmost="""        if v[c]==ext:\n            # Tie semantics candidate B: center must be the oldest extreme.\n            # Equal extremes to the right are allowed; equal extremes to the left disqualify.\n            if all(x!=ext for x in v[c-left:c]): base[conf]=v[c]\n            else: ties+=1\n"""
          Path('/tmp/reference_rightmost.py').write_text(src.replace(old,rightmost,1))
          Path('/tmp/reference_leftmost.py').write_text(src.replace(old,leftmost,1))
          PY

      - name: Run rightmost-tie candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wave-rider-verify/output
          python3 /tmp/reference_rightmost.py >/tmp/rightmost-run.txt
          cp "wave-rider-verify/output/${WR_SYMBOL}_5m_trades.csv" "/tmp/${WR_SYMBOL}-rightmost.csv"

      - name: Run leftmost-tie candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wave-rider-verify/output
          python3 /tmp/reference_leftmost.py >/tmp/leftmost-run.txt
          cp "wave-rider-verify/output/${WR_SYMBOL}_5m_trades.csv" "/tmp/${WR_SYMBOL}-leftmost.csv"

      - name: Score against TradingView native ledger
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,json,os
          from pathlib import Path
          sym=os.environ['WR_SYMBOL']
          tv_entries={
            'BNBUSDT':[
              '2026-07-27T05:55:00Z','2026-07-27T10:05:00Z','2026-07-28T12:45:00Z','2026-07-30T15:20:00Z',
              '2026-08-03T04:10:00Z','2026-08-05T02:40:00Z','2026-08-05T10:00:00Z','2026-08-08T03:45:00Z',
              '2026-08-08T04:35:00Z','2026-08-08T19:05:00Z','2026-08-12T03:20:00Z','2026-08-13T19:35:00Z',
              '2026-08-14T10:40:00Z','2026-08-16T04:10:00Z'],
            'TRXUSDT':[
              '2026-07-27T18:10:00Z','2026-07-28T08:20:00Z','2026-07-29T10:25:00Z','2026-07-29T16:00:00Z',
              '2026-08-03T06:15:00Z','2026-08-05T08:15:00Z','2026-08-05T10:55:00Z','2026-08-06T17:40:00Z',
              '2026-08-07T15:15:00Z','2026-08-10T13:00:00Z','2026-08-14T19:25:00Z','2026-08-16T10:05:00Z',
              '2026-08-16T19:00:00Z','2026-08-16T22:00:00Z']
          }[sym]
          expected=set(tv_entries)
          def read(name):
            with open(f'/tmp/{sym}-{name}.csv',newline='') as f:return list(csv.DictReader(f))
          def score(name):
            rows=read(name); actual={r['entry_time'] for r in rows}
            return {'count':len(rows),'matched':len(actual&expected),'missing':sorted(expected-actual),'extra':sorted(actual-expected),'entries':sorted(actual)}
          out={'symbol':sym,'expected_count':len(expected),'rightmost':score('rightmost'),'leftmost':score('leftmost')}
          Path(f'/tmp/{sym}-pivot-direction-score.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-pivot-direction-${{ matrix.symbol }}-${{ github.run_id }}
          path: |
            /tmp/${{ matrix.symbol }}-rightmost.csv
            /tmp/${{ matrix.symbol }}-leftmost.csv
            /tmp/${{ matrix.symbol }}-pivot-direction-score.json
            /tmp/rightmost-run.txt
            /tmp/leftmost-run.txt
          if-no-files-found: warn
          retention-days: 2
