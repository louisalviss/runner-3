name: Runner3 Core Shadow Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/runner3-core/**'
      - '.github/workflows/runner3-core-deploy.yml'

permissions:
  contents: write

concurrency:
  group: runner3-core-shadow-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create/reuse D1 and configure binding
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN']; account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database'
          h={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def call(url, method='GET', body=None):
            req=urllib.request.Request(url,data=(json.dumps(body).encode() if body else None),headers=h,method=method)
            with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          data=call(base+'?page=1&per_page=100')
          db=next((x for x in data.get('result',[]) if x.get('name')=='runner3-core'),None)
          if not db:
            db=call(base,'POST',{'name':'runner3-core'}).get('result')
          uuid=db.get('uuid') or db.get('id')
          if not uuid: raise SystemExit('D1 database id missing')
          p='cloudflare/runner3-core/wrangler.jsonc'
          cfg=json.load(open(p)); cfg['d1_databases'][0]['database_id']=uuid
          open(p,'w').write(json.dumps(cfg,indent=2)+'\n')
          open('/tmp/d1-id','w').write(uuid)
          PY

      - name: Apply D1 migration
        working-directory: cloudflare/runner3-core
        run: npx --yes wrangler@4 d1 execute runner3-core --remote --file=migrations/0001_init.sql

      - name: Deploy shadow Worker
        working-directory: cloudflare/runner3-core
        run: npx --yes wrangler@4 deploy

      - name: Smoke test Worker and D1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib, urllib.error, urllib.request

          token=os.environ['CLOUDFLARE_API_TOKEN']; account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          api='https://api.cloudflare.com/client/v4'
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          req=urllib.request.Request(f'{api}/accounts/{account}/workers/subdomain',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          subdomain=(data.get('result') or {}).get('subdomain')
          if not subdomain:
              raise SystemExit('workers.dev subdomain missing')

          base=f'https://runner3-core.{subdomain}.workers.dev'

          def get_json(path):
              req=urllib.request.Request(base+path,headers={'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status, json.load(r)

          def post_json(path,payload):
              body=json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=body,headers={'Content-Type':'application/json','Accept':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status, json.load(r)

          checked=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          result={'checkedAt':checked,'url':base,'d1DatabaseId':pathlib.Path('/tmp/d1-id').read_text().strip(),'ok':False}
          try:
              hc, health=get_json('/health')
              pc, posted=post_json('/events',{'source':'runner3-core-shadow','event_type':'health','payload':{'status':'ok','checkedAt':checked}})
              lc, latest=get_json('/events/latest')
              result.update({
                  'healthHttp':hc,
                  'health':health,
                  'postHttp':pc,
                  'post':posted,
                  'latestHttp':lc,
                  'latestCount':len(latest) if isinstance(latest,list) else None,
              })
              result['ok']=bool(
                  hc==200 and isinstance(health,dict) and health.get('ok') is True and health.get('d1') is True
                  and pc==200 and isinstance(posted,dict) and posted.get('ok') is True
                  and lc==200 and isinstance(latest,list) and len(latest)>=1
              )
          except Exception as e:
              result['error']=str(e)[:1000]

          pathlib.Path('/tmp/runner3-core-smoke.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if not result['ok']:
              raise SystemExit('runner3_core_smoke_failed')
          PY

      - name: Persist binding and smoke result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp cloudflare/runner3-core/wrangler.jsonc /tmp/runner3-core-wrangler.jsonc
          test -s /tmp/runner3-core-smoke.json || printf '{"ok":false,"error":"smoke_result_missing"}\n' >/tmp/runner3-core-smoke.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/runner3-core-wrangler.jsonc cloudflare/runner3-core/wrangler.jsonc
            mkdir -p ops/cloudflare-capability
            cp /tmp/runner3-core-smoke.json ops/cloudflare-capability/runner3-core-smoke.json
            git add cloudflare/runner3-core/wrangler.jsonc ops/cloudflare-capability/runner3-core-smoke.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Persist Runner3 Core smoke: ${GITHUB_RUN_ID} [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 3
