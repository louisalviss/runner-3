name: Runner3 Core Source Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/runner3-core/**'
      - '.github/scripts/runner3_core_deploy_smoke.py'
      - '.github/workflows/runner3-core-deploy.yml'

permissions:
  contents: read

concurrency:
  group: runner3-core-source-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Runner3 Core source without production credentials
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/runner3-core/opaque-mailbox-entry-v2.js
          node --check cloudflare/runner3-core/mailbox-entry.js
          node --check cloudflare/runner3-core/audio-entry.js
          node --check cloudflare/runner3-core/reader-media-entry.js
          node --check cloudflare/runner3-core/reddit-entry.js
          node --check cloudflare/runner3-core/rss-entry.js
          node --check cloudflare/runner3-core/src/audio-media.js
          node --check cloudflare/runner3-core/src/rss-reader-plus.js
          node --check cloudflare/runner3-core/src/rss-reader-audio.js
          node --check cloudflare/runner3-core/src/rss-library-page-v2.js
          node --check cloudflare/runner3-core/src/rss-reader-page-v3.js
          node --check cloudflare/runner3-core/src/rss-reader-page-v4.js
          node --check cloudflare/runner3-core/src/rss-reader-page-v5.js
          node --check cloudflare/runner3-core/src/rss-reader-page-v6.js
          node --check cloudflare/runner3-core/src/index.js
          grep -q 'vi-VN-NamMinhNeural' cloudflare/runner3-core/src/rss-reader-audio.js
          grep -q 'rss-reader-audio-v2' cloudflare/runner3-core/src/rss-reader-audio.js
          grep -q 'audio/timing' cloudflare/runner3-core/src/rss-reader-audio.js
          node --input-type=module - <<'NODE'
          import { handleRssReaderPlus } from './cloudflare/runner3-core/src/rss-reader-plus.js';
          import { polishRssLibraryResponse } from './cloudflare/runner3-core/src/rss-library-page-v2.js';
          import { renderReaderArticlePageV6 } from './cloudflare/runner3-core/src/rss-reader-page-v6.js';

          function validateBrowserScripts(html, label) {
            let cursor = 0;
            let count = 0;
            while (true) {
              const open = html.indexOf('<script', cursor);
              if (open < 0) break;
              const bodyStart = html.indexOf('>', open);
              const close = bodyStart < 0 ? -1 : html.indexOf('</script>', bodyStart + 1);
              if (bodyStart < 0 || close < 0) throw new Error(label + ': malformed inline script');
              const source = html.slice(bodyStart + 1, close);
              new Function(source);
              count += 1;
              cursor = close + 9;
            }
            if (!count) throw new Error(label + ': inline script missing');
            return count;
          }

          const libraryUrl = new URL('https://example.test/rss/library');
          const libraryRequest = new Request(libraryUrl);
          const libraryBase = await handleRssReaderPlus(libraryRequest, {}, libraryUrl);
          if (!libraryBase) throw new Error('Library renderer returned null');
          const libraryResponse = await polishRssLibraryResponse(libraryBase, libraryRequest, libraryUrl);
          const libraryScripts = validateBrowserScripts(await libraryResponse.text(), 'RSS Library');

          const articleUrl = new URL('https://example.test/rss/article/validation-article');
          const articleResponse = await renderReaderArticlePageV6(new Request(articleUrl), articleUrl);
          if (!articleResponse) throw new Error('Article renderer returned null');
          const articleHtml = await articleResponse.text();
          const articleScripts = validateBrowserScripts(articleHtml, 'RSS Reader');

          if (libraryScripts < 2) throw new Error('RSS Library UX polish script missing');
          if (articleScripts < 4) throw new Error('RSS Reader timing script missing');
          if (!articleHtml.includes('rss-reader-nam-minh-v1')) throw new Error('RSS Reader Nam Minh marker missing');
          if (!articleHtml.includes('rss-reader-nam-minh-timing-v2')) throw new Error('RSS Reader timing marker missing');
          console.log('Generated polished RSS Library/Reader browser scripts parse OK');
          console.log('RSS Reader Nam Minh MP3 + Edge word timing client path present');
          NODE
          python3 - <<'PY'
          import json
          p='cloudflare/runner3-core/wrangler.jsonc'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('name') == 'runner3-core'
          assert d.get('main') == 'opaque-mailbox-entry-v2.js'
          assert d.get('d1_databases')
          buckets={x.get('binding'):x.get('bucket_name') for x in d.get('r2_buckets',[])}
          assert buckets.get('ARTIFACTS') == 'runner3-artifacts'
          assert buckets.get('AUDIO_MEDIA') == 'runner3-wp-media'
          print('Runner3 Core source validation OK')
          print('Entry chain: opaque-mailbox-v2 -> mailbox -> audio -> reader-media')
          print('Production deploy owner: private louisalviss/vps-control')
          print('RSS audio: normalized Reader text -> Nam Minh -> MP3 + paragraph timing')
          PY