name: Runner3 Core Shadow Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-core-shadow-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create/reuse D1 and configure binding
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN']; account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database'
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def call(url, method='GET', body=None):
            req=urllib.request.Request(url,data=(json.dumps(body).encode() if body else None),headers=headers,method=method)
            with urllib.request.urlopen(req,timeout=30) as response: return json.load(response)
          data=call(base+'?page=1&per_page=100')
          db=next((x for x in data.get('result',[]) if x.get('name')=='runner3-core'),None)
          if not db:
            db=call(base,'POST',{'name':'runner3-core'}).get('result')
          uuid=db.get('uuid') or db.get('id')
          if not uuid: raise SystemExit('D1 database id missing')
          path='cloudflare/runner3-core/wrangler.jsonc'
          cfg=json.load(open(path))
          cfg['d1_databases'][0]['database_id']=uuid
          open(path,'w').write(json.dumps(cfg,indent=2)+'\n')
          open('/tmp/d1-id','w').write(uuid)
          PY

      - name: Apply D1 migrations
        working-directory: cloudflare/runner3-core
        shell: bash
        run: |
          set -euo pipefail
          for migration in migrations/*.sql; do
            echo "Applying ${migration}"
            npx --yes wrangler@4 d1 execute runner3-core --remote --file="${migration}"
          done

      - name: Deploy shadow Worker
        working-directory: cloudflare/runner3-core
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/runner3-core-deploy.log

      - name: Smoke test Worker, auth, D1 and R2
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/runner3_core_deploy_smoke.py

      - name: Persist binding and smoke result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp cloudflare/runner3-core/wrangler.jsonc /tmp/runner3-core-wrangler.jsonc
          test -s /tmp/runner3-core-smoke.json || printf '{"ok":false,"error":"smoke_result_missing"}\n' >/tmp/runner3-core-smoke.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/runner3-core-wrangler.jsonc cloudflare/runner3-core/wrangler.jsonc
            mkdir -p ops/cloudflare-capability
            cp /tmp/runner3-core-smoke.json ops/cloudflare-capability/runner3-core-smoke.json
            git add cloudflare/runner3-core/wrangler.jsonc ops/cloudflare-capability/runner3-core-smoke.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Persist Runner3 Core smoke: ${GITHUB_RUN_ID} [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 3
