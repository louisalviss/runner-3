name: Runner3 Core Source Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/runner3-core/**'
      - '.github/scripts/runner3_core_deploy_smoke.py'
      - '.github/workflows/runner3-core-deploy.yml'

permissions:
  contents: read

concurrency:
  group: runner3-core-source-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Runner3 Core source without production credentials
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/runner3-core/reader-media-entry.js
          node --check cloudflare/runner3-core/reddit-entry.js
          node --check cloudflare/runner3-core/rss-entry.js
          node --check cloudflare/runner3-core/src/index.js
          python3 - <<'PY'
          import json
          p='cloudflare/runner3-core/wrangler.jsonc'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('name') == 'runner3-core'
          assert d.get('d1_databases')
          assert d.get('r2_buckets')
          print('Runner3 Core source validation OK')
          print('Production deploy owner: private louisalviss/vps-control')
          print('Trigger: deploy/runner3-core-request.json')
          PY
