name: Runner3 Core Shadow Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/runner3-core/**'
      - '.github/workflows/runner3-core-deploy.yml'

permissions:
  contents: write

concurrency:
  group: runner3-core-shadow-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create/reuse D1 and configure binding
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN']; account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database'
          h={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def call(url, method='GET', body=None):
            req=urllib.request.Request(url,data=(json.dumps(body).encode() if body else None),headers=h,method=method)
            with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          data=call(base+'?page=1&per_page=100')
          db=next((x for x in data.get('result',[]) if x.get('name')=='runner3-core'),None)
          if not db:
            db=call(base,'POST',{'name':'runner3-core'}).get('result')
          uuid=db.get('uuid') or db.get('id')
          if not uuid: raise SystemExit('D1 database id missing')
          p='cloudflare/runner3-core/wrangler.jsonc'
          cfg=json.load(open(p)); cfg['d1_databases'][0]['database_id']=uuid
          open(p,'w').write(json.dumps(cfg,indent=2)+'\n')
          open('/tmp/d1-id','w').write(uuid)
          PY

      - name: Select safe custom domain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.parse, urllib.request

          token=os.environ['CLOUDFLARE_API_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}

          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          zones=get('https://api.cloudflare.com/client/v4/zones?status=active&per_page=50').get('result') or []
          zones=sorted((z for z in zones if z.get('id') and z.get('name')), key=lambda z: z['name'])
          if not zones:
              raise SystemExit('no_active_cloudflare_zone_available')

          chosen=None
          diagnostics=[]
          for zone in zones:
              candidate=f"runner3-core.{zone['name']}"
              q=urllib.parse.urlencode({'name':candidate,'per_page':100})
              url=f"https://api.cloudflare.com/client/v4/zones/{zone['id']}/dns_records?{q}"
              occupied=None
              try:
                  data=get(url)
                  occupied=bool(data.get('result') or [])
              except urllib.error.HTTPError as e:
                  diagnostics.append({'zone':zone['name'],'dnsReadHttp':e.code})
              except Exception as e:
                  diagnostics.append({'zone':zone['name'],'dnsReadError':str(e)[:160]})

              if occupied is False:
                  chosen=(zone,candidate,'dns-confirmed-free')
                  break
              if occupied is None and chosen is None:
                  chosen=(zone,candidate,'zone-selected-dns-unverified')

          if not chosen:
              raise SystemExit('no_safe_runner3_core_subdomain_available')

          zone,candidate,reason=chosen
          p='cloudflare/runner3-core/wrangler.jsonc'
          cfg=json.load(open(p))
          cfg['routes']=[{'pattern':candidate,'custom_domain':True}]
          open(p,'w').write(json.dumps(cfg,indent=2)+'\n')
          pathlib.Path('/tmp/custom-domain').write_text(candidate)
          pathlib.Path('/tmp/custom-domain-selection.json').write_text(json.dumps({
              'zone':zone['name'],
              'customDomain':candidate,
              'selectionReason':reason,
              'diagnostics':diagnostics,
          },indent=2)+'\n')
          print(f'Custom domain selected: {candidate} ({reason})')
          PY

      - name: Apply D1 migration
        working-directory: cloudflare/runner3-core
        run: npx --yes wrangler@4 d1 execute runner3-core --remote --file=migrations/0001_init.sql

      - name: Deploy shadow Worker with custom domain
        working-directory: cloudflare/runner3-core
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/runner3-core-deploy.log

      - name: Smoke test custom domain and D1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, pathlib, urllib.error, urllib.request

          domain_path=pathlib.Path('/tmp/custom-domain')
          if not domain_path.exists():
              raise SystemExit('custom_domain_missing')
          domain=domain_path.read_text().strip()
          base='https://'+domain

          browser_ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'

          def request_json(path, method='GET', payload=None):
              data=json.dumps(payload).encode() if payload is not None else None
              headers={
                  'Accept':'application/json',
                  'User-Agent':browser_ua,
                  'Cache-Control':'no-cache',
              }
              if data is not None:
                  headers['Content-Type']='application/json'
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode(errors='replace')
                      try: parsed=json.loads(raw) if raw else None
                      except Exception: parsed=None
                      return {'http':r.status,'json':parsed,'body':raw[:1000]}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  try: parsed=json.loads(raw) if raw else None
                  except Exception: parsed=None
                  return {'http':e.code,'json':parsed,'body':raw[:1000],'error':str(e)}
              except Exception as e:
                  return {'http':0,'json':None,'body':'','error':str(e)[:1000]}

          checked=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          health=request_json('/health')
          posted=request_json('/events','POST',{
              'source':'runner3-core-custom-domain-smoke',
              'event_type':'health',
              'payload':{'status':'ok','checkedAt':checked}
          })
          latest=request_json('/events/latest')

          health_json=health.get('json') if isinstance(health.get('json'),dict) else {}
          post_json=posted.get('json') if isinstance(posted.get('json'),dict) else {}
          latest_json=latest.get('json')
          selection={}
          try: selection=json.loads(pathlib.Path('/tmp/custom-domain-selection.json').read_text())
          except Exception: pass

          result={
              'checkedAt':checked,
              'url':base,
              'd1DatabaseId':pathlib.Path('/tmp/d1-id').read_text().strip(),
              'transport':'custom-domain',
              'selection':selection,
              'health':health,
              'postEvent':posted,
              'latest':{**latest,'count':len(latest_json) if isinstance(latest_json,list) else None},
              'ok':bool(
                  health.get('http')==200 and health_json.get('ok') is True and health_json.get('d1') is True
                  and posted.get('http')==200 and post_json.get('ok') is True
                  and latest.get('http')==200 and isinstance(latest_json,list) and len(latest_json)>=1
              )
          }
          pathlib.Path('/tmp/runner3-core-smoke.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if not result['ok']:
              raise SystemExit('runner3_core_custom_domain_smoke_failed')
          PY

      - name: Persist binding, custom domain and smoke result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp cloudflare/runner3-core/wrangler.jsonc /tmp/runner3-core-wrangler.jsonc
          test -s /tmp/runner3-core-smoke.json || printf '{"ok":false,"error":"smoke_result_missing"}\n' >/tmp/runner3-core-smoke.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/runner3-core-wrangler.jsonc cloudflare/runner3-core/wrangler.jsonc
            mkdir -p ops/cloudflare-capability
            cp /tmp/runner3-core-smoke.json ops/cloudflare-capability/runner3-core-smoke.json
            git add cloudflare/runner3-core/wrangler.jsonc ops/cloudflare-capability/runner3-core-smoke.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Persist Runner3 Core custom-domain smoke: ${GITHUB_RUN_ID} [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 3
