name: Narrator Video Benchmark v5

on:
  workflow_dispatch:
  push:
    paths:
      - '.runner-narrator-v5-trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: runner3-wp-media
      PREFIX: listen/reddit-creepiest-unsolved-v1
      VOICE: vi-VN-NamMinhNeural
      VOICE_RATE: +3%
      WORKDIR: work/reddit-unsolved
      OUTDIR: artifacts/reddit-unsolved
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect trigger mode
        id: mode
        shell: bash
        run: |
          if grep -q '^mode=reddit-unsolved$' .runner-narrator-v5-trigger; then
            echo 'reddit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reddit=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Run Reddit narrator pipeline
        if: steps.mode.outputs.reddit == 'true'
        shell: bash
        run: bash scripts/reddit_narrator_run.sh

      - name: Install benchmark tools
        if: steps.mode.outputs.reddit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl fonts-noto-core espeak-ng
          python -m pip install -q -U edge-tts gTTS

      - name: Render benchmark
        if: steps.mode.outputs.reddit != 'true'
        run: bash scripts/narrator_benchmark_v5.sh

      - name: Publish benchmark output and diagnostics
        if: always() && steps.mode.outputs.reddit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'runner-3-bot'
          git config user.email 'runner-3-bot@users.noreply.github.com'
          git add artifacts/runner3-narrator-v5 || true
          git commit -m 'Publish runner-3 Narrator benchmark v5' || true
          git pull --rebase origin main || true
          git push origin HEAD:main
