name: Audio Library ChatGPT Source Inbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-library-chatgpt-inbox.yml'
      - 'scripts/audio_library_extract_for_chatgpt.py'
      - 'scripts/audio_library_extract_for_chatgpt_r2.py'
      - 'scripts/audio_library_resolve_short_urls.py'
      - 'scripts/audio_library_resolve_reddit_metadata.py'
      - 'scripts/audio_library_resolve_reddit_via_curlx.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['Audio Library Chat Intake']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: runner3-audio-chatgpt-source-inbox
  cancel-in-progress: true

jobs:
  extract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUDIO_LIBRARY_BUCKET: runner3-wp-media
      CHATGPT_INBOX_PUBLIC_KEY: sYGZHQp2jOgHK7mnuF+Yij8rZOxYbgxKNOP4okx0k3E=
      AUDIO_LIBRARY_EXTRACT_MAX_ITEMS: '3'
      AUDIO_LIBRARY_MAX_RAW_CHARS: '120000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install extraction dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -U requests beautifulsoup4 pypdf yt-dlp playwright 'cryptography>=45,<47'

      - name: Resolve short source URLs
        id: resolve
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audio_library_resolve_short_urls.py | tee /tmp/audio-short-url-result.json

      - name: Resolve Reddit share links through metadata APIs
        id: metadata
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audio_library_resolve_reddit_metadata.py | tee /tmp/audio-reddit-metadata-result.json

      - name: Resolve remaining Reddit short URLs through curl-x
        id: fallback
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audio_library_resolve_reddit_via_curlx.py | tee /tmp/audio-short-url-fallback-result.json

      - name: Extract raw sources and encrypt for ChatGPT
        id: extract
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/audio_library_extract_for_chatgpt_r2.py > /tmp/audio-chatgpt-inbox-result.json 2> /tmp/audio-chatgpt-inbox-stderr.log
          code=$?
          cat /tmp/audio-chatgpt-inbox-result.json || true
          cat /tmp/audio-chatgpt-inbox-stderr.log >&2 || true
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Publish encrypted inbox and checkpoint
        if: always()
        env:
          RESOLVE_OUTCOME: ${{ steps.resolve.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          FALLBACK_OUTCOME: ${{ steps.fallback.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          EXTRACT_EXIT_CODE: ${{ steps.extract.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/audio-library
          python - <<'PY'
          import datetime,json,os,re
          from pathlib import Path
          def load(path):
              p=Path(path)
              if not p.exists(): return None
              try: return json.loads(p.read_text(encoding='utf-8'))
              except Exception as e: return {'parseError':str(e)}
          stderr=''
          sp=Path('/tmp/audio-chatgpt-inbox-stderr.log')
          if sp.exists():
              stderr=sp.read_text(encoding='utf-8',errors='replace')[-3000:]
              stderr=re.sub(r'https?://\S+','[url-redacted]',stderr)
              stderr=re.sub(r'(?i)(token|authorization|secret|key)\s*[=:]\s*\S+',r'\1=[redacted]',stderr)
          out={
            'status':'ready',
            'resolveOutcome':os.environ.get('RESOLVE_OUTCOME','unknown'),
            'metadataOutcome':os.environ.get('METADATA_OUTCOME','unknown'),
            'fallbackOutcome':os.environ.get('FALLBACK_OUTCOME','unknown'),
            'extractOutcome':os.environ.get('EXTRACT_OUTCOME','unknown'),
            'extractExitCode':os.environ.get('EXTRACT_EXIT_CODE',''),
            'resolver':load('/tmp/audio-short-url-result.json'),
            'metadata':load('/tmp/audio-reddit-metadata-result.json'),
            'fallback':load('/tmp/audio-short-url-fallback-result.json'),
            'extractor':load('/tmp/audio-chatgpt-inbox-result.json'),
            'extractStderr':stderr,
            'updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          Path('ops/audio-library/chatgpt-inbox-status.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          inbox_dir=Path('ops/audio-library/chatgpt-inbox')
          chunks_root=Path('ops/audio-library/chatgpt-inbox-chunks')
          chunk_size=6000
          if inbox_dir.exists():
              for src in inbox_dir.glob('*.json'):
                  try:
                      env=json.loads(src.read_text(encoding='utf-8'))
                      item_id=str(env.get('id') or src.stem)
                      cipher=str(env['ciphertext'])
                      parts=[cipher[i:i+chunk_size] for i in range(0,len(cipher),chunk_size)]
                      out_dir=chunks_root/item_id
                      out_dir.mkdir(parents=True,exist_ok=True)
                      manifest={
                        'v':env.get('v',1),
                        'id':item_id,
                        'ephemeralPublicKey':env['ephemeralPublicKey'],
                        'nonce':env['nonce'],
                        'chunkCount':len(parts),
                        'ciphertextChars':len(cipher),
                        'chunkSize':chunk_size,
                      }
                      (out_dir/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                      for i,part in enumerate(parts):
                          (out_dir/f'{i:03d}.txt').write_text(part+'\n',encoding='utf-8')
                  except Exception:
                      continue
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/audio-library/chatgpt-inbox/*.json 2>/dev/null || true
          git add ops/audio-library/chatgpt-inbox-chunks/ 2>/dev/null || true
          git add ops/audio-library/chatgpt-inbox-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish ChatGPT Audio inbox status [skip ci]'
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Fail when extraction stage crashed
        if: steps.extract.outcome == 'failure'
        run: exit 1
