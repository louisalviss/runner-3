name: Audio Library ChatGPT Source Inbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-library-chatgpt-inbox.yml'
      - 'scripts/audio_library_extract_for_chatgpt.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['Audio Library Chat Intake']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: runner3-audio-chatgpt-source-inbox
  cancel-in-progress: true

jobs:
  extract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHATGPT_INBOX_PUBLIC_KEY: sYGZHQp2jOgHK7mnuF+Yij8rZOxYbgxKNOP4okx0k3E=
      AUDIO_LIBRARY_EXTRACT_MAX_ITEMS: '3'
      AUDIO_LIBRARY_MAX_RAW_CHARS: '120000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install extraction dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -U requests beautifulsoup4 pypdf yt-dlp 'cryptography>=45,<47'

      - name: Extract raw sources and encrypt for ChatGPT
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audio_library_extract_for_chatgpt.py | tee /tmp/audio-chatgpt-inbox-result.json

      - name: Publish encrypted inbox only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/audio-library/chatgpt-inbox/*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Stage encrypted Audio Library sources for ChatGPT [skip ci]'
          git pull --rebase origin main || true
          git push origin HEAD:main
