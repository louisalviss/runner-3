name: Cloudflare WordPress Edge (Legacy - Retired)

# The old scheduled job deployed main's legacy wrangler.jsonc every 30 minutes.
# Runner3WP production is now pinned to the tested V2 runtime and must only be
# changed through the guarded V2 promotion/automation flow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy deploy disabled
        run: |
          echo 'Legacy WordPress edge deploy is retired.'
          echo 'Use the guarded Runner3WP V2 automation/promotion workflow instead.'
