name: X Fetch Lite

on:
  push:
    paths:
      - x-fetch-lite-job.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-x:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch tweet
        run: python x_runner.py x-fetch-lite-job.json --output-root x-results
      - name: Publish target result
        if: always()
        run: |
          TWEET_ID=$(python - <<'PY'
          import json,re
          u=json.load(open('x-fetch-lite-job.json'))['x_url']
          print(re.search(r'/status/(\d+)',u).group(1))
          PY
          )
          test -d "x-results/$TWEET_ID" || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "x-results/$TWEET_ID"
          git diff --cached --quiet && exit 0
          git commit -m "x fetch lite result $TWEET_ID"
          git pull --rebase origin main
          git push origin HEAD:main
