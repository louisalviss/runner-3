name: Runner3 Speed v1.2.0 Quick Integration
on:
  push:
    branches: [runner3-speed-site3-realistic-20260821]
    paths: ['.github/workflows/runner3-speed-v120-integration-quick.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: runner3-speed-site3-realistic
  cancel-in-progress: true
env:
  WP_SITE_SLUG: runner3-speed-site3-realistic
  CHROME_PATH: /usr/bin/google-chrome
  RUNNER3_PLUGIN_ZIP: /tmp/runner3-speed.zip
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare
        run: |
          set -euo pipefail
          php -l wordpress/runner3-speed/runner3-speed.php
          php -l wordpress/runner3-speed/dropins/advanced-cache.php
          node --check scripts/runner3-speed-site3-deploy-v120.mjs
          node --check scripts/runner3-speed-site3-functional-v8.mjs
          npm install --no-save playwright-core@1.58.2
          (cd wordpress && zip -qr /tmp/runner3-speed.zip runner3-speed)
          test -s /tmp/runner3-speed.zip
          test -n "${AUTOMATION_KEY:-}"
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json
      - name: Deploy v1.2.0 clean and OFF
        run: |
          set -euo pipefail
          node scripts/runner3-speed-site3-deploy-v120.mjs
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-site3-deploy-v120.json'))
          assert r['status']=='PASS' and r['expectedVersion']=='1.2.0' and r['installed'] and r['active'] and r['performanceOn'] is False,r
          PY
      - name: Patch functional harness with Safe Frontend gates
        run: |
          set -euo pipefail
          python - <<'PY'
          p='scripts/runner3-speed-site3-functional-v8.mjs'
          s=open(p).read()
          s=s.replace("const result={status:'starting',contentExact:false,routesPass:false,queryBypass:false,apiBypass:false,autoPurge:false,purgeProbeRestored:false,finalOff:false,routeChecks:[],purgeProbe:null,gates:null,error:null,checkedAt:null};","const result={status:'starting',contentExact:false,routesPass:false,safeFrontend:false,queryBypass:false,apiBypass:false,autoPurge:false,purgeProbeRestored:false,finalOff:false,routeChecks:[],purgeProbe:null,gates:null,error:null,checkedAt:null};")
          old="""const dom=await p.evaluate(()=>({title:document.title,h1:(document.querySelector('h1')?.textContent||'').trim(),bodyClass:document.body.className,images:document.images.length,links:document.links.length,elementorMarkers:document.querySelectorAll('[class*=\"elementor-\"],.elementor').length,hasNav:!!document.querySelector('nav,.navbar,.site-navigation,.main-navigation'),hasFooter:!!document.querySelector('footer,#colophon,.site-footer')}));"""
          new="""const dom=await p.evaluate(()=>{const imgs=[...document.images];const first=imgs[0]||null;const frames=[...document.querySelectorAll('iframe')];return{title:document.title,h1:(document.querySelector('h1')?.textContent||'').trim(),bodyClass:document.body.className,images:imgs.length,links:document.links.length,elementorMarkers:document.querySelectorAll('[class*=\"elementor-\"],.elementor').length,hasNav:!!document.querySelector('nav,.navbar,.site-navigation,.main-navigation'),hasFooter:!!document.querySelector('footer,#colophon,.site-footer'),firstImageLoading:first?.getAttribute('loading')||null,firstImagePriority:first?.getAttribute('fetchpriority')||null,lcpPreloads:document.querySelectorAll('link[data-runner3-speed=\"lcp\"][rel=\"preload\"][as=\"image\"]').length,iframes:frames.length,iframesHaveLoading:frames.every(x=>x.hasAttribute('loading'))};});"""
          if old not in s: raise SystemExit('dom probe target missing')
          s=s.replace(old,new)
          old2="""navPresent:dom.hasNav,footerPresent:dom.hasFooter,noFailedRequests:failed.length===0};"""
          new2="""navPresent:dom.hasNav,footerPresent:dom.hasFooter,safeFirstImage:dom.images===0||(dom.firstImageLoading==='eager'&&dom.firstImagePriority==='high'&&dom.lcpPreloads>=1),safeIframes:dom.iframesHaveLoading,noFailedRequests:failed.length===0};"""
          if old2 not in s: raise SystemExit('route check target missing')
          s=s.replace(old2,new2)
          s=s.replace("result.routesPass=result.routeChecks.every(x=>x.pass);","result.routesPass=result.routeChecks.every(x=>x.pass);result.safeFrontend=result.routeChecks.every(x=>x.safeFirstImage&&x.safeIframes);")
          s=s.replace("result.gates={contentExact:result.contentExact,routesPass:result.routesPass,queryBypass:result.queryBypass,apiBypass:result.apiBypass,autoPurge:result.autoPurge,purgeProbeRestored:result.purgeProbeRestored,finalOff:result.finalOff};","result.gates={contentExact:result.contentExact,routesPass:result.routesPass,safeFrontend:result.safeFrontend,queryBypass:result.queryBypass,apiBypass:result.apiBypass,autoPurge:result.autoPurge,purgeProbeRestored:result.purgeProbeRestored,finalOff:result.finalOff};")
          open(p,'w').write(s)
          PY
          node --check scripts/runner3-speed-site3-functional-v8.mjs
      - name: Run functional, layout, cache and Safe Frontend regression
        run: |
          set -euo pipefail
          node scripts/runner3-speed-site3-functional-v8.mjs
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-site3-functional-v8.json'))
          assert r['status']=='PASS',r
          assert r['safeFrontend'] is True,r
          assert all(r['gates'].values()),r
          PY
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,datetime
          def load(p): return json.load(open(p)) if os.path.exists(p) else {'status':'MISSING'}
          out={'deploy':load('/tmp/runner3-speed-site3-deploy-v120.json'),'functional':load('/tmp/runner3-speed-site3-functional-v8.json'),'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          out['status']='PASS' if out['deploy'].get('status')=='PASS' and out['functional'].get('status')=='PASS' else 'FAIL'
          os.makedirs('/tmp/r3',exist_ok=True);json.dump(out,open('/tmp/r3/runner3-speed-v120-integration.latest.json','w'),indent=2)
          PY
          git config user.name runner3-speed-v120-integration-bot
          git config user.email runner3-speed-v120-integration-bot@users.noreply.github.com
          git fetch origin runner3-speed-site3-realistic-20260821
          git reset --hard origin/runner3-speed-site3-realistic-20260821
          mkdir -p ops/site-factory
          cp /tmp/r3/runner3-speed-v120-integration.latest.json ops/site-factory/runner3-speed-v120-integration.latest.json
          git add -- ops/site-factory/runner3-speed-v120-integration.latest.json
          if ! git diff --cached --quiet; then git commit -m 'test: record Runner3 Speed v1.2.0 integration evidence' && git push origin HEAD:runner3-speed-site3-realistic-20260821; fi
      - name: Cleanup
        if: always()
        run: rm -f /tmp/wasmer-account.json /tmp/runner3-speed.zip