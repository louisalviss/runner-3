name: Inspect Gwen Deploy Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modal-gwen-run-status.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch deploy workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/modal-gwen-tts-deploy.yml/runs?per_page=10" > /tmp/runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/runs.json'))
          runs=[]
          for r in d.get('workflow_runs',[]):
              runs.append({k:r.get(k) for k in ('id','name','display_title','head_sha','event','status','conclusion','created_at','updated_at','html_url','run_attempt')})
          target_sha='12e4a52839e391f4001b1a2246409e694bc2bed3'
          target=next((r for r in runs if r.get('head_sha')==target_sha or 'AUTH-FIX-1957' in (r.get('display_title') or '')), None)
          Path('modal-gwen-run-status.json').write_text(json.dumps({'target':target,'recent_runs':runs},indent=2)+'\n')
          print(json.dumps({'target':target},indent=2))
          PY
      - name: Publish status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modal-gwen-run-status.json
          git diff --cached --quiet || git commit -m 'debug: record Gwen deploy run status'
          git pull --rebase origin main || true
          git push
