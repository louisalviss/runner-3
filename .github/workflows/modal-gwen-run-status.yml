name: Inspect Gwen Deploy Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modal-gwen-run-status.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch deploy run and probe live endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/modal-gwen-tts-deploy.yml/runs?per_page=10" > /tmp/runs.json
          BASE='https://louisalviss--runner3-gwen-tts-web.modal.run'
          : > /tmp/probe.txt
          for i in 1 2 3 4 5 6; do
            ts="$(date -u +%FT%TZ)"
            hcode="$(curl -sS -L --max-time 60 -o /tmp/health.body -w '%{http_code}' "$BASE/health" || true)"
            rcode="$(curl -sS -L --max-time 60 -o /tmp/root.body -w '%{http_code}' "$BASE/" || true)"
            echo "$ts attempt=$i health=$hcode root=$rcode" | tee -a /tmp/probe.txt
            if [ "$hcode" = '200' ] && [ "$rcode" = '200' ]; then break; fi
            sleep 10
          done
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/runs.json'))
          runs=[]
          for r in d.get('workflow_runs',[]):
              runs.append({k:r.get(k) for k in ('id','name','display_title','head_sha','event','status','conclusion','created_at','updated_at','html_url','run_attempt')})
          target_sha='ec5e08231dca245050b484893bc1ee2b4310dfe3'
          target=next((r for r in runs if r.get('head_sha')==target_sha), None)
          probe=Path('/tmp/probe.txt').read_text().strip().splitlines()
          health_body=Path('/tmp/health.body').read_text(errors='replace')[:1000] if Path('/tmp/health.body').exists() else ''
          root_body=Path('/tmp/root.body').read_text(errors='replace')[:1000] if Path('/tmp/root.body').exists() else ''
          out={'target':target,'probe':probe,'health_body':health_body,'root_body':root_body,'recent_runs':runs}
          Path('modal-gwen-run-status.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modal-gwen-run-status.json
          git diff --cached --quiet || git commit -m 'debug: record Gwen deploy run status'
          git pull --rebase origin main || true
          git push
