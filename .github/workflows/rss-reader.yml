name: RSS · Reader

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rss-reader.yml"
      - "scripts/rss_reader_run.py"
      - "scripts/rss_reader_collect.py"
      - "scripts/rss_reader_collect_v2.py"
      - "scripts/rss_substack_collect.py"
      - "scripts/rss_substack_collect_v2.py"
      - "scripts/rss_render_inventory.py"
      - "scripts/rss_selected_fetch.py"
      - "scripts/rss_d1_shadow.py"
      - ".github/scripts/runner3_core.py"
      - "data/rss-reader/analysis-request.json"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-ai-rss-reader-${{ github.event_name == 'push' && github.sha || 'scheduled' }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -q "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"

      - name: Run canonical RSS ingestion gate
        id: rss
        continue-on-error: true
        run: python scripts/rss_reader_run.py

      - name: Build render source-accounting inventories
        id: render_inventory
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          export TZ=Asia/Ho_Chi_Minh
          today="$(date +%F)"
          yesterday="$(date -d 'yesterday' +%F)"
          python scripts/rss_render_inventory.py --date "$today" --out data/rss-reader/render-inventory-today.json
          python scripts/rss_render_inventory.py --date "$yesterday" --out data/rss-reader/render-inventory-yesterday.json

      - name: Upload per-run health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-health-${{ github.run_id }}
          path: |
            data/rss-reader/health.json
            data/rss-reader/substack-health.json
            data/rss-reader/runtime-health.json
            data/rss-reader/render-inventory-today.json
            data/rss-reader/render-inventory-yesterday.json
          if-no-files-found: warn
          retention-days: 1

      - name: Persist source mirrors, health, and render inventories
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "runner3-rss-bot"
          git config user.email "runner3-rss-bot@users.noreply.github.com"

          git add data/rss-reader/sources/
          [[ -f data/rss-reader/health.json ]] && git add data/rss-reader/health.json
          [[ -f data/rss-reader/substack-health.json ]] && git add data/rss-reader/substack-health.json
          [[ -f data/rss-reader/runtime-health.json ]] && git add data/rss-reader/runtime-health.json
          [[ -f data/rss-reader/render-inventory-today.json ]] && git add data/rss-reader/render-inventory-today.json
          [[ -f data/rss-reader/render-inventory-yesterday.json ]] && git add data/rss-reader/render-inventory-yesterday.json

          if git diff --cached --quiet; then
            echo "No RSS mirror, health, or inventory changes"
            exit 0
          fi

          git commit -m "Update Runner3 RSS mirrors, health and render inventories [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report RSS operational state to Runner3 Core
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python scripts/rss_d1_shadow.py operational --run-id "${{ github.run_id }}"

      - name: Enforce canonical ingestion and inventory health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rss_outcome='${{ steps.rss.outcome }}'
          inventory_outcome='${{ steps.render_inventory.outcome }}'
          echo "rss=$rss_outcome inventory=$inventory_outcome"
          [[ "$rss_outcome" == "success" ]]
          [[ "$inventory_outcome" == "success" ]]

  selected-analysis:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check analysis request exists
        id: request_file
        shell: bash
        run: |
          if [[ -f data/rss-reader/analysis-request.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.request_file.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install extraction dependencies
        if: steps.request_file.outputs.exists == 'true'
        run: python -m pip install --disable-pip-version-check -q "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"

      - name: Read request id
        if: steps.request_file.outputs.exists == 'true'
        id: request
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try:
              obj=json.load(open('data/rss-reader/analysis-request.json', encoding='utf-8'))
              rid=str(obj.get('requestId') or 'unknown').replace('\n','-').replace('\r','-')
          except Exception:
              rid='unknown'
          print('id='+rid)
          PY

      - name: Fetch selected canonical articles in one parallel batch
        if: steps.request_file.outputs.exists == 'true'
        id: selected_fetch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf /tmp/rss-analysis-fetch
          python scripts/rss_selected_fetch.py \
            --request data/rss-reader/analysis-request.json \
            --run-id "${{ github.run_id }}" | tee /tmp/rss-analysis-fetch.log
          rc=${PIPESTATUS[0]}
          if [[ -s /tmp/rss-analysis-fetch/payload.json ]]; then
            echo "has_payload=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_payload=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Upload selected article payload
        if: always() && steps.selected_fetch.outputs.has_payload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rss-analysis-${{ steps.request.outputs.id }}-${{ github.run_id }}
          path: /tmp/rss-analysis-fetch/payload.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Persist analysis cache pointer index
        if: always() && steps.request_file.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/rss-reader/analysis-cache-index.json ]]; then
            echo "No analysis cache index generated"
            exit 0
          fi
          git config user.name "runner3-rss-bot"
          git config user.email "runner3-rss-bot@users.noreply.github.com"
          git add data/rss-reader/analysis-cache-index.json
          if git diff --cached --quiet; then
            echo "No analysis cache pointer changes"
            exit 0
          fi
          git commit -m "Update RSS analysis cache pointers [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report selected-analysis outcome
        if: always()
        shell: bash
        run: |
          echo "request_exists=${{ steps.request_file.outputs.exists }}"
          echo "selected_fetch=${{ steps.selected_fetch.outcome }}"
          # Per-item failures are recorded in analysis-cache-index.json.
          # Partial batch success remains usable and does not fail RSS freshness.
          exit 0
