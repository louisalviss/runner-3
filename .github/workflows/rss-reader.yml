name: RSS · Reader

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rss-reader.yml"
      - "scripts/rss_reader_run.py"
      - "scripts/rss_reader_run_v2.py"
      - "scripts/rss_reader_collect.py"
      - "scripts/rss_reader_collect_v2.py"
      - "scripts/rss_direct_substack_collect.py"
      - "scripts/rss_substack_collect.py"
      - "scripts/rss_substack_collect_v2.py"
      - "scripts/rss_render_inventory.py"
      - "scripts/rss_render_inventory_v2.py"
      - "scripts/rss_kept_manifest.py"
      - "scripts/rss_kept_manifest_v2.py"
      - "scripts/rss_manifest_finalize.py"
      - "scripts/rss_manifest_finalize_v2.py"
      - "scripts/rss_render_snapshot.py"
      - "scripts/rss_render_snapshot_v2.py"
      - "scripts/rss_selected_fetch.py"
      - "scripts/rss_d1_shadow.py"
      - "scripts/content_intelligence_client.py"
      - ".github/scripts/runner3_core.py"
      - "data/rss-reader/analysis-request.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-ai-rss-reader
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -q "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"

      - name: Run canonical Runner15 RSS ingestion gate
        id: rss
        continue-on-error: true
        run: python scripts/rss_reader_run_v2.py

      - name: Build Runner15 render source-accounting inventories
        id: render_inventory
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          export TZ=Asia/Ho_Chi_Minh
          today="$(date +%F)"
          yesterday="$(date -d 'yesterday' +%F)"
          python scripts/rss_render_inventory_v2.py --date "$today" --out data/rss-reader/render-inventory-today.json
          python scripts/rss_render_inventory_v2.py --date "$yesterday" --out data/rss-reader/render-inventory-yesterday.json

      - name: Build reconciled Runner15 kept manifests
        id: kept_manifest
        if: always() && steps.render_inventory.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rss_kept_manifest_v2.py --inventory data/rss-reader/render-inventory-today.json --out data/rss-reader/kept-manifest-today.json
          python scripts/rss_kept_manifest_v2.py --inventory data/rss-reader/render-inventory-yesterday.json --out data/rss-reader/kept-manifest-yesterday.json

      - name: Finalize replay-safe Runner15 manifests and archive day snapshots
        id: replay_manifest
        if: always() && steps.kept_manifest.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rss_manifest_finalize_v2.py --self-test
          python scripts/rss_render_snapshot_v2.py --self-test
          python scripts/rss_manifest_finalize_v2.py \
            --manifest data/rss-reader/kept-manifest-today.json \
            --out data/rss-reader/kept-manifest-today.json \
            --archive-root data/rss-reader/manifests \
            --archive-mode latest
          python scripts/rss_manifest_finalize_v2.py \
            --manifest data/rss-reader/kept-manifest-yesterday.json \
            --out data/rss-reader/kept-manifest-yesterday.json \
            --archive-root data/rss-reader/manifests \
            --archive-mode immutable

      - name: Ingest kept manifests into Content Intelligence D1
        id: content_intelligence
        if: always() && steps.replay_manifest.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/content_intelligence_client.py ingest-manifest --manifest data/rss-reader/kept-manifest-today.json --source-type rss
          python scripts/content_intelligence_client.py ingest-manifest --manifest data/rss-reader/kept-manifest-yesterday.json --source-type rss

      - name: Upload per-run health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-health-${{ github.run_id }}
          path: |
            data/rss-reader/health.json
            data/rss-reader/substack-health.json
            data/rss-reader/direct-substack-health.json
            data/rss-reader/runtime-health.json
            data/rss-reader/render-inventory-today.json
            data/rss-reader/render-inventory-yesterday.json
            data/rss-reader/kept-manifest-today.json
            data/rss-reader/kept-manifest-yesterday.json
            data/rss-reader/manifests/
          if-no-files-found: warn
          retention-days: 1

      - name: Persist source mirrors, health, inventories and replay-safe manifests
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "runner3-rss-bot"
          git config user.email "runner3-rss-bot@users.noreply.github.com"

          git add data/rss-reader/sources/
          [[ -d data/rss-reader/manifests ]] && git add data/rss-reader/manifests/
          for f in health.json substack-health.json direct-substack-health.json runtime-health.json render-inventory-today.json render-inventory-yesterday.json kept-manifest-today.json kept-manifest-yesterday.json; do
            [[ -f "data/rss-reader/$f" ]] && git add "data/rss-reader/$f"
          done

          if git diff --cached --quiet; then
            echo "No RSS mirror, health, inventory or replay-safe manifest changes"
            exit 0
          fi

          git commit -m "Update Runner3 RSS mirrors and replay-safe render manifests [skip ci]"
          for attempt in 1 2 3 4 5; do
            echo "persist attempt=$attempt"
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "RSS persistence succeeded on attempt=$attempt"
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          echo "RSS persistence failed after 5 attempts" >&2
          exit 1

      - name: Report RSS operational state to Runner3 Core
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: python scripts/rss_d1_shadow.py operational --run-id "${{ github.run_id }}"

      - name: Enforce canonical ingestion, inventory and replay-safe manifest health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rss_outcome='${{ steps.rss.outcome }}'
          inventory_outcome='${{ steps.render_inventory.outcome }}'
          manifest_outcome='${{ steps.kept_manifest.outcome }}'
          replay_outcome='${{ steps.replay_manifest.outcome }}'
          echo "rss=$rss_outcome inventory=$inventory_outcome kept_manifest=$manifest_outcome replay_manifest=$replay_outcome content_intelligence=${{ steps.content_intelligence.outcome }}"
          [[ "$rss_outcome" == "success" ]]
          [[ "$inventory_outcome" == "success" ]]
          [[ "$manifest_outcome" == "success" ]]
          [[ "$replay_outcome" == "success" ]]

  selected-analysis:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check analysis request exists
        id: request_file
        shell: bash
        run: |
          if [[ -f data/rss-reader/analysis-request.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.request_file.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install extraction dependencies
        if: steps.request_file.outputs.exists == 'true'
        run: python -m pip install --disable-pip-version-check -q "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"

      - name: Read request id
        if: steps.request_file.outputs.exists == 'true'
        id: request
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try:
              obj=json.load(open('data/rss-reader/analysis-request.json', encoding='utf-8'))
              rid=str(obj.get('requestId') or 'unknown').replace('\n','-').replace('\r','-')
          except Exception:
              rid='unknown'
          print('id='+rid)
          PY

      - name: Fetch selected canonical articles in one parallel batch
        if: steps.request_file.outputs.exists == 'true'
        id: selected_fetch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf /tmp/rss-analysis-fetch
          python scripts/rss_selected_fetch.py --request data/rss-reader/analysis-request.json --run-id "${{ github.run_id }}" | tee /tmp/rss-analysis-fetch.log
          rc=${PIPESTATUS[0]}
          if [[ -s /tmp/rss-analysis-fetch/payload.json ]]; then echo "has_payload=true" >> "$GITHUB_OUTPUT"; else echo "has_payload=false" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"

      - name: Upload selected article payload
        if: always() && steps.selected_fetch.outputs.has_payload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rss-analysis-${{ steps.request.outputs.id }}-${{ github.run_id }}
          path: /tmp/rss-analysis-fetch/payload.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Persist analysis cache pointer index
        if: always() && steps.request_file.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -f data/rss-reader/analysis-cache-index.json ]] || exit 0
          git config user.name "runner3-rss-bot"
          git config user.email "runner3-rss-bot@users.noreply.github.com"
          git add data/rss-reader/analysis-cache-index.json
          git diff --cached --quiet && exit 0
          git commit -m "Update RSS analysis cache pointers [skip ci]"
          for attempt in 1 2 3 4 5; do
            echo "analysis persistence attempt=$attempt"
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Report selected-analysis outcome
        if: always()
        shell: bash
        run: |
          echo "request_exists=${{ steps.request_file.outputs.exists }}"
          echo "selected_fetch=${{ steps.selected_fetch.outcome }}"
          exit 0
