name: PageSpeed FCP Floor Crosscheck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pagespeed-fcp-floor-crosscheck.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pagespeed-fcp-floor-crosscheck
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run official PSI mobile crosscheck
        id: psi
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          from pathlib import Path

          targets = [
            ('runner3wp-prod', 'https://runner3wp.pntr.dev/'),
            ('example', 'https://example.com/'),
            ('cern', 'http://info.cern.ch/'),
            ('mfw', 'https://motherfuckingwebsite.com/'),
            ('wikipedia', 'https://www.wikipedia.org/'),
            ('google', 'https://www.google.com/'),
          ]
          endpoint = 'https://www.googleapis.com/pagespeedonline/v5/runPagespeed'
          rows=[]
          for name,url in targets:
            row={'name':name,'url':url,'attempts':[]}
            for attempt in range(1,3):
              qs=urllib.parse.urlencode({'url':url,'strategy':'mobile','category':'performance'})
              req=urllib.request.Request(endpoint+'?'+qs,headers={'User-Agent':'Runner3WP-PSI-Crosscheck/1.1'})
              try:
                started=time.time()
                with urllib.request.urlopen(req,timeout=180) as r:
                  data=json.load(r)
                lr=data.get('lighthouseResult') or {}
                audits=lr.get('audits') or {}
                fcp=audits.get('first-contentful-paint') or {}
                lcp=audits.get('largest-contentful-paint') or {}
                si=audits.get('speed-index') or {}
                cfg=lr.get('configSettings') or {}
                cat=(lr.get('categories') or {}).get('performance') or {}
                row['attempts'].append({
                  'attempt':attempt,'ok':True,
                  'elapsedSeconds':round(time.time()-started,2),
                  'fetchTime':lr.get('fetchTime'),
                  'lighthouseVersion':lr.get('lighthouseVersion'),
                  'performanceScore':round(float(cat.get('score'))*100) if cat.get('score') is not None else None,
                  'fcpMs':fcp.get('numericValue'),'fcp':fcp.get('displayValue'),
                  'lcpMs':lcp.get('numericValue'),'lcp':lcp.get('displayValue'),
                  'speedIndexMs':si.get('numericValue'),'speedIndex':si.get('displayValue'),
                  'formFactor':cfg.get('formFactor'),'emulatedFormFactor':cfg.get('emulatedFormFactor'),
                })
              except Exception as e:
                row['attempts'].append({'attempt':attempt,'ok':False,'error':repr(e)})
              time.sleep(2)
            ok=[x for x in row['attempts'] if x.get('ok') and isinstance(x.get('fcpMs'),(int,float))]
            row['minFcpMs']=min((x['fcpMs'] for x in ok),default=None)
            row['maxFcpMs']=max((x['fcpMs'] for x in ok),default=None)
            row['hasFcpAtOrBelow500ms']=any(x['fcpMs']<=500 for x in ok)
            rows.append(row)

          valid=[a for r in rows for a in r['attempts'] if a.get('ok') and isinstance(a.get('fcpMs'),(int,float))]
          out={
            'status':'ready' if valid else 'failed',
            'checkedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'method':'official PageSpeed Insights API v5, strategy=mobile, performance category',
            'sites':rows,
            'globalMinFcpMs':min((a['fcpMs'] for a in valid),default=None),
            'anyAtOrBelow500ms':any(a['fcpMs']<=500 for a in valid),
          }
          Path('ops/pagespeed/benchmark').mkdir(parents=True,exist_ok=True)
          Path('ops/pagespeed/benchmark/fcp-floor-crosscheck.latest.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if not valid: raise SystemExit(2)
          PY
      - name: Persist crosscheck
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s ops/pagespeed/benchmark/fcp-floor-crosscheck.latest.json || exit 3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/pagespeed/benchmark/fcp-floor-crosscheck.latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist PageSpeed FCP floor crosscheck: ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 2
