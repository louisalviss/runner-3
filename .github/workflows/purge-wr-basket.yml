name: Purge WR Basket Research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-wr-basket.yml'

permissions:
  actions: write
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete transient research data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in 9272605634 9272604910 9272603994 9272603628 9272603622 9272603311 9272602122 9272601654 9272600922 9272598451 9272597417 9272594235 9272592177 9272591653 9272714770 9272815594 9272814384 9272812339 9272811347 9272795555 9272791254; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}" || true
          done
          for run in 31981664400 31982057254 31982371213; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" || true
          done
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/wr-regime-basket-temp" || true
