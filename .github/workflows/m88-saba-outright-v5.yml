name: M88 SABA Outright V5
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/m88-saba-outright-v5.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and VPN
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq; sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'; rm -rf evidence /tmp/relays; mkdir -p evidence /tmp/relays
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace'); rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n');m=[]
          for c in ['TH','SG','MY','PH','ID','JP','KR','TW','VN']:
            a=[r for r in rows if (r.get('CountryShort') or '').upper()==c and r.get('OpenVPN_ConfigData_Base64')];a.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
            for r in a[:(10 if c=='TH' else 3)]:
              z=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace');z='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in z.splitlines())+'\n';p=pathlib.Path(f'/tmp/relays/{len(m):02d}-{c}.ovpn');p.write_text(z);m.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/relays.tsv').write_text('\n'.join(m)+'\n')
          PY
          IFACE=$(ip route show default|awk '{print $5;exit}');sudo ip netns add vpnns;sudo ip link add vh type veth peer name vn;sudo ip link set vn netns vpnns;sudo ip addr add 10.249.0.1/24 dev vh;sudo ip link set vh up;sudo ip netns exec vpnns ip addr add 10.249.0.2/24 dev vn;sudo ip netns exec vpnns ip link set lo up;sudo ip netns exec vpnns ip link set vn up;sudo ip netns exec vpnns ip route add default via 10.249.0.1;sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null;sudo iptables -t nat -A POSTROUTING -s 10.249.0.0/24 -o "$IFACE" -j MASQUERADE;sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT;sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT;sudo mkdir -p /etc/netns/vpnns;printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          okall=0
          while IFS=$'\t' read -r cfg c relay;do sudo ip netns exec vpnns pkill openvpn 2>/dev/null||true;sleep 1;sudo rm -f /tmp/o.log /tmp/t.json;sudo touch /tmp/o.log;sudo chmod 644 /tmp/o.log;sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log||true;ok=0;for i in {1..12};do sleep 1;grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null&&{ ok=1;break;};done;[ "$ok" = 1 ]||continue;if sudo ip netns exec vpnns curl -fsS --max-time 18 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/t.json;then if python3 - <<'PY'
          import json
          try:d=json.load(open('/tmp/t.json'))
          except:raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
          then echo "$c $relay"|tee evidence/relay.txt;okall=1;break;fi;fi;done </tmp/relays.tsv;test "$okall" = 1
      - name: Open hydrated SABA Outright
        shell: bash
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,re,time
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          O=Path(os.environ['WORKSPACE'])/'evidence';res={'markets':{},'notes':[]};net=[];hits=[]
          def txt(f,n=1000000):
            try:return f.locator('body').inner_text(timeout=5000)[:n]
            except:return ''
          def frame_now(page,ready=False):
            best=None
            for f in page.frames:
              h=(urlparse(f.url).hostname or '').lower()
              if not h.startswith('i1x9gr.'):continue
              t=txt(f,120000);score=100
              if 'Saba Soccer' in t:score+=100
              if 'Prediction Market' in t:score+=50
              if t.strip()=='Loading':score-=100
              if '/promotion' in f.url:score+=50
              if best is None or score>best[0]:best=(score,f,t)
            if not best:return None
            if ready and best[0]<200:return None
            return best
          def visible(f,pat):
            try:l=f.get_by_text(re.compile(pat,re.I))
            except:return None
            for i in range(min(l.count(),250)):
              try:
                if l.nth(i).is_visible():return l.nth(i)
              except:pass
            return None
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage']);c=b.new_context(viewport={'width':390,'height':844},screen={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True,locale='en-US',timezone_id='Asia/Bangkok',user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1');page=c.new_page()
            def rq(r):
              if r.resource_type in ('document','xhr','fetch'):net.append({'k':'q','m':r.method,'u':r.url,'p':(r.post_data or '')[:30000]})
            def rp(r):
              if r.request.resource_type not in ('document','xhr','fetch'):return
              net.append({'k':'r','s':r.status,'u':r.url})
              try:
                z=r.text()
                if len(z)<10000000 and re.search(r'outright|premier league|2026.?2027|relegat|goal.?scorer|top.?4',z,re.I):hits.append({'u':r.url,'s':r.status,'b':z[:6000000]})
              except:pass
            page.on('request',rq);page.on('response',rp);page.goto('https://www.m88.com/sports/Saba%20Sports?Language=en-US',wait_until='domcontentloaded',timeout=45000)
            f=None
            for i in range(40):
              q=frame_now(page,True)
              if q:f=q[1];res['provider']=f.url;res['ready_text']=q[2][:120000];break
              page.wait_for_timeout(1000)
            if not f:res['notes'].append('SABA never hydrated')
            else:
              page.screenshot(path=str(O/'01-ready.png'),full_page=False)
              # Actual SABA menu icon is about x=50,y=52 relative to hydrated provider viewport.
              try:f.locator('body').click(position={'x':50,'y':52},timeout=5000);res['hamburger_click']=True
              except Exception as e:res['hamburger_error']=type(e).__name__
              page.wait_for_timeout(2500);res['menu_text']=txt(f,400000);page.screenshot(path=str(O/'02-menu.png'),full_page=False)
              e=visible(f,r'^\s*Outright\s*$') or visible(f,r'\bOutright\b')
              if not e:
                # capture visible drawer text nodes and their boxes
                try:
                  a=[];nodes=f.locator('body *')
                  for i in range(min(nodes.count(),3500)):
                    x=nodes.nth(i)
                    try:
                      if not x.is_visible():continue
                      d=x.evaluate("e=>{let r=e.getBoundingClientRect(),t=(e.innerText||'').trim().replace(/\\s+/g,' ');return {tag:e.tagName,t:t.slice(0,300),x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),c:String(e.className||'').slice(0,300)}}")
                      if d['t'] and d['x']<390 and d['y']<844 and d['w']>5 and d['h']>5:a.append(d)
                    except:pass
                  res['nodes']=a[:1800]
                except:pass
                e=visible(f,r'Outright')
              if not e:res['notes'].append('Outright absent after hydrated hamburger');res['outright_clicked']=False
              else:
                try:res['outright_label']=e.inner_text()[:300];e.click(timeout=7000);res['outright_clicked']=True
                except Exception as ex:res['outright_clicked']=False;res['outright_error']=type(ex).__name__
              if res.get('outright_clicked'):
                page.wait_for_timeout(8000);q=frame_now(page);f=q[1] if q else f;page.screenshot(path=str(O/'03-outright.png'),full_page=False);corp=''
                for i in range(70):
                  t=txt(f)
                  if t and t not in corp:corp+='\n'+t
                  try:f.locator('body').evaluate('(e)=>window.scrollBy(0,550)')
                  except:pass
                  page.wait_for_timeout(220)
                res['outright_text']=corp[:2200000]
                patterns={'winner':r'PREMIER\s+LEAGUE.{0,500}WINNER','top4':r'PREMIER\s+LEAGUE.{0,500}TOP\s*4','relegation':r'PREMIER\s+LEAGUE.{0,500}RELEGAT','goalscorer':r'PREMIER\s+LEAGUE.{0,700}GOAL.?SCORER'}
                for k,pat in patterns.items():
                  rec={'found':False,'window':''};m=re.search(pat,corp,re.I|re.S)
                  if m:rec.update(found=True,source='dom',window=corp[max(0,m.start()-1500):min(len(corp),m.start()+100000)])
                  else:
                    for h in hits:
                      m=re.search(pat,h['b'],re.I|re.S)
                      if m:rec.update(found=True,source='network',url=h['u'],window=h['b'][max(0,m.start()-3000):min(len(h['b']),m.start()+130000)]);break
                  res['markets'][k]=rec
            c.close();b.close()
          (O/'result.json').write_text(json.dumps(res,ensure_ascii=False,indent=2));(O/'network.json').write_text(json.dumps(net,ensure_ascii=False,indent=2));(O/'hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2));print(json.dumps(res,ensure_ascii=False,indent=2)[:260000])
          PY
      - name: Verify
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/result.json'));print('PROVIDER',d.get('provider'));print('HAMBURGER',d.get('hamburger_click'));print('OUTRIGHT',d.get('outright_clicked'));print('MENU',d.get('menu_text','')[:40000]);print('NOTES',d.get('notes'))
          for k,v in d.get('markets',{}).items():print('\n###',k,v.get('found'),v.get('source'),'\n',v.get('window','')[:25000])
          if not d.get('provider'):raise SystemExit('provider not hydrated')
          if not d.get('outright_clicked'):raise SystemExit('Outright not opened')
          if not any(v.get('found') for v in d.get('markets',{}).values()):raise SystemExit('markets missing')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-saba-outright-v5-${{ github.run_id }}
          path: evidence/
          retention-days: 3
