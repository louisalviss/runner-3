name: Runner3WP Automation Infra Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3wp-auto-infra-test.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3wp-auto-infra-test
  cancel-in-progress: false

env:
  FEATURE_BRANCH: runner3wp-edge-optimizer-auto-20260820
  BASELINE_SHA: 9124f5957e176ffc9aa64444c980f3c5d6642a0d
  PROD_URL: https://runner3wp.pntr.dev/
  V2_URL: https://wordpress-edge-proxy-v2.ducduy2411.workers.dev/
  CF_WORKER_CONFIG: edge/wordpress-edge-proxy/wrangler.v2.jsonc

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0

      - name: Static and queue semantic checks
        run: |
          set -euo pipefail
          node --check edge/wordpress-edge-proxy/src/entry-auto.js
          node --check edge/wordpress-edge-proxy/src/automation-events.js
          node --input-type=module - <<'NODE'
          import { handleAutomationEvents } from './edge/wordpress-edge-proxy/src/automation-events.js';
          class Bucket {
            constructor(){this.value=null}
            async get(){if(this.value===null)return null;const v=this.value;return {text:async()=>v}}
            async put(_k,v){this.value=String(v)}
            async delete(){this.value=null}
          }
          const bucket=new Bucket();
          const env={MEDIA_BUCKET:bucket};
          const ok=async()=>({ok:true,algorithm:'test'});
          const post=(body)=>new Request('https://x/__runner3/automation/events',{method:'POST',body:JSON.stringify(body)});
          let r=await handleAutomationEvents(post({op:'enqueue',reason:'save_post',urls:['/a/'],media:[]}),env,ok);let a=await r.json();
          if(!a.ok||!a.revision)throw new Error('enqueue failed');const rev1=a.revision;
          r=await handleAutomationEvents(post({op:'peek'}),env,ok);a=await r.json();if(a.pending?.revision!==rev1)throw new Error('peek failed');
          r=await handleAutomationEvents(post({op:'enqueue',reason:'menu',urls:['/']}),env,ok);a=await r.json();const rev2=a.revision;if(rev2===rev1)throw new Error('revision did not advance');
          r=await handleAutomationEvents(post({op:'ack',revision:rev1}),env,ok);if(r.status!==409)throw new Error('stale ack was not rejected');
          r=await handleAutomationEvents(post({op:'ack',revision:rev2}),env,ok);a=await r.json();if(!a.acknowledged||bucket.value!==null)throw new Error('ack failed');
          console.log('queue semantics PASS');
          NODE

      - name: Build fresh snapshot
        run: |
          set -euo pipefail
          node scripts/build-wordpress-edge-snapshot.mjs
          test -s /tmp/runner3-edge-snapshot.json

      - name: Deploy automation candidate to isolated V2
        id: deploy
        continue-on-error: true
        run: npx --yes wrangler@4.124.0 deploy --config "$CF_WORKER_CONFIG"

      - name: Functional guard
        id: guard
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 4
          BUST="__runner3_auto=$(date +%s%N)"
          curl -fsS -D /tmp/home.h -o /tmp/home.html "$V2_URL?$BUST"
          grep -Eiq '^x-edge-snapshot:[[:space:]]*HIT' /tmp/home.h
          grep -Eiq '^x-edge-cache-policy:[[:space:]]*snapshot-direct' /tmp/home.h
          grep -Eq '/__runner3/r2-image/offset-demo-01-w(360|480|640)\.webp' /tmp/home.html
          curl -fsS -D /tmp/hero.h -o /tmp/hero.webp "${V2_URL}__runner3/r2-image/offset-demo-01-w480.webp?$BUST"
          grep -Eiq '^x-runner3-lcp:[[:space:]]*r2-binding-same-origin' /tmp/hero.h
          test "$(wc -c </tmp/hero.webp)" -gt 10000
          code=$(curl -sS -o /tmp/unsigned.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"op":"peek"}' "${V2_URL}__runner3/automation/events")
          test "$code" = 401
          grep -q 'unauthorized\|auth_unconfigured\|timestamp_invalid' /tmp/unsigned.json

      - name: Lighthouse baseline and candidate 3x
        id: lighthouse
        if: steps.guard.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          C="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)";test -n "$C";echo "CHROME_PATH=$C" >> "$GITHUB_ENV"
          npm install --no-save lighthouse@12.8.2 >/dev/null 2>&1
          mkdir -p /tmp/lh
          for i in 1 2 3; do
            npx lighthouse "$PROD_URL" --output=json --output-path="/tmp/lh/b$i.json" --only-categories=performance --form-factor=mobile --throttling-method=simulate --screenEmulation.mobile=true --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
            npx lighthouse "$V2_URL" --output=json --output-path="/tmp/lh/c$i.json" --only-categories=performance --form-factor=mobile --throttling-method=simulate --screenEmulation.mobile=true --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          done

      - name: Judge and persist local result
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          LH_OUTCOME: ${{ steps.lighthouse.outcome }}
        run: |
          python - <<'PY'
          import json, pathlib, statistics, datetime, os
          p=json.load(open('ops/perf/runner3wp-regression-policy.json'))
          def row(path):
            q=pathlib.Path(path)
            if not q.exists(): return None
            d=json.load(open(q)); a=d['audits']; g=lambda k:(a.get(k) or {}).get('numericValue')
            return {'fcp':g('first-contentful-paint'),'lcp':g('largest-contentful-paint'),'tbt':g('total-blocking-time'),'cls':g('cumulative-layout-shift'),'perf':d['categories']['performance']['score']}
          b=[x for i in (1,2,3) if (x:=row(f'/tmp/lh/b{i}.json'))]
          c=[x for i in (1,2,3) if (x:=row(f'/tmp/lh/c{i}.json'))]
          med=lambda rows,k: statistics.median([x[k] for x in rows]) if len(rows)==3 else None
          bm={k:med(b,k) for k in ('fcp','lcp','tbt','cls','perf')}; cm={k:med(c,k) for k in ('fcp','lcp','tbt','cls','perf')}
          complete=len(b)==len(c)==3
          passed=bool(complete and os.environ.get('DEPLOY_OUTCOME')=='success' and os.environ.get('GUARD_OUTCOME')=='success' and os.environ.get('LH_OUTCOME')=='success' and cm['perf']>=p['performanceScoreMin'] and cm['fcp']<=bm['fcp']+p['maxFcpRegressionMs'] and cm['lcp']<=bm['lcp']+p['maxLcpRegressionMs'] and cm['cls']<=bm['cls']+p['maxClsRegression'] and cm['tbt']<=max(p['maxTbtMs'],bm['tbt']+p['maxTbtRegressionMs']))
          out={'status':'ready' if complete else 'incomplete','experiment':'runner3wp-automation-infra-v1','verdict':'PASS' if passed else 'FAIL','pass':passed,'outcomes':{'deploy':os.environ.get('DEPLOY_OUTCOME'),'guard':os.environ.get('GUARD_OUTCOME'),'lighthouse':os.environ.get('LH_OUTCOME')},'baseline':{'runs':b,'median':bm},'candidate':{'runs':c,'median':cm},'policy':p,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('/tmp/auto-infra.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2))
          if not passed: raise SystemExit(9)
          PY

      - name: Persist evidence to feature branch
        if: always()
        run: |
          set -euo pipefail
          test -s /tmp/auto-infra.json || echo '{"status":"failed","verdict":"FAIL","pass":false}' >/tmp/auto-infra.json
          git fetch origin "$FEATURE_BRANCH"
          git reset --hard "origin/$FEATURE_BRANCH"
          mkdir -p ops/perf/automation
          cp /tmp/auto-infra.json ops/perf/automation/infra-test.latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/perf/automation/infra-test.latest.json
          git commit -m 'test: persist Runner3WP automation infra result [skip ci]' || exit 0
          git push origin HEAD:"$FEATURE_BRANCH"
