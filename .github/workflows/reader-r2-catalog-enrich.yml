name: Reader R2 Catalog Enrich

on:
  push:
    paths:
      - 'ops/reader-r2-enrich.trigger'
      - 'scripts/enrich_reader_r2_catalog.py'
      - '.github/workflows/reader-r2-catalog-enrich.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R3_ARTIFACT_BUCKET: runner3-artifacts
      R3_LIBRARY_ORIGIN: https://runner3-core.ducduy2411.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Enrich EPUB metadata and covers in R2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/enrich_reader_r2_catalog.py
          python3 scripts/enrich_reader_r2_catalog.py
