name: VBTH Minimal Model Benchmark
on:
  push:
    paths:
      - '.github/workflows/vbth-minimal-model-bench.yml'
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark started
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p vbth_bench
          printf 'STARTED\n' > vbth_bench/bench-status.txt
          git add vbth_bench/bench-status.txt
          git commit -m "VBTH benchmark started [skip ci]"
          git push
      - name: Run benchmark
        run: python vbth_bench/run_bench.py
      - name: Commit results
        if: always()
        run: |
          git pull --rebase || true
          if [ -f vbth_bench/results_v2/summary.json ]; then printf 'DONE\n' > vbth_bench/bench-status.txt; else printf 'FAILED\n' > vbth_bench/bench-status.txt; fi
          git add vbth_bench/bench-status.txt vbth_bench/results_v2 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "VBTH minimal model benchmark v2 results [skip ci]"
          git push
# trigger-instrumented
