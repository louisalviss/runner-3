name: VBTH Minimal Model Benchmark
on:
  push:
    paths:
      - '.github/workflows/vbth-minimal-model-bench.yml'
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run paid-only rerun
        run: python vbth_bench/rerun_paid_only.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vbth_bench/results_v4
          git diff --cached --quiet && exit 0
          git commit -m "VBTH final cheap paid benchmark results [skip ci]"
          git push
# trigger-v4
