name: VBTH Minimal Model Benchmark
on:
  push:
    paths:
      - '.github/workflows/vbth-minimal-model-bench.yml'
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run edge rerun
        run: python vbth_bench/rerun_edge.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vbth_bench/results_v3
          git diff --cached --quiet && exit 0
          git commit -m "VBTH edge rerun results [skip ci]"
          git push
# trigger-v3
