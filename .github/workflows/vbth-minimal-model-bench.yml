name: VBTH Minimal Model Benchmark
on:
  push:
    paths:
      - '.github/workflows/vbth-minimal-model-bench.yml'
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run final two
        run: python vbth_bench/final_two.py
      - name: Commit results robustly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for n in 1 2 3 4; do
            git pull --rebase origin main || true
            git add vbth_bench/results_v6
            git diff --cached --quiet || git commit -m "VBTH final two-model results [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
# trigger-v6
