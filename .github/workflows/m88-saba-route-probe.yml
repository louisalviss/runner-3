name: M88 SABA Route Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/m88-saba-route-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence /tmp/relays
      - name: VPN
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          meta=[]
          for c in ['TH','JP','SG','MY','ID','KR','TW','VN']:
            rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and r.get('OpenVPN_ConfigData_Base64')]
            rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
            for r in rs[:(10 if c=='TH' else 3)]:
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              p=pathlib.Path(f'/tmp/relays/{len(meta):02d}-{c}.ovpn'); p.write_text(cfg)
              meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/relays.tsv').write_text('\n'.join(meta)+'\n')
          PY
          IFACE=$(ip route show default|awk '{print $5;exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn; sudo ip link set vn netns vpnns
          sudo ip addr add 10.244.0.1/24 dev vh; sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.244.0.2/24 dev vn; sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.244.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.244.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns; printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          selected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo TRY $country $relay
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null||true; sleep 1
            sudo rm -f /tmp/o.log /tmp/top.json; sudo touch /tmp/o.log; sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log||true
            ok=0; for i in {1..12}; do sleep 1; grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null&&{ ok=1; break; }; done
            [ "$ok" = 1 ]||continue
            if sudo ip netns exec vpnns curl -fsS --max-time 15 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/top.json; then
              if python3 - <<'PY'
          import json
          try:d=json.load(open('/tmp/top.json'))
          except:raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then
                echo "$country $relay"|tee evidence/relay.txt
                sudo ip netns exec vpnns curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace|grep -E '^(ip|loc|warp)='|tee evidence/egress.txt||true
                selected=1; break
              fi
            fi
          done </tmp/relays.tsv
          test "$selected" = 1

      - name: Inspect SABA route and launch control
        shell: bash
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          OUT=Path(os.environ['WORKSPACE'])/'evidence'
          result={'controls':[],'pages':[],'frames':[],'network':[]}
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            c=b.new_context(viewport={'width':390,'height':844},screen={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True,locale='en-US',user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1')
            page=c.new_page()
            page.on('request',lambda r: result['network'].append({'m':r.method,'t':r.resource_type,'u':r.url,'p':(r.post_data or '')[:3000]}) if r.resource_type in ('document','xhr','fetch') else None)
            page.goto('https://www.m88.com/sports/Saba%20Sports?Language=en-US',wait_until='domcontentloaded',timeout=45000)
            page.wait_for_timeout(18000)
            page.screenshot(path=str(OUT/'01-route.png'),full_page=False)
            body=page.locator('body').inner_text(timeout=5000)
            result['body']=body[:50000]
            # Enumerate actionable controls and links around sports/product launch.
            for sel in ['a','button','[role=button]','[onclick]']:
              loc=page.locator(sel)
              for i in range(min(loc.count(),500)):
                el=loc.nth(i)
                try:
                  if not el.is_visible(): continue
                  d=el.evaluate("e=>({tag:e.tagName,text:(e.innerText||e.alt||'').trim().replace(/\\s+/g,' ').slice(0,400),href:e.href||'',onclick:e.getAttribute('onclick')||'',cls:e.className&&String(e.className).slice(0,300)||'',outer:e.outerHTML.slice(0,1800)})")
                  if re.search(r'saba|sport|play|bet|enter|launch|open|now',json.dumps(d),re.I): result['controls'].append(d)
                except: pass
            # Pick likely product launch control, preferring SABA-specific control then BET/PLAY NOW.
            candidates=[]
            for rx in [r'SABA',r'BET\s*NOW',r'PLAY\s*NOW',r'ENTER',r'LAUNCH']:
              for sel in ['a','button','[role=button]','[onclick]']:
                loc=page.locator(sel).filter(has_text=re.compile(rx,re.I))
                for i in range(min(loc.count(),30)):
                  try:
                    if loc.nth(i).is_visible(): candidates.append(loc.nth(i))
                  except: pass
              if candidates: break
            if not candidates:
              # Some M88 tiles are image onclick elements with no text.
              loc=page.locator("[onclick*='Saba' i], [onclick*='sports/Saba' i], a[href*='Saba' i]")
              for i in range(min(loc.count(),30)):
                try:
                  if loc.nth(i).is_visible(): candidates.append(loc.nth(i))
                except: pass
            result['candidate_count']=len(candidates)
            if candidates:
              before=set(c.pages)
              try: candidates[0].evaluate('(e)=>e.click()'); result['clicked']=True
              except Exception as e: result['click_error']=type(e).__name__
              page.wait_for_timeout(18000)
              new=[x for x in c.pages if x not in before]
              board=new[-1] if new else page
              result['board_url']=board.url
              board.screenshot(path=str(OUT/'02-after-launch.png'),full_page=False)
              # Snapshot all pages and frames after launch.
              for pg in c.pages:
                result['pages'].append(pg.url)
                for f in pg.frames:
                  try:t=f.locator('body').inner_text(timeout=4000)[:40000]
                  except:t=''
                  result['frames'].append({'page':pg.url,'url':f.url,'name':f.name,'text':t})
            c.close(); b.close()
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print('BODY\n',result.get('body','')[:12000])
          print('\nCONTROLS')
          for x in result['controls'][:100]: print(json.dumps(x,ensure_ascii=False))
          print('\nBOARD',result.get('board_url'))
          print('PAGES',result.get('pages'))
          print('\nFRAMES')
          for f in result.get('frames',[]):
            print('FRAME',f['url'])
            print(f['text'][:12000])
          print('\nNETWORK')
          for x in result['network']:
            if re.search(r'saba|sports|launch|token|auth|game|vendor|product',x['u'],re.I): print(json.dumps(x,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-saba-route-probe-${{ github.run_id }}
          path: evidence/
          retention-days: 3
