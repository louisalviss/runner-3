name: M88 Register Walkthrough

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-register-walkthrough.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Thailand browser route
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence

          curl -fsSL --max-time 30 https://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,json,pathlib
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          rows=[r for r in rows if (r.get('CountryShort') or '').upper()=='TH' and r.get('OpenVPN_ConfigData_Base64')]
          rows.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          infos=[]
          for i,r in enumerate(rows[:20]):
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              pathlib.Path(f'/tmp/vpn{i}.ovpn').write_text(cfg)
              infos.append({k:r.get(k) for k in ['CountryShort','CountryLong','IP','Ping','Speed','NumVpnSessions']})
          pathlib.Path('evidence/relay_candidates.json').write_text(json.dumps(infos,indent=2,ensure_ascii=False))
          print('TH_RELAY_CANDIDATES',len(infos))
          PY

          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.244.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.244.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.244.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.244.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null

          connected=0
          for cfg in /tmp/vpn*.ovpn; do
            idx=$(basename "$cfg" .ovpn | sed 's/vpn//')
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/openvpn.log
            sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            ok=0
            for i in {1..10}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null && { ok=1; break; }
              grep -Eq 'AUTH_FAILED|TLS Error|Connection refused|fatal error' /tmp/openvpn.log 2>/dev/null && break || true
            done
            if [ "$ok" = 1 ]; then
              trace=$(sudo ip netns exec vpnns curl -fsS --max-time 8 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -E '^(ip|loc|warp)=' || true)
              if echo "$trace" | grep -q '^loc=TH$'; then
                echo "$trace" | tee evidence/egress.txt
                echo "relay_index=$idx" | tee evidence/selected_relay.txt
                connected=1
                break
              fi
            fi
          done
          test "$connected" = 1

      - name: Capture Vietnamese mobile registration walkthrough
        shell: bash
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json, os, re, traceback
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out=Path(os.environ['WORKSPACE'])/'evidence'
          R={'steps':[],'errors':[]}

          def snap(page, name, full=False):
              p=out/name
              page.screenshot(path=str(p), full_page=full, timeout=30000)
              R['steps'].append({'file':name,'url':page.url,'title':page.title()})

          def visible_text(page):
              try: return page.locator('body').inner_text(timeout=5000)
              except: return ''

          def click_visible(locator):
              for i in range(locator.count()):
                  try:
                      if locator.nth(i).is_visible():
                          locator.nth(i).click(timeout=6000)
                          return True
                  except: pass
              return False

          def scroll_and_snap(page, locator, filename):
              try:
                  if locator.count():
                      el=locator.first
                      el.scroll_into_view_if_needed(timeout=5000)
                      page.wait_for_timeout(700)
                      snap(page, filename, False)
                      return True
              except Exception as e:
                  R['errors'].append(filename+': '+repr(e))
              return False

          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              context=browser.new_context(
                  viewport={'width':390,'height':844},
                  screen={'width':390,'height':844},
                  device_scale_factor=3,
                  is_mobile=True,
                  has_touch=True,
                  locale='vi-VN',
                  timezone_id='Asia/Ho_Chi_Minh',
                  user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
              )
              page=context.new_page()

              # 0. Homepage mobile.
              page.goto('https://www.m88.com/',wait_until='domcontentloaded',timeout=45000)
              page.wait_for_timeout(9000)
              snap(page,'00_home_mobile_before_language.png',False)

              # 1. Force Vietnamese using M88's own language selector.
              lang_buttons=page.locator("button[data-qa-context='language-selector']")
              R['language_button_count']=lang_buttons.count()
              opened=False
              for i in range(lang_buttons.count()):
                  try:
                      lang_buttons.nth(i).evaluate('(e)=>e.click()')
                      page.wait_for_timeout(800)
                      if page.get_by_text('Tiếng Việt',exact=True).count() or page.get_by_text('Vietnamese',exact=True).count():
                          opened=True; R['language_button_used']=i; break
                  except: pass
              if opened:
                  snap(page,'01_language_menu.png',False)
                  chosen=False
                  for label in ['Tiếng Việt','Vietnamese']:
                      loc=page.get_by_text(label,exact=True)
                      if click_visible(loc):
                          chosen=True; R['language_chosen']=label; break
                  if chosen: page.wait_for_timeout(9000)
              R['home_vi_url']=page.url
              R['home_vi_detected']=bool(re.search(r'ĐĂNG KÝ|Đăng ký|ĐĂNG NHẬP|Đăng nhập|THỂ THAO|Thể thao',visible_text(page)))
              snap(page,'02_home_mobile_vietnamese.png',False)

              # 2. Click REGISTER / ĐĂNG KÝ from the actual page.
              reg_clicked=False
              selectors=[
                  page.get_by_text('ĐĂNG KÝ',exact=True),
                  page.get_by_text('Đăng Ký',exact=True),
                  page.get_by_text('Đăng ký',exact=True),
                  page.get_by_text('REGISTER',exact=True),
                  page.get_by_text('Register',exact=True),
                  page.locator("a[href*='/register']")
              ]
              for loc in selectors:
                  if click_visible(loc): reg_clicked=True; break
              R['register_clicked']=reg_clicked
              if reg_clicked:
                  page.wait_for_timeout(9000)
              else:
                  page.goto('https://www.m88.com/register',wait_until='domcontentloaded',timeout=45000)
                  page.wait_for_timeout(9000)
                  R['register_direct_fallback']=True
              R['register_url']=page.url
              R['register_title']=page.title()
              R['register_text_prefix']=visible_text(page)[:5000]
              snap(page,'03_register_landing_viewport.png',False)
              snap(page,'04_register_FULL_PAGE.png',True)

              # Inventory the form without submitting.
              inputs=page.locator('input')
              selects=page.locator('select')
              buttons=page.locator('button')
              inventory=[]
              for i in range(inputs.count()):
                  try:
                      el=inputs.nth(i)
                      inventory.append({
                          'i':i,'type':el.get_attribute('type'),'name':el.get_attribute('name'),
                          'id':el.get_attribute('id'),'placeholder':el.get_attribute('placeholder'),
                          'autocomplete':el.get_attribute('autocomplete'),'visible':el.is_visible()
                      })
                  except: pass
              R['inputs']=inventory
              R['select_count']=selects.count(); R['button_count']=buttons.count()

              # 3..N. Capture each logical field/section centered in a mobile viewport.
              field_specs=[
                  ('05_name_field.png',["input[name*='name' i]","input[id*='name' i]","input[placeholder*='address' i]","input[placeholder*='tên' i]"]),
                  ('06_username_field.png',["input[name*='user' i]","input[id*='user' i]","input[placeholder*='3-16' i]","input[placeholder*='username' i]","input[placeholder*='đăng nhập' i]"]),
                  ('07_password_field.png',["input[type='password']","input[name*='pass' i]","input[id*='pass' i]"]),
                  ('08_email_field.png',["input[type='email']","input[name*='mail' i]","input[id*='mail' i]","input[placeholder*='gmail' i]"]),
                  ('09_currency_section.png',["select[name*='currency' i]","[data-qa-context*='currency']","button:has-text('VND')","button:has-text('Currency')","text=Tiền tệ"]),
                  ('10_mobile_number_field.png',["input[type='tel']","input[name*='mobile' i]","input[name*='phone' i]","input[id*='mobile' i]","input[id*='phone' i]"]),
                  ('11_referral_section.png',["text=Mã giới thiệu","text=Referral","text=REFERRAL","[data-qa-context*='referral']"]),
                  ('12_terms_submit_section.png',["text=Điều khoản","text=Terms","input[type='checkbox']","button[type='submit']"]),
              ]
              for filename, sels in field_specs:
                  done=False
                  for sel in sels:
                      try:
                          loc=page.locator(sel)
                          if loc.count():
                              for j in range(loc.count()):
                                  try:
                                      if loc.nth(j).is_visible():
                                          loc.nth(j).scroll_into_view_if_needed(timeout=5000)
                                          page.wait_for_timeout(700)
                                          snap(page,filename,False)
                                          done=True; break
                                  except: pass
                          if done: break
                      except: pass
                  if not done: R['errors'].append('not_found:'+filename)

              # 9a. Open currency dropdown/menu if possible, capture options, then close without choosing.
              currency_opened=False
              currency_candidates=[
                  page.locator("button[data-qa-context*='currency']"),
                  page.locator("[data-qa-context*='currency']"),
                  page.get_by_text('Preferred Currency',exact=True),
                  page.get_by_text('Tiền tệ',exact=True),
                  page.get_by_text('VND',exact=True)
              ]
              for loc in currency_candidates:
                  for i in range(loc.count()):
                      try:
                          el=loc.nth(i)
                          if el.is_visible():
                              el.scroll_into_view_if_needed(); page.wait_for_timeout(400)
                              try: el.click(timeout=3000)
                              except: el.evaluate('(e)=>e.click()')
                              page.wait_for_timeout(700)
                              snap(page,'09b_currency_options_open.png',False)
                              currency_opened=True
                              page.keyboard.press('Escape'); page.wait_for_timeout(300)
                              break
                      except: pass
                  if currency_opened: break
              R['currency_opened']=currency_opened

              # 10a. Open country/phone prefix dropdown if available, capture and close.
              phone_opened=False
              phone_triggers=page.locator("button, [role='button']")
              tel=page.locator("input[type='tel']")
              if tel.count():
                  try:
                      tel.first.scroll_into_view_if_needed(); page.wait_for_timeout(400)
                      parent=tel.first.locator('xpath=..')
                      cand=parent.locator("button, [role='button']")
                      for i in range(cand.count()):
                          try:
                              if cand.nth(i).is_visible():
                                  cand.nth(i).click(timeout=2500); page.wait_for_timeout(600)
                                  snap(page,'10b_phone_country_options_open.png',False)
                                  phone_opened=True; page.keyboard.press('Escape'); break
                          except: pass
                  except: pass
              R['phone_country_opened']=phone_opened

              # 11a. Expand referral if it's collapsed.
              referral_expanded=False
              for label in ['USE REFERRAL CODE (OPTIONAL)','MÃ GIỚI THIỆU','Mã giới thiệu','Referral Code','REFERRAL CODE']:
                  loc=page.get_by_text(label,exact=False)
                  for i in range(loc.count()):
                      try:
                          if loc.nth(i).is_visible():
                              loc.nth(i).scroll_into_view_if_needed(); page.wait_for_timeout(300)
                              try: loc.nth(i).click(timeout=2500)
                              except: loc.nth(i).evaluate('(e)=>e.click()')
                              page.wait_for_timeout(600)
                              snap(page,'11b_referral_expanded.png',False)
                              referral_expanded=True; break
                      except: pass
                  if referral_expanded: break
              R['referral_expanded']=referral_expanded

              # Final bottom view and full-page after any expansions. Do NOT click submit.
              page.evaluate('window.scrollTo(0, document.body.scrollHeight)')
              page.wait_for_timeout(700)
              snap(page,'13_bottom_final_no_submit.png',False)
              snap(page,'14_register_FULL_PAGE_FINAL.png',True)
              R['submit_clicked']=False
              R['final_url']=page.url
              R['final_text_tail']=visible_text(page)[-4000:]

              context.close(); browser.close()

          (out/'registration_walkthrough.json').write_text(json.dumps(R,indent=2,ensure_ascii=False))
          print(json.dumps(R,indent=2,ensure_ascii=False))
          PY

      - name: Upload registration screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m88-register-walkthrough-${{ github.run_id }}
          path: evidence/
          retention-days: 3
          if-no-files-found: warn
