name: Modal GPU Interactive Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modal-gpu-interactive-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
      TERM: xterm-256color

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal SDK
        run: python -m pip install --upgrade 'modal==1.5.3'

      - name: Authenticate Modal interactively
        run: |
          echo 'MODAL_LOGIN_START'
          python -m modal token new --verify
          echo 'MODAL_LOGIN_OK'

      - name: Run T4 GPU smoke test
        run: python -m modal run modal_gpu_smoke.py
