name: Deploy Runner5 Pages Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'edge/runner5-pages-gateway/**'
      - '.github/workflows/runner5-pages-gateway-deploy.yml'

permissions:
  contents: read

concurrency:
  group: runner5-pages-gateway-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing GitHub secret: CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy production Pages project
        working-directory: edge/runner5-pages-gateway
        shell: bash
        run: |
          npx --yes wrangler@latest pages deploy ./dist \
            --project-name=runner5-restore-gateway \
            --branch=main \
            --commit-hash="$GITHUB_SHA"

      - name: Verify live Candidate 6
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = 'https://runner5-restore-gateway.pages.dev/__runner5/pages-gateway/health'
          last = None
          for _ in range(12):
              try:
                  req = urllib.request.Request(url, headers={'Cache-Control':'no-cache','User-Agent':'Runner5DeployVerify/1.0'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      body = r.read().decode('utf-8')
                      last = (r.status, body)
                      data = json.loads(body)
                      if r.status == 200 and data.get('ok') is True and data.get('candidate') == 6:
                          print('PASS:', body)
                          raise SystemExit(0)
              except Exception as e:
                  last = repr(e)
              time.sleep(5)
          raise SystemExit(f'Live verification failed: {last!r}')
          PY
