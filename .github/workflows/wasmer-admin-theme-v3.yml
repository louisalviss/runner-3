name: Wasmer Admin Theme Handoff v3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wasmer-admin-theme-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Package theme
        run: |
          cd wordpress-site/wp-content/themes
          zip -qr "$GITHUB_WORKSPACE/runner3-starter.zip" runner3-starter
      - name: Generate ephemeral key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/session-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/session-private.pem -pubout -out session-public.pem >/dev/null 2>&1
          chmod 600 /tmp/session-private.pem
      - name: Upload public key
        uses: actions/upload-artifact@v4
        with:
          name: wasmer-handoff-key-${{ github.run_id }}
          path: session-public.pem
          retention-days: 1
      - name: Receive encrypted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/wasmer-session/${GITHUB_RUN_ID}.b64?ref=main"
          found=0
          for i in $(seq 1 180); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.raw+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API" -o /tmp/session.b64 2>/dev/null; then found=1; break; fi
            sleep 2
          done
          test "$found" = 1
          base64 -d /tmp/session.b64 > /tmp/session.enc
          openssl pkeyutl -decrypt -inkey /tmp/session-private.pem -in /tmp/session.enc -out /tmp/session.json -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python - <<'PY'
          import json
          x=json.load(open('/tmp/session.json'))
          for k in ['wasmer_user','wasmer_password','app_name','mail_address','mail_password']:
              assert x.get(k), k
          for v in x.values(): print('::add-mask::'+v)
          print('HANDOFF_DECRYPTED=true')
          PY
      - name: Install Playwright
        run: npm install --no-save playwright-core@1.58.2
      - name: Login, magic-login WordPress, activate theme
        run: |
          cat > admin-v3.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          import path from 'path';
          const id=JSON.parse(fs.readFileSync('/tmp/session.json','utf8'));
          const site='https://'+id.app_name+'.wasmer.app';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();
          const safe=s=>(s||'').replaceAll(id.wasmer_user,'[MASKED_USER]').replaceAll(id.wasmer_password,'[MASKED_PASSWORD]').replaceAll(id.mail_address,'[MASKED_EMAIL]').replaceAll(id.mail_password,'[MASKED_MAIL_PASSWORD]');
          async function body(p=page){return (await p.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim()}
          async function report(label,p=page){
            const fields=await p.locator('input,button,a').evaluateAll(els=>els.map(e=>({tag:e.tagName,type:e.type||'',name:e.name||'',placeholder:e.placeholder||'',text:(e.innerText||e.value||'').replace(/\s+/g,' ').trim().slice(0,90)})).filter(x=>x.text||x.placeholder||x.name).slice(0,60)).catch(()=>[]);
            console.log(label+'_URL='+p.url().replace(/([?&](?:token|magiclogin|secret|challenge|code)=)[^&]+/ig,'$1[MASKED]'));
            console.log(label+'_BODY='+safe((await body(p)).slice(0,1500)));
            console.log(label+'_CONTROLS='+safe(JSON.stringify(fields)));
          }
          async function click(loc){if(await loc.count()){await loc.first().click({timeout:10000}).catch(()=>{});return true}return false}
          async function mailToken(){
            const r=await fetch('https://api.mail.tm/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:id.mail_address,password:id.mail_password})});
            if(!r.ok) throw Error('Mail.tm token HTTP '+r.status); return (await r.json()).token;
          }
          async function waitLoginMail(){
            const token=await mailToken();
            for(let i=0;i<30;i++){
              await page.waitForTimeout(i?2000:500);
              const r=await fetch('https://api.mail.tm/messages',{headers:{Authorization:'Bearer '+token}}); if(!r.ok) continue;
              const j=await r.json(); const msgs=j['hydra:member']||j.member||[];
              for(const m of msgs){
                const subj=(m.subject||'').toLowerCase(); const from=((m.from||{}).address||'').toLowerCase();
                if(!subj.includes('wasmer')&&!subj.includes('login')&&!subj.includes('sign in')&&!subj.includes('code')&&!from.includes('wasmer')) continue;
                const q=await fetch('https://api.mail.tm/messages/'+m.id,{headers:{Authorization:'Bearer '+token}}); if(!q.ok) continue;
                const full=await q.json(); const html=Array.isArray(full.html)?full.html.join('\n'):(full.html||''); const text=(full.text||'')+'\n'+html;
                const urls=[...text.matchAll(/https?:\/\/[^\s"'<>]+/g)].map(x=>x[0].replace(/&amp;/g,'&'));
                const link=urls.find(u=>/wasmer\.io/i.test(u)&&/login|auth|verify|challenge|sign/i.test(u));
                const code=(text.match(/\b\d{6}\b/)||[])[0];
                if(link||code) return {link,code};
              }
            }
            return {};
          }
          async function loginWasmer(){
            await page.goto('https://wasmer.io/login',{waitUntil:'domcontentloaded',timeout:60000}); await page.waitForTimeout(900);
            const u=page.locator('input[name="username"],input[name="email"],input[autocomplete="username"],input[type="text"]').first();
            if(!await u.count()) throw Error('username field missing'); await u.fill(id.wasmer_user);
            if(!await click(page.getByRole('button',{name:/continue|log in|login|next/i}))) await page.keyboard.press('Enter');
            await page.waitForTimeout(1500); await report('LOGIN_STEP2');
            let p=page.locator('input[type="password"]').first();
            if(!await p.count()){
              const pwChoice=page.getByText(/use.*password|password login|log in.*password|sign in.*password/i).first();
              if(await pwChoice.count()){await pwChoice.click();await page.waitForTimeout(800);p=page.locator('input[type="password"]').first()}
            }
            if(await p.count()){
              await p.fill(id.wasmer_password);
              if(!await click(page.getByRole('button',{name:/log in|login|continue|sign in/i}))) await page.keyboard.press('Enter');
              await page.waitForTimeout(1800);
            } else {
              const auth=await waitLoginMail();
              if(auth.link){await page.goto(auth.link,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(1800)}
              else if(auth.code){
                let ci=page.locator('input[inputmode="numeric"],input[name*=code i],input[placeholder*=code i]').first();
                if(!await ci.count()) ci=page.locator('input').last();
                await ci.fill(auth.code); if(!await click(page.getByRole('button',{name:/continue|verify|log in|sign in/i}))) await page.keyboard.press('Enter'); await page.waitForTimeout(1800);
              } else throw Error('No password field and no Wasmer login email challenge found');
            }
            await report('LOGIN_RESULT');
            if(/\/login/i.test(page.url())||/log in|sign in/i.test((await body()).slice(0,120).toLowerCase())) throw Error('Wasmer login not completed');
            console.log('WASMER_LOGIN=true');
          }
          async function magicLogin(){
            await page.goto(`https://wasmer.io/apps/${id.wasmer_user}/${id.app_name}`,{waitUntil:'domcontentloaded',timeout:60000}); await page.waitForTimeout(1800); await report('APP_DASHBOARD');
            let admin=page.getByRole('link',{name:/wordpress admin/i}).first(); if(!await admin.count()) admin=page.getByRole('button',{name:/wordpress admin/i}).first(); if(!await admin.count()) admin=page.getByText(/wordpress admin/i).first();
            if(!await admin.count()) throw Error('WordPress Admin control missing');
            await admin.click(); await page.waitForTimeout(3500);
            const pages=page.context().pages(); let wp=pages.find(x=>/wp-admin/i.test(x.url())); if(!wp&&/wp-admin/i.test(page.url())) wp=page;
            if(!wp){for(const x of pages) console.log('PAGE_AFTER_MAGIC='+x.url().replace(/([?&]magiclogin=)[^&]+/i,'$1[MASKED]'));throw Error('Magic login did not reach wp-admin')}
            return wp;
          }
          async function theme(wp){
            console.log('WP_MAGIC_LOGIN=true');
            await wp.goto(site+'/wp-admin/theme-install.php',{waitUntil:'domcontentloaded',timeout:90000}); await wp.waitForTimeout(1200);
            await click(wp.getByRole('button',{name:/upload theme/i}));
            const file=wp.locator('input[type="file"]').first(); if(!await file.count()) throw Error('theme upload missing');
            await file.setInputFiles(path.resolve('runner3-starter.zip'));
            const install=wp.getByRole('button',{name:/install now/i}).first(); if(!await install.count()) throw Error('install button missing');
            await install.click(); await wp.waitForTimeout(5000);
            const activate=wp.getByRole('link',{name:/activate/i}).first(); if(await activate.count()){await activate.click();await wp.waitForTimeout(2500)}
            await wp.goto(site,{waitUntil:'domcontentloaded',timeout:90000}); await wp.waitForTimeout(1200);
            const txt=await body(wp); console.log('RUNNER3_THEME_MARKER='+/Built as a practical starter|Ready to edit|Runner3 Site/i.test(txt)); console.log('LIVE_SITE_URL='+site); console.log('LIVE_SITE_SAMPLE='+txt.slice(0,1000));
          }
          try{await loginWasmer();const wp=await magicLogin();await theme(wp);console.log('ADMIN_THEME_COMPLETE=true')}finally{await browser.close()}
          JS
          node admin-v3.mjs
      - name: Destroy secrets
        if: always()
        run: |
          shred -u /tmp/session-private.pem /tmp/session.json /tmp/session.enc /tmp/session.b64 2>/dev/null || true
          rm -f session-public.pem admin-v3.mjs
