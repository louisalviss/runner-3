name: Opportunity Radar D1 Checkpoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/opportunity_radar_market_checkpoint.py
      - .github/scripts/runner3_core.py
      - .github/workflows/opportunity-radar-d1-checkpoint.yml
  workflow_run:
    workflows: ['Runner3 Opportunity Radar Market V2']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: runner3-opportunity-radar-d1-checkpoint
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
      RADAR_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
      RADAR_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || github.run_attempt }}
      RADAR_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RADAR_WORKFLOW: Runner3 Opportunity Radar Market V2
    steps:
      - name: Checkout current persisted runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Sync D1 state/checkpoint
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && [ "$UPSTREAM_CONCLUSION" != "success" ]; then
            python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.github/scripts').resolve()))
          from runner3_core import report_status

          state = report_status(
              'opportunity-radar-market-v2',
              'failure',
              run_id=os.environ.get('RADAR_RUN_ID'),
              detail={
                  'workflow': os.environ.get('RADAR_WORKFLOW'),
                  'phase': 'upstream_failed',
                  'lane': 'MARKET_PRICING',
                  'conclusion': os.environ.get('UPSTREAM_CONCLUSION'),
                  'run_attempt': os.environ.get('RADAR_RUN_ATTEMPT'),
                  'trigger_sha': os.environ.get('RADAR_TRIGGER_SHA'),
              },
          )
          Path('/tmp/opportunity-radar-d1-status.json').write_text(
              json.dumps({
                  'ok': False,
                  'checkpointUpdated': False,
                  'upstreamConclusion': os.environ.get('UPSTREAM_CONCLUSION'),
                  'radarRunId': os.environ.get('RADAR_RUN_ID'),
                  'stateStatus': state.get('status') if isinstance(state, dict) else None,
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({'ok': True, 'checkpoint_updated': False, 'state': state}, ensure_ascii=False))
          PY
            exit 0
          fi

          python scripts/opportunity_radar_market_checkpoint.py | tee /tmp/opportunity-radar-checkpoint.log

      - name: Verify D1 checkpoint round-trip
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.github/scripts').resolve()))
          from runner3_core import get_checkpoint, get_state

          health=json.loads(Path('data/opportunity-radar/market-health.json').read_text(encoding='utf-8'))
          checkpoint=get_checkpoint('opportunity-radar-v2','market-pricing')
          state=get_state('opportunity-radar-market-v2')
          position=checkpoint.get('position') if isinstance(checkpoint,dict) else None
          ok=bool(
              isinstance(checkpoint,dict)
              and checkpoint.get('status')=='success'
              and checkpoint.get('project')=='opportunity-radar-v2'
              and checkpoint.get('scope')=='market-pricing'
              and isinstance(position,dict)
              and position.get('phase')=='persisted'
              and position.get('source_session_date')==health.get('source_session_date')
              and int(position.get('signal_count') or -1)==int(health.get('signal_count') or -2)
              and isinstance(state,dict)
              and state.get('status')=='success'
          )
          proof={
              'ok':ok,
              'radarRunId':os.environ.get('RADAR_RUN_ID'),
              'sourceSessionDate':health.get('source_session_date'),
              'signalCount':health.get('signal_count'),
              'phase':position.get('phase') if isinstance(position,dict) else None,
              'intakeIdsSha256':position.get('intake_ids_sha256') if isinstance(position,dict) else None,
              'stateStatus':state.get('status') if isinstance(state,dict) else None,
              'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          Path('/tmp/opportunity-radar-d1-status.json').write_text(
              json.dumps(proof,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps(proof,ensure_ascii=False,indent=2))
          if not ok:
              raise SystemExit('Opportunity Radar D1 checkpoint verification failed')
          PY

      - name: Persist safe D1 checkpoint status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/opportunity-radar
          if [ -s /tmp/opportunity-radar-d1-status.json ]; then
            cp /tmp/opportunity-radar-d1-status.json ops/opportunity-radar/d1-checkpoint-status.json
          else
            printf '{"ok":false,"radarRunId":"%s","error":"sync_result_missing"}\n' "$RADAR_RUN_ID" > ops/opportunity-radar/d1-checkpoint-status.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/opportunity-radar/d1-checkpoint-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist Opportunity Radar D1 checkpoint: ${RADAR_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 3
