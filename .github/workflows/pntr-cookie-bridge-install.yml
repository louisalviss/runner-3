name: PNTR Cookie Bridge Install

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pntr-cookie-bridge-install.yml'
      - 'scripts/install-pntr-cookie-bridge.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore encrypted runtime states
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || exit 2
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/pntr/browser-state.aes -out /tmp/pntr-browser-state.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-account.json
          if [ -f ops/wasmer/browser-state.aes ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/browser-state.aes -out /tmp/wasmer-browser-state.json
          fi
          chmod 600 /tmp/pntr-browser-state.json /tmp/wasmer-account.json
          [ ! -f /tmp/wasmer-browser-state.json ] || chmod 600 /tmp/wasmer-browser-state.json
          echo 'RUNTIME_STATES_READY=true'

      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.58.2 >/dev/null

      - name: Prepare bridge v2 installer
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/install-pntr-cookie-bridge.mjs scripts/.install-pntr-cookie-bridge.runtime.mjs
          python - <<'PY'
          from pathlib import Path
          f = Path('scripts/.install-pntr-cookie-bridge.runtime.mjs')
          s = f.read_text()
          s = s.replace('runner3-factory-smoke-2', 'runner3-wp-a94b8fd2')
          s = s.replace('e82bc8504dfe7bb3a3e2dac8eae2b30bf13c56883cb34a89e97e9d454944a28f', '842a4b1524aa7d5c8f642d5d1f53234032fa300293da1f0b91cf85f6b2d13237')
          s = s.replace('runner3-pntr-bridge', 'runner3-pntr-bridge-v2')
          s = s.replace('Runner3 PNTR Cookie Bridge', 'Runner3 PNTR Cookie Bridge v2')
          s = s.replace('runner3_pntr_bridge_used', 'runner3_pntr_bridge_used_v2')
          old = """    header('Cache-Control: no-store, no-cache, must-revalidate, max-age=0');
              header('Pragma: no-cache');
              header('Location: https://pntr.dev/login', true, 302);
              exit;"""
          new = """    header('Cache-Control: no-store, no-cache, must-revalidate, max-age=0');
              header('Pragma: no-cache');
              header('Content-Type: text/html; charset=utf-8');
              echo '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PNTR ready</title></head><body style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:32px;max-width:560px;margin:auto"><h2>PNTR session ready</h2><p>Guest session is now in this browser.</p><a href="https://pntr.dev/login" style="display:block;text-align:center;padding:16px 20px;background:#111;color:#fff;text-decoration:none;border-radius:12px;font-size:18px;font-weight:700">Open PNTR Sign in</a></body></html>';
              exit;"""
          if old not in s:
              raise SystemExit('redirect block not found')
          s = s.replace(old, new)
          f.write_text(s)
          PY
          chmod 700 scripts/.install-pntr-cookie-bridge.runtime.mjs

      - name: Install one-time bridge v2
        run: node scripts/.install-pntr-cookie-bridge.runtime.mjs

      - name: Cleanup sensitive runtime files
        if: always()
        shell: bash
        run: |
          rm -f /tmp/pntr-browser-state.json /tmp/wasmer-account.json /tmp/wasmer-browser-state.json scripts/.install-pntr-cookie-bridge.runtime.mjs
          rm -rf /tmp/runner3-pntr-bridge /tmp/runner3-pntr-bridge.zip /tmp/runner3-pntr-bridge-v2 /tmp/runner3-pntr-bridge-v2.zip
