name: Private Backtest US60 Survivorship Audit V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'jobs/private-backtest-us60-survivorship-audit-v1.json'
      - 'jobs/private-backtest-us60-survivorship-audit-trigger.txt'
      - 'tools/private_backtest_us60_survivorship_audit.py'
      - '.github/workflows/private-backtest-us60-survivorship-audit-v1.yml'

permissions:
  contents: read

concurrency:
  group: private-backtest-us60-survivorship-audit-v1
  cancel-in-progress: false

env:
  RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
  RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
  RUNNER3_SOURCE: runner-3-github-hosted

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage survivorship audit
        run: python tools/private_backtest_us60_survivorship_audit.py stage --config jobs/private-backtest-us60-survivorship-audit-v1.json

  shard:
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check 'dukascopy-python==4.0.1' 'numpy>=2,<3' 'pandas>=2,<3'
      - name: Run historical-removal control shard
        run: python tools/private_backtest_us60_survivorship_audit.py shard --config jobs/private-backtest-us60-survivorship-audit-v1.json --shard ${{ matrix.shard }}

  evaluate:
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate survivorship audit
        run: python tools/private_backtest_us60_survivorship_audit.py evaluate --config jobs/private-backtest-us60-survivorship-audit-v1.json
