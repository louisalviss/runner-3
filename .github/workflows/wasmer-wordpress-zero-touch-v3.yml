name: Wasmer WordPress Zero Touch v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasmer-wordpress-zero-touch-v3.yml'
      - 'scripts/wasmer-provision.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wasmer-wordpress-zero-touch-v3
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare secure runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || exit 2
          echo '::add-mask::'"$AUTOMATION_KEY"
          python - <<'PY'
          import json,secrets,urllib.request
          def req(url,data=None):
              r=urllib.request.Request(url,data=(json.dumps(data).encode() if data is not None else None),headers={'Content-Type':'application/json'},method='POST' if data is not None else 'GET')
              with urllib.request.urlopen(r,timeout=30) as x:return json.loads(x.read().decode())
          d=req('https://api.mail.tm/domains')
          ds=d.get('hydra:member') or d.get('member') or []
          domain=next(x['domain'] for x in ds if x.get('isActive',True))
          address=f"runner3wp{secrets.token_hex(6)}@{domain}"
          password=secrets.token_urlsafe(30)
          req('https://api.mail.tm/accounts',{'address':address,'password':password})
          token=req('https://api.mail.tm/token',{'address':address,'password':password})['token']
          open('/tmp/mailtm.json','w').write(json.dumps({'address':address,'password':password,'token':token}))
          print('MAILTM_READY=true')
          PY
          npm install --no-save playwright-core@1.58.2

      - name: Provision Wasmer WordPress
        shell: bash
        run: |
          set -euo pipefail
          node scripts/wasmer-provision.mjs

      - name: Persist encrypted result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/wasmer-result.json || echo '{"status":"runner_error","detail":"result_missing"}' > /tmp/wasmer-result.json
          test -f /tmp/wasmer-status.json || echo '{"status":"runner_error","detail":"status_missing"}' > /tmp/wasmer-status.json
          echo 'SAFE_STATUS:'
          cat /tmp/wasmer-status.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/wasmer
            cp /tmp/wasmer-status.json ops/wasmer/status.json
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in /tmp/wasmer-result.json -out ops/wasmer/state.automation.aes
            git add ops/wasmer/status.json ops/wasmer/state.automation.aes
            if git diff --cached --quiet; then
              pushed=true
              break
            fi
            git commit -m 'Update encrypted Wasmer provisioning state'
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep 2
          done
          test "$pushed" = true || { echo 'Could not persist state after retries'; exit 3; }
