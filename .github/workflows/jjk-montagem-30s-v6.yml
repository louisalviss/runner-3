name: JJK Montagem 30s V6
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/jjk-montagem-30s-v6.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl openvpn iproute2 iptables
          python -m pip install -q -U yt-dlp numpy
      - name: Download JJK 2026 via isolated VPN
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 35 https://www.vpngate.net/api/iphone/ -o vpn.csv
          python <<'PY'
          import csv,base64
          a=[]
          for r in csv.reader(open('vpn.csv',encoding='utf-8-sig',errors='replace')):
              if len(r)<15 or not r or r[0].startswith(('*','#')): continue
              cc=r[6].strip().upper()
              if cc not in {'VN','JP','KR'}: continue
              try:a.append((0 if cc=='VN' else 1,-int(r[2] or 0),cc,r[1],base64.b64decode(r[14]).decode('utf8','replace')))
              except:pass
          a.sort(); a=a[:6]
          with open('vpns.tsv','w') as m:
              for i,(_,_,cc,ip,cfg) in enumerate(a):
                  p=f'v{i}.ovpn';open(p,'w').write(cfg+'\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 7\n');m.write(f'{p}\t{cc}\t{ip}\n')
          PY
          sudo mkdir -p /etc/netns/vpnns; printf 'nameserver 1.1.1.1\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          sudo ip netns add vpnns; sudo ip link add vh type veth peer name vv; sudo ip link set vv netns vpnns
          sudo ip addr add 10.203.0.1/24 dev vh;sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.203.0.2/24 dev vv;sudo ip netns exec vpnns ip link set lo up;sudo ip netns exec vpnns ip link set vv up;sudo ip netns exec vpnns ip route add default via 10.203.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null; W=$(ip route show default|awk '/default/{print $5;exit}')
          sudo iptables -t nat -A POSTROUTING -s 10.203.0.0/24 -o "$W" -j MASQUERADE;sudo iptables -A FORWARD -i vh -o "$W" -j ACCEPT;sudo iptables -A FORWARD -i "$W" -o vh -m state --state RELATED,ESTABLISHED -j ACCEPT
          Y=$(command -v yt-dlp); got=0
          while IFS=$'\t' read -r p cc ip; do
            [ -f /tmp/v.pid ]&&sudo kill "$(cat /tmp/v.pid)" 2>/dev/null||true;sudo rm -f /tmp/v.pid /tmp/v.log;sleep 1
            sudo ip netns exec vpnns openvpn --config "$GITHUB_WORKSPACE/$p" --daemon --writepid /tmp/v.pid --log /tmp/v.log||true
            tun=0;for n in $(seq 1 12);do sudo ip netns exec vpnns ip link show tun0 >/dev/null 2>&1&&{ tun=1;break;};sleep 1;done;[ "$tun" = 1 ]||continue
            eg=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 8 https://api.ipify.org||true);[ -n "$eg" ]||continue;echo "EGRESS=$eg $cc"
            rm -f source.*
            if timeout 105s sudo ip netns exec vpnns env PATH="$PATH" HOME="$HOME" "$Y" --no-playlist --retries 1 --socket-timeout 15 --js-runtimes node --remote-components ejs:github -f 'bv*[height<=1080]+ba/b[height<=1080]' --merge-output-format mp4 -o "$GITHUB_WORKSPACE/source.%(ext)s" 'https://www.youtube.com/watch?v=DKNM-3LpfZE';then
              f=$(find . -maxdepth 1 -name 'source*.mp4'|head -1);[ -n "$f" ]&&{ [ "$f" = './source.mp4' ]||mv "$f" source.mp4;got=1;break;}
            fi
          done<vpns.tsv
          [ "$got" = 1 ]||exit 22
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name -of default=nw=1 source.mp4
      - name: Download Montagem
        run: |
          set -euxo pipefail
          yt-dlp --no-playlist -f 'bestaudio/best' -o 'm.%(ext)s' 'https://maxjoannes.bandcamp.com/track/montagem-lala-fawela'
          f=$(find . -maxdepth 1 -name 'm.*'|head -1);ffmpeg -loglevel error -y -i "$f" -vn -c:a libmp3lame -b:a 256k montagem.mp3
      - name: Analyze and render
        shell: bash
        run: |
          set -euxo pipefail
          python <<'PY'
          import subprocess,numpy as np,os
          w,h,fps=224,126,8;sz=w*h
          p=subprocess.Popen(['ffmpeg','-loglevel','error','-i','source.mp4','-vf',f'scale={w}:{h},fps={fps}','-pix_fmt','gray','-f','rawvideo','-'],stdout=subprocess.PIPE)
          prev=None;i=0;c=[]
          while 1:
            b=p.stdout.read(sz)
            if len(b)<sz:break
            x=np.frombuffer(b,np.uint8).reshape(h,w)
            if prev is not None:
              d=np.abs(x.astype(np.int16)-prev.astype(np.int16));t=i/fps;lum=x.mean();detail=x.std();s=d.mean()*.58+np.percentile(d,90)*.38+min(detail,70)*.1-(20 if lum<22 or lum>234 else 0)
              if 1<t<44:c.append((float(s),t))
            prev=x;i+=1
          p.wait();pick=[]
          for s,t in sorted(c,reverse=True):
            if all(abs(t-q[1])>.48 for q in pick):pick.append((s,t))
            if len(pick)>=58:break
          print('MOMENTS',len(pick));assert len(pick)>=48
          ds=[.58,.50,.66,.46,.72,.52,.56,.44];total=0;clips=[];j=0
          while total<30-.001:
            s,t=pick[j%len(pick)];d=min(ds[j%len(ds)],30-total);clips.append((t-.06,d));total+=d;j+=1
          os.makedirs('clips',exist_ok=True)
          for j,(t,d) in enumerate(clips):
            flash="drawbox=x=0:y=0:w=iw:h=ih:color=white@.11:t=fill:enable='lt(t,.028)'," if j%8==0 else ''
            fc='[0:v]split=2[b][f];[b]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=34,eq=brightness=-.24:saturation=.72[b2];[f]scale=1024:576,eq=contrast=1.08:saturation=1.13,unsharp=5:5:.35:5:5:0[f2];[b2][f2]overlay=(W-w)/2:(H-h)/2,'+flash+'fps=30,format=yuv420p[v]'
            subprocess.check_call(['ffmpeg','-loglevel','error','-y','-ss',f'{t:.3f}','-i','source.mp4','-t',f'{d:.3f}','-filter_complex',fc,'-map','[v]','-an','-c:v','libx264','-preset','veryfast','-crf','19','-profile:v','high','-pix_fmt','yuv420p',f'clips/{j:03}.mp4'])
          open('list.txt','w').write(''.join(f"file 'clips/{j:03}.mp4'\n" for j in range(len(clips))));print('CLIPS',len(clips),'TOTAL',total)
          PY
          ffmpeg -loglevel error -y -f concat -safe 0 -i list.txt -c copy visual.mp4
          ffmpeg -loglevel error -y -i visual.mp4 -ss 4 -i montagem.mp3 -t 30 -map 0:v -map 1:a -c:v copy -af 'volume=.98,bass=g=3.5:f=90,alimiter=limit=.95' -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart jjk_montagem_30s_v6.mp4
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,sample_rate,channels -show_entries format=duration,size,bit_rate -of default=nw=1 jjk_montagem_30s_v6.mp4
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: jjk-montagem-30s-v6
          path: jjk_montagem_30s_v6.mp4
          retention-days: 3
