name: x
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  scrub-dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scrub commit metadata, remove trigger, dispatch Vidian
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BOT_NAME='github-actions[bot]'
          BOT_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f --env-filter '
            BOT_NAME="github-actions[bot]"
            BOT_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
            case "$GIT_AUTHOR_EMAIL" in
              *@users.noreply.github.com) ;;
              *) export GIT_AUTHOR_NAME="$BOT_NAME"; export GIT_AUTHOR_EMAIL="$BOT_EMAIL" ;;
            esac
            case "$GIT_COMMITTER_EMAIL" in
              *@users.noreply.github.com) ;;
              *) export GIT_COMMITTER_NAME="$BOT_NAME"; export GIT_COMMITTER_EMAIL="$BOT_EMAIL" ;;
            esac
          ' -- --all
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git push --force origin HEAD:main
          git rm .github/workflows/x.yml
          git commit -m 'cleanup'
          git push origin HEAD:main
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vidian.yml/dispatches" \
            -d '{"ref":"main"}'
