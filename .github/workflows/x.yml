name: x

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  x:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MSG="$(git log -1 --pretty=%B)"
          NEW_NAME='github-actions[bot]'
          NEW_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'

          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f \
            --env-filter '
              case "$GIT_AUTHOR_EMAIL" in
                *@users.noreply.github.com) ;;
                *)
                  export GIT_AUTHOR_NAME="'"$NEW_NAME"'"
                  export GIT_AUTHOR_EMAIL="'"$NEW_EMAIL"'"
                  ;;
              esac
              case "$GIT_COMMITTER_EMAIL" in
                *@users.noreply.github.com) ;;
                *)
                  export GIT_COMMITTER_NAME="'"$NEW_NAME"'"
                  export GIT_COMMITTER_EMAIL="'"$NEW_EMAIL"'"
                  ;;
              esac
            ' \
            HEAD

          git push --force origin HEAD:main

          if printf '%s' "$MSG" | grep -Fq '[vidian]'; then
            curl --fail-with-body -sS -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vidian.yml/dispatches" \
              -d '{"ref":"main"}'
          fi
