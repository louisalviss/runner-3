name: Runner3 RSS Split Encrypted Response

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-rss-split-encrypted-response.yml'
      - 'ops/rss-library/chatgpt-responses/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-rss-split-encrypted-response
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Split encrypted envelopes for connector-safe retrieval
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          src_dir=Path('ops/rss-library/chatgpt-responses')
          root=Path('ops/rss-library/chatgpt-response-chunks')
          root.mkdir(parents=True,exist_ok=True)
          for src in sorted(src_dir.glob('*.json')):
              env=json.loads(src.read_text(encoding='utf-8'))
              cipher=env.pop('ciphertext',None)
              if not cipher:
                  continue
              request_id=str(env.get('requestId') or src.stem)
              out=root/request_id
              out.mkdir(parents=True,exist_ok=True)
              (out/'meta.json').write_text(json.dumps(env,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              chunks=[cipher[i:i+3000] for i in range(0,len(cipher),3000)]
              for i,chunk in enumerate(chunks):
                  (out/f'{i:03d}.txt').write_text(chunk,encoding='utf-8')
              (out/'count.txt').write_text(str(len(chunks))+'\n',encoding='utf-8')
              print(request_id,len(chunks))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/rss-library/chatgpt-response-chunks
          git diff --cached --quiet && exit 0
          git commit -m 'Persist connector-safe RSS encrypted chunks [skip ci]'
          git pull --rebase origin main || true
          git push origin HEAD:main
