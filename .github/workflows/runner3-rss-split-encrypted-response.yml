name: Runner3 RSS Split Encrypted Response

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-rss-split-encrypted-response.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Split Fulcrum encrypted envelope for connector-safe retrieval
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          request_id='fulcrum-20260825-7df920cdd86f'
          src=Path('ops/rss-library/chatgpt-responses')/(request_id+'.json')
          env=json.loads(src.read_text(encoding='utf-8'))
          cipher=env.pop('ciphertext')
          out=Path('ops/rss-library/chatgpt-response-chunks')/request_id
          out.mkdir(parents=True,exist_ok=True)
          (out/'meta.json').write_text(json.dumps(env,indent=2)+'\n',encoding='utf-8')
          for i in range(0,len(cipher),3000):
              (out/f'{i//3000:03d}.txt').write_text(cipher[i:i+3000],encoding='utf-8')
          (out/'count.txt').write_text(str((len(cipher)+2999)//3000),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/rss-library/chatgpt-response-chunks
          git diff --cached --quiet && exit 0
          git commit -m 'Persist connector-safe RSS encrypted chunks [skip ci]'
          git pull --rebase origin main || true
          git push origin HEAD:main
