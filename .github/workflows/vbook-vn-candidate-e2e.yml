name: VBook VN Novel Candidate E2E
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated candidate IDs; blank = all"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install host dependencies
        run: |
          python -m pip install requests
          npm install --no-save cheerio@1.0.0
          python tools/vbook-audit/download_vbook_apk.py vbook.apk
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true
      - name: Run VN novel candidate E2E
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VBOOK_IDS: ${{ inputs.ids }}
        with:
          api-level: 25
          target: default
          arch: x86_64
          profile: Nexus 5
          ram-size: 2048M
          heap-size: 384M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/vbook-audit/run_vn_candidates.sh
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vbook-vn-candidates-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 3
