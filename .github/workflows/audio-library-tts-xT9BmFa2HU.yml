name: Audio Library TTS xT9BmFa2HU

on:
  push:
    branches: [main]
    paths:
      - 'ops/audio-library/chatgpt-outbox/b48c7298-bb9f-52ed-bd5d-efd2a53c1745.json'
      - '.github/workflows/audio-library-tts-xT9BmFa2HU.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  AUDIO_LIBRARY_BUCKET: runner3-wp-media
  AUDIO_LIBRARY_VOICE: vi-VN-NamMinhNeural
  AUDIO_LIBRARY_VOICE_RATE: +3%
  ITEM_ID: b48c7298-bb9f-52ed-bd5d-efd2a53c1745

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -q requests edge-tts 'cryptography>=45,<47'
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Decrypt ChatGPT payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey,X25519PublicKey
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305
          item=os.environ['ITEM_ID']
          env=json.loads(Path(f'ops/audio-library/chatgpt-outbox/{item}.json').read_text(encoding='utf-8'))
          seed=hashlib.sha256(b'runner3-audio-library-chatgpt-bridge-v1\0'+os.environ['CLOUDFLARE_API_TOKEN'].encode()).digest()
          private=X25519PrivateKey.from_private_bytes(seed)
          eph=X25519PublicKey.from_public_bytes(base64.b64decode(env['ephemeralPublicKey']))
          shared=private.exchange(eph)
          key=HKDF(algorithm=hashes.SHA256(),length=32,salt=None,info=b'runner3-audio-library-chatgpt-v1').derive(shared)
          plain=ChaCha20Poly1305(key).decrypt(base64.b64decode(env['nonce']),base64.b64decode(env['ciphertext']),item.encode())
          payload=json.loads(plain)
          if str(payload.get('id')) != item: raise SystemExit('payload id mismatch')
          Path('/tmp/payload.json').write_text(json.dumps(payload,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Synthesize Nam Minh
        id: synth
        shell: bash
        run: python scripts/audio_library_tts_from_chatgpt.py /tmp/payload.json
      - name: Publish safe status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          item_key="audio-library/items/${ITEM_ID}.json"
          media_key="audio-library/media/${ITEM_ID}/episode.mp3"
          npx -y wrangler@4.123.0 r2 object get "${AUDIO_LIBRARY_BUCKET}/${item_key}" --file=/tmp/item.json --remote >/dev/null 2>&1 || true
          npx -y wrangler@4.123.0 r2 object get "${AUDIO_LIBRARY_BUCKET}/${media_key}" --file=/tmp/episode.mp3 --remote >/dev/null 2>&1 || true
          python - <<'PY'
          import json,datetime,os
          from pathlib import Path
          item={}
          p=Path('/tmp/item.json')
          if p.exists() and p.stat().st_size:
              try:item=json.loads(p.read_text())
              except:pass
          mp3=Path('/tmp/episode.mp3')
          out={'status':'ready','itemId':os.environ['ITEM_ID'],'itemStatus':item.get('status'),'title':item.get('title'),'durationSeconds':item.get('durationSeconds'),'hasAudioUrl':bool(item.get('audioUrl')),'episodeBytes':mp3.stat().st_size if mp3.exists() else 0,'updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          Path('ops/audio-library/oneoff-xT9BmFa2HU-tts-status.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/audio-library/oneoff-xT9BmFa2HU-tts-status.json
          git commit -m 'Publish xT9BmFa2HU TTS status [skip ci]' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
