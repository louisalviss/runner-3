name: Chat interest save 2026-09-10 nanobot

on:
  push:
    paths:
      - '.github/workflows/chat-interest-save-20260910-nanobot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persist:
    runs-on: ubuntu-latest
    env:
      CORE_URL: https://runner3-core.ducduy2411.workers.dev
      CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
    steps:
      - name: Require write token
        shell: bash
        run: test -n "${CORE_TOKEN:-}"
      - name: Persist nanobot link interest
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          base=os.environ['CORE_URL'].rstrip('/')
          token=os.environ['CORE_TOKEN']
          url='https://www.facebook.com/share/1HZx82Kuu5/?mibextid=wwXIfr'

          def call(path, payload=None):
              headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/json',
                  'Content-Type':'application/json',
                  'User-Agent':'curl/8.5.0',
              }
              data=None if payload is None else json.dumps(payload,ensure_ascii=False,separators=(',',':')).encode()
              req=urllib.request.Request(base+path,data=data,headers=headers,method='GET' if payload is None else 'POST')
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'{path}: HTTP {e.code}: {e.read().decode(errors="replace")}')

          payload={
              'item':{
                  'item_id':url,
                  'canonical_url':url,
                  'source_type':'social',
                  'source_key':'facebook',
                  'source_name':'Code Web Không Khó',
                  'title':'NANOBOT: siêu nhẹ, tự host, mã nguồn mở – HKUDS/nanobot'
              },
              'features':[],
              'render_id':'interest-save:chat:2026-09-10:facebook:nanobot:1HZx82Kuu5',
              'context':{
                  'origin':'chatgpt',
                  'capture_date':'2026-09-10',
                  'intent':'shared_link_interest',
                  'retrieval_status':'verified',
                  'analysis':'User shared the nanobot post for evaluation; capture interest in the item without treating the post claims as endorsement.'
              }
          }

          result=call('/content-intelligence/interests/ingest',payload)
          print('INGEST='+json.dumps(result,separators=(',',':')))
          if not (result.get('ok') and result.get('durable') and result.get('d1_readback')):
              raise RuntimeError(f'nanobot interest not durable: {result}')

          recompute=call('/content-intelligence/profile/recompute',{'model_version':'personal-v3'})
          profile=call('/content-intelligence/profile?limit=5')
          print('RECOMPUTE='+json.dumps(recompute,separators=(',',':')))
          print('PROFILE_POLICY='+str(profile.get('policy_version')))
          print('NANOBOT_INTEREST_SAVE=PASS')
          PY
