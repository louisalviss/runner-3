name: Wave candle check temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wave-candle-check-temp.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install websocket-client==1.8.0
      - name: Fetch CME and PM 3m bars
        run: |
          python - <<'PY'
          import json,random,re,string,time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import websocket
          TV='wss://data.tradingview.com/socket.io/websocket?from=chart%2F'
          RX=re.compile(r'~m~(\d+)~m~')
          NY=ZoneInfo('America/New_York'); VN=ZoneInfo('Asia/Ho_Chi_Minh')
          def frame(s): return f'~m~{len(s)}~m~{s}'
          def cmd(m,p): return frame(json.dumps({'m':m,'p':p},separators=(',',':')))
          def sid(): return 'cs_'+''.join(random.choice(string.ascii_lowercase) for _ in range(12))
          def payloads(raw):
            pos=0
            while pos<len(raw):
              m=RX.match(raw,pos)
              if not m: break
              n=int(m.group(1)); a=m.end(); b=a+n
              if b>len(raw): break
              yield raw[a:b]; pos=b
          def fetch(ex,sym,bars=700):
            cs=sid(); ws=websocket.create_connection(TV,timeout=20,origin='https://www.tradingview.com',header=['User-Agent: Mozilla/5.0'])
            try:
              ws.send(cmd('set_auth_token',['unauthorized_user_token'])); ws.send(cmd('chart_create_session',[cs,'']))
              spec={'symbol':f'{ex}:{sym}','adjustment':'splits','session':'regular'}
              ws.send(cmd('resolve_symbol',[cs,'sym_0','='+json.dumps(spec,separators=(',',':'))]))
              ws.send(cmd('create_series',[cs,'ser_0','ser_0','sym_0','3',bars]))
              out=[]; end=time.monotonic()+20
              while time.monotonic()<end:
                raw=ws.recv()
                if not isinstance(raw,str): continue
                for p in payloads(raw):
                  if p.startswith('~h~'): ws.send(frame(p)); continue
                  try: msg=json.loads(p)
                  except: continue
                  if msg.get('m')=='timescale_update':
                    u=msg.get('p',[None,{}])[1]; s=u.get('ser_0') if isinstance(u,dict) else None
                    if isinstance(s,dict):
                      vals=[]
                      for x in s.get('s',[]):
                        v=x.get('v',[])
                        if len(v)>=6:
                          try: vals.append(tuple(map(float,v[:6])))
                          except: pass
                      if vals: out=sorted(vals)
                  if msg.get('m')=='series_completed': return out
              return out
            finally:
              ws.close()
          wanted={'CME':{'2026-08-14T21:27','2026-08-14T21:30','2026-08-14T21:33'},'PM':{'2026-08-15T01:51','2026-08-15T01:54','2026-08-15T01:57'}}
          result={}
          for ex,sym in [('NASDAQ','CME'),('NYSE','PM')]:
            vals=fetch(ex,sym); arr=[]
            for ts,o,h,l,c,v in vals:
              dt=datetime.fromtimestamp(ts,VN)
              key=dt.strftime('%Y-%m-%dT%H:%M')
              if key in wanted[sym]:
                arr.append({'time_vn':key,'time_et':datetime.fromtimestamp(ts,NY).strftime('%Y-%m-%dT%H:%M'),'open':o,'high':h,'low':l,'close':c,'volume':v})
            result[sym]=arr
          open('wave_candle_check.json','w').write(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wave_candle_check.json
          git commit -m 'temp: candle check [skip ci]'
          git push
