name: M88 SABA Four EPL Markets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/m88-saba-four-markets.yml']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence /tmp/relays
      - name: VPN
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://www.vpngate.net/api/iphone/ -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n'); meta=[]
          for c in ['TH','JP','SG','MY','ID','KR','TW','VN']:
            rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and r.get('OpenVPN_ConfigData_Base64')]
            rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
            for r in rs[:(10 if c=='TH' else 3)]:
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              p=pathlib.Path(f'/tmp/relays/{len(meta):02d}-{c}.ovpn');p.write_text(cfg);meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/relays.tsv').write_text('\n'.join(meta)+'\n')
          PY
          IFACE=$(ip route show default|awk '{print $5;exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn; sudo ip link set vn netns vpnns
          sudo ip addr add 10.248.0.1/24 dev vh; sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.248.0.2/24 dev vn; sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.248.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.248.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns; printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          selected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo TRY $country $relay
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null||true;sleep 1
            sudo rm -f /tmp/o.log /tmp/top.json;sudo touch /tmp/o.log;sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log||true
            ok=0;for i in {1..12};do sleep 1;grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null&&{ ok=1;break; };done
            [ "$ok" = 1 ]||continue
            if sudo ip netns exec vpnns curl -fsS --max-time 15 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/top.json;then
              if python3 - <<'PY'
          import json
          try:d=json.load(open('/tmp/top.json'))
          except:raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then echo "$country $relay"|tee evidence/relay.txt;selected=1;break;fi
            fi
          done </tmp/relays.tsv
          test "$selected" = 1
      - name: Fetch exact four markets
        shell: bash
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          OUT=Path(os.environ['WORKSPACE'])/'evidence'
          targets={
            'winner':(178916,'*ENGLISH PREMIER LEAGUE 2026/2027 - WINNER'),
            'top4':(179851,'*ENGLISH PREMIER LEAGUE 2026/2027 - TOP 4 FINISH'),
            'relegation':(179840,'*ENGLISH PREMIER LEAGUE 2026/2027 - TO BE RELEGATED'),
            'goalscorer':(180359,'*ENGLISH PREMIER LEAGUE 2026/2027 - TOP GOALSCORER'),
          }
          result={'markets':{},'notes':[]}; showall=[]
          def pframe(page):
            xs=[f for f in page.frames if urlparse(f.url).netloc.startswith('i1x9gr.')]
            return xs[-1] if xs else None
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            c=b.new_context(viewport={'width':390,'height':844},screen={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True,locale='en-US',timezone_id='Asia/Bangkok',user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1')
            page=c.new_page()
            def onresp(r):
              if 'BFOdds/ShowAllOdds' not in r.url:return
              try:
                body=r.text(); obj=json.loads(body)
                if any(v[1].lower() in body.lower() for v in targets.values()):showall.append({'url':r.url,'obj':obj})
              except:pass
            page.on('response',onresp)
            page.goto('https://www.m88.com/sports/Saba%20Sports?Language=en-US',wait_until='domcontentloaded',timeout=45000)
            page.wait_for_timeout(22000)
            f=pframe(page)
            if not f: raise RuntimeError('No SABA provider frame')
            sp=f.get_by_text('Sports',exact=True)
            for i in range(min(sp.count(),20)):
              try:
                if sp.nth(i).is_visible():sp.nth(i).click(timeout=5000);break
              except:pass
            page.wait_for_timeout(9000); f=pframe(page) or f
            out=f.get_by_text(re.compile(r'^\s*Outright(?:\s+\d+)?\s*$',re.I)).nth(0)
            out.evaluate("e=>e.scrollIntoView({block:'nearest',inline:'center'})"); page.wait_for_timeout(700)
            out.evaluate("e=>e.parentElement.click()")
            page.wait_for_timeout(12000); f=pframe(page) or f
            result['route']=f.url
            if not showall: raise RuntimeError('Outright ShowAllOdds payload not captured')
            so=showall[-1]; data=so['obj']['Data']; teamN=data.get('TeamN',{}); leagueN=data.get('LeagueN',{})
            result['showall_url']=so['url']; result['team_count']=len(teamN); result['league_count']=len(leagueN)
            verified={}
            for key,(mid,title) in targets.items():
              live=leagueN.get(str(mid)) or leagueN.get(mid)
              if live!=title:
                found=[int(k) for k,v in leagueN.items() if v==title]
                if not found: raise RuntimeError(f'Market title missing: {title}')
                mid=found[0]
              verified[key]=(mid,title)
            result['verified_ids']={k:v[0] for k,v in verified.items()}
            odds_origin=urlparse(so['url']).scheme+'://'+urlparse(so['url']).netloc
            endpoint=odds_origin+'/BFOdds/GetMarket'
            for key,(mid,title) in verified.items():
              payload={'GameId':999,'DateType':'t','BetTypeClass':'OU','Matchid':mid,'GameType':0}
              ret=f.evaluate("""async ({url,payload})=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});return {status:r.status,text:await r.text()}}""",{'url':endpoint,'payload':payload})
              obj=json.loads(ret['text']); odds=((obj.get('Data') or {}).get('NewOdds') or [])
              rows=[]
              for o in odds:
                tid=o.get('TeamId'); name=teamN.get(str(tid)) or teamN.get(tid) or f'ID:{tid}'
                rows.append({'name':name,'odds':o.get('Price'),'team_id':tid,'market_id':o.get('MarketId')})
              result['markets'][key]={'title':title,'match_id':mid,'status':ret['status'],'rows':rows}
            c.close();b.close()
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print('ROUTE',result['route'])
          print('VERIFIED_IDS',result['verified_ids'])
          for k,m in result['markets'].items():
            print('\n###',k,m['title'],'MID',m['match_id'],'ROWS',len(m['rows']))
            for r in m['rows']:print(r['name'],'|',r['odds'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-saba-four-markets-${{ github.run_id }}
          path: evidence/
          retention-days: 3
