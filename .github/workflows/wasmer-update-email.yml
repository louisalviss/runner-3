name: Wasmer Update Verification Email

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasmer-update-email.yml'
      - 'scripts/wasmer-update-email.mjs'
      - 'ops/wasmer/email-relay-ciphertext.b64'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted target and Wasmer session
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AUTOMATION_KEY"
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
            -in ops/wasmer/email-relay-private.aes -out /tmp/email-relay-private.pem
          base64 -d ops/wasmer/email-relay-ciphertext.b64 >/tmp/wasmer-email.bin
          openssl pkeyutl -decrypt -inkey /tmp/email-relay-private.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/wasmer-email.bin -out /tmp/target-email.txt
          TARGET_EMAIL="$(cat /tmp/target-email.txt)"
          echo "::add-mask::$TARGET_EMAIL"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
            -in ops/wasmer/state.automation.aes -out /tmp/wasmer-result.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
            -in ops/wasmer/browser-state.aes -out /tmp/wasmer-browser-state.json
          rm -f /tmp/email-relay-private.pem /tmp/wasmer-email.bin
      - run: npm install --no-save playwright-core@1.58.2
      - name: Update Wasmer verification email
        run: node scripts/wasmer-update-email.mjs
      - name: Persist safe update result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/wasmer-email-update.json || echo '{"status":"runner_error"}' >/tmp/wasmer-email-update.json
          cat /tmp/wasmer-email-update.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p ops/wasmer
          cp /tmp/wasmer-email-update.json ops/wasmer/email-update-status.json
          git add ops/wasmer/email-update-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist Wasmer verification email request status'
            git push origin HEAD:main
          fi
