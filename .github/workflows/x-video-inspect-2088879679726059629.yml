name: X video inspect 2088879679726059629

on:
  push:
    paths:
      - '.github/workflows/x-video-inspect-2088879679726059629.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp

      - name: Download tweet video and extract evidence
        shell: bash
        run: |
          set -euxo pipefail
          OUT='artifacts/x-2088879679726059629'
          URL='https://x.com/jnwang9527/status/2088879679726059629?s=12'
          mkdir -p "$OUT"

          yt-dlp --no-playlist --write-info-json --write-description \
            -o "$OUT/video.%(ext)s" "$URL"

          VIDEO="$(find "$OUT" -maxdepth 1 -type f \( -name 'video.mp4' -o -name 'video.webm' -o -name 'video.mkv' \) | head -n1)"
          test -n "$VIDEO"

          ffprobe -v error -show_entries format=duration,size,bit_rate \
            -show_entries stream=index,codec_name,codec_type,width,height,r_frame_rate \
            -of json "$VIDEO" > "$OUT/ffprobe.json"

          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$VIDEO")"
          ffmpeg -hide_banner -loglevel error -i "$VIDEO" \
            -vf "fps=12/$DURATION" -frames:v 12 -q:v 3 "$OUT/frame_%02d.jpg"

          ffmpeg -hide_banner -loglevel error \
            -framerate 1 -i "$OUT/frame_%02d.jpg" \
            -filter_complex 'tile=4x3:padding=4:margin=4' \
            -frames:v 1 -q:v 3 "$OUT/contact.jpg"

          rm -f "$VIDEO"

      - name: Commit extracted evidence
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/x-2088879679726059629
          git commit -m 'Add evidence for X video 2088879679726059629' || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
