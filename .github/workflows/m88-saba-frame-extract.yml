name: M88 SABA Frame Extract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/m88-saba-frame-extract.yml']
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence /tmp/relays
      - name: Connect supported Asia relay
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://www.vpngate.net/api/iphone/ -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n'); meta=[]
          for c in ['TH','JP','SG','MY','ID','KR','TW','VN']:
            rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and r.get('OpenVPN_ConfigData_Base64')]
            rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
            for r in rs[:(10 if c=='TH' else 3)]:
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              p=pathlib.Path(f'/tmp/relays/{len(meta):02d}-{c}.ovpn'); p.write_text(cfg)
              meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/relays.tsv').write_text('\n'.join(meta)+'\n')
          PY
          IFACE=$(ip route show default|awk '{print $5;exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn; sudo ip link set vn netns vpnns
          sudo ip addr add 10.245.0.1/24 dev vh; sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.245.0.2/24 dev vn; sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.245.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.245.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns; printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          selected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo TRY $country $relay
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null||true; sleep 1
            sudo rm -f /tmp/o.log /tmp/top.json; sudo touch /tmp/o.log; sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log||true
            ok=0; for i in {1..12}; do sleep 1; grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null&&{ ok=1; break; }; done
            [ "$ok" = 1 ]||continue
            if sudo ip netns exec vpnns curl -fsS --max-time 15 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/top.json; then
              if python3 - <<'PY'
          import json
          try:d=json.load(open('/tmp/top.json'))
          except:raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then
                echo "$country $relay"|tee evidence/relay.txt
                sudo ip netns exec vpnns curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace|grep -E '^(ip|loc|warp)='|tee evidence/egress.txt||true
                selected=1; break
              fi
            fi
          done </tmp/relays.tsv
          test "$selected" = 1
      - name: Extract exact public M88 SABA Outright
        shell: bash
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          OUT=Path(os.environ['WORKSPACE'])/'evidence'
          result={'frames':[],'markets':{},'notes':[]}; net=[]; bodies=[]; deeplinks=[]
          market_patterns={
            'winner':re.compile(r'ENGLISH PREMIER LEAGUE\s*2026/2027\s*-\s*WINNER',re.I),
            'top4':re.compile(r'ENGLISH PREMIER LEAGUE\s*2026/2027\s*-\s*TOP\s*4',re.I),
            'relegation':re.compile(r'ENGLISH PREMIER LEAGUE\s*2026/2027\s*-\s*(?:TO\s*BE\s*)?RELEGAT',re.I),
            'goalscorer':re.compile(r'ENGLISH PREMIER LEAGUE\s*2026/2027\s*-\s*TOP\s*GOALSCORER',re.I),
          }
          def text(f,limit=500000):
            try:return f.locator('body').inner_text(timeout=8000)[:limit]
            except:return ''
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            c=b.new_context(viewport={'width':390,'height':844},screen={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True,locale='en-US',timezone_id='Asia/Bangkok',user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1')
            page=c.new_page()
            def req(r):
              if r.resource_type in ('document','xhr','fetch'):
                net.append({'kind':'request','type':r.resource_type,'method':r.method,'url':r.url,'post':(r.post_data or '')[:10000]})
                if r.resource_type=='document' and '/deeplink' in r.url: deeplinks.append(r.url)
            def resp(r):
              if r.request.resource_type not in ('xhr','fetch'): return
              try:
                ct=(r.headers.get('content-type') or '').lower()
                if 'json' not in ct: return
                body=r.text()
                if len(body)>7000000:return
                if re.search(r'outright|2026/2027|premier league|goal.?scorer|relegat',body,re.I):
                  bodies.append({'url':r.url,'status':r.status,'body':body[:3000000]})
              except:pass
            page.on('request',req); page.on('response',resp)
            page.goto('https://www.m88.com/sports/Saba%20Sports?Language=en-US',wait_until='domcontentloaded',timeout=45000)
            page.wait_for_timeout(22000)
            result['m88_url']=page.url; result['deeplinks']=deeplinks[:20]
            # Find provider frame created by M88 auto-launch.
            provider=None; provider_page=page
            for f in page.frames:
              t=text(f,100000)
              result['frames'].append({'url':f.url,'name':f.name,'text':t[:20000]})
              if '/deeplink' in f.url or re.search(r'\bOutright\b',t,re.I): provider=f
            # Some builds navigate the document outside the iframe. Reopen the captured guest deeplink if needed.
            if provider is None and deeplinks:
              gp=c.new_page(); gp.on('request',req); gp.on('response',resp)
              gp.goto(deeplinks[-1],wait_until='domcontentloaded',timeout=45000); gp.wait_for_timeout(18000)
              provider_page=gp
              for f in gp.frames:
                t=text(f,100000)
                result['frames'].append({'url':f.url,'name':f.name,'text':t[:20000]})
                if '/deeplink' in f.url or re.search(r'\bOutright\b',t,re.I): provider=f
            if provider is None:
              result['notes'].append('provider frame not resolved')
            else:
              result['provider_url']=provider.url
              result['before']=text(provider,150000)
              provider_page.screenshot(path=str(OUT/'01-provider.png'),full_page=False)
              # Click Outright tab exactly as shown in M88 SABA mobile UI.
              outs=provider.get_by_text(re.compile(r'^\s*Outright(?:\s+\d+)?\s*$',re.I))
              for i in range(min(outs.count(),30)):
                try:
                  if outs.nth(i).is_visible(): outs.nth(i).click(timeout=7000); result['outright_clicked']=True; break
                except:pass
              provider_page.wait_for_timeout(10000)
              provider_page.screenshot(path=str(OUT/'02-outright.png'),full_page=False)
              # Re-resolve provider frame and progressively hydrate list.
              best=None
              for pg in c.pages:
                for f in pg.frames:
                  t=text(f)
                  score=(5 if re.search(r'\bOutright\b',t,re.I) else 0)+sum(4 for rx in market_patterns.values() if rx.search(t))
                  if best is None or score>best[0]:best=(score,pg,f,t)
              if best:_,provider_page,provider,corpus=best
              else:corpus=text(provider)
              for _ in range(50):
                if all(rx.search(corpus) for rx in market_patterns.values()):break
                try:provider.evaluate('window.scrollBy(0,700)')
                except:
                  try:provider_page.mouse.wheel(0,700)
                  except:pass
                provider_page.wait_for_timeout(400)
                now=text(provider)
                if now and now not in corpus:corpus+='\n'+now
              result['corpus']=corpus[:1200000]
              # Open each requested market; extract surrounding DOM text including selections + prices.
              for key,rx in market_patterns.items():
                rec={'found':bool(rx.search(corpus))}; found=None; ff=None; pp=None
                for pg in c.pages:
                  for f in pg.frames:
                    loc=f.get_by_text(rx)
                    for i in range(min(loc.count(),100)):
                      try:
                        if loc.nth(i).is_visible():found=loc.nth(i);ff=f;pp=pg;break
                      except:pass
                    if found:break
                  if found:break
                if found:
                  try:rec['title']=found.inner_text()[:800]
                  except:rec['title']=''
                  try:found.scroll_into_view_if_needed(timeout=3000);found.click(timeout=7000);pp.wait_for_timeout(2500);rec['clicked']=True
                  except Exception as e:rec['clicked']=False;rec['error']=type(e).__name__
                  t=text(ff);m=rx.search(t);rec['window']=t[max(0,m.start()-500):m.start()+40000] if m else t[:40000]
                else:
                  m=rx.search(corpus);rec['window']=corpus[max(0,m.start()-500):m.start()+40000] if m else ''
                result['markets'][key]=rec
            c.close();b.close()
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          (OUT/'network.json').write_text(json.dumps(net,ensure_ascii=False,indent=2))
          (OUT/'json-bodies.json').write_text(json.dumps(bodies,ensure_ascii=False,indent=2))
          print('DEEPLINKS',result.get('deeplinks'))
          print('PROVIDER',result.get('provider_url'))
          print('OUTRIGHT',result.get('outright_clicked'))
          print('NOTES',result.get('notes'))
          for k,v in result.get('markets',{}).items():
            print('\n###',k,'FOUND',v.get('found'),'CLICKED',v.get('clicked'))
            print(v.get('window','')[:30000])
          print('\nJSON BODY URLS')
          for x in bodies:print(x['url'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-saba-frame-extract-${{ github.run_id }}
          path: evidence/
          retention-days: 3
