name: Content Intelligence · Explicit Feedback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/content-intelligence-feedback.yml"
      - "data/content-intelligence/feedback-request.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve immutable manifest numbers to durable D1 events
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          req = json.loads(Path('data/content-intelligence/feedback-request.json').read_text(encoding='utf-8'))
          wanted_date = str(req.get('date') or '').strip()
          wanted_hash = str(req.get('manifest_hash') or '').strip()
          if not wanted_date or not wanted_hash:
              raise SystemExit('FEEDBACK_MANIFEST_IDENTITY_REQUIRED')

          def matches(obj):
              return obj.get('date') == wanted_date and obj.get('manifestHash') == wanted_hash

          manifest = None
          manifest_source = None
          candidates = [
              Path(f'data/rss-reader/manifests/{wanted_date}/{wanted_hash}.json'),
              Path(f'data/rss-reader/manifests/{wanted_date}/latest.json'),
              Path('data/rss-reader/kept-manifest-today.json'),
              Path('data/rss-reader/kept-manifest-yesterday.json'),
          ]
          for path in candidates:
              if not path.exists():
                  continue
              try:
                  obj = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if matches(obj):
                  manifest = obj
                  manifest_source = str(path)
                  break

          if manifest is None:
              paths = [
                  'data/rss-reader/kept-manifest-today.json',
                  'data/rss-reader/kept-manifest-yesterday.json',
              ]
              for path in paths:
                  refs = subprocess.check_output(
                      ['git', 'log', '-n', '500', '--format=%H', '--', path],
                      text=True,
                  ).splitlines()
                  for ref in refs:
                      try:
                          raw = subprocess.check_output(
                              ['git', 'show', f'{ref}:{path}'],
                              text=True,
                              stderr=subprocess.DEVNULL,
                          )
                          obj = json.loads(raw)
                      except Exception:
                          continue
                      if matches(obj):
                          manifest = obj
                          manifest_source = f'git:{ref}:{path}'
                          break
                  if manifest is not None:
                      break

          if manifest is None:
              raise SystemExit(f'FEEDBACK_MANIFEST_NOT_FOUND:{wanted_date}:{wanted_hash}')

          by_number = {int(item['number']): item for item in manifest.get('manifest') or []}
          mapping = [
              ('selected_numbers', 'selected'),
              ('deep_read_numbers', 'deep_read'),
              ('interest_saved_numbers', 'interest_saved'),
              ('liked_numbers', 'liked'),
              ('disliked_numbers', 'disliked'),
          ]
          seen = {}
          events = []
          render_id = req.get('render_id') or f"rss:{wanted_date}:{wanted_hash}"
          for field, event_type in mapping:
              for raw_n in req.get(field) or []:
                  n = int(raw_n)
                  if n not in by_number:
                      raise SystemExit(f'FEEDBACK_NUMBER_NOT_FOUND:{n}')
                  if n in seen:
                      raise SystemExit(f'FEEDBACK_NUMBER_OVERLAP:{n}:{seen[n]}:{event_type}')
                  seen[n] = event_type
                  item = by_number[n]
                  item_id = item.get('canonicalUrl')
                  if not item_id:
                      raise SystemExit(f'FEEDBACK_ITEM_ID_MISSING:{n}')
                  events.append({
                      'item_id': item_id,
                      'event_type': event_type,
                      'render_id': render_id,
                      'explicit_feedback': event_type if event_type in ('liked', 'disliked', 'interest_saved') else None,
                      'context': {
                          'source': 'chatgpt_rss_feedback',
                          'request_id': req.get('request_id'),
                          'manifest_number': n,
                          'manifest_date': wanted_date,
                          'manifest_hash': wanted_hash,
                          'manifest_source': manifest_source,
                          'source_key': item.get('sourceKey'),
                      },
                  })

          expected = sum(len(req.get(field) or []) for field, _ in mapping)
          if len(events) != expected or expected == 0:
              raise SystemExit(f'FEEDBACK_EVENT_COUNT_INVALID:{len(events)}:{expected}')
          Path('/tmp/feedback-events.json').write_text(json.dumps({'events': events}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'FEEDBACK_RESOLVED={len(events)}')
          print(f'FEEDBACK_RENDER_ID={render_id}')
          print(f'FEEDBACK_MANIFEST_SOURCE={manifest_source}')
          PY

      - name: Persist feedback events to Content Intelligence D1
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER3_CORE_TOKEN:-}" || { echo 'RUNNER3_CORE_TOKEN missing'; exit 2; }
          python3 scripts/content_intelligence_client.py event-batch --file /tmp/feedback-events.json | tee /tmp/feedback-result.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/feedback-result.json'))
          if x.get('ok') is not True or x.get('durable') is not True:
              raise SystemExit('FEEDBACK_D1_NOT_DURABLE')
          requested=int(x.get('requested') or 0)
          applied=int(x.get('applied') or 0)
          suppressed=int(x.get('missing_or_duplicate') or 0)
          if requested <= 0 or applied + suppressed != requested:
              raise SystemExit(f'FEEDBACK_D1_ACCOUNTING_FAILED:{x}')
          print(f'FEEDBACK_D1_DURABLE=PASS applied={applied} replay_or_missing={suppressed} requested={requested}')
          PY

      - name: Verify personal-v4 profile is materialized after explicit feedback
        id: recompute
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/content_intelligence_client.py recompute --model-version personal-v4

      - name: Upload feedback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-intelligence-feedback-${{ github.run_id }}
          path: |
            /tmp/feedback-events.json
            /tmp/feedback-result.json
          if-no-files-found: warn
          retention-days: 7
