name: Runner3 Speed Direct WordPress A/B

on:
  pull_request:
    paths:
      - 'wordpress/runner3-speed/**'
      - 'scripts/runner3-speed-ab-benchmark.mjs'
      - 'scripts/runner3-speed-safety-matrix.mjs'
      - '.github/workflows/runner3-speed-direct-wp-ab.yml'
      - '.github/workflows/runner3-speed-v1-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WP_SITE_SLUG: runner5-restore-lab-1

concurrency:
  group: runner3-speed-direct-wp-lab
  cancel-in-progress: true

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Static checks
        run: |
          set -euo pipefail
          php -l wordpress/runner3-speed/runner3-speed.php
          php -l wordpress/runner3-speed/dropins/advanced-cache.php
          php -l wordpress/runner3-speed/uninstall.php
          node --check scripts/runner3-speed-ab-benchmark.mjs
          node --check scripts/runner3-speed-safety-matrix.mjs

      - name: Package plugin
        run: |
          set -euo pipefail
          (cd wordpress && zip -qr /tmp/runner3-speed.zip runner3-speed)
          test -s /tmp/runner3-speed.zip

      - name: Decrypt Wasmer account state
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}"
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json

      - name: Install benchmark tooling
        run: npm install --no-save playwright-core@1.58.2 lighthouse@13.0.1

      - name: Run canonical performance and safety validation
        env:
          RUNNER3_PLUGIN_ZIP: /tmp/runner3-speed.zip
        run: |
          set -euo pipefail
          node scripts/runner3-speed-ab-benchmark.mjs
          test -s /tmp/runner3-speed-ab.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-ab.json'))
          assert r['status']=='ready', r
          assert r['cloudflare'] is False, r
          assert r['pluginVersion'], r
          b=r['baseline']; o=r['optimized']; s=r['safety']
          assert all(x.get('speed')=='HIT' and x.get('speedVersion')==r['pluginVersion'] for x in o['curl']['runs']), ('curl_not_all_current_hits',r)
          assert all(x.get('speed')=='HIT' and x.get('speedVersion')==r['pluginVersion'] for x in o['browser']['runs']), ('browser_not_all_current_hits',r)
          assert o['lighthouse']['medianScore'] >= b['lighthouse']['medianScore'], ('score_regression',r)
          assert o['lighthouse']['medianCls'] <= b['lighthouse']['medianCls'] + 0.001, ('cls_regression',r)
          assert o['lighthouse']['medianLcpMs'] <= b['lighthouse']['medianLcpMs'] + 100, ('lh_lcp_regression',r)
          assert o['browser']['medianLcpMs'] <= b['browser']['medianLcpMs'] + 75, ('browser_lcp_regression',r)
          assert o['browser']['medianTtfbMs'] < b['browser']['medianTtfbMs'], ('ttfb_not_improved',r)
          for k in ['installed','active','hit','queryBypass','apiBypass','adminBypass','off','productionUnchanged']:
              assert s[k], (k,r)
          print(json.dumps({'status':'PASS','version':r['pluginVersion'],'delta':r['delta'],'safety':s},indent=2))
          PY

      - name: Run extended bypass and deactivate matrix
        run: |
          set -euo pipefail
          node scripts/runner3-speed-safety-matrix.mjs
          test -s /tmp/runner3-speed-safety-matrix.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-safety-matrix.json'))
          assert r['status']=='ready', r
          for k in [
              'currentHit','headHit','headEmptyBody','authCookieBypass',
              'wooCartCookieBypass','wooSessionCookieBypass',
              'cartPathBypass','checkoutPathBypass','accountPathBypass','wcApiPathBypass',
              'deactivated','deactivateNoHit','reactivatedOff','finalNoHit'
          ]:
              assert r[k], (k,r)
          print(json.dumps({'status':'PASS','version':r['pluginVersion'],'extendedSafety':r},indent=2))
          PY

      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner3-speed-direct-wp-validation
          path: |
            /tmp/runner3-speed-ab.json
            /tmp/runner3-speed-safety-matrix.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove transient secrets
        if: always()
        run: rm -f /tmp/wasmer-account.json /tmp/runner3-speed.zip
