name: z

on:
  workflow_run:
    workflows: ["x"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  z:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OLD='redacted@users.noreply.github.com'
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select((.head_commit.author.email == "'"$OLD"'") or (.head_commit.committer.email == "'"$OLD"'")) | .id')"
          for id in $ids; do
            [ -z "$id" ] && continue
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.status' 2>/dev/null || true)"
            if [ -n "$status" ] && [ "$status" != "completed" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null 2>&1 || true
            fi
          done
          sleep 3
          for id in $ids; do
            [ -z "$id" ] && continue
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null 2>&1 || true
          done
