name: Compute Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - jobs/compute-smoke.txt

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runtime check
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          ulimit -c 0 || true
          python3 - <<'PY'
          import platform
          print('compute_ok')
          print(platform.python_version())
          PY
