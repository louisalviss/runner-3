name: VBTH R2 Master Reconstruction Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vbth-r2-master-reconstruct.yml'
      - 'story_pipeline/epub_semantic.py'
      - 'story_pipeline/metruyen_full.py'
      - 'story_pipeline/books/vbth.json'

permissions:
  contents: write

concurrency:
  group: vbth-r2-master-reconstruct
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: runner3-artifacts
  R2_KEY: core/ebook-editorial/vbth/source/Vuong_Bai_Tien_Hoa_Quyen_Tho_FULL_clean.epub
  EXPECT_FILE_SHA: f09a40ed0dc3dc54593a1e8be3700607575056fb3cb8ad620add9d138bc72685
  EXPECT_SEMANTIC_SHA: 7f5116bf48be83466ea3cfe81c98639c2c0bab764955e44c887facf148c3e650
  EXPECT_CHAPTERS: '1214'
  EXPECT_CHARS: '15059210'

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: python -m pip install -q requests beautifulsoup4 lxml

      - name: Reconstruct 1214-chapter candidate
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python story_pipeline/metruyen_full.py \
            --bible story_pipeline/config/story_bible.json \
            --out /tmp/vbth-reconstruct \
            --workers 10 \
            2>&1 | tee /tmp/vbth-build.log

      - name: Compute semantic identity
        id: semantic
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          EPUB=/tmp/vbth-reconstruct/Vuong_Bai_Tien_Hoa_MeTruyen_BienTap.epub
          python story_pipeline/epub_semantic.py "$EPUB" --summary-only > /tmp/vbth-semantic.json
          cat /tmp/vbth-semantic.json

      - name: Evaluate canonical gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out={
            'schema':'vbth-master-reconstruct-gate-v1',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'source':'metruyen-live-reconstruction',
            'r2_bucket':os.environ['R2_BUCKET'],
            'r2_key':os.environ['R2_KEY'],
            'expected':{
              'file_sha256':os.environ['EXPECT_FILE_SHA'],
              'semantic_sha256':os.environ['EXPECT_SEMANTIC_SHA'],
              'chapter_count':int(os.environ['EXPECT_CHAPTERS']),
              'normalized_chars':int(os.environ['EXPECT_CHARS']),
            },
            'build_outcome':'${{ steps.build.outcome }}',
            'semantic_outcome':'${{ steps.semantic.outcome }}',
          }
          epub=Path('/tmp/vbth-reconstruct/Vuong_Bai_Tien_Hoa_MeTruyen_BienTap.epub')
          sem_path=Path('/tmp/vbth-semantic.json')
          if epub.exists():
            out['candidate_file_sha256']=hashlib.sha256(epub.read_bytes()).hexdigest()
            out['candidate_bytes']=epub.stat().st_size
          if sem_path.exists():
            try: out['candidate_semantic']=json.loads(sem_path.read_text())
            except Exception as e: out['semantic_parse_error']=str(e)
          sem=out.get('candidate_semantic') or {}
          semantic_match=(
            sem.get('semantic_sha256')==out['expected']['semantic_sha256'] and
            sem.get('chapter_count')==out['expected']['chapter_count'] and
            sem.get('normalized_chars')==out['expected']['normalized_chars']
          )
          exact_bytes=out.get('candidate_file_sha256')==out['expected']['file_sha256']
          out['exact_bytes']=exact_bytes
          out['semantic_match']=semantic_match
          out['promote']=bool(semantic_match)
          out['equivalence']='exact-bytes' if exact_bytes else ('semantic-equivalent' if semantic_match else 'mismatch')
          Path('/tmp/vbth-master-gate.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('promote='+('true' if out['promote'] else 'false')+'\n')
            f.write('equivalence='+out['equivalence']+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Promote semantic-canonical candidate to R2 and verify readback
        id: promote
        if: steps.gate.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EPUB=/tmp/vbth-reconstruct/Vuong_Bai_Tien_Hoa_MeTruyen_BienTap.epub
          READBACK=/tmp/vbth-master-readback.epub
          npx --yes wrangler@4 r2 object put "${R2_BUCKET}/${R2_KEY}" --file="$EPUB" --remote --config=cloudflare/runner3-core/wrangler.jsonc
          npx --yes wrangler@4 r2 object get "${R2_BUCKET}/${R2_KEY}" --file="$READBACK" --remote --config=cloudflare/runner3-core/wrangler.jsonc
          python story_pipeline/epub_semantic.py "$READBACK" \
            --expect-sha256 "$EXPECT_SEMANTIC_SHA" \
            --expect-chapters "$EXPECT_CHAPTERS" \
            --expect-chars "$EXPECT_CHARS" \
            --summary-only > /tmp/vbth-r2-readback-semantic.json
          cat /tmp/vbth-r2-readback-semantic.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          gate=json.loads(Path('/tmp/vbth-master-gate.json').read_text())
          rb=Path('/tmp/vbth-master-readback.epub')
          proof=json.loads(Path('/tmp/vbth-r2-readback-semantic.json').read_text())
          gate['r2_readback']={
            'verified':proof.get('ok') is True,
            'file_sha256':hashlib.sha256(rb.read_bytes()).hexdigest(),
            'bytes':rb.stat().st_size,
            'semantic':proof,
          }
          if not gate['r2_readback']['verified']:
            raise SystemExit('R2 semantic readback verification failed')
          Path('/tmp/vbth-master-gate.json').write_text(json.dumps(gate,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Merge durable D1 seed checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('.github/scripts').resolve()))
          from runner3_core import get_checkpoint,save_checkpoint,report_status
          gate=json.loads(Path('/tmp/vbth-master-gate.json').read_text())
          current=get_checkpoint('ebook-editorial','book:vbth:seed') or {}
          pos=current.get('position') if isinstance(current.get('position'),dict) else {}
          verified=dict(pos.get('verified') or {})
          promoted=(gate.get('r2_readback') or {}).get('verified') is True
          if promoted:
            verified['master']={
              'logical':'master',
              'r2_key':gate['r2_key'],
              'sha256':gate['r2_readback']['file_sha256'],
              'semantic_sha256':gate['expected']['semantic_sha256'],
              'equivalence':gate['equivalence'],
              'verified':True,
            }
          required={'master','gold','source_index','editorial_sample'}
          missing=sorted(required-set(verified))
          status='success' if not missing else 'running'
          nextpos={
            **pos,
            'schema_version':2,
            'phase':'seed-complete' if status=='success' else 'seed-partial',
            'book_id':'vbth',
            'artifact_store':'r2',
            'artifact_bucket':os.environ['R2_BUCKET'],
            'verified':verified,
            'required_missing':missing,
            'master_gate':{
              'source':gate.get('source'),
              'exact_bytes':gate.get('exact_bytes'),
              'semantic_match':gate.get('semantic_match'),
              'equivalence':gate.get('equivalence'),
              'run_id':gate.get('run_id'),
            },
            'run_id':os.environ['GITHUB_RUN_ID'],
          }
          error=None if status=='success' else ('master reconstruction semantic mismatch' if not promoted else 'required seed asset missing')
          save_checkpoint('ebook-editorial','ebook-editorial/vbth',scope='book:vbth:seed',status=status,position=nextpos,dropbox_path=None,last_error=error)
          durable=get_checkpoint('ebook-editorial','book:vbth:seed')
          if (durable or {}).get('status')!=status:
            raise SystemExit(f'D1 verify failed: {durable!r}')
          report_status('ebook-editorial/vbth',status,run_id=os.environ['GITHUB_RUN_ID'],detail={'scope':'book:vbth:seed','position':nextpos})
          gate['d1_checkpoint']=durable
          Path('/tmp/vbth-master-gate.json').write_text(json.dumps(gate,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Persist reconstruction proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/ebook
          cp /tmp/vbth-master-gate.json ops/ebook/vbth-master-reconstruct-proof.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/ebook/vbth-master-reconstruct-proof.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist VBTH master reconstruction proof: ${GITHUB_RUN_ID} [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 3

      - name: Fail when candidate is not canonical
        if: steps.gate.outputs.promote != 'true'
        run: exit 2
