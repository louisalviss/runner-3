name: X Thread Trace 2089549329044533757
on:
  push:
    branches: [main]
    paths: ['.github/workflows/x-thread-trace-2089549329044533757.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch parent conversation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p x-trace
          python3 - <<'PY'
          import json,urllib.request,pathlib
          ID='2089549329044533757'; HANDLE='mtrainier2020'; UA='runner-3-x-trace/1.0'
          def get(u):
            try:
              r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'application/json,*/*'}),timeout=30)
              return {'ok':True,'status':r.status,'url':r.geturl(),'body':r.read().decode('utf-8','replace')}
            except Exception as e:return {'ok':False,'url':u,'error':f'{type(e).__name__}: {e}'}
          urls={'conversation':f'https://api.fxtwitter.com/2/conversation/{ID}','legacy':f'https://api.fxtwitter.com/{HANDLE}/status/{ID}','vx':f'https://api.vxtwitter.com/{HANDLE}/status/{ID}'}
          raw={k:get(v) for k,v in urls.items()}
          out={'target_id':ID,'sources':{k:{z:v.get(z) for z in ('ok','status','url','error')} for k,v in raw.items()}}
          for k,v in raw.items():
            try: out[k]=json.loads(v.get('body') or '')
            except: out[k+'_prefix']=(v.get('body') or '')[:5000]
          pathlib.Path(f'x-trace/{ID}.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Publish result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add x-trace/2089549329044533757.json
          git diff --cached --quiet || (git commit -m 'store X parent trace 2089549329044533757' && git push)
