name: VPN Gate Public Sites Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vpngate-public-sites-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install 'playwright>=1.46,<2'
          google-chrome --version

      - name: Define target matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > /tmp/targets.tsv <<'EOF'
          reddit	https://www.reddit.com/
          reddit_old	https://old.reddit.com/
          x	https://x.com/
          facebook	https://www.facebook.com/
          threads	https://www.threads.net/
          instagram	https://www.instagram.com/
          tiktok	https://www.tiktok.com/
          weibo	https://weibo.com/
          weibo_mobile	https://m.weibo.cn/
          zhihu	https://www.zhihu.com/
          tophub	https://tophub.today/
          voz	https://voz.vn/
          youtube	https://www.youtube.com/
          youtu_be	https://youtu.be/dQw4w9WgXcQ
          youshu	https://www.youshu.me/
          youshu_mobile	https://m.youshu.me/
          xiaoshuo	https://xiaoshuo.me/
          github	https://github.com/
          wikipedia	https://en.wikipedia.org/
          medium	https://medium.com/
          quora	https://www.quora.com/
          bilibili	https://www.bilibili.com/
          douyin	https://www.douyin.com/
          EOF
          cp /tmp/targets.tsv evidence/targets.tsv
          echo "TARGET_COUNT=$(wc -l < /tmp/targets.tsv)"

      - name: Baseline US runner probe
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 'https://www.cloudflare.com/cdn-cgi/trace' | grep -E '^(ip|loc|warp)=' | tee evidence/baseline_egress.txt || true
          python3 - <<'PY'
          import concurrent.futures, subprocess, pathlib, json
          targets=[]
          for line in pathlib.Path('/tmp/targets.tsv').read_text().splitlines():
              name,url=line.split('\t',1); targets.append((name,url))
          def probe(t):
              name,url=t
              body=f'/tmp/base-{name}.body'
              p=subprocess.run(['curl','-L','-sS','--compressed','--max-time','15','-A','Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1','-o',body,'-w','%{http_code}\t%{url_effective}\t%{size_download}',url],capture_output=True,text=True)
              parts=(p.stdout.strip().split('\t')+['','',''])[:3]
              try:
                  prefix=pathlib.Path(body).read_text(errors='replace')[:180].replace('\n',' ').replace('\r',' ')
              except Exception: prefix=''
              return {'name':name,'url':url,'code':parts[0] or '000','final_url':parts[1],'bytes':parts[2] or '0','curl_rc':p.returncode,'prefix':prefix}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex: out=list(ex.map(probe,targets))
          pathlib.Path('evidence/baseline.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          for r in out: print(f"BASE {r['name']} code={r['code']} bytes={r['bytes']} final={r['final_url']}")
          PY

      - name: Select VPN Gate relay
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,json,pathlib
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          chosen=None
          for cc in ['VN','TH','SG','MY','ID','PH','JP','KR','TW']:
              c=[r for r in rows if (r.get('CountryShort') or '').upper()==cc and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
              if c:
                  c.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
                  chosen=c[0]; break
          if not chosen: raise SystemExit('No prioritized relay available')
          cfg=base64.b64decode(chosen['OpenVPN_ConfigData_Base64']).decode('utf-8',errors='replace')
          pathlib.Path('/tmp/vpngate.auth').write_text('vpn\nvpn\n')
          out=[]
          for ln in cfg.splitlines():
              out.append('auth-user-pass /tmp/vpngate.auth' if ln.strip().startswith('auth-user-pass') else ln)
          pathlib.Path('/tmp/vpngate.ovpn').write_text('\n'.join(out)+'\n')
          info={k:chosen.get(k) for k in ['CountryShort','CountryLong','IP','Ping','Speed','NumVpnSessions']}
          pathlib.Path('evidence/relay.json').write_text(json.dumps(info,indent=2,ensure_ascii=False))
          print(json.dumps(info,ensure_ascii=False))
          PY

      - name: Build isolated namespace and connect VPN
        shell: bash
        run: |
          set -euo pipefail
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add veth-host type veth peer name veth-ns
          sudo ip link set veth-ns netns vpnns
          sudo ip addr add 10.234.0.1/24 dev veth-host
          sudo ip link set veth-host up
          sudo ip netns exec vpnns ip addr add 10.234.0.2/24 dev veth-ns
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set veth-ns up
          sudo ip netns exec vpnns ip route add default via 10.234.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.234.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i veth-host -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o veth-host -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
          sudo ip netns exec vpnns openvpn --config /tmp/vpngate.ovpn --daemon --log /tmp/openvpn.log
          ok=0
          for i in {1..40}; do
            sleep 1
            if grep -q 'Initialization Sequence Completed' /tmp/openvpn.log; then ok=1; break; fi
            if grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|Exiting due to fatal error' /tmp/openvpn.log; then break; fi
          done
          test "$ok" = 1
          echo VPN_CONNECT_OK
          sudo ip netns exec vpnns curl -fsS --max-time 15 'https://www.cloudflare.com/cdn-cgi/trace' | grep -E '^(ip|loc|warp)=' | tee evidence/vpn_egress.txt

      - name: HTTP matrix through VPN
        shell: bash
        run: |
          set -euo pipefail
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner python3 - <<'PY'
          import concurrent.futures, subprocess, pathlib, json
          targets=[]
          for line in pathlib.Path('/tmp/targets.tsv').read_text().splitlines():
              name,url=line.split('\t',1); targets.append((name,url))
          def probe(t):
              name,url=t
              body=f'/tmp/vpn-{name}.body'
              p=subprocess.run(['curl','-L','-sS','--compressed','--max-time','18','-A','Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1','-o',body,'-w','%{http_code}\t%{url_effective}\t%{size_download}',url],capture_output=True,text=True)
              parts=(p.stdout.strip().split('\t')+['','',''])[:3]
              try: prefix=pathlib.Path(body).read_text(errors='replace')[:180].replace('\n',' ').replace('\r',' ')
              except Exception: prefix=''
              return {'name':name,'url':url,'code':parts[0] or '000','final_url':parts[1],'bytes':parts[2] or '0','curl_rc':p.returncode,'prefix':prefix}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex: out=list(ex.map(probe,targets))
          pathlib.Path('evidence/vpn.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          for r in out: print(f"VPN {r['name']} code={r['code']} bytes={r['bytes']} final={r['final_url']}")
          PY

      - name: Plain Chrome matrix through VPN
        shell: bash
        run: |
          set -euo pipefail
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner python3 - <<'PY'
          import json,pathlib,re
          from playwright.sync_api import sync_playwright
          wanted={'reddit','reddit_old','x','facebook','threads','instagram','tiktok','weibo','weibo_mobile','zhihu','tophub','voz','youtube','youshu','bilibili','douyin'}
          targets=[]
          for line in pathlib.Path('/tmp/targets.tsv').read_text().splitlines():
              name,url=line.split('\t',1)
              if name in wanted: targets.append((name,url))
          challenge_terms=['prove your humanity','verify you are human','captcha','access denied','blocked by network security','attention required','unusual traffic','security verification','请完成验证','安全验证','访问异常']
          login_terms=['log in','login','sign in','đăng nhập','登录','登入']
          out=[]
          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              context=b.new_context(viewport={'width':1280,'height':720})
              for name,u in targets:
                  page=context.new_page()
                  item={'name':name,'url':u}
                  try:
                      r=page.goto(u,wait_until='domcontentloaded',timeout=18000)
                      page.wait_for_timeout(2500)
                      try: text=page.locator('body').inner_text(timeout=3000)
                      except Exception: text=''
                      low=text.lower()
                      item.update(status=(r.status if r else None),final_url=page.url,title=page.title(),text_prefix=text[:240],html_bytes=len(page.content().encode()),challenge=any(x in low for x in challenge_terms),login_wall=any(x in low for x in login_terms))
                  except Exception as e:
                      item.update(error=f'{type(e).__name__}: {e}',final_url=page.url)
                  out.append(item); page.close()
              context.close(); b.close()
          pathlib.Path('evidence/browser_vpn.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          for r in out: print('BROWSER',json.dumps(r,ensure_ascii=False))
          PY

      - name: Build summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          def load(p):
              try:return {x['name']:x for x in json.loads(pathlib.Path(p).read_text())}
              except:return {}
          a=load('evidence/baseline.json'); v=load('evidence/vpn.json'); b=load('evidence/browser_vpn.json')
          names=list(a) or list(v)
          rows=[]
          for n in names:
              x=a.get(n,{}); y=v.get(n,{}); z=b.get(n,{})
              rows.append({'name':n,'baseline':x.get('code'),'vpn':y.get('code'),'browser':z.get('status'),'challenge':z.get('challenge'),'login_wall':z.get('login_wall'),'browser_title':z.get('title'),'browser_final':z.get('final_url')})
          pathlib.Path('evidence/summary.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          print('=== ACCESS MATRIX ===')
          for r in rows: print(json.dumps(r,ensure_ascii=False))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-public-sites-${{ github.run_id }}
          path: evidence/
          retention-days: 3
