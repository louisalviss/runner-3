name: Runner3 Speed Site3 Functional v1.2.1

on:
  push:
    branches:
      - runner3-speed-site3-realistic-20260821
    paths:
      - 'ops/site-factory/runner3-speed-site3-psi-ui-abc.latest.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  WP_SITE_SLUG: runner3-speed-site3-realistic
  CHROME_PATH: /usr/bin/google-chrome

concurrency:
  group: runner3-speed-site3-functional-v121
  cancel-in-progress: true

jobs:
  functional-v121:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare v1.2.1 functional harness
        run: |
          set -euo pipefail
          python - <<'PY'
          p='scripts/runner3-speed-site3-functional-v8.mjs'
          s=open(p).read()
          s=s.replace("const result={status:'starting',contentExact:false,routesPass:false,queryBypass:false,apiBypass:false,autoPurge:false,purgeProbeRestored:false,finalOff:false,routeChecks:[],purgeProbe:null,gates:null,error:null,checkedAt:null};",
                      "const result={status:'starting',contentExact:false,routesPass:false,safeFrontend:false,queryBypass:false,apiBypass:false,autoPurge:false,purgeProbeRestored:false,finalOff:false,routeChecks:[],purgeProbe:null,gates:null,error:null,checkedAt:null};")
          old="""const dom=await p.evaluate(()=>({title:document.title,h1:(document.querySelector('h1')?.textContent||'').trim(),bodyClass:document.body.className,images:document.images.length,links:document.links.length,elementorMarkers:document.querySelectorAll('[class*=\"elementor-\"],.elementor').length,hasNav:!!document.querySelector('nav,.navbar,.site-navigation,.main-navigation'),hasFooter:!!document.querySelector('footer,#colophon,.site-footer')}));"""
          new="""const dom=await p.evaluate(()=>{const frames=[...document.querySelectorAll('iframe')];return{title:document.title,h1:(document.querySelector('h1')?.textContent||'').trim(),bodyClass:document.body.className,images:document.images.length,links:document.links.length,elementorMarkers:document.querySelectorAll('[class*=\"elementor-\"],.elementor').length,hasNav:!!document.querySelector('nav,.navbar,.site-navigation,.main-navigation'),hasFooter:!!document.querySelector('footer,#colophon,.site-footer'),runnerLcpMarkers:document.querySelectorAll('link[data-runner3-speed=\"lcp\"]').length,iframes:frames.length,iframesLoadingSet:frames.every(x=>x.getAttribute('loading')!==null)};});"""
          if old not in s: raise SystemExit('dom probe target missing')
          s=s.replace(old,new)
          old2="""navPresent:dom.hasNav,footerPresent:dom.hasFooter,noFailedRequests:failed.length===0};"""
          new2="""navPresent:dom.hasNav,footerPresent:dom.hasFooter,noRunnerLcpGuess:dom.runnerLcpMarkers===0,safeIframes:dom.iframesLoadingSet,noFailedRequests:failed.length===0};"""
          if old2 not in s: raise SystemExit('route check target missing')
          s=s.replace(old2,new2)
          s=s.replace("result.routesPass=result.routeChecks.every(x=>x.pass);","result.routesPass=result.routeChecks.every(x=>x.pass);result.safeFrontend=result.routeChecks.every(x=>x.noRunnerLcpGuess&&x.safeIframes);")
          s=s.replace("result.gates={contentExact:result.contentExact,routesPass:result.routesPass,queryBypass:result.queryBypass,apiBypass:result.apiBypass,autoPurge:result.autoPurge,purgeProbeRestored:result.purgeProbeRestored,finalOff:result.finalOff};",
                      "result.gates={contentExact:result.contentExact,routesPass:result.routesPass,safeFrontend:result.safeFrontend,queryBypass:result.queryBypass,apiBypass:result.apiBypass,autoPurge:result.autoPurge,purgeProbeRestored:result.purgeProbeRestored,finalOff:result.finalOff};")
          open(p,'w').write(s)
          PY
          node --check scripts/runner3-speed-site3-functional-v8.mjs
          php -l wordpress/runner3-speed/runner3-speed.php
          php -l wordpress/runner3-speed/dropins/advanced-cache.php
          grep -q 'Version: 1.2.1' wordpress/runner3-speed/runner3-speed.php
          ! grep -q 'data-runner3-speed="lcp"' wordpress/runner3-speed/runner3-speed.php
          npm install --no-save playwright-core@1.58.2
          test -n "${AUTOMATION_KEY:-}"
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json
      - name: Run full functional and Safe Frontend regression
        run: |
          set -euo pipefail
          node scripts/runner3-speed-site3-functional-v8.mjs
          test -s /tmp/runner3-speed-site3-functional-v8.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-site3-functional-v8.json'))
          assert r['status']=='PASS',r
          assert r['safeFrontend'] is True,r
          assert all(r['gates'].values()),r
          print(json.dumps(r,indent=2))
          PY
      - name: Persist
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,datetime
          p='/tmp/runner3-speed-site3-functional-v8.json'
          r=json.load(open(p)) if os.path.exists(p) else {'status':'MISSING'}
          r['pluginVersion']='1.2.1'
          r['recordedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          os.makedirs('/tmp/r3-v121',exist_ok=True)
          json.dump(r,open('/tmp/r3-v121/runner3-speed-site3-functional-v121.latest.json','w'),indent=2)
          PY
          git config user.name 'runner3-speed-site3-functional-v121-bot'
          git config user.email 'runner3-speed-site3-functional-v121-bot@users.noreply.github.com'
          git fetch origin runner3-speed-site3-realistic-20260821
          git reset --hard origin/runner3-speed-site3-realistic-20260821
          mkdir -p ops/site-factory
          cp /tmp/r3-v121/runner3-speed-site3-functional-v121.latest.json ops/site-factory/runner3-speed-site3-functional-v121.latest.json
          git add -- ops/site-factory/runner3-speed-site3-functional-v121.latest.json
          if ! git diff --cached --quiet; then git commit -m 'test: record Runner3 Speed v1.2.1 functional evidence' && git push origin HEAD:runner3-speed-site3-realistic-20260821; fi
      - name: Cleanup
        if: always()
        run: rm -f /tmp/wasmer-account.json
