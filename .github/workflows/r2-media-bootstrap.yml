name: Bootstrap R2 WordPress Media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r2-media-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-r2-media-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: runner3-wp-media
    steps:
      - uses: actions/checkout@v4

      - name: Validate direct R2 permission
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Cloudflare API token unavailable'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Cloudflare Account ID unavailable'; exit 2; }
          echo '::add-mask::'"$CLOUDFLARE_API_TOKEN"
          echo '::add-mask::'"$CLOUDFLARE_ACCOUNT_ID"
          code="$(curl -sS -o /tmp/r2-list.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")"
          test "$code" = 200 || { echo "R2 account permission unavailable HTTP=$code"; exit 2; }

      - name: Ensure R2 bucket through account API
        shell: bash
        run: |
          set -euo pipefail
          if python3 - "$BUCKET" <<'PY'
          import json,sys
          data=json.load(open('/tmp/r2-list.json'))
          names=[b.get('name') for b in ((data.get('result') or {}).get('buckets') or data.get('result') or []) if isinstance(b,dict)]
          raise SystemExit(0 if sys.argv[1] in names else 1)
          PY
          then
            echo "R2_BUCKET_REUSED=$BUCKET"
          else
            code="$(curl -sS -o /tmp/r2-create.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"name\":\"$BUCKET\",\"locationHint\":\"apac\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")"
            test "$code" = 200 || { echo "R2 bucket create failed HTTP=$code"; cat /tmp/r2-create.json; exit 3; }
            echo "R2_BUCKET_CREATED=$BUCKET"
          fi

      - name: Enable managed read-only public URL
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/r2-domain.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/domains/managed")"
          test "$code" = 200 || { echo "R2 managed domain enable failed HTTP=$code"; cat /tmp/r2-domain.json; exit 4; }
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/r2-domain.json'))
          domain=(d.get('result') or {}).get('domain')
          if not domain: raise SystemExit('Managed R2 domain missing')
          open('/tmp/r2-base-url.txt','w').write('https://'+domain.rstrip('/'))
          PY

      - name: Prove remote R2 delivery before WordPress mutation
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner3-r2-ok\n' >/tmp/r2-proof.txt
          key="health/runner3-proof.txt"
          npx -y wrangler@4.123.0 r2 object put "$BUCKET/$key" --file=/tmp/r2-proof.txt --content-type=text/plain --cache-control='public, max-age=60' --remote
          base="$(cat /tmp/r2-base-url.txt)"
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /tmp/proof-body.txt -w '%{http_code}' "$base/$key" || true)"
            if [ "$code" = 200 ] && grep -Fq 'runner3-r2-ok' /tmp/proof-body.txt; then break; fi
            sleep 2
          done
          test "${code:-}" = 200
          grep -Fq 'runner3-r2-ok' /tmp/proof-body.txt
          head_code="$(curl -sS -I -o /dev/null -w '%{http_code}' "$base/$key" || true)"
          test "$head_code" = 200

      - name: Persist safe R2 status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/r2-media
          status=failed
          url=''
          [ -f /tmp/r2-base-url.txt ] && url="$(cat /tmp/r2-base-url.txt)"
          if [ -f /tmp/proof-body.txt ] && grep -Fq 'runner3-r2-ok' /tmp/proof-body.txt; then status=ready; fi
          python3 - "$status" "$url" <<'PY'
          import json,sys,datetime
          status,url=sys.argv[1:3]
          out={
            'status':status,
            'bucket':'runner3-wp-media',
            'deliveryMode':'r2.dev',
            'baseUrl':url,
            'publicWriteDisabled':True,
            'proofKey':'health/runner3-proof.txt',
            'proofVerified':status=='ready',
            'updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('ops/r2-media/status.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/r2-media/status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Persist R2 media bootstrap status'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep 2
          done
          exit 5
