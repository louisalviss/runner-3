name: Bootstrap R2 WordPress Media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r2-media-bootstrap.yml'
      - 'cloudflare/r2-media/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-r2-media-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: runner3-wp-media
      WORKER: runner3-wp-media
    steps:
      - uses: actions/checkout@v4

      - name: Validate account-scoped auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Cloudflare API token unavailable'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Cloudflare Account ID unavailable'; exit 2; }
          echo '::add-mask::'"$CLOUDFLARE_API_TOKEN"
          echo '::add-mask::'"$CLOUDFLARE_ACCOUNT_ID"
          code="$(curl -sS -o /tmp/workers-list.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          test "$code" = 200 || { echo "Account-scoped auth failed HTTP=$code"; exit 2; }

      - name: Ensure R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          if npx -y wrangler@4.57.0 r2 bucket list 2>&1 | grep -Fq "$BUCKET"; then
            echo "R2_BUCKET_REUSED=$BUCKET"
          else
            npx -y wrangler@4.57.0 r2 bucket create "$BUCKET"
            echo "R2_BUCKET_CREATED=$BUCKET"
          fi

      - name: Deploy read-only media Worker
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4.57.0 deploy --config cloudflare/r2-media/wrangler.jsonc 2>&1 | tee /tmp/deploy.txt
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.txt | tail -1 || true)"
          test -n "$url" || { echo 'Unable to resolve workers.dev URL from deploy output'; cat /tmp/deploy.txt; exit 3; }
          printf '%s\n' "$url" >/tmp/worker-url.txt
          echo "R2_WORKER_URL=$url"

      - name: Prove remote R2 delivery before WordPress mutation
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner3-r2-ok\n' >/tmp/r2-proof.txt
          key="health/runner3-proof.txt"
          npx -y wrangler@4.57.0 r2 object put "$BUCKET/$key" --file=/tmp/r2-proof.txt --content-type=text/plain --cache-control='public, max-age=60' --remote
          base="$(cat /tmp/worker-url.txt)"
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /tmp/proof-body.txt -w '%{http_code}' "$base/$key" || true)"
            if [ "$code" = 200 ] && grep -Fq 'runner3-r2-ok' /tmp/proof-body.txt; then break; fi
            sleep 2
          done
          test "${code:-}" = 200
          grep -Fq 'runner3-r2-ok' /tmp/proof-body.txt
          head_code="$(curl -sS -I -o /dev/null -w '%{http_code}' "$base/$key" || true)"
          test "$head_code" = 200
          post_code="$(curl -sS -X POST -o /dev/null -w '%{http_code}' "$base/$key" || true)"
          test "$post_code" = 405

      - name: Persist safe R2 status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/r2-media
          status=failed
          url=''
          if [ -f /tmp/worker-url.txt ]; then url="$(cat /tmp/worker-url.txt)"; fi
          if [ -f /tmp/proof-body.txt ] && grep -Fq 'runner3-r2-ok' /tmp/proof-body.txt; then status=ready; fi
          python3 - "$status" "$url" <<'PY'
          import json,sys,datetime
          status,url=sys.argv[1:3]
          out={
            'status':status,
            'bucket':'runner3-wp-media',
            'worker':'runner3-wp-media',
            'workerUrl':url,
            'publicWriteDisabled':True,
            'proofKey':'health/runner3-proof.txt',
            'proofVerified':status=='ready',
            'updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('ops/r2-media/status.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/r2-media/status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Persist R2 media bootstrap status'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep 2
          done
          exit 5
