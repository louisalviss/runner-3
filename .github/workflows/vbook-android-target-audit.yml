name: VBook Android Target E2E Audit

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated candidate IDs"
        required: true
        default: "26"
      search_queries:
        description: "Optional ||-separated search queries for search-stage probe"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install host dependencies
        run: |
          python -m pip install requests
          npm install --no-save cheerio@1.0.0
          python tools/vbook-audit/download_vbook_apk.py vbook.apk
          sha256sum vbook.apk | tee vbook.apk.sha256
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true
      - name: Run targeted VBook E2E audit
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          target: default
          arch: x86_64
          profile: Nexus 5
          ram-size: 2048M
          heap-size: 384M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: VBOOK_IDS="${{ inputs.ids }}" VBOOK_SEARCH_QUERIES="${{ inputs.search_queries }}" bash tools/vbook-audit/run_benchmark.sh
      - name: Upload target artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vbook-target-e2e-${{ github.run_id }}
          path: |
            out/
            vbook.apk.sha256
          if-no-files-found: error
          retention-days: 3
