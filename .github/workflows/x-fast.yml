name: X Fast Crawl

on:
  push:
    branches: [main]
    paths:
      - 'jobs/x-fast/**/*.json'
      - 'jobs/x-fast/*.json'
  workflow_dispatch:
    inputs:
      job_file:
        description: 'Path to an X Fast job JSON file'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: x-fast-${{ github.sha }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve job file
        id: job
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB_FILE='${{ inputs.job_file }}'
          else
            JOB_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'jobs/x-fast/*.json' 'jobs/x-fast/**/*.json' | tail -n 1 || true)"
          fi
          if [ -z "$JOB_FILE" ] || [ ! -f "$JOB_FILE" ]; then
            echo "No valid X Fast job JSON found: $JOB_FILE" >&2
            exit 2
          fi
          stem="$(basename "$JOB_FILE" .json)"
          echo "job_file=$JOB_FILE" >> "$GITHUB_OUTPUT"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          echo "Using X Fast job: $JOB_FILE"

      - name: Validate X Fast job
        run: python3 x_fast.py '${{ steps.job.outputs.job_file }}' --validate-only

      - name: Crawl X fast
        id: crawl
        shell: bash
        run: |
          set +e
          python3 x_fast.py '${{ steps.job.outputs.job_file }}' --output crawl_output
          crawl_code=$?
          echo "crawl_code=$crawl_code" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('crawl_output/manifest.json')
          if not p.exists():
              raise SystemExit('manifest missing')
          m = json.loads(p.read_text())
          print(f"X Fast usable={m['ok_count']} failed={m['failed_count']} wall={m['wall_seconds']}s")
          if m['ok_count'] < 1:
              raise SystemExit('no usable X pages in batch')
          PY

      - name: Persist readable result
        if: always() && steps.crawl.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          test -f crawl_output/manifest.json || exit 0
          dest="results/x-fast/${{ steps.job.outputs.stem }}"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -R crawl_output/. "$dest/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          git diff --cached --quiet && exit 0
          git commit -m "Store X Fast result: ${{ steps.job.outputs.stem }} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1

      - name: Upload X Fast artifact
        if: always() && steps.crawl.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: x-fast-output-${{ github.run_id }}
          path: crawl_output/
          if-no-files-found: warn
          retention-days: 3

      - name: Cleanup
        if: always()
        run: rm -rf crawl_output
