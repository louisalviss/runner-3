name: M88 Unified AI Database

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-ai-unified-publish.yml'

permissions:
  contents: write

concurrency:
  group: m88-ai-unified-database
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest exact-M88 source datasets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input out
          stamp=$(date +%s)
          curl -LfsS --retry 3 --max-time 30 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/m88-live-data/data.json?v=${stamp}" -o input/match-odds.json
          gh release download m88-outrights-all --repo "$GITHUB_REPOSITORY" --pattern 'M88-outrights-all.json' --dir input --clobber
          mv input/M88-outrights-all.json input/outrights.json
          python3 - <<'PY'
          import json
          for p in ['input/match-odds.json','input/outrights.json']:
              d=json.load(open(p,encoding='utf-8'))
              print(p, type(d).__name__, len(json.dumps(d)))
          PY

      - name: Build AI-first unified database
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from datetime import datetime,timezone,timedelta
          from pathlib import Path

          now=datetime.now(timezone.utc)
          vn=timezone(timedelta(hours=7))
          matches=json.loads(Path('input/match-odds.json').read_text(encoding='utf-8'))
          outs=json.loads(Path('input/outrights.json').read_text(encoding='utf-8'))

          def dt(v):
              if not v:return None
              try:
                  x=datetime.fromisoformat(str(v).replace('Z','+00:00'))
                  if x.tzinfo is None:x=x.replace(tzinfo=timezone.utc)
                  return x.astimezone(timezone.utc)
              except Exception:return None
          def age(v):
              x=dt(v)
              return None if x is None else max(0,int((now-x).total_seconds()))

          match_ts=matches.get('generated_at') or matches.get('live_generated_at')
          out_ts=outs.get('captured_at_utc')
          match_age=age(match_ts); out_age=age(out_ts)
          match_list=matches.get('matches') or []
          out_list=outs.get('markets') or []
          source_text=' '.join(str(matches.get(k,'')) for k in ['source','source_mode'])
          exact_match=('M88' in source_text or 'm88' in source_text.lower()) and len(match_list)>=50
          exact_out=outs.get('exact_operator_odds') is True and len(out_list)>=40
          ratio=float((outs.get('coverage') or {}).get('capture_ratio') or 0)

          scopes={}
          leagues=set()
          selection_count=0
          for m in match_list:
              s=m.get('scope') or 'unknown'; scopes[s]=scopes.get(s,0)+1
              ln=((m.get('league') or {}).get('name') or '').strip()
              if ln:leagues.add(ln)
              for lines in (m.get('markets') or {}).values():
                  for line in lines or []: selection_count += len(line.get('prices') or [])

          outright_index=[]
          competitions={}
          for m in out_list:
              item={k:m.get(k) for k in ['market_id','title','competition_guess','season_guess','market_name_guess']}
              item['selection_count']=len(m.get('selections') or [])
              outright_index.append(item)
              comp=(m.get('competition_guess') or '').strip()
              if comp:competitions[comp]=competitions.get(comp,0)+1

          match_status='fresh' if exact_match and match_age is not None and match_age<=600 else ('stale' if exact_match else 'invalid')
          out_status='fresh' if exact_out and ratio>=0.90 and out_age is not None and out_age<=2700 else ('partial' if exact_out else 'invalid')
          overall='fresh' if match_status=='fresh' and out_status=='fresh' else 'degraded'

          db={
            'schema_version':3,
            'operator':'M88',
            'sport':'soccer',
            'odds_format':'decimal',
            'generated_at_utc':now.isoformat().replace('+00:00','Z'),
            'generated_at_vn':now.astimezone(vn).isoformat(),
            'status':overall,
            'canonical':True,
            'freshness':{
              'match_odds':{'status':match_status,'captured_at':match_ts,'age_seconds':match_age,'target_refresh_seconds':300,'stale_after_seconds':600,'source':'direct M88/MSports guest feed'},
              'outrights':{'status':out_status,'captured_at':out_ts,'age_seconds':out_age,'target_refresh_seconds':900,'stale_after_seconds':2700,'source':'native M88 -> SABA Outright board','capture_ratio':ratio}
            },
            'ai_usage':{
              'primary_instruction':'Use this file as the canonical current M88 odds database. Never substitute another bookmaker for an M88 price.',
              'article_refresh':'For an article, identify the competition/season and requested market. Search outright_index then datasets.outrights.markets. For match odds, search datasets.match_odds.matches by league/home/away/scope.',
              'absence_rule':'Only say an Outright market is not currently listed when freshness.outrights.status is fresh and capture_ratio >= 0.90. Otherwise say the current capture is incomplete/stale.',
              'freshness_rule':'Always inspect freshness before quoting odds. If a relevant dataset is stale, disclose it instead of presenting it as current.',
              'preserve_structure_rule':'When asked to refresh an existing article, keep valid existing structure/content unless the user requests rewriting; replace only outdated facts and odds.',
              'query_examples':['SERIE A 2026/2027 - WINNER','ENGLISH PREMIER LEAGUE 2026/2027 - TOP GOALSCORER','league=English Premier League home=Arsenal scope=today']
            },
            'index':{
              'match_scopes':scopes,
              'match_leagues':sorted(leagues,key=str.casefold),
              'match_count':len(match_list),
              'match_selection_count':selection_count,
              'outright_market_count':len(out_list),
              'outright_competitions':dict(sorted(competitions.items(),key=lambda x:x[0].casefold())),
              'outright_titles':outright_index
            },
            'datasets':{
              'match_odds':matches,
              'outrights':outs
            }
          }
          if not exact_match: raise SystemExit('Direct M88 match feed validation failed')
          if not exact_out: raise SystemExit('M88 Outright validation failed')
          Path('out/ai-odds.json').write_text(json.dumps(db,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          health={k:db[k] for k in ['schema_version','operator','generated_at_utc','generated_at_vn','status','freshness','index']}
          health['index']={k:v for k,v in health['index'].items() if k!='outright_titles' and k!='match_leagues'}
          Path('out/health.json').write_text(json.dumps(health,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(health,ensure_ascii=False,indent=2))
          PY

      - name: Publish stable one-file database branch
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER=$(git config --local --get http.https://github.com/.extraheader || true)
          rm -rf /tmp/m88-ai-pub
          git init -q /tmp/m88-ai-pub
          git -C /tmp/m88-ai-pub config user.name 'github-actions[bot]'
          git -C /tmp/m88-ai-pub config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/m88-ai-pub remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          [ -z "$AUTH_HEADER" ] || git -C /tmp/m88-ai-pub config http.https://github.com/.extraheader "$AUTH_HEADER"
          git -C /tmp/m88-ai-pub checkout --orphan m88-ai-data >/dev/null 2>&1
          cp out/ai-odds.json out/health.json /tmp/m88-ai-pub/
          cat > /tmp/m88-ai-pub/README.md <<'EOF'
          # M88 AI Odds Database
          Auto-generated read-only odds dataset. Match odds use direct M88/MSports guest data; Outrights use native M88/SABA guest-board capture. ai-odds.json is canonical.
          EOF
          git -C /tmp/m88-ai-pub add .
          git -C /tmp/m88-ai-pub commit -q -m "M88 AI database $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git -C /tmp/m88-ai-pub push -q --force origin HEAD:m88-ai-data

      - name: Publish stable release URL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view m88-ai-current --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create m88-ai-current --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'M88 AI Current Database' --notes 'Stable current M88 odds JSON for AI consumption.'
          fi
          gh release upload m88-ai-current --repo "$GITHUB_REPOSITORY" out/ai-odds.json#ai-odds.json out/health.json#health.json --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-ai-unified-${{ github.run_id }}
          path: out/
          retention-days: 2
