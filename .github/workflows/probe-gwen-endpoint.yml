name: Probe Gwen-TTS Endpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-gwen-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENDPOINT: https://louisalviss--runner3-gwen-tts-web.modal.run
    steps:
      - uses: actions/checkout@v6
      - name: Probe health
        shell: bash
        run: |
          set +e
          code=$(curl -sS -L --max-time 300 -o /tmp/health.json -w '%{http_code}' "$ENDPOINT/health")
          rc=$?
          echo "$code" > /tmp/http_code
          echo "$rc" > /tmp/curl_rc
          test -f /tmp/health.json || printf '{}' > /tmp/health.json
          cat /tmp/health.json || true
      - name: Persist result
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          try:
              body=json.loads(Path('/tmp/health.json').read_text())
          except Exception:
              body={'raw':Path('/tmp/health.json').read_text(errors='replace')[:4000]}
          result={
              'checked_at':datetime.now(timezone.utc).isoformat(),
              'endpoint':os.environ['ENDPOINT'],
              'http_code':int(Path('/tmp/http_code').read_text().strip() or 0),
              'curl_rc':int(Path('/tmp/curl_rc').read_text().strip() or 0),
              'health':body,
          }
          result['ok']=result['http_code']==200 and body.get('ok') is True
          Path('gwen-endpoint-probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gwen-endpoint-probe.json
          git diff --cached --quiet || git commit -m 'test: record Gwen-TTS endpoint probe'
          git push
