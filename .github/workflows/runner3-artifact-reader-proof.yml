name: Runner3 Artifact Reader Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-artifact-reader-proof.yml'
      - 'cloudflare/runner3-core/artifact-test-cleanup-entry.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
    steps:
      - name: Prove reader UI, auth, preferences and EPUB delivery
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER3_CORE_TOKEN"
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.parse, urllib.request

          core=os.environ['CORE_URL'].rstrip('/')
          token=os.environ['RUNNER3_CORE_TOKEN'].strip()
          marker=hashlib.sha256(f'runner3-artifact-library-v1:{token}'.encode()).hexdigest()
          cookie=f'r3_artifact_library={marker}'
          key='core/ebook/consider-phlebas/final/Consider-Phlebas-Iain-M-Banks-VI-v2.epub'
          expected_robots='noindex, nofollow, noarchive, nosnippet, noimageindex'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          no_redirect=urllib.request.build_opener(NoRedirect)

          def req(url, *, method='GET', headers=None, data=None, opener=None, timeout=30):
              r=urllib.request.Request(url, method=method, headers=headers or {}, data=data)
              return (opener or urllib.request).open(r, timeout=timeout)

          # Wait for Cloudflare propagation of the deployed reader wrapper.
          last=''
          for _ in range(30):
              try:
                  with req(core+'/artifact-library', headers={'Cookie':cookie}) as r:
                      html=r.read().decode('utf-8','replace')
                      if r.status==200 and 'data-r3-reader-ui="1"' in html and 'r3-read' in html:
                          break
                      last=f'library status={r.status} reader_ui={"r3-read" in html}'
              except Exception as e:
                  last=repr(e)
              time.sleep(2)
          else:
              raise AssertionError('reader UI did not propagate: '+last)

          reader_url=core+'/artifact-library/read?'+urllib.parse.urlencode({'key':key})

          # Reader is private: without session it redirects to Library login.
          try:
              req(reader_url, opener=no_redirect)
              raise AssertionError('unauthenticated reader unexpectedly succeeded')
          except urllib.error.HTTPError as e:
              assert e.code==303, e.code
              assert e.headers.get('Location')=='/artifact-library', e.headers.get('Location')

          # Authenticated reader contains all requested controls + persistence code.
          with req(reader_url, headers={'Cookie':cookie}) as r:
              reader_html=r.read().decode('utf-8','replace')
              assert r.status==200
              assert r.headers.get('X-Robots-Tag')==expected_robots
          required=[
              'id="fontDown"','id="fontUp"','data-theme="light"',
              'data-theme="dark"','data-theme="brown"',
              "r3-reader-font-size","r3-reader-theme","r3-reader-position:",
              "localStorage.setItem(positionKey,cfi)","rendition.prev()","rendition.next()",
              '/artifact-library/vendor/jszip.min.js','/artifact-library/vendor/epub.min.js'
          ]
          missing=[x for x in required if x not in reader_html]
          assert not missing, missing

          # Same-origin reader engines are live.
          for path in ('/artifact-library/vendor/jszip.min.js','/artifact-library/vendor/epub.min.js'):
              with req(core+path) as r:
                  head=r.read(256)
                  assert r.status==200
                  assert 'javascript' in (r.headers.get('Content-Type') or '').lower()
                  assert len(head)>50

          # Signed private EPUB delivery works from reader session; do not print the URL.
          payload=json.dumps({'key':key,'ttl_seconds':3600}).encode()
          with req(core+'/artifact-library/api/delivery', method='POST', headers={
              'Cookie':cookie,
              'Content-Type':'application/json',
              'X-Runner3-Library':'1',
          }, data=payload) as r:
              delivery=json.loads(r.read().decode())
              assert r.status==200
          assert delivery.get('ok') is True
          signed=((delivery.get('delivery') or {}).get('url') or '')
          assert signed.startswith('https://')
          with req(signed, headers={'Range':'bytes=0-7'}) as r:
              magic=r.read(8)
              assert r.status in (200,206)
              assert magic.startswith(b'PK'), magic

          print(json.dumps({
              'ok':True,
              'library_read_button':True,
              'reader_private':True,
              'font_size_controls':True,
              'themes':['light','dark','brown'],
              'position_persistence':'per-book localStorage CFI',
              'swipe_and_prev_next':True,
              'signed_epub_delivery':True,
              'x_robots_tag':expected_robots,
          }, ensure_ascii=False))
          PY
