name: Runner5 Restore PageSpeed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner5-restore-pagespeed.yml'
      - 'ops/pagespeed/runner5-restore.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner5-restore-pagespeed
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PSI_URL: https://runner5-restore-proxy.ducduy2411.workers.dev/
      PSI_UI_OUT: /tmp/runner5-restore-pagespeed.json
      PSI_UI_SCREENSHOT: /tmp/runner5-restore-pagespeed-mobile.png
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install PageSpeed browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.61.0
          npx playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Run Google PageSpeed UI
        id: psi
        continue-on-error: true
        run: node scripts/pagespeed-ui-audit.mjs

      - name: Persist Runner5 PageSpeed result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/runner5-restore-pagespeed.json || printf '{"status":"failed","target":"%s","detail":"missing UI result"}\n' "$PSI_URL" >/tmp/runner5-restore-pagespeed.json
          cp /tmp/runner5-restore-pagespeed.json /tmp/runner5-psi-safe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/pagespeed/runner5-restore-results/runs
            cp /tmp/runner5-psi-safe.json ops/pagespeed/runner5-restore-results/latest.json
            cp /tmp/runner5-psi-safe.json "ops/pagespeed/runner5-restore-results/runs/${GITHUB_RUN_ID}.json"
            git add ops/pagespeed/runner5-restore-results
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Persist Runner5 Restore PageSpeed: ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 2

      - name: Require fresh PageSpeed result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/runner5-restore-pagespeed.json'))
          assert d.get('status') == 'ready', json.dumps(d,indent=2)
          print(json.dumps({
            'target': d.get('target'),
            'checkedAt': d.get('checkedAt'),
            'resultUrl': d.get('resultUrl'),
            'mobile': d.get('mobile',{}).get('scores'),
            'mobileMetrics': d.get('mobile',{}).get('metrics'),
            'desktop': d.get('desktop',{}).get('scores'),
            'desktopMetrics': d.get('desktop',{}).get('metrics'),
          },indent=2))
          PY
