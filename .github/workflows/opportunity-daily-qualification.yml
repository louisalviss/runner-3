name: Opportunity Daily Qualification

on:
  pull_request:
    paths:
      - 'jobs/seotrends/semrush_daily.py'
      - 'jobs/seotrends/test_semrush_auth_circuitbreaker.py'
      - 'jobs/opportunity-daily/build_buy_decision.py'
      - 'jobs/opportunity-daily/test_build_buy_decision.py'
      - 'jobs/opportunity-daily/opportunity_daily.py'
      - 'jobs/opportunity-daily/test_opportunity_daily.py'
      - 'jobs/opportunity-daily/acquisition_backlog.py'
      - 'jobs/opportunity-daily/test_acquisition_backlog.py'
      - 'jobs/opportunity-daily/flippa_deep_daily.py'
      - 'jobs/opportunity-daily/test_flippa_deep_daily.py'
      - 'jobs/opportunity-daily/test_flippa_profile_preflight.py'
      - 'jobs/opportunity-daily/flippa_semrush_bridge.py'
      - 'jobs/opportunity-daily/test_daily_pipeline.py'
      - 'jobs/opportunity-daily/daily_acceptance.py'
      - 'jobs/opportunity-daily/test_daily_acceptance.py'
      - 'jobs/opportunity-daily/flippa_semrush_repair.py'
      - 'jobs/opportunity-daily/test_flippa_semrush_repair.py'
      - 'jobs/opportunity-daily/LOCAL_SEARCH_INTENT.md'
      - '.github/workflows/opportunity-daily-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opportunity-daily-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@v4
      - name: Run fail-closed qualification tests (offline)
        working-directory: jobs/opportunity-daily
        run: python3 -m unittest -v test_build_buy_decision test_opportunity_daily test_flippa_deep_daily test_flippa_profile_preflight test_daily_pipeline test_daily_acceptance test_flippa_semrush_repair test_acquisition_backlog
          python3 ../seotrends/test_semrush_auth_circuitbreaker.py -v
