name: BreakoutOS NQ CCI Reproduction
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'research/breakoutos_nq_repro.py'
      - 'research/breakoutos_nq_tv_repro.py'
      - 'research/download_usatech_h1.js'
      - '.github/workflows/breakoutos-nq-repro.yml'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save dukascopy-node@1.50.0
      - run: pip install requests
      - name: Download public TradingView NQ1 hourly history
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/Wendigooor/nq_analyze/152cfcfebf2340dbe663775ad264b229fdd741b0/tradingview_futures_NQ/CME_MINI_DL_NQ1%21%2C%2060%2C%2030%20apr%202021%20-%2011%20May%202025.csv' \
            -o /tmp/nq_tv.csv
          wc -l /tmp/nq_tv.csv
          head -2 /tmp/nq_tv.csv
      - name: Download long-horizon Nasdaq CFD proxy
        continue-on-error: true
        run: node research/download_usatech_h1.js
      - name: Run Yahoo NQ and optional CFD proxy reproduction
        env:
          DUKA_CSV: /tmp/usatech_h1.csv
          OUT: evidence/breakoutos-nq-repro
        run: python research/breakoutos_nq_repro.py
      - name: Run TradingView NQ1 long-horizon reproduction
        env:
          TV_CSV: /tmp/nq_tv.csv
          OUT: evidence/breakoutos-nq-repro
        run: python research/breakoutos_nq_tv_repro.py
      - name: Print compact results
        if: always()
        run: |
          echo '=== Yahoo / proxy ==='
          cat evidence/breakoutos-nq-repro/compact.json || true
          echo '=== TradingView NQ1 ==='
          cat evidence/breakoutos-nq-repro/tradingview-compact.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breakoutos-nq-repro-${{ github.run_id }}
          path: evidence/breakoutos-nq-repro/
          retention-days: 14
