name: Runner3WP Critical Shell R2 Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3wp-critical-shell-r2-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

# retrigger: 2026-08-20-r2
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runner3wp-v2-critical-shell-r2
          fetch-depth: 0
      - name: Apply R2 patch
        run: |
          set -euo pipefail
          node scripts/apply-runner3wp-critical-shell-r2.mjs
          node --check scripts/build-wordpress-edge-snapshot.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-wordpress-edge-snapshot.mjs
          git commit -m 'test: apply Runner3WP deferred critical shell R2'
          git push origin HEAD:runner3wp-v2-critical-shell-r2
