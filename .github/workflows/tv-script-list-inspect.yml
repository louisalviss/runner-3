name: TV Saved Pine Script Inspect
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify saved WR 2.5.14 source
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/tradingview/session-state.json.aes -out /tmp/tv-state.json
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'); const {chromium}=require('playwright-core');
          const NAME='Wave Rider Strategy v2.5.14 DETERMINISTIC'; const EXPECT='9e12492d23c405cc8200233d9ca3e5969af5a44db175d8505ce9472da9551ad5';
          (async()=>{
            const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
            const browser=await chromium.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({storageState:JSON.parse(fs.readFileSync('/tmp/tv-state.json','utf8')),viewport:{width:1920,height:1080},permissions:['clipboard-read','clipboard-write']});
            const page=await context.newPage(); await page.goto('https://www.tradingview.com/chart/?symbol=BINANCE%3ABNBUSDT.P&interval=5',{waitUntil:'domcontentloaded',timeout:90000}); await page.waitForTimeout(12000);
            const pine=page.locator('[data-name="pine-dialog-button"],button[aria-label="Pine"]'); await pine.first().click({force:true}); await page.waitForTimeout(5000);
            let body=await page.locator('body').innerText().catch(()=> ''); console.log('AUTH='+(!/\bSign in\b/i.test(body)?'PASS':'FAIL'));
            let current=page.getByText(NAME,{exact:true}); let currentVisible=false; for(let i=0;i<await current.count();i++)if(await current.nth(i).isVisible().catch(()=>false)){currentVisible=true;break;}
            if(!currentVisible){
              const untitled=page.getByText('Untitled script',{exact:true}); let title=null; for(let i=0;i<await untitled.count();i++){let e=untitled.nth(i);if(await e.isVisible().catch(()=>false)){title=e;break;}}
              if(!title) throw new Error('Pine title control not found'); await title.click({force:true}); await page.waitForTimeout(1200);
              const open=page.getByText('Open script…',{exact:true}); if(!(await open.count())) throw new Error('Open script menu missing'); await open.last().click({force:true}); await page.waitForTimeout(3500);
              body=await page.locator('body').innerText().catch(()=> ''); console.log('OPEN_DIALOG_HAS_NAME='+(body.includes(NAME)?'YES':'NO'));
              if(!body.includes(NAME)){
                const inputs=page.locator('input'); let search=null;
                for(let i=0;i<await inputs.count();i++){let e=inputs.nth(i);if(!await e.isVisible().catch(()=>false))continue;const meta=((await e.getAttribute('placeholder'))||'')+' '+((await e.getAttribute('aria-label'))||'');if(/search/i.test(meta)){search=e;break;}}
                if(search){await search.fill(NAME);await page.waitForTimeout(2500);body=await page.locator('body').innerText().catch(()=> '');console.log('SEARCH_HAS_NAME='+(body.includes(NAME)?'YES':'NO'));}
              }
              const hits=page.getByText(NAME,{exact:true}); let target=null; for(let i=0;i<await hits.count();i++){let e=hits.nth(i);if(await e.isVisible().catch(()=>false)){target=e;break;}}
              if(!target){console.log('OPEN_HITS='+body.split('\n').filter(x=>/Wave Rider|2\.5\.14|script/i.test(x)).slice(0,120).join(' | '));throw new Error('saved 2.5.14 not found in Open script');}
              await target.click({force:true}); await page.waitForTimeout(5000);
            }
            const ta=page.locator('.monaco-editor textarea').last(); if(!(await ta.count())) throw new Error('Monaco editor missing'); await ta.click({force:true}); await page.keyboard.press('Control+A'); await page.keyboard.press('Control+C'); await page.waitForTimeout(500);
            const code=await page.evaluate(()=>navigator.clipboard.readText()).catch(()=> ''); console.log('CODE_LEN='+code.length); if(!code) throw new Error('clipboard source empty');
            const raw=crypto.createHash('sha256').update(code).digest('hex'); const lf=crypto.createHash('sha256').update(code.replace(/\r\n/g,'\n')).digest('hex'); const trim=crypto.createHash('sha256').update(code.replace(/\r\n/g,'\n').replace(/\n$/,'')).digest('hex');
            console.log('SAVED_SHA256_RAW='+raw); console.log('SAVED_SHA256_LF='+lf); console.log('SAVED_SHA256_TRIM='+trim); console.log('EXPECTED_SHA256='+EXPECT);
            const ok=[raw,lf,trim].includes(EXPECT); console.log('SAVED_SOURCE_HASH='+(ok?'PASS':'FAIL')); console.log('TITLE_PRESENT='+((await page.locator('body').innerText()).includes(NAME)?'PASS':'CHECK'));
            await page.screenshot({path:'/tmp/wr2514-hash-verify.png',fullPage:false}); await browser.close(); if(!ok) process.exit(9);
          })().catch(e=>{console.error('VERIFY2514_ERROR='+e.stack);process.exit(7)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-wr-2514-hash-verify
          path: /tmp/wr2514-hash-verify.png
          retention-days: 1
      - if: always()
        run: rm -f /tmp/tv-state.json
