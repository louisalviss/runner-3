name: Cloudflare TARGET D1 + Workers Read-only Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-target-metadata-inventory
  cancel-in-progress: false

jobs:
  target-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_TARGET_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify audited script offline without credentials
        run: |
          python3 -m py_compile scripts/cloudflare_target_readonly_inventory.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_target_readonly_inventory.py
      - name: Target D1 and Worker metadata inventory (no R2)
        run: python3 scripts/cloudflare_target_readonly_inventory.py
      - name: Preserve redacted inventory or fail-closed receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-target-d1-workers-metadata-inventory
          path: migration-out/target-d1-workers-inventory.json
          if-no-files-found: warn
          retention-days: 7
