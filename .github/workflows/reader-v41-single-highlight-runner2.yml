name: Reader v41 Minimal Patch Runner

on:
  push:
    paths:
      - 'ops/reader-v41-single-highlight2.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 .github/scripts/reader_v41_patch.py
      - name: Validate
        run: |
          node --check cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          grep -q 'function clearAllAudioHighlights' cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          grep -q "startsWith('r3-audio-')" cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
      - name: Commit and clean helpers
        run: |
          rm -f .github/workflows/reader-v41-single-highlight-owner-patch.yml
          rm -f .github/workflows/reader-v41-single-highlight-runner.yml
          rm -f .github/workflows/reader-v41-single-highlight-runner2.yml
          rm -f .github/scripts/reader_v41_patch.py
          rm -f ops/reader-v41-single-highlight.trigger
          rm -f ops/reader-v41-single-highlight2.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(reader): enforce one active audio highlight across rendition'
          git push origin HEAD:main
