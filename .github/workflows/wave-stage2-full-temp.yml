name: Wave Stage2 Full Temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wave-stage2-full-temp.yml']
permissions:
  contents: write
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install websocket-client==1.8.0
      - name: Reuse validated smoke harness for all 53 symbols
        run: |
          git show 20939d0767153cef6b8af0bc275cc8b64064aaae:jobs/wave_stage2_smoke.py > /tmp/wave_full.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/wave_full.py')
          s=p.read_text()
          pairs=[
          ('NASDAQ','AMAT'),('NASDAQ','AMZN'),('NYSE','ANET'),('NASDAQ','APLD'),('NASDAQ','APP'),('NASDAQ','AVGO'),
          ('NYSE','BABA'),('NASDAQ','BKNG'),('NYSE','BMNR'),('NYSE','C'),('NASDAQ','CME'),('NYSE','COF'),
          ('NASDAQ','CRWD'),('NASDAQ','CSCO'),('NYSE','CVS'),('NYSE','CVX'),('NYSE','DAL'),('NASDAQ','DDOG'),
          ('NYSE','DELL'),('NYSE','DIS'),('NYSE','FCX'),('NYSE','HCA'),('NYSE','HD'),('NYSE','HL'),('NYSE','HPQ'),
          ('NYSE','IONQ'),('NASDAQ','IREN'),('NASDAQ','ISRG'),('NASDAQ','KDP'),('NASDAQ','KLAC'),('NASDAQ','LRCX'),
          ('NYSE','MS'),('NASDAQ','MSFT'),('NASDAQ','MU'),('NASDAQ','NBIS'),('NYSE','NEM'),('NYSE','OKLO'),('NYSE','PM'),
          ('NASDAQ','RKLB'),('NASDAQ','SMCI'),('NASDAQ','SOFI'),('NASDAQ','STX'),('NASDAQ','TSLA'),('NASDAQ','TXN'),
          ('NYSE','UBER'),('NYSE','UNH'),('NYSE','UNP'),('NYSE','UPS'),('NYSE','VRT'),('NASDAQ','WDC'),('NYSE','WMB'),
          ('NASDAQ','WULF'),('NYSE','XOM')]
          old="SYMBOLS=[('NASDAQ','AMAT'),('NASDAQ','AMZN'),('NYSE','ANET'),('NASDAQ','APLD'),('NASDAQ','APP'),('NASDAQ','AVGO')]"
          s=s.replace(old,'SYMBOLS='+repr(pairs))
          s=s.replace("open('data/wave_stage2_smoke.json','w')", "open('data/wave_stage2_full_2026-08-14.json','w')")
          s=s.replace("'schema':'wave-stage2-smoke-0.1'", "'schema':'wave-stage2-full-audit-0.1'")
          p.write_text(s)
          PY
          python /tmp/wave_full.py
      - name: Convert report timestamps to Vietnam time
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          path='data/wave_stage2_full_2026-08-14.json'
          p=json.load(open(path))
          vn=ZoneInfo('Asia/Ho_Chi_Minh')
          for t in p.get('trades',[]):
              for k in ('signal_et','entry_et','exit_et'):
                  if t.get(k):
                      v=datetime.fromisoformat(t[k]).astimezone(vn).isoformat()
                      t[k.replace('_et','_vn')]=v
                      del t[k]
          p['timezone']='Asia/Ho_Chi_Minh'
          p['parity_status']='BATCH_2_AUDIT_UNVERIFIED'
          json.dump(p,open(path,'w'),ensure_ascii=False,indent=2)
          open(path,'a').write('\n')
          print(json.dumps(p['summary'],ensure_ascii=False))
          print('trades',len(p.get('trades',[])))
          PY
      - name: Persist result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add data/wave_stage2_full_2026-08-14.json
          git commit -m 'data: full Wave Stage2 2026-08-14 [skip ci]'
          git push
