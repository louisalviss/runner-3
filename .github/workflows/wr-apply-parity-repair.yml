name: WR Apply Parity Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wr-apply-parity-repair.yml'
      - 'scripts/apply_wr_parity_repair.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wr-parity-repair
          fetch-depth: 0
      - name: Fetch patcher from main
        run: |
          git show origin/main:scripts/apply_wr_parity_repair.py > /tmp/apply_wr_parity_repair.py
      - name: Apply proven parity fixes
        run: |
          python /tmp/apply_wr_parity_repair.py
          python -m py_compile wave-rider-verify/reference_verify.py
          git diff --check
      - name: Commit repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wave-rider-verify/reference_verify.py wave-rider-verify/golden/tradingview_bnb_trx_visible_2026-08-17.json
          git commit -m 'repair Wave Rider TradingView parity semantics'
          git push origin HEAD:wr-parity-repair
