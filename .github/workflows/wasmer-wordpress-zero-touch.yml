name: Wasmer WordPress Zero Touch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasmer-wordpress-zero-touch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wasmer-wordpress-zero-touch
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require durable encryption secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { echo 'Missing existing durable encryption secret'; exit 2; }
          echo '::add-mask::'"$AUTOMATION_KEY"

      - name: Create private Mail.tm inbox
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, secrets, urllib.request
          def req(url, data=None, token=None):
              headers={'Content-Type':'application/json'}
              if token: headers['Authorization']='Bearer '+token
              r=urllib.request.Request(url, data=(json.dumps(data).encode() if data is not None else None), headers=headers, method='POST' if data is not None else 'GET')
              with urllib.request.urlopen(r, timeout=30) as x: return json.loads(x.read().decode())
          d=req('https://api.mail.tm/domains')
          domains=d.get('hydra:member') or d.get('member') or []
          domain=next(x['domain'] for x in domains if x.get('isActive', True))
          address=f"runner3wp{secrets.token_hex(6)}@{domain}"
          password=secrets.token_urlsafe(30)
          req('https://api.mail.tm/accounts', {'address':address,'password':password})
          token=req('https://api.mail.tm/token', {'address':address,'password':password})['token']
          with open('/tmp/mailtm.json','w') as f: json.dump({'address':address,'password':password,'token':token},f)
          print('MAILTM_READY=true')
          PY

      - name: Install browser automation
        run: npm install --no-save playwright-core@1.58.2

      - name: Create Wasmer Hobby account and deploy WordPress
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wasmer-provision.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          import crypto from 'crypto';

          const mail=JSON.parse(fs.readFileSync('/tmp/mailtm.json','utf8'));
          const username='runner3wp'+crypto.randomBytes(5).toString('hex');
          const password=crypto.randomBytes(27).toString('base64url');
          const appName='runner3-wp-'+crypto.randomBytes(4).toString('hex');
          const result={provider:'wasmer',plan:'hobby',username,email:mail.address,password,appName,status:'started',siteUrl:null,detail:null,createdAt:new Date().toISOString()};
          const safe={status:'started',appName,siteUrl:null,detail:null,updatedAt:new Date().toISOString()};

          function save(){
            fs.writeFileSync('/tmp/wasmer-result.json',JSON.stringify(result,null,2));
            safe.status=result.status; safe.siteUrl=result.siteUrl; safe.detail=result.detail; safe.updatedAt=new Date().toISOString();
            fs.writeFileSync('/tmp/wasmer-status.json',JSON.stringify(safe,null,2));
          }
          save();

          async function bodyText(page){ return (await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim(); }
          function blockedReason(text, html=''){
            const s=(text+' '+html).toLowerCase();
            if(/recaptcha|hcaptcha|turnstile|verify you are human|security verification|captcha/.test(s)) return 'captcha';
            if(/credit card|payment method|add card|billing information|card details/.test(s)) return 'payment';
            return null;
          }
          async function pollVerificationLink(){
            const headers={Authorization:'Bearer '+mail.token};
            for(let i=0;i<36;i++){
              await new Promise(r=>setTimeout(r,5000));
              const list=await fetch('https://api.mail.tm/messages',{headers}).then(r=>r.json()).catch(()=>null);
              const msgs=list?.['hydra:member']||list?.member||[];
              for(const m of msgs){
                const msg=await fetch('https://api.mail.tm/messages/'+m.id,{headers}).then(r=>r.json()).catch(()=>null);
                if(!msg) continue;
                const raw=[msg.text||'',...(Array.isArray(msg.html)?msg.html:[msg.html||''])].join('\n').replace(/&amp;/g,'&');
                const urls=[...raw.matchAll(/https?:\/\/[^\s<>"']+/g)].map(x=>x[0].replace(/[).,]+$/,''));
                const hit=urls.find(u=>/wasmer\.io/i.test(u) && /valid|verify|confirm|activate|email/i.test(u));
                if(hit) return hit;
                const any=urls.find(u=>/wasmer\.io/i.test(u));
                if(any) return any;
              }
            }
            return null;
          }
          async function loginIfNeeded(page){
            if(!/login/i.test(page.url())) return;
            const ident=page.locator('input[type=email],input[name*=email i],input[name*=user i],input[type=text]').first();
            const pass=page.locator('input[type=password]').first();
            if(await ident.count()) await ident.fill(mail.address);
            if(await pass.count()) await pass.fill(password);
            const btn=page.getByRole('button',{name:/log in|sign in|continue/i}).first();
            if(await btn.count()) await btn.click();
            await page.waitForTimeout(2500);
          }
          async function chooseDefaults(page){
            const selects=page.locator('select');
            for(let i=0;i<await selects.count();i++){
              const s=selects.nth(i);
              const opts=await s.locator('option').evaluateAll(os=>os.map(o=>({v:o.value,t:o.textContent?.trim()||'',d:o.disabled}))).catch(()=>[]);
              const pick=opts.find(o=>!o.d && o.v && !/select|choose/i.test(o.t));
              if(pick) await s.selectOption(pick.v).catch(()=>{});
            }
            const combos=page.getByRole('combobox');
            for(let i=0;i<Math.min(await combos.count(),5);i++){
              const c=combos.nth(i);
              await c.click().catch(()=>{});
              await page.waitForTimeout(250);
              const opt=page.getByRole('option').filter({visible:true}).first();
              if(await opt.count()) await opt.click().catch(()=>{});
            }
          }

          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const ctx=await browser.newContext();
          const page=await ctx.newPage();
          try{
            await page.goto('https://wasmer.io/signup',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(1800);
            let text=await bodyText(page); let html=(await page.content()).toLowerCase();
            let blocked=blockedReason(text,html);
            if(blocked){ result.status='blocked_'+blocked; result.detail='signup_entry'; save(); return; }

            const personal=page.getByRole('button',{name:/personal/i}).first();
            if(await personal.count()) await personal.click();
            const cont=page.getByRole('button',{name:/continue/i}).first();
            if(await cont.count()) await cont.click();
            await page.waitForTimeout(1200);

            const user=page.locator('input[name=username],input[placeholder*=Username i]').first();
            const email=page.locator('input[type=email],input[name=email]').first();
            const pass=page.locator('input[type=password],input[name=password]').first();
            if(!(await user.count()) || !(await email.count()) || !(await pass.count())){
              result.status='blocked_signup_form'; result.detail='required_fields_missing'; save(); return;
            }
            await user.fill(username); await email.fill(mail.address); await pass.fill(password);
            const checkbox=page.getByRole('checkbox').first();
            if(await checkbox.count()){
              const checked=await checkbox.isChecked().catch(()=>false); if(!checked) await checkbox.click();
            } else {
              const aria=page.locator('[role=checkbox]').first(); if(await aria.count()) await aria.click().catch(()=>{});
            }
            const signup=page.getByRole('button',{name:/sign up/i}).first();
            await signup.click();
            await page.waitForTimeout(3000);

            text=await bodyText(page); html=(await page.content()).toLowerCase(); blocked=blockedReason(text,html);
            if(blocked){ result.status='blocked_'+blocked; result.detail='after_signup_submit'; save(); return; }
            if(/already exists|already taken|invalid email|disposable|not allowed/i.test(text)){
              result.status='blocked_signup_rejected'; result.detail=text.slice(0,300); save(); return;
            }

            result.status='account_submitted'; save();
            if(/validat|verify|confirm.*email|check.*email/i.test(text) || /terms/i.test(page.url())){
              const link=await pollVerificationLink();
              if(!link){ result.status='blocked_email_verification'; result.detail='verification_mail_not_found'; save(); return; }
              await page.goto(link,{waitUntil:'domcontentloaded',timeout:60000}).catch(()=>null);
              await page.waitForTimeout(2500);
            }

            text=await bodyText(page); html=(await page.content()).toLowerCase(); blocked=blockedReason(text,html);
            if(blocked){ result.status='blocked_'+blocked; result.detail='after_email_verification'; save(); return; }

            const agree=page.getByRole('button',{name:/accept|agree/i}).first();
            if(await agree.count()) { await agree.click().catch(()=>{}); await page.waitForTimeout(1800); }
            await loginIfNeeded(page);

            await page.goto('https://wasmer.io/apps/create?template=wordpress-starter',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(2200);
            await loginIfNeeded(page);
            if(/login|signup/.test(page.url())){
              result.status='blocked_login'; result.detail='could_not_authenticate_after_signup'; save(); return;
            }

            text=await bodyText(page); html=(await page.content()).toLowerCase(); blocked=blockedReason(text,html);
            if(blocked){ result.status='blocked_'+blocked; result.detail='wordpress_create_entry'; save(); return; }

            const appInput=page.locator('input').filter({hasNot:page.locator('[type=hidden]')}).filter({hasNot:page.locator('[type=password]')}).first();
            const named=page.locator('input[name*=name i],input[placeholder*=name i]').first();
            if(await named.count()) await named.fill(appName); else if(await appInput.count()) await appInput.fill(appName);
            await chooseDefaults(page);

            const deploy=page.getByRole('button',{name:/deploy now|deploy/i}).first();
            if(!(await deploy.count())){ result.status='blocked_deploy_form'; result.detail='deploy_button_missing'; save(); return; }
            await deploy.click();

            for(let i=0;i<36;i++){
              await page.waitForTimeout(2500);
              text=await bodyText(page); html=(await page.content()).toLowerCase(); blocked=blockedReason(text,html);
              if(blocked){ result.status='blocked_'+blocked; result.detail='after_deploy_submit'; save(); return; }
              const links=await page.locator('a[href*=".wasmer.app"]').evaluateAll(as=>as.map(a=>a.href)).catch(()=>[]);
              if(links.length){ result.siteUrl=links[0]; result.status='deployed'; break; }
              const m=text.match(/https:\/\/[^\s]+\.wasmer\.app\/?/i);
              if(m){ result.siteUrl=m[0]; result.status='deployed'; break; }
              if(/successfully deployed|site.*live|deployment.*complete/i.test(text)) result.status='deployed_pending_url';
            }
            if(!/^deployed/.test(result.status)){
              result.status='deploy_unconfirmed'; result.detail=('url='+page.url()+' '+text.slice(0,260));
            }
            if(result.siteUrl){
              const r=await page.request.get(result.siteUrl,{timeout:30000}).catch(()=>null);
              result.httpStatus=r?.status()||null;
            }
            save();
          } catch(e){
            result.status='automation_error'; result.detail=String(e).slice(0,500); save();
          } finally { await browser.close(); }
          JS
          node /tmp/wasmer-provision.mjs

      - name: Encrypt credentials and persist safe status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/wasmer
          cp /tmp/wasmer-status.json ops/wasmer/status.json

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in /tmp/wasmer-result.json -out ops/wasmer/state.automation.aes

          cat > /tmp/recovery-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAowctxsQUZOcIHabYEUt/
          TNUEP+IXuI4ZDHYvupLpVgzvAXXLw5k1vD+Wp4YlZp3jttxBB1doCw28OJSKcRCT
          +l2j5kF0062jpXZtgepesiSrg/fjSCWCXCgPHa0CnP841uOXNsBlf02nFmchFpNP
          0o6lYz54vA75CsweplL6qhbq/ZbWdt5Utn+kVbSUGhX0KmfqEJArX8luwzNGDqS8
          iOwcAoyPFOlBfdMOY6EhgL74h3env3Cou2Ifuxx5lNzHVss8hQaonLjB5DCKJ9mW
          FNjr6QzUx4yQrtaZ/wqKliUy6tJ9/bnufucC1j6y2bw8XSnRkl8HpLhlS2WefhDI
          QJd+r6KzqvTGLtocylPpSAWqEFjfXoACw3RSBIEsPJLiJWwzO+UzIe4bEdidCzV+
          +mrvuRioDkmsgexBNQ/fa0zpnfloYSM3SOMFi3KKNdB/9D1Lu2H32K3bQOT+KCHC
          BwPXa3AvMoOGvUdhoUALJj9r8pSPEZB2ZkoW4zlXW6fhAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          RECOVERY_PASS="$(openssl rand -hex 32)"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass pass:"$RECOVERY_PASS" \
            -in /tmp/wasmer-result.json -out ops/wasmer/state.recovery.aes
          printf '%s' "$RECOVERY_PASS" | openssl pkeyutl -encrypt -pubin -inkey /tmp/recovery-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -out ops/wasmer/state.recovery.key.rsa
          unset RECOVERY_PASS

          echo 'SAFE_STATUS:'
          cat ops/wasmer/status.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/wasmer/status.json ops/wasmer/state.automation.aes ops/wasmer/state.recovery.aes ops/wasmer/state.recovery.key.rsa
          if ! git diff --cached --quiet; then
            git commit -m 'Persist encrypted Wasmer provisioning state'
            git push
          fi
