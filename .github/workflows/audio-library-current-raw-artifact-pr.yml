name: WR US Stocks 15m30m Base Research

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audio-library-current-raw-artifact-pr.yml'
      - '.github/workflows/wr-stock-15m30m-base.yml'
      - 'research/wr_stock_15m30m_20260824/**'

permissions:
  contents: read

concurrency:
  group: wr-stock-15m30m-base-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  archived_baseline_launcher:
    runs-on: ubuntu-latest
    steps:
      - run: echo '15m/30m baseline frozen at run 32657035483; launcher intentionally disabled while 30m execution validation runs.'
