name: WR 30m Hyperliquid HIP-3 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audio-library-current-raw-artifact-pr.yml'
      - 'research/wr_hyperliquid_30m_20260824/**'

permissions:
  contents: read

concurrency:
  group: wr-hl30-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q pandas requests websocket-client dukascopy-python
      - name: Fetch frozen WR 2.5.13 engine
        run: |
          mkdir -p /tmp/wr-helper
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/3f11639856334ecb1636d26f26ae61e5fa600c9a/wave-rider-verify/wr_dukascopy_expanded_matrix.py' -o /tmp/wr-helper/wr_dukascopy_expanded_matrix.py
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/3f11639856334ecb1636d26f26ae61e5fa600c9a/wave-rider-verify/wr_tv_parity.py' -o /tmp/wr-helper/wr_tv_parity.py
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/8192984ad6a3e5f99b49020c79b5758ef2ac44a7/wave-rider-verify/reference_verify.py' -o /tmp/reference_verify.py
      - name: Run Hyperliquid HIP-3 discovery, 30m replay, fee L2 and funding validation
        env:
          WR_OUT: /tmp/wr-hl30
        run: python research/wr_hyperliquid_30m_20260824/run_validation.py
      - name: Inspect final report
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/wr-hl30/report.json'))
          print(json.dumps({
            'verdict':r['verdict'],
            'overlap':r['live_exact_overlap_selected'],
            'trades':r['trade_rows'],
            'metrics':r['metrics'],
            'breadth':r['symbol_breadth_fee_l2_1k'],
            'l2_coverage':r['l2_trade_coverage_fraction']
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-hyperliquid-30m-validation
          path: /tmp/wr-hl30
          retention-days: 30
          if-no-files-found: error
