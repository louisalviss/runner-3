name: Audio Library Current Raw Artifact PR

on:
  pull_request:
    paths:
      - 'ops/audio-library/triggers/current-raw-pr.txt'
      - '.github/workflows/audio-library-current-raw-artifact-pr.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: python -m pip install -q requests beautifulsoup4 lxml pypdf 'cryptography>=45,<47'
      - name: Extract current public Reddit source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audio-current-raw
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import audio_library_extract_for_chatgpt as a
          req=json.loads(Path('ops/audio-library/reddit-read-request.json').read_text(encoding='utf-8'))
          url=str(req['url'])
          title,text,label,canonical=a.extract_reddit(url)
          out={'inputUrl':url,'title':title,'sourceLabel':label,'canonicalUrl':canonical,'rawText':text}
          Path('/tmp/audio-current-raw/source.json').write_text(json.dumps(out,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({'status':'ready','inputUrl':url,'title':title,'chars':len(text),'canonicalUrl':canonical},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audio-current-raw
          path: /tmp/audio-current-raw/source.json
          retention-days: 1
          if-no-files-found: error
