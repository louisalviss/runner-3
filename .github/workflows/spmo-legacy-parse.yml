name: SPMO Legacy Parse
on:
  push:
    branches: [main]
    paths:
      - 'spmo-legacy/parse_jina.py'
      - '.github/workflows/spmo-legacy-parse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas requests
      - run: python -u spmo-legacy/parse_jina.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spmo-legacy-parse-${{ github.run_id }}
          path: spmo-legacy/output/
          if-no-files-found: error
          retention-days: 7
