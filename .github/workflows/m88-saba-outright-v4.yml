name: M88 SABA Outright V4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/m88-saba-outright-v4.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and VPN
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence /tmp/relays
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n'); meta=[]
          for c in ['TH','SG','MY','PH','ID','JP','KR','TW','VN']:
            rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and r.get('OpenVPN_ConfigData_Base64')]
            rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
            for r in rs[:(10 if c=='TH' else 3)]:
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              p=pathlib.Path(f'/tmp/relays/{len(meta):02d}-{c}.ovpn');p.write_text(cfg);meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/relays.tsv').write_text('\n'.join(meta)+'\n')
          PY
          IFACE=$(ip route show default|awk '{print $5;exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn;sudo ip link set vn netns vpnns
          sudo ip addr add 10.248.0.1/24 dev vh;sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.248.0.2/24 dev vn;sudo ip netns exec vpnns ip link set lo up;sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.248.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.248.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT;sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns;printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          selected=0
          while IFS=$'\t' read -r cfg c relay;do
            echo TRY $c $relay
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null||true;sleep 1
            sudo rm -f /tmp/o.log /tmp/top.json;sudo touch /tmp/o.log;sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log||true
            ok=0;for i in {1..12};do sleep 1;grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null&&{ ok=1;break;};done
            [ "$ok" = 1 ]||continue
            if sudo ip netns exec vpnns curl -fsS --max-time 18 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/top.json;then
              if python3 - <<'PY'
          import json
          try:d=json.load(open('/tmp/top.json'))
          except:raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then echo "$c $relay"|tee evidence/relay.txt;selected=1;break;fi
            fi
          done </tmp/relays.tsv
          test "$selected" = 1
      - name: SABA Outright
        shell: bash
        run: |
          set -euo pipefail
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          O=Path(os.environ['WORKSPACE'])/'evidence'; net=[]; payload=[]; res={'markets':{},'notes':[]}
          pats={
            'winner':[r'ENGLISH PREMIER LEAGUE.*2026.?2027.*WINNER',r'PREMIER LEAGUE.*WINNER'],
            'top4':[r'ENGLISH PREMIER LEAGUE.*2026.?2027.*TOP\s*4',r'PREMIER LEAGUE.*TOP\s*4'],
            'relegation':[r'ENGLISH PREMIER LEAGUE.*2026.?2027.*RELEGAT',r'PREMIER LEAGUE.*RELEGAT'],
            'goalscorer':[r'ENGLISH PREMIER LEAGUE.*2026.?2027.*GOAL.?SCORER',r'PREMIER LEAGUE.*GOAL.?SCORER']}
          def text(f,n=900000):
            try:return f.locator('body').inner_text(timeout=7000)[:n]
            except:return ''
          def provider(page):
            q=[]
            for f in page.frames:
              h=(urlparse(f.url).hostname or '').lower();t=text(f,50000);s=0
              if h.startswith('i1x9gr.'):s+=200
              if 'Saba Soccer' in t:s+=50
              if 'Prediction Market' in t:s+=20
              q.append((s,len(t),f))
            q.sort(key=lambda z:(z[0],z[1]),reverse=True)
            return q[0][2] if q and q[0][0]>=200 else None
          def vis_text(f,rx):
            try:loc=f.get_by_text(re.compile(rx,re.I))
            except:return None
            for i in range(min(loc.count(),200)):
              try:
                if loc.nth(i).is_visible():return loc.nth(i)
              except:pass
            return None
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            c=b.new_context(viewport={'width':390,'height':844},screen={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True,locale='en-US',timezone_id='Asia/Bangkok',user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1')
            page=c.new_page()
            def rq(r):
              if r.resource_type in ('document','xhr','fetch'):net.append({'k':'q','m':r.method,'u':r.url,'p':(r.post_data or '')[:20000]})
            def rp(r):
              if r.request.resource_type not in ('document','xhr','fetch'):return
              net.append({'k':'r','s':r.status,'u':r.url})
              try:
                z=r.text()
                if len(z)<8000000 and re.search(r'outright|premier league|2026.?2027|relegat|goal.?scorer|top.?4',z,re.I):payload.append({'u':r.url,'s':r.status,'b':z[:4000000]})
              except:pass
            page.on('request',rq);page.on('response',rp)
            page.goto('https://www.m88.com/sports/Saba%20Sports?Language=en-US',wait_until='domcontentloaded',timeout=45000);page.wait_for_timeout(18000)
            f=provider(page);res['provider']=f.url if f else None
            if not f:res['notes'].append('provider missing')
            else:
              res['before']=text(f,100000);page.screenshot(path=str(O/'01-before.png'),full_page=False)
              # SABA hamburger center from actual captured mobile board: relative ~ (50,52) inside provider iframe.
              try:f.locator('body').click(position={'x':50,'y':52},timeout=5000);res['hamburger_click']=True
              except Exception as e:res['hamburger_error']=type(e).__name__
              page.wait_for_timeout(2500);res['menu_text']=text(f,250000);page.screenshot(path=str(O/'02-menu.png'),full_page=False)
              e=vis_text(f,r'^\s*Outright\s*$') or vis_text(f,r'\bOutright\b')
              if not e:
                # Log every visible text node in the left 85% viewport; drawer is often div-only.
                try:
                  nodes=f.locator('body *');cand=[]
                  for i in range(min(nodes.count(),2500)):
                    x=nodes.nth(i)
                    try:
                      if not x.is_visible():continue
                      d=x.evaluate("e=>{let r=e.getBoundingClientRect();let t=(e.innerText||'').trim().replace(/\\s+/g,' ');return {tag:e.tagName,t:t.slice(0,250),x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),c:String(e.className||'').slice(0,250)}}")
                      if d['t'] and d['x']<340 and d['y']<844 and d['w']>5 and d['h']>5:cand.append(d)
                    except:pass
                  res['visible_nodes']=cand[:1200]
                except:pass
                e=vis_text(f,r'Outright')
              if e:
                try:res['outright_label']=e.inner_text()[:300];e.click(timeout=7000);res['outright_clicked']=True
                except Exception as ex:res['outright_clicked']=False;res['outright_error']=type(ex).__name__
              else:res['outright_clicked']=False;res['notes'].append('Outright not visible after correct hamburger click')
              if res.get('outright_clicked'):
                page.wait_for_timeout(9000);f=provider(page) or f;page.screenshot(path=str(O/'03-outright.png'),full_page=False)
                corpus=''
                for i in range(60):
                  t=text(f)
                  if t and t not in corpus:corpus+='\n'+t
                  try:f.locator('body').evaluate('(e)=>window.scrollBy(0,600)')
                  except:pass
                  page.wait_for_timeout(250)
                res['outright_text']=corpus[:1800000]
                for k,arr in pats.items():
                  rec={'found':False,'source':None,'window':''}
                  for raw in arr:
                    m=re.search(raw,corpus,re.I|re.S)
                    if m:rec.update(found=True,source='dom',window=corpus[max(0,m.start()-1200):min(len(corpus),m.start()+70000)]);break
                  if not rec['found']:
                    for q in payload:
                      for raw in arr:
                        m=re.search(raw,q['b'],re.I|re.S)
                        if m:rec.update(found=True,source='network',url=q['u'],window=q['b'][max(0,m.start()-2500):min(len(q['b']),m.start()+100000)]);break
                      if rec['found']:break
                  res['markets'][k]=rec
            c.close();b.close()
          (O/'result.json').write_text(json.dumps(res,ensure_ascii=False,indent=2));(O/'network.json').write_text(json.dumps(net,ensure_ascii=False,indent=2));(O/'payload.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2));print(json.dumps(res,ensure_ascii=False,indent=2)[:220000])
          PY
      - name: Verify
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/result.json'));print('PROVIDER',d.get('provider'));print('HAMBURGER',d.get('hamburger_click'));print('OUTRIGHT',d.get('outright_clicked'));print('MENU\n',d.get('menu_text','')[:30000]);print('NOTES',d.get('notes'))
          for k,v in d.get('markets',{}).items():print('\n###',k,v.get('found'),v.get('source'),'\n',v.get('window','')[:20000])
          if not d.get('provider'):raise SystemExit('provider missing')
          if not d.get('outright_clicked'):raise SystemExit('Outright not opened')
          if not any(x.get('found') for x in d.get('markets',{}).values()):raise SystemExit('requested markets missing')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-saba-outright-v4-${{ github.run_id }}
          path: evidence/
          retention-days: 3
