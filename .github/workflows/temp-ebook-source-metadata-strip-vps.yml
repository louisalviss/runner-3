name: Temp Ebook Source Metadata Strip VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-ebook-source-metadata-strip-vps.yml'

jobs:
  patch:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 8
    steps:
      - name: Patch canonical vps-control and live runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "runner-vps1"
          sudo -n bash <<'ROOT'
          set -euo pipefail
          REPO=/home/github-runner/actions-runner/_work/vps-control/vps-control
          git -C "$REPO" fetch origin main
          BASE=$(git -C "$REPO" rev-parse origin/main)
          WT=/opt/codex-staging/ebook-known-source-metadata-strip-20260908
          rm -rf "$WT"
          git -C "$REPO" worktree add --detach "$WT" "$BASE"
          python3 - "$WT/stack/ebook_editorial_runtime.py" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          old='NUMBER_RE = re.compile(r"(?<!\\\\w)[+-]?(?:\\\\d+(?:[.,]\\\\d+)*)%(?!\\\\w)|(?<!\\\\w)[+-]?\\\\d+(?:[.,]\\\\d+)*(?!\\\\w)")\n'
          # The source uses single regex backslashes; use a line-oriented insertion guard instead.
          marker='NUMBER_RE = re.compile('
          lines=s.splitlines(keepends=True)
          idx=next(i for i,x in enumerate(lines) if x.startswith(marker))
          const='KNOWN_TRAILING_SOURCE_METADATA = ("Offline mừng sinh nhật 10 năm Tàng Thư Viện:",)\n'
          assert const not in s
          lines.insert(idx+1,const)
          s=''.join(lines)
          anchor='def deterministic_pair_issues(source: dict[str, str], edited: dict[str, str], glossary: dict[str, str]) -> list[str]:\n'
          func='''def strip_known_source_metadata(tree: ET.ElementTree) -> int:\n    stripped_count = 0\n    for el, attr, original in er.text_slots(tree):\n        text = original.strip()\n        for suffix in KNOWN_TRAILING_SOURCE_METADATA:\n            if text.endswith(suffix):\n                cleaned = text[:-len(suffix)].rstrip()\n                setattr(el, attr, er.preserve_outer_ws(original, cleaned))\n                stripped_count += 1\n                break\n    return stripped_count\n\n\n'''
          assert s.count(anchor)==1
          s=s.replace(anchor,func+anchor,1)
          old_run='        tree = ET.parse(path)\n        source_markup = markup_signature(tree)\n        slots = er.text_slots(tree)\n'
          new_run='        tree = ET.parse(path)\n        source_metadata_stripped = strip_known_source_metadata(tree)\n        source_markup = markup_signature(tree)\n        slots = er.text_slots(tree)\n'
          assert s.count(old_run)==1
          s=s.replace(old_run,new_run,1)
          old_manifest='            "source_slots": len(source_slot_texts),\n            "edited_slots": len(edited_slot_texts),\n'
          new_manifest='            "source_slots": len(source_slot_texts),\n            "source_metadata_stripped": source_metadata_stripped,\n            "edited_slots": len(edited_slot_texts),\n'
          assert s.count(old_manifest)==1
          s=s.replace(old_manifest,new_manifest,1)
          old_return='            "edited_slots": edited_slots,\n            "batches": batch_no,\n'
          new_return='            "edited_slots": edited_slots,\n            "source_metadata_stripped": source_metadata_stripped,\n            "batches": batch_no,\n'
          assert s.count(old_return)==1
          s=s.replace(old_return,new_return,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile "$WT/stack/ebook_editorial_runtime.py"
          PYTHONPATH="$WT/stack" python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import ebook_editorial_runtime as m
          footer=m.KNOWN_TRAILING_SOURCE_METADATA[0]
          root=ET.fromstring(f'<html><body><p>Story. {footer}</p><p>{footer}</p><p>{footer} vẫn là nội dung</p><p>Tàng Thư Viện là tên được nhắc hợp lệ</p></body></html>')
          tree=ET.ElementTree(root); before=m.markup_signature(tree)
          assert m.strip_known_source_metadata(tree)==2
          after=m.markup_signature(tree); assert before==after
          slots=[x[2].strip() for x in m.er.text_slots(tree)]
          assert slots==['Story.',footer+' vẫn là nội dung','Tàng Thư Viện là tên được nhắc hợp lệ'],slots
          print('KNOWN_SOURCE_METADATA_REGRESSION=PASS')
          PY
          git -C "$WT" diff --check
          git -C "$WT" config user.name 'Ebook Runtime Fix'
          git -C "$WT" config user.email 'ebook-runtime-fix@localhost'
          git -C "$WT" add stack/ebook_editorial_runtime.py
          git -C "$WT" commit -m 'Strip known terminal ebook source metadata'
          NEW=$(git -C "$WT" rev-parse HEAD)
          git -C "$REPO" fetch origin main
          NOW=$(git -C "$REPO" rev-parse origin/main)
          test "$NOW" = "$BASE"
          git -C "$WT" push origin HEAD:main
          LIVE=/opt/browser-stack/bin/ebook_editorial_runtime.py
          BACK=/opt/browser-stack/backups/ebook-source-metadata-strip-20260908
          mkdir -p "$BACK"; cp -a "$LIVE" "$BACK/ebook_editorial_runtime.py.pre"
          install -m 0755 "$WT/stack/ebook_editorial_runtime.py" "$LIVE"
          python3 -m py_compile "$LIVE"
          sha256sum "$WT/stack/ebook_editorial_runtime.py" "$LIVE"
          echo "CANONICAL_COMMIT=$NEW"
          echo SOURCE_METADATA_FIX=PASS
          ROOT
