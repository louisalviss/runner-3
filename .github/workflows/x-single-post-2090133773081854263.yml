name: X Single Post Probe 2090133773081854263

on:
  push:
    branches:
      - probe/x-2090133773081854263
    paths:
      - .github/workflows/x-single-post-2090133773081854263.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: probe/x-2090133773081854263

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build one-off crawl job
        run: |
          cat > /tmp/x-post.json <<'JSON'
          {
            "name": "x-single-post-2090133773081854263",
            "source_visibility": "public",
            "artifact_policy": "text",
            "mode": "auto",
            "timeout_seconds": 60,
            "wait_after_load_ms": 8000,
            "urls": [
              "https://x.com/alexmasoncrypto/status/2090133773081854263?s=12"
            ]
          }
          JSON

      - name: Crawl X post
        run: python crawler.py /tmp/x-post.json --output crawl_output

      - name: Persist crawl output on probe branch
        if: always()
        run: |
          rm -rf probe-results/x-2090133773081854263
          mkdir -p probe-results/x-2090133773081854263
          cp -R crawl_output/. probe-results/x-2090133773081854263/ || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probe-results/x-2090133773081854263
          git commit -m "probe result: X post 2090133773081854263" || exit 0
          git push origin HEAD:probe/x-2090133773081854263
