name: WR v2.5.15 PR Sync
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VERIFIER_URL: "https://uc721939f90ac36f304e45600a1f.dl.dropboxusercontent.com/cd/0/get/DGbyD4ssoAJJ1KEWiB9X-gdaYZ23N8fBNY7y71zno_e6EVe4JLvoDZR9H6H68jUHcghYsnvQNY-DUe_hE01F5YRXO92sLDvKlo-JcIzHkN20VJKtzwUGHMEGrDhomeg-bRz-fhD1aLsqZ-EHGuVn3svixe5lj5uyZVk6vhl15krysA/file?c_luid=3c63ed66"
    steps:
      - uses: actions/checkout@v4
      - name: Run v2.5.15 synchronization
        run: bash ops/tradingview/v2515_run.sh
      - name: Package proof
        if: always()
        run: |
          mkdir -p /tmp/pkg
          cp '/tmp/Wave Rider Strategy v2.5.15 DETERMINISTIC.md' /tmp/reference_verify_v2.5.15.py /tmp/build.log /tmp/python-summary.txt /tmp/pyproof/* /tmp/pkg/ 2>/dev/null || true
          sha256sum /tmp/wr2515.pine /tmp/reference_verify_v2.5.15.py >/tmp/pkg/SHA256SUMS.txt 2>/dev/null || true
          echo RUN_ID=${{ github.run_id }} >/tmp/pkg/RUN.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr-v2515-pr-sync
          path: /tmp/pkg
          retention-days: 1
      - if: always()
        run: rm -rf /tmp/wr*.pine /tmp/reference_verify*.py '/tmp/Wave Rider Strategy v2.5.15 DETERMINISTIC.md' /tmp/pkg /tmp/pyproof
