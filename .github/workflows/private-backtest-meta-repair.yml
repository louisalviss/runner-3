name: Private Backtest META Repair

on:
  push:
    branches: [main]
    paths:
      - 'jobs/private-backtest-meta-repair.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-backtest-meta-repair
  cancel-in-progress: false

jobs:
  repair-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frozen backtest runtime
        run: python -m pip install --disable-pip-version-check -q 'dukascopy-python==4.0.1' 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Repair META with Dukascopy FB alias and re-evaluate
        run: python tools/private_backtest_repair.py --request jobs/private-backtest-v3.enc.json --repair jobs/private-backtest-meta-repair.json
