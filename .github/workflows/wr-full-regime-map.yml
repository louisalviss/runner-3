name: WR Full Regime Map
on:
  pull_request:
    branches: [main]
    paths:
      - 'wave-rider-verify/wr_full_regime_map.py'
      - '.github/workflows/wr-full-regime-map.yml'
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wr2515-5m-tv-tick-final
          path: /tmp/base
          github-token: ${{ github.token }}
          repository: louisalviss/runner-3
          run-id: 32158961561
      - name: Run full predeclared regime map
        run: python3 wave-rider-verify/wr_full_regime_map.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr-full-regime-map-final
          path: /tmp/final
          retention-days: 14
