name: Deploy Runner5 Restore Proxy

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/runner5-restore-proxy/worker.js'
      - 'cloudflare/runner5-restore-proxy/wrangler.jsonc'
      - '.github/workflows/deploy-runner5-restore-proxy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner5-restore-proxy-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROXY_URL: https://runner5-restore-proxy.ducduy2411.workers.dev/
      ORIGIN_URL: https://runner5-restore-lab-1.wasmer.app/
    steps:
      - uses: actions/checkout@v4

      - name: Deploy layout-safe Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config cloudflare/runner5-restore-proxy/wrangler.jsonc

      - name: Verify OceanWP proxy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          url=os.environ['PROXY_URL']
          result={
              'status':'FAILED','url':url,'http':None,'oceanwp':False,
              'imageCount':0,'edgeMode':None,'edgeCache':None,
              'firstMs':None,'warmMs':None,'detail':None
          }
          timings=[]; err=None
          for _ in range(12):
              try:
                  t=time.perf_counter()
                  req=urllib.request.Request(url,headers={
                      'User-Agent':'Mozilla/5.0 Runner5OceanWPVerify/1.0',
                      'Cache-Control':'no-cache'
                  })
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read(2500000).decode('utf-8','ignore')
                      timings.append(round((time.perf_counter()-t)*1000,1))
                      result['http']=r.status
                      result['oceanwp']=('/wp-content/themes/oceanwp/' in body or 'oceanwp' in body.lower())
                      result['imageCount']=body.count('<img')
                      result['edgeMode']=r.headers.get('x-edge-mode')
                      result['edgeCache']=r.headers.get('x-edge-cache')
                  if result['http']==200 and result['oceanwp'] and result['imageCount']>=5 and len(timings)>=2:
                      result['status']='READY'; break
              except Exception as e:
                  err=str(e)
              time.sleep(3)
          result['firstMs']=timings[0] if timings else None
          result['warmMs']=timings[-1] if len(timings)>1 else None
          result['detail']=None if result['status']=='READY' else err
          result['updatedAt']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          open('/tmp/runner5-proxy.json','w').write(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          if result['status']!='READY': raise SystemExit(2)
          PY

      - name: Persist proxy status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/runner5-proxy.json || printf '{"status":"FAILED","url":"%s","detail":"missing_status"}\n' "$PROXY_URL" > /tmp/runner5-proxy.json
          cp /tmp/runner5-proxy.json /tmp/runner5-proxy-safe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/wordpress-access
            cp /tmp/runner5-proxy-safe.json ops/wordpress-access/runner5-restore-proxy.json
            git add ops/wordpress-access/runner5-restore-proxy.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Runner5 restore proxy status'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 3
