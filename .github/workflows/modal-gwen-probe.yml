name: Probe Gwen-TTS Modal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modal-gwen-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Probe health
        shell: bash
        run: |
          set +e
          ENDPOINT="https://louisalviss--runner3-gwen-tts-web.modal.run"
          HEALTH_CODE=$(curl -sS --max-time 120 -o /tmp/health.json -w '%{http_code}' "$ENDPOINT/health")
          export HEALTH_CODE ENDPOINT
          python - <<'PY'
          import json, os, datetime, pathlib
          hp=pathlib.Path('/tmp/health.json')
          health_raw=hp.read_text(errors='replace') if hp.exists() else ''
          try:
              health=json.loads(health_raw)
          except Exception:
              health={'raw': health_raw[:4000]}
          result={
              'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'endpoint': os.environ['ENDPOINT'],
              'health_http': int(os.environ.get('HEALTH_CODE') or 0),
              'health': health,
          }
          pathlib.Path('modal-gwen-probe-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Publish probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modal-gwen-probe-result.json
          git diff --cached --quiet || git commit -m 'test: probe Gwen-TTS endpoint health'
          git pull --rebase origin main || true
          git push
