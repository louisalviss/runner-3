name: Runner3 X2089 Final Edit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ops/x2089-final-trigger.txt'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build real beat edit
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl jq
          python -m pip install -q -U yt-dlp
          mkdir -p out

          X='https://x.com/animextwts/status/2089076981358887392'
          yt-dlp --no-playlist --retries 5 --fragment-retries 5 -f 'bv*+ba/b' --merge-output-format mp4 -o 'out/source_dl.%(ext)s' "$X"
          SRC=$(find out -maxdepth 1 -type f -name 'source_dl.*' | head -1)
          ffmpeg -hide_banner -loglevel error -y -i "$SRC" -map 0:v:0 -map 0:a? -c copy out/source.mp4 || ffmpeg -hide_banner -loglevel error -y -i "$SRC" -c:v libx264 -crf 18 -c:a aac out/source.mp4

          curl -L --fail --retry 3 --get 'https://itunes.apple.com/search' \
            --data-urlencode 'term=MONTAGEM XONADA Tiktok version MXZI dj Samir DJ Javi26' \
            --data 'entity=song' --data 'limit=100' --data 'country=US' -o out/itunes.json
          PREVIEW=$(jq -r '[.results[] | select((.trackName//""|ascii_downcase|contains("montagem xonada")) and (.trackName//""|ascii_downcase|contains("tiktok")) and (.artistName//""|ascii_downcase|contains("mxzi"))) | .previewUrl][0] // empty' out/itunes.json)
          TRACK=$(jq -r '[.results[] | select((.trackName//""|ascii_downcase|contains("montagem xonada")) and (.trackName//""|ascii_downcase|contains("tiktok")) and (.artistName//""|ascii_downcase|contains("mxzi"))) | .trackName][0] // empty' out/itunes.json)
          ARTIST=$(jq -r '[.results[] | select((.trackName//""|ascii_downcase|contains("montagem xonada")) and (.trackName//""|ascii_downcase|contains("tiktok")) and (.artistName//""|ascii_downcase|contains("mxzi"))) | .artistName][0] // empty' out/itunes.json)
          test -n "$PREVIEW"
          curl -L --fail --retry 3 "$PREVIEW" -o out/music.m4a

          cat > out/filter.txt <<'EOF'
          [0:v]trim=start=0.00:end=1.10,setpts=(PTS-STARTPTS)*1.181818,crop=226:402:x=198:y=0,scale=1080:1920,setsar=1,fps=30,eq=contrast=1.08:saturation=1.10,unsharp=5:5:0.40:5:5:0[v0];
          [0:v]trim=start=1.10:end=1.55,setpts=(PTS-STARTPTS)*1.444444,crop=226:402:x=214:y=0,scale=1080:1920,setsar=1,fps=30,eq=contrast=1.08:saturation=1.10,unsharp=5:5:0.40:5:5:0[v1];
          [0:v]trim=start=2.00:end=2.53,setpts=(PTS-STARTPTS)*1.226415,crop=226:402:x=242:y=0,scale=1080:1920,setsar=1,fps=30,eq=contrast=1.10:saturation=1.12,unsharp=5:5:0.45:5:5:0[v2];
          [0:v]trim=start=2.85:end=3.65,setpts=(PTS-STARTPTS)*1.218750,crop=226:402:x=246:y=0,scale=1140:2027,crop=1080:1920:x='(iw-ow)/2+5*sin(55*t)':y='(ih-oh)/2+3*cos(47*t)',setsar=1,fps=30,eq=contrast=1.10:saturation=1.12:brightness='if(lt(t,0.06),0.24,0)':eval=frame,unsharp=5:5:0.45:5:5:0[v3];
          [0:v]trim=start=4.85:end=5.50,setpts=(PTS-STARTPTS)*2.000000,crop=226:402:x=244:y=0,scale=1120:1991,crop=1080:1920:x=(iw-ow)/2:y=(ih-oh)/2,setsar=1,fps=30,eq=contrast=1.09:saturation=1.11,unsharp=5:5:0.42:5:5:0[v4];
          [0:v]trim=start=5.85:end=6.55,setpts=(PTS-STARTPTS)*0.928571,crop=226:402:x=246:y=0,scale=1080:1920,setsar=1,fps=30,eq=contrast=1.12:saturation=1.16,unsharp=5:5:0.45:5:5:0[v5];
          [0:v]trim=start=6.55:end=7.20,setpts=(PTS-STARTPTS)*1.000000,crop=226:402:x=246:y=0,scale=1080:1920,setsar=1,fps=30,eq=contrast=1.12:saturation=1.15,unsharp=5:5:0.45:5:5:0[v6];
          [0:v]trim=start=7.20:end=9.35,setpts=(PTS-STARTPTS)*0.755814,crop=226:402:x=246:y=0,scale=1110:1973,crop=1080:1920:x=(iw-ow)/2:y=(ih-oh)/2,setsar=1,fps=30,eq=contrast=1.10:saturation=1.12,unsharp=5:5:0.42:5:5:0[v7];
          [v0][v1][v2][v3][v4][v5][v6][v7]concat=n=8:v=1:a=0[vout];
          [1:a]atrim=start=0:end=7.80,asetpts=PTS-STARTPTS,highpass=f=30,bass=g=3:f=90,loudnorm=I=-8:TP=-1.0:LRA=5,volume=1.08,alimiter=limit=0.95[aout]
          EOF

          ffmpeg -hide_banner -loglevel error -y -i out/source.mp4 -ss 13.04 -i out/music.m4a \
            -filter_complex_script out/filter.txt -map '[vout]' -map '[aout]' -t 7.80 \
            -c:v libx264 -preset medium -crf 17 -profile:v high -pix_fmt yuv420p \
            -c:a aac -b:a 256k -ar 48000 -movflags +faststart out/final.mp4

          cat > out/edit_plan.txt <<EOF
          source=https://x.com/animextwts/status/2089076981358887392
          source_duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/source.mp4)
          track=$TRACK
          artist=$ARTIST
          music_start=13.04
          primary_transient_in_edit=2.60
          timeline_total=7.80
          01 0.00-1.10 -> 1.30 setup
          02 1.10-1.55 -> 0.65 escalation
          03 2.00-2.53 -> 0.65 weapon-impact lead-in
          04 2.85-3.65 -> 0.975 leap/drop impact
          05 4.85-5.50 -> 1.30 overhead burst slow-down
          06 5.85-6.55 -> 0.65 red weapon insert
          07 6.55-7.20 -> 0.65 silhouette/reveal
          08 7.20-9.35 -> 1.625 payoff compressed
          skipped_source_ranges=1.55-2.00,2.53-2.85,3.65-4.85,5.50-5.85,9.35-end
          framing=true_9x16_action_crop_from_720x402
          EOF
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of default=nw=1 out/final.mp4 >> out/edit_plan.txt
          ffmpeg -hide_banner -i out/final.mp4 -vn -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' >> out/edit_plan.txt || true
          ffmpeg -hide_banner -loglevel error -y -i out/final.mp4 -vf "fps=2,scale=270:-2,tile=4x4:padding=4:margin=4" -frames:v 1 out/final_contact_sheet.jpg
          cat out/edit_plan.txt

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner3-x2089-final-v4
          path: |
            out/final.mp4
            out/edit_plan.txt
            out/final_contact_sheet.jpg
          retention-days: 3
