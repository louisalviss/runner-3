name: M88 Language Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m88-language-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence
      - name: VPN TH
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          rs=[r for r in rows if (r.get('CountryShort') or '').upper()=='TH' and r.get('OpenVPN_ConfigData_Base64')]
          rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          for i,r in enumerate(rs[:8]):
            cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
            cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
            pathlib.Path(f'/tmp/vpn{i}.ovpn').write_text(cfg)
          PY
          IFACE=$(ip route show default|awk '{print $5;exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.240.0.1/24 dev vh; sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.240.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.240.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.240.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns; printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          okall=0
          for cfg in /tmp/vpn*.ovpn; do
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true; sleep 1
            sudo rm -f /tmp/ov.log; sudo touch /tmp/ov.log; sudo chmod 644 /tmp/ov.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/ov.log || true
            ok=0; for i in {1..15}; do sleep 1; grep -q 'Initialization Sequence Completed' /tmp/ov.log 2>/dev/null && { ok=1; break; }; done
            if [ "$ok" = 1 ]; then
              t=$(sudo ip netns exec vpnns curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace|grep -E '^(ip|loc)=' || true)
              if echo "$t"|grep -q '^loc=TH$'; then echo "$t"|tee evidence/egress.txt; okall=1; break; fi
            fi
          done
          test "$okall" = 1
      - name: Inspect menu and language nodes
        shell: bash
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path(os.environ['WORKSPACE'])/'evidence'
          data={}
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox'])
            c=b.new_context(viewport={'width':390,'height':844},is_mobile=True,has_touch=True,device_scale_factor=3,user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1',locale='en-US')
            page=c.new_page(); page.goto('https://www.m88.com/sportsbook',wait_until='domcontentloaded',timeout=45000); page.wait_for_timeout(12000)
            # collect clickable elements before
            els=page.locator('a,button,[role=button]')
            before=[]
            for i in range(min(els.count(),250)):
              e=els.nth(i)
              try:
                before.append({'i':i,'text':e.inner_text(timeout=300)[:120],'aria':e.get_attribute('aria-label'),'title':e.get_attribute('title'),'href':e.get_attribute('href'),'class':e.get_attribute('class')})
              except: pass
            data['before_clickables']=before
            # locate likely hamburger/menu elements, otherwise click top-right coordinates
            clicked=False
            for sel in ["button[aria-label*='menu' i]","[class*='hamburger' i]","[class*='menu-icon' i]","button:has(svg)"]:
              try:
                loc=page.locator(sel).first
                if loc.count() and loc.is_visible():
                  data['menu_selector']=sel; data['menu_html']=loc.evaluate('(e)=>e.outerHTML')[:1000]; loc.click(timeout=4000); clicked=True; break
              except: pass
            if not clicked:
              page.mouse.click(375,42); data['menu_selector']='coordinate 375,42'
            page.wait_for_timeout(1500)
            page.screenshot(path=str(out/'menu_open.png'),full_page=False)
            data['menu_text']=page.locator('body').inner_text(timeout=5000)[:8000]
            els=page.locator('a,button,[role=button],li,span,div')
            hits=[]
            for i in range(min(els.count(),1200)):
              e=els.nth(i)
              try:
                txt=' '.join(e.inner_text(timeout=100).split())
                if any(k in txt.lower() for k in ['english','vietnam','tiếng việt','language','ภาษา','bahasa','中文']):
                  hits.append({'i':i,'text':txt[:250],'tag':e.evaluate('(x)=>x.tagName'),'href':e.get_attribute('href'),'class':e.get_attribute('class'),'outer':e.evaluate('(x)=>x.outerHTML')[:1200]})
              except: pass
            data['language_hits']=hits[:100]
            # links whose href looks locale-related
            links=page.locator('a')
            langs=[]
            for i in range(min(links.count(),400)):
              e=links.nth(i)
              try:
                href=e.get_attribute('href') or ''; txt=' '.join(e.inner_text(timeout=100).split())
                if any(k in (href+' '+txt).lower() for k in ['lang','locale','vietnam','vi-vn','/vi','english']):
                  langs.append({'text':txt[:150],'href':href,'outer':e.evaluate('(x)=>x.outerHTML')[:800]})
              except: pass
            data['language_links']=langs[:100]
            c.close(); b.close()
          (out/'inspect.json').write_text(json.dumps(data,indent=2,ensure_ascii=False))
          print(json.dumps({'menu_selector':data.get('menu_selector'),'language_hits':data.get('language_hits'),'language_links':data.get('language_links')},indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-language-inspect-${{ github.run_id }}
          path: evidence/
          retention-days: 3
