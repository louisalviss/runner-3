name: X Source Compare

on:
  push:
    paths:
      - 'x-source-compare-job.json'
      - 'x_source_compare.py'
      - '.github/workflows/x-source-compare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests beautifulsoup4
      - name: Run comparison
        run: python x_source_compare.py x-source-compare-job.json
      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-source-compare-${{ github.run_id }}
          path: x-source-compare-results/
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-source-compare-results
          if ! git diff --cached --quiet; then
            git commit -m "x source compare result $GITHUB_RUN_ID"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
