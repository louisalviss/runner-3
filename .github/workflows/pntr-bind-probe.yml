name: PNTR GitHub Bind Safe Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pntr-bind-probe.yml'
      - 'scripts/pntr-bind-probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore encrypted PNTR guest session
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { echo 'Encryption secret unavailable'; exit 2; }
          echo "::add-mask::$AUTOMATION_KEY"
          test -f ops/pntr/browser-state.aes || { echo 'Encrypted PNTR state missing'; exit 3; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in ops/pntr/browser-state.aes \
            -out /tmp/pntr-browser-state.json
          chmod 600 /tmp/pntr-browser-state.json

      - name: Install browser automation
        run: npm install --no-save playwright-core@1.58.2

      - name: Probe PNTR bind flow without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pntr-bind-probe.mjs
          echo 'SAFE_PNTR_BIND_PROBE:'
          cat /tmp/pntr-bind-probe.json

      - name: Remove decrypted session
        if: always()
        shell: bash
        run: |
          rm -f /tmp/pntr-browser-state.json
