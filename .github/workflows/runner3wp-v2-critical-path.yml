name: Runner3WP V2 Critical Path A-B

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3wp-v2-critical-path.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3wp-v2-critical-path
  cancel-in-progress: true

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: wordpress-edge-proxy-v2
      CF_WORKER_CONFIG: edge/wordpress-edge-proxy/wrangler.v2.jsonc
      CF_EDGE_URL: https://wordpress-edge-proxy-v2.ducduy2411.workers.dev
      CF_EDGE_OUT: /tmp/runner3wp-v2-edge.json
      CF_SNAPSHOT_OUT: /tmp/runner3wp-v2-snapshot.json
      RUNNER3_FCP_V2: '1'
      V1_URL: https://runner3wp.pntr.dev/
      V2_URL: https://wordpress-edge-proxy-v2.ducduy2411.workers.dev/

    steps:
      - uses: actions/checkout@v4
        with:
          ref: runner3wp-v2-fcp-test
          fetch-depth: 0

      - name: Validate V2 source
        run: |
          set -euo pipefail
          node --check scripts/build-wordpress-edge-snapshot.mjs
          node --check scripts/pagespeed-ui-mobile-audit.mjs
          node --check scripts/deploy-wordpress-workers-cache.mjs
          node --check edge/wordpress-edge-proxy/src/index.js
          node --check edge/wordpress-edge-proxy/src/entry.js

      - name: Deploy isolated V2 candidate
        run: node scripts/deploy-wordpress-workers-cache.mjs

      - name: Verify candidate parity and critical-path split
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const ids=['wp-emoji-styles-inline-css','wp-block-library-inline-css','global-styles-inline-css','runner3-critical-css'];
          const normText=s=>s.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
          const title=h=>(h.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]?.replace(/<[^>]+>/g,'').trim()||'';
          const h1=h=>(h.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i)||[])[1]?.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()||'';
          const links=h=>[...h.matchAll(/<a\b[^>]*href=["']([^"']+)["']/gi)].map(m=>m[1].replace(/^https?:\/\/[^/]+/,''));
          const style=(h,id)=>{const esc=id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return (h.match(new RegExp(`<style\\b[^>]*\\bid=["']${esc}["'][^>]*>([\\s\\S]*?)<\\/style>`,'i'))||[])[1]||null};
          async function grab(url){const r=await fetch(url,{headers:{'user-agent':'Runner3WP-V2-Guard/2.0'}});const html=await r.text();const head=(html.match(/<head\b[^>]*>([\s\S]*?)<\/head>/i)||[])[1]||'';return {url,http:r.status,html,head,headers:Object.fromEntries(r.headers.entries())}}
          const [a,b]=await Promise.all([grab(process.env.V1_URL),grab(process.env.V2_URL)]);
          const cssSame=ids.every(id=>style(a.html,id)!==null&&style(a.html,id)===style(b.html,id));
          const originalPositions=ids.map(id=>b.html.indexOf(`id="${id}"`));
          const bodyStart=b.html.search(/<body\b/i), bodyEnd=b.html.lastIndexOf('</body>');
          const orderPreserved=originalPositions.every((p,i)=>p>bodyStart&&(i===0||p>originalPositions[i-1]))&&originalPositions.every(p=>p<bodyEnd);
          const marker=b.html.includes('runner3-v2-original-css-order');
          const criticalHead=/id=["']runner3-v2-critical-css["']/i.test(b.head);
          const noindex=/noindex/i.test(b.headers['x-robots-tag']||'');
          const snapshot=b.headers['x-edge-mode']==='snapshot'&&String(b.headers['x-edge-snapshot']||'').toUpperCase()==='HIT';
          const same={title:title(a.html)===title(b.html),h1:h1(a.html)===h1(b.html),text:normText(a.html)===normText(b.html),images:(a.html.match(/<img\b/gi)||[]).length===(b.html.match(/<img\b/gi)||[]).length,links:links(a.html).slice(0,25).join('|')===links(b.html).slice(0,25).join('|')};
          const headBytesA=Buffer.byteLength(a.head), headBytesB=Buffer.byteLength(b.head);
          const bodyOffsetA=Buffer.byteLength(a.html.slice(0,a.html.search(/<body\b/i))), bodyOffsetB=Buffer.byteLength(b.html.slice(0,b.html.search(/<body\b/i)));
          const pass=a.http===200&&b.http===200&&cssSame&&orderPreserved&&marker&&criticalHead&&noindex&&snapshot&&Object.values(same).every(Boolean)&&headBytesB<headBytesA-8000&&bodyOffsetB<bodyOffsetA-8000;
          const out={status:pass?'ok':'failed',http:{v1:a.http,v2:b.http},noindex,snapshot,cssSame,orderPreserved,marker,criticalHead,same,headBytes:{v1:headBytesA,v2:headBytesB,saved:headBytesA-headBytesB},bodyByteOffset:{v1:bodyOffsetA,v2:bodyOffsetB,saved:bodyOffsetA-bodyOffsetB},checkedAt:new Date().toISOString()};
          fs.writeFileSync('/tmp/runner3wp-v2-parity.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          if(!pass) process.exit(8);
          NODE

      - name: Install PageSpeed browser runtime
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.61.0
          npx --yes playwright@1.61.0 install --with-deps chromium
          echo "CHROME_PATH=$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Run fresh Mobile A-B samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runner3wp-ab-samples
          run_one() {
            label="$1"; url="$2"; out="$3"
            for attempt in 1 2 3; do
              echo "PSI ${label} attempt ${attempt}"
              if PSI_URL="$url" PSI_UI_OUT="$out" node scripts/pagespeed-ui-mobile-audit.mjs; then return 0; fi
              sleep $((attempt * 10))
            done
            return 1
          }
          for i in 1 2 3; do
            run_one "V1-${i}" "$V1_URL" "/tmp/runner3wp-ab-samples/v1-${i}.json"
            run_one "V2-${i}" "$V2_URL" "/tmp/runner3wp-ab-samples/v2-${i}.json"
          done

      - name: Judge fresh A-B medians
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,glob,re,statistics,datetime
          def sec(v):
              if not isinstance(v,str): return None
              m=re.match(r'^([0-9.]+)\s*(ms|s)?$',v.strip())
              if not m:return None
              x=float(m.group(1)); return x/1000 if m.group(2)=='ms' else x
          def collect(label):
              rows=[]
              for p in sorted(glob.glob(f'/tmp/runner3wp-ab-samples/{label}-*.json')):
                  d=json.load(open(p)); rows.append({'file':p,'status':d.get('status'),'performance':d.get('performance'),'fcp':sec(d.get('fcp')),'lcp':sec(d.get('lcp')),'tbt':d.get('tbt'),'cls':d.get('cls'),'resultUrl':d.get('resultUrl')})
              return rows
          v1,v2=collect('v1'),collect('v2')
          parity=json.load(open('/tmp/runner3wp-v2-parity.json'))
          good=lambda r: r['status']=='ready' and r['fcp'] is not None and r['lcp'] is not None
          safety=parity.get('status')=='ok' and len(v1)==3 and len(v2)==3 and all(good(r) for r in v1+v2) and all(r['performance']==100 for r in v2)
          m1=statistics.median([r['fcp'] for r in v1]) if all(good(r) for r in v1) else None
          m2=statistics.median([r['fcp'] for r in v2]) if all(good(r) for r in v2) else None
          l1=statistics.median([r['lcp'] for r in v1]) if all(good(r) for r in v1) else None
          l2=statistics.median([r['lcp'] for r in v2]) if all(good(r) for r in v2) else None
          improvement=(m1-m2) if m1 is not None and m2 is not None else None
          target=bool(safety and m2<=0.5)
          keep=bool(safety and improvement is not None and improvement>=0.099 and l2<=l1+0.2)
          verdict='TARGET_PASS' if target and keep else ('KEEP_IMPROVED' if keep else 'REJECT_ROLLBACK')
          out={'status':'ready','verdict':verdict,'safetyPass':safety,'targetFcpSeconds':0.5,'targetReached':target,'keep':keep,'v1':{'samples':v1,'medianFcpSeconds':m1,'medianLcpSeconds':l1},'v2':{'samples':v2,'medianFcpSeconds':m2,'medianLcpSeconds':l2},'fcpImprovementSeconds':improvement,'parity':parity,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          json.dump(out,open('/tmp/runner3wp-v2-ab.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          PY

      - name: Persist result and rollback rejected candidate
        shell: bash
        run: |
          set -euo pipefail
          verdict=$(python -c "import json;print(json.load(open('/tmp/runner3wp-v2-ab.json'))['verdict'])")
          cp /tmp/runner3wp-v2-ab.json /tmp/runner3wp-v2-ab-safe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin runner3wp-v1-baseline-20260820 runner3wp-v2-fcp-test
          git reset --hard origin/runner3wp-v2-fcp-test
          mkdir -p ops/perf/ab
          cp /tmp/runner3wp-v2-ab-safe.json ops/perf/ab/runner3wp-v2-critical-path.latest.json
          if [ "$verdict" = "REJECT_ROLLBACK" ]; then
            git checkout origin/runner3wp-v1-baseline-20260820 -- scripts/build-wordpress-edge-snapshot.mjs
          fi
          git add ops/perf/ab/runner3wp-v2-critical-path.latest.json scripts/build-wordpress-edge-snapshot.mjs scripts/pagespeed-ui-mobile-audit.mjs
          if ! git diff --cached --quiet; then
            git commit -m "${verdict}: Runner3WP V2 critical-path A-B ${GITHUB_RUN_ID}"
            git push origin HEAD:runner3wp-v2-fcp-test
          fi
          if [ "$verdict" = "REJECT_ROLLBACK" ]; then
            echo 'Redeploying clean V2 baseline after rejection...'
            RUNNER3_FCP_V2=0 node scripts/deploy-wordpress-workers-cache.mjs
            node --input-type=module - <<'NODE'
            const r=await fetch(process.env.V2_URL,{headers:{'user-agent':'Runner3WP-Rollback-Verify/1.0'}}); const h=await r.text();
            const ok=r.status===200&&r.headers.get('x-edge-mode')==='snapshot'&&String(r.headers.get('x-edge-snapshot')||'').toUpperCase()==='HIT'&&/noindex/i.test(r.headers.get('x-robots-tag')||'')&&!h.includes('runner3-v2-original-css-order')&&!h.includes('runner3-v2-critical-css');
            console.log(JSON.stringify({rollbackRuntimePass:ok,http:r.status,edgeMode:r.headers.get('x-edge-mode'),snapshot:r.headers.get('x-edge-snapshot'),noindex:r.headers.get('x-robots-tag')},null,2));
            if(!ok)process.exit(12);
            NODE
          fi

      - name: Final state
        run: |
          cat /tmp/runner3wp-v2-ab-safe.json
