name: Content Intelligence v4 Regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/runner3-core/src/content-feature-enrichment.js'
      - 'cloudflare/runner3-core/src/content-interest-ontology.js'
      - 'cloudflare/runner3-core/src/content-personalization.js'
      - 'cloudflare/runner3-core/src/content-intelligence.js'
      - 'cloudflare/runner3-core/src/rss-reader-learning.js'
      - 'cloudflare/runner3-core/audio-entry.js'
      - 'cloudflare/runner3-core/wrangler.jsonc'
      - 'scripts/content_intelligence_client.py'
      - 'scripts/verify_runner3_d1_quota_guards.mjs'
      - 'scripts/verify_interest_profile_promotion.mjs'
      - 'scripts/verify_interest_ontology.mjs'
      - '.github/workflows/content-intelligence-v2-test.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/runner3-core/src/content-feature-enrichment.js'
      - 'cloudflare/runner3-core/src/content-interest-ontology.js'
      - 'cloudflare/runner3-core/src/content-personalization.js'
      - 'cloudflare/runner3-core/src/content-intelligence.js'
      - 'cloudflare/runner3-core/src/rss-reader-learning.js'
      - 'cloudflare/runner3-core/audio-entry.js'
      - 'cloudflare/runner3-core/wrangler.jsonc'
      - 'scripts/content_intelligence_client.py'
      - 'scripts/verify_runner3_d1_quota_guards.mjs'
      - 'scripts/verify_interest_profile_promotion.mjs'
      - '.github/workflows/content-intelligence-v2-test.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate semantic and ranking contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/runner3-core/src/content-feature-enrichment.js
          node --check cloudflare/runner3-core/src/content-interest-ontology.js
          node --check cloudflare/runner3-core/src/content-personalization.js
          node --check cloudflare/runner3-core/src/content-intelligence.js
          node --check cloudflare/runner3-core/src/rss-reader-learning.js
          python3 -m py_compile scripts/content_intelligence_client.py
          node scripts/verify_runner3_d1_quota_guards.mjs
          node scripts/verify_personal_score_sql_size.mjs
          node scripts/verify_interest_profile_promotion.mjs
          node scripts/verify_interest_ontology.mjs
          node scripts/verify_zero_weight_event_dirty_guard.mjs
          grep -q 'interest_saved' cloudflare/runner3-core/src/content-personalization.js
          grep -q 'follow_up' cloudflare/runner3-core/src/content-personalization.js
          grep -q 'follow_up_count' cloudflare/runner3-core/src/content-personalization.js
          grep -q 'interaction_id_required' cloudflare/runner3-core/src/rss-reader-learning.js
          grep -q 'latest-explicit-wins' cloudflare/runner3-core/src/content-personalization.js
          grep -q 'freshness_bonus' cloudflare/runner3-core/src/content-personalization.js
          grep -q 'novelty_bonus' cloudflare/runner3-core/src/content-personalization.js
          grep -q 'rank_percentile' cloudflare/runner3-core/src/content-personalization.js
          grep -q 'sorted.length-1' cloudflare/runner3-core/src/content-personalization.js
          grep -q 'PERSONAL_SCORE_WRITE_BATCH = 50' cloudflare/runner3-core/src/content-personalization.js
          grep -q 'type_rank' cloudflare/runner3-core/src/content-personalization.js
          grep -q 'canonical-interest-ontology-v7-family-aware' cloudflare/runner3-core/src/content-personalization.js
          grep -q 'PROFILE_RECOMPUTE_CLOCK_KEY' cloudflare/runner3-core/src/content-personalization.js
          grep -q "NOT EXISTS(SELECT 1 FROM content_scores WHERE score_type='personal_relevance' AND model_version=?)" cloudflare/runner3-core/src/content-personalization.js
          ! grep -q "status='dirty' AND updated_at <= datetime('now',?)" cloudflare/runner3-core/src/content-personalization.js
          grep -q 'result\["materialization"\] = materialization' scripts/content_intelligence_client.py
          grep -q 'DEFAULT_PERSONAL_MODEL = "personal-v4"' scripts/content_intelligence_client.py
          grep -q 'materialization_identity_mismatch' cloudflare/runner3-core/src/content-personalization.js
          grep -q "json_extract(reason_json,'$.profile_policy')" cloudflare/runner3-core/src/content-personalization.js
          grep -q "json_extract(reason_json,'$.ontology_version')" cloudflare/runner3-core/src/content-personalization.js
          grep -q 'PERSONAL_MODEL_VERSION_MISMATCH' cloudflare/runner3-core/src/content-intelligence.js
          grep -q '/content-intelligence/interests/save' cloudflare/runner3-core/src/content-intelligence.js
          grep -q '/content-intelligence/recommendations/snapshot' cloudflare/runner3-core/src/content-intelligence.js
          grep -q '/content-intelligence/recommendations/evaluate' cloudflare/runner3-core/src/content-intelligence.js
          grep -q 'NOT EXISTS(SELECT 1 FROM user_content_events WHERE item_id=? AND event_type=? AND render_id=?)' cloudflare/runner3-core/src/content-intelligence.js
          grep -q 'd1_readback:true' cloudflare/runner3-core/src/content-intelligence.js
          grep -q 'event_idempotent' cloudflare/runner3-core/src/content-intelligence.js
          grep -q 'featured_only' cloudflare/runner3-core/src/rss-reader-learning.js
          ! grep -q 'body.lifecycle === "archived".*saved' cloudflare/runner3-core/src/rss-reader-learning.js
          node --input-type=module - <<'NODE'
          import { extractSemanticFeatures, FEATURE_MODEL_VERSION } from './cloudflare/runner3-core/src/content-feature-enrichment.js';
          import { EVENT_WEIGHTS, PERSONAL_MODEL_VERSION, PERSONAL_POLICY_VERSION, PROFILE_RECOMPUTE_CLOCK_KEY, isSupportedContentEvent, eventAffectsProfile } from './cloudflare/runner3-core/src/content-personalization.js';

          const a = extractSemanticFeatures({
            canonical_url: 'https://rasa.com/blog/agent-orchestration-tools',
            source_key: 'rasa', language: 'en',
            title: 'Agent Orchestration Tools for AI Agents',
          });
          const keys = new Set(a.map((x) => `${x.feature_type}:${x.feature_key}`));
          if (FEATURE_MODEL_VERSION !== 'semantic-bridge-v4') throw new Error('feature model marker mismatch');
          if (PERSONAL_MODEL_VERSION !== 'personal-v4') throw new Error('personal model marker mismatch');
          if (PERSONAL_POLICY_VERSION !== 'canonical-interest-ontology-v7-family-aware') throw new Error('personal policy marker mismatch');
          if (PROFILE_RECOMPUTE_CLOCK_KEY !== 'content-intelligence-profile-last-recompute') throw new Error('recompute clock marker mismatch');
          if (!keys.has('topic:ai-agents')) throw new Error('AI-agent topic missing');
          if (!keys.has('concept:agent-orchestration')) throw new Error('agent-orchestration concept missing');
          if (!isSupportedContentEvent('interest_saved') || EVENT_WEIGHTS.interest_saved <= EVENT_WEIGHTS.deep_read) throw new Error('interest_saved priority incorrect');
          if (!isSupportedContentEvent('follow_up') || EVENT_WEIGHTS.follow_up !== 0.5) throw new Error('follow_up weight incorrect');
          if (eventAffectsProfile('shown') || !eventAffectsProfile('selected')) throw new Error('zero-weight event invalidation contract incorrect');
          if (!(EVENT_WEIGHTS.disliked < 0) || Math.abs(EVENT_WEIGHTS.disliked) < EVENT_WEIGHTS.selected) throw new Error('negative preference strength incorrect');

          const b = extractSemanticFeatures({
            canonical_url: 'https://example.vn/a', source_key: 'example', language: 'vi',
            title: 'Cải cách thị trường vốn mà Việt Nam còn thiếu',
          });
          const bkeys = new Set(b.map((x) => `${x.feature_type}:${x.feature_key}`));
          if (!bkeys.has('topic:markets')) throw new Error('Vietnam capital-market topic missing');
          if (!bkeys.has('concept:capital-market-reform')) throw new Error('capital-market reform concept missing');
          console.log('Content Intelligence v3 semantic/ranking regression PASS');
          NODE
          python3 - <<'PY'
          import sqlite3
          db=sqlite3.connect(':memory:')
          db.executescript('''
          CREATE TABLE content_items(item_id TEXT PRIMARY KEY);
          CREATE TABLE user_content_events(
            id INTEGER PRIMARY KEY AUTOINCREMENT, item_id TEXT NOT NULL, render_id TEXT,
            event_type TEXT NOT NULL, assistant_recommended INTEGER, assistant_rank INTEGER,
            explicit_feedback TEXT, context_json TEXT, event_at TEXT DEFAULT CURRENT_TIMESTAMP
          );
          INSERT INTO content_items(item_id) VALUES('x:test:1');
          ''')
          sql='''INSERT INTO user_content_events(item_id,render_id,event_type,assistant_recommended,assistant_rank,explicit_feedback,context_json,event_at)
          SELECT ?,?,?,?,?,?,?,CURRENT_TIMESTAMP
          WHERE EXISTS(SELECT 1 FROM content_items WHERE item_id=?)
            AND (? IS NULL OR NOT EXISTS(SELECT 1 FROM user_content_events WHERE item_id=? AND event_type=? AND render_id=?))'''
          params=('x:test:1','interest-save:auto:x:test:1','interest_saved',0,None,'interest_saved','{}','x:test:1','interest-save:auto:x:test:1','x:test:1','interest_saved','interest-save:auto:x:test:1')
          first=db.execute(sql,params).rowcount
          second=db.execute(sql,params).rowcount
          row=db.execute('SELECT COUNT(*),MAX(id) FROM user_content_events WHERE item_id=? AND event_type=? AND render_id=?',('x:test:1','interest_saved','interest-save:auto:x:test:1')).fetchone()
          assert first==1, first
          assert second==0, second
          assert row[0]==1 and row[1] is not None, row
          ranks=db.execute('WITH x(v) AS (VALUES(1),(2),(3)) SELECT percent_rank() OVER (ORDER BY v) FROM x').fetchall()
          assert ranks == [(0.0,), (0.5,), (1.0,)], ranks
          def effective(base, followups):
              return min(3.5, base + min(1.5, 0.5 * followups)) if base > 0 else 0.0
          assert effective(2.0, 0) == 2.0
          assert effective(2.0, 1) == 2.5
          assert effective(2.0, 3) == 3.5
          assert effective(2.0, 9) == 3.5
          assert effective(3.0, 1) == 3.5
          assert effective(0.0, 3) == 0.0
          print('Content Intelligence v3 idempotency/window/follow-up-depth regression PASS')
          PY
