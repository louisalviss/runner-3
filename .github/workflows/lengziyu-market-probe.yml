name: Lengziyu Market Probe

on:
  push:
    paths:
      - '.github/workflows/lengziyu-market-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Static fetch and asset discovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/assets
          python - <<'PY'
          import json,re,os,urllib.parse,requests
          from bs4 import BeautifulSoup
          base='https://card.lengziyu.cn'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'})
          out={}
          for path in ['/','/market','/ranking','/robots.txt','/sitemap.xml']:
              url=base+path
              try:
                  r=s.get(url,timeout=30,allow_redirects=True)
                  key=path.strip('/').replace('/','_') or 'root'
                  open(f'probe/{key}.html','wb').write(r.content)
                  out[path]={'status':r.status_code,'url':r.url,'content_type':r.headers.get('content-type'),'length':len(r.content),'headers':dict(r.headers)}
                  if 'text/html' in r.headers.get('content-type',''):
                      soup=BeautifulSoup(r.text,'html.parser')
                      for tag,attr in [('script','src'),('link','href')]:
                          for el in soup.find_all(tag):
                              v=el.get(attr)
                              if not v: continue
                              u=urllib.parse.urljoin(r.url,v)
                              if u.startswith(base) and any(x in u for x in ['.js','.css']):
                                  try:
                                      a=s.get(u,timeout=30)
                                      fn=re.sub(r'[^A-Za-z0-9._-]+','_',urllib.parse.urlparse(u).path.strip('/'))[-180:] or 'asset'
                                      open('probe/assets/'+fn,'wb').write(a.content)
                                  except Exception as e: pass
              except Exception as e:
                  out[path]={'error':repr(e)}
          open('probe/static_summary.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Browser network probe
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install playwright-core@latest >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          echo "Chrome: $CHROME"
          cat > probe.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const chrome=process.env.CHROME;
          const browser=await chromium.launch({headless:true, executablePath:chrome, args:['--no-sandbox']});
          const context=await browser.newContext({userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'});
          const page=await context.newPage();
          const rows=[];
          page.on('response', async r=>{
            const u=r.url();
            const ct=(r.headers()['content-type']||'');
            const rec={url:u,status:r.status(),contentType:ct,method:r.request().method(),resourceType:r.request().resourceType()};
            if (/json|javascript|text\//i.test(ct) || /api|card|market|supabase|firebase/i.test(u)) {
              try { const b=await r.body(); if(b.length<5_000_000) rec.body=b.toString('utf8'); } catch{}
            }
            rows.push(rec);
          });
          let result={};
          try {
            const resp=await page.goto('https://card.lengziyu.cn/market',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(5000);
            result={status:resp?.status(),url:page.url(),title:await page.title(),html:await page.content(),text:(await page.locator('body').innerText()).slice(0,500000)};
            const links=await page.locator('a').evaluateAll(as=>as.map(a=>({href:a.href,text:(a.innerText||'').trim()})).filter(x=>x.href));
            result.links=links;
          } catch(e) { result.error=String(e); }
          fs.writeFileSync('/home/runner/work/runner-3/runner-3/probe/browser_page.json',JSON.stringify(result,null,2));
          fs.writeFileSync('/home/runner/work/runner-3/runner-3/probe/network.json',JSON.stringify(rows,null,2));
          await browser.close();
          JS
          CHROME="$CHROME" node probe.mjs

      - name: Extract candidate card slugs and endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json,re,glob,os
          texts=[]
          for f in glob.glob('probe/**/*',recursive=True):
              if os.path.isfile(f):
                  try: texts.append(open(f,encoding='utf-8',errors='ignore').read())
                  except: pass
          t='\n'.join(texts)
          slugs=sorted(set(re.findall(r'/card/([A-Za-z0-9._~-]+)',t)))
          urls=sorted(set(re.findall(r'https?://[^\"\'<>\\s]+',t)))
          endpoints=sorted(set(re.findall(r'(?:(?:https?://[^\"\'<>\\s]+)|(?:/[A-Za-z0-9._~!$&()*+,;=:@%/-]+))(?:api|graphql|supabase|firebase|cards?|market)[A-Za-z0-9._~!$&()*+,;=:@%/?#=-]*',t,re.I)))
          open('probe/card_slugs.txt','w').write('\n'.join(slugs))
          open('probe/discovered_urls.txt','w').write('\n'.join(urls))
          open('probe/endpoints.txt','w').write('\n'.join(endpoints))
          print('slugs',len(slugs),'urls',len(urls),'endpoints',len(endpoints))
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: lengziyu-market-probe
          path: probe/
          retention-days: 3
