name: Lengziyu Market Probe

on:
  pull_request:
    paths:
      - '.probe-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Fetch official Lengziyu catalog API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/lengziyu-current
          python - <<'PY'
          import json, requests, datetime
          url='https://card.lengziyu.cn/api/cards'
          r=requests.get(url, params={'offset':0,'limit':500}, timeout=60, headers={'User-Agent':'Mozilla/5.0'})
          r.raise_for_status()
          data=r.json()
          open('probe/lengziyu-current/cards.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2))
          items=data.get('items',[]) if isinstance(data,dict) else []
          compact=[]
          for x in items:
              if not isinstance(x,dict): continue
              compact.append({k:x.get(k) for k in ['id','name','issuer','category','suffix','meta','sourceUrl','kycDocuments','launchTimestamp','createdAt','catalogKind','productKind']})
          summary={'fetchedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':r.status_code,'count':len(items),'total':data.get('total') if isinstance(data,dict) else None,'items':compact}
          open('probe/lengziyu-current/catalog-summary.json','w',encoding='utf-8').write(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps({'status':r.status_code,'count':len(items),'total':summary['total']},ensure_ascii=False))
          PY

      - name: Publish snapshot to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probe/lengziyu-current
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Lengziyu catalog snapshot'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lengziyu-market-probe
          path: probe/lengziyu-current/
          retention-days: 3
