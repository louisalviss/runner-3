name: Lengziyu Market Probe

on:
  pull_request:
    paths:
      - '.probe-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Fetch official Lengziyu catalog API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/lengziyu-current
          python - <<'PY'
          import json, requests, datetime
          url='https://card.lengziyu.cn/api/cards'
          r=requests.get(url, params={'offset':0,'limit':500}, timeout=60, headers={'User-Agent':'Mozilla/5.0'})
          r.raise_for_status()
          data=r.json()
          open('probe/lengziyu-current/cards.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2))
          items=data.get('items',[]) if isinstance(data,dict) else []
          compact=[]
          for x in items:
              if not isinstance(x,dict): continue
              compact.append({k:x.get(k) for k in ['id','name','issuer','category','suffix','meta','sourceUrl','kycDocuments','launchTimestamp','createdAt','catalogKind','productKind']})
          summary={'fetchedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':r.status_code,'count':len(items),'total':data.get('total') if isinstance(data,dict) else None,'items':compact}
          open('probe/lengziyu-current/catalog-summary.json','w',encoding='utf-8').write(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps({'status':r.status_code,'count':len(items),'total':summary['total']},ensure_ascii=False))
          PY

      - name: Diff against Money Flow service names
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f probe/sheet-service-names.txt ]; then
            echo 'No sheet-service-names.txt; skipping diff'
            exit 0
          fi
          python - <<'PY'
          import json,re,unicodedata,difflib,collections
          p='probe/lengziyu-current/catalog-summary.json'
          data=json.load(open(p,encoding='utf-8'))
          sheet=[x.strip() for x in open('probe/sheet-service-names.txt',encoding='utf-8') if x.strip()]
          generic={'card','cards','visa','mastercard','virtual','prepaid','debit','credit','wallet','pay','the','app'}
          def words(s):
              s=unicodedata.normalize('NFKC',s or '').lower().replace('×',' ').replace('&',' and ')
              return re.findall(r'[a-z0-9]+',s)
          def norm(s): return ' '.join(words(s))
          def core(s):
              w=[x for x in words(s) if x not in generic]
              return ' '.join(w)
          sheet_rows=[{'name':s,'norm':norm(s),'core':core(s)} for s in sheet]
          matched=[]; unmatched=[]
          for item in data['items']:
              n=item.get('name') or ''
              nn,cc=norm(n),core(n)
              best=None
              for sr in sheet_rows:
                  score=difflib.SequenceMatcher(None,cc or nn,sr['core'] or sr['norm']).ratio()
                  reason=None
                  if nn==sr['norm']: reason='exact'
                  elif cc and cc==sr['core']: reason='core-exact'
                  elif cc and sr['core'] and min(len(cc),len(sr['core']))>=4 and (cc in sr['core'] or sr['core'] in cc): reason='core-containment'
                  elif score>=0.88: reason='fuzzy>=0.88'
                  if reason:
                      cand=(score,reason,sr['name'])
                      if best is None or cand[0]>best[0]: best=cand
              row={**item,'normalized':nn,'core':cc}
              if best:
                  row['sheetMatch']=best[2]; row['matchReason']=best[1]; row['matchScore']=round(best[0],3)
                  matched.append(row)
              else:
                  # nearest is diagnostic only, never used as a match
                  near=max(sheet_rows,key=lambda sr:difflib.SequenceMatcher(None,cc or nn,sr['core'] or sr['norm']).ratio())
                  row['nearestSheetName']=near['name']
                  row['nearestScore']=round(difflib.SequenceMatcher(None,cc or nn,near['core'] or near['norm']).ratio(),3)
                  unmatched.append(row)
          byissuer=collections.Counter((x.get('issuer') or '').strip() for x in unmatched)
          report={
            'catalogCount':data['count'],'catalogTotal':data['total'],'sheetNameCount':len(sheet),
            'matchedCount':len(matched),'unmatchedCount':len(unmatched),
            'unmatchedByCategory':dict(collections.Counter((x.get('category') or 'unknown') for x in unmatched)),
            'topUnmatchedIssuers':byissuer.most_common(50),
            'unmatched':unmatched,
            'matched':matched
          }
          open('probe/lengziyu-current/delta-report.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2))
          with open('probe/lengziyu-current/unmatched-names.tsv','w',encoding='utf-8') as f:
              f.write('name\tissuer\tcategory\tsuffix\tsourceUrl\tnearest\tscore\n')
              for x in unmatched:
                  f.write('\t'.join(str(x.get(k,'') or '') for k in ['name','issuer','category','suffix','sourceUrl','nearestSheetName','nearestScore'])+'\n')
          print(json.dumps({k:report[k] for k in ['catalogCount','catalogTotal','sheetNameCount','matchedCount','unmatchedCount','unmatchedByCategory']},ensure_ascii=False))
          PY

      - name: Publish snapshot to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probe/lengziyu-current
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Lengziyu catalog snapshot and diff'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lengziyu-market-probe
          path: probe/lengziyu-current/
          retention-days: 3
