name: vidian-writing-dom-debug
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vidian-writing-dom-debug.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect listing DOM
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          u='https://vidian.vn/danh-muc/chi-dao-sang-tac/1'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=20);r.raise_for_status()
          s=BeautifulSoup(r.text,'html.parser')
          links=[]
          for a in s.find_all('a',href=True):
              h=a.get('href','')
              if '/chi-tiet/' not in h: continue
              title=' '.join(a.stripped_strings)
              if not title: continue
              parents=[];p=a
              for _ in range(5):
                  p=p.parent
                  if not p:break
                  parents.append(f"{p.name}.{'.'.join(p.get('class',[]))}")
              links.append((h,title[:80],parents))
          print('DETAIL_LINKS',len(links))
          for i,(h,t,p) in enumerate(links[:30],1):
              print('ITEM',i,h,'|',t,'|',' > '.join(p))
          PY
