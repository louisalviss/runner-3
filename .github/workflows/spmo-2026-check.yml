name: SPMO 2026 Sanity Check
on:
  push:
    branches: [main]
    paths:
      - 'spmo-backtest/check_period.py'
      - 'spmo-backtest/data/2026-05-31_top_candidates.csv'
      - '.github/workflows/spmo-2026-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas yfinance
      - name: Reconstruct March 2026 top weight and return through Aug 14
        run: python -u spmo-backtest/check_period.py --csv spmo-backtest/data/2026-05-31_top_candidates.csv --rebalance 2026-03-20 --snapshot 2026-05-31 --exit 2026-08-14 --output spmo-backtest/output/check_2026_results.csv
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spmo-2026-check-${{ github.run_id }}
          path: spmo-backtest/output/check_2026_results.csv
          if-no-files-found: warn
          retention-days: 7
