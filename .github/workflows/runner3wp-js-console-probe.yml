name: runner3wp JS Console Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3wp-js-console-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3wp-js-console-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: https://runner3wp.pntr.dev/
      OUT: /tmp/runner3wp-js-console.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Install browser probe
        run: npm install --no-save playwright-core@1.58.2
      - name: Capture console, page and network errors
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = await import('playwright-core');
          const fs = await import('fs');
          const target=process.env.TARGET;
          const out={checkedAt:new Date().toISOString(),target,consoleErrors:[],consoleWarnings:[],pageErrors:[],requestFailures:[],httpErrors:[],scripts:[],status:null,title:null,finalUrl:null};
          const clean=s=>String(s||'').replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig,'EMAIL_REDACTED').slice(0,1800);
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const ctx=await browser.newContext({ignoreHTTPSErrors:true,viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'});
          const p=await ctx.newPage();
          p.on('console',m=>{const rec={type:m.type(),text:clean(m.text()),location:m.location()}; if(m.type()==='error')out.consoleErrors.push(rec); else if(m.type()==='warning')out.consoleWarnings.push(rec);});
          p.on('pageerror',e=>out.pageErrors.push(clean(e?.stack||e?.message||e)));
          p.on('requestfailed',r=>out.requestFailures.push({url:r.url(),type:r.resourceType(),failure:clean(r.failure()?.errorText)}));
          p.on('response',r=>{if(r.status()>=400)out.httpErrors.push({status:r.status(),url:r.url(),type:r.request().resourceType()});});
          try{
            const resp=await p.goto(target,{waitUntil:'domcontentloaded',timeout:60000});
            out.status=resp?.status()||null; out.finalUrl=p.url(); out.title=await p.title();
            await p.waitForTimeout(5000);
            out.scripts=await p.locator('script[src]').evaluateAll(xs=>xs.map(x=>x.src));
            out.images=await p.locator('img').evaluateAll(xs=>xs.slice(0,20).map(x=>({src:x.src,currentSrc:x.currentSrc,srcset:x.srcset,sizes:x.sizes,renderedWidth:Math.round(x.getBoundingClientRect().width),naturalWidth:x.naturalWidth,complete:x.complete})));
          }catch(e){out.fatal=clean(e?.stack||e?.message||e);}
          finally{await browser.close().catch(()=>{});fs.writeFileSync(process.env.OUT,JSON.stringify(out,null,2)+'\n');}
          NODE
      - name: Persist probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT" || echo '{"fatal":"probe_missing"}' > "$OUT"
          cp "$OUT" /tmp/runner3wp-js-console-safe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/custom-domain/js-probe
            cp /tmp/runner3wp-js-console-safe.json ops/custom-domain/js-probe/latest.json
            git add ops/custom-domain/js-probe/latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Persist runner3wp JS console probe: ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 5
