name: Ebook Audio iOS First Play Fix

on:
  push:
    branches: [ops/ebook-audio-ios-first-play-20260904]
    paths:
      - '.github/workflows/ebook-audio-ios-first-play-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ebook-audio-ios-first-play-20260904
          fetch-depth: 0

      - name: Patch Reader audio first-play and latency path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cloudflare/runner3-core/reader-audio-core/browser-production-integration.js')
          s = p.read_text(encoding='utf-8')

          old = """    displayConcurrent: 0,\n    lastError: '',\n    stateKey: STATE_KEY,\n"""
          new = """    displayConcurrent: 0,\n    lastError: '',\n    iosFirstPlayFix: 'v70',\n    currentChapterPrewarm: true,\n    blockingWarmAhead: false,\n    stateKey: STATE_KEY,\n"""
          if old not in s: raise SystemExit('debug marker missing')
          s = s.replace(old, new, 1)

          old = """      await adapter.mount(context);\n      if (autoplay) {\n        const rate = Math.max(1, Number(saved.playbackRate) || 1);\n        const effectiveSeconds = Math.max(0, Number(prepared.state.durationSeconds) || 0) / rate;\n        if (effectiveSeconds > 0 && effectiveSeconds < 18) {\n          setStatus('Nam Minh · chuẩn bị liền mạch…');\n          await warmAhead(Math.min(10000, Math.max(1500, Math.round((18 - effectiveSeconds) * 1000))));\n        }\n        await adapter.play();\n      }\n"""
          new = """      await adapter.mount(context);\n      // v70: next-chapter warm-ahead is fire-and-forget. Never delay current playback for it.\n      warmAhead(0);\n      if (autoplay) {\n        await adapter.play();\n      }\n"""
          if old not in s: raise SystemExit('blocking warm-ahead marker missing')
          s = s.replace(old, new, 1)

          old = """    if (!adapter || !payload || adapter.snapshot().chapter !== payload.chapter || !audio.getAttribute('src')) {\n      warmAhead(0);\n      const ready = await prepareCurrent({ autoplay: true, allowSaved: true });\n      if (!ready) return;\n      return;\n    }\n"""
          new = """    if (!adapter || !payload || adapter.snapshot().chapter !== payload.chapter || !audio.getAttribute('src')) {\n      // v70 iOS: a network/synthesis wait outlives the original tap activation.\n      // Prepare only; do not attempt delayed autoplay after the async wait.\n      const ready = await prepareCurrent({ autoplay: false, allowSaved: true, followOnMount: false });\n      if (ready) setStatus('Nam Minh · sẵn sàng · nhấn ▶ để phát');\n      return;\n    }\n"""
          if old not in s: raise SystemExit('first-tap autoplay marker missing')
          s = s.replace(old, new, 1)

          old = """    } catch (error) {\n      debug.lastError = String(error?.message || error || 'reader audio error').slice(0, 240);\n      setStatus(debug.lastError);\n      setMain('play');\n      return null;\n"""
          new = """    } catch (error) {\n      debug.lastError = String(error?.message || error || 'reader audio error').slice(0, 240);\n      const blocked = String(error?.name || '').toLowerCase() === 'notallowederror' || /not allowed|user gesture|user activation/i.test(debug.lastError);\n      setStatus(blocked ? 'Nam Minh · sẵn sàng · nhấn ▶ để phát' : 'Nam Minh · chưa tạo được audio · nhấn ▶ thử lại');\n      setMain('play');\n      return null;\n"""
          if old not in s: raise SystemExit('prepare error marker missing')
          s = s.replace(old, new, 1)

          old = """    } catch (error) {\n      debug.lastError = String(error?.message || error || 'play failed').slice(0, 240);\n      setStatus('Nam Minh · nhấn phát lại');\n    }\n"""
          new = """    } catch (error) {\n      debug.lastError = String(error?.message || error || 'play failed').slice(0, 240);\n      const blocked = String(error?.name || '').toLowerCase() === 'notallowederror' || /not allowed|user gesture|user activation/i.test(debug.lastError);\n      setStatus(blocked ? 'Nam Minh · nhấn ▶ lại để phát' : 'Nam Minh · chưa phát được · nhấn ▶ thử lại');\n    }\n"""
          if old not in s: raise SystemExit('play error marker missing')
          s = s.replace(old, new, 1)

          old = """    } else syncUi({ ...saved, cfi: restoreCfi, playingIntent: false });\n  } catch (error) {\n"""
          new = """    } else {\n      syncUi({ ...saved, cfi: restoreCfi, playingIntent: false });\n      // v70: synth/load current chapter as soon as Reader is stable, before the user's first Play tap.\n      // This moves cold-start latency into idle reading time and preserves iOS user activation for playback.\n      await prepareCurrent({ autoplay: false, allowSaved: true, followOnMount: false });\n    }\n  } catch (error) {\n"""
          if old not in s: raise SystemExit('initial prewarm marker missing')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          grep -Fq "iosFirstPlayFix: 'v70'" cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          grep -Fq "blockingWarmAhead: false" cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          grep -Fq "prepareCurrent({ autoplay: false, allowSaved: true, followOnMount: false })" cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          if grep -Fq "await warmAhead(Math.min(10000" cloudflare/runner3-core/reader-audio-core/browser-production-integration.js; then
            echo 'blocking warmAhead still present' >&2
            exit 2
          fi

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ebook-audio-fix-bot
          git config user.email ebook-audio-fix-bot@users.noreply.github.com
          git add cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          git diff --cached --check
          git commit -m 'fix(reader-audio): preserve iOS user activation and prewarm current chapter'
          git push origin HEAD:ops/ebook-audio-ios-first-play-20260904
