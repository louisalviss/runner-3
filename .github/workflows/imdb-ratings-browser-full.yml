name: IMDb Ratings Full Browser

on:
  push:
    branches: [main]
    paths:
      - 'scripts/imdb_ratings_browser_full.py'
      - '.github/workflows/imdb-ratings-browser-full.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imdb-ratings-browser-full
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOAKBROWSER_VERSION: '146.0.7680.177.5'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser and VPN tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl xvfb
          python -m pip install -q 'cloakbrowser==0.5.3'
          python -m playwright install-deps chromium
          CLOAKBROWSER_VERSION="$CLOAKBROWSER_VERSION" python -m cloakbrowser install

      - name: Build VPN Gate relay pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/imdb-relays
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          pref=['TH','SG','JP','KR','VN','MY','PH','ID','TW']
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          out=[]
          for c in pref:
              rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
              rs.sort(key=lambda r:int(r.get('Speed') or 0), reverse=True)
              for r in rs[:3]:
                  try:
                      cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
                  except Exception:
                      continue
                  cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
                  p=pathlib.Path(f'/tmp/imdb-relays/{len(out):02d}-{c}.ovpn')
                  p.write_text(cfg)
                  out.append((str(p),c,r.get('IP','')))
          if not out: raise SystemExit('No VPN relays')
          pathlib.Path('/tmp/imdb-relays.tsv').write_text('\n'.join('\t'.join(x) for x in out)+'\n')
          print('RELAYS',len(out))
          PY

      - name: Run full browser crawl through rotated VPN
        shell: bash
        run: |
          set -euo pipefail
          HOST_IP=$(curl -fsS --connect-timeout 8 --max-time 12 https://api.ipify.org || true)
          IFACE=$(ip route show default | awk '{print $5; exit}')
          PYTHON_BIN=$(command -v python3)
          RUNNER_USER=$(id -un)

          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.238.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.238.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.238.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.238.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          Xvfb :99 -screen 0 1365x900x24 >/tmp/xvfb.log 2>&1 &
          sleep 1

          success=0
          attempt=0
          while IFS=$'\t' read -r cfg country relay; do
            attempt=$((attempt+1))
            [ "$attempt" -le 8 ] || break
            echo "TRY attempt=$attempt country=$country relay=$relay"
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/openvpn.log
            sudo touch /tmp/openvpn.log && sudo chmod 666 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            vpn_ok=0
            for i in {1..15}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null && { vpn_ok=1; break; }
              grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|Connection refused|fatal error|Exiting due to fatal error' /tmp/openvpn.log 2>/dev/null && break || true
            done
            [ "$vpn_ok" = 1 ] || continue
            EXIT_IP=$(sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 12 https://api.ipify.org || true)
            echo "VPN_OK country=$country exit_ip=$EXIT_IP"
            rm -rf imdb_browser_output
            set +e
            sudo ip netns exec vpnns sudo -u "$RUNNER_USER" env HOME="$HOME" DISPLAY=:99 PATH="$PATH" "$PYTHON_BIN" "$GITHUB_WORKSPACE/scripts/imdb_ratings_browser_full.py"
            rc=$?
            set -e
            if [ "$rc" = 0 ] && [ -s imdb_browser_output/summary.json ]; then
              success=1
              echo "$country" > imdb_browser_output/vpn_country.txt
              echo "$EXIT_IP" > imdb_browser_output/vpn_exit_ip.txt
              break
            fi
            echo "browser attempt failed rc=$rc"
          done < /tmp/imdb-relays.tsv
          [ "$success" = 1 ] || { echo 'All browser attempts failed'; exit 1; }

      - name: Persist browser result
        shell: bash
        run: |
          set -euo pipefail
          DEST='runner-output/imdb-ratings-browser-full'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a imdb_browser_output/. "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git diff --cached --quiet && exit 0
          git commit -m 'Store full IMDb browser ratings result [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep "$n"
          done
          exit 1

      - name: Upload browser result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imdb-ratings-browser-full-${{ github.run_id }}
          path: imdb_browser_output/
          if-no-files-found: warn
          retention-days: 3

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
          sudo ip netns del vpnns 2>/dev/null || true
          rm -rf imdb_browser_output
