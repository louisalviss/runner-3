name: Video Recreate Reference Intake

on:
  push:
    branches: [main]
    paths:
      - "video-recreate-clck-trigger.txt"

permissions:
  contents: write

concurrency:
  group: runner-3-video-recreate-clck
  cancel-in-progress: true

jobs:
  reference-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OUT_DIR: artifacts/video-recreate-clck
      STATUS_FILE: video-recreate-clck-status.json
    steps:
      - uses: actions/checkout@v4

      - name: Publish running status
        run: |
          set -euo pipefail
          SOURCE_URL="$(sed -n 's/^source=//p' video-recreate-clck-trigger.txt | head -n1)"
          python3 - "$SOURCE_URL" <<'PY'
          import json,os,sys
          open(os.environ['STATUS_FILE'],'w').write(json.dumps({
            'status':'running',
            'stage':'reference_intake',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'source_url':sys.argv[1],
            'artifact_present':False,
            'technical_status':'pending',
            'creative_status':'pending'
          },ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STATUS_FILE"
          git commit -m 'Video reference intake running [skip ci]'
          git push

      - name: Install media tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl python3
          mkdir -p "$OUT_DIR/reference-frames" /tmp/video-recreate

      - name: Download source
        id: dl
        run: |
          set -euo pipefail
          SOURCE_URL="$(sed -n 's/^source=//p' video-recreate-clck-trigger.txt | head -n1)"
          test -n "$SOURCE_URL"
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          EFFECTIVE="$(curl -fL --retry 3 --retry-delay 2 --max-time 180 -A "$UA" -w '%{url_effective}' -o /tmp/video-recreate/source.mp4 "$SOURCE_URL")"
          test -s /tmp/video-recreate/source.mp4
          ffprobe -v error /tmp/video-recreate/source.mp4 >/dev/null
          echo "source_url=$SOURCE_URL" >> "$GITHUB_OUTPUT"
          echo "effective_url=$EFFECTIVE" >> "$GITHUB_OUTPUT"

      - name: Build dense AI reference packet
        run: |
          set -euo pipefail
          SRC=/tmp/video-recreate/source.mp4
          ffprobe -v error -show_streams -show_format -of json "$SRC" > "$OUT_DIR/source-ffprobe.json"

          # 2 fps dense frames: enough to reconstruct states/motion; not a sparse discovery-only sheet.
          ffmpeg -nostdin -hide_banner -loglevel error -y -i "$SRC" \
            -vf "fps=2,scale=360:-2" "$OUT_DIR/reference-frames/frame-%04d.jpg"

          # Discovery contact sheet only; never treat this as storyboard.
          ffmpeg -nostdin -hide_banner -loglevel error -y -i "$SRC" \
            -vf "fps=0.40,scale=360:-2,tile=4x3" -frames:v 1 "$OUT_DIR/contact-sheet.jpg"

          # Waveform image for audio-event alignment.
          ffmpeg -nostdin -hide_banner -loglevel error -y -i "$SRC" \
            -filter_complex "aformat=channel_layouts=mono,showwavespic=s=1440x240:colors=white" \
            -frames:v 1 "$OUT_DIR/waveform.png" || true

          # Hard-cut candidates. AI still validates meaningful sub-shot/state changes.
          ffmpeg -nostdin -hide_banner -i "$SRC" -filter:v "select='gt(scene,0.30)',showinfo" \
            -f null - 2> "$OUT_DIR/scene-detect.log" || true

          python3 - <<'PY'
          import json,re
          from pathlib import Path
          out=Path('artifacts/video-recreate-clck')
          p=json.load(open(out/'source-ffprobe.json'))
          dur=float(p.get('format',{}).get('duration') or 0)
          frames=sorted((out/'reference-frames').glob('frame-*.jpg'))
          txt=(out/'scene-detect.log').read_text(errors='ignore') if (out/'scene-detect.log').exists() else ''
          cuts=[]
          for m in re.finditer(r'pts_time:([0-9.]+)',txt):
              t=round(float(m.group(1)),3)
              if not cuts or abs(t-cuts[-1])>0.2: cuts.append(t)
          manifest={
            'reference_duration_sec':round(dur,3),
            'dense_frame_rate_fps':2,
            'dense_frame_count':len(frames),
            'frame_interval_sec':0.5,
            'hard_cut_candidates_sec':cuts,
            'next_required_stage':'AI_REFERENCE_ANALYSIS_AND_STORYBOARD',
            'flow_spec':'FLOWS/video-recreate-reference-v1.md'
          }
          (out/'reference-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Technical intake QA
        run: |
          set -euo pipefail
          test -s "$OUT_DIR/source-ffprobe.json"
          test -s "$OUT_DIR/reference-manifest.json"
          test -s "$OUT_DIR/contact-sheet.jpg"
          test "$(find "$OUT_DIR/reference-frames" -name 'frame-*.jpg' | wc -l)" -ge 20

      - name: Upload AI analysis packet
        uses: actions/upload-artifact@v4
        with:
          name: video-reference-packet-${{ github.run_id }}
          path: |
            artifacts/video-recreate-clck/source-ffprobe.json
            artifacts/video-recreate-clck/reference-manifest.json
            artifacts/video-recreate-clck/contact-sheet.jpg
            artifacts/video-recreate-clck/waveform.png
            artifacts/video-recreate-clck/scene-detect.log
            artifacts/video-recreate-clck/reference-frames/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

      - name: Publish analysis-required status
        env:
          SOURCE_URL: ${{ steps.dl.outputs.source_url }}
          EFFECTIVE_URL: ${{ steps.dl.outputs.effective_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          m=Path(os.environ['OUT_DIR'])/'reference-manifest.json'
          manifest=json.loads(m.read_text())
          d={
            'status':'analysis_required',
            'stage':'reference_intake_complete',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'artifact_present':True,
            'artifact_name':f"video-reference-packet-{os.environ['GITHUB_RUN_ID']}",
            'source_url':os.environ.get('SOURCE_URL',''),
            'effective_url':os.environ.get('EFFECTIVE_URL',''),
            'technical_status':'pass',
            'creative_status':'pending',
            'next_required_stage':'AI_REFERENCE_ANALYSIS_AND_STORYBOARD',
            'manifest':manifest
          }
          Path(os.environ['STATUS_FILE']).write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STATUS_FILE" "$OUT_DIR/source-ffprobe.json" "$OUT_DIR/reference-manifest.json" "$OUT_DIR/contact-sheet.jpg" "$OUT_DIR/waveform.png" "$OUT_DIR/scene-detect.log" 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Publish video reference analysis packet [skip ci]'
            git push
          fi
