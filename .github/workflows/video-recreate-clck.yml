name: Video Recreate Source Inspect

on:
  push:
    branches: [main]
    paths:
      - "video-recreate-clck-trigger.txt"

permissions:
  contents: write

concurrency:
  group: runner-3-video-recreate-clck
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_URL: "https://clck.ru/3VNYSd"
      OUT_DIR: "artifacts/video-recreate-clck"
      STATUS_FILE: "video-recreate-clck-status.json"
    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl python3

      - name: Download source
        id: dl
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR" /tmp/video-recreate
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          EFFECTIVE="$(curl -fL --retry 3 --retry-delay 2 --max-time 180 -A "$UA" -w '%{url_effective}' -o /tmp/video-recreate/source.bin "$SOURCE_URL")"
          test -s /tmp/video-recreate/source.bin
          ffprobe -v error /tmp/video-recreate/source.bin >/dev/null
          echo "effective_url=$EFFECTIVE" >> "$GITHUB_OUTPUT"

      - name: Probe and extract reference frames
        run: |
          set -euo pipefail
          SRC=/tmp/video-recreate/source.bin
          ffprobe -v error -show_streams -show_format -of json "$SRC" > "$OUT_DIR/ffprobe.json"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          out=Path('artifacts/video-recreate-clck')
          p=json.load(open(out/'ffprobe.json'))
          dur=float(p.get('format',{}).get('duration') or 0)
          if dur <= 0: raise SystemExit('invalid duration')
          ts=[dur*(i+0.5)/12 for i in range(12)]
          for i,t in enumerate(ts,1):
              subprocess.run(['ffmpeg','-nostdin','-loglevel','error','-y','-ss',f'{t:.3f}','-i','/tmp/video-recreate/source.bin','-frames:v','1','-vf','scale=360:-2',str(out/f'frame-{i:02d}.jpg')],check=True)
          fps=12.0/dur
          subprocess.run(['ffmpeg','-nostdin','-loglevel','error','-y','-i','/tmp/video-recreate/source.bin','-vf',f'fps={fps:.8f},scale=360:-2,tile=4x3','-frames:v','1',str(out/'contact-sheet.jpg')],check=True)
          v=next((s for s in p['streams'] if s.get('codec_type')=='video'),{})
          a=next((s for s in p['streams'] if s.get('codec_type')=='audio'),{})
          info={
            'status':'success','source_url':'https://clck.ru/3VNYSd','duration_sec':round(dur,3),
            'width':v.get('width'),'height':v.get('height'),'video_codec':v.get('codec_name'),
            'avg_frame_rate':v.get('avg_frame_rate'),'audio_codec':a.get('codec_name'),
            'sample_rate':a.get('sample_rate'),'frame_timestamps_sec':[round(x,3) for x in ts]
          }
          (out/'source-info.json').write_text(json.dumps(info,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Publish status and references
        env:
          EFFECTIVE_URL: ${{ steps.dl.outputs.effective_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ['OUT_DIR'])
          info=json.loads((out/'source-info.json').read_text())
          info['effective_url']=os.environ.get('EFFECTIVE_URL','')
          info['run_id']=os.environ['GITHUB_RUN_ID']
          info['contact_sheet']=f"{os.environ['OUT_DIR']}/contact-sheet.jpg"
          Path(os.environ['STATUS_FILE']).write_text(json.dumps(info,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT_DIR" "$STATUS_FILE"
          git commit -m 'Inspect recreate video source [skip ci]'
          git push

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-recreate-source-${{ github.run_id }}
          path: |
            /tmp/video-recreate/source.bin
            artifacts/video-recreate-clck/ffprobe.json
            artifacts/video-recreate-clck/source-info.json
            artifacts/video-recreate-clck/contact-sheet.jpg
          retention-days: 2
          compression-level: 0
