name: SABA B2B Demo Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/saba-b2b-demo-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: python3 -m pip install --user -q playwright
      - name: Inspect official SABA B2B public demo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from playwright.sync_api import sync_playwright

          url='https://www.sabab2b.com/en-US/freetrial/demo?platform=Desktop&site=liteDemo&skin=3'
          out={'source':url}
          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome',headless=True)
              c=b.new_context(locale='en-US',viewport={'width':1440,'height':1000})
              pg=c.new_page()
              pg.goto(url,wait_until='domcontentloaded',timeout=45000)
              pg.wait_for_timeout(2500)
              def body():
                  try: return pg.locator('body').inner_text(timeout=8000)
                  except: return ''
              out['before']=body()[:5000]

              # Normal public UI only: select English if needed, then press Continue once.
              try:
                  eng=pg.get_by_text(re.compile(r'^\s*English\s*$',re.I)).first
                  if eng.count() and eng.is_visible():
                      eng.click(timeout=5000); pg.wait_for_timeout(500)
                      out['english_clicked']=True
              except Exception as e:
                  out['english_clicked']=False

              try:
                  cont=pg.get_by_role('button',name=re.compile(r'^\s*Continue\s*$',re.I)).first
                  if not cont.count(): cont=pg.get_by_text(re.compile(r'^\s*Continue\s*$',re.I)).first
                  if cont.count() and cont.is_visible():
                      cont.click(timeout=5000); pg.wait_for_timeout(5000)
                      out['continue_clicked']=True
              except Exception as e:
                  out['continue_clicked']=False

              t=body()
              out['after_url']=pg.url
              out['after']=t[:10000]
              out['challenge']=bool(re.search(r'captcha|verify you are human|turnstile|recaptcha|hcaptcha|cloudflare|security verification|verification code',t,re.I))
              out['has_sportsbook']=bool(re.search(r'live|soccer|football|premier league|odds|sports',t,re.I))
              out['has_outright']=bool(re.search(r'outright|futures|winner|champion|relegat|top\s*4|top\s*scorer|goalscorer',t,re.I))
              # If sportsbook opened, only enumerate visible navigation/control labels relevant to Outright.
              if out['has_sportsbook'] and not out['challenge']:
                  nav=[]
                  els=pg.locator('a,button,[role="button"]')
                  for i in range(min(els.count(),600)):
                      e=els.nth(i)
                      try:
                          if not e.is_visible(): continue
                          tx=(e.inner_text() or '').strip()
                          title=e.get_attribute('title') or ''
                          if re.search(r'out|future|soccer|football|premier|winner|league|sport',tx+' '+title,re.I):
                              nav.append({'text':tx[:180],'title':title[:180]})
                      except: pass
                  out['relevant_controls']=nav[:100]
              b.close()
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
