name: SPMO validate Leto canonical
on:
  push:
    paths:
      - 'spmo-backtest/validated/leto_live_period_checks.csv'
      - 'spmo-backtest/validated/leto_live_metrics.json'
      - 'spmo-backtest/validate_leto_canonical.py'
      - '.github/workflows/spmo-validate-leto-canonical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yfinance pandas
      - run: python spmo-backtest/validate_leto_canonical.py
