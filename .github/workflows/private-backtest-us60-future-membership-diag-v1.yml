name: Private Backtest US60 Future Membership Diagnostic V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/private_backtest_us60_future_membership_diag.py'
      - '.github/workflows/private-backtest-us60-future-membership-diag-v1.yml'

permissions:
  contents: read

env:
  RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
  RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
  RUNNER3_SOURCE: runner-3-github-hosted

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Quantify discovered future-membership contribution
        run: python tools/private_backtest_us60_future_membership_diag.py
