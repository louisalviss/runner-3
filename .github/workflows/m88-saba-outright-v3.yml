name: M88 SABA Outright V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/m88-saba-outright-v3.yml']

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          rm -rf m88-evidence /tmp/m88-relays
          mkdir -p m88-evidence /tmp/m88-relays

      - name: Connect accepted Asia relay
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          meta=[]
          for c in ['TH','SG','MY','PH','ID','JP','KR','TW','VN']:
            rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
            rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
            for r in rs[:(10 if c=='TH' else 3)]:
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              p=pathlib.Path(f'/tmp/m88-relays/{len(meta):02d}-{c}.ovpn'); p.write_text(cfg)
              meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          if not meta: raise SystemExit('No relays')
          pathlib.Path('/tmp/relays.tsv').write_text('\n'.join(meta)+'\n')
          print('RELAYS',len(meta))
          PY
          IFACE=$(ip route show default|awk '{print $5;exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn; sudo ip link set vn netns vpnns
          sudo ip addr add 10.247.0.1/24 dev vh; sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.247.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.247.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.247.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          selected=0
          while IFS=$'\t' read -r cfg c relay; do
            echo TRY $c $relay
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null||true; sleep 1
            sudo rm -f /tmp/o.log /tmp/top.json; sudo touch /tmp/o.log; sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log||true
            ok=0; for i in {1..12}; do sleep 1; grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null&&{ ok=1;break; }; done
            [ "$ok" = 1 ]||continue
            if sudo ip netns exec vpnns curl -fsS --max-time 18 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/top.json; then
              if python3 - <<'PY'
          import json
          try:d=json.load(open('/tmp/top.json'))
          except:raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then
                sudo ip netns exec vpnns curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace|grep -E '^(ip|loc|warp)='|tee m88-evidence/egress.txt||true
                echo "$c $relay"|tee m88-evidence/relay.txt
                selected=1; break
              fi
            fi
          done </tmp/relays.tsv
          test "$selected" = 1

      - name: Open rotating SABA iframe and Outright
        shell: bash
        run: |
          set -euo pipefail
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          OUT=Path(os.environ['WORKSPACE'])/'m88-evidence'
          result={'markets':{},'notes':[],'frames':[],'controls_before':[],'controls_after':[]}
          network=[]; payloads=[]
          targets={
            'winner': re.compile(r'ENGLISH\s+PREMIER\s+LEAGUE.*?(?:2026\s*/\s*2027|2026-2027).*?WINNER',re.I|re.S),
            'top4': re.compile(r'ENGLISH\s+PREMIER\s+LEAGUE.*?(?:2026\s*/\s*2027|2026-2027).*?TOP\s*4',re.I|re.S),
            'relegation': re.compile(r'ENGLISH\s+PREMIER\s+LEAGUE.*?(?:2026\s*/\s*2027|2026-2027).*?(?:RELEGAT|TO\s+BE\s+RELEGATED)',re.I|re.S),
            'goalscorer': re.compile(r'ENGLISH\s+PREMIER\s+LEAGUE.*?(?:2026\s*/\s*2027|2026-2027).*?(?:TOP\s*GOAL|GOALSCORER)',re.I|re.S),
          }
          def txt(f,limit=700000):
            try:return f.locator('body').inner_text(timeout=7000)[:limit]
            except:return ''
          def provider_score(f):
            t=txt(f,60000); h=(urlparse(f.url).hostname or '').lower(); s=0
            if h.startswith('i1x9gr.'): s+=150
            if re.search(r'\bSaba Soccer\b',t,re.I): s+=50
            if re.search(r'\bPrediction Market\b',t,re.I): s+=30
            if re.search(r'\bLive\b',t,re.I): s+=10
            if re.search(r'\bSports\b',t,re.I): s+=10
            return s,t
          def visible(loc,n=150):
            for i in range(min(loc.count(),n)):
              try:
                if loc.nth(i).is_visible(): return loc.nth(i)
              except:pass
            return None
          def outright_el(f):
            for rx in [re.compile(r'^\s*Outright\s*$',re.I),re.compile(r'\bOutright\b',re.I)]:
              try:
                e=visible(f.get_by_text(rx),200)
                if e is not None:return e
              except:pass
            return None
          def inventory(f):
            out=[]
            for sel in ['button','a','[role="button"]','[onclick]','[tabindex]']:
              try:loc=f.locator(sel)
              except:continue
              for i in range(min(loc.count(),600)):
                e=loc.nth(i)
                try:
                  if not e.is_visible():continue
                  d=e.evaluate("e=>({tag:e.tagName,text:(e.innerText||e.textContent||'').trim().replace(/\\s+/g,' ').slice(0,300),aria:e.getAttribute('aria-label')||'',title:e.getAttribute('title')||'',id:e.id||'',cls:String(e.className||'').slice(0,300),href:e.href||'',r:(()=>{let r=e.getBoundingClientRect();return [Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)]})()})")
                  if d not in out:out.append(d)
                except:pass
            return out
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            c=b.new_context(viewport={'width':390,'height':844},screen={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True,locale='en-US',timezone_id='Asia/Bangkok',user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1')
            page=c.new_page()
            def req(r):
              if r.resource_type in ('document','xhr','fetch'):network.append({'kind':'request','method':r.method,'type':r.resource_type,'url':r.url,'post':(r.post_data or '')[:12000]})
            def resp(r):
              if r.request.resource_type not in ('document','xhr','fetch'):return
              network.append({'kind':'response','status':r.status,'type':r.request.resource_type,'url':r.url})
              try:
                body=r.text()
                if len(body)<=7000000 and re.search(r'outright|2026.?2027|relegat|goal.?scorer|top.?4',body,re.I):payloads.append({'url':r.url,'status':r.status,'body':body[:2500000]})
              except:pass
            page.on('request',req);page.on('response',resp)
            r=page.goto('https://www.m88.com/sports/Saba%20Sports?Language=en-US',wait_until='domcontentloaded',timeout=45000)
            result['m88_status']=r.status if r else None
            page.wait_for_timeout(18000)
            page.screenshot(path=str(OUT/'01-board.png'),full_page=False)
            ranked=[]
            for f in page.frames:
              s,t=provider_score(f);ranked.append((s,len(t),f,t));result['frames'].append({'url':f.url,'score':s,'text':t[:40000]})
            ranked.sort(key=lambda x:(x[0],x[1]),reverse=True)
            provider=ranked[0][2] if ranked and ranked[0][0]>=100 else None
            if provider is None:
              result['notes'].append('provider not found')
            else:
              result['provider_url']=provider.url
              result['provider_before']=txt(provider,180000)
              result['controls_before']=inventory(provider)
              e=outright_el(provider)
              if e is None:
                menu=None
                for d in result['controls_before']:
                  x,y,w,h=d['r']; label=' '.join([d['text'],d['aria'],d['title'],d['id'],d['cls']])
                  if re.search(r'menu|hamburger|drawer',label,re.I) or (x<75 and y<75 and 18<=w<=90 and 18<=h<=90):
                    try:
                      selector=None
                      if d['id']: selector='#'+d['id']
                      if selector:
                        q=provider.locator(selector); menu=visible(q,10)
                      if menu is not None:break
                    except:pass
                if menu is not None:
                  try:menu.click(timeout=5000);result['menu_click']='element'
                  except Exception as ex:result['menu_element_error']=type(ex).__name__
                else:
                  try:provider.locator('body').click(position={'x':24,'y':28},timeout=5000);result['menu_click']='coordinate'
                  except Exception as ex:result['menu_coordinate_error']=type(ex).__name__
                page.wait_for_timeout(2200)
                page.screenshot(path=str(OUT/'02-menu.png'),full_page=False)
                result['provider_after_menu']=txt(provider,260000)
                result['controls_after']=inventory(provider)
                e=outright_el(provider)
              if e is None:
                # Some builds expose Outright as a game selector with GameId 999 but no visible label until More is opened.
                more=None
                try:more=visible(provider.get_by_text(re.compile(r'^\s*More\s*$',re.I)),50)
                except:pass
                if more is not None:
                  try:more.click(timeout=5000);result['more_click']=True
                  except Exception as ex:result['more_error']=type(ex).__name__
                  page.wait_for_timeout(1600)
                  result['provider_after_more']=txt(provider,300000)
                  result['controls_after_more']=inventory(provider)
                  page.screenshot(path=str(OUT/'03-more.png'),full_page=False)
                  e=outright_el(provider)
              if e is None:
                result['notes'].append('Outright label not found after menu/more')
                result['outright_clicked']=False
              else:
                try:result['outright_label']=e.inner_text()[:300]
                except:result['outright_label']='Outright'
                try:e.click(timeout=7000);result['outright_clicked']=True
                except Exception as ex:result['outright_clicked']=False;result['notes'].append('Outright click '+type(ex).__name__)
                page.wait_for_timeout(9000)
                page.screenshot(path=str(OUT/'04-outright.png'),full_page=False)
                ranked=[]
                for f in page.frames:
                  s,t=provider_score(f);ranked.append((s,len(t),f,t))
                ranked.sort(key=lambda x:(x[0],x[1]),reverse=True)
                if ranked and ranked[0][0]>=100:provider=ranked[0][2]
                corpus=''
                for step in range(50):
                  now=txt(provider,800000)
                  if now and now not in corpus:corpus+='\n'+now
                  if all(rx.search(corpus) for rx in targets.values()):break
                  try:provider.locator('body').evaluate('(e)=>window.scrollBy(0,650)')
                  except:pass
                  page.wait_for_timeout(300)
                result['outright_text']=corpus[:1300000]
                for key,rx in targets.items():
                  rec={'found':False,'source':None,'window':''}
                  m=rx.search(corpus)
                  if m:
                    rec.update(found=True,source='dom',window=corpus[max(0,m.start()-1000):min(len(corpus),m.start()+45000)])
                  else:
                    for q in payloads:
                      m=rx.search(q['body'])
                      if m:
                        rec.update(found=True,source='network',url=q['url'],window=q['body'][max(0,m.start()-2000):min(len(q['body']),m.start()+70000)]);break
                  result['markets'][key]=rec
            c.close();b.close()
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          (OUT/'network.json').write_text(json.dumps(network,ensure_ascii=False,indent=2))
          (OUT/'payloads.json').write_text(json.dumps(payloads,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2)[:160000])
          PY

      - name: Verify
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('m88-evidence/result.json'))
          print('PROVIDER',d.get('provider_url'))
          print('MENU',d.get('menu_click'),'MORE',d.get('more_click'))
          print('OUTRIGHT',d.get('outright_clicked'),d.get('outright_label'))
          print('NOTES',d.get('notes'))
          for k,v in d.get('markets',{}).items():
            print('\n',k,'FOUND',v.get('found'),'SOURCE',v.get('source'))
            print(v.get('window','')[:15000])
          if not d.get('provider_url'):raise SystemExit('provider missing')
          if not d.get('outright_clicked'):raise SystemExit('Outright not opened')
          if not any(v.get('found') for v in d.get('markets',{}).values()):raise SystemExit('EPL markets not found')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-saba-outright-v3-${{ github.run_id }}
          path: m88-evidence/
          retention-days: 3
