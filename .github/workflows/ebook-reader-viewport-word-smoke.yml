name: Ebook Reader Viewport Word Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ebook_reader_viewport_word_smoke.mjs'
      - '.github/workflows/ebook-reader-viewport-word-smoke.yml'
      - 'ops/reader-core-deploy.trigger'

permissions:
  contents: read

jobs:
  deploy-v26:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "MISSING:$name" >&2; exit 2; }
            echo "PRESENT:$name"
          done
      - uses: actions/checkout@v4
        with:
          ref: e5e863491c934ac33a2f34467fc169e90c97de81
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose canonical mailbox with Reader v26
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('cloudflare/runner3-core')
          mailbox=root/'mailbox-entry.js'
          text=mailbox.read_text(encoding='utf-8')
          old='import app from "./audio-entry.js";'
          new='import app from "./artifact-library-reader-v7-github-audio-entry.js";'
          if old not in text: raise SystemExit('canonical mailbox import marker missing')
          mailbox.write_text(text.replace(old,new,1),encoding='utf-8')
          cfg_path=root/'wrangler.jsonc'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['main']='mailbox-entry.js'
          cfg_path.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/mailbox-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v26-persist-follow-cfi-entry.js
          grep -q 'artifact-library-reader-v26-persist-follow-cfi-entry.js' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          grep -q 'window.__r3AudioPersistFollowCfiV26=true' cloudflare/runner3-core/artifact-library-reader-v26-persist-follow-cfi-entry.js
      - name: Deploy Reader v26 Core
        working-directory: cloudflare/runner3-core
        shell: bash
        run: |
          set -euo pipefail
          export NO_COLOR=1
          npx --yes wrangler@4 deploy
      - name: Verify v26 live before browser proof
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          ok=0
          for attempt in $(seq 1 15); do
            code="$(curl -sS -D /tmp/h -o /tmp/reader -w '%{http_code}' "$core/artifact-library/read?key=$encoded")"
            tr -d '\r' </tmp/h >/tmp/h.clean
            if [ "$code" = 200 ] && grep -qi '^x-r3-reader-runtime: v26-persist-follow-cfi$' /tmp/h.clean && grep -qi '^x-r3-reader-patch-proof: v25+v26:persist-reader-cfi-after-audio-follow$' /tmp/h.clean && grep -q 'window.__r3AudioPersistFollowCfiV26=true' /tmp/reader; then
              ok=1
              break
            fi
            echo "WAIT_V26 attempt=$attempt http=$code runtime=$(grep -i '^x-r3-reader-runtime:' /tmp/h.clean || true)"
            sleep 1
          done
          if [ "$ok" != 1 ]; then cat /tmp/h.clean; head -c 700 /tmp/reader; exit 1; fi
          mcode="$(curl -sS -o /tmp/mailbox.csv -w '%{http_code}' "$core/mailbox/results/smoke-reader-v26.csv")"
          test "$mcode" = 200
          grep -q 'pending' /tmp/mailbox.csv
          echo 'READER_V26_LIVE=PASS'

  viewport-word:
    needs: deploy-v26
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      EBOOK_BROWSER_SMOKE_BOOK_KEY: core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Adapt canonical proof to v26 runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p='scripts/ebook_reader_viewport_word_smoke.mjs'
          s=open(p,encoding='utf-8').read()
          s=s.replace("const TEST_ID = 'seek-smoke-v16';","const TEST_ID = 'seek-smoke-v26';")
          s=s.replace("runtime.includes('v16')","runtime.includes('v26')")
          s=s.replace('live Reader is not v16:','live Reader is not v26:')
          old='window.__r3AudioViewportWordV15 === true && window.__r3AudioOuterGeometryV16 === true'
          new='window.__r3AudioViewportWordV15 === true && window.__r3AudioPersistFollowCfiV26 === true'
          if old not in s: raise SystemExit('v16 runtime marker condition missing')
          s=s.replace(old,new,1)
          anchor='  const beforeFollowCfi = started.cfi;'
          pause="  const beforeFollowCfi = started.cfi;\n  await page.evaluate(() => document.getElementById('r3AudioElement')?.pause());\n  await page.waitForTimeout(120);"
          if anchor not in s: raise SystemExit('follow pause anchor missing')
          s=s.replace(anchor,pause,1)
          oldsaved="  const savedTime = await page.evaluate((bookKey) => {\n    try { return Number(JSON.parse(localStorage.getItem('r3-reader-audio-state-v11:' + bookKey) || 'null')?.time || 0); } catch { return 0; }\n  }, BOOK_KEY);\n  if (savedTime < followTime - 0.8) throw new Error(`audio timestamp not persisted: follow=${followTime} saved=${savedTime}`);"
          newsaved="  const savedResumeState = await page.evaluate((bookKey) => {\n    try { return JSON.parse(localStorage.getItem('r3-reader-audio-state-v11:' + bookKey) || 'null'); } catch { return null; }\n  }, BOOK_KEY);\n  const savedTime = Number(savedResumeState?.time || 0);\n  console.log(JSON.stringify({ phase: 'persisted-follow-state', savedTime, savedCfi: savedResumeState?.cfi || null, persistDebug: await page.evaluate(() => window.__r3AudioPersistFollowCfiV26Debug || null) }));\n  if (savedTime < followTime - 0.8) throw new Error(`audio timestamp not persisted: follow=${followTime} saved=${savedTime}`);\n  if (!savedResumeState?.cfi || savedResumeState.cfi === beforeFollowCfi) throw new Error(`followed Reader CFI not persisted: before=${beforeFollowCfi} saved=${savedResumeState?.cfi || ''}`);"
          if oldsaved not in s: raise SystemExit('saved state marker missing')
          s=s.replace(oldsaved,newsaved,1)
          oldrest="const restored = await page.evaluate(() => { const a = document.getElementById('r3AudioElement'); return { time: Number(a?.currentTime || 0), src: String(a?.currentSrc || a?.getAttribute('src') || ''), cfi: window.r3ReaderBridge?.current?.()?.start?.cfi || null }; });"
          newrest="const restored = await page.evaluate(() => { const a = document.getElementById('r3AudioElement'); return { debug: window.__r3AudioResumeV23Debug || null, waitDebug: window.__r3AudioResumeWaitV24Debug || null, reuseDebug: window.__r3AudioReuseV25Debug || null, persistDebug: window.__r3AudioPersistFollowCfiV26Debug || null, time: Number(a?.currentTime || 0), src: String(a?.currentSrc || a?.getAttribute('src') || ''), cfi: window.r3ReaderBridge?.current?.()?.start?.cfi || null, mediaId: a?.dataset?.r3AudioId || '' }; });"
          if oldrest not in s: raise SystemExit('restore log marker missing')
          s=s.replace(oldrest,newrest,1)
          restorelog="  console.log(JSON.stringify({ phase: 'restored', postCount, savedTime, ...restored }));\n  if (postCount !== 1) throw new Error(`refresh unexpectedly POSTed audio again: ${postCount}`);"
          restoreproof="  const restoredView = await snapshot();\n  console.log(JSON.stringify({ phase: 'restored', postCount, savedTime, ...restored, restoredVisibleTokenOrdinal: restoredView.visibleTokenOrdinal, restoredVisibleToken: restoredView.visibleToken }));\n  if (postCount !== 1) throw new Error(`refresh unexpectedly POSTed audio again: ${postCount}`);\n  if (!restored.cfi || restored.cfi === beforeFollowCfi) throw new Error(`refresh did not restore Reader CFI: before=${beforeFollowCfi} restored=${restored.cfi || ''}`);\n  if (restoredView.visibleTokenOrdinal < Math.max(0, followIndex - 30)) throw new Error(`refresh restored wrong Reader page: target=${followIndex} visible=${restoredView.visibleTokenOrdinal}`);"
          if restorelog not in s: raise SystemExit('restore proof anchor missing')
          s=s.replace(restorelog,restoreproof,1)
          oldresume="const resumed = await page.evaluate(() => { const a = document.getElementById('r3AudioElement'); return { time: Number(a?.currentTime || 0), paused: Boolean(a?.paused), src: String(a?.currentSrc || a?.getAttribute('src') || '') }; });"
          newresume="const resumed = await page.evaluate(() => { const a = document.getElementById('r3AudioElement'); return { time: Number(a?.currentTime || 0), paused: Boolean(a?.paused), src: String(a?.currentSrc || a?.getAttribute('src') || ''), cfi: window.r3ReaderBridge?.current?.()?.start?.cfi || null, mediaId: a?.dataset?.r3AudioId || '', reuseDebug: window.__r3AudioReuseV25Debug || null, persistDebug: window.__r3AudioPersistFollowCfiV26Debug || null }; });"
          if oldresume not in s: raise SystemExit('resume log marker missing')
          s=s.replace(oldresume,newresume,1)
          anchor2="  if (!resumed.src.includes(TEST_ID)) throw new Error('resume did not reuse same audio media');"
          proof=anchor2+"\n  if (resumed.cfi === beforeFollowCfi) throw new Error('resume fell back to old Reader CFI');"
          if anchor2 not in s: raise SystemExit('resume assertion anchor missing')
          s=s.replace(anchor2,proof,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -q "seek-smoke-v26" scripts/ebook_reader_viewport_word_smoke.mjs
          grep -q "__r3AudioPersistFollowCfiV26" scripts/ebook_reader_viewport_word_smoke.mjs
          grep -q "followed Reader CFI not persisted" scripts/ebook_reader_viewport_word_smoke.mjs
          grep -q "refresh did not restore Reader CFI" scripts/ebook_reader_viewport_word_smoke.mjs
          grep -q "next-page-target" scripts/ebook_reader_viewport_word_smoke.mjs
          grep -q "mediaRangeCount" scripts/ebook_reader_viewport_word_smoke.mjs
      - name: Install browser runtime dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Prove exact start, page follow, persisted CFI refresh and no duplicate audio POST
        run: node scripts/ebook_reader_viewport_word_smoke.mjs

# v26: persist Reader CFI after async audio-follow; refresh must restore page before Play
