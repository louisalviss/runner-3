name: Ebook Reader Viewport Word Smoke (Legacy, No Deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

# Legacy v30 browser proof retained only as an explicit archive marker.
# This workflow MUST NOT deploy runner3-core. Production deployment ownership
# belongs exclusively to runner3-core-public-hosted-reader-deploy.yml.
jobs:
  legacy-no-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy smoke is isolated from production
        run: |
          echo 'LEGACY_READER_SMOKE_NO_DEPLOY=PASS'
          echo 'Production deploy owner: runner3-core-public-hosted-reader-deploy.yml'
