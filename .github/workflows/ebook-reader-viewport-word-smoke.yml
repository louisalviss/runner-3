name: Ebook Reader Viewport Word Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ebook_reader_viewport_word_smoke.mjs'
      - '.github/workflows/ebook-reader-viewport-word-smoke.yml'
      - 'ops/reader-core-deploy.trigger'

permissions:
  contents: read

jobs:
  deploy-v24:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "MISSING:$name" >&2; exit 2; }
            echo "PRESENT:$name"
          done
      - uses: actions/checkout@v4
        with:
          ref: 19fd5ee26adb53c9d2b58738adb5e87cc810a019
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose canonical mailbox with Reader v24
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('cloudflare/runner3-core')
          mailbox=root/'mailbox-entry.js'
          text=mailbox.read_text(encoding='utf-8')
          old='import app from "./audio-entry.js";'
          new='import app from "./artifact-library-reader-v7-github-audio-entry.js";'
          if old not in text: raise SystemExit('canonical mailbox import marker missing')
          mailbox.write_text(text.replace(old,new,1),encoding='utf-8')
          cfg_path=root/'wrangler.jsonc'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['main']='mailbox-entry.js'
          cfg_path.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/mailbox-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v24-resume-wait-match-entry.js
          grep -q 'artifact-library-reader-v24-resume-wait-match-entry.js' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          grep -q 'window.__r3AudioResumeWaitMatchV24=true' cloudflare/runner3-core/artifact-library-reader-v24-resume-wait-match-entry.js
      - name: Deploy Reader v24 Core
        working-directory: cloudflare/runner3-core
        shell: bash
        run: |
          set -euo pipefail
          export NO_COLOR=1
          npx --yes wrangler@4 deploy
      - name: Verify v24 live before browser proof
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          code="$(curl -sS -D /tmp/h -o /tmp/reader -w '%{http_code}' "$core/artifact-library/read?key=$encoded")"
          tr -d '\r' </tmp/h >/tmp/h.clean
          echo "READER_HTTP=$code"
          cat /tmp/h.clean
          if [ "$code" != 200 ]; then head -c 700 /tmp/reader; exit 1; fi
          grep -qi '^x-r3-reader-runtime: v24-resume-wait-match$' /tmp/h.clean
          grep -qi '^x-r3-reader-patch-proof: v23+v24:wait-matching-signature-before-restore$' /tmp/h.clean
          grep -q 'window.__r3AudioResumeWaitMatchV24=true' /tmp/reader
          mcode="$(curl -sS -o /tmp/mailbox.csv -w '%{http_code}' "$core/mailbox/results/smoke-reader-v24.csv")"
          test "$mcode" = 200
          grep -q 'pending' /tmp/mailbox.csv
          echo 'READER_V24_LIVE=PASS'

  viewport-word:
    needs: deploy-v24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      EBOOK_BROWSER_SMOKE_BOOK_KEY: core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Adapt canonical proof to v24 runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p='scripts/ebook_reader_viewport_word_smoke.mjs'
          s=open(p,encoding='utf-8').read()
          s=s.replace("const TEST_ID = 'seek-smoke-v16';","const TEST_ID = 'seek-smoke-v24';")
          s=s.replace("runtime.includes('v16')","runtime.includes('v24')")
          s=s.replace('live Reader is not v16:','live Reader is not v24:')
          old='window.__r3AudioViewportWordV15 === true && window.__r3AudioOuterGeometryV16 === true'
          new='window.__r3AudioViewportWordV15 === true && window.__r3AudioResumeWaitMatchV24 === true'
          if old not in s: raise SystemExit('v16 runtime marker condition missing')
          s=s.replace(old,new,1)
          anchor='  const beforeFollowCfi = started.cfi;'
          pause="  const beforeFollowCfi = started.cfi;\n  await page.evaluate(() => document.getElementById('r3AudioElement')?.pause());\n  await page.waitForTimeout(120);"
          if anchor not in s: raise SystemExit('follow pause anchor missing')
          s=s.replace(anchor,pause,1)
          oldrest="const restored = await page.evaluate(() => { const a = document.getElementById('r3AudioElement'); return { time: Number(a?.currentTime || 0), src: String(a?.currentSrc || a?.getAttribute('src') || ''), cfi: window.r3ReaderBridge?.current?.()?.start?.cfi || null }; });"
          newrest="const restored = await page.evaluate(() => { const a = document.getElementById('r3AudioElement'); return { debug: window.__r3AudioResumeV23Debug || null, waitDebug: window.__r3AudioResumeWaitV24Debug || null, time: Number(a?.currentTime || 0), src: String(a?.currentSrc || a?.getAttribute('src') || ''), cfi: window.r3ReaderBridge?.current?.()?.start?.cfi || null, mediaId: a?.dataset?.r3AudioId || '' }; });"
          if oldrest not in s: raise SystemExit('restore log marker missing')
          s=s.replace(oldrest,newrest,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -q "seek-smoke-v24" scripts/ebook_reader_viewport_word_smoke.mjs
          grep -q "__r3AudioResumeWaitMatchV24" scripts/ebook_reader_viewport_word_smoke.mjs
          grep -q "__r3AudioResumeV23Debug" scripts/ebook_reader_viewport_word_smoke.mjs
          grep -q "next-page-target" scripts/ebook_reader_viewport_word_smoke.mjs
          grep -q "mediaRangeCount" scripts/ebook_reader_viewport_word_smoke.mjs
      - name: Install browser runtime dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Prove exact start, page follow, CFI resume and no duplicate audio POST
        run: node scripts/ebook_reader_viewport_word_smoke.mjs

# v24: wait for matching chapter/frame before v23 restores CFI/media ownership
