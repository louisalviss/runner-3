name: Ebook Reader Viewport Word Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ebook_reader_viewport_word_smoke.mjs'
      - '.github/workflows/ebook-reader-viewport-word-smoke.yml'
      - 'ops/reader-core-deploy.trigger'

permissions:
  contents: read

jobs:
  deploy-v22:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "MISSING:$name" >&2; exit 2; }
            echo "PRESENT:$name"
          done
      - uses: actions/checkout@v4
        with:
          ref: 01d254a9d908d7fa584f0e974a989e330dee86c3
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose canonical mailbox with Reader v22
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('cloudflare/runner3-core')
          mailbox=root/'mailbox-entry.js'
          text=mailbox.read_text(encoding='utf-8')
          old='import app from "./audio-entry.js";'
          new='import app from "./artifact-library-reader-v7-github-audio-entry.js";'
          if old not in text: raise SystemExit('canonical mailbox import marker missing')
          mailbox.write_text(text.replace(old,new,1),encoding='utf-8')
          cfg_path=root/'wrangler.jsonc'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['main']='mailbox-entry.js'
          cfg_path.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/mailbox-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v22-word-index-follow-entry.js
          grep -q 'artifact-library-reader-v22-word-index-follow-entry.js' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          grep -q 'window.__r3AudioWordIndexFollowV22=true' cloudflare/runner3-core/artifact-library-reader-v22-word-index-follow-entry.js
      - name: Deploy Reader v22 Core
        working-directory: cloudflare/runner3-core
        shell: bash
        run: |
          set -euo pipefail
          export NO_COLOR=1
          npx --yes wrangler@4 deploy
      - name: Verify v22 live before browser proof
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          code="$(curl -sS -D /tmp/h -o /tmp/reader -w '%{http_code}' "$core/artifact-library/read?key=$encoded")"
          tr -d '\r' </tmp/h >/tmp/h.clean
          echo "READER_HTTP=$code"
          cat /tmp/h.clean
          if [ "$code" != 200 ]; then head -c 700 /tmp/reader; exit 1; fi
          grep -qi '^x-r3-reader-runtime: v22-word-index-page-follow$' /tmp/h.clean
          grep -qi '^x-r3-reader-patch-proof: v21+v22:visible-word-direction+page-step$' /tmp/h.clean
          grep -q 'window.__r3AudioWordIndexFollowV22=true' /tmp/reader
          mcode="$(curl -sS -o /tmp/mailbox.csv -w '%{http_code}' "$core/mailbox/results/smoke-reader-v22.csv")"
          test "$mcode" = 200
          grep -q 'pending' /tmp/mailbox.csv
          echo 'READER_V22_LIVE=PASS'

  viewport-word:
    needs: deploy-v22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      EBOOK_BROWSER_SMOKE_BOOK_KEY: core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Adapt exact browser proof to v22
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p='scripts/ebook_reader_viewport_word_smoke.mjs'
          s=open(p,encoding='utf-8').read()
          s=s.replace("const TEST_ID = 'seek-smoke-v16';","const TEST_ID = 'seek-smoke-v22';")
          s=s.replace("runtime.includes('v16')","runtime.includes('v22')")
          s=s.replace('live Reader is not v16:','live Reader is not v22:')
          old='window.__r3AudioViewportWordV15 === true && window.__r3AudioOuterGeometryV16 === true'
          new='window.__r3AudioViewportWordV15 === true && window.__r3AudioWordIndexFollowV22 === true'
          if old not in s: raise SystemExit('v16 runtime marker condition missing')
          s=s.replace(old,new,1)
          oldfollow="""  const beforeFollowCfi = started.cfi;
  const followIndex = Math.min(words.length - 2, candidate.visibleTokenOrdinal + 120);
  const followTime = followIndex * STEP_MS / 1000;
"""
          newfollow="""  const beforeFollowCfi = started.cfi;
  await page.evaluate(async () => { if (window.r3ReaderBridge?.next) await window.r3ReaderBridge.next(); });
  await page.waitForTimeout(260);
  const nextPageTarget = await snapshot();
  if (!nextPageTarget.cfi || nextPageTarget.cfi === beforeFollowCfi || nextPageTarget.visibleTokenOrdinal <= candidate.visibleTokenOrdinal) {
    throw new Error(`could not establish a real next-page word target: before=${beforeFollowCfi} next=${JSON.stringify(nextPageTarget)}`);
  }
  const followIndex = Math.min(words.length - 2, nextPageTarget.visibleTokenOrdinal);
  const followTime = followIndex * STEP_MS / 1000;
  await page.evaluate(async () => { if (window.r3ReaderBridge?.prev) await window.r3ReaderBridge.prev(); });
  await page.waitForTimeout(260);
  const backAtStart = await snapshot();
  if (backAtStart.cfi !== beforeFollowCfi) throw new Error(`could not return to start page before follow: before=${beforeFollowCfi} now=${backAtStart.cfi}`);
  console.log(JSON.stringify({ phase: 'next-page-target', beforeFollowCfi, nextPageCfi: nextPageTarget.cfi, followIndex, followTime, nextVisibleToken: nextPageTarget.visibleToken }));
"""
          if oldfollow not in s: raise SystemExit('follow target marker missing')
          s=s.replace(oldfollow,newfollow,1)
          oldlog="console.log(JSON.stringify({ phase: 'word-follow', beforeFollowCfi, followIndex, followTime, afterCfi: afterFollow.cfi, visibleTokenOrdinal: afterFollow.visibleTokenOrdinal, visibleToken: afterFollow.visibleToken }));"
          newlog="console.log(JSON.stringify({ phase: 'word-follow', debug: await page.evaluate(() => window.__r3AudioFollowV22Debug || window.__r3AudioFollowV21Debug || null), beforeFollowCfi, followIndex, followTime, afterCfi: afterFollow.cfi, visibleTokenOrdinal: afterFollow.visibleTokenOrdinal, visibleToken: afterFollow.visibleToken }));"
          if oldlog not in s: raise SystemExit('word-follow log marker missing')
          s=s.replace(oldlog,newlog,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -q "seek-smoke-v22" scripts/ebook_reader_viewport_word_smoke.mjs
          grep -q "__r3AudioWordIndexFollowV22" scripts/ebook_reader_viewport_word_smoke.mjs
          grep -q "next-page-target" scripts/ebook_reader_viewport_word_smoke.mjs
          grep -q "mediaRangeCount" scripts/ebook_reader_viewport_word_smoke.mjs
      - name: Install browser runtime dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Prove viewport-word seek, page follow and refresh resume
        run: node scripts/ebook_reader_viewport_word_smoke.mjs

# v22 production-like Range media + exact start + real next-page target follow + refresh resume proof
