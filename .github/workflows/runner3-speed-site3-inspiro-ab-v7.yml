name: Runner3 Speed Site3 Official PSI UI A-B-C

on:
  push:
    branches:
      - runner3-speed-site3-realistic-20260821
    paths:
      - '.github/workflows/runner3-speed-site3-inspiro-ab-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  WP_SITE_SLUG: runner3-speed-site3-realistic
  CHROME_PATH: /usr/bin/google-chrome

concurrency:
  group: runner3-speed-site3-realistic
  cancel-in-progress: true

jobs:
  psi-ui-abc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RUNNER3_PLUGIN_ZIP: /tmp/runner3-speed.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare corrected official PSI UI harness for v1.2.1
        run: |
          set -euo pipefail
          python - <<'PY'
          p='scripts/runner3-speed-site3-psi-ui-abc.mjs'
          s=open(p).read()
          s=s.replace("const input=p.locator('input').filter({has:p.locator('xpath=..')}).first();","const input=p.locator('input:visible').first();")
          s=s.replace("page.locator('.lh-gauge__percentage').first().waitFor({state:'visible',timeout:180000})","page.locator('.lh-gauge__percentage:visible').first().waitFor({state:'visible',timeout:180000})")
          s=s.replace("page.locator('.lh-gauge__percentage').first().waitFor({state:'attached',timeout:180000})","page.locator('.lh-gauge__percentage:visible').first().waitFor({state:'visible',timeout:180000})")
          s=s.replace("p.locator('.lh-gauge__percentage').first().waitFor({state:'visible',timeout:240000})","p.locator('.lh-gauge__percentage:visible').first().waitFor({state:'visible',timeout:240000})")
          s=s.replace("p.locator('.lh-gauge__percentage').first().waitFor({state:'attached',timeout:240000})","p.locator('.lh-gauge__percentage:visible').first().waitFor({state:'visible',timeout:240000})")
          s=s.replace("const scores=[...document.querySelectorAll('.lh-gauge__percentage')].map(x=>(x.textContent||'').trim()).filter(Boolean);","const scores=[...document.querySelectorAll('.lh-gauge__percentage')].filter(x=>{const r=x.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(x).visibility!=='hidden'&&getComputedStyle(x).display!=='none'}).map(x=>(x.textContent||'').trim()).filter(Boolean);")
          s=s.replace("const metrics=[...document.querySelectorAll('.lh-metric')].map(el=>({title:(el.querySelector('.lh-metric__title')?.textContent||'').trim(),value:(el.querySelector('.lh-metric__value')?.textContent||'').trim()}));","const metrics=[...document.querySelectorAll('.lh-metric')].filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).visibility!=='hidden'&&getComputedStyle(el).display!=='none'}).map(el=>({title:(el.querySelector('.lh-metric__title')?.textContent||'').trim(),value:(el.querySelector('.lh-metric__value')?.textContent||'').trim()}));")
          s=s.replace("if(i<5)await sleep(5000)","if(i<5)await sleep(15000)")
          open(p,'w').write(s)
          PY
          node --check scripts/runner3-speed-site3-psi-ui-abc.mjs
          php -l wordpress/runner3-speed/runner3-speed.php
          php -l wordpress/runner3-speed/dropins/advanced-cache.php
          grep -q 'Version: 1.2.1' wordpress/runner3-speed/runner3-speed.php
          grep -q "const CACHE_KEY_VERSION = 'v121'" wordpress/runner3-speed/runner3-speed.php
          ! grep -q "fetchpriority','high" wordpress/runner3-speed/runner3-speed.php
          grep -q "no-cache, must-revalidate, max-age=0" wordpress/runner3-speed/dropins/advanced-cache.php
          npm install --no-save playwright-core@1.58.2
          (cd wordpress && zip -qr /tmp/runner3-speed.zip runner3-speed)
          test -s /tmp/runner3-speed.zip
          test -n "${AUTOMATION_KEY:-}"
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json

      - name: Run PageSpeed Insights UI A-B-C
        run: |
          set -euo pipefail
          node scripts/runner3-speed-site3-psi-ui-abc.mjs
          test -s /tmp/runner3-speed-site3-psi-ui-abc.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-site3-psi-ui-abc.json'))
          assert r['status']=='PASS',r
          assert r['pluginVersion']=='1.2.1',r
          assert r['finalState']['pluginInstalled'] and r['finalState']['pluginActive'] and not r['finalState']['performanceOn'],r
          for state in ['A_NO_PLUGIN','B_ACTIVE_OFF','C_PERFORMANCE_ON']:
              assert r['states'][state]['mobile']['successfulRuns']==5,r
              assert r['states'][state]['desktop']['successfulRuns']==5,r
          print(json.dumps({'status':r['status'],'protocol':r['protocol'],'delta':r['delta'],'finalState':r['finalState']},indent=2))
          PY

      - name: Persist PSI UI evidence
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,datetime
          p='/tmp/runner3-speed-site3-psi-ui-abc.json'
          r=json.load(open(p)) if os.path.exists(p) else {'status':'MISSING'}
          r['recordedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          os.makedirs('/tmp/r3-psi-ui',exist_ok=True)
          json.dump(r,open('/tmp/r3-psi-ui/runner3-speed-site3-psi-ui-abc.latest.json','w'),indent=2)
          PY
          git config user.name 'runner3-speed-site3-psi-ui-bot'
          git config user.email 'runner3-speed-site3-psi-ui-bot@users.noreply.github.com'
          git fetch origin runner3-speed-site3-realistic-20260821
          git reset --hard origin/runner3-speed-site3-realistic-20260821
          mkdir -p ops/site-factory
          cp /tmp/r3-psi-ui/runner3-speed-site3-psi-ui-abc.latest.json ops/site-factory/runner3-speed-site3-psi-ui-abc.latest.json
          git add -- ops/site-factory/runner3-speed-site3-psi-ui-abc.latest.json
          if ! git diff --cached --quiet; then git commit -m 'test: record v1.2.1 official PSI UI A-B-C evidence' && git push origin HEAD:runner3-speed-site3-realistic-20260821; fi

      - name: Cleanup
        if: always()
        run: rm -f /tmp/wasmer-account.json /tmp/runner3-speed.zip
