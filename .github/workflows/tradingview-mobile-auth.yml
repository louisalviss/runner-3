name: TradingView Mobile Auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-mobile-auth.yml'
      - 'scripts/tradingview-mobile-remote.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb nginx apache2-utils >/dev/null
          npm install --no-save playwright-core@1.58.2 ws@8 >/dev/null
          curl -fsSL --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod 700 /tmp/cloudflared

      - name: Start mobile remote browser
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -base64 24 | tr -d '\n' | tr '/+' '_-')"
          printf '%s' "$PASS" >/tmp/tv-mobile-pass
          chmod 600 /tmp/tv-mobile-pass
          htpasswd -nbB tv "$PASS" | sudo tee /tmp/tv-mobile.htpasswd >/dev/null
          sudo chown root:www-data /tmp/tv-mobile.htpasswd
          sudo chmod 640 /tmp/tv-mobile.htpasswd

          sudo tee /etc/nginx/sites-available/tv-mobile >/dev/null <<'NGINX'
          server {
            listen 127.0.0.1:8080;
            server_name _;
            auth_basic "TradingView temporary auth";
            auth_basic_user_file /tmp/tv-mobile.htpasswd;
            location / {
              proxy_pass http://127.0.0.1:7070;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_read_timeout 3600s;
              add_header Cache-Control "no-store" always;
            }
          }
          NGINX
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sf /etc/nginx/sites-available/tv-mobile /etc/nginx/sites-enabled/tv-mobile
          sudo nginx -t
          sudo systemctl restart nginx

          nohup Xvfb :99 -screen 0 430x850x24 -nolisten tcp >/tmp/tv-xvfb.log 2>&1 &
          sleep 1
          nohup node scripts/tradingview-mobile-remote.mjs >/tmp/tv-mobile-browser.log 2>&1 &
          for i in $(seq 1 45); do
            grep -q 'TV_MOBILE_HTTP_READY' /tmp/tv-mobile-browser.log && break
            sleep 1
          done
          grep -q 'TV_MOBILE_HTTP_READY' /tmp/tv-mobile-browser.log || { tail -80 /tmp/tv-mobile-browser.log; exit 4; }

          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 >/tmp/tv-cloudflared.log 2>&1 &
          for i in $(seq 1 45); do
            URL="$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/tv-cloudflared.log | head -n1 || true)"
            [ -n "$URL" ] && break
            sleep 1
          done
          [ -n "${URL:-}" ] || { tail -80 /tmp/tv-cloudflared.log; exit 5; }
          printf '%s' "$URL" >/tmp/tv-mobile-url
          chmod 600 /tmp/tv-mobile-url
          echo 'TV_MOBILE_REMOTE_READY=true'

      - name: Publish encrypted one-time connection
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat /tmp/tv-mobile-url)"
          PASS="$(cat /tmp/tv-mobile-pass)"
          cat >/tmp/tv-mobile-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAyWpbCt7lVxNM8eGyLNni
          yaDJsg8xeJCFhzt8OwkDgw+PjiLCGm8lfxl+4EJikmLCRFYtlo49jD7meNNTHvO+
          mL9zhuVeSzPJ/9yMW7Zt6r4nvPoou9kF+dq1G5xsIkFJZsXNdiCtjeBQsn0pR2gV
          woZ10ddQO1FV5KQTjAx+Zxn0wnTS7EfGYn0OlaLt9PTZT3Zn2dmG8uWrkQxKwytk
          R/vc+eaZjxrY+z17K1xZ30I5FoEg/7mZre7k/YSyFW5hpTV9u6dS6UZ3aLbIGSl6
          H9nVabSG8Cx7++1KrXXsM2rk1v2o/RPOKsCzN5JO3AuorvxAWGd5H+s8CQATd+ks
          CJuxaOgLTQxswcNChxwmubBoSOJ5UcMKAgvfcC6PAJHvwj5IwXgBHEBP5ZjjkM6y
          NTpHdBJAyqzOTJ6UWEZbw2rdHlmIsA4Sof0Cx5JjDmoV8m5rLCcuB4hsamUHw0+R
          OIL9hdmpq7vXovwZftY/VdHgHA1EVokb2nGtu3Axb/v5AgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          printf 'URL=%s\nUSER=tv\nPASSWORD=%s\n' "$URL" "$PASS" >/tmp/tv-mobile-connection.txt
          openssl pkeyutl -encrypt -pubin -inkey /tmp/tv-mobile-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/tv-mobile-connection.txt | base64 -w0 >/tmp/tv-mobile-connection.enc.b64
          mkdir -p ops/tradingview
          cp /tmp/tv-mobile-connection.enc.b64 ops/tradingview/mobile-connection.enc.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/tradingview/mobile-connection.enc.b64
          git commit -m 'publish encrypted TradingView mobile connection' >/dev/null
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main >/dev/null
          rm -f /tmp/tv-mobile-connection.txt /tmp/tv-mobile-public.pem /tmp/tv-mobile-connection.enc.b64
          echo 'TV_MOBILE_CONNECTION_PUBLISHED=true'

      - name: Wait for TradingView authorization
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 750); do
            [ -f /tmp/tv-auth-done ] && break
            sleep 2
          done
          [ -f /tmp/tv-auth-done ] || { echo 'TV_AUTH_TIMEOUT'; exit 6; }
          test -s /tmp/tv-storage-state.json || { echo 'TV_STORAGE_STATE_MISSING'; exit 7; }
          echo 'TV_AUTH_RECEIVED=true'

      - name: Encrypt TradingView-only session
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { echo 'Encryption secret unavailable'; exit 2; }
          echo "::add-mask::$AUTOMATION_KEY"
          python3 - <<'PY'
          import json
          p='/tmp/tv-storage-state.json'
          s=json.load(open(p))
          assert s.get('cookies'), 'No TradingView cookies were captured'
          for c in s.get('cookies',[]):
              d=c.get('domain','').lstrip('.')
              assert d=='tradingview.com' or d.endswith('.tradingview.com'), f'Non-TradingView cookie detected: {d}'
          for o in s.get('origins',[]):
              assert o.get('origin','').split('/')[2].endswith('tradingview.com'), 'Non-TradingView origin detected'
          print('TV_STATE_SCOPE_CHECK=PASS')
          PY
          mkdir -p ops/tradingview
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
            -in /tmp/tv-storage-state.json -out ops/tradingview/session-state.json.aes
          rm -f ops/tradingview/mobile-connection.enc.b64 ops/tradingview/connection.enc.b64 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ops/tradingview
          git commit -m 'persist encrypted TradingView-only session' >/dev/null
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main >/dev/null
          echo 'TV_SESSION_PERSISTED=true'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          pkill -f tradingview-mobile-remote.mjs || true
          pkill -f cloudflared || true
          rm -f /tmp/tv-mobile-pass /tmp/tv-mobile-url /tmp/tv-mobile.htpasswd /tmp/tv-storage-state.json /tmp/tv-auth-done
