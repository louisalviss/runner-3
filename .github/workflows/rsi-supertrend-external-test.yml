name: RSI SuperTrend External Test

on:
  push:
    branches: [main]
    paths:
      - 'research/rsi_supertrend_external_test.py'
      - '.github/workflows/rsi-supertrend-external-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run exact Pine replication on Binance data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q -U pandas numpy requests tabulate
          python3 research/rsi_supertrend_external_test.py --out evidence/rsi-supertrend-external-test
      - name: Persist results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/rsi-supertrend-external-test || true
          git commit -m 'Publish RSI SuperTrend external test [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main || true
