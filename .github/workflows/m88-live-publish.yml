name: M88 Live Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-live-publish.yml'
      - 'm88_odds.py'
      - 'render_m88_live.py'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: m88-live-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install VPN tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl

      - name: Collect Thailand relays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence publish
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          rs=[r for r in rows if (r.get('CountryShort') or '').upper()=='TH' and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
          rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
          rs=rs[:10]
          if not rs: raise SystemExit('No Thailand VPN Gate relay currently available')
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          for i,r in enumerate(rs):
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              pathlib.Path(f'/tmp/vpn{i}.ovpn').write_text(cfg)
          print('TH_RELAYS='+str(len(rs)))
          PY

      - name: Connect first working Thailand relay
        shell: bash
        run: |
          set -euo pipefail
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.236.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.236.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.236.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.236.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null

          connected=0
          for cfg in /tmp/vpn*.ovpn; do
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/openvpn.log
            sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            ok=0
            for i in {1..12}; do
              sleep 1
              if grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null; then ok=1; break; fi
              if grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|Exiting due to fatal error|Connection refused' /tmp/openvpn.log 2>/dev/null; then break; fi
            done
            if [ "$ok" = 1 ]; then
              trace=$(sudo ip netns exec vpnns curl -fsS --max-time 10 'https://www.cloudflare.com/cdn-cgi/trace' 2>/dev/null | grep -E '^(ip|loc|warp)=' || true)
              if echo "$trace" | grep -q '^loc=TH$'; then
                echo "$trace" | tee evidence/egress.txt
                connected=1
                break
              fi
            fi
          done
          test "$connected" = 1

      - name: Fetch M88 public guest soccer book
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          common={
            'sport_id':'10','lang_id':'en','view_type':'0','leagues':'999',
            'odds_type':'3','odds_group':'3','view_date':'0','time_filter':'0',
            'category':'0','branch_code':'','currency':'VND','is_full':'true',
            'prev_params':'','version':'','top_x':0,'is_stream':'false',
            'is_live_center':'false','currentMenu':'spesificSport','prevMenu':'',
            'method':'LoadOddsData'
          }
          for name,slot in [('live','1'),('today','2'),('early','3')]:
            p=dict(common)
            p['currentTimeSlot']=slot
            p['display_type']='1'+slot
            if slot=='3': p['view_date']='1'
            pathlib.Path(f'/tmp/{name}-request.json').write_text(json.dumps(p,separators=(',',':')))
          PY

          fetch_scope() {
            name="$1"
            sudo ip netns exec vpnns curl -L -sS --fail \
              --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
              -X POST 'https://msports.m88.com/api/v1/m88/data/main' \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Content-Type: application/json' \
              -H 'Authorization: Bearer GUEST' \
              --data-binary @"/tmp/${name}-request.json" \
              -o "evidence/${name}.json"
          }

          fetch_scope live

          for name in today early; do
            if fetch_scope "$name"; then
              echo "OPTIONAL_${name^^}=OK"
            else
              echo "OPTIONAL_${name^^}=UNAVAILABLE"
              rm -f "evidence/${name}.json"
            fi
          done

          python3 - <<'PY'
          import json,pathlib
          live=json.loads(pathlib.Path('evidence/live.json').read_text())
          if live.get('status') != 1:
              raise SystemExit('live: M88 guest API status was not 1')
          for name in ['today','early']:
              p=pathlib.Path(f'evidence/{name}.json')
              if not p.exists():
                  continue
              try:
                  d=json.loads(p.read_text())
                  if d.get('status') != 1:
                      p.unlink()
              except Exception:
                  p.unlink(missing_ok=True)
          print('M88_LIVE_API_OK')
          PY

      - name: Normalize direct book and render dashboards
        shell: bash
        run: |
          set -euo pipefail
          python3 m88_odds.py \
            --input-dir evidence \
            --output-json evidence/m88_odds.json \
            --output-csv evidence/m88_odds.csv \
            --odds-format decimal
          python3 - <<'PY'
          import json,pathlib
          src=json.loads(pathlib.Path('evidence/m88_odds.json').read_text())
          matches=src.get('matches') or []
          live=[m for m in matches if m.get('scope')=='live']
          selections=sum(len(line.get('prices') or []) for m in matches for lines in (m.get('markets') or {}).values() for line in lines)
          live_selections=sum(len(line.get('prices') or []) for m in live for lines in (m.get('markets') or {}).values() for line in lines)
          if not live or live_selections < 20:
              raise SystemExit(f'Unsafe live snapshot: matches={len(live)} selections={live_selections}')
          scopes=sorted({m.get('scope') for m in matches if m.get('scope')})
          src['selection_count']=selections
          src['live_selection_count']=live_selections
          src['available_scopes']=scopes
          src['source_mode']='direct_m88_guest_full' if {'live','today','early'}.issubset(scopes) else 'direct_m88_guest_partial'
          pathlib.Path('publish/data.json').write_text(json.dumps(src,separators=(',',':'),ensure_ascii=False),encoding='utf-8')
          print('DIRECT_MATCHES='+str(len(matches)))
          print('LIVE_MATCHES='+str(len(live)))
          print('AVAILABLE_SCOPES='+','.join(scopes))
          PY
          python3 render_m88_live.py \
            --input evidence/m88_odds.json \
            --output publish/index.html
          test -s publish/index.html
          test -s publish/today.html
          test -s publish/early.html

      - name: Publish latest direct snapshot branch
        shell: bash
        run: |
          set -euo pipefail
          cp publish/data.json /tmp/m88-data.json
          cp publish/index.html /tmp/m88-index.html
          cp publish/today.html /tmp/m88-today.html
          cp publish/early.html /tmp/m88-early.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan m88-live-data
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/m88-data.json data.json
          cp /tmp/m88-index.html index.html
          cp /tmp/m88-today.html today.html
          cp /tmp/m88-early.html early.html
          printf '%s\n' 'M88 direct guest feed generated by GitHub Actions.' > README.md
          touch .nojekyll
          git add data.json index.html today.html early.html README.md .nojekyll
          git commit -m "Update M88 direct odds $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin HEAD:m88-live-data
