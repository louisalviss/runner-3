name: Wasmer Admin Theme Handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasmer-admin-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - name: Package Runner3 theme
        shell: bash
        run: |
          set -euo pipefail
          cd wordpress-site/wp-content/themes
          zip -qr "$GITHUB_WORKSPACE/runner3-starter.zip" runner3-starter
          test -s "$GITHUB_WORKSPACE/runner3-starter.zip"

      - name: Generate ephemeral handoff key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/session-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/session-private.pem -pubout -out session-public.pem >/dev/null 2>&1
          chmod 600 /tmp/session-private.pem
          echo "HANDOFF_RUN_ID=$GITHUB_RUN_ID"

      - name: Upload public handoff key
        uses: actions/upload-artifact@v4
        with:
          name: wasmer-handoff-key-${{ github.run_id }}
          path: session-public.pem
          retention-days: 1

      - name: Wait for encrypted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/wasmer-session/${GITHUB_RUN_ID}.b64?ref=${GITHUB_SHA}"
          found=0
          for i in $(seq 1 150); do
            if curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" -o /tmp/session.b64 2>/dev/null; then
              found=1
              break
            fi
            sleep 2
          done
          if [ "$found" -ne 1 ]; then
            echo "Encrypted handoff was not received"
            exit 1
          fi
          base64 -d /tmp/session.b64 > /tmp/session.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/session-private.pem \
            -in /tmp/session.enc \
            -out /tmp/session.json \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          python - <<'PY'
          import json
          x=json.load(open('/tmp/session.json'))
          for k in ['wasmer_user','wasmer_password','app_name']:
              if not x.get(k): raise SystemExit(f'missing {k}')
          for v in x.values():
              if isinstance(v,str): print('::add-mask::'+v)
          print('HANDOFF_DECRYPTED=true')
          PY
          shred -u /tmp/session.enc /tmp/session.b64 || true

      - name: Install browser automation
        run: npm install --no-save playwright-core@1.58.2

      - name: Magic login and activate Runner3 theme
        shell: bash
        run: |
          set -euo pipefail
          cat > wasmer-admin.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          import path from 'path';
          const id=JSON.parse(fs.readFileSync('/tmp/session.json','utf8'));
          const siteUrl='https://'+id.app_name+'.wasmer.app';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();
          const safe=s=>(s||'').replaceAll(id.wasmer_user,'[MASKED_USER]').replaceAll(id.wasmer_password,'[MASKED_PASSWORD]');
          async function body(){ return (await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim(); }
          async function report(label){ console.log(label+'_URL='+page.url().replace(/([?&](?:token|magiclogin|secret|challenge)=)[^&]+/ig,'$1[MASKED]')); console.log(label+'_BODY='+safe((await body()).slice(0,1200))); }
          async function clickIf(loc){ if(await loc.count()){ await loc.first().click({timeout:10000}).catch(()=>{}); return true; } return false; }

          async function loginWasmer(){
            await page.goto('https://wasmer.io/login',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(1000);
            let u=page.locator('input[name="username"],input[name="email"],input[autocomplete="username"],input[type="text"]').first();
            if(!await u.count()) throw new Error('Wasmer username field not found');
            await u.fill(id.wasmer_user);
            await clickIf(page.getByRole('button',{name:/continue|log in|login|next/i}));
            await page.waitForTimeout(900);
            let p=page.locator('input[type="password"]').first();
            if(!await p.count()){
              await page.keyboard.press('Enter');
              await page.waitForTimeout(900);
              p=page.locator('input[type="password"]').first();
            }
            if(!await p.count()) throw new Error('Wasmer password field not found');
            await p.fill(id.wasmer_password);
            if(!await clickIf(page.getByRole('button',{name:/log in|login|continue|sign in/i}))) await page.keyboard.press('Enter');
            await page.waitForTimeout(2200);
            if(/\/login/i.test(page.url())) { await report('WASMER_LOGIN_FAILED'); throw new Error('Wasmer login failed'); }
            console.log('WASMER_LOGIN=true');
          }

          async function magicLogin(){
            await page.goto(`https://wasmer.io/apps/${id.wasmer_user}/${id.app_name}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(1800);
            await report('APP_DASHBOARD');
            let admin=page.getByRole('link',{name:/wordpress admin/i}).first();
            if(!await admin.count()) admin=page.getByRole('button',{name:/wordpress admin/i}).first();
            if(!await admin.count()) admin=page.getByText(/wordpress admin/i).first();
            if(!await admin.count()) throw new Error('WordPress Admin magic-login control not found');
            await admin.click();
            await page.waitForTimeout(2500);
            if(!/wp-admin/i.test(page.url())){
              const popup=page.context().pages().at(-1);
              if(popup && popup!==page){ await popup.waitForLoadState('domcontentloaded').catch(()=>{}); }
            }
            const pages=page.context().pages();
            const wp=pages.find(p=>/wp-admin/i.test(p.url())) || page;
            if(wp!==page){
              await wp.bringToFront();
              return wp;
            }
            if(!/wp-admin/i.test(page.url())) { await report('MAGIC_LOGIN_FAILED'); throw new Error('Magic login did not reach wp-admin'); }
            return page;
          }

          async function installTheme(wp){
            await wp.goto(siteUrl+'/wp-admin/theme-install.php',{waitUntil:'domcontentloaded',timeout:90000});
            await wp.waitForTimeout(1300);
            let upload=wp.getByRole('button',{name:/upload theme/i}).first();
            if(await upload.count()) await upload.click();
            await wp.waitForTimeout(500);
            const file=wp.locator('input[type="file"]').first();
            if(!await file.count()) throw new Error('Theme upload field not found');
            await file.setInputFiles(path.resolve('runner3-starter.zip'));
            const install=wp.getByRole('button',{name:/install now/i}).first();
            if(!await install.count()) throw new Error('Install Now button not found');
            await install.click();
            await wp.waitForTimeout(5000);
            const activate=wp.getByRole('link',{name:/activate/i}).first();
            if(await activate.count()){ await activate.click(); await wp.waitForTimeout(2500); }
            await wp.goto(siteUrl,{waitUntil:'domcontentloaded',timeout:90000});
            await wp.waitForTimeout(1400);
            const txt=(await wp.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim();
            console.log('RUNNER3_THEME_MARKER=' + /Built as a practical starter|Runner3 Site|Ready to edit/i.test(txt));
            console.log('LIVE_SITE_URL='+siteUrl);
            console.log('LIVE_SITE_SAMPLE='+txt.slice(0,1000));
          }

          try{
            await loginWasmer();
            const wp=await magicLogin();
            console.log('WP_MAGIC_LOGIN=true');
            await installTheme(wp);
            console.log('ADMIN_THEME_COMPLETE=true');
          } finally { await browser.close(); }
          JS
          node wasmer-admin.mjs

      - name: Destroy ephemeral secrets
        if: always()
        shell: bash
        run: |
          shred -u /tmp/session-private.pem /tmp/session.json 2>/dev/null || true
          rm -f session-public.pem wasmer-admin.mjs
