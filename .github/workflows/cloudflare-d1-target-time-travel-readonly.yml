name: Cloudflare D1 Target Time Travel Read-only Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-target-time-travel-readonly
  cancel-in-progress: false

jobs:
  target-bookmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_TARGET_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce target-only GET and no-restore contracts offline
        run: |
          python3 -m py_compile scripts/cloudflare_d1_target_time_travel_readonly.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_target_time_travel_readonly.py' -v
      - name: Verify target D1 production backend and current bookmark using read-only GET
        run: python3 scripts/cloudflare_d1_target_time_travel_readonly.py
      - name: Preserve sanitized eligibility without raw bookmark
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-target-time-travel-readonly-eligibility
          path: migration-out/d1-target-time-travel-readonly-gate.json
          if-no-files-found: error
          retention-days: 2
