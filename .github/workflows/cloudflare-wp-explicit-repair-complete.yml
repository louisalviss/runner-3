# Dedicated *explicitly user-triggered* migration action.
# Run workflow itself authorizes the one target-only conditional metadata repair
# and the remaining WP Media R2 copies; no mode dropdown that can fall back to
# read-only preflight. No schedules, push, PR triggers, or source deletion.
name: Cloudflare WP EXPLICIT Repair + Complete

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-target-r2-native-canary
  cancel-in-progress: false

jobs:
  repair-and-complete:
    name: Conditional target repair then WP SHA parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_TARGET_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_TARGET_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_TARGET_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_TARGET_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce global R2 Class A billing HOLD before any R2 request
        run: python3 scripts/cloudflare_r2_migration_gate.py
      - name: Install S3 SDK
        run: python3 -m pip install --quiet boto3
      - name: Validate all safety contracts before writing
        run: |
          python3 -m py_compile scripts/cloudflare_r2_native_canary.py scripts/cloudflare_r2_native_batch.py scripts/cloudflare_r2_native_large.py scripts/cloudflare_r2_wp_complete.py scripts/cloudflare_r2_wp_repair_metadata.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_native_batch.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_native_large.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_wp_complete.py
          PYTHONPATH=scripts python3 scripts/tests/test_cloudflare_r2_wp_repair_metadata.py
      - name: Verify the exact 14-byte canary SHA and CacheControl drift READ ONLY
        run: python3 scripts/cloudflare_r2_wp_repair_metadata.py --mode preflight
      - name: Apply exactly one ETag-guarded target-only CacheControl repair
        run: python3 scripts/cloudflare_r2_wp_repair_metadata.py --mode repair
      - name: Copy missing WP Media objects and verify all source-target SHA metadata
        run: python3 scripts/cloudflare_r2_wp_complete.py
      - name: Keep sanitized run receipts on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-wp-explicit-repair-and-copy-receipts
          path: |
            migration-out/wp-metadata-repair.json
            migration-out/wp-complete-progress.json
            migration-out/receipt.json
          if-no-files-found: warn
          retention-days: 7
