name: M88 Canonical Publisher

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'M88 Live Publisher'
      - 'M88 zero-touch odds collector'
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-canonical-publish.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: m88-canonical-publisher
  cancel-in-progress: true

jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch independent candidate feeds without CDN cache
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidates out

          # Resolve the branch through GitHub Contents API, not raw.githubusercontent CDN.
          gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/data.json?ref=m88-live-data" \
            > candidates/direct.json || true

          # Download the current stable fallback release through GitHub API semantics.
          gh release download m88-live \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'm88-fullbook.json' \
            --dir candidates \
            --clobber || true
          if [ -f candidates/m88-fullbook.json ]; then
            mv candidates/m88-fullbook.json candidates/fallback.json
          fi
          ls -lh candidates || true

      - name: Select canonical source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return None

          def iso_age(value):
              if not value:
                  return None
              try:
                  dt = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return max(0, int((now - dt.astimezone(timezone.utc)).total_seconds()))
              except Exception:
                  return None

          direct = load('candidates/direct.json')
          fallback = load('candidates/fallback.json')

          d_matches = (direct or {}).get('matches') or []
          d_selections = (direct or {}).get('selection_count')
          if d_selections is None:
              d_selections = sum(
                  len(line.get('prices') or [])
                  for m in d_matches
                  for lines in (m.get('markets') or {}).values()
                  for line in lines
              )
          d_age = iso_age((direct or {}).get('generated_at'))
          d_scopes = sorted(set((direct or {}).get('available_scopes') or []) | {
              str(m.get('scope')) for m in d_matches if m.get('scope')
          })
          d_full_scopes = {'live', 'today', 'early'}.issubset(set(d_scopes))
          d_valid = bool(
              direct and len(d_matches) >= 50 and d_selections >= 500
              and d_full_scopes
              and d_age is not None and d_age <= 900
              and 'M88' in str((direct or {}).get('source', ''))
          )

          f_records = (fallback or {}).get('records') or []
          f_age = iso_age((fallback or {}).get('collected_at_utc'))
          f_health = (fallback or {}).get('market_health') or {}
          f_join_ok = bool(f_health) and all(
              float(v.get('join_ratio') or 0) >= 0.99 and int(v.get('unresolved_count') or 0) == 0
              for v in f_health.values()
          )
          f_valid = bool(
              fallback and len(f_records) >= 300 and f_join_ok
              and f_age is not None and f_age <= 1200
          )

          direct_health = {
              'available': direct is not None,
              'valid': d_valid,
              'age_seconds': d_age,
              'matches': len(d_matches),
              'selections': d_selections,
              'available_scopes': d_scopes,
              'full_scopes': d_full_scopes,
              'freshness_limit_seconds': 900,
          }
          fallback_health = {
              'available': fallback is not None,
              'valid': f_valid,
              'age_seconds': f_age,
              'records': len(f_records),
              'join_ok': f_join_ok,
              'freshness_limit_seconds': 1200,
          }

          if d_valid:
              source_mode = 'direct_m88_guest'
              primary = direct
          elif f_valid:
              source_mode = 'fallback_888score_mansion88'
              primary = fallback
          else:
              raise SystemExit(
                  'No safe M88 source: direct=' + json.dumps(direct_health) +
                  ' fallback=' + json.dumps(fallback_health)
              )

          health = {
              'schema_version': 2,
              'generated_at_utc': now.isoformat(),
              'source_mode': source_mode,
              'direct': direct_health,
              'fallback_888score': fallback_health,
          }
          canonical = {
              **health,
              'primary_data': primary,
          }

          Path('out/m88-canonical.json').write_text(
              json.dumps(canonical, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )
          Path('out/m88-health.json').write_text(
              json.dumps(health, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )
          Path('out/m88-direct.json').write_text(
              json.dumps(direct if direct is not None else {'available': False}, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )
          Path('out/m88-fallback-888score.json').write_text(
              json.dumps(fallback if fallback is not None else {'available': False}, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )
          print(json.dumps(health, ensure_ascii=False, indent=2))
          PY

      - name: Publish stable canonical release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view m88-canonical --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create m88-canonical \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'M88 Canonical Odds' \
              --notes 'Zero-touch canonical M88 feed: direct MSports guest API primary, 888score Mansion88 fallback.'
          fi
          gh release upload m88-canonical \
            --repo "$GITHUB_REPOSITORY" \
            out/m88-canonical.json \
            out/m88-health.json \
            out/m88-direct.json \
            out/m88-fallback-888score.json \
            --clobber

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m88-canonical-${{ github.run_id }}
          path: out/
          retention-days: 3
          if-no-files-found: warn
