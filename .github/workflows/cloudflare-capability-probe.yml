name: Cloudflare Capability Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-capability-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-capability-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Probe non-destructive Cloudflare capabilities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error, datetime
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          if not token or not account:
              raise SystemExit('cloudflare_credentials_missing')
          base='https://api.cloudflare.com/client/v4'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: data=json.loads(e.read().decode())
                  except Exception: data={}
                  return e.code,data
          code,data=get('/zones?per_page=50')
          zones=data.get('result') or [] if data.get('success') else []
          names=sorted(str(z.get('name') or '') for z in zones if z.get('name'))
          pntr=[z for z in zones if str(z.get('name') or '').lower()=='pntr.dev']

          c,d=get(f'/accounts/{account}/workers/scripts')
          scripts=d.get('result') or [] if d.get('success') else []
          worker_names=sorted(str(x.get('id') or x.get('name') or '') for x in scripts if (x.get('id') or x.get('name')))

          p,pd=get(f'/accounts/{account}/pages/projects?per_page=50')
          projects=pd.get('result') or [] if pd.get('success') else []
          project_names=sorted(str(x.get('name') or x.get('id') or '') for x in projects if (x.get('name') or x.get('id')))
          page_errors=[]
          for e in (pd.get('errors') or []):
              if isinstance(e,dict):
                  page_errors.append({'code':e.get('code'),'message':str(e.get('message') or '')[:300]})

          out={
            'status':'ok' if code==200 and data.get('success') and c==200 and d.get('success') and p==200 and pd.get('success') else 'partial',
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'zonesHttp':code,
            'zonesReadable':bool(data.get('success')),
            'zoneNames':names,
            'pntrZoneVisible':bool(pntr),
            'workersHttp':c,
            'workersReadable':bool(d.get('success')),
            'wordpressEdgeProxyVisible':'wordpress-edge-proxy' in worker_names,
            'pagesHttp':p,
            'pagesReadable':bool(pd.get('success')),
            'pagesProjectNames':project_names,
            'pagesErrors':page_errors,
          }
          os.makedirs('/tmp/cloudflare-capability',exist_ok=True)
          open('/tmp/cloudflare-capability/latest.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps({k:out[k] for k in ('status','zonesReadable','zoneNames','pntrZoneVisible','workersReadable','wordpressEdgeProxyVisible','pagesHttp','pagesReadable','pagesProjectNames','pagesErrors')},indent=2))
          PY

      - name: Persist safe capability result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/cloudflare-capability/latest.json || printf '{"status":"failed","detail":"capability_result_missing"}\n' >/tmp/cloudflare-capability/latest.json
          cp /tmp/cloudflare-capability/latest.json /tmp/cloudflare-capability-safe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/cloudflare-capability
            cp /tmp/cloudflare-capability-safe.json ops/cloudflare-capability/latest.json
            git add ops/cloudflare-capability/latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Persist Cloudflare capability: ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 3
