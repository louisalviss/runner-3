name: Reader v67 Build Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reader-v65-build-validation.yml'
      - 'scripts/build_reader_audio_core_browser_bundle.mjs'
      - 'scripts/patch_reader_v61_safari_boot_geometry.py'
      - 'scripts/check_reader_v61_safari_boot_geometry.py'
      - 'scripts/patch_reader_v62_paginated_vertical_clamp.py'
      - 'scripts/check_reader_v62_paginated_vertical_clamp.py'
      - 'scripts/patch_reader_v64_progress_repair.py'
      - 'scripts/check_reader_v64_progress_repair.py'
      - 'scripts/patch_reader_v65_sync_manage.py'
      - 'scripts/check_reader_v65_sync_manage.py'
      - 'scripts/patch_reader_v65_fast_library_index.py'
      - 'scripts/check_reader_v65_fast_library_index.py'
      - 'scripts/reader_v65_fast_library_index_smoke.mjs'
      - 'scripts/patch_reader_v65_home_screen_startup.py'
      - 'scripts/check_reader_v65_home_screen_startup.py'
      - 'scripts/patch_reader_v66_standalone_inner_top.py'
      - 'scripts/check_reader_v66_standalone_inner_top.py'
      - 'scripts/patch_reader_v67_stage_geometry_perf.py'
      - 'scripts/check_reader_v67_stage_geometry_perf.py'
      - 'scripts/check_reader_v36_home_screen_safe_area.py'
      - 'cloudflare/runner3-core/artifact-library-reader-v36-home-screen-safe-area-entry.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate Reader through v67
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save esbuild
          node scripts/build_reader_audio_core_browser_bundle.mjs
          python3 scripts/check_reader_v61_safari_boot_geometry.py
          python3 scripts/check_reader_v62_paginated_vertical_clamp.py
          python3 scripts/check_reader_v65_sync_manage.py
          python3 scripts/check_reader_v65_fast_library_index.py
          python3 scripts/check_reader_v65_home_screen_startup.py
          python3 scripts/check_reader_v66_standalone_inner_top.py
          python3 scripts/check_reader_v67_stage_geometry_perf.py
          python3 scripts/check_reader_v36_home_screen_safe_area.py
          node scripts/reader_v65_fast_library_index_smoke.mjs
          node --check cloudflare/runner3-core/artifact-library-simple-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v2-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v5-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v36-home-screen-safe-area-entry.js
          node --check cloudflare/runner3-core/opportunity-router-entry.js
          echo 'READER_V67_BUILD_VALIDATION=PASS'