name: Reader v66 Build Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reader-v65-build-validation.yml'
      - 'scripts/build_reader_audio_core_browser_bundle.mjs'
      - 'scripts/patch_reader_v65_sync_manage.py'
      - 'scripts/check_reader_v65_sync_manage.py'
      - 'scripts/patch_reader_v66_external_manage_asset.py'
      - 'scripts/check_reader_v66_external_manage_asset.py'
      - 'scripts/reader_v66_webkit_smoke.mjs'
      - 'cloudflare/runner3-core/reader-manage-ui-v66-asset-source.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build full Reader chain through v66
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save esbuild playwright
          npx playwright install --with-deps webkit
          node scripts/build_reader_audio_core_browser_bundle.mjs
          node --check cloudflare/runner3-core/artifact-library-simple-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v2-entry.js
          node --check cloudflare/runner3-core/opportunity-router-entry.js
          node --check cloudflare/runner3-core/reader-manage-ui-v66-asset-source.js
          python3 scripts/check_reader_v65_sync_manage.py
          python3 scripts/check_reader_v66_external_manage_asset.py
          node scripts/reader_v66_webkit_smoke.mjs
          echo 'READER_V66_BUILD_VALIDATION=PASS'
