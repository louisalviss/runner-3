name: Runner3 Speed Actions Probe

on:
  push:
    branches:
      - runner3-speed-site3-realistic-20260821
    paths:
      - '.github/workflows/runner3-speed-actions-probe.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read latest workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=runner3-speed-site3-realistic-20260821&per_page=30" > /tmp/runs.json
          python - <<'PY'
          import json,datetime,os
          d=json.load(open('/tmp/runs.json'))
          rows=[]
          for r in d.get('workflow_runs',[]):
              rows.append({k:r.get(k) for k in ['id','name','status','conclusion','head_sha','event','created_at','updated_at','html_url']})
          out={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'runs':rows}
          os.makedirs('ops/site-factory',exist_ok=True)
          json.dump(out,open('ops/site-factory/runner3-speed-actions-probe.latest.json','w'),indent=2)
          PY
      - name: Persist probe
        run: |
          set -euo pipefail
          git config user.name 'runner3-speed-actions-probe-bot'
          git config user.email 'runner3-speed-actions-probe-bot@users.noreply.github.com'
          git add -- ops/site-factory/runner3-speed-actions-probe.latest.json
          if ! git diff --cached --quiet; then git commit -m 'test: record Runner3 Speed Actions status' && git push origin HEAD:runner3-speed-site3-realistic-20260821; fi
