name: Reader v69 Audio Dock Reading Inset Live Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reader-v39-home-screen-live-smoke.yml'
  workflow_run:
    workflows: ["Runner3 Core Production Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify v69 dynamic audio dock reading inset
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          require_literal() {
            local file="$1" marker="$2" label="$3"
            if grep -Fq -- "$marker" "$file"; then echo "PASS:$label"; else echo "FAIL:$label marker=$marker"; return 1; fi
          }
          forbid_literal() {
            local file="$1" marker="$2" label="$3"
            if grep -Fq -- "$marker" "$file"; then echo "FAIL:$label forbidden=$marker"; return 1; else echo "PASS:$label"; fi
          }

          code="$(curl --http1.1 --retry 2 --retry-all-errors --connect-timeout 8 -sS -D /tmp/library.h -o /tmp/library.html -w '%{http_code}' "$core/artifact-library" || true)"
          tr -d '\r' </tmp/library.h >/tmp/library.h.clean 2>/dev/null || true
          startup="$(grep -i '^x-r3-reader-ios-startup-viewport:' /tmp/library.h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
          echo "LIBRARY_V69_STARTUP http=$code startup=$startup"
          test "$code" = 200
          test "$startup" = 'full-bleed-v68'
          require_literal /tmp/library.html 'name="apple-mobile-web-app-status-bar-style" content="black-translucent"' library_full_bleed_statusbar

          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          reader_ok=0
          for attempt in $(seq 1 12); do
            code="$(curl --http1.1 --retry 2 --retry-all-errors --connect-timeout 8 -sS -D /tmp/reader.h -o /tmp/reader.html -w '%{http_code}' "$core/artifact-library/read?key=$encoded" || true)"
            tr -d '\r' </tmp/reader.h >/tmp/reader.h.clean 2>/dev/null || true
            startup="$(grep -i '^x-r3-reader-ios-startup-viewport:' /tmp/reader.h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            statusbar="$(grep -i '^x-r3-reader-ios-statusbar-viewport:' /tmp/reader.h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            forced="$(grep -i '^x-r3-reader-ios-forced-inset:' /tmp/reader.h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            echo "READER_V69_GEOMETRY attempt=$attempt http=$code startup=$startup statusbar=$statusbar forced=$forced bytes=$(wc -c </tmp/reader.html 2>/dev/null || echo 0)"
            if [ "$code" = 200 ] && [ "$startup" = 'full-bleed-v68' ] && [ "$statusbar" = 'full-bleed-v68' ] && [ "$forced" = 'disabled-v68' ]; then reader_ok=1; break; fi
            sleep 1
          done
          test "$reader_ok" = 1

          # v68 full-screen shell remains intact.
          require_literal /tmp/reader.html '__r3FullBleedV68' full_bleed_runtime
          require_literal /tmp/reader.html "owner:'full-bleed-autostretch-v68'" full_bleed_owner
          require_literal /tmp/reader.html 'html.r3-full-bleed-v68 #viewer{inset:0!important;width:100%!important;height:100%!important}' v68_full_shell_rule
          require_literal /tmp/reader.html 'postResizeDisplay:false' no_display_after_resize
          require_literal /tmp/reader.html 'postRenderGeometryWait:false' no_post_render_wait

          # v69 dynamically shortens only the EPUB reading stage to the actual dock top.
          require_literal /tmp/reader.html '__r3AudioDockInsetV69' dock_runtime
          require_literal /tmp/reader.html "owner:'audio-dock-reading-inset-v69'" dock_owner
          require_literal /tmp/reader.html "document.getElementById('r3AudioDock')" stable_dock_id
          require_literal /tmp/reader.html 'dock.getBoundingClientRect()' measured_dock_geometry
          require_literal /tmp/reader.html '--r3-reading-bottom-v69' dynamic_bottom_variable
          require_literal /tmp/reader.html 'bottom:var(--r3-reading-bottom-v69,0px)!important' viewer_dynamic_bottom
          require_literal /tmp/reader.html 'height:auto!important' viewer_auto_height
          require_literal /tmp/reader.html 'viewportBottom-Number(rect.top||0)' viewport_to_dock_overlap
          require_literal /tmp/reader.html 'new ResizeObserver' dock_resize_observer
          require_literal /tmp/reader.html 'new MutationObserver' late_dock_observer
          require_literal /tmp/reader.html "r3ApplyAudioDockInsetV69('pre-render-enter',false)" dock_measure_before_pagination
          require_literal /tmp/reader.html 'rendition.resize(stageW,stageH)' resize_to_visible_reading_stage
          require_literal /tmp/reader.html "r3ApplyAudioDockInsetV69('v68-viewport',false)" viewport_resize_delegated_to_v69
          forbid_literal /tmp/reader.html 'r3-audio-fixed-height-v69' no_fixed_player_height
          forbid_literal /tmp/reader.html '--r3-audio-fixed-height-v69' no_fixed_player_height_variable

          echo 'READER_V69_AUDIO_DOCK_READING_INSET_LIVE_SMOKE=PASS'
