name: PNTR Cleaner Self Remove

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pntr-cleaner-self-remove.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore Wasmer state
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-account.json
          if [ -f ops/wasmer/browser-state.aes ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/browser-state.aes -out /tmp/wasmer-browser-state.json
          fi
          chmod 600 /tmp/wasmer-account.json
          [ ! -f /tmp/wasmer-browser-state.json ] || chmod 600 /tmp/wasmer-browser-state.json
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.58.2 >/dev/null
      - name: Remove cleaner plugin
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright-core'); const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/wasmer-account.json','utf8'));
          const dash=`https://wasmer.io/apps/${encodeURIComponent(a.username)}/runner3-wp-a94b8fd2`;
          const txt=async p=>String(await p.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim();
          async function login(p){
            await p.goto('https://wasmer.io/login',{waitUntil:'domcontentloaded',timeout:60000}); await p.waitForTimeout(600);
            const i=p.locator('input[name=username],input[placeholder*=Username i],input[type=text]').first(); if(!(await i.count())) return false;
            await i.fill(a.username||a.email); let b=p.locator('button').filter({hasText:/continue|next|log in|sign in/i}).first(); if(await b.count()) await b.click(); else await i.press('Enter');
            const pw=p.locator('input[type=password]').first(); if(!(await pw.waitFor({state:'visible',timeout:12000}).then(()=>true).catch(()=>false))) return false;
            await pw.fill(a.password); b=p.locator('button,input[type=submit]').filter({hasText:/log in|sign in|continue/i}).first(); if(await b.count()) await b.click(); else await pw.press('Enter'); await p.waitForTimeout(2600); return true;
          }
          async function admin(c,p){
            await p.goto(dash,{waitUntil:'domcontentloaded',timeout:60000}); await p.waitForTimeout(800);
            if(/\/login(?:[/?#]|$)/i.test(p.url())||/log in|sign in/i.test((await txt(p)).slice(0,500))){if(!(await login(p))) throw new Error('Wasmer login failed'); await p.goto(dash,{waitUntil:'domcontentloaded',timeout:60000}); await p.waitForTimeout(800);}
            const x=p.getByText(/WordPress Admin/i).first(); if(!(await x.count())) throw new Error('WordPress Admin missing'); const href=await x.getAttribute('href').catch(()=>null);
            if(href){const q=await c.newPage(); await q.goto(new URL(href,'https://wasmer.io').href,{waitUntil:'domcontentloaded',timeout:60000}); await q.waitForTimeout(1800); if(/\/wp-admin/i.test(q.url())) return q;}
            const pp=c.waitForEvent('page',{timeout:10000}).catch(()=>null); await x.click().catch(()=>{}); const pop=await pp; await p.waitForTimeout(2200); for(const q of [pop,...c.pages()].filter(Boolean)) if(/\/wp-admin/i.test(q.url())) return q; throw new Error('WP admin failed');
          }
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']}); const c=await b.newContext({storageState:fs.existsSync('/tmp/wasmer-browser-state.json')?'/tmp/wasmer-browser-state.json':undefined,ignoreHTTPSErrors:true}); const p=await c.newPage(); try{
            const wp=await admin(c,p), origin=new URL(wp.url()).origin, url=`${origin}/wp-admin/plugins.php`; await wp.goto(url,{waitUntil:'domcontentloaded',timeout:60000}); await wp.waitForTimeout(600);
            for(let i=0;i<4;i++){const row=wp.locator('tr').filter({hasText:/Runner3 PNTR Bridge Cleaner/i}).first(); if(!(await row.count())) break; let l=row.locator('a').filter({hasText:/^Deactivate$/i}).first(); if(await l.count()){const h=await l.getAttribute('href'); if(h) await wp.goto(new URL(h,wp.url()).href,{waitUntil:'domcontentloaded',timeout:60000}); else await l.click(); await wp.waitForTimeout(500); await wp.goto(url,{waitUntil:'domcontentloaded',timeout:60000}); continue;} l=row.locator('a').filter({hasText:/^Delete$/i}).first(); if(!(await l.count())) l=row.locator('a[href*="action=delete"]').first(); if(!(await l.count())) throw new Error('Cleaner delete link missing'); const h=await l.getAttribute('href'); if(h) await wp.goto(new URL(h,wp.url()).href,{waitUntil:'domcontentloaded',timeout:60000}); else await l.click(); await wp.waitForTimeout(500); const confirm=wp.locator('input[type=submit],button').filter({hasText:/Yes, delete|Delete these files|Delete Plugin/i}).first(); if(await confirm.count()){await confirm.click(); await wp.waitForTimeout(700);} await wp.goto(url,{waitUntil:'domcontentloaded',timeout:60000});}
            const left=await wp.locator('tr').filter({hasText:/Runner3 PNTR Bridge Cleaner/i}).count(); console.log('CLEANER_PLUGIN_ROWS_LEFT='+left); if(left) throw new Error('Cleaner still present'); const r=await c.request.get('https://runner3wp.pntr.dev/pntr-cleaner-status',{failOnStatusCode:false,timeout:20000}); const t=await r.text().catch(()=> ''); console.log('CLEANER_ROUTE_HTTP='+r.status()); console.log('CLEANER_ROUTE_ACTIVE='+(/^LEFT=/.test(t.trim()))); if(/^LEFT=/.test(t.trim())) throw new Error('Cleaner route still active'); console.log('PNTR_CLEANER_REMOVED=true');
          } finally {await b.close().catch(()=>{});}})().catch(e=>{console.error('SAFE_ERROR='+String(e).replace(/[A-Za-z0-9_-]{28,}/g,'REDACTED').slice(0,220));process.exit(1)});
          NODE
      - name: Cleanup decrypted state
        if: always()
        run: rm -f /tmp/wasmer-account.json /tmp/wasmer-browser-state.json
