name: Reader Audio v34 Preview E2E

on:
  workflow_dispatch:
  push:
    branches:
      - fix/reader-audio-v34-continuous-sync
    paths:
      - 'cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js'
      - 'cloudflare/runner3-core/reader-audio-core/**'
      - 'scripts/reader_audio_v34_preview_e2e.mjs'
      - '.github/workflows/reader-audio-v34-preview-e2e.yml'

permissions:
  contents: write

concurrency:
  group: reader-audio-v34-preview
  cancel-in-progress: true

env:
  PREVIEW_NAME: runner3-core-reader-v34-preview
  PREVIEW_URL: https://runner3-core-reader-v34-preview.ducduy2411.workers.dev
  PRODUCTION_URL: https://runner3-core.ducduy2411.workers.dev
  EBOOK_BROWSER_SMOKE_BOOK_KEY: core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reader-audio-v34-continuous-sync
          fetch-depth: 0

      - name: Apply single-listener continuity patch if needed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path=Path('cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js')
          text=path.read_text(encoding='utf-8')
          if 'primePrefetch(){schedulePrefetch();return true;}' not in text:
              old="""    syncTestWord(index,force=true){return syncWord(Math.max(0,Number(index)||0),Boolean(force));},
    peek(offset=1){return bridge()&&bridge().peekReadableAhead?bridge().peekReadableAhead(offset):Promise.resolve(null);},
"""
              new=old+"    primePrefetch(){schedulePrefetch();return true;},\n"
              if text.count(old)!=1: raise SystemExit('v34 debug marker mismatch')
              text=text.replace(old,new,1)

          old_runtime="""  const tick=async()=>{
    installBridgeHooks();
    const id=currentId();
    if(id&&id!==timingId)await loadTimingForCurrent();
    if(timingWords.length&&!audio.ended){
      const index=wordIndexAt((Number(audio.currentTime)||0)*1000);
      if(index>=0)syncWord(index,false);
    }
  };

  audio.addEventListener('loadedmetadata',()=>{loadTimingForCurrent().then(()=>{tick();schedulePrefetch();});});
  audio.addEventListener('play',()=>{loadTimingForCurrent().then(()=>{tick();schedulePrefetch();});});
  audio.addEventListener('timeupdate',tick);
  audio.addEventListener('seeked',tick);
  audio.addEventListener('ended',()=>{for(const doc of [...document.querySelectorAll('#viewer iframe')].map(f=>{try{return f.contentDocument;}catch{return null;}}).filter(Boolean)){try{doc.defaultView&&doc.defaultView.CSS&&doc.defaultView.CSS.highlights&&doc.defaultView.CSS.highlights.delete(highlightName);}catch{}}});
  window.addEventListener('pagehide',()=>{try{relocatedOff&&relocatedOff();}catch{}},{once:true});

  const boot=setInterval(()=>{
    if(installBridgeHooks()){
      clearInterval(boot);
      setTimeout(()=>{manualArmedAt=Date.now();tick();if(currentId())schedulePrefetch();},700);
    }
  },100);
"""
          new_runtime="""  let tickBusy=false;
  let armedMediaId='';
  let wasEnded=Boolean(audio.ended);
  let rafId=0;
  let lastRafAt=0;

  function clearRangeHighlight(){
    for(const doc of [...document.querySelectorAll('#viewer iframe')].map(f=>{try{return f.contentDocument;}catch{return null;}}).filter(Boolean)){
      try{doc.defaultView&&doc.defaultView.CSS&&doc.defaultView.CSS.highlights&&doc.defaultView.CSS.highlights.delete(highlightName);}catch{}
    }
  }

  const tick=async()=>{
    if(tickBusy)return;
    tickBusy=true;
    try{
      installBridgeHooks();
      const id=currentId();
      if(id&&id!==timingId)await loadTimingForCurrent();
      if(timingWords.length&&!audio.ended){
        const index=wordIndexAt((Number(audio.currentTime)||0)*1000);
        if(index>=0)await syncWord(index,false);
      }
    }finally{tickBusy=false;}
  };

  function armCurrentMedia(){
    const id=currentId();
    if(!id||id===armedMediaId)return false;
    armedMediaId=id;
    loadTimingForCurrent().then(()=>tick()).catch(()=>{});
    schedulePrefetch();
    return true;
  }

  const srcObserver=new MutationObserver(()=>armCurrentMedia());
  try{srcObserver.observe(audio,{attributes:true,attributeFilter:['src']});}catch{}

  const continuityFrame=stamp=>{
    if(stamp-lastRafAt>=100){
      lastRafAt=stamp;
      armCurrentMedia();
      tick();
      const endedNow=Boolean(audio.ended);
      if(endedNow&&!wasEnded)clearRangeHighlight();
      wasEnded=endedNow;
    }
    rafId=requestAnimationFrame(continuityFrame);
  };
  rafId=requestAnimationFrame(continuityFrame);

  window.addEventListener('pagehide',()=>{
    try{relocatedOff&&relocatedOff();}catch{}
    try{srcObserver.disconnect();}catch{}
    try{cancelAnimationFrame(rafId);}catch{}
  },{once:true});

  const boot=setInterval(()=>{
    if(installBridgeHooks()){
      clearInterval(boot);
      setTimeout(()=>{manualArmedAt=Date.now();tick();armCurrentMedia();},700);
    }
  },100);
"""
          if old_runtime in text:
              if text.count(old_runtime)!=1: raise SystemExit('v34 runtime marker ambiguous')
              text=text.replace(old_runtime,new_runtime,1)
          elif "audio.addEventListener('timeupdate',tick);" in text:
              raise SystemExit('v34 listener patch incomplete')
          path.write_text(text,encoding='utf-8')

          test=Path('scripts/reader_audio_v34_preview_e2e.mjs')
          test_text=test.read_text(encoding='utf-8')
          old_test="await page.evaluate(() => document.getElementById('r3AudioElement')?.dispatchEvent(new Event('loadedmetadata')));"
          if old_test in test_text:
              test_text=test_text.replace(old_test,"await page.evaluate(() => window.__r3AudioContinuityV34?.primePrefetch?.());",1)
              test.write_text(test_text,encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          node --check scripts/reader_audio_v34_preview_e2e.mjs
          ! grep -q "audio.addEventListener('timeupdate'" cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          ! grep -q "audio.addEventListener('play'" cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          ! grep -q "audio.addEventListener('ended'" cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js

      - name: Persist source patch to branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js scripts/reader_audio_v34_preview_e2e.mjs; then exit 0; fi
          git config user.name 'reader-audio-bot'
          git config user.email 'reader-audio-bot@users.noreply.github.com'
          git add cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js scripts/reader_audio_v34_preview_e2e.mjs
          git commit -m 'fix(reader-audio): preserve single audio listener owner in v34'
          git push origin HEAD:fix/reader-audio-v34-continuous-sync

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate preview credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Install build and browser dependencies
        run: |
          npm install --no-save esbuild playwright
          npx playwright install --with-deps chromium

      - name: Build Reader Audio Core browser bundle
        run: node scripts/build_reader_audio_core_browser_bundle.mjs

      - name: Compose isolated v34 preview Worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, os
          root=pathlib.Path('cloudflare/runner3-core')
          wrapper=root/'artifact-library-reader-v7-github-audio-entry.js'
          text=wrapper.read_text(encoding='utf-8')
          text,count=re.subn(
            r'import app from ["\']\./artifact-library-reader-v\d+[^"\']*-entry\.js["\'];',
            'import app from "./artifact-library-reader-v34-continuous-range-sync-entry.js";',
            text,
            count=1,
          )
          if count != 1: raise SystemExit('reader wrapper import marker missing')
          wrapper.write_text(text,encoding='utf-8')

          mailbox=root/'mailbox-entry.js'
          text=mailbox.read_text(encoding='utf-8')
          old='import app from "./audio-entry.js";'
          new='import app from "./artifact-library-reader-v7-github-audio-entry.js";'
          if old in text: text=text.replace(old,new,1)
          elif new not in text: raise SystemExit('canonical mailbox import marker missing')
          mailbox.write_text(text,encoding='utf-8')

          cfg_path=root/'wrangler.jsonc'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['name']=os.environ['PREVIEW_NAME']
          cfg['main']='mailbox-entry.js'
          cfg.pop('triggers',None)
          cfg_path.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-bundle.generated.js
          grep -q 'artifact-library-reader-v34-continuous-range-sync-entry.js' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          ! grep -q '"triggers"' cloudflare/runner3-core/wrangler.jsonc

      - name: Deploy isolated v34 preview Worker
        working-directory: cloudflare/runner3-core
        run: npx --yes wrangler@4 deploy

      - name: Verify v34 preview headers
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -sS -D /tmp/h -o /tmp/body -w '%{http_code}' "$PREVIEW_URL/artifact-library/read?key=$encoded")"
            tr -d '\r' </tmp/h >/tmp/h.clean
            runtime="$(grep -i '^x-r3-reader-runtime:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            proof="$(grep -i '^x-r3-reader-patch-proof:' /tmp/h.clean | sed 's/^[^:]*:[[:space:]]*//' || true)"
            echo "V34_PREVIEW attempt=$attempt http=$code runtime=$runtime proof=$proof"
            if [ "$code" = 200 ] && [ "$runtime" = 'v34-continuous-range-sync' ] && [ "$proof" = 'v33+v34:ahead-prefetch+range-follow+manual-sync' ] && grep -q 'data-r3-audio-continuity-v34="1"' /tmp/body; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

      - name: Run v34 non-mutating browser E2E
        run: node scripts/reader_audio_v34_preview_e2e.mjs
