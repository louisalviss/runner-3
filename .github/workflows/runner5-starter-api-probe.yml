name: Runner5 Starter API Probe
on:
  push:
    branches: [main]
    paths:
      - 'scripts/runner5-starter-api-probe.mjs'
      - '.github/workflows/runner5-starter-api-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_KEY: ${{ secrets.WASMER_AUTOMATION_KEY || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Decrypt Wasmer state
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-account.json
      - name: Browser runtime
        shell: bash
        run: |
          npm install --no-save playwright-core@1.58.2 playwright@1.58.2
          npx playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Probe API
        run: node scripts/runner5-starter-api-probe.mjs
      - name: Persist probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/runner5-starter-api.json || printf '{"status":"RUNNER_ERROR"}\n' >/tmp/runner5-starter-api.json
          cp /tmp/runner5-starter-api.json /tmp/safe.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main; mkdir -p ops/wordpress-access; cp /tmp/safe.json ops/wordpress-access/runner5-starter-api.json; git add ops/wordpress-access/runner5-starter-api.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Runner5 Starter API probe'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
