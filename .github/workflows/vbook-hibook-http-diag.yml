name: VBook HiBook HTTP Diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - name: Probe HiBook from runner host
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          for U in 'https://hibook.net/' 'https://hibook.net/?s=ti%C3%AAn'; do
            echo "URL=$U"
            curl -L -sS -o /tmp/body -D /tmp/h -w 'HTTP=%{http_code} SIZE=%{size_download} FINAL=%{url_effective}\n' -A "$UA" -H 'Accept: text/html,application/xhtml+xml' -e 'https://hibook.net/' "$U"
            grep -Ei '^(HTTP/|server:|content-type:|cf-|x-|location:)' /tmp/h | head -30
            head -c 160 /tmp/body | tr '\n' ' '; echo
          done
