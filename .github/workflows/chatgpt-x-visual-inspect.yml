name: ChatGPT X Visual Inspect

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-slim
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -q -U requests yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Inspect requested X video
        run: |
          python scripts/inspect_x_video_for_chatgpt.py 'https://x.com/sunmer575399/status/2091122420652593659?s=12'
          cat evidence/x-video-inspect/2091122420652593659/report.json
          ls -lh evidence/x-video-inspect/2091122420652593659 evidence/x-video-inspect/2091122420652593659/frames
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunmer-x-visual-${{ github.run_id }}
          path: evidence/x-video-inspect/2091122420652593659/
          retention-days: 3
