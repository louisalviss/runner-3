name: Cloudflare Free Hosting Round 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-hosting-round2-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.58.2

      - name: Probe signup flows
        shell: bash
        run: |
          set -euo pipefail
          cat > probe-hosts.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const endpoint=`wss://api.cloudflare.com/client/v4/accounts/${account}/browser-rendering/devtools/browser?keep_alive=600000`;
          const browser=await chromium.connectOverCDP(endpoint,{headers:{Authorization:`Bearer ${token}`}});

          async function report(page,name){
            await page.waitForTimeout(2500);
            const text=(await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim();
            const html=(await page.content()).toLowerCase();
            const markers=['recaptcha','hcaptcha','turnstile','captcha','verify you are human','cf-chl-','security code'].filter(x=>html.includes(x)||text.toLowerCase().includes(x));
            const inputs=await page.locator('input').evaluateAll(els=>els.map((e,i)=>({i,type:e.type,name:e.name,id:e.id,placeholder:e.placeholder})).filter(x=>x.type!=='hidden')).catch(()=>[]);
            const frames=await page.locator('iframe').evaluateAll(els=>els.map(e=>e.src).filter(Boolean)).catch(()=>[]);
            console.log(`--- ${name} ---`);
            console.log('URL='+page.url());
            console.log('TITLE='+await page.title().catch(()=>''));
            console.log('CAPTCHA_MARKERS='+markers.join(','));
            console.log('INPUTS='+JSON.stringify(inputs.slice(0,30)));
            console.log('IFRAMES='+JSON.stringify(frames.slice(0,15)));
            console.log('BODY_SAMPLE='+text.slice(0,1100));
          }

          async function clickLikely(page, patterns){
            for(const p of patterns){
              const el=page.getByRole('link',{name:p}).first();
              if(await el.count()){ await el.click({timeout:8000}).catch(()=>{}); await page.waitForTimeout(2000); return; }
              const b=page.getByRole('button',{name:p}).first();
              if(await b.count()){ await b.click({timeout:8000}).catch(()=>{}); await page.waitForTimeout(2000); return; }
            }
          }

          try {
            const ctx=browser.contexts()[0];

            let page=ctx.pages()[0] || await ctx.newPage();
            await page.goto('https://profreehost.com/',{waitUntil:'domcontentloaded',timeout:45000});
            await clickLikely(page,[/register/i,/sign up/i,/get started/i,/free hosting/i]);
            await report(page,'PROFREEHOST');

            page=await ctx.newPage();
            await page.goto('https://x10hosting.com/',{waitUntil:'domcontentloaded',timeout:45000});
            await clickLikely(page,[/continue/i,/create free account/i,/create your free website/i]);
            await report(page,'X10HOSTING');

            page=await ctx.newPage();
            await page.goto('https://www.freehostia.com/',{waitUntil:'domcontentloaded',timeout:45000});
            await clickLikely(page,[/sign up now for free/i,/sign up/i,/free/i]);
            await report(page,'FREEHOSTIA');
          } finally { await browser.close(); }
          JS
          node probe-hosts.mjs
