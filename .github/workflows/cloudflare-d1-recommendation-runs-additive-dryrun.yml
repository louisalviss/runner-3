name: Cloudflare D1 Recommendation Runs Additive Dry-Run (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-recommendation-runs-additive-dryrun
  cancel-in-progress: false

jobs:
  source-target-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TARGET_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce 20 synthetic offline read-only copy rehearsal contracts
        run: |
          python3 -m py_compile scripts/cloudflare_d1_recommendation_runs_dryrun.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_recommendation_runs_dryrun.py' -v
      - name: Read small source and target table; simulate additive copy in memory only
        run: |
          python3 scripts/cloudflare_d1_recommendation_runs_dryrun.py
      - name: Upload counts and flags only; never rows or identifiers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-recommendation-runs-additive-dryrun-summary
          path: migration-out/d1-recommendation-runs-additive-dryrun.json
          if-no-files-found: error
          retention-days: 1
