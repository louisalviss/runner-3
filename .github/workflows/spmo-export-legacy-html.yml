name: SPMO Export Legacy HTML
on:
  push:
    branches: [main]
    paths:
      - 'spmo-backtest/diagnostics/export_legacy_html.py'
      - '.github/workflows/spmo-export-legacy-html.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -u spmo-backtest/diagnostics/export_legacy_html.py
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-html-${{ github.run_id }}
          path: /tmp/legacy_doc_*.html
          retention-days: 2
