name: Private Backtest Crypto Expanded

on:
  push:
    branches: [main]
    paths:
      - 'jobs/private-backtest-crypto-30m-expanded.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-backtest-crypto-expanded
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        venue: [spot, perp]
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage expanded crypto venue
        run: python tools/private_backtest_crypto_expanded.py stage --config jobs/private-backtest-crypto-30m-expanded.json --venue ${{ matrix.venue }}

  transport_repair:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply USD-M SHIB contract alias
        run: python tools/private_backtest_crypto_perp_shib_repair.py

  shard:
    needs: [stage, transport_repair]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        venue: [spot, perp]
        shard: [0,1,2,3]
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2,<3'
      - name: Run expanded crypto shard
        run: python tools/private_backtest_crypto_expanded.py shard --config jobs/private-backtest-crypto-30m-expanded.json --venue ${{ matrix.venue }} --shard ${{ matrix.shard }}

  evaluate:
    if: ${{ always() && needs.stage.result == 'success' && needs.transport_repair.result == 'success' }}
    needs: [stage, transport_repair, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        venue: [spot, perp]
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate expanded crypto venue
        run: python tools/private_backtest_crypto_expanded.py evaluate --config jobs/private-backtest-crypto-30m-expanded.json --venue ${{ matrix.venue }}
