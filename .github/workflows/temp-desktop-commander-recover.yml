name: Temp Desktop Commander Recover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-desktop-commander-recover.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Recover Desktop Commander service
        shell: bash
        run: |
          set -euo pipefail
          SVC=desktop-commander.service
          SUDO=''
          if [ "$(id -u)" != 0 ]; then SUDO='sudo -n'; fi

          if systemctl is-active --quiet "$SVC"; then
            echo 'RDC_BEFORE=active'
          else
            echo 'RDC_BEFORE=inactive'
          fi

          $SUDO systemctl reset-failed "$SVC" || true
          $SUDO systemctl restart "$SVC"
          sleep 5

          $SUDO systemctl is-active --quiet "$SVC"
          $SUDO systemctl --no-pager --full status "$SVC" | sed -n '1,18p'
          pgrep -af '/usr/bin/desktop-commander remote|desktop-commander remote'

          # A running process alone is not sufficient: require an established
          # outbound TLS control connection used by Desktop Commander.
          if ! ss -Hntp state established 2>/dev/null | grep -E 'desktop-commander|remote\.spaaces\.io:443|:443' >/dev/null; then
            echo 'RDC_CONTROL_SOCKET=not_observed'
            # Do not fail solely on ss attribution; journal gives a second signal.
            $SUDO journalctl -u "$SVC" --since '-2 min' --no-pager -n 80
          else
            echo 'RDC_CONTROL_SOCKET=observed'
          fi

          echo 'RDC_RECOVERY=PASS'
