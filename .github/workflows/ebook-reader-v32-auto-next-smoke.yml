name: Ebook Reader v32 Auto Next Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ebook-reader-v32-auto-next-smoke.yml'
      - 'scripts/ebook_reader_v32_auto_next_smoke.mjs'
      - 'cloudflare/runner3-core/artifact-library-reader-v32-auto-next-chapter-entry.js'
      - 'cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js'

permissions:
  contents: read

concurrency:
  group: ebook-reader-v32-auto-next-smoke
  cancel-in-progress: true

jobs:
  deploy-v32:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PINNED_SOURCE: 69f09b7c8abcaeede95a752cfca5ccf967689443
    steps:
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "MISSING:$name" >&2; exit 2; }
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PINNED_SOURCE }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose canonical mailbox with Reader v32
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('cloudflare/runner3-core')
          mailbox=root/'mailbox-entry.js'
          text=mailbox.read_text(encoding='utf-8')
          old='import app from "./audio-entry.js";'
          new='import app from "./artifact-library-reader-v7-github-audio-entry.js";'
          if old not in text: raise SystemExit('canonical mailbox import marker missing')
          mailbox.write_text(text.replace(old,new,1),encoding='utf-8')
          cfg_path=root/'wrangler.jsonc'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['main']='mailbox-entry.js'
          cfg_path.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/mailbox-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v32-auto-next-chapter-entry.js
          node --check scripts/ebook_reader_v32_auto_next_smoke.mjs
          grep -q 'artifact-library-reader-v32-auto-next-chapter-entry.js' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          grep -q 'window.__r3AudioAutoNextChapterV32=true' cloudflare/runner3-core/artifact-library-reader-v32-auto-next-chapter-entry.js
      - name: Deploy Reader v32 Core
        working-directory: cloudflare/runner3-core
        shell: bash
        run: |
          set -euo pipefail
          export NO_COLOR=1
          npx --yes wrangler@4 deploy
      - name: Verify v32 live before browser proof
        shell: bash
        run: |
          set -euo pipefail
          core='https://runner3-core.ducduy2411.workers.dev'
          encoded="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub", safe=""))')"
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -sS -D /tmp/h -o /tmp/reader -w '%{http_code}' "$core/artifact-library/read?key=$encoded")"
            tr -d '\r' </tmp/h >/tmp/h.clean
            if [ "$code" = 200 ] && grep -qi '^x-r3-reader-runtime: v32-auto-next-chapter$' /tmp/h.clean && grep -qi '^x-r3-reader-patch-proof: v31+v32:ended-next-readable-spine+autoplay$' /tmp/h.clean && grep -q 'window.__r3AudioAutoNextChapterV32=true' /tmp/reader && grep -q 'window.__r3AudioHighSpeedFollowV31=true' /tmp/reader; then
              ok=1
              break
            fi
            echo "WAIT_V32 attempt=$attempt http=$code runtime=$(grep -i '^x-r3-reader-runtime:' /tmp/h.clean || true) error=$(grep -i '^x-r3-reader-patch-error:' /tmp/h.clean || true)"
            sleep 1
          done
          test "$ok" = 1
          echo 'READER_V32_LIVE=PASS'

  browser-proof-auto-next:
    needs: deploy-v32
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      EBOOK_BROWSER_SMOKE_BOOK_KEY: core/ebook/skeleton-crew/final/Skeleton-Crew-Stephen-King-VI-v2.epub
      PINNED_SOURCE: 69f09b7c8abcaeede95a752cfca5ccf967689443
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PINNED_SOURCE }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Prove ended audio advances to next readable spine and autoplays
        run: node scripts/ebook_reader_v32_auto_next_smoke.mjs
