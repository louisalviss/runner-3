name: M88 SABA Card Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-saba-card-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence /tmp/relays

      - name: Build relay pool
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pref=['TH','SG','MY','PH','ID','JP','KR','TW','VN']
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          meta=[]
          for c in pref:
              rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
              rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
              for r in rs[:(10 if c=='TH' else 3)]:
                  cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
                  cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
                  p=pathlib.Path(f'/tmp/relays/{len(meta):02d}-{c}.ovpn'); p.write_text(cfg)
                  meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/relays.tsv').write_text('\n'.join(meta)+'\n')
          print('RELAYS',len(meta))
          PY

      - name: Select working relay
        shell: bash
        run: |
          set -euo pipefail
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.243.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.243.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.243.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.243.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          selected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo "TRY $country $relay"
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/openvpn.log /tmp/top.json
            sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            ok=0
            for i in {1..12}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null && { ok=1; break; }
              grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|fatal error|Connection refused' /tmp/openvpn.log 2>/dev/null && break || true
            done
            [ "$ok" = 1 ] || continue
            if sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 18 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/top.json; then
              if python3 - <<'PY'
          import json
          try: d=json.load(open('/tmp/top.json'))
          except: raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then
                sudo ip netns exec vpnns curl -fsS --max-time 10 'https://www.cloudflare.com/cdn-cgi/trace' | grep -E '^(ip|loc|warp)=' | tee evidence/egress.txt || true
                echo "$country $relay" | tee evidence/relay.txt
                selected=1
                break
              fi
            fi
          done < /tmp/relays.tsv
          test "$selected" = 1

      - name: Open SABA card and public Outright board
        shell: bash
        run: |
          set -euo pipefail
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright

          OUT=Path(os.environ['WORKSPACE'])/'evidence'
          net=[]; hits=[]; result={'candidates':[],'markets':{},'notes':[]}
          targets={
            'winner': re.compile(r'ENGLISH PREMIER LEAGUE\s*2026/2027\s*-\s*WINNER',re.I),
            'top4': re.compile(r'ENGLISH PREMIER LEAGUE\s*2026/2027\s*-\s*TOP\s*4',re.I),
            'relegation': re.compile(r'ENGLISH PREMIER LEAGUE\s*2026/2027\s*-\s*(?:TO\s*BE\s*)?RELEGAT',re.I),
            'goalscorer': re.compile(r'ENGLISH PREMIER LEAGUE\s*2026/2027\s*-\s*TOP\s*GOALSCORER',re.I),
          }
          def txt(x,limit=300000):
              try: return x.locator('body').inner_text(timeout=8000)[:limit]
              except: return ''
          def capture_network(page):
              def req(r):
                  if r.resource_type in ('document','xhr','fetch'):
                      net.append({'kind':'request','type':r.resource_type,'method':r.method,'url':r.url,'post':(r.post_data or '')[:12000]})
              def resp(r):
                  if r.request.resource_type not in ('document','xhr','fetch'): return
                  net.append({'kind':'response','type':r.request.resource_type,'status':r.status,'url':r.url})
                  try:
                      ct=(r.headers.get('content-type') or '').lower()
                      if 'json' not in ct: return
                      body=r.text()
                      if len(body)>6000000: return
                      if re.search(r'outright|2026/2027|relegat|goal.?scorer|top\s*4',body,re.I):
                          hits.append({'url':r.url,'status':r.status,'body':body[:2000000]})
                  except: pass
              page.on('request',req); page.on('response',resp)

          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              c=b.new_context(viewport={'width':390,'height':844},screen={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True,locale='en-US',timezone_id='Asia/Bangkok',user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1')
              page=c.new_page(); capture_network(page)
              r=page.goto('https://www.m88.com/',wait_until='domcontentloaded',timeout=45000)
              page.wait_for_timeout(12000)
              result['home_status']=r.status if r else None

              # The SABA product card is lower on M88's SPORTS section; scroll until it hydrates.
              for _ in range(10):
                  page.mouse.wheel(0,900); page.wait_for_timeout(500)
              page.screenshot(path=str(OUT/'01-products.png'),full_page=False)

              # Inventory every visible DOM candidate tied to the SABA card.
              sels=["text=SABA","img[alt*='SABA' i]","img[src*='saba' i]","[class*='saba' i]","[data-qa*='saba' i]"]
              seen=[]; chosen=None
              for sel in sels:
                  loc=page.locator(sel)
                  for i in range(min(loc.count(),50)):
                      el=loc.nth(i)
                      try:
                          if not el.is_visible(): continue
                          info=el.evaluate("e=>{let a=e.closest('a,button,[role=button]');return {tag:e.tagName,text:(e.innerText||e.alt||'').trim().slice(0,500),outer:e.outerHTML.slice(0,2000),href:a&&a.href||'',action:a&&a.outerHTML.slice(0,2500)||''}}")
                          key=(info.get('outer'),info.get('href'))
                          if key not in seen:
                              seen.append(key); result['candidates'].append(info)
                          if chosen is None: chosen=el
                      except Exception: pass
              (OUT/'saba-candidates.json').write_text(json.dumps(result['candidates'],ensure_ascii=False,indent=2))

              if chosen is None:
                  result['notes'].append('No visible SABA product candidate')
              else:
                  # Prefer the nearest actionable ancestor of the SABA logo/card.
                  before=set(c.pages)
                  try:
                      chosen.evaluate("e=>{let a=e.closest('a,button,[role=button]'); if(a){a.click()} else {e.click()}}")
                  except Exception as e:
                      result['notes'].append('SABA click failed '+type(e).__name__)
                  page.wait_for_timeout(15000)
                  newpages=[x for x in c.pages if x not in before]
                  board=newpages[-1] if newpages else page
                  capture_network(board)
                  result['after_click_pages']=[x.url for x in c.pages]
                  result['board_url']=board.url
                  board.screenshot(path=str(OUT/'02-after-saba.png'),full_page=False)

                  # Search all pages/frames for the exact public SABA board.
                  provider=None; provider_page=board
                  for pg in c.pages:
                      for f in pg.frames:
                          t=txt(f,90000)
                          if re.search(r'\bOutright\b',t,re.I) and re.search(r'Soccer|SABA|Matches',t,re.I):
                              provider=f; provider_page=pg; break
                      if provider: break
                  if provider is None:
                      result['notes'].append('SABA card opened but Outright control not found')
                  else:
                      result['provider_url']=provider.url
                      result['provider_text_before']=txt(provider,100000)
                      ol=provider.get_by_text(re.compile(r'^\s*Outright(?:\s+\d+)?\s*$',re.I))
                      clicked=False
                      for i in range(min(ol.count(),30)):
                          try:
                              if ol.nth(i).is_visible(): ol.nth(i).click(timeout=7000); clicked=True; break
                          except: pass
                      result['outright_clicked']=clicked
                      provider_page.wait_for_timeout(10000)
                      provider_page.screenshot(path=str(OUT/'03-outright.png'),full_page=False)

                      # Re-find best frame and scroll through the virtualized outright list.
                      best=None
                      for pg in c.pages:
                          for f in pg.frames:
                              t=txt(f)
                              score=(4 if re.search(r'\bOutright\b',t,re.I) else 0)+sum(3 for rx in targets.values() if rx.search(t))
                              if best is None or score>best[0]: best=(score,pg,f,t)
                      if best:
                          _,provider_page,provider,corpus=best
                      else: corpus=txt(provider)
                      for _ in range(35):
                          if all(rx.search(corpus) for rx in targets.values()): break
                          try: provider.evaluate('window.scrollBy(0,800)')
                          except:
                              try: provider_page.mouse.wheel(0,800)
                              except: pass
                          provider_page.wait_for_timeout(500)
                          now=txt(provider)
                          if now and now not in corpus: corpus+='\n'+now
                      result['outright_corpus']=corpus[:900000]

                      # Click requested market headers when visible; capture a large local text window.
                      for key,rx in targets.items():
                          rec={'found':bool(rx.search(corpus))}
                          found_el=None; found_frame=None
                          for pg in c.pages:
                              for f in pg.frames:
                                  loc=f.get_by_text(rx)
                                  for i in range(min(loc.count(),100)):
                                      try:
                                          if loc.nth(i).is_visible(): found_el=loc.nth(i); found_frame=f; provider_page=pg; break
                                      except: pass
                                  if found_el: break
                              if found_el: break
                          if found_el:
                              try: rec['title']=found_el.inner_text()[:700]
                              except: rec['title']=''
                              try:
                                  found_el.scroll_into_view_if_needed(timeout=3000); found_el.click(timeout=7000); provider_page.wait_for_timeout(3000); rec['clicked']=True
                              except Exception as e: rec['clicked']=False; rec['error']=type(e).__name__
                              t=txt(found_frame)
                              m=rx.search(t); rec['window']=t[max(0,m.start()-500):m.start()+30000] if m else t[:30000]
                          else:
                              m=rx.search(corpus); rec['window']=corpus[max(0,m.start()-500):m.start()+30000] if m else ''
                          result['markets'][key]=rec

              result['hosts']={}
              for x in net:
                  try:
                      h=urlparse(x['url']).netloc; result['hosts'][h]=result['hosts'].get(h,0)+1
                  except: pass
              result['hosts']=dict(sorted(result['hosts'].items(),key=lambda kv:-kv[1])[:100])
              c.close(); b.close()

          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          (OUT/'network.json').write_text(json.dumps(net,ensure_ascii=False,indent=2))
          (OUT/'json-hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2)[:90000])
          PY

      - name: Summary
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('evidence/result.json')
          if not p.exists(): print('NO RESULT'); raise SystemExit(0)
          d=json.loads(p.read_text())
          print('BOARD',d.get('board_url'))
          print('PROVIDER',d.get('provider_url'))
          print('OUTRIGHT',d.get('outright_clicked'))
          print('NOTES',d.get('notes'))
          for k,v in d.get('markets',{}).items():
              print('\n###',k,'FOUND',v.get('found'),'CLICKED',v.get('clicked'))
              print(v.get('window','')[:20000])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-saba-card-probe-${{ github.run_id }}
          path: evidence/
          retention-days: 3
