name: X Leto SPMO table target audit

on:
  push:
    paths:
      - '.github/workflows/x-leto-table-target-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  table-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr
      - name: Download video and OCR table segment
        run: |
          mkdir -p /tmp/leto_frames
          curl -L --retry 3 --max-time 120 \
            'https://video.twimg.com/amplify_video/2088233794197495808/vid/avc1/1920x1080/5oW4gwX-q5pEjC7x.mp4?tag=29' \
            -o /tmp/leto.mp4
          ffmpeg -y -loglevel error -ss 420 -to 510 -i /tmp/leto.mp4 -vf 'fps=1' /tmp/leto_frames/f_%03d.png
          python - <<'PY'
          import subprocess, pathlib, re
          root=pathlib.Path('/tmp/leto_frames')
          keys=['2016','2017','2018','2019','2020','2021','2022','2023','2024','2025','2026','MSFT','AAPL','AMZN','NVDA','META','GOOG','GOOGL','XOM','JPM','JNJ','AVGO','MU','rebalance','Top 1','Top1']
          for i,p in enumerate(sorted(root.glob('*.png'))):
              sec=420+i
              outs=[]
              for psm in ['6','11']:
                  r=subprocess.run(['tesseract',str(p),'stdout','-l','eng','--psm',psm],capture_output=True,text=True)
                  outs.append(r.stdout)
              text=max(outs,key=len)
              if any(k.lower() in text.lower() for k in keys):
                  print(f'===== T={sec}s FILE={p.name} =====')
                  print(text[:12000])
                  print('===== END =====')
          PY
