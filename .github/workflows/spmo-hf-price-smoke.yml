name: SPMO HF Price Smoke
on:
  push:
    branches: [main]
    paths:
      - 'spmo-modern2/hf_price_smoke.py'
      - '.github/workflows/spmo-hf-price-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb pandas
      - run: python -u spmo-modern2/hf_price_smoke.py
