name: webnovel-sources-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/webnovel_sources_probe.py'
      - '.github/workflows/webnovel-sources-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - run: python scripts/webnovel_sources_probe.py probe_out
      - uses: actions/upload-artifact@v4
        with:
          name: webnovel-sources-probe
          path: probe_out
          retention-days: 7
