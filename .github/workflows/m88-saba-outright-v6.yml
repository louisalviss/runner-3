name: M88 SABA Outright V7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-saba-outright-v6.yml'
      - 'scripts/m88_saba_outright_v6.py'
      - 'scripts/m88_saba_outright_v7.py'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and connect accepted Asia relay
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          rm -rf evidence /tmp/m88-relays
          mkdir -p evidence /tmp/m88-relays
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          meta=[]
          for country in ['TH','SG','MY','PH','ID','JP','KR','TW','VN']:
              rs=[r for r in rows if (r.get('CountryShort') or '').upper()==country and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
              rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
              for r in rs[:(10 if country=='TH' else 3)]:
                  cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
                  cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
                  p=pathlib.Path(f'/tmp/m88-relays/{len(meta):02d}-{country}.ovpn')
                  p.write_text(cfg)
                  meta.append(f'{p}\t{country}\t{r.get("IP","")}')
          if not meta: raise SystemExit('No relays')
          pathlib.Path('/tmp/m88-relays.tsv').write_text('\n'.join(meta)+'\n')
          print('RELAYS',len(meta))
          PY
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.250.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.250.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.250.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.250.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          selected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo "TRY $country $relay"
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/openvpn.log /tmp/m88-top.json
            sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            ok=0
            for i in {1..12}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null && { ok=1; break; }
            done
            [ "$ok" = 1 ] || continue
            if sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 18 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/m88-top.json; then
              if python3 - <<'PY'
          import json
          try:d=json.load(open('/tmp/m88-top.json'))
          except Exception:raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then
                printf '%s %s\n' "$country" "$relay" | tee evidence/relay.txt
                selected=1
                break
              fi
            fi
          done < /tmp/m88-relays.tsv
          test "$selected" = 1
      - name: Navigate SABA drawer to Outright and collect EPL markets
        shell: bash
        run: |
          set -euo pipefail
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 scripts/m88_saba_outright_v7.py
      - name: Verify navigation
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/result.json'))
          print('PROVIDER',d.get('provider'))
          print('DRAWER',d.get('drawer_x_before'),'->',d.get('drawer_x_after'),d.get('drawer_open_point'))
          print('SPORTS',d.get('drawer_sports_clicked'),d.get('drawer_sports_strategy'),d.get('drawer_switch_after'))
          print('MORE',d.get('more_clicked'))
          print('OUTRIGHT',d.get('outright_clicked'),d.get('outright_label'))
          print('NOTES',d.get('notes'))
          for k,v in d.get('markets',{}).items():
              print('\n###',k,'FOUND=',v.get('found'),'SOURCE=',v.get('source'))
              print(v.get('window','')[:30000])
          if not d.get('provider'): raise SystemExit('SABA provider missing')
          if not (d.get('drawer_x_after') is not None and d.get('drawer_x_after') > -80): raise SystemExit('SABA drawer did not open')
          if not d.get('drawer_sports_clicked'): raise SystemExit('Sports mode did not activate')
          if not d.get('outright_clicked'): raise SystemExit('Outright did not open')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-saba-outright-v7-${{ github.run_id }}
          path: evidence/
          retention-days: 3
