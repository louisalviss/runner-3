name: TradingView Wave Rider Trades Scrape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-wave-rider-trades-scrape.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_SHA256: 9156e8c49b9a5e36007620f3e17fcab26c06714a3e32a252be52437ae23d6026
    steps:
      - uses: actions/checkout@v4

      - name: Restore session and canonical source
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
            -in ops/tradingview/session-state.json.aes -out /tmp/tv-state.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
            -in ops/tradingview/wave-rider-v2.5.13-window-report.pine.aes -out /tmp/wr2513.pine
          SHA="$(sha256sum /tmp/wr2513.pine | awk '{print $1}')"
          echo "TV_SCRAPE_SOURCE_SHA256=$SHA"
          test "$SHA" = "$EXPECTED_SHA256"

      - name: Build safe table-scrape variant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/tradingview-wave-rider-e2e.mjs')
          s=p.read_text()
          marker="  const csv=p.locator('[title=\"Download .csv\"]').first();"
          if marker not in s:
              raise SystemExit('patch marker missing')
          insert=r'''
  // Extract only Strategy Report subtree, never the Pine editor/source.
  const scrape=await p.evaluate(async()=>{
    const csvBtn=document.querySelector('button[title="Download .csv"]');
    if(!csvBtn) return {error:'csv button missing'};
    let panel=csvBtn.parentElement;
    while(panel && panel!==document.body){
      const t=(panel.innerText||'');
      if(t.includes('List of trades') && t.includes('Trade number') && t.includes('Date and time')) break;
      panel=panel.parentElement;
    }
    if(!panel || panel===document.body) return {error:'report panel ancestor missing'};
    const panelInfo={tag:panel.tagName,cls:String(panel.className||'').slice(0,300),textLen:(panel.innerText||'').length};
    const scrollables=[...panel.querySelectorAll('*')].filter(e=>{
      const cs=getComputedStyle(e); return e.scrollHeight>e.clientHeight+10 && ['auto','scroll'].includes(cs.overflowY);
    }).map((e,i)=>({e,i,sh:e.scrollHeight,ch:e.clientHeight,sw:e.scrollWidth,cw:e.clientWidth,cls:String(e.className||'').slice(0,240),text:(e.innerText||'').slice(0,240)}));
    scrollables.sort((a,b)=>(b.sh-b.ch)-(a.sh-a.ch));
    const sc=scrollables[0]?.e || panel;
    const meta=scrollables.slice(0,12).map(({i,sh,ch,sw,cw,cls,text})=>({i,sh,ch,sw,cw,cls,text}));
    const snaps=[];
    const max=Math.max(0,sc.scrollHeight-sc.clientHeight);
    const steps=20;
    for(let i=0;i<=steps;i++){
      sc.scrollTop=Math.round(max*i/steps);
      sc.dispatchEvent(new Event('scroll',{bubbles:true}));
      await new Promise(r=>setTimeout(r,180));
      snaps.push({i,top:sc.scrollTop,text:panel.innerText||''});
    }
    return {panelInfo,scrollables:meta,maxScroll:max,snaps};
  });
  fs.writeFileSync('/tmp/wr2513-trades-scroll.json',JSON.stringify(scrape,null,2));
  log('TV_E2E_SCRAPE_ERROR',scrape.error||'ABSENT');
  log('TV_E2E_SCRAPE_MAX_SCROLL',String(scrape.maxScroll??-1));
  log('TV_E2E_SCRAPE_SNAPSHOTS',String(scrape.snaps?.length||0));
'''
          s=s.replace(marker,insert+'\n'+marker,1)
          Path('/tmp/e2e-scrape.mjs').write_text(s)
          PY

      - name: Compile and scrape all virtualized trade rows
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node /tmp/e2e-scrape.mjs

      - name: Parse unique trade snapshots
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,csv,os
          p='/tmp/wr2513-trades-scroll.json'
          if not os.path.exists(p):
              print('TV_TRADE_PARSE=NO_SNAPSHOT')
              raise SystemExit(0)
          d=json.load(open(p))
          texts=[x.get('text','') for x in d.get('snaps',[])]
          # Keep compact report-only evidence; lines are UI values, never Pine source.
          seen=[]
          for t in texts:
              for line in [x.strip() for x in t.splitlines() if x.strip()]:
                  if line not in seen: seen.append(line)
          open('/tmp/wr2513-trades-unique-lines.txt','w').write('\n'.join(seen)+'\n')
          nums=sorted({int(m.group(1)) for line in seen for m in [re.match(r'^(\d+)\s*(?:long|short)$',line,re.I)] if m},reverse=True)
          print('TV_TRADE_NUMBERS='+','.join(map(str,nums)))
          print('TV_TRADE_UNIQUE_COUNT='+str(len(nums)))
          print('TV_TRADE_HAS_1='+('YES' if 1 in nums else 'NO'))
          print('TV_TRADE_HAS_15='+('YES' if 15 in nums else 'NO'))
          print('TV_TRADE_SCROLL_MAX='+str(d.get('maxScroll',-1)))
          print('TV_TRADE_SCROLLABLES='+str(len(d.get('scrollables',[]))))
          json.dump({'trade_numbers':nums,'unique_lines':seen,'panel':d.get('panelInfo'),'scrollables':d.get('scrollables'),'maxScroll':d.get('maxScroll')},open('/tmp/wr2513-trades-scrape-summary.json','w'),indent=2)
          PY

      - name: Upload table evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-wave-rider-trades-scrape-${{ github.run_id }}
          path: |
            /tmp/wr2513-e2e-report.txt
            /tmp/wr2513-trades-scroll.json
            /tmp/wr2513-trades-unique-lines.txt
            /tmp/wr2513-trades-scrape-summary.json
            /tmp/wr2513-trades-panel.png
          if-no-files-found: warn
          retention-days: 1

      - name: Cleanup plaintext
        if: always()
        run: rm -f /tmp/tv-state.json /tmp/wr2513.pine /tmp/e2e-scrape.mjs
