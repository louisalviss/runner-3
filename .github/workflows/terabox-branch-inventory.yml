name: TeraBox Branch Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terabox-branch-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        branch:
          - '/Truyen/Kho Sách'
          - '/Truyen/Kho Truyện Tranh'
          - '/Truyen/Từ điển English Kindle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright client
        run: python -m pip install 'playwright>=1.58,<2'
      - name: Inventory branch
        env:
          ROOT_PATH: ${{ matrix.branch }}
        shell: bash
        run: |
          cat > /tmp/branch_inventory.py <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlparse, parse_qsl, urlencode, urlunparse
          from collections import deque, defaultdict
          import json, os, re, shutil, time

          TARGET='https://www.1024tera.com/vietnamese/sharing/link?surl=ZEQeI5EJydtP4xp4Bx4Lww'
          ROOT=os.environ['ROOT_PATH']
          BATCH=6
          MAX_RETRY=2

          def human(n):
              x=float(n)
              for u in ['B','KiB','MiB','GiB','TiB']:
                  if x < 1024 or u=='TiB': return f'{x:.2f} {u}'
                  x/=1024

          with sync_playwright() as p:
              chrome=shutil.which('google-chrome') or shutil.which('chromium')
              if not chrome: raise SystemExit('NO_CHROME')
              browser=p.chromium.launch(headless=True,executable_path=chrome)
              ctx=browser.new_context(user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36')
              page=ctx.new_page()
              api={'url':None}
              def capture(r):
                  if api['url'] is None and '/share/list?' in r.url and r.status==200:
                      api['url']=r.url
              page.on('response',capture)
              r=page.goto(TARGET,wait_until='domcontentloaded',timeout=90000)
              page.wait_for_timeout(9000)
              print('ROOT='+ROOT)
              print('HTTP='+str(r.status if r else None))
              if not api['url']: raise SystemExit('NO_ROOT_API')

              pr=urlparse(api['url'])
              base=dict(parse_qsl(pr.query,keep_blank_values=True))
              base.pop('root',None); base['num']='100'; base['by']='time'; base['order']='desc'
              def mk(path,pn):
                  q=dict(base); q['dir']=path; q['page']=str(pn)
                  return urlunparse((pr.scheme,pr.netloc,pr.path,pr.params,urlencode(q),pr.fragment))

              # (dir,page,retry)
              tasks=deque([(ROOT,1,0)])
              scheduled={(ROOT,1)}
              seen_dirs=set(); seen_files=set(); total_bytes=0; total_files=0
              requests=0; failures=0; exts=defaultdict(int)

              while tasks:
                  chunk=[]
                  while tasks and len(chunk)<BATCH: chunk.append(tasks.popleft())
                  urls=[mk(d,pn) for d,pn,_ in chunk]
                  raws=page.evaluate("""async (urls) => Promise.all(urls.map(async u => {
                    const c=new AbortController(); const t=setTimeout(()=>c.abort(),8000);
                    try { const r=await fetch(u,{credentials:'include',signal:c.signal}); return await r.text(); }
                    catch(e) { return JSON.stringify({errno:-998,err:String(e)}); }
                    finally { clearTimeout(t); }
                  }))""",urls)
                  requests+=len(chunk)

                  for (d,pn,retry),raw in zip(chunk,raws):
                      try: data=json.loads(raw)
                      except Exception: data={'errno':-997}
                      if data.get('errno')!=0:
                          if retry<MAX_RETRY:
                              tasks.append((d,pn,retry+1))
                          else:
                              failures+=1; print('FAIL='+d+'#'+str(pn)+' errno='+str(data.get('errno')))
                          continue
                      if pn==1: seen_dirs.add(d)
                      items=data.get('list') or []
                      for it in items:
                          path=str(it.get('path') or '')
                          isdir=str(it.get('isdir','0'))=='1' or it.get('isdir')==1
                          if isdir:
                              task=(path,1)
                              if path and task not in scheduled:
                                  scheduled.add(task); tasks.append((path,1,0))
                          else:
                              fid=str(it.get('fs_id') or path)
                              if fid in seen_files: continue
                              seen_files.add(fid)
                              size=int(it.get('size') or 0)
                              total_files+=1; total_bytes+=size
                              name=str(it.get('server_filename') or '')
                              m=re.search(r'(\.[A-Za-z0-9]{1,10})$',name)
                              exts[m.group(1).lower() if m else '(noext)']+=1
                      if len(items)>=100:
                          key=(d,pn+1)
                          if key not in scheduled and pn<1000:
                              scheduled.add(key); tasks.append((d,pn+1,0))

                  if requests % 300 < BATCH:
                      print(f'PROGRESS root={ROOT} requests={requests} pending={len(tasks)} dirs={len(seen_dirs)} files={total_files} size={human(total_bytes)} failures={failures}')
                  if requests>50000:
                      print('REQUEST_LIMIT=true'); break
                  time.sleep(0.03)

              print('RESULT='+json.dumps({
                  'root':ROOT,'requests':requests,'dirs':len(seen_dirs),'files':total_files,
                  'bytes':total_bytes,'size':human(total_bytes),'failures':failures,
                  'extensions':sorted(exts.items(),key=lambda x:x[1],reverse=True)[:15]
              },ensure_ascii=False))
              browser.close()
          PY
          python /tmp/branch_inventory.py
