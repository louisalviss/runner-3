name: Audio Library Raw Artifact xT9BmFa2HU

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-library-raw-artifact-xT9BmFa2HU.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CANONICAL_URL: https://www.reddit.com/r/AskReddit/comments/1vt15w3/what_is_the_best_feeling_youve_ever_experienced/
  ITEM_ID: b48c7298-bb9f-52ed-bd5d-efd2a53c1745

jobs:
  raw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction deps
        run: python -m pip install -q -U requests beautifulsoup4 lxml pypdf yt-dlp 'cryptography>=45,<47'
      - name: Extract raw source only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,tempfile,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import audio_library_extract_for_chatgpt as ex
          url='https://www.reddit.com/r/AskReddit/comments/1vt15w3/what_is_the_best_feeling_youve_ever_experienced/'
          with tempfile.TemporaryDirectory() as td:
              title,text,label,canonical=ex.extract_source(url,Path(td))
          payload={'id':'b48c7298-bb9f-52ed-bd5d-efd2a53c1745','sourceUrl':url,'canonicalUrl':canonical,'sourceLabel':label,'title':title,'rawText':text,'rawTruncated':False}
          Path('/tmp/source.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('/tmp/meta.json').write_text(json.dumps({'title':title,'chars':len(text),'canonical':canonical},ensure_ascii=False),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audio-xT9BmFa2HU-raw
          path: /tmp/source.json
          retention-days: 1
          if-no-files-found: error
      - name: Publish pointer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,datetime
          from pathlib import Path
          meta=json.loads(Path('/tmp/meta.json').read_text())
          out={'status':'ready','runId':int(os.environ['GITHUB_RUN_ID']),'artifactName':'audio-xT9BmFa2HU-raw','title':meta['title'],'chars':meta['chars'],'canonical':meta['canonical'],'updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          Path('ops/audio-library/raw-artifact-xT9BmFa2HU-pointer.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/audio-library/raw-artifact-xT9BmFa2HU-pointer.json
          git commit -m 'Publish xT9BmFa2HU raw artifact pointer [skip ci]' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
