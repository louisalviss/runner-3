name: YouTube video evidence test
on:
  push:
    paths:
      - '.github/workflows/youtube-test-olifZrb263k.yml'

jobs:
  client-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp and Deno
        shell: bash
        run: |
          set -e
          python -m pip install -q -U yt-dlp
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Probe no-cookie YouTube clients
        shell: bash
        run: |
          set +e
          mkdir -p evidence
          URL='https://youtu.be/olifZrb263k?si=812lEQiMA0kD8ULu'
          : > evidence/results.txt
          for CLIENT in web_embedded web_safari tv android_vr; do
            echo "===== $CLIENT =====" | tee -a evidence/results.txt
            timeout 30 yt-dlp \
              --js-runtimes deno --remote-components ejs:github \
              --no-playlist --skip-download \
              --extractor-args "youtube:player_client=$CLIENT;player_skip=webpage,configs" \
              --print 'OK id=%(id)s title=%(title)s duration=%(duration)s' \
              "$URL" 2>&1 | tee -a evidence/results.txt
            echo "exit=${PIPESTATUS[0]}" | tee -a evidence/results.txt
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-client-matrix
          path: evidence/
          retention-days: 1
