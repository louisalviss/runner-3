name: YouTube video evidence test
on:
  push:
    paths:
      - '.github/workflows/youtube-test-olifZrb263k.yml'

jobs:
  embed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install selenium
        run: python -m pip install -q -U selenium
      - name: Test official YouTube nocookie embed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import time, json, pathlib
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          out=pathlib.Path('evidence')
          url='https://www.youtube-nocookie.com/embed/olifZrb263k?autoplay=1&mute=1'
          opt=Options(); opt.page_load_strategy='eager'
          for x in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required','--window-size=1280,800']:
              opt.add_argument(x)
          d=webdriver.Chrome(options=opt)
          d.set_page_load_timeout(15)
          r={}
          try:
              try: d.get(url)
              except Exception as e: r['load_error']=repr(e)
              time.sleep(4)
              d.save_screenshot(str(out/'embed_04.png'))
              r['title']=d.title; r['url']=d.current_url
              r['state_04']=d.execute_script("""const v=document.querySelector('video'); if(!v)return {video:false}; v.muted=true; v.play().catch(()=>{}); return {video:true,currentTime:v.currentTime,duration:v.duration,paused:v.paused,readyState:v.readyState,networkState:v.networkState,src:v.currentSrc};""")
              time.sleep(5)
              d.save_screenshot(str(out/'embed_09.png'))
              r['state_09']=d.execute_script("""const v=document.querySelector('video'); if(!v)return {video:false}; return {video:true,currentTime:v.currentTime,duration:v.duration,paused:v.paused,readyState:v.readyState,networkState:v.networkState,src:v.currentSrc};""")
          finally:
              (out/'embed.json').write_text(json.dumps(r,ensure_ascii=False,indent=2),encoding='utf-8')
              d.quit()
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-olifZrb263k-embed-evidence
          path: evidence/
          retention-days: 1
