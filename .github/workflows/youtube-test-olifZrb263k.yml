name: YouTube video evidence test
on:
  push:
    paths:
      - '.github/workflows/youtube-test-olifZrb263k.yml'

jobs:
  warp-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Cloudflare WARP
        shell: bash
        run: |
          set -e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
      - name: Connect WARP and probe YouTube
        shell: bash
        run: |
          set +e
          mkdir -p evidence
          echo '=== before ===' | tee evidence/result.txt
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|warp)=' | tee -a evidence/result.txt
          warp-cli --accept-tos registration new 2>&1 | tee -a evidence/result.txt
          warp-cli --accept-tos mode warp+doh 2>&1 | tee -a evidence/result.txt
          warp-cli --accept-tos connect 2>&1 | tee -a evidence/result.txt
          for i in {1..12}; do
            sleep 1
            X=$(curl -s --max-time 5 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp=' || true)
            echo "try=$i $X" | tee -a evidence/result.txt
            echo "$X" | grep -q 'warp=on' && break
          done
          echo '=== after ===' | tee -a evidence/result.txt
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|warp)=' | tee -a evidence/result.txt
          python -m pip install -q -U yt-dlp
          yt-dlp --no-playlist --skip-download --print '%(title)s' 'https://youtu.be/olifZrb263k' 2>&1 | tee -a evidence/result.txt
          echo '=== piped ===' | tee -a evidence/result.txt
          curl -L -sS -o evidence/piped.json -w '%{http_code}\n' --max-time 20 'https://pipedapi.kavin.rocks/streams/olifZrb263k' | tee -a evidence/result.txt
          python - <<'PY' 2>&1 | tee -a evidence/result.txt
          import json, pathlib
          p=pathlib.Path('evidence/piped.json')
          try:
            j=json.loads(p.read_text())
            print('title=',j.get('title'),'videoStreams=',len(j.get('videoStreams') or []),'audioStreams=',len(j.get('audioStreams') or []))
          except Exception as e: print('piped_parse=',repr(e),p.read_text(errors='replace')[:200] if p.exists() else '')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-olifZrb263k-warp-test
          path: evidence/
          retention-days: 1
