name: YouTube video evidence test
on:
  push:
    paths:
      - '.github/workflows/youtube-test-olifZrb263k.yml'

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install selenium
        run: python -m pip install -q -U selenium pillow
      - name: Open YouTube in Chrome and capture player
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          google-chrome --version | tee evidence/chrome-version.txt
          python - <<'PY'
          import time, json, pathlib
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys

          out=pathlib.Path('evidence')
          url='https://youtu.be/olifZrb263k?si=812lEQiMA0kD8ULu'
          opt=Options()
          opt.add_argument('--headless=new')
          opt.add_argument('--no-sandbox')
          opt.add_argument('--disable-dev-shm-usage')
          opt.add_argument('--autoplay-policy=no-user-gesture-required')
          opt.add_argument('--window-size=1280,900')
          opt.add_argument('--lang=en-US')
          d=webdriver.Chrome(options=opt)
          result={}
          try:
              d.get(url)
              time.sleep(4)
              result['title']=d.title
              result['url']=d.current_url
              result['page_source_head']=d.page_source[:5000]
              d.save_screenshot(str(out/'page_00.png'))
              # Try normal player controls and keyboard shortcut.
              try:
                  body=d.find_element(By.TAG_NAME,'body')
                  body.send_keys('k')
              except Exception as e:
                  result['key_error']=repr(e)
              time.sleep(3)
              d.save_screenshot(str(out/'page_03.png'))
              # Pull HTML5 video state if player exists.
              state=d.execute_script("""
                const v=document.querySelector('video');
                if(!v) return {video:false};
                return {video:true,currentTime:v.currentTime,duration:v.duration,paused:v.paused,readyState:v.readyState,networkState:v.networkState,src:v.currentSrc};
              """)
              result['state_03']=state
              time.sleep(5)
              d.save_screenshot(str(out/'page_08.png'))
              result['state_08']=d.execute_script("""
                const v=document.querySelector('video');
                if(!v) return {video:false};
                return {video:true,currentTime:v.currentTime,duration:v.duration,paused:v.paused,readyState:v.readyState,networkState:v.networkState,src:v.currentSrc};
              """)
          finally:
              (out/'browser.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
              d.quit()
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-olifZrb263k-browser-evidence
          path: evidence/
          retention-days: 1
