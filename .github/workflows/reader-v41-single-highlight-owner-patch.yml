name: Reader v41 Single Highlight Owner Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reader-v41-single-highlight-owner-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch single audio highlight ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js')
          s=p.read_text(encoding='utf-8')
          old="""  function applyExactHighlight(range){
    if(!range)return;
    const doc=range.startContainer&&range.startContainer.ownerDocument;
    ensureFrameHooks(doc);
    try{
      const win=doc.defaultView;
      if(win&&win.CSS&&win.CSS.highlights&&typeof win.Highlight==='function'){
        win.CSS.highlights.set(highlightName,new win.Highlight(range));
      }
    }catch{}
  }
"""
          new="""  function clearAllAudioHighlights(exceptDoc=null){
    const docs=new Set();
    for(const frame of document.querySelectorAll('#viewer iframe')){
      try{if(frame.contentDocument)docs.add(frame.contentDocument);}catch{}
    }
    try{
      for(const content of bridge()?.contents?.()||[]){
        const doc=content&&content.document;
        if(doc)docs.add(doc);
      }
    }catch{}
    if(activeDoc)docs.add(activeDoc);
    for(const doc of docs){
      try{doc.querySelectorAll('[data-r3-audio-reading-v11]').forEach(el=>el.removeAttribute('data-r3-audio-reading-v11'));}catch{}
      try{
        const registry=doc.defaultView&&doc.defaultView.CSS&&doc.defaultView.CSS.highlights;
        if(!registry)continue;
        registry.delete(highlightName);
        try{
          for(const item of registry){
            const name=Array.isArray(item)?item[0]:item;
            if(String(name||'').startsWith('r3-audio-'))registry.delete(name);
          }
        }catch{}
      }catch{}
    }
  }

  function applyExactHighlight(range){
    if(!range)return;
    const doc=range.startContainer&&range.startContainer.ownerDocument;
    if(!doc)return;
    clearAllAudioHighlights(doc);
    ensureFrameHooks(doc);
    try{
      const win=doc.defaultView;
      if(win&&win.CSS&&win.CSS.highlights&&typeof win.Highlight==='function'){
        win.CSS.highlights.set(highlightName,new win.Highlight(range));
      }
    }catch{}
  }
"""
          if old not in s:
              raise SystemExit('applyExactHighlight marker missing')
          if s.count(old)!=1:
              raise SystemExit('applyExactHighlight marker ambiguous')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          grep -q 'function clearAllAudioHighlights' cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          grep -q "startsWith('r3-audio-')" cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          grep -q 'clearAllAudioHighlights(doc);' cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reader-v41-single-highlight-owner-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js .github/workflows/reader-v41-single-highlight-owner-patch.yml
          git commit -m 'fix(reader): enforce one active audio highlight across rendition'
          git push origin HEAD:main
