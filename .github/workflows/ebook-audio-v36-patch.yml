name: Ebook Audio V36 Patch

on:
  push:
    branches:
      - fix/ebook-audio-v36-continuity
    paths:
      - .github/workflows/ebook-audio-v36-patch.yml
      - scripts/_tmp_patch_ebook_audio_v36.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ebook-audio-v36-continuity
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/_tmp_patch_ebook_audio_v36.py

      - name: Validate functional sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ebook_reader_audio_tts_vps.py
          node --check cloudflare/runner3-core/src/ebook-reader-audio.js
          node --check cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js
          node --check cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          node --check cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          grep -q 'EBOOK_AUDIO_VPS_CONCURRENCY' scripts/ebook_reader_audio_tts_vps.py
          grep -q 'PROCESSING_LEASE_MS' cloudflare/runner3-core/src/ebook-reader-audio.js
          grep -q 'chuẩn bị liền mạch' cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          grep -q 'primePrefetch(){schedulePrefetch();return prefetchOne(1);}' cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js
          ! grep -q 'const shouldDispatch = url.pathname === "/artifact-library/audio"' cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js

      - name: Commit functional patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ebook_reader_audio_tts_vps.py \
            cloudflare/runner3-core/src/ebook-reader-audio.js \
            cloudflare/runner3-core/artifact-library-reader-v7-github-audio-entry.js \
            cloudflare/runner3-core/artifact-library-reader-v34-continuous-range-sync-entry.js \
            cloudflare/runner3-core/artifact-library-reader-v35-continuity-single-owner-entry.js \
            cloudflare/runner3-core/reader-audio-core/browser-production-integration.js
          if git diff --cached --quiet; then
            echo 'FUNCTIONAL_PATCH=no_change'
            exit 0
          fi
          git commit -m 'fix(ebook-audio): warm ahead and synthesize concurrently'
          git push origin HEAD:fix/ebook-audio-v36-continuity
