name: JJK Xonada Story V7
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/jjk-xonada-story-v7.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl openvpn iproute2 iptables
          python -m pip install -q -U yt-dlp numpy

      - name: Download JJK official PV through isolated VPN
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 35 https://www.vpngate.net/api/iphone/ -o vpn.csv
          python <<'PY'
          import csv,base64
          rows=[]
          for r in csv.reader(open('vpn.csv',encoding='utf-8-sig',errors='replace')):
              if len(r)<15 or not r or r[0].startswith(('*','#')): continue
              cc=r[6].strip().upper()
              if cc not in {'VN','JP','KR'}: continue
              try: rows.append((0 if cc=='VN' else 1,-int(r[2] or 0),cc,r[1],base64.b64decode(r[14]).decode('utf8','replace')))
              except: pass
          rows.sort(); rows=rows[:6]
          with open('vpns.tsv','w') as m:
              for i,(_,_,cc,ip,cfg) in enumerate(rows):
                  p=f'v{i}.ovpn'; open(p,'w').write(cfg+'\nauth-nocache\nconnect-retry-max 1\nconnect-timeout 7\n'); m.write(f'{p}\t{cc}\t{ip}\n')
          PY
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vv
          sudo ip link set vv netns vpnns
          sudo ip addr add 10.203.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.203.0.2/24 dev vv
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vv up
          sudo ip netns exec vpnns ip route add default via 10.203.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          W=$(ip route show default|awk '/default/{print $5;exit}')
          sudo iptables -t nat -A POSTROUTING -s 10.203.0.0/24 -o "$W" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$W" -j ACCEPT
          sudo iptables -A FORWARD -i "$W" -o vh -m state --state RELATED,ESTABLISHED -j ACCEPT
          Y=$(command -v yt-dlp); got=0
          while IFS=$'\t' read -r p cc ip; do
            [ -f /tmp/v.pid ] && sudo kill "$(cat /tmp/v.pid)" 2>/dev/null || true
            sudo rm -f /tmp/v.pid /tmp/v.log
            sleep 1
            sudo ip netns exec vpnns openvpn --config "$GITHUB_WORKSPACE/$p" --daemon --writepid /tmp/v.pid --log /tmp/v.log || true
            tun=0
            for n in $(seq 1 12); do sudo ip netns exec vpnns ip link show tun0 >/dev/null 2>&1 && { tun=1; break; }; sleep 1; done
            [ "$tun" = 1 ] || continue
            eg=$(sudo ip netns exec vpnns curl -4 -fsS --max-time 8 https://api.ipify.org || true)
            [ -n "$eg" ] || continue
            echo "EGRESS=$eg $cc"
            rm -f source.*
            if timeout 105s sudo ip netns exec vpnns env PATH="$PATH" HOME="$HOME" "$Y" --no-playlist --retries 1 --socket-timeout 15 --js-runtimes node --remote-components ejs:github -f 'bv*[height<=1080]+ba/b[height<=1080]' --merge-output-format mp4 -o "$GITHUB_WORKSPACE/source.%(ext)s" 'https://www.youtube.com/watch?v=DKNM-3LpfZE'; then
              f=$(find . -maxdepth 1 -name 'source*.mp4'|head -1)
              [ -n "$f" ] && { [ "$f" = './source.mp4' ] || mv "$f" source.mp4; got=1; break; }
            fi
          done < vpns.tsv
          [ "$got" = 1 ] || exit 22
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name -of default=nw=1 source.mp4

      - name: Download official MONTAGEM XONADA preview
        shell: bash
        run: |
          set -euo pipefail
          API='https://itunes.apple.com/search?term=MONTAGEM%20XONADA%20MXZI%20Dj%20Samir%20DJ%20Javi26&entity=song&limit=50&country=US'
          curl -fsSL --max-time 30 "$API" -o itunes.json
          python <<'PY'
          import json
          data=json.load(open('itunes.json'))
          cand=[]
          for x in data.get('results',[]):
              name=(x.get('trackName') or '').strip().lower()
              artist=(x.get('artistName') or '').lower()
              u=x.get('previewUrl')
              if name=='montagem xonada' and u and ('mxzi' in artist or 'samir' in artist or 'javi26' in artist):
                  cand.append(x)
          if not cand:
              raise SystemExit('NO_MATCHING_ITUNES_PREVIEW')
          x=cand[0]
          print('TRACK',x.get('trackName'),'ARTIST',x.get('artistName'),'PREVIEW',x.get('previewUrl'))
          open('preview_url.txt','w').write(x['previewUrl'])
          PY
          curl -fL --max-time 45 -A 'Mozilla/5.0' "$(cat preview_url.txt)" -o xonada_preview.m4a
          ffprobe -v error -show_entries format=duration,size,format_name -of default=nw=1 xonada_preview.m4a

      - name: Story-first select and render
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import subprocess, numpy as np, json
          # Analyze source in chronological order. Score a CONTIGUOUS 30s window,
          # not isolated motion peaks, to preserve narrative continuity.
          fps=4; w,h=192,108; sz=w*h*3
          p=subprocess.Popen(['ffmpeg','-loglevel','error','-i','source.mp4','-vf',f'scale={w}:{h},fps={fps}','-pix_fmt','rgb24','-f','rawvideo','-'],stdout=subprocess.PIPE)
          frames=[]
          while True:
              b=p.stdout.read(sz)
              if len(b)<sz: break
              frames.append(np.frombuffer(b,np.uint8).reshape(h,w,3))
          p.wait()
          scores=[]
          prev=None
          for i,x in enumerate(frames):
              gray=(.299*x[:,:,0]+.587*x[:,:,1]+.114*x[:,:,2])
              detail=float(gray.std())
              sat=float((x.max(2)-x.min(2)).mean())
              motion=0.0 if prev is None else float(np.abs(gray-prev).mean())
              # sustained visual/action quality; penalize title/black/flat cards
              q=motion*1.25 + min(detail,75)*.22 + min(sat,90)*.12
              if detail<18 or gray.mean()<18 or gray.mean()>238: q-=24
              scores.append(q); prev=gray
          n=len(scores); win=int(30*fps)
          best=None
          # avoid first/last second; source is ~45s
          for s in range(4, max(5,n-win-4)):
              arr=np.array(scores[s:s+win])
              # reward sustained energy, not single spikes
              val=float(arr.mean()+np.percentile(arr,35)*.45)
              if best is None or val>best[0]: best=(val,s/fps)
          start=max(0.0,best[1] if best else 5.0)
          if start+30>len(frames)/fps: start=max(0,len(frames)/fps-30)
          print('STORY_WINDOW_START',start,'SCORE',best[0] if best else None)
          json.dump({'start':start,'duration':30.0},open('story.json','w'))
          PY
          START=$(python -c "import json;print(json.load(open('story.json'))['start'])")
          # Keep the trailer's chronological storytelling intact. Effects are restrained.
          ffmpeg -hide_banner -loglevel error -y -ss "$START" -i source.mp4 -t 30 \
            -filter_complex "[0:v]split=2[b][f];[b]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=32,eq=brightness=-0.23:saturation=0.72[b2];[f]scale=1024:576,eq=contrast=1.07:saturation=1.10,unsharp=5:5:0.30:5:5:0[f2];[b2][f2]overlay=(W-w)/2:(H-h)/2,fps=30,format=yuv420p[v]" \
            -map '[v]' -an -c:v libx264 -preset medium -crf 18 -profile:v high -level 4.1 -pix_fmt yuv420p story_visual.mp4
          # Official preview is ~30s. Use only that preview; no pirate audio source.
          ffmpeg -hide_banner -loglevel error -y -stream_loop 1 -i xonada_preview.m4a -i story_visual.mp4 -t 30 \
            -map 1:v -map 0:a -c:v copy -af 'volume=.98,bass=g=3:f=90,alimiter=limit=.95' -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart jjk_xonada_story_v7.mp4
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,sample_rate,channels -show_entries format=duration,size,bit_rate -of default=nw=1 jjk_xonada_story_v7.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 3 -i jjk_xonada_story_v7.mp4 -frames:v 1 qa_03.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 12 -i jjk_xonada_story_v7.mp4 -frames:v 1 qa_12.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 22 -i jjk_xonada_story_v7.mp4 -frames:v 1 qa_22.jpg

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: jjk-xonada-story-v7
          path: |
            jjk_xonada_story_v7.mp4
            qa_03.jpg
            qa_12.jpg
            qa_22.jpg
            story.json
          retention-days: 3
