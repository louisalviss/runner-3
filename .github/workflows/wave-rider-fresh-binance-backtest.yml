name: Wave Rider Fresh Binance Backtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wave-rider-fresh-binance-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BNBUSDT, TRXUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WR_SYMBOL: ${{ matrix.symbol }}
      WR_START: 2026-07-27
      WR_END: 2026-08-16
    steps:
      - uses: actions/checkout@v4

      - name: Run parity engine on fresh Binance USD-M public candles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wave-rider-verify/output
          python3 wave-rider-verify/reference_verify_parity.py | tee /tmp/${WR_SYMBOL}-fresh-run.txt

      - name: Compare fresh 5m result with TradingView golden
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,json,os
          sym=os.environ['WR_SYMBOL']
          rows=list(csv.DictReader(open(f'wave-rider-verify/output/{sym}_5m_trades.csv',newline='')))
          s=json.load(open(f'wave-rider-verify/output/{sym}_5m_summary.json'))
          g=json.load(open('wave-rider-verify/golden/tv_5m_accounting_2026-07-27_2026-08-16.json'))['symbols'][sym]
          n=json.load(open('wave-rider-verify/golden/tv_5m_native_execution_2026-07-27_2026-08-16.json'))['symbols'][sym]
          diffs=[]
          for i,(r,tv) in enumerate(zip(rows,n),1):
              bad={}
              for k in ('side','entry_time','exit_time'):
                  if r[k]!=tv[k]: bad[k]={'binance':r[k],'tradingview':tv[k]}
              for k in ('entry','exit_price'):
                  a=float(r[k]); b=float(tv[k])
                  if abs(a-b)>1e-12: bad[k]={'binance':a,'tradingview':b,'delta':a-b}
              if bad: diffs.append({'trade':i,'fields':bad})
          out={
            'symbol':sym,
            'candle_source':'Binance USD-M public daily 1m klines -> locally aggregated 5m',
            'window':'2026-07-27..2026-08-16 UTC',
            'trades':len(rows),
            'tv_trades':len(n),
            'total_r':float(s['total_r']),
            'tv_total_r_exact':float(g['total_r_exact']),
            'total_r_delta':float(s['total_r'])-float(g['total_r_exact']),
            'win_rate':s['win_rate'],
            'profit_factor':s['profit_factor'],
            'max_dd_pct':s['max_dd_pct'],
            'max_losing_streak':s['max_losing_streak'],
            'exit_counts':s['exit_counts'],
            'native_execution_diffs':diffs,
            'exact_native_execution':len(rows)==len(n) and not diffs,
            'exact_total_r':abs(float(s['total_r'])-float(g['total_r_exact']))<=1e-12,
            'missing_source_days':json.load(open('wave-rider-verify/output/master.json')).get('missing',[])
          }
          open(f'/tmp/{sym}-fresh-compare.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Upload fresh backtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr-fresh-binance-${{ matrix.symbol }}-${{ github.run_id }}
          path: |
            wave-rider-verify/output/${{ matrix.symbol }}_5m_trades.csv
            wave-rider-verify/output/${{ matrix.symbol }}_5m_summary.json
            wave-rider-verify/output/master.json
            /tmp/${{ matrix.symbol }}-fresh-run.txt
            /tmp/${{ matrix.symbol }}-fresh-compare.json
          if-no-files-found: warn
          retention-days: 3
