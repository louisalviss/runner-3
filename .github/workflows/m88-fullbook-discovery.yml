name: M88 fullbook discovery

on:
  push:
    paths:
      - '.github/workflows/m88-fullbook-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect fullbook payload structure
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,requests,collections
          u='https://www.888scoreonline.net/OddsData.aspx?companyid=17'
          r=requests.get(u,headers={'User-Agent':'runner3-m88-public-feed/1.2'},timeout=25)
          body=r.text
          lines=body.splitlines()
          vars1=re.findall(r'(?m)^\s*(?:var\s+)?([A-Za-z_$][\w$]*)\s*=',body)
          funcs=re.findall(r'(?m)^\s*function\s+([A-Za-z_$][\w$]*)\s*\(',body)
          urls=re.findall(r'https?://[^\s\"\']+',body)
          samples={}
          for needle in ['FCSB','Bulleen','Mansion88','companyid','OddsData','17','Pisa','Empoli']:
              i=body.lower().find(needle.lower())
              if i>=0:
                  samples[needle]=body[max(0,i-500):i+1200]
          # capture likely record constructors/arrays without dumping the full 1.8MB
          recordish=[]
          for line in lines:
              ll=line.strip()
              if len(ll)>60 and any(tok in ll.lower() for tok in ['array(', 'new array', '[', 'fcsb', 'bulleen', 'pisa']):
                  recordish.append(ll[:1800])
                  if len(recordish)>=30: break
          out={
            'status':r.status_code,
            'content_type':r.headers.get('content-type'),
            'encoding':r.encoding,
            'bytes':len(r.content),
            'chars':len(body),
            'line_count':len(lines),
            'prefix':body[:12000],
            'suffix':body[-6000:],
            'variable_names':collections.Counter(vars1).most_common(80),
            'function_names':funcs[:80],
            'urls':urls[:50],
            'samples':samples,
            'recordish':recordish,
            'delimiters':{
              'pipe':body.count('|'),'comma':body.count(','),'semicolon':body.count(';'),
              'open_bracket':body.count('['),'open_paren':body.count('('),'quote':body.count('"')
            }
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          open('/tmp/m88-payload-format.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m88-payload-format-${{ github.run_id }}
          path: /tmp/m88-payload-format.json
          retention-days: 2
