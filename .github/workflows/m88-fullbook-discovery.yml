name: M88 fullbook discovery

on:
  push:
    paths:
      - '.github/workflows/m88-fullbook-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify M88 fullbook joins
        shell: bash
        run: |
          python3 - <<'PY'
          import json, requests, collections
          from datetime import datetime, timezone

          u='https://www.888scoreonline.net/OddsData.aspx?companyid=17'
          r=requests.get(u,headers={'User-Agent':'runner3-m88-public-feed/1.4'},timeout=25)
          r.raise_for_status()
          domains=r.text.split('$')
          if len(domains) < 5:
              raise SystemExit(f'bad domain count: {len(domains)}')

          def records(idx):
              return [x for x in domains[idx].split(';') if x.strip()]

          leagues={}
          for rec in records(0):
              p=rec.split(',')
              if len(p)>=6:
                  leagues[p[0]]={'league_id':p[0],'league':p[5] or p[3] or p[4]}

          matches={}
          for rec in records(1):
              p=rec.split(',')
              if len(p)>=20:
                  matches[p[0]]={
                    'match_id':p[0],'league_id':p[1],'start_ms':p[2],
                    'home':p[7],'away':p[12],
                    'state':p[14],'home_score':p[15],'away_score':p[16],
                    'neutral':p[18],'level':p[19]
                  }

          # Some odds records may encode market/channel prefixes in front of the real match id.
          # Resolve only when the match id is an exact suffix and the suffix is unique.
          match_ids=sorted(matches.keys(), key=len, reverse=True)
          def resolve_mid(raw):
              if raw in matches:
                  return raw,'exact'
              hits=[m for m in match_ids if raw.endswith(m)]
              if len(hits)==1:
                  return hits[0],f'suffix:{raw[:-len(hits[0])]}'
              return None,'unresolved'

          specs={
            'asian_handicap':(2,10),
            '1x2':(3,8),
            'over_under':(4,8),
          }
          out={
            'source':u,'status':r.status_code,'bytes':len(r.content),
            'domain_count':len(domains),
            'domain_record_counts':[len(records(i)) for i in range(len(domains))],
            'league_count':len(leagues),'match_count':len(matches),'markets':{},
          }

          for market,(idx,min_fields) in specs.items():
              total=0; exact=0; suffix=0; unresolved=[]; examples=[]; prefixes=collections.Counter()
              seen_pairs=set()
              for rec in records(idx):
                  p=rec.split(',')
                  if len(p)<min_fields or p[1] != '17':
                      continue
                  total += 1
                  mid,mode=resolve_mid(p[0])
                  if mode=='exact': exact+=1
                  elif mode.startswith('suffix:'):
                      suffix+=1; prefixes[mode.split(':',1)[1]]+=1
                  else:
                      unresolved.append({'raw_id':p[0],'fields':p[:12]})
                      continue
                  m=matches[mid]; league=leagues.get(m['league_id'],{}).get('league','')
                  row={'raw_match_id':p[0],'match_id':mid,'join_mode':mode,'league':league,'home':m['home'],'away':m['away']}
                  if market=='asian_handicap':
                      row.update({'open_handicap':p[2],'open_home':p[3],'open_away':p[4],'handicap':p[5],'home_odds':p[6],'away_odds':p[7],'extra':p[8:]})
                  elif market=='1x2':
                      row.update({'open_home':p[2],'open_draw':p[3],'open_away':p[4],'home_odds':p[5],'draw_odds':p[6],'away_odds':p[7],'extra':p[8:]})
                  else:
                      row.update({'open_total':p[2],'open_over':p[3],'open_under':p[4],'total':p[5],'over_odds':p[6],'under_odds':p[7],'extra':p[8:]})
                  key=(mid,market)
                  if key not in seen_pairs and len(examples)<12:
                      examples.append(row); seen_pairs.add(key)
              out['markets'][market]={
                'm88_records':total,'exact_join':exact,'suffix_join':suffix,
                'joined':exact+suffix,'join_ratio':round((exact+suffix)/total,6) if total else 0,
                'prefixes':prefixes.most_common(20),'unresolved_count':len(unresolved),
                'unresolved_examples':unresolved[:15],'joined_examples':examples
              }

          print(json.dumps(out,ensure_ascii=False,indent=2))
          open('/tmp/m88-join-verification.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          if any(v['join_ratio'] < 0.95 for v in out['markets'].values()):
              raise SystemExit('join ratio below 95%')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-join-verification-${{ github.run_id }}
          path: /tmp/m88-join-verification.json
          retention-days: 2
