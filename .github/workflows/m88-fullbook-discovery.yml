name: M88 fullbook discovery

on:
  push:
    paths:
      - '.github/workflows/m88-fullbook-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install decoder deps
        run: python3 -m pip install -q requests beautifulsoup4
      - name: Decode public fullbook protocol
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,requests,hashlib,collections
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'runner3-m88-public-feed/1.3'})
          out={'payloads':{},'parser_hints':[]}

          for cid in ['', '3','8','17','31']:
              u='https://www.888scoreonline.net/OddsData.aspx'
              r=s.get(u,params={'companyid':cid} if cid else None,timeout=25)
              b=r.text
              delim={c:b.count(c) for c in ['^','$','@','#','~','`','!','*','|','\n','\r']}
              recs=b.split(';')
              second=[]; lens=[]
              for rec in recs:
                  p=rec.split(',')
                  lens.append(len(p))
                  if len(p)>=8 and p[0].strip().isdigit() and p[1].strip().lstrip('-').isdigit(): second.append(p[1].strip())
              out['payloads'][cid or 'empty']={
                'status':r.status_code,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),
                'semicolon_records':len(recs),'field_count_top':collections.Counter(lens).most_common(15),
                'second_field_top':collections.Counter(second).most_common(30),'delims':delim,
                'prefix':b[:1200],'middle':b[len(b)//2:len(b)//2+1200],'suffix':b[-1600:]
              }

          page=s.get('https://www.888scoreonline.net/Comp.htm',timeout=20)
          soup=BeautifulSoup(page.text,'html.parser')
          assets=[]
          for tag in soup.find_all('script'):
              src=tag.get('src')
              if src: assets.append(urljoin(page.url,src))
              else:
                  t=tag.get_text('\n')
                  if any(k.lower() in t.lower() for k in ['OddsData','companyid','split(','responseText']):
                      out['parser_hints'].append({'url':'INLINE','snippet':t[:12000]})
          for u in assets:
              try:
                  r=s.get(u,timeout=15); t=r.text; low=t.lower(); hits=[]
                  for key in ['oddsdata.aspx','companyid','responsetext','split(','xmlhttp']:
                      pos=0
                      while True:
                          i=low.find(key,pos)
                          if i<0: break
                          hits.append(t[max(0,i-1000):i+2500])
                          pos=i+len(key)
                          if len(hits)>=10: break
                  if hits: out['parser_hints'].append({'url':u,'bytes':len(r.content),'hits':hits[:10]})
              except Exception:
                  pass

          print(json.dumps(out,ensure_ascii=False,indent=2))
          open('/tmp/m88-protocol.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m88-protocol-${{ github.run_id }}
          path: /tmp/m88-protocol.json
          retention-days: 2
