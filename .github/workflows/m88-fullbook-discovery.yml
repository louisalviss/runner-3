name: M88 fullbook discovery

on:
  push:
    paths:
      - '.github/workflows/m88-fullbook-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install parser deps
        run: python3 -m pip install -q requests beautifulsoup4

      - name: Inspect forms and test Mansion88 selectors
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session()
          s.headers.update({'User-Agent':'runner3-m88-public-feed/1.1','Accept':'text/html,application/xhtml+xml'})
          pages={
            'comp':'https://www.888scoreonline.net/Comp.htm',
            'ou':'https://www.888scoreonline.net/OU.htm',
            'live':'https://www.888scoreonline.net/OddsLive.htm',
          }
          out={'forms':{},'tests':[]}

          for name,url in pages.items():
              r=s.get(url,timeout=20)
              soup=BeautifulSoup(r.content,'html.parser')
              forms=[]
              for fi,f in enumerate(soup.find_all('form')):
                  inputs=[]
                  for inp in f.find_all(['input','select','button']):
                      rec={'tag':inp.name,'name':inp.get('name'),'type':inp.get('type'),'value':inp.get('value'),'id':inp.get('id')}
                      if inp.name=='select':
                          rec['options']=[{'value':o.get('value'),'text':' '.join(o.stripped_strings),'selected':o.has_attr('selected')} for o in inp.find_all('option')[:25]]
                      inputs.append(rec)
                  forms.append({'index':fi,'action':urljoin(r.url,f.get('action') or ''),'method':(f.get('method') or 'get').lower(),'inputs':inputs[:120]})
              out['forms'][name]={'status':r.status_code,'bytes':len(r.content),'forms':forms}

              # Search raw source around form submit / data endpoints.
              raw=r.text
              hints=[]
              for pat in [r'[^\"\']{0,120}OddsData\.aspx[^\"\']{0,180}', r'[^\"\']{0,120}companyID[^\"\']{0,180}', r'[^\"\']{0,120}submit[^\"\']{0,180}']:
                  hints += re.findall(pat, raw, flags=re.I)[:20]
              out['forms'][name]['hints']=hints[:40]

          test_specs=[
            ('comp_get_c1','GET',pages['comp'],{'companyID1':'17'}),
            ('comp_get_c2','GET',pages['comp'],{'companyID2':'17'}),
            ('comp_get_both','GET',pages['comp'],{'companyID1':'17','companyID2':'17'}),
            ('ou_get','GET',pages['ou'],{'companyID1':'17'}),
            ('live_get','GET',pages['live'],{'companyID1':'17'}),
            ('oddsdata_17','GET','https://www.888scoreonline.net/OddsData.aspx',{'companyid':'17'}),
            ('oddsdata_17_caps','GET','https://www.888scoreonline.net/OddsData.aspx',{'companyID':'17'}),
          ]
          for label,method,url,data in test_specs:
              try:
                  rr=s.request(method,url,params=data if method=='GET' else None,data=data if method=='POST' else None,timeout=20,allow_redirects=True)
                  soup=BeautifulSoup(rr.content,'html.parser')
                  rows=[]
                  for tr in soup.find_all('tr'):
                      cells=[' '.join(td.stripped_strings) for td in tr.find_all(['td','th'])]
                      if len(cells)>=5:
                          rows.append(cells[:12])
                  text=' '.join(soup.stripped_strings)
                  out['tests'].append({'label':label,'status':rr.status_code,'final_url':rr.url,'bytes':len(rr.content),'mansion88':'mansion88' in text.lower(),'row_count':len(rows),'sample_rows':rows[:10]})
              except Exception as e:
                  out['tests'].append({'label':label,'error':repr(e)})

          print(json.dumps(out,ensure_ascii=False,indent=2))
          open('/tmp/m88-fullbook-discovery.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: m88-fullbook-discovery-${{ github.run_id }}
          path: /tmp/m88-fullbook-discovery.json
          retention-days: 2
