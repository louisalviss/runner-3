name: Runner3 D1 Usage Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '35 * * * *'

permissions:
  contents: read

concurrency:
  group: runner3-d1-usage-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_DB_NAME: runner3-core
      WARN_ROWS: '50000'
      ALERT_ROWS: '70000'
      EMERGENCY_ROWS: '90000'
    steps:
      - name: Check Runner3 D1 daily rows written
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, urllib.error, urllib.request

          token = os.environ['CF_TOKEN']
          account = os.environ['CF_ACCOUNT']
          target_name = os.environ['TARGET_DB_NAME']
          warn_rows = int(os.environ['WARN_ROWS'])
          alert_rows = int(os.environ['ALERT_ROWS'])
          emergency_rows = int(os.environ['EMERGENCY_ROWS'])
          base = 'https://api.cloudflare.com/client/v4'
          headers = {
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json',
              'Accept': 'application/json',
          }

          def request_json(url, method='GET', payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.loads(response.read().decode())
              except urllib.error.HTTPError as exc:
                  try:
                      data = json.loads(exc.read().decode())
                  except Exception:
                      data = {}
                  return exc.code, data

          db_code, db_data = request_json(f'{base}/accounts/{account}/d1/database?page=1&per_page=1000')
          if db_code != 200:
              raise SystemExit(f'D1 inventory failed: HTTP {db_code}')
          target = next((db for db in db_data.get('result', []) if db.get('name') == target_name), None)
          if not target or not target.get('uuid'):
              raise SystemExit(f'D1 database not found: {target_name}')
          target_id = str(target['uuid'])

          now = datetime.datetime.now(datetime.timezone.utc)
          midnight = now.replace(hour=0, minute=0, second=0, microsecond=0)
          today = now.date().isoformat()
          query = '''
          query Usage($accountTag: string, $dateStart: Date, $dateEnd: Date) {
            viewer {
              accounts(filter: {accountTag: $accountTag}) {
                d1AnalyticsAdaptiveGroups(
                  limit: 10000,
                  filter: {date_geq: $dateStart, date_leq: $dateEnd}
                ) {
                  dimensions { databaseId }
                  sum { readQueries writeQueries rowsRead rowsWritten }
                }
              }
            }
          }
          '''
          variables = {
              'accountTag': account,
              'dateStart': today,
              'dateEnd': today,
          }
          gql_code, gql_data = request_json(base + '/graphql', 'POST', {'query': query, 'variables': variables})
          if gql_code != 200 or gql_data.get('errors'):
              raise SystemExit(f'Cloudflare GraphQL failed: HTTP {gql_code} errors={gql_data.get("errors", [])[:2]}')

          try:
              rows = gql_data['data']['viewer']['accounts'][0]['d1AnalyticsAdaptiveGroups']
          except Exception as exc:
              raise SystemExit(f'Unexpected GraphQL response: {exc}')

          totals = {'readQueries': 0, 'writeQueries': 0, 'rowsRead': 0, 'rowsWritten': 0}
          for row in rows:
              if str((row.get('dimensions') or {}).get('databaseId')) != target_id:
                  continue
              sums = row.get('sum') or {}
              for key in totals:
                  totals[key] += int(sums.get(key) or 0)

          elapsed_hours = max((now - midnight).total_seconds() / 3600.0, 0.01)
          projected_rows = round(totals['rowsWritten'] * 24.0 / elapsed_hours)
          result = {
              'checkedAt': now.isoformat().replace('+00:00', 'Z'),
              'dateUtc': today,
              'database': target_name,
              'databaseId': target_id,
              **totals,
              'elapsedHoursUtc': round(elapsed_hours, 2),
              'projectedRowsWrittenAtCurrentPace': projected_rows,
              'thresholds': {
                  'warn': warn_rows,
                  'alert': alert_rows,
                  'emergency': emergency_rows,
                  'freeTierHardLimit': 100000,
              },
          }
          print(json.dumps(result, indent=2))

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('## Runner3 D1 usage watch\n\n')
                  handle.write(f"- UTC date: `{today}`\n")
                  handle.write(f"- Rows written: **{totals['rowsWritten']:,}** / 100,000\n")
                  handle.write(f"- Rows read: {totals['rowsRead']:,}\n")
                  handle.write(f"- Write queries: {totals['writeQueries']:,}\n")
                  handle.write(f"- Current-pace projection: {projected_rows:,} rows/day\n")

          written = totals['rowsWritten']
          if written >= emergency_rows:
              print(f'::error::D1 EMERGENCY: {target_name} has written {written:,} rows today (>= {emergency_rows:,}).')
              raise SystemExit(2)
          if written >= alert_rows:
              print(f'::error::D1 ALERT: {target_name} has written {written:,} rows today (>= {alert_rows:,}).')
              raise SystemExit(1)
          if written >= warn_rows:
              print(f'::warning::D1 WARN: {target_name} has written {written:,} rows today (>= {warn_rows:,}).')
          if elapsed_hours >= 4 and projected_rows >= alert_rows:
              print(f'::warning::D1 PACE WARN: projected {projected_rows:,} rows/day at current pace.')
          else:
              print(f'D1_USAGE_WATCH_PASS rowsWritten={written} projected={projected_rows}')
          PY
