name: D1 Account Usage Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '35 * * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner3-d1-usage-watch.yml'

permissions:
  contents: read

concurrency:
  group: runner3-d1-usage-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WARN_ROWS: '50000'
      ALERT_ROWS: '70000'
      EMERGENCY_ROWS: '90000'
    steps:
      - name: Checkout diagnostics source for manual and PR runs
        if: github.event_name != 'schedule'
        uses: actions/checkout@v4

      - name: Check account-wide D1 daily row writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, urllib.error, urllib.request

          token=os.environ['CF_TOKEN']
          account=os.environ['CF_ACCOUNT']
          warn_rows=int(os.environ['WARN_ROWS'])
          alert_rows=int(os.environ['ALERT_ROWS'])
          emergency_rows=int(os.environ['EMERGENCY_ROWS'])
          base='https://api.cloudflare.com/client/v4'
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'}

          def request_json(url,method='GET',payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              req=urllib.request.Request(url,data=body,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      return response.status,json.loads(response.read().decode())
              except urllib.error.HTTPError as exc:
                  try:data=json.loads(exc.read().decode())
                  except Exception:data={}
                  return exc.code,data

          db_code,db_data=request_json(f'{base}/accounts/{account}/d1/database?page=1&per_page=1000')
          if db_code != 200:
              raise SystemExit(f'D1 inventory failed: HTTP {db_code}')
          inventory={str(x.get('uuid')):str(x.get('name') or x.get('uuid')) for x in db_data.get('result',[]) if x.get('uuid')}

          now=datetime.datetime.now(datetime.timezone.utc)
          midnight=now.replace(hour=0,minute=0,second=0,microsecond=0)
          today=now.date().isoformat()
          query='''query Usage($accountTag: string, $dateStart: Date, $dateEnd: Date) {
            viewer { accounts(filter: {accountTag: $accountTag}) {
              d1AnalyticsAdaptiveGroups(limit: 10000, filter: {date_geq: $dateStart, date_leq: $dateEnd}) {
                dimensions { databaseId }
                sum { readQueries writeQueries rowsRead rowsWritten }
              }
            }}
          }'''
          code,data=request_json(base+'/graphql','POST',{'query':query,'variables':{'accountTag':account,'dateStart':today,'dateEnd':today}})
          if code != 200 or data.get('errors'):
              raise SystemExit(f'Cloudflare GraphQL failed: HTTP {code} errors={data.get("errors",[])[:2]}')
          rows=data['data']['viewer']['accounts'][0]['d1AnalyticsAdaptiveGroups']

          per_db={
              dbid:{'databaseId':dbid,'database':name,'readQueries':0,'writeQueries':0,'rowsRead':0,'rowsWritten':0}
              for dbid,name in inventory.items()
          }
          for row in rows:
              dbid=str((row.get('dimensions') or {}).get('databaseId') or '')
              if not dbid: continue
              sums=row.get('sum') or {}
              cur=per_db.setdefault(dbid,{'databaseId':dbid,'database':inventory.get(dbid,dbid),'readQueries':0,'writeQueries':0,'rowsRead':0,'rowsWritten':0})
              for key in ('readQueries','writeQueries','rowsRead','rowsWritten'):
                  cur[key]+=int(sums.get(key) or 0)

          databases=sorted(per_db.values(),key=lambda x:x['rowsWritten'],reverse=True)
          totals={k:sum(x[k] for x in databases) for k in ('readQueries','writeQueries','rowsRead','rowsWritten')}
          elapsed=max((now-midnight).total_seconds()/3600.0,0.01)
          projected=round(totals['rowsWritten']*24.0/elapsed)
          result={
              'checkedAt':now.isoformat().replace('+00:00','Z'),'dateUtc':today,
              'accountTotals':totals,'projectedRowsWrittenAtCurrentPace':projected,
              'inventoryCount':len(inventory),
              'databases':databases,
              'thresholds':{'warn':warn_rows,'alert':alert_rows,'emergency':emergency_rows,'freeTierHardLimit':100000}
          }
          print(json.dumps(result,indent=2))

          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary,'a',encoding='utf-8') as h:
                  h.write('## D1 account usage watch\n\n')
                  h.write(f"- UTC date: `{today}`\n")
                  h.write(f"- Account rows written: **{totals['rowsWritten']:,}** / 100,000\n")
                  h.write(f"- Current-pace projection: {projected:,} rows/day\n")
                  h.write(f"- D1 databases: {len(inventory)}\n\n")
                  h.write('| Database | Rows written | Write queries |\n|---|---:|---:|\n')
                  for x in databases:
                      h.write(f"| {x['database']} | {x['rowsWritten']:,} | {x['writeQueries']:,} |\n")

          written=totals['rowsWritten']
          if written >= emergency_rows:
              print(f'::error::D1 ACCOUNT EMERGENCY: {written:,} rows written today.')
              raise SystemExit(2)
          if written >= alert_rows:
              print(f'::error::D1 ACCOUNT ALERT: {written:,} rows written today.')
              raise SystemExit(1)
          if written >= warn_rows:
              print(f'::warning::D1 ACCOUNT WARN: {written:,} rows written today.')
          if elapsed >= 4 and projected >= alert_rows:
              print(f'::warning::D1 ACCOUNT PACE WARN: projected {projected:,} rows/day.')
          print(f'D1_ACCOUNT_USAGE_WATCH_PASS rowsWritten={written} projected={projected}')
          PY

      - name: Validate D1 Insights sanitizer offline
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('scripts/d1_insights_sanitize.py')
          spec=importlib.util.spec_from_file_location('d1_san',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          rows=module.sanitize([{'query': 'SELECT * FROM content_features WHERE item_id = ?', 'totalRowsRead': 200, 'totalRowsWritten': 0, 'numberOfTimesRun': 10}])
          assert len(rows)==1 and rows[0]['operation']=='SELECT'
          assert rows[0]['tables']==['content_features']
          assert rows[0]['totalRowsRead']==200 and 'query' not in rows[0]
          assert module.sanitize([])==[]
          for invalid in ({'results': []},[{}],[{'query':'SELECT 1'}]*21):
              try: module.sanitize(invalid)
              except ValueError: pass
              else: raise AssertionError('must reject invalid insights shape')
          print('D1_INSIGHTS_SANITIZER_OFFLINE_PASS')
          PY

      - name: Read-only D1 query hotspots (manual only, redacted)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Analytics-only query patterns; do not execute SQL against D1.
          # Neither raw queries nor CLI error output may enter workflow logs.
          umask 077
          trap 'rm -f /tmp/d1-insights-reads.json /tmp/d1-insights-writes.json /tmp/d1-insights-reads.err /tmp/d1-insights-writes.err' EXIT
          for kind in reads writes; do
            if ! timeout 80s npx --yes wrangler@4.137.0 d1 insights runner3-content-intelligence \
              --time-period=1d --sort-type=sum --sort-by="$kind" --limit=20 --json \
              > "/tmp/d1-insights-${kind}.json" 2> "/tmp/d1-insights-${kind}.err"; then
              echo "D1_INSIGHTS_ANALYTICS_UNAVAILABLE_${kind}" >&2
              exit 1
            fi
            python3 scripts/d1_insights_sanitize.py --input "/tmp/d1-insights-${kind}.json" --kind "$kind"
          done
