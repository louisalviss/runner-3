name: Cloudflare D1 First Live Row Parity (Read Only)

on:
  workflow_dispatch:
    inputs:
      audit_content_features:
        description: 'Include bounded content_features keyed HMAC audit (read-only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-first-live-row-audit
  cancel-in-progress: false

jobs:
  recommendation-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TARGET_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 20 bounded read-only and privacy contracts offline
        run: |
          python3 -m py_compile scripts/cloudflare_d1_first_live_table_parity.py
          python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_first_live_table_parity.py' -v
      - name: Read source and target recommendation_runs in memory only
        run: python3 scripts/cloudflare_d1_first_live_table_parity.py
      - name: Upload sanitized counts and status only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-first-live-row-parity-sanitized-summary
          path: migration-out/d1-first-live-table-parity-summary.json
          if-no-files-found: error
          retention-days: 1
      - name: Verify two-profile HMAC parity offline tests
        run: |
          python3 -m py_compile scripts/cloudflare_d1_two_profile_parity_readonly.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_two_profile_parity_readonly.py' -v
      - name: Compare two small profile tables with NEW target read-only audit token
        env:
          CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW }}
        run: python3 scripts/cloudflare_d1_two_profile_parity_readonly.py
      - name: Upload sanitized two-profile aggregate status
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-two-interest-profiles-hmac-parity-readonly
          path: migration-out/d1-two-interest-profiles-keyed-parity.json
          if-no-files-found: error
          retention-days: 1
      - name: Validate derived profile reconcile gate with synthetic contracts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare_d1_derived_profile_reconcile_gate.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_derived_profile_reconcile_gate.py' -v
      - name: Build no-write derived profile reconciliation HOLD
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/cloudflare_d1_derived_profile_reconcile_gate.py
      - name: Upload sanitized derived profile reconciliation gate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-derived-profile-reconciliation-hold
          path: migration-out/d1-derived-profile-reconcile-gate.json
          if-no-files-found: error
          retention-days: 2
      - name: Test upstream three-table schema/count read bounds offline
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare_d1_upstream_bounded_count_readonly.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_upstream_bounded_count_readonly.py' -v
      - name: Read source and target three-table capped counts, no row values
        env:
          CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/cloudflare_d1_upstream_bounded_count_readonly.py
      - name: Upload bounded source-target base counts only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-upstream-three-bounded-counts-readonly
          path: migration-out/d1-upstream-three-bounded-counts-readonly.json
          if-no-files-found: error
          retention-days: 2
      - name: Test bounded content item PK HMAC presence audit offline
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare_d1_content_items_key_presence_readonly.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_content_items_key_presence_readonly.py' -v
      - name: Compare content item primary-key presence read-only
        env:
          CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/cloudflare_d1_content_items_key_presence_readonly.py
      - name: Upload sanitized content item key-set counts only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-content-items-key-presence-readonly
          path: migration-out/d1-content-items-pk-presence-readonly.json
          retention-days: 2
          if-no-files-found: error
      - name: Validate bounded content_items payload HMAC audit offline
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare_d1_content_items_payload_parity_readonly.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_content_items_payload_parity_readonly.py' -v
      - name: Compare content_items payload by PK with strict cursor and HMAC
        env:
          CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/cloudflare_d1_content_items_payload_parity_readonly.py
      - name: Upload aggregate-only content_items payload differences
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-content-items-payload-hmac-readonly
          path: migration-out/d1-content-items-payload-parity-readonly.json
          if-no-files-found: error
          retention-days: 2
      - name: Verify DB-local event-ID independence and multiset contract offline
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare_d1_event_semantic_multiset_readonly.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_event_semantic_multiset_readonly.py' -v
      - name: Compare source-target event semantic occurrence multiset, no ID joins
        env:
          CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/cloudflare_d1_event_semantic_multiset_readonly.py
      - name: Upload event multiset aggregate counts without rows or fingerprints
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-event-semantic-multiset-readonly
          path: migration-out/d1-event-semantic-multiset-parity-readonly.json
          retention-days: 2
          if-no-files-found: error
      - name: Test opt-in content_features composite-PK HMAC audit offline
        if: ${{ inputs.audit_content_features }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cloudflare_d1_content_features_keyed_readonly.py
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_content_features_keyed_readonly.py' -v
      - name: Compare content_features keyed payloads bounded and read-only
        if: ${{ inputs.audit_content_features }}
        env:
          CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN_NEW }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/cloudflare_d1_content_features_keyed_readonly.py
      - name: Upload aggregate-only feature key and payload counts
        if: ${{ inputs.audit_content_features && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: d1-content-features-keyed-readonly
          path: migration-out/d1-content-features-keyed-parity-readonly.json
          if-no-files-found: error
          retention-days: 2
