name: Cloudflare D1 First Live Row Parity (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-first-live-row-audit
  cancel-in-progress: false

jobs:
  recommendation-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TARGET_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_TARGET_AUDIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 20 bounded read-only and privacy contracts offline
        run: |
          python3 -m py_compile scripts/cloudflare_d1_first_live_table_parity.py
          python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_d1_first_live_table_parity.py' -v
      - name: Read source and target recommendation_runs in memory only
        run: python3 scripts/cloudflare_d1_first_live_table_parity.py
      - name: Upload sanitized counts and status only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-first-live-row-parity-sanitized-summary
          path: migration-out/d1-first-live-table-parity-summary.json
          if-no-files-found: error
          retention-days: 1
