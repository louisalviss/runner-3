name: Runner3 RSS Library Rollout 2026-08-25

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-rss-rollout-20260825.yml'
      - 'cloudflare/runner3-core/**'

permissions:
  contents: write

concurrency:
  group: runner3-rss-library-rollout-20260825
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      BASE_URL: https://runner3-core.ducduy2411.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply RSS D1 migrations and deploy Core
        working-directory: cloudflare/runner3-core
        run: |
          set -euo pipefail
          for migration in migrations/*.sql; do
            echo "Applying ${migration}"
            npx --yes wrangler@4 d1 execute runner3-core --remote --file="${migration}"
          done
          npx --yes wrangler@4 deploy

      - name: Fetch canonical six and prove source coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os,time,urllib.error,urllib.parse,urllib.request
          from pathlib import Path

          base=os.environ['BASE_URL'].rstrip('/')
          token=os.environ['RUNNER3_CORE_TOKEN'].strip()
          ids=[
            'genk-165260824141950644',
            'fulcrum-url-a87e54dbda2e37fe40a7',
            'tinhte-4171630',
            'nghiencuuquocte-url-6cd04807aefc80d9be93',
            'rasa-url-71191f21386ea1a88a22',
            'cloudflare-url-781ba125e818919ba95e',
          ]
          english={
            'fulcrum-url-a87e54dbda2e37fe40a7',
            'rasa-url-71191f21386ea1a88a22',
            'cloudflare-url-781ba125e818919ba95e',
          }
          native_vi=set(ids)-english
          retired={
            'projectsyndicate-url-26a9686e21ebe4fa865d',
            'projectsyndicate-url-db223b141f372578df3c',
            'huggingface-url-d556a48bace2bfaa6a70',
          }

          def call(path,method='GET',auth=True):
            headers={'Accept':'application/json','User-Agent':'runner3-rss-rollout/2.0','Cache-Control':'no-cache'}
            if auth: headers['Authorization']='Bearer '+token
            req=urllib.request.Request(base+path,headers=headers,method=method)
            try:
              with urllib.request.urlopen(req,timeout=50) as r:
                raw=r.read().decode('utf-8','replace')
                try: body=json.loads(raw) if raw else None
                except Exception: body={'rawPrefix':raw[:500]}
                return r.status,body
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try: body=json.loads(raw) if raw else None
              except Exception: body={'rawPrefix':raw[:500]}
              return e.code,body

          health=None
          for _ in range(8):
            http,body=call('/health',auth=False)
            if http==200 and isinstance(body,dict) and body.get('ok'):
              health={'http':http,'ok':True,'d1':body.get('d1'),'r2':body.get('r2')}; break
            time.sleep(2)
          if not health: raise SystemExit('runner3_core_health_failed')

          fetch={}; details={}; native_views={}; packets={}; errors=[]
          for article_id in ids:
            q=urllib.parse.quote(article_id,safe='')
            http,body=call(f'/api/rss/articles/{q}/fetch','POST')
            fetch[article_id]={
              'http':http,'ok':bool(isinstance(body,dict) and body.get('ok')),
              'error':body.get('error') if isinstance(body,dict) else None,
              'chars':body.get('chars') if isinstance(body,dict) else None,
              'checksum':body.get('checksum') if isinstance(body,dict) else None,
            }
            if http!=200 or not isinstance(body,dict) or not body.get('ok'):
              errors.append(f'fetch:{article_id}:{http}')
              continue
            dhttp,dbody=call(f'/api/rss/articles/{q}')
            article=dbody.get('article',{}) if isinstance(dbody,dict) else {}
            details[article_id]={
              'http':dhttp,'fetch_status':article.get('fetch_status'),
              'translation_status':article.get('translation_status'),
              'source_checksum':article.get('source_checksum'),
              'translation_checksum':article.get('translation_checksum'),
              'qa_state':article.get('qa_state'),'last_error':article.get('last_error'),
            }
            if article_id in native_vi:
              vhttp,vbody=call(f'/api/rss/articles/{q}/vi')
              artifact=vbody.get('artifact',{}) if isinstance(vbody,dict) else {}
              native_views[article_id]={'http':vhttp,'nativeVi':vbody.get('nativeVi') if isinstance(vbody,dict) else None,'bodyChars':len(str(artifact.get('body') or ''))}
              if vhttp!=200: errors.append(f'native_vi:{article_id}:{vhttp}')
            else:
              phttp,pbody=call(f'/api/rss/articles/{q}/translation-packet')
              packets[article_id]={'http':phttp,'ok':bool(isinstance(pbody,dict) and pbody.get('ok')),'sectionCount':pbody.get('sectionCount') if isinstance(pbody,dict) else None,'sourceChecksum':pbody.get('sourceChecksum') if isinstance(pbody,dict) else None}
              if phttp!=200 or not isinstance(pbody,dict) or not pbody.get('ok'): errors.append(f'packet:{article_id}:{phttp}')

          ch,catalog=call('/api/rss/library?limit=100')
          articles=catalog.get('articles',[]) if isinstance(catalog,dict) else []
          got={x.get('article_id') for x in articles}
          exact_six=(ch==200 and got==set(ids) and len(articles)==6)
          retired_absent=not bool(got & retired)
          if not exact_six: errors.append('catalog_not_exact_six')
          if not retired_absent: errors.append('retired_ids_present')

          proof={
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'runId':os.environ.get('GITHUB_RUN_ID'),'baseUrl':base,'health':health,
            'catalog':{'http':ch,'count':catalog.get('count') if isinstance(catalog,dict) else None,'ids':sorted(x for x in got if x),'exactSix':exact_six,'retiredAbsent':retired_absent},
            'fetch':fetch,'details':details,'nativeViViews':native_views,'translationPackets':packets,
            'errors':errors,'ok':not errors,
          }
          Path('/tmp/rss-library-rollout.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(proof,ensure_ascii=False,indent=2))
          if errors: raise SystemExit(1)
          PY

      - name: Persist rollout proof without article bodies
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ops/rss-library
          test -s /tmp/rss-library-rollout.json || printf '{"ok":false,"error":"rollout_proof_missing","runId":"%s"}\n' "$GITHUB_RUN_ID" >/tmp/rss-library-rollout.json
          cp /tmp/rss-library-rollout.json ops/rss-library/rollout-20260825.json
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/rss-library/rollout-20260825.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist RSS Library rollout proof: ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main
