name: Audio Library Current Raw Artifact
# trigger: current-raw-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-library-current-raw-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: python -m pip install -q requests beautifulsoup4 pypdf 'cryptography>=45,<47'
      - name: Extract current public Reddit source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audio-current-raw ops/audio-library
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import audio_library_extract_for_chatgpt as a
          url='https://www.reddit.com/r/AskReddit/comments/1vsxt55/what_video_game_did_you_drop_laughably_quick/'
          title,text,label,canonical=a.extract_reddit(url)
          out={'title':title,'sourceLabel':label,'canonicalUrl':canonical,'rawText':text}
          Path('/tmp/audio-current-raw/source.json').write_text(json.dumps(out,ensure_ascii=False),encoding='utf-8')
          meta={'status':'ready','runId':'${{ github.run_id }}','artifactName':'audio-current-raw-${{ github.run_id }}','title':title,'chars':len(text),'updatedAt':'${{ github.event.head_commit.timestamp }}'}
          Path('ops/audio-library/current-raw-artifact-status.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audio-current-raw-${{ github.run_id }}
          path: /tmp/audio-current-raw/source.json
          retention-days: 1
          if-no-files-found: error
      - name: Publish artifact pointer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/audio-library/current-raw-artifact-status.json
          git commit -m 'Publish current Audio raw artifact pointer [skip ci]' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
