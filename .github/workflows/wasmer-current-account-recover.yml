name: Recover Current Wasmer Account

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasmer-current-account-recover.yml'
      - 'scripts/wasmer-current-account-recover.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted account state
        shell: bash
        run: |
          set -euo pipefail
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-result.json
      - name: Package Runner3 theme
        shell: bash
        run: cd wordpress-site/wp-content/themes && zip -qr /tmp/runner3-starter.zip runner3-starter
      - run: npm install --no-save playwright-core@1.58.2
      - name: Recover session, apply theme, inspect verification
        run: node scripts/wasmer-current-account-recover.mjs
      - name: Persist safe recovery result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/wasmer-current-recover.json || echo '{"status":"runner_error"}' > /tmp/wasmer-current-recover.json
          cat /tmp/wasmer-current-recover.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main && git reset --hard origin/main
          mkdir -p ops/wasmer
          cp /tmp/wasmer-current-recover.json ops/wasmer/current-account-recover.json
          git add ops/wasmer/current-account-recover.json
          if ! git diff --cached --quiet; then git commit -m 'Persist current Wasmer account recovery result'; git push origin HEAD:main; fi
