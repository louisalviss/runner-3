name: Audio Library Fix Inline JS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-library-fix-inline-js.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace fragile newline escapes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/audio-library/worker.js')
          s=p.read_text()
          start=s.find("const text=arr.map")
          marker=";try{if(navigator.share)"
          end=s.find(marker,start)
          if start < 0 or end < 0:
              raise SystemExit(f'bulkShare text expression not found: start={start} end={end}')
          replacement="const nl=String.fromCharCode(10);const text=arr.map(i=>(i.title||'Audio')+nl+(i.audioUrl||i.sourceUrl)).join(nl+nl)"
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          print('replaced bulkShare newline construction')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/audio-library/worker.js
          git commit -m 'Fix Audio Library bulk share syntax'
          git pull --rebase origin main
          git push origin HEAD:main
