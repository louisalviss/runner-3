name: Tin VN · Forum Signal

on:
  push:
    branches: [main]
    paths:
      - 'forum-jobs/forum-signal*.json'
      - 'forum_signal_v2.py'
      - 'forum_signal_rank.py'
      - 'forum_signal_delta.py'
      - 'forum_signal_f91_expand.py'
      - 'forum_signal_timestamp.py'
      - 'forum_signal_score.py'
      - 'forum_signal_f91_candidates.py'
      - 'forum_signal_diversify.py'
      - 'forum_signal_route.py'
      - 'forum_signal_route_f91.py'
      - 'forum_signal_health.py'
      - 'public_feed_fallback.py'
      - '.github/workflows/forum-signal.yml'
  schedule:
    # Every 3 hours, aligned to :30 Asia/Ho_Chi_Minh. Includes 20:30 VN,
    # giving the 21:00 Vietnam radar a buffer to consume the latest artifact.
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
    inputs:
      job_file:
        description: 'Path to forum signal job JSON'
        required: true
        default: 'forum-jobs/forum-signal-vn.json'
        type: string

permissions:
  contents: write

concurrency:
  group: forum-signal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Publish run-start pointer
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'forum_signal_latest.json';
            const pointer = {
              workflow: 'Tin VN · Forum Signal',
              run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
              artifact_id: 0,
              artifact_name: `forum-signal-${context.runId}`,
              commit_sha: context.sha,
              generated_at: new Date().toISOString(),
              status: 'RUNNING'
            };
            let sha;
            let currentPointer = null;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: process.env.GITHUB_REF_NAME
              });
              sha = current.data.sha;
              currentPointer = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            } catch (e) {
              if (e.status !== 404 && !(e instanceof SyntaxError)) throw e;
            }
            if (currentPointer?.run_id && Number(currentPointer.run_id) > Number(context.runId)) {
              core.warning(`Skip stale start-pointer write from run ${context.runId}; newer run ${currentPointer.run_id} already owns pointer`);
              return;
            }
            const args = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `chore: mark Forum Signal run ${context.runId} started [skip ci]`,
              content: Buffer.from(JSON.stringify(pointer, null, 2) + '\n').toString('base64'),
              branch: process.env.GITHUB_REF_NAME
            };
            if (sha) args.sha = sha;
            await github.rest.repos.createOrUpdateFileContents(args);
            core.info(JSON.stringify(pointer));

      - name: Resolve job file
        id: job
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB_FILE='${{ inputs.job_file }}'
          else
            JOB_FILE='forum-jobs/forum-signal-vn.json'
          fi
          if [ -z "$JOB_FILE" ] || [ ! -f "$JOB_FILE" ]; then
            echo "No valid forum signal job found: $JOB_FILE" >&2
            exit 2
          fi
          echo "job_file=$JOB_FILE" >> "$GITHUB_OUTPUT"
          echo "Using forum signal job: $JOB_FILE"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate
        id: config
        shell: bash
        run: |
          set -euo pipefail
          JOB='${{ steps.job.outputs.job_file }}'
          python forum_signal_delta.py "$JOB" --validate-only
          python forum_signal_f91_expand.py "$JOB" --validate-only
          python forum_signal_timestamp.py --validate-only
          python forum_signal_score.py --input /tmp/nonexistent.jsonl --output /tmp/forum-candidates.jsonl --summary /tmp/forum-insights.md --min-score 3
          python forum_signal_f91_candidates.py --raw /tmp/nonexistent.jsonl --candidates /tmp/forum-candidates.jsonl --audit /tmp/forum-f91-boost.json
          python forum_signal_diversify.py --input /tmp/forum-candidates.jsonl --audit /tmp/forum-f91-diversity.json
          python forum_signal_health.py --job "$JOB" --validate-only
          MODE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("mode","http"))' "$JOB")"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Restore forum delta state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: .forum-state
          key: forum-signal-state-${{ github.run_id }}
          restore-keys: |
            forum-signal-state-

      - name: Install Chromium when needed
        if: steps.config.outputs.mode != 'http'
        run: python -m playwright install --with-deps chromium

      - name: Crawl
        id: crawl
        run: python forum_signal_f91_expand.py '${{ steps.job.outputs.job_file }}' --output crawl_output --state-file .forum-state/state.json

      - name: Add public RSS fallback for blocked VOZ sections
        if: steps.crawl.outcome == 'success'
        run: python public_feed_fallback.py --job '${{ steps.job.outputs.job_file }}' --manifest crawl_output/manifest.json --output crawl_output/forum_signal.jsonl --summary crawl_output/public_feed_fallback.json

      - name: Recover Otofun post timestamps
        if: steps.crawl.outcome == 'success'
        run: python forum_signal_timestamp.py --output-dir crawl_output

      - name: Score insight candidates
        if: steps.crawl.outcome == 'success'
        run: python forum_signal_score.py --input crawl_output/forum_signal.jsonl --output crawl_output/forum_insight_candidates.jsonl --summary crawl_output/forum_insights.md --min-score 3

      - name: Boost VOZ F91 technical and career candidates
        if: steps.crawl.outcome == 'success'
        run: python forum_signal_f91_candidates.py --raw crawl_output/forum_signal_snapshot.jsonl --candidates crawl_output/forum_insight_candidates.jsonl --audit crawl_output/forum_f91_candidate_boost.json --min-score 3 --max-age-hours 72

      - name: Diversify VOZ F91 candidates
        if: steps.crawl.outcome == 'success'
        run: python forum_signal_diversify.py --input crawl_output/forum_insight_candidates.jsonl --audit crawl_output/forum_f91_diversity.json --source VOZ-F91 --per-thread 3 --source-cap 36

      - name: Route and final-filter candidates
        if: steps.crawl.outcome == 'success'
        run: python forum_signal_route_f91.py --input crawl_output/forum_insight_candidates.jsonl --output-dir crawl_output

      - name: Evaluate source health
        if: steps.crawl.outcome == 'success'
        run: python forum_signal_health.py --manifest crawl_output/manifest.json --job '${{ steps.job.outputs.job_file }}' --state .forum-state/health-baseline.json --output crawl_output/forum_health.json --summary crawl_output/forum_health.md

      - name: Save forum delta state
        if: steps.crawl.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .forum-state
          key: forum-signal-state-${{ github.run_id }}

      - name: Upload forum signal artifact
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-signal-${{ github.run_id }}
          path: crawl_output/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final latest-run pointer
        if: always()
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = 'forum_signal_latest.json';
            let health = {};
            let manifest = {};
            try {
              health = JSON.parse(fs.readFileSync('crawl_output/forum_health.json', 'utf8'));
            } catch (e) {
              health = {overall_status: process.env.CRAWL_OUTCOME === 'success' ? 'UNKNOWN' : 'FAILED', health_error: String(e)};
            }
            try {
              manifest = JSON.parse(fs.readFileSync('crawl_output/manifest.json', 'utf8'));
            } catch (e) {
              manifest = {manifest_error: String(e)};
            }
            const pointer = {
              workflow: 'Tin VN · Forum Signal',
              run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
              artifact_id: Number(process.env.ARTIFACT_ID || 0),
              artifact_name: `forum-signal-${context.runId}`,
              artifact_url: process.env.ARTIFACT_URL || '',
              commit_sha: context.sha,
              generated_at: new Date().toISOString(),
              status: health.overall_status || (process.env.CRAWL_OUTCOME === 'success' ? 'UNKNOWN' : 'FAILED'),
              crawl_outcome: process.env.CRAWL_OUTCOME || 'unknown',
              sources_total: manifest.sources_total ?? manifest.source_count ?? null,
              posts_total: manifest.posts_total ?? manifest.items_total ?? manifest.total_structured_posts ?? null,
              f91_expanded: manifest.f91_expanded ?? null,
              f91_boost_file: 'forum_f91_candidate_boost.json',
              f91_diversity_file: 'forum_f91_diversity.json',
              candidates_file: 'forum_insight_candidates.jsonl',
              general_file: 'forum_candidates_general.jsonl',
              mmo_file: 'forum_candidates_mmo.jsonl',
              crypto_file: 'forum_candidates_crypto.jsonl',
              health_file: 'forum_health.json',
              manifest_file: 'manifest.json'
            };
            let sha;
            let currentPointer = null;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: process.env.GITHUB_REF_NAME
              });
              sha = current.data.sha;
              currentPointer = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            } catch (e) {
              if (e.status !== 404 && !(e instanceof SyntaxError)) throw e;
            }
            if (currentPointer?.run_id && Number(currentPointer.run_id) > Number(context.runId)) {
              core.warning(`Skip stale final-pointer write from run ${context.runId}; newer run ${currentPointer.run_id} already owns pointer`);
              return;
            }
            const args = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore: update Forum Signal latest pointer [skip ci]',
              content: Buffer.from(JSON.stringify(pointer, null, 2) + '\n').toString('base64'),
              branch: process.env.GITHUB_REF_NAME
            };
            if (sha) args.sha = sha;
            await github.rest.repos.createOrUpdateFileContents(args);
            core.info(JSON.stringify(pointer));

      - name: Enforce critical health gate
        if: always() && steps.crawl.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path('crawl_output/forum_health.json')
          if not p.exists():
              print('forum_health.json missing')
              sys.exit(1)
          h = json.loads(p.read_text(encoding='utf-8'))
          print('Forum Signal health:', h.get('overall_status'))
          if h.get('overall_status') == 'FAILED':
              sys.exit(1)
          PY

      - name: Remove local output
        if: always()
        run: rm -rf crawl_output
