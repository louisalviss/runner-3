name: Private Backtest US60 PIT MTM META Repair

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/private_backtest_us60_mtm_meta_repair.py'
      - '.github/workflows/private-backtest-us60-pit-mtm-meta-repair.yml'

permissions:
  contents: read

env:
  RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
  RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
  RUNNER3_SOURCE: runner-3-github-hosted

jobs:
  repair-and-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check 'dukascopy-python==4.0.1' 'numpy>=2,<3' 'pandas>=2,<3'
      - name: Repair META legacy symbol and evaluate MTM
        run: python tools/private_backtest_us60_mtm_meta_repair.py --config jobs/private-backtest-us60-survivorship-audit-v1.json
