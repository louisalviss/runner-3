name: R2 Public Download Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r2-public-download-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: runner3-direct-download-test
      SOURCE_URL: https://clck.ru/3VF4zY
      OBJECT_KEY: test.apk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run diagnostic public-download test
        shell: bash
        run: |
          set +e
          mkdir -p ops /tmp/r2diag
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          download_code=$(curl -sS -L --retry 2 --connect-timeout 20 --max-time 300 -o /tmp/source.bin -w '%{http_code}' "$SOURCE_URL")
          source_size=0
          source_sha=''
          if [ -s /tmp/source.bin ]; then
            source_size=$(stat -c '%s' /tmp/source.bin)
            source_sha=$(sha256sum /tmp/source.bin | awk '{print $1}')
          fi

          get_bucket_code=$(curl -sS -o /tmp/r2diag/get-bucket.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET}" "${auth[@]}")

          create_bucket_code='skipped'
          if [ "$get_bucket_code" != "200" ]; then
            create_bucket_code=$(curl -sS -o /tmp/r2diag/create-bucket.json -w '%{http_code}' \
              -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets" \
              "${auth[@]}" -H 'Content-Type: application/json' \
              --data "{\"name\":\"${BUCKET}\"}")
          fi

          upload_code='skipped'
          if [ -s /tmp/source.bin ]; then
            upload_code=$(curl -sS -o /tmp/r2diag/upload.json -w '%{http_code}' \
              -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects/${OBJECT_KEY}" \
              "${auth[@]}" \
              -H 'Content-Type: application/vnd.android.package-archive' \
              -H 'Content-Disposition: attachment; filename="test.apk"' \
              --data-binary @/tmp/source.bin)
          fi

          managed_set_code=$(curl -sS -o /tmp/r2diag/managed-set.json -w '%{http_code}' \
            -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET}/domains/managed" \
            "${auth[@]}" -H 'Content-Type: application/json' --data '{"enabled":true}')

          managed_get_code=$(curl -sS -o /tmp/r2diag/managed-get.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET}/domains/managed" "${auth[@]}")

          DOMAIN=$(python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/r2diag/managed-get.json'))
              print((d.get('result') or {}).get('domain') or '')
          except Exception:
              print('')
          PY
          )
          PUBLIC_URL=''
          verify_code='skipped'
          verify_size=0
          verify_sha=''
          identical=false
          if [ -n "$DOMAIN" ]; then
            PUBLIC_URL="https://${DOMAIN}/${OBJECT_KEY}"
            for i in 1 2 3 4 5; do
              verify_code=$(curl -sS -L -o /tmp/verify.bin -w '%{http_code}' "$PUBLIC_URL")
              if [ "$verify_code" = "200" ] && [ -s /tmp/verify.bin ]; then
                verify_size=$(stat -c '%s' /tmp/verify.bin)
                verify_sha=$(sha256sum /tmp/verify.bin | awk '{print $1}')
                if [ "$source_sha" = "$verify_sha" ] && [ "$source_size" = "$verify_size" ]; then identical=true; break; fi
              fi
              sleep 2
            done
          fi

          export download_code source_size source_sha get_bucket_code create_bucket_code upload_code managed_set_code managed_get_code DOMAIN PUBLIC_URL verify_code verify_size verify_sha identical
          python - <<'PY'
          import json, os, datetime
          from pathlib import Path
          def load(path):
              p=Path(path)
              if not p.exists(): return None
              try: return json.loads(p.read_text(encoding='utf-8', errors='replace'))
              except Exception: return p.read_text(encoding='utf-8', errors='replace')[:1000]
          def slim(v):
              if isinstance(v,dict):
                  return {'success':v.get('success'),'errors':v.get('errors'),'messages':v.get('messages'),'result':v.get('result')}
              return v
          out={
            'updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'bucket':os.environ['BUCKET'],
            'objectKey':os.environ['OBJECT_KEY'],
            'sourceUrl':os.environ['SOURCE_URL'],
            'downloadHttpCode':os.environ.get('download_code'),
            'sourceSize':int(os.environ.get('source_size') or 0),
            'sourceSha256':os.environ.get('source_sha'),
            'getBucketHttpCode':os.environ.get('get_bucket_code'),
            'createBucketHttpCode':os.environ.get('create_bucket_code'),
            'uploadHttpCode':os.environ.get('upload_code'),
            'managedSetHttpCode':os.environ.get('managed_set_code'),
            'managedGetHttpCode':os.environ.get('managed_get_code'),
            'managedDomain':os.environ.get('DOMAIN'),
            'publicUrl':os.environ.get('PUBLIC_URL'),
            'verifyHttpCode':os.environ.get('verify_code'),
            'verifySize':int(os.environ.get('verify_size') or 0),
            'verifySha256':os.environ.get('verify_sha'),
            'byteIdentical':os.environ.get('identical')=='true',
            'responses':{
              'getBucket':slim(load('/tmp/r2diag/get-bucket.json')),
              'createBucket':slim(load('/tmp/r2diag/create-bucket.json')),
              'upload':slim(load('/tmp/r2diag/upload.json')),
              'managedSet':slim(load('/tmp/r2diag/managed-set.json')),
              'managedGet':slim(load('/tmp/r2diag/managed-get.json')),
            }
          }
          Path('ops/r2-public-download-test.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Publish diagnostic result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/r2-public-download-test.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/r2-public-download-test.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish R2 direct-download diagnostic [skip ci]'
          git pull --rebase origin main || true
          git push origin HEAD:main
