name: Cloudflare Edge PageSpeed UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-edge-pagespeed-ui.yml'
      - 'scripts/pagespeed-ui-audit.mjs'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'ops/pagespeed/edge-ui-requests/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-edge-pagespeed-ui
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PSI_URL: https://runner3wp.pntr.dev/
      PSI_UI_OUT: /tmp/pagespeed-edge-ui.json
      PSI_UI_SCREENSHOT: /tmp/pagespeed-edge-ui-mobile.png
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install PageSpeed browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.61.0
          npx playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Run Google PageSpeed web UI on production domain
        id: psi
        continue-on-error: true
        run: node scripts/pagespeed-ui-audit.mjs

      - name: Persist immutable fresh production PageSpeed result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/pagespeed-edge-ui.json || printf '{"status":"failed","target":"%s","detail":"missing UI result"}\n' "$PSI_URL" >/tmp/pagespeed-edge-ui.json
          cp /tmp/pagespeed-edge-ui.json /tmp/psi-edge-safe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/pagespeed/edge-ui-results/runs
            cp /tmp/psi-edge-safe.json ops/pagespeed/edge-ui-results/cloudflare-edge.latest.json
            cp /tmp/psi-edge-safe.json "ops/pagespeed/edge-ui-results/runs/cloudflare-edge.${GITHUB_RUN_ID}.json"
            git add ops/pagespeed/edge-ui-results
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Persist production PageSpeed UI: ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 2

      - name: Require fresh PageSpeed result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/pagespeed-edge-ui.json'))
          assert d.get('status') == 'ready', json.dumps(d,indent=2)
          for strategy in ('mobile','desktop'):
              scores=d.get(strategy,{}).get('scores',{})
              metrics=d.get(strategy,{}).get('metrics',{})
              assert scores.get('performance') is not None, strategy+' performance missing'
              assert metrics.get('lcp') is not None and metrics.get('fcp') is not None, strategy+' lab metrics missing'
          print(json.dumps({
            'target': d.get('target'),
            'resultUrl': d.get('resultUrl'),
            'mobile': d.get('mobile',{}).get('scores'),
            'mobileMetrics': d.get('mobile',{}).get('metrics'),
            'desktop': d.get('desktop',{}).get('scores'),
            'desktopMetrics': d.get('desktop',{}).get('metrics'),
          },indent=2))
          PY

  visual_ab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag-runner3wp-pagespeed-ab-20260820
          fetch-depth: 0

      - name: Prepare lightweight browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.61.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Capture synchronized cold-load frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/visual-ab/v1 /tmp/visual-ab/v2 ops/perf/visual
          cat > .visual-ab-capture.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
          async function setup(url){
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const page=await context.newPage();
            const cdp=await context.newCDPSession(page);
            await cdp.send('Network.enable');
            await cdp.send('Network.setCacheDisabled',{cacheDisabled:true});
            await cdp.send('Network.emulateNetworkConditions',{offline:false,latency:150,downloadThroughput:1.6*1024*1024/8,uploadThroughput:750*1024/8,connectionType:'cellular4g'});
            await cdp.send('Emulation.setCPUThrottlingRate',{rate:4});
            await page.goto('about:blank'); return {context,page,url};
          }
          const a=await setup('https://runner3wp.pntr.dev/');
          const b=await setup('https://wordpress-edge-proxy-v2.ducduy2411.workers.dev/');
          const frames=60, interval=100, navFrame=10; let navStartedAt=null;
          for(let i=0;i<frames;i++){
            if(i===navFrame){ navStartedAt=new Date().toISOString(); void a.page.goto(a.url,{waitUntil:'load',timeout:30000}).catch(()=>{}); void b.page.goto(b.url,{waitUntil:'load',timeout:30000}).catch(()=>{}); }
            const n=String(i).padStart(3,'0'); const t0=Date.now();
            await Promise.all([a.page.screenshot({path:`/tmp/visual-ab/v1/${n}.png`}),b.page.screenshot({path:`/tmp/visual-ab/v2/${n}.png`})]);
            const remain=interval-(Date.now()-t0); if(remain>0) await new Promise(r=>setTimeout(r,remain));
          }
          await a.context.close(); await b.context.close(); await browser.close();
          fs.writeFileSync('/tmp/visual-ab/meta.json',JSON.stringify({status:'ready',v1:a.url,v2:b.url,viewport:'390x844',latencyMs:150,downloadMbps:1.6,uploadKbps:750,cpuSlowdown:4,fps:10,frames,leaderMs:1000,navigationStartedAt:navStartedAt},null,2));
          NODE
          node ./.visual-ab-capture.mjs
          rm -f .visual-ab-capture.mjs

      - name: Build side-by-side MP4
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -framerate 10 -i /tmp/visual-ab/v1/%03d.png -framerate 10 -i /tmp/visual-ab/v2/%03d.png \
            -filter_complex "[0:v]scale=390:844,drawtext=text='V1 current':x=12:y=14:fontsize=20:fontcolor=white:box=1:boxcolor=black@0.72:boxborderw=8[v1];[1:v]scale=390:844,drawtext=text='V2 optimized':x=12:y=14:fontsize=20:fontcolor=white:box=1:boxcolor=black@0.72:boxborderw=8[v2];[v1][v2]hstack=inputs=2,drawtext=text='Slow 4G | 150ms RTT | CPU x4 | load starts at 1.0s':x=(w-text_w)/2:y=h-42:fontsize=18:fontcolor=white:box=1:boxcolor=black@0.72:boxborderw=8[out]" \
            -map "[out]" -an -c:v libx264 -preset medium -crf 24 -pix_fmt yuv420p -movflags +faststart ops/perf/visual/runner3wp-v1-v2-slow4g.mp4
          cp /tmp/visual-ab/meta.json ops/perf/visual/runner3wp-v1-v2-slow4g.json

      - name: Persist visual evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ops/perf/visual/runner3wp-v1-v2-slow4g.mp4 ops/perf/visual/runner3wp-v1-v2-slow4g.json
          git commit -m 'diag: persist V1 vs V2 visual A-B' || exit 0
          git push origin HEAD:diag-runner3wp-pagespeed-ab-20260820

