name: Interest Ranking v3 Safe Build

on:
  push:
    branches: [interest-ranking-v3-safe-20260908]
    paths:
      - 'scripts/upgrade_content_intelligence_v3.py'
      - 'scripts/fix_upgrade_v3_policy_response.py'
      - '.github/workflows/interest-ranking-v3-safe-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interest-ranking-v3-safe-20260908
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix upgrade matcher
        run: python scripts/fix_upgrade_v3_policy_response.py

      - name: Apply v3 upgrade on quota-safe main
        run: python scripts/upgrade_content_intelligence_v3.py

      - name: Validate syntax, quota guards and SQLite window support
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/runner3-core/src/content-personalization.js
          node --check cloudflare/runner3-core/src/content-intelligence.js
          python -m py_compile scripts/content_intelligence_client.py scripts/upgrade_content_intelligence_v3.py
          node scripts/verify_runner3_d1_quota_guards.mjs
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect(':memory:')
          rows=db.execute('WITH x(v) AS (VALUES(1),(2),(3)) SELECT percent_rank() OVER (ORDER BY v) FROM x').fetchall()
          assert rows == [(0.0,), (0.5,), (1.0,)], rows
          print('SQLITE_PERCENT_RANK_PASS')
          PY
          grep -q 'PERSONAL_MODEL_VERSION = "personal-v3"' cloudflare/runner3-core/src/content-personalization.js
          grep -q 'compressed-profile-bounded-rank-v3' cloudflare/runner3-core/src/content-personalization.js
          grep -q '/content-intelligence/recommendations/snapshot' cloudflare/runner3-core/src/content-intelligence.js
          grep -q '/content-intelligence/recommendations/evaluate' cloudflare/runner3-core/src/content-intelligence.js

      - name: Commit generated v3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'runner3-interest-v3-bot'
          git config user.email 'runner3-interest-v3-bot@users.noreply.github.com'
          git add cloudflare/runner3-core/src/content-personalization.js \
                  cloudflare/runner3-core/src/content-intelligence.js \
                  scripts/content_intelligence_client.py
          git diff --cached --quiet && { echo 'no generated changes'; exit 0; }
          git commit -m 'feat: quota-safe calibrated personalization v3'
          git push origin HEAD:interest-ranking-v3-safe-20260908
