name: M88 Fill Register Safe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-fill-register-safe.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      M88_EMAIL: ${{ secrets.M88_EMAIL }}
      M88_PASSWORD: ${{ secrets.M88_PASSWORD }}
      M88_PHONE: ${{ secrets.M88_PHONE }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$M88_EMAIL" || { echo 'Missing M88_EMAIL'; exit 20; }
          test -n "$M88_PASSWORD" || { echo 'Missing M88_PASSWORD'; exit 21; }
          test -n "$M88_PHONE" || { echo 'Missing M88_PHONE'; exit 22; }

      - name: Setup Thailand browser route
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence
          curl -fsSL --max-time 30 https://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          rows=[r for r in rows if (r.get('CountryShort') or '').upper()=='TH' and r.get('OpenVPN_ConfigData_Base64')]
          rows.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          for i,r in enumerate(rows[:20]):
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              pathlib.Path(f'/tmp/vpn{i}.ovpn').write_text(cfg)
          print('RELAYS',min(len(rows),20))
          PY
          IFACE=$(ip route show default|awk '{print $5;exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.245.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.245.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.245.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.245.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          connected=0
          for cfg in /tmp/vpn*.ovpn; do
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/o.log
            sudo touch /tmp/o.log && sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log || true
            ok=0
            for i in {1..10}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null && { ok=1; break; }
              grep -Eq 'AUTH_FAILED|TLS Error|Connection refused|fatal error' /tmp/o.log 2>/dev/null && break || true
            done
            if [ "$ok" = 1 ]; then
              trace=$(sudo ip netns exec vpnns curl -fsS --max-time 8 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null|grep -E '^(ip|loc)='||true)
              if echo "$trace"|grep -q '^loc=TH$'; then echo "$trace" > evidence/egress.txt; connected=1; break; fi
            fi
          done
          test "$connected" = 1

      - name: Fill Vietnamese registration form and capture
        shell: bash
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env \
            HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" \
            M88_EMAIL="$M88_EMAIL" M88_PASSWORD="$M88_PASSWORD" M88_PHONE="$M88_PHONE" \
            python3 - <<'PY'
          import os,re,json,random,string
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out=Path(os.environ['WORKSPACE'])/'evidence'
          email=os.environ['M88_EMAIL']; password=os.environ['M88_PASSWORD']; phone=os.environ['M88_PHONE']
          # Keep user data out of logs/artifacts.
          result={'submitted':False}
          suffix=''.join(random.choice(string.digits) for _ in range(4))
          display_name='Nohika'
          username='nohika'+suffix

          def click_visible(loc):
              for i in range(loc.count()):
                  try:
                      if loc.nth(i).is_visible():
                          loc.nth(i).click(timeout=5000); return True
                  except: pass
              return False

          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              c=b.new_context(viewport={'width':390,'height':844},screen={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True,locale='vi-VN',timezone_id='Asia/Ho_Chi_Minh',user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1')
              q=c.new_page(); q.goto('https://www.m88.com/',wait_until='domcontentloaded',timeout=45000); q.wait_for_timeout(8000)
              # Vietnamese
              bs=q.locator("button[data-qa-context='language-selector']")
              for i in range(bs.count()):
                  try:
                      bs.nth(i).evaluate('(e)=>e.click()'); q.wait_for_timeout(500)
                      if q.get_by_text('Tiếng Việt',exact=True).count(): break
                  except: pass
              click_visible(q.get_by_text('Tiếng Việt',exact=True)); q.wait_for_timeout(7000)
              # Register
              if not click_visible(q.get_by_text('ĐĂNG KÝ',exact=True)):
                  q.goto('https://www.m88.com/register',wait_until='domcontentloaded',timeout=45000)
              q.wait_for_timeout(8000)

              inputs=q.locator('input')
              # Based on verified live form order: name, username, password, email, phone.
              if inputs.count() >= 5:
                  inputs.nth(0).fill(display_name)
                  inputs.nth(1).fill(username)
                  inputs.nth(2).fill(password)
                  inputs.nth(3).fill(email)

              # VND currency
              curr=q.get_by_text(re.compile(r'THB|Thai baht'),exact=False)
              click_visible(curr); q.wait_for_timeout(500)
              vnd=q.get_by_text(re.compile(r'VND|Vietnamese Dong'),exact=False)
              click_visible(vnd); q.wait_for_timeout(700)

              # Phone +84: click visible +66 country selector and choose Vietnam/+84.
              plus66=q.get_by_text('+66',exact=True)
              click_visible(plus66); q.wait_for_timeout(600)
              chosen=False
              for pat in [r'\+84',r'Vietnam',r'Việt Nam']:
                  loc=q.get_by_text(re.compile(pat,re.I),exact=False)
                  if click_visible(loc): chosen=True; break
              q.wait_for_timeout(600)
              tel=q.locator("input[type='tel']")
              if tel.count(): tel.first.fill(phone)

              # Expand referral for layout, but do not fill/submit.
              ref=q.get_by_text(re.compile(r'MÃ GIỚI THIỆU|DÙNG MÃ GIỚI THIỆU',re.I),exact=False)
              click_visible(ref); q.wait_for_timeout(500)

              # Hide hero/banner/footer and keep only form region for a clean, authentic full-form screenshot.
              q.evaluate("""
              () => {
                const form = document.querySelector('form');
                if (form) {
                  let n=form;
                  while(n && n.parentElement && n.parentElement.children.length===1) n=n.parentElement;
                  document.querySelectorAll('header,footer').forEach(e=>e.style.display='none');
                }
              }
              """)
              q.wait_for_timeout(500)
              q.screenshot(path=str(out/'m88_register_filled_vn_FULL.png'),full_page=True,timeout=30000)

              # Capture focused form viewport from top and lower section, still without submitting.
              q.evaluate('window.scrollTo(0,0)'); q.wait_for_timeout(300)
              q.screenshot(path=str(out/'m88_register_filled_vn_TOP.png'),full_page=False)
              q.evaluate('window.scrollTo(0, document.body.scrollHeight)'); q.wait_for_timeout(300)
              q.screenshot(path=str(out/'m88_register_filled_vn_BOTTOM.png'),full_page=False)

              result.update({'url':q.url,'title':q.title(),'currency_vnd':bool(q.get_by_text(re.compile(r'VND|Vietnamese Dong'),exact=False).count()),'phone_vn':chosen,'submitted':False})
              c.close(); b.close()
          (out/'result.json').write_text(json.dumps(result,indent=2,ensure_ascii=False))
          print(json.dumps(result,ensure_ascii=False))
          PY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m88-filled-register-${{ github.run_id }}
          path: evidence/
          retention-days: 3
