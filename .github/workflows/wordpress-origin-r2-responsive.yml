name: WordPress Origin R2 Responsive Images

on:
  workflow_dispatch:
    inputs:
      site_slug:
        description: WordPress site factory slug
        required: false
        default: runner3-factory-smoke-2
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordpress-origin-r2-responsive.yml'
      - 'scripts/install-wordpress-r2-responsive.mjs'
      - 'wordpress/plugins/runner3-r2-responsive/**'

permissions:
  contents: write

concurrency:
  group: wordpress-origin-r2-responsive
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WP_SITE_SLUG: ${{ inputs.site_slug }}
      WP_PUBLIC_URL: https://runner3wp.pntr.dev
      PLUGIN_ZIP: /tmp/runner3-r2-responsive.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve target
        shell: bash
        run: |
          set -euo pipefail
          slug="${WP_SITE_SLUG:-runner3-factory-smoke-2}"
          echo "WP_SITE_SLUG=$slug" >> "$GITHUB_ENV"
          test -f "ops/site-factory/$slug.json"

      - name: Decrypt Wasmer account state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}" || { echo 'Automation encryption key unavailable'; exit 3; }
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:AUTOMATION_KEY \
            -in ops/wasmer/state.automation.aes \
            -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json

      - name: Validate and package plugin
        shell: bash
        run: |
          set -euo pipefail
          php -l wordpress/plugins/runner3-r2-responsive/runner3-r2-responsive.php
          rm -f "$PLUGIN_ZIP"
          (
            cd wordpress/plugins
            zip -qr "$PLUGIN_ZIP" runner3-r2-responsive
          )
          test -s "$PLUGIN_ZIP"

      - name: Install browser automation
        run: npm install --no-save playwright-core@1.58.2

      - name: Install plugin and verify public domain
        id: deploy
        shell: bash
        run: |
          set +e
          node scripts/install-wordpress-r2-responsive.mjs
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist safe result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/custom-domain/r2-responsive
          if [ -f /tmp/wp-r2-responsive-result.json ]; then
            cp /tmp/wp-r2-responsive-result.json ops/custom-domain/r2-responsive/latest.json
          else
            printf '{"status":"runner_error","detail":"wp_r2_responsive_result_missing"}\n' > ops/custom-domain/r2-responsive/latest.json
          fi
          rm -f /tmp/wasmer-account.json "$PLUGIN_ZIP"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/custom-domain/r2-responsive/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist WordPress origin responsive image result: ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
            git pull --rebase origin main
          done
          exit 5

      - name: Enforce deployment success
        if: always()
        env:
          DEPLOY_RC: ${{ steps.deploy.outputs.rc }}
        shell: bash
        run: |
          test "${DEPLOY_RC:-99}" = "0" || exit 12
