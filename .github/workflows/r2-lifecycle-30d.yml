name: R2 30-Day Lifecycle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/triggers/r2-lifecycle-30d.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: runner3-direct-download-test
      RULE_ID: auto-delete-direct-downloads-30d
      MAX_AGE: '2592000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read, merge and apply lifecycle rule
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET}/lifecycle"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          curl -fsS "$api" "${auth[@]}" > /tmp/before.json

          python3 - <<'PY'
          import json, os
          before=json.load(open('/tmp/before.json'))
          if not before.get('success'):
              raise SystemExit('lifecycle_get_failed')
          rules=list((before.get('result') or {}).get('rules') or [])
          rid=os.environ['RULE_ID']
          rules=[r for r in rules if r.get('id') != rid]
          rules.append({
              'id': rid,
              'enabled': True,
              'conditions': {'prefix': ''},
              'deleteObjectsTransition': {
                  'condition': {
                      'type': 'Age',
                      'maxAge': int(os.environ['MAX_AGE'])
                  }
              }
          })
          json.dump({'rules':rules},open('/tmp/put-body.json','w'),separators=(',',':'))
          print(json.dumps({'preservedRuleCount':len(rules)-1,'upsertedRule':rid,'maxAgeSeconds':int(os.environ['MAX_AGE'])},indent=2))
          PY

          curl -fsS -X PUT "$api" "${auth[@]}" --data-binary @/tmp/put-body.json > /tmp/put-response.json
          curl -fsS "$api" "${auth[@]}" > /tmp/after.json

          python3 - <<'PY'
          import json, os, datetime
          before=json.load(open('/tmp/before.json'))
          put=json.load(open('/tmp/put-response.json'))
          after=json.load(open('/tmp/after.json'))
          rid=os.environ['RULE_ID']; max_age=int(os.environ['MAX_AGE'])
          rules=(after.get('result') or {}).get('rules') or []
          rule=next((r for r in rules if r.get('id')==rid),None)
          cond=((rule or {}).get('deleteObjectsTransition') or {}).get('condition') or {}
          verified=bool(after.get('success') and rule and rule.get('enabled') is True and (rule.get('conditions') or {}).get('prefix','')=='' and cond.get('type')=='Age' and int(cond.get('maxAge') or -1)==max_age)
          out={
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'bucket':os.environ['BUCKET'],
            'ruleId':rid,
            'retentionDays':30,
            'maxAgeSeconds':max_age,
            'scopePrefix':'',
            'appliesToExistingAndNewObjects':True,
            'putSuccess':bool(put.get('success',True)),
            'rule':rule,
            'totalRulesAfter':len(rules),
            'verified':verified
          }
          import pathlib
          pathlib.Path('/tmp/r2-lifecycle').mkdir(exist_ok=True)
          pathlib.Path('/tmp/r2-lifecycle/status.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if not verified:
              raise SystemExit('lifecycle_rule_verification_failed')
          PY

      - name: Persist lifecycle verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/r2-lifecycle/status.json || exit 0
          cp /tmp/r2-lifecycle/status.json /tmp/status.safe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/r2-lifecycle
            cp /tmp/status.safe.json ops/r2-lifecycle/status.json
            git add ops/r2-lifecycle/status.json
            git diff --cached --quiet && exit 0
            git commit -m 'Persist R2 30-day lifecycle verification [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 3
