name: Runner3 Speed Site3 Realistic WordPress

on:
  push:
    branches:
      - runner3-speed-site3-realistic-20260821
    paths:
      - '.github/workflows/runner3-speed-site3-realistic.yml'
      - 'scripts/runner3-speed-site3-preaudit.mjs'
      - 'wordpress/runner3-speed/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  WP_SITE_SLUG: runner3-speed-site3-realistic
  WP_APP_NAME: runner3-speed-site3-realistic

concurrency:
  group: runner3-speed-site3-realistic
  cancel-in-progress: true

jobs:
  realistic-site3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static checks and package Runner3 Speed
        run: |
          set -euo pipefail
          php -l wordpress/runner3-speed/runner3-speed.php
          php -l wordpress/runner3-speed/dropins/advanced-cache.php
          php -l wordpress/runner3-speed/uninstall.php
          node --check scripts/runner3-speed-site3-preaudit.mjs
          node --check scripts/provision-wordpress-site-v15.mjs
          node --check scripts/runner5-wordpress-retheme-v3.mjs
          node --check scripts/runner3-speed-ab-benchmark.mjs
          node --check scripts/runner3-speed-safety-matrix.mjs
          (cd wordpress && zip -qr /tmp/runner3-speed.zip runner3-speed)
          test -s /tmp/runner3-speed.zip

      - name: Decrypt Wasmer account
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}"
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json

      - name: Install browser benchmark tooling
        run: npm install --no-save playwright-core@1.58.2 lighthouse@13.0.1

      - name: Provision a brand-new direct WordPress host
        run: |
          set -euo pipefail
          cat >/tmp/site3-realistic.request.json <<'JSON'
          {
            "site_name": "Runner3 Speed Site 3 Realistic",
            "site_slug": "runner3-speed-site3-realistic",
            "app_name": "runner3-speed-site3-realistic",
            "domain_mode": "wasmer"
          }
          JSON
          SITE_FACTORY_REQUEST=/tmp/site3-realistic.request.json node scripts/provision-wordpress-site-v15.mjs
          test -s /tmp/site-factory-v15-runner3-speed-site3-realistic.json
          cp /tmp/site-factory-v15-runner3-speed-site3-realistic.json ops/site-factory/runner3-speed-site3-realistic.json
          python - <<'PY'
          import json
          r=json.load(open('ops/site-factory/runner3-speed-site3-realistic.json'))
          assert r['status']=='COMPLETE', r
          assert r['wpAdminReachable'] and r['wpApiReachable'], r
          assert r['httpCode'] and r['httpCode'] < 500, r
          print(json.dumps({'status':'PASS','siteUrl':r['siteUrl'],'reusedExistingApp':r['reusedExistingApp']},indent=2))
          PY

      - name: Build official Astra Construction full starter site with Elementor
        run: |
          set -euo pipefail
          cp ops/site-factory/runner5-restore-lab-1.json /tmp/runner5-record.original.json
          trap 'cp /tmp/runner5-record.original.json ops/site-factory/runner5-restore-lab-1.json' EXIT
          cp ops/site-factory/runner3-speed-site3-realistic.json ops/site-factory/runner5-restore-lab-1.json
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/runner5-wordpress-retheme-v3.mjs').read_text()
          s=s.replace("name:'Nutritionist',builder:'Block Editor/Spectra'","name:'Construction',builder:'Elementor'")
          s=s.replace("'Nutritionist'","'Construction'")
          s=s.replace("/Nutritionist/i","/Construction/i")
          s=s.replace("[/Block Editor/i,/Spectra/i,/Gutenberg/i]","[/Elementor/i]")
          s=s.replace("const sp=await plugin(ctx,n,'ultimate-addons-for-gutenberg','ultimate-addons-for-gutenberg/');result.plugins.spectra=sp.status||'active';","const el=await plugin(ctx,n,'elementor','elementor/');result.plugins.elementor=el.status||'active';")
          s=s.replace("result.verify.pageTitles.length>=6&&['about','program','success','blog','contact'].filter(x=>j.includes(x)).length>=4","result.verify.pageTitles.length>=5&&['about','services','projects','contact'].filter(x=>j.includes(x)).length>=4")
          s=s.replace("if(!result.verify.noindexMeta)throw new Error('public_noindex_meta_missing');","")
          Path('/tmp/runner3-site3-construction-import.mjs').write_text(s)
          PY
          node --check /tmp/runner3-site3-construction-import.mjs
          node /tmp/runner3-site3-construction-import.mjs
          test -s /tmp/runner5-wordpress-retheme.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner5-wordpress-retheme.json'))
          assert r['status']=='READY', r
          assert r['theme']=='astra', r
          assert r['starter']['imported'] is True, r
          assert r['plugins'].get('starterTemplates')=='active', r
          assert r['plugins'].get('elementor')=='active', r
          print(json.dumps(r,indent=2))
          PY
          cp /tmp/runner5-record.original.json ops/site-factory/runner5-restore-lab-1.json
          trap - EXIT

      - name: State A - prove site richness and benchmark with no Runner3 Speed
        env:
          WP_SITE_SLUG: runner3-speed-site3-realistic
        run: |
          set -euo pipefail
          node scripts/runner3-speed-site3-preaudit.mjs
          test -s /tmp/runner3-speed-site3-a.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-site3-a.json'))
          assert r['status']=='ready', r
          assert r['pluginAbsent'] is True, r
          assert r['cloudflare'] is False, r
          q=r['richness']
          assert q['pages']>=5 and q['localMedia']>=8 and q['images']>=4 and q['elementor'] and q['astra'], r
          print(json.dumps({'status':'PASS','richness':q,'browser':r['browser'],'lighthouse':r['lighthouse']},indent=2))
          PY

      - name: States B/C - installed OFF vs Performance ON
        env:
          WP_SITE_SLUG: runner3-speed-site3-realistic
          RUNNER3_PLUGIN_ZIP: /tmp/runner3-speed.zip
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/runner3-speed-ab-benchmark.mjs').read_text()
          s=s.replace("lighthouseRuns('off',3)","lighthouseRuns('off',5)")
          s=s.replace("lighthouseRuns('on',3)","lighthouseRuns('on',5)")
          Path('/tmp/runner3-speed-site3-ab.mjs').write_text(s)
          PY
          node --check /tmp/runner3-speed-site3-ab.mjs
          node /tmp/runner3-speed-site3-ab.mjs
          test -s /tmp/runner3-speed-ab.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-ab.json'))
          assert r['status']=='ready', r
          assert r['cloudflare'] is False, r
          b,o=r['baseline'],r['optimized']
          assert all(x.get('speed')=='HIT' and x.get('speedVersion')==r['pluginVersion'] for x in o['curl']['runs']), r
          assert all(x.get('speed')=='HIT' and x.get('speedVersion')==r['pluginVersion'] for x in o['browser']['runs']), r
          assert o['browser']['medianTtfbMs'] < b['browser']['medianTtfbMs'], r
          assert o['lighthouse']['medianScore'] >= b['lighthouse']['medianScore'], r
          assert o['lighthouse']['medianLcpMs'] <= b['lighthouse']['medianLcpMs'] + 100, r
          print(json.dumps({'status':'PASS','version':r['pluginVersion'],'B_OFF':b,'C_ON':o,'delta':r['delta']},indent=2))
          PY

      - name: Dynamic/private safety matrix
        env:
          WP_SITE_SLUG: runner3-speed-site3-realistic
        run: |
          set -euo pipefail
          node scripts/runner3-speed-safety-matrix.mjs
          test -s /tmp/runner3-speed-safety-matrix.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-safety-matrix.json'))
          assert r['status']=='ready', r
          for k in ['currentHit','headHit','headEmptyBody','authCookieBypass','wooCartCookieBypass','wooSessionCookieBypass','cartPathBypass','checkoutPathBypass','accountPathBypass','wcApiPathBypass','deactivated','deactivateNoHit','reactivatedOff','finalNoHit']:
              assert r[k], (k,r)
          print(json.dumps({'status':'PASS','safety':r},indent=2))
          PY

      - name: Aggregate realistic site3 result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,datetime
          a=json.load(open('/tmp/runner3-speed-site3-a.json'))
          bc=json.load(open('/tmp/runner3-speed-ab.json'))
          sx=json.load(open('/tmp/runner3-speed-safety-matrix.json'))
          imp=json.load(open('/tmp/runner5-wordpress-retheme.json'))
          site=json.load(open('ops/site-factory/runner3-speed-site3-realistic.json'))
          b,c=bc['baseline'],bc['optimized']
          report={
            'status':'PASS','site':site,'starterImport':imp,'richness':a['richness'],'pluginVersion':bc['pluginVersion'],
            'states':{
              'A_no_plugin':{'curlTtfbMs':a['curl']['medianTtfbMs'],'browserTtfbMs':a['browser']['medianTtfbMs'],'browserFcpMs':a['browser']['medianFcpMs'],'browserLcpMs':a['browser']['medianLcpMs'],'lighthouseScore':a['lighthouse']['medianScore'],'lighthouseLcpMs':a['lighthouse']['medianLcpMs'],'cls':a['lighthouse']['medianCls']},
              'B_active_off':{'curlTtfbMs':b['curl']['medianTtfbMs'],'browserTtfbMs':b['browser']['medianTtfbMs'],'browserFcpMs':b['browser']['medianFcpMs'],'browserLcpMs':b['browser']['medianLcpMs'],'lighthouseScore':b['lighthouse']['medianScore'],'lighthouseLcpMs':b['lighthouse']['medianLcpMs'],'cls':b['lighthouse']['medianCls']},
              'C_performance_on':{'curlTtfbMs':c['curl']['medianTtfbMs'],'browserTtfbMs':c['browser']['medianTtfbMs'],'browserFcpMs':c['browser']['medianFcpMs'],'browserLcpMs':c['browser']['medianLcpMs'],'lighthouseScore':c['lighthouse']['medianScore'],'lighthouseLcpMs':c['lighthouse']['medianLcpMs'],'cls':c['lighthouse']['medianCls']}
            },
            'bcDelta':bc['delta'],'safety':sx,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          assert b['browser']['medianTtfbMs'] <= a['browser']['medianTtfbMs']*1.20, report
          assert b['lighthouse']['medianScore'] >= a['lighthouse']['medianScore']-2, report
          json.dump(report,open('/tmp/runner3-speed-site3-realistic-report.json','w'),indent=2)
          print(json.dumps(report,indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner3-speed-site3-realistic-evidence
          path: |
            /tmp/site-factory-v15-runner3-speed-site3-realistic.json
            /tmp/runner5-wordpress-retheme.json
            /tmp/runner3-speed-site3-a.json
            /tmp/runner3-speed-ab.json
            /tmp/runner3-speed-safety-matrix.json
            /tmp/runner3-speed-site3-realistic-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Persist checkpoint to test branch
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,datetime
          def load(path):
              if not os.path.exists(path): return None
              try: return json.load(open(path))
              except Exception as e: return {'status':'unreadable','error':str(e)}
          checkpoint={
            'status':'PASS' if (load('/tmp/runner3-speed-site3-realistic-report.json') or {}).get('status')=='PASS' else 'PARTIAL_OR_FAILED',
            'site':load('/tmp/site-factory-v15-runner3-speed-site3-realistic.json'),
            'starterImport':load('/tmp/runner5-wordpress-retheme.json'),
            'stateA':load('/tmp/runner3-speed-site3-a.json'),
            'ab':load('/tmp/runner3-speed-ab.json'),
            'safety':load('/tmp/runner3-speed-safety-matrix.json'),
            'final':load('/tmp/runner3-speed-site3-realistic-report.json'),
            'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          os.makedirs('ops/site-factory',exist_ok=True)
          json.dump(checkpoint,open('ops/site-factory/runner3-speed-site3-realistic.latest.json','w'),indent=2)
          PY
          git config user.name 'runner3-speed-site3-bot'
          git config user.email 'runner3-speed-site3-bot@users.noreply.github.com'
          git add -- ops/site-factory/runner3-speed-site3-realistic.latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: record realistic site3 evidence'
          git push origin HEAD:runner3-speed-site3-realistic-20260821

      - name: Cleanup transient files
        if: always()
        run: rm -f /tmp/wasmer-account.json /tmp/runner3-speed.zip /tmp/runner3-site3-construction-import.mjs /tmp/runner3-speed-site3-ab.mjs
