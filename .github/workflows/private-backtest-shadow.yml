name: Private Backtest Shadow

on:
  push:
    branches: [main]
    paths:
      - 'jobs/private-backtest-shadow.json'
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 5'

permissions:
  contents: read

concurrency:
  group: private-backtest-shadow
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage frozen shadow package
        run: python tools/private_backtest_shadow.py stage --config jobs/private-backtest-shadow.json

  shard:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data dependency
        run: python -m pip install --disable-pip-version-check 'dukascopy-python==4.0.1' 'numpy>=2,<3' 'pandas>=2,<3'
      - name: Run frozen shadow shard
        run: python tools/private_backtest_shadow.py shard --config jobs/private-backtest-shadow.json --shard ${{ matrix.shard }}

  evaluate:
    if: ${{ always() && needs.stage.result == 'success' }}
    needs: [stage, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate untouched forward sample
        run: python tools/private_backtest_shadow.py evaluate --config jobs/private-backtest-shadow.json
