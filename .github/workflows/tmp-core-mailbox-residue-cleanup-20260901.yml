name: tmp Core mailbox residue cleanup

on:
  push:
    branches: [maintenance/core-mailbox-residue-cleanup-20260901]
    paths:
      - '.github/workflows/tmp-core-mailbox-residue-cleanup-20260901.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/core-mailbox-residue-cleanup-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail exactly the stale semantic probe row
        shell: bash
        working-directory: cloudflare/runner3-core
        run: |
          set -euo pipefail
          RID='mailbox-semantic-test-name'
          mkdir -p ../../ops-results
          {
            echo '=== BEFORE ==='
            npx --yes wrangler@4 d1 execute runner3-core --remote --command "SELECT request_id,status,lease_owner,lease_until FROM vps_mailbox_jobs WHERE request_id='${RID}';"
            echo '=== UPDATE ==='
            npx --yes wrangler@4 d1 execute runner3-core --remote --command "UPDATE vps_mailbox_jobs SET status='failed',lease_owner=NULL,lease_until=NULL,updated_at=CURRENT_TIMESTAMP WHERE request_id='${RID}' AND status IN ('pending','queued');"
            echo '=== AFTER ==='
            npx --yes wrangler@4 d1 execute runner3-core --remote --command "SELECT request_id,status,lease_owner,lease_until FROM vps_mailbox_jobs WHERE request_id='${RID}';"
          } | tee ../../ops-results/core-mailbox-residue-cleanup-20260901.txt
          grep -q 'mailbox-semantic-test-name' ../../ops-results/core-mailbox-residue-cleanup-20260901.txt
          grep -q 'failed' ../../ops-results/core-mailbox-residue-cleanup-20260901.txt
      - name: Commit evidence and self-clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-core-mailbox-residue-cleanup-20260901.yml
          git add ops-results/core-mailbox-residue-cleanup-20260901.txt .github/workflows/tmp-core-mailbox-residue-cleanup-20260901.yml 2>/dev/null || true
          git commit -m 'ops(core): clean stale semantic mailbox probe residue' || exit 0
          git push origin HEAD:maintenance/core-mailbox-residue-cleanup-20260901
