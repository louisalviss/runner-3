name: Runner3 Artifact Library Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-artifact-library-deploy.yml'
      - 'cloudflare/runner3-core/artifact-library-reader-v6-entry.js'
      - 'cloudflare/runner3-core/src/ebook-reader-audio.js'
      - 'cloudflare/runner3-core/artifact-library-reader-v5-entry.js'
      - 'cloudflare/runner3-core/artifact-library-reader-v4-entry.js'
      - 'cloudflare/runner3-core/artifact-library-reader-v3-entry.js'
      - 'cloudflare/runner3-core/artifact-library-reader-v2-entry.js'
      - 'cloudflare/runner3-core/artifact-library-simple-entry.js'
      - 'cloudflare/runner3-core/artifact-test-cleanup-entry.js'
      - 'cloudflare/runner3-core/artifact-library-pin-v2-entry.js'
      - 'cloudflare/runner3-core/artifact-library-hardening-entry.js'
      - 'cloudflare/runner3-core/artifact-list-entry.js'
      - 'cloudflare/runner3-core/wrangler.jsonc'

permissions:
  contents: read

concurrency:
  group: runner3-artifact-library-deploy
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://runner3-core.ducduy2411.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy EPUB Reader v6 Nam Minh audio
        working-directory: cloudflare/runner3-core
        run: npx --yes wrangler@4 deploy artifact-library-reader-v6-entry.js --config wrangler.jsonc

      - name: Verify Library, Reader v5 invariants, and v6 audio E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from urllib.parse import urlencode

          base=os.environ['BASE_URL'].rstrip('/')
          ua='runner3-artifact-reader-v6-audio-proof/1.1'
          robots='noindex, nofollow, noarchive, nosnippet, noimageindex'

          def req(path, method='GET', data=None, headers=None):
              url=path if path.startswith('http') else base+path
              h={'User-Agent':ua, **(headers or {})}
              r=urllib.request.Request(url, method=method, headers=h, data=data)
              return urllib.request.urlopen(r, timeout=45)

          home=''
          for _ in range(20):
              with req('/artifact-library') as r:
                  home=r.read().decode('utf-8','replace')
                  status=r.status
                  tag=r.headers.get('X-Robots-Tag')
              if status==200 and tag==robots and 'Search books' in home:
                  break
              time.sleep(2)
          else:
              raise AssertionError('Library did not propagate')

          with req('/artifact-library/api/list') as r:
              listing=json.loads(r.read().decode())
              assert r.status==200 and r.headers.get('X-Robots-Tag')==robots
          objects=listing.get('objects') or []
          assert listing.get('ok') is True and objects
          assert listing.get('final_only') is True and listing.get('canonical_latest_per_scope') is True
          key=objects[0]['key']

          reader='/artifact-library/read?'+urlencode({'key':key})
          html=''
          for _ in range(20):
              with req(reader) as r:
                  html=r.read().decode('utf-8','replace')
                  status=r.status
                  tag=r.headers.get('X-Robots-Tag')
              if status==200 and tag==robots and 'data-r3-ebook-audio-v6="1"' in html:
                  break
              time.sleep(2)
          else:
              raise AssertionError('Reader v6 did not propagate')

          required=[
              'data-r3-hit-zones-v4="1"','id="r3SettingsBackdrop"','setTimeout(hideAll,6000)',
              'data-r3-live-reflow-v5="1"','--r3-reader-edge','r3CurrentCfi','r3ScheduleReflow',
              'rendition.resize(viewer.clientWidth,viewer.clientHeight)','await rendition.display(anchor)',
              "rendition.themes.override('padding-left','0',true)",
              "rendition.themes.override('padding-right','0',true)",
              "rendition.themes.override('line-height',String(line),true)",
              'r3-reader-margin','r3-reader-line-height','r3-reader-position:',
              'data-r3-ebook-audio-v6="1"',"dock.id='r3AudioDock'",'/artifact-library/audio','Nam Minh'
          ]
          missing=[x for x in required if x not in html]
          assert not missing, missing
          assert "rendition.themes.override('padding-left',margin+'%',true)" not in html
          assert "rendition.themes.override('padding-right',margin+'%',true)" not in html

          try:
              req('/artifact-library/audio?id=ebook-'+'0'*32+'&bookKey='+urlencode({'k':key})[2:])
              raise AssertionError('fake ebook audio unexpectedly existed')
          except urllib.error.HTTPError as e:
              body=json.loads(e.read().decode())
              assert e.code==404 and body.get('error')=='AUDIO_ITEM_NOT_FOUND'

          # Durable E2E proof through the exact production path used by the Reader:
          # Core enqueue -> shared production R2 queue -> VPS Nam Minh daemon -> MP3/timing -> ready.
          sample=(
              'Đây là kiểm tra tích hợp âm thanh Nam Minh của Ebook Library. '
              'Reader gửi nội dung chương vào hàng đợi sản xuất, VPS tạo giọng đọc tiếng Việt và lưu tệp MP3.\n\n'
              'Bài kiểm tra này dùng một nội dung cố định để tái sử dụng cùng cache qua các lần deploy, '
              'đồng thời xác nhận dữ liệu thời gian WordBoundary và khả năng phát theo byte range.'
          )
          payload=json.dumps({
              'bookKey':key,
              'text':sample,
              'chapterTitle':'Nam Minh E2E proof',
              'chapterHref':'runner3-e2e-proof',
              'bookTitle':'Ebook Library E2E',
              'clientVersion':'ebook-reader-audio-v1'
          },ensure_ascii=False).encode('utf-8')
          with req('/artifact-library/audio','POST',payload,{'Content-Type':'application/json'}) as r:
              audio_state=json.loads(r.read().decode())
              assert r.status in (200,202)
          audio_id=audio_state.get('id')
          assert isinstance(audio_id,str) and audio_id.startswith('ebook-')

          ready=None
          for _ in range(90):
              q='/artifact-library/audio?'+urlencode({'id':audio_id,'bookKey':key})
              with req(q) as r:
                  state=json.loads(r.read().decode())
              if state.get('status')=='ready':
                  ready=state
                  break
              if state.get('status')=='error':
                  raise AssertionError('Nam Minh daemon returned error: '+str(state.get('error')))
              assert state.get('status') in ('pending','processing')
              time.sleep(2)
          assert ready is not None, 'Nam Minh audio did not become ready'
          assert ready.get('voice')=='vi-VN-NamMinhNeural'
          assert ready.get('voiceRate')=='+3%'
          assert ready.get('audioVersion')=='ebook-reader-audio-v1'
          assert float(ready.get('durationSeconds') or 0)>0
          assert ready.get('mediaUrl') and ready.get('timingUrl')

          with req(ready['mediaUrl'],headers={'Range':'bytes=0-2047'}) as r:
              audio_head=r.read()
              assert r.status==206
              assert len(audio_head)>100
              assert r.headers.get('Accept-Ranges')=='bytes'
              assert str(r.headers.get('Content-Type') or '').startswith('audio/mpeg')

          with req(ready['timingUrl']) as r:
              timing=json.loads(r.read().decode())
              assert r.status==200
          assert timing.get('version')=='edge-word-boundary-v1'
          assert int(timing.get('boundaryCount') or 0)>0
          assert int(timing.get('paragraphCount') or 0)>0

          delivery_payload=json.dumps({'key':key,'ttl_seconds':900}).encode()
          with req('/artifact-library/api/delivery','POST',delivery_payload,{'Content-Type':'application/json','X-Runner3-Library':'1'}) as r:
              delivery=json.loads(r.read().decode())
              assert r.status==200 and delivery.get('ok') is True
          signed=((delivery.get('delivery') or {}).get('url') or '')
          assert signed.startswith('https://')
          with req(signed,headers={'Range':'bytes=0-7'}) as r:
              magic=r.read(8)
              assert r.status in (200,206) and magic.startswith(b'PK')

          print(json.dumps({
              'ok':True,
              'reader_v6_audio_ui':True,
              'ebook_audio_e2e':True,
              'nam_minh_voice':ready.get('voice'),
              'voice_rate':ready.get('voiceRate'),
              'audio_duration_seconds':ready.get('durationSeconds'),
              'timing_boundaries':timing.get('boundaryCount'),
              'timing_paragraphs':timing.get('paragraphCount'),
              'media_range_verified':True,
              'reader_v5_invariants_preserved':True,
              'outer_viewport_margin':True,
              'epub_internal_padding_removed':True,
              'cfi_preserved_during_reflow':True,
              'font_line_height_live_reflow':True,
              'settings_auto_hide_seconds':6,
              'signed_epub_verified':True,
              'book_count':len(objects),
              'noindex':True
          },ensure_ascii=False))
          PY
