name: Runner3 Artifact Library Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-artifact-library-deploy.yml'
      - 'cloudflare/runner3-core/artifact-library-reader-v2-entry.js'
      - 'cloudflare/runner3-core/artifact-library-simple-entry.js'
      - 'cloudflare/runner3-core/artifact-test-cleanup-entry.js'
      - 'cloudflare/runner3-core/artifact-library-pin-v2-entry.js'
      - 'cloudflare/runner3-core/artifact-library-hardening-entry.js'
      - 'cloudflare/runner3-core/artifact-list-entry.js'
      - 'cloudflare/runner3-core/wrangler.jsonc'

permissions:
  contents: read

concurrency:
  group: runner3-artifact-library-deploy
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://runner3-core.ducduy2411.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy iPhone-style EPUB Reader v2
        working-directory: cloudflare/runner3-core
        run: npx --yes wrangler@4 deploy artifact-library-reader-v2-entry.js --config wrangler.jsonc

      - name: Verify Library and Reader v2 live
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          from urllib.parse import urlencode

          base=os.environ['BASE_URL'].rstrip('/')
          ua='runner3-artifact-reader-v2-proof/1.0'
          robots='noindex, nofollow, noarchive, nosnippet, noimageindex'

          def req(path, method='GET', data=None, headers=None):
              url=path if path.startswith('http') else base+path
              h={'User-Agent':ua, **(headers or {})}
              r=urllib.request.Request(url, method=method, headers=h, data=data)
              return urllib.request.urlopen(r, timeout=30)

          home=''
          for attempt in range(20):
              with req('/artifact-library') as r:
                  home=r.read().decode('utf-8','replace')
                  status=r.status
                  tag=r.headers.get('X-Robots-Tag')
              if status==200 and tag==robots and 'Search books' in home:
                  break
              time.sleep(2)
          else:
              raise AssertionError('Library did not propagate; prefix='+home[:240])

          assert 'aria-label="Search"' in home
          assert 'aria-label="Refresh R2"' in home
          assert 'Core access token' not in home and 'Library PIN' not in home
          assert 'All objects' not in home and 'Latest final / scope' not in home

          with req('/artifact-library/api/list') as r:
              listing=json.loads(r.read().decode())
              assert r.status==200 and r.headers.get('X-Robots-Tag')==robots
          assert listing.get('ok') is True
          assert listing.get('final_only') is True and listing.get('canonical_latest_per_scope') is True
          objects=listing.get('objects') or []
          assert objects
          assert all('/final/' in x.get('key','') and x.get('key','').lower().endswith('.epub') for x in objects)
          key=objects[0]['key']

          reader='/artifact-library/read?'+urlencode({'key':key})
          html=''
          for attempt in range(20):
              with req(reader) as r:
                  html=r.read().decode('utf-8','replace')
                  status=r.status
                  tag=r.headers.get('X-Robots-Tag')
              if status==200 and tag==robots and 'Cài đặt đọc' in html and 'r3-reader-navigation' in html:
                  break
              time.sleep(2)
          else:
              raise AssertionError('Reader v2 did not propagate; prefix='+html[:240])

          required=[
              'id="settingsButton"','id="settingsSheet"','Cài đặt đọc',
              'data-nav="swipe"','data-nav="tap"','Chạm trái / phải',
              'data-theme="light"','data-theme="dark"','data-theme="brown"',
              'r3-reader-font-size','r3-reader-theme','r3-reader-navigation',
              'r3-reader-margin','r3-reader-line-height','r3-reader-position:',
              "setTimeout(hideControls,3000)","toggleControls()",'rendition.getContents()',
              "Math.abs(dx)>=38","ratio<.33","ratio>.67",
              'data-margin="2"','data-margin="5"','data-margin="9"',
              'data-line="1.35"','data-line="1.55"','data-line="1.8"','data-line="2"',
              "localStorage.setItem(k,String(v))"
          ]
          missing=[x for x in required if x not in html]
          assert not missing, missing

          payload=json.dumps({'key':key,'ttl_seconds':900}).encode()
          with req('/artifact-library/api/delivery','POST',payload,{'Content-Type':'application/json','X-Runner3-Library':'1'}) as r:
              delivery=json.loads(r.read().decode())
              assert r.status==200 and delivery.get('ok') is True
          signed=((delivery.get('delivery') or {}).get('url') or '')
          assert signed.startswith('https://')
          with req(signed,headers={'Range':'bytes=0-7'}) as r:
              magic=r.read(8)
              assert r.status in (200,206) and magic.startswith(b'PK')

          print(json.dumps({
              'ok':True,
              'reader_full_viewport':True,
              'navigation_modes':['swipe','tap-zones'],
              'epub_iframe_gesture_binding':True,
              'center_tap_controls':True,
              'controls_auto_hide_seconds':3,
              'settings_gear':True,
              'themes':['light','dark','brown'],
              'font_remembered':True,
              'margin_options':[2,5,9],
              'line_height_options':[1.35,1.55,1.8,2.0],
              'all_settings_remembered':True,
              'position_remembered_per_book':True,
              'signed_epub_verified':True,
              'book_count':len(objects),
              'noindex':True
          },ensure_ascii=False))
          PY
