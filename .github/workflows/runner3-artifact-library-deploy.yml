name: Runner3 Artifact Library Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner3-artifact-library-deploy.yml'
      - 'cloudflare/runner3-core/artifact-library-simple-entry.js'
      - 'cloudflare/runner3-core/artifact-test-cleanup-entry.js'
      - 'cloudflare/runner3-core/artifact-library-pin-v2-entry.js'
      - 'cloudflare/runner3-core/artifact-library-hardening-entry.js'
      - 'cloudflare/runner3-core/artifact-list-entry.js'
      - 'cloudflare/runner3-core/wrangler.jsonc'

permissions:
  contents: read

concurrency:
  group: runner3-artifact-library-deploy
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://runner3-core.ducduy2411.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy simplified public EPUB Library
        working-directory: cloudflare/runner3-core
        run: npx --yes wrangler@4 deploy artifact-library-simple-entry.js --config wrangler.jsonc

      - name: Verify final-only Library and EPUB reader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          from urllib.parse import urlencode

          base=os.environ['BASE_URL'].rstrip('/')
          ua='runner3-artifact-library-simple-proof/1.1'
          robots='noindex, nofollow, noarchive, nosnippet, noimageindex'

          def req(path, method='GET', data=None, headers=None):
              url=path if path.startswith('http') else base+path
              h={'User-Agent':ua, **(headers or {})}
              r=urllib.request.Request(url, method=method, headers=h, data=data)
              return urllib.request.urlopen(r, timeout=30)

          home=''
          for attempt in range(20):
              with req('/artifact-library') as r:
                  home=r.read().decode('utf-8','replace')
                  status=r.status
                  tag=r.headers.get('X-Robots-Tag')
              if status==200 and tag==robots and 'Search books' in home:
                  break
              time.sleep(2)
          else:
              raise AssertionError('simplified Library did not propagate; prefix='+home[:240])

          assert 'aria-label="Search"' in home
          assert 'aria-label="Refresh R2"' in home
          assert 'Core access token' not in home
          assert 'Library PIN' not in home
          assert 'Log out' not in home
          assert 'All objects' not in home
          assert 'Final only' not in home
          assert 'Latest final / scope' not in home
          assert 'statObjects' not in home
          assert 'class="path"' not in home
          assert 'class="badge' not in home

          with req('/artifact-library/api/list') as r:
              listing=json.loads(r.read().decode())
              assert r.status==200
              assert r.headers.get('X-Robots-Tag')==robots
          assert listing.get('ok') is True
          assert listing.get('final_only') is True
          assert listing.get('canonical_latest_per_scope') is True
          objects=listing.get('objects') or []
          assert objects, 'no final EPUBs returned'
          assert all('/final/' in x.get('key','') and x.get('key','').lower().endswith('.epub') for x in objects)
          scopes=[x.get('scope') for x in objects]
          assert len(scopes)==len(set(scopes)), 'duplicate scope in canonical view'
          key=objects[0]['key']

          reader='/artifact-library/read?'+urlencode({'key':key})
          with req(reader) as r:
              html=r.read().decode('utf-8','replace')
              assert r.status==200
              assert r.headers.get('X-Robots-Tag')==robots
          required=[
              'id="fontDown"','id="fontUp"','data-theme="light"','data-theme="dark"','data-theme="brown"',
              'r3-reader-font-size','r3-reader-theme','r3-reader-position:',
              'localStorage.setItem(positionKey,cfi)','touchstart','touchend','data-r3-iframe-swipe="1"'
          ]
          missing=[x for x in required if x not in html]
          assert not missing, missing

          payload=json.dumps({'key':key,'ttl_seconds':900}).encode()
          with req('/artifact-library/api/delivery','POST',payload,{'Content-Type':'application/json','X-Runner3-Library':'1'}) as r:
              delivery=json.loads(r.read().decode())
              assert r.status==200 and delivery.get('ok') is True
          signed=((delivery.get('delivery') or {}).get('url') or '')
          assert signed.startswith('https://')
          with req(signed,headers={'Range':'bytes=0-7'}) as r:
              magic=r.read(8)
              assert r.status in (200,206)
              assert magic.startswith(b'PK'), magic

          print(json.dumps({
              'ok':True,
              'pin_removed_from_ui':True,
              'public_library_open':True,
              'final_only_latest_per_scope':True,
              'book_rows_title_plus_download_only':True,
              'search_submit':True,
              'refresh_icon':True,
              'reader_swipe_parent_and_iframe':True,
              'reader_settings_remembered':True,
              'reader_position_remembered_per_book':True,
              'signed_epub_verified':True,
              'noindex':True,
              'book_count':len(objects),
          },ensure_ascii=False))
          PY
