name: Runner3 Artifact Library Deploy (Legacy, No Deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

# Archived legacy Reader v6 deployment workflow.
# It MUST NOT deploy runner3-core. All cloudflare/runner3-core changes are
# promoted only by runner3-core-public-hosted-reader-deploy.yml, which owns
# the shared production Worker and preserves the canonical Reader baseline.
jobs:
  legacy-no-deploy:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'LEGACY_ARTIFACT_LIBRARY_DEPLOY_DISABLED=PASS'
          echo 'Production deploy owner: runner3-core-public-hosted-reader-deploy.yml'
