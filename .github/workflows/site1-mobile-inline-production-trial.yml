name: Site1 Mobile Inline Hero Production Trial

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runner3wp-production-mobile-inline-hero
  cancel-in-progress: false

env:
  PROD_DOMAIN: https://runner3wp.pntr.dev
  ROLLBACK_SHA: 9124f5957e176ffc9aa64444c980f3c5d6642a0d

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare mobile-only inline hero candidate
        id: prep
        continue-on-error: true
        run: |
          set -euo pipefail
          echo REJECT > /tmp/verdict
          curl -fsS -D /tmp/base-hero.h -o /tmp/hero.webp "$PROD_DOMAIN/__runner3/r2-image/offset-demo-01-w640.webp?capture=$(date +%s%N)"
          grep -Eiq '^content-type:[[:space:]]*image/webp' /tmp/base-hero.h
          npm install --no-save sharp@0.34.3 playwright-core@1.61.0 >/dev/null

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import sharp from 'sharp';
          const source='/tmp/hero.webp';
          const variants=[];
          for (const q of [66,70,74,78]) {
            const path=`/tmp/mobile-q${q}.webp`;
            await sharp(source).resize({width:320,withoutEnlargement:true}).webp({quality:q,effort:6,smartSubsample:true}).toFile(path);
            const m=await sharp(path).metadata();
            variants.push({q,path,size:fs.statSync(path).size,width:m.width,height:m.height});
          }
          const eligible=variants.filter(v=>v.size<=12000).sort((a,b)=>b.q-a.q || a.size-b.size);
          console.log(JSON.stringify({sourceBytes:fs.statSync(source).size,variants,eligible},null,2));
          if(!eligible.length) throw new Error('no 320px WebP <=12KB');
          const pick=eligible[0];
          fs.copyFileSync(pick.path,'/tmp/mobile-hero.webp');
          fs.writeFileSync('/tmp/mobile-pick.json',JSON.stringify(pick,null,2));
          NODE

          node scripts/build-wordpress-edge-snapshot.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p='edge/wordpress-edge-proxy/src/snapshot.generated.js';
          const src=fs.readFileSync(p,'utf8');
          const m=src.match(/export const SNAPSHOT_BUILT_AT = ([^;]+);\nexport const SNAPSHOTS = Object\.freeze\(([\s\S]+)\);\n?$/);
          if(!m) throw new Error('snapshot parse failed');
          const builtAt=JSON.parse(m[1]);
          const snapshots=JSON.parse(m[2]);
          let h=snapshots['/'];
          const b64=fs.readFileSync('/tmp/mobile-hero.webp').toString('base64');
          let done=false;
          h=h.replace(/<img\b[^>]*offset-demo-01[^>]*>/gi,(tag)=>{
            if(done) return tag;
            done=true;
            return `<picture data-runner3-mobile-inline-lcp="1"><source media="(max-width: 767px)" srcset="data:image/webp;base64,${b64}">${tag}</picture>`;
          });
          if(!done) throw new Error('homepage hero not found');
          h=h.replace(/<link\b[^>]*rel=["']preload["'][^>]*as=["']image["'][^>]*offset-demo-01[^>]*>/gi,'');
          snapshots['/']=h;
          const serialized=JSON.stringify(snapshots).replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
          fs.writeFileSync(p,[
            '// Generated immediately before Cloudflare deployment. Do not hand-edit.',
            `export const SNAPSHOT_BUILT_AT = ${JSON.stringify(builtAt)};`,
            `export const SNAPSHOTS = Object.freeze(${serialized});`,
            '',
          ].join('\n'));
          console.log(JSON.stringify({pick:JSON.parse(fs.readFileSync('/tmp/mobile-pick.json','utf8')),homepageBytes:Buffer.byteLength(h),marker:h.includes('data-runner3-mobile-inline-lcp="1"')}));
          NODE

          python3 - <<'PY'
          import json
          d=json.load(open('edge/wordpress-edge-proxy/wrangler.v2.jsonc'))
          d['name']='wordpress-edge-proxy'
          open('edge/wordpress-edge-proxy/wrangler.prod-mobile-inline.jsonc','w').write(json.dumps(d,indent=2)+'\n')
          PY
          C="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"; test -n "$C"; echo "CHROME_PATH=$C" >> "$GITHUB_ENV"
          mkdir -p scripts
          curl -fsSL 'https://raw.githubusercontent.com/louisalviss/runner-3/runner3wp-v2-fcp-test/scripts/pagespeed-ui-mobile-audit.mjs' -o scripts/pagespeed-ui-mobile-audit.mjs

      - name: Deploy candidate to Site1
        id: deploy
        if: steps.prep.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          npx --yes wrangler@4.124.0 deploy --config edge/wordpress-edge-proxy/wrangler.prod-mobile-inline.jsonc >/tmp/deploy.log 2>&1
          touch /tmp/deployed
          sleep 5

      - name: Production functional and responsive guard
        id: guard
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            B="__mobileinline=$(date +%s%N)-$attempt"
            if curl -fsS -H 'Cache-Control: no-cache' -D /tmp/h -o /tmp/home "$PROD_DOMAIN/?$B" \
              && grep -Eiq '^x-edge-snapshot:[[:space:]]*HIT' /tmp/h \
              && grep -Eiq '^x-edge-cache-policy:[[:space:]]*snapshot-direct' /tmp/h \
              && grep -q 'data-runner3-mobile-inline-lcp="1"' /tmp/home; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
          async function check(width,height){
            const page=await browser.newPage({viewport:{width,height}});
            await page.goto(process.env.PROD_DOMAIN+'/?__browser='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            const x=await page.evaluate(()=>{const p=document.querySelector('[data-runner3-mobile-inline-lcp="1"]');const img=p?.querySelector('img');return {picture:!!p,currentSrc:img?.currentSrc||'',naturalWidth:img?.naturalWidth||0,naturalHeight:img?.naturalHeight||0};});
            await page.close(); return x;
          }
          const mobile=await check(390,844); const desktop=await check(1440,1200);
          console.log(JSON.stringify({mobile,desktop},null,2));
          if(!mobile.picture || !mobile.currentSrc.startsWith('data:image/webp;base64,')) throw new Error('mobile did not select inline source');
          if(!desktop.picture || desktop.currentSrc.startsWith('data:image/')) throw new Error('desktop incorrectly selected inline source');
          if(mobile.naturalWidth<300 || desktop.naturalWidth<300) throw new Error('hero decode failed');
          await browser.close();
          NODE
          curl -sS -D /tmp/admin -o /dev/null "$PROD_DOMAIN/wp-admin/"
          grep -Eiq '^HTTP/[^ ]+[[:space:]]+307' /tmp/admin
          grep -Eiq '^location:[[:space:]]*https://runner3-factory-smoke-2\.wasmer\.app' /tmp/admin
          curl -fsS -H 'Cookie: wordpress_logged_in_probe=1' -D /tmp/auth -o /tmp/authbody "$PROD_DOMAIN/"
          grep -Eiq '^x-edge-mode:[[:space:]]*bypass' /tmp/auth

      - name: Official PageSpeed target gate
        id: psi
        if: steps.guard.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            PSI_URL="$PROD_DOMAIN/" PSI_UI_OUT="/tmp/psi-$i.json" timeout 330s node scripts/pagespeed-ui-mobile-audit.mjs
          done
          python3 - <<'PY'
          import json,re,statistics
          def sec(v):
            m=re.match(r'^([0-9.]+)\s*(ms|s)?$',str(v or '').strip())
            if not m:return None
            x=float(m.group(1));return x/1000 if m.group(2)=='ms' else x
          rows=[]
          for i in range(1,4):
            d=json.load(open(f'/tmp/psi-{i}.json'))
            r={'run':i,'performance':d.get('performance'),'fcp':sec(d.get('fcp')),'lcp':sec(d.get('lcp')),'tbt':d.get('tbt'),'cls':d.get('cls'),'url':d.get('resultUrl')}
            rows.append(r);print('PSI',json.dumps(r))
          med=statistics.median([r['lcp'] for r in rows if r['lcp'] is not None])
          passed=len(rows)==3 and all(r['performance']==100 for r in rows) and med<=0.9
          print('MEDIAN_LCP',med);print('TARGET_PASS',str(passed).lower())
          open('/tmp/verdict','w').write('PASS' if passed else 'REJECT')
          PY

      - name: Roll back unless target passed
        id: rollback
        if: always()
        run: |
          set -euo pipefail
          verdict="$(cat /tmp/verdict 2>/dev/null || echo REJECT)"
          if [ "$verdict" = PASS ]; then echo 'KEEP candidate'; exit 0; fi
          if [ ! -f /tmp/deployed ]; then echo 'NO_DEPLOY_TO_ROLLBACK'; exit 0; fi
          git reset --hard
          git clean -fd
          git checkout --detach "$ROLLBACK_SHA"
          node scripts/build-wordpress-edge-snapshot.mjs
          python3 - <<'PY'
          import json
          d=json.load(open('edge/wordpress-edge-proxy/wrangler.v2.jsonc'));d['name']='wordpress-edge-proxy';open('edge/wordpress-edge-proxy/wrangler.prod-rollback.jsonc','w').write(json.dumps(d,indent=2)+'\n')
          PY
          npx --yes wrangler@4.124.0 deploy --config edge/wordpress-edge-proxy/wrangler.prod-rollback.jsonc >/tmp/rollback.log 2>&1
          sleep 5
          B="__rollback=$(date +%s%N)"
          curl -fsS -H 'Cache-Control: no-cache' -D /tmp/rh -o /tmp/rhome "$PROD_DOMAIN/?$B"
          grep -Eiq '^x-edge-snapshot:[[:space:]]*HIT' /tmp/rh
          grep -Eiq '^x-edge-cache-policy:[[:space:]]*snapshot-direct' /tmp/rh
          echo 'ROLLBACK_VERIFIED'

      - name: Final verdict
        if: always()
        run: |
          echo "FINAL_VERDICT=$(cat /tmp/verdict 2>/dev/null || echo REJECT)"
          echo "PREP=${{ steps.prep.outcome }} DEPLOY=${{ steps.deploy.outcome }} GUARD=${{ steps.guard.outcome }} PSI=${{ steps.psi.outcome }} ROLLBACK=${{ steps.rollback.outcome }}"
