name: Private Backtest Cross Asset 60m Probe

on:
  push:
    branches: [main]
    paths:
      - 'jobs/private-backtest-cross-asset-60m.json'
      - '.github/workflows/private-backtest-cross-asset-60m.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-backtest-cross-asset-60m-probe
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        family: [forex, metals, indices]
    env: &env
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/private_backtest_cross_asset.py stage --config jobs/private-backtest-cross-asset-60m.json --family ${{ matrix.family }}

  shard:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        family: [forex, metals, indices]
        shard: [0,1,2,3,4,5,6,7]
    env: *env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'dukascopy-python==4.0.1' 'numpy>=2,<3' 'pandas>=2,<3'
      - run: python tools/private_backtest_cross_asset.py shard --config jobs/private-backtest-cross-asset-60m.json --family ${{ matrix.family }} --shard ${{ matrix.shard }}

  evaluate:
    if: ${{ always() && needs.stage.result == 'success' }}
    needs: [stage, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: [forex, metals, indices]
    env: *env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/private_backtest_cross_asset.py evaluate --config jobs/private-backtest-cross-asset-60m.json --family ${{ matrix.family }}

  symbol_gate:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        family: [forex, metals, indices]
    env: *env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/private_backtest_symbol_gate_eval.py --config jobs/private-backtest-cross-asset-60m.json --family ${{ matrix.family }}
