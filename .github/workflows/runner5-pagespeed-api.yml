name: Runner5 PageSpeed API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner5-pagespeed-api.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner5-pagespeed-api
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: https://runner5-restore-proxy.ducduy2411.workers.dev/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Query Google PageSpeed API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error, time
          target=os.environ['TARGET_URL']
          endpoint='https://www.googleapis.com/pagespeedonline/v5/runPagespeed'
          out={'status':'failed','target':target,'checkedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'mobile':None,'desktop':None,'detail':None}
          def run(strategy):
              params=[('url',target),('strategy',strategy),('category','performance'),('category','accessibility'),('category','best-practices'),('category','seo')]
              url=endpoint+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':'Runner5-PageSpeed-Audit/1.0'})
              with urllib.request.urlopen(req,timeout=180) as r:
                  data=json.loads(r.read().decode())
              lr=data.get('lighthouseResult') or {}
              cats=lr.get('categories') or {}
              audits=lr.get('audits') or {}
              def score(name):
                  v=(cats.get(name) or {}).get('score')
                  return None if v is None else round(v*100)
              def display(name):
                  return (audits.get(name) or {}).get('displayValue')
              return {
                  'scores':{
                      'performance':score('performance'),
                      'accessibility':score('accessibility'),
                      'bestPractices':score('best-practices'),
                      'seo':score('seo'),
                  },
                  'metrics':{
                      'fcp':display('first-contentful-paint'),
                      'lcp':display('largest-contentful-paint'),
                      'tbt':display('total-blocking-time'),
                      'cls':display('cumulative-layout-shift'),
                      'speedIndex':display('speed-index'),
                      'serverResponseTime':display('server-response-time'),
                  },
                  'fetchTime':lr.get('fetchTime'),
                  'finalUrl':lr.get('finalUrl'),
                  'lighthouseVersion':lr.get('lighthouseVersion'),
              }
          try:
              out['mobile']=run('mobile')
              out['desktop']=run('desktop')
              out['status']='ready'
          except Exception as e:
              out['detail']=repr(e)
          open('/tmp/runner5-pagespeed-api.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if out['status']!='ready': raise SystemExit(2)
          PY

      - name: Persist PageSpeed result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/runner5-pagespeed-api.json || printf '{"status":"failed","target":"%s","detail":"missing_result"}\n' "$TARGET_URL" >/tmp/runner5-pagespeed-api.json
          cp /tmp/runner5-pagespeed-api.json /tmp/runner5-pagespeed-api-safe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/pagespeed/runner5-api-results/runs
            cp /tmp/runner5-pagespeed-api-safe.json ops/pagespeed/runner5-api-results/latest.json
            cp /tmp/runner5-pagespeed-api-safe.json "ops/pagespeed/runner5-api-results/runs/${GITHUB_RUN_ID}.json"
            git add ops/pagespeed/runner5-api-results
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Persist Runner5 PageSpeed API: ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 3
