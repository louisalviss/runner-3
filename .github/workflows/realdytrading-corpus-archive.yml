name: RealDayTrading Corpus Archive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realdaytrading-corpus-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: runner3-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Export legacy RealDayTrading corpus from runner3-core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rdt/source /tmp/rdt/bundle
          W='npx --yes wrangler@4'
          for t in reddit_scan_runs reddit_posts reddit_comments reddit_post_tags; do
            $W d1 export runner3-core --remote --skip-confirmation               --table="$t" --no-schema --output="/tmp/rdt/source/$t.sql"
          done

      - name: Build SQLite JSONL bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, sqlite3, time
          root=pathlib.Path('/tmp/rdt')
          source=root/'source'
          bundle=root/'bundle'
          db_path=bundle/'realdytrading.sqlite'
          db=sqlite3.connect(db_path)
          schema=pathlib.Path('cloudflare/runner3-core/migrations/0003_reddit_deep_sweep.sql').read_text()
          db.executescript(schema)
          for table in ('reddit_scan_runs','reddit_posts','reddit_comments','reddit_post_tags'):
              db.executescript((source/f'{table}.sql').read_text())

          runs=db.execute("SELECT subreddit,mode,COUNT(*) FROM reddit_scan_runs GROUP BY subreddit,mode ORDER BY subreddit,mode").fetchall()
          if not runs or any(str(r[0]).lower()!='realdaytrading' for r in runs):
              raise SystemExit(f'REALDAYTRADING_SCOPE_FAIL:{runs}')

          def rows_to_jsonl(sql,path):
              cur=db.execute(sql)
              names=[x[0] for x in cur.description]
              count=0
              with path.open('w',encoding='utf-8') as h:
                  for row in cur:
                      h.write(json.dumps(dict(zip(names,row)),ensure_ascii=False,separators=(',',':'))+'\n')
                      count+=1
              return count

          counts={}
          counts['runs']=rows_to_jsonl('SELECT * FROM reddit_scan_runs ORDER BY started_at,run_id',bundle/'runs.jsonl')
          counts['posts']=rows_to_jsonl('SELECT * FROM reddit_posts ORDER BY created_utc,post_id',bundle/'posts.jsonl')
          counts['comments']=rows_to_jsonl('SELECT * FROM reddit_comments ORDER BY post_id,created_utc,comment_id',bundle/'comments.jsonl')
          counts['tags']=rows_to_jsonl('SELECT * FROM reddit_post_tags ORDER BY post_id,tag',bundle/'post_tags.jsonl')

          try:
              db.executescript("""
              CREATE VIRTUAL TABLE IF NOT EXISTS posts_fts USING fts5(post_id UNINDEXED,title,body_text);
              DELETE FROM posts_fts;
              INSERT INTO posts_fts(post_id,title,body_text) SELECT post_id,title,body_text FROM reddit_posts;
              CREATE VIRTUAL TABLE IF NOT EXISTS comments_fts USING fts5(comment_id UNINDEXED,post_id UNINDEXED,body_text);
              DELETE FROM comments_fts;
              INSERT INTO comments_fts(comment_id,post_id,body_text) SELECT comment_id,post_id,body_text FROM reddit_comments;
              """)
              fts=True
          except sqlite3.DatabaseError:
              fts=False
          db.commit()
          db.close()

          manifest={
              'schema':'realdytrading-corpus-v1',
              'generated_at_epoch':int(time.time()),
              'source':'legacy runner3-core D1 export',
              'scope':'RealDayTrading research corpus only',
              'storage_authority':'R2',
              'query_bundle':'SQLite + JSONL',
              'telegram_role':'backup/delivery',
              'd1_role':'retired',
              'counts':counts,
              'scan_runs':[{'subreddit':r[0],'mode':r[1],'runs':r[2]} for r in runs],
              'fts5_enabled':fts,
              'cross_subreddit_posts_policy':'Allowed only when linked/discovered inside the RealDayTrading corpus.',
          }
          for p in sorted(bundle.glob('*')):
              if p.is_file():
                  manifest.setdefault('files',{})[p.name]={
                      'bytes':p.stat().st_size,
                      'sha256':hashlib.sha256(p.read_bytes()).hexdigest()
                  }
          (bundle/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Pack corpus
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="/tmp/realdytrading-corpus-${stamp}.tar.gz"
          tar -C /tmp/rdt/bundle -czf "$archive" .
          sha="$(sha256sum "$archive" | awk '{print $1}')"
          bytes="$(stat -c %s "$archive")"
          key="reddit/RealDayTrading/corpus/snapshots/${stamp}/realdytrading-corpus-${stamp}.tar.gz"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Upload canonical bundle to R2 and verify readback
        shell: bash
        run: |
          set -euo pipefail
          archive='${{ steps.pack.outputs.archive }}'
          key='${{ steps.pack.outputs.key }}'
          sha='${{ steps.pack.outputs.sha }}'
          rb=/tmp/rdt-readback.tar.gz
          W='npx --yes wrangler@4'
          $W r2 object put "${R2_BUCKET}/$key" --file="$archive" --remote --config=cloudflare/runner3-core/wrangler.jsonc
          $W r2 object get "${R2_BUCKET}/$key" --file="$rb" --remote --config=cloudflare/runner3-core/wrangler.jsonc
          test "$(sha256sum "$rb" | awk '{print $1}')" = "$sha"
          cat > /tmp/latest.json <<JSON
          {
            "schema": "realdytrading-corpus-pointer-v1",
            "key": "$key",
            "sha256": "$sha",
            "bytes": ${{ steps.pack.outputs.bytes }},
            "generated_at": "${{ steps.pack.outputs.stamp }}",
            "authority": "R2",
            "d1": "retired",
            "telegram": "backup/delivery"
          }
          JSON
          $W r2 object put "${R2_BUCKET}/reddit/RealDayTrading/corpus/latest.json" --file=/tmp/latest.json --remote --config=cloudflare/runner3-core/wrangler.jsonc
          $W r2 object get "${R2_BUCKET}/reddit/RealDayTrading/corpus/latest.json" --file=/tmp/latest-readback.json --remote --config=cloudflare/runner3-core/wrangler.jsonc
          cmp /tmp/latest.json /tmp/latest-readback.json
          echo "RDT_R2_ARCHIVE_PASS key=$key sha=$sha"

      - name: Upload handoff artifact for Telegram delivery
        uses: actions/upload-artifact@v4
        with:
          name: realdaytrading-corpus
          path: ${{ steps.pack.outputs.archive }}
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "## RealDayTrading corpus archive"
            echo "- R2 key: `${{ steps.pack.outputs.key }}`"
            echo "- SHA256: `${{ steps.pack.outputs.sha }}`"
            echo "- Bytes: ${{ steps.pack.outputs.bytes }}"
            echo "- D1: retired"
            echo "- Telegram: pending delivery of this verified artifact"
          } >> "$GITHUB_STEP_SUMMARY"
