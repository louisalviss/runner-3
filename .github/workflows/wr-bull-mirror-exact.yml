name: WR Bull Mirror Exact
on:
  pull_request:
    branches: [main]
    paths:
      - 'wave-rider-verify/wr_bull_mirror_exact.py'
      - '.github/workflows/wr-bull-mirror-exact.yml'
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen 10m trades
        uses: actions/download-artifact@v4
        with:
          name: wr2515-phase1-10m-final
          path: /tmp/base
          github-token: ${{ github.token }}
          repository: louisalviss/runner-3
          run-id: 32237685245
      - name: Download frozen common universe
        uses: actions/download-artifact@v4
        with:
          name: wr2515-phase1-3m-final
          path: /tmp/universe
          github-token: ${{ github.token }}
          repository: louisalviss/runner-3
          run-id: 32237685232
      - name: Run exact bull mirror diagnostic
        env:
          TF_MIN: 10
          BASE_DIR: /tmp/base
          UNIVERSE_FILE: /tmp/universe/universe.json
          OUT_DIR: /tmp/helper
        run: python3 wave-rider-verify/wr_bull_mirror_exact.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr-bull-mirror-exact-final
          path: /tmp/final
          retention-days: 14
