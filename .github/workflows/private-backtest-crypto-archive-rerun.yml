name: Private Backtest Crypto Archive Rerun

on:
  push:
    branches: [main]
    paths:
      - 'jobs/private-backtest-crypto-archive-rerun.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-backtest-crypto-archive-rerun
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - venue: spot
            scope: bt-super-rsi-crypto30-binance-spot-v1
            half: 2.5
          - venue: perp
            scope: bt-super-rsi-crypto30-binance-usdm-perp-v1
            half: 2.5
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/private_backtest_crypto_archive_repair.py --scope ${{ matrix.scope }} --venue ${{ matrix.venue }} --half-spread-bps ${{ matrix.half }}

  shard:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        venue: [spot, perp]
        shard: [0,1]
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2,<3'
      - run: python tools/private_backtest_crypto_30m.py shard --config jobs/private-backtest-crypto-30m.json --venue ${{ matrix.venue }} --shard ${{ matrix.shard }}

  evaluate:
    if: ${{ always() && needs.repair.result == 'success' }}
    needs: [repair, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        venue: [spot, perp]
    env:
      RUNNER3_CORE_URL: https://runner3-core.ducduy2411.workers.dev
      RUNNER3_CORE_TOKEN: ${{ secrets.RUNNER3_CORE_TOKEN }}
      RUNNER3_SOURCE: runner-3-github-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/private_backtest_crypto_30m.py evaluate --config jobs/private-backtest-crypto-30m.json --venue ${{ matrix.venue }}
