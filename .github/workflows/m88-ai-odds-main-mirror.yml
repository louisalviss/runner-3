name: M88 AI Odds Main Mirror

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-ai-odds-main-mirror.yml'

permissions:
  contents: write

concurrency:
  group: m88-ai-odds-main-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror canonical M88 odds to public main endpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin m88-live-data:m88-live-data
          mkdir -p docs/m88
          git show m88-live-data:ai-odds.json > docs/m88/ai-odds.json
          python3 -m json.tool docs/m88/ai-odds.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/m88/ai-odds.json
          if git diff --cached --quiet; then
            echo 'No data change'
            exit 0
          fi
          git commit -m 'Mirror canonical M88 AI odds data'
          git push origin HEAD:main
