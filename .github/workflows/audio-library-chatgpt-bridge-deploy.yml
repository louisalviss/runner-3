name: Audio Library ChatGPT Bridge Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/audio-chatgpt-bridge/**'
      - '.github/workflows/audio-library-chatgpt-bridge-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner3-audio-chatgpt-bridge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crypto dependency
        run: python -m pip install -q 'cryptography>=45,<47'
      - name: Derive private queue credential
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os,re
          p='apps/audio-chatgpt-bridge/wrangler.jsonc'
          raw=open(p,encoding='utf-8').read()
          token=hashlib.sha256(b'runner3-chatgpt-queue-v2\0'+os.environ['CLOUDFLARE_API_TOKEN'].encode()).hexdigest()
          verifier=hashlib.sha256(token.encode()).hexdigest()
          raw=re.sub(r'"CHATGPT_QUEUE_SHA256"\s*:\s*"[0-9a-f]+"',f'"CHATGPT_QUEUE_SHA256": "{verifier}"',raw)
          open('/tmp/wrangler-chatgpt.jsonc','w',encoding='utf-8').write(raw)
          PY
      - name: Deploy bridge Worker
        id: deploy_bridge
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          export NO_COLOR=1
          npx -y wrangler@4.123.0 deploy --config /tmp/wrangler-chatgpt.jsonc | tee /tmp/chatgpt-bridge-deploy.log
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/chatgpt-bridge-deploy.log | tail -n 1 || true)"
          test -n "$url"
          echo "BRIDGE_URL=$url" >> "$GITHUB_ENV"
      - name: Smoke authenticated Reddit JSON bridge
        id: reddit_smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,urllib.error,urllib.request
          token=hashlib.sha256(b'runner3-chatgpt-queue-v2\0'+os.environ['CLOUDFLARE_API_TOKEN'].encode()).hexdigest()
          target='https://www.reddit.com/r/RealDayTrading/top.json?limit=5&raw_json=1&t=all'
          payload=json.dumps({'url':target}).encode()
          req=urllib.request.Request(
              os.environ['BRIDGE_URL'].rstrip('/')+'/source/reddit-json',
              data=payload,
              headers={
                  'Content-Type':'application/json',
                  'Accept':'application/json',
                  'User-Agent':'runner3-reddit-json-bridge-smoke/1.0',
                  'X-Runner-Token':token,
              },
              method='POST',
          )
          status=0
          raw=b''
          try:
              with urllib.request.urlopen(req,timeout=45) as resp:
                  status=resp.status
                  raw=resp.read()
          except urllib.error.HTTPError as exc:
              status=exc.code
              raw=exc.read()
          try:
              body=json.loads(raw.decode('utf-8'))
          except Exception:
              body={'ok':False,'error':'non_json_response','tail':raw[-500:].decode('utf-8','replace')}
          data=body.get('data') if isinstance(body,dict) else None
          children=[]
          if isinstance(data,dict):
              children=((data.get('data') or {}).get('children') or [])
          proof={
              'ok': status==200 and isinstance(body,dict) and body.get('ok') is True and len(children)>0,
              'http_status':status,
              'via':body.get('via') if isinstance(body,dict) else None,
              'bytes':body.get('bytes') if isinstance(body,dict) else len(raw),
              'children':len(children),
              'error':body.get('error') if isinstance(body,dict) else 'invalid_body',
              'target':target,
          }
          open('/tmp/reddit-json-smoke.json','w',encoding='utf-8').write(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(proof,ensure_ascii=False))
          if not proof['ok']:
              raise SystemExit(2)
          PY
      - name: Publish bridge status and public encryption key
        if: steps.reddit_smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/audio-library
          python - <<'PY'
          import base64,datetime,hashlib,json,os
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey
          token=os.environ['CLOUDFLARE_API_TOKEN']
          seed=hashlib.sha256(b'runner3-audio-library-chatgpt-bridge-v1\0'+token.encode()).digest()
          private=X25519PrivateKey.from_private_bytes(seed)
          public=private.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          out={'status':'ready','url':os.environ['BRIDGE_URL'],'publicKey':base64.b64encode(public).decode(),'crypto':'X25519-HKDF-SHA256-ChaCha20Poly1305','updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          open('ops/audio-library/chatgpt-bridge-status.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/audio-library/chatgpt-bridge-status.json
          git commit -m 'Publish ChatGPT audio bridge status [skip ci]' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
      - name: Persist Reddit JSON bridge proof
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy_bridge.outcome }}
          SMOKE_OUTCOME: ${{ steps.reddit_smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime,json,os,pathlib
          p=pathlib.Path('/tmp/reddit-json-smoke.json')
          proof=json.loads(p.read_text()) if p.exists() else {'ok':False,'error':'smoke_not_executed'}
          proof['deploy_outcome']=os.environ.get('DEPLOY_OUTCOME')
          proof['smoke_outcome']=os.environ.get('SMOKE_OUTCOME')
          proof['workflow_run_id']=os.environ['GITHUB_RUN_ID']
          proof['sha']=os.environ['GITHUB_SHA']
          proof['bridge_url']=os.environ.get('BRIDGE_URL')
          proof['checked_at']=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          proof['ok']=proof.get('ok') is True and proof['deploy_outcome']=='success' and proof['smoke_outcome']=='success'
          pathlib.Path('/tmp/reddit-json-bridge-proof.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p ops/reddit-deep-sweep
            cp /tmp/reddit-json-bridge-proof.json ops/reddit-deep-sweep/bridge.json
            git add ops/reddit-deep-sweep/bridge.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Persist Reddit JSON bridge proof: ${GITHUB_RUN_ID} [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 3

