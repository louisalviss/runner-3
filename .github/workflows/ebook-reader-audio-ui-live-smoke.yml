name: Ebook Reader Audio UI Live Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ebook_reader_audio_ui_live_smoke.py'
      - '.github/workflows/ebook-reader-audio-ui-live-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke dependency
        run: python -m pip install -q requests
      - name: Verify live audiobook player v2
        run: python scripts/ebook_reader_audio_ui_live_smoke.py
