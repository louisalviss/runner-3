name: Runner3 Speed Site3 Inspiro Full A-B-C

on:
  push:
    branches:
      - runner3-speed-site3-realistic-20260821
    paths:
      - '.github/workflows/runner3-speed-site3-inspiro-ab.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  WP_SITE_SLUG: runner3-speed-site3-realistic
  WP_APP_NAME: runner3-speed-site3-realistic

concurrency:
  group: runner3-speed-site3-inspiro-full-ab
  cancel-in-progress: false

jobs:
  full-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare benchmark tooling
        run: |
          set -euo pipefail
          php -l wordpress/runner3-speed/runner3-speed.php
          php -l wordpress/runner3-speed/dropins/advanced-cache.php
          php -l wordpress/runner3-speed/uninstall.php
          node --check scripts/runner3-speed-site3-inspiro-preaudit.mjs
          node --check scripts/runner3-speed-ab-benchmark.mjs
          node --check scripts/runner3-speed-safety-matrix.mjs
          node --check scripts/runner3-speed-site3-inspiro-functional.mjs
          npm install --no-save playwright-core@1.58.2 lighthouse@13.0.1
          (cd wordpress && zip -qr /tmp/runner3-speed.zip runner3-speed)
          test -s /tmp/runner3-speed.zip
          test -n "${AUTOMATION_KEY:-}"
          echo '::add-mask::'"$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY -in ops/wasmer/state.automation.aes -out /tmp/wasmer-account.json
          chmod 600 /tmp/wasmer-account.json

      - name: Validate real Inspiro fixture
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          f=json.load(open('ops/site-factory/runner3-speed-site3-inspiro.latest.json'))
          assert f['status']=='READY', f
          x=f['fixture']
          assert x['theme']=='inspiro' and x['demoImportId']=='inspiro-lite-architecture', x
          assert x['verify']['gates']['trueElementorContent'] and x['verify']['gates']['visuallyRichHomepage'], x
          assert len(x['pages'])>=4 and len(x['posts'])>=5 and len(x['media'])>=8, x
          print({'status':'PASS','theme':x['theme'],'demo':x['demo'],'pages':len(x['pages']),'posts':len(x['posts']),'media':len(x['media'])})
          PY

      - name: State A - clean baseline, no Runner3 Speed
        run: |
          set -euo pipefail
          node scripts/runner3-speed-site3-inspiro-preaudit.mjs
          test -s /tmp/runner3-speed-site3-inspiro-a.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/runner3-speed-site3-inspiro-a.json'))
          assert a['status']=='ready' and a['pluginAbsent'] and a['themeInspiro'] and a['elementorActive'], a
          print(json.dumps({'status':'PASS','curlTtfbMs':a['curl']['medianTtfbMs'],'browserTtfbMs':a['browser']['medianTtfbMs'],'browserFcpMs':a['browser']['medianFcpMs'],'browserLcpMs':a['browser']['medianLcpMs'],'lighthouseScore':a['lighthouse']['medianScore'],'lighthouseLcpMs':a['lighthouse']['medianLcpMs'],'lighthouseTbtMs':a['lighthouse']['medianTbtMs']},indent=2))
          PY

      - name: States B and C - installed OFF then Performance ON
        env:
          RUNNER3_PLUGIN_ZIP: /tmp/runner3-speed.zip
        run: |
          set -euo pipefail
          node scripts/runner3-speed-ab-benchmark.mjs
          test -s /tmp/runner3-speed-ab.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-ab.json'))
          assert r['status']=='ready' and r['cloudflare'] is False, r
          b,c=r['baseline'],r['optimized']
          assert all(x.get('speed')=='HIT' and x.get('speedVersion')==r['pluginVersion'] for x in c['curl']['runs']), r
          assert all(x.get('speed')=='HIT' and x.get('speedVersion')==r['pluginVersion'] for x in c['browser']['runs']), r
          print(json.dumps({'status':'PASS','version':r['pluginVersion'],'B':{'curlTtfbMs':b['curl']['medianTtfbMs'],'browserTtfbMs':b['browser']['medianTtfbMs'],'lighthouseScore':b['lighthouse']['medianScore'],'lighthouseLcpMs':b['lighthouse']['medianLcpMs']},'C':{'curlTtfbMs':c['curl']['medianTtfbMs'],'browserTtfbMs':c['browser']['medianTtfbMs'],'lighthouseScore':c['lighthouse']['medianScore'],'lighthouseLcpMs':c['lighthouse']['medianLcpMs']},'delta':r['delta']},indent=2))
          PY

      - name: Safety matrix
        run: |
          set -euo pipefail
          node scripts/runner3-speed-safety-matrix.mjs
          test -s /tmp/runner3-speed-safety-matrix.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-safety-matrix.json'))
          assert r['status']=='ready', r
          keys=['currentHit','headHit','headEmptyBody','authCookieBypass','wooCartCookieBypass','wooSessionCookieBypass','cartPathBypass','checkoutPathBypass','accountPathBypass','wcApiPathBypass','deactivated','deactivateNoHit','reactivatedOff','finalNoHit']
          for k in keys: assert r[k], (k,r)
          print({'status':'PASS','detail':r['detail']})
          PY

      - name: Functional regression - compare C against A and leave OFF
        run: |
          set -euo pipefail
          node scripts/runner3-speed-site3-inspiro-functional.mjs
          test -s /tmp/runner3-speed-site3-inspiro-functional.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/runner3-speed-site3-inspiro-functional.json'))
          assert r['status']=='ready' and all(r['gates'].values()), r
          assert all(x['pass'] for x in r['routeChecks']), r
          print(json.dumps({'status':'PASS','gates':r['gates'],'routes':r['routeChecks']},indent=2))
          PY

      - name: Aggregate A-B-C verdict and lock baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,datetime
          a=json.load(open('/tmp/runner3-speed-site3-inspiro-a.json'))
          bc=json.load(open('/tmp/runner3-speed-ab.json'))
          sx=json.load(open('/tmp/runner3-speed-safety-matrix.json'))
          fx=json.load(open('/tmp/runner3-speed-site3-inspiro-functional.json'))
          fixture=json.load(open('ops/site-factory/runner3-speed-site3-inspiro.latest.json'))
          b,c=bc['baseline'],bc['optimized']
          gates={
            'A_clean_no_plugin': a['status']=='ready' and a['pluginAbsent'],
            'B_off_browser_ttfb_within_35pct_of_A': b['browser']['medianTtfbMs'] <= a['browser']['medianTtfbMs']*1.35,
            'B_off_lighthouse_within_4_of_A': b['lighthouse']['medianScore'] >= a['lighthouse']['medianScore']-4,
            'C_curl_ttfb_better_than_B': c['curl']['medianTtfbMs'] < b['curl']['medianTtfbMs'],
            'C_browser_ttfb_better_than_B': c['browser']['medianTtfbMs'] < b['browser']['medianTtfbMs'],
            'C_lighthouse_not_worse_than_B_by_more_than_2': c['lighthouse']['medianScore'] >= b['lighthouse']['medianScore']-2,
            'C_all_requests_cache_hit': all(x.get('speed')=='HIT' for x in c['curl']['runs']) and all(x.get('speed')=='HIT' for x in c['browser']['runs']),
            'safety_matrix_pass': sx['status']=='ready',
            'functional_regression_pass': fx['status']=='ready' and all(fx['gates'].values())
          }
          report={
            'status':'PASS' if all(gates.values()) else 'FAIL',
            'runType':'site3_inspiro_sequential_abc_functional',
            'siteUrl':a['url'],
            'fixture':{'theme':'inspiro','demo':'Architecture (Lite) / Elementor','pages':len(a['snapshot']['pages']),'posts':len(a['snapshot']['posts']),'media':len(a['snapshot']['media'])},
            'pluginVersion':bc['pluginVersion'],
            'baselineLocked':{
              'state':'A_NO_PLUGIN',
              'curlTtfbMs':a['curl']['medianTtfbMs'],'curlTotalMs':a['curl']['medianTotalMs'],
              'browserTtfbMs':a['browser']['medianTtfbMs'],'browserFcpMs':a['browser']['medianFcpMs'],'browserLcpMs':a['browser']['medianLcpMs'],'browserCls':a['browser']['medianCls'],'browserLoadMs':a['browser']['medianLoadMs'],
              'lighthouseScore':a['lighthouse']['medianScore'],'lighthouseFcpMs':a['lighthouse']['medianFcpMs'],'lighthouseLcpMs':a['lighthouse']['medianLcpMs'],'lighthouseTbtMs':a['lighthouse']['medianTbtMs'],'lighthouseCls':a['lighthouse']['medianCls'],'lighthouseServerResponseMs':a['lighthouse']['medianServerResponseMs'],
              'checkedAt':a['checkedAt']
            },
            'states':{
              'A_no_plugin':{'curlTtfbMs':a['curl']['medianTtfbMs'],'browserTtfbMs':a['browser']['medianTtfbMs'],'browserFcpMs':a['browser']['medianFcpMs'],'browserLcpMs':a['browser']['medianLcpMs'],'lighthouseScore':a['lighthouse']['medianScore'],'lighthouseLcpMs':a['lighthouse']['medianLcpMs']},
              'B_active_off':{'curlTtfbMs':b['curl']['medianTtfbMs'],'browserTtfbMs':b['browser']['medianTtfbMs'],'browserFcpMs':b['browser']['medianFcpMs'],'browserLcpMs':b['browser']['medianLcpMs'],'lighthouseScore':b['lighthouse']['medianScore'],'lighthouseLcpMs':b['lighthouse']['medianLcpMs']},
              'C_performance_on':{'curlTtfbMs':c['curl']['medianTtfbMs'],'browserTtfbMs':c['browser']['medianTtfbMs'],'browserFcpMs':c['browser']['medianFcpMs'],'browserLcpMs':c['browser']['medianLcpMs'],'lighthouseScore':c['lighthouse']['medianScore'],'lighthouseLcpMs':c['lighthouse']['medianLcpMs']}
            },
            'bcDelta':bc['delta'],
            'gates':gates,
            'safety':sx,
            'functional':fx,
            'finalPluginState':'active_performance_off',
            'fixtureSource':fixture['fixture']['detail'],
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          json.dump(report,open('/tmp/runner3-speed-site3-inspiro-ab-report.json','w'),indent=2)
          print(json.dumps(report,indent=2))
          if report['status']!='PASS': raise SystemExit(2)
          PY

      - name: Persist benchmark checkpoint
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,datetime
          def load(path):
              if not os.path.exists(path): return None
              try:return json.load(open(path))
              except Exception as e:return {'status':'unreadable','error':str(e)}
          final=load('/tmp/runner3-speed-site3-inspiro-ab-report.json')
          cp={
            'status':(final or {}).get('status','PARTIAL_OR_FAILED'),
            'runType':'site3_inspiro_sequential_abc_functional',
            'baseline':load('/tmp/runner3-speed-site3-inspiro-a.json'),
            'ab':load('/tmp/runner3-speed-ab.json'),
            'safety':load('/tmp/runner3-speed-safety-matrix.json'),
            'functional':load('/tmp/runner3-speed-site3-inspiro-functional.json'),
            'final':final,
            'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          os.makedirs('ops/site-factory',exist_ok=True)
          json.dump(cp,open('ops/site-factory/runner3-speed-site3-inspiro-ab.latest.json','w'),indent=2)
          PY
          git config user.name 'runner3-speed-site3-inspiro-ab-bot'
          git config user.email 'runner3-speed-site3-inspiro-ab-bot@users.noreply.github.com'
          git add -- ops/site-factory/runner3-speed-site3-inspiro-ab.latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: record Inspiro Site 3 A-B-C benchmark'
          git push origin HEAD:runner3-speed-site3-realistic-20260821

      - name: Cleanup
        if: always()
        run: rm -f /tmp/wasmer-account.json /tmp/runner3-speed.zip /tmp/lh-inspiro-a-*.json /tmp/lh-off-*.json /tmp/lh-on-*.json
