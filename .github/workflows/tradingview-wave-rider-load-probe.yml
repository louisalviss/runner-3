name: TradingView Wave Rider Load Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-wave-rider-load-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_SHA256: 9156e8c49b9a5e36007620f3e17fcab26c06714a3e32a252be52437ae23d6026
    steps:
      - uses: actions/checkout@v4

      - name: Restore session and canonical source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}"
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
            -in ops/tradingview/session-state.json.aes -out /tmp/tv-state.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
            -in ops/tradingview/wave-rider-v2.5.13-window-report.pine.aes -out /tmp/wr2513.pine
          ACTUAL_SHA="$(sha256sum /tmp/wr2513.pine | awk '{print $1}')"
          echo "TV_LOAD_SOURCE_SHA256=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA256"
          grep -Fq 'strategy("Wave Rider Strategy v2.5.13 WINDOW REPORT"' /tmp/wr2513.pine
          grep -Fq 'use_bar_magnifier=false' /tmp/wr2513.pine
          echo 'TV_LOAD_SOURCE_VALIDATE=PASS'

      - name: Paste, verify and compile canonical strategy on BNB 5m
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const {chromium}=require('playwright-core');
          const source=fs.readFileSync('/tmp/wr2513.pine','utf8');
          const expectedHash=process.env.EXPECTED_SHA256;
          const state=JSON.parse(fs.readFileSync('/tmp/tv-state.json','utf8'));
          const out=[];
          const log=(k,v)=>{const s=`${k}=${v}`; console.log(s); out.push(s)};
          (async()=>{
            const exes=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'];
            const executablePath=exes.find(p=>fs.existsSync(p));
            if(!executablePath) throw new Error('Chrome/Chromium missing');
            const b=await chromium.launch({executablePath,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const c=await b.newContext({storageState:state,viewport:{width:1920,height:1080},permissions:['clipboard-read','clipboard-write']});
            const p=await c.newPage(); p.setDefaultTimeout(20000);
            const net=[];
            p.on('response',r=>{const u=r.url(); if(/pine-facade/i.test(u)) net.push({status:r.status(),url:u.slice(0,500)});});
            await p.exposeFunction('__tvCanonicalPine',()=>source);

            await p.goto('https://www.tradingview.com/chart/?symbol=BINANCE%3ABNBUSDT.P&interval=5',{waitUntil:'domcontentloaded',timeout:90000});
            await p.waitForTimeout(10000);
            let body=await p.locator('body').innerText().catch(()=>'');
            log('TV_LOAD_AUTH',/\bSign in\b/i.test(body)?'FAIL':'PASS');
            log('TV_LOAD_BNB',/BNBUSDT|BNB\/USDT|BNBUSDT\.P/i.test(body)?'PASS':'FAIL');

            const pine=p.locator('[data-name="pine-dialog-button"]').first();
            await pine.click();
            const dialog=p.locator('[data-name="pine-dialog"]').first();
            await dialog.waitFor({state:'visible',timeout:15000});
            await p.waitForTimeout(2500);
            const ta=dialog.locator('.monaco-editor textarea.inputarea, .monaco-editor textarea').first();
            await ta.waitFor({state:'attached'});
            let editable=false;
            for(let i=0;i<30;i++){editable=await ta.isEditable().catch(()=>false); if(editable) break; await p.waitForTimeout(500)}
            log('TV_EDITOR_EDITABLE',editable?'YES':'NO');
            if(!editable) throw new Error('Pine editor never became editable');

            await ta.evaluate(el=>el.focus());
            await p.keyboard.press('Control+A');
            await p.evaluate(async()=>{await navigator.clipboard.writeText(await window.__tvCanonicalPine())});
            const t0=Date.now();
            await p.keyboard.press('Control+V');
            await p.waitForTimeout(5000);
            log('TV_EDITOR_PASTE_MS',String(Date.now()-t0));

            // Exact editor-content verification without printing source.
            await p.evaluate(async()=>{await navigator.clipboard.writeText('TV_CLIPBOARD_SENTINEL')});
            await ta.evaluate(el=>el.focus());
            await p.keyboard.press('Control+A');
            await p.keyboard.press('Control+C');
            await p.waitForTimeout(1200);
            const roundtrip=await p.evaluate(async()=>await navigator.clipboard.readText());
            const roundHash=crypto.createHash('sha256').update(roundtrip,'utf8').digest('hex');
            log('TV_EDITOR_ROUNDTRIP_LEN',String(roundtrip.length));
            log('TV_EDITOR_ROUNDTRIP_SHA256',roundHash);
            log('TV_EDITOR_EXACT_HASH',roundHash===expectedHash?'PASS':'FAIL');
            if(roundHash!==expectedHash) throw new Error('Canonical Pine editor hash mismatch');

            net.length=0;
            const add=dialog.getByRole('button',{name:'Add to chart',exact:true}).first();
            log('TV_ADD_TO_CHART_VISIBLE',await add.isVisible().catch(()=>false)?'YES':'NO');
            await add.click();

            let updateOnChart=false;
            let translateUser=false;
            for(let i=0;i<90;i++){
              await p.waitForTimeout(1000);
              const upd=dialog.locator('[title="Update on chart"]').first();
              updateOnChart=(await upd.count()>0);
              translateUser=net.some(x=>x.status===200 && /pine-facade\/translate\/USER%3B/i.test(x.url));
              if(updateOnChart&&translateUser) break;
            }
            log('TV_UPDATE_ON_CHART_STATE',updateOnChart?'PRESENT':'ABSENT');
            log('TV_USER_TRANSLATE_200',translateUser?'PASS':'FAIL');
            log('TV_PINE_NETWORK_COUNT',String(net.length));

            const dialogText=await dialog.innerText().catch(()=>'');
            const compileError=/compilation error|cannot compile|script could not be translated|error on bar|failed to add/i.test(dialogText);
            log('TV_COMPILE_ERROR_TEXT',compileError?'PRESENT':'ABSENT');

            if(await dialog.isVisible().catch(()=>false)){await pine.click().catch(()=>{}); await p.waitForTimeout(2500)}
            body=await p.locator('body').innerText().catch(()=>'');
            const testerPresent=/Strategy Tester/i.test(body);
            const titlePresent=body.includes('Wave Rider Strategy v2.5.13 WINDOW REPORT') || body.includes('WR 2.5.13 WIN');
            log('TV_STRATEGY_TESTER_BODY',testerPresent?'PRESENT':'ABSENT');
            log('TV_STRATEGY_TITLE_OUTSIDE_EDITOR',titlePresent?'PRESENT':'ABSENT');
            const controls=await p.locator('button,[role="button"],[aria-label],[title],[data-name]').evaluateAll(els=>els.map(e=>({text:(e.innerText||e.textContent||'').trim().replace(/\s+/g,' ').slice(0,160),aria:e.getAttribute('aria-label')||'',title:e.getAttribute('title')||'',dataName:e.getAttribute('data-name')||''})).filter(x=>/strategy|tester|wave rider|WR 2\.5\.13|trades|report/i.test([x.text,x.aria,x.title,x.dataName].join(' '))).slice(0,160));
            fs.writeFileSync('/tmp/wr2513-controls.json',JSON.stringify(controls,null,2));
            fs.writeFileSync('/tmp/wr2513-network.json',JSON.stringify(net,null,2));
            const success=updateOnChart&&translateUser&&!compileError;
            log('TV_ADD_RESULT',success?'PASS':'FAIL');
            fs.writeFileSync('/tmp/wr2513-load-report.txt',out.join('\n')+'\n');
            await p.screenshot({path:'/tmp/wr2513-after-add.png',fullPage:true}).catch(()=>{});
            if(!success) process.exitCode=7;
            await b.close();
          })().catch(e=>{console.error('TV_WR_LOAD_ERROR='+e.message); out.push('TV_WR_LOAD_ERROR='+e.message); fs.writeFileSync('/tmp/wr2513-load-report.txt',out.join('\n')+'\n'); process.exit(8)});
          NODE

      - name: Upload non-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-wave-rider-load-${{ github.run_id }}
          path: |
            /tmp/wr2513-load-report.txt
            /tmp/wr2513-controls.json
            /tmp/wr2513-network.json
            /tmp/wr2513-after-add.png
          if-no-files-found: warn
          retention-days: 1

      - name: Cleanup plaintext
        if: always()
        run: rm -f /tmp/tv-state.json /tmp/wr2513.pine
