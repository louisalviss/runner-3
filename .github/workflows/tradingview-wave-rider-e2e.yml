name: TradingView Wave Rider E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-wave-rider-e2e.yml'
      - 'scripts/tradingview-wave-rider-e2e.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_SHA256: 9156e8c49b9a5e36007620f3e17fcab26c06714a3e32a252be52437ae23d6026
    steps:
      - uses: actions/checkout@v4

      - name: Restore session and canonical source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_KEY:-}"
          echo "::add-mask::$AUTOMATION_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
            -in ops/tradingview/session-state.json.aes -out /tmp/tv-state.json
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AUTOMATION_KEY \
            -in ops/tradingview/wave-rider-v2.5.13-window-report.pine.aes -out /tmp/wr2513.pine
          SHA="$(sha256sum /tmp/wr2513.pine | awk '{print $1}')"
          echo "TV_E2E_SOURCE_SHA256=$SHA"
          test "$SHA" = "$EXPECTED_SHA256"
          grep -Fq 'strategy("Wave Rider Strategy v2.5.13 WINDOW REPORT"' /tmp/wr2513.pine
          grep -Fq 'use_bar_magnifier=false' /tmp/wr2513.pine
          echo 'TV_E2E_SOURCE_VALIDATE=PASS'

      - name: Compile strategy, open Trades and attempt CSV export
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.58.2 >/dev/null
          node scripts/tradingview-wave-rider-e2e.mjs

      - name: Upload non-source E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-wave-rider-e2e-${{ github.run_id }}
          path: |
            /tmp/wr2513-e2e-report.txt
            /tmp/wr2513-trades-body.txt
            /tmp/wr2513-trades-controls.json
            /tmp/wr2513-trades-panel.png
            /tmp/wr2513-download-control.json
            /tmp/wr2513-download-events.json
            /tmp/wr2513-trades-export.csv
            /tmp/wr2513-trades-export-head.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Cleanup plaintext
        if: always()
        run: rm -f /tmp/tv-state.json /tmp/wr2513.pine
