name: Dafabet OW Public Outright Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dafabet-ow-public-outright-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser tooling
        run: python3 -m pip install --user -q playwright
      - name: Inspect public OW Sports board
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from playwright.sync_api import sync_playwright

          starts=[
            'https://sports.dafabet.net/en/homepage',
            'https://sports.dafabet.com/en/homepage',
            'https://www.dafabet.com/en/sports',
          ]
          out=[]
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True)
            c=b.new_context(locale='en-US',viewport={'width':1440,'height':1000})
            for start in starts:
              pg=c.new_page(); rec={'start':start}
              try:
                r=pg.goto(start,wait_until='domcontentloaded',timeout=45000)
                pg.wait_for_timeout(3500)
                rec['http']=r.status if r else None; rec['url']=pg.url
                try: txt=pg.locator('body').inner_text(timeout=8000)
                except: txt=''
                rec['body_hint']=txt[:5000]
                rec['challenge']=bool(re.search(r'captcha|verify you are human|access denied|just a moment',txt,re.I))
                controls=[]
                els=pg.locator('a,button,[role="button"]')
                for i in range(min(els.count(),800)):
                  e=els.nth(i)
                  try:
                    if not e.is_visible(): continue
                    tx=(e.inner_text() or '').strip(); href=e.get_attribute('href') or ''; title=e.get_attribute('title') or ''
                    if re.search(r'OW\s*Sports|Outright|Football|Soccer|Premier League',tx+' '+title+' '+href,re.I):
                      controls.append({'text':tx[:200],'href':href[:500],'title':title[:200],'tag':e.evaluate('x=>x.tagName')})
                  except: pass
                rec['controls']=controls[:120]

                # Normal public UI: click OW Sports once if visible. No login or challenge interaction.
                ow=pg.get_by_text(re.compile(r'^\s*OW\s*Sports\s*$',re.I))
                if ow.count():
                  try:
                    vis=next((ow.nth(i) for i in range(ow.count()) if ow.nth(i).is_visible()),None)
                    if vis:
                      before=pg.url; vis.click(timeout=5000); pg.wait_for_timeout(5500)
                      rec['ow_clicked']=True; rec['ow_url']=pg.url
                      try: otxt=pg.locator('body').inner_text(timeout=8000)
                      except: otxt=''
                      rec['ow_body_hint']=otxt[:10000]
                      rec['ow_login_gate']=bool(re.search(r'log\s*in|username.*password',otxt,re.I)) and len(otxt)<8000
                      rec['ow_has_outright']=bool(re.search(r'\bOutright\b|Futures',otxt,re.I))
                      # If Outright is a normal visible navigation item, click it once.
                      ol=pg.get_by_text(re.compile(r'^\s*Outright\s*$',re.I))
                      if ol.count():
                        try:
                          ov=next((ol.nth(i) for i in range(ol.count()) if ol.nth(i).is_visible()),None)
                          if ov:
                            ov.click(timeout=5000); pg.wait_for_timeout(4000)
                            rec['outright_clicked']=True; rec['outright_url']=pg.url
                            try: ftxt=pg.locator('body').inner_text(timeout=8000)
                            except: ftxt=''
                            rec['outright_body']=ftxt[:20000]
                            rec['epl_present']=bool(re.search(r'ENGLISH PREMIER LEAGUE|PREMIER LEAGUE',ftxt,re.I))
                            rec['target_markets']=list(dict.fromkeys(re.findall(r'(?i)(?:winner|champion|top\s*4|top four|relegation|top goal(?:\s*scorer|scorer)|golden boot)',ftxt)))[:30]
                        except Exception as e: rec['outright_click_error']=type(e).__name__
                  except Exception as e: rec['ow_click_error']=type(e).__name__
              except Exception as e:
                rec['error']=type(e).__name__+': '+str(e)[:500]
              out.append(rec); pg.close()
            b.close()
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
