name: Ebook Reader Audio
run-name: Ebook Reader Audio · manual VPS fallback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ebook-reader-audio-vps-manual-fallback
  cancel-in-progress: false

jobs:
  kick-vps-consumer:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Run serialized VPS consumer once
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/libexec/ebook-audio-vps-consumer-run
          sudo /usr/local/libexec/ebook-audio-vps-consumer-run

      - name: Verify VPS timer ownership
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl is-enabled ebook-audio-vps-consumer.timer
          sudo systemctl is-active ebook-audio-vps-consumer.timer
          if sudo systemctl is-enabled ebook-audio-vps-consumer.service >/dev/null 2>&1; then
            echo 'Persistent service must remain disabled; timer is the runtime owner.' >&2
            exit 1
          fi
