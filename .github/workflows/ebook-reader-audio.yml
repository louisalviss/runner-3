name: Ebook Reader Audio
run-name: Ebook Reader Audio · manual fallback · ${{ inputs.job_id || 'queue-scan' }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Optional ebook-<32hex> job id; blank scans queue
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: runner3-ebook-reader-audio
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EBOOK_AUDIO_BUCKET: runner3-wp-media
      EBOOK_AUDIO_VOICE: vi-VN-NamMinhNeural
      EBOOK_AUDIO_VOICE_RATE: +3%
      EBOOK_AUDIO_JOB_ID: ${{ inputs.job_id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Report manual fallback trigger
        shell: bash
        run: |
          echo "EBOOK_AUDIO_TRIGGER=workflow_dispatch"
          echo "EBOOK_AUDIO_JOB_ID=${EBOOK_AUDIO_JOB_ID:-queue-scan}"

      - name: Install TTS dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q requests edge-tts==7.2.8
          python - <<'PY'
          import edge_tts
          print('EDGE_TTS_VERSION=' + str(getattr(edge_tts, '__version__', '7.2.8')))
          PY
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Process Ebook Reader audio queue
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ebook_reader_audio_tts_v2.py
