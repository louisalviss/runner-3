name: Ebook Reader Audio
run-name: Ebook Reader Audio · ensure VPS consumer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ebook-reader-audio-vps-maintenance
  cancel-in-progress: false

jobs:
  ensure-vps-consumer:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Ensure the sole persistent VPS consumer is healthy
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(systemctl is-active ebook-reader-audio-consumer.service 2>/dev/null || true)" != active ]; then
            sudo systemctl start ebook-reader-audio-consumer.service
          fi
          test "$(systemctl is-active ebook-reader-audio-consumer.service)" = active
          test "$(systemctl is-enabled ebook-reader-audio-consumer.service)" = enabled
          test "$(systemctl is-active ebook-reader-audio-tts.service 2>/dev/null || true)" != active
          test "$(systemctl is-enabled ebook-reader-audio-tts.service 2>/dev/null || true)" != enabled
          echo 'EBOOK_AUDIO_VPS_SINGLE_CONSUMER=PASS'
