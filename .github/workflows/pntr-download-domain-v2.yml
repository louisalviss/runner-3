name: PNTR Download Domain V2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/pntr-download-domain.mjs'
      - 'apps/r2-download-pages/**'
      - '.github/workflows/pntr-download-domain-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pntr-download-domain-v2
  cancel-in-progress: true
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: runner3-download-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy Pages gateway
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch main >/tmp/pages-create.log 2>&1 || true
          npx --yes wrangler@4 pages deploy apps/r2-download-pages --project-name "$CF_PROJECT" --branch main --commit-dirty=true >/tmp/pages-deploy.log 2>&1
          url="https://${CF_PROJECT}.pages.dev/%40LinkFilesBot.apk"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -L -D /tmp/h -o /tmp/f -w '%{http_code}' "$url" || true)
            sha=$(sha256sum /tmp/f 2>/dev/null | awk '{print $1}')
            disp=$(grep -i '^content-disposition:' /tmp/h 2>/dev/null | tail -1 | tr -d '\r' | sed 's/^[^:]*: *//I')
            if [ "$code" = 200 ] && [ "$sha" = 9e72a0ab7e8ae1f31b8c1086efdffa6b4842aff114e8ea1fc7162501571fb537 ] && echo "$disp" | grep -qi '^attachment'; then break; fi
            sleep 3
          done
          [ "$code" = 200 ] && [ "$sha" = 9e72a0ab7e8ae1f31b8c1086efdffa6b4842aff114e8ea1fc7162501571fb537 ]
      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Create PNTR hostname and CNAME
        run: node scripts/pntr-download-domain.mjs
      - name: Encrypt PNTR guest ownership state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pntr-download
          if [ -s /tmp/pntr-download/storage-state.json ]; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in /tmp/pntr-download/storage-state.json -out /tmp/pntr-download/browser-state.aes -pass env:CLOUDFLARE_API_TOKEN
            rm -f /tmp/pntr-download/storage-state.json
          fi
      - name: Persist safe result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/pntr-download/status.json || printf '{"verified":false,"error":"setup_failed_before_status"}\n' >/tmp/pntr-download/status.json
          cp /tmp/pntr-download/status.json /tmp/status.safe.json
          test ! -s /tmp/pntr-download/browser-state.aes || cp /tmp/pntr-download/browser-state.aes /tmp/state.safe.aes
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for n in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ops/pntr-download
            cp /tmp/status.safe.json ops/pntr-download/status.json
            test ! -s /tmp/state.safe.aes || cp /tmp/state.safe.aes ops/pntr-download/browser-state.aes
            git add ops/pntr-download/status.json
            test ! -s /tmp/state.safe.aes || git add ops/pntr-download/browser-state.aes
            git diff --cached --quiet && exit 0
            git commit -m 'Persist PNTR download domain V2 [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 3
