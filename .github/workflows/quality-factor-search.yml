name: PIT Quality Factor Search

# diagnostic trigger: 2026-08-24
on:
  push:
    branches: [main]
    paths:
      - 'research/factor_edge_search_20260824/quality_factor.py'
      - 'research/factor_edge_search_20260824/quality_openfundex.py'
      - 'research/factor_edge_search_20260824/quality_openfundex_v2.py'
      - '.github/workflows/quality-factor-search.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/factor_edge_search_20260824/quality_factor.py'
      - 'research/factor_edge_search_20260824/quality_openfundex.py'
      - 'research/factor_edge_search_20260824/quality_openfundex_v2.py'
      - '.github/workflows/quality-factor-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy pandas requests pyarrow
      - name: Run quality factor search
        run: python research/factor_edge_search_20260824/quality_openfundex_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: quality-factor-20260824
          path: artifacts/quality_factor_20260824/
          if-no-files-found: error
      - name: Commit result
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/quality_factor_20260824/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record PIT quality factor result"
          git push
