name: M88 Special Row Inspect
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/m88-special-row-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
      - name: Connect Asia relay and inspect Special
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rs
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          pref=['TH','SG','MY','PH','ID','JP','KR','TW','VN']
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n'); out=[]
          for c in pref:
              rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and r.get('OpenVPN_ConfigData_Base64')]
              rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
              for r in rs[:3]:
                  cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
                  cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
                  p=pathlib.Path(f'/tmp/rs/{len(out):02d}-{c}.ovpn');p.write_text(cfg);out.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/rs.tsv').write_text('\n'.join(out)+'\n')
          PY
          IFACE=$(ip route show default | awk '{print $5;exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.239.0.1/24 dev vh; sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.239.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.239.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.239.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          found=0
          while IFS=$'\t' read -r cfg c ip; do
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true; sleep 1
            sudo rm -f /tmp/o.log /tmp/p.json; sudo touch /tmp/o.log; sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log || true
            ok=0
            for i in {1..12}; do sleep 1; grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null && { ok=1; break; }; done
            [ "$ok" = 1 ] || continue
            if sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 15 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/p.json; then
              python3 - <<'PY' && { found=1; break; } || true
          import json
          d=json.load(open('/tmp/p.json')); raise SystemExit(0 if d.get('status')==1 else 1)
          PY
            fi
          done < /tmp/rs.tsv
          test "$found" = 1
          python3 - <<'PY'
          import json,pathlib
          p={'sport_id':'10','lang_id':'en','view_type':'0','leagues':'999','odds_type':'3','odds_group':'3','view_date':'0','time_filter':'0','category':'0','branch_code':'','currency':'VND','is_full':'true','prev_params':'','version':'','top_x':0,'is_stream':'false','is_live_center':'false','currentMenu':'spesificSport','prevMenu':'','method':'LoadOddsData','currentTimeSlot':'2','display_type':'22'}
          pathlib.Path('/tmp/special.req').write_text(json.dumps(p,separators=(',',':')))
          PY
          sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 40 --retry 1 --retry-all-errors -X POST 'https://msports.m88.com/api/v1/m88/data/main' -H 'Content-Type: application/json' -H 'Authorization: Bearer GUEST' --data-binary @/tmp/special.req -o /tmp/special.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/special.json')); rows=[]
          for block in d.get('data') or []:
              if isinstance(block,dict): rows += [r for r in (block.get('data') or []) if isinstance(r,dict)]
          print('SPECIAL_ROWS',len(rows))
          keys_priority=['no_partai','parent_no_partai','master_no_partai','event_name','no_event','match_date','club_home','club_away','row_num','special_type','bet_type','market_name','game_type','event_type','is_live','live_timer']
          shown=0
          for r in rows:
              if not (r.get('club_home') or r.get('club_away')): continue
              print('\nROW',shown)
              for k in keys_priority:
                  if str(r.get(k) or '').strip(): print(k,'=',repr(r.get(k)))
              for k in sorted(r):
                  if k in keys_priority: continue
                  v=r.get(k)
                  if not str(v or '').strip(): continue
                  if k.startswith(('game_type_','sub_partai_','odds_','hdc_','status_','cash_out_')) or any(x in k.lower() for x in ('special','parent','market','period','corner','minute','type')):
                      print(k,'=',repr(v)[:1200])
              shown+=1
              if shown>=12: break
          PY
