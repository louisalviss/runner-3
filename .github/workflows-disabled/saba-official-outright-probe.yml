name: SABA Official Outright Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/saba-official-outright-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe documented SABA staging read-only endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error

          urls = [
            'https://apistaging.wx7777.com/sports/v1/GetOutrights?language=en',
            'https://apistaging.wx7777.com/sports/beta/GetOutrights?language=en',
            'https://apistaging.wx7777.com/sports/v1/GetSports?language=en',
            'https://apistaging.wx7777.com/sports/beta/GetSports?language=en',
          ]
          out=[]
          for url in urls:
              req=urllib.request.Request(url, headers={
                  'Accept':'application/json',
                  'Accept-Encoding':'identity',
                  'User-Agent':'Mozilla/5.0 SABA-Official-API-Probe/1.0'
              })
              rec={'url':url}
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body=r.read(4000).decode('utf-8','replace')
                      rec.update(status=r.status, content_type=r.headers.get('content-type',''), body=body)
              except urllib.error.HTTPError as e:
                  body=e.read(4000).decode('utf-8','replace')
                  rec.update(status=e.code, content_type=e.headers.get('content-type',''), body=body)
              except Exception as e:
                  rec.update(error=type(e).__name__+': '+str(e)[:300])
              out.append(rec)
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
