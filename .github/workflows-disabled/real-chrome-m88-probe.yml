name: Real Chrome M88 Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/real-chrome-m88-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check real Google Chrome
        shell: bash
        run: |
          set -euo pipefail
          echo "CHROME_PATH=$(command -v google-chrome || true)"
          google-chrome --version || google-chrome-stable --version
          Xvfb -version 2>&1 | head -n 2 || true

      - name: Install Playwright Python package only
        run: pip install --disable-pip-version-check playwright==1.55.0

      - name: Probe M88 and BTI in headed Google Chrome
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe.py <<'PY'
          import json, re, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          targets = [
              ('m88_main_sports', 'https://www.m88.com/sports'),
              ('msports_v2', 'https://msports.m88.com/app/v2/'),
              ('msports_v3', 'https://msports.m88.com/app/v3/public/sports.html'),
              ('bti_guest', 'https://prod322.bti-sports.io/en/sports?oddsStyleId=1'),
          ]

          out = Path('real_chrome_probe')
          out.mkdir(exist_ok=True)
          results = []

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  channel='chrome',
                  headless=False,
                  args=['--no-sandbox', '--disable-dev-shm-usage'],
              )
              context = browser.new_context(
                  viewport={'width': 1365, 'height': 900},
                  locale='en-US',
                  timezone_id='Asia/Ho_Chi_Minh',
              )
              page = context.new_page()

              print('BROWSER_VERSION=' + browser.version)
              try:
                  ua = page.evaluate('navigator.userAgent')
                  webdriver = page.evaluate('navigator.webdriver')
                  platform = page.evaluate('navigator.platform')
                  print('NAVIGATOR_UA=' + str(ua))
                  print('NAVIGATOR_WEBDRIVER=' + str(webdriver))
                  print('NAVIGATOR_PLATFORM=' + str(platform))
              except Exception as e:
                  print('NAVIGATOR_CHECK_ERROR=' + repr(e))

              for label, url in targets:
                  item = {'label': label, 'requested_url': url}
                  try:
                      started = time.time()
                      resp = page.goto(url, wait_until='domcontentloaded', timeout=45000)
                      page.wait_for_timeout(8000)
                      status = resp.status if resp else None
                      title = page.title()
                      final_url = page.url
                      html = page.content()
                      text = page.locator('body').inner_text(timeout=5000)
                      low = (text or '').lower()
                      block_markers = [
                          'access denied', 'access is denied', 'attention required',
                          'verify you are human', 'checking your browser', 'just a moment',
                          'temporarily blocked', 'cloudflare ray id'
                      ]
                      blocked = any(x in low for x in block_markers) or status in {401,403,407,429}
                      odds = re.findall(r'(?<!\d)(?:[1-9]\d?\.\d{2})(?!\d)', text or '')
                      item.update({
                          'status': status,
                          'title': title,
                          'final_url': final_url,
                          'blocked': blocked,
                          'text_chars': len(text or ''),
                          'html_bytes': len(html.encode('utf-8','ignore')),
                          'odds_like_count': len(odds),
                          'odds_sample': odds[:20],
                          'elapsed_seconds': round(time.time()-started, 2),
                          'text_sample': re.sub(r'\s+', ' ', text or '')[:700],
                      })
                      print(f'[{label}] STATUS={status} BLOCKED={blocked} TITLE={title!r} FINAL={final_url}')
                      print(f'[{label}] TEXT_CHARS={len(text or "")} HTML_BYTES={len(html.encode("utf-8","ignore"))} ODDS={len(odds)} SAMPLE={odds[:12]}')
                      print(f'[{label}] TEXT=' + re.sub(r'\s+', ' ', text or '')[:500])
                      page.screenshot(path=str(out / f'{label}.png'), full_page=False)
                      (out / f'{label}.html').write_text(html, encoding='utf-8', errors='ignore')
                  except Exception as e:
                      item['error'] = f'{type(e).__name__}: {e}'
                      print(f'[{label}] ERROR={type(e).__name__}: {e}')
                  results.append(item)

              context.close()
              browser.close()

          (out / 'results.json').write_text(json.dumps(results, indent=2, ensure_ascii=False), encoding='utf-8')
          PY
          xvfb-run -a python /tmp/probe.py

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-chrome-m88-probe-${{ github.run_id }}
          path: real_chrome_probe/
          retention-days: 3
