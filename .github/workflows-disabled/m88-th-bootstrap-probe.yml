name: M88 TH Bootstrap Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-th-bootstrap-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
      - name: Select Thailand relay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,json,pathlib
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          rs=[r for r in rows if (r.get('CountryShort') or '').upper()=='TH' and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
          rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
          if not rs: raise SystemExit('No TH relay')
          r=rs[0]
          cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
          pathlib.Path('/tmp/vpn.ovpn').write_text(cfg)
          print(json.dumps({k:r.get(k) for k in ['CountryShort','IP','Ping','Speed','NumVpnSessions']}))
          PY
      - name: Connect isolated Thailand egress
        shell: bash
        run: |
          set -euo pipefail
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.234.0.1/24 dev vh && sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.234.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up && sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.234.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.234.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
          sudo ip netns exec vpnns openvpn --config /tmp/vpn.ovpn --daemon --log /tmp/openvpn.log
          ok=0
          for i in {1..30}; do sleep 1; grep -q 'Initialization Sequence Completed' /tmp/openvpn.log && { ok=1; break; }; done
          test "$ok" = 1
          sudo ip netns exec vpnns curl -fsS --max-time 15 'https://www.cloudflare.com/cdn-cgi/trace' | grep -E '^(ip|loc|warp)=' | tee evidence/egress.txt
      - name: Fetch bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          base='https://msports.m88.com/app/v2'
          for spec in \
            'cookie|scripts/cookie.js' \
            'sports|sports.html' \
            'manifest|manifest.json' \
            'root|' ; do
            name=${spec%%|*}; path=${spec#*|}
            sudo ip netns exec vpnns curl -L -sS --max-time 25 -D "evidence/${name}.headers" -o "evidence/${name}.body" -w '%{http_code}\n' "$base/$path" > "evidence/${name}.status" || true
          done
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('evidence')
          out={}
          for name in ['cookie','sports','manifest','root']:
              body=(root/f'{name}.body').read_text(errors='replace') if (root/f'{name}.body').exists() else ''
              out[name]={
                'status':(root/f'{name}.status').read_text(errors='replace').strip() if (root/f'{name}.status').exists() else '',
                'bytes':len(body.encode()),
                'accessRequest':body.count('accessRequest'),
                'localStorage_setItem':body.count('localStorage.setItem'),
                'query_params':sorted(set(re.findall(r'(?:searchParams\.get|querySelector|[?&])\(?[\"\']?([A-Za-z_][A-Za-z0-9_-]{2,40})',body)))[:100]
              }
          (root/'summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Print safe bootstrap snippets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['evidence/cookie.body','evidence/sports.body']:
              s=Path(fn).read_text(errors='replace') if Path(fn).exists() else ''
              print('\n###',fn)
              for term in ['accessRequest','localStorage','site_code','operator_id','opCode','defaultLoad','URLSearchParams','location.search','postMessage']:
                  start=0; shown=0
                  while shown<6:
                      i=s.find(term,start)
                      if i<0: break
                      print(term, s[max(0,i-220):i+500].replace('\n',' ')[:850])
                      start=i+len(term); shown+=1
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m88-th-bootstrap-${{ github.run_id }}
          path: evidence/
          retention-days: 3
