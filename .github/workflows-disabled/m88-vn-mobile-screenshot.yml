name: M88 VN Mobile Screenshot

on:
  push:
    branches: [main]
    paths: ['.github/workflows/m88-vn-mobile-screenshot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence

      - name: Connect Thailand VPN
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          rs=[r for r in rows if (r.get('CountryShort') or '').upper()=='TH' and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
          rs.sort(key=lambda r:int(r.get('Speed') or 0), reverse=True)
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          for i,r in enumerate(rs[:8]):
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              pathlib.Path(f'/tmp/vpn{i}.ovpn').write_text(cfg)
          PY
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.239.0.1/24 dev vh && sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.239.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up && sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.239.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.239.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          connected=0
          for cfg in /tmp/vpn*.ovpn; do
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/openvpn.log; sudo touch /tmp/openvpn.log; sudo chmod 644 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            ok=0
            for i in {1..15}; do sleep 1; grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null && { ok=1; break; }; done
            if [ "$ok" = 1 ]; then
              trace=$(sudo ip netns exec vpnns curl -fsS --max-time 10 'https://www.cloudflare.com/cdn-cgi/trace' 2>/dev/null | grep -E '^(ip|loc|warp)=' || true)
              if echo "$trace" | grep -q '^loc=TH$'; then echo "$trace" | tee evidence/egress.txt; connected=1; break; fi
            fi
          done
          test "$connected" = 1

      - name: Click Sports, switch Vietnamese, capture desktop and mobile
        shell: bash
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path(os.environ['WORKSPACE'])/'evidence'

          def visible_texts(page):
              try:
                  return page.locator('body').inner_text(timeout=5000)
              except Exception:
                  return ''

          def click_sports(page, tag):
              result={'clicked':False}
              for sel in [
                  "a:has-text('SPORTS')", "text=SPORTS", "a[href*='sportsbook']", "a[href='/sportsbook']"
              ]:
                  try:
                      loc=page.locator(sel).first
                      if loc.count() and loc.is_visible():
                          result['selector']=sel
                          loc.click(timeout=6000)
                          page.wait_for_timeout(12000)
                          result['clicked']=True
                          result['url']=page.url
                          return result
                  except Exception as e:
                      result.setdefault('errors',[]).append(f'{sel}: {type(e).__name__}')
              page.goto('https://www.m88.com/sportsbook',wait_until='domcontentloaded',timeout=45000)
              page.wait_for_timeout(12000)
              result['fallback_direct']=True; result['url']=page.url
              return result

          def switch_vietnamese(page, tag):
              r={'opened_language':False,'changed':False}
              before=visible_texts(page)
              # Open language menu.
              for sel in ["text=English", "button:has-text('English')", "a:has-text('English')"]:
                  try:
                      loc=page.locator(sel).first
                      if loc.count() and loc.is_visible():
                          loc.click(timeout=5000)
                          page.wait_for_timeout(1500)
                          r['opened_language']=True; r['open_selector']=sel
                          break
                  except Exception as e:
                      r.setdefault('open_errors',[]).append(str(e)[:150])
              page.screenshot(path=str(out/f'{tag}_language_menu.png'),full_page=False)
              menu=visible_texts(page)
              r['menu_excerpt']=menu[-2500:]
              # Try Vietnamese labels and href/lang alternatives.
              candidates=[
                  "text=Tiếng Việt","text=Vietnamese","text=VIETNAM","text=Vietnam",
                  "a:has-text('Tiếng Việt')","button:has-text('Tiếng Việt')",
                  "[lang='vi']","[hreflang='vi']","a[href*='vi']"
              ]
              for sel in candidates:
                  try:
                      loc=page.locator(sel).first
                      if loc.count() and loc.is_visible():
                          r['change_selector']=sel
                          loc.click(timeout=6000)
                          page.wait_for_timeout(15000)
                          r['changed']=True
                          break
                  except Exception as e:
                      r.setdefault('change_errors',[]).append(f'{sel}: {type(e).__name__}')
              after=visible_texts(page)
              r['final_url']=page.url
              r['before_has_english']='LOGIN' in before or 'REGISTER' in before
              r['after_has_vietnamese']=bool(re.search(r'ĐĂNG|CƯỢC|THỂ THAO|KHUYẾN MÃI|TRANG CHỦ|Đăng|Cược|Thể thao',after,re.I))
              r['after_excerpt']=after[:2500]
              return r

          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              results={}

              # Desktop session
              ctx=browser.new_context(viewport={'width':1440,'height':900},locale='en-US')
              page=ctx.new_page(); page.goto('https://www.m88.com/',wait_until='domcontentloaded',timeout=45000); page.wait_for_timeout(12000)
              results['desktop_click']=click_sports(page,'desktop')
              page.screenshot(path=str(out/'desktop_sports_before_language.png'),full_page=True)
              results['desktop_lang']=switch_vietnamese(page,'desktop')
              page.screenshot(path=str(out/'desktop_sports_vn.png'),full_page=True)
              ctx.close()

              # Mobile session
              ctx=browser.new_context(
                  viewport={'width':390,'height':844},screen={'width':390,'height':844},
                  device_scale_factor=3,is_mobile=True,has_touch=True,
                  user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1',
                  locale='en-US'
              )
              page=ctx.new_page(); page.goto('https://www.m88.com/',wait_until='domcontentloaded',timeout=45000); page.wait_for_timeout(12000)
              results['mobile_click']=click_sports(page,'mobile')
              page.screenshot(path=str(out/'mobile_sports_before_language.png'),full_page=True)
              results['mobile_lang']=switch_vietnamese(page,'mobile')
              page.screenshot(path=str(out/'mobile_sports_vn.png'),full_page=True)
              results['mobile_metrics']={'url':page.url,'title':page.title(),'viewport':page.viewport_size,'body_excerpt':visible_texts(page)[:2000]}
              ctx.close(); browser.close()

          (out/'results.json').write_text(json.dumps(results,indent=2,ensure_ascii=False))
          print(json.dumps(results,indent=2,ensure_ascii=False))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m88-vn-mobile-${{ github.run_id }}
          path: evidence/
          retention-days: 3
