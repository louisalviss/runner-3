name: M88 SABA Serie A Full Board Scan
on:
  pull_request:
    paths: ['m88-serie-a-fullscan-trigger.txt']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          mkdir -p evidence /tmp/relays
      - name: VPN
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://www.vpngate.net/api/iphone/ -o /tmp/v.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          raw=pathlib.Path('/tmp/v.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n'); meta=[]
          for c in ['TH','JP','SG','MY','ID','KR','TW','VN']:
            rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and r.get('OpenVPN_ConfigData_Base64')]
            rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
            for r in rs[:(10 if c=='TH' else 3)]:
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              p=pathlib.Path(f'/tmp/relays/{len(meta):02d}-{c}.ovpn'); p.write_text(cfg); meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          pathlib.Path('/tmp/relays.tsv').write_text('\n'.join(meta)+'\n')
          PY
          IFACE=$(ip route show default|awk '{print $5;exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn; sudo ip link set vn netns vpnns
          sudo ip addr add 10.249.0.1/24 dev vh; sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.249.0.2/24 dev vn; sudo ip netns exec vpnns ip link set lo up; sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.249.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.249.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns; printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n'|sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          selected=0
          while IFS=$'\t' read -r cfg country relay; do
            echo TRY $country $relay
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null||true; sleep 1
            sudo rm -f /tmp/o.log /tmp/top.json; sudo touch /tmp/o.log; sudo chmod 644 /tmp/o.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/o.log||true
            ok=0; for i in {1..12}; do sleep 1; grep -q 'Initialization Sequence Completed' /tmp/o.log 2>/dev/null&&{ ok=1;break; }; done
            [ "$ok" = 1 ]||continue
            if sudo ip netns exec vpnns curl -fsS --max-time 15 'https://msports.m88.com/api/v1/sport/top?currency=VND' -H 'Authorization: Bearer GUEST' -o /tmp/top.json; then
              if python3 - <<'PY'
          import json
          try:d=json.load(open('/tmp/top.json'))
          except:raise SystemExit(1)
          raise SystemExit(0 if d.get('status')==1 else 1)
          PY
              then echo "$country $relay"|tee evidence/relay.txt; selected=1; break; fi
            fi
          done </tmp/relays.tsv
          test "$selected" = 1
      - name: Full-scan Serie A Outright board
        shell: bash
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,re,time
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          OUT=Path(os.environ['WORKSPACE'])/'evidence'
          result={'generated_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'showall_count':0,'serie_a_titles':[],'scorer_titles_global':[],'serie_a_scorer_candidates':[],'goalscorer':None}
          showall=[]; gm=[]
          def pframe(page):
            xs=[f for f in page.frames if urlparse(f.url).netloc.startswith('i1x9gr.')]
            return xs[-1] if xs else None
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            c=b.new_context(viewport={'width':390,'height':844},screen={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True,locale='en-US',timezone_id='Asia/Bangkok',user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 26_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1')
            page=c.new_page()
            def onresp(r):
              try:
                if 'BFOdds/ShowAllOdds' in r.url: showall.append(json.loads(r.text()))
                elif 'BFOdds/GetMarket' in r.url: gm.append({'post':r.request.post_data or '','body':r.text()})
              except: pass
            page.on('response',onresp)
            page.goto('https://www.m88.com/sports/Saba%20Sports?Language=en-US',wait_until='domcontentloaded',timeout=45000)
            page.wait_for_timeout(22000)
            f=pframe(page)
            if not f: raise RuntimeError('No SABA frame')
            sp=f.get_by_text('Sports',exact=True)
            for i in range(min(sp.count(),20)):
              try:
                if sp.nth(i).is_visible():sp.nth(i).click(timeout=5000);break
              except: pass
            page.wait_for_timeout(9000); f=pframe(page) or f
            out=f.get_by_text(re.compile(r'^\s*Outright(?:\s+\d+)?\s*$',re.I)).nth(0)
            out.evaluate("e=>e.scrollIntoView({block:'nearest',inline:'center'})"); page.wait_for_timeout(700); out.evaluate('e=>e.parentElement.click()')
            page.wait_for_timeout(10000); f=pframe(page) or f
            result['route']=f.url
            for _ in range(18):
              try:f.evaluate("window.scrollBy(0, Math.max(500, window.innerHeight*0.8))")
              except:pass
              page.wait_for_timeout(450)
            try:f.evaluate("window.scrollTo(0,0)")
            except:pass
            page.wait_for_timeout(2500)
            if not showall: raise RuntimeError('No ShowAllOdds')
            result['showall_count']=len(showall)
            leagueN={}; teamN={}
            for obj in showall:
              d=(obj or {}).get('Data') or {}
              for k,v in (d.get('LeagueN') or {}).items(): leagueN[str(k)]=v
              for k,v in (d.get('TeamN') or {}).items(): teamN[str(k)]=v
            result['leagueN_key_count']=len(leagueN)
            result['non_numeric_leagueN_keys']=[k for k in leagueN if not str(k).isdigit()][:100]
            all_titles=[(int(k),str(v)) for k,v in leagueN.items() if str(k).isdigit()]
            result['all_title_count']=len(all_titles)
            result['serie_a_titles']=[{'match_id':m,'title':t} for m,t in all_titles if 'SERIE A' in t.upper() and 'BRAZIL' not in t.upper()]
            result['scorer_titles_global']=[{'match_id':m,'title':t} for m,t in all_titles if any(x in t.upper() for x in ['GOALSCORER','TOP SCORER','SCORER'])]
            def is_italy_serie_a_scorer(t):
              u=t.upper()
              scorer=any(x in u for x in ['GOALSCORER','TOP SCORER','SCORER'])
              italy=('ITALY' in u or 'SERIE A' in u) and 'BRAZIL' not in u
              season=('2026/2027' in u or '2026-2027' in u or '2026/27' in u or '2026-27' in u)
              return scorer and italy and season
            cands=[(m,t) for m,t in all_titles if is_italy_serie_a_scorer(t)]
            result['serie_a_scorer_candidates']=[{'match_id':m,'title':t} for m,t in cands]
            try:
              body=f.locator('body').inner_text(timeout=5000)
              result['dom_scorer_lines']=[x.strip() for x in body.splitlines() if 'SCOR' in x.upper() and ('SERIE A' in x.upper() or 'ITALY' in x.upper())][:100]
            except Exception as e: result['dom_scorer_lines_error']=str(e)
            if cands:
              mid,title=cands[0]
              loc=f.get_by_text(title,exact=True)
              if loc.count():
                el=loc.nth(0); el.scroll_into_view_if_needed(timeout=5000); page.wait_for_timeout(400)
                before=len(gm); el.click(timeout=7000); deadline=time.time()+12; captured=None
                while time.time()<deadline:
                  for x in gm[before:]:
                    try:
                      po=json.loads(x['post'])
                      if int(po.get('Matchid',-1))==mid: captured=x; break
                    except:pass
                  if captured:break
                  page.wait_for_timeout(250)
                if captured:
                  obj=json.loads(captured['body']); odds=((obj.get('Data') or {}).get('NewOdds') or [])
                  rows=[]
                  for o in odds:
                    tid=o.get('TeamId'); rows.append({'name':teamN.get(str(tid),f'ID:{tid}'),'odds':o.get('Price'),'team_id':tid,'market_id':o.get('MarketId')})
                  result['goalscorer']={'title':title,'match_id':mid,'rows':rows}
            (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
            page.screenshot(path=str(OUT/'serie-a-fullscan.png'),full_page=False)
            c.close(); b.close()
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m88-serie-a-fullscan-${{ github.run_id }}
          path: evidence/
          retention-days: 3
