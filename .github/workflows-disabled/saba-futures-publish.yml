name: SABA Futures Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/saba-futures-publish.yml'
      - 'saba_futures_extract.py'
      - 'render_saba_futures.py'

permissions:
  contents: write

concurrency:
  group: saba-futures-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install VPN and browser tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl python3-venv
          python3 -m venv /tmp/pwvenv
          /tmp/pwvenv/bin/pip install -q playwright
          mkdir -p publish /tmp/saba-relays

      - name: Build Asia relay pool
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          pref=['JP','KR','TW','SG','TH','MY','PH','ID']
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          meta=[]
          for c in pref:
              rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
              rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
              limit=10 if c=='JP' else 2
              for r in rs[:limit]:
                  cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
                  cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
                  p=pathlib.Path(f'/tmp/saba-relays/{len(meta):02d}-{c}.ovpn')
                  p.write_text(cfg)
                  meta.append(f'{p}\t{c}\t{r.get("IP","")}')
          if not meta: raise SystemExit('No Asia VPN Gate relays')
          pathlib.Path('/tmp/saba-relays.tsv').write_text('\n'.join(meta)+'\n')
          print('RELAYS='+str(len(meta)))
          PY

      - name: Create isolated VPN namespace
        shell: bash
        run: |
          set -euo pipefail
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.240.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.240.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.240.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.240.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null

      - name: Fetch current public SABA EPL futures
        shell: bash
        run: |
          set -euo pipefail
          success=0
          while IFS=$'\t' read -r cfg country relay; do
            echo "TRY $country $relay"
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/openvpn.log
            sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            connected=0
            for i in {1..12}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null && { connected=1; break; }
              grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|Connection refused|fatal error' /tmp/openvpn.log 2>/dev/null && break || true
            done
            [ "$connected" = 1 ] || continue

            trace=$(sudo ip netns exec vpnns curl -fsS --connect-timeout 8 --max-time 12 'https://www.cloudflare.com/cdn-cgi/trace' 2>/dev/null | grep -E '^(ip|loc|warp)=' || true)
            echo "$trace"
            rm -f publish/data.json
            if sudo ip netns exec vpnns env HOME=/home/runner USER=runner /tmp/pwvenv/bin/python "$GITHUB_WORKSPACE/saba_futures_extract.py"; then
              test -s publish/data.json
              printf '%s\n' "$country" > publish/egress-country.txt
              printf '%s\n' "$trace" > publish/egress.txt
              success=1
              break
            fi
          done < /tmp/saba-relays.tsv
          test "$success" = 1

      - name: Render mobile dashboard
        run: |
          set -euo pipefail
          python3 render_saba_futures.py
          touch publish/.nojekyll
          cat > publish/README.md <<'EOF'
          # SABA EPL Futures

          Automatically refreshed public snapshot of English Premier League 2026/27 futures from the Dafabet OW / SABA public guest board.

          Files:
          - `index.html` mobile dashboard
          - `data.json` normalized Decimal odds
          EOF

      - name: Validate snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('publish/data.json'))
          assert d['odds_format']=='Decimal'
          req={'winner':20,'top4':20,'relegation':20,'goalscorer':25}
          for k,n in req.items():
              got=d['markets'][k]['selection_count']
              assert got>=n,(k,got,n)
          print('VALID', {k:d['markets'][k]['selection_count'] for k in req})
          PY
          grep -q 'SABA · EPL Futures 2026/27' publish/index.html

      - name: Publish fresh data branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tmp=$(mktemp -d)
          cp -a publish/. "$tmp/"
          git checkout --orphan saba-futures-data
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$tmp/." .
          git add -A
          git commit -m "Update SABA EPL futures $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin saba-futures-data
