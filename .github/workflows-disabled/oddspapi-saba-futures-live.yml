name: OddsPapi SABA Futures Live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oddspapi-saba-futures-live.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip install --user -q playwright requests
          mkdir -p evidence
      - name: Create one free account and test SABA Futures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,secrets,string,pathlib,requests
          from playwright.sync_api import sync_playwright
          OUT=pathlib.Path('evidence'); st={}
          def rand(n=14): return ''.join(secrets.choice(string.ascii_lowercase+string.digits) for _ in range(n))

          # Single Mail.tm account for this validation run only.
          dj=requests.get('https://api.mail.tm/domains',timeout=20).json(); ds=dj.get('hydra:member',dj.get('member',[]))
          dom=next(d['domain'] for d in ds if d.get('isActive',True)); email=f'sf{rand()}@{dom}'; pw=secrets.token_urlsafe(24)+'A1!'
          requests.post('https://api.mail.tm/accounts',json={'address':email,'password':pw},timeout=20).raise_for_status(); st['mail_domain']=dom
          api_key=None
          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome',headless=True); c=b.new_context(locale='en-US',viewport={'width':1400,'height':1000}); pg=c.new_page()
              pg.goto('https://oddspapi.io/en/sign-up',wait_until='domcontentloaded',timeout=45000); pg.wait_for_timeout(800)
              pg.locator('input[type="email"]').first.fill(email); pws=pg.locator('input[type="password"]'); pws.nth(0).fill(pw); pws.nth(1).fill(pw)
              btn=pg.get_by_role('button',name=re.compile(r'^\s*Sign Up\s*$',re.I)).first
              if not btn.count(): btn=pg.locator('button[type="submit"]').first
              btn.click(timeout=8000); pg.wait_for_timeout(5000); st['account_open']=('/account' in pg.url)
              if st['account_open']:
                  # Exact key element: the font-mono span in the paragraph whose first span says API Key.
                  rows=pg.locator('p').filter(has_text=re.compile(r'API\s*Key',re.I))
                  for i in range(rows.count()):
                      row=rows.nth(i)
                      try:
                          mono=row.locator('span.font-mono')
                          if mono.count():
                              v=mono.first.inner_text().strip()
                              if re.fullmatch(r'[A-Za-z0-9._\-]{6,64}',v): api_key=v; break
                      except: pass
              st['api_key_captured']=bool(api_key)
              b.close()

          if api_key:
              # Never print/store api_key. Test supported auth query spelling.
              valid_param=None; bookmaker_json=None
              attempts=[]
              for param in ['apiKey','api_key','key']:
                  r=requests.get('https://v5.oddspapi.io/en/bookmakers',params={param:api_key},timeout=30)
                  attempts.append({'param':param,'http':r.status_code})
                  if r.status_code==200:
                      valid_param=param
                      try: bookmaker_json=r.json()
                      except: bookmaker_json=None
                      break
              st['auth_attempts']=attempts; st['valid_auth_param']=valid_param; st['bookmakers_ok']=valid_param is not None
              if bookmaker_json is not None:
                  blob=json.dumps(bookmaker_json,ensure_ascii=False)
                  st['sabasports_present']='sabasports' in blob.lower() or bool(re.search(r'\bsaba\b',blob,re.I))
                  OUT.joinpath('bookmakers.json').write_text(json.dumps(bookmaker_json,ensure_ascii=False,indent=2))

              if valid_param:
                  # Probe documented Futures family; no secret appears in persisted output.
                  fut=[]
                  for path,extra in [
                      ('/en/futures',{'bookmakers':'sabasports'}),
                      ('/en/futures',{'bookmaker':'sabasports'}),
                      ('/en/futures/filtered',{'bookmakers':'sabasports'}),
                      ('/en/futures/odds',{'bookmakers':'sabasports'}),
                  ]:
                      params={valid_param:api_key,**extra}
                      r=requests.get('https://v5.oddspapi.io'+path,params=params,timeout=30)
                      rec={'path':path,'filter':list(extra.keys())[0],'http':r.status_code,'content_type':r.headers.get('content-type','')}
                      if r.status_code==200:
                          try:
                              data=r.json(); blob=json.dumps(data,ensure_ascii=False)
                              rec['json_type']=type(data).__name__; rec['bytes']=len(blob)
                              rec['mentions_saba']=bool(re.search(r'sabasports|\bsaba\b',blob,re.I))
                              rec['top4']=bool(re.search(r'top\s*4|top four|finish.*4',blob,re.I))
                              rec['relegation']=bool(re.search(r'relegat',blob,re.I))
                              rec['goalscorer']=bool(re.search(r'goal.?scorer|golden boot',blob,re.I))
                              rec['winner']=bool(re.search(r'winner|champion',blob,re.I))
                              OUT.joinpath('saba-futures.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
                              fut.append(rec); break
                          except Exception as e: rec['json_error']=type(e).__name__
                      else:
                          rec['body_hint']=r.text[:300].replace(api_key,'<KEY>')
                      fut.append(rec)
                  st['futures_attempts']=fut
          OUT.joinpath('status.json').write_text(json.dumps(st,ensure_ascii=False,indent=2)); print(json.dumps(st,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saba-futures-${{ github.run_id }}
          path: evidence/
          retention-days: 1
