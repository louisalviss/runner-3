name: M88 Screenshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-screenshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install browser and VPN tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install -q 'playwright>=1.46,<2'
          google-chrome --version
          mkdir -p evidence

      - name: Select Thailand VPN Gate relay
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,json,pathlib
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          rs=[r for r in rows if (r.get('CountryShort') or '').upper()=='TH' and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
          rs.sort(key=lambda r:int(r.get('Speed') or 0), reverse=True)
          rs=rs[:6]
          if not rs: raise SystemExit('No TH relay available')
          pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n')
          info=[]
          for i,r in enumerate(rs):
              cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n'
              pathlib.Path(f'/tmp/vpn{i}.ovpn').write_text(cfg)
              info.append({k:r.get(k) for k in ['CountryShort','CountryLong','IP','Ping','Speed','NumVpnSessions']})
          pathlib.Path('evidence/relay_candidates.json').write_text(json.dumps(info,indent=2,ensure_ascii=False))
          print(json.dumps(info,ensure_ascii=False))
          PY

      - name: Connect first working Thailand relay in isolated namespace
        shell: bash
        run: |
          set -euo pipefail
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.238.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.238.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.238.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.238.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null

          connected=0
          for cfg in /tmp/vpn*.ovpn; do
            idx=$(basename "$cfg" .ovpn | sed 's/vpn//')
            sudo ip netns exec vpnns pkill openvpn 2>/dev/null || true
            sleep 1
            sudo rm -f /tmp/openvpn.log
            sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
            sudo ip netns exec vpnns openvpn --config "$cfg" --daemon --log /tmp/openvpn.log || true
            ok=0
            for i in {1..15}; do
              sleep 1
              grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null && { ok=1; break; }
              grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|Exiting due to fatal error|Connection refused' /tmp/openvpn.log 2>/dev/null && break || true
            done
            if [ "$ok" = 1 ]; then
              trace=$(sudo ip netns exec vpnns curl -fsS --max-time 10 'https://www.cloudflare.com/cdn-cgi/trace' 2>/dev/null | grep -E '^(ip|loc|warp)=' || true)
              if echo "$trace" | grep -q '^loc=TH$'; then
                echo "$trace" | tee evidence/egress.txt
                echo "relay_index=$idx" | tee evidence/selected_relay.txt
                connected=1
                break
              fi
            fi
          done
          test "$connected" = 1

      - name: Render and screenshot M88 pages
        shell: bash
        run: |
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out=Path(os.environ['WORKSPACE'])/'evidence'
          targets=[
              ('m88_home','https://www.m88.com/'),
              ('m88_sports','https://www.m88.com/sports?mainMenuId=menu-item-sportsbook'),
              ('m88_sportsbook','https://www.m88.com/sportsbook'),
              ('msports_v3','https://msports.m88.com/app/v3/public/sports.html'),
              ('msports_v2','https://msports.m88.com/app/v2/'),
          ]
          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              context=browser.new_context(
                  viewport={'width':1440,'height':900},
                  locale='en-US',
                  user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
              )
              for name,url in targets:
                  page=context.new_page()
                  errors=[]
                  page.on('console', lambda m: errors.append('console:'+m.type+': '+m.text[:500]) if m.type in ('error','warning') else None)
                  page.on('pageerror', lambda e: errors.append('pageerror: '+str(e)[:500]))
                  r={'name':name,'requested_url':url}
                  try:
                      resp=page.goto(url,wait_until='domcontentloaded',timeout=45000)
                      r['status']=resp.status if resp else None
                      page.wait_for_timeout(20000)
                      r['final_url']=page.url
                      r['title']=page.title()
                      try: r['body_text']=page.locator('body').inner_text(timeout=5000)[:3000]
                      except Exception: r['body_text']=''
                      r['html_bytes']=len(page.content().encode())
                      r['frames']=[f.url for f in page.frames]
                      r['errors']=errors[-20:]
                      page.screenshot(path=str(out/f'{name}.png'),full_page=True,timeout=30000)
                  except Exception as e:
                      r['error']=f'{type(e).__name__}: {e}'
                      try: page.screenshot(path=str(out/f'{name}_error.png'),full_page=False,timeout=10000)
                      except Exception: pass
                  results.append(r)
                  print('RESULT',json.dumps(r,ensure_ascii=False))
                  page.close()
              context.close(); browser.close()
          (out/'screenshot_results.json').write_text(json.dumps(results,indent=2,ensure_ascii=False))
          PY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m88-screenshots-${{ github.run_id }}
          path: evidence/
          retention-days: 3
