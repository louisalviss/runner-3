name: SABA Official Docs Anonymous Login Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saba-docs-anon-login-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Clone official SABA OddsDirectAPI wiki
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Saba-sports/OddsDirectAPI.wiki.git /tmp/saba-wiki
          mkdir -p evidence
          find /tmp/saba-wiki -maxdepth 1 -type f -printf '%f\n' | sort > evidence/files.txt
          echo '=== login candidates ==='
          grep -RilE 'anonymous|login|refreshToken' /tmp/saba-wiki --include='*.md' | tee evidence/login-files.txt || true
          echo '=== outright candidates ==='
          grep -RilE 'GetOutrights|outright' /tmp/saba-wiki --include='*.md' | tee evidence/outright-files.txt || true

      - name: Extract only relevant official documentation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/saba-wiki')
          out=Path('evidence/relevant-docs.txt')
          names=['Login-API.md','Setup-and-Authentication.md','GetOutrights.md','API-usage.md','Home.md']
          chunks=[]
          for name in names:
              p=root/name
              if p.exists():
                  chunks.append(f'\n===== {name} =====\n'+p.read_text(errors='replace'))
          # Include any other markdown that explicitly contains anonymous login.
          for p in root.glob('*.md'):
              if p.name in names: continue
              txt=p.read_text(errors='replace')
              if 'anonymous' in txt.lower() and 'login' in txt.lower():
                  chunks.append(f'\n===== {p.name} =====\n'+txt)
          out.write_text(''.join(chunks))
          print(out.read_text()[:50000])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: saba-official-login-docs-${{ github.run_id }}
          path: evidence/
          retention-days: 7
