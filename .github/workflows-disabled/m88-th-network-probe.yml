name: M88 TH Network Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m88-th-network-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
          python3 -m pip install 'playwright>=1.46,<2'
          google-chrome --version

      - name: Select Thailand VPN Gate relay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,json,pathlib
          raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))))
          c=[r for r in rows if (r.get('CountryShort') or '').upper()=='TH' and (r.get('OpenVPN_ConfigData_Base64') or '').strip()]
          c.sort(key=lambda r:int(r.get('Speed') or 0), reverse=True)
          if not c: raise SystemExit('No TH relay available')
          r=c[0]
          cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode('utf-8',errors='replace')
          pathlib.Path('/tmp/vpngate.auth').write_text('vpn\nvpn\n')
          out=[]
          for ln in cfg.splitlines():
              out.append('auth-user-pass /tmp/vpngate.auth' if ln.strip().startswith('auth-user-pass') else ln)
          pathlib.Path('/tmp/vpngate.ovpn').write_text('\n'.join(out)+'\n')
          info={k:r.get(k) for k in ['CountryShort','CountryLong','IP','Ping','Speed','NumVpnSessions']}
          pathlib.Path('evidence/relay.json').write_text(json.dumps(info,indent=2,ensure_ascii=False))
          print(json.dumps(info,ensure_ascii=False))
          PY

      - name: Build isolated namespace and connect TH
        shell: bash
        run: |
          set -euo pipefail
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add veth-host type veth peer name veth-ns
          sudo ip link set veth-ns netns vpnns
          sudo ip addr add 10.233.0.1/24 dev veth-host
          sudo ip link set veth-host up
          sudo ip netns exec vpnns ip addr add 10.233.0.2/24 dev veth-ns
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set veth-ns up
          sudo ip netns exec vpnns ip route add default via 10.233.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.233.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i veth-host -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o veth-host -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          sudo rm -f /tmp/openvpn.log
          sudo touch /tmp/openvpn.log && sudo chmod 644 /tmp/openvpn.log
          sudo ip netns exec vpnns openvpn --config /tmp/vpngate.ovpn --daemon --log /tmp/openvpn.log
          ok=0
          for i in {1..30}; do
            sleep 1
            if grep -q 'Initialization Sequence Completed' /tmp/openvpn.log; then ok=1; break; fi
            if grep -Eq 'AUTH_FAILED|TLS Error|Connection timed out|Exiting due to fatal error' /tmp/openvpn.log; then break; fi
          done
          test "$ok" = 1
          sudo ip netns exec vpnns curl -fsS --max-time 15 'https://www.cloudflare.com/cdn-cgi/trace' \
            | grep -E '^(ip|loc|warp)=' | tee evidence/egress.txt

      - name: Fetch MSports shell and public bundles
        shell: bash
        run: |
          set -euo pipefail
          base='https://msports.m88.com/app/v2'
          sudo ip netns exec vpnns curl -fsSL --max-time 30 "$base/" -o evidence/index.html
          sudo ip netns exec vpnns curl -fsSL --max-time 30 "$base/static/js/main.2640c768.chunk.js" -o evidence/main.js
          sudo ip netns exec vpnns curl -fsSL --max-time 30 "$base/static/js/6.77b21ac0.chunk.js" -o evidence/vendor.js
          wc -c evidence/index.html evidence/main.js evidence/vendor.js | tee evidence/bundle_sizes.txt
          python3 - <<'PY'
          import json,re,pathlib,urllib.parse
          text=pathlib.Path('evidence/main.js').read_text(errors='replace')
          urls=sorted(set(re.findall(r'https?://[^"\'\\\s)]+',text)))
          ws=sorted(set(re.findall(r'wss?://[^"\'\\\s)]+',text)))
          hosts=sorted(set(urllib.parse.urlparse(u).netloc for u in urls+ws if urllib.parse.urlparse(u).netloc))
          terms=['accessRequest','site_code','api','socket','websocket','odds','sports','opus','signalr','graphql']
          snippets={}
          low=text.lower()
          for term in terms:
              hits=[]; start=0
              while len(hits)<8:
                  i=low.find(term.lower(),start)
                  if i<0: break
                  hits.append(text[max(0,i-180):i+260])
                  start=i+len(term)
              snippets[term]=hits
          out={'urls':urls[:300],'ws_urls':ws[:100],'hosts':hosts[:200],'snippets':snippets}
          pathlib.Path('evidence/bundle_scan.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print('HOSTS=' + ','.join(hosts[:80]))
          print('URL_COUNT=' + str(len(urls)))
          print('WS_COUNT=' + str(len(ws)))
          PY

      - name: Capture browser requests and WebSockets
        shell: bash
        run: |
          set -u
          sudo ip netns exec vpnns runuser -u runner -- env HOME=/home/runner WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json,os,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path(os.environ['WORKSPACE'])/'evidence'
          requests=[]; responses=[]; sockets=[]; console=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True)
              context=browser.new_context()
              page=context.new_page()
              page.on('request',lambda r: requests.append({'method':r.method,'type':r.resource_type,'url':r.url}))
              page.on('response',lambda r: responses.append({'status':r.status,'url':r.url}))
              page.on('websocket',lambda ws: sockets.append({'url':ws.url}))
              page.on('console',lambda m: console.append({'type':m.type,'text':m.text[:1000]}))
              result={}
              try:
                  resp=page.goto('https://msports.m88.com/app/v2/',wait_until='domcontentloaded',timeout=30000)
                  result['main_status']=resp.status if resp else None
                  page.wait_for_timeout(15000)
                  result['final_url']=page.url
                  result['title']=page.title()
                  result['body_text']=page.locator('body').inner_text(timeout=5000)[:5000]
                  result['html_bytes']=len(page.content().encode())
                  page.screenshot(path=str(out/'msports.png'),full_page=False)
              except Exception as e:
                  result['error']=f'{type(e).__name__}: {e}'
              context.close(); browser.close()
          def dedupe(items,key):
              seen=set(); out=[]
              for x in items:
                  k=x.get(key)
                  if k in seen: continue
                  seen.add(k); out.append(x)
              return out
          requests=dedupe(requests,'url'); responses=dedupe(responses,'url'); sockets=dedupe(sockets,'url')
          data={'page':result,'requests':requests,'responses':responses,'websockets':sockets,'console':console[-100:]}
          (out/'network.json').write_text(json.dumps(data,indent=2,ensure_ascii=False))
          print(json.dumps({'page':result,'request_count':len(requests),'response_count':len(responses),'websockets':sockets,'interesting_requests':[x for x in requests if x['type'] in ('xhr','fetch','websocket')][:80]},indent=2,ensure_ascii=False))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m88-th-network-${{ github.run_id }}
          path: evidence/
          retention-days: 3
