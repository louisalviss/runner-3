name: OpticOdds SABA Futures Trial

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/opticodds-saba-futures-trial.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser tooling
        run: python3 -m pip install --user -q playwright requests
      - name: Try one normal OpticOdds email signup and SABA futures read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,secrets,string,time,requests
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright

          st={}
          def rand(n=14): return ''.join(secrets.choice(string.ascii_lowercase+string.digits) for _ in range(n))

          # One ephemeral Mail.tm mailbox for this evaluation only.
          dj=requests.get('https://api.mail.tm/domains',timeout=20).json()
          ds=dj.get('hydra:member',dj.get('member',[]))
          dom=next(d['domain'] for d in ds if d.get('isActive',True))
          email=f'oo{rand()}@{dom}'; pw=secrets.token_urlsafe(24)+'A1!'
          requests.post('https://api.mail.tm/accounts',json={'address':email,'password':pw},timeout=20).raise_for_status()
          tr=requests.post('https://api.mail.tm/token',json={'address':email,'password':pw},timeout=20); tr.raise_for_status()
          mh={'Authorization':'Bearer '+tr.json()['token']}
          st['mail_domain']=dom

          def poll_link(seconds=90):
              end=time.time()+seconds; seen=set()
              while time.time()<end:
                  r=requests.get('https://api.mail.tm/messages',headers=mh,timeout=20)
                  if r.status_code==200:
                      j=r.json(); msgs=j.get('hydra:member',j.get('member',[]))
                      for m in msgs:
                          mid=m.get('id')
                          if not mid or mid in seen: continue
                          seen.add(mid)
                          full=requests.get(f'https://api.mail.tm/messages/{mid}',headers=mh,timeout=20).json()
                          blob='\n'.join(str(full.get(k,'')) for k in ['subject','text','html'])
                          if 'optic' not in blob.lower(): continue
                          for u in re.findall(r'https?://[^\s\"\'<>]+',blob):
                              u=u.replace('&amp;','&')
                              if 'opticodds' in u.lower() and re.search(r'login|verify|confirm|auth|token|magic|callback',u,re.I):
                                  return u
                  time.sleep(2)
              return None

          api_key=None
          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome',headless=True)
              c=b.new_context(locale='en-US',viewport={'width':1440,'height':1000})
              pg=c.new_page(); pg.goto('https://app.opticodds.com/',wait_until='domcontentloaded',timeout=45000); pg.wait_for_timeout(1500)
              t=pg.locator('body').inner_text(timeout=8000)
              st['landing_url']=pg.url
              st['challenge']=bool(re.search(r'captcha|verify you are human|turnstile|recaptcha|hcaptcha|access denied',t,re.I))
              if not st['challenge']:
                  ei=pg.locator('input[type="email"]')
                  if ei.count():
                      ei.first.fill(email)
                      btn=pg.get_by_role('button',name=re.compile(r'Continue with email|Continue|Sign up|Log in',re.I)).first
                      if btn.count():
                          btn.click(timeout=8000); pg.wait_for_timeout(3000); st['email_submitted']=True
                  t2=pg.locator('body').inner_text(timeout=8000)
                  st['post_submit_hint']=re.sub(r'[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}','<EMAIL>',t2[:3000])
                  st['post_submit_url']=pg.url

                  # If email verification/magic link is requested, follow the ordinary link once.
                  link=poll_link(90)
                  st['email_link_seen']=bool(link)
                  if link:
                      pg.goto(link,wait_until='domcontentloaded',timeout=45000); pg.wait_for_timeout(5000)
                  st['dashboard_url']=pg.url
                  try: dash=pg.locator('body').inner_text(timeout=8000)
                  except: dash=''
                  st['dashboard_hint']=re.sub(r'[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}','<EMAIL>',dash[:5000])
                  st['dashboard_has_key_label']=bool(re.search(r'api\s*key|license\s*key|license key',dash,re.I))

                  # Read a key only from explicitly labelled nearby DOM; never print/store its value.
                  nodes=pg.locator('input,textarea,code,pre')
                  for i in range(nodes.count()):
                      e=nodes.nth(i)
                      try:
                          val=(e.input_value() if e.evaluate('x=>["INPUT","TEXTAREA"].includes(x.tagName)') else e.inner_text()).strip()
                          near=e.evaluate("x=>(x.parentElement?.innerText||'')+' '+(x.previousElementSibling?.innerText||'')")
                          if re.search(r'api\s*key|license\s*key',near,re.I) and re.fullmatch(r'[A-Za-z0-9._\-]{12,200}',val):
                              api_key=val; break
                      except: pass

                  # Also inspect Copy buttons via clipboard only if explicitly beside API/License key.
                  if not api_key:
                      c.grant_permissions(['clipboard-read','clipboard-write'], origin='https://app.opticodds.com')
                      buttons=pg.locator('button')
                      for i in range(buttons.count()):
                          e=buttons.nth(i)
                          try:
                              near=e.evaluate("x=>(x.parentElement?.innerText||'')")
                              title=e.get_attribute('title') or ''
                              if re.search(r'api\s*key|license\s*key',near,re.I) and re.search(r'copy',near+' '+title,re.I):
                                  e.click(timeout=3000); pg.wait_for_timeout(300)
                                  v=pg.evaluate('navigator.clipboard.readText()')
                                  if isinstance(v,str) and re.fullmatch(r'[A-Za-z0-9._\-]{12,200}',v.strip()): api_key=v.strip(); break
                          except: pass
              b.close()

          st['api_key_captured']=bool(api_key)
          if api_key:
              h={'X-Api-Key':api_key,'Accept':'application/json'}
              base='https://api.opticodds.com/api/v3'
              # Validate and discover exact SABA sportsbook id.
              r=requests.get(base+'/sportsbooks',headers=h,timeout=30); st['sportsbooks_http']=r.status_code
              saba_ids=[]
              if r.status_code==200:
                  j=r.json(); arr=j.get('data',j if isinstance(j,list) else [])
                  if isinstance(arr,list):
                      for x in arr:
                          if isinstance(x,dict) and 'saba' in json.dumps(x).lower():
                              sid=x.get('id') or x.get('name');
                              if sid: saba_ids.append(str(sid))
              st['saba_ids']=saba_ids[:10]

              # Discover EPL league id via leagues catalog.
              r=requests.get(base+'/leagues',headers=h,params={'sport':'soccer'},timeout=30); st['leagues_http']=r.status_code
              epl=[]
              if r.status_code==200:
                  j=r.json(); arr=j.get('data',j if isinstance(j,list) else [])
                  if isinstance(arr,list):
                      for x in arr:
                          s=json.dumps(x).lower()
                          if 'premier league' in s and ('england' in s or 'epl' in s): epl.append(x)
              st['epl_matches_count']=len(epl)
              league_id=None
              if epl and isinstance(epl[0],dict): league_id=epl[0].get('id') or epl[0].get('name')
              st['epl_league_id']=league_id

              # Futures catalog and SABA-specific futures odds, read only.
              if league_id:
                  r=requests.get(base+'/futures',headers=h,params={'sport':'soccer','league':league_id},timeout=30)
                  st['futures_http']=r.status_code
                  if r.status_code==200:
                      fj=r.json(); blob=json.dumps(fj,ensure_ascii=False)
                      st['futures_bytes']=len(blob)
                      st['futures_top4']=bool(re.search(r'top\s*4|top four|finish.*4',blob,re.I))
                      st['futures_relegation']=bool(re.search(r'relegat',blob,re.I))
                      st['futures_goalscorer']=bool(re.search(r'goal.?scorer|golden boot|top scorer',blob,re.I))
                      st['futures_winner']=bool(re.search(r'winner|champion',blob,re.I))

                  if saba_ids:
                      # Probe each known target market label from the futures catalog by broad league+sportsbook first.
                      params=[('sportsbook',saba_ids[0]),('league',str(league_id)),('odds_format','DECIMAL')]
                      r=requests.get(base+'/futures/odds',headers=h,params=params,timeout=30)
                      st['saba_futures_odds_http']=r.status_code
                      if r.status_code==200:
                          oj=r.json(); blob=json.dumps(oj,ensure_ascii=False)
                          st['saba_futures_odds_bytes']=len(blob)
                          st['saba_top4']=bool(re.search(r'top\s*4|top four|finish.*4',blob,re.I))
                          st['saba_relegation']=bool(re.search(r'relegat',blob,re.I))
                          st['saba_goalscorer']=bool(re.search(r'goal.?scorer|golden boot|top scorer',blob,re.I))
                          st['saba_winner']=bool(re.search(r'winner|champion',blob,re.I))
                          # Save only a sanitized structural sample with no key/email.
                          open('/tmp/opticodds-saba-futures.json','w').write(json.dumps(oj,ensure_ascii=False,indent=2))

          print(json.dumps(st,ensure_ascii=False,indent=2))
          PY
